  if(correct){ RETO_B.fallosDx=0; DX.est='repara'; feedback('good','Diagnóstico correcto ✓',explainArmFault(FALLA.tipo)+' <b>Ahora corrígelo.</b>',true); pintaHUD(); }
  else {
    RETO_B.fallosDx++;
    if(RETO_B.fallosDx>=3){
      // tres fallos: el brazo presenta OTRA falla y la secuencia reinicia
      RETO_B.fallosDx=0; RETO_B.resiembras++;
      const p=FALLA.tipo; FALLA.tipo=pickOne(['encoder','gripper','overload'].filter(x=>x!==p)); FALLA.d=0;
      reponeCubo(true); MOV.t=0; ERRBUF.length=0; CUB.perdida=null; limpiaTraza();
      feedback('bad','Tres intentos fallidos','El brazo presenta ahora OTRA falla: deja correr la secuencia y observa de nuevo.',true);
      pintaHUD(); const s=el('symptomTask'); if(s) s.innerHTML=symptomArm(FALLA.tipo);
    } else {
      feedback('bad','No es esa la falla','Eso ('+fnameArm(choice)+') daría otro síntoma: '+wrongExArm(choice)+' Observa otra vez. (intentos fallidos: '+RETO_B.fallosDx+'/3)',true);
      const t=el('d_trydx'); if(t) t.textContent=RETO_B.fallosDx;
    }
  }
}
function explainArmFault(f){
  if(f==='encoder')return 'El encoder le dice al controlador "en qué ángulo estoy", pero si está descalibrado, el ángulo reportado no coincide con el real. El brazo ejecuta el movimiento correcto según SU lectura equivocada, y termina en el lugar incorrecto. Aquí el del eje 1 está corrido 9°: el error de seguimiento marca cero —el control se compara con la lectura falsa— y la pinza baja unos 36 mm al lado de la pieza.';
  if(f==='gripper')return 'La pinza no alcanza el cierre completo (falla mecánica o del actuador), así que no genera suficiente fuerza de sujeción: la pieza se resbala con el movimiento. Con 0,85 N por dedo y μ = 0,45, el rozamiento sostiene 2·μ·F = 1,07 veces el peso: la subida en recta pide 1,03 y aguanta; el traslado articular pide 1,12 y la suelta.';
  if(f==='overload')return 'El par que el motor del hombro puede entregar es menor al que esta carga exige (τ=m·g·r). El motor "pierde el paso" y el brazo cede bajo el peso. Aquí da el 80 % del par que pide la pieza arriba: el hombro baja hasta que el par vuelve a caber y el error de seguimiento pasa de la tolerancia.';
}
function fnameArm(f){return f==='encoder'?'encoder descalibrado':f==='gripper'?'pinza que no cierra':'sobrecarga';}
function wrongExArm(f){
  if(f==='encoder')return 'un encoder descalibrado haría que el brazo apunte a un punto incorrecto, no que suelte la pieza a medio camino ni que tiemble bajo carga.';
  if(f==='gripper')return 'una pinza que no cierra bien sí sujeta la pieza al inicio pero la termina soltando, no causa que el brazo apunte mal ni que tiemble.';
  if(f==='overload')return 'la sobrecarga hace temblar y ceder el hombro bajo peso, no causa un error de puntería ni que la pinza suelte la pieza sin razón.';
}
function repairArm(){
  if(DX.est!=='repara') return;
  FALLA.tipo=null; FALLA.d=0; MOV.t=0; RETO_B.hecho=true; DX.est='hecho'; reponeCubo(true); ledsTodos('verde',false); CUB.perdida=null;
  feedback('good','¡Reparado! 🎉','El brazo vuelve a operar con precisión. Completaste las tres fases: lo armaste, calculaste su cinemática y par, y diagnosticaste una falla real. Ese es el ciclo completo de un técnico en mecatrónica.',true);
  pintaHUD();
}

/* ---- el enrutador de acciones (mismos nombres de siempre) ---- */
function handleAction(act,btn){
  switch(act){
    case 'place-base': monta('base'); break;
    case 'place-shoulder': monta('shoulder'); break;
    case 'place-elbow': monta('elbow'); break;
    case 'place-wrist': monta('wrist'); break;
    case 'place-cables': monta('cables'); break;
    case 'try-wrist-first': if(ENS.est==='banco'&&!ENS.montado.base) rechaza('wrist'); break;
    case 'check-fk': checkFK(); break;
    case 'hint-fk':
      if(RETO_B.pistasFK===0){ RETO_B.pistasFK=1; feedback('good','Pista 1 de 2','La altura es la suma de lo que sube cada eslabón; el segundo eslabón forma con la horizontal el ángulo acumulado de las dos articulaciones.'); }
      else if(RETO_B.pistasFK===1){ RETO_B.pistasFK=2; feedback('good','Pista 2 de 2','y = L1·sin(θ2) + L2·sin(θ2+θ3). Calcula en cm y convierte a mm (×10).'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto.');
      break;
    case 'check-torque': checkTorque(); break;
    case 'hint-torque':
      if(RETO_B.pistasT===0){ RETO_B.pistasT=1; feedback('good','Pista 1 de 2','El par es el peso de la carga (una fuerza) por la distancia a la que actúa: cuida las unidades (kg y m).'); }
      else if(RETO_B.pistasT===1){ RETO_B.pistasT=2; feedback('good','Pista 2 de 2','τ = m·g·r. Multiplica los tres valores del enunciado.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto.');
      break;
    case 'check-over': checkOver(); break;
    case 'hint-over':
      if(RETO_B.pistasO===0){ RETO_B.pistasO=1; feedback('good','Pista 1 de 2','Es la misma relación que en el reto anterior, pero ahora se conoce el par y se busca la masa.'); }
      else if(RETO_B.pistasO===1){ RETO_B.pistasO=2; feedback('good','Pista 2 de 2','m = τ / (g·r). Convierte el resultado de kg a g.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto.');
      break;
    case 'play-sequence':
      RETO.jugando=true; EST.pausa=false; reponeCubo(true); limpiaTraza();
      if(EST.modo==='retos'&&RETO.etapa==='mov'){ alPrograma(); if(MOV.prog===PROG_PP) MOV.t=0; }
      if(btn) btn.textContent='⟲ Reiniciar secuencia'; pintaBarras(); clases();
      break;
    case 'to-phase3': EST.dxAbierto=true; setMode('diagnostico',true); break;
    case 'dx-encoder': diagnoseArm('encoder'); break;
    case 'dx-gripper': diagnoseArm('gripper'); break;
    case 'dx-overload': diagnoseArm('overload'); break;
    case 'repair-arm': repairArm(); break;
    case 'restart': location.reload(); break;
  }
}

/* ===================== 20. MODOS ===================== */
function setMode(m,forzar){
  if(!forzar){
    if(m===EST.modo) return;
    if(m!=='armado'&&(!EST.desbloqueado||enObra())){ showToast('Primero <b>arma el robot</b>: los demás modos se abren al terminar el ensamble.'); return; }
    if(m==='diagnostico'&&!EST.dxAbierto){ showToast('El diagnóstico se abre al terminar los cuatro retos.'); return; }
    if(EST.modo==='retos'&&RETO.etapa==='fk'&&m!=='retos'){ showToast('Resuelve antes el <b>reto 1</b>: fuera de aquí el robot te daría la altura.'); return; }
    if(CMP.corriendo) return;
  }
  EST.modo=m; EST.pinzaManual=null; capasCompara(false); CMP.corriendo=null; VISTA.extra=null;
  if(ENS.montado.cables&&ENS.est!=='referencia') ledsTodos('verde',false);
  if(m==='armado'){ if(EST.desbloqueado&&ENS.est!=='demo'&&ENS.est!=='banco'){ ENS.est='demo'; } if(ENS.est==='demo'&&EST.desbloqueado) alPrograma(); }
  else if(m==='cinematica') alJog();
  else if(m==='trayectoria'){ if(EST.tray==='pp') alPrograma(); else entraCompara(); }
  else if(m==='retos') poseReto();
  else if(m==='diagnostico'){ if(!FALLA.tipo&&!RETO_B.hecho) startPhase3(); else alPrograma(); }
  pintaHUD(); pintaDockFijo(); pintaBarras();
  ponVista(vistaDeModo(m));
}

/* ===================== 21. SONIDO (sintetizado) =====================
   El zumbido de los servos sube con la velocidad del eje más rápido respecto
   de su máximo; la pinza suena a aire, las piezas al encajar, a clic. */
const sonido=(function(){
  let ctx=null, on=true, osc=null, filt=null, gan=null, master=null, ruidoBuf=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      osc=ctx.createOscillator(); osc.type='sawtooth'; filt=ctx.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=900; filt.Q.value=3.5;
      gan=ctx.createGain(); gan.gain.value=0; osc.connect(filt); filt.connect(gan); gan.connect(master); osc.start();
      ruidoBuf=ctx.createBuffer(1,ctx.sampleRate*0.6,ctx.sampleRate); const d=ruidoBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }catch(e){ ctx=null; } }
  function servo(w){ if(!ctx) return; const t=ctx.currentTime, v=on?Math.min(0.045,w*0.055):0;
    gan.gain.setTargetAtTime(v,t,0.06); osc.frequency.setTargetAtTime(170+260*w,t,0.05); filt.frequency.setTargetAtTime(650+1100*w,t,0.05); }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'square'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); }
  function ruido(dur,f,vol,q){ if(!ctx||!on) return; const s=ctx.createBufferSource(), b=ctx.createBiquadFilter(), g=ctx.createGain(), t=ctx.currentTime; s.buffer=ruidoBuf;
    b.type='bandpass'; b.frequency.value=f; b.Q.value=q||0.8; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); s.connect(b); b.connect(g); g.connect(master); s.start(t); s.stop(t+dur); }
  return {init,servo,
    clic:(v=1)=>{ tono(1400,0.05,0.05*v); },
    silbido:()=>ruido(0.45,2600,0.035,0.6),
    asiento:()=>{ tono(220,0.12,0.06,'triangle'); ruido(0.08,900,0.05,1.2); },
    golpe:(v=1)=>{ ruido(0.09,500,0.06*v,1.4); tono(120,0.08,0.04*v,'triangle'); },
    error:()=>{ tono(180,0.16,0.05,'sawtooth'); },
    arranque:()=>{ tono(660,0.09,0.04,'sine'); setTimeout(()=>tono(990,0.12,0.04,'sine'),110); },
    toggle(){ on=!on; if(!on&&gan&&ctx) gan.gain.setTargetAtTime(0,ctx.currentTime,0.03); return on; },
    get on(){ return on; }, get ctx(){ return ctx; }, gain:()=>gan?gan.gain.value:0, freq:()=>osc?osc.frequency.value:0};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});

/* ===================== 22. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.min(devicePixelRatio,alta?2:1.25));
  const ms=alta?2048:1024; if(LUZ.clave.shadow.mapSize.x!==ms){ LUZ.clave.shadow.mapSize.set(ms,ms); if(LUZ.clave.shadow.map){ LUZ.clave.shadow.map.dispose(); LUZ.clave.shadow.map=null; } }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  for(const l of LINEAS) l.res(); colocaBarras();
  clearTimeout(window.__rzBrazo); window.__rzBrazo=setTimeout(()=>ponVista(VISTA.actual,0.01),140);
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 23. EL LAZO: UN SOLO RELOJ ===================== */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;   // se suman todas las pasadas del cuadro: sombra, escena y posproceso
let tDock=0, tLienzo=0;
EST.velTCP=new THREE.Vector3();
const _p1=new THREE.Vector3();
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  // 1. ensamble: vuelos, ondas, espera de la pieza
  pasaVuelos(dt); pasaOndas(dt);
  if(ENS.espera&&ENS.espera()){ const f=ENS.luego; ENS.espera=null; ENS.luego=null; if(f) f(); }
  // 2. consigna → pose física
  const d=avanzaMovimiento(dt); EST.tsim+=d;
  EST.q=poseFisica(EST.qCmd,d,EST.tsim);
  for(let j=0;j<4;j++) EST.dq[j]=d>0?(EST.qCmd[j]-EST.qPrev[j])/d:0;
  aplicaPose(EST.q); ROBOT3D.updateMatrixWorld(true);
  TCP3.getWorldPosition(_p1);
  if(EST.prevTCP&&d>0){ EST.velTCP.subVectors(_p1,EST.prevTCP).divideScalar(d); EST.vTCP+=(EST.velTCP.length()/MM-EST.vTCP)*0.35; }
  else if(d===0) EST.velTCP.set(0,0,0);
  EST.prevTCP=(EST.prevTCP||new THREE.Vector3()).copy(_p1);
  // 3. pinza y pieza
  const dP=(MOV.fuente==='prog'&&!MOV.libre)?d:dt;
  const obj=pasaPinza(dP); pasaCubo(dt,d,obj);
  // 4. mazo de cables y bandeja
  ENS.cable+=clamp(ENS.cableObj-ENS.cable,-dt/0.9,dt/1.4);
  const montados=ENS.montado.base&&ENS.montado.shoulder&&ENS.montado.elbow&&ENS.montado.wrist&&!ENS.vuelos.length;
  CABLE.mesh.visible=ENS.cable>0.004&&montados; ABRAZ.forEach(g=>g.visible=CABLE.mesh.visible);
  if(CABLE.mesh.visible) CABLE.actualiza(curvaCable(),ENS.cable,0.042);
  const rs=1-ENS.cable; ROLLO.visible=rs>0.01&&!ENS.montado.cables; ROLLO.scale.setScalar(Math.max(0.001,ease(clamp(rs,0,1))));
  pasaBanco(dt,t);
  // 5. traza, capas, LED
  pasaTraza(d); pasaCapas(t,dt); pintaLEDs(t);
  if(EST.modo==='diagnostico'&&d>0){ ERRBUF.push({t:EST.tsim,e:FALLA.err.map(v=>v/GR)}); while(ERRBUF.length&&EST.tsim-ERRBUF[0].t>8) ERRBUF.shift();
    if(FALLA.tipo==='overload') ponLED(1,Math.abs(FALLA.err[1])>5*GR?'rojo':'verde',false); }
  // 6. cámara y sonido
  pasaCam(dt);
  let w=0; for(let j=0;j<4;j++) w=Math.max(w,Math.abs(EST.dq[j])/(ROBOT.vmax[j]*GR)); sonido.servo(Math.min(1,w));
  // 7. dock (a 15 Hz) y lienzos (a 30 Hz)
  if(t-tDock>0.066){ tDock=t; pintaDock(); if(EST.modo==='cinematica') sincronizaSliders(); if(ENS.est==='referencia') refrescaReferencia(); }
  if(t-tLienzo>0.033){ tLienzo=t;
    if(EST.modo==='cinematica') pintaLado(); else if(EST.modo==='trayectoria'){ pintaQt(); pintaVel(); } else if(EST.modo==='diagnostico') pintaErr(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos();
}
function refrescaReferencia(){ for(let j=0;j<4;j++){ const e=el('ref'+j); if(!e) continue; const ok=LED.est[j]==='verde'; if(e.classList.contains('ok')!==ok){ e.classList.toggle('ok',ok); e.firstChild.textContent=ok?'✓':'◌'; } } }
/* La bandeja: la pieza que toca respira; la elegida flota; la rechazada da un brinco. */
function pasaBanco(dt,t){
  const enBanco=ENS.est==='banco', sig=enBanco?sigPieza():null;
  for(const k in PIEZAS){ const P=PIEZAS[k], o=P.obj; if(ENS.montado[k]||ENS.vuelos.some(v=>v.k===k)) continue;
    const sel=ENS.sel===k, hov=ENS.hover===k;
    P.lev=clamp((P.lev||0)+(sel?1:-1)*dt*3,0,1); P.hov=clamp((P.hov||0)+(hov&&!sel?1:-1)*dt*6,0,1);
    const resp=(sig===k&&!sel&&!REDUCIDO)?0.05*(0.5-0.5*Math.cos(t*2.6)):0;
    let g=ENS.golpe[k]||0; if(g>0){ g=Math.max(0,g-dt*2.4); ENS.golpe[k]=g; }
    o.position.copy(P.bande.p); o.position.y+=ease(P.lev)*0.55+ease(P.hov)*0.05+resp+Math.sin(g*Math.PI)*0.18+(sel?0.02*Math.sin(t*2.2):0);
    o.position.x+=Math.sin(g*Math.PI*6)*0.03*g;
  }
  // el fantasma de la que toca
  for(const k in FANT) FANT[k].visible=enBanco&&!ENS.ocupado&&sig===k;
  MAT_FANT.uniforms.uA.value=(ENS.sel?0.85:0.55)*(0.75+0.25*Math.sin(t*3.0));
  CABLE_F.mesh.visible=enBanco&&!ENS.ocupado&&sig==='cables';
  if(CABLE_F.mesh.visible) CABLE_F.actualiza(curvaCable(),1,0.042);
}

/* ===================== 24. ARRANQUE ===================== */
const T0_DEMO=REDUCIDO?3.62:2.55;
reproduce(PROG_PP,{loop:true,t0:T0_DEMO});
EST.qCmd=evalua(PROG_PP,T0_DEMO).q.slice(); EST.q=EST.qCmd.slice(); EST.qPrev=EST.qCmd.slice();
aplicaPose(EST.q); ROBOT3D.updateMatrixWorld(true);
EST.gap=30; ponPinza(30); cuboEnPinza();
trazaPrevia(T0_DEMO);
aplicaCalidad();
pintaHUD(); pintaDockFijo(); pintaBarras();
ponVista('tres4',0.001);
cuadro();

/* ===================== 25. GANCHOS DE PRUEBA ===================== */
const faseNum=()=>EST.modo==='armado'?0:EST.modo==='diagnostico'?2:1;
window.__labDebug={
  get mode(){ return EST.modo; },
  get solved(){ return RETO_B.hecho; },
  get intentos(){ return RETO_B.intentos; },
  state(){ return {fase:faseNum(),angulos:[FK_T1,FK_T2],payloadT:PAYLOAD_T,payMaxO:PAYMAX_O,fault:FALLA.tipo,intentos:RETO_B.intentos,
    resiembras:RETO_B.resiembras,fallos:{fk:RETO_B.fallosFK,t:RETO_B.fallosT,o:RETO_B.fallosO,dx:RETO_B.fallosDx},resuelto:RETO_B.hecho}; },
  /* el robot tal como está: consigna, pose física y TCP de la escena contra el del modelo */
  robot(){ ROBOT3D.updateMatrixWorld(true); const p=poseTCP(EST.q), w=TCP3.getWorldPosition(new THREE.Vector3());
    return {qCmd:EST.qCmd.map(v=>v/GR),q:EST.q.map(v=>v/GR),tcp:{x:p.x,y:p.y,z:p.z,psi:p.psi/GR},tcpEscena:{x:w.x/MM,y:-w.z/MM,z:w.y/MM},
      pinza:EST.gap,pieza:CUB.est,ensamble:ENS.est,montado:{...ENS.montado},mov:{fuente:MOV.fuente,t:MOV.t,linea:MOV.linea,op:MOV.op},reto:RETO.etapa,falla:FALLA.tipo}; },
  banco(){ return {huellas:Object.fromEntries(Object.entries(PIEZAS).map(([k,P])=>[k,P.huella.map(Math.round).concat(P.c.map(Math.round))])),ct:BANCO.ct,huecos:BANCO.huecos,x0:BANCO.x0,x1:BANCO.x1,z0:BANCO.z0,z1:BANCO.z1}; },
  cam(){ const r=v=>[+v.x.toFixed(3),+v.y.toFixed(3),+v.z.toFixed(3)]; return {pos:r(camera.position),target:r(controls.target),caja:[r(CAJA_CICLO.min),r(CAJA_CICLO.max)],hueco:huecoLibre(),fps:FPS.v}; },
  escena(){ return {vista:VISTA.actual,calidad:CAL.nivel,pausa:EST.pausa,esc:EST.esc,traza:TRAZA.pts.length,envolvente:ENV.on,marcos:MARCOS.on,rotulos:ROT.on,
    tri:renderer.info.render.triangles,llamadas:renderer.info.render.calls}; },
};
window.__test={
  start:()=>{ sonido.init(); if(EST.modo!=='armado') setMode('armado',true); desarmar(); },
  action:(a)=>handleAction(a,null),
  setAns:(id,v)=>{const e=el(id);if(e)e.value=v;},
  setAutoMode:(v)=>{ ENS.auto=!!v; if(v) montajeAuto(); },
  state:()=>({phase:faseNum(),fault:FALLA.tipo,seqT:Math.round(MOV.t*10)/10,holding:CUB.est==='pinza',
    baseInstalled:ENS.montado.base,shoulderInstalled:ENS.montado.shoulder,elbowInstalled:ENS.montado.elbow,wristInstalled:ENS.montado.wrist,
    cablesInstalled:ENS.montado.cables,ensamble:ENS.est,modo:EST.modo,reto:RETO.etapa}),
  audioState:()=>({ctxState:sonido.ctx?sonido.ctx.state:'none',vol:sonido.gain(),freq:sonido.freq(),soundOn:sonido.on}),
  setMode:(m)=>setMode(m,true),
  vista:(v)=>ponVista(v,0.001),
  capa:(k,on)=>{ if(k==='env') ENV.on=on; else if(k==='dh') MARCOS.on=on; else if(k==='traza') TRAZA.on=on; else if(k==='rot'){ ROT.on=on; pintaRotulos(); } pintaBarras(); },
  pausa:(on)=>{ EST.pausa=!!on; pintaBarras(); },
  /* sólo para las pruebas: fija la falla del diagnóstico (el alumno la recibe al azar) */
  falla:(t)=>{ FALLA.tipo=t; FALLA.d=0; DX.est='observa'; reponeCubo(true); MOV.t=0; ERRBUF.length=0; CUB.perdida=null; limpiaTraza(); pintaHUD(); },
  diag:()=>({pieza:CUB.est,perdida:CUB.perdida,err:FALLA.err.map(v=>+(v/GR).toFixed(2)),sag:+(FALLA.d/GR).toFixed(2),gap:+EST.gap.toFixed(1),demanda:+EST.demanda.toFixed(3),cap:+capacidadAgarre().toFixed(3),t:+MOV.t.toFixed(2),linea:MOV.linea}),
};
instalaDiag('brazo-robotico',{escena:scene,camara:camera,controles:controls,renderizador:renderer,
  grupos:{pedestal:PED.g,base:W.base,hombro:W.shoulder,codo:W.elbow,muneca:W.wrist,pieza:CUBO}});
