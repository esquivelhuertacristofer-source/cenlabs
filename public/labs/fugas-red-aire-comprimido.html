<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.26, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;
    }
    if(hook)hook(dt,t); controls.update();
    if(bokeh) bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);
    composer.render(); }
  function start(){ if(!raf)loop(); }
  function stop(){ cancelAnimationFrame(raf); raf=null; window.removeEventListener('resize',resize); }

  /* Sonda de escena para las auditorías del 3D. No cambia nada de lo que se ve
     y cuelga de `window.__diag3d`, que ningún laboratorio pisa: así CUALQUIER
     laboratorio construido con este molde se puede auditar —salud(), mira(),
     piezas()— sin tocarle una línea. */
  try { instalaDiag(document.title || location.pathname,
    { escena:scene, camara:camera, controles:controls, renderizador:renderer }); } catch(_){}

  return { THREE, renderer, scene, camera, controls, composer, bloom,
    setAnimate:fn=>hook=fn, start, stop, resize, clock,
    flyTo:(v)=>{ controls.target.copy(v); }, moveTo, setCinematicIdle };
}

function roundedBox(w,h,d,mat,rf=0.08){

function pickerFor(scene,camera,dom,onHit){
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(); let down=null;
  dom.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
  dom.addEventListener('pointerup',e=>{
    if(!down)return; const moved=Math.abs(e.clientX-down[0])+Math.abs(e.clientY-down[1])>6; down=null;
    if(moved)return;
    const r=dom.getBoundingClientRect();
    mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(mouse,camera);
    const hits=ray.intersectObjects(scene.children,true);
    onHit(hits[0]||null);
  });
}

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

// Motor sellado de la auditoria de fugas. Toda cifra del laboratorio sale de
// aqui: no hay ni una constante escrita a mano en la prosa, ni una tabla de
// respuestas. Verificado aparte por 141 602 aserciones numericas.

// ---------- constantes fisicas y economicas ----------
const P_ATM=1.013;        // bar, atmosfera de referencia
const R_AIRE=287;         // J/(kg K)
const K_AIRE=1.4;         // cp/cv
const T_K=293.15;         // K (20 C) en linea y en aspiracion
const MU=1.82e-5;         // Pa s, viscosidad dinamica del aire a 20 C
const RHO_N=P_ATM*1e5/(R_AIRE*T_K);   // kg/m3 en condiciones de referencia
const CD=0.65;            // coeficiente de descarga de un orificio de borde vivo
const EPS_TUBO=0.045;     // mm, rugosidad del acero estirado
const ETA_COMP=0.55;      // rendimiento global: isotermico -> eje -> red electrica
const EUR_KWH=0.18;       // EUR/kWh
const EUR_HORA=42;        // EUR/h de mano de obra de mantenimiento
const ANIOS=5;            // horizonte del coste de propiedad
const DP_SEC_NOM=0.20;    // bar, perdida del secador a caudal nominal
const P_SEC_REF=7.0;      // barg, presion a la que se declara el secador
const CONSIGNAS=[6.0,6.5,7.0,7.5,8.0];   // barg
const DB_REF=10;          // Nl/min, caudal de referencia del detector
const DB_0=40;            // dB que marca el detector a DB_REF

// relacion critica de presiones y coeficiente del flujo bloqueado
const R_CRIT=Math.pow(2/(K_AIRE+1),K_AIRE/(K_AIRE-1));
const COEF_SON=Math.sqrt(K_AIRE/(R_AIRE*T_K))*Math.pow(2/(K_AIRE+1),(K_AIRE+1)/(2*(K_AIRE-1)));
const COEF_SUB=Math.sqrt(2*K_AIRE/((K_AIRE-1)*R_AIRE*T_K));

// ---------- orificio compresible ----------
// A en mm2, presiones en bar absolutos. Devuelve kg/s.
function gastoOrificio(aMm2,pUp,pDown){
  const A=aMm2*1e-6, p1=pUp*1e5;
  if(A<=0||pUp<=0) return 0;
  const r=pDown/pUp;
  if(r<=R_CRIT) return CD*A*p1*COEF_SON;
  if(r>=1) return 0;
  const t=Math.pow(r,2/K_AIRE)-Math.pow(r,(K_AIRE+1)/K_AIRE);
  return CD*A*p1*COEF_SUB*Math.sqrt(Math.max(0,t));
}
const bloqueado=(pUp,pDown)=>pDown/pUp<=R_CRIT;
// kg/s -> Nl/min
const aNlMin=mdot=>mdot/RHO_N*60000;
const aKgS=nlmin=>nlmin*RHO_N/60000;

// presion aguas abajo de un orificio que ha de pasar un gasto dado (biseccion)
// devuelve null si el orificio no da para tanto (ni siquiera bloqueado)
function pTrasOrificio(aMm2,pUp,mdot){
  if(mdot<=0) return pUp;
  if(mdot>gastoOrificio(aMm2,pUp,0)) return null;
  let lo=R_CRIT*pUp, hi=pUp;                 // el gasto decrece con pDown
  for(let i=0;i<60;i++){
    const m=0.5*(lo+hi);
    if(m===lo||m===hi) break;                // el intervalo ya no se puede partir
    if(gastoOrificio(aMm2,pUp,m)>mdot) lo=m; else hi=m;
  }
  return 0.5*(lo+hi);
}

// nivel que marcaria el detector de ultrasonidos (curva declarada del aparato)
const dB=qNlMin=>qNlMin<=0?0:DB_0+20*Math.log10(qNlMin/DB_REF);

// ---------- friccion en la tuberia ----------
function colebrook(re,epsD){
  let f=0.02;
  for(let i=0;i<120;i++){
    const inv=-2*Math.log10(epsD/3.7+2.51/(re*Math.sqrt(f)));
    const fn=1/(inv*inv);
    if(fn===f) return f;                     // punto fijo exacto
    f=fn;
  }
  return f;
}
// caida por Darcy en un tramo: qN en Nl/min, l y d en m, pAbs en bar
function dpTramo(qN,lM,dM,pAbs){
  if(qN<=0) return {dp:0,v:0,re:0,f:0,rho:pAbs*1e5/(R_AIRE*T_K)};
  const rho=pAbs*1e5/(R_AIRE*T_K);
  const mdot=aKgS(qN);
  const A=Math.PI*dM*dM/4;
  const v=mdot/(rho*A);
  const re=rho*v*dM/MU;
  const epsD=(EPS_TUBO/1000)/dM;
  const f=re<2000?64/re:colebrook(re,epsD);
  const dp=f*(lM/dM)*rho*v*v/2/1e5;
  return {dp,v,re,f,rho};
}

// ---------- resolucion de la red ----------
// rep: array de 8 booleanos (que fugas se reparan). pCons: consigna en barg.
function red(pk,rep,pCons){
  const P=PLANTAS[pk];
  const pDesc=pCons+P_ATM;                       // bar abs a la salida del compresor
  const zk=P.zonas.map(z=>z.k);
  const qFug=P.fugas.map(()=>0);
  let pZona=P.zonas.map(()=>pDesc);
  let qTot=0, pSec=pDesc, dpSec=0, dpTronco=0, pTronco=pDesc;
  for(let it=0;it<40;it++){
    for(let i=0;i<P.fugas.length;i++){
      const F=P.fugas[i];
      const j=zk.indexOf(F.zk);
      const factor=rep[i]?F.post:1;
      const area=Math.PI*F.d*F.d/4;
      qFug[i]=factor*F.duty*aNlMin(gastoOrificio(area,pZona[j],P_ATM));
    }
    const qZona=P.zonas.map((z,j)=>z.q+qFug.reduce((a,q,i)=>a+(P.fugas[i].zk===z.k?q:0),0));
    qTot=qZona.reduce((a,b)=>a+b,0);
    // secador: perdida cuadratica con el caudal volumetrico
    const qVolRel=(qTot/1000)/P.qSecNom*(P_SEC_REF+P_ATM)/pDesc;
    dpSec=DP_SEC_NOM*qVolRel*qVolRel;
    pSec=pDesc-dpSec;
    // tronco: lo recorre el caudal total
    dpTronco=dpTramo(qTot,P.lTronco,P.dTronco/1000,pSec).dp;
    pTronco=pSec-dpTronco;
    const pNueva=P.zonas.map((z,j)=>pTronco-dpTramo(qZona[j],z.l,z.d/1000,pTronco).dp);
    const quieto=pNueva.every((p,j)=>p===pZona[j]);
    pZona=pNueva;
    if(quieto) break;                            // punto fijo exacto
  }
  // estado final por zona, ya con el terminal
  const qZona=P.zonas.map(z=>z.q+qFug.reduce((a,q,i)=>a+(P.fugas[i].zk===z.k?q:0),0));
  const zonas=P.zonas.map((z,j)=>{
    const tr=dpTramo(qZona[j],z.l,z.d/1000,pTronco);
    const pRamal=pTronco-tr.dp;
    const pUtilAbs=pTrasOrificio(z.at,pRamal,aKgS(z.q));
    return {
      k:z.k, rot:z.rot, q:z.q, qFuga:qZona[j]-z.q, qTotal:qZona[j],
      pMin:z.pMin, l:z.l, d:z.d, at:z.at,
      v:tr.v, re:tr.re, f:tr.f, dpRamal:tr.dp, pRamal:pRamal-P_ATM,
      dpTerm:pUtilAbs===null?Infinity:pRamal-pUtilAbs,
      pUtil:pUtilAbs===null?-Infinity:pUtilAbs-P_ATM,
      ok:pUtilAbs!==null&&pUtilAbs-P_ATM>=z.pMin-1e-9,
    };
  });
  const qFugaTot=qFug.reduce((a,b)=>a+b,0);
  const qConsumo=P.zonas.reduce((a,z)=>a+z.q,0);
  // potencia: compresion isotermica desde la atmosfera hasta la consigna
  const potW=(qTot/60000)*RHO_N*R_AIRE*T_K*Math.log(pDesc/P_ATM)/ETA_COMP;
  const capSec=P.qSecNom*pDesc/(P_SEC_REF+P_ATM);   // Nm3/min que traga el secador
  return {
    pk, rep:rep.slice(), pCons, pDesc, qFug, qFugaTot, qConsumo, qTot,
    dpSec, pSec:pSec-P_ATM, dpTronco, pTronco:pTronco-P_ATM, zonas,
    potW, potKW:potW/1000, capSec, margenSec:capSec-qTot/1000,
    frac:qFugaTot/qTot,
  };
}

// ---------- punto de decision completo (red + dinero + criterios) ----------
const memoBase={};
function base(pk){
  if(!memoBase[pk]) memoBase[pk]=red(pk,PLANTAS[pk].fugas.map(()=>false),PLANTAS[pk].pBase);
  return memoBase[pk];
}
function punto(pk,rep,pCons){
  const P=PLANTAS[pk], B=base(pk);
  const r=red(pk,rep,pCons);
  const horas=P.fugas.reduce((a,F,i)=>a+(rep[i]&&!F.paro?F.horas:0),0);
  const horasParo=P.fugas.reduce((a,F,i)=>a+(rep[i]&&F.paro?F.horas:0),0);
  const piezas=P.fugas.reduce((a,F,i)=>a+(rep[i]?F.pieza:0),0);
  const inversion=piezas+(horas+horasParo)*EUR_HORA;
  const eAnioBase=B.potKW*P.hAnio*EUR_KWH;
  const eAnio=r.potKW*P.hAnio*EUR_KWH;
  const ahorro=eAnioBase-eAnio;
  const payback=ahorro>0?inversion/ahorro*12:Infinity;
  const coste5=inversion+ANIOS*eAnio;
  const c={
    okPres:r.zonas.every(z=>z.ok),
    okCaudal:r.qTot/1000<=P.qComp+1e-9,
    okSecado:r.qTot/1000<=r.capSec+1e-9,
    okHoras:horas<=P.ventana+1e-9,
    okParo:horasParo<=P.ventanaParo+1e-9,
    okAhorro:ahorro>=P.objAhorro-1e-9,
    okPayback:payback<=P.paybackMax+1e-9,
  };
  const fallos=CRITERIOS.filter(k=>!c[k]);
  return {
    ...r, horas, horasParo, piezas, inversion, eAnioBase, eAnio, ahorro, payback,
    coste5, coste5Base:ANIOS*eAnioBase, nRep:rep.filter(Boolean).length,
    ...c, fallos, valida:fallos.length===0,
  };
}

// ---------- barrido completo: 2^8 subconjuntos x 5 consignas ----------
const memoBarr={};
function barrido(pk){
  if(memoBarr[pk]) return memoBarr[pk];
  const n=PLANTAS[pk].fugas.length, out=[];
  for(let m=0;m<(1<<n);m++){
    const rep=[]; for(let i=0;i<n;i++) rep.push(!!(m&(1<<i)));
    for(const pc of CONSIGNAS) out.push(punto(pk,rep,pc));
  }
  memoBarr[pk]=out;
  return out;
}
const validas=pk=>barrido(pk).filter(p=>p.valida);
const c2=x=>Math.round(x*100);
function mejorQue(a,b){
  if(c2(a.coste5)!==c2(b.coste5)) return a.coste5<b.coste5;
  if(c2(a.inversion)!==c2(b.inversion)) return a.inversion<b.inversion;
  if(a.horas+a.horasParo!==b.horas+b.horasParo) return a.horas+a.horasParo<b.horas+b.horasParo;
  return a.nRep<b.nRep;
}
function solucion(pk){
  const V=validas(pk);
  if(!V.length) return null;
  let best=V[0];
  for(const p of V) if(mejorQue(p,best)) best=p;
  const emp=V.filter(p=>c2(p.coste5)===c2(best.coste5)).length;
  return {...best, empates:emp, nval:V.length};
}
// los puntos que empatan en coste con el optimo (misma regla que solucion)
function empates(pk){
  const V=validas(pk);
  if(!V.length) return [];
  let best=V[0];
  for(const p of V) if(mejorQue(p,best)) best=p;
  return V.filter(p=>c2(p.coste5)===c2(best.coste5));
}
function censo(pk){
  const B=barrido(pk);
  const tot={}, solo={};
  for(const c of CRITERIOS){ tot[c]=0; solo[c]=0; }
  for(const p of B){
    for(const c of p.fallos) tot[c]++;
    if(p.fallos.length===1) solo[p.fallos[0]]++;
  }
  return {n:B.length, val:B.filter(p=>p.valida).length, tot, solo};
}

// ---------- los tres ensayos ----------
// A) descarga del deposito: solo ve las fugas aguas arriba de las llaves de zona
function ensayoDeposito(pk,rep,pCons){
  const P=PLANTAS[pk];
  const p1=pCons+P_ATM, p2=p1-2.0;              // se deja caer 2 bar
  // coeficiente alfa: caudal normal de las fugas de tronco por bar absoluto
  let alfa=0;
  P.fugas.forEach((F,i)=>{
    if(!F.tronco) return;
    const factor=rep[i]?F.post:1;
    const area=Math.PI*F.d*F.d/4;
    alfa+=factor*F.duty*aNlMin(gastoOrificio(area,1,0)); // lineal en pUp (bloqueado)
  });
  const tau=P.vDep/1000/(alfa/1000*P_ATM)*60;   // s   (V en m3, alfa en Nm3/min)
  const t=alfa>0?tau*Math.log(p1/p2):Infinity;
  const qLineal=alfa>0?P.vDep/1000*(p1-p2)/(t/60)/P_ATM*1000:0;   // Nl/min
  const qReal1=alfa*p1, qRealMed=alfa*(p1+p2)/2;
  return {p1:p1-P_ATM, p2:p2-P_ATM, alfa, t, qLineal, qReal1, qRealMed,
    sesgo:qLineal/qRealMed-1, vista:P.fugas.filter(F=>F.tronco).length};
}
// B) ciclo carga/descarga: ve toda la red, pero mide a la presion media del ciclo
function ensayoCiclo(pk,rep,pCons){
  const P=PLANTAS[pk];
  const pCarga=pCons+P_ATM, pDesc=pCarga-1.0;   // banda de 1 bar
  const pMed=(pCarga-pDesc)/Math.log(pCarga/pDesc);   // media logaritmica
  let alfa=0;
  P.fugas.forEach((F,i)=>{
    const factor=rep[i]?F.post:1;
    const area=Math.PI*F.d*F.d/4;
    alfa+=factor*F.duty*aNlMin(gastoOrificio(area,1,0));
  });
  const qMed=alfa*pMed;                         // Nl/min realmente fugados en el ensayo
  const tCarga=60*(P.vDep/1000)*(pCarga-pDesc)/P_ATM/(P.qComp-qMed/1000);
  const tDesc=60*(P.vDep/1000)*(pCarga-pDesc)/P_ATM/(qMed/1000);
  const duty=tCarga/(tCarga+tDesc);
  const qMedido=P.qComp*duty*1000;              // Nl/min que declara el ensayo
  const qCons=alfa*(pCons+P_ATM);               // corregido a la consigna
  return {pCarga:pCarga-P_ATM, pDesc:pDesc-P_ATM, pMed, alfa, qMed, tCarga, tDesc,
    duty, qMedido, qCons, sesgo:qMedido/qCons-1, vista:P.fugas.length};
}
// C) censo por ultrasonidos: suma las fugas una a una a la presion de trabajo
function censoUltra(pk,rep,pCons){
  const r=red(pk,rep,pCons);
  const P=PLANTAS[pk];
  const det=P.fugas.map((F,i)=>({k:F.k, rot:F.rot, tipo:F.tipo, d:F.d,
    q:r.qFug[i], db:dB(r.qFug[i])}));
  return {det, q:r.qFugaTot};
}

// ---------- formato sellado (identico al del resto de la coleccion) ----------
const NBSP=' ';   // espacio fino inseparable para los miles, nunca U+0020
function f1(x,d){
  const dd=d===undefined?2:d;
  if(!Number.isFinite(x)) return '—';
  const neg=x<0;
  const s=Math.abs(x).toFixed(dd);
  const [ent,dec]=s.split('.');
  const e=ent.replace(/\B(?=(\d{3})+(?!\d))/g,NBSP);
  return (neg?'−':'')+(dec?e+','+dec:e);
}
function pc1(x,d){ return f1(100*x,d===undefined?1:d)+' %'; }

  for(let i=0;i<=NY;i++){ const y=P.y+P.h*i/NY; bx.beginPath(); bx.moveTo(P.x,y); bx.lineTo(P.x+P.w,y); bx.stroke(); }

  linea(P.x,P.y,P.x,P.y+P.h,'#3a465c',1.5);
  for(let i=0;i<=NX;i++){ const v=xmin+(xmax-xmin)*i/NX;
    texto(fmtX?fmtX(v):f1(v,1),P.x+P.w*i/NX,P.y+P.h+20,'#7f8b9c',12,'center','600'); }
  for(let i=0;i<=NY;i++){ const v=ymin+(ymax-ymin)*(NY-i)/NY;
    texto(fmtY?fmtY(v):f1(v,1),P.x-8,P.y+P.h*i/NY+4,'#7f8b9c',12,'right','600'); }
  if(rotX) texto(rotX,P.x+P.w/2,P.y+P.h+44,'#8f9bb0',13,'center','700');
  if(rotY){ bx.save(); bx.translate(P.x-42,P.y+P.h/2); bx.rotate(-Math.PI/2);
    texto(rotY,0,0,'#8f9bb0',13,'center','700'); bx.restore(); }
  return { X:v=>P.x+P.w*(v-xmin)/(xmax-xmin), Y:v=>P.y+P.h-P.h*(v-ymin)/(ymax-ymin) };
}
function punteo(x,y,col,r){
  bx.fillStyle=col||AZUL; bx.beginPath(); bx.arc(x,y,r||5,0,Math.PI*2); bx.fill();
  bx.strokeStyle='#080b11'; bx.lineWidth=1.5; bx.stroke();
}
function anillo(x,y,col,r){
  bx.strokeStyle=col||'#eaf1fb'; bx.lineWidth=2.2;
  bx.beginPath(); bx.arc(x,y,r||9,0,Math.PI*2); bx.stroke();
}
function banda(A,x1,x2,y1,y2,col){
  bx.fillStyle=col; bx.fillRect(A.X(x1),A.Y(y2),A.X(x2)-A.X(x1),A.Y(y1)-A.Y(y2));
}
function leyenda(x,y,items){
  let xx=x;
  items.forEach(it=>{
    linea(xx,y-5,xx+22,y-5,it[1],3,it[2]||[]);
    texto(it[0],xx+28,y,'#a9b6c8',13,'left','600');
    xx += 28 + bx.measureText(it[0]).width + 22;
  });
}

// ---- vista 1: el orificio ----
function vistaFuga(){
  const p=CUR, P=PLANTAS[p.pk];
  const F=fugaAct(), i=iFuga(p.pk,F.k);
  const j=P.zonas.findIndex(z=>z.k===F.zk);
  const Z=p.zonas[j];
  const pUp=Z.pRamal+P_ATM;                 // bar abs delante del orificio
  const area=Math.PI*F.d*F.d/4;
  title2('Una fuga es un orificio, y casi siempre está bloqueado',
    P.ico+' '+P.rot+' · '+F.rot+' · '+ROT_TIPO[F.tipo]+' de '+f1(F.d,1)+' mm en '+Z.rot);

  const A={x:104,y:118,w:530,h:190};
  const qMax=aNlMin(gastoOrificio(area,pUp,0));
  const ax=ejes(A,0,1,0,qMax*1.14,'relación de presiones p₂/p₁','caudal (Nl/min)',
    v=>f1(v,2),v=>f1(v,0),5,4);
  banda(ax,0,R_CRIT,0,qMax*1.14,'rgba(255,107,107,0.10)');
  const pts=[];
  for(let k=0;k<=200;k++){ const r=k/200;
    pts.push([ax.X(r),ax.Y(aNlMin(gastoOrificio(area,pUp,r*pUp)))]); }
  curva(pts,CIAN,2.6);
  linea(ax.X(R_CRIT),A.y,ax.X(R_CRIT),A.y+A.h,BAD_HEX,1.6,[5,4]);
  texto('p₂/p₁ = '+f1(R_CRIT,4),ax.X(R_CRIT)+10,A.y+18,BAD_HEX,13,'left','700');
  texto('bloqueado',ax.X(R_CRIT)-12,A.y+18,BAD_HEX,13,'right','700');
  texto('el caudal ya no sabe qué hay fuera',ax.X(R_CRIT)-12,A.y+38,'#8f9bb0',12,'right','600');
  const rOp=P_ATM/pUp;
  punteo(ax.X(rOp),ax.Y(p.qFug[i]),WARN_HEX,6);
  anillo(ax.X(rOp),ax.Y(p.qFug[i]),'#eaf1fb',11);
  texto('a la atmósfera: p₂/p₁ = '+f1(rOp,3),ax.X(rOp)+18,ax.Y(p.qFug[i])-14,WARN_HEX,13,'left','700');
  texto(f1(p.qFug[i],1)+' Nl/min · '+f1(dB(p.qFug[i]),1)+' dB',
    ax.X(rOp)+18,ax.Y(p.qFug[i])+6,'#dbe4f0',13,'left','700');
  leyenda(104,A.y+A.h+68,[['caudal del orificio',CIAN],['relación crítica',BAD_HEX,[5,4]]]);

  const DIAM=[0.5,1.0,1.5,2.0,3.0,5.0].concat([F.d])
    .filter((v,k,a)=>a.indexOf(v)===k).sort((a,b)=>a-b);
  const qD=DIAM.map(d=>aNlMin(gastoOrificio(Math.PI*d*d/4,pUp,P_ATM)));
  const qm=Math.max.apply(null,qD);
  const B={x:104,y:452,w:530,h:150};
  texto('El mismo agujero, distinto diámetro · línea a '+f1(Z.pRamal,3)+' barg',
    44,428,'#eaf1fb',16,'left','800');
  const paso=B.w/DIAM.length;
  DIAM.forEach((d,k)=>{
    const x=B.x+k*paso+10, w=paso-26, h=B.h*qD[k]/qm;
    bx.fillStyle=(d===F.d)?WARN_HEX:'rgba(138,180,248,0.55)';
    bx.beginPath(); bx.roundRect(x,B.y+B.h-h,w,h,6); bx.fill();
    texto(f1(qD[k],1),x+w/2,B.y+B.h-h-8,(d===F.d)?WARN_HEX:'#dbe4f0',13,'center','700');
    texto(f1(d,1)+' mm',x+w/2,B.y+B.h+20,'#a9b6c8',13,'center','700');
    texto(f1(dB(qD[k]),1)+' dB',x+w/2,B.y+B.h+38,'#7f8b9c',12,'center','600');
  });
  linea(B.x,B.y+B.h,B.x+B.w,B.y+B.h,'#3a465c',1.5);
  nota('Por encima de '+f1(P_BLOQ,3)+' barg de línea, una fuga a la atmósfera está bloqueada: '+
    'el aire sale a la velocidad del sonido y el caudal sólo depende del área y de la presión de línea. '+
    'Por eso el caudal va con el CUADRADO del diámetro —'+f1(DIAM[DIAM.length-1],1)+' mm fuga '+
    f1(qD[qD.length-1]/qD[0],1)+' veces lo que '+f1(DIAM[0],1)+' mm— y el detector, que oye potencia acústica, '+
    'sube '+f1(dB(4)-dB(1),1)+' dB cada vez que el caudal se cuadruplica.',652);
  panelPunto(p);
}

function vistaEnsayo(){
  const p=CUR, P=PLANTAS[p.pk];
  const U=censoUltra(p.pk,p.rep,p.pCons);
  if(ST.ek==='deposito'){
    const A=ensayoDeposito(p.pk,p.rep,p.pCons);
    title2('Ensayo A · caída del depósito',
      P.ico+' '+P.rot+' · '+f1(P.vDep,0)+' litros, de '+f1(A.p1,1)+' a '+f1(A.p2,1)+
      ' barg con las llaves de zona cerradas');
    const G={x:104,y:130,w:530,h:210};
    if(Number.isFinite(A.t)&&A.t>0){
      const tau=A.t/Math.log((A.p1+P_ATM)/(A.p2+P_ATM));
      const ax=ejes(G,0,A.t,A.p2,A.p1,'tiempo (s)','presión del depósito (barg)',
        v=>f1(v,0),v=>f1(v,2),6,4);
      const pts=[];
      for(let k=0;k<=200;k++){ const t=A.t*k/200;
        pts.push([ax.X(t),ax.Y((A.p1+P_ATM)*Math.exp(-t/tau)-P_ATM)]); }
      curva(pts,CIAN,2.6);
      linea(ax.X(0),ax.Y(A.p1),ax.X(A.t),ax.Y(A.p2),WARN_HEX,2,[6,4]);
      punteo(ax.X(0),ax.Y(A.p1),CIAN,5); punteo(ax.X(A.t),ax.Y(A.p2),CIAN,5);
      texto('τ = '+f1(tau,1)+' s',ax.X(A.t*0.62),ax.Y(A.p1)-6,CIAN,13,'left','700');
      leyenda(104,G.y+G.h+68,[['caída real (exponencial)',CIAN],
        ['lo que supone la cuenta lineal',WARN_HEX,[6,4]]]);
    }else{
      texto('Sin fugas en el tronco: el depósito no baja y el ensayo no termina nunca.',
        104,240,BAD_HEX,17,'left','700');
    }
    barrasQ(420,'Lo que declara el ensayo frente a lo que hay',[
      ['declara la cuenta lineal',A.qLineal,WARN_HEX],
      ['fuga real al empezar',A.qReal1,'rgba(138,180,248,0.75)'],
      ['fuga real media del ensayo',A.qRealMed,'rgba(138,180,248,0.45)'],
      ['fuga real de TODA la red',U.q,BAD_HEX]]);
    nota('El depósito sólo ve las '+f1(A.vista,0)+' de '+f1(P.fugas.length,0)+
      ' fugas que están aguas arriba de las llaves de zona. Además la caída es exponencial, '+
      'no una recta: la cuenta lineal V·Δp/Δt no devuelve la fuga inicial sino la MEDIA del tramo, '+
      'y se queda un '+pc1(Math.abs(A.sesgo),2)+' por debajo. Los dos errores van en el mismo sentido, '+
      'así que el ensayo declara '+f1(A.qLineal,1)+' Nl/min cuando la red pierde '+f1(U.q,1)+
      ': un '+pc1(Math.abs(A.qLineal/U.q-1),1)+' menos de lo que hay.',630);
  }else if(ST.ek==='ciclo'){
    const C=ensayoCiclo(p.pk,p.rep,p.pCons);

      P.ico+' '+P.rot+' · banda de '+f1(C.pCarga-C.pDesc,1)+' bar entre '+f1(C.pDesc,1)+
      ' y '+f1(C.pCarga,1)+' barg, sin consumo de producción');
    const G={x:104,y:130,w:530,h:200};
    const per=C.tCarga+C.tDesc;
    const ax=ejes(G,0,2*per,C.pDesc-0.15,C.pCarga+0.15,'tiempo (s)','presión (barg)',
      v=>f1(v,0),v=>f1(v,2),6,4);
    const pts=[];
    for(let c=0;c<2;c++){
      pts.push([ax.X(c*per),ax.Y(C.pDesc)]);
      pts.push([ax.X(c*per+C.tCarga),ax.Y(C.pCarga)]);
      pts.push([ax.X(c*per+per),ax.Y(C.pDesc)]);
    }
    curva(pts,AZUL,2.6);
    linea(ax.X(0),ax.Y(C.pMed-P_ATM),ax.X(2*per),ax.Y(C.pMed-P_ATM),VIO,2,[6,4]);
    texto('media logarítmica: '+f1(C.pMed-P_ATM,3)+' barg',ax.X(2*per)-8,ax.Y(C.pMed-P_ATM)-8,
      VIO,13,'right','700');
    for(let c=0;c<2;c++){
      bx.fillStyle='rgba(124,217,146,0.14)';
      bx.fillRect(ax.X(c*per),G.y,ax.X(C.tCarga)-ax.X(0),G.h);
    }
    texto('carga '+f1(C.tCarga,1)+' s',ax.X(C.tCarga/2),G.y+18,OK_HEX,13,'center','700');
    texto('descarga '+f1(C.tDesc,1)+' s',ax.X(C.tCarga+C.tDesc/2),G.y+18,'#8f9bb0',13,'center','700');
    texto('marcha = '+pc1(C.duty,2)+' del tiempo',104,G.y+G.h+68,'#a9b6c8',14,'left','700');
    barrasQ(412,'Lo que declara el ensayo frente a lo que hay',[
      ['declara q = Q·marcha',C.qMedido,WARN_HEX],
      ['fuga a la presión media del ciclo',C.qMed,'rgba(138,180,248,0.45)'],
      ['fuga lineal a la consigna',C.qCons,'rgba(138,180,248,0.75)'],
      ['fuga real de TODA la red',U.q,BAD_HEX]]);
    nota('Este ensayo sí ve las '+f1(C.vista,0)+' fugas, pero las mide a la presión media del ciclo, '+
      f1(C.pMed-P_ATM,3)+' barg, que no es la consigna: por eso se queda un '+pc1(Math.abs(C.sesgo),2)+
      ' por debajo de la fuga lineal a '+f1(p.pCons,1)+' barg. Y como las fugas cuelgan de zonas que '+
      'están por debajo de la descarga, ese error se compensa en parte solo: aquí el ensayo declara '+
      f1(C.qMedido,1)+' contra los '+f1(U.q,1)+' reales, un '+pcm(C.qMedido/U.q-1)+
      '. La compensación es un accidente de esta planta, no una ley.',622);
  }else{
    title2('Ensayo C · censo por ultrasonidos',
      P.ico+' '+P.rot+' · las '+f1(P.fugas.length,0)+' fugas, una a una, a la presión de su zona');
    const det=U.det.map((d,i)=>({...d,i,rep:p.rep[i]}));
    const ord=det.slice().sort((a,b)=>b.q-a.q);
    let qm=0; ord.forEach(d=>{ if(d.q>qm) qm=d.q; });
    if(!(qm>0)) qm=1;
    const x0=286, w=300;
    let acum=0, n80=0;
    ord.forEach((d,k)=>{
      const y=128+k*46;
      texto((d.rep?'✓ ':'')+d.rot,44,y+15,d.rep?'#6f7a8a':'#dbe4f0',13,'left','700');
      texto(ROT_TIPO[d.tipo]+' · '+f1(d.d,1)+' mm',44,y+31,'#7f8b9c',12,'left','500');
      const bw=Math.max(3,w*d.q/qm);
      bx.fillStyle=d.rep?'rgba(111,122,138,0.55)':COL_TIPO[d.tipo];
      bx.beginPath(); bx.roundRect(x0,y,bw,22,5); bx.fill();
      texto(f1(d.q,1)+' Nl/min · '+f1(d.db,1)+' dB · '+pc1(U.q>0?d.q/U.q:0,1),
        x0+bw+10,y+16,'#a9b6c8',12,'left','600');
      acum+=d.q; if(acum<=0.8*U.q) n80=k+1;
    });
    texto('suma del censo: '+f1(U.q,1)+' Nl/min = '+pc1(p.frac,1)+' de todo lo que comprime la planta',
      44,520,'#eaf1fb',15,'left','800');
    hbar(44,536,590,14,p.frac,BAD_HEX);
    nota('El censo es el único de los tres que acierta, porque no deduce la fuga de una presión: '+
      'la mide agujero a agujero donde está. Las '+f1(n80+1,0)+' mayores ya suman el 80 % del caudal '+
      'perdido; el detector oye potencia acústica, y como el caudal va con el cuadrado del diámetro, '+
      'cada 6 dB de más es el doble de agujero y cuatro veces la fuga.',586);
  }
  panelPunto(p);
}

// ---- vista 4: el catálogo de montajes ----
function vistaCatalogo(){

// Todas las plantas tienen exactamente 5 zonas y 8 fugas, así que el equipo se
// monta UNA vez y aquí sólo se recoloca, se recolorea y se reetiqueta.
const OFF_F=[[0.36,0.42],[-0.36,-0.42],[0.36,-0.42],[-0.36,0.42]];
function posFuga(pk,i){
  const P=PLANTAS[pk], F=P.fugas[i];
  const j=P.zonas.findIndex(z=>z.k===F.zk);
  const idx=P.fugas.slice(0,i).filter(G=>G.zk===F.zk).length;   // cuántas van ya en esa zona
  const o=OFF_F[idx%4];
  const x=(j<0?XZ[0]:XZ[j])+o[0];
  const y=(F.tronco?1.66:1.14)+0.20*Math.floor(idx/4);
  return {p:V3(x,y,o[1]), s:o[0]>0?1:-1};
}
function tinta(mat,hex,ei){ mat.color.set(hex); if(mat.emissive) mat.emissive.set(hex);
  if(ei!==undefined) mat.emissiveIntensity=ei; }

function refrescaHW(){
  const p=CUR, P=PLANTAS[p.pk], c=cfgDe(mode);
  // --- zonas: el LED de cada máquina dice si le llega presión ---
  gZona.forEach((g,j)=>{
    const z=p.zonas[j];
    g.position.y=0;
    tinta(g.userData.led.material, z.ok?OK_HEX:BAD_HEX, z.ok?0.9:1.1);
  });
  // --- fugas: color por tipo, tamaño por caudal, chorro sólo si sigue abierta ---
  gFuga.forEach((g,i)=>{
    const F=P.fugas[i], q=p.qFug[i], rep=c.rep[i];
    const L=posFuga(p.pk,i);
    g.position.copy(L.p); g.rotation.z=-0.42*L.s;
    const gr=q/Math.max(1,p.qFugaTot);
    tinta(g.userData.nod.material, rep?'#3a4150':COL_TIPO[F.tipo], rep?0.05:0.95);
    const e=clamp(0.55+q/260,0.55,2.30);
    g.userData.nod.scale.setScalar(rep?0.75:e);
    const j=g.userData.jet;
    j.visible=!rep&&q>0.5;
    j.scale.set(clamp(0.5+q/300,0.5,2.0),clamp(0.4+q/180,0.4,2.6),clamp(0.5+q/300,0.5,2.0));
    j.material.opacity=0.22+0.55*clamp(gr*3,0,1);
    const sel=(mode==='fuga'&&F.k===ST.fk)||(mode==='ensayo'&&ST.ek==='ultra');
    g.userData.halo.visible=sel&&!rep;
    g.userData.halo.scale.setScalar(mode==='fuga'&&F.k===ST.fk?1.6:1.1);
  });
  // --- semáforo de criterios ---
  M3.leds.forEach((s,i)=>tinta(s.material, p[CRIT[i]]?OK_HEX:BAD_HEX, p[CRIT[i]]?0.9:1.15));
  // --- manómetros: descarga del compresor y final del tronco, misma escala 0–10 barg ---
  setManometro(M3.manoA,(p.pDesc-P_ATM)/10);
  setManometro(M3.manoB,p.pTronco/10);
  // --- depósito: la columna sube con la consigna ---
  const fr=clamp((p.pCons-4)/6,0.05,1);
  M3.nivel.scale.y=fr*11; M3.nivel.position.y=0.28+0.05*fr*11;
  tinta(M3.nivel.material,CIAN,0.35+0.6*fr);
  // --- secador: verde si traga el caudal, rojo si va corto ---
  tinta(M3.frio.material, p.okSecado?OK_HEX:BAD_HEX, 0.85);
  // --- partículas del tronco: tantas visibles como caudal circule ---
  const nv=Math.round(clamp(p.qTot/420,2,16));
  M3.part.forEach((m,i)=>{ m.visible=i<nv; });
}

    <div class="fl"><b>Sí modela:</b> el gasto de cada fuga como <b>orificio compresible</b> con las dos ramas de la ecuación de Saint-Venant —bloqueada cuando p_atm/p_línea ≤ ${f1(R_CRIT,6)}, subsónica por debajo— con coeficiente de descarga ${f1(CD,2)}, de modo que la fuga crece con el <b>cuadrado del diámetro</b> y casi linealmente con la presión absoluta de línea; el nivel sonoro estimado de cada escape; la red entera resuelta por <b>punto fijo</b> —tronco y ramales por Darcy–Weisbach con el factor de fricción de <b>Colebrook–White</b> y la densidad del aire evaluada a la presión de cada tramo, más la caída del secador derateada por caudal volumétrico real— hasta que la presión de cada zona deja de moverse; la presión útil <b>después</b> del terminal de la máquina, que es la que exige el pliego; la potencia por <b>compresión isotérmica</b> con rendimiento de grupo ${f1(ETA_COMP,2)} y ${f1(EUR_KWH,2)} €/kWh; los tres ensayos de auditoría con su sesgo real —vaciado del depósito, análisis de ciclos carga/vacío y censo ultrasónico—; y el coste de propiedad a ${f1(ANIOS,0)} años del <b>catálogo entero</b>: ${f1(NCOMB,0)} intervenciones por planta (${f1(Math.pow(2,PLANTAS.taller.fugas.length),0)} repartos de reparación × ${f1(CONSIGNAS.length,0)} consignas), en las cinco plantas.</div>
    <div class="fl no"><b>NO modela:</b> el transitorio del compresor. La red se resuelve en régimen estacionario: no hay arranque, ni oscilación de presión entre carga y vacío salvo en el ensayo B, que se calcula aparte con un modelo de depósito. Las fugas no crecen con el tiempo ni vuelven a aparecer, y una reparación es instantánea salvo por las horas que consume. El aire se toma a ${f1(T_K-273.15,0)} °C en toda la red —no hay calentamiento en la compresión ni enfriamiento en la expansión de la fuga— y seco: no hay condensado, ni arrastre de agua, ni punto de rocío. La demanda de cada zona es un dato declarado, constante y simultáneo: no hay factor de simultaneidad ni perfil de turno. El nivel sonoro es una estimación empírica para orientar el censo, no una medida acústica. El precio de la energía, la mano de obra y las piezas son datos declarados.</div>
  </div>

// La fuga que aparece reparada en más intervenciones VÁLIDAS de la planta. No es
// una garantía —hay válidas que no la tocan— sino la apuesta con más respaldo
// estadístico del barrido. Se resuelve por máximo estricto: si dos empataran, se
// quedaría la primera de la lista, y el rótulo dice la cuenta, no una promesa.
function fugaFrec(pk){
  const V=valM(pk), P=PLANTAS[pk];
  if(!V.length) return null;
  let mejor=null;
  P.fugas.forEach((F,i)=>{
    const con=V.filter(p=>p.rep[i]).length;
    if(!mejor||con>mejor.con) mejor={i,k:F.k,rot:F.rot,con,tot:V.length};
  });
  return mejor;
}
// Valores de un eje que se destapan como pista. Los dos primeros salen de las
// intervenciones que empatan en coste con la óptima; el barrido de este catálogo
// no tiene ningún empate al céntimo, así que hoy devuelven un único valor, pero la
// función está escrita para la lista completa porque el motor sí admite empates.
function ejeSolC(pk,eje){
  const E=empM(pk), out=[];
  if(eje==='pCons') E.forEach(p=>{ if(out.indexOf(p.pCons)<0) out.push(p.pCons); });
  else if(eje==='nrep') E.forEach(p=>{ if(out.indexOf(p.nRep)<0) out.push(p.nRep); });
  else { const m=fugaFrec(pk); if(m) out.push(m.k); }
  return out;
}
// Una pista destapa UN eje. Ninguna resuelve el reto: hay 256 repartos por consigna,
// saber cuántas fugas se tocan no dice cuáles, y la fuga más frecuente entre las
// válidas deja las otras siete sin decidir.
function pista(){
  const eje=EJES.find(e=>!RETO.pistas[e]);
  if(!eje){showToast('💡 Ya has destapado los tres ejes. La combinación la tienes que cerrar tú.');return;}
  RETO.pistas[eje]=true;beep();
  const pk=RETO.cfg.pk, v=ejeSolC(pk,eje);
  if(!v.length){showToast('💡 <b>'+EJE_ROT[eje]+'.</b> Esta planta no tiene ninguna intervención válida.');
    afterEdit();return;}
  const m=eje==='frec'?fugaFrec(pk):null;
  const txt = eje==='pCons' ? v.map(x=>f1(x,1)+' barg').join(' · ')
            : eje==='nrep'  ? v.map(x=>f1(x,0)+' fugas de '+f1(PLANTAS[pk].fugas.length,0)).join(' · ')
            : m.k.toUpperCase()+' ('+m.rot+'), reparada en '+f1(m.con,0)+' de las '+
              f1(m.tot,0)+' válidas. Las otras siete las decides tú.';
  showToast('💡 <b>'+EJE_ROT[eje]+'.</b> '+txt);
  afterEdit();
}

// "Nuevo escenario": en el reto cambia de planta y rearma la partida; en los modos
// de estudio avanza al siguiente caso que enseña algo distinto.
function newSignal(){
  const sig=(arr,v)=>arr[(arr.indexOf(v)+1)%arr.length];
  if(mode==='fuga'){
    const ks=PLANTAS[ST.pk].fugas.map(F=>F.k);
    ST.fk=sig(ks,ST.fk);
    if(ks.indexOf(ST.fk)===0){ST.pk=sig(PLANTA_KEYS,ST.pk);ST.rep=repCero(ST.pk);
      ST.pCons=PLANTAS[ST.pk].pBase;ST.fk=PLANTAS[ST.pk].fugas[0].k;}
  }else if(mode==='red'){
    ST.pCons=sig(CONSIGNAS,ST.pCons);
    if(ST.pCons===CONSIGNAS[0]){ST.pk=sig(PLANTA_KEYS,ST.pk);ST.rep=repCero(ST.pk);
      ST.fk=PLANTAS[ST.pk].fugas[0].k;}
  }else if(mode==='ensayo'){
    ST.ek=sig(['deposito','ciclo','ultra'],ST.ek);
    if(ST.ek==='deposito'){ST.pk=sig(PLANTA_KEYS,ST.pk);ST.rep=repCero(ST.pk);
      ST.pCons=PLANTAS[ST.pk].pBase;ST.fk=PLANTAS[ST.pk].fugas[0].k;}
  }else if(mode==='catalogo'){
    ST.pk=sig(PLANTA_KEYS,ST.pk);ST.fk=PLANTAS[ST.pk].fugas[0].k;
    const o=solM(ST.pk);
    if(o){ST.rep=o.rep.slice();ST.pCons=o.pCons;} else {ST.rep=repCero(ST.pk);ST.pCons=PLANTAS[ST.pk].pBase;}
  }else{
    RETO.cfg.pk=sig(PLANTA_KEYS,RETO.cfg.pk);
    retoSolveBuild(true);
  }
  RETO.resuelto=false;solved=false;RETO.msg='';
  buildControls();updateScenarioInfo();
  clearDx();buildQuiz();refreshQuestion();
  if(mode==='reto')updateRetoSpec();
  refreshAll();
  showToast('🔀 <b>Escenario nuevo.</b> '+MODE_META[mode].mision);
}

// Lo que se ahorra al año tapando SOLO esta fuga, dejando el resto como está.
function ahorroSolo(c,i){
  const rep=c.rep.map((b,j)=>j===i?true:b);
  if(c.rep[i]) return 0;
  return CUR.eAnio-punto(c.pk,rep,c.pCons).eAnio;
}

// ===================== 13. RETO =====================
// El reto no compara contra una respuesta escrita a mano: barre las 1 280
// intervenciones posibles de la planta, se queda con las válidas y ordena por el
// criterio lexicográfico declarado en el motor (coste de propiedad → inversión →
// horas → número de reparaciones). Cualquier intervención que empate en coste con
// la mejor se daría por buena, porque el motor no sabría distinguirlas; en las cinco
// plantas de este catálogo no ocurre ninguna vez, así que la óptima es única.
// Punto de partida: nada reparado y el compresor a la consigna heredada, que casi
// siempre está más alta de lo necesario. Es el estado real de una planta sin auditar.
function startCfg(pk){ return { rep:repCero(pk), pCons:PLANTAS[pk].pBase }; }

function retoSolveBuild(reset){
  const pk=RETO.cfg.pk;
  RETO.sol=solM(pk);
  RETO.nval=censoM(pk).val;
  if(reset){
    RETO.ejes=startCfg(pk);
    RETO.pistas={};
    RETO.resuelto=false;
    RETO.msg='';
  }
}

  const pk=RETO.cfg.pk, P=PLANTAS[pk], B=punto(pk,repCero(pk),P.pBase);

    f1(ANIOS,0)+' años. Sin tocar nada, la planta pierde '+f1(B.qFugaTot,1)+' Nl/min de fuga ('+
    pc1(B.frac,1)+' de lo que comprime) y gasta '+f1(B.eAnio,2)+' €/año a '+f1(P.hAnio,0)+

    f1(CONSIGNAS[0],1)+' y '+f1(CONSIGNAS[CONSIGNAS.length-1],1)+' barg. Todo a la vez:';
  h+='<ul style="margin:6px 0 0 16px;padding:0">';
  CRIT.forEach(k=>{ h+='<li><b>'+CRIT_ROT[k]+'</b> — '+CRIT_POR[k]+'</li>'; });
  h+='</ul>';
  h+='<div style="margin-top:6px;color:var(--muted)">Ventana: '+f1(P.ventana,1)+
    ' h en marcha y '+f1(P.ventanaParo,1)+' h con la máquina parada. Ahorro exigido '+
    f1(P.objAhorro,0)+' €/año, retorno máximo '+f1(P.paybackMax,1)+' meses. '+
    'Coste de propiedad = inversión (piezas + '+f1(EUR_HORA,0)+' €/h de mano de obra) + '+

    ' €/kWh. El motor guarda un desempate por si dos montajes costaran lo mismo al céntimo '+

    ' intervenciones válidas: el mínimo es único y no hay que desempatar nada.</div>';

// Explica por qué la intervención puesta no vale, criterio a criterio y con sus
// cifras. Habla de TODOS los criterios caídos, no sólo del primero: el barrido
// demuestra que okPayback nunca es el primero de la lista —siempre hay un ahorro
// corto o una ventana rebasada por delante— y encadenar los avisos con else dejaba
// esa explicación sin poder salir nunca en pantalla. Ningún punto falla más de tres.
function retoExplain(r,c){
  if(r.valida) return '';
  const P=PLANTAS[c.pk];
  let p='Falla '+r.fallos.map(k=>CRIT_ROT[k]).join(', ')+'. ';
  if(!r.okPres){
    const z=r.zonas.filter(x=>!x.ok).reduce((a,x)=>(x.pUtil-x.pMin)<(a.pUtil-a.pMin)?x:a,
      r.zonas.filter(x=>!x.ok)[0]);
    p+=z.rot+' necesita '+f1(z.pMin,1)+' barg en el punto de uso y '+
      (Number.isFinite(z.pUtil)?'sólo le llegan '+f1(z.pUtil,3)
        :'el terminal ni siquiera puede pasar ese caudal')+
      ': o subes la consigna o quitas caudal de fuga, que también quita caída. ';
  }
  if(!r.okCaudal) p+='La planta pide '+f1(r.qTot/1000,3)+' Nm³/min y el compresor da '+
    f1(P.qComp,2)+': no hay máquina que sostenga eso. ';
  if(!r.okSecado) p+='El secador está declarado para '+f1(P.qSecNom,2)+' Nm³/min a '+
    f1(P_SEC_REF,1)+' barg, y a '+f1(r.pCons,1)+' sólo traga '+f1(r.capSec,3)+
    ' frente a los '+f1(r.qTot/1000,3)+' que pasan: al bajar la presión el aire se hincha y el secador se queda corto. ';
  if(!r.okHoras) p+='Esas reparaciones piden '+f1(r.horas,1)+
    ' h con la planta en marcha y la ventana es de '+f1(P.ventana,1)+' h. ';
  if(!r.okParo) p+='Hay '+f1(r.horasParo,1)+' h de trabajo que exigen parar la máquina y sólo hay '+
    f1(P.ventanaParo,1)+' h de paro autorizadas. ';
  if(!r.okAhorro) p+='Ahorra '+f1(r.ahorro,2)+' €/año y la dirección pide '+
    f1(P.objAhorro,0)+': '+(r.nRep===0?'sin tocar ninguna fuga no hay nada que ahorrar. '
      :'con esas fugas no se llega. ');
  if(!r.okPayback) p+='Cuesta '+f1(r.inversion,2)+' € y ahorra '+f1(r.ahorro,2)+
    ' €/año: se devuelve en '+(Number.isFinite(r.payback)?f1(r.payback,2)+' meses'
      :'nunca, porque no ahorra nada')+' y el plazo son '+f1(P.paybackMax,1)+'. ';
  return p;
}
function checkReto(){
  const c=cfgDe('reto'), s=RETO.sol;
  const r=punto(c.pk,c.rep,c.pCons);
  if(!s){
    RETO.msg='Esta planta no tiene ninguna intervención que cumpla los siete criterios.';
    RETO.resuelto=false;
    synth.beep(240,0.12,0.05);
    showToast('❌ <b>Sin solución.</b> '+RETO.msg);
  }else if(r.valida&&empM(c.pk).some(q=>mismo(q,r))){
    RETO.resuelto=true; solved=true;
    RETO.msg='Correcto: '+f1(r.coste5,0)+' € de coste de propiedad, el mínimo de las '+
      f1(RETO.nval,0)+' intervenciones válidas.';
    synth.beep(880,0.10,0.06);
    showToast('✅ <b>Intervención óptima.</b> '+f1(r.nRep,0)+' fugas reparadas a '+
      f1(c.pCons,1)+' barg · '+f1(r.inversion,2)+' € de inversión · '+f1(r.ahorro,2)+
      ' €/año · retorno en '+f1(r.payback,2)+' meses.');
  }else if(r.valida){
    // En este catálogo no hay dos intervenciones válidas que empaten al céntimo
    // —el barrido da tantas clases de coste como válidas en las cinco plantas—, así
    // que toda válida que no sea la óptima es estrictamente más cara y el mensaje
    // puede decirlo sin condicionales que nunca se cumplirían.
    RETO.resuelto=false;
    RETO.msg='Válida, pero no es la más barata de poseer: '+f1(r.coste5,0)+' € frente a '+
      f1(s.coste5,0)+' € (inversión '+f1(r.inversion,0)+' frente a '+f1(s.inversion,0)+
      ', energía '+f1(ANIOS*r.eAnio,0)+' frente a '+f1(ANIOS*s.eAnio,0)+').';
    synth.beep(520,0.09,0.05);

let QORD=[], answered=false;
function buildQuiz(){
  const q=QUIZ[mode];
  QORD=q.opciones.map((o,i)=>i);
  for(let i=QORD.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=QORD[i];QORD[i]=QORD[j];QORD[j]=t; }
  answered=false;
}
function clearDx(){ answered=false; }
function refreshQuestion(){
  const q=QUIZ[mode];
  el('q_text').textContent=q.pregunta;
  el('dxbtns').innerHTML=QORD.map((oi,i)=>'<button class="b" data-i="'+i+'">'+q.opciones[oi].t+'</button>').join('');
  el('dxbtns').querySelectorAll('[data-i]').forEach(b=>{
    b.onclick=()=>answer(Number(b.getAttribute('data-i')));
  });
}
function answer(i){
  if(answered) return;
  answered=true;
  const q=QUIZ[mode], btns=el('dxbtns').querySelectorAll('[data-i]');
  btns.forEach((b,k)=>{
    b.disabled=true;
    const o=q.opciones[QORD[k]];
    if(o.ok) b.classList.add('right');
    else if(k===i) b.classList.add('wrong');
  });
  const o=q.opciones[QORD[i]];
  synth.beep(o.ok?880:200,0.10,0.05);
  showToast((o.ok?'✅ ':'❌ ')+o.why);
}
function quizCorrectIndex(){ return QORD.indexOf(QUIZ[mode].opciones.findIndex(o=>o.ok)); }

function visibleEnEscena(o){
  let n=o;
  while(n){ if(n.visible===false) return false; n=n.parent; }
  return true;
}
pickerFor(scene, S.camera, S.renderer.domElement, hit => {
  const o = hit && hit.object;
  if(!o) return;
  if(o === bmesh){ boardClick(); return; }
  if(!visibleEnEscena(o)) return;
  let n = o, k = null, ud = null;
  while(n && !k){
    if(n.userData && n.userData.key){ k = n.userData.key; ud = n.userData; }
    n = n.parent;
  }
  if(!k || !PICK_INFO[k]) return;
  const inf = PICK_INFO[k](ud);
  if(!inf) return;
  synth.beep(760, 0.05, 0.05);
  showToast('<b>'+inf[0]+'</b> · '+inf[1]);
});

// ===================== 16. RECORRIDO GUIADO =====================
// Cinco bloques, uno por modo, con el mismo hilo: el aire comprimido se paga
// entero, se escape o no. Ninguna cifra de los avisos esta escrita a mano: todas
// se leen del motor en el instante en que se lanza el aviso.
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// Cuantas intervenciones del catalogo tocan la fuga que exige parar maquina, y
// cuantas caen por la ventana de paro. Si los dos numeros coinciden, no es una
// coincidencia: es que reparar esa fuga es incompatible con la planta en marcha.
function censoParo(pk){
  const P=PLANTAS[pk], i=P.fugas.findIndex(F=>F.paro), B=barrM(pk);
  return { i, F:i>=0?P.fugas[i]:null,
    con:i>=0?B.filter(p=>p.rep[i]).length:0,
    malos:B.filter(p=>!p.okParo).length,
    malosSin:i>=0?B.filter(p=>!p.okParo&&!p.rep[i]).length:B.filter(p=>!p.okParo).length,
    validasCon:i>=0?B.filter(p=>p.valida&&p.rep[i]).length:0 };
}
// La fuga no reparada que mas se parece en caudal a otra que si se repara: el par
// que hace ver que el plan no se ordena por caudal.
function parEjemplar(pk,s){
  const P=PLANTAS[pk], b=punto(pk,repCero(pk),s.pCons);   // caudales ANTES de reparar
  let mejor=null;
  P.fugas.forEach((F,i)=>{
    if(!s.rep[i]) return;
    P.fugas.forEach((G,j)=>{
      if(s.rep[j]||i===j) return;
      const d=Math.abs(b.qFug[i]-b.qFug[j]);
      if(!mejor||d<mejor.d) mejor={d,i,j,qi:b.qFug[i],qj:b.qFug[j],Fi:F,Fj:G};
    });
  });
  return mejor;
}

async function runAuto(){
  if(autoRunning) return;
  autoRunning=true;
  const b=el('btnAuto'), rot=b.textContent;
  b.textContent='⏳ Recorriendo…';
  synth.init();synth.resume();clearDx();
  try{
    // --- 1. LA FUGA: el area manda, la presion absoluta acompana
    setMode('fuga');
    ST.pk='taller';ST.rep=repCero('taller');ST.pCons=8.0;ST.fk='f1';
    afterEdit();
    const P0=PLANTAS.taller;
    const iF1=iFuga('taller','f1'), iF5=iFuga('taller','f5');
    const p80=punto('taller',repCero('taller'),8.0);
    const p60=punto('taller',repCero('taller'),6.0);
    showToast('<b>'+P0.ico+' '+P0.rot+'.</b> '+P0.fugas[iF1].rot+', un agujero de '+
      f1(P0.fugas[iF1].d,1)+' mm a '+f1(p80.pCons,1)+' barg. Pierde <b>'+f1(p80.qFug[iF1],1)+
      ' Nl/min</b> y suena a '+f1(dB(p80.qFug[iF1]),1)+' dB. No hace más ruido que un siseo y se lleva '+
      f1(p80.eAnio*p80.qFug[iF1]/p80.qTot,0)+' € al año.');
    await sleep(4400);
    ST.fk='f5';afterEdit();
    showToast('El mismo tubo, el doble de agujero: '+f1(P0.fugas[iF5].d,1)+' mm pierden <b>'+
      f1(p80.qFug[iF5],1)+' Nl/min</b>, exactamente <b>× '+f1(p80.qFug[iF5]/p80.qFug[iF1],4)+
      '</b>. El gasto va con el ÁREA: '+f1(Math.PI*P0.fugas[iF1].d*P0.fugas[iF1].d/4,4)+' mm² frente a '+
      f1(Math.PI*P0.fugas[iF5].d*P0.fugas[iF5].d/4,4)+'. Doblar el diámetro cuadruplica la factura.');
    await sleep(4800);
    ST.fk='f1';ST.pCons=6.0;afterEdit();
    showToast('Y ahora al revés: bajar la consigna de '+f1(p80.pCons,1)+' a '+f1(p60.pCons,1)+
      ' barg sólo baja esa fuga de '+f1(p80.qFug[iF1],1)+' a '+f1(p60.qFug[iF1],1)+
      ' Nl/min, un factor '+f1(p60.qFug[iF1]/p80.qFug[iF1],4)+' = '+f1(6+P_ATM,3)+'/'+f1(8+P_ATM,3)+
      '. El orificio va <b>bloqueado</b> y sólo sabe de presión ABSOLUTA: la regla de tres con el manómetro, '+
      f1(6/8,4)+', se equivoca.');
    await sleep(5000);

    // --- 2. LA RED: la presion se pierde donde nadie mira
    setMode('red');
    ST.pCons=8.0;afterEdit();
    const pr=CUR;
    const zPeor=pr.zonas.reduce((a,z)=>((z.pUtil-z.pMin)<(a.pUtil-a.pMin)?z:a),pr.zonas[0]);
    showToast('<b>La cascada.</b> El compresor descarga a '+f1(pr.pDesc-P_ATM,2)+
      ' barg; el secador se queda '+f1(pr.dpSec,3)+' bar y los '+f1(P0.lTronco,0)+
      ' m de tronco, '+f1(pr.dpTronco,4)+'. Al arranque de los ramales quedan '+f1(pr.pTronco,3)+
      ' barg. Hasta aquí lo paga todo el mundo por igual.');
    await sleep(4600);
    const zRat=pr.zonas.reduce((a,z)=>(Number.isFinite(z.dpTerm)&&z.dpTerm/z.dpRamal>a.dpTerm/a.dpRamal?z:a),pr.zonas[0]);
    showToast('Mira '+zRat.rot.toLowerCase()+': '+f1(zRat.l,0)+' m de ramal de '+f1(zRat.d,1)+
      ' mm pierden '+f1(zRat.dpRamal,4)+' bar, y el terminal —enchufe y manguera, '+f1(zRat.at,1)+
      ' mm² de paso frente a los '+f1(Math.PI*zRat.d*zRat.d/4,1)+' del tubo— se lleva '+
      fin(zRat.dpTerm,4)+', <b>× '+fin(zRat.dpTerm/zRat.dpRamal,1)+
      '</b>. La presión no se pierde en los metros: se pierde en los estrechamientos.');
    await sleep(5200);
    showToast('La más apurada es '+zPeor.rot.toLowerCase()+': pide '+f1(zPeor.pMin,1)+
      ' barg en el punto de uso y le llegan '+fin(zPeor.pUtil,3)+'. '+
      (zPeor.ok?'Aguanta, pero con '+fin(zPeor.pUtil-zPeor.pMin,3)+' bar de margen: cualquier fuga nueva se lo come.'
              :'<b>No llega.</b> Y subir el compresor un bar cuesta el 7 % de la factura.'));
    await sleep(4800);

    // --- 3. LOS ENSAYOS: tres formas de medir, tres resultados
    setMode('ensayo');
    ST.ek='deposito';afterEdit();
    const rep0=repCero('taller');
    const A=ensayoDeposito('taller',rep0,8.0), B2=ensayoCiclo('taller',rep0,8.0),
          U=censoUltra('taller',rep0,8.0);
    showToast('<b>Ensayo A · vaciado del depósito.</b> Se para el compresor, se cierran las llaves de zona y los '+
      f1(P0.vDep,0)+' L tardan '+f1(A.t,0)+' s en caer de '+f1(A.p1,1)+' a '+f1(A.p2,1)+
      ' barg. Declara <b>'+f1(A.qLineal,1)+' Nl/min</b>… y la fuga real de la planta es '+
      f1(U.q,1)+': se queda en el '+pc1(A.qLineal/U.q,0)+'.');
    await sleep(5000);
    showToast('Y no es que calcule mal: contra las '+f1(A.vista,0)+' fugas que SÍ ve —las del tronco— su error es de '+
      pcm(A.sesgo)+', porque la presión cae exponencialmente y la fórmula lineal se queda en la media. El problema es el <b>alcance</b>: las llaves cerradas le esconden '+
      f1(P0.fugas.length-A.vista,0)+' de '+f1(P0.fugas.length,0)+' fugas. Un ensayo puede medir muy bien algo que no es lo que buscas.');
    await sleep(5400);
    ST.ek='ciclo';afterEdit();
    showToast('<b>Ensayo B · ciclos de carga y vacío.</b> Con la planta parada el compresor arranca el '+
      pc1(B2.duty,2)+' del tiempo, así que declara '+f1(B2.qMedido,1)+
      ' Nl/min. Éste sí ve la red entera, pero mide a la presión media del ciclo, '+
      f1(B2.pMed-P_ATM,2)+' barg en vez de '+f1(B2.pCarga,1)+': contra la fuga a consigna se equivoca '+
      pcm(B2.sesgo)+', y contra la real de la planta, '+pcm(B2.qMedido/U.q-1)+
      '. Que aquí acierte es un accidente de dos errores que se cancelan.');
    await sleep(5600);
    ST.ek='ultra';afterEdit();
    const det=U.det.map((d,i)=>({...d,i})).sort((a,x)=>x.q-a.q);
    showToast('<b>Ensayo C · censo ultrasónico.</b> Fuga por fuga, a la presión de trabajo: '+
      f1(U.q,1)+' Nl/min repartidos en '+f1(P0.fugas.length,0)+' puntos. El mayor es '+
      det[0].k.toUpperCase()+' con '+f1(det[0].q,1)+' ('+f1(det[0].db,1)+' dB) y el menor, '+
      det[det.length-1].k.toUpperCase()+' con '+f1(det[det.length-1].q,1)+
      '. Es el único ensayo que dice DÓNDE, y por eso es el único con el que se puede planificar.');
    await sleep(5200);

    // --- 4. EL CATALOGO: bajar la consigna no es gratis
    setMode('catalogo');
    ST.pk='laboratorio';ST.rep=repCero('laboratorio');ST.pCons=8.0;
    ST.fk=PLANTAS.laboratorio.fugas[0].k;afterEdit();
    const PL=PLANTAS.laboratorio, cnL=censoM('laboratorio');
    const l80=punto('laboratorio',repCero('laboratorio'),8.0);
    const l60=punto('laboratorio',repCero('laboratorio'),6.0);
    showToast('<b>'+PL.ico+' '+PL.rot+'.</b> '+f1(cnL.n,0)+' intervenciones ('+
      f1(Math.pow(2,PL.fugas.length),0)+' repartos × '+f1(CONSIGNAS.length,0)+' consignas) y sólo '+
      f1(cnL.val,0)+' cumplen los siete criterios. La capacidad del secador tumba '+
      f1(cnL.tot.okSecado,0)+', y <b>'+f1(cnL.solo.okSecado,0)+
      '</b> de ellas no fallan por nada más.');
    await sleep(5000);
    ST.pCons=6.0;afterEdit();
    const malos60=barrM('laboratorio').filter(p=>!p.okSecado&&p.pCons===6.0).length;
    const malos80=barrM('laboratorio').filter(p=>!p.okSecado&&p.pCons===8.0).length;
    showToast('Y no se reparten al azar: a '+f1(6.0,1)+' barg fallan <b>'+f1(malos60,0)+
      '</b> y a '+f1(8.0,1)+' barg, <b>'+f1(malos80,0)+'</b>. El secador está declarado para '+
      f1(PL.qSecNom,2)+' Nm³/min a '+f1(P_SEC_REF,1)+' barg y su capacidad va con la presión ABSOLUTA: '+
      f1(l60.capSec,3)+' a '+f1(6.0,1)+' frente a '+f1(l80.capSec,3)+' a '+f1(8.0,1)+
      '. El caudal, en cambio, sólo baja de '+f1(l80.qTot/1000,3)+' a '+f1(l60.qTot/1000,3)+'.');

    showToast('Ahí está la trampa de «bajemos un bar para ahorrar»: la energía baja '+
      pcm(l60.potKW/l80.potKW-1)+', sí, pero el aire se hincha, corre más deprisa por el secador y deja de secarse. '+
      'En el taller, con margen de sobra, no falla ni una; aquí, el secador va justo desde el primer día.');
    await sleep(5200);

    // --- 5. EL RETO: lo que decide no es el caudal, es el acceso
    setMode('reto');
    RETO.cfg.pk='taller';retoSolveBuild(true);afterEdit();
    const s=solM('taller'), cp=censoParo('taller');
    showToast('<b>Reto · '+P0.rot+'.</b> De las '+f1(censoM('taller').n,0)+' intervenciones posibles, '+
      f1(RETO.nval,0)+' cumplen los siete criterios. Sólo una es la más barata de <b>poseer</b> a '+
      f1(ANIOS,0)+' años.');
    await sleep(4400);
    if(cp.F){
      showToast('Primero, lo que nadie mira: '+cp.F.rot.toLowerCase()+' ('+cp.F.k.toUpperCase()+
        ') sólo se cambia con la máquina parada, y esta planta autoriza '+f1(P0.ventanaParo,1)+
        ' h de paro. Las <b>'+f1(cp.con,0)+'</b> intervenciones que la tapan son exactamente las <b>'+
        f1(cp.malos,0)+'</b> que caen por ventana de paro'+
        (cp.malosSin===0?' —ni una más—':'')+', y ninguna de ellas es válida ('+
        f1(cp.validasCon,0)+'). La mitad del catálogo eliminada antes de mirar el dinero.');
      await sleep(5600);
    }
    const par=parEjemplar('taller',s);
    if(par){
      showToast('Y por eso el plan no se ordena por caudal: '+par.Fi.k.toUpperCase()+' pierde '+
        f1(par.qi,1)+' Nl/min y se repara; '+par.Fj.k.toUpperCase()+' pierde '+f1(par.qj,1)+
        ' y se deja. Cuestan el mismo aire. Lo que las separa son '+f1(par.Fi.horas,1)+' h '+
        (par.Fi.paro?'con la máquina parada':'en marcha')+' contra '+f1(par.Fj.horas,1)+' h '+
        (par.Fj.paro?'<b>con la máquina parada</b>':'en marcha')+'.');
      await sleep(5400);
    }
    RETO.ejes={rep:s.rep.slice(),pCons:s.pCons};afterEdit();checkReto();
    await sleep(1800);
    showToast('La óptima: <b>'+f1(s.nRep,0)+' fugas</b> ('+bits(s.rep)+') a '+f1(s.pCons,1)+
      ' barg. Inversión '+f1(s.inversion,2)+' €, ahorro '+f1(s.ahorro,2)+' €/año, retorno en '+
      f1(s.payback,2)+' meses y '+f1(s.coste5,0)+' € de coste de propiedad frente a '+
      f1(s.coste5Base,0)+' sin tocar nada: '+pcm(s.coste5/s.coste5Base-1)+
      '. Ocupa '+f1(s.horas,1)+' h de las '+f1(P0.ventana,1)+' de ventana; una fuga más y no cabe.');
    await sleep(5600);
    answer(quizCorrectIndex());
  } finally {
    autoRunning=false;
    el('btnAuto').textContent=rot;
  }
}

// ===================== 17. ANIMACIÓN, EVENTOS Y ARRANQUE =====================
// El unico reloj del laboratorio. paso3D no decide nada: mueve el aire con la
// velocidad que el motor acaba de calcular y pulsa lo que sigue perdiendo.
function paso3D(t){
  const p=CUR; if(!p) return;
  const c=cfgDe(mode);
  // ventilador del compresor: gira con la carga
  if(M3.vent) M3.vent.rotation.x=t*(2.2+6.0*clamp(p.qTot/1000/PLANTAS[p.pk].qComp,0,1));
  // particulas del tronco: velocidad proporcional al caudal que circula
  const vel=0.28+1.35*clamp(p.qTot/2600,0,1.6), L=X_T1-X_T0;
  M3.part.forEach((m,i)=>{
    const u=((i/16)+t*vel/L)%1;
    m.position.x=X_T0+L*u;
    m.material.opacity=0.30+0.45*Math.sin(Math.PI*u);
  });
  // chorros de fuga: laten a un ritmo que crece con el caudal perdido
  gFuga.forEach((g,i)=>{
    const j=g.userData.jet;
    if(!j.visible) return;
    const q=p.qFug[i];
    const w=1.0+0.30*Math.sin(t*(3.0+q/40)+i);
    j.scale.y=clamp(0.4+q/180,0.4,2.6)*w;
    j.position.y=0.22*w;
  });
  // purgas temporizadas: abren un instante cada ciclo, y ese instante es su duty
  const PER=12;                                  // 12 s de reloj = un ciclo de purga
  PLANTAS[p.pk].fugas.forEach((F,i)=>{
    if(F.duty>=1) return;
    if(c.rep[i]||!(p.qFug[i]>0)) return;
    gFuga[i].userData.jet.visible=((t%PER)/PER)<Math.max(F.duty,0.03);
  });
  // halos del censo ultrasónico: parpadean por turnos, del mayor al menor
  if(mode==='ensayo'&&ST.ek==='ultra'){
    const orden=p.qFug.map((q,i)=>({q,i})).sort((a,b)=>b.q-a.q);
    const k=Math.floor(t*1.4)%Math.max(1,orden.length);
    gFuga.forEach((g,i)=>{
      const pos=orden.findIndex(o=>o.i===i);
      g.userData.halo.scale.setScalar(pos===k?1.9:1.0);
      g.userData.halo.material.opacity=pos===k?0.85:0.25;
    });
  }
  // semáforo: el criterio que falla parpadea, los verdes se quedan quietos
  M3.leds.forEach((s,i)=>{
    const ok=p[CRIT[i]];
    s.material.emissiveIntensity=ok?0.9:(0.55+0.85*(0.5+0.5*Math.sin(t*5.0+i)));
  });
}
S.setAnimate(dt=>{
  animT+=dt;
  paso3D(animT);
});

MODES.forEach(m=>{ el('m_'+m).onclick=()=>{ if(!autoRunning) setMode(m); }; });

computa();

  pickKeys:()=>Object.keys(PICK_INFO), pick:(k,ud)=>(PICK_INFO[k]?PICK_INFO[k](ud):null),

  f1, pc1, pcm, fin, NBSP, toast:()=>el('toast').textContent,

};
