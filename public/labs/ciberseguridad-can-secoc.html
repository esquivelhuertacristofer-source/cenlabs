<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Ciberseguridad del bus CAN — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#08161F;--panel:rgba(7,20,28,.88);--line:#21495C;--ink:#EAF4F8;
    --dim:#9BB8C4;--accent:#5BC8FF;--accent2:#A8E2FF;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cD:#4EA8FF;--cC:#FFC23D;--cM:#3DDC97;--cL:#5E6B75;--cA:#FF5468;--cF:#5BC8FF;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#0f2733;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#173748}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#031a20;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#031a20;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#8ad8ff}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#031a20}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#5BC8FF;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f87a0;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f90a8;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#031a20}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .escs{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
  .esc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px;font-size:11.5px;line-height:1.35;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);color:#c4d3e6}
  .esc .rs{font-weight:700;font-size:11px}.esc .rs.ok{color:var(--good)}.esc .rs.mal{color:#ff9a9a}
  .esc .pista{font-size:10.5px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#09121c;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(30,53,80,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,53,80,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f87a0}
  .dk-tit{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#a3bcd6;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c6da;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#0f2733;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfdcec;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  /* ---- el recorrido paso a paso y el aro que señala la pieza ---- */
  .tour{border:1px solid rgba(91,200,255,.38);background:rgba(91,200,255,.06);border-radius:12px;padding:10px 11px;display:flex;flex-direction:column;gap:7px}
  .tour .tn{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .tour .pts{display:flex;gap:5px}.tour .pts i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}.tour .pts i.on{background:var(--accent)}.tour .pts i.ok{background:var(--good)}
  .tour h3{font-size:16px;line-height:1.2}
  .tour .tx{font-size:13px;line-height:1.5;color:#d3e3ea}.tour .tx b{color:#fff}
  .tour .tb{display:flex;gap:6px}.tour .tb .b{flex:1}
  .tour .salta{align-self:flex-end;font-size:11px;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:0;font-family:inherit}
  .foco{position:fixed;z-index:14;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 3px rgba(91,200,255,.55),0 0 24px 6px rgba(91,200,255,.45);pointer-events:none;display:none;animation:pulso 1.5s ease-in-out infinite}
  @keyframes pulso{0%,100%{transform:scale(.88);opacity:.95}50%{transform:scale(1.12);opacity:.55}}
  @media (prefers-reduced-motion:reduce){.foco{animation:none}}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,18,30,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,18,30,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d3e6}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,18,30,.92);border:1px solid rgba(124,196,255,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,18,30,.84);border:1px solid rgba(124,196,255,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .chips{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .chip{font-size:11.5px;line-height:1.35;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--dim)}
  .chip b{color:var(--ink)} .chip small{font-size:10.5px;color:var(--dim)}
  .chip.ok{border-color:rgba(52,211,153,.5)} .chip.ok b{color:var(--good)} .chip.mal{border-color:rgba(244,71,94,.5)} .chip.mal b{color:#ff9aa8}
  .pliego{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:2px}
  .pliego .chip{padding:3px 7px;font-size:11px;line-height:1.3}
  .pliego .chip small{display:block}
  .tabs{display:none}
  .bitley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c6da}
  .bitley i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;background:var(--c)}
  body.m-reto .hud.compacto h2{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}
  body.estrecho.ancho.t-panel .panel>.dk-fig{grid-column:1;grid-row:2}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

/* ============================================================
   LAB — CIBERSEGURIDAD DEL BUS CAN: AUTENTICACIÓN DE MENSAJES Y ATAQUE DE REPRODUCCIÓN
   (Autotrónica · mecanica-152)

   Un bus CAN a 500 kbit/s con cuatro módulos (puerta de enlace, motor, tablero y freno) y una caja de un intruso conectada
   al puerto de diagnóstico. La puerta de enlace manda al freno la orden «frenar» cada T ms. Tú eliges cuántos bits de FIRMA
   (MAC truncado) y de VENTANA de contador protegen cada trama de 64 bits, y cada cuánto se envía. La trama real (CRC-15,
   relleno de bits), la carga del bus, la probabilidad de adivinar la firma y la verificación con contador son un único
   modelo, en un bloque puro que un script de Node extrae TAL CUAL y verifica.
   MODELO DIDÁCTICO, NO UNA IMPLEMENTACIÓN DE SecOC: la «firma» es una mezcla de bits sin valor criptográfico.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO='\u202F';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }



/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos marcas— y lo prueba:
   lo que se prueba es lo que corre. */
/* FISICA:INICIO */
const DOSPI=Math.PI*2;
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);

/* ---------- 1. La trama CAN: bits reales, CRC-15 y relleno de bits ---------- */
const BUS={bps:500000, tbit:1/500000};            // 500 kbit/s → 2 µs por bit
const CAN_ID_FRENO=0x0A0;                          // identificador de 11 bits de la orden de frenado
/** CRC-15 de CAN (polinomio 0x4599, valor inicial 0) sobre una lista de bits. */
function crc15(bits){ let crc=0; for(const b of bits){ const nx=((crc>>14)&1)^b; crc=(crc<<1)&0x7FFF; if(nx) crc^=0x4599; } return crc; }
const aBits=(v,n)=>{ const o=[]; for(let i=n-1;i>=0;i--) o.push((v>>>i)&1); return o; };
/** Bits de SOF a CRC de una trama de datos CAN 2.0A (11 bits de ID) con n bytes: es la zona que se rellena. */
function bitsTrama(id,bytes){
  const h=[0,...aBits(id,11),0,0,0,...aBits(bytes.length,4)];
  for(const B of bytes) h.push(...aBits(B,8));
  return h.concat(aBits(crc15(h),15));
}
/** Relleno de bits: tras cinco bits iguales seguidos se inserta uno de signo contrario (el insertado también cuenta en la racha). */
function rellena(bits){
  const o=[]; let ult=-1, racha=0;
  for(const b of bits){ o.push(b); if(b===ult) racha++; else{ ult=b; racha=1; }
    if(racha===5){ const s=1-b; o.push(s); ult=s; racha=1; } }
  return o;
}
/** Bits que ocupa en el cable una trama real: zona rellenada + delimitador de CRC (1) + ACK (2) + fin de trama (7) + espacio entre tramas (3). */
const bitsEnCable=(id,bytes)=>rellena(bitsTrama(id,bytes)).length+13;
/** Cota del PEOR caso con relleno (Davis et al.): 34 + 8n + 13 + ⌊(33 + 8n)/4⌋ bits. Con 8 bytes: 135 bits = 270 µs. */
const bitsPeor=n=>34+8*n+13+Math.floor((33+8*n)/4);
const bitsMin=n=>34+8*n+13;
const tTrama=n=>bitsPeor(n)*BUS.tbit;              // s

/* ---------- 2. El mensaje de frenado y el reparto de sus 64 bits ---------- */
const MSG={D:16, C:8, ID:CAN_ID_FRENO};            // 16 bits de orden de frenado · 8 bits de contador que viajan
const usado=m=>MSG.D+MSG.C+m;                      // bits ocupados (datos + contador + firma)
const libres=m=>64-usado(m);                       // negativo = no cabe
const dlcDe=m=>Math.max(1,Math.min(8,Math.ceil(usado(m)/8)));

/* ---------- 3. Carga del bus y retardo ---------- */
const FONDO=[[10,4],[20,6],[50,8],[100,10]];       // [periodo ms, nº de mensajes de 8 bytes] del resto del coche
const U_FONDO=FONDO.reduce((a,[T,n])=>a+n*tTrama(8)/(T/1000),0);
const cargaFreno=(T,m)=>tTrama(dlcDe(m))/(T/1000);
const carga=(T,m)=>U_FONDO+cargaFreno(T,m);
const tMac=m=>30e-6+2e-6*m;                        // tiempo de calcular/comprobar la firma en un módulo (didáctico)
/** Retardo del peor caso de la orden: esperar al siguiente envío (T) + ser bloqueada por una trama de 8 bytes + su propia trama + firmar y comprobar. */
const retardo=(T,m)=>T/1000+tTrama(8)+tTrama(dlcDe(m))+2*tMac(m);   // s

/* ---------- 4. Seguridad: adivinar la firma, repetir, perder sincronía ---------- */
/** Probabilidad de que UN intento al azar acierte una firma truncada de m bits: 2^−m. */
const pIntento=m=>Math.pow(2,-m);
/** Probabilidad de que algún intento acierte entre N: 1 − (1 − 2^−m)^N (calculada sin perder cifras). */
function pForja(m,N){ const p=pIntento(m); if(p>=1) return 1; return -Math.expm1(N*Math.log1p(-p)); }
const intentosMedios=m=>Math.pow(2,m);             // media de la geométrica: 1/p
/** Edad máxima de una orden vieja que el módulo aceptaría: W mensajes de retraso a un mensaje cada T ms. */
const edadMax=(T,W)=>W*T;                          // ms
/** Desincronizaciones por hora: se pierden W mensajes seguidos (cada uno con prob. q) y el contador sale de la ventana. */
const desincPorHora=(T,W,q)=>(3.6e6/T)*(1-q)*Math.pow(q,W);

/* ---------- 5. Firma didáctica (NO es criptografía) y verificación con ventana de contador ---------- */
/** Mezcla de bits tipo murmur3: sirve para ver cómo se comporta una firma truncada, no protege nada de verdad. */
function mezcla32(h){ h^=h>>>16; h=Math.imul(h,0x85ebca6b); h^=h>>>13; h=Math.imul(h,0xc2b2ae35); h^=h>>>16; return h>>>0; }
function macCompleto(clave,datos,fv){
  let h1=mezcla32((clave^0x9e3779b9)>>>0), h2=mezcla32((clave^0x85ebca77)>>>0);
  for(const w of [datos>>>0,(fv>>>0),Math.floor(fv/4294967296)>>>0]){ h1=mezcla32((h1^w)+Math.imul(h2,0x27d4eb2f)>>>0); h2=mezcla32((h2+w)^Math.imul(h1,0x165667b1)>>>0); }
  return [h1>>>0,h2>>>0];
}
/** Firma truncada a m bits (0 ≤ m ≤ 40): los m bits de más peso de una mezcla de 64. */
function macTrunc(clave,datos,fv,m){
  if(m<=0) return 0; const [h1,h2]=macCompleto(clave,datos,fv);
  if(m<=32) return h1>>>(32-m);
  const extra=m-32; return h1*Math.pow(2,extra)+(h2>>>(32-extra));
}
const CLAVE=0x5ec0c0de;
/** Emisor: lleva un contador largo (invisible) y envía sólo sus 8 bits bajos. */
function nuevoEmisor(){ return {fv:0}; }
function emite(em,datos,m){ em.fv++; return {datos,cnt:em.fv&255,mac:macTrunc(CLAVE,datos,em.fv,m),fv:em.fv}; }
/** Receptor: guarda el último contador largo aceptado; acepta si el avance está en 1..W y la firma cuadra con ese contador. */
function nuevoReceptor(){ return {ult:0}; }
function recibe(rx,tr,m,W){
  const d=(tr.cnt-(rx.ult&255)+256)&255;
  if(d<1||d>W) return {ok:false,motivo:'contador'};
  const fv=rx.ult+d;
  if(macTrunc(CLAVE,tr.datos,fv,m)!==tr.mac) return {ok:false,motivo:'firma'};
  rx.ult=fv; return {ok:true,motivo:'',avance:d};
}

/* ---------- 6. Los escenarios del reto y su pliego ---------- */
const ESCENARIOS=[
  {id:'taller',  nombre:'Visita al taller',   N:20000,  edad:80, q:0.03, texto:'El intruso prueba 20 000 firmas al azar'},
  {id:'autopista',nombre:'Autopista',          N:300000, edad:70, q:0.03, texto:'El intruso prueba 300 000 firmas al azar'},
];
const LIM={pForja:1e-3, carga:0.30, libres:8, retardo:0.012, desinc:1e-3};   // desinc: por hora de marcha (1 cada 1 000 h)
/** Evalúa un diseño (m, W, T) contra un escenario: todas las cifras y los cinco criterios. */
function evalua(m,W,T,E){
  const r={m,W,T,pF:pForja(m,E.N),edad:edadMax(T,W),des:desincPorHora(T,W,E.q),U:carga(T,m),lib:libres(m),ret:retardo(T,m)};
  r.c={forja:r.pF<=LIM.pForja, repite:r.edad<=E.edad, sync:r.des<=LIM.desinc, bus:r.U<=LIM.carga, sitio:r.lib>=LIM.libres, lat:r.ret<=LIM.retardo};
  r.ok=r.c.forja&&r.c.repite&&r.c.sync&&r.c.bus&&r.c.sitio&&r.c.lat; return r;
}
const RANGO={m:[0,40],W:[1,40],T:[2,20]};
/** Lista todas las combinaciones válidas de un escenario (la ventana buscada es interior en los tres mandos). */
function barrido(E){
  const out=[]; for(let m=RANGO.m[0];m<=RANGO.m[1];m++) for(let W=RANGO.W[0];W<=RANGO.W[1];W++) for(let T=RANGO.T[0];T<=RANGO.T[1];T++){ if(evalua(m,W,T,E).ok) out.push([m,W,T]); }
  return out;
}
/** Valores de UN mando que cumplen todo con los otros dos fijos: la ventana que se enseña tras validar. */
function ventanaDe(eje,m,W,T,E){
  const v={m,W,T}, [a,b]=RANGO[eje]; let lo=null, hi=null;
  for(let x=a;x<=b;x++){ v[eje]=x; if(evalua(v.m,v.W,v.T,E).ok){ if(lo===null) lo=x; hi=x; } }
  return lo===null?null:[lo,hi];
}
/* FISICA:FIN */



/* ===================== 2. ESCENA, CÁMARA, LUZ ===================== */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);

function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h||w;return c;}

const LUZ={};

/* ===================== 3. CALIDAD ===================== */
const CAL={nivel:'alta',motivo:''};
(function(){

function texPlataforma(){
  const W=512,c=cv(W),x=c.getContext('2d');
  const g=x.createRadialGradient(W*0.45,W*0.4,W*0.05,W/2,W/2,W*0.75); g.addColorStop(0,'#2b4654'); g.addColorStop(1,'#14262f');
  x.fillStyle=g; x.fillRect(0,0,W,W);
  x.strokeStyle='rgba(120,210,226,0.10)'; x.lineWidth=1;
  for(let i=0;i<=16;i++){ const p=i*W/16; x.beginPath(); x.moveTo(p,0); x.lineTo(p,W); x.moveTo(0,p); x.lineTo(W,p); x.stroke(); }
  x.strokeStyle='rgba(120,210,226,0.22)'; x.lineWidth=2;
  for(let i=0;i<=4;i++){ const p=i*W/4; x.beginPath(); x.moveTo(p,0); x.lineTo(p,W); x.moveTo(0,p); x.lineTo(W,p); x.stroke(); }
  return tex(c,{srgb:true});
}
function texRadial(c0,c1){ const W=256,c=cv(W),x=c.getContext('2d'); const g=x.createRadialGradient(W/2,W/2,0,W/2,W/2,W/2); g.addColorStop(0,c0); g.addColorStop(1,c1); x.fillStyle=g; x.fillRect(0,0,W,W); const t=tex(c,{srgb:true}); t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping; return t; }

/** Junta una pieza hecha de muchas mallas en una malla por material: así una bobina con 40 piezas cuesta pocas llamadas. */
function fusiona(grupo){
  grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map();
  grupo.traverse(o=>{ if(!o.isMesh) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(), m=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);
    g.applyMatrix4(m);
    if(!g.attributes.uv){ g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2)); }
    const k=o.material; if(!por.has(k)) por.set(k,[]); por.get(k).push(g); });
  const out=new THREE.Group();
  for(const [mat,gs] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count;
      pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry();
    G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const me=new THREE.Mesh(G,mat); me.castShadow=!mat.transparent; me.receiveShadow=true; out.add(me);
  }
  return out;
}

/** Funde las mallas ESTÁTICAS de un grupo en una malla por material (y por «clave» de pieza, para que el rótulo y el
 *  tooltip sigan sabiendo de qué pieza son). Las que se mueven, las instanciadas, las de material múltiple y el fondo se
 *  quedan como están. */
function fusionaPartes(grupo,excluir){
  excluir=excluir||[]; grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map(), viejas=[];
  const fuera=o=>{ for(let p=o;p&&p!==grupo;p=p.parent) if(excluir.includes(p)||(p.userData&&p.userData.fondo===true)) return true; return false; };
  grupo.traverse(o=>{ if(!o.isMesh||o.isInstancedMesh||fuera(o)||o.userData.noFusion) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(); g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld));
    if(!g.attributes.uv) g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
    const clave=o.userData.clave||'', ro=o.renderOrder||0;
    const mete=(mat,geo)=>{ const k=mat.uuid+'|'+clave; if(!por.has(k)) por.set(k,{mat,clave,gs:[],ro}); por.get(k).gs.push(geo); };
    if(Array.isArray(o.material)){
      const grupos=g.groups&&g.groups.length?g.groups:[{start:0,count:g.attributes.position.count,materialIndex:0}];
      for(const gr of grupos){ const mat=o.material[gr.materialIndex]; if(!mat) continue; const sub=new THREE.BufferGeometry();
        for(const nom of ['position','normal','uv']){ const at=g.attributes[nom]; sub.setAttribute(nom,new THREE.BufferAttribute(at.array.slice(gr.start*at.itemSize,(gr.start+gr.count)*at.itemSize),at.itemSize)); }
        mete(mat,sub); }
      g.dispose();
    } else mete(o.material,g);
    viejas.push(o); });
  for(const o of viejas){ o.parent.remove(o); }
  for(const [,{mat,clave,gs,ro}] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count; pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry(); G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const me=new THREE.Mesh(G,mat); me.castShadow=!mat.transparent&&!(mat.blending===THREE.AdditiveBlending); me.receiveShadow=true; me.renderOrder=ro; if(clave) me.userData.clave=clave; grupo.add(me);
  }
}

   tiempo de una PASADA de 13 s (en cámara lenta ×1/25: el periodo T de la orden se ve 25 veces más largo) y avanza dt·velocidad;

   veredictos (aceptada / rechazada) los da la MISMA función de verificación que prueba el script de Node. */

/** Una pasada del bus: las órdenes de la puerta de enlace al freno, las pérdidas por ruido, y los cuatro ataques del intruso,
 *  todos pasados por la verificación REAL (contador + firma truncada) en el orden en que llegan al freno. */
function simulaCiclo(p){
  const {m,W,T}=p, E=escDe(p.esc), Tv=T*SLOW/1000, R=rng32(1234+m*7+W*13+T*101);
  const em=nuevoEmisor(), rx=nuevoReceptor(); em.fv=70000; rx.ult=70000;

    const t0=0.1+i*Tv; if(t0>CYC-0.2) break;

  }

  // bloquear tres órdenes seguidas (el ruido o el propio intruso), que es lo que pone a prueba la ventana
  ev.push({tipo:'rep',sub:'viejo',ruta:'int',t0:3.4,t1:3.4+flightDe('int'),fab:(rx)=>hist[0]});

  for(const e of ev){

  for(const im of IM_SEG){ im.instanceMatrix.needsUpdate=true; if(im.instanceColor) im.instanceColor.needsUpdate=true; im.count=NFR; }
  // ---- la última trama que llegó al freno: su veredicto (anillo + luz + pinza) ----
  let ult=null; for(const e of run.ev){ if(e.t1>t) break; if(e.v!=='perdida') ult=e; }
  // el veredicto del intruso aparece 0,9 s; si se acaba la pasada, el último se olvida
  const edad=ult?t-ult.t1:99, vivo=edad<1.1;
  let apl=0, colAnillo=NEUTRO_RING, lamp=M2.lFRE;
  if(ult&&vivo){ const k=oculta?'neutro':ult.v; colAnillo=_col.set(V_COL[k]||V_COL.neutro);
    if(!oculta&&ult.v==='frenada') apl=1; }
  M2.anillo.color.copy(colAnillo); const f=vivo?1-edad/1.1:0; M2.anillo.opacity=(ult&&ult.tipo==='legit'?0.30:0.9)*f*f;
  ANILLO.scale.setScalar(0.5+edad*0.9); ANILLO.visible=vivo;
  const lc=ult&&vivo?(oculta?V_COL.neutro:V_COL[ult.v]):'#6b7a84'; lamp.color.set(lc);
  // la pinza aprieta y el disco se calienta mientras dura el efecto de las tramas FALSAS aceptadas: depende sólo del reloj, no del cuadro

  let apr=0, cal=0;
  for(const e of run.ev){ if(e.tipo==='legit'||e.v!=='frenada'||e.t1>t) continue; const a=t-e.t1; if(a>6) continue;
    apr=Math.max(apr,sm01(a/0.25)*(1-sm01((a-1.8)/0.7))); cal=Math.max(cal,sm01(a/0.7)*(1-sm01((a-2.2)/2.6))); }

  FREN.w=3.0*(1-0.93*FREN.apr); DISCO.rotation.z-=FREN.w*dtS;
  M2.disco.emissiveIntensity=0.7*FREN.cal; M2.discoOscuro.emissiveIntensity=0.5*FREN.cal;
  const pz=0.085-0.0135*FREN.apr; PASTILLAS[0].position.z=pz; PASTILLAS[1].position.z=-pz;
  // las otras luces: la puerta de enlace parpadea al emitir; el intruso pulsa; el motor y el tablero siguen vivos
  const ahora=performance.now()*0.001;
  M2.lGW.color.set('#34d399').multiplyScalar(0.55+0.45*Math.abs(Math.sin(t*Math.PI/Math.max(0.05,run.Tv))));
  M2.lMOT.color.set('#34d399').multiplyScalar(0.6+0.4*Math.abs(Math.sin(t*12.6)));
  M2.lTAB.color.set('#34d399').multiplyScalar(0.6+0.4*Math.abs(Math.sin(t*6.3+1)));
  const ataca=run.ev.some(e=>e.tipo!=='legit'&&t>=e.t0&&t<=e.t1);
  const jamActivo=t>=0.1+run.iJ*run.Tv&&t<=0.1+(run.iJ+run.J)*run.Tv+1.2;
  M2.lINT.color.set('#ff3b52').multiplyScalar((ataca||jamActivo?0.7+0.3*Math.sin(ahora*14):0.35));
  ALERTA.rotation.y+=dtS*1.1; ALERTA.position.y=0.80+0.04*Math.sin(ahora*2.2); ANTENA.rotation.z=0.12*Math.sin(ahora*(jamActivo?9:2));

  // ---- el motor y el cuadro de instrumentos ----
  VOLANTE.rotation.x+=dtS*(5.5+2*Math.sin(t*0.7)); AGUJAS[0].rotation.y=rad(-20+55*(0.5+0.5*Math.sin(t*0.9))); AGUJAS[1].rotation.y=rad(-10+40*(0.5+0.5*Math.sin(t*0.5+1.4)));
  SIM.e={t,ult,edad,vivo,apr:FREN.apr,ataca,jamActivo,n};
}

/* ===================== 14. CÁMARAS =====================
   La escena se encuadra con el hueco que dejan la guía y el dock: la cámara se aleja lo justo para que la caja del
   «objeto» (ancho × alto en metros) quepa entera en ese hueco, y la proyección se desplaza para centrarla en él.
   Además el objeto nunca pasa del 70 % del alto del lienzo. */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}
const VISTAS={
  todo:{dir:V3(-0.10,1.40,1),anc:()=>V3(0.0,0.30,0.16),toff:V3(0,0,0),obj:()=>({w:4.0,h:3.15}),fov:34,tope:0.74},
  bus:{dir:V3(-0.10,1.10,1),anc:()=>V3(0.0,0.30,0.0),toff:V3(0,0,0),obj:()=>({w:4.0,h:2.4}),fov:34,tope:0.68},
  trama:{dir:V3(-0.05,1.0,1),anc:()=>V3(0.0,0.42,1.10),toff:V3(0,0,0),obj:()=>({w:2.3,h:1.95}),fov:34,tope:0.70},
  freno:{dir:V3(-0.35,0.62,1),anc:()=>V3(1.35,0.40,0.95),toff:V3(0,0,0),obj:()=>({w:2.5,h:2.1}),fov:34,tope:0.70},
  intruso:{dir:V3(0.35,0.80,1),anc:()=>V3(-1.30,0.38,0.55),toff:V3(0,0,0),obj:()=>({w:2.5,h:2.1}),fov:34,tope:0.70},
};
const CAM={off:V3(-1.5,1.2,6),toff:V3(0,0,0),auto:true,previo:null,k:1,dur:1};
function fovVista(v){ return innerWidth<innerHeight*0.9?46:VISTAS[v].fov; }
function distanciaFit(w,h,fov,tope){
  const Hu=huecoLibre(), W=innerWidth, Hh=innerHeight, tv=Math.tan(fov*Math.PI/360), th=tv*(W/Hh);
  const wF=Math.max(80,Hu.x1-Hu.x0)/W, hF=Math.max(80,Hu.y1-Hu.y0)/Hh;
  const D=1.06*Math.max(w/(2*th*wF),h/(2*tv*hF));
  return Math.max(D,h/(2*tv*(tope||0.66)));
}
function ofsDeseado(v){
  const V=VISTAS[v], o=V.obj(), fov=fovVista(v), D=distanciaFit(o.w,o.h,fov,V.tope);
  return {off:V.dir.clone().normalize().multiplyScalar(D),toff:V.toff.clone(),fov};
}
function ponVista(v,dur){
  EST.vista=v; CAM.auto=true; CAM.dur=dur===undefined?1.0:dur;

  if(CAM.dur<=0.01){ const A=VISTAS[v].anc(), d=ofsDeseado(v); CAM.off.copy(d.off); CAM.toff.copy(d.toff); camera.fov=d.fov; camera.updateProjectionMatrix();
    camera.position.copy(A).add(CAM.off); controls.target.copy(A).add(CAM.toff); CAM.previo=A.clone(); }
}
function pasaCam(dt){
  const V=VISTAS[EST.vista], P=V.anc();
  if(CAM.auto){
    const d=ofsDeseado(EST.vista), k=1-Math.exp(-dt/Math.max(0.05,(CAM.dur||1)*0.30));

const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
const supe=n=>String(n).split('').map(c=>SUP[c]||c).join('');
/** «1 de 1 700» (o un porcentaje si es probable): la probabilidad dicha como se dice en la calle. */
function fUnoDe(p){
  if(p>=0.5) return fN(p*100,p>=0.995?0:1)+' %';
  const x=1/p; if(x<1e7) return '1 de '+fN(Math.round(x));
  const e=Math.floor(Math.log10(x)), mant=x/Math.pow(10,e); return '1 de '+fN(mant,1)+'×10'+supe(e);
}
function fFallos(des){
  if(des>=1) return fN(des,des<10?1:0)+' por hora';
  const h=1/des; if(h>=1e9) return 'ninguno en la práctica'; if(h<1e7) return '1 cada '+fN(Math.round(h))+' h';
  const e=Math.floor(Math.log10(h)), mant=h/Math.pow(10,e); return '1 cada '+fN(mant,1)+'×10'+supe(e)+' h';
}
/** Cifra corta para la casilla del dock: «130 000 h» entre fallos, o «10 476 por hora». */
function fFallosCorto(des){ if(des>=1) return fN(des,des<10?1:0)+'<small> /h</small>'; const h=1/des; if(h<1e5) return fN(Math.round(h))+'<small> h</small>'; if(h<1e9) return fN(Math.round(h/1000))+' mil<small> h</small>'; return '&gt; 10'+supe(9)+'<small> h</small>'; }
function fFallosMil(des){ if(des>=1) return fN(des,des<10?1:0)+' por h'; const h=1/des; if(h<1e5) return '1 cada '+fN(Math.round(h))+' h'; if(h<1e9) return '1 cada '+fN(Math.round(h/1000))+' mil h'; return 'ninguno'; }

      x.fillStyle=llegó?((e.v==='ok'||oc)?CV.ok:CV.rech):'rgba(88,214,255,0.22)'; const h=llegó?9:5; x.fillRect(px-0.9,yL-h/2,1.8,h);

  const k=claveDe(hitBajo(e.clientX,e.clientY)), t=k&&INFO[k]; if(!t) return;
  TIP.textContent=t; TIP.style.display='block';
  TIP.style.left=Math.max(8,Math.min(innerWidth-TIP.offsetWidth-8,e.clientX-TIP.offsetWidth/2))+'px'; TIP.style.top=Math.max(8,e.clientY-TIP.offsetHeight-18)+'px';
  clearTimeout(tipT); tipT=setTimeout(()=>{ TIP.style.display='none'; },2600);
});

/* ===================== 20. DISPOSICIÓN: ANCHO, ESTRECHO, MÓVIL =====================
   Si no caben guía, escena y dock lado a lado (el marco de la plataforma, una tableta), la escena va arriba
   y guía e instrumentos comparten una hoja con pestañas abajo. */
function disposicion(){
  const W=innerWidth, b=document.body;
  const estrecho=W<1080, movil=W<640;
  b.classList.toggle('estrecho',estrecho); b.classList.toggle('movil',movil); b.classList.toggle('ancho',estrecho&&!movil);
  if(estrecho){ if(!b.classList.contains('t-hud')&&!b.classList.contains('t-panel')) b.classList.add('t-hud'); ajustaHoja(); }
  el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('on',b.classList.contains('t-'+t.dataset.tab)));
}
function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.40:0.43),240,450));
  let hh=base; const hud=el('hud');
  if(movil&&b.classList.contains('t-panel')) hh=Math.round(clamp(H*0.55,240,540));
  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;
    hh=Math.round(clamp(pide,240,Math.max(base,H*(movil?0.45:0.56)))); }
  const ant=parseFloat(b.style.getPropertyValue('--hojaH'))||0;
  if(Math.abs(ant-hh)>1){ b.style.setProperty('--hojaH',hh+'px'); colocaBarras(); centraEnHueco(); }
}
el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.onclick=()=>{ const b=document.body; b.classList.remove('t-hud','t-panel'); b.classList.add('t-'+t.dataset.tab); disposicion(); centraEnHueco(); });

   x:'También lleva un <b>contador</b> (cuadros amarillos) que sube de uno en uno. Una trama repetida trae un número viejo y se descarta. La <b>ventana</b> son los números adelantados que acepta, por si se pierde alguna orden.'},
  {t:'El sitio es limitado',vista:'trama',foco:()=>V3(0.0,0.66,1.0),par:{esc:'taller',m:32,W:7,T:10},t0:1.0,

/* ===================== 22. EL RETO: CALCULA, AJUSTA, DIAGNOSTICA =====================
   Tres fases: 1 · Calcula (la probabilidad de que un intruso acierte una firma de m bits en N intentos), 2 · Ajusta (el largo de
   la firma, la ventana del contador y el periodo, para cumplir SEIS requisitos a la vez: la defensa sólo aparece al validar y la
   ventana es INTERIOR en los tres mandos) y 3 · Diagnostica (¿por qué falla esta defensa?, sólo con lo que se ve en el dock).
   Cierra con un quiz de tres preguntas. */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETOS={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'calcula',iniciado:false,dxOk:false,r1:null,r2:null,dx:null,orden:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0};

/* ---------- Fase 1 · Calcula la probabilidad de acertar ---------- */
const CASOS_P=[[16,1000],[20,10000],[18,2000],[24,100000],[22,30000]];                 // [bits de firma, intentos]
function sorteaCaso1(){ const p=GUIA.r1&&GUIA.r1.m; let c; do{ c=pickOne(CASOS_P); }while(GUIA.r1&&c[0]===p);
  GUIA.r1={m:c[0],N:c[1],ans:100*pForja(c[0],c[1])}; }
function numeroDe(txt){ const raw=String(txt||'').trim().replace(/[\s  %]/g,'').replace(',','.'); return parseFloat(raw); }
function checkCalcula(){
  const v=numeroDe((el('ansV')||{}).value), r=GUIA.r1, ok=r.ans;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe el porcentaje (con coma o punto decimal).'); return; }
  RETOS.intentos++;
  if(Math.abs(v-ok)<=Math.max(0.01,0.07*ok)){
    RETOS.fallos1=0; sonido.bien();
    feedback('good','¡Correcto! ✓',`Hay 2<sup>${r.m}</sup> = ${fN(Math.pow(2,r.m))} firmas posibles y sólo una vale: cada intento acierta 1 de ${fN(Math.pow(2,r.m))}. Con ${fN(r.N)} intentos: ${fN(r.N)} ÷ ${fN(Math.pow(2,r.m))} ≈ <b>${fN(ok,2)} %</b>. Cada bit más de firma <b>divide por dos</b> esa probabilidad.`,true);
    paso('ajusta'); prepararAjusta();
  } else {
    RETOS.fallos1++; sonido.mal(); const d=v>ok?'alto':'bajo';
    if(RETOS.fallos1>=3){ RETOS.fallos1=0; RETOS.resiembras++; sorteaCaso1(); feedback('bad','Tres intentos fallidos','Cambia el caso. Recuerda: con <i>m</i> bits hay 2<sup><i>m</i></sup> firmas y sólo una acierta; con <i>N</i> intentos la probabilidad es más o menos <i>N</i> ÷ 2<sup><i>m</i></sup>.'); reiniciaCalculo(); pintaHUD(); }
    else { feedback('bad','Revisa el cálculo',`Tu resultado (${fN(v,2)} %) está ${d}. Cuenta cuántas firmas posibles hay (2 elevado a los bits) y cuántas pruebas el intruso. (intentos fallidos: ${RETOS.fallos1}/3)`); const t=el('d_try'); if(t) t.textContent=RETOS.fallos1; }
  }
}

/* ---------- Fase 2 · Ajusta la firma, la ventana y el periodo ---------- */
function prepararAjusta(){
  let e; do{ e=pickOne(ESCENARIOS); }while(GUIA.r2&&ESCENARIOS.length>1&&e.id===GUIA.r2.esc.id&&RETOS.resiembras>0);
  GUIA.r2={esc:e,m:16,W:3,T:15,validado:false,res:null,intentos:0};
  reiniciaCalculo(); pintaHUD();
}
function validarAjusta(){
  const r=GUIA.r2; if(!r) return;
  const E=r.esc, R=evalua(r.m,r.W,r.T,E); r.res=R; r.validado=true; r.intentos++; RETOS.intentos++;
  reiniciaCalculo();
  const cifras=`El intruso acierta <b>${fUnoDe(R.pF)}</b> (mín. 1 de ${fN(1/LIM.pForja)}) · tiempo ciego <b>${fMs(R.edad)}</b> (máx. ${fMs(E.edad)}) · fallos propios <b>${fFallos(R.des)}</b> · bus <b>${fN(R.U*100,1)} %</b> (máx. ${fN(LIM.carga*100)}) · libres <b>${fN(R.lib)} bits</b> (mín. ${LIM.libres}) · retardo <b>${fMs(R.ret*1000,1)}</b> (máx. ${fMs(LIM.retardo*1000)}).`;
  if(R.ok){
    RETOS.fallos2=0; sonido.bien();
    const vm=ventanaDe('m',r.m,r.W,r.T,E), vw=ventanaDe('W',r.m,r.W,r.T,E), vt=ventanaDe('T',r.m,r.W,r.T,E);
    feedback('good','¡Lo conseguiste! ✓',`${cifras} Con los otros dos mandos así, servían <b>firmas de ${fN(vm[0])} a ${fN(vm[1])} bits</b>, <b>ventanas de ${fN(vw[0])} a ${fN(vw[1])}</b> y <b>periodos de ${fN(vt[0])} a ${fN(vt[1])} ms</b>: por debajo falla un requisito y por encima otro. La solución está en el interior, no en los extremos.`,false,16000);
    pintaHUD(); paso('diag'); iniciaDiag();
  } else {
    RETOS.fallos2++; sonido.mal(); const c=R.c; let msg=cifras+' ';
    if(!c.forja) msg+='La <b>firma es corta</b>: el intruso, probando al azar, acierta demasiado pronto. ';
    if(!c.sitio) msg+='La firma es tan larga que <b>no quedan 8 bits libres</b> en la trama. ';
    if(!c.repite) msg+='La <b>ventana por el periodo</b> deja al freno demasiado tiempo «ciego»: acórtalos. ';
    if(!c.sync) msg+='Con ruido se pierden varias órdenes seguidas y, si la <b>ventana es estrecha</b>, el freno pierde la sincronía. ';
    if(!c.bus) msg+='La orden se manda tan seguido que <b>ocupa demasiado bus</b>. ';
    if(!c.lat) msg+='La orden se manda tan despacio que su <b>retardo</b> pasa el tope. ';
    if(RETOS.fallos2>=5){ RETOS.fallos2=0; RETOS.resiembras++; feedback('bad','Cinco validaciones sin lograrlo',msg+'Cambia el escenario.',true); prepararAjusta(); }
    else { feedback('bad','Todavía no',msg+`(validaciones fallidas: ${RETOS.fallos2}/5)`,true); pintaHUD(); }
  }
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const CASOS_DX=[
  {k:'sinfirma',m:0,W:7,T:10},
  {k:'corta',m:12,W:7,T:10},
  {k:'ancha',m:28,W:40,T:10},
  {k:'estrecha',m:28,W:1,T:10},
];
const NOMBRE_DX={sinfirma:'No hay firma',corta:'La firma es demasiado corta',ancha:'La ventana es demasiado ancha',estrecha:'La ventana es demasiado estrecha'};
function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.k; let c; do{ c=pickOne(CASOS_DX); }while(c.k===p);
  GUIA.dx=c; GUIA.dxOk=false; GUIA.orden=barajar(CASOS_DX.map(x=>x.k));
  reiniciaCalculo(); pintaHUD(); pintaDockFijo();
}
function diagnostica(k){
  if(!GUIA.dx||GUIA.dxOk) return; RETOS.intentos++;
  if(k===GUIA.dx.k){
    GUIA.dxOk=true; RETOS.fallos3=0; sonido.bien();
    feedback('good','Diagnóstico correcto ✓',explicaDx(GUIA.dx.k),false,12000);
    reiniciaCalculo(); pintaDockFijo(); paso('quiz'); iniciaQuiz();
  } else {
    RETOS.fallos3++; sonido.mal();
    if(RETOS.fallos3>=3){ RETOS.fallos3=0; RETOS.resiembras++; feedback('bad','Tres intentos fallidos','Es otro caso: mira cuántas tramas falsas se aceptan, qué tan vieja es la orden que se acepta y cuántas órdenes propias se rechazan.',true); iniciaDiag(); }
    else { feedback('bad','No es ese',noEs(k)+` (intentos fallidos: ${RETOS.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(k){
  if(k==='sinfirma') return 'Sin firma, cualquier trama con un contador en la ventana se acepta: de 20 000 intentos pasan los 20 000. El contador solo frena las repeticiones viejas, no a quien inventa mensajes.';
  if(k==='corta') return 'Con 12 bits sólo hay 4 096 firmas: de 20 000 intentos al azar pasan unos 5. El resto del diseño está bien; lo que falla es el largo de la firma.';
  if(k==='ancha') return 'Con una ventana de 40 mensajes a 10 ms, el freno puede quedar 400 ms sin órdenes válidas y seguir aceptando: a 100 km/h son 11 m. Las firmas y los fallos propios están bien.';
  return 'Con ventana de 1, basta perder UNA orden por ruido para que la siguiente parezca «adelantada» y se rechace: el freno rechaza miles de órdenes propias por hora. La firma y el hueco están bien.';
}
function noEs(k){
  if(k==='sinfirma') return 'Aquí casi no pasan tramas falsas: mira la primera cifra.';
  if(k==='corta') return 'Aquí pasan 0 ó 20 000 tramas falsas, no unas pocas: compara la primera cifra.';
  if(k==='ancha') return 'La orden más vieja que se acepta es corta: mira la segunda cifra.';
  return 'Las órdenes propias no se rechazan en exceso: mira la tercera cifra.';
}
const QUIZ=[
  {q:'Si lleva contador, ¿por qué una trama grabada y repetida más tarde no engaña al freno?',ok:'Porque su contador es viejo y el freno la descarta',mal:['Porque el cable no deja pasar tramas repetidas','Porque el intruso no puede enviar tramas','Porque el freno no revisa nada']},
  {q:'Si alargas la firma de 24 a 25 bits, ¿qué le pasa a la dificultad de adivinarla?',ok:'Se duplica: hay el doble de firmas posibles',mal:['Aumenta sólo un poquito (un 4 %)','No cambia','Se reduce a la mitad']},
  {q:'Con una ventana de 1 mensaje, ¿qué pasa cuando el ruido hace perder una sola orden?',ok:'El freno pierde la sincronía y rechaza las órdenes siguientes',mal:['No pasa nada: acepta la siguiente igual','Acepta una orden falsa del intruso','El bus se apaga']},
];
function iniciaQuiz(){ el("feedback").classList.remove("show"); GUIA.quizN=0; cargaPregunta(); }
function cargaPregunta(){ const Q=QUIZ[GUIA.quizN], opts=barajar([Q.ok,...Q.mal]); GUIA.quiz={q:Q.q,opts,ok:opts.indexOf(Q.ok)}; GUIA.quizResp=-1; GUIA.quizCorrecta=GUIA.quiz.ok; pintaHUD(); }
function respondeQuiz(i){
  if(GUIA.quizResp>=0) return; GUIA.quizResp=i; const ac=i===GUIA.quiz.ok; if(ac) RETOS.quizAcierto++;
  if(ac) sonido.bien(); else sonido.mal();
  const ult=GUIA.quizN>=QUIZ.length-1;
  feedback(ac?'good':'bad',ac?'Correcto ✓':'No es esa',(ac?'':'La respuesta era: <b>'+GUIA.quiz.opts[GUIA.quiz.ok]+'</b>. ')+(ult?'Terminaste el laboratorio.':'Sigue con la siguiente.'),true);
  pintaHUD();
  if(ult){ RETOS.hecho=true; paso('completo'); }
}
function siguientePregunta(){ if(GUIA.quizN<QUIZ.length-1){ GUIA.quizN++; cargaPregunta(); } }

/* ---------- el enrutador de acciones ---------- */
function paso(p){ GUIA.paso=p; GUIA.phase=({calcula:0,ajusta:1,diag:2,quiz:2,completo:2})[p]; if(EST.modo==='reto'){ reiniciaCalculo(); pintaHUD(); } }
function handleAction(act,btn){
  switch(act){
    case 't-sig': tourParaAuto(); tourVa(TOUR.paso+1); break;
    case 't-atras': tourParaAuto(); tourVa(TOUR.paso-1); break;
    case 't-fin': tourParaAuto(); setMode('probar'); break;
    case 'check-v': checkCalcula(); break;
    case 'hint-v':
      if(RETOS.pistas===0){ RETOS.pistas=1; feedback('good','Pista 1 de 2','Cada bit puede valer 0 ó 1: con 3 bits hay 2 × 2 × 2 = 8 firmas posibles, y sólo una acierta.'); }
      else if(RETOS.pistas===1){ RETOS.pistas=2; feedback('good','Pista 2 de 2','Con <i>m</i> bits hay 2<sup><i>m</i></sup> firmas. Un intento acierta 1 de esas; con <i>N</i> intentos, más o menos <i>N</i> veces eso. Pásalo a porcentaje.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break;
    case 'validar': validarAjusta(); break;
    case 'dx-sinfirma': diagnostica('sinfirma'); break; case 'dx-corta': diagnostica('corta'); break; case 'dx-ancha': diagnostica('ancha'); break; case 'dx-estrecha': diagnostica('estrecha'); break;
    case 'quiz-0': respondeQuiz(0); break; case 'quiz-1': respondeQuiz(1); break; case 'quiz-2': respondeQuiz(2); break; case 'quiz-3': respondeQuiz(3); break;
    case 'quiz-sig': siguientePregunta(); break;
    case 'restart': location.reload(); break;
  }
}

/* ---------- lo que la guía enseña en cada paso ---------- */
function contenidoGuia(){
  const tri=(n,v,mx)=>`<span class="tries">intentos fallidos: <b id="${n}">${v}</b>/${mx}</span>`;
  switch(GUIA.paso){
    case 'calcula': { const r=GUIA.r1;
      return {no:'Fase 1 · Reto 1',head:'Tu cálculo',title:'¿Qué tan fácil es adivinar una firma?',
      teach:`El intruso inventa firmas al azar. Cada firma tiene <b>${fN(r.m)} bits</b>: hay 2<sup>${r.m}</sup> posibles y sólo una vale. Si prueba <b>${fN(r.N)}</b> firmas distintas, <div class="task">¿qué probabilidad tiene de acertar? (en %) ${tri('d_try',RETOS.fallos1,3)}</div>`,
      acts:`<div class="calcrow"><input id="ansV" type="text" inputmode="decimal" autocomplete="off" placeholder="¿? por ciento" aria-label="Probabilidad de acertar, en porcentaje"><button class="b primary" data-act="check-v">✓ Comprobar</button></div><button class="pista" id="btnHint">¿Necesitas una pista? (máx. 2)</button>`}; }
    case 'ajusta': { const r=GUIA.r2; if(!r) return {no:'Fase 2 · Reto 2',head:'Tu ajuste',title:'Preparando el escenario…',teach:'',acts:''};
      return {no:'Fase 2 · Reto 2',head:'Tu ajuste',title:'Cumple los seis requisitos',
      teach:`<b>${r.esc.nombre}.</b> ${r.esc.texto}. La firma, el hueco y los fallos propios se miden al validar. ${tri('d_try2',RETOS.fallos2,5)}<div id="pliegoReto"></div>`,
      acts:`<div class="cg"><div class="cl"><div>Largo de la firma</div><b id="v2M">${fN(r.m)} bits</b></div><input type="range" id="r2M" min="0" max="40" step="1" value="${r.m}" aria-label="Largo de la firma"></div>
        <div class="cg"><div class="cl"><div>Ventana del contador</div><b id="v2W">${fN(r.W)} mensajes</b></div><input type="range" id="r2W" min="1" max="40" step="1" value="${r.W}" aria-label="Ventana del contador"></div>
        <div class="cg"><div class="cl"><div>Un mensaje cada</div><b id="v2T">${fN(r.T)} ms</b></div><input type="range" id="r2T" min="2" max="20" step="1" value="${r.T}" aria-label="Periodo de la orden"></div>
        <button class="b primary" data-act="validar">▶ Validar</button>`}; }
    case 'diag': { const ord=GUIA.orden||CASOS_DX.map(x=>x.k);
      return {no:'Fase 3 · Diagnóstico',head:'¿Qué le pasa?',title:'Averigua por qué falla la defensa',
      teach:`Este coche se defiende mal. Lee las tres primeras cifras del dock: tramas falsas que pasan, la orden más vieja aceptada y órdenes propias rechazadas.<div class="task">¿Cuál es la causa? ${tri('d_try3',RETOS.fallos3,3)}</div>`,
      acts:ord.map(k=>`<button class="b" data-act="dx-${k}">${NOMBRE_DX[k]}</button>`).join('')}; }
    case 'quiz': { const Q=GUIA.quiz; if(!Q) return {no:'',head:'',title:'',teach:'',acts:''}; const ya=GUIA.quizResp>=0;
      return {no:'Cierre · Pregunta '+(GUIA.quizN+1)+' de '+QUIZ.length,head:'Quiz',title:Q.q,teach:'',
      acts:Q.opts.map((o,i)=>`<button class="b ${ya?(i===Q.ok?'good':(i===GUIA.quizResp?'bad':'')):''}" data-act="quiz-${i}" ${ya?'disabled':''}>${o}</button>`).join('')+(ya&&GUIA.quizN<QUIZ.length-1?'<button class="b primary" data-act="quiz-sig">Siguiente →</button>':'')}; }
    case 'completo': return {no:'Laboratorio completado',head:'✓',title:'Calculaste, ajustaste y diagnosticaste',

      acts:`<button class="b primary" data-act="restart">↺ Reiniciar laboratorio</button>`};
  }

}

/* ---------- los modos ---------- */
function setMode(m,forzar){

  else { EST.modo='tour'; TOUR.paso=0; }
  document.body.classList.toggle('m-tour',EST.modo==='tour'); document.body.classList.toggle('m-probar',EST.modo==='probar'); document.body.classList.toggle('m-reto',EST.modo==='reto');

}

/* ---------- «Repetir el recorrido»: el mismo recorrido, pero avanza solo cada pocos segundos ---------- */
async function runAuto(){
  if(EST.autoRunning) return; EST.autoRunning=true; sonido.init(); TOUR.auto=true;

/* ===================== 23. SONIDO (sintetizado) =====================
   Un zumbido grave muy atenuado del bus y los avisos de acierto y fallo. */
const sonido=(function(){
  let ctx=null,on=true,master=null,ult=0,zum=null,zg=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      zum=ctx.createOscillator(); zg=ctx.createGain(); zum.type='sawtooth'; zum.frequency.value=60; zg.gain.value=0; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=220; zum.connect(lp); lp.connect(zg); zg.connect(master); zum.start();
    }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); ult=f; }
  return {init,
    zumbido:(q)=>{ if(!ctx||!zum) return; const t=ctx.currentTime; zum.frequency.setTargetAtTime(48+q*40,t,0.15); zg.gain.setTargetAtTime(on&&q>0?0.008:0,t,0.15); },
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }, get freq(){ return ult; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});

/* ===================== 24. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.max(Math.min(devicePixelRatio,alta?2:1.5),Math.min(devicePixelRatio,1.5)>1?1.25:1));
  const ms=alta?2048:1024; if(LUZ.sol.shadow.mapSize.x!==ms){ LUZ.sol.shadow.mapSize.set(ms,ms); if(LUZ.sol.shadow.map){ LUZ.sol.shadow.map.dispose(); LUZ.sol.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); if(typeof ponVista==='function'&&CALC) ponVista(EST.vista,0.001); centraEnHueco();
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 25. EL LAZO: UN SOLO RELOJ =====================
   El tiempo de la pasada avanza dt·velocidad en cada cuadro, y con ESE tiempo viajan las tramas, se encienden las luces, frena el
   disco y se mueve el cursor de la línea de tiempo del dock. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0, tSon=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  const dtS=EST.pausa?0:dt, dtSim=dtS*EST.vel;
  aplicaEscena(dtS,dtSim);
  pasaCam(dt);
  if(t-tSon>0.4){ tSon=t; sonido.zumbido(SIM.e&&!EST.pausa?0.25:0); }
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); if(EST.modo==='reto'&&GUIA.paso==='ajusta') pintaPliegoReto(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaGraficas(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos(); colocaFoco();
}

/* ===================== 26. ARRANQUE =====================
   Abre funcionando y con el recorrido en el paso 1: las tramas ya viajan por el bus, las luces de los módulos parpadean y el
   intruso está conectado, antes de que el alumno toque nada. */

SIM.t=TOUR_PASOS[0].t0;

pintaBarras();
ponVista('todo',0.001);
centraEnHueco();
pintaDockFijo();
cuadro();

/** Mide el objeto en lo VISIBLE: se pinta sin plataforma, suelo ni fondo sobre magenta puro y se toma la caja de los píxeles que no son magenta. */
function mideObjeto(){
  const ocultos=[]; PLATAFORMA.visible=false; scene.traverse(o=>{ if(o.userData&&o.userData.fondo&&o.visible){ o.visible=false; ocultos.push(o); } });
  const bg=scene.background, fog=scene.fog; scene.background=null; scene.fog=null; renderer.setClearColor(0xff00ff,1);
  renderer.render(scene,camera);
  const c=renderer.domElement, W=c.width, H=c.height, t=document.createElement('canvas'); t.width=W; t.height=H; const g=t.getContext('2d',{willReadFrequently:true}); g.drawImage(c,0,0);
  const d=g.getImageData(0,0,W,H).data; let x0=1e9,x1=-1,y0=1e9,y1=-1;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=(y*W+x)*4; if(!(d[i]>235&&d[i+1]<30&&d[i+2]>235)){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  PLATAFORMA.visible=true; for(const o of ocultos) o.visible=true; scene.background=bg; scene.fog=fog; renderer.setClearColor(0x000000,1);
  const k=W/innerWidth; return {x0:x0/k,x1:x1/k,y0:y0/k,y1:y1/k,altoPx:(y1-y0)/k,anchoPx:(x1-x0)/k,fracAlto:(y1-y0)/H,fracAncho:(x1-x0)/W,hueco:huecoLibre(),W:innerWidth,H:innerHeight};
}
