<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.26, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);

  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;

    if(bokeh) bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);

  function start(){ if(!raf)loop(); }
  function stop(){ cancelAnimationFrame(raf); raf=null; window.removeEventListener('resize',resize); }

  /* Sonda de escena para las auditorías del 3D. No cambia nada de lo que se ve
     y cuelga de `window.__diag3d`, que ningún laboratorio pisa: así CUALQUIER
     laboratorio construido con este molde se puede auditar —salud(), mira(),
     piezas()— sin tocarle una línea. */
  try { instalaDiag(document.title || location.pathname,
    { escena:scene, camara:camera, controles:controls, renderizador:renderer }); } catch(_){}

  return { THREE, renderer, scene, camera, controls, composer, bloom,
    setAnimate:fn=>hook=fn, start, stop, resize, clock,
    flyTo:(v)=>{ controls.target.copy(v); }, moveTo, setCinematicIdle };
}

function pickerFor(scene,camera,dom,onHit){
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(); let down=null;
  dom.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
  dom.addEventListener('pointerup',e=>{
    if(!down)return; const moved=Math.abs(e.clientX-down[0])+Math.abs(e.clientY-down[1])>6; down=null;
    if(moved)return;
    const r=dom.getBoundingClientRect();
    mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(mouse,camera);
    const hits=ray.intersectObjects(scene.children,true);
    onHit(hits[0]||null);
  });
}

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

const VCC = 5.000;                 // V, alimentacion del sistema
const VN_ADC = 0.200e-3;           // V rms, ruido del convertidor y de la placa
const C_SH = 14e-12;               // F, condensador de muestreo y retencion
const R_MUX = 1000;                // ohm, resistencia del multiplexor de entrada
const V_SWING_LO = 0.050;          // V, lo mas bajo que puede sacar el amplificador
const V_SWING_HI = 4.800;          // V, lo mas alto que puede sacar el amplificador
const USE_MIN = 0.40;              // fraccion minima del rango del convertidor
const OS_MIN = 5;                  // sobremuestreo minimo sobre el ancho de banda util
const ATT_BW = Math.SQRT1_2;       // -3 dB: atenuacion maxima admisible dentro de la banda
const K_RUIDO = 2;                 // el LSB no puede pesar menos que 2 sigma de ruido
const K_ACQ = 0.25;                // la ventana de adquisicion es 1/4 del periodo de muestreo

const ADCS = {
  b10v5:   { n: 10, vref: 5.000, ref: 'Vcc' },
  b10v256: { n: 10, vref: 2.560, ref: 'interna' },
  b12v5:   { n: 12, vref: 5.000, ref: 'Vcc' },
  b12v256: { n: 12, vref: 2.560, ref: 'interna' },
};
const ADCK = Object.keys(ADCS);

const CONDS = {
  directo: { g: 1,   buf: false, vnAmp: 0 },
  amp5:    { g: 5,   buf: true,  vnAmp: 10e-6 },
  amp20:   { g: 20,  buf: true,  vnAmp: 10e-6 },
  amp100:  { g: 100, buf: true,  vnAmp: 1e-6 },
};
const CONDK = Object.keys(CONDS);

const MUES = {
  m10:  { fs: 10,    fc: 4 },
  m200: { fs: 200,   fc: 80 },
  m5k:  { fs: 5000,  fc: 2000 },
  m50k: { fs: 50000, fc: 20000 },
};
const MUESK = Object.keys(MUES);

const lsbOf = a => a.vref / Math.pow(2, a.n);
const nCodes = a => Math.pow(2, a.n);
const vSens = (sc, x) => sc.v0 + sc.s * x;
const vCond = (sc, c, x) => c.g * vSens(sc, x);
const spanLo = (sc, c) => vCond(sc, c, sc.xMin);
const spanHi = (sc, c) => vCond(sc, c, sc.xMax);
const rOut = (sc, c) => (c.buf ? 100 : sc.rs);

function codeOf(v, a) {
  const k = Math.floor(v / lsbOf(a));
  return Math.max(0, Math.min(nCodes(a) - 1, k));
}
const vHat = (code, a) => (code + 0.5) * lsbOf(a);              // reconstruccion centrada
const xHat = (code, a, sc, c) => (vHat(code, a) / c.g - sc.v0) / sc.s;
const qErr = (v, a) => vHat(codeOf(v, a), a) - v;               // error de cuantizacion

const resFis = (sc, c, a) => lsbOf(a) / (c.g * sc.s);           // unidades fisicas por codigo
const usoOf = (sc, c, a) => (spanHi(sc, c) - spanLo(sc, c)) / a.vref;
const enobUso = (a, uso) => a.n + Math.log2(uso);
const vRuido = (sc, c) => Math.hypot(c.g * sc.vnSens, c.g * c.vnAmp, VN_ADC);

const att = (f, fc) => 1 / (1 + Math.pow(f / fc, 2));           // dos polos reales identicos
const fold = (f, fs) => Math.abs(f - Math.round(f / fs) * fs);  // frecuencia plegada
const vAlias = (sc, c, m) => c.g * sc.vInt * att(sc.fInt, m.fc);

const tAcq = m => K_ACQ / m.fs;
const tauSH = (sc, c) => (rOut(sc, c) + R_MUX) * C_SH;
const tSet = (sc, c, a) => (a.n + 1) * Math.LN2 * tauSH(sc, c);

function guardAdc(sc, aK) {
  const a = ADCS[aK];
  if (sc.ratio && a.ref !== 'Vcc') return false;        // medida ratiometrica: la referencia es la propia alimentacion
  if (sc.ruidoAlim && a.ref === 'Vcc') return false;    // alimentacion sucia: no sirve como referencia
  return true;
}
function guardCond(sc, cK, aK) {
  const c = CONDS[cK], a = ADCS[aK];
  const lo = spanLo(sc, c), hi = spanHi(sc, c);
  if (lo < 0 || hi > a.vref) return false;             // fuera del rango del convertidor
  if (c.buf && (lo < V_SWING_LO || hi > V_SWING_HI)) return false;  // fuera de la excursion del amplificador
  return true;
}
function guardMues(sc, mK) {
  const m = MUES[mK];
  if (m.fs > sc.fsMax) return false;                   // la plataforma no da para tanto
  if (att(sc.fBw, m.fc) < ATT_BW) return false;        // el filtro se come la banda util
  return true;
}

function runC(sc, cfg) {
  const a = ADCS[cfg.adc], c = CONDS[cfg.cond], m = MUES[cfg.mues];
  const lsb = lsbOf(a);
  const res = resFis(sc, c, a);
  const uso = usoOf(sc, c, a);
  const vn = vRuido(sc, c);
  const va = vAlias(sc, c, m);
  const ts = tSet(sc, c, a);
  const ta = tAcq(m);
  const resOk = res <= sc.reqRes;
  const usoOk = uso >= USE_MIN;
  const ruidoOk = lsb >= K_RUIDO * vn;
  const nyqOk = m.fs >= OS_MIN * sc.fBw;
  const aliasOk = va < lsb / 2;
  const setOk = ta >= ts;
  return {
    lsb, res, uso, vn, va, ts, ta, enob: enobUso(a, uso),
    fAlias: fold(sc.fInt, m.fs), lo: spanLo(sc, c), hi: spanHi(sc, c),
    resOk, usoOk, ruidoOk, nyqOk, aliasOk, setOk,
    ok: resOk && usoOk && ruidoOk && nyqOk && aliasOk && setOk,
  };
}
function cfgOk(sc, cfg) {
  if (!guardAdc(sc, cfg.adc)) return false;
  if (!guardCond(sc, cfg.cond, cfg.adc)) return false;
  if (!guardMues(sc, cfg.mues)) return false;
  return runC(sc, cfg).ok;
}

// -------- trazador genérico ------------------------------------------------
// opts: {x0,x1,y0,y1,xl,yl,series:[{pts,col,dash,w}],hband:[y0,y1,col],
//        vbands:[[x0,x1,col]],hlines:[[y,col,txt]],marks:[[x,y,col]],xt:fn,yt:fn}
function plot(c,X,Y,W,H,o){
  const x0=o.x0,x1=o.x1,y0=o.y0,y1=o.y1;
  const mx=v=>X+(v-x0)/(x1-x0||1)*W, my=v=>Y+H-(v-y0)/(y1-y0||1)*H;
  c.save();
  c.fillStyle='rgba(255,255,255,0.02)';c.fillRect(X,Y,W,H);
  if(o.hband){c.fillStyle=hexA(o.hband[2],0.12);
    const a=my(Math.max(y0,Math.min(y1,o.hband[1]))),b=my(Math.max(y0,Math.min(y1,o.hband[0])));
    c.fillRect(X,a,W,b-a);}
  (o.vbands||[]).forEach(v=>{c.fillStyle=hexA(v[2],0.14);c.fillRect(mx(v[0]),Y,Math.max(1,mx(v[1])-mx(v[0])),H);});
  c.strokeStyle='rgba(255,255,255,0.08)';c.lineWidth=1;
  for(let i=1;i<4;i++){const yy=Y+H*i/4;c.beginPath();c.moveTo(X,yy);c.lineTo(X+W,yy);c.stroke();}
  if(y0<0&&y1>0){c.strokeStyle='rgba(255,255,255,0.28)';c.beginPath();c.moveTo(X,my(0));c.lineTo(X+W,my(0));c.stroke();}
  (o.hlines||[]).forEach(h=>{
    if(h[0]<y0||h[0]>y1)return;
    c.strokeStyle=hexA(h[1],0.8);c.lineWidth=1.5;c.setLineDash([6,4]);
    c.beginPath();c.moveTo(X,my(h[0]));c.lineTo(X+W,my(h[0]));c.stroke();c.setLineDash([]);
    if(h[2]){c.fillStyle=h[1];c.font='11px Outfit, sans-serif';c.textAlign='right';c.fillText(h[2],X+W-4,my(h[0])-4);}
  });
  (o.series||[]).forEach(s=>{
    if(!s.pts.length)return;
    c.strokeStyle=s.col;c.lineWidth=s.w||2;c.setLineDash(s.dash||[]);
    c.beginPath();
    s.pts.forEach((p,i)=>{const px=mx(p[0]),py=my(Math.max(y0,Math.min(y1,p[1])));if(i)c.lineTo(px,py);else c.moveTo(px,py);});
    c.stroke();c.setLineDash([]);
  });
  (o.marks||[]).forEach(m=>{
    c.fillStyle=m[2];c.beginPath();c.arc(mx(m[0]),my(Math.max(y0,Math.min(y1,m[1]))),4.5,0,Math.PI*2);c.fill();
  });
  c.strokeStyle='rgba(255,255,255,0.20)';c.lineWidth=1;c.strokeRect(X,Y,W,H);
  c.fillStyle='#7a8494';c.font='11px Outfit, sans-serif';
  c.textAlign='right';c.fillText(o.xl||'',X+W,Y+H+16);
  c.textAlign='left';c.fillText(o.yl||'',X,Y-6);
  c.fillStyle='#6b7280';c.font='10px Outfit, sans-serif';
  c.textAlign='left';c.fillText(o.xt?o.xt(x0):'',X,Y+H+16);
  c.textAlign='right';c.fillText(o.yt?o.yt(y1):'',X-4,Y+8);
  c.textAlign='right';c.fillText(o.yt?o.yt(y0):'',X-4,Y+H);
  c.restore();
}

}

// curvas de apoyo -----------------------------------------------------------
function stairPts(a,v0,v1,np){
  const pts=[],N=np||480;
  for(let k=0;k<=N;k++){const v=v0+(v1-v0)*k/N;pts.push([v*1000,codeOf(v,a)]);}
  return pts;
}
function errPts(a,v0,v1,off,np){
  const pts=[],N=np||480;
  for(let k=0;k<=N;k++){const v=v0+(v1-v0)*k/N;pts.push([v*1000,(qErr(v,a)+off)*1000]);}
  return pts;
}
function attPts(fc,f0,f1,np){
  const pts=[],N=np||160;
  for(let k=0;k<=N;k++){const lg=Math.log10(f0)+(Math.log10(f1)-Math.log10(f0))*k/N;
    pts.push([lg,att(Math.pow(10,lg),fc)]);}
  return pts;
}
function foldPts(fs,f0,f1,np){
  const pts=[],N=np||400;
  for(let k=0;k<=N;k++){const f=f0+(f1-f0)*k/N;pts.push([f/fs,fold(f,fs)/fs]);}
  return pts;
}

  rpanel(c,PX.x,PX.y,PX.w,214,'Presupuesto de ruido');

}

function drawApMuestreo(c){
  const sc=POOL[scIdx],cfg=curCfg(),a=ADCS[cfg.adc],cd=CONDS[cfg.cond],r=runC(sc,cfg),m=MUES[cfg.mues];
  header(c,'MUESTREO: NYQUIST, FILTRO Y VENTANA',
    'f_s ≥ 5·B · atenuación de dos polos 1/(1+(f/f_c)²) · f_plegada = |f − round(f/f_s)·f_s| · t_adq = 0,25/f_s',WARN_HEX);

  const W1=[104,84,92,104,96,90];let yy=104,hh=30;
  trow(c,60,yy,570,hh,['muestreo','f_s/B','banda útil','residuo (mV)','se pliega a','¿sirve?'],W1,null,true);
  MUESK.forEach(k=>{
    yy+=hh;const mm=MUES[k],aB=att(sc.fBw,mm.fc),va=vAlias(sc,cd,mm),fa=fold(sc.fInt,mm.fs);
    const good=okMues(sc,k);
    trow(c,60,yy,570,hh,[MUES_SH[k],n1(mm.fs/sc.fBw),n3(aB),n4(va*1000),fHz(fa),good?'sí':'no'],W1,
      [k===cfg.mues?ACC:'#F4EFEA',mm.fs>=OS_MIN*sc.fBw?OK_HEX:BAD_HEX,
       aB>=ATT_BW?OK_HEX:BAD_HEX,va<lsbOf(a)/2?OK_HEX:BAD_HEX,
       fa<=sc.fBw?BAD_HEX:WARN_HEX,good?OK_HEX:BAD_HEX]);

  // respuesta del filtro (eje logarítmico)

  plot(c,70,268,270,180,{
    x0:Math.log10(f0),x1:Math.log10(f1),y0:0,y1:1.05,

    xt:t=>'1 Hz',yt:t=>n2(t),

    marks:[[Math.log10(sc.fBw),att(sc.fBw,m.fc),ACC],[Math.log10(sc.fInt),att(sc.fInt,m.fc),BAD_HEX]]});

  // plegado de frecuencias
  plot(c,360,268,270,180,{
    x0:0,x1:3,y0:0,y1:0.55,
    xl:'frecuencia de entrada en múltiplos de f_s',yl:'frecuencia que aparece tras muestrear (× f_s)',

    series:[{pts:foldPts(m.fs,0,3*m.fs),col:VIO,w:2.5}],

  legend(c,70,476,[['respuesta del filtro',WARN_HEX],['banda útil de la señal',ACC],['la interferencia',BAD_HEX],['ley de plegado',VIO]]);

  c.fillStyle='#9fb0cf';c.font='13px Outfit, sans-serif';c.textAlign='left';
  let ty=wrapText(c,'Nyquist y el filtro son criterios DISTINTOS: la frecuencia de muestreo se fija frente a la banda ÚTIL, y el filtro decide cuánto queda de lo que está FUERA de ella. Ninguno sustituye al otro.',70,506,560,20);
  ty=wrapText(c,'Aquí la interferencia de '+fHz(sc.fInt)+' se pliega a '+fHz(fold(sc.fInt,m.fs))+
    (fold(sc.fInt,m.fs)<1e-9?': cae en continua y se disfraza de error de calibración, la avería más difícil de ver.'
      :', dentro o cerca de la banda útil, y ya no hay filtro digital que la separe.'),70,ty+28,560,20);
  wrapText(c,'La ventana de adquisición es lo último que se comprueba y lo primero que falla con sensores de alta impedancia: el condensador de muestreo tiene que cargarse a mejor de ½ LSB en 0,25/f_s.',70,ty+56,560,20);

  rpanel(c,PX.x,PX.y,PX.w,214,'Muestreo en pantalla');

  prow(c,PX.x,PX.y+82,PX.w,'Banda útil de la señal',fHz(sc.fBw));
  prow(c,PX.x,PX.y+108,PX.w,'Sobremuestreo f_s/B',n1(m.fs/sc.fBw)+' (mín. '+OS_MIN+')',r.nyqOk?OK_HEX:BAD_HEX);

  prow(c,PX.x,PX.y+392,PX.w,'Margen',r.setOk?n1(r.ta/r.ts)+' ×':'insuficiente',r.setOk?OK_HEX:BAD_HEX);

  rpanel(c,PX.x,PX.y+440,PX.w,258,'Filtro mínimo admisible');
  c.fillStyle='#9fb0cf';c.font='13px Outfit, sans-serif';c.textAlign='left';
  let ty2=PX.y+496;

   'Un filtro más cerrado no protege mejor: borra la señal que se quería medir.',

function hwFrames(){
  const sc=curSc(),cfg=curCfg(),a=ADCS[cfg.adc],cd=CONDS[cfg.cond];
  const out=[],NF=48,res=resFis(sc,cd,a);
  const mk=(x,lab)=>{
    const xc=Math.max(sc.xMin,Math.min(sc.xMax,x));
    const v=vCond(sc,cd,xc),code=codeOf(v,a);
    return {x:xc,v,code,xh:xHat(code,a,sc,cd),lab};
  };
  if(mode==='explora'){
    const x0=expX();
    for(let k=0;k<NF;k++){
      const x=x0+((k+0.5)/NF-0.5)*8*res;
      out.push(mk(x,'zoom de ±4 pasos alrededor de '+fX(sc,x0)+' '+UNI[scIdx]));
    }
  }else{
    for(let k=0;k<NF;k++){
      const x=sc.xMin+(sc.xMax-sc.xMin)*k/(NF-1);
      out.push(mk(x,'barrido de la escala completa'));
    }
  }
  return out;
}
function frames(){if(!framesCache)framesCache=hwFrames();return framesCache;}
function hwCount(){return Math.max(1,frames().length);}

function drawPanel3D(fr,step){
  const sc=curSc(),cfg=curCfg(),a=ADCS[cfg.adc],cd=CONDS[cfg.cond],r=runC(sc,cfg);
  const uni=mode==='reto'?UNI[retoK]:UNI[scIdx];
  const c=pCv.getContext('2d');
  c.fillStyle='#0e1218';c.fillRect(0,0,600,400);
  c.strokeStyle=hexA(ACC,0.35);c.lineWidth=3;c.strokeRect(6,6,588,388);
  c.fillStyle='#C7D6F5';c.font='bold 17px Outfit, sans-serif';c.textAlign='left';
  c.fillText('ADQUISIDOR · CANAL 0',24,40);
  c.fillStyle='#6b7280';c.font='12px Outfit, sans-serif';c.textAlign='right';c.fillText(fr.lab,576,40);

  // barra del rango del convertidor con la excursión de la señal
  const X=24,Y=58,W=552,H=44;
  c.fillStyle='rgba(255,255,255,0.03)';c.fillRect(X,Y,W,H);
  const mx=v=>X+Math.max(0,Math.min(1,v/a.vref))*W;
  c.fillStyle=hexA(ACC,0.18);c.fillRect(mx(r.lo),Y,Math.max(2,mx(r.hi)-mx(r.lo)),H);
  c.strokeStyle=hexA(WARN_HEX,0.9);c.lineWidth=2.5;
  c.beginPath();c.moveTo(mx(fr.v),Y);c.lineTo(mx(fr.v),Y+H);c.stroke();
  c.strokeStyle='rgba(255,255,255,0.18)';c.lineWidth=1;c.strokeRect(X,Y,W,H);
  c.fillStyle='#6b7280';c.font='11px Outfit, sans-serif';c.textAlign='left';c.fillText('0 V',X+4,Y+H-6);
  c.textAlign='right';c.fillText('V_REF = '+n3(a.vref)+' V',X+W-4,Y+H-6);
  c.fillStyle=WARN_HEX;c.textAlign='center';c.fillText(fmV(fr.v)+' mV',Math.max(X+40,Math.min(X+W-40,mx(fr.v))),Y-6);

  // lectura grande: el código
  c.fillStyle=VIO;c.font='bold 54px Outfit, sans-serif';c.textAlign='left';
  c.fillText(n0(fr.code),24,176);
  const wC=c.measureText(n0(fr.code)).width;
  c.fillStyle='#8f97a5';c.font='bold 18px Outfit, sans-serif';
  c.fillText('/ '+n0(nCodes(a)-1),24+wC+12,176);
  c.fillStyle='#F4EFEA';c.font='bold 26px Outfit, sans-serif';c.textAlign='right';
  c.fillText(fR(sc,fr.xh)+' '+uni,576,176);

  // los bits
  const bits=bin(fr.code,a),bw=Math.min(30,(552-8*(a.n-1))/a.n);
  let bx=24;
  for(let i=0;i<a.n;i++){
    const on=bits[i]==='1';
    c.fillStyle=on?hexA(OK_HEX,0.85):'rgba(255,255,255,0.06)';
    c.fillRect(bx,196,bw,26);
    c.strokeStyle=hexA(ACC,0.25);c.lineWidth=1;c.strokeRect(bx,196,bw,26);
    c.fillStyle=on?'#0e1218':'#6b7280';c.font='bold 13px Outfit, sans-serif';c.textAlign='center';
    c.fillText(bits[i],bx+bw/2,214);
    bx+=bw+8;
  }

  const row=(y,l,v,cc)=>{c.fillStyle='#8f97a5';c.font='14px Outfit, sans-serif';c.textAlign='left';c.fillText(l,24,y);
    c.fillStyle=cc||'#F4EFEA';c.font='bold 17px Outfit, sans-serif';c.textAlign='right';c.fillText(v,576,y);};
  row(256,'LSB · paso físico',fmV(r.lsb)+' mV · '+fR(sc,r.res)+' '+uni,r.resOk?OK_HEX:BAD_HEX);
  row(284,'Uso del rango · bits útiles',pctS(r.uso)+' · '+n2(r.enob),r.usoOk?OK_HEX:BAD_HEX);
  row(312,'Ruido σ · LSB/σ',fmV(r.vn)+' mV · '+n2(r.lsb/r.vn),r.ruidoOk?OK_HEX:BAD_HEX);
  row(340,'Muestreo · establecimiento',fSs(MUES[cfg.mues].fs)+' · '+fus(r.ts)+' µs',r.setOk?OK_HEX:BAD_HEX);
  row(368,'Fase',(step%8)<3?'muestreo (S&H cargando)':'conversión',(step%8)<3?WARN_HEX:VIO);
  pTex.needsUpdate=true;
}

function updateHW(){
  const fs=frames(),step=hwStep%Math.max(1,fs.length);
  const fr=fs[step]||{x:0,v:0,code:0,xh:0,lab:''};
  const cfg=curCfg(),a=ADCS[cfg.adc],cd=CONDS[cfg.cond],sc=curSc();
  const idx=mode==='reto'?retoK:scIdx;
  const sampling=(step%8)<3;
  senMat.color.set(SCCOL[idx]);senMat.emissive.set(SCCOL[idx]);
  senMat.emissiveIntensity=0.35+0.9*(fr.v/Math.max(1e-9,a.vref));
  ampMat.emissiveIntensity=cd.buf?1.3:0.12;
  shCapMat.emissiveIntensity=sampling?1.5:0.15;
  sarMat.emissiveIntensity=sampling?0.10:1.4;
  refMat.emissiveIntensity=ADCS[cfg.adc].ref==='Vcc'?0.5:1.2;
  const bits=bin(fr.code,a),off=12-a.n;
  bitLeds.forEach((b,i)=>{
    const j=i-off;
    if(j<0){b.mesh.visible=false;return;}
    b.mesh.visible=true;
    b.mat.emissiveIntensity=bits[j]==='1'?1.5:0.05;
  });
  filtCap.material=guardMues(sc,cfg.mues)?MAT.glass:MAT.copper;
  drawPanel3D(fr,step);
}

    html+=`<br>El acondicionamiento (${COND_SH[cfg.cond]}) y el muestreo (${MUES_SH[cfg.mues]}) son los de la máquina y no cambian en este modo.`;
  }else if(mode==='aplica'){
    if(apTopic==='resolucion'){
      html+=`<span class="mono">LSB ${fmV(r.lsb)} mV · paso ${fR(sc,r.res)} ${uni} · uso ${pctS(r.uso)} · ${n2(r.enob)} bits útiles</span><br>`;
      html+=`Dejar rango sin usar cuesta bits: de los ${a.n} del convertidor quedan ${n2(r.enob)}.`;
    }else if(apTopic==='ruido'){
      html+=`<span class="mono">σ ${fmV(r.vn)} mV · 2σ ${fmV(2*r.vn)} mV · LSB ${fmV(r.lsb)} mV</span><br>`;
      html+=r.ruidoOk?`El escalón todavía pesa más que el ruido: los códigos significan algo.`
                     :`El escalón ya pesa menos que dos sigmas: los últimos bits sólo cuentan ruido.`;
      html+=` Con esta cadena la referencia deja de dar bits nuevos a partir de ${n2(nUtilRuido(a,r.vn))}.`;
    }else{
      html+=`<span class="mono">f_s ${fSs(MUES[cfg.mues].fs)} · f_c ${fHz(MUES[cfg.mues].fc)} · residuo ${n4(r.va*1000)} mV · se pliega a ${fHz(r.fAlias)}</span><br>`;
      html+=`La interferencia de ${fHz(sc.fInt)} llega al convertidor `;
      html+=r.aliasOk?`atenuada por debajo de medio LSB.`:`por encima de medio LSB: entra en la medida.`;
    }
  }else{
    html+=retoChecked?retoMsg:`Configuración actual: ${ADC_SH[cfg.adc]} · ${COND_SH[cfg.cond]} · ${MUES_SH[cfg.mues]}.`;
  }
  el('report').innerHTML=html;
}

// ===================== 13. RETO =====================
function firstWrong(list,okFn){for(const k of list){if(!okFn(k))return k;}return list[0];}
function seedReto(k){
  retoK=(k===undefined||k===null)?pickIdx(POOL.length,retoK):k;
  const sc=POOL[retoK];
  retoCh={adc:firstWrong(ADCK,q=>okAdc(sc,q)),
          cond:firstWrong(CONDK,q=>okCond(sc,q)),
          mues:firstWrong(MUESK,q=>okMues(sc,q))};
  retoChecked=false;retoSolved=false;retoMsg='';solved=false;
  retoOkAdc=false;retoOkCond=false;retoOkMues=false;
}
function retoSet(field,v){retoCh[field]=v;retoChecked=false;retoSolved=false;solved=false;}
function updateRetoSpec(){
  const sc=retoSc();
  el('retoSpec').innerHTML=
    `<b style="color:${SCCOL[retoK]}">${NOM[retoK]}</b><br>`+
    `${MAQ[retoK]}<br>`+
    `<span class="mono">Paso ≤ ${fR(sc,sc.reqRes)} ${UNI[retoK]} · banda útil ${fHz(sc.fBw)} · interferencia ${fHz(sc.fInt)} de ${fmV(sc.vInt)} mV · plataforma hasta ${fSs(sc.fsMax)}`+
    `${sc.ruidoAlim?' · alimentación sucia':''}${sc.ratio?' · medida ratiométrica':''}</span><br>`+
    `Elige las tres: convertidor, acondicionamiento y muestreo.`+
    (retoChecked?`<br>${retoMsg}`:'');
}
function whyCfg(sc,cfg){
  const a=ADCS[cfg.adc],c=CONDS[cfg.cond],m=MUES[cfg.mues];
  if(!guardAdc(sc,cfg.adc))
    return a.ref==='Vcc'?'la referencia sería la propia alimentación, y en esta máquina está sucia: todo lo que la mueva se cuela en la medida'
                        :'la medida es ratiométrica y sólo tiene sentido si la referencia es la misma alimentación que excita al sensor';
  if(!guardCond(sc,cfg.cond,cfg.adc)){
    const lo=spanLo(sc,c),hi=spanHi(sc,c);
    if(hi>a.vref)return 'la señal amplificada llega a '+n3(hi)+' V y el convertidor sólo admite hasta '+n3(a.vref)+' V';
    if(lo<0)return 'la señal amplificada baja de 0 V y este convertidor es unipolar';
    return 'el amplificador no puede sacar '+n3(lo)+' … '+n3(hi)+' V con una sola alimentación: su excursión va de '+n3(V_SWING_LO)+' a '+n3(V_SWING_HI)+' V';
  }
  if(!guardMues(sc,cfg.mues)){
    if(m.fs>sc.fsMax)return 'la plataforma no pasa de '+fSs(sc.fsMax)+' y se piden '+fSs(m.fs);
    return 'con el corte en '+fHz(m.fc)+' el filtro se come la banda útil: en '+fHz(sc.fBw)+' ya sólo queda '+n3(att(sc.fBw,m.fc))+' de la señal';
  }
  const r=runC(sc,cfg),fal=[];
  if(!r.resOk)fal.push('el escalón vale '+fR(sc,r.res)+' '+uniOf(sc)+' y se exigen '+fR(sc,sc.reqRes));
  if(!r.usoOk)fal.push('la señal sólo ocupa el '+pctS(r.uso)+' del rango: se tiran '+n2(-Math.log2(r.uso))+' bits');
  if(!r.ruidoOk)fal.push('el escalón de '+fmV(r.lsb)+' mV pesa menos que dos sigmas de ruido ('+fmV(2*r.vn)+' mV): los últimos bits sólo cuentan ruido');
  if(!r.nyqOk)fal.push('con '+fSs(m.fs)+' sobre una banda de '+fHz(sc.fBw)+' el sobremuestreo es '+n1(m.fs/sc.fBw)+' y hacen falta '+OS_MIN);
  if(!r.aliasOk)fal.push('la interferencia de '+fHz(sc.fInt)+' llega con '+n4(r.va*1000)+' mV, por encima del medio LSB de '+n4(r.lsb*500)+' mV, y se pliega a '+fHz(r.fAlias));
  const out=fal.slice(0,1);
  // el asentamiento del S&H no es un defecto de calidad numérica sino de captura: si falla se dice SIEMPRE
  if(!r.setOk)out.push('el condensador de retención necesita '+fus(r.ts)+' µs y la ventana sólo dura '+fus(r.ta)+' µs');
  if(out.length)return out.join('; y además, ');
  return 'cumple los seis criterios con la referencia, la excursión y la banda en regla';
}
function retoExplain(){
  const sc=retoSc(),parts=[];
  parts.push(retoOkAdc?'Convertidor correcto.':'Convertidor: '+whyCfg(sc,cfgWith(sc,{adc:retoCh.adc}))+'.');
  parts.push(retoOkCond?'Acondicionamiento correcto.':'Acondicionamiento: '+whyCfg(sc,cfgWith(sc,{cond:retoCh.cond}))+'.');
  parts.push(retoOkMues?'Muestreo correcto.':'Muestreo: '+whyCfg(sc,cfgWith(sc,{mues:retoCh.mues}))+'.');
  return parts.join(' ');
}
function checkReto(){
  const sc=retoSc();
  retoOkAdc=okAdc(sc,retoCh.adc);
  retoOkCond=okCond(sc,retoCh.cond);
  retoOkMues=okMues(sc,retoCh.mues);
  retoSolved=retoOkAdc&&retoOkCond&&retoOkMues;
  retoChecked=true;solved=retoSolved;
  synth.beep(retoSolved?1046:220,retoSolved?0.14:0.15,0.06);
  retoMsg=`<span class="mono"><span class="${retoSolved?'ok':'dtc'}">${retoSolved?'✔ Correcto':'✗ Revisa'}</span> — ${retoExplain()}</span>`;
  updateRetoSpec();refreshAll();
}

// ===================== 14. QUIZ =====================
function buildQuiz(){
  // Los enunciados citan cifras SELLADAS del volcado numerico: no dependen del estado.
  QUIZ={
    explora:{p:'El horno pide un paso de 0,25 °C con el amplificador ×100. Con 12 bits y V_REF = 5 V el paso sale 0,298 °C; con 12 bits y V_REF = 2,560 V sale 0,152 °C. ¿Qué explica la diferencia?',
      opciones:[
        {t:'El escalón vale V_REF/2ⁿ: con la misma cantidad de bits, bajar la referencia lo achica, y el paso físico es ese escalón dividido entre la ganancia por la sensibilidad.',ok:true,
         why:'Exacto: 1,221 mV / (100 · 41 µV/°C) = 0,298 °C frente a 0,625 mV / 4,1 mV/°C = 0,152 °C. Lo que resuelve no es el número de bits, es el tamaño del escalón frente a la sensibilidad.'},
        {t:'Una referencia interna siempre es más exacta que la alimentación, y por eso el paso mejora.',ok:false,
         why:'La exactitud de la referencia es otro problema (afecta al error de ganancia). Aquí lo que cambia es el TAMAÑO del escalón, no su exactitud.'},
        {t:'Con V_REF = 5 V la señal satura el convertidor y se pierden códigos.',ok:false,
         why:'No satura: el termopar amplificado llega a 2,050 V, muy por debajo de 5 V. Lo que ocurre es que sólo se usa el 36,9 % del rango.'},
        {t:'A 12 bits el ruido ya domina y por eso el paso empeora.',ok:false,
         why:'Con esta cadena 2σ vale 0,490 mV, por debajo del LSB de 1,221 mV. El ruido todavía no manda; el problema es el tamaño del escalón.'}]},
    aplica:{p:'En el molino, pasar de 10 a 12 bits con V_REF = 5 V afina el paso de 0,244 A a 0,061 A. Aun así, el banco rechaza los 12 bits. ¿Por qué?',
      opciones:[
        {t:'Porque el LSB baja a 1,221 mV y el ruido de la cadena vale 2σ = 1,697 mV: los dos últimos bits ya sólo digitalizan ruido.',ok:true,
         why:'Correcto, y es el único criterio de todo el banco que castiga tener MÁS bits. Bajar σ (promediar, filtrar, apantallar) sí da bits; subir n, no.'},
        {t:'Porque con 12 bits la señal deja de caber en el rango del convertidor.',ok:false,
         why:'El rango no depende de n: la señal sigue ocupando el 56 % con 5 V de referencia. Lo que cambia es el tamaño del escalón.'},
        {t:'Porque a 12 bits el establecimiento del muestreo y retención ya no cabe en la ventana.',ok:false,
         why:'Con seguidor, el establecimiento pasa de 0,109 a 0,117 µs frente a una ventana de 50 µs: sobra margen. No es ése el criterio que falla.'},
        {t:'Porque con más bits la interferencia de 16 kHz se pliega a una frecuencia distinta.',ok:false,
         why:'El plegado depende sólo de f_s: 16 kHz con 5 kS/s cae en 1 kHz sin importar cuántos bits tenga el convertidor.'}]},
    reto:{p:'¿Por qué el criterio de Nyquist y el filtro antialias no son la misma condición?',
      opciones:[
        {t:'Porque f_s se fija frente a la banda ÚTIL y el filtro decide cuánto queda de lo que está FUERA de ella; cumplir uno no dice nada del otro.',ok:true,
         why:'Así es. En la línea hidráulica, 200 S/s sobre 30 Hz cumple Nyquist de sobra, y aun así los 4 kHz del variador se pliegan a 0 Hz exactos: sólo el filtro de 80 Hz impide que aparezcan como un error de calibración.'},
        {t:'Son la misma condición escrita de dos maneras: si f_s ≥ 2B, el filtro sobra.',ok:false,
         why:'Nyquist habla de la señal que se quiere medir; el alias lo produce lo que NO se quiere medir. Sin filtro, cualquier interferencia por encima de f_s/2 vuelve plegada y ya no se puede separar.'},
        {t:'El filtro sólo sirve para bajar el ruido; el alias se corrige después por software.',ok:false,
         why:'Una vez plegada, la interferencia ocupa exactamente las mismas frecuencias que la señal. Ningún filtro digital posterior puede distinguirlas.'},
        {t:'Basta con muestrear mucho más rápido: con f_s alta el alias desaparece.',ok:false,
         why:'Muestrear más rápido aleja el plegado, pero la interferencia sigue entrando. En el rodamiento, los 150 kHz de la fuente conmutada se pliegan a 0 Hz incluso con 50 kS/s.'}]}};
  Object.values(QUIZ).forEach(q=>{
    for(let i=q.opciones.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      const tmp=q.opciones[i];q.opciones[i]=q.opciones[j];q.opciones[j]=tmp;
    }
  });
}
function clearDx(){const box=el('dxbtns');if(box)box.innerHTML='';}
function refreshQuestion(){
  const q=QUIZ[mode];if(!q)return;
  el('q_text').innerHTML=`<div class="qz">${q.p}</div>`;
  const box=el('dxbtns');
  box.innerHTML=q.opciones.map((o,i)=>`<button class="b sm" data-i="${i}">${o.t}</button>`).join('');
  box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(parseInt(b.dataset.i,10)));
}
function answer(i){
  const q=QUIZ[mode];if(!q)return;
  const o=q.opciones[i];if(!o)return;
  synth.beep(o.ok?880:200,0.1,0.05);
  showToast((o.ok?'✔ ':'✗ ')+o.why);
}

// ===================== 15. PICKING Y HOVER =====================
pickerFor(scene,S.camera,S.renderer.domElement,hit=>{
  if(!hit)return;
  if(hit.object===board){boardClick();return;}
  let o=hit.object;
  while(o){if(o.userData&&o.userData.title){showToast('<b>'+o.userData.title+'</b><br>'+(o.userData.info||''));return;}o=o.parent;}
});
(function hoverLoop(){
  const ray=new THREE.Raycaster();const ptr=new THREE.Vector2();let has=false;
  S.renderer.domElement.addEventListener('pointermove',e=>{
    const r=S.renderer.domElement.getBoundingClientRect();
    ptr.x=((e.clientX-r.left)/r.width)*2-1;ptr.y=-((e.clientY-r.top)/r.height)*2+1;has=true;
  });
  function tick(){
    requestAnimationFrame(tick);
    if(!has)return;
    ray.setFromCamera(ptr,S.camera);
    const hits=ray.intersectObjects(scene.children,true);
    let found=null;
    if(hits.length){let o=hits[0].object;while(o){if(HOVER_LABELS.has(o)){found=o;break;}o=o.parent;}}
    HOVER_LABELS.forEach((spr,obj)=>{spr.visible=(obj===found);});
    S.renderer.domElement.style.cursor=found?'pointer':'default';
  }
  tick();
})();

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function runAuto(){
  if(autoRunning)return;autoRunning=true;
  const btn=el('btnAuto'),label=btn.textContent;
  btn.disabled=true;btn.classList.add('on');btn.textContent='⏳ Recorriendo…';
  try{
    synth.init();synth.resume();clearDx();

    // ---------- EXPLORA
    setMode('explora');
    scIdx=0;syncSel();expXi=3;afterEdit();
    showToast('🔧 Horno de revenido. El termopar da 41,0 µV por grado; amplificado ×100, la escala de 50 a 500 °C ocupa de 0,205 a 2,050 V.');
    await sleep(4600);
    showToast('El convertidor de 12 bits con referencia interna de 2,560 V parte ese rango en 4 096 escalones: LSB = 2,560 V / 4 096 = <b>0,625 mV</b>.');
    await sleep(4800);
    showToast('A 288,50 °C la entrada vale 1 182,850 mV y el código sale <b>1 892</b>. Reconstruido en el centro del escalón: 288,491 °C, nueve milésimas de error.');
    await sleep(5200);
    showToast('El escalón de 0,625 mV son <b>0,152 °C</b> de paso físico, y la máquina exige 0,25 °C. Alcanza con margen.');
    await sleep(4600);
    expAdc='b10v256';afterEdit();
    showToast('Bajemos a 10 bits con la misma referencia: el escalón se cuadruplica a 2,500 mV y el paso sube a <b>0,610 °C</b>. Ya no cumple.');
    await sleep(5200);
    expAdc='b12v5';afterEdit();
    showToast('Volvamos a 12 bits, pero con V_REF = 5 V: los MISMOS bits dan 1,221 mV y <b>0,298 °C</b>, que tampoco cumple los 0,25. Lo que resuelve no es n, es el escalón frente a la sensibilidad.');
    await sleep(5400);
    expAdc='b12v256';afterEdit();
    answer(QUIZ[mode].opciones.findIndex(o=>o.ok));
    await sleep(2600);

    // ---------- APLICA
    setMode('aplica');
    scIdx=0;syncSel();apTopic='resolucion';afterEdit();
    showToast('🧩 Primer criterio: el rango. Con ×100 la señal ocupa el <b>72,07 %</b> de los 2,560 V, y de los 12 bits quedan 11,53 útiles.');
    await sleep(4800);
    apCond='amp20';afterEdit();
    showToast('Con ×20 la señal sólo llega a 0,410 V: el <b>14,41 %</b> del rango. Se tiran 2,79 bits y el paso se va a 0,762 °C. Rango y resolución son la misma desigualdad.');
    await sleep(5400);
    scIdx=2;syncSel();apTopic='ruido';afterEdit();
    showToast('📶 Segundo criterio: el ruido. En el molino, el shunt amplificado ×20 deja σ = <b>0,849 mV</b>; el LSB de 10 bits vale 4,883 mV y aguanta.');
    await sleep(5000);
    apAdc='b12v5';afterEdit();
    showToast('Subamos a 12 bits: el escalón cae a 1,221 mV, por debajo de los <b>1,697 mV</b> de dos sigmas. Es el único criterio del banco que castiga tener MÁS bits.');
    await sleep(5400);
    apAdc='b10v5';scIdx=1;syncSel();apTopic='muestreo';afterEdit();
    showToast('⏱️ Tercer criterio: el muestreo. En la hidráulica el variador mete 25 mV a 4 kHz, muy por encima de la banda útil de 30 Hz.');
    await sleep(4800);
    apMues='m5k';afterEdit();
    showToast('Con 5 kS/s el filtro de 2 kHz deja pasar el 20 %: <b>5,000 mV</b>, ocho veces el medio LSB. Y se pliega a 1 kHz, dentro de lo que se quiere medir.');
    await sleep(5400);
    apMues='m200';afterEdit();
    showToast('Con 200 S/s el filtro de 80 Hz lo deja en <b>0,010 mV</b>. Ojo: se pliega a <b>0 Hz exactos</b>. Sin ese filtro sería un error de calibración que nadie sospecharía.');
    await sleep(5600);
    answer(QUIZ[mode].opciones.findIndex(o=>o.ok));
    await sleep(2600);

    // ---------- RETO
    setMode('reto');
    seedReto(0);updateRetoSpec();afterEdit();
    showToast('🎯 Reto: el horno, con la alimentación sucia por los contactores. La configuración de partida está mal en las tres decisiones.');
    await sleep(4200);
    checkReto();
    await sleep(5000);
    retoCh={...GOOD(retoSc())};retoChecked=false;retoSolved=false;solved=false;afterEdit();
    showToast('✔ 12 bits con referencia interna (la alimentación no sirve de referencia), ×100 para llenar el rango y 10 S/s con filtro de 4 Hz para una banda de 1,5 Hz.');
    await sleep(5200);
    checkReto();
    await sleep(2600);
    answer(QUIZ[mode].opciones.findIndex(o=>o.ok));
  }finally{
    btn.disabled=false;btn.classList.remove('on');btn.textContent=label;autoRunning=false;
  }
}
