<style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0xdde7f0, 10, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0d1218, roughness:0.48, metalness:0.3, envMapIntensity:0.8 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;
    }
    if(hook)hook(dt,t); controls.update();
    if(bokeh) bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);
    composer.render(); }
  function start(){ if(!raf)loop(); }
  function stop(){ cancelAnimationFrame(raf); raf=null; window.removeEventListener('resize',resize); }

  /* Sonda de escena para las auditorías del 3D. No cambia nada de lo que se ve
     y cuelga de `window.__diag3d`, que ningún laboratorio pisa: así CUALQUIER
     laboratorio construido con este molde se puede auditar —salud(), mira(),
     piezas()— sin tocarle una línea. */
  try { instalaDiag(document.title || location.pathname,
    { escena:scene, camara:camera, controles:controls, renderizador:renderer }); } catch(_){}

  return { THREE, renderer, scene, camera, controls, composer, bloom,
    setAnimate:fn=>hook=fn, start, stop, resize, clock,
    flyTo:(v)=>{ controls.target.copy(v); }, moveTo, setCinematicIdle };
}

function pickerFor(scene,camera,dom,onHit){
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(); let down=null;
  dom.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);

    if(!down)return; const moved=Math.abs(e.clientX-down[0])+Math.abs(e.clientY-down[1])>6; down=null;

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

// Sumadores y comparadores binarios (D3 · digital). Acarreo y complemento a 2.
// Física (verificada node -e, 20/20 exhaustiva):
//   SUMADOR COMPLETO (full adder): S = a ⊕ b ⊕ cin ; Cout = a·b + cin·(a⊕b) (mayoría de a,b,cin).
//   SUMADOR DE N BITS (ripple-carry): cadena de N sumadores completos; el acarreo se propaga del bit i al i+1.
//     Suma sin signo A+B+Cin: resultado de N bits + acarreo de salida (Cout). (2048 casos n=4 verificados)
//   COMPLEMENTO A 2: el negativo de B es ¬B + 1. Por eso RESTAR es SUMAR el complemento a 2:
//     A − B = A + ¬B + 1  →  un restador es un sumador con B invertido y Cin=1. (exhaustivo 4-bit)
//   DESBORDAMIENTO con signo: ocurre si los operandos tienen el MISMO signo y el resultado difiere;
//     equivale a Cin_MSB ⊕ Cout_MSB (acarreo que entra al bit de signo ⊕ el que sale). (ambos métodos coinciden)
//   COMPARADOR de magnitud: cascada desde el MSB; la primera posición que difiere decide A>B o A<B; si todas
//     coinciden, A=B. Salidas mutuamente excluyentes (gt+eq+lt=1). IGUALDAD = AND de los XNOR bit a bit.
//   Ref: Mano & Ciletti, "Diseño Digital" · Wakerly, "Digital Design" · Patterson & Hennessy, "Computer Org."
//        · TI 74x83/74x283 (sumador 4-bit), 74x85 (comparador 4-bit) · verificación numérica propia.

function fullAdder(a,b,cin){a=a?1:0;b=b?1:0;cin=cin?1:0;const s=a^b^cin;const cout=(a&b)|(cin&(a^b));return{s,cout};}
function rippleAdd(A,B,cin,n){
  const bits=new Array(n), carries=new Array(n+1);carries[0]=cin?1:0;let c=cin?1:0;
  for(let i=0;i<n;i++){const r=fullAdder((A>>i)&1,(B>>i)&1,c);bits[i]=r.s;c=r.cout;carries[i+1]=c;}
  const val=bits.reduce((acc,b,i)=>acc+(b<<i),0);
  return{bits,carries,cout:c,val};
}
function toSigned(u,n){return (u&(1<<(n-1)))?u-(1<<n):u;}
function twosComp(u,n){return ((~u)+1)&((1<<n)-1);}
function invBits(u,n){return (~u)&((1<<n)-1);}
function overflowOf(A,B,cin,n){const r=rippleAdd(A,B,cin,n);return r.carries[n-1]^r.carries[n];}
function compareU(A,B,n){
  let gt=0,lt=0,firstDiff=-1;
  for(let i=n-1;i>=0;i--){const a=(A>>i)&1,b=(B>>i)&1;if(!gt&&!lt){if(a&&!b){gt=1;firstDiff=i;}else if(!a&&b){lt=1;firstDiff=i;}}}
  return{gt,eq:(!gt&&!lt)?1:0,lt,firstDiff};
}
function binStr(v,n){return (v&((1<<n)-1)).toString(2).padStart(n,'0');}

function drawRipple(c,A,B,cin,n,x0,y0){

    const ai=(A>>i)&1, bi=(B>>i)&1, s=r.bits[i];

    // acarreo de entrada (borde derecho de la celda)
    const cinV=r.carries[i];
    c.fillStyle=cinV?WARN_HEX:'#33342a';c.beginPath();c.arc(x+cw+gap/2,y0+h/2,8,0,7);c.fill();

  }
  // Cout final (borde izquierdo del MSB)
  const lx=x0;
  c.fillStyle=r.cout?WARN_HEX:'#33342a';c.beginPath();c.arc(lx-gap/2,y0+h/2,8,0,7);c.fill();
  c.fillStyle=r.cout?'#0c1016':'#7a7a66';c.font='bold 12px Outfit, sans-serif';c.textAlign='center';c.fillText(r.cout,lx-gap/2,y0+h/2+4);
  c.fillStyle='#7a8494';c.font='11px Outfit, sans-serif';c.fillText('Cout',lx-gap/2,y0+h/2-16);
  c.fillStyle=cin?WARN_HEX:'#5a6472';c.fillText('Cin='+cin,x0+n*(cw+gap)-gap/2,y0+h/2-16);
  return r;
}

// evaluación pura de la configuración actual (la usan «Comprobar» y la demostración)
function retoEval(){
  const f=RETO_POOL[retoIdx],n=f.n,mask=(1<<n)-1,target=invBits(f.B,n);
  const opBval=retoOpB.reduce((a,b,i)=>a+((b?1:0)<<i),0);
  const okData=(opBval===target), okEn=(retoCin===1);
  // A + B' + Cin ≡ A − B (mod 2^n) tiene exactamente dos soluciones: (¬B, Cin=1) y (−B precalculado, Cin=0). Ambas restan.
  const okAlt=(opBval===((-f.B)&mask))&&retoCin===0;
  const r=rippleAdd(f.A,opBval,retoCin,n);
  return {okData,okEn,okAlt,solved:(okData&&okEn)||okAlt,opBval,r};
}
function drawReto(c){
  const f=RETO_POOL[retoIdx],n=f.n;
  const ev=retoEval(), r=ev.r;
  const vCh=retoChecked||demoShow, vSol=demoShow?ev.solved:retoSolved;
  c.fillStyle='#C7D6F5';c.font='bold 21px Outfit, sans-serif';c.textAlign='left';c.fillText('RETO · Construye un restador',30,42);
  c.fillStyle='#7a8494';c.font='13px Outfit, sans-serif';
  wrapText(c,'Calcula '+f.A+' − '+f.B+' con un SUMADOR: decide qué bits entran por el puerto B (fila B′) y qué acarreo inicial Cin usar para que la suma sea la resta pedida. '+f.ctx+'.',30,64,660,18);
  drawNumRow(c,170,130,'A = '+f.A,f.A,n,ACC,42);

function retoExplain(f,n,sol){
  const mask=(1<<n)-1,ev=retoEval(),r=ev.r;
  if(sol){
    const target=invBits(f.B,n);
    if(ev.okAlt&&!(ev.okData&&ev.okEn))return 'Precalculaste −B = '+binStr(ev.opBval,n)+' (complemento a 2) y lo sumaste con Cin=0: '+f.A+' + '+ev.opBval+' = '+toSigned(r.val,n)+'. Correcto; el hardware estándar lo hace con ¬B y Cin=1, sin calcular −B a mano.';
    return 'A + ¬B + 1 = '+f.A+' + '+target+' + 1 = '+f.A+' − '+f.B+' = '+toSigned(r.val,n)+'. Un restador es un sumador con B invertido y acarreo inicial 1: el mismo hardware suma y resta.';
  }
  // Cualitativo: lo que HACE tu configuración, sin decir qué bits ni qué Cin son los correctos
  const diff=(r.val-((f.A-f.B)&mask))&mask;
  if(diff===mask)return 'Tu suma da '+toSigned(r.val,n)+' en vez de '+(f.A-f.B)+': una unidad de menos. Piensa en qué diferencia hay entre invertir los bits de B y obtener −B en complemento a 2.';
  return 'Tu suma da '+toSigned(r.val,n)+', no '+(f.A-f.B)+'. Piensa qué valor debe entrar por el puerto B del sumador (y con qué acarreo inicial) para que la suma equivalga a restar B.';
}

    c.font='12px Outfit, sans-serif';c.fillStyle='#9fb0cf';c.fillText('cascada desde MSB',162,150);
  }else{const N=dev.n,r=rippleAdd(dev.A,dev.B,dev.cin,N);
    c.fillText('SUMADOR '+N+' bit',162,28);
    c.font='14px Outfit, sans-serif';c.fillStyle='#9fb0cf';c.fillText(dev.A+' + '+dev.B+(dev.cin?' + 1':''),162,58);
    if(dev.hide){c.font='bold 30px Outfit, sans-serif';c.fillStyle='#5a6472';c.fillText('= ?',162,108);
      c.font='12px Outfit, sans-serif';c.fillStyle='#9fb0cf';c.fillText('se calcula al comprobar',162,148);}

    c.font='12px Outfit, sans-serif';c.fillStyle=r.cout?WARN_HEX:'#9fb0cf';c.fillText('Cout = '+r.cout,162,148);}

function hwCount(){const dev=curDevice();return dev.kind==='fa'?8:(dev.n||4);}
function updateHW(){
  const dev=curDevice(),step=hwStep%hwCount();
  bitLEDs.forEach(l=>l.visible=false);carryLEDs.forEach(l=>l.visible=false);cmpLEDs.forEach(l=>l.visible=false);
  if(dev.kind==='fa'){
    const a=(step>>2)&1,b=(step>>1)&1,ci=step&1,r=fullAdder(a,b,ci);
    bitLEDs[0].visible=true;bitLEDs[0].material.emissiveIntensity=r.s?0.95:0.12;bitLEDs[0].material.color.setHex(r.s?0x7CD992:0x243026);
    carryLEDs[1].visible=true;carryLEDs[1].material.emissiveIntensity=r.cout?0.95:0.12;carryLEDs[1].material.color.setHex(r.cout?0xE9C46A:0x2a2a20);
  }else if(dev.kind==='cmp'){
    const r=compareU(dev.A,dev.B,dev.n),arr=[r.gt,r.eq,r.lt],cols=[0x7CD992,0x8AB4F8,0xff6b6b];
    cmpLEDs.forEach((l,i)=>{l.visible=true;l.material.emissiveIntensity=arr[i]?0.95:0.1;l.material.color.setHex(arr[i]?cols[i]:0x2a3550);});
  }else{
    const N=dev.n,r=rippleAdd(dev.A,dev.B,dev.cin,N);
    for(let i=0;i<N;i++){const l=bitLEDs[i];l.visible=true;const s=r.bits[i],active=(i===step);
      l.material.emissiveIntensity=active?0.95:(s?0.6:0.12);l.material.color.setHex(s?(active?0x7CD992:0x3a5a44):(active?0x8AB4F8:0x2a3550));}
    for(let i=0;i<=N;i++){const l=carryLEDs[i];l.visible=true;const cv=r.carries[i],active=(i===step||i===step+1);
      l.material.emissiveIntensity=(cv&&active)?0.95:(cv?0.55:0.1);l.material.color.setHex(cv?0xE9C46A:0x2a2a20);}
    if(dev.hide){bitLEDs.forEach(l=>l.visible=false);carryLEDs.forEach(l=>l.visible=false);}   // reto: la suma se ve al comprobar
  }
  // interruptores: reflejan los operandos A, B y el acarreo de entrada del bloque activo
  const aV=dev.kind==='fa'?((step>>2)&1):(dev.A||0), bV=dev.kind==='fa'?((step>>1)&1):(dev.B||0), ciV=dev.kind==='fa'?(step&1):(dev.cin?1:0);
  for(let k=0;k<4;k++){TU.sw[k].userData.pon((aV>>(3-k))&1);TU.sw[4+k].userData.pon((bV>>(3-k))&1);}
  TU.sw[8].userData.pon(ciV);
  drawChip3D(dev,step);
}

  <h2>Sumadores y Comparadores Binarios</h2>
  <p>La aritmética de toda computadora se construye con una celda: el <b>sumador completo</b>, que suma tres
  bits (a, b y el acarreo de entrada) y entrega la suma <b>S = a⊕b⊕cin</b> y el acarreo de salida
  <b>Cout</b> (la mayoría de las tres entradas). Encadenando N celdas —la Cout de una es la Cin de la
  siguiente— nace el <b>sumador de N bits</b> (ripple-carry). Lo más elegante: el mismo circuito RESTA sin
  hardware extra, porque en <b>complemento a 2</b> el negativo de B es ¬B+1, así que
  <b>A − B = A + ¬B + 1</b> (basta invertir B y poner Cin=1). En aritmética con signo aparece el
  <b>desbordamiento</b>, que se detecta comparando el acarreo que entra al bit de signo con el que sale
  (Cin_MSB ⊕ Cout_MSB). Y el <b>comparador</b> decide A&gt;B, A=B o A&lt;B recorriendo los bits desde el más
  significativo; la igualdad es la AND de los XNOR bit a bit.</p>

function teleRow(l,v,cls){return `<div class="trow"><span class="tl">${l}</span><span class="tv ${cls||''}">${v}</span></div>`;}
function updateTele(){
  const t=el('tele');

    const f=RETO_POOL[retoIdx],n=f.n,target=invBits(f.B,n);
    const opBval=retoOpB.reduce((a,b,i)=>a+((b?1:0)<<i),0),r=rippleAdd(f.A,opBval,retoCin,n);

      teleRow('Estado',retoChecked?(retoSolved?'✔ correcto':'✗ revisa'):'configura y comprueba',(retoChecked&&retoSolved)?'good':'warn');
    return;
  }
  if(mode==='aplica'){
    if(apTopic==='sub'){const f=APLICA_POOL[apFnIdx],n=f.n,r=rippleAdd(f.A,invBits(f.B,n),1,n);
      t.innerHTML=teleRow('Tema','Resta = A + ¬B + 1')+teleRow('Operación',f.A+' − '+f.B)+teleRow('¬B',binStr(invBits(f.B,n),n))+teleRow('A+¬B+1',String(r.val)+' → '+toSigned(r.val,n))+teleRow('A−B esperado',String(f.A-f.B),(toSigned(r.val,n)===(f.A-f.B))?'good':'warn');
    }else if(apTopic==='ovf'){const f=OVF_POOL[apOvfIdx],n=f.n,r=rippleAdd(f.A,f.B,0,n);const ov=r.carries[n-1]^r.carries[n];
      t.innerHTML=teleRow('Tema','Desbordamiento con signo')+teleRow('Operación',toSigned(f.A,n)+' + '+toSigned(f.B,n))+teleRow('Resultado',String(toSigned(r.val,n)),ov?'warn':'good')+teleRow('Suma real',String(toSigned(f.A,n)+toSigned(f.B,n)))+teleRow('Desbordamiento',ov?'SÍ':'no',ov?'warn':'good');
    }else{const f=APLICA_POOL[apFnIdx],n=f.n;let eq=1;for(let i=0;i<n;i++)eq&=(((f.A>>i)&1)===((f.B>>i)&1))?1:0;const cmp=compareU(f.A,f.B,n);
      t.innerHTML=teleRow('Tema','Igualdad = AND de XNOR')+teleRow('Comparar',f.A+' vs '+f.B)+teleRow('A = B',String(eq),eq?'good':'')+teleRow('Veredicto',cmp.gt?'A > B':(cmp.lt?'A < B':'A = B'))+teleRow('Salidas activas',String(cmp.gt+cmp.eq+cmp.lt)+' (una)');
    }
    return;
  }
  if(expKind==='fa'){const r=fullAdder(faA,faB,faCin);
    t.innerHTML=teleRow('Bloque','Sumador completo')+teleRow('a b cin',faA+' '+faB+' '+faCin)+teleRow('Suma S',String(r.s),r.s?'good':'')+teleRow('Acarreo Cout',String(r.cout),r.cout?'warn':'')+teleRow('a+b+cin',String(faA+faB+faCin));
  }else if(expKind==='add'){const r=rippleAdd(addA,addB,addCin,addN);
    t.innerHTML=teleRow('Bloque','Sumador '+addN+' bits')+teleRow('A + B + Cin',addA+' + '+addB+' + '+addCin)+teleRow('Suma (N bits)',r.val+' = '+binStr(r.val,addN),'good')+teleRow('Cout',String(r.cout),r.cout?'warn':'')+teleRow('Con signo',String(toSigned(r.val,addN)));
  }else{const r=compareU(cmpA,cmpB,cmpN);
    t.innerHTML=teleRow('Bloque','Comparador '+cmpN+' bits')+teleRow('A vs B',cmpA+' vs '+cmpB)+teleRow('Veredicto',r.gt?'A > B':(r.lt?'A < B':'A = B'),'good')+teleRow('1ª diferencia',r.firstDiff>=0?('bit '+r.firstDiff):'ninguna')+teleRow('Salidas activas',String(r.gt+r.eq+r.lt)+' (una)');
  }
}

  }else if(mode==='aplica'){
    if(apTopic==='sub'){const f=APLICA_POOL[apFnIdx],n=f.n;html+=`<span class="mono">${f.A} − ${f.B} = ${f.A} + ¬${f.B} + 1 = ${f.A} + ${invBits(f.B,n)} + 1. El mismo sumador resta con sólo invertir B y Cin=1.</span>`;}
    else if(apTopic==='ovf'){const f=OVF_POOL[apOvfIdx],n=f.n,r=rippleAdd(f.A,f.B,0,n);const ov=r.carries[n-1]^r.carries[n];html+=`<span class="mono">${toSigned(f.A,n)} + ${toSigned(f.B,n)} ${ov?'DESBORDA':'cabe'}: los métodos de signos y de acarreos (Cin_MSB⊕Cout_MSB) coinciden.</span>`;}
    else{const f=APLICA_POOL[apFnIdx];html+=`<span class="mono">${f.A} vs ${f.B}: la AND de los XNOR bit a bit da la igualdad; la comparación desde el MSB da la magnitud (>, =, <).</span>`;}
  }else{
    if(expKind==='fa'){const r=fullAdder(faA,faB,faCin);html+=`<span class="mono">Sumador completo: ${faA}+${faB}+${faCin} → S=${r.s}, Cout=${r.cout}. S=a⊕b⊕cin, Cout=mayoría.</span>`;}
    else if(expKind==='add'){const r=rippleAdd(addA,addB,addCin,addN);html+=`<span class="mono">Sumador ${addN} bits: ${addA}+${addB}+${addCin} = ${r.val} (Cout=${r.cout}). Con signo: ${toSigned(r.val,addN)}.</span>`;}

  el('report').innerHTML=html;
}

function checkReto(){

  retoSolved=ev.solved;retoChecked=true;solved=retoSolved;
  synth.beep(retoSolved?1046:220,retoSolved?0.14:0.15,0.06);
  retoMsg=`<span class="mono"><span class="${retoSolved?'ok':'dtc'}">${retoSolved?'✔ Correcto':'✗ Revisa'}</span> — ${retoExplain(f,n,retoSolved)}</span>`;
  if(!retoSolved){
    intentos++;
    if(intentos>=3){
      // 3 fallos: objetivo nuevo (no se aprueba por eliminación) y sin revelar la solución
      seedReto();updateRetoSpec();solved=false;
      retoMsg='<span class="mono"><span class="dtc">✗ Revisa</span> — Tres intentos fallidos: el objetivo se renovó ('+RETO_POOL[retoIdx].ctx+'). Razona en complemento a 2 antes de comprobar.</span>';
      showToast('🔀 Tres intentos fallidos: nuevo objetivo, '+RETO_POOL[retoIdx].ctx+'.');
      afterEdit();return;
    }
  }
  refreshAll();
}

// ===================== 13. QUIZ =====================
function buildQuiz(){
  QUIZ={
    explora:{
      pregunta:'¿Qué produce el acarreo de salida (Cout) de un sumador completo?',
      opciones:[
        {t:'Cout = 1 cuando al menos dos de las tres entradas valen 1 (mayoría, Cout = a·b + cin·(a⊕b)): es el acarreo que se lleva al bit siguiente.',ok:true,why:'Correcto: sumar tres bits puede dar hasta 3 (=11 binario); el bit alto es el acarreo. Aparece justo cuando hay dos o tres unos entre a, b y cin.'},
        {t:'Cout = a ⊕ b ⊕ cin, la misma función que la suma S, porque ambas salidas cambian exactamente con las mismas combinaciones de entrada del bloque.',ok:false,why:'Esa es la SUMA S, no el acarreo. Cout es la mayoría de las entradas (a·b + cin·(a⊕b)), que es distinta de la paridad.'},
        {t:'Cout siempre vale lo mismo que cin, porque el sumador completo solo se limita a propagar el acarreo de entrada al bit siguiente.',ok:false,why:'No: con a=b=1 y cin=0, Cout=1 aunque cin=0. El acarreo de salida depende de las tres entradas, no sólo del de entrada.'},
        {t:'Cout vale 1 solo cuando las tres entradas valen 1, que es el único caso en que la suma de los tres bits no cabe en uno solo.',ok:false,why:'Eso lo cumple la AND, pero Cout también es 1 con exactamente dos unos (p. ej. a=1, b=1, cin=0). Es la mayoría, no la AND.'},
      ],
    },
    aplica:{
      pregunta:'¿Por qué A − B se calcula como A + ¬B + 1 con un sumador?',
      opciones:[
        {t:'Porque en complemento a 2 el negativo de B es ¬B + 1; sumar ese negativo equivale a restar B, y el +1 entra gratis como acarreo inicial.',ok:true,why:'Correcto: −B = ¬B + 1 (complemento a 2). Entonces A − B = A + (−B) = A + ¬B + 1. Invertir B y poner Cin=1 convierte el sumador en restador sin hardware extra.'},
        {t:'Porque invertir los bits de B ya es, por sí solo, el negativo de B, y el +1 final solo sirve para evitar un desbordamiento al sumar.',ok:false,why:'Casi: ¬B es el complemento a UNO, que da −B − 1. Falta sumar 1 (el Cin=1) para obtener el complemento a DOS, el verdadero −B.'},
        {t:'Porque restar y sumar son la misma operación en cualquier representación numérica, incluidas signo-magnitud y BCD, sin ajustes adicionales de ningún tipo.',ok:false,why:'No en general: en signo-magnitud o BCD no basta invertir y sumar 1. El truco A+¬B+1 es específico del complemento a 2.'},
        {t:'Porque el acarreo de salida (Cout) siempre corrige la resta, sumando uno al resultado cuando el sumador termina de propagar.',ok:false,why:'El Cout se descarta en esta resta; lo que hace la magia es el acarreo de ENTRADA (Cin=1), no el de salida.'},
      ],
    },
    reto:{
      pregunta:'Al restar números SIN signo con A + ¬B + 1 en N bits, ¿qué indica que el acarreo de salida (Cout) valga 0?',
      opciones:[
        {t:'Que A es menor que B: la resta sin signo "pidió prestado" y el resultado correcto es negativo, no representable sin signo.',ok:true,why:'Correcto: Cout=1 significa A ≥ B (no hubo préstamo); Cout=0 significa A < B. Por ejemplo, 3 − 7 en 4 bits: 3 + 8 + 1 = 12 < 16, sin acarreo, y 12 = −4 en complemento a 2.'},
        {t:'Que el sumador falló: en una resta bien hecha el acarreo de salida debe valer siempre 1 al terminar la operación completa en el último bit.',ok:false,why:'No: el acarreo de salida es información, no un error. Vale 1 cuando A ≥ B y 0 cuando A < B.'},
        {t:'Que A es mayor que B, porque un acarreo nulo indica que no hubo nada que restar en el bit más significativo del resultado.',ok:false,why:'Es al revés: con A + ¬B + 1, un acarreo de salida 1 indica A ≥ B; el 0 indica que A es menor que B.'},
        {t:'Que hubo desbordamiento con signo, ya que Cout=0 es la condición de overflow en cualquier suma o resta de N bits.',ok:false,why:'El desbordamiento con signo se detecta con Cin_MSB ⊕ Cout_MSB, no con el valor de Cout por sí solo; son conceptos distintos.'},
      ],
    },
  };
  Object.values(QUIZ).forEach(q=>{for(let i=q.opciones.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const tmp=q.opciones[i];q.opciones[i]=q.opciones[j];q.opciones[j]=tmp;}});
}
function clearDx(){const box=el('dxbtns');if(box)box.innerHTML='';}
function refreshQuestion(){
  const q=QUIZ[mode];if(!q)return;
  el('q_text').textContent=q.pregunta;
  const box=el('dxbtns');
  box.innerHTML=q.opciones.map((o,i)=>`<button class="b sm" data-i="${i}">${String.fromCharCode(65+i)}) ${o.t}</button>`).join('');
  box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(parseInt(b.dataset.i,10)));
}
function answer(i){
  const q=QUIZ[mode];if(!q)return;
  const box=el('dxbtns'),btns=box.querySelectorAll('[data-i]');
  if(!btns.length||btns[0].disabled)return;
  const o=q.opciones[i];btns.forEach(b=>b.disabled=true);btns[i].classList.add(o.ok?'right':'wrong');
  if(o.ok){synth.beep(1046,0.12,0.06);}else{synth.beep(220,0.15,0.06);}
  showToast((o.ok?'✔ ':'✗ ')+o.why);
}

// ===================== 14. PICKING Y HOVER =====================
pickerFor(scene,S.camera,S.renderer.domElement,hit=>{
  if(!hit)return;
  if(hit.object===board){boardClick();return;}
  let o=hit.object;while(o){if(o.userData&&o.userData.title){showToast('<b>'+o.userData.title+'</b><br>'+(o.userData.info||''));return;}o=o.parent;}
});
(function hoverLoop(){
  const ray=new THREE.Raycaster(),dom=S.renderer.domElement;let mx=0,my=0;
  dom.addEventListener('pointermove',e=>{const r=dom.getBoundingClientRect();mx=((e.clientX-r.left)/r.width)*2-1;my=-((e.clientY-r.top)/r.height)*2+1;});
  function tick(){
    ray.setFromCamera({x:mx,y:my},S.camera);let hovered=false;
    for(const [obj,spr] of HOVER_LABELS){if(!obj.visible){spr.visible=false;continue;}const on=ray.intersectObject(obj,true).length>0;spr.visible=on;if(on)hovered=true;}
    dom.style.cursor=hovered?'pointer':'default';requestAnimationFrame(tick);
  }
  tick();
})();

// ===================== 15. RECORRIDO AUTOMÁTICO =====================
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function runAuto(){
  if(autoRunning)return;autoRunning=true;
  const btn=el('btnAuto'),label=btn.textContent;btn.disabled=true;btn.classList.add('on');btn.textContent='⏳ Recorriendo…';
  // DEMOSTRACIÓN: guarda el estado del alumno y lo restituye (el recorrido jamás deja el reto resuelto)
  const prev={mode,expKind,faA,faB,faCin,addN,addA,addB,addCin,cmpN,cmpA,cmpB,apTopic,apFnIdx,apOvfIdx,retoIdx,retoOpB:retoOpB.slice(),retoCin,retoChecked,retoOkData,retoOkEnable,retoSolved,retoMsg,intentos,solved};
  try{
    synth.init();synth.resume();clearDx();
    setMode('explora');
    expKind='fa';faA=1;faB=1;faCin=1;afterEdit();
    showToast('🧱 Sumador completo: 1+1+1 = 3 → S=1 y Cout=1. La suma es a⊕b⊕cin; el acarreo es la mayoría.');
    await sleep(4200);
    expKind='add';addN=4;addA=6;addB=5;addCin=0;afterEdit();
    showToast('➕ Sumador de 4 bits: 6+5 = 11. Observa el acarreo propagándose de bit en bit.');
    await sleep(4200);
    expKind='cmp';cmpN=4;cmpA=9;cmpB=6;afterEdit();
    showToast('⚖️ Comparador: 9 vs 6. Se decide en el primer bit que difiere desde el MSB → A > B.');
    await sleep(4000);
    answer(QUIZ[mode].opciones.findIndex(o=>o.ok));await sleep(2600);

    setMode('aplica');
    apTopic='sub';apFnIdx=0;afterEdit();
    showToast('🔄 Restar sumando: 12 − 5 = 12 + ¬5 + 1. El sumador resta con sólo invertir B y Cin=1.');
    await sleep(4400);
    apTopic='ovf';apOvfIdx=0;afterEdit();
    showToast('💥 Desbordamiento: +6 + +5 no cabe en 4 bits con signo. Signos y acarreos lo detectan igual.');
    await sleep(4400);
    apTopic='eq';apFnIdx=2;afterEdit();
    showToast('🟰 Igualdad: 7 vs 7. La AND de los XNOR bit a bit vale 1 → A = B.');
    await sleep(4000);
    answer(QUIZ[mode].opciones.findIndex(o=>o.ok));await sleep(2600);

    setMode('reto');
    // DEMOSTRACIÓN: no se pulsa «Comprobar»; el reto del alumno queda como estaba
    seedReto(0);updateRetoSpec();afterEdit();
    showToast('🎯 Demostración con '+RETO_POOL[retoIdx].ctx+'. Primero invertimos B pero dejamos Cin=0 a propósito…');
    (function(){const f=RETO_POOL[retoIdx],n=f.n,t=invBits(f.B,n);retoOpB=Array.from({length:n},(_,i)=>(t>>i)&1);retoCin=0;})();
    demoShow=true;afterEdit();await sleep(3400);
    showToast('…¬B con Cin=0 da A − B − 1 (una unidad de menos). Activamos Cin.');
    await sleep(3600);
    retoCin=1;afterEdit();
    showToast('✔ ¬B + Cin=1: el sumador calcula A − B. Esto es solo una demostración: tu reto sigue intacto.');
    await sleep(3200);
    demoShow=false;
    answer(QUIZ[mode].opciones.findIndex(o=>o.ok));await sleep(2400);
  }finally{
    demoShow=false;
    expKind=prev.expKind;faA=prev.faA;faB=prev.faB;faCin=prev.faCin;addN=prev.addN;addA=prev.addA;addB=prev.addB;addCin=prev.addCin;cmpN=prev.cmpN;cmpA=prev.cmpA;cmpB=prev.cmpB;
    apTopic=prev.apTopic;apFnIdx=prev.apFnIdx;apOvfIdx=prev.apOvfIdx;
    retoIdx=prev.retoIdx;retoOpB=prev.retoOpB;retoCin=prev.retoCin;retoChecked=prev.retoChecked;retoOkData=prev.retoOkData;retoOkEnable=prev.retoOkEnable;
    retoSolved=prev.retoSolved;retoMsg=prev.retoMsg;intentos=prev.intentos;
    btn.disabled=false;btn.classList.remove('on');btn.textContent=label;autoRunning=false;
    setMode(prev.mode);
    solved=(prev.mode==='reto')?retoSolved:false;
  }
}

window.__labDebug={
  mode:()=>mode, setMode:k=>setMode(k),
  // física pura
  fullAdder:(a,b,ci)=>fullAdder(a,b,ci),
  rippleAdd:(A,B,ci,n)=>{const r=rippleAdd(A,B,ci,n);return{bits:r.bits.slice(),carries:r.carries.slice(),cout:r.cout,val:r.val};},
  toSigned:(u,n)=>toSigned(u,n),
  twosComp:(u,n)=>twosComp(u,n),
  invBits:(u,n)=>invBits(u,n),
  compareU:(A,B,n)=>compareU(A,B,n),
  overflow:(A,B,ci,n)=>overflowOf(A,B,ci,n),
  // explora
  expKind:()=>expKind, setExpKind:k=>{if(mode==='explora'){expKind=k;afterEdit();}},
  faState:()=>({a:faA,b:faB,cin:faCin,...fullAdder(faA,faB,faCin)}),
  setFA:(a,b,ci)=>{if(mode==='explora'){if(a!=null)faA=a?1:0;if(b!=null)faB=b?1:0;if(ci!=null)faCin=ci?1:0;afterEdit();}},
  addState:()=>{const r=rippleAdd(addA,addB,addCin,addN);return{n:addN,A:addA,B:addB,cin:addCin,val:r.val,cout:r.cout,bits:r.bits.slice(),carries:r.carries.slice(),signed:toSigned(r.val,addN)};},
  setAdd:(n,A,B,ci)=>{if(mode==='explora'){if(n!=null)addN=n;if(A!=null)addA=A&((1<<addN)-1);if(B!=null)addB=B&((1<<addN)-1);if(ci!=null)addCin=ci?1:0;afterEdit();}},
  cmpState:()=>{const r=compareU(cmpA,cmpB,cmpN);return{n:cmpN,A:cmpA,B:cmpB,gt:r.gt,eq:r.eq,lt:r.lt,firstDiff:r.firstDiff};},
  setCmp:(n,A,B)=>{if(mode==='explora'){if(n!=null)cmpN=n;if(A!=null)cmpA=A&((1<<cmpN)-1);if(B!=null)cmpB=B&((1<<cmpN)-1);afterEdit();}},
  // aplica
  apTopic:()=>apTopic, setApTopic:t=>{if(mode==='aplica'){apTopic=t;afterEdit();}},
  apFn:()=>({...APLICA_POOL[apFnIdx]}), setApFn:i=>{if(mode==='aplica'){apFnIdx=i;afterEdit();}},
  apOvf:()=>({...OVF_POOL[apOvfIdx]}), setApOvf:i=>{if(mode==='aplica'){apOvfIdx=i;afterEdit();}},
  apSubResult:()=>{const f=APLICA_POOL[apFnIdx],n=f.n,r=rippleAdd(f.A,invBits(f.B,n),1,n);return{val:r.val,signed:toSigned(r.val,n),expected:((f.A-f.B)&((1<<n)-1)),ok:(r.val===((f.A-f.B)&((1<<n)-1)))};},
  apOvfResult:()=>{const f=OVF_POOL[apOvfIdx],n=f.n,r=rippleAdd(f.A,f.B,0,n);const carry=r.carries[n-1]^r.carries[n];const sA=(f.A>>(n-1))&1,sB=(f.B>>(n-1))&1,sS=(r.val>>(n-1))&1;const sign=(sA===sB&&sS!==sA)?1:0;return{carryMethod:carry,signMethod:sign,agree:carry===sign,trueSum:toSigned(f.A,n)+toSigned(f.B,n),fits:!(carry)};},
  apEqResult:()=>{const f=APLICA_POOL[apFnIdx],n=f.n;let eq=1;for(let i=0;i<n;i++)eq&=(((f.A>>i)&1)===((f.B>>i)&1))?1:0;return{eq,expected:(f.A===f.B?1:0)};},
  // reto
  retoIdx:()=>retoIdx, retoFn:()=>({...RETO_POOL[retoIdx]}),
  retoOpB:()=>retoOpB.slice(), retoCin:()=>retoCin,
  retoTarget:()=>{const f=RETO_POOL[retoIdx],n=f.n,t=invBits(f.B,n);return Array.from({length:n},(_,i)=>(t>>i)&1);},
  retoSetOpB:arr=>{if(mode==='reto'){retoOpB=arr.slice();retoChecked=false;retoSolved=false;solved=false;afterEdit();}},
  retoSetCin:e=>{if(mode==='reto'){retoCin=e?1:0;retoChecked=false;retoSolved=false;solved=false;afterEdit();}},
  retoToggle:i=>{if(mode==='reto'){retoOpB[i]=retoOpB[i]?0:1;retoChecked=false;retoSolved=false;solved=false;afterEdit();}},
  retoSolveSub:()=>{if(mode==='reto'){const f=RETO_POOL[retoIdx],n=f.n,t=invBits(f.B,n);retoOpB=Array.from({length:n},(_,i)=>(t>>i)&1);retoCin=1;afterEdit();}},
  checkReto:()=>checkReto(), intentos:()=>intentos,
  retoChecked:()=>retoChecked, retoOkData:()=>retoOkData, retoOkEnable:()=>retoOkEnable, retoSolved:()=>retoSolved,
  seedReto:idx=>{seedReto(idx);updateRetoSpec();afterEdit();},
  newSignal:()=>newSignal(),
  hwStep:()=>hwStep,
  reportText:()=>el('report').innerText,
  quizAnswer:i=>answer(i), quizCorrectIndex:()=>QUIZ[mode].opciones.findIndex(o=>o.ok),
  solved:()=>solved,
};
