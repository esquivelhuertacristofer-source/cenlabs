<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Curvas V del Motor Síncrono — Laboratorio 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08201C;--panel:rgba(9,26,23,.86);--line:#1E3A34;--ink:#EAF4F1;
    --dim:#8FB3AC;--accent:#2A9D8F;--accent2:#4FD1C5;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(10,13,18,.92),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

  .badge{position:fixed;top:16px;right:20px;z-index:20;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,209,102,.12);color:var(--hv);border:1px solid rgba(255,209,102,.35);padding:6px 12px;border-radius:20px}

  .hud{position:fixed;top:70px;left:18px;z-index:15;max-width:330px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-height:calc(100vh - 150px);overflow-y:auto}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .hud h2{font-size:19px;line-height:1.15;margin-bottom:9px}
  .hud p{font-size:13px;line-height:1.55;color:var(--dim);margin-bottom:10px}
  .hud .formula{font-family:var(--mono);color:var(--accent2);text-align:center;font-size:12.5px;margin:8px 0;padding:8px;background:rgba(0,0,0,.25);border-radius:8px;line-height:1.5}
  .hud .src{font-size:10.5px;color:#7a8894;font-style:italic;margin-top:4px;line-height:1.5}
  .legend{display:flex;flex-direction:column;gap:6px;margin:12px 0;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:10px}
  .legend .li{display:flex;align-items:center;gap:8px;font-size:11px;color:#c4d0da}
  .legend .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .fid{margin:10px 0 2px;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:10px;border:1px solid rgba(79,209,197,.18)}
  .fid .ft{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);margin-bottom:6px}
  .fid .fl{font-size:11px;color:#c4d0da;line-height:1.5;margin-bottom:5px}
  .fid .fl b{color:var(--ink)}
  .fid .fl.no b{color:var(--hv)}

  .panel{position:fixed;top:70px;right:18px;z-index:15;width:262px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:16px;max-height:calc(100vh - 150px);overflow-y:auto}
  .panel h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:2px 0 10px}
  .panel h4.sec{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .g{margin-bottom:6px}
  .gl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .gl b{color:var(--accent2)}
  .gl b.good{color:var(--good)}.gl b.warn{color:var(--hv)}.gl b.bad{color:var(--bad)}
  .modebar{display:flex;gap:5px;margin-bottom:8px}
  .modebar .b{flex:1;padding:8px 4px;font-size:11px}
  .btns{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .b{font-family:system-ui;font-size:12.5px;padding:10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#1b242f;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#202c38}
  .b.on{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:bold}
  .b.primary{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:bold}
  .b.auto{border-color:var(--hv);color:var(--hv);background:rgba(255,183,3,.10);font-weight:bold}
  .b.auto:hover{background:rgba(255,183,3,.18);border-color:var(--hv)}
  .b.auto:disabled{opacity:.6;cursor:default}
  .b.dx{text-align:left;font-size:12px}
  .b.dx.right{background:rgba(52,211,153,.18);border-color:var(--good);color:var(--good);font-weight:bold}
  .b.dx.wrong{background:rgba(244,71,94,.15);border-color:var(--bad);color:var(--bad)}
  .console{font-family:var(--mono);font-size:11px;line-height:1.55;color:#c4d0da;background:rgba(0,0,0,.28);border-radius:9px;padding:10px 12px;margin-bottom:8px;min-height:56px}
  .console .dtc{color:var(--bad);font-weight:bold}
  .console .ok{color:var(--good)}
  .console .mono{color:var(--dim)}

  .hint{position:fixed;bottom:18px;left:18px;z-index:14;font-family:var(--mono);font-size:10px;color:var(--dim);background:var(--panel);padding:7px 12px;border-radius:9px;border:1px solid var(--line)}
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(18,24,32,.95);border:1px solid var(--accent);padding:10px 20px;border-radius:40px;font-family:var(--mono);font-size:12px;opacity:0;transition:.3s;pointer-events:none;max-width:80vw;text-align:center}
  .toast.show{opacity:1}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}
  .soundBtn:hover{transform:scale(1.08)}
  .inspectHint{position:fixed;bottom:18px;right:18px;z-index:14;font-family:var(--mono);font-size:10px;color:var(--accent2);background:var(--panel);padding:7px 12px;border-radius:9px;border:1px solid var(--line)}

  @media(max-width:820px){
    .hud,.panel{position:fixed;left:8px;right:8px;top:auto;bottom:8px;max-width:none;width:auto;max-height:42vh;overflow-y:auto}
    .hud{bottom:calc(8px + 42vh + 8px)}
    .hint,.inspectHint{display:none}
  }
</style>
</head>

  <div class="brand">CEN<span> Labs</span></div>

</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.26, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;
    }
    if(hook)hook(dt,t); controls.update();
    if(bokeh) bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);
    composer.render(); }
  function start(){ if(!raf)loop(); }
  function stop(){ cancelAnimationFrame(raf); raf=null; window.removeEventListener('resize',resize); }

  return { THREE, renderer, scene, camera, controls, composer, bloom,
    setAnimate:fn=>hook=fn, start, stop, resize, clock,
    flyTo:(v)=>{ controls.target.copy(v); }, moveTo, setCinematicIdle };
}

function pickerFor(scene,camera,dom,onHit){
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(); let down=null;
  dom.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
  dom.addEventListener('pointerup',e=>{
    if(!down)return; const moved=Math.abs(e.clientX-down[0])+Math.abs(e.clientY-down[1])>6; down=null;

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

/* ============================================================
   LAB — Curvas V del Motor Síncrono (compensador de FP)
   Dominio: D5 Máquinas eléctricas · Molde: S+P (esquemático + panel)
   Física: motor síncrono de rotor liso, resistencia de armadura
   despreciable (Ra≈0). Para tensión de fase Vt y reactancia
   síncrona Xs fijas, cada nivel de carga mecánica P (constante)
   define una "curva V": corriente de armadura Ia en función de
   la corriente de campo If (%), con un mínimo exacto en factor
   de potencia unitario. A la izquierda del mínimo el motor
   "pide" reactivos a la red (subexcitado, FP en atraso); a la
   derecha los "entrega" (sobreexcitado, FP en adelanto) — este
   es el mecanismo real detrás de usar un motor síncrono como
   compensador de factor de potencia en una planta industrial
   que comparte el mismo bus con cargas inductivas.

   Modelo (por fase, diagrama fasorial con Ra≈0):
     Ef∠−δ = Vt∠0° − j·Xs·Ia      sen δ = P·Xs / (Vt·Ef)
   δ se resuelve en forma cerrada; de ahí Ia y Q por fase. El
   reto de compensación invierte el problema con bisección:
   dado un Q objetivo (cancelar la carga industrial), ¿qué Ef
   (If%) lo produce, respetando el límite térmico de armadura?

   ⚑ Vt_línea, Xs, Ia_nom, If_mín/máx y las dos cargas
   industriales son valores ilustrativos de catálogo típico
   (motor síncrono industrial de tamaño medio), no de una
   máquina real verificada. NO modela: saturación magnética
   (curva de magnetización se asume lineal), resistencia de
   armadura, arranque/sincronización a la red, límite de
   estabilidad dinámica transitoria, ni pérdidas mecánicas
   o de núcleo.
   ============================================================ */
const mount=document.getElementById('stage');

/* ---------- §1 Modelo físico ---------- */
const VT_LINE=460;                 // ⚑ tensión de línea trifásica ilustrativa (V)
const VT=VT_LINE/Math.sqrt(3);     // tensión de fase (V) ≈ 265.58
const XS=4;                        // ⚑ reactancia síncrona por fase, rotor liso (Ω)
const IA_RATED=50;                 // ⚑ límite térmico de armadura (A)
const IF_MIN=60, IF_MAX=180;       // rango del reóstato de campo (% de If nominal)
const P_LEVELS=[0,8000,15000];     // niveles de carga mecánica trifásica (W)
const P_COLOR={0:'#4FD1C5',8000:'#FFB703',15000:'#8AB4F8'};
const P_LABEL={0:'0 kW (condensador síncrono)',8000:'8 kW',15000:'15 kW'};
const LOADS={
  A:{p3:50000,pf:0.8,label:'Carga A · 50 kW, FP 0.80 atraso'},
  B:{p3:70000,pf:0.7,label:'Carga B · 70 kW, FP 0.70 atraso'},
};

function efFromIf(ifPct){ return VT*(ifPct/100); }
function ifFromEf(ef){ return (ef/VT)*100; }

// Punto de operación por fase para una Ef y una carga trifásica P3 dadas.
function motorPQ(Ef,P3){
  const P1=P3/3;
  const s=(P1*XS)/(VT*Ef);
  if(!isFinite(s)||Math.abs(s)>1) return null;      // fuera de sincronismo
  const delta=-Math.asin(s);
  const Efx=Ef*Math.cos(delta), Efy=Ef*Math.sin(delta);
  const Vx=VT-Efx, Vy=-Efy;
  const Iax=Vy/XS, Iay=-Vx/XS;
  const IaMag=Math.hypot(Iax,Iay);
  const P1c=VT*Iax;
  const Q1=VT*(-Iay);
  return {IaMag,P1:P1c,Q1,Q3:Q1*3,delta};
}

function bisect(f,lo,hi,iters){
  let a=lo,b=hi,fa=f(a);
  for(let i=0;i<iters;i++){
    const m=(a+b)/2, fm=f(m);
    if((fa<0)===(fm<0)){a=m;fa=fm;} else {b=m;}
  }
  return (a+b)/2;
}

function iaMinAt(P3){ return (P3/3)/VT; }

function efUnityPF(P3){
  if(P3<=1e-6) return VT;
  const g=Ef=>{ const r=motorPQ(Ef,P3); return r? r.Q1 : -1e9; };
  return bisect(g,VT,VT*3,60);
}

function efAtIaRatedOver(P3){
  if(P3<=1e-6) return VT+IA_RATED*XS;
  const efU=efUnityPF(P3);
  const h=Ef=>{ const r=motorPQ(Ef,P3); return r? r.IaMag-IA_RATED : 1e9; };
  return bisect(h,efU,VT*6,60);
}

function efForQtarget(P3,Q3target){
  const Q1t=Q3target/3;
  const g=Ef=>{ const r=motorPQ(Ef,P3); return r? r.Q1-Q1t : -1e9; };
  return bisect(g,VT*0.3,VT*6,60);
}

// Corrección de FP total del bus (motor síncrono + carga industrial).
function fpCorrectionTarget(P3,loadKey){
  const load=LOADS[loadKey];
  const Qind3=load.p3*Math.tan(Math.acos(load.pf));
  let Ef=efForQtarget(P3,-Qind3);
  let r=motorPQ(Ef,P3);
  let limited=false;
  if(!r||r.IaMag>IA_RATED){
    Ef=efAtIaRatedOver(P3);
    r=motorPQ(Ef,P3);
    limited=true;
  }
  const Ptotal3=P3+load.p3;
  const Qtotal=Qind3+r.Q3;
  const Stotal=Math.hypot(Ptotal3,Qtotal);
  const FPtotal=Stotal>0?Ptotal3/Stotal:1;
  return {Ef,IfPct:ifFromEf(Ef),IaSync:r.IaMag,Qind3,Qsync3:r.Q3,Qtotal,Ptotal3,FPtotal,limited};
}

function estadoFP(Q1){
  if(Math.abs(Q1)<VT*0.02) return 'unidad';
  return Q1>0 ? 'atraso' : 'adelanto';
}

function xPix(ifp){ return PX0+((ifp-IF_MIN)/(IF_MAX-IF_MIN))*(PX1-PX0); }
function yPix(a){ return PY1-(a/YMAX)*(PY1-PY0); }

function line(c,x1,y1,x2,y2,col,w,dash){
  c.strokeStyle=col; c.lineWidth=w||1.5; c.setLineDash(dash||[]);
  c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); c.setLineDash([]);
}
function rr(c,x,y,w,h,r,fill,stroke,lw){
  c.beginPath(); c.roundRect(x,y,w,h,r);
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw||1.5; c.stroke(); }
}
function plotFn(c,fn,col,w,dash){
  c.strokeStyle=col; c.lineWidth=w; c.setLineDash(dash||[]);
  c.beginPath(); let pen=false;
  for(let px=PX0;px<=PX1;px+=3){
    const ifp=IF_MIN+((px-PX0)/(PX1-PX0))*(IF_MAX-IF_MIN);
    const v=fn(ifp);
    if(!isFinite(v)){ pen=false; continue; }
    const y=yPix(v);
    if(y<PY0-2||y>PY1+2){ pen=false; continue; }
    pen?c.lineTo(px,y):c.moveTo(px,y); pen=true;
  }
  c.stroke(); c.setLineDash([]);
}

    synth.beep(520,0.08,0.06); return;
  }
  showToast('Curvas V: cada curva de color es un nivel distinto de carga mecánica P. El mínimo de cada curva ocurre exactamente en factor de potencia unitario.');
  synth.beep(420,0.08,0.05);
}

  } else {
    const load=LOADS[loadKey];

function set(id,txt,cls){ const n=el(id); n.textContent=txt; n.classList.remove('good','warn','bad'); if(cls) n.classList.add(cls); }

function updateTele(){
  const hideQ=(mode==='reto'&&MYST&&MYST.kind==='minIa'&&!retoSolved);
  const r=motorPQ(efFromIf(ifPct),psync);
  if(hideQ||!r){
    set('t_ef','¿?','warn'); set('t_delta','¿?','warn'); set('t_ia','¿?','warn');
    set('t_q','¿?','warn'); set('t_est','¿?','warn');
  } else {
    set('t_ef',efFromIf(ifPct).toFixed(1)+' V');
    set('t_delta',(r.delta*180/Math.PI).toFixed(1)+' °');
    set('t_ia',r.IaMag.toFixed(2)+' A', r.IaMag>=IA_RATED?'bad':(r.IaMag>=IA_RATED*0.92?'warn':'good'));
    set('t_q',(r.Q3/1000).toFixed(2)+' kVAR', Math.abs(r.Q3)<VT*3*0.02?'good':'warn');
    const est=estadoFP(r.Q1);
    set('t_est', est==='unidad'?'FP unitario':est==='atraso'?'subexcitado (atraso)':'sobreexcitado (adelanto)', est==='unidad'?'good':'warn');
  }
  if(loadKey==='ninguna'||hideQ||!r){
    set('t_qind','—'); set('t_qtotal','—'); set('t_fptotal','—');
  } else {
    const load=LOADS[loadKey];
    const Qind3=load.p3*Math.tan(Math.acos(load.pf));
    const Ptotal3=psync+load.p3, Qtotal=Qind3+r.Q3;
    const Stotal=Math.hypot(Ptotal3,Qtotal);
    const FPtotal=Stotal>0?Ptotal3/Stotal:1;
    set('t_qind',(Qind3/1000).toFixed(2)+' kVAR');
    set('t_qtotal',(Qtotal/1000).toFixed(2)+' kVAR', Math.abs(Qtotal)<VT*3*0.02?'good':'warn');
    set('t_fptotal',FPtotal.toFixed(3), FPtotal>0.98?'good':'warn');
  }
}

function updateReport(){
  const L=[];
  const r=motorPQ(efFromIf(ifPct),psync);
  if(mode==='explora'){
    L.push(`Carga mecánica: <b>${P_LABEL[psync]}</b>. Corriente de campo: <b>${ifPct.toFixed(0)}%</b> (Ef=${efFromIf(ifPct).toFixed(1)} V).`);
    if(r) L.push(`Ia = ${r.IaMag.toFixed(2)} A, estado <b>${estadoFP(r.Q1)}</b>.`);
    else L.push('Fuera de sincronismo con esta combinación (δ excede 90°).');
  } else if(mode==='comparar'){
    L.push('Las tres curvas V comparten el mismo Vt y Xs; solo cambia P. A mayor carga mecánica, mayor Ia mínima y el mínimo se desplaza a mayor If.');
    L.push(`Curva activa: <b>${P_LABEL[psync]}</b>.`);
  } else {
    if(MYST.kind==='minIa'){
      L.push(`Reto: calcula Ia_mín para P = ${(MYST.P3/1000).toFixed(0)} kW.`);
      L.push(retoSolved?`<span class="ok">${retoMsg}</span>`:'Escribe tu resultado en amperes y comprueba.');
    } else {
      L.push(`Reto: maximiza el FP total con ${LOADS[MYST.loadKey].label} y P = ${(MYST.P3/1000).toFixed(0)} kW.`);
      L.push(retoSolved?`<span class="ok">${retoMsg}</span>`:'Mueve el reóstato If y observa el medidor de FP total.');
    }
  }
  el('report').innerHTML=L.map(s=>'<div>'+s+'</div>').join('');
}

/* ---------- §10 Reto ---------- */
function checkReto(){
  if(!MYST) return;
  const v=parseFloat(el('retoInput').value.replace(',','.'));
  if(!isFinite(v)){
    el('retoOut').innerHTML='<span class="dtc">Escribe un número.</span>'; return;
  }
  const ok=Math.abs(v-MYST.target)<=MYST.tol;
  if(ok){
    retoSolved=true; solved=true;
    if(MYST.kind==='minIa'){
      retoMsg=`Ia_mín = P/(3·Vt) = ${MYST.P3}/(3×${VT.toFixed(2)}) = ${MYST.target.toFixed(2)} A — el punto más bajo de la curva V para esta carga, exactamente en FP unitario.`;
    } else {
      const r=fpCorrectionTarget(MYST.P3,MYST.loadKey);
      retoMsg=`Con If ≈ ${r.IfPct.toFixed(1)}% (Ef≈${r.Ef.toFixed(1)} V) el analizador marca FP total ≈ ${r.FPtotal.toFixed(3)}${r.limited?' — máximo alcanzable: la armadura ya está en su límite térmico de '+IA_RATED+' A.':' — corrección total: el motor cancela exactamente los reactivos de la carga industrial.'}`;
    }
    el('retoOut').innerHTML=`<span class="ok">✔ ¡Correcto! (tolerancia ${tolText()})</span>`;
    synth.beep(880,.1,.08); setTimeout(()=>synth.beep(1175,.15,.08),140);
  } else {
    retoMsg='';
    el('retoOut').innerHTML=`<span class="dtc">✘ Aún no. Tolerancia: ${tolText()}</span>`;
    synth.beep(180,.12,.08);
  }
  refreshAll();
}

function newMystery(){
  genMystery();
  el('retoInput').value=''; el('retoOut').innerHTML='';
  buildQuiz();
  setMode('reto');
  showToast(MYST.kind==='minIa'
    ? `Nuevo caso: calcula Ia_mín para P = ${(MYST.P3/1000).toFixed(0)} kW.`
    : `Nuevo caso: maximiza el FP total con ${LOADS[MYST.loadKey].label} y P = ${(MYST.P3/1000).toFixed(0)} kW.`);
}

/* ---------- §11 Quiz ---------- */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
let QUIZ={};
function buildQuiz(){
  QUIZ.explora={
    pregunta:'¿Qué le pasa a un motor síncrono cuando se sobreexcita (If alto)?',
    opciones:shuffle([
      {t:'Se comporta como un capacitor, entregando reactivos a la red',ok:true,why:'Correcto: al sobreexcitar, Ef>Vt y el motor adelanta corriente respecto al voltaje — exactamente lo que hace un banco de capacitores.'},
      {t:'Gira más rápido que en sincronismo',ok:false,why:'No: la velocidad síncrona depende de la frecuencia de la red, no de If.'},
      {t:'Se desconecta automáticamente',ok:false,why:'No: mientras δ<90° el motor sigue sincronizado; solo se desconecta si pierde el paso.'},
      {t:'Consume más reactivos de la red',ok:false,why:'Al revés: sobreexcitado ENTREGA reactivos; los consume cuando está subexcitado.'},
    ]),
  };
  QUIZ.comparar={
    pregunta:'¿Por qué el mínimo de cada curva V ocurre en factor de potencia unitario?',
    opciones:shuffle([
      {t:'Porque ahí toda la corriente de armadura es componente activa (en fase con Vt)',ok:true,why:'Correcto: en FP unitario Q=0, así que Ia solo tiene componente en fase con Vt — la magnitud mínima posible para entregar esa P.'},
      {t:'Porque ahí Xs vale cero',ok:false,why:'No: Xs es una constante de la máquina, no cambia con If.'},
      {t:'Porque ahí el motor no gira',ok:false,why:'No: el motor sigue entregando la misma P mecánica en todo punto de la curva.'},
      {t:'Es una coincidencia de esta gráfica',ok:false,why:'No: es una consecuencia directa del diagrama fasorial — se cumple para cualquier motor síncrono de rotor liso.'},
    ]),
  };
  if(MYST){
    if(MYST.kind==='minIa'){
      QUIZ.reto={
        pregunta:'¿Qué fórmula da la corriente de armadura mínima de una curva V?',
        opciones:shuffle([
          {t:'Ia_mín = P/(3·Vt), con P la carga trifásica',ok:true,why:'Correcto: en FP unitario Ia es puramente activa, así que P = 3·Vt·Ia y se despeja Ia.'},
          {t:'Ia_mín = P·Xs/Vt',ok:false,why:'Esa expresión no tiene las unidades correctas para una corriente mínima en FP unitario.'},
          {t:'Ia_mín = Vt/Xs',ok:false,why:'Esa sería una corriente de cortocircuito interna, no depende de la carga P.'},
          {t:'Ia_mín es siempre igual a Ia nominal',ok:false,why:'No: Ia_mín depende de la carga mecánica P y suele ser mucho menor que Ia nominal.'},
        ]),
      };
    } else {
      QUIZ.reto={
        pregunta:'¿Qué limita cuánta reactiva puede entregar el motor síncrono como compensador?',
        opciones:shuffle([
          {t:'La corriente nominal (térmica) de armadura',ok:true,why:'Correcto: aunque sobreexcitar más seguiría mejorando el FP del bus, la armadura no puede superar su corriente nominal sin sobrecalentarse.'},
          {t:'La frecuencia de la red',ok:false,why:'La frecuencia fija la velocidad síncrona, no el límite de reactivos que puede entregar el motor.'},
          {t:'El número de polos del motor',ok:false,why:'El número de polos afecta la velocidad, no directamente el límite de corriente de armadura.'},
          {t:'No existe ningún límite práctico',ok:false,why:'Sí existe: pasar Ia nominal sostenidamente daña el aislamiento del devanado de armadura.'},
        ]),
      };
    }
  }
}
function clearDx(){ el('dxbtns').innerHTML=''; }
function refreshQuestion(){
  const q=QUIZ[mode]; if(!q) return;
  el('q_text').textContent=q.pregunta;
  const box=el('dxbtns'); box.innerHTML='';
  q.opciones.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='b dx';
    b.textContent=String.fromCharCode(65+i)+') '+o.t;
    b.onclick=()=>{
      if(b.classList.contains('right')||b.classList.contains('wrong')) return;
      b.classList.add(o.ok?'right':'wrong');
      showToast(o.why); synth.beep(o.ok?760:220,.1,.07);
    };
    box.appendChild(b);
  });
}

/* ---------- §12 Picking / tour / init ---------- */
pickerFor(S.scene,S.camera,S.renderer.domElement,hit=>{
  if(hit.object===board&&hit.uv){ boardClick(hit.uv.x,hit.uv.y); return; }
  let o=hit.object;
  while(o&&!o.userData?.act) o=o.parent;
  const act=o&&o.userData?.act;
  const hideQ=(mode==='reto'&&MYST&&MYST.kind==='minIa'&&!retoSolved);
  if(act==='mot3d'){ showToast('Motor síncrono trifásico: gira exactamente a velocidad síncrona mientras δ<90°.'); synth.beep(560,.08,.06); }
  else if(act==='rheostat3d'){ showToast(`Reóstato de campo: If = ${hideQ?'¿?':ifPct.toFixed(0)+'%'}. Controla Ef y con ella el factor de potencia.`); synth.beep(660,.08,.06); }
  else if(act==='load3d'){ showToast(loadKey==='ninguna'?'Sin carga industrial conectada al bus.':`${LOADS[loadKey].label} — comparte el bus con el motor síncrono.`); synth.beep(500,.08,.06); }
  else if(act==='paneld3d'){ showToast('Analizador de red: mide la corriente de armadura y los reactivos del motor en tiempo real.'); synth.beep(600,.08,.06); }
  else if(act==='meter3d'){ showToast('Medidor de FP: combina el motor síncrono con la carga industrial para dar el factor de potencia total del bus.'); synth.beep(600,.08,.06); }
});

(function hoverTip(){
  const ray=new THREE.Raycaster(); const dom=S.renderer.domElement;
  dom.addEventListener('pointermove',e=>{
    const r=dom.getBoundingClientRect();
    const x=((e.clientX-r.left)/r.width)*2-1, y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera({x,y},S.camera);
    const hits=ray.intersectObjects(S.scene.children,true);
    let title='';
    for(const h of hits){ let o=h.object; while(o){ if(o.userData?.title){ title=o.userData.title; break; } o=o.parent; } if(title) break; }
    dom.style.cursor=title?'pointer':'default'; dom.title=title;
  });
})();

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function runAuto(){
  if(autoRunning) return; autoRunning=true;
  const b=el('btnAuto'); b.disabled=true; b.textContent='▶ En curso…';
  try{
    synth.init(); synth.resume();
    setMode('explora');
    showToast('1/5 · Explora: barremos If de 60% a 180% con P=8kW.');
    setPsync(8000);
    for(let v=IF_MIN;v<=IF_MAX;v+=6){ ifPct=v; el('sIf').value=v; el('av').textContent=v.toFixed(0); refreshAll(); await sleep(90); }
    await sleep(400);

    showToast('2/5 · Comparar: observa las tres curvas V juntas.');
    setMode('comparar');
    for(const p of P_LEVELS){ setPsync(p); await sleep(500); }
    await sleep(300);

    showToast('3/5 · Conectamos una carga industrial inductiva al bus.');
    setMode('explora'); setPsync(0); setLoad('B');
    for(let v=IF_MIN;v<=IF_MAX;v+=6){ ifPct=v; el('sIf').value=v; el('av').textContent=v.toFixed(0); refreshAll(); await sleep(80); }
    await sleep(400);

    showToast('4/5 · Reto: resolvemos un caso misterioso.');
    setMode('reto');
    if(MYST.kind==='fpCorrection'){
      const r=fpCorrectionTarget(MYST.P3,MYST.loadKey);
      for(let v=IF_MIN;v<=IF_MAX;v+=4){
        ifPct=v; el('sIf').value=v; el('av').textContent=v.toFixed(0); refreshAll();
        if(Math.abs(v-r.IfPct)<3) break;
        await sleep(50);
      }
    }
    el('retoInput').value=MYST.target.toFixed(MYST.kind==='minIa'?2:3);
    checkReto();
    const idx=QUIZ.reto.opciones.findIndex(o=>o.ok);
    if(idx>=0) el('dxbtns').children[idx].click();
    await sleep(600);

    showToast('5/5 · Nuevo caso listo para intentar por tu cuenta.');
    newMystery();
  } finally {
    autoRunning=false; b.disabled=false; b.textContent='✨ Recorrido guiado';
  }
}

S.setAnimate(()=>{
  const r=motorPQ(efFromIf(ifPct),psync);
  couplingG.rotation.x += 0.004 + 0.01*(r?r.IaMag/IA_RATED:0.1);

['m_explora','m_comparar','m_reto'].forEach(id=>{
  el(id).addEventListener('click',()=>{
    const m=id.slice(2);

});
el('mm_p0').addEventListener('click',()=>setPsync(0));
el('mm_p8').addEventListener('click',()=>setPsync(8000));
el('mm_p15').addEventListener('click',()=>setPsync(15000));
el('lb_none').addEventListener('click',()=>setLoad('ninguna'));

el('lb_b').addEventListener('click',()=>setLoad('B'));
el('sIf').addEventListener('input',e=>{ ifPct=parseFloat(e.target.value); el('av').textContent=ifPct.toFixed(0); refreshAll(); });
el('btnCheck').addEventListener('click',checkReto);
el('btnAuto').addEventListener('click',runAuto);
el('btnNew').addEventListener('click',newMystery);

genMystery(); buildQuiz();
S.start();
setMode('explora');

window.__labDebug={

};
