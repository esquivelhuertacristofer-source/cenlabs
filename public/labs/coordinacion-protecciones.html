<!DOCTYPE html>
<html lang="es">
<head>

<title>CEN Labs · Coordinación de Protecciones y Curvas Tiempo-Corriente — Laboratorio 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08201C;--panel:rgba(9,26,23,.86);--line:#1E3A34;--ink:#EAF4F1;
    --dim:#8FB3AC;--accent:#2A9D8F;--accent2:#4FD1C5;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(10,13,18,.92),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

  .badge{position:fixed;top:16px;right:20px;z-index:20;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,209,102,.12);color:var(--hv);border:1px solid rgba(255,209,102,.35);padding:6px 12px;border-radius:20px}

  .hud{position:fixed;top:70px;left:18px;z-index:15;max-width:330px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-height:calc(100vh - 150px);overflow-y:auto}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .hud h2{font-size:19px;line-height:1.15;margin-bottom:9px}
  .hud p{font-size:13px;line-height:1.55;color:var(--dim);margin-bottom:10px}
  .hud .formula{font-family:var(--mono);color:var(--accent2);text-align:center;font-size:12.5px;margin:8px 0;padding:8px;background:rgba(0,0,0,.25);border-radius:8px;line-height:1.5}
  .hud .src{font-size:10.5px;color:#7a8894;font-style:italic;margin-top:4px;line-height:1.5}
  .legend{display:flex;flex-direction:column;gap:6px;margin:12px 0;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:10px}
  .legend .li{display:flex;align-items:center;gap:8px;font-size:11px;color:#c4d0da}
  .legend .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .fid{margin:10px 0 2px;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:10px;border:1px solid rgba(79,209,197,.18)}
  .fid .ft{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);margin-bottom:6px}
  .fid .fl{font-size:11px;color:#c4d0da;line-height:1.5;margin-bottom:5px}
  .fid .fl b{color:var(--ink)}
  .fid .fl.no b{color:var(--hv)}

  .panel{position:fixed;top:70px;right:18px;z-index:15;width:262px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:16px;max-height:calc(100vh - 150px);overflow-y:auto}
  .panel h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:2px 0 10px}
  .panel h4.sec{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .g{margin-bottom:6px}
  .gl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .gl b{color:var(--accent2)}
  .gl b.good{color:var(--good)}.gl b.warn{color:var(--hv)}.gl b.bad{color:var(--bad)}
  .modebar{display:flex;gap:5px;margin-bottom:8px}
  .modebar .b{flex:1;padding:8px 4px;font-size:11px}
  .btns{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .b{font-family:system-ui;font-size:12.5px;padding:10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#1b242f;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#202c38}
  .b.on{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:bold}
  .b.primary{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:bold}
  .b.auto{border-color:var(--hv);color:var(--hv);background:rgba(255,183,3,.10);font-weight:bold}
  .b.auto:hover{background:rgba(255,183,3,.18);border-color:var(--hv)}
  .b.auto:disabled{opacity:.6;cursor:default}
  .b.dx{text-align:left;font-size:12px}
  .b.dx.right{background:rgba(52,211,153,.18);border-color:var(--good);color:var(--good);font-weight:bold}
  .b.dx.wrong{background:rgba(244,71,94,.15);border-color:var(--bad);color:var(--bad)}
  .console{font-family:var(--mono);font-size:11px;line-height:1.55;color:#c4d0da;background:rgba(0,0,0,.28);border-radius:9px;padding:10px 12px;margin-bottom:8px;min-height:56px}
  .console .dtc{color:var(--bad);font-weight:bold}
  .console .ok{color:var(--good)}
  .console .mono{color:var(--dim)}

  .hint{position:fixed;bottom:18px;left:18px;z-index:14;font-family:var(--mono);font-size:10px;color:var(--dim);background:var(--panel);padding:7px 12px;border-radius:9px;border:1px solid var(--line)}
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(18,24,32,.95);border:1px solid var(--accent);padding:10px 20px;border-radius:40px;font-family:var(--mono);font-size:12px;opacity:0;transition:.3s;pointer-events:none;max-width:80vw;text-align:center}
  .toast.show{opacity:1}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}
  .soundBtn:hover{transform:scale(1.08)}
  .inspectHint{position:fixed;bottom:18px;right:18px;z-index:14;font-family:var(--mono);font-size:10px;color:var(--accent2);background:var(--panel);padding:7px 12px;border-radius:9px;border:1px solid var(--line)}

  @media(max-width:820px){
    .hud,.panel{position:fixed;left:8px;right:8px;top:auto;bottom:8px;max-width:none;width:auto;max-height:42vh;overflow-y:auto}
    .hud{bottom:calc(8px + 42vh + 8px)}
    .hint,.inspectHint{display:none}
  }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.26, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;
    }
    if(hook)hook(dt,t); controls.update();
    if(bokeh) bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);
    composer.render(); }
  function start(){ if(!raf)loop(); }
  function stop(){ cancelAnimationFrame(raf); raf=null; window.removeEventListener('resize',resize); }

  return { THREE, renderer, scene, camera, controls, composer, bloom,
    setAnimate:fn=>hook=fn, start, stop, resize, clock,
    flyTo:(v)=>{ controls.target.copy(v); }, moveTo, setCinematicIdle };
}

function roundedBox(w,h,d,mat,rf=0.08){

function pickerFor(scene,camera,dom,onHit){
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(); let down=null;
  dom.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
  dom.addEventListener('pointerup',e=>{
    if(!down)return; const moved=Math.abs(e.clientX-down[0])+Math.abs(e.clientY-down[1])>6; down=null;
    if(moved)return;
    const r=dom.getBoundingClientRect();
    mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(mouse,camera);
    const hits=ray.intersectObjects(scene.children,true);
    onHit(hits[0]||null);
  });
}

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

// Coordinación de protecciones con curvas tiempo-corriente (interruptores termomagnéticos, IEC 60898).
// Física (verificada node -e):
//   Un interruptor termomagnético (MCB) tiene DOS mecanismos de disparo:
//     · TÉRMICO (bimetálico) — protege contra SOBRECARGAS. Es inverso: a más corriente, dispara más rápido.
//       Modelo didáctico anclado a las compuertas de prueba de IEC 60898 (x = I/In):
//         t(x) = kT / (x² − xp²),  con xp = 1.13 (corriente convencional de NO disparo) y kT = 110.
//       Compuertas verificadas: 1.13× → ∞ (no dispara); 1.45× → 133 s (<1 h, dispara); 2.55× → 21 s (en [1,60] s). ✔
//     · MAGNÉTICO (electroimán) — protege contra CORTOCIRCUITOS. Es instantáneo (~10 ms) al superar un umbral
//       que depende del TIPO DE CURVA (banda garantizada de disparo instantáneo, múltiplos de In):
//         Curva B → 3–5× In   (usa 5× como umbral garantizado) — cargas resistivas, líneas largas, residencial.
//         Curva C → 5–10× In  (10×) — cargas mixtas, pequeños motores, inductivas (uso general).
//         Curva D → 10–20× In (20×) — alto pico de arranque: transformadores, motores DOL.
//   ENERGÍA PASANTE (let-through):  I²t = I²·t_disparo  [A²s] — mide el estrés térmico que el cable sufre
//     antes de que la protección abra. Menor I²t = mejor protección del conductor.
//   SELECCIÓN de In (protege cable y lleva la carga):  Ib ≤ In ≤ Iz  (Ib=corriente de carga, Iz=ampacidad del cable).
//     In correcto = el menor calibre normalizado que cumple ambos.
//   SELECCIÓN de curva por pico de arranque m=Iarranque/In:  la curva más sensible cuyo umbral BAJO de banda
//     supere m (no dispara al arrancar) → m<3:B, 3≤m<5:C, 5≤m<10:D, m≥10: ninguna estándar (usar In mayor / prot. de motor).
//     Elegir la MÁS sensible que sobreviva al arranque minimiza la I²t en cortocircuito (protege mejor el cable).
//   COORDINACIÓN / SELECTIVIDAD (dos MCB en serie: derivada aguas abajo + general aguas arriba):
//     para todo cortocircuito, la derivada debe disparar ANTES que la general → así una falla aísla solo su ramal.
//     Verificado: derivada 16A-C con general 40A-D = selectivo en todo el rango; con general 25A-C solapan en
//     cortocircuito (ambos van a 10 ms y disparan juntos) → NO selectivo. Lección honesta: la selectividad
//     MCB-MCB en cortocircuito exige que la general tenga umbral magnético bastante mayor (más In y/o curva más alta).
//   Ref: IEC 60898-1 (MCB, curvas B/C/D) · NOM-001-SEDE-2022 Art. 240 (protección contra sobrecorriente) ·
//        IEC 60947-2 (interruptores industriales) · verificación numérica propia.

const XP=1.13;            // múltiplo de NO disparo térmico (corriente convencional)
const KT=110;            // constante térmica ajustada a las compuertas IEC 60898
const CURVES={
  B:{lo:3, hi:5,  Im:5,  col:'#7CD992', uso:'resistivas · líneas largas · residencial'},
  C:{lo:5, hi:10, Im:10, col:'#5BC0DE', uso:'cargas mixtas · pequeños motores (uso general)'},
  D:{lo:10,hi:20, Im:20, col:'#E9C46A', uso:'transformadores · motores DOL (alto arranque)'},
};
const CURVE_ORDER=['B','C','D'];
const IN_STEPS=[6,10,16,20,25,32,40];          // corrientes nominales normalizadas (A)
function tTrip(I,In,curve){                     // tiempo de disparo (s), ∞ = no dispara
  const x=I/In, c=CURVES[curve];
  if(x>=c.Im) return 0.01;                       // magnético instantáneo (~10 ms)
  if(x>XP)    return KT/(x*x-XP*XP);             // térmico inverso
  return Infinity;                               // por debajo de la corriente convencional: no dispara
}
function mechAt(I,In,curve){
  const x=I/In, c=CURVES[curve];
  if(x>=c.Im) return 'mag';
  if(x>XP)    return 'ter';
  return 'no';
}
function i2t(I,In,curve){const t=tTrip(I,In,curve);return isFinite(t)?I*I*t:Infinity;}

// --- oráculos del Reto (verificados) ---
function bestIn(Ib,Iz){for(const In of IN_STEPS){if(In>=Ib && In<=Iz) return In;}return null;}
function bestCurve(m){for(const k of CURVE_ORDER){if(m<CURVES[k].lo) return k;}return null;}

// --- coordinación / selectividad entre dos MCB en serie ---
// Modelo honesto: la selectividad es TOTAL hasta Is = corriente de disparo instantáneo de la general
// (In_general · Im_general). Por debajo de Is la general sigue en su zona térmica (lenta) mientras la
// derivada ya disparó (más rápida). Por encima de Is ambas van a ~10 ms → las curvas ya no garantizan
// la discriminación: hace falta tabla de discriminación del fabricante o limitación de corriente.
function selectiveNow(br,mn,If){
  const tb=tTrip(If,br.In,br.curve), tm=tTrip(If,mn.In,mn.curve);
  const Is=mn.In*CURVES[mn.curve].Im;
  return {tb,tm, sel: isFinite(tb)&&(!isFinite(tm)||tb<tm), aboveIs: If>=Is};
}
function selInfo(br,mn){
  const Is=mn.In*CURVES[mn.curve].Im;            // corriente donde la general pasa a instantánea
  let total=(mn.In>br.In);                        // la general debe tener MÁS In que la derivada
  if(total){
    for(let I=br.In*XP*1.05; I<Is; I*=1.08){
      const tb=tTrip(I,br.In,br.curve), tm=tTrip(I,mn.In,mn.curve);
      if(!isFinite(tb)) continue;                 // la derivada aún no dispara (sobrecarga leve): ok
      if(isFinite(tm) && tb>=tm){ total=false; break; } // las curvas se cruzan por debajo de Is
    }
  }
  return {Is, total};
}

// dibuja la curva de un interruptor: térmica inversa + banda magnética + caída vertical instantánea
function plotBreaker(c,In,curve,color,dashed,label){
  const cc=CURVES[curve];
  // banda magnética (zona de incertidumbre lo..hi)
  c.fillStyle=hexA(color,0.08);
  c.fillRect(sx(In*cc.lo),PLOT.y,sx(In*cc.hi)-sx(In*cc.lo),PLOT.h);
  // curva
  c.strokeStyle=color;c.lineWidth=dashed?2.2:2.8;c.setLineDash(dashed?[8,5]:[]);c.beginPath();
  const Istart=In*XP*1.004, Iend=In*cc.Im, N=90;let started=false;
  for(let i=0;i<=N;i++){
    const I=Istart*Math.pow(Iend/Istart,i/N), t=tTrip(I,In,curve);
    if(!isFinite(t))continue;
    const X=sx(I),Y=sy(t);
    if(!started){c.moveTo(X,Y);started=true;}else c.lineTo(X,Y);
  }
  c.lineTo(sx(Iend),sy(0.01));                 // caída magnética instantánea
  c.stroke();c.setLineDash([]);
  // asíntota vertical de no-disparo (1.13×In)
  c.strokeStyle=hexA(color,0.35);c.lineWidth=1;c.setLineDash([3,4]);
  c.beginPath();c.moveTo(sx(In*XP),sy(TL[1]));c.lineTo(sx(In*XP),PLOT.y+PLOT.h*0.15);c.stroke();c.setLineDash([]);
  // etiqueta al inicio de la curva
  if(label){c.fillStyle=color;c.font='bold 12px Outfit, sans-serif';c.textAlign='left';
    c.fillText(label,sx(In*XP)+4,sy(TL[1])+16);}
}

function rpanel(c,x,y,w,h,title){
  c.fillStyle='rgba(79,176,174,0.06)';c.fillRect(x,y,w,h);
  c.strokeStyle='rgba(79,176,174,0.22)';c.lineWidth=1;c.strokeRect(x,y,w,h);
  c.fillStyle='#B9D9D7';c.font='bold 15px Outfit, sans-serif';c.textAlign='left';c.fillText(title,x+16,y+26);
}
function prow(c,x,y,w,l,v,col){
  c.fillStyle='#8f9793';c.font='13px Outfit, sans-serif';c.textAlign='left';c.fillText(l,x+16,y);
  c.fillStyle=col||'#F4EFEA';c.font='bold 16px Outfit, sans-serif';c.textAlign='right';c.fillText(v,x+w-14,y);
}
function wrapText(c,text,x,y,maxW,lh){
  const words=text.split(' ');let line='',yy=y;
  for(const w of words){const test=line+w+' ';
    if(c.measureText(test).width>maxW && line){c.fillText(line,x,yy);line=w+' ';yy+=lh;}else line=test;}
  c.fillText(line,x,yy);
}

function retoExplain(){
  const L=LOADS[retoLoadIdx], goodIn=bestIn(L.Ib,L.Iz), goodCv=bestCurve(L.m), cg=CURVES[goodCv];
  if(retoSolved) return 'In='+goodIn+' A es el menor que cumple '+L.Ib+'≤In≤'+L.Iz+'; la curva '+goodCv+' (umbral '+cg.lo+'–'+cg.hi+'×) no dispara con el arranque de '+L.m+'× y es la más sensible que lo logra, así minimiza la I²t en cortocircuito.';
  let s='';
  if(!retoOkIn){
    if(retoIn<L.Ib) s+='In='+retoIn+' A < Ib='+L.Ib+' A: dispararía en servicio normal. ';
    else if(retoIn>L.Iz) s+='In='+retoIn+' A > Iz='+L.Iz+' A: el cable se sobrecargaría sin que el interruptor proteja. ';
    else s+='In='+retoIn+' A cumple, pero no es el mínimo: '+goodIn+' A basta. ';
  }
  if(!retoOkCurve){
    const cr=CURVES[retoCurve];
    if(cr.lo<=L.m) s+='La curva '+retoCurve+' (umbral desde '+cr.lo+'×) dispararía con el arranque de '+L.m+'×: falsa alarma. ';
    else s+='La curva '+retoCurve+' sobra: la '+goodCv+' ya tolera el arranque y protege más rápido (menor I²t). ';
  }
  return s||'Revisa los dos objetivos.';
}

function tubeBetween(a,b,radius,mat){
  const dir=new THREE.Vector3().subVectors(b,a),len=dir.length();
  const m=new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,len,12),mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());return m;
}

function rebuildWire(){
  const In=(mode==='reto')?retoIn:(mode==='coord')?br.In:expIn;
  const r=0.016+0.05*(IN_STEPS.indexOf(In)/(IN_STEPS.length-1));
  scene.remove(wire);wire=tubeBetween(wA,wB,r,copMat);
  wire.userData={title:'Conductor del ramal',info:'Protegido por el interruptor derivado. Su grosor crece con la corriente nominal.'};
  scene.add(wire);
}

function buildQuiz(){
  QUIZ={
    explora:{
      pregunta:'Un motor con arranque de 8× In se protege con un interruptor curva B (umbral magnético 3–5× In). ¿Qué ocurrirá al arrancar el motor?',
      opciones:[
        {t:'El interruptor disparará por la vía magnética en cada arranque (disparo molesto), porque 8× supera su umbral de 3–5×. Hay que usar una curva D (10–20×), que sí tolera el pico.',ok:true,why:'Correcto: la curva B trata el pico de arranque de 8× como un cortocircuito y abre. Para picos altos se usa curva D, cuyo umbral magnético (10–20×) queda por encima del arranque.'},
        {t:'No pasará nada: el arranque es tan breve que ninguna curva lo detecta.',ok:false,why:'El disparo magnético es prácticamente instantáneo (~10 ms): un pico de 8× que supera el umbral de la curva B dispara aunque dure poco.'},
        {t:'Disparará por la vía térmica tras varios minutos.',ok:false,why:'8× está muy por encima del umbral magnético de la B (3–5×): dispara por vía magnética en ~10 ms, no por la térmica.'},
        {t:'El motor se dañará porque el interruptor no lo protege.',ok:false,why:'Al contrario: dispara de más (falsa alarma). El problema es que no deja arrancar el motor, no que falle en protegerlo.'},
      ],
    },
    coord:{
      pregunta:'Dos interruptores en serie tienen el mismo In y la misma curva. Ante un cortocircuito grande, ¿por qué se pierde la selectividad?',
      opciones:[
        {t:'Porque ambos superan su umbral magnético con esa corriente y disparan casi al mismo tiempo (~10 ms): no hay diferencia de tiempo, así que puede abrir el general y dejar sin servicio todo el tablero.',ok:true,why:'Correcto: en la zona magnética ambas curvas se juntan en ~10 ms. Para coordinar en cortocircuito la general necesita un umbral magnético bastante mayor (más In y/o curva más alta).'},
        {t:'Porque el interruptor general es más lento por estar aguas arriba.',ok:false,why:'La posición no cambia la curva: si son iguales, disparan igual de rápido. El problema es el solapamiento de las curvas magnéticas.'},
        {t:'Porque la corriente de falla se reparte entre los dos interruptores.',ok:false,why:'En serie la misma corriente pasa por ambos; no se reparte. Se pierde la selectividad porque las curvas coinciden en la zona instantánea.'},
        {t:'No se pierde: al ser iguales, siempre coordinan perfectamente.',ok:false,why:'Es lo contrario: curvas iguales en la zona magnética disparan a la vez y NO coordinan. Coordinar exige separar sus umbrales.'},
      ],
    },
    reto:{
      pregunta:'Para un cable de ampacidad Iz que alimenta una carga Ib, ¿por qué el interruptor debe cumplir Ib ≤ In ≤ Iz?',
      opciones:[
        {t:'Ib ≤ In para que no dispare llevando la carga normal; In ≤ Iz para que el interruptor abra antes de que el cable se sobrecaliente por encima de su ampacidad. Así protege al conductor.',ok:true,why:'Correcto: la In debe estar entre la corriente de la carga y la ampacidad del cable. Por debajo de Ib habría disparos molestos; por encima de Iz el cable se dañaría sin que el interruptor lo proteja.'},
        {t:'Solo importa que In ≥ Ib; el límite superior Iz es opcional.',ok:false,why:'Si In > Iz, el cable puede sobrecargarse hasta fundirse sin que el interruptor dispare: el conductor queda desprotegido. El límite superior es esencial.'},
        {t:'Solo importa que In ≤ Iz; el límite inferior Ib es opcional.',ok:false,why:'Si In < Ib, el interruptor dispararía con la carga normal (disparos molestos). El límite inferior también es necesario.'},
        {t:'In debe ser exactamente igual a Iz para aprovechar el cable.',ok:false,why:'No: In se elige entre Ib e Iz, normalmente el valor normalizado apenas por encima de Ib. Igualar In a Iz suele dejar el cable sin margen.'},
      ],
    },
  };
  Object.values(QUIZ).forEach(q=>{for(let i=q.opciones.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const tmp=q.opciones[i];q.opciones[i]=q.opciones[j];q.opciones[j]=tmp;}});
}

pickerFor(scene,S.camera,S.renderer.domElement,hit=>{
  if(!hit)return;
  if(hit.object===board){boardClick();return;}
  let o=hit.object;while(o){if(o.userData&&o.userData.title){showToast('<b>'+o.userData.title+'</b><br>'+(o.userData.info||''));return;}o=o.parent;}
});
(function hoverLoop(){
  const ray=new THREE.Raycaster(),dom=S.renderer.domElement;let mx=0,my=0;
  dom.addEventListener('pointermove',e=>{const r=dom.getBoundingClientRect();mx=((e.clientX-r.left)/r.width)*2-1;my=-((e.clientY-r.top)/r.height)*2+1;});
  function tick(){
    ray.setFromCamera({x:mx,y:my},S.camera);let hovered=false;
    for(const [obj,spr] of HOVER_LABELS){if(!obj.visible){spr.visible=false;continue;}const on=ray.intersectObject(obj,true).length>0;spr.visible=on;if(on)hovered=true;}
    dom.style.cursor=hovered?'pointer':'default';requestAnimationFrame(tick);
  }
  tick();
})();

    showToast('🧭 In=16 A, curva C. A 2.55× dispara TÉRMICO en '+fmtT(tTrip(2.55*16,16,'C'))+': es una sobrecarga, con retardo inverso.');
    await sleep(4000);
    expX=12;afterEdit();
    showToast('⚡ A 12× (≥10× de la curva C) dispara MAGNÉTICO en ~10 ms: cortocircuito. La I²t es mínima porque abre casi al instante.');
    await sleep(4200);
    expCurve='B';expX=8;afterEdit();
    showToast('🔧 Curva B a 8×: como su umbral es 3–5×, dispararía al arrancar un motor (disparo molesto). Por eso los motores usan curva D.');
    await sleep(4200);
    answer(QUIZ[mode].opciones.findIndex(o=>o.ok));await sleep(2800);

    setMode('coord');
    br={In:16,curve:'C'};mn={In:25,curve:'C'};faultI=400;afterEdit();
    showToast('🔗 Derivada 16A-C, general 25A-C: selectivo solo hasta Is='+Math.round(selInfo(br,mn).Is)+' A. La falla de 400 A supera Is → ambas van a ~10 ms y disparan juntas.');
    await sleep(4200);
    mn={In:40,curve:'D'};afterEdit();
    showToast('✔ Subimos la general a 40A-D: su Is sube a '+Math.round(selInfo(br,mn).Is)+' A. Ahora 400 A cae por debajo de Is y la derivada dispara sola → SELECTIVO en ese rango.');
    await sleep(4200);
    answer(QUIZ[mode].opciones.findIndex(o=>o.ok));await sleep(2800);

    setMode('reto');
    seedReto(LOADS.findIndex(l=>l.n.indexOf('Motor pequeño')>=0));updateRetoSpec();
    retoIn=bestIn(LOADS[retoLoadIdx].Ib,LOADS[retoLoadIdx].Iz);retoCurve='B';afterEdit();
    showToast('🎯 Motor con arranque 7×: con curva B dispararía al arrancar…');
    await sleep(3600);
    retoCurve=bestCurve(LOADS[retoLoadIdx].m);afterEdit();
    showToast('✔ …corregimos a curva '+retoCurve+' (tolera 7× y protege lo más rápido posible) con la In mínima válida. Comprobamos.');
    await sleep(2800);
    checkReto();await sleep(2600);
    answer(QUIZ[mode].opciones.findIndex(o=>o.ok));
  }finally{
    btn.disabled=false;btn.classList.remove('on');btn.textContent=label;autoRunning=false;
  }
}

// ===================== 15. ANIMACIÓN, EVENTOS E INICIO =====================
S.setAnimate((dt,time)=>{
  const pulse=0.5+0.5*Math.sin(time*3.0);
  // brillo del cable ∝ cercanía a disparo en el modo activo (sutil)
  copMat.emissiveIntensity=0.04+0.06*pulse;copMat.emissive.setHex(0xC97C46);
});
['explora','coord','reto'].forEach(m=>{el('m_'+m).onclick=()=>{if(!autoRunning)setMode(m);};});
el('btnAuto').onclick=()=>{if(!autoRunning)runAuto();};
el('btnNew').onclick=()=>{if(autoRunning)return;newSignal();};
el('btnCheck').onclick=()=>{if(autoRunning)return;checkReto();};
const soundBtn=el('soundBtn');if(soundBtn){soundBtn.onclick=()=>{synth.toggle();soundBtn.textContent=synth.isOn()?'🔊':'🔇';};}
document.addEventListener('pointerdown',()=>{synth.init();synth.resume();},{once:true});

buildQuiz();
S.start();
setMode('explora');

  tTrip:(I,In,cv)=>tTrip(I,In,cv), mechAt:(I,In,cv)=>mechAt(I,In,cv), i2t:(I,In,cv)=>i2t(I,In,cv),

  expIn:()=>expIn, expCurve:()=>expCurve, expX:()=>expX,

  setExp:(In,cv,x)=>{if(mode==='explora'){if(In!=null)expIn=In;if(cv!=null)expCurve=cv;if(x!=null)expX=x;afterEdit();}},
  // coord
  br:()=>({...br}), mn:()=>({...mn}), faultI:()=>faultI,
  setCoord:(bIn,bCv,mIn,mCv,f)=>{if(mode==='coord'){br={In:bIn,curve:bCv};mn={In:mIn,curve:mCv};faultI=f;afterEdit();}},
  selNow:()=>selectiveNow(br,mn,faultI).sel, selAboveIs:()=>selectiveNow(br,mn,faultI).aboveIs,
  selTotal:()=>selInfo(br,mn).total, selIs:()=>selInfo(br,mn).Is,
  // reto
  loads:()=>LOADS.map(l=>l.n), retoLoad:()=>({...LOADS[retoLoadIdx]}), retoLoadIdx:()=>retoLoadIdx,
  retoIn:()=>retoIn, retoCurve:()=>retoCurve,
  retoBestIn:()=>bestIn(LOADS[retoLoadIdx].Ib,LOADS[retoLoadIdx].Iz), retoBestCurve:()=>bestCurve(LOADS[retoLoadIdx].m),
  retoChecked:()=>retoChecked, retoOkIn:()=>retoOkIn, retoOkCurve:()=>retoOkCurve, retoSolved:()=>retoSolved,
  seedReto:idx=>{seedReto(idx);updateRetoSpec();afterEdit();},
  setReto:(In,cv)=>{if(mode==='reto'){if(In!=null)retoIn=In;if(cv!=null)retoCurve=cv;retoChecked=false;retoSolved=false;afterEdit();}},
  checkReto:()=>checkReto(),
  newSignal:()=>newSignal(),
  reportText:()=>el('report').innerText,
  quizAnswer:i=>answer(i), quizCorrectIndex:()=>QUIZ[mode].opciones.findIndex(o=>o.ok),
  solved:()=>solved,
};
