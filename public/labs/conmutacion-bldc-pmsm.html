<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.26, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;
    }
    if(hook)hook(dt,t); controls.update();
    if(bokeh) bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);
    composer.render(); }
  function start(){ if(!raf)loop(); }
  function stop(){ cancelAnimationFrame(raf); raf=null; window.removeEventListener('resize',resize); }

  return { THREE, renderer, scene, camera, controls, composer, bloom,
    setAnimate:fn=>hook=fn, start, stop, resize, clock,
    flyTo:(v)=>{ controls.target.copy(v); }, moveTo, setCinematicIdle };
}

function pickerFor(scene,camera,dom,onHit){
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(); let down=null;
  dom.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
  dom.addEventListener('pointerup',e=>{
    if(!down)return; const moved=Math.abs(e.clientX-down[0])+Math.abs(e.clientY-down[1])>6; down=null;
    if(moved)return;
    const r=dom.getBoundingClientRect();
    mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(mouse,camera);
    const hits=ray.intersectObjects(scene.children,true);
    onHit(hits[0]||null);
  });
}

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

/* ============================================================
   LAB — Conmutación Seis Pasos de un Motor BLDC/PMSM
   Dominio: D5 Máquinas eléctricas · Molde: S+P (esquemático + panel)
   Física: motor BLDC/PMSM trifásico con FEM inducida trapezoidal
   ideal (tramos planos de 120° eléctricos, rampas de 60°) y un
   inversor que conmuta la corriente en pasos de ±1/0 (seis pasos,
   120° de conducción por fase, 60° flotante) siguiendo la
   posición del rotor. Cuando la conmutación está perfectamente
   alineada con la FEM (δ=0), el par instantáneo es plano e igual
   al ideal K_T·I_cmd. Un error de temporización δ (adelanto o
   atraso de la conmutación respecto de la posición real del
   rotor, en grados eléctricos) reduce el par promedio y produce
   rizo de par — porque cada fase deja de conducir exactamente
   durante su ventana de FEM constante.

   Cerrado en forma exacta (derivado analíticamente y verificado
   con node -e evaluando la estructura lineal a trozos de T(θ,δ)
   en sus puntos de quiebre, no por muestreo aproximado):
     T_avg(δ)   = (1 - δ²/7200) · T_ideal      (|δ|≤60°)
     T_min(δ)   = (1 - |δ|/60) · T_ideal
     T_max(δ)   = T_ideal                       (constante)
     rizo pp(δ) = (|δ|/60) · T_ideal
   T_ideal = K_T·I_cmd.

   Modo Comparar contrasta una conmutación con sensores Hall
   (δ=0 exacto) contra una conmutación "sensorless" que detecta
   el cruce por cero de la FEM con un retardo de tiempo FIJO t_d:
   ese retardo fijo representa un ángulo eléctrico creciente con
   la velocidad del rotor, δ_ef=6·PP·rpm·t_d(s), así que el mismo
   retardo empeora el par disponible mientras más rápido gira el
   motor — el modelo satura δ_ef a ±60° (el límite de validez del
   modelo de par de arriba).

   ⚑ PP=4 pares de polos, K_T=0.45 N·m/A y el rango de I_cmd
   (0–8 A) son valores ilustrativos de catálogo típico de un
   motor BLDC/PMSM de tracción de tamaño medio (extiende el motor
   de mecanica-1), no de una máquina real verificada. NO modela:
   inductancia de fase (la corriente conmuta instantáneamente,
   sin rampa de subida/bajada real); saturación magnética;
   armónicos de la modulación PWM del inversor; inercia ni
   dinámica temporal del rotor; ni el algoritmo real de detección
   de cruce por cero de la FEM (aquí se modela solo su efecto neto
   como un retardo de tiempo fijo).
   ============================================================ */
const mount=document.getElementById('stage');
const S=createStage(mount,{cam:[7.6,5.0,8.6],target:[0,1.1,0],bgTop:'#0b1520',bgBot:'#03070a',bloom:0.35,minD:4,maxD:16});

/* ---------- §1 Modelo físico ---------- */
const PP=4;                        // ⚑ pares de polos, ilustrativo
const K_T=0.45;                    // ⚑ N·m/A, constante de par ilustrativa
const ICMD_MIN=0, ICMD_MAX=8;      // A
const DELTA_MIN=-60, DELTA_MAX=60; // ° eléctricos, error de conmutación
const RPM_MIN=500, RPM_MAX=15000;  // rpm mecánicas (modo Comparar)
const TD_LEVELS=[50,100,200];      // μs, retardo fijo del sensorless

function mod360(x){ let m=x%360; if(m<0) m+=360; return m; }
function trapStep(phi){ const p=mod360(phi); if(p<120) return 1; if(p<180) return 0; if(p<300) return -1; return 0; }
function trapEmf(phi){ const p=mod360(phi); if(p<120) return 1; if(p<180) return 1-2*(p-120)/60; if(p<300) return -1; return -1+2*(p-300)/60; }
function eA(theta){ return trapEmf(theta); }
function eB(theta){ return trapEmf(theta-120); }
function eC(theta){ return trapEmf(theta-240); }
function stepA(theta){ return trapStep(theta); }
function stepB(theta){ return trapStep(theta-120); }
function stepC(theta){ return trapStep(theta-240); }
function tNorm(theta,delta){
  const iA=stepA(theta-delta), iB=stepB(theta-delta), iC=stepC(theta-delta);
  return (eA(theta)*iA+eB(theta)*iB+eC(theta)*iC)/2;
}
function avgFrac(delta){ const dd=Math.max(-60,Math.min(60,delta)); return 1-(dd*dd)/7200; }
function minFrac(delta){ const dd=Math.min(60,Math.abs(delta)); return 1-dd/60; }
function ripplePct(delta){ return Math.min(60,Math.abs(delta))/60*100; }
function tAvgNm(icmdVal,delta){ return K_T*icmdVal*avgFrac(delta); }
function deltaFromDelayRpm(t_d_us,rpmVal){ return 6*PP*rpmVal*(t_d_us*1e-6); } // ° eléctricos

}

function line(c,x1,y1,x2,y2,col,w,dash){
  c.strokeStyle=col; c.lineWidth=w||1.5; c.setLineDash(dash||[]);

function rr(c,x,y,w,h,r,fill,stroke,lw){
  c.beginPath(); c.roundRect(x,y,w,h,r);

function plotTheta(c,fn,py0,py1,vmin,vmax,col,w,dash){
  c.strokeStyle=col; c.lineWidth=w; c.setLineDash(dash||[]);
  c.beginPath(); let pen=false;
  for(let px=PX0;px<=PX1;px+=1){
    const theta=((px-PX0)/(PX1-PX0))*360;
    const v=fn(theta);
    const y=py1-((v-vmin)/(vmax-vmin))*(py1-py0);
    pen?c.lineTo(px,y):c.moveTo(px,y); pen=true;

function boardClick(u,v){
  const px=u*1024, py=(1-v)*768;
  if(px>235&&px<325&&py>100&&py<155){
    showToast('El inversor trifásico conmuta la corriente en pasos de 60° eléctricos siguiendo la posición del rotor — por eso se llama conmutación "seis pasos".');
    synth.beep(520,0.08,0.06); return;
  }
  if(px>520&&px<600&&py>87&&py<167){
    showToast('El motor BLDC/PMSM tiene una FEM inducida de forma trapezoidal (no senoidal) por el diseño de sus imanes — de ahí el nombre "trapezoidal back-EMF".');
    synth.beep(560,0.08,0.06); return;
  }
  if(py>=P1Y0-20&&py<=P1Y1+20){
    showToast('Arriba: FEM trapezoidal de cada fase (líneas punteadas) y la corriente de seis pasos que el inversor le aplica (sólido), desplazada por el error de conmutación δ.');
    synth.beep(600,0.08,0.05); return;
  }
  if(py>=P2Y0-20&&py<=P2Y1+40){
    showToast('Abajo: el par instantáneo normalizado T(θ)/T_ideal. Con δ=0 es plano en 1; con δ≠0 aparecen rebajes triangulares — el rizo de par.');
    synth.beep(600,0.08,0.05); return;
  }
  showToast('Toca el inversor, el motor, o las curvas del pizarrón para explorar la conmutación seis pasos.');
  synth.beep(420,0.08,0.05);
}

function set(id,txt,cls){ const n=el(id); n.textContent=txt; n.classList.remove('good','warn','bad'); if(cls) n.classList.add(cls); }

function updateTele(){
  const hide=(mode==='reto'&&MYST&&MYST.kind==='calcularICmd'&&!retoSolved);
  const dEffRaw=deltaFromDelayRpm(td,rpm);
  const dEff=Math.max(-60,Math.min(60,dEffRaw));
  set('t_deff',dEffRaw.toFixed(1)+'°'+(dEffRaw!==dEff?' (sat.)':''), Math.abs(dEffRaw)>60?'warn':'good');
  if(hide){
    set('t_delta','¿?','warn'); set('t_icmd','¿?','warn'); set('t_tavg','¿?','warn');
    set('t_tavgpct','¿?','warn'); set('t_ripple','¿?','warn');
    return;
  }
  set('t_delta',delta.toFixed(0)+'°');
  set('t_icmd',icmd.toFixed(1)+' A');
  set('t_tavg',tAvgNm(icmd,delta).toFixed(2)+' N·m');
  const pct=avgFrac(delta)*100;
  set('t_tavgpct',pct.toFixed(1)+'%', pct>90?'good':(pct>70?'warn':'bad'));
  const rip=ripplePct(delta);
  set('t_ripple',rip.toFixed(0)+'%', rip<15?'good':(rip<40?'warn':'bad'));
}

function updateReport(){
  const L=[];
  if(mode==='explora'){
    L.push(`δ = <b>${delta.toFixed(0)}°</b>, I_cmd = <b>${icmd.toFixed(1)} A</b> → T_avg = ${tAvgNm(icmd,delta).toFixed(2)} N·m (${(avgFrac(delta)*100).toFixed(1)}% del ideal), rizo pico-pico = ${ripplePct(delta).toFixed(0)}%.`);
    if(delta===0) L.push('Con δ=0 la conmutación está perfectamente alineada: par plano, sin rizo.');
    else L.push('Nota los rebajes triangulares en la curva de par inferior — ahí es donde una fase entra o sale de conducción desalineada respecto de la FEM.');
  } else if(mode==='comparar'){
    const dEffRaw=deltaFromDelayRpm(td,rpm);
    const dEff=Math.max(-60,Math.min(60,dEffRaw));
    L.push(`Hall (δ=0): T_avg=100% del ideal, sin rizo. Sensorless (retardo fijo t_d=${td} μs a ${rpm.toFixed(0)} rpm): δ_ef=${dEffRaw.toFixed(1)}°${dEffRaw!==dEff?' — saturado al límite del modelo (±60°)':''}, T_avg=${(avgFrac(dEff)*100).toFixed(1)}%.`);
    L.push('δ_ef = 6·PP·rpm·t_d crece linealmente con la velocidad: un retardo fijo de detección se vuelve un error de conmutación cada vez mayor mientras más rápido gira el rotor.');
  } else {
    if(MYST.kind==='calcularICmd'){
      L.push(`Reto: con δ = ${MYST.delta}° fijo, calcula I_cmd para T_avg = ${MYST.target.toFixed(2)} N·m.`);
      L.push(retoSolved?`<span class="ok">${retoMsg}</span>`:'Escribe tu resultado en A y comprueba.');
    } else {
      L.push(`Reto: ajusta δ hasta que T_avg caiga a ${MYST.targetPct.toFixed(1)}% del ideal.`);
      L.push(retoSolved?`<span class="ok">${retoMsg}</span>`:'Mueve el deslizador de δ y observa la telemetría "T_avg %".');
    }
  }
  el('report').innerHTML=L.map(s=>'<div>'+s+'</div>').join('');
}

function refreshAll(){ drawBoard(); updateTele(); updateReport(); refreshBenchDyn(); }

/* ---------- §10 Reto ---------- */
function checkReto(){
  if(!MYST) return;
  const v=parseFloat(el('retoInput').value.replace(',','.'));
  if(!isFinite(v)){
    el('retoOut').innerHTML='<span class="dtc">Escribe un número.</span>'; return;
  }
  let ok=false;
  if(MYST.kind==='calcularICmd'){
    ok=Math.abs(v-MYST.answer)<=MYST.tol;
    if(ok) retoMsg=`I_cmd = T_target/(K_T·(1-δ²/7200)) = ${MYST.target.toFixed(2)}/(${K_T}×${avgFrac(MYST.delta).toFixed(4)}) = ${MYST.answer.toFixed(2)} A — con δ=${MYST.delta}° el par promedio cae a ${(avgFrac(MYST.delta)*100).toFixed(1)}% del ideal, así que hace falta más corriente para sostener el mismo par.`;
  } else {
    ok=Math.abs(Math.abs(v)-MYST.deltaTarget)<=MYST.tol;
    if(ok) retoMsg=`δ = ${MYST.deltaTarget}° hace que T_avg caiga exactamente a ${MYST.targetPct.toFixed(1)}% del ideal (T_avg(δ)=1-δ²/7200) — el modelo es simétrico, así que ±${MYST.deltaTarget}° dan el mismo resultado.`;
  }
  if(ok){
    retoSolved=true; solved=true;
    el('retoOut').innerHTML=`<span class="ok">✔ ¡Correcto! (tolerancia ${tolText()})</span>`;
    synth.beep(880,.1,.08); setTimeout(()=>synth.beep(1175,.15,.08),140);
  } else {
    retoMsg='';
    el('retoOut').innerHTML=`<span class="dtc">✘ Aún no. Tolerancia: ${tolText()}</span>`;
    synth.beep(180,.12,.08);
  }
  refreshAll();
}

function newMystery(){
  genMystery();
  el('retoInput').value=''; el('retoOut').innerHTML='';
  buildQuiz();
  setMode('reto');
  showToast(MYST.kind==='calcularICmd'
    ? `Nuevo caso: calcula I_cmd para T_avg=${MYST.target.toFixed(2)} N·m con δ=${MYST.delta}°.`
    : `Nuevo caso: encuentra por tanteo el δ que deja T_avg en ${MYST.targetPct.toFixed(1)}%.`);
}

/* ---------- §11 Quiz ---------- */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
let QUIZ={};
function buildQuiz(){
  QUIZ.explora={
    pregunta:'¿Qué le pasa al par instantáneo de un motor BLDC cuando la conmutación se desalinea un ángulo δ respecto de la FEM real?',
    opciones:shuffle([
      {t:'El par promedio cae y aparece rizo (el par deja de ser plano)',ok:true,why:'Correcto: cada fase deja de conducir exactamente durante su ventana de FEM constante, así que aparecen tramos donde el producto eX·iX es menor — de ahí caen tanto el promedio como la planicie del par.'},
      {t:'El par promedio sube, aunque aparece algo de rizo',ok:false,why:'No: desalinear la conmutación nunca ayuda — el par promedio siempre cae o se mantiene igual (en δ=0), nunca sube.'},
      {t:'No cambia nada mientras |δ|<60°',ok:false,why:'Sí cambia: incluso un δ pequeño reduce el par promedio en proporción a δ² y añade rizo proporcional a |δ|.'},
      {t:'El motor deja de girar inmediatamente',ok:false,why:'No: el motor sigue girando con menos par disponible y más rizo; solo se detendría si el par de carga superara al par promedio disponible.'},
    ]),
  };
  QUIZ.comparar={
    pregunta:'¿Por qué un accionamiento sensorless con retardo fijo de detección pierde más par al subir la velocidad del rotor?',
    opciones:shuffle([
      {t:'Porque δ_ef=6·PP·rpm·t_d crece linealmente con la velocidad para un retardo fijo en segundos',ok:true,why:'Correcto: un retardo de tiempo fijo (t_d) representa un ángulo eléctrico cada vez mayor mientras más rápido gira el rotor, porque el rotor recorre más grados eléctricos en ese mismo tiempo.'},
      {t:'Porque los sensores Hall se desgastan con la velocidad',ok:false,why:'No aplica aquí: el accionamiento sensorless de este comparativo no usa sensores Hall en absoluto — usa un algoritmo de detección de cruce por cero con un retardo fijo.'},
      {t:'Porque I_cmd baja automáticamente a alta velocidad',ok:false,why:'No: I_cmd es un valor independiente que el usuario o el controlador de corriente fija; no cambia solo por la velocidad.'},
      {t:'No pierde más par — el efecto es igual a cualquier velocidad',ok:false,why:'No: δ_ef depende de rpm; a baja velocidad el mismo retardo produce un δ_ef pequeño, a alta velocidad puede saturar el modelo (>60°).'},
    ]),
  };
  if(MYST){
    if(MYST.kind==='calcularICmd'){
      QUIZ.reto={
        pregunta:'¿Qué fórmula despeja la corriente comandada I_cmd necesaria para un par promedio T_target dado un error de conmutación δ fijo?',
        opciones:shuffle([
          {t:'I_cmd = T_target / (K_T·(1-δ²/7200))',ok:true,why:'Correcto: T_avg=K_T·I_cmd·(1-δ²/7200); despejando I_cmd se obtiene esa expresión.'},
          {t:'I_cmd = T_target·K_T·(1-δ²/7200)',ok:false,why:'Está invertida: hay que DIVIDIR entre K_T·(1-δ²/7200), no multiplicar.'},
          {t:'I_cmd = T_target / K_T',ok:false,why:'Falta el factor de corrección por δ: con δ≠0 el par promedio ya no es simplemente K_T·I_cmd.'},
          {t:'I_cmd no depende de δ',ok:false,why:'Sí depende: con más error de conmutación, T_avg(δ) cae, así que hace falta más corriente para el mismo par objetivo.'},
        ]),
      };
    } else {
      QUIZ.reto={
        pregunta:'Buscando por tanteo el δ que produce un T_avg% dado: ¿qué observas si te pasas del valor buscado y sigues aumentando |δ|?',
        opciones:shuffle([
          {t:'T_avg% sigue bajando — es una función decreciente de |δ|',ok:true,why:'Correcto: T_avg(δ)=1-δ²/7200 depende solo de |δ| (es simétrica) y decrece monótonamente conforme |δ| crece, hasta 50% en δ=±60°.'},
          {t:'T_avg% empieza a subir de nuevo',ok:false,why:'No: en el rango ±60° modelado, T_avg% es monótonamente decreciente con |δ| — nunca vuelve a subir.'},
          {t:'El rizo de par desaparece',ok:false,why:'Al revés: el rizo pico-pico=|δ|/60 crece con |δ|, no desaparece.'},
          {t:'No hay forma de saberlo sin calcularlo primero',ok:false,why:'Sí la hay: la telemetría "T_avg %" se actualiza en vivo con cada movimiento del deslizador δ.'},
        ]),
      };
    }
  }
}
function clearDx(){ el('dxbtns').innerHTML=''; }
function refreshQuestion(){
  const q=QUIZ[mode]; if(!q) return;
  el('q_text').textContent=q.pregunta;
  const box=el('dxbtns'); box.innerHTML='';
  q.opciones.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='b dx';
    b.textContent=String.fromCharCode(65+i)+') '+o.t;
    b.onclick=()=>{
      if(b.classList.contains('right')||b.classList.contains('wrong')) return;
      b.classList.add(o.ok?'right':'wrong');
      showToast(o.why); synth.beep(o.ok?760:220,.1,.07);
    };
    box.appendChild(b);
  });
}

/* ---------- §12 Picking / demos / tour / init ---------- */
pickerFor(S.scene,S.camera,S.renderer.domElement,hit=>{
  if(hit.object===board&&hit.uv){ boardClick(hit.uv.x,hit.uv.y); return; }
  let o=hit.object;
  while(o&&!o.userData?.act) o=o.parent;
  const act=o&&o.userData?.act;
  const hide=(mode==='reto'&&MYST&&MYST.kind==='calcularICmd'&&!retoSolved);
  if(act==='inv3d'){ showToast('Inversor trifásico: conmuta la corriente entre las tres fases en pasos de 60° eléctricos, siguiendo la posición del rotor.'); synth.beep(560,.08,.06); }
  else if(act==='dial3d'){ showToast(`Perilla de error de conmutación: δ = ${hide?'¿?':delta.toFixed(0)+'°'}. Un δ≠0 significa que el inversor conmuta antes o después de lo ideal.`); synth.beep(660,.08,.06); }
  else if(act==='mot3d'){ showToast('Motor BLDC/PMSM: su FEM inducida tiene forma trapezoidal (tramos planos de 120° y rampas de 60°) por el diseño de sus imanes de rotor.'); synth.beep(520,.08,.06); }
  else if(act==='hall3d'){ showToast('Sensor Hall: detecta la posición del rotor cada 60° eléctricos para que el inversor conmute exactamente alineado (δ=0).'); synth.beep(500,.08,.06); }
  else if(act==='paneld3d'){ showToast('Display del inversor: muestra el error de conmutación δ y la corriente comandada I_cmd.'); synth.beep(600,.08,.06); }
  else if(act==='meter3d'){ showToast('Medidor de par: muestra el par promedio y el rizo pico-pico resultante del error de conmutación actual.'); synth.beep(600,.08,.06); }
});

(function hoverTip(){
  const ray=new THREE.Raycaster(); const dom=S.renderer.domElement;
  dom.addEventListener('pointermove',e=>{
    const r=dom.getBoundingClientRect();
    const x=((e.clientX-r.left)/r.width)*2-1, y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera({x,y},S.camera);
    const hits=ray.intersectObjects(S.scene.children,true);
    let title='';
    for(const h of hits){ let o=h.object; while(o){ if(o.userData?.title){ title=o.userData.title; break; } o=o.parent; } if(title) break; }
    dom.style.cursor=title?'pointer':'default'; dom.title=title;
  });
})();

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function runHallDemo(silent){
  if(mode==='reto') return;
  setDelta(0);
  await sleep(250);
  if(!silent){
    showToast('Conmutación con sensores Hall: δ=0° exacto → T_avg=100% del ideal, sin rizo de par.');
    synth.beep(620,.12,.08);
  }
}

async function runSensorlessDemo(silent){
  if(mode==='reto') return;
  let peakDeff=0, peakRpm=RPM_MIN;
  for(let v=RPM_MIN;v<=RPM_MAX;v+=400){
    setRpm(v);
    const dRaw=Math.abs(deltaFromDelayRpm(td,v));
    if(dRaw>peakDeff){ peakDeff=dRaw; peakRpm=v; }
    await sleep(35);
  }
  if(!silent){
    showToast(`Conmutación sensorless: con t_d=${td} μs, δ_ef llegó a ${peakDeff.toFixed(1)}° a ${peakRpm.toFixed(0)} rpm — ${peakDeff>60?'saturando el modelo (par promedio limitado al 50% del ideal)':'todavía dentro del rango modelado'}.`);
    synth.beep(760,.1,.08);
  }
}

async function runAuto(){
  if(autoRunning) return; autoRunning=true;
  const b=el('btnAuto'); b.disabled=true; b.textContent='▶ En curso…';
  try{
    synth.init(); synth.resume();
    setMode('explora'); setIcmd(4);
    showToast('1/5 · Explora: barremos δ de -60° a 60° con I_cmd=4 A.');
    for(let v=DELTA_MIN;v<=DELTA_MAX;v+=4){ setDelta(v); await sleep(60); }
    setDelta(0);
    await sleep(300);

    showToast('2/5 · Comparar: Hall (δ=0) contra sensorless con retardo fijo.');
    setMode('comparar');
    await runHallDemo(true);
    await sleep(400);
    await runSensorlessDemo(true);
    await sleep(400);

    showToast('3/5 · Reto: resolvemos un caso misterioso.');
    setMode('reto');
    if(MYST.kind==='buscarDelta'){
      for(let v=0;v<=DELTA_MAX;v+=1){
        setDelta(v);
        if(Math.abs(avgFrac(v)*100-MYST.targetPct)<0.5) break;
        await sleep(25);
      }
      el('retoInput').value=delta.toFixed(0);
    } else {
      el('retoInput').value=MYST.answer.toFixed(2);
    }
    checkReto();
    await sleep(300);

    showToast('4/5 · Marcamos la respuesta correcta del quiz.');
    const idx=QUIZ.reto.opciones.findIndex(o=>o.ok);
    if(idx>=0) el('dxbtns').children[idx].click();
    await sleep(600);

    showToast('5/5 · Nuevo caso listo para intentar por tu cuenta.');
    newMystery();
  } finally {
    autoRunning=false; b.disabled=false; b.textContent='✨ Recorrido guiado';
  }
}

S.setAnimate(()=>{
  const speedFrac=Math.min(1,icmd/ICMD_MAX);
  couplingG.rotation.x += 0.01 + 0.05*speedFrac;
});

['m_explora','m_comparar','m_reto'].forEach(id=>{
  el(id).addEventListener('click',()=>{
    const m=id.slice(2);
    if(mode==='reto'&&!retoSolved&&m!=='reto'){ showToast('🔒 Resuelve el reto actual (o pide un nuevo caso) antes de salir.'); synth.beep(220,.1,.07); return; }

});
el('td_50').addEventListener('click',()=>setTd(50));
el('td_100').addEventListener('click',()=>setTd(100));
el('td_200').addEventListener('click',()=>setTd(200));
el('sDelta').addEventListener('input',e=>setDelta(parseFloat(e.target.value)));
el('sIcmd').addEventListener('input',e=>setIcmd(parseFloat(e.target.value)));
el('sRpm').addEventListener('input',e=>setRpm(parseFloat(e.target.value)));
el('btnCheck').addEventListener('click',checkReto);
el('btnAuto').addEventListener('click',runAuto);
el('btnNew').addEventListener('click',newMystery);
el('btnHall').addEventListener('click',()=>{ if(!autoRunning) runHallDemo(false); });
el('btnSensorless').addEventListener('click',()=>{ if(!autoRunning) runSensorlessDemo(false); });

genMystery(); buildQuiz();
S.start();
setMode('explora');

window.__labDebug={
  state:()=>({mode,delta,icmd,rpm,td,retoSolved,solved}),
  point:()=>({tAvg:tAvgNm(icmd,delta),tAvgPct:avgFrac(delta)*100,ripplePct:ripplePct(delta)}),
  trapEmf, trapStep, tNorm, avgFrac, minFrac, ripplePct, deltaFromDelayRpm, tAvgNm,
  mystery:()=>MYST?{...MYST}:null,
  setDelta, setIcmd, setRpm, setTd,
  checkReto, newMystery, boardClick,
  mode:()=>mode, setMode,
  runHallDemo, runSensorlessDemo,
};
