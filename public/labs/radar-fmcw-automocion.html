function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.47:0.43),240,450));
  let hh=base; const hud=el('hud');
  if(movil&&b.classList.contains('t-panel')) hh=Math.round(clamp(H*0.6,240,560));
  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;
    hh=Math.round(clamp(pide,240,Math.max(base,H*(movil?0.62:0.56)))); }
  const ant=parseFloat(b.style.getPropertyValue('--hojaH'))||0;
  if(Math.abs(ant-hh)>1){ b.style.setProperty('--hojaH',hh+'px'); colocaBarras(); centraEnHueco(); }
}
el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.onclick=()=>{ const b=document.body; b.classList.remove('t-hud','t-panel'); b.classList.add('t-'+t.dataset.tab); disposicion(); centraEnHueco(); });

/* ===================== 18. EL LABORATORIO GUIADO =====================
   Tres fases: 1 · Predice (la frecuencia de batido de un obstáculo, con la fórmula), 2 · Ajusta (B, T_c y N para
   medir sin ambigüedad DOS objetivos concretos —separados en distancia y en velocidad— sin pasarse de la memoria ni
   del tiempo de ciclo; el resultado sólo aparece al validar) y 3 · Diagnostica (¿por qué falló este radar?, sólo con lo
   que se ve en el dock) y cierra con un quiz de tres preguntas. Cuatro validaciones fallidas cambian el par de
   objetivos (no se aprueba por eliminación). */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETO={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'predice',iniciado:false,dxOk:false,r1:null,r2:null,dx:null,orden:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0,clave:''};
const CFG_RETO0=()=>({B:1.0e9,Tc:40e-6,N:64,win:'hann'});

/* ---------- Fase 1 · Predice ---------- */
const CASOS1=[{B:1.0,Tc:50,R:75},{B:0.6,Tc:30,R:90},{B:1.5,Tc:40,R:48},{B:0.8,Tc:25,R:60},{B:2.0,Tc:60,R:35},{B:0.5,Tc:20,R:110},{B:1.2,Tc:45,R:82},{B:3.0,Tc:80,R:42}];
const fbCaso=c=>fBatido(c.B*1e9/(c.Tc*1e-6),c.R)/1e6;
function sorteaCaso1(){ const p=GUIA.r1&&GUIA.r1.i; let i; do{ i=Math.floor(Math.random()*CASOS1.length); }while(i===p); const c=CASOS1[i];
  GUIA.r1={i,B:c.B,Tc:c.Tc,R:c.R,ans:fbCaso(c)}; }
function checkPredice(){
  const raw=String((el('ansV')||{}).value||'').trim().replace(/\s| /g,'').replace(',','.'), v=parseFloat(raw), r=GUIA.r1, ok=r.ans;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe la frecuencia de batido en megahercios (con coma o punto decimal).'); return; }
  RETO.intentos++;
  if(Math.abs(v-ok)<=Math.max(0.05,0.03*ok)){
    RETO.fallos1=0; sonido.bien();
    feedback('good','¡Correcto! ✓',`La pendiente es S = B/T<sub>c</sub> = ${fN(r.B*1e3,0)} MHz / ${fN(r.Tc,0)} µs = ${fN(r.B*1e9/(r.Tc*1e-6)/1e12,1)} THz/s y el eco tarda τ = 2R/c = ${fN(2*r.R/C0*1e9,0)} ns, así que f<sub>b</sub> = S·τ = <b>${fN(ok,2)} MHz</b>. Fíjate: la distancia se ha convertido en una frecuencia, y la FFT de rango sólo tiene que medirla.`,true);
    paso('decide'); prepararDecide();
  } else {
    RETO.fallos1++; sonido.mal();
    const q=v/ok; let pista;
    if(Math.abs(q-0.5)<0.06) pista='Te falta el viaje de ida y vuelta: la onda recorre 2R, no R.';
    else if(Math.abs(q-2)<0.1) pista='Has contado el ida y vuelta dos veces: τ = 2R/c ya lo incluye.';
    else if(Math.abs(q-1000)<60||Math.abs(q-0.001)<0.0001) pista='Revisa las unidades: la respuesta se pide en MHz.';
    else pista=`Tu resultado está ${v>ok?'alto':'bajo'}. Calcula la pendiente S = B/T<sub>c</sub> en Hz/s y el retardo τ = 2R/c; el batido es su producto.`;
    if(RETO.fallos1>=3){ RETO.fallos1=0; RETO.resiembras++; sorteaCaso1(); feedback('bad','Tres intentos fallidos','Cambia el caso: vuelve a separar la pendiente del chirp del retardo del eco.'); marcaSucio(); pintaHUD(); pintaDockFijo(); }
    else { feedback('bad','Revisa el cálculo',pista+` (intentos fallidos: ${RETO.fallos1}/3)`); const t=el('d_try'); if(t) t.textContent=RETO.fallos1; }
  }
}

/* ---------- Fase 2 · Ajusta B, T_c y N ---------- */
const CLAVES_ESC=['autopista','ciclista','peaton'];
const nombreObj=o=>`${o.nombre} a ${fN(o.R,1)} m, ${o.v<0?'se acerca a':'se aleja a'} ${fN(Math.abs(o.v),1)} m/s (${fN(Math.abs(o.v)*3.6,0)} km/h)`;
function prepararDecide(){
  let c; do{ c=pickOne(CLAVES_ESC); }while(c===GUIA.clave&&CLAVES_ESC.length>1); GUIA.clave=c;
  GUIA.r2={clave:c,esc:ESCENARIOS[c],cfg:CFG_RETO0(),validado:false,res:null,intentos:0,ventana:null};
  marcaSucio(); pintaHUD(); pintaDockFijo();
}
const MENSAJES_CRIT={
  alcance:(c,e,r)=>`<b>Alcance:</b> el ${e.a.R>=e.b.R?e.a.nombre:e.b.nombre} está a ${fN(Math.max(e.a.R,e.b.R),1)} m y tu R<sub>máx</sub> es ${fN(c.val,0)} m: su batido pasa de f<sub>s</sub> y el filtro lo corta.`,
  velocidad:(c,e)=>`<b>Velocidad:</b> se mueven a ${fN(Math.max(Math.abs(e.a.v),Math.abs(e.b.v)),1)} m/s y tu v<sub>máx</sub> es ±${fN(c.val,1)} m/s: la velocidad se pliega (alias) y se mide otra.`,
  resolucion:(c,e,r)=>`<b>Resolución:</b> con ΔR = ${r.d.dR<1?fN(r.d.dR*100,0)+' cm':fN(r.d.dR,2)+' m'} y Δv = ${fN(r.d.dv,2)} m/s los dos ecos quedan a ${fN(r.res.xr,1)} celdas de distancia y ${fN(r.res.yd,1)} de velocidad: no forman dos picos separados (o uno tapa al otro).`,
  deteccion:(c,e,r)=>`<b>Detección:</b> el eco más débil queda ${c.val<0?fN(-c.val,1)+' dB por debajo':fN(c.val,1)+' dB por encima'} del umbral CFAR y hacen falta ${MARGEN_DET} dB. Más muestras integradas (T<sub>c</sub> o N) suben la señal; un eco fuerte pegado sube el umbral.`,
  precision:(c)=>`<b>Precisión:</b> ΔR = ${fN(c.val,2)} m y el control de crucero pide 1 m o menos.`,
  memoria:(c,e,r)=>`<b>Memoria:</b> ${fN(r.d.Ns,0)} muestras × ${r.d.N} chirps = ${fN(c.val/1000,0)} k y la memoria guarda ${fN(RADAR.mem/1000,0)} k.`,
  ciclo:(c)=>`<b>Ciclo:</b> N·T<sub>c</sub> = ${fN(c.val*1e3,1)} ms y el máximo son 8 ms.`,
};
function validarDecide(){
  const r=GUIA.r2; if(!r) return;
  const ev=evaluaConfig(Object.assign({},r.cfg,{win:'hann'}),r.esc); r.res=ev; r.validado=true; r.intentos++; RETO.intentos++;
  const malos=ev.criterios.filter(c=>!c.ok);
  if(!malos.length){
    RETO.fallos2=0; sonido.bien(); r.ventana=ventanaReto(r.esc);
    feedback('good','¡Lo conseguiste! ✓',`Con B = <b>${fGHz(r.cfg.B)}</b>, T<sub>c</sub> = <b>${fUs(r.cfg.Tc)}</b> y N = <b>${r.cfg.N}</b> el radar mide los dos objetivos sin alias y los separa. Para este par, las combinaciones que sirven van de B ≈ ${fN(r.ventana.bLo,2)} a ${fN(r.ventana.bHi,2)} GHz y de T<sub>c</sub> ≈ ${fN(r.ventana.tLo,0)} a ${fN(r.ventana.tHi,0)} µs: B grande afina la distancia pero acorta R<sub>máx</sub>; T<sub>c</sub> corto sube v<sub>máx</sub> pero resta muestras; N alto afina la velocidad hasta chocar con la memoria y el ciclo.`,true);
    pintaHUD(); paso('diag'); iniciaDiag();
  } else {
    RETO.fallos2++; sonido.mal();
    const msg=malos.map(c=>MENSAJES_CRIT[c.k](c,r.esc,ev)).join('<br>');
    if(RETO.fallos2>=4){ RETO.fallos2=0; RETO.resiembras++; feedback('bad','Cuatro validaciones sin lograrlo',msg+'<br>Cambia el par de objetivos: las distancias y las velocidades son otras.',true); prepararDecide(); }
    else { feedback('bad','Todavía no',msg+`<br>(validaciones fallidas: ${RETO.fallos2}/4)`,true); pintaHUD(); }
  }
}
/** Intervalos de B y T_c que sirven para este par (se calcula sólo tras resolverlo). */
function ventanaReto(esc){
  let bLo=9,bHi=0,tLo=99,tHi=0;
  for(let b=0.1;b<=4.001;b+=0.05) for(let t=8;t<=80;t++) for(const n of NS){
    if(evaluaConfig({B:b*1e9,Tc:t*1e-6,N:n,win:'hann'},esc,undefined,true).ok){ bLo=Math.min(bLo,b); bHi=Math.max(bHi,b); tLo=Math.min(tLo,t); tHi=Math.max(tHi,t); } }
  return {bLo,bHi,tLo,tHi};
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const co=(nombre,R,v,sigma)=>({nombre,R,v,sigma});
const CASOS_DX=[
  {k:'rango',  t:'B demasiado pequeño', cfg:{B:0.15e9,Tc:30e-6,N:64,win:'hann'}, objs:[Object.assign(co('coche',60,-15,RCS.coche),{lane:-1.1}),Object.assign(co('coche',60.5,-15,RCS.coche),{lane:1.1})]},
  {k:'doppler',t:'Pocos chirps',        cfg:{B:1.0e9,Tc:25e-6,N:16,win:'hann'}, objs:[Object.assign(co('coche',70,-12,RCS.coche),{lane:-1.1}),Object.assign(co('moto',70,-9,RCS.moto),{lane:1.1})]},
  {k:'alias',  t:'Chirp demasiado largo',cfg:{B:0.8e9,Tc:70e-6,N:32,win:'hann'}, objs:[Object.assign(co('coche',50,-27,RCS.coche),{lane:-1.1}),Object.assign(co('camión',80,6,RCS.camion),{lane:1.2})]},
];
function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.k; let c; do{ c=pickOne(CASOS_DX); }while(c.k===p);
  GUIA.dx=c; GUIA.dxOk=false; GUIA.orden=barajar(CASOS_DX.map(x=>x.k)); EST.sel=0; marcaSucio(); pintaHUD(); pintaDockFijo();
}
function diagnostica(k){
  if(!GUIA.dx||GUIA.dxOk) return; RETO.intentos++;
  if(k===GUIA.dx.k){
    GUIA.dxOk=true; RETO.fallos3=0; sonido.bien();
    feedback('good','Diagnóstico correcto ✓',explicaDx(GUIA.dx.k),true);
    paso('quiz'); iniciaQuiz();
  } else {
    RETO.fallos3++; sonido.mal();
    if(RETO.fallos3>=3){ RETO.fallos3=0; RETO.resiembras++; feedback('bad','Tres intentos fallidos','Es otro caso: compara ΔR y Δv con la separación real de los dos vehículos, y mira si el eco medido va a la velocidad que lleva cada uno.',true); iniciaDiag(); }
    else { feedback('bad','No es ese',noEs(k)+` (intentos fallidos: ${RETO.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(k){
  if(k==='rango') return 'B demasiado pequeño: ΔR = c/(2B) = 1 m y los dos coches están a 0,5 m, uno junto al otro y a la misma velocidad. Sus tonos de batido caen en la misma celda de rango y el mapa sólo ve una mancha. Subir B afina la distancia (pero acorta R<sub>máx</sub>).';
  if(k==='doppler') return 'Pocos chirps: con N = 16 y T<sub>c</sub> = 25 µs, Δv = λ/(2·N·T<sub>c</sub>) ≈ 4,9 m/s y los dos vehículos, a la misma distancia y con 3 m/s de diferencia, caen en la misma celda de velocidad. Más chirps (o T<sub>c</sub> largo) afinan Δv.';
  return 'Chirp demasiado largo: con T<sub>c</sub> = 70 µs, v<sub>máx</sub> = λ/(4T<sub>c</sub>) ≈ 14 m/s y el coche, que se acerca a 27 m/s, supera el límite: la fase de un chirp a otro avanza más de media vuelta y el radar mide otra velocidad (aquí casi cero). Acortar T<sub>c</sub> sube v<sub>máx</sub>.';
}
function noEs(k){
  if(k==='rango') return 'Si fuera la resolución en distancia, los dos vehículos estarían separados por menos de una celda ΔR y a la misma velocidad.';
  if(k==='doppler') return 'Si fuera la resolución en velocidad, los dos estarían a la misma distancia y con una diferencia de velocidad menor que Δv.';
  return 'Un alias no junta dos ecos: hace que uno aparezca con una velocidad que no es la suya. Mira a qué velocidad mide cada vehículo y compárala con la real.';
}
const QUIZ=[
  {q:'Si duplicas el ancho de banda B del chirp, ¿qué le pasa a la resolución en distancia?',ok:'Se reduce a la mitad (ΔR = c/2B): ve objetos más pegados',mal:['Se duplica: ve peor los objetos pegados','No cambia: sólo depende de T_c','Se reduce a la cuarta parte']},
  {q:'¿Qué hay que acortar para medir velocidades más altas sin ambigüedad?',ok:'El tiempo entre chirps T_c (v_máx = λ/(4T_c))',mal:['El número de chirps N','El ancho de banda B','La potencia emitida']},
  {q:'Un objetivo se aleja al doble de distancia. ¿Cuánta potencia devuelve respecto a antes?',ok:'16 veces menos (−12 dB): crece con R⁴',mal:['4 veces menos','8 veces menos','2 veces menos']},
];
function iniciaQuiz(){ GUIA.quizN=0; cargaPregunta(); }
function cargaPregunta(){ const Q=QUIZ[GUIA.quizN], opts=barajar([Q.ok,...Q.mal]); GUIA.quiz={q:Q.q,opts,ok:opts.indexOf(Q.ok)}; GUIA.quizResp=-1; GUIA.quizCorrecta=GUIA.quiz.ok; pintaHUD(); }
function respondeQuiz(i){
  if(GUIA.quizResp>=0) return; GUIA.quizResp=i; const ac=i===GUIA.quiz.ok; if(ac) RETO.quizAcierto++;
  if(ac) sonido.bien(); else sonido.mal();
  const ult=GUIA.quizN>=QUIZ.length-1;
  feedback(ac?'good':'bad',ac?'Correcto ✓':'No es esa',(ac?'':'La respuesta era: <b>'+GUIA.quiz.opts[GUIA.quiz.ok]+'</b>. ')+(ult?'Terminaste el laboratorio.':'Sigue con la siguiente.'),true);
  pintaHUD();
  if(ult){ RETO.hecho=true; paso('completo'); }
}
function siguientePregunta(){ if(GUIA.quizN<QUIZ.length-1){ GUIA.quizN++; cargaPregunta(); } }

/* ---------- el enrutador de acciones ---------- */
function paso(p){ GUIA.paso=p; GUIA.phase=({predice:0,decide:1,diag:2,quiz:2,completo:2})[p]; if(EST.modo==='guia'){ pintaHUD(); marcaSucio(); } }
function handleAction(act,btn){
  switch(act){
    case 'check-v': checkPredice(); break;
    case 'hint-v':
      if(RETO.pistas===0){ RETO.pistas=1; feedback('good','Pista 1 de 2','El chirp sube B hertz en T_c segundos, así que su pendiente es S = B/T_c. El eco vuelve con un retraso τ = 2R/c.'); }
      else if(RETO.pistas===1){ RETO.pistas=2; feedback('good','Pista 2 de 2','En el instante en que se mezclan, la señal emitida ya ha subido S·τ hertz más que el eco: f_b = S·τ = (B/T_c)·(2R/c).'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break;
    case 'validar': validarDecide(); break;
    case 'dx-rango': diagnostica('rango'); break; case 'dx-doppler': diagnostica('doppler'); break; case 'dx-alias': diagnostica('alias'); break;
    case 'quiz-0': respondeQuiz(0); break; case 'quiz-1': respondeQuiz(1); break; case 'quiz-2': respondeQuiz(2); break; case 'quiz-3': respondeQuiz(3); break;
    case 'quiz-sig': siguientePregunta(); break;
    case 'restart': location.reload(); break;
  }
}

/* ---------- lo que la guía enseña en cada paso ---------- */
function contenidoGuia(){
  const tri=(n,v,m)=>`<span class="tries">intentos fallidos: <b id="${n}">${v}</b>/${m}</span>`;
  switch(GUIA.paso){
    case 'predice': { const r=GUIA.r1; return {no:'Fase 1 · Reto 1',head:'Tu cálculo',title:'¿A qué frecuencia late el eco?',
      teach:`Un radar emite un chirp de <b>B = ${fN(r.B,2)} GHz</b> en <b>T<sub>c</sub> = ${fN(r.Tc,0)} µs</b> y ve un obstáculo a <b>${fN(r.R,0)} m</b>.<div class="task">¿Cuál es la frecuencia de batido, en MHz? ${tri('d_try',RETO.fallos1,3)}</div>`,
      acts:`<div class="calcrow"><input id="ansV" type="text" inputmode="decimal" autocomplete="off" placeholder="¿? MHz" aria-label="Frecuencia de batido en megahercios"><button class="b primary" data-act="check-v">✓ Comprobar</button></div><button class="pista" id="btnHint">¿Necesitas una pista? (máx. 2)</button>`}; }
    case 'decide': { const r=GUIA.r2; if(!r) return {no:'Fase 2 · Reto 2',head:'Tu ajuste',title:'Preparando…',teach:'',acts:''};
      const E=r.esc, ev=r.validado&&r.res?r.res:null;
      const filas=ev?ev.criterios.map(c=>`<div class="esc"><span>${({alcance:'Alcance',velocidad:'Velocidad',resolucion:'Resolución',deteccion:'Detección',precision:'Precisión',memoria:'Memoria',ciclo:'Ciclo'})[c.k]}</span><span class="rs ${c.ok?'ok':'mal'}">${c.ok?'✓':'✗'}</span></div>`).join(''):'';
      return {no:'Fase 2 · Reto 2',head:'Tu ajuste',title:'Mide bien a los dos',
      teach:`<b>${E.nombre}</b>: ${nombreObj(E.a)}; ${nombreObj(E.b)}. Elige B, T<sub>c</sub> y N para medirlos <b>sin alias</b>, <b>separados</b> y <b>detectados</b>, con la memoria (131 k muestras) y el ciclo (8 ms) del sistema.${filas?`<div class="escs">${filas}</div>`:''}<div class="why"><b>Ventana de Hann.</b> El resultado de cada criterio sale sólo al validar. ${tri('d_try2',RETO.fallos2,4)}</div>`,
      acts:`${htmlMandosRadar(r.cfg)}<button class="b primary" data-act="validar">▶ Validar</button>`}; }
    case 'diag': { const ord=GUIA.orden||CASOS_DX.map(x=>x.k), N={rango:'B demasiado pequeño: no separa en distancia',doppler:'Pocos chirps: no separa en velocidad',alias:'Chirp demasiado largo: la velocidad se pliega'};
      return {no:'Fase 3 · Diagnóstico',head:'¿Qué falló?',title:'Averigua la causa sin ver los mandos',
      teach:`Este radar no mide bien a los dos vehículos de la escena. Compara lo que ves en el mapa con lo que hay en la carretera.<div class="task">¿Cuál es la causa? ${tri('d_try3',RETO.fallos3,3)}</div>`,
      acts:ord.map(k=>`<button class="b" data-act="dx-${k}">${N[k]}</button>`).join('')}; }
    case 'quiz': { const Q=GUIA.quiz; if(!Q) return {no:'',head:'',title:'',teach:'',acts:''}; const ya=GUIA.quizResp>=0;
      return {no:'Cierre · Pregunta '+(GUIA.quizN+1)+' de '+QUIZ.length,head:'Quiz',title:Q.q,teach:'',
      acts:Q.opts.map((o,i)=>`<button class="b ${ya?(i===Q.ok?'good':(i===GUIA.quizResp?'bad':'')):''}" data-act="quiz-${i}" ${ya?'disabled':''}>${o}</button>`).join('')+(ya&&GUIA.quizN<QUIZ.length-1?'<button class="b primary" data-act="quiz-sig">Siguiente →</button>':'')}; }
    case 'completo': return {no:'Laboratorio completado',head:'✓',title:'Predijiste, ajustaste y diagnosticaste',
      teach:`Acertaste ${RETO.quizAcierto} de ${QUIZ.length} en el quiz. Vuelve a <b>En marcha</b> y cambia B, T<sub>c</sub>, N y la ventana: ningún mando mejora todo a la vez, y ése es el diseño de un radar.`,
      acts:`<button class="b primary" data-act="restart">↺ Reiniciar laboratorio</button>`};
  }
  return {no:'',head:'',title:'',teach:'',acts:''};
}
function htmlGuia(){
  const ps=['Predice','Ajusta','Diagnostica'], C=contenidoGuia();
  const ok=i=>i<GUIA.phase||(i===2&&RETO.hecho);
  return `<div class="pasos">${ps.map((t,i)=>`<span class="ps ${ok(i)?'ok':(i===GUIA.phase?'on':'')}"><i>${ok(i)?'✓':i+1}</i>${t}</span>`).join('')}</div>
  <div class="retoBox"><div class="rt"><span>${C.no}</span><span>${C.head}</span></div><h3>${C.title}</h3><div class="rq">${C.teach}</div><div class="opt ${GUIA.paso==='decide'?'optM':''}" id="actOpt">${C.acts}</div></div>`;
}
/** Configuración y objetivos que corren en cada paso del laboratorio guiado (null: lo que digan los mandos). */
function guiaCfg(){
  if(GUIA.paso==='predice'&&GUIA.r1){ const r=GUIA.r1; return {B:r.B*1e9,Tc:r.Tc*1e-6,N:64,win:'hann'}; }
  if(GUIA.paso==='decide'&&GUIA.r2) return Object.assign({},GUIA.r2.cfg,{win:'hann'});
  if((GUIA.paso==='diag'||GUIA.paso==='quiz'||GUIA.paso==='completo')&&GUIA.dx) return GUIA.dx.cfg;
  return null;
}
function guiaObjs(){
  if(GUIA.paso==='predice'&&GUIA.r1) return [Object.assign(co('coche',GUIA.r1.R,-10,RCS.coche),{lane:0})];
  if(GUIA.paso==='decide'&&GUIA.r2) return deEscenario(GUIA.r2.esc);
  if((GUIA.paso==='diag'||GUIA.paso==='quiz'||GUIA.paso==='completo')&&GUIA.dx) return GUIA.dx.objs;
  return null;
}
/* ---------- los modos ---------- */
function setMode(m,forzar){
  if(!forzar&&(m===EST.modo||EST.autoRunning)) return;
  if(m==='guia'){
    EST.modo='guia'; if(!GUIA.iniciado){ GUIA.iniciado=true; sorteaCaso1(); paso('predice'); }
  } else EST.modo='marcha';
  document.body.classList.toggle('m-marcha',EST.modo==='marcha'); document.body.classList.toggle('m-guia',EST.modo==='guia');
  EST.sel=0; marcaSucio(); ponVista(EST.vista,0.6); pintaHUD(); pintaDockFijo(); pintaBarras();
}
let fbTimer=null;
function feedback(type,title,text,sticky=false){ const f=el('feedback'); f.className='feedback show '+type; el('fbIcon').textContent=type==='good'?'✓':'✕'; el('fbTitle').textContent=title; el('fbText').innerHTML=text; clearTimeout(fbTimer); if(!sticky) fbTimer=setTimeout(()=>f.classList.remove('show'),7000); }
el('fbX').onclick=()=>el('feedback').classList.remove('show');

/* ---------- el recorrido guiado de «En marcha» ---------- */
const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function runAuto(){
  if(EST.autoRunning||EST.modo!=='marcha') return; EST.autoRunning=true; sonido.init();
  const hud=el('hud'), prev={escena:EST.escena,B:EST.B,Tc:EST.Tc,N:EST.N,win:EST.win,vista:EST.vista,vel:EST.vel,sel:EST.sel};
  const fija=o=>{ Object.assign(EST,o); EST.sel=0; pintaHUD(); hud.style.pointerEvents='none'; const b=el('btnAuto'); if(b){ b.disabled=true; b.textContent='Recorrido en curso…'; } marcaSucio(); pintaDockFijo(); pintaBarras(); };
  try{
    fija({escena:'ciudad',B:1.0e9,Tc:40e-6,N:128,win:'hann'}); ponVista('sensor');
    showToast('Paso 1 · Las antenas TX emiten <b>chirps</b> (las ondas de color) y cada objetivo devuelve su eco. En el mapa, la <b>distancia</b> va en horizontal y la <b>velocidad</b> en vertical.',8600);
    await espera(9200);
    fija({escena:'autopista',B:0.1e9,Tc:25e-6,N:64}); ponVista('carretera');
    showToast('Paso 2 · Con B = 0,1 GHz la celda de distancia mide 1,5 m: el coche y la moto, a 1 m uno del otro, forman <b>una sola mancha</b>.',8200);
    await espera(8800);
    fija({B:0.5e9});
    showToast('Paso 3 · Con B = 0,5 GHz, ΔR = 30 cm: <b>dos detecciones</b>. Subir B afina la distancia, pero acorta el alcance R<sub>máx</sub>.',8200);
    await espera(8800);
    fija({escena:'ciudad',B:1.0e9,Tc:80e-6,N:64}); ponVista('sensor');
    showToast('Paso 4 · Con T<sub>c</sub> largo, v<sub>máx</sub> baja a ±12 m/s: el coche, que se acerca a 13 m/s, <b>se pliega</b> y el radar lo mide con otra velocidad.',8600);
    await espera(9200);
    fija({escena:'ciclista',B:0.5e9,Tc:24e-6,N:256,win:'rect'}); ponVista('carretera');
    showToast('Paso 5 · La ventana <b>rectangular</b> deja lóbulos laterales: aparecen ecos falsos junto al camión. Con la de <b>Hann</b> desaparecen, a cambio de perder 1,8 dB de señal.',8600);
    await espera(8800);
    fija({win:'hann'});
    await espera(4200);
  } finally {
    Object.assign(EST,prev); EST.autoRunning=false; hud.style.pointerEvents='';
    pintaHUD(); marcaSucio(); pintaDockFijo(); ponVista(prev.vista); pintaBarras();
  }
}

/* ===================== 19. SONIDO (sintetizado) =====================
   Un tic corto cuando el radar fija un objetivo nuevo y los tonos de acierto/fallo. */
const sonido=(function(){
  let ctx=null,on=true,master=null,ult=0;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination); }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); ult=f; }
  return {init,
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }, get freq(){ return ult; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});


/* ===================== 20. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.max(Math.min(devicePixelRatio,alta?2:1.5),Math.min(devicePixelRatio,1.5)>1?1.25:1));
  const ms=alta?2048:1024; if(LUZ.sol.shadow.mapSize.x!==ms){ LUZ.sol.shadow.mapSize.set(ms,ms); if(LUZ.sol.shadow.map){ LUZ.sol.shadow.map.dispose(); LUZ.sol.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); ponVista(EST.vista,0.001); centraEnHueco(); RAD_VER++; pintaDockFijo();
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 21. EL LAZO: UN SOLO RELOJ =====================
   El ciclo de radar se recalcula cuando algo cambia (mando, escena) y, con ruido nuevo, ~2 veces por segundo; la
   escena y el dock leen del mismo ciclo. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  const ahora=performance.now();
  if(RAD.sucio||(!EST.pausa&&ahora-RAD.tUlt>650)){ if(!RAD.sucio) RAD.semilla=(RAD.semilla+1)|0; recalculaRadar(); RAD_VER++; }
  aplicaEscena(dt);
  pasaCam(dt);
  if(t-tDock>0.066){ tDock=t; pintaDock(); }
  if(t-tLienzo>0.05&&seVe(el('panel'))){ tLienzo=t; pintaMp(); pintaSp(); pintaBt(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos();
}

/* ===================== 22. ARRANQUE ===================== */
disposicion();
aplicaCalidad();
recalculaRadar(); RAD_VER++;
pintaHUD();
aplicaEscena(0);
pintaBarras();
ponVista('sensor',0.001);
centraEnHueco();
pintaDockFijo();
cuadro();
if(innerWidth>=640) setTimeout(()=>showToast('Un radar de 77 GHz emite <b>chirps</b> y mide distancia y velocidad con dos FFT. Cambia B, T<sub>c</sub> y N, o pulsa <b>Recorrido guiado</b>. '+(matchMedia('(hover: hover)').matches?'Pasa el ratón por':'Toca')+' el módulo o un objetivo.',6200),700);

  ventana:(k)=>ventanaReto(ESCENARIOS[k]),
  evalua:(k,cfg)=>{ const e=evaluaConfig(Object.assign({win:'hann'},cfg),ESCENARIOS[k]); return {ok:e.ok,criterios:e.criterios.map(c=>[c.k,c.ok])}; },
  soluciona:()=>{ const esc=GUIA.r2.esc; for(const B of [0.3,0.5,0.8,1.0,1.5,2.0]) for(const Tc of [16,20,24,30,40,50,60]) for(const N of [64,128,256]){ const c={B:B*1e9,Tc:Tc*1e-6,N,win:'hann'}; if(evaluaConfig(c,esc).ok){ Object.assign(GUIA.r2.cfg,c); marcaSucio(); pintaHUD(); return {B,Tc,N}; } } return null; },
});
