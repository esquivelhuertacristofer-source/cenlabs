<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Radar FMCW de 77 GHz: Distancia y Velocidad con FFT — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#0A1C30;--panel:rgba(9,19,32,.86);--line:#1E3550;--ink:#EAF4F1;
    --dim:#93AFC9;--accent:#2EC4B6;--accent2:#7EE8DD;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cF:#7EE8DD;--cR:#FFB347;--cE:#FF4D5A;--cG:#C8D6D2;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#14202e;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#182c40}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#03221f;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#03221f;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#4fd8cb}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#03221f}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#7CC4FF;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f87a0;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f90a8;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#03221f}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .escs{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
  .esc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px;font-size:11.5px;line-height:1.35;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);color:#c4d3e6}
  .esc .rs{font-weight:700;font-size:11px}.esc .rs.ok{color:var(--good)}.esc .rs.mal{color:#ff9a9a}
  .esc .pista{font-size:10.5px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#09121c;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(30,53,80,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,53,80,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f87a0}
  .dk-tit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#a3bcd6;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);min-height:0}
  .dk-g.mp{flex:1.9 1 0;min-height:120px;cursor:crosshair}
  .dk-g.sp{flex:1.05 1 0;min-height:70px}
  .dk-g.bt{flex:0.95 1 0;min-height:64px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c6da;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#14202e;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfdcec;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,18,30,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,18,30,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d3e6}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,18,30,.92);border:1px solid rgba(124,196,255,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,18,30,.84);border:1px solid rgba(124,196,255,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:auto auto auto 1fr auto 1fr;column-gap:10px;row-gap:4px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3;grid-row:1}
  body.estrecho.ancho.t-panel .panel>.dk-fig{grid-column:1/3;grid-row:2;grid-template-columns:repeat(6,1fr)}
  body.estrecho.ancho.t-panel .panel>.t-mp{grid-column:1;grid-row:3}
  body.estrecho.ancho.t-panel .panel>.dk-g.mp{grid-column:1;grid-row:4/7;min-height:0}
  body.estrecho.ancho.t-panel .panel>.dk-ley{display:none}
  body.estrecho.ancho.t-panel .panel>.t-sp{grid-column:2;grid-row:3}
  body.estrecho.ancho.t-panel .panel>.dk-g.sp{grid-column:2;grid-row:4;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-bt{grid-column:2;grid-row:5}
  body.estrecho.ancho.t-panel .panel>.dk-g.bt{grid-column:2;grid-row:6;min-height:0}
  body.estrecho.ancho.t-panel .panel>.dk-aviso{display:none}
  body.estrecho .hud details>.cuerpo{max-height:24vh}
  body.estrecho.ancho.t-hud .hud{display:grid;grid-template-columns:1fr 1.05fr;column-gap:14px;row-gap:7px;align-content:start;grid-auto-flow:row dense}
  body.estrecho.ancho .hud>.hcab,body.estrecho.ancho .hud>.modebar,body.estrecho.ancho .hud>.hdet,body.estrecho.ancho .hud>.pasos{grid-column:1}
  body.estrecho.ancho .hud>.hmandos,body.estrecho.ancho .hud>.retoBox{grid-column:2;grid-row:1/span 4}
  body.estrecho .hdet{flex-direction:row}body.estrecho .hdet>details{flex:1;min-width:0}
  body.estrecho .hdet details[open]{position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 54px);z-index:25;background:rgba(9,19,32,.97)}
  body.movil .lt{display:none} body.movil .tbar .modo,body.movil .tbar .reloj{display:none}
  body.movil .tbar{gap:6px;padding:5px 8px} body.movil .tbar .est{min-width:0}
  body.movil .dk-ley{display:none} body.movil .fg b{font-size:13.5px} body.movil .fg .fl{font-size:9.5px}
  body.movil .dk-g.mp{min-height:132px} body.movil .dk-g.sp{min-height:62px} body.movil .dk-g.bt{min-height:56px}
  body.movil .hud h2{font-size:15.5px} body.movil .hud .intro{font-size:11.8px;line-height:1.42}
  body.estrecho .hud{overflow-y:auto}
  body.estrecho .vbar [data-t="rot"],body.estrecho .vbar .sep.s1{display:none}
  body.estrecho.ancho .vbar{top:60px}
  body.movil .vbar{flex-wrap:nowrap;gap:3px;padding:3px 4px;top:54px} body.movil .vbar .sep{display:none} body.movil .vbar .b.sm{padding:5px 7px;font-size:11px}
  body.movil .vbar .lg{display:none}
  body.movil .tbar .lento{display:none}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   LAB — RADAR FMCW DE 77 GHz: DISTANCIA Y VELOCIDAD CON FFT
   (Autotrónica · mecanica-143)

   Un módulo de radar de automoción en corte (radomo, placa con las antenas
   TX y RX, chip de 77 GHz y disipador) delante de una carretera con un coche,
   un camión y un peatón. Emite chirps lineales de ancho de banda B y duración
   T_c; mezcla cada eco con la señal emitida y la FFT de rango (dentro del
   chirp) y la FFT de Doppler (entre chirps) dan el mapa rango–Doppler. Un CFAR
   de celda promediada decide qué es un objetivo.

   Todo sale de un solo modelo: el bloque de física (FFT propia, ecuación del
   radar, CA-CFAR, criterio de resolución) que un script de Node extrae TAL CUAL
   y verifica contra la DFT directa y las fórmulas cerradas.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO=' ';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }

/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos
   marcas— y lo prueba: lo que se prueba es lo que corre.

   Un radar FMCW de 77 GHz emite un chirp lineal de ancho de banda B y duración
   T_c (pendiente S = B/T_c). El eco, retrasado τ = 2R/c, se mezcla con la señal
   emitida y queda un tono de batido f_b = S·τ = 2·S·R/c (más el corrimiento
   Doppler f_D = 2v/λ). Se repite N veces (N chirps): la FFT de rango (rápida,
   dentro del chirp) da la distancia; la FFT de Doppler (lenta, entre chirps)
   da la velocidad por el avance de fase Δφ = 4π·v·T_c/λ. Sobre el mapa rango–
   Doppler un CFAR de celda promediada (CA-CFAR) decide qué es objetivo.
   La FFT es propia (radix-2) y se prueba contra la DFT directa.
   Convención: v > 0 = el objetivo SE ALEJA; v < 0 = se acerca. */

/* FISICA:INICIO */
const DOSPI=2*Math.PI;
const C0=299792458, KB=1.380649e-23;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ---------- 1.1 El sistema ----------
   Valores didácticos de un radar de 77 GHz de largo alcance: fs fija del ADC (complejo I/Q), memoria
   de muestras del procesador, potencia, ganancia de antena y figura de ruido típicas de libro. */
const RADAR={
  f0:77e9,            // portadora (Hz)
  fs:20e6,            // frecuencia de muestreo del ADC I/Q (Hz): FIJA del sistema
  mem:131072,         // muestras complejas que caben en la memoria (2^17)
  tCicloMax:8e-3,     // un ciclo de medida (N·T_c) no puede pasar de 8 ms (125 Hz de actualización)
  Pt_dBm:10, Gant_dB:20, F_dB:12, T0:290,   // potencia emitida, ganancia de cada antena (TX y RX), figura de ruido, temperatura
  Pfa:1e-6,           // probabilidad de falsa alarma de diseño por celda
  alcanceDR:1.0       // el control de crucero pide una celda de distancia de 1 m o mejor
};
const LAM=C0/RADAR.f0;
const RCS={ coche:10, camion:100, moto:3, peaton:1, ciclista:2 };   // sección eficaz radar σ (m²), valores de libro

function pot2(n){ let p=1; while(p<n) p<<=1; return p; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function gauss(rng){ let u=0; while(u<1e-12) u=rng(); const v=rng(); return Math.sqrt(-2*Math.log(u))*Math.cos(DOSPI*v); }

/* ---------- 1.2 FFT radix-2 propia (en su sitio) y DFT directa ---------- */
const _tw=new Map();
function twiddle(n){ let t=_tw.get(n); if(t) return t; const c=new Float64Array(n/2), s=new Float64Array(n/2);
  for(let k=0;k<n/2;k++){ c[k]=Math.cos(DOSPI*k/n); s[k]=-Math.sin(DOSPI*k/n); } t={c,s}; _tw.set(n,t); return t; }
/** FFT directa X[k] = Σ x[n]·e^{−j2πkn/N} sobre re/im[o .. o+n). n potencia de 2. */
function fft(re,im,n,o=0){
  if(n<2) return;
  for(let i=1,j=0;i<n;i++){ let bit=n>>1; for(;j&bit;bit>>=1) j^=bit; j^=bit;
    if(i<j){ let t=re[o+i]; re[o+i]=re[o+j]; re[o+j]=t; t=im[o+i]; im[o+i]=im[o+j]; im[o+j]=t; } }
  const {c,s}=twiddle(n);
  for(let len=2;len<=n;len<<=1){ const h=len>>1, paso=n/len;
    for(let i=0;i<n;i+=len) for(let k=0;k<h;k++){
      const wr=c[k*paso], wi=s[k*paso], a=o+i+k, b=a+h;
      const xr=re[b]*wr-im[b]*wi, xi=re[b]*wi+im[b]*wr;
      re[b]=re[a]-xr; im[b]=im[a]-xi; re[a]+=xr; im[a]+=xi; } }
}
/** DFT directa O(n²) en doble precisión: la referencia contra la que se prueba la FFT. */
function dft(re,im){
  const n=re.length, R=new Float64Array(n), I=new Float64Array(n);
  for(let k=0;k<n;k++){ let sr=0,si=0; for(let m=0;m<n;m++){ const a=-DOSPI*((k*m)%n)/n, c=Math.cos(a), s=Math.sin(a); sr+=re[m]*c-im[m]*s; si+=re[m]*s+im[m]*c; } R[k]=sr; I[k]=si; }
  return {re:R,im:I};
}

/* ---------- 1.3 Ventanas ----------
   Hann periódica w[n] = ½ − ½·cos(2πn/L): su DTFT es combinación de tres núcleos de Dirichlet, así que la
   respuesta |W(δ)|/|W(0)| a δ bins del centro se evalúa en forma cerrada (y se prueba contra la suma directa). */
function ventana(tipo,n){ const w=new Float64Array(n); for(let i=0;i<n;i++) w[i]=tipo==='hann'?0.5-0.5*Math.cos(DOSPI*i/n):1; return w; }
function _D(d,L){   // núcleo de Dirichlet complejo Σ_{n<L} e^{−j2πdn/L} = e^{−jπd(L−1)/L}·sen(πd)/sen(πd/L)
  const den=Math.sin(Math.PI*d/L); const mag=Math.abs(den)<1e-12?L:Math.sin(Math.PI*d)/den;   // sólo d = 0 (|d| < L) anula el denominador
  const ph=-Math.PI*d*(L-1)/L; return [mag*Math.cos(ph),mag*Math.sin(ph)]; }
function respuestaVentana(tipo,L,delta){
  if(tipo!=='hann'){ const [a,b]=_D(delta,L); return Math.hypot(a,b)/L; }
  const d0=_D(delta,L), d1=_D(delta-1,L), d2=_D(delta+1,L);
  const re=0.5*d0[0]-0.25*d1[0]-0.25*d2[0], im=0.5*d0[1]-0.25*d1[1]-0.25*d2[1];
  return Math.hypot(re,im)/(0.5*L);
}
const _sv=new Map();
function sumasVentana(tipo,L){ const k=tipo+L; let r=_sv.get(k); if(r) return r; const w=ventana(tipo,L); let s=0,s2=0; for(let i=0;i<L;i++){ s+=w[i]; s2+=w[i]*w[i]; } r={suma:s,suma2:s2,neff:s*s/s2}; _sv.set(k,r); return r; }

/* ---------- 1.4 Parámetros derivados de la configuración {B, Tc, N, win} ---------- */
function derivados(cfg,R=RADAR){
  const {B,Tc,N}=cfg, S=B/Tc, Ns=Math.round(R.fs*Tc), Nr=pot2(Ns);
  return { S, Ns, Nr, N, dR:C0/(2*B), Rmax:R.fs*C0/(2*S), vmax:LAM/(4*Tc), dv:LAM/(2*N*Tc), prf:1/Tc,
           Tciclo:N*Tc, mem:Ns*N, memOk:Ns*N<=R.mem, cicloOk:N*Tc<=R.tCicloMax+1e-12 };
}
const fBatido=(S,Rm)=>2*S*Rm/C0;            // f_b = 2·S·R/c
const fDoppler=v=>2*v/LAM;                  // f_D = 2v/λ
/** Distancia a partir de la frecuencia de pico, quitando el acoplamiento rango–Doppler (sesgo c·f_D/(2S)). */
const rangoDePico=(S,fpico,fD)=>C0*(fpico-fD)/(2*S);

/* ---------- 1.5 Ecuación del radar y relación señal–ruido ---------- */
const dB=x=>10*Math.log10(x), deDB=x=>Math.pow(10,x/10);
/** Potencia recibida: P_r = P_t·G²·λ²·σ / ((4π)³·R⁴)  (W) */
function ecuacionRadar(sigma,Rm,R=RADAR){ return deDB(R.Pt_dBm-30)*Math.pow(deDB(R.Gant_dB),2)*LAM*LAM*sigma/(Math.pow(4*Math.PI,3)*Math.pow(Rm,4)); }
/** Potencia de ruido en el ADC: k·T0·F·f_s (W) */
const potRuido=(R=RADAR)=>KB*R.T0*deDB(R.F_dB)*R.fs;
/** SNR por muestra a la entrada del ADC (lineal). */
const snrMuestra=(sigma,Rm,R=RADAR)=>ecuacionRadar(sigma,Rm,R)/potRuido(R);
/** SNR del pico tras las dos FFT: la ganancia coherente es N_eff,rango · N_eff,Doppler = [(Σw)²/Σw²]. */
function snrProcesada(sigma,Rm,cfg,R=RADAR){
  const d=derivados(cfg,R);
  return snrMuestra(sigma,Rm,R)*sumasVentana(cfg.win,d.Ns).neff*sumasVentana(cfg.win,cfg.N).neff;
}
/** Alcance al que la SNR procesada cae a snrMinDb (R ∝ σ^¼). */
function alcanceDeteccion(sigma,snrMinDb,cfg,R=RADAR){
  const g=snrProcesada(sigma,1,cfg,R); return Math.pow(g/deDB(snrMinDb),0.25); }

/* ---------- 1.6 La señal de batido (cubo ADC) ----------
   Para el chirp m el objetivo está en R_m = R + v·(m − N/2)·T_c  (la distancia que se da es la del centro del
   ciclo). Su tono de batido es f_b = 2·S·R_m/c + f_D (el corrimiento Doppler dentro del chirp es el acoplamiento
   rango–Doppler) y su fase inicial 4π·R_m/λ. Un eco con f_b fuera de [0, f_s) lo corta el filtro anti-aliasing. */
function visibleEnADC(cfg,o,R=RADAR){ const S=cfg.B/cfg.Tc, f=fBatido(S,o.R)+fDoppler(o.v); return f>0&&f<R.fs*0.999; }
function generaCubo(cfg,objs,semilla=1,opts={},R=RADAR){
  const {B,Tc,N}=cfg, S=B/Tc, Ns=Math.round(R.fs*Tc), rng=mulberry32(semilla>>>0);
  const re=new Float64Array(N*Ns), im=new Float64Array(N*Ns);
  if(!opts.sinRuido){ const sg=Math.sqrt(0.5); for(let i=0;i<re.length;i++){ re[i]=sg*gauss(rng); im[i]=sg*gauss(rng); } }
  for(const o of objs){
    if(!visibleEnADC(cfg,o,R)) continue;
    const A=opts.amp!==undefined?opts.amp:Math.sqrt(snrMuestra(o.sigma,o.R,R)), fD=fDoppler(o.v);
    for(let m=0;m<N;m++){
      const Rm=o.R+o.v*(m-N/2)*Tc, fb=fBatido(S,Rm)+fD, ph0=DOSPI*2*Rm/LAM+(o.fase||0), w=DOSPI*fb/R.fs;
      const cw=Math.cos(w), sw=Math.sin(w); let pr=Math.cos(ph0), pi=Math.sin(ph0); const base=m*Ns;
      for(let n=0;n<Ns;n++){ re[base+n]+=A*pr; im[base+n]+=A*pi;
        const t=pr*cw-pi*sw; pi=pr*sw+pi*cw; pr=t; if((n&255)===255){ const k=1/Math.hypot(pr,pi); pr*=k; pi*=k; } }
    }
  }
  return {re,im,Ns,N};
}

/* ---------- 1.7 Mapa rango–Doppler: FFT de rango, FFT de Doppler ---------- */
function mapaRD(cfg,cubo){
  const {Ns,N}=cubo, Nr=pot2(Ns), wr=ventana(cfg.win,Ns), wd=ventana(cfg.win,N);
  const RE=new Float64Array(N*Nr), IM=new Float64Array(N*Nr);
  for(let m=0;m<N;m++){ const b=m*Ns, o=m*Nr; for(let n=0;n<Ns;n++){ RE[o+n]=cubo.re[b+n]*wr[n]; IM[o+n]=cubo.im[b+n]*wr[n]; } fft(RE,IM,Nr,o); }
  const P=new Float32Array(N*Nr), cr=new Float64Array(N), ci=new Float64Array(N);
  for(let k=0;k<Nr;k++){
    for(let m=0;m<N;m++){ cr[m]=RE[m*Nr+k]*wd[m]; ci[m]=IM[m*Nr+k]*wd[m]; }
    fft(cr,ci,N);
    for(let kd=0;kd<N;kd++) P[((kd+(N>>1))%N)*Nr+k]=cr[kd]*cr[kd]+ci[kd]*ci[kd];   // fftshift: la fila N/2 es Doppler 0
  }
  return {P,Nr,N,Ns};
}

/* ---------- 1.8 CA-CFAR bidimensional ----------
   Para cada celda se promedian las celdas de referencia (caja exterior menos caja de guarda) y el umbral es
   α·media con α = n·(P_fa^(−1/n) − 1) (n celdas de referencia, potencia exponencial). La guarda crece con el
   relleno de ceros de la FFT de rango, porque el lóbulo principal de la ventana ocupa más bins. */
function cfarGeom(cfg){ const d=derivados(cfg), pad=d.Nr/d.Ns;
  return { gR:Math.ceil(2*pad)+1, rR:Math.ceil(5*pad)+1, gD:2, rD:3 }; }
const alfaCFAR=(n,Pfa)=>n*(Math.pow(Pfa,-1/n)-1);
function preparaCFAR(mapa,cfg,Pfa=RADAR.Pfa){
  const {P,Nr,N}=mapa, g=cfarGeom(cfg), pref=new Float64Array(N*(Nr+1)), cacheA=new Map();
  for(let r=0;r<N;r++){ let s=0; pref[r*(Nr+1)]=0; for(let k=0;k<Nr;k++){ s+=P[r*Nr+k]; pref[r*(Nr+1)+k+1]=s; } }
  const fila=(r,a,b)=>pref[r*(Nr+1)+b+1]-pref[r*(Nr+1)+a];
  const hD=g.gD+g.rD;
  function umbral(kd,kr){
    const a1=Math.max(0,kr-g.gR-g.rR), b1=Math.min(Nr-1,kr+g.gR+g.rR), a0=Math.max(0,kr-g.gR), b0=Math.min(Nr-1,kr+g.gR);
    let sOut=0, sIn=0;
    for(let dd=-hD;dd<=hD;dd++){ const r=((kd+dd)%N+N)%N; sOut+=fila(r,a1,b1); if(Math.abs(dd)<=g.gD) sIn+=fila(r,a0,b0); }
    const nOut=(b1-a1+1)*(2*hD+1), nIn=(b0-a0+1)*(2*g.gD+1), n=nOut-nIn;
    let al=cacheA.get(n); if(al===undefined){ al=alfaCFAR(n,Pfa); cacheA.set(n,al); }
    return al*(sOut-sIn)/n;
  }
  return {umbral,geom:g,nominal:(2*(g.gR+g.rR)+1)*(2*hD+1)-(2*g.gR+1)*(2*g.gD+1)};
}
/** Celdas por encima del umbral que además son máximos locales 3×3 (Doppler circular). */
function detectaCFAR(mapa,cfg,Pfa=RADAR.Pfa,max=24){
  const {P,Nr,N}=mapa, ctx=preparaCFAR(mapa,cfg,Pfa), det=[]; let sobre=0;
  for(let kd=0;kd<N;kd++) for(let kr=0;kr<Nr;kr++){
    const p=P[kd*Nr+kr]; const u=ctx.umbral(kd,kr); if(!(p>u)) continue; sobre++;
    let esMax=true;
    for(let dd=-1;dd<=1&&esMax;dd++) for(let dk=-1;dk<=1;dk++){ if(!dd&&!dk) continue; const k2=kr+dk; if(k2<0||k2>=Nr) continue;
      if(P[(((kd+dd)%N+N)%N)*Nr+k2]>p){ esMax=false; break; } }
    if(esMax) det.push({kd,kr,pot:p,umbral:u});
  }
  det.sort((a,b)=>b.pot-a.pot);
  return {det:det.slice(0,max),sobre,total:det.length,nominal:ctx.nominal,alfa:alfaCFAR(ctx.nominal,Pfa)};
}
/** Interpolación parabólica del pico en log-potencia (sub-bin). */
function _parab(a,b,c){ const la=Math.log(a+1e-300), lb=Math.log(b+1e-300), lc=Math.log(c+1e-300), d=la-2*lb+lc; return Math.abs(d)<1e-12?0:clamp(0.5*(la-lc)/d,-0.5,0.5); }
/** De una detección (bins) a medidas: distancia (con el sesgo de acoplamiento corregido) y velocidad. */
function mideDeteccion(mapa,cfg,d,R=RADAR){
  const {P,Nr,N}=mapa, S=cfg.B/cfg.Tc, kd=d.kd, kr=d.kr, g=(r,k)=>P[((r%N+N)%N)*Nr+clamp(k,0,Nr-1)];
  const dr=_parab(g(kd,kr-1),g(kd,kr),g(kd,kr+1)), dd=_parab(g(kd-1,kr),g(kd,kr),g(kd+1,kr));
  const fpico=(kr+dr)*R.fs/Nr, fD=((kd+dd)-N/2)/(N*cfg.Tc);

/* ---------- 1.9 Resolución: ¿se distinguen dos objetivos? ----------
   Criterio de Rayleigh sobre la POTENCIA (los dos ecos tienen fases distintas, y promediando la fase
   los términos cruzados se anulan): P(t) = P_a·W_r²·W_d² + P_b·W_r²·W_d², sobre la recta que une los dos picos
   del plano rango–Doppler. Se distinguen si entre ellos hay un valle de al menos 0,5 dB. Con el mismo código
   se cuenta el enmascaramiento: un eco débil junto a uno muy fuerte queda en el hombro de su lóbulo.
   Separación en bins: Δbins_rango = ΔR/δR + Δv/(2·v_max) (el segundo término es el acoplamiento) y
   Δbins_Doppler = Δv/δv. */
function resueltos(cfg,a,b,R=RADAR,minDB=0.5){
  const d=derivados(cfg,R);
  const xr=Math.abs((a.R-b.R)/d.dR+(b.v-a.v)/(2*d.vmax)), yd=Math.abs((a.v-b.v)/d.dv);
  const pa=snrProcesada(a.sigma,a.R,cfg,R), pb=snrProcesada(b.sigma,b.R,cfg,R);
  const fuerte=pa>=pb?{p:pa}:{p:pb}, debil=pa>=pb?{p:pb}:{p:pa};
  const W=(L,x)=>{ const w=respuestaVentana(cfg.win,L,x); return w*w; };
  const NT=420, t1=1.45, P=new Float64Array(NT+1);
  for(let i=0;i<=NT;i++){ const t=t1*i/NT;
    P[i]=fuerte.p*W(d.Ns,t*xr)*W(cfg.N,t*yd)+debil.p*W(d.Ns,(t-1)*xr)*W(cfg.N,(t-1)*yd); }
  // primer mínimo local interior entre los dos picos
  let im=-1; const iw=Math.round(NT/t1);
  for(let i=2;i<iw;i++) if(P[i]<P[i-1]&&P[i]<=P[i+1]){ im=i; break; }
  if(im<0) return {resuelto:false,xr,yd,valleDB:0};
  let izq=0; for(let i=0;i<=im;i++) izq=Math.max(izq,P[i]);
  let der=0; for(let i=im;i<=NT;i++) der=Math.max(der,P[i]);
  const prof=Math.min(izq,der)/P[im], valleDB=dB(prof);
  return {resuelto:valleDB>=minDB,xr,yd,valleDB};
}
/** Separación mínima (en bins) a la que dos ecos IGUALES se distinguen, para una ventana y una longitud. */
function resolucionEfectiva(win,L=512){
  let lo=0.3, hi=3;
  const ok=x=>{ const W=t=>{ const w=respuestaVentana(win,L,t); return w*w; }; const NT=300, P=[]; for(let i=0;i<=NT;i++){ const t=1.4*i/NT; P.push(W(t*x)+W((t-1)*x)); }
    let im=-1; for(let i=2;i<Math.round(NT/1.4);i++) if(P[i]<P[i-1]&&P[i]<=P[i+1]){ im=i; break; } if(im<0) return false;
    return dB(Math.min(Math.max(...P.slice(0,im+1)),Math.max(...P.slice(im)))/P[im])>=0.5; };
  for(let i=0;i<40;i++){ const mid=(lo+hi)/2; if(ok(mid)) hi=mid; else lo=mid; } return hi;
}

/* ---------- 1.10 Detección con enmascaramiento del propio CFAR ----------
   Un eco fuerte cercano entra en las celdas de referencia del débil y le sube el umbral (el defecto clásico del
   CA-CFAR). Aquí se calcula, en valor esperado, la potencia de cada celda (ruido = 1, más los dos ecos con la
   respuesta de la ventana a la distancia en bins) y se compara la celda con α·media(referencia). Las posiciones
   en bins son x = R/δR + v/(2·v_max) (rango, con el acoplamiento) e y = v/δv (Doppler). */
function deteccionAnalitica(cfg,objs,R=RADAR){
  const d=derivados(cfg,R), g=cfarGeom(cfg), hD=g.gD+g.rD, pad=d.Nr/d.Ns, n=preparaNominal(cfg), al=alfaCFAR(n,R.Pfa);
  const T=objs.map(o=>({x:o.R/d.dR+o.v/(2*d.vmax), y:o.v/d.dv, p:snrProcesada(o.sigma,o.R,cfg,R)}));
  const w2=(L,x)=>{ const w=respuestaVentana(cfg.win,L,x); return w*w; };
  const pot=(i,dk,dd)=>{ let p=1; for(const t of T) p+=t.p*w2(d.Ns,T[i].x-t.x+dk/pad)*w2(cfg.N,T[i].y-t.y+dd); return p; };
  return T.map((t,i)=>{
    const celda=pot(i,0,0); let suma=0, c=0;
    for(let dd=-hD;dd<=hD;dd++) for(let dk=-(g.gR+g.rR);dk<=g.gR+g.rR;dk++){ if(Math.abs(dd)<=g.gD&&Math.abs(dk)<=g.gR) continue; suma+=pot(i,dk,dd); c++; }
    return { celdaDB:dB(celda), umbralDB:dB(al*suma/c), margenDB:dB(celda)-dB(al*suma/c) };
  });
}

function evaluaConfig(cfg,esc,R=RADAR,perezoso=false){

  const res=(perezoso&&!baratos)?{resuelto:false,xr:0,yd:0,valleDB:0}:resueltos(cfg,a,b,R,VALLE_RETO);
  const det=(perezoso&&!(baratos&&res.resuelto))?[{margenDB:-99},{margenDB:-99}]:deteccionAnalitica(cfg,[a,b],R), margen=Math.min(det[0].margenDB,det[1].margenDB);
  const c=[
    {k:'alcance',  ok:d.Rmax>=1.05*Rfar,   val:d.Rmax,  lim:1.05*Rfar},
    {k:'velocidad',ok:d.vmax>=1.05*vm,     val:d.vmax,  lim:1.05*vm},
    {k:'resolucion',ok:res.resuelto,       val:res.valleDB, lim:VALLE_RETO, xr:res.xr, yd:res.yd},
    {k:'deteccion',ok:margen>=MARGEN_DET, val:margen, lim:MARGEN_DET, snr:snrMin},

function ruidoPeriodico(semilla,periodo){
  const g=(x,y)=>{ x=((x%periodo)+periodo)%periodo; y=((y%periodo)+periodo)%periodo;
    const s=Math.sin(x*127.1+y*311.7+semilla*13.13)*43758.5453; return s-Math.floor(s); };
  return (x,y)=>{ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    return g(xi,yi)*(1-u)*(1-v)+g(xi+1,yi)*u*(1-v)+g(xi,yi+1)*(1-u)*v+g(xi+1,yi+1)*u*v; };
}

function fusiona(grupo){
  grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map();
  grupo.traverse(o=>{ if(!o.isMesh) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(), m=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);
    g.applyMatrix4(m);
    if(!g.attributes.uv){ g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2)); }
    const k=o.material; if(!por.has(k)) por.set(k,[]); por.get(k).push(g); });
  const out=new THREE.Group();
  for(const [mat,gs] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count;
      pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry();
    G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const me=new THREE.Mesh(G,mat); me.castShadow=true; me.receiveShadow=true; out.add(me);
  }

}

function lofteo(secs,seg=28){

    const yc=(s.y0+s.y1)/2, hh=Math.max(1e-3,(s.y1-s.y0)/2), ex=2/(s.n||3);
    for(let k=0;k<seg;k++){
      const th=k/seg*DOSPI_, c=Math.cos(th), sn=Math.sin(th);
      const yy=yc+hh*Math.sign(sn)*Math.pow(Math.abs(sn),ex), f=(yy-s.y0)/(2*hh);
      const zz=Math.max(1e-3,s.w)*(1-(s.tum||0)*f*f)*Math.sign(c)*Math.pow(Math.abs(c),ex);
      pos.push(s.x,yy,zz);
    }
  }
  const cI=pos.length/3; pos.push(secs[0].x,(secs[0].y0+secs[0].y1)/2,0); pos.push(secs[nR-1].x,(secs[nR-1].y0+secs[nR-1].y1)/2,0);
  for(let i=0;i<nR-1;i++) for(let k=0;k<seg;k++){
    const a=i*seg+k, b=i*seg+(k+1)%seg, c2=(i+1)*seg+k, d=(i+1)*seg+(k+1)%seg;
    idx.push(a,c2,b, b,c2,d);
  }
  for(let k=0;k<seg;k++){ idx.push(cI,k,(k+1)%seg); idx.push(cI+1,(nR-1)*seg+(k+1)%seg,(nR-1)*seg+k); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx);
  // el sentido de las caras: si el volumen con signo sale negativo, se invierten
  let vol=0; for(let i=0;i<idx.length;i+=3){ const a=idx[i]*3,b=idx[i+1]*3,c3=idx[i+2]*3;
    vol+=pos[a]*(pos[b+1]*pos[c3+2]-pos[b+2]*pos[c3+1])-pos[a+1]*(pos[b]*pos[c3+2]-pos[b+2]*pos[c3])+pos[a+2]*(pos[b]*pos[c3+1]-pos[b+1]*pos[c3]); }
  if(vol<0) for(let i=0;i<idx.length;i+=3){ const t=idx[i+1]; idx[i+1]=idx[i+2]; idx[i+2]=t; }
  g.setIndex(idx); g.computeVertexNormals(); g.computeBoundingSphere();

const mezcla=(a,b,t)=>a+(b-a)*t, suave=t=>t*t*(3-2*t);

   Sensor AMPLIADO y carretera COMPRIMIDA: el módulo mide ≈ 3 u de ancho y la carretera de 150 m cabe en ≈ 8 u, así que
   ni los tamaños ni las distancias están a escala (se rotula como esquema). El radar mira a +X; el origen es el centro
   de la cara de la placa. Corte: se quita la tapa superior y el lateral +Z de la carcasa y las caras de corte llevan
   rayado a 45°. Orden de las capas, de atrás adelante: fondo con disipador · placa con chip y componentes por detrás ·

/* ===================== 7. EL PARAGOLPES (el coche) =====================
   Un faldón de paragolpes curvado hacia atrás, con la ventana del radomo, y los faros: lo justo para que se lea
   «esto va en la trompa de un coche». Se construye como una malla regular a la que se le quitan las celdas de la ventana. */
const PARAG=new THREE.Group(); PARAG.userData.pieza='paragolpes'; scene.add(PARAG);
(function construyeParagolpes(){
  const W=8.6, H=2.9, nx=72, ny=16, pos=[], idx=[];
  const xf=(z,y)=>0.50-0.048*z*z-0.05*y*y;
  for(let j=0;j<=ny;j++) for(let i=0;i<=nx;i++){ const z=-W/2+W*i/nx, y=-H/2+H*j/ny; pos.push(xf(z,y),y-0.05,z); }
  for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
    const zc=-W/2+W*(i+0.5)/nx, yc=-H/2+H*(j+0.5)/ny;
    if(Math.abs(zc)<1.47&&Math.abs(yc)<1.00) continue;                       // la ventana del radomo
    const a=j*(nx+1)+i, b=a+1, c=a+nx+1, d=c+1; idx.push(a,b,c, b,d,c);
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals();
  // las normales hacia +X (los vértices de la ventana no tienen triángulos: normal +X para que ninguna sea nula)
  const n=g.attributes.normal; for(let i=0;i<n.count;i++) if(n.getX(i)**2+n.getY(i)**2+n.getZ(i)**2<1e-12) n.setXYZ(i,1,0,0); let sx=0; for(let i=0;i<n.count;i++) sx+=n.getX(i); if(sx<0){ for(let i=0;i<n.count;i++) n.setXYZ(i,-n.getX(i),-n.getY(i),-n.getZ(i)); }
  const m=new THREE.Mesh(g,M.paragolpes); m.castShadow=true; m.receiveShadow=true; m.userData.pieza='paragolpes'; PARAG.add(m);
  // faros: bolsa ahusada con el cristal luminoso, siguiendo la curva
  for(const lado of [-1,1]){
    const z=lado*3.55, x=xf(z,0.6)+0.03, rot=Math.atan(2*0.048*Math.abs(z));
    const bolsa=new THREE.Mesh(new THREE.SphereGeometry(1,24,14),M.aluminio); bolsa.scale.set(0.12,0.20,0.55); bolsa.position.set(x-0.02,0.60,z); bolsa.rotation.y=lado*rot; bolsa.userData.pieza='paragolpes'; bolsa.castShadow=true; PARAG.add(bolsa);
    const lente=new THREE.Mesh(new THREE.SphereGeometry(1,24,14),M.faro); lente.scale.set(0.06,0.13,0.46); lente.position.set(x+0.03,0.60,z); lente.rotation.y=lado*rot; lente.userData.pieza='paragolpes'; PARAG.add(lente);
    const drl=caja(0.03,0.035,0.75,M.faro,xf(lado*2.55,0.08)+0.015,0.08,lado*2.55,false); drl.rotation.y=lado*Math.atan(2*0.048*2.55); drl.userData.pieza='paragolpes'; PARAG.add(drl);
  }
})();

/* ===================== 9. LOS OBJETIVOS (modelos de unos 4–12 m, escalados) =====================
   Todos miran a +X (hacia donde se alejan). Cada uno se funde en pocas mallas. */
function lofteoCoche(mat){
  const secs=[], N=34, hl=2.25;
  const yt=perfil1D([[-2.25,0.62],[-2.0,0.80],[-1.3,0.90],[-0.4,0.88],[0.6,0.84],[1.3,0.76],[1.9,0.66],[2.25,0.50]]);
  for(let i=0;i<=N;i++){
    const x=-hl*Math.cos(Math.PI*i/N), u=x/hl, ab=Math.pow(Math.abs(u),4.2);
    const w=0.90*Math.pow(Math.max(0.0004,1-ab),1/4.2), yb=0.30+0.22*Math.pow(Math.min(1,Math.abs(u)),4), y1=Math.max(yb+0.06,yt(x));
    secs.push({x,w:Math.max(0.02,w),y0:yb,y1,n:3.4,tum:0.10});
  }
  return new THREE.Mesh(lofteo(secs,28),mat);
}
function cabinaCoche(){
  const cab=[], cabM=22, x0=-1.2, x1=0.75, yt=perfil1D([[-2.25,0.62],[-1.3,0.90],[-0.4,0.88],[0.6,0.84],[1.3,0.76]]);
  for(let i=0;i<=cabM;i++){ const t=i/cabM, x=mezcla(x0,x1,t), env=Math.pow(Math.sin(Math.PI*Math.pow(t,0.85)),0.55), base=yt(x)-0.03, techo=Math.max(base+0.03,mezcla(yt(x),1.43,env));
    cab.push({x,w:Math.max(0.03,0.80*Math.pow(env,0.35)),y0:base,y1:techo,n:3.0,tum:0.30}); }
  return new THREE.Mesh(lofteo(cab,24),M.cristal);
}

const SEMI=22*Math.PI/180, R_VIS=11.2, V_ONDA=4.2;      // semiapertura del haz, alcance dibujado, velocidad (didáctica) de las ondas
/** El abanico sobre el suelo, con transparencia que se desvanece, aristas hacia el radomo y arcos de alcance. */
function creaAbanico(semi,R,col,aOpac,arcos,alturaApice){
  const N=36, pos=[],colr=[],idx=[];
  pos.push(0,0.012,0); colr.push(1,1,1,aOpac);
  for(let i=0;i<=N;i++){ const a=-semi+2*semi*i/N; pos.push(Math.cos(a)*R,0.012,Math.sin(a)*R); colr.push(1,1,1,0); }
  for(let i=0;i<N;i++) idx.push(0,i+2,i+1);
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('color',new THREE.Float32BufferAttribute(colr,4)); g.setIndex(idx);
  const m=new THREE.MeshBasicMaterial({color:col,vertexColors:true,transparent:true,depthWrite:false,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-5,polygonOffsetUnits:-5,toneMapped:false});
  const sector=new THREE.Mesh(g,m); sector.renderOrder=7; sector.raycast=()=>{}; sector.userData.pieza='haz';
  const lp=[], h=alturaApice;
  for(const s of [-1,1]){ lp.push(0,h,0, Math.cos(semi)*R,0.014,s*Math.sin(semi)*R); }
  for(const r of arcos){ for(let i=0;i<N;i++){ const a0=-semi+2*semi*i/N, a1=-semi+2*semi*(i+1)/N; lp.push(Math.cos(a0)*r,0.016,Math.sin(a0)*r, Math.cos(a1)*r,0.016,Math.sin(a1)*r); } }
  const lg=new THREE.BufferGeometry(); lg.setAttribute('position',new THREE.Float32BufferAttribute(lp,3));
  const lm=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0.55,toneMapped:false,depthWrite:false});
  const lineas=new THREE.LineSegments(lg,lm); lineas.renderOrder=8; lineas.raycast=()=>{}; lineas.userData.pieza='haz';
  const grupo=new THREE.Group(); grupo.add(sector,lineas);
  return {grupo,sector,lineas,mat:m,lmat:lm};
}

function chirpColor(u,c){ // 0..1: azul → cian → verde → amarillo → rojo

/* ===================== 11. EL ESTADO, EL RADAR Y EL RELOJ =====================
   Un solo reloj (SIM.t). El ciclo de medida del radar —cubo de muestras, FFT de rango, FFT de Doppler y CFAR— se
   recalcula cuando cambia un mando y, con ruido nuevo, unas dos veces por segundo: el mapa, el espectro, la señal de
   batido y las columnas holográficas de la escena salen del MISMO ciclo (RAD). Las ondas del 3D son un esquema: su
   color sigue la frecuencia instantánea de un chirp en cámara lenta, no la propagación real. */
const EST={modo:'marcha',escena:'ciudad',B:1.0e9,Tc:40e-6,N:128,win:'hann',vel:1,pausa:REDUCIDO,autoRunning:false,vista:'sensor',verdad:true,rot:false,semilla:1,sel:0};
const SIM={t:0,fase:0,aviso:0,ultimo:-9,aRx:0,aTx:0};
const T_VIS=1.6;                               // duración, en pantalla, de un chirp (cámara lenta)
const ESCENAS_M={
  ciudad:{nombre:'Ciudad',objs:[{nombre:'coche',R:42,v:-13,sigma:RCS.coche,lane:0.95},{nombre:'camión',R:78,v:6,sigma:RCS.camion,lane:-1.35},{nombre:'peatón',R:21,v:-1.5,sigma:RCS.peaton,lane:-2.1}]},
  autopista:{nombre:'Autopista',objs:null,clave:'autopista'},

const hashFase=(o,i)=>((Math.sin((o.R*12.9898+i*78.233)*43758.5453)%1)+1)%1*DOSPI;
const RAD={cfg:null,d:null,objs:[],cubo:null,mapa:null,cf:null,meds:[],umbral:null,ok:false,sinMem:false,semilla:1,sucio:true,tUlt:-9,ms:0};
/** Configuración que corre ahora: la de los mandos, o la que fija el paso del laboratorio guiado. */
function cfgActual(){
  if(EST.modo==='guia'){ const c=guiaCfg(); if(c) return c; }
  return {B:EST.B,Tc:EST.Tc,N:EST.N,win:EST.win};
}
function objetivosActuales(){
  if(EST.modo==='guia'){ const o=guiaObjs(); if(o) return o; }
  const e=ESCENAS_M[EST.escena]; return e.objs||deEscenario(ESCENARIOS[e.clave]);

/** Corre un ciclo completo del radar con la configuración y los objetivos actuales. */
function recalculaRadar(){
  const t0=performance.now(), cfg=cfgActual(), d=derivados(cfg), objs=objetivosActuales();
  RAD.cfg=cfg; RAD.d=d; RAD.objs=objs; RAD.sinMem=!d.memOk; RAD.sucio=false; RAD.tUlt=performance.now();
  if(!d.memOk){ RAD.ok=false; RAD.mapa=null; RAD.cubo=null; RAD.cf=null; RAD.meds=[]; RAD.umbral=null; return; }
  const out=procesaCiclo(cfg,objs.map((o,i)=>({R:o.R,v:o.v,sigma:o.sigma,fase:hashFase(o,i)})),RAD.semilla);
  RAD.cubo=out.cubo; RAD.mapa=out.mapa; RAD.cf=out.cf; RAD.meds=out.meds; RAD.ok=true;
  RAD.umbral=preparaCFAR(out.mapa,cfg,RADAR.Pfa);
  RAD.meds.forEach((m,i)=>{ const dt=out.cf.det[i]; m.pot=dt.pot; m.snrDB=dB(dt.pot/Math.max(1e-9,dt.umbral)*alfaCFAR(RAD.umbral.nominal,RADAR.Pfa)); });
  if(EST.sel>=RAD.meds.length) EST.sel=0;
  RAD.ms=performance.now()-t0;
  if(typeof sincronizaEscena==='function') sincronizaEscena();

const marcaSucio=()=>{ RAD.sucio=true; };

/* ---------- la escena sigue al ciclo ---------- */
const _cc=new THREE.Color();
function lanesDe(objs){ return objs.map((o,i)=>o.lane!==undefined?o.lane:LANES_PAR[i%2]); }
let ESC_CLAVE='';
function sincronizaEscena(){
  const clave=RAD.objs.map(o=>o.nombre+o.R).join('|');
  if(clave!==ESC_CLAVE){ ESC_CLAVE=clave; ponEscenario(RAD.objs.map(o=>({o,lane:o.lane!==undefined?o.lane:0}))); }
  OBJ3D.forEach((t,i)=>{ const o=RAD.objs[i], x=xDeR(o.R); t.grupo.position.set(x,SUELO_Y,t.lane); t.o=o; t.fuerza=clamp((dB(snrProcesada(o.sigma,o.R,RAD.cfg))-10)/40,0.15,1); });
}
function aplicaEscena(dt){
  const reloj=EST.pausa?0:dt*EST.vel;
  SIM.t+=reloj;
  const ciclo=(SIM.t/T_VIS), fase=ciclo-Math.floor(ciclo); SIM.fase=fase;
  // --- antenas: TX con el color del chirp, RX con los ecos que vuelven
  chirpColor(fase,_cc); M_TX.emissive.copy(_cc); M_TX.emissiveIntensity=0.9+0.7*Math.sin(Math.PI*fase);
  M_MMIC.emissiveIntensity=0.12+0.10*Math.sin(SIM.t*3); ANT.led.color.copy(_cc);
  // --- ondas: cada una nace en el radomo, avanza a V_ONDA y se tiñe con la frecuencia del chirp en el instante en que nació
  const span=R_VIS-0.7;
  for(let i=0;i<N_ONDAS;i++){
    const w=ONDAS[i], desfase=i/N_ONDAS, edad=((SIM.t*V_ONDA/span)+desfase)%1, r=0.7+edad*span;
    const emision=(SIM.t-(r-0.7)/V_ONDA)/T_VIS, u=emision-Math.floor(emision);
    const prev=w.r; w.r=r;
    chirpColor(u,_cc); w.cm.color.copy(_cc); w.am.color.copy(_cc);
    const a=Math.pow(1-edad,1.1)*Math.min(1,edad*8);
    w.cm.opacity=0.16*a; w.am.opacity=0.62*a; w.c.scale.setScalar(r); w.a.scale.setScalar(r);
    w.c.visible=w.a.visible=a>0.01;
    // eco: cuando el frente pasa por un objetivo, éste responde
    if(r>=prev||true){ for(const t of OBJ3D){ const dx=t.grupo.position.x-ORIGEN.x, dz=t.grupo.position.z, dist=Math.hypot(dx,dz); if(prev<dist&&r>=dist&&Math.abs(Math.atan2(dz,dx))<SEMI){ t.pingT=SIM.t; SIM.aRx=Math.max(SIM.aRx,0)+0; t.rxT=SIM.t+dist/V_ONDA; } } }
  }
  // pings en los objetivos y su vuelta a las antenas RX
  let rx=0;
  for(const t of OBJ3D){
    const e=SIM.t-t.pingT, k=clamp(e/0.8,0,1);
    t.ping.visible=k>0&&k<1; t.ping.position.set(t.grupo.position.x,SUELO_Y+0.03,t.grupo.position.z);
    t.ping.scale.setScalar((0.25+0.9*k)*Math.max(0.6,t.tipo==='camion'?1.5:1)); t.ping.material.opacity=0.75*t.fuerza*(1-k);
    const er=SIM.t-(t.rxT||-9); if(er>0&&er<0.6) rx+=t.fuerza*Math.pow(1-er/0.6,1.5);
    t.grupo.position.y=SUELO_Y+(EST.pausa?0:0.004*Math.sin(SIM.t*7+t.lane*3));
  }
  M_RX.emissive.set('#ffb347'); M_RX.emissiveIntensity=Math.min(2.2,0.15+1.8*rx);
  // --- columnas holográficas en el sitio donde el radar cree que está cada objetivo
  FANTASMAS.forEach((f,i)=>{
    const m=RAD.ok?RAD.meds[i]:null; f.g.visible=!!m&&m.R>0.5&&m.R<190;
    if(!f.g.visible) return;
    let cerca=null, dm=1e9; OBJ3D.forEach(t=>{ const dd=Math.abs(t.o.R-m.R); if(dd<dm){ dm=dd; cerca=t; } });
    const z=cerca?cerca.lane:0, esc=cerca?(cerca.tipo==='camion'?[1.4,0.62,0.42]:(cerca.tipo==='peaton'?[0.22,0.30,0.22]:[0.6,0.36,0.34])):[0.5,0.3,0.3];
    f.g.position.set(xDeR(m.R),SUELO_Y+esc[1]/2+0.02,z); f.g.scale.set(esc[0]*1.1,esc[1]*1.2,esc[2]*1.4);
    const sel=i===EST.sel; _cc.set(sel?'#ffffff':'#7cf2c0'); f.lm.color.copy(_cc); f.fm.color.copy(_cc);
    f.fm.opacity=0.10+0.05*Math.sin(SIM.t*6+i);
  });
}

/* ===================== 12. CÁMARAS =====================
   La cámara se aleja lo justo para que la caja del objeto (ancho × alto en unidades) quepa en el hueco que dejan la
   guía y el dock, y la proyección se desplaza para centrarla en él. */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}
/** Cada vista: dirección de la cámara desde el ancla, ancla, y la caja (ancho × alto, en u) que debe caber. */
const VISTAS={
  sensor:{dir:V3(0.62,0.34,0.70),anc:V3(1.55,-0.30,0.35),toff:V3(0,0,0),obj:()=>innerWidth<640?{w:3.3,h:2.8}:{w:4.4,h:3.5},fov:34},
  carretera:{dir:V3(0.18,0.46,0.87),anc:V3(5.0,-0.85,0),toff:V3(0,0,0),obj:()=>({w:13.4,h:5.4}),fov:34},
  cenit:{dir:V3(0.02,1,0.32),anc:V3(5.2,-1.0,0),toff:V3(0,0,0),obj:()=>({w:13.0,h:9.0}),fov:34},
};
const CAM={off:V3(6,3,5),toff:V3(0,0,0),auto:true,previo:null,k:1,dur:1};
function fovVista(v){ return innerWidth<innerHeight*0.9?48:VISTAS[v].fov; }
function distanciaFit(w,h,fov){
  const Hu=huecoLibre(), W=innerWidth, Hh=innerHeight, tv=Math.tan(fov*Math.PI/360), th=tv*(W/Hh);

/* ===================== 14. EL DOCK (derecha): cifras y gráficas DOM ===================== */
const FUENTE="'Outfit',system-ui,sans-serif";
function lienzo(id){ const box=el(id), c=box.querySelector('canvas'); return {box,c,ctx:c.getContext('2d'),w:0,h:0,dpr:1}; }
function abre(L){ const r=L.box.getBoundingClientRect(), dpr=Math.min(3,window.devicePixelRatio||1);
  const w=Math.max(20,Math.round(r.width)), h=Math.max(20,Math.round(r.height));

function txt(x,t,px,py,col,size,align,peso){ x.fillStyle=col; x.font=(peso||'600')+' '+(size||11)+'px '+FUENTE; x.textAlign=align||'left'; x.textBaseline='alphabetic'; x.fillText(t,px,py); }

const LMP=lienzo('gMp'), LSP=lienzo('gSp'), LBT=lienzo('gBt');
const sinDatos=(x,Wd,Hd,t)=>{ txt(x,t||'—',Wd/2,Hd/2+4,'#6f87a0',t?11.5:14,'center','500'); };
/** Lo que el dock NO debe enseñar todavía. */
const ocultaF=()=>EST.modo==='guia'&&GUIA.paso==='predice';                 // la frecuencia de batido mientras se pide calcularla
const ocultaVerdad=()=>EST.modo==='guia'&&(GUIA.paso==='decide'&&!(GUIA.r2&&GUIA.r2.validado)||GUIA.paso==='diag'&&!GUIA.dxOk||GUIA.paso==='predice')||!EST.verdad;
const PASOS_NICE=[1,2,5,10,20,25,50,100,200,500];
const nice=(max,n)=>{ for(const p of PASOS_NICE) if(max/p<=n) return p; return 1000; };
/* paleta del mapa: del azul casi negro al blanco cálido (potencia relativa al ruido) */
const LUT=(function(){
  const st=[[0,5,9,20],[0.18,20,26,92],[0.38,98,31,122],[0.58,200,50,90],[0.78,249,140,43],[1,255,243,176]], L=new Uint8ClampedArray(256*3);
  for(let i=0;i<256;i++){ const u=i/255; let k=1; while(k<st.length-1&&u>st[k][0]) k++; const a=st[k-1], b=st[k], t=(u-a[0])/(b[0]-a[0]);
    for(let c=0;c<3;c++) L[i*3+c]=a[c+1]+(b[c+1]-a[c+1])*t; }
  return L; })();
/** Mediana (aproximada) de la potencia del mapa = nivel de ruido. */
function nivelRuido(P){ const n=P.length, paso=Math.max(1,Math.floor(n/4000)), v=[]; for(let i=0;i<n;i+=paso) v.push(P[i]); v.sort((a,b)=>a-b); return v[v.length>>1]/Math.LN2; }
const MP={ver:-1,w:0,h:0,img:null,piso:0,tope:0};
let RAD_VER=0;
function geomMapa(){ const Wd=LMP.w, Hd=LMP.h; return {X0:30,X1:Wd-5,Y0:6,Y1:Hd-15}; }
function maxArr(a){ let m=-Infinity; for(let i=0;i<a.length;i++) if(a[i]>m) m=a[i]; return m; }
function construyeImagenMapa(){
  const g=geomMapa(), dpr=LMP.dpr, pw=Math.max(8,Math.round((g.X1-g.X0)*dpr)), ph=Math.max(8,Math.round((g.Y1-g.Y0)*dpr)), {P,Nr,N}=RAD.mapa;
  const buf=new Float32Array(pw*ph).fill(0);
  for(let kd=0;kd<N;kd++){ const py=Math.min(ph-1,Math.floor((N-1-kd)/N*ph)); for(let kr=0;kr<Nr;kr++){ const px=Math.min(pw-1,Math.floor(kr/Nr*pw)), v=P[kd*Nr+kr], i=py*pw+px; if(v>buf[i]) buf[i]=v; } }
  // un eco es un punto de una celda: se ensancha un par de píxeles para que se vea (sólo el dibujo; las detecciones salen del mapa)
  const rad=Math.max(1,Math.round(1.6*dpr)), grueso=new Float32Array(buf);
  for(let y=0;y<ph;y++) for(let x2=0;x2<pw;x2++){ const v=buf[y*pw+x2]; if(v<=0) continue; for(let dy=-rad;dy<=rad;dy++) for(let dx=-rad;dx<=rad;dx++){ if(dx*dx+dy*dy>rad*rad+1) continue; const yy=y+dy, xx=x2+dx; if(yy<0||yy>=ph||xx<0||xx>=pw) continue; const j=yy*pw+xx; if(v>grueso[j]) grueso[j]=v; } }
  const ruido=nivelRuido(P), piso=dB(ruido), tope=Math.max(piso+28,dB(maxArr(buf)));
  const im=new ImageData(pw,ph);
  for(let i=0;i<pw*ph;i++){ const u=clamp((dB(Math.max(grueso[i],1e-12))-piso)/(tope-piso),0,1), k=Math.round(u*255)*3; im.data[i*4]=LUT[k]; im.data[i*4+1]=LUT[k+1]; im.data[i*4+2]=LUT[k+2]; im.data[i*4+3]=255; }
  MP.img=document.createElement('canvas'); MP.img.width=pw; MP.img.height=ph; MP.img.getContext('2d').putImageData(im,0,0);

const xRM=(R,g,Rmax)=>g.X0+R/Rmax*(g.X1-g.X0), yVM=(v,g,vmax)=>g.Y1-(v+vmax)/(2*vmax)*(g.Y1-g.Y0);
/* ---- Mapa rango–Doppler ---- */
function pintaMp(){

  if(RAD.sinMem){ sinDatos(x,Wd,Hd,'Sin datos: el ciclo no cabe en la memoria'); return; }
  if(!RAD.mapa){ sinDatos(x,Wd,Hd); return; }
  if(MP.ver!==RAD_VER||MP.w!==LMP.w||MP.h!==LMP.h||MP.dpr!==LMP.dpr) construyeImagenMapa();
  x.imageSmoothingEnabled=true; x.drawImage(MP.img,g.X0,g.Y0,g.X1-g.X0,g.Y1-g.Y0);
  raya(x,g.X0,g.Y1+0.5,g.X1,g.Y1+0.5,'#3d5470'); raya(x,g.X0-0.5,g.Y0,g.X0-0.5,g.Y1,'#3d5470');
  // ejes: distancia (m) y velocidad (m/s)
  const dr=nice(d.Rmax,5); for(let R=0;R<=d.Rmax*0.999;R+=dr){ const px=xRM(R,g,d.Rmax); raya(x,px,g.Y1,px,g.Y1+3,'#3d5470'); txt(x,String(R),px,Hd-3,'#8fa6bf',9.5,R===0?'left':'center','500'); }
  txt(x,'m',g.X1,Hd-3,'#8fa6bf',9.5,'right','600');
  const dv=nice(d.vmax,3); for(let v=-Math.floor(d.vmax/dv)*dv;v<=d.vmax;v+=dv){ const py=yVM(v,g,d.vmax); raya(x,g.X0-3,py,g.X0,py,'#3d5470'); if(v===0) raya(x,g.X0,py,g.X1,py,'rgba(255,255,255,0.16)',1,[2,3]); txt(x,(v>0?'+':v<0?'−':'')+Math.abs(v),g.X0-5,py+3,'#8fa6bf',9.5,'right','500'); }
  txt(x,'m/s',g.X0+3,g.Y0+9,'#cfe0f2',9.5,'left','700');

    x.save(); x.beginPath(); x.rect(g.X0-8,g.Y0-8,g.X1-g.X0+16,g.Y1-g.Y0+16); x.clip();
    for(const o of RAD.objs){ if(o.R>d.Rmax*1.02) continue; const inV=Math.abs(o.v)<=d.vmax; const px=xRM(o.R,g,d.Rmax), py=yVM(clamp(o.v,-d.vmax*0.97,d.vmax*0.97),g,d.vmax);
      x.strokeStyle=inV?'rgba(255,255,255,0.9)':'rgba(255,120,120,0.95)'; x.lineWidth=1.2; x.setLineDash([2.5,2.5]); x.beginPath(); x.arc(px,py,7.5,0,DOSPI); x.stroke(); x.setLineDash([]);
      if(!inV){ const s=o.v>0?-1:1; x.fillStyle='rgba(255,120,120,0.95)'; x.beginPath(); x.moveTo(px,py+s*12); x.lineTo(px-3.5,py+s*7); x.lineTo(px+3.5,py+s*7); x.closePath(); x.fill(); } }

    x.strokeStyle=sel?'#ffffff':'#7cf2c0'; x.lineWidth=sel?1.8:1.3;
    for(const [sx,sy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){ x.beginPath(); x.moveTo(px+sx*s,py+sy*(s-3)); x.lineTo(px+sx*s,py+sy*s); x.lineTo(px+sx*(s-3),py+sy*s); x.stroke(); } });
  const sel=RAD.meds[EST.sel];
  el('t_mp').textContent=sel?`${fN(sel.R,1)} m · ${fN(sel.v,1)} m/s · ${fN(sel.snrDB,0)} dB`:(RAD.cf?'sin detecciones':'');
}
/* ---- Espectro de rango de la fila Doppler seleccionada, con el umbral CFAR ---- */
function pintaSp(){
  const x=abre(LSP), Wd=LSP.w, Hd=LSP.h, d=RAD.d; if(!d) return;
  if(!RAD.mapa){ sinDatos(x,Wd,Hd); return; }
  const {P,Nr,N}=RAD.mapa, sel=RAD.meds[EST.sel], kd=sel?sel.kd:(N>>1);
  const X0=30, X1=Wd-5, Y0=6, Y1=Hd-14, ruido=nivelRuido(P), piso=dB(ruido);
  let pk=-1e9; for(let k=0;k<Nr;k++) pk=Math.max(pk,dB(Math.max(P[kd*Nr+k],1e-12)));
  const lo=piso-4, hi=Math.max(piso+24,pk+3), X=R=>X0+R/d.Rmax*(X1-X0), Y=v=>Y1-(clamp(v,lo,hi)-lo)/(hi-lo)*(Y1-Y0);
  raya(x,X0,Y1+0.5,X1,Y1+0.5,'#3d5470'); raya(x,X0-0.5,Y0,X0-0.5,Y1,'#3d5470');
  const dr=nice(d.Rmax,5); for(let R=0;R<=d.Rmax*0.999;R+=dr){ const px=X(R); raya(x,px,Y1,px,Y1+3,'#3d5470'); txt(x,String(R),px,Hd-2,'#8fa6bf',9.5,R===0?'left':'center','500'); }
  for(let v=Math.ceil(lo/10)*10;v<=hi;v+=10){ raya(x,X0,Y(v),X1,Y(v),'rgba(143,179,200,0.09)'); txt(x,String(Math.round(v)),X0-4,Y(v)+3,'#8fa6bf',9.5,'right','500'); }

  x.beginPath(); x.moveTo(X(0),Y1); const paso=Math.max(1,Math.floor(Nr/((X1-X0)*1.6)));

function pintaBt(){

  const cfg=RAD.cfg, sel=RAD.meds[EST.sel], obj=RAD.objs[0], fpico=sel?sel.fpico:fBatido(d.S,obj.R);

  { const X0=14, X1=wL-6, Y0=8, Y1=Hd-15, T=2.15*cfg.Tc, X=t=>X0+t/T*(X1-X0), Y=f=>Y1-f*(Y1-Y0);
    raya(x,X0,Y1+0.5,X1,Y1+0.5,'#3d5470'); raya(x,X0-0.5,Y0,X0-0.5,Y1,'#3d5470');
    const dt=clamp(fpico/RADAR.fs*0.5,0.06,0.2)*cfg.Tc, h=0.78;      // el retardo del eco está AMPLIADO para que se vea (esquema)
    const traza=(t0,col,w,dash)=>{ x.strokeStyle=col; x.lineWidth=w; x.setLineDash(dash||[]); x.beginPath();
      for(let k=-1;k<=1;k++){ const a=t0+k*cfg.Tc, b=a+cfg.Tc; if(b<=0||a>=T) continue; const ta=Math.max(a,0), tb=Math.min(b,T);
        x.moveTo(X(ta),Y(0.04+h*(ta-a)/cfg.Tc)); x.lineTo(X(tb),Y(0.04+h*(tb-a)/cfg.Tc)); } x.stroke(); x.setLineDash([]); };
    traza(0,'#7EE8DD',1.8); traza(dt,'#FFB347',1.5,[3,2]);
    // f_b: separación horizontal entre la rampa emitida y la del eco, a media altura
    const yy=Y(0.04+h*0.5)+0.5, xa=X(cfg.Tc*0.5), xb=X(cfg.Tc*0.5+dt);
    raya(x,xa,yy,xb,yy,'#ffffff',1.2); txt(x,'τ',(xa+xb)/2,yy-3,'#ffffff',9.5,'center','700');
    txt(x,'f',X0+3,Y0+8,'#cfe0f2',9.5,'left','700'); txt(x,'t',X1-1,Y1-3,'#cfe0f2',9.5,'right','700');
    txt(x,'B',X0+5,Y(0.04+h)+2,'#7EE8DD',9.5,'left','700'); txt(x,'Tc',X(cfg.Tc/2),Hd-3,'#8fa6bf',9.5,'center','600');
    txt(x,'TX',X(cfg.Tc*1.3),Y(0.04+h*0.3)+11,'#7EE8DD',9.5,'left','700'); txt(x,'eco',X(cfg.Tc*1.3)+16,Y(0.04+h*0.3)+11,'#FFB347',9.5,'left','700'); }
  raya(x,wL,6,wL,Hd-6,'rgba(61,84,112,0.6)');
  // derecha: señal de batido en el tiempo (primeros ciclos de la mayor componente)
  { const X0=wL+8, X1=Wd-5, Y0=6, Y1=Hd-15, Ym=(Y0+Y1)/2, nz=Math.max(12,Math.min(RAD.d.Ns,Math.round(5/fpico*RADAR.fs))), tz=nz/RADAR.fs;
    const X=t=>X0+t/tz*(X1-X0);
    raya(x,X0,Y1+0.5,X1,Y1+0.5,'#3d5470'); raya(x,X0,Ym,X1,Ym,'rgba(143,179,200,0.18)');
    // curva limpia (suma de los tonos de los objetivos de esta fila de chirp) y muestras del ADC
    const S=d.S, m=cfg.N>>1; let aSum=0; const tonos=[];
    RAD.objs.forEach((o,i)=>{ if(!visibleEnADC(cfg,o)) return; const A=Math.sqrt(snrMuestra(o.sigma,o.R)), Rm=o.R+o.v*(m-cfg.N/2)*cfg.Tc, fb=fBatido(S,Rm)+fDoppler(o.v); aSum+=A; tonos.push([A,fb,DOSPI*2*Rm/LAM+hashFase(o,i)]); });

    x.strokeStyle='#ffffff'; x.lineWidth=1.5; x.beginPath(); const NP=160;
    for(let i=0;i<=NP;i++){ const t=tz*i/NP; let s=0; for(const [A,fb,ph] of tonos) s+=A*Math.cos(DOSPI*fb*t+ph); const px=X(t), py=Ym-s*esc; if(i) x.lineTo(px,py); else x.moveTo(px,py); } x.stroke();
    x.restore();
    txt(x,fN(tz*1e6,2)+' µs',X1-2,Hd-3,'#8fa6bf',9.5,'right','500'); txt(x,'Re[s(t)]',X0+3,Y0+9,'#cfe0f2',9.5,'left','700');
    const snr=RAD.objs.length?dB(snrMuestra(RAD.objs[Math.min(EST.sel,RAD.objs.length-1)].sigma,RAD.objs[Math.min(EST.sel,RAD.objs.length-1)].R)):0;
    txt(x,'SNR por muestra '+fN(snr,0)+' dB',X0+3,Hd-3,'#FFB347',9.5,'left','600'); }
  el('t_bt').textContent=ocultaF()?'fb = ¿?':'f_b = '+fN(fpico/1e6,2)+' MHz';
}
