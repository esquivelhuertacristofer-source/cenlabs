<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.26, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;
    }
    if(hook)hook(dt,t); controls.update();
    if(bokeh) bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);
    composer.render(); }
  function start(){ if(!raf)loop(); }
  function stop(){ cancelAnimationFrame(raf); raf=null; window.removeEventListener('resize',resize); }

  /* Sonda de escena para las auditorías del 3D. No cambia nada de lo que se ve
     y cuelga de `window.__diag3d`, que ningún laboratorio pisa: así CUALQUIER
     laboratorio construido con este molde se puede auditar —salud(), mira(),
     piezas()— sin tocarle una línea. */
  try { instalaDiag(document.title || location.pathname,
    { escena:scene, camara:camera, controles:controls, renderizador:renderer }); } catch(_){}

  return { THREE, renderer, scene, camera, controls, composer, bloom,
    setAnimate:fn=>hook=fn, start, stop, resize, clock,
    flyTo:(v)=>{ controls.target.copy(v); }, moveTo, setCinematicIdle };
}

function roundedBox(w,h,d,mat,rf=0.08){
  const r=Math.min(w,h,d)*rf;
  const m=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,4,r),mat);
  m.castShadow=m.receiveShadow=true; return m;
}
function pickerFor(scene,camera,dom,onHit){
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(); let down=null;
  dom.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
  dom.addEventListener('pointerup',e=>{
    if(!down)return; const moved=Math.abs(e.clientX-down[0])+Math.abs(e.clientY-down[1])>6; down=null;
    if(moved)return;
    const r=dom.getBoundingClientRect();
    mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(mouse,camera);
    const hits=ray.intersectObjects(scene.children,true);
    onHit(hits[0]||null);
  });
}
function labelSprite(text,color='#ffd166'){

  const c=cvE.getContext('2d');c.fillStyle='rgba(8,11,16,.95)';
  const rr=(x,y,ww,hh,r)=>{c.beginPath();c.moveTo(x+r,y);c.arcTo(x+ww,y,x+ww,y+hh,r);c.arcTo(x+ww,y+hh,x,y+hh,r);c.arcTo(x,y+hh,x,y,r);c.arcTo(x,y,x+ww,y,r);c.closePath();};
  rr(3,3,w-6,90,18);c.fill();

  c.font='bold 36px Outfit, system-ui, sans-serif';c.fillStyle=color;c.textAlign='center';c.textBaseline='middle';c.fillText(text,w/2,48);
  const tx=new THREE.CanvasTexture(cvE);tx.colorSpace=THREE.SRGBColorSpace;

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

function cableTube(pA, pB, mat, radius = 0.028) {

/* ===================== 4. Física — constantes declaradas ===================== */
const T_AMB = 22.0; // °C — ambiente típico de taller (ilustrativo)

// Termopar tipo K
const TC = {
  tTrue: 260.0,   // °C — punto ilustrativo (p.ej. zona de colector de escape)
  sK: 0.041,      // mV/°C — coeficiente de Seebeck PROMEDIO Tipo K cerca de este rango
};
function tcVoltageMv() { return TC.sK * (TC.tTrue - T_AMB); }
function tcIndicated(cjcOn) {
  const vRead = tcVoltageMv();
  return cjcOn ? (vRead / TC.sK) + T_AMB : (vRead / TC.sK);
}

// RTD Pt100
const RTD = {
  r0: 100.0,       // Ω a 0 °C (IEC 60751)
  alpha: 0.003850, // °C⁻¹ — coeficiente medio nominal IEC 60751 (aprox. lineal)
  tTrue: 85.0,     // °C — punto ilustrativo (p.ej. línea de refrigerante/aceite)
  rLead: 0.35,     // Ω por hilo — ilustrativo (≈5 m de cable calibre 22 + contactos)
};
function rtdTrueResistance() { return RTD.r0 * (1 + RTD.alpha * RTD.tTrue); }
function rtdMeasuredResistance(wire4) {
  return wire4 ? rtdTrueResistance() : rtdTrueResistance() + 2 * RTD.rLead;
}
function rtdIndicated(wire4) {
  const r = rtdMeasuredResistance(wire4);
  return (r / RTD.r0 - 1) / RTD.alpha;
}

  tTrueC: 150.0,   // °C — superficie metálica caliente (p.ej. borne/conector de barra colectora)
  epsActual: 0.20, // emisividad real ilustrativa de metal pulido/ligeramente oxidado (rango típico 0.1–0.3)
  epsFactory: 0.95, // emisividad de fábrica típica en pistolas IR de consumo/taller
};
function kelvinOf(c) { return c + 273.15; }
function celsiusOf(k) { return k - 273.15; }
function irIndicatedC(epsSet) {
  const tRealK = kelvinOf(IR.tTrueC);
  const tApparentK = tRealK * Math.pow(IR.epsActual / epsSet, 0.25);
  return celsiusOf(tApparentK);
}

/* ===================== 5. Escenarios y diagnóstico ===================== */
const SCEN_ORDER = ['termopar', 'rtd', 'infrarrojo'];
const SCEN_META = {
  termopar: {
    nombre: 'Termopar Tipo K',
    unidadCruda: 'mV',
    respuesta: 'junta_fria',
    modeLabels: ['CJC desactivada', 'CJC activada'],
  },
  rtd: {
    nombre: 'RTD Pt100',
    unidadCruda: 'Ω',
    respuesta: 'resistencia_cable',
    modeLabels: ['2 hilos', '4 hilos (Kelvin)'],
  },
  infrarrojo: {
    nombre: 'Pistola infrarroja',
    unidadCruda: 'ε config.',
    respuesta: 'emisividad',
    modeLabels: ['Emisividad de fábrica (0.95)', 'Emisividad corregida (0.20)'],
  },
};

const DX_HINT = {
  junta_fria: '✅ Correcto. Sin compensación de junta fría (CJC), el lector interpreta el voltaje como si la unión de referencia estuviera a 0 °C. El error resultante es igual, en magnitud, a la temperatura ambiente de esa unión — no es una falla del termopar.',
  resistencia_cable: '✅ Correcto. En conexión a 2 hilos, la resistencia de los propios cables de extensión se suma a la de la RTD y el lector no tiene forma de separarlas. La conexión a 4 hilos (Kelvin) cancela ese error midiendo tensión sin corriente por los hilos de detección.',
  emisividad: '✅ Correcto. La pistola infrarroja no mide temperatura directamente: infiere la temperatura a partir de la radiación emitida ASUMIENDO una emisividad. Si la superficie es más reflejante (menor ε) que el valor configurado, el instrumento subestima drásticamente la temperatura real.',
  falla: '❌ No es lo más probable. Antes de sospechar de una falla o descalibración del instrumento, siempre compare la lectura contra un método de referencia y revise primero la técnica de medición (compensación, conexión, configuración) — es la causa más común de discrepancias en campo.',
};

/* ===================== 6. Estado ===================== */
let scenarioKey = 'termopar';
let midiendo = false;
let energized = false;
const MODE_STATE = { termopar: false, rtd: false, infrarrojo: false };

function readingFor(key) {
  const m = MODE_STATE[key];
  if (key === 'termopar') {
    return {
      tReal: TC.tTrue,
      signal: tcVoltageMv().toFixed(3) + ' mV',
      tInd: tcIndicated(m),
      modo: SCEN_META.termopar.modeLabels[m ? 1 : 0],
    };
  }
  if (key === 'rtd') {
    return {
      tReal: RTD.tTrue,
      signal: rtdMeasuredResistance(m).toFixed(3) + ' Ω',
      tInd: rtdIndicated(m),
      modo: SCEN_META.rtd.modeLabels[m ? 1 : 0],
    };
  }
  const epsSet = m ? IR.epsActual : IR.epsFactory;
  return {
    tReal: IR.tTrueC,
    signal: 'ε=' + epsSet.toFixed(2) + ' (real=' + IR.epsActual.toFixed(2) + ')',
    tInd: irIndicatedC(epsSet),
    modo: SCEN_META.infrarrojo.modeLabels[m ? 1 : 0],
  };
}

/* ===================== 7. Interacción — picker ===================== */
let selectedName = null;
pickerFor(scene, camera, renderer.domElement, (hit) => {
  /* `pickerFor` entrega la INTERSECCION del rayo, no la malla: `hit.userData`
     no existe y la linea anterior reventaba en cada clic, de modo que ningun
     rotulo de pieza llego nunca a aparecer. Ademas hay que SUBIR por los padres,
     porque las piezas de la biblioteca son grupos y lo que se toca es un hijo. */
  if (!hit) return;
  let o = hit.object;
  while (o && !(o.userData && o.userData.partName)) o = o.parent;
  if (!o) return;
  selectedName = o.userData.partName;
  const desc = HOVER_LABELS[selectedName] || '';
  showToast(desc);
});

function showToast(msg) {
  const t = el('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => t.classList.remove('show'), 4200);
}

function el(id) { return document.getElementById(id); }
function tf(n, d = 2) { return Number.isFinite(n) ? n.toFixed(d) : '—'; }

/* ===================== 8. HUD y panel (estático, se llena una vez) ===================== */
el('hud').innerHTML = `

    <div class="fl">Relación graybody simplificada entre radiación emitida, emisividad y temperatura, y el riesgo real y documentado de subestimar la temperatura de superficies metálicas brillantes si no se corrige la emisividad.</div>

el('panel').innerHTML = `

/* ===================== 9. Render de pantallas canvas ===================== */
function drawScreen(ctx, canvas, lines) {
  ctx.fillStyle = '#050706';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#39e6b0';
  ctx.font = '700 26px monospace';
  ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, 10, 8 + i * 32));
}

function updateScreens() {
  if (!midiendo) {
    drawScreen(scrCtxTC, scrTexTC, ['T ---.- °C', 'V --.-- mV']);
    drawScreen(scrCtxRTD, scrTexRTD, ['T ---.- °C', 'R ---.- Ω']);
    drawScreen(scrCtxIR, scrTexIR, ['---.- °C']);
    scrTexObjTC.needsUpdate = true; scrTexObjRTD.needsUpdate = true; scrTexObjIR.needsUpdate = true;
    return;
  }
  const rTC = readingFor('termopar');
  drawScreen(scrCtxTC, scrTexTC, ['T ' + tf(rTC.tInd, 1) + ' °C', 'V ' + tcVoltageMv().toFixed(2) + ' mV']);
  const rRTD = readingFor('rtd');
  drawScreen(scrCtxRTD, scrTexRTD, ['T ' + tf(rRTD.tInd, 1) + ' °C', 'R ' + rtdMeasuredResistance(MODE_STATE.rtd).toFixed(2) + ' Ω']);
  const rIR = readingFor('infrarrojo');
  drawScreen(scrCtxIR, scrTexIR, [tf(rIR.tInd, 1) + ' °C']);
  scrTexObjTC.needsUpdate = true; scrTexObjRTD.needsUpdate = true; scrTexObjIR.needsUpdate = true;
}

/* ===================== 10. Telemetría y visibilidad de grupos ===================== */
function classify(err) {
  const a = Math.abs(err);
  if (a < 1.0) return 'good';
  if (a < 10.0) return 'warn';
  return 'bad';
}

function updateTele() {
  const tR = el('t_treal'), tS = el('t_signal'), tI = el('t_tind'), tE = el('t_error'), tM = el('t_modo');
  if (!midiendo) {
    [tR, tS, tI, tE, tM].forEach(n => { n.textContent = '—'; n.className = ''; });
    return;
  }
  const r = readingFor(scenarioKey);
  const err = r.tInd - r.tReal;
  tR.textContent = tf(r.tReal, 1) + ' °C';
  tS.textContent = r.signal;
  tI.textContent = tf(r.tInd, 1) + ' °C';
  tE.textContent = (err >= 0 ? '+' : '') + tf(err, 1) + ' °C';
  tE.className = classify(err);
  tM.textContent = r.modo;
  updateScreens();
}

function setGroupsVisibility() {
  tcGroup.visible = scenarioKey === 'termopar';
  rtdGroup.visible = scenarioKey === 'rtd';
  irGroup.visible = scenarioKey === 'infrarrojo';
}

function refreshModeBar() {
  const labels = SCEN_META[scenarioKey].modeLabels;
  const m = MODE_STATE[scenarioKey];
  el('btnModeA').textContent = labels[0];
  el('btnModeB').textContent = labels[1];
  el('btnModeA').classList.toggle('on', !m);
  el('btnModeB').classList.toggle('on', m);
}

function clearDx() {
  document.querySelectorAll('.b.dx').forEach(b => b.classList.remove('right', 'wrong'));
  el('dxfeedback').textContent = '';
}

function setScenario(key) {
  scenarioKey = key;
  el('p_title').textContent = SCEN_META[key].nombre;
  setGroupsVisibility();
  refreshModeBar();
  clearDx();
  updateTele();
}

function setMode(v) {
  MODE_STATE[scenarioKey] = v;
  refreshModeBar();
  updateTele();
}

function setMedir(on) {
  midiendo = on;
  energized = on;
  el('btnMedir').textContent = on ? '⏹️ Detener medición' : '🌡️ Iniciar medición';
  el('btnMedir').classList.toggle('on', on);
  updateTele();
}

/* ===================== 11. Wiring de botones ===================== */
el('btnNew').addEventListener('click', () => {
  const i = SCEN_ORDER.indexOf(scenarioKey);
  setScenario(SCEN_ORDER[(i + 1) % SCEN_ORDER.length]);
});
el('btnMedir').addEventListener('click', () => setMedir(!midiendo));
el('btnModeA').addEventListener('click', () => setMode(false));
el('btnModeB').addEventListener('click', () => setMode(true));
document.querySelectorAll('.b.dx').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.getAttribute('data-dx');
    const correct = SCEN_META[scenarioKey].respuesta;
    clearDx();
    btn.classList.add(key === correct ? 'right' : 'wrong');
    if (key !== correct) {
      document.querySelector(`.b.dx[data-dx="${correct}"]`).classList.add('right');
    }
    el('dxfeedback').textContent = DX_HINT[key];
  });
});

/* ===================== 12. Animación ===================== */
S.setAnimate(() => {
  const glow = energized ? 0.35 + 0.15 * Math.sin(performance.now() / 260) : 0.0;
  targetBody.material.emissive = new THREE.Color(0xff5a1a);
  targetBody.material.emissiveIntensity = energized ? glow : 0.0;
  tcLed.material.emissiveIntensity = (energized && scenarioKey === 'termopar' && MODE_STATE.termopar) ? 0.9 : 0.15;
  const apunta = (energized && scenarioKey === 'infrarrojo') ? 1.0 : 0.0;
  laserDot.material.emissiveIntensity = apunta;
  irBeam.material.emissiveIntensity = apunta * 0.75;
  irBeam.visible = apunta > 0;
  /* El segundo par de hilos SOLO existe en la conexion a 4 hilos. Dibujarlo
     siempre contradecia el propio enunciado del laboratorio. */
  rtdWireA2.visible = rtdWireB2.visible = MODE_STATE.rtd;
  controls.update();
  renderer.render(scene, camera);
});

/* ===================== 13. Demostración guiada ===================== */
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

el('btnAuto').addEventListener('click', async () => {
  el('btnAuto').disabled = true;
  try {
    setScenario('termopar');
    setMode(false);
    setMedir(true);
    showToast('Termopar sin compensación de junta fría: la lectura queda por debajo de la temperatura real.');
    await sleep(2800);
    document.querySelector('.b.dx[data-dx="junta_fria"]').click();
    await sleep(2400);
    setMode(true);
    showToast('Con CJC activada, el lector suma la temperatura de su propia unión de referencia y corrige el error.');
    await sleep(2800);

    setScenario('rtd');
    setMode(false);
    showToast('RTD a 2 hilos: la resistencia de los cables de extensión se suma a la de la RTD y eleva la lectura.');
    await sleep(2800);
    document.querySelector('.b.dx[data-dx="resistencia_cable"]').click();
    await sleep(2400);
    setMode(true);
    showToast('A 4 hilos (Kelvin), un par mide corriente y el otro mide tensión sin caída por los cables: el error desaparece.');
    await sleep(2800);

    setScenario('infrarrojo');
    setMode(false);
    showToast('Pistola IR con emisividad de fábrica (0.95) sobre metal pulido (ε real ≈ 0.20): subestima la temperatura drásticamente.');
    await sleep(3000);
    document.querySelector('.b.dx[data-dx="emisividad"]').click();
    await sleep(2400);
    setMode(true);
    showToast('Al configurar la emisividad real de la superficie, la pistola IR indica la temperatura correcta.');
    await sleep(2800);

    showToast('Demostración terminada. Cada instrumento mide un fenómeno físico distinto — y cada uno tiene su propio modo de fallar si se ignora su configuración.');
  } finally {
    el('btnAuto').disabled = false;
  }
});

/* ===================== 14. Estado inicial ===================== */
setScenario('termopar');
setMedir(false);
S.start();   // sin esto el bucle de render nunca arranca y el lienzo 3D se queda en negro
</script>
