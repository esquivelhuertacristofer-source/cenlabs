el('fbX').onclick=()=>el('feedback').classList.remove('show');
document.addEventListener('input',e=>{ const t=e.target; if(!t||!GUIA.r2||GUIA.paso!=='ajusta'||GUIA.r2.pend) return;
  const r=GUIA.r2;
  if(t.id==='r2I'){ r.I=+t.value/10; r.validado=false; el('vr2I').textContent=txtI(r.I); reiniciaCalculo(); }
  else if(t.id==='r2N'){ r.n=+t.value; r.validado=false; el('vr2N').textContent=txtN(r.n); reiniciaCalculo(); }
  else if(t.id==='r2F'){ r.F=+t.value/10; r.validado=false; el('vr2F').textContent=txtF(r.F); reiniciaCalculo(); } });

/* ---------- «Repetir el recorrido»: el mismo recorrido, pero avanza solo cada pocos segundos ---------- */
async function runAuto(){
  if(EST.autoRunning) return; EST.autoRunning=true; sonido.init(); TOUR.auto=true;
  EST.modo='tour'; document.body.classList.remove('m-probar','m-reto'); document.body.classList.add('m-tour'); tourVa(0,0.6); pintaBarras();
  const avanza=()=>{ if(!TOUR.auto) return; if(TOUR.paso>=TOUR_PASOS.length-1){ tourParaAuto(); return; } tourVa(TOUR.paso+1); TOUR.timer=setTimeout(avanza,9000); };
  TOUR.timer=setTimeout(avanza,9000);
}


/* ===================== 18. CÁMARAS =====================
   La escena se encuadra con el hueco que dejan la guía y el dock: la cámara se aleja lo justo para que la caja del
   «objeto» (ancho × alto en unidades) quepa entera en ese hueco, y la proyección se desplaza para centrarla en él.
   Además el objeto nunca pasa del 74 % del alto del lienzo. */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}
const anclaPunto=()=>V3(XW-0.06,Y0,W.zAct===null?ZMIN:W.zAct);
const VISTAS={
  todo:{dir:V3(-0.10,0.26,1.0),anc:()=>V3(1.35,1.32,0),toff:V3(0,0,0),obj:()=>({w:4.1,h:2.95}),fov:34,tope:0.80},
  punto:{dir:V3(0.45,0.38,0.80),anc:anclaPunto,toff:V3(0,0.20,0),obj:()=>({w:1.9,h:1.55}),fov:34,tope:0.72},
  robot:{dir:V3(0.22,0.18,1.0),anc:()=>V3(0.95,1.28,-0.1),toff:V3(0,0,0),obj:()=>({w:3.0,h:2.95}),fov:34,tope:0.80},
  cenital:{dir:V3(0.03,1,0.10),anc:()=>V3(2.2,Y0,0),toff:V3(0,0,0),obj:()=>({w:2.0,h:1.45}),fov:34,tope:0.74},
};
const CAM={off:V3(3,6,5),toff:V3(0,0,0),auto:true,previo:null,k:1,dur:1,psi:0};
const dirVista=v=>VISTAS[v].dir.clone();
function fovVista(v){ return innerWidth<innerHeight*0.9?46:VISTAS[v].fov; }
function distanciaFit(w,h,fov,tope){
  const Hu=huecoLibre(), W=innerWidth, Hh=innerHeight, tv=Math.tan(fov*Math.PI/360), th=tv*(W/Hh);
  const wF=Math.max(80,Hu.x1-Hu.x0)/W, hF=Math.max(80,Hu.y1-Hu.y0)/Hh;
  const D=1.06*Math.max(w/(2*th*wF),h/(2*tv*hF));
  return Math.max(D,h/(2*tv*(tope||0.66)));
}
function ofsDeseado(v){
  const V=VISTAS[v], o=V.obj(), fov=fovVista(v), D=distanciaFit(o.w,o.h,fov,V.tope);
  return {off:dirVista(v).normalize().multiplyScalar(D),toff:V.toff.clone(),fov};
}
function ponVista(v,dur){
  EST.vista=v; CAM.auto=true; CAM.dur=dur===undefined?1.0:dur;
  if(typeof pintaBarras==='function') pintaBarras();
  if(CAM.dur<=0.01){ const A=VISTAS[v].anc(), d=ofsDeseado(v); CAM.off.copy(d.off); CAM.toff.copy(d.toff); camera.fov=d.fov; camera.updateProjectionMatrix();
    camera.position.copy(A).add(CAM.off); controls.target.copy(A).add(CAM.toff); CAM.previo=A.clone(); }
}
function pasaCam(dt){
  const V=VISTAS[EST.vista], Pa=V.anc();
  if(CAM.auto){
    const d=ofsDeseado(EST.vista), k=1-Math.exp(-dt/Math.max(0.05,(CAM.dur||1)*0.30));
    CAM.off.lerp(d.off,k); CAM.toff.lerp(d.toff,k);
    if(Math.abs(camera.fov-d.fov)>0.05){ camera.fov+=(d.fov-camera.fov)*k; camera.updateProjectionMatrix(); }
    camera.position.copy(Pa).add(CAM.off); controls.target.copy(Pa).add(CAM.toff);
  } else if(CAM.previo){ const dP=Pa.clone().sub(CAM.previo); camera.position.add(dP); controls.target.add(dP); }
  CAM.previo=Pa.clone();
}
controls.addEventListener('start',()=>{ CAM.auto=false; });

/* ===================== 19. SONIDO (sintetizado) =====================
   El zumbido de la corriente alterna (120 Hz, el doble de la red) sólo mientras pasa corriente, un golpe sordo al apretar y un chisporroteo
   cuando el metal sale despedido; avisos de acierto y fallo. */
const sonido=(function(){
  let ctx=null,on=true,master=null,ult=0,zum=null,zg=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      zum=ctx.createOscillator(); zg=ctx.createGain(); zum.type='sawtooth'; zum.frequency.value=120; zg.gain.value=0; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700; zum.connect(lp); lp.connect(zg); zg.connect(master); zum.start();
    }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); ult=f; }
  return {init,
    zumbido:(q)=>{ if(!ctx||!zum) return; const t=ctx.currentTime; zg.gain.setTargetAtTime(on&&q>0?0.012*q:0,t,0.03); },
    golpe:()=>tono(70,0.12,0.09),
    chisporroteo:()=>{ for(let i=0;i<5;i++) setTimeout(()=>tono(1800+Math.random()*2200,0.05,0.025,'square'),i*35); },
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }, get freq(){ return ult; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});

/* ===================== 20. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.max(Math.min(devicePixelRatio,alta?2:1.5),Math.min(devicePixelRatio,1.5)>1?1.25:1));
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  renderer.shadowMap.enabled=alta; LUZ.sol.castShadow=alta; scene.traverse(o=>{ if(o.material) o.material.needsUpdate=true; });
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); if(typeof ponVista==='function'&&CALC) ponVista(EST.vista,0.001); centraEnHueco();
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 21. EL LAZO: UN SOLO RELOJ =====================
   El tiempo del ciclo avanza dt·velocidad en cada cuadro, y con ESE tiempo se mueven el robot y la pinza, se calcula el calor y el tamaño
   de la pepita, se encienden el brillo y las chispas y se dibujan las gráficas del dock. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0, tSon=0, ultFase='';
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  const dtS=EST.pausa?0:dt, dtSim=dtS*EST.vel;
  const fasePrev=SIM.fase, expPrev=W.rafaga;
  aplicaEscena(dtS,dtSim,dt);
  if(SIM.fase==='aprieta'&&fasePrev==='mueve') sonido.golpe();
  if(W.rafaga&&!expPrev) sonido.chisporroteo();
  pasaCam(dt);
  if(t-tSon>0.1){ tSon=t; sonido.zumbido(SIM.fase==='suelda'&&!EST.pausa?1:0); }
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaGraficas(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos(); colocaFoco();
}

/* ===================== 22. ARRANQUE =====================
   Abre funcionando y con el recorrido en el paso 1: el robot ya está soldando puntos en la puerta, antes de que el alumno toque nada. */
disposicion();
reiniciaCalculo();
tourVa(0,0.001);
aplicaCalidad();
pintaHUD();
aplicaEscena(0.02,0.02);
pintaBarras();
ponVista('todo',0.001);
centraEnHueco();
pintaDockFijo();
cuadro();

/* ===================== 25. GANCHOS DE PRUEBA ===================== */
/** Mide el objeto en lo VISIBLE: se pinta sin nave, puerta, utillaje, chispas ni brillos sobre magenta puro y se toma la caja de los píxeles que no son magenta.
 *  Modo por defecto: el robot (el protagonista) · modo 'celda': además la puerta y el utillaje. */
function mideObjeto(modo){
  const ocultos=[]; const oc=o=>{ if(o.visible){ o.visible=false; ocultos.push(o); } };
  [NAVE,CHISPAS,HALO,NUCLEO,MARCAS,LUPA,L_GUIA].forEach(oc); if(modo!=='celda'){ oc(PUERTA); oc(UTIL); }
  const bg=scene.background, fog=scene.fog; scene.background=null; scene.fog=null; renderer.setClearColor(0xff00ff,1);
  renderer.render(scene,camera);
  const c=renderer.domElement, Wc=c.width, Hc=c.height, t=document.createElement('canvas'); t.width=Wc; t.height=Hc; const g=t.getContext('2d',{willReadFrequently:true}); g.drawImage(c,0,0);
  const d=g.getImageData(0,0,Wc,Hc).data; let x0=1e9,x1=-1,y0=1e9,y1=-1;
  for(let y=0;y<Hc;y++) for(let x=0;x<Wc;x++){ const i=(y*Wc+x)*4; if(!(d[i]>235&&d[i+1]<30&&d[i+2]>235)){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  for(const o of ocultos) o.visible=true; scene.background=bg; scene.fog=fog; renderer.setClearColor(0x000000,1);
  const k=Wc/innerWidth; return {x0:x0/k,x1:x1/k,y0:y0/k,y1:y1/k,altoPx:(y1-y0)/k,anchoPx:(x1-x0)/k,fracAlto:(y1-y0)/Hc,fracAncho:(x1-x0)/Wc,hueco:huecoLibre(),W:innerWidth,H:innerHeight};
}
window.__labDebug={
  get mode(){ return EST.modo==='reto'?GUIA.paso:EST.modo; },
  get solved(){ return RETOS.hecho; },

    r2:GUIA.r2?{esc:GUIA.r2.esc.id,I:GUIA.r2.I,n:GUIA.r2.n,F:GUIA.r2.F,validado:GUIA.r2.validado,pend:GUIA.r2.pend,def:GUIA.r2.res?GUIA.r2.res.def:null,hist:GUIA.r2.hist.length}:null,
    dx:GUIA.dx?GUIA.dx.k:null,quizN:GUIA.quizN,quizAcierto:RETOS.quizAcierto,resuelto:RETOS.hecho}; },
  get piezasNaN(){ const m=[]; scene.traverse(o=>{ const q=o.position; if(!isFinite(q.x)||!isFinite(q.y)||!isFinite(q.z)) m.push(o.type); }); return m; },
  get autoRunning(){ return EST.autoRunning; },
  get activo(){ return W.activo; },
  modelo(){ const C=CALC; if(!C) return {activo:false}; const R=C.R, S=C.S;
    return {I:C.p.I,n:C.p.n,F:C.p.F,desg:C.p.desg,paso:C.p.paso,Ie:S.Ie,R:S.Re.R,Q:R.Q,dmm:R.dmm,def:R.def,ok:R.ok,exp:R.exp,ind:R.ind,dexp:S.dexp,tm:S.tm,etaPepita:R.etaPepita,fase:SIM.fase}; },

    tri:renderer.info.render.triangles,llamadas:renderer.info.render.calls,fps:FPS.v}; },
  cam(){ const r=v=>[+v.x.toFixed(3),+v.y.toFixed(3),+v.z.toFixed(3)]; return {pos:r(camera.position),target:r(controls.target),hueco:huecoLibre(),fps:FPS.v,fov:camera.fov}; },
  robot(){ const g=v=>+(v*180/Math.PI).toFixed(2); ROBOT.updateMatrixWorld(true); const t=TCP.getWorldPosition(new THREE.Vector3());
    return {j1:g(JN.J1.rotation.y),j2:g(JN.J2.rotation.z),j3:g(JN.J3.rotation.z),j5:g(JN.J5.rotation.z),tcp:[t.x,t.y,t.z].map(v=>+v.toFixed(4)),meshes:ESLABONES.length+2}; },
  mideObjeto, objeto:mideObjeto,
};
window.__test=Object.assign(window.__test||{},{

  setAjusta:(I,n,F)=>{ const r=GUIA.r2; if(r){ r.I=I; r.n=n; r.F=F; r.validado=false; reiniciaCalculo(); pintaHUD(); } },

});
