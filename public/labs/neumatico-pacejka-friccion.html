<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · El Neumático: Pacejka, Círculo de Fricción y Límite de Adherencia — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#0B1216;--panel:rgba(9,16,20,.87);--line:#2B414C;--ink:#EEF4F6;
    --dim:#A2B5BE;--accent:#FFB020;--accent2:#FFD27A;--hv:#4FD2F5;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cX:#FF8A3D;--cY:#4FD2F5;--cU:#FFD54A;--cG:#C8D6D2;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#10252e;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#16323d}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#241500;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#241500;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#ffc554}
  .b.auto{border-color:rgba(79,210,245,.6);color:var(--hv);background:rgba(79,210,245,.08);font-weight:600}
  .b.auto:hover{background:rgba(79,210,245,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#241500}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#FFB020;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f87a0;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f90a8;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#241500}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(79,210,245,.35);background:rgba(79,210,245,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .escs{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
  .esc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px;font-size:11.5px;line-height:1.35;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);color:#c4d3e6}
  .esc .rs{font-weight:700;font-size:11px}.esc .rs.ok{color:var(--good)}.esc .rs.mal{color:#ff9a9a}
  .esc .pista{font-size:10.5px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#09121c;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(30,53,80,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- el recorrido guiado: una tarjeta que se lee primero ---- */
  .modebar{grid-template-columns:repeat(3,1fr)}
  .tour{border:1px solid rgba(255,176,32,.5);background:rgba(255,176,32,.07);border-radius:12px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .tour .tn{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .tour .dots{display:flex;gap:4px}.tour .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.tour .dots i.on{background:var(--accent)}.tour .dots i.ok{background:#8a6a1c}
  .tour .mira{font-size:12px;line-height:1.45;color:var(--accent2);border-left:2px solid var(--accent);padding-left:9px}
  .tour .tb{display:flex;gap:6px}.tour .tb .b{flex:1}
  .tour .salta{font-size:11px;color:var(--dim);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .hud h2.frase{font-size:18.5px;line-height:1.22}
  .glos{font-size:11.5px;color:var(--dim);line-height:1.45}
  .glos b{color:var(--ink);font-weight:600}
  .sw{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,53,80,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f87a0}
  .dk-tit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#a3bcd6;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c6da;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(79,210,245,.08);color:#ffd88a;border:1px solid rgba(79,210,245,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#10252e;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfdcec;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,18,30,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,18,30,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d3e6}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,18,30,.92);border:1px solid rgba(124,196,255,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,18,30,.84);border:1px solid rgba(124,196,255,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .chips{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .chip{font-size:11.5px;line-height:1.35;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--dim)}
  .chip b{color:var(--ink)} .chip small{font-size:10.5px;color:var(--dim)}
  .chip.ok{border-color:rgba(52,211,153,.5)} .chip.ok b{color:var(--good)} .chip.mal{border-color:rgba(244,71,94,.5)} .chip.mal b{color:#ff9aa8}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}
  body.estrecho.ancho.t-panel .panel>.dk-fig{grid-column:1;grid-row:2}
  body.estrecho.ancho.t-panel .panel>.dk-row{grid-column:1;grid-row:3/6;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-fu{grid-column:2;grid-row:2;align-self:start}
  body.estrecho.ancho.t-panel .panel>.dk-g.fu{grid-column:2;grid-row:2/4;min-height:0;margin-top:18px}
  body.estrecho.ancho.t-panel .panel>.dk-ley{display:none}
  body.estrecho.ancho.t-panel .panel>.t-sp{grid-column:2;grid-row:4}
  body.estrecho.ancho.t-panel .panel>.dk-g.sp{grid-column:2;grid-row:5;min-height:0}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   LAB — EL NEUMÁTICO: CURVA DE PACEJKA, CÍRCULO DE FRICCIÓN Y LÍMITE DE ADHERENCIA
   (Dinámica del vehículo · mecanica-147)

   Una llanta de ensayo gira sobre una cinta móvil, como en un banco de pruebas de neumáticos. Su deslizamiento y su ángulo
   de desvío salen de un barrido (o de los mandos); la fuerza que da sale de la fórmula mágica de Pacejka y de la elipse de
   fricción, en un bloque puro que un script de Node extrae TAL CUAL y verifica. La huella, las flechas de fuerza, la
   elipse dibujada sobre la cinta y las gráficas del dock usan el mismo estado en cada cuadro.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO='\u202F';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }



/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos marcas— y lo prueba:
   lo que se prueba es lo que corre. */
/* FISICA:INICIO */
/* ---- La llanta: fórmula mágica de Pacejka, elipse de fricción y carga vertical. Unidades SI salvo donde se diga. ---- */
const DOSPI=Math.PI*2, G=9.80665, RAD=Math.PI/180;
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const suave=t=>t*t*(3-2*t);

/* Fórmula mágica de Pacejka: F = D·sen(C·atan(B·x − E·(B·x − atan(B·x)))). Con C > 1 y E < 1 el argumento del seno recorre
   todo el intervalo hasta π/2 y el pico de la curva vale EXACTAMENTE D. */
const mf=(x,B,C,E,D)=>{const bx=B*x;return D*Math.sin(C*Math.atan(bx-E*(bx-Math.atan(bx))));};
/** Abscisa del pico: el argumento B·x(1−E) + E·atan(B·x) crece sin parar y debe valer tan(π/2C). Bisección. */
function xPico(B,C,E){
  const t=Math.tan(Math.PI/(2*C)), f=x=>B*x*(1-E)+E*Math.atan(B*x);
  let a=0,b=1;
  while(f(b)<t&&b<1e6) b*=2;
  for(let i=0;i<200;i++){ const m=(a+b)/2; if(f(m)<t) a=m; else b=m; }
  return (a+b)/2;
}

/* Pisos. mux, muy: coeficiente de adherencia máximo (longitudinal y lateral) de una llanta nueva a la carga y presión nominales;
   (B, C, E) de cada eje. Valores didácticos de libro, no de un fabricante: seco ≈ 1,0 · mojado ≈ 0,68 · nieve ≈ 0,30 · hielo ≈ 0,10. */
const SUP={
  seco:  {nombre:'Seco',  mux:1.00,muy:0.92,Bx:14.0,Cx:1.65,Ex: 0.3,By:10.5,Cy:1.45,Ey:-0.6},
  mojado:{nombre:'Mojado',mux:0.68,muy:0.62,Bx:12.0,Cx:1.60,Ex:-0.2,By: 9.0,Cy:1.55,Ey:-0.6},
  nieve: {nombre:'Nieve', mux:0.30,muy:0.28,Bx: 8.0,Cx:1.60,Ex: 0.3,By: 6.3,Cy:1.70,Ey:-0.2},
  hielo: {nombre:'Hielo', mux:0.10,muy:0.09,Bx: 6.5,Cx:1.70,Ex: 0.8,By: 5.2,Cy:1.80,Ey: 0.0},
};
const PISOS=['seco','mojado','nieve','hielo'];
/* Carga vertical y presión */
const FZ0=3500;                  // N, carga nominal de una llanta de un coche de 1 400 kg
const DMU=-0.16;                 // sensibilidad de carga: μ cae 16 % al duplicar la carga
const P_OPT=2.4, KP=0.25, KS=0.35; // bar: presión óptima; caída de μ ∝ (Δp/p)²; rigidez que sube con la presión
const ANCHO=0.205;               // m, ancho de la banda de rodadura (205/55 R16)
const R_LLANTA=0.316;            // m, radio bajo carga

/** Construye la llanta: pico de fuerza y posición del pico en cada eje, rigideces y huella, para un piso, una carga y una presión. */
const _cacheN={}; let _nCacheN=0;
function llanta(piso,Fz,p){
  Fz=Math.round(clamp(Fz,500,12000)); p=Math.round(clamp(p,0.8,4)*100)/100;   // al newton y a la centésima de bar: la caché no crece sin fin con el barrido de carga
  const k=piso+'|'+Fz+'|'+p; if(_cacheN[k]) return _cacheN[k];
  if(++_nCacheN>800){ for(const q in _cacheN) delete _cacheN[q]; _nCacheN=0; }
  const S=SUP[piso], fl=Math.max(0.4,1+DMU*(Fz-FZ0)/FZ0), fp=1-KP*Math.pow((p-P_OPT)/P_OPT,2), fs=1+KS*(p-P_OPT)/P_OPT;
  const Dx=S.mux*fl*fp*Fz, Dy=S.muy*fl*fp*Fz, Bx=S.Bx*fs, By=S.By*fs;
  const kp=xPico(Bx,S.Cx,S.Ex), ap=xPico(By,S.Cy,S.Ey), area=Fz/(p*1e5);
  return (_cacheN[k]={piso,Fz,p,fl,fp,fs,Dx,Dy,Bx,By,Cx:S.Cx,Cy:S.Cy,Ex:S.Ex,Ey:S.Ey,kp,ap,tp:Math.tan(ap),
    area,largo:area/ANCHO,Cka:Bx*S.Cx*Dx,Caa:By*S.Cy*Dy,muEfX:Dx/Fz,muEfY:Dy/Fz});
}
/** Curvas PURAS (un solo eje): fuerza de frenado/tracción según el deslizamiento κ y fuerza lateral según la deriva α (rad). */
const fxPuro=(N,kap)=>Math.sign(kap)*mf(Math.abs(kap),N.Bx,N.Cx,N.Ex,N.Dx);
const fyPuro=(N,alf)=>Math.sign(alf)*mf(Math.abs(alf),N.By,N.Cy,N.Ey,N.Dy);

/** Deslizamiento combinado por ELIPSE DE FRICCIÓN. Los deslizamientos se normalizan con el de su pico (sx = κ/κ_pico,
    sy = tan α/tan α_pico); la fuerza sigue la dirección del deslizamiento y su módulo recorre la curva pura de cada eje
    en s = |(sx, sy)|. Así (Fx/Fx_pico)² + (Fy/Fy_pico)² ≤ 1 siempre, con igualdad en s = 1. */
function fuerzas(N,kap,alf){
  const sx=kap/N.kp, sy=Math.tan(alf)/N.tp, s=Math.hypot(sx,sy);
  if(s<1e-14) return {Fx:0,Fy:0,s:0,sx:0,sy:0,u:0,ux:0,uy:0};
  const fx=mf(s*N.kp,N.Bx,N.Cx,N.Ex,N.Dx), fy=mf(Math.atan(s*N.tp),N.By,N.Cy,N.Ey,N.Dy);
  const Fx=sx/s*fx, Fy=sy/s*fy, ux=Fx/N.Dx, uy=Fy/N.Dy;
  return {Fx,Fy,s,sx,sy,ux,uy,u:Math.hypot(ux,uy)};
}
/** Inversa: ¿qué deslizamiento y deriva producen la fuerza pedida (Fx, Fy)? Existe en la rama ascendente si la fuerza cae dentro de la elipse. */
function inversa(N,Fx,Fy){
  const ux=Math.abs(Fx)/N.Dx, uy=Math.abs(Fy)/N.Dy, r=Math.hypot(ux,uy);
  if(r<1e-12) return {kap:0,alf:0,ok:true};
  if(r>=1) return {kap:Math.sign(Fx||1)*N.kp*1.3,alf:Math.sign(Fy||1)*Math.atan(N.tp*1.3),ok:false};
  const fxn=s=>mf(s*N.kp,N.Bx,N.Cx,N.Ex,1), fyn=s=>mf(Math.atan(s*N.tp),N.By,N.Cy,N.Ey,1);
  const g=s=>{const a=fxn(s),b=fyn(s);return (ux>0?(ux/a)*(ux/a):0)+(uy>0?(uy/b)*(uy/b):0)-1;};
  let lo=1e-9,hi=1; for(let i=0;i<200;i++){ const m=(lo+hi)/2; if(g(m)>0) lo=m; else hi=m; }
  const s=(lo+hi)/2, c=ux>0?ux/fxn(s):0, sn=uy>0?uy/fyn(s):0;
  return {kap:Math.sign(Fx)*s*c*N.kp,alf:Math.sign(Fy)*Math.atan(s*sn*N.tp),ok:true,s};
}
/** Fuerza máxima en una dirección: la elipse de semiejes (Dx, Dy). */
const fuerzaMaxDir=(N,ang)=>1/Math.hypot(Math.cos(ang)/N.Dx,Math.sin(ang)/N.Dy);
/** Fuerza lateral que queda cuando ya se usa una fracción de la fuerza de frenado máxima. */
const lateralRestante=(N,Fx)=>N.Dy*Math.sqrt(Math.max(0,1-(Fx/N.Dx)*(Fx/N.Dx)));
/** Fuerza máxima (pico) por eje en función de la carga: la sensibilidad de carga la vuelve cóncava. */
const picoDeCarga=(piso,Fz,p,eje)=>{const N=llanta(piso,Fz,p);return eje==='x'?N.Dx:N.Dy;};
/** Calor que se genera en la huella por deslizar: P = |Fx|·V_desl,x + |Fy|·V_desl,y (W). V: velocidad del vehículo (m/s). */
const potenciaFriccion=(F,kap,alf,V)=>Math.abs(F.Fx)*V*Math.abs(kap)+Math.abs(F.Fy)*V*Math.abs(Math.sin(alf));

/* ---- Reto: tomar una curva mojada FRENANDO un poco. Un cuarto de coche (masa m = Fz/g) recorre un arco de radio R y
   longitud S a deceleración constante a. Hace falta Fx = m·a y Fy = m·v²/R; ninguna de las dos puede sacar al punto de la elipse. ---- */
const MARGEN=0.04;               // la demanda no puede pasar del 96 % del límite
const ESCENARIOS=[
  {id:'a',R:55,v0:60,vs:40,S:38,Fz:3400,p:2.4,etq:'Carga normal'},
  {id:'b',R:48,v0:54,vs:37,S:30,Fz:4300,p:2.4,etq:'Coche cargado'},
  {id:'c',R:70,v0:68,vs:44,S:50,Fz:3000,p:2.0,etq:'Llantas algo bajas'},
];
function ventanaManiobra(esc){
  const N=llanta('mojado',esc.Fz,esc.p), m=esc.Fz/G, v0=esc.v0/3.6, vs=esc.vs/3.6, ay0=v0*v0/esc.R;
  const amin=(v0*v0-vs*vs)/(2*esc.S);
  const lat=ay0*m/N.Dy, amax=N.Dx/m*Math.sqrt(Math.max(0,(1-MARGEN)*(1-MARGEN)-lat*lat));
  return {N,m,v0,vs,ay0,amin,amax,latRatio:lat,existe:amax>amin};
}
/** Qué pasa con una deceleración a: el agarre usado en la entrada (el peor punto) y la velocidad de salida. */
function evaluaManiobra(esc,a){
  const W=ventanaManiobra(esc), v02=W.v0*W.v0;
  const rho0=Math.hypot(W.m*a/W.N.Dx,W.m*W.ay0/W.N.Dy);
  const v2f=v02-2*a*esc.S, vf=Math.sqrt(Math.max(0,v2f)), seParaAntes=v2f<=0;
  const okAgarre=rho0<=1-MARGEN, okSalida=vf<=W.vs+1e-9;
  return {W,rho0,vf,seParaAntes,okAgarre,okSalida,ok:okAgarre&&okSalida,pocoFreno:!okSalida,demasiado:!okAgarre};
}
/** Traza de la maniobra: la demanda (Fx, Fy) a lo largo del arco hasta salir o hasta parar. */
function trazaManiobra(esc,a,n){
  n=n||80; const W=ventanaManiobra(esc), v02=W.v0*W.v0, sMax=a>1e-9?Math.min(esc.S,v02/(2*a)):esc.S, out=[];
  for(let i=0;i<=n;i++){ const s=sMax*i/n, v=Math.sqrt(Math.max(0,v02-2*a*s)), t=a>1e-9?(W.v0-v)/a:s/Math.max(W.v0,1e-9);
    out.push({s,v,t,Fx:W.m*a,Fy:W.m*v*v/esc.R,ay:v*v/esc.R}); }
  return out;
}

/* ---- Diagnóstico: tres causas con síntomas medibles. Se lee la huella, el agarre máximo al frenar (por kN de peso),
   la rigidez al girar y el deslizamiento del pico; la causa (piso, presión o carga) queda oculta. ---- */
const CASOS_DX=[
  {k:'mojado',piso:'mojado',Fz:3500,p:2.4},
  {k:'presion',piso:'seco',Fz:3500,p:1.5},
  {k:'carga',piso:'seco',Fz:6400,p:2.4},
];
function sintomas(c){
  const N=llanta(c.piso,c.Fz,c.p);
  return {areaCm2:N.area*1e4,muX:N.muEfX,rigidez:N.Caa*RAD,picoPct:N.kp*100,N};
}
/* FISICA:FIN */



/* ===================== 2. ESCENA, CÁMARA, LUZ ===================== */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
renderer.outputColorSpace=THREE.SRGBColorSpace;
el('stage').appendChild(renderer.domElement); renderer.domElement.style.touchAction='none';

function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h||w;return c;}
function tex(canvas,{srgb=false,flip=true}={}){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=srgb?THREE.SRGBColorSpace:THREE.NoColorSpace; t.flipY=flip;
  // Mipmaps sí: sin ellos cada píxel muestrea un texel suelto y el especular centellea al girar.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter; t.magFilter=THREE.LinearFilter; t.anisotropy=8;
  return t;
}
function fondoDegradado(arriba,medio,abajo){
  const c=cv(8,512),x=c.getContext('2d');

   Nada de grano fino —se lee como lija sobre caras grandes—: manchas lentas de tono y marcas propias de un banco de

const pbr=o=>new THREE.MeshStandardMaterial(o), fis=o=>new THREE.MeshPhysicalMaterial(o);
function texPlataforma(){
  const W=512,c=cv(W),x=c.getContext('2d');
  const g=x.createRadialGradient(W*0.45,W*0.4,W*0.05,W/2,W/2,W*0.75); g.addColorStop(0,'#33414a'); g.addColorStop(1,'#161f25');
  x.fillStyle=g; x.fillRect(0,0,W,W);
  x.strokeStyle='rgba(255,176,32,0.07)'; x.lineWidth=1;
  for(let i=0;i<=16;i++){ const p=i*W/16; x.beginPath(); x.moveTo(p,0); x.lineTo(p,W); x.moveTo(0,p); x.lineTo(W,p); x.stroke(); }
  x.strokeStyle='rgba(255,176,32,0.20)'; x.lineWidth=2;
  for(let i=0;i<=4;i++){ const p=i*W/4; x.beginPath(); x.moveTo(p,0); x.lineTo(p,W); x.moveTo(0,p); x.lineTo(W,p); x.stroke(); }
  return tex(c,{srgb:true});
}
/* La cinta: 1,2 m de largo por tile. Manchas lentas de asfalto, cuatro marcas transversales por tile (cada 0,30 m: sirven
   para LEER la velocidad de la cinta frente a la de la llanta), dos líneas de borde y una línea central discontinua (la
   dirección de avance, para leer el ángulo de desvío). */
function texCinta(){
  const W=1024,H=512,c=cv(W,H),x=c.getContext('2d');
  x.fillStyle='#b9bec2'; x.fillRect(0,0,W,H);
  let s=11; const rnd=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  for(let i=0;i<46;i++){ const px=rnd()*W, py=rnd()*H, r=40+rnd()*110, d=rnd()<0.5?0:255, g=x.createRadialGradient(px,py,0,px,py,r);
    g.addColorStop(0,'rgba('+d+','+d+','+d+','+(0.05+rnd()*0.06)+')'); g.addColorStop(1,'rgba('+d+','+d+','+d+',0)');
    for(const ox of [-W,0,W]){ x.save(); x.translate(ox,0); x.fillStyle=g; x.fillRect(px-r,py-r,2*r,2*r); x.restore(); } }
  x.fillStyle='rgba(255,255,255,0.55)';
  for(let i=0;i<4;i++){ x.fillRect(i*W/4-3,0,6,H); }
  x.fillStyle='rgba(255,255,255,0.85)'; x.fillRect(0,22,W,7); x.fillRect(0,H-29,W,7);
  x.fillStyle='rgba(255,226,140,0.95)'; for(let i=0;i<8;i++) x.fillRect(i*W/8+8,H/2-4,W/8*0.5,8);
  const t=tex(c,{srgb:true}); t.repeat.set(2,1); return t;
}
function texRadial(c0,c1){ const W=256,c=cv(W),x=c.getContext('2d'); const g=x.createRadialGradient(W/2,W/2,0,W/2,W/2,W/2); g.addColorStop(0,c0); g.addColorStop(1,c1); x.fillStyle=g; x.fillRect(0,0,W,W); const t=tex(c,{srgb:true}); t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping; return t; }
/* El transportador: marcas cada 5° (más largas cada 10°) alrededor de la dirección de avance, adelante y atrás. Sin números. */
function texTransportador(){
  const W=1024,c=cv(W),x=c.getContext('2d'); x.clearRect(0,0,W,W); const C=W/2;
  for(const base of [0,180]) for(let a=-30;a<=30;a+=2.5){
    const th=(base+a)*Math.PI/180, mayor=a%10===0, r0=C*(mayor?0.86:0.90), r1=C*0.95;
    x.strokeStyle=mayor?'rgba(255,255,255,0.95)':'rgba(255,255,255,0.55)'; x.lineWidth=mayor?7:4;
    x.beginPath(); x.moveTo(C+r0*Math.cos(th),C-r0*Math.sin(th)); x.lineTo(C+r1*Math.cos(th),C-r1*Math.sin(th)); x.stroke(); }
  x.strokeStyle='rgba(255,255,255,0.55)'; x.lineWidth=5; x.beginPath(); x.arc(C,C,C*0.95,-30*Math.PI/180,30*Math.PI/180); x.stroke(); x.beginPath(); x.arc(C,C,C*0.95,150*Math.PI/180,210*Math.PI/180); x.stroke();
  const t=tex(c,{srgb:true}); t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping; t.repeat.set(1,1); return t;
}

function malla(g,m,{sombra=true,recibe=true}={}){ const o=new THREE.Mesh(g,m); o.castShadow=sombra; o.receiveShadow=recibe; return o; }
/** Funde las mallas ESTÁTICAS de un grupo en una malla por material (y por «clave» de pieza, para que el rótulo y el tooltip sigan
 *  sabiendo de qué pieza son). Las que se mueven, las instanciadas y el fondo se quedan como están. */
function fusionaPartes(grupo,excluir){
  excluir=excluir||[]; grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map(), viejas=[];
  const fuera=o=>{ for(let p=o;p&&p!==grupo;p=p.parent) if(excluir.includes(p)||(p.userData&&p.userData.fondo===true)) return true; return false; };
  grupo.traverse(o=>{ if(!o.isMesh||o.isInstancedMesh||fuera(o)||o.userData.noFusion) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(); g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld));
    if(!g.attributes.uv) g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
    const clave=o.userData.clave||'', ro=o.renderOrder||0;
    const mete=(mat,geo)=>{ const k=mat.uuid+'|'+clave; if(!por.has(k)) por.set(k,{mat,clave,gs:[],ro}); por.get(k).gs.push(geo); };
    if(Array.isArray(o.material)){
      const grupos=g.groups&&g.groups.length?g.groups:[{start:0,count:g.attributes.position.count,materialIndex:0}];
      for(const gr of grupos){ const mat=o.material[gr.materialIndex]; if(!mat) continue; const sub=new THREE.BufferGeometry();
        for(const nom of ['position','normal','uv']){ const at=g.attributes[nom]; sub.setAttribute(nom,new THREE.BufferAttribute(at.array.slice(gr.start*at.itemSize,(gr.start+gr.count)*at.itemSize),at.itemSize)); }
        mete(mat,sub); }
      g.dispose();
    } else mete(o.material,g);
    viejas.push(o); });
  for(const o of viejas){ o.parent.remove(o); }
  for(const [,{mat,clave,gs,ro}] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count; pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry(); G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const me=new THREE.Mesh(G,mat); me.castShadow=!mat.transparent&&!(mat.blending===THREE.AdditiveBlending); me.receiveShadow=true; me.renderOrder=ro; if(clave) me.userData.clave=clave; grupo.add(me);
  }
}

/* ===================== 12. EL ESTADO Y EL RELOJ =====================
   Un solo cálculo (ST) alimenta la escena, el dock y las cifras: en cada cuadro se toman el piso, la carga, la presión y
   los dos deslizamientos (del barrido, de los mandos o de la maniobra del reto), se calcula la fuerza con la física de arriba
   y con ESE estado se mueven la llanta, la cinta, la huella, las flechas y la elipse, y se pintan las gráficas. El reloj
   SIM.t avanza dt·velocidad. Lo que se ve va a 1/10 de la velocidad real (la cinta real corre a 72 km/h). */
const V_ENS=20;                  // m/s, velocidad de la cinta en el ensayo
const VISC=1/10;                 // lo que se ve va a 1/10 de la velocidad real
const EST={modo:'recorrido',sup:'seco',Fz:3500,p:2.4,demo:'ciclo',auto:true,sb:0,al:0,fzAuto:false,vel:1,pausa:REDUCIDO,autoRunning:false,vista:'banco',rot:false};

const NOMBRE_PISO={seco:'Seco',mojado:'Mojado',nieve:'Nieve',hielo:'Hielo'};
const tri=u=>suave(1-Math.abs(2*u-1));       // 0 → 1 → 0 suave
const PER={frenar:6,girar:7,ambos:8,ciclo:21};
/** El barrido de demostración: frenar (0 → 100 % → 0), girar (0 → 20° → 0) o las dos cosas a la vez (deriva fija y frenado creciente). */
function demoEn(t,tipo){
  if(tipo==='frenar'){ const u=(t%PER.frenar)/PER.frenar; return {sb:Math.pow(tri(u),2.6),al:0,fase:'frenar'}; }
  if(tipo==='girar'){ const u=(t%PER.girar)/PER.girar; return {sb:0,al:20*tri(u),fase:'girar'}; }
  if(tipo==='ambos'){ const u=(t%PER.ambos)/PER.ambos; return {sb:0.7*Math.pow(tri(u),1.6),al:9,fase:'ambos'}; }
  const u=t%PER.ciclo; if(u<PER.frenar) return demoEn(u,'frenar'); if(u<PER.frenar+PER.girar) return demoEn(u-PER.frenar,'girar'); return demoEn(u-PER.frenar-PER.girar,'ambos');
}
const FASE_TXT={frenar:'frenando recto',girar:'girando sin frenar',ambos:'girando y frenando a la vez',manual:'tú mandas',quieto:'parada'};

/** Entradas del cuadro: de dónde salen el piso, la carga, la presión y los dos deslizamientos según el modo. */
function entradas(){
  const t=SIM.t;
  if(EST.modo==='reto'&&typeof GUIA!=='undefined'){
    if(GUIA.paso==='predice'&&GUIA.r1){ const r=GUIA.r1, d=demoEn(t,'girar'); return {piso:'mojado',Fz:r.Fz,p:r.p,sb:d.sb,al:d.al,V:V_ENS,fase:d.fase}; }
    if(GUIA.paso==='decide'&&GUIA.r2) return maniobraEn(t);
    if(GUIA.dx){ const c=GUIA.dx, d=demoEn(t,'ciclo'); return {piso:c.piso,Fz:c.Fz,p:c.p,sb:d.sb,al:d.al,V:V_ENS,fase:d.fase}; }
  }
  const Fz=EST.fzAuto?4300+2500*Math.sin(t*0.55):EST.Fz;
  if(EST.auto){ const d=demoEn(t,EST.demo); return {piso:EST.sup,Fz,p:EST.p,sb:d.sb,al:d.al,V:V_ENS,fase:d.fase}; }
  return {piso:EST.sup,Fz,p:EST.p,sb:EST.sb,al:EST.al,V:V_ENS,fase:'manual'};
}
/** La maniobra del reto, a cámara lenta ×1/3: el cuarto de coche recorre el arco frenando y la llanta tiene que dar Fx = m·a y Fy = m·v²/R. */
function maniobraEn(t){
  const r=GUIA.r2, esc=r.esc, T=trazaManiobra(esc,r.a,100), dur=T[T.length-1].t, lento=3, lazo=dur*lento+1.6, u=t%lazo, tau=Math.min(u/lento,dur);
  let k=1; while(k<T.length-1&&T[k].t<tau) k++; const A=T[k-1], B=T[k], f=clamp((tau-A.t)/Math.max(1e-9,B.t-A.t),0,1);
  const v=A.v+(B.v-A.v)*f, N=llanta('mojado',esc.Fz,esc.p), m=esc.Fz/G, q=inversa(N,-m*r.a,m*v*v/esc.R);
  return {piso:'mojado',Fz:esc.Fz,p:esc.p,sb:-q.kap,al:q.alf/RAD,V:Math.max(v,0.5),fase:'maniobra',man:{v,tau,dur,s:A.s+(B.s-A.s)*f,ok:q.ok}};
}
/** Todo lo que se sabe de la llanta en este instante. */
function calculaEstado(){
  const e=entradas(), N=llanta(e.piso,e.Fz,e.p), kap=-e.sb, alf=e.al*RAD, f=fuerzas(N,kap,alf);
  return {e,N,piso:e.piso,Fz:N.Fz,p:N.p,sb:e.sb,al:e.al,kap,alf,f,V:e.V,fase:e.fase,man:e.man||null,
    Pcal:potenciaFriccion(f,kap,alf,e.V),desliza:f.s>1.0001};
}

const COL_U=[new THREE.Color('#34d399'),new THREE.Color('#ffd54a'),new THREE.Color('#ff5a4a')];

  if(lim) M.huella.color.copy(colorUso(f.u,ST.desliza)); else M.huella.color.set('#8fa6b3');
  // las flechas de fuerza: 1 kN = KF metros

  ponFlecha(FL.fy,Math.abs(f.Fy)/1000*KF,f.Fy>=0?Math.PI/2:-Math.PI/2);
  ponFlecha(FL.fr,Math.hypot(f.Fx,f.Fy)/1000*KF,Math.atan2(f.Fy,f.Fx));

  const tasaHumo=f.s>1.6?8+14*clamp(f.s-1.6,0,1.5):0;
  if(!EST.pausa&&!REDUCIDO){ SIM.acc+=(tasaPolvo+tasaHumo)*dtS; let hum=tasaHumo/(tasaPolvo+tasaHumo+1e-9);
    while(SIM.acc>=1){ SIM.acc-=1; const humo=Math.random()<hum, lado=Math.random()<0.5?-1:1, ox=(Math.random()-0.5)*0.05;
      if(humo) emite(cx+ox,cz+(Math.random()-0.5)*B_W*0.8,1,-vv*0.7+(Math.random()-0.5)*0.08,0.20+Math.random()*0.15,(Math.random()-0.5)*0.12,0.9+Math.random()*0.4,0.020+Math.random()*0.016);
      else emite(cx+ox+nx*lado*B_W*0.45,cz+nz*lado*B_W*0.45,0,-vv*0.5+(Math.random()-0.2)*0.15,0.35+Math.random()*0.55,lado*(0.35+Math.random()*0.5),0.55+Math.random()*0.35,0.012+Math.random()*0.012); } }
  for(let i=0;i<NPAR;i++){ const p=PAR[i];
    if(p.vida>0&&!EST.pausa){ p.vida-=dtS; p.x+=p.vx*dtS; p.y+=p.vy*dtS; p.z+=p.vz*dtS; if(p.tipo===0){ p.vy-=2.4*dtS; if(p.y<0.004){ p.y=0.004; p.vy=0; p.vx*=0.6; p.vz*=0.6; } } else { p.vx*=0.96; p.vz*=0.96; } }
    const a=p.vida>0?p.vida/p.vida0:0, s=p.tipo===1?p.r*(1.8-0.8*a):p.r*(0.5+0.5*a);

  if(!ult||Math.hypot(ult.x-px,ult.y-py)>8||SIM.ver!==SIM.verH){ if(SIM.ver!==SIM.verH){ H.length=0; SIM.verH=SIM.ver; } H.push({x:px,y:py}); if(H.length>110) H.shift(); }

/* ===================== 14. CÁMARAS =====================
   La escena se encuadra con el hueco que dejan la guía y el dock: la cámara se aleja lo justo para que la caja del
   «objeto» (ancho × alto en metros) quepa entera en ese hueco, y la proyección se desplaza para centrarla en él.
   Además el objeto nunca pasa del 66 % del alto del lienzo. */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}
const VISTAS={
  banco:{dir:V3(-0.62,0.40,1),anc:()=>V3(0.05,0.62,0),toff:V3(0,0,0),obj:()=>({w:innerWidth<innerHeight*0.9?2.5:2.35,h:2.25}),fov:32,tope:0.66},
  huella:{dir:V3(-0.45,0.22,1),anc:()=>V3(0,0.10,0),toff:V3(0,0,0),obj:()=>({w:0.95,h:0.62}),fov:32,tope:0.66},
  cenit:{dir:V3(-0.10,1,0.34),anc:()=>V3(0,0.25,0),toff:V3(0,0,0),obj:()=>({w:innerWidth<innerHeight*0.9?2.1:2.9,h:2.2}),fov:32,tope:0.80},
  lado:{dir:V3(0,0.12,1),anc:()=>V3(0,0.62,0),toff:V3(0,0,0),obj:()=>({w:2.0,h:2.1}),fov:32,tope:0.66},
};
const CAM={off:V3(-1.5,1.2,6),toff:V3(0,0,0),auto:true,previo:null,k:1,dur:1};
function fovVista(v){ return innerWidth<innerHeight*0.9?44:VISTAS[v].fov; }
function distanciaFit(w,h,fov,tope){
  const Hu=huecoLibre(), W=innerWidth, Hh=innerHeight, tv=Math.tan(fov*Math.PI/360), th=tv*(W/Hh);
  const wF=Math.max(80,Hu.x1-Hu.x0)/W, hF=Math.max(80,Hu.y1-Hu.y0)/Hh;
  const D=1.06*Math.max(w/(2*th*wF),h/(2*tv*hF));
  return Math.max(D,h/(2*tv*(tope||0.66)));
}
function ofsDeseado(v){
  const V=VISTAS[v], o=V.obj(), fov=fovVista(v), D=distanciaFit(o.w,o.h,fov,V.tope);
  return {off:V.dir.clone().normalize().multiplyScalar(D),toff:V.toff.clone(),fov};
}
function ponVista(v,dur){
  EST.vista=v; fantasmaLlanta(v==='huella'); CAM.auto=true; CAM.dur=dur===undefined?1.0:dur;
  if(typeof pintaBarras==='function') pintaBarras();
  if(CAM.dur<=0.01){ const A=VISTAS[v].anc(), d=ofsDeseado(v); CAM.off.copy(d.off); CAM.toff.copy(d.toff); camera.fov=d.fov; camera.updateProjectionMatrix();
    camera.position.copy(A).add(CAM.off); controls.target.copy(A).add(CAM.toff); CAM.previo=A.clone(); }
}
function pasaCam(dt){
  const V=VISTAS[EST.vista], P=V.anc();
  if(CAM.auto){
    const d=ofsDeseado(EST.vista), k=1-Math.exp(-dt/Math.max(0.05,(CAM.dur||1)*0.30));
    CAM.off.lerp(d.off,k); CAM.toff.lerp(d.toff,k);
    if(Math.abs(camera.fov-d.fov)>0.05){ camera.fov+=(d.fov-camera.fov)*k; camera.updateProjectionMatrix(); }
    camera.position.copy(P).add(CAM.off); controls.target.copy(P).add(CAM.toff);
  } else if(CAM.previo){ const dP=P.clone().sub(CAM.previo); camera.position.add(dP); controls.target.add(dP); }

  if(EST.modo==='recorrido') h+=htmlTour();
  else if(EST.modo==='explorar') h+=`<div class="hmandos">
    <div class="cg"><div class="cl">Piso</div><div class="seg" id="segPiso">${PISOS.map(k=>`<button class="b ${EST.sup===k?'on':''}" data-piso="${k}">${NOMBRE_PISO[k]}</button>`).join('')}</div></div>
    <div class="cg"><div class="cl"><div>Carga sobre la llanta</div><b id="vF">${fN(EST.Fz/1000,1)} kN</b></div><input type="range" id="rF" min="1500" max="7000" step="100" value="${EST.Fz}" aria-label="Carga sobre la llanta en kilonewtons">
      <div class="marcas"><span>1,5</span><span>7</span></div></div>
    <div class="cg"><div class="cl"><div>Presión de inflado</div><b id="vP">${fN(EST.p,1)} bar</b></div><input type="range" id="rP" min="1.4" max="3.2" step="0.1" value="${EST.p}" aria-label="Presión de inflado en bar">
      <div class="marcas"><span>1,4</span><span>3,2</span></div></div>
    <div class="cg"><div class="cl"><div>Frenado (cuánto resbala)</div><b id="vB">${fN(EST.auto?0:EST.sb*100)} %</b></div><input type="range" id="rB" min="0" max="100" step="1" value="${Math.round(EST.sb*100)}" aria-label="Resbalamiento al frenar en porcentaje">
      <div class="marcas"><span>0</span><span>100</span></div></div>
    <div class="cg"><div class="cl"><div>Giro (cuánto se desvía)</div><b id="vG">${fN(EST.auto?0:EST.al,1)} °</b></div><input type="range" id="rG" min="0" max="20" step="0.5" value="${EST.al}" aria-label="Ángulo de desvío en grados">
      <div class="marcas"><span>0</span><span>20</span></div></div>
    <div class="fila"><button class="b ${EST.auto?'on':''}" id="btnAuto">${EST.auto?'Barrido automático: sí':'Barrido automático: no'}</button></div></div>`;
  else h+=htmlGuia();
  const N=SIM.st?SIM.st.N:llanta(EST.sup,EST.Fz,EST.p);
  h+=`<div class="hdet"><details id="dEc"><summary>Ecuaciones</summary><div class="cuerpo">
    <div class="formula">F = D·sen( C·atan( B·x − E·(B·x − atan(B·x)) ) ) · D = μ·F<sub>z</sub></div>
    <div class="fl"><b>Fórmula mágica de Pacejka.</b> x es el resbalamiento (al frenar) o el ángulo de desvío (al girar). En el piso elegido, la llanta da un pico de <b>${kN(N.Dx)} kN</b> al frenar (a ${fN(N.kp*100,1)} % de resbalamiento) y de <b>${kN(N.Dy)} kN</b> al girar (a ${fN(Math.atan(N.tp)/RAD,1)}°).</div>
    <div class="formula">(F<sub>x</sub>/D<sub>x</sub>)² + (F<sub>y</sub>/D<sub>y</sub>)² ≤ 1</div>
    <div class="fl"><b>Elipse de fricción.</b> La fuerza al frenar y la fuerza al girar comparten el mismo agarre; el borde de la elipse es el límite.</div>
    <div class="formula">μ(F<sub>z</sub>) = μ₀·[1 + dμ·(F<sub>z</sub> − F<sub>z0</sub>)/F<sub>z0</sub>] · A = F<sub>z</sub>/p</div>
    <div class="fl"><b>Carga y presión.</b> Con dμ = ${fN(DMU,2)} el agarre por kN baja al cargar más. La huella de ahora mide <b>${fN(N.area*1e4,0)} cm²</b> (${fN(N.largo*100,1)} × ${fN(ANCHO*100,1)} cm).</div>
  </div></details>
  <details id="dSim"><summary>Simplificaciones</summary><div class="cuerpo"><ul class="no">
    <li>Una sola llanta de ensayo sobre una cinta. El cuarto de coche del reto no tiene transferencia de carga entre ruedas ni suspensión.</li>
    <li>Fórmula de Pacejka con parámetros <b>didácticos</b> de libro (no de un fabricante). El agarre del mojado es el de un ensayo a velocidad moderada: <b>no hay aquaplaning</b> ni efecto de la velocidad.</li>
    <li>Frenar y girar a la vez se combina con la <b>elipse de fricción</b> a partir de las dos curvas puras; no son las funciones de peso completas de Pacejka. Sin temperatura ni desgaste.</li>
    <li>La presión y la carga actúan con correlaciones sencillas. Lo que se ve va a 1/10 de la velocidad real. No es CFD, FEM ni un ensayo normalizado.</li>
  </ul><div class="src">Pacejka, <i>Tire and Vehicle Dynamics</i> · Milliken y Milliken, <i>Race Car Vehicle Dynamics</i> · Kamm (1934), círculo de fricción.</div></div></details></div>`;
  H.innerHTML=h; H.classList.toggle('guia',EST.modo==='reto'); enlazaHUD(); ajustaHoja();
}
function enlazaHUD(){
  const H=el('hud');
  H.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  H.querySelectorAll('[data-tour]').forEach(b=>b.onclick=()=>accionTour(b.dataset.tour));
  H.querySelectorAll('[data-piso]').forEach(b=>b.onclick=()=>{ EST.sup=b.dataset.piso; SIM.ver++; pintaHUD(); pintaDockFijo(); });
  const lig=(id,campo,ev,fmt,man)=>{ const e=el(id); if(e) e.oninput=()=>{ EST[campo]=+e.value; EST.fzAuto=false; if(man) EST.auto=false; el(ev).textContent=fmt(EST[campo]); SIM.ver++; if(man){ const b=el('btnAuto'); if(b){ b.classList.remove('on'); b.textContent='Barrido automático: no'; } } }; };
  lig('rF','Fz','vF',v=>fN(v/1000,1)+' kN'); lig('rP','p','vP',v=>fN(v,1)+' bar');
  const rb=el('rB'), rg=el('rG');
  if(rb) rb.oninput=()=>{ EST.auto=false; EST.sb=+rb.value/100; el('vB').textContent=fN(rb.value)+' %'; const b=el('btnAuto'); b.classList.remove('on'); b.textContent='Barrido automático: no'; };
  if(rg) rg.oninput=()=>{ EST.auto=false; EST.al=+rg.value; el('vG').textContent=fN(rg.value,1)+' °'; const b=el('btnAuto'); b.classList.remove('on'); b.textContent='Barrido automático: no'; };
  if(el('btnAuto')) el('btnAuto').onclick=()=>{ EST.auto=!EST.auto; if(EST.auto) EST.demo='ciclo'; pintaHUD(); };
  H.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>handleAction(b.dataset.act,b));
  const hint=el('btnHint'); if(hint) hint.onclick=()=>handleAction('hint-v',null);
}

/* ===================== 16. EL DOCK (derecha): cifras y gráficas DOM ===================== */
const FUENTE="'Outfit',system-ui,sans-serif";
function lienzo(id){ const box=el(id), c=box.querySelector('canvas'); return {box,c,ctx:c.getContext('2d'),w:0,h:0,dpr:1}; }
function abre(L){ const r=L.box.getBoundingClientRect(), dpr=Math.min(3,window.devicePixelRatio||1);
  const w=Math.max(20,Math.round(r.width)), h=Math.max(20,Math.round(r.height));
  if(L.w!==w||L.h!==h||L.dpr!==dpr){ L.c.width=Math.round(w*dpr); L.c.height=Math.round(h*dpr); L.w=w; L.h=h; L.dpr=dpr; }
  const x=L.ctx; x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h); return x; }
function txt(x,t,px,py,col,size,align,peso){ x.fillStyle=col; x.font=(peso||'600')+' '+(size||11)+'px '+FUENTE; x.textAlign=align||'left'; x.textBaseline='alphabetic'; x.fillText(t,px,py); }
function raya(x,x1,y1,x2,y2,col,w,dash){ x.strokeStyle=col; x.lineWidth=w||1; x.setLineDash(dash||[]); x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke(); x.setLineDash([]); }
const LFU=lienzo('gFu'), LTR=lienzo('gTr'), LFR=lienzo('gFr'), LSP=lienzo('gSp');
const txtAncho=(x,t)=>{ x.font='500 8px '+FUENTE; return x.measureText(t).width; };
const sinDatos=(x,Wd,Hd,t)=>{ txt(x,t||'—',Wd/2,Hd/2+4,'#7f939d',t?11:14,'center','500'); };
const COL={x:'#ff8a3d',y:'#4fd2f5',u:'#ffd54a',ref:'#8da2ad',bad:'#ff5a4a',good:'#34d399'};
const GRID='rgba(170,200,215,0.10)', EJE='#4b6674', TXT='#93abb8';
const PISO_COL={seco:'#cfd8dd',mojado:'#6fb6ff',nieve:'#e6f1ff',hielo:'#8fe3ff'};
/** Marcas de un eje: valores «redondos» con su etiqueta, sin amontonarse. */
function ejeY(x,X0,X1,Y,v0,v1,paso,fmt){ x.__uy=undefined; for(let v=v0;v<=v1+1e-9;v+=paso){ raya(x,X0,Y(v),X1,Y(v),v===0?'rgba(200,220,230,0.35)':GRID); if(Math.abs(Y(v)-(x.__uy===undefined?-99:x.__uy))>=11){ x.__uy=Y(v); txt(x,fmt(v),X0-4,Y(v)+3,TXT,8.5,'right','500'); } } }

/* ---- Frenar y girar a la vez: la elipse de fricción ---- */
function pintaElipse(){
  const x=abre(LFU), Wd=LFU.w, Hd=LFU.h, S=SIM.st; if(!S) return;
  const lim=limiteVisible(), Nr=PISOS.map(p=>llanta(p,S.Fz,S.p));
  const dem=S.man?S.f:null;
  const X0=30, Xr=Math.min(Wd-8,Wd*0.66), Y0=8, Y1=Hd-17, mxX=Nr[0].Dx*1.07/1000, mxY=Nr[0].Dy*1.12/1000;
  const k=Math.min((Xr-X0)/mxX,(Y1-Y0)/mxY), X=v=>X0+v*k, Y=v=>Y1-v*k;
  // retícula cada kN
  for(let v=0;v<=mxX+1e-9;v+=1){ raya(x,X(v),Y1,X(v),Y1+3,EJE); raya(x,X(v),Y0,X(v),Y1,v===0?'rgba(200,220,230,0.35)':GRID); txt(x,fN(v),X(v),Hd-4,TXT,8.5,'center','500'); }
  x.__uy=undefined; for(let v=0;v<=mxY+1e-9;v+=1){ raya(x,X0,Y(v),Xr,Y(v),v===0?'rgba(200,220,230,0.35)':GRID); if(Math.abs(Y(v)-(x.__uy===undefined?-99:x.__uy))>=11){ x.__uy=Y(v); txt(x,fN(v),X0-4,Y(v)+3,TXT,8.5,'right','500'); } }
  txt(x,'kN',X0+3,Y0+8,TXT,8.5,'left','600'); txt(x,'frenar →',Xr,Hd-4,TXT,8.5,'right','600'); txt(x,'girar ↑',X0+22,Y0+8,TXT,8.5,'left','600');
  const cuarto=(N,col,w,rell)=>{ x.beginPath(); for(let a=0;a<=90;a+=2){ const r=a*RAD, px=X(N.Dx/1000*Math.cos(r)), py=Y(N.Dy/1000*Math.sin(r)); a?x.lineTo(px,py):x.moveTo(px,py); }
    if(rell){ x.lineTo(X(0),Y(0)); x.closePath(); x.fillStyle=rell; x.fill(); } x.strokeStyle=col; x.lineWidth=w; x.stroke(); };
  if(lim){
    let ultX=1e9; Nr.forEach((N,i)=>{ if(PISOS[i]===S.piso) return; x.setLineDash([3,3]); cuarto(N,PISO_COL[PISOS[i]]+'88',1.1); x.setLineDash([]); const lx=X(N.Dx/1000)-2; if(ultX-lx>36&&N.Dx/1000*k>14){ txt(x,NOMBRE_PISO[PISOS[i]].toLowerCase(),lx,Y(0)-3,PISO_COL[PISOS[i]]+'cc',8,'right','500'); ultX=lx-txtAncho(x,NOMBRE_PISO[PISOS[i]].toLowerCase()); } });
    cuarto(S.N,S.f.u>0.97||S.desliza?COL.bad:COL.u,2.2,'rgba(255,213,74,0.10)');
  } else txt(x,'el límite se muestra al validar',X0+8,Y0+22,'#7f939d',10,'left','500');
  // el rastro y el punto de trabajo
  const Hh=SIM.hist; if(Hh.length>1){ for(let i=1;i<Hh.length;i++){ x.strokeStyle='rgba(255,255,255,'+(0.06+0.5*i/Hh.length)+')'; x.lineWidth=1.3; x.beginPath(); x.moveTo(X(Hh[i-1].x/1000),Y(Hh[i-1].y/1000)); x.lineTo(X(Hh[i].x/1000),Y(Hh[i].y/1000)); x.stroke(); } }
  const px=X(Math.abs(S.f.Fx)/1000), py=Y(Math.abs(S.f.Fy)/1000);
  raya(x,px,py,px,Y1,COL.x+'aa',1,[2,3]); raya(x,px,py,X0,py,COL.y+'aa',1,[2,3]); raya(x,X0,Y1,px,py,'rgba(255,255,255,0.7)',1.5);
  x.fillStyle='#fff'; x.beginPath(); x.arc(px,py,3.8,0,DOSPI); x.fill(); x.strokeStyle=COL.u; x.lineWidth=1.5; x.stroke();
  // lo que queda para girar si ya se está frenando: la lección de la elipse, en una barra (100 % = todo el agarre lateral de ESTA llanta)
  if(lim&&Wd>260){ const bx=Xr+16, bw=Math.min(22,(Wd-bx-62)), rest=lateralRestante(S.N,Math.abs(S.f.Fx))/S.N.Dy, usado=Math.abs(S.f.Fy)/S.N.Dy, Yb0=Y0+14, Yr=Y1-(Y1-Yb0)*rest, Yu=Y1-(Y1-Yb0)*Math.min(1,usado);
    if(bw>8){ x.strokeStyle='rgba(200,220,230,0.5)'; x.lineWidth=1; x.strokeRect(bx,Yb0,bw,Y1-Yb0); x.fillStyle='rgba(79,210,245,0.35)'; x.fillRect(bx+1,Yr,bw-2,Y1-Yr);
      raya(x,bx-3,Yu,bx+bw+3,Yu,COL.y,2); txt(x,'queda para girar',bx-2,Y0+8,TXT,8.5,'left','500'); txt(x,fN(rest*100,0)+' %',bx+bw+5,Math.max(Yb0+9,Math.min(Y1-3,Yr+4)),COL.y,9.5,'left','700'); } }
  const dm=S.man; el('t_fu').textContent=dm?'demanda de la curva':(lim?'el borde es el límite':'');
}

  el('leyFu').innerHTML=lim?`<span class="lg"><i style="--c:${COL.u}"></i>límite de esta llanta</span><span class="lg"><i class="dash" style="--c:#8da2ad"></i>otros pisos</span><span class="lg"><i style="--c:#fff"></i>fuerza ahora</span>`

/* ---- Frenar: fuerza frente al resbalamiento ---- */
function pintaFrenar(){
  const x=abre(LTR), Wd=LTR.w, Hd=LTR.h, S=SIM.st; if(!S) return; const N=S.N, ref=llanta('seco',S.Fz,S.p);
  const X0=26, X1=Wd-6, Y0=6, Y1=Hd-14, mx=Math.max(ref.Dx,N.Dx)*1.1/1000, X=v=>X0+v*(X1-X0), Y=v=>Y1-v/mx*(Y1-Y0);

  const ox=X(S.sb), oy=Y(Math.abs(S.f.Fx)/1000);

  txt(x,'kN',X0+3,Y0+8,TXT,8.5,'left','600');

/* ---- Girar: fuerza frente al ángulo de desvío ---- */

/* ---- Más carga, ¿más agarre? ---- */
function pintaCarga(){
  const x=abre(LSP), Wd=LSP.w, Hd=LSP.h, S=SIM.st; if(!S) return;
  const X0=26, X1=Wd-6, Y0=5, Y1=Hd-14, zmax=7.5, ymx=llanta(S.piso,zmax*1000,S.p).Dy*1.08/1000, X=z=>X0+(z-1)/(zmax-1)*(X1-X0), Y=v=>Y1-v/ymx*(Y1-Y0);
  ejeY(x,X0,X1,Y,0,ymx,1,v=>fN(v));
  for(const z of [1,2,3,4,5,6,7]) txt(x,String(z),X(z),Hd-3,TXT,8.5,'center','500');
  const D=z=>llanta(S.piso,z*1000,S.p).Dy/1000, z0=FZ0/1000, d0=D(z0);
  raya(x,X(1),Y(d0/z0*1),X(zmax),Y(d0/z0*zmax),'rgba(190,205,215,0.55)',1.1,[4,3]);

/* ===================== 19. DISPOSICIÓN: ANCHO, ESTRECHO, MÓVIL =====================
   Si no caben guía, escena y dock lado a lado (el marco de la plataforma, una tableta), la escena va arriba
   y guía e instrumentos comparten una hoja con pestañas abajo. */
function disposicion(){
  const W=innerWidth, b=document.body;
  const estrecho=W<1080, movil=W<640;
  b.classList.toggle('estrecho',estrecho); b.classList.toggle('movil',movil); b.classList.toggle('ancho',estrecho&&!movil);
  if(estrecho){ if(!b.classList.contains('t-hud')&&!b.classList.contains('t-panel')) b.classList.add('t-hud'); ajustaHoja(); }
  el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('on',b.classList.contains('t-'+t.dataset.tab)));
}
function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.40:0.43),240,450));
  let hh=base; const hud=el('hud');
  if(movil&&b.classList.contains('t-panel')) hh=Math.round(clamp(H*0.55,240,540));
  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;
    hh=Math.round(clamp(pide,240,Math.max(base,H*(movil?0.45:0.56)))); }
  const ant=parseFloat(b.style.getPropertyValue('--hojaH'))||0;
  if(Math.abs(ant-hh)>1){ b.style.setProperty('--hojaH',hh+'px'); colocaBarras(); centraEnHueco(); }
}

   1 · Calcula (la velocidad máxima en una curva mojada sin frenar), 2 · Ajusta (cuánto frenar en la curva sin pasar el
   límite: la ventana es INTERIOR —frenar poco no baja la velocidad, frenar mucho le quita a la llanta el agarre para girar—
   y el límite sólo aparece al validar) y 3 · Diagnostica (¿mojado, presión baja o sobrecarga?, sólo con los síntomas del dock),

function accionTour(a){
  if(a==='next'&&TOURI.i<TOUR.length-1) TOURI.i++;
  else if(a==='prev'&&TOURI.i>0) TOURI.i--;
  else if(a==='skip'||a==='explorar'){ setMode('explorar'); return; }
  else if(a==='reto'){ setMode('reto'); return; }
  aplicaPasoTour(); pintaHUD(); pintaDockFijo(); pintaBarras();
}

/* ---------- Fase 1 · Calcula la velocidad máxima ---------- */
function sorteaCaso1(){ const p=GUIA.r1&&GUIA.r1.esc.id; let e; do{ e=pickOne(ESCENARIOS); }while(e.id===p);
  const N=llanta('mojado',e.Fz,e.p), m=e.Fz/G; GUIA.r1={esc:e,Fz:e.Fz,p:e.p,R:e.R,N,m,ans:Math.sqrt(N.Dy/m*e.R)*3.6}; }
function numeroDe(txt){ const raw=String(txt||'').trim().replace(/\s/g,'').replace(/ /g,'').replace(',','.'); return parseFloat(raw); }
function checkPredice(){
  const v=numeroDe((el('ansV')||{}).value), r=GUIA.r1, ok=r.ans;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe la velocidad en kilómetros por hora (con coma o punto decimal).'); return; }
  RETO.intentos++;
  if(Math.abs(v-ok)<=Math.max(1.5,0.05*ok)){
    RETO.fallos1=0; sonido.bien();
    feedback('good','¡Correcto! ✓',`v = √(F·R / m) = √(${kN(r.N.Dy)} kN · ${fN(r.R)} m / ${fN(r.m,0)} kg) = <b>${fN(ok,1)} km/h</b>. Es el máximo <b>sin frenar</b>. Si además frenas, parte del agarre se va en frenar y la curva se toma más despacio: eso es lo que ajustarás ahora.`,true);
    paso('decide'); prepararDecide();
  } else {
    RETO.fallos1++; sonido.mal(); const d=v>ok?'alta':'baja';
    if(RETO.fallos1>=3){ RETO.fallos1=0; RETO.resiembras++; sorteaCaso1(); feedback('bad','Tres intentos fallidos','Cambia el caso. Recuerda: la fuerza lateral máxima sostiene al coche en la curva (F = m·v²/R) y la masa de esta llanta es su carga entre g.'); pintaHUD(); }
    else { feedback('bad','Revisa el cálculo',`Tu velocidad (${fN(v,1)} km/h) sale ${d}. Usa la fuerza «Máx. al girar» del dock, la masa m = carga / 9,81 y pasa el resultado de m/s a km/h. (intentos fallidos: ${RETO.fallos1}/3)`); const t=el('d_try'); if(t) t.textContent=RETO.fallos1; }
  }
}

/* ---------- Fase 2 · Ajusta cuánto frenar en la curva ---------- */
function prepararDecide(){
  let e; do{ e=pickOne(ESCENARIOS); }while(GUIA.r2&&ESCENARIOS.length>1&&e.id===GUIA.r2.esc.id&&RETO.resiembras>0);
  GUIA.r2={esc:e,a:0.5,validado:false,res:null,intentos:0}; SIM.t=0; SIM.ver++; SIM.hist.length=0;
  pintaHUD(); pintaDockFijo();
}
function validarDecide(){
  const r=GUIA.r2; if(!r) return;
  const R=evaluaManiobra(r.esc,r.a), W=R.W; r.res=R; r.validado=true; r.intentos++; RETO.intentos++; SIM.t=0; SIM.hist.length=0; SIM.ver++;
  const uso=`En la entrada la curva te pedía el <b>${fN(R.rho0*100,0)} %</b> del agarre de la llanta (lo máximo permitido es ${fN((1-MARGEN)*100,0)} %) y saliste a <b>${fN(R.vf*3.6,0)} km/h</b> (debías salir a ${fN(r.esc.vs)} o menos).`;
  if(R.ok){
    RETO.fallos2=0; sonido.bien();
    feedback('good','¡Lo conseguiste! ✓',`${uso} Frenaste a ${fN(r.a,1)} m/s². La ventana de frenado era de <b>${fN(W.amin,2)}</b> a <b>${fN(W.amax,2)} m/s²</b>: con menos no bajas la velocidad a tiempo y con más la llanta ya no tiene agarre para girar. Está en el interior, no en los extremos.`,true);
    paso('diag'); iniciaDiag();
  } else {
    RETO.fallos2++; sonido.mal(); let msg=uso+' ';
    if(R.demasiado) msg+='Frenaste tanto que a la llanta no le sobró agarre para girar: el coche se abriría de la curva.';
    else msg+='Frenaste poco: sales demasiado rápido y la siguiente recta te encuentra pasado.';
    if(RETO.fallos2>=3){ RETO.fallos2=0; RETO.resiembras++; feedback('bad','Tres validaciones sin lograrlo',msg+' Cambia el escenario.',true); prepararDecide(); }
    else { feedback('bad','Todavía no',msg+` (validaciones fallidas: ${RETO.fallos2}/3)`,true); pintaHUD(); pintaDockFijo(); }
  }
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const NOMBRE_DX={mojado:'Piso mojado',presion:'Presión baja',carga:'Sobrecarga'};
function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.k; let c; do{ c=pickOne(CASOS_DX); }while(c.k===p);
  GUIA.dx=c; GUIA.dxOk=false; GUIA.orden=barajar(CASOS_DX.map(x=>x.k)); SIM.t=0; SIM.ver++; SIM.hist.length=0;
  pintaHUD(); pintaDockFijo();
}
function diagnostica(k){
  if(!GUIA.dx||GUIA.dxOk) return; RETO.intentos++;
  if(k===GUIA.dx.k){
    GUIA.dxOk=true; RETO.fallos3=0; sonido.bien();
    feedback('good','Diagnóstico correcto ✓',explicaDx(GUIA.dx.k),true);
    paso('quiz'); iniciaQuiz();
  } else {
    RETO.fallos3++; sonido.mal();
    if(RETO.fallos3>=3){ RETO.fallos3=0; RETO.resiembras++; feedback('bad','Tres intentos fallidos','Es otro caso: la huella dice cuánta goma toca el suelo, el agarre por kN dice si hay agua o sobrecarga, y la rigidez al girar distingue una llanta blanda de una sobrecargada.',true); iniciaDiag(); }
    else { feedback('bad','No es ese',noEs(k)+` (intentos fallidos: ${RETO.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(k){
  const s=sintomas(CASOS_DX.find(c=>c.k===k));
  if(k==='mojado') return `La huella es normal (${fN(s.areaCm2,0)} cm²) pero el agarre por kN cae a ${fN(s.muX,2)} (en seco es 1,00): es el piso, no la llanta. El agua baja el límite de la elipse.`;
  if(k==='presion') return `La huella creció a ${fN(s.areaCm2,0)} cm² (A = carga/presión) y la rigidez al girar bajó a ${fN(s.rigidez,0)} N/° (lo normal son 856): la llanta está blanda porque le falta presión.`;
  return `La huella creció a ${fN(s.areaCm2,0)} cm² pero la rigidez subió a ${fN(s.rigidez,0)} N/° y el agarre por kN bajó a ${fN(s.muX,2)}: la llanta lleva demasiada carga y, por la sensibilidad de carga, rinde menos por cada kN.`;
}
function noEs(k){
  if(k==='mojado') return 'La huella es mucho más grande de lo normal; el agua no cambia el tamaño de la huella.';
  if(k==='presion') return 'Compara la rigidez al girar con la normal: ¿una llanta blanda tendría la misma rigidez o más?';
  return 'Compara la rigidez al girar con la normal: una llanta sobrecargada no se vuelve más blanda.';
}
const QUIZ=[
  {q:'Una llanta frena en el pico de su curva. Si frena todavía más hasta bloquearse, ¿qué pasa con la fuerza de frenado?',ok:'Baja: pasado el pico la llanta pierde agarre',mal:['Sigue subiendo hasta el máximo','Se queda igual','Se vuelve cero de golpe']},
  {q:'Un coche va en curva y frena fuerte. ¿Qué le pasa a la fuerza lateral que puede dar la llanta?',ok:'Disminuye: el agarre es uno solo y se reparte entre frenar y girar',mal:['Aumenta, porque la llanta se aprieta más','No cambia: frenar y girar son independientes','Se duplica']},
  {q:'Un coche cargado lleva el doble de peso sobre cada llanta. ¿Qué pasa con el agarre máximo?',ok:'Aumenta, pero menos del doble (sensibilidad de carga)',mal:['Se duplica exactamente','No cambia','Se reduce a la mitad']},
];
function iniciaQuiz(){ GUIA.quizN=0; cargaPregunta(); }
function cargaPregunta(){ const Q=QUIZ[GUIA.quizN], opts=barajar([Q.ok,...Q.mal]); GUIA.quiz={q:Q.q,opts,ok:opts.indexOf(Q.ok)}; GUIA.quizResp=-1; GUIA.quizCorrecta=GUIA.quiz.ok; pintaHUD(); }
function respondeQuiz(i){
  if(GUIA.quizResp>=0) return; GUIA.quizResp=i; const ac=i===GUIA.quiz.ok; if(ac) RETO.quizAcierto++;
  if(ac) sonido.bien(); else sonido.mal();
  const ult=GUIA.quizN>=QUIZ.length-1;
  feedback(ac?'good':'bad',ac?'Correcto ✓':'No es esa',(ac?'':'La respuesta era: <b>'+GUIA.quiz.opts[GUIA.quiz.ok]+'</b>. ')+(ult?'Terminaste el laboratorio.':'Sigue con la siguiente.'),true);
  pintaHUD();
  if(ult){ RETO.hecho=true; paso('completo'); }
}
function siguientePregunta(){ if(GUIA.quizN<QUIZ.length-1){ GUIA.quizN++; cargaPregunta(); } }

/* ---------- el enrutador de acciones ---------- */
function paso(p){ GUIA.paso=p; GUIA.phase=({predice:0,decide:1,diag:2,quiz:2,completo:2})[p]; SIM.t=0; SIM.ver++; SIM.hist.length=0;
  if(EST.modo==='reto'){ ponVista(p==='predice'?'cenit':'banco',0.8); pintaHUD(); pintaDockFijo(); } }
function handleAction(act,btn){
  switch(act){
    case 'check-v': checkPredice(); break;
    case 'hint-v':
      if(RETO.pistas===0){ RETO.pistas=1; feedback('good','Pista 1 de 2','Lo que sostiene al coche en la curva es la fuerza lateral de la llanta: F = m·v²/R. La masa que carga esta llanta es m = carga / g (con g = 9,81 m/s²).'); }
      else if(RETO.pistas===1){ RETO.pistas=2; feedback('good','Pista 2 de 2','Despeja: v = √(F·R/m), con F en newtons (1 kN = 1 000 N) y v en m/s. Para pasar a km/h, multiplica por 3,6.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break;
    case 'validar': validarDecide(); break;
    case 'dx-mojado': diagnostica('mojado'); break; case 'dx-presion': diagnostica('presion'); break; case 'dx-carga': diagnostica('carga'); break;
    case 'quiz-0': respondeQuiz(0); break; case 'quiz-1': respondeQuiz(1); break; case 'quiz-2': respondeQuiz(2); break; case 'quiz-3': respondeQuiz(3); break;
    case 'quiz-sig': siguientePregunta(); break;
    case 'restart': location.reload(); break;
  }
}

function htmlGuia(){

/* ---------- los modos ---------- */

}
let fbTimer=null;

el('fbX').onclick=()=>el('feedback').classList.remove('show');
document.addEventListener('input',e=>{ const t=e.target; if(!t||t.id!=='r2A'||!GUIA.r2||GUIA.paso!=='decide') return;
  GUIA.r2.a=+t.value; GUIA.r2.validado=false; el('v2A').textContent=fN(+t.value,1)+' m/s²'; SIM.hist.length=0; SIM.ver++; });

/* ===================== 21. SONIDO (sintetizado) =====================
   Un chirrido de goma, muy atenuado, que sólo suena cuando la llanta pasa el pico y resbala; y los avisos de acierto y fallo. */
const sonido=(function(){
  let ctx=null,on=true,master=null,ult=0,ch=null,cg=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      ch=ctx.createOscillator(); cg=ctx.createGain(); ch.type='sawtooth'; ch.frequency.value=700; cg.gain.value=0; const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1200; bp.Q.value=2; ch.connect(bp); bp.connect(cg); cg.connect(master); ch.start();
    }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); ult=f; }
  return {init,
    chirrido:(nivel)=>{ if(!ctx||!ch) return; const t=ctx.currentTime; ch.frequency.setTargetAtTime(620+380*nivel,t,0.1); cg.gain.setTargetAtTime(on&&nivel>0?0.010*Math.min(1,nivel+0.3):0,t,0.1); },
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }, get freq(){ return ult; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});

/* ===================== 22. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.max(Math.min(devicePixelRatio,alta?2:1.5),Math.min(devicePixelRatio,1.5)>1?1.25:1));
  const ms=alta?2048:1024; if(LUZ.sol.shadow.mapSize.x!==ms){ LUZ.sol.shadow.mapSize.set(ms,ms); if(LUZ.sol.shadow.map){ LUZ.sol.shadow.map.dispose(); LUZ.sol.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); if(typeof ponVista==='function') ponVista(EST.vista,0.001); centraEnHueco();
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 23. EL LAZO: UN SOLO RELOJ =====================
   El tiempo avanza dt·velocidad en cada cuadro, y con ESE tiempo se mueven la llanta, la cinta, la huella, las flechas y la
   elipse, y se pintan las gráficas del dock. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0, tSon=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  const dtS=EST.pausa?0:dt*EST.vel; SIM.dtReal=dt;
  aplicaEscena(dtS,dtS);
  pasaCam(dt);
  if(t-tSon>0.3){ tSon=t; const S=SIM.st; sonido.chirrido(S&&S.desliza&&!EST.pausa?clamp((S.f.s-1)/1.2,0,1):0); }
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); sincronizaMandos(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaGraficas(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos();
}

SIM.t=1.2;

/* ===================== 25. GANCHOS DE PRUEBA ===================== */
/** Mide el objeto en lo VISIBLE: se pinta sin plataforma, suelo ni fondo sobre magenta puro y se toma la caja de los píxeles que no son magenta. */
function mideObjeto(){
