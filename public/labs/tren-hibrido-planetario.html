<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Tren Híbrido de División de Potencia — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#08201C;--panel:rgba(9,24,23,.86);--line:#1E3A34;--ink:#EAF4F1;
    --dim:#8FB3AC;--accent:#2A9D8F;--accent2:#4FD1C5;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cA:#FF8A3D;--cB:#37E0C7;--cC:#6FB6FF;--cT:#9FF3FF;--cD:#FFB347;--cDC:#FFD166;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#14201f;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#182a28}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#33b3a3}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#06120f}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#4FD1C5;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f8a85;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f948f;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#04211c}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#0a1219;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(30,58,52,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,58,52,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f8a85}
  .dk-tit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#9fbab4;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,58,52,.7);min-height:0}
  .dk-g.lev{flex:0.9 1 0;min-height:96px}
  .dk-g.map{flex:1.7 1 0;min-height:140px}
  .dk-g.st{flex:1.0 1 0;min-height:84px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c9c4;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#14201f;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfe0dc;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cT);flex:none}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(12,22,22,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,22,21,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d6d2}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,22,24,.92);border:1px solid rgba(79,209,197,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,22,24,.84);border:1px solid rgba(79,209,197,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-g.map{min-height:120px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1.15fr;grid-template-rows:auto auto auto 1fr auto;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}
  body.estrecho.ancho.t-panel .panel>.dk-fig{grid-column:1;grid-row:2/4;align-self:start}
  body.estrecho.ancho.t-panel .panel>.t-lev{grid-column:1;grid-row:4;align-self:end}
  body.estrecho.ancho.t-panel .panel>.dk-g.lev{grid-column:1;grid-row:5;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-map{grid-column:2;grid-row:2}
  body.estrecho.ancho.t-panel .panel>.dk-g.map{grid-column:2;grid-row:3/5;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-st{display:none}
  body.estrecho.ancho.t-panel .panel>.dk-g.st{grid-column:2;grid-row:5;min-height:0}
  body.estrecho.ancho.t-panel .panel>.dk-ley{display:none}
  body.estrecho.ancho.t-panel .panel>.dk-aviso{display:none}
  body.estrecho .hud details>.cuerpo{max-height:24vh}
  body.estrecho.ancho.t-hud .hud{display:grid;grid-template-columns:1fr 1.05fr;column-gap:14px;row-gap:7px;align-content:start;grid-auto-flow:row dense}
  body.estrecho.ancho .hud>.hcab,body.estrecho.ancho .hud>.modebar,body.estrecho.ancho .hud>.hdet,body.estrecho.ancho .hud>.pasos{grid-column:1}
  body.estrecho.ancho .hud>.hmandos,body.estrecho.ancho .hud>.retoBox{grid-column:2;grid-row:1/span 4}
  body.estrecho .hdet{flex-direction:row}body.estrecho .hdet>details{flex:1;min-width:0}
  body.estrecho .hdet details[open]{position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 54px);z-index:25;background:rgba(9,24,23,.97)}
  body.movil .lt{display:none} body.movil .tbar .modo,body.movil .tbar .reloj{display:none}
  body.movil .tbar{gap:6px;padding:5px 8px} body.movil .tbar .est{min-width:0}
  body.movil .dk-ley{display:none} body.movil .fg b{font-size:13.5px} body.movil .fg .fl{font-size:9.5px}
  body.movil .dk-g.lev{min-height:84px} body.movil .dk-g.map{min-height:150px} body.movil .dk-g.st{min-height:70px}
  body.movil .hud h2{font-size:15.5px} body.movil .hud .intro{font-size:11.8px;line-height:1.42}
  body.estrecho .hud{overflow-y:auto}
  body.estrecho .vbar [data-t="rot"],body.estrecho .vbar .sep.s1{display:none}
  body.estrecho.ancho .vbar{top:60px}
  body.movil .vbar{flex-wrap:nowrap;gap:3px;padding:3px 4px;top:54px} body.movil .vbar .sep{display:none} body.movil .vbar .b.sm{padding:5px 7px;font-size:11px}
  body.movil .vbar .lg{display:none}
  body.movil .tbar .lento{display:none}
  body.movil .hud{gap:6px;padding:10px 12px 9px} body.movil .hud .eyebrow{display:none}
  body.movil .modebar .b{padding:6px 4px 5px}
  body.movil .hmandos{display:grid;grid-template-columns:1.3fr 1fr;gap:6px 8px}
  body.movil .hmandos>:nth-child(1),body.movil .hmandos>:nth-child(2),body.movil .hmandos>.fila{grid-column:1/-1}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   LAB — TREN HÍBRIDO DE DIVISIÓN DE POTENCIA · ENGRANAJE PLANETARIO
   (Autotrónica · mecanica-127)

   Un transeje híbrido de división de potencia cortado por la mitad: el
   motor térmico en el portasatélites, el generador MG1 en el solar y el
   motor de tracción MG2 en la corona, que va a las ruedas. Abre en el corte
   transversal del conjunto planetario —solar de 30 dientes, tres satélites
   de 24 y corona de 78—, girando a cámara lenta con la cinemática exacta
   de Willis, y deja ver detrás la corona con el rotor de MG2.

   El dock enseña, con el MISMO estado del modelo que mueve la escena, la
   palanca de Willis, el mapa de consumo del motor con su línea de operación
   óptima, y el reparto de potencia entre motor, MG1, MG2 y batería con el SOC.

   La física (Willis, reparto de pares, pérdidas, mapa analítico del motor
   Atkinson, SOC neutro y óptimo del vehículo) está en un bloque puro que un
   script de Node extrae TAL CUAL y verifica.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO=' ';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }


/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos
   marcas— y lo prueba: lo que se prueba es lo que corre. */

/* FISICA:INICIO */
/* ---------- 1.1 El tren: dentado, vehículo, máquinas, batería ----------
   Conjunto planetario del THS (dentado publicado: sol 30, corona 78; los
   satélites salen de la geometría: Z_r = Z_s + 2·Z_p ⇒ Z_p = 24). Todo lo
   demás son valores REPRESENTATIVOS de un híbrido de 1,5 L, no datos del
   fabricante. MG2 va directo a la corona y la corona a las ruedas por una
   reducción final i_f. */
const DOSPI=2*Math.PI, RPM=Math.PI/30, G0=9.80665;
const PSD={ Zs:30, Zr:78, Zp:24, mod:1.8e-3, etaMalla:0.99 };
PSD.rho=PSD.Zs/PSD.Zr;
const VEH={ Rw:0.317, ifd:3.905, etaFD:0.97, Paux:400, m:1380, Crr:0.009, CdA:0.58, rhoAire:1.2 };
const COMB={ LHV:43.0e6, dens:745 };                    // gasolina: J/kg y g/L
/* El motor térmico (Atkinson de 1,5 L): par de plena carga parabólico —115 N·m
   hacia 4000 rpm, 57 kW a 5000— y mapa de consumo ANALÍTICO: un cuenco
   cuadrático en (régimen, par) por el trabajo útil más un gasto de vacío
   proporcional al régimen (rozamientos y bombeo). Nace de calibrar el mínimo
   (≈ 222 g/kWh = 37,7 %) con el de los Atkinson publicados; no es un mapa medido. */
const ICE={ Tpico:115, nTpico:4000, ancho:4600, nmin:1000, nmax:5200,
  b0:190, n0:2800, T0:95, cu:0.45, cv:0.60, cx:0.30, k0:0.9e-3 };
/* Máquinas eléctricas: pérdidas P = a0 + a1·|ω| + a2·ω² + k·T² (hierro, mecánicas
   y cobre) y un inversor con rendimiento fijo. */
const MG1={ nombre:'MG1', Tmax:75, Pmax:30e3, nmax:10000, a0:100, a1:0.8, a2:6e-4, k:0.5 };
const MG2={ nombre:'MG2', Tmax:400, Pmax:50e3, nmax:6500, a0:150, a1:1.0, a2:8e-4, k:0.02 };
const ETA_INV=0.975;
/* La batería: circuito equivalente (V_oc lineal en el SOC y una resistencia). */
const PACK={ Q:6.5, R:0.30, V0:190, V1:20, Pdes:21e3, Pcar:21e3, socMin:0.40, socMax:0.80 };
const vocDe=soc=>PACK.V0+PACK.V1*soc;

/* ---------- 1.2 Willis y el reparto de pares ----------
   Z_s·ω_s + Z_r·ω_r = (Z_s + Z_r)·ω_c. Con el motor en el portasatélites,
   el par se reparte T_s : T_c : T_r = Z_s : (Z_s + Z_r) : Z_r. */
const wSol=(wc,wr)=>((PSD.Zs+PSD.Zr)*wc-PSD.Zr*wr)/PSD.Zs;
const wPorta=(ws,wr)=>(PSD.Zs*ws+PSD.Zr*wr)/(PSD.Zs+PSD.Zr);
const wCorona=(ws,wc)=>((PSD.Zs+PSD.Zr)*wc-PSD.Zs*ws)/PSD.Zr;
const wSatelite=(ws,wc)=>wc-(PSD.Zs/PSD.Zp)*(ws-wc);      // giro propio del satélite (absoluto)
const reparto=Tc=>({ Ts:Tc*PSD.Zs/(PSD.Zs+PSD.Zr), Tr:Tc*PSD.Zr/(PSD.Zs+PSD.Zr) });
const wRueda=v=>v/VEH.Rw, wCoronaDe=v=>v*VEH.ifd/VEH.Rw;
/** Potencia de crucero (W) en llano: rodadura + aire. */
const potCrucero=v=>(VEH.m*G0*VEH.Crr+0.5*VEH.rhoAire*VEH.CdA*v*v)*v;

/* ---------- 1.3 El motor térmico ---------- */
function parMaxICE(w){ const n=w/RPM; return Math.max(0,ICE.Tpico*(1-Math.pow((n-ICE.nTpico)/ICE.ancho,2))); }
/** Caudal de combustible (g/s) a (ω, T). T = 0 es el motor arrastrado sin carga. */
function caudal(w,T){
  if(!(w>0)) return 0;
  const u=(w/RPM-ICE.n0)/ICE.n0, v=(T-ICE.T0)/ICE.T0;
  const b=ICE.b0*(1+ICE.cu*u*u+ICE.cv*v*v+ICE.cx*u*v);          // g/kWh del trabajo útil
  return b*Math.max(0,T)*w/1000/3600+ICE.k0*w;
}
/** Consumo específico efectivo (g/kWh): caudal ÷ potencia al freno. */
function bsfc(w,T){ const P=T*w; return P>1?caudal(w,T)*3600/(P/1000):Infinity; }
/** Para una potencia de eje, el régimen que mínima el caudal (línea de operación óptima del motor solo). */
function optimoMotor(Pe){
  let mejor=null;
  for(let n=ICE.nmin;n<=ICE.nmax;n+=10){ const w=n*RPM, T=Pe/w; if(T>parMaxICE(w)) continue;
    const f=caudal(w,T); if(!mejor||f<mejor.f) mejor={n,w,T,f}; }
  if(!mejor) return null;
  let a=Math.max(ICE.nmin,mejor.n-10), b=Math.min(ICE.nmax,mejor.n+10);        // refina por sección áurea
  const g=n=>{ const w=n*RPM, T=Pe/w; return T>parMaxICE(w)?1e9:caudal(w,T); }, fi=(Math.sqrt(5)-1)/2;
  let c=b-fi*(b-a), d=a+fi*(b-a), fc=g(c), fd=g(d);
  for(let i=0;i<60;i++){ if(fc<fd){ b=d; d=c; fd=fc; c=b-fi*(b-a); fc=g(c); } else { a=c; c=d; fc=fd; d=a+fi*(b-a); fd=g(d); } }
  const n=(a+b)/2, w=n*RPM; return { n, w, T:Pe/w, f:caudal(w,Pe/w), bsfc:caudal(w,Pe/w)*3600/(Pe/1000) };
}

/* ---------- 1.4 Una máquina eléctrica y su inversor ---------- */
const perdidaMG=(mg,w,T)=>mg.a0+mg.a1*Math.abs(w)+mg.a2*w*w+mg.k*T*T;
/** Potencia en el bus de CC (+ = sale de la batería) para una potencia en el eje (+ = la máquina entrega). */
function dcDe(mg,Psh,w,T){ const x=Psh+perdidaMG(mg,w,T); return x>=0?x/ETA_INV:x*ETA_INV; }

/* ---------- 1.5 El punto de operación ----------
   Entradas: v (m/s), Pw (W en la rueda; <0 = frenada regenerativa), régimen
   del motor we (rad/s; 0 = apagado) y par Te (N·m). `falla` ∈ null, 'mg1'
   (MG1 sin par), 'bloq' (MG1 bloqueado) o 'mg2' (MG2 sin par). */
function punto(q){
  const wr=wCoronaDe(q.v), falla=q.falla||null, S=PSD.Zs+PSD.Zr;
  let we=Math.max(0,q.we||0), Te=Math.max(0,q.Te||0);
  const Pw=(q.v>1e-9)?q.Pw:0;
  if(we<=0) Te=0;
  if(falla==='mg1'){ if(we>0) we=ICE.nmax*RPM; Te=0; }           // sin reacción en el solar el motor no empuja: se embala hasta el corte
  if(falla==='bloq'&&we>0) we=PSD.Zr*wr/S;                        // solar parado: el régimen queda atado a la corona
  const ws=falla==='bloq'?0:wSol(we,wr);
  const { Ts, Tr }=reparto(Te);
  const Pring=Pw>=0?Pw/VEH.etaFD:Pw*VEH.etaFD;                    // potencia que pide la corona
  // pérdida del engranaje: cada engrane transmite, visto desde el portasatélites, |T·(ω−ω_c)|
  const Lpsd=we>0?(1-PSD.etaMalla)*(Math.abs(Ts*(ws-we))+Math.abs(Tr*(wr-we))):0;
  const Tr_ef=wr>1e-6?Tr-Lpsd/wr:Tr;
  const Tring=wr>1e-6?Pring/wr:0;
  let T2=Tring-Tr_ef; if(falla==='mg2') T2=0;
  const P2sh=T2*wr, P1sh=-Ts*ws;
  const L1=perdidaMG(MG1,ws,Ts), L2=perdidaMG(MG2,wr,T2);
  const P1dc=dcDe(MG1,P1sh,ws,Ts), P2dc=dcDe(MG2,P2sh,wr,T2);
  const Pbat=P1dc+P2dc+VEH.Paux;
  const Pe=Te*we, mf=we>0?caudal(we,Te):0, Pfuel=mf*COMB.LHV/1000;
  // pérdidas por bloque, para el balance
  const Linv1=P1dc-(P1sh+L1), Linv2=P2dc-(P2sh+L2);
  const PringAct=(Tr_ef+T2)*wr, Pw_real=PringAct>=0?PringAct*VEH.etaFD:PringAct/VEH.etaFD;   // lo que de verdad llega a la rueda
  const Lfd=PringAct-Pw_real;
  const Vo=vocDe(q.soc??0.6), disc=Vo*Vo-4*PACK.R*Pbat;
  const I=disc>0?(Vo-Math.sqrt(disc))/(2*PACK.R):NaN, Pchem=Vo*I, Lbat=PACK.R*I*I;
  const lim={
    mg1v:Math.abs(ws)/RPM>MG1.nmax, mg1T:Ts>MG1.Tmax+1e-9, mg1P:Math.abs(P1sh)>MG1.Pmax,
    mg2T:Math.abs(T2)>MG2.Tmax+1e-9, mg2P:Math.abs(P2sh)>MG2.Pmax, mg2v:wr/RPM>MG2.nmax,
    iceT:we>0&&Te>parMaxICE(we)+1e-9, iceN:we>0&&(we/RPM>ICE.nmax+1e-9||we/RPM<ICE.nmin-1e-9),
    bat:Pbat>PACK.Pdes||Pbat<-PACK.Pcar, calado:falla==='bloq'&&we>0&&we/RPM<ICE.nmin,
  };
  return { v:q.v, Pw, Pw_real, wr, ws, wc:we, we, Te, Pe, Ts, Tr, Tr_ef, T2, Tring, Pring, Tring_act:Tr_ef+T2,
    P1sh, P2sh, P1dc, P2dc, Pbat, I, Pchem, Lbat, mf, Pfuel, bsfc:Pe>1?mf*3600/(Pe/1000):Infinity,
    L:{ ice:Pfuel-Pe, psd:Lpsd, fd:Lfd, mg1:L1, inv1:Linv1, mg2:L2, inv2:Linv2, aux:VEH.Paux, bat:Lbat },
    lim, falla, apagado:!(we>0), fisico:Number.isFinite(I) };
}
/** Balance de energía de un punto: fuente − usos (debe ser 0). */
function residuoBalance(p){
  const L=p.L, usos=p.Pw_real+L.aux+L.ice+L.psd+L.fd+L.mg1+L.inv1+L.mg2+L.inv2+L.bat;
  return p.Pfuel+p.Pchem-usos;
}
/** Residuo de la potencia MECÁNICA: Pe + P1sh + P2sh − (Pring + pérdida del engranaje). */
const residuoMecanico=p=>p.Pe+p.P1sh+p.P2sh-(p.Tring_act*p.wr+p.L.psd);

/* ---------- 1.6 SOC neutro y el óptimo del vehículo ---------- */
/** El par del motor a régimen `we` con el que la batería no se carga ni se descarga (P_bat = 0). */
function neutro(v,Pw,we,falla){
  const f=T=>punto({v,Pw,we,Te:T,falla}).Pbat, Tm=parMaxICE(we);
  if(f(0)<=0) return { Te:0, ok:true, sobra:true };
  if(f(Tm)>0) return { Te:Tm, ok:false, sobra:false };
  let a=0, b=Tm;
  for(let i=0;i<60;i++){ const c=(a+b)/2; if(f(c)>0) a=c; else b=c; }
  return { Te:(a+b)/2, ok:true, sobra:false };
}
/** El punto del motor que, con SOC neutro, da el MENOR caudal respetando los
    límites de MG1 (régimen, par), MG2 y del propio motor. null si el motor no hace falta o no hay solución. */
function optimoVehiculo(v,Pw){
  let mejor=null, evOk=false;
  for(let n=ICE.nmin;n<=ICE.nmax;n+=10){
    const we=n*RPM, r=neutro(v,Pw,we,null);
    if(r.sobra){ evOk=true; continue; }
    if(!r.ok) continue;
    const p=punto({v,Pw,we,Te:r.Te});
    if(p.lim.mg1v||p.lim.mg1T||p.lim.mg1P||p.lim.mg2T||p.lim.mg2P||p.lim.iceT) continue;
    if(!mejor||p.mf<mejor.p.mf) mejor={ n, we, Te:r.Te, p };
  }
  if(!mejor) return { motor:false, ev:evOk, p:null };
  // refina el régimen por sección áurea
  const g=n=>{ const we=n*RPM, r=neutro(v,Pw,we,null); if(!r.ok||r.sobra) return 1e9; const p=punto({v,Pw,we,Te:r.Te});
    return (p.lim.mg1v||p.lim.mg1T||p.lim.mg1P||p.lim.mg2T||p.lim.mg2P||p.lim.iceT)?1e9:p.mf; };
  let a=Math.max(ICE.nmin,mejor.n-10), b=Math.min(ICE.nmax,mejor.n+10);
  const fi=(Math.sqrt(5)-1)/2; let c=b-fi*(b-a), d=a+fi*(b-a), fc=g(c), fd=g(d);
  for(let i=0;i<50;i++){ if(fc<fd){ b=d; d=c; fd=fc; c=b-fi*(b-a); fc=g(c); } else { a=c; c=d; fc=fd; d=a+fi*(b-a); fd=g(d); } }
  const n=(a+b)/2, we=n*RPM, r=neutro(v,Pw,we,null), p=punto({v,Pw,we,Te:r.Te});
  return (p.mf<=mejor.p.mf+1e-12)?{ motor:true, n, we, Te:r.Te, p }:{ motor:true, n:mejor.n, we:mejor.we, Te:mejor.Te, p:mejor.p };
}
/** Consumo en L/100 km de un punto a velocidad v (m/s). */
const consumoL100=(mf,v)=>v>0.5?mf/COMB.dens/v*1e5:NaN;

/** Paso de la batería: dSOC/dt = −I/(3600·Q). */
function pasoSOC(soc,Pbat,dt){
  const Vo=vocDe(soc), disc=Vo*Vo-4*PACK.R*Pbat; if(!(disc>0)) return soc;
  const I=(Vo-Math.sqrt(disc))/(2*PACK.R); return Math.min(1,Math.max(0,soc-I*dt/(3600*PACK.Q)));
}

/* ---------- 1.7 Geometría de los dientes (evolvente de 20°) ----------
   Un engrane de Z dientes y módulo m. El semiángulo del diente en el radio ρ es
   θ(ρ) = π/(2Z) − (inv α_ρ − inv α), con cos α_ρ = r_b/ρ; el HUECO de una
   corona es el diente de su engrane conjugado, y por eso usa la misma
   expresión. `fase` es el ángulo del centro del diente 0 (del hueco 0 en la
   corona). Devuelve el contorno [x, y] recorrido en sentido antihorario. */
const invEv=a=>Math.tan(a)-a;
function contornoEngrane(Z,m,o={}){
  const { interno=false, fase=0, nFlanco=7, juego=0.03 }=o;
  const r=m*Z/2, al=20*Math.PI/180, rb=r*Math.cos(al), jt=juego*m;
  const ra=interno?r-m:r+m, rf=interno?r+1.25*m:r-1.25*m;
  const med=rho=>{ const a=Math.acos(Math.min(1,rb/rho)); const h=Math.PI/(2*Z)-(invEv(a)-invEv(al));
    return interno?h+jt/(4*r):h-jt/(4*r); };
  const rIni=interno?ra:Math.max(rf,rb), rFin=interno?rf:ra;
  const P=[], paso=DOSPI/Z;
  const pol=(rho,ang)=>[rho*Math.cos(ang),rho*Math.sin(ang)];
  for(let k=0;k<Z;k++){
    const c=fase+k*paso;
    if(!interno){
      // raíz → punta por el flanco izquierdo, punta → raíz por el derecho, y el arco de raíz hasta el siguiente diente
      const h0=med(rIni);
      if(rf<rb-1e-12) P.push(pol(rf,c-h0));
      for(let i=0;i<=nFlanco;i++){ const rho=rIni+(rFin-rIni)*i/nFlanco; P.push(pol(rho,c-med(rho))); }
      for(let i=nFlanco;i>=0;i--){ const rho=rIni+(rFin-rIni)*i/nFlanco; P.push(pol(rho,c+med(rho))); }
      if(rf<rb-1e-12) P.push(pol(rf,c+h0));
      const a0=c+h0, a1=c+paso-h0; for(let i=1;i<=2;i++) P.push(pol(rf,a0+(a1-a0)*i/3));
    } else {
      // la corona: el hueco k (centro c) va de la cresta al fondo y vuelve; entre huecos queda la cresta del diente
      const hT=med(ra), hR=med(rf);
      for(let i=0;i<=nFlanco;i++){ const rho=ra+(rf-ra)*i/nFlanco; P.push(pol(rho,c-med(rho))); }

}
function ruidoPeriodico(semilla,periodo){
  const g=(x,y)=>{ x=((x%periodo)+periodo)%periodo; y=((y%periodo)+periodo)%periodo;
    const s=Math.sin(x*127.1+y*311.7+semilla*13.13)*43758.5453; return s-Math.floor(s); };
  return (x,y)=>{ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);

   normales ANALÍTICAS: ninguna sale nula y las aristas vivas no se
   redondean. `prisma` extruye a lo largo de Z un contorno con sus huecos, con

function torno(perfil,o={}){
  const {seg=64,phi0=0,phi1=DOSPI3,canto=30,uRep=1,vEsc=1,tapas=true}=o;
  const P=preparaPerfil(perfil), n=P.length, EN=[], L=[];
  for(let i=0;i<n;i++){ const p=P[i],q=P[(i+1)%n], da=q[0]-p[0], dr=q[1]-p[1], l=Math.hypot(da,dr)||1e-12; EN.push([dr/l,-da/l]); L.push(l); }
  const cc=Math.cos(canto*Math.PI/180), med=(u,w)=>{ const x=u[0]+w[0], y=u[1]+w[1], l=Math.hypot(x,y)||1; return [x/l,y/l]; };
  const pos=[],nor=[],uv=[],idx=[]; let s=0;
  for(let i=0;i<n;i++){
    const p=P[i],q=P[(i+1)%n],e=EN[i],ea=EN[(i-1+n)%n],ed=EN[(i+1)%n];
    if(p[1]<1e-9&&q[1]<1e-9){ s+=L[i]; continue; }
    const n0=(ea[0]*e[0]+ea[1]*e[1])>cc?med(ea,e):e, n1=(e[0]*ed[0]+e[1]*ed[1])>cc?med(e,ed):e;
    const o0=pos.length/3;
    for(let j=0;j<=seg;j++){
      const f=phi0+(phi1-phi0)*j/seg, c=Math.cos(f), sn=Math.sin(f), u=(f-phi0)/DOSPI3*uRep;
      pos.push(p[0],p[1]*c,-p[1]*sn, q[0],q[1]*c,-q[1]*sn);
      nor.push(n0[0],n0[1]*c,-n0[1]*sn, n1[0],n1[1]*c,-n1[1]*sn);
      uv.push(u,s*vEsc, u,(s+L[i])*vEsc);
    }
    for(let j=0;j<seg;j++){ const a=o0+2*j; idx.push(a,a+1,a+3, a,a+3,a+2); }
    s+=L[i];
  }
  orienta(pos,nor,idx,0);
  if(Math.abs(phi1-phi0)<DOSPI3-1e-6&&tapas){
    const tri=THREE.ShapeUtils.triangulateShape(P.map(([a,r])=>new THREE.Vector2(a,r)),[]);
    for(const [f,sg] of [[phi0,-1],[phi1,1]]){
      const c=Math.cos(f), sn=Math.sin(f), o0=pos.length/3, i0=idx.length;
      for(const [a,r] of P){ pos.push(a,r*c,-r*sn); nor.push(0,-sn*sg,-c*sg); uv.push(a*8,r*8); }
      for(const t of tri) idx.push(o0+t[0],o0+t[1],o0+t[2]);
      orienta(pos,nor,idx,i0);
    }
  }
  return geoDe(pos,nor,uv,idx);
}
const tornoY=(perfil,o)=>torno(perfil,o).rotateZ(Math.PI/2);     // eje +Y (a → y)
const tornoZ=(perfil,o)=>torno(perfil,o).rotateY(-Math.PI/2);    // eje +Z (a → z)
function areaDe(P){ let a=0; for(let i=0;i<P.length;i++){ const p=P[i],q=P[(i+1)%P.length]; a+=p[0]*q[1]-q[0]*p[1]; } return a/2; }
/** Prisma a lo largo de Z: lazos[0] es el contorno exterior y el resto son
 *  huecos. Paredes con normales hacia fuera del sólido, suaves si el giro
 *  entre dos lados es menor que `canto`, y las dos tapas. */
function prisma(lazos,z0,z1,o={}){
  const {canto=28,uEsc=1}=o, cc=Math.cos(canto*Math.PI/180);
  const L=lazos.map((l,i)=>{ const p=l.slice(); const a=areaDe(p); if((i===0&&a<0)||(i>0&&a>0)) p.reverse(); return p; });
  const pos=[],nor=[],uv=[],idx=[];
  for(const P of L){
    const n=P.length, EN=[];
    for(let i=0;i<n;i++){ const a=P[i],b=P[(i+1)%n], tx=b[0]-a[0], ty=b[1]-a[1], l=Math.hypot(tx,ty)||1e-12; EN.push([ty/l,-tx/l,l]); }
    const med=(u,w)=>{ const x=u[0]+w[0], y=u[1]+w[1], l=Math.hypot(x,y)||1; return [x/l,y/l]; };
    let s=0;
    for(let i=0;i<n;i++){
      const a=P[i],b=P[(i+1)%n],e=EN[i],ea=EN[(i-1+n)%n],ed=EN[(i+1)%n];
      if(e[2]<1e-10) continue;
      const na=(ea[0]*e[0]+ea[1]*e[1])>cc?med(ea,e):e, nb=(e[0]*ed[0]+e[1]*ed[1])>cc?med(e,ed):e;
      const o0=pos.length/3;
      pos.push(a[0],a[1],z1, b[0],b[1],z1, b[0],b[1],z0, a[0],a[1],z0);
      nor.push(na[0],na[1],0, nb[0],nb[1],0, nb[0],nb[1],0, na[0],na[1],0);
      uv.push(s*uEsc,z1*uEsc, (s+e[2])*uEsc,z1*uEsc, (s+e[2])*uEsc,z0*uEsc, s*uEsc,z0*uEsc); s+=e[2];
      idx.push(o0,o0+2,o0+1, o0,o0+3,o0+2);
    }
  }
  const c=L[0].map(([x,y])=>new THREE.Vector2(x,y)), H=L.slice(1).map(h=>h.map(([x,y])=>new THREE.Vector2(x,y)));
  const tri=THREE.ShapeUtils.triangulateShape(c,H), todos=c.concat(...H);
  for(const [z,nz] of [[z1,1],[z0,-1]]){
    const o0=pos.length/3, i0=idx.length;
    for(const p of todos){ pos.push(p.x,p.y,z); nor.push(0,0,nz); uv.push(p.x*uEsc,p.y*uEsc); }
    for(const t of tri) idx.push(o0+t[0],o0+t[1],o0+t[2]);
    orienta(pos,nor,idx,i0);
  }
  return geoDe(pos,nor,uv,idx);
}
/** Un rectángulo de esquinas redondeadas como contorno [x,y]. */
function rectR(x0,y0,x1,y1,r,seg=5){ return P3.contornoRedondeado([[x0,y0],[x1,y0],[x1,y1],[x0,y1]],r,seg); }
/** Un sólido «hueco»: la misma malla con las normales y el sentido al revés.
 *  Metido dentro de otro sólido es una CAVIDAD: por el corte se ve su pared. */
function invierte(g){
  const n=g.attributes.normal; for(let i=0;i<n.count;i++) n.setXYZ(i,-n.getX(i),-n.getY(i),-n.getZ(i));
  if(g.index){ const ix=g.index; for(let i=0;i<ix.count;i+=3){ const t=ix.getX(i+1); ix.setX(i+1,ix.getX(i+2)); ix.setX(i+2,t); } }
  else { for(const k of Object.keys(g.attributes)){ const a=g.attributes[k], s=a.itemSize;
    for(let i=0;i<a.count;i+=3) for(let c=0;c<s;c++){ const t=a.array[(i+1)*s+c]; a.array[(i+1)*s+c]=a.array[(i+2)*s+c]; a.array[(i+2)*s+c]=t; } } }
  return g;
}
function cil(r,h,eje='y',seg=32,r2){ const g=new THREE.CylinderGeometry(r2??r,r,h,seg,1,false); if(eje==='x') g.rotateZ(-Math.PI/2); else if(eje==='z') g.rotateX(Math.PI/2); return g; }
const en=(g,x,y,z)=>{ g.translate(x,y,z); return g; };
/** Caja por sus esquinas, con un redondeo de canto opcional. */
function cajaE(x0,y0,z0,x1,y1,z1,r){ const w=x1-x0,h=y1-y0,d=z1-z0; const g=r?new RoundedBoxGeometry(w,h,d,2,Math.min(r,w/2.01,h/2.01,d/2.01)):new THREE.BoxGeometry(w,h,d); g.translate((x0+x1)/2,(y0+y1)/2,(z0+z1)/2); return g; }

/* ---------- 6.2 Máquinas eléctricas: estátor ranurado, devanado e imanes ---------- */
function lazoRanurado(rIn,prof,nSl,fr=0.52){
  const P=[], paso=DOSPI/nSl, aw=paso*fr/2;
  for(let j=0;j<nSl;j++){ const c=j*paso;
    P.push([rIn*Math.cos(c-aw),rIn*Math.sin(c-aw)],[(rIn+prof)*Math.cos(c-aw),(rIn+prof)*Math.sin(c-aw)],[(rIn+prof)*Math.cos(c+aw),(rIn+prof)*Math.sin(c+aw)],[rIn*Math.cos(c+aw),rIn*Math.sin(c+aw)]);
    for(let k=1;k<4;k++){ const f=c+aw+(paso-2*aw)*k/4; P.push([rIn*Math.cos(f),rIn*Math.sin(f)]); }
  }
  return P;
}
function barrasRanura(rIn,prof,nSl,z0,z1,fr=0.52){
  const g=[], paso=DOSPI/nSl, aw=paso*fr/2*0.80;
  for(let j=0;j<nSl;j++){ const c=j*paso, r0=rIn+0.0011, r1=rIn+prof-0.0009;
    g.push(prisma([[[r0*Math.cos(c-aw),r0*Math.sin(c-aw)],[r1*Math.cos(c-aw),r1*Math.sin(c-aw)],[r1*Math.cos(c+aw),r1*Math.sin(c+aw)],[r0*Math.cos(c+aw),r0*Math.sin(c+aw)]]],z0,z1)); }
  return fus(g);
}
function imanes(n,rMed,esp,ancho,z0,z1,padre,mN,mS){
  const gN=new THREE.BoxGeometry(esp,ancho,z1-z0), gS=gN.clone();
  const iN=new THREE.InstancedMesh(gN,mN,n/2), iS=new THREE.InstancedMesh(gS,mS,n/2), m4=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Vector3(0,0,1);
  for(let j=0;j<n;j++){ const a=(j+0.5)*DOSPI/n; q.setFromAxisAngle(e,a); m4.compose(new THREE.Vector3(rMed*Math.cos(a),rMed*Math.sin(a),(z0+z1)/2),q,new THREE.Vector3(1,1,1)); (j%2?iS:iN).setMatrixAt(j>>1,m4); }
  for(const I of [iN,iS]){ I.castShadow=true; I.receiveShadow=true; I.userData.pieza='imanes'; padre.add(I); }
}

/* ===================== 7. EL ESTADO Y EL PUNTO DE OPERACIÓN =====================
   Un solo estado: lo que piden los mandos (velocidad, demanda, gestión del
   motor) se convierte en UN punto de operación con `punto()` (el bloque
   verificado), y de ese punto salen la escena, las cifras y las gráficas. El
   óptimo del vehículo se calcula sólo cuando cambia la velocidad o la demanda. */
const EST={modo:'marcha',gestion:'optimo',v:80,P:18,nMan:2000,TMan:80,esc:1/60,escMano:false,pausa:REDUCIDO,autoRunning:false,corte:'trans'};

const OPT_CACHE=new Map();
function optimoDe(vkmh,Pkw){
  const k=vkmh.toFixed(2)+'|'+Pkw.toFixed(2); let o=OPT_CACHE.get(k);
  if(!o){ o=optimoVehiculo(vkmh/3.6,Pkw*1000); OPT_CACHE.set(k,o); if(OPT_CACHE.size>40) OPT_CACHE.delete(OPT_CACHE.keys().next().value); }
  return o;
}
/** Lo que el tren está haciendo según el modo.
    · En marcha: lo que digan los mandos (óptima, manual o eléctrica).
    · Laboratorio guiado: el escenario de la fase en curso. */
function parametros(){
  let v=EST.v, P=EST.P, we=0, Te=0, falla=null, tipo='optimo';
  if(EST.modo==='guia'){
    if(GUIA.phase===0){ v=WILLIS.v; P=potCrucero(v/3.6)/1000; we=WILLIS.n*RPM; Te=40; tipo='fijo'; }
    else if(GUIA.phase===1){ v=OPS.v; P=OPS.P; we=GUIA.nSel*RPM; Te=GUIA.TSel; tipo='manual'; }
    else { v=DX.v; P=DX.P; falla=GUIA.falla; const o=optimoDe(v,P); we=o.motor?o.we:0; Te=o.motor?o.Te:0; tipo='fijo'; }
  } else if(EST.gestion==='manual'){ we=EST.nMan*RPM; Te=EST.TMan; tipo='manual'; }
  else if(EST.gestion==='ev'){ we=0; Te=0; tipo='ev'; }
  else { const o=optimoDe(v,P); we=o.motor?o.we:0; Te=o.motor?o.Te:0; }
  return {v:v/3.6,Pw:P*1000,we,Te,falla,tipo,vk:v,Pk:P};
}
function calcula(){
  const q=parametros();
  const pt=punto({v:q.v,Pw:q.Pw,we:q.we,Te:q.Te,falla:q.falla,soc:SIM.soc});
  pt.q=q; SIM.pt=pt; return pt;
}

/* ===================== 8. LA ESCENA SIGUE AL MODELO =====================
   Ángulos: el portasatélites y la corona se integran de sus velocidades y el
   solar sale de Willis (relación holonómica), así que los dientes engranan
   SIEMPRE. Todo va a cámara lenta (EST.esc), rotulada; el SOC corre en tiempo
   real, porque a cámara lenta ×1/60 no se movería. */
const ZP_=PSD.Zs+PSD.Zr;
function aplicaGiros(dtS){
  const p=SIM.pt, A=SIM.ang; A.c+=p.wc*dtS; A.r+=p.wr*dtS;
  const th_s=(ZP_*A.c-PSD.Zr*A.r)/PSD.Zs;
  G_SOL.rotation.z=th_s; G_PORTA.rotation.z=A.c; G_COR.rotation.z=A.r;
  const rel=-(PSD.Zs/PSD.Zp)*(th_s-A.c)+FASE_SAT;
  for(const S of SAT) S.rotation.z=rel;
  return th_s;
}
/** Émbolos, bielas y llamas: biela-manivela exacta con el ángulo del portasatélites (el cigüeñal es su eje). */
function aplicaMotor(){
  const p=SIM.pt, th=SIM.ang.c;
  for(let i=0;i<4;i++){
    const s=MT.sg[i], beta=th+(s<0?Math.PI:0), x=-MT.r*Math.sin(beta), y=MT.r*Math.cos(beta);
    const yp=y+Math.sqrt(MT.L*MT.L-x*x);
    PIST[i].position.y=yp; BIEL[i].position.y=yp;
    BIEL[i].rotation.z=Math.atan2(x,yp-y);        // la biela baja del bulón (0, yp) a la muñequilla (x, y)
    const crown=yp+MT.pinToCrown, fase=((th*180/Math.PI-MT.off[i])%720+720)%720;        // 0° = PMS de compresión del ciclo de este cilindro
    // combustión: de 0° a ~140° después del PMS, con la fuerza del par
    const quema=p.we>0&&p.Te>0.5&&fase<150?Math.exp(-fase/55)*Math.min(1,0.25+p.Te/90):0;
    const h=Math.max(0.0008,MT.yChamber-crown), F=FLAMA[i];
    F.scale.set(1,h,1); F.position.y=crown+h/2; F.material.opacity=Math.min(0.85,quema*0.9); F.visible=F.material.opacity>0.01;
  }
}

      puntoEn(c,c.u[i],_pv); aPos[o*3]=_pv.x; aPos[o*3+1]=_pv.y; aPos[o*3+2]=_pv.z;
      const borde=Math.min(c.u[i],1-c.u[i])*c.len/0.006;
      aAlf[o]=c.a*clamp(borde,0,1);
    }
    if(c.flecha){ const s=W>200?1:(W<-200?-1:0), op=vis?c.a*0.95:0; c.flecha.fin.material.opacity=s>0?op:0; c.flecha.ini.material.opacity=s<0?op:0; c.flecha.fin.visible=s>0&&op>0.01; c.flecha.ini.visible=s<0&&op>0.01; }
  }
  gPuntos.attributes.position.needsUpdate=true; gPuntos.attributes.aAlpha.needsUpdate=true;
}

/* Un cuadro de la escena. dtS: tiempo SIMULADO (s, a cámara lenta); dtR: tiempo de pantalla. */
function aplicaEscena(dtS,dtR,t){
  calcula();
  const p=SIM.pt;
  if(!EST.pausa){
    SIM.soc=pasoSOC(SIM.soc,p.Pbat,dtR);                     // el SOC corre en tiempo real
    SIM.tHist+=dtR; if(SIM.tHist>=0.25){ SIM.tHist=0; SIM.hist.push({t:SIM.reloj,soc:SIM.soc,pb:p.Pbat}); if(SIM.hist.length>240) SIM.hist.shift(); }
    SIM.reloj+=dtR;
  }
  aplicaGiros(dtS); aplicaMotor(); pintaBrillos(); mueveFlujos(dtR);
}

function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function encaja(t,dir,pts,caja,margen=0){
  if(margen){ const mx=(caja.x1-caja.x0)*margen, my=(caja.y1-caja.y0)*margen; caja={x0:caja.x0+mx,x1:caja.x1-mx,y0:caja.y0+my,y1:caja.y1-my}; }
  const cam=camera.clone(), W=innerWidth, H=innerHeight, tan=Math.tan(cam.fov*Math.PI/360);
  cam.aspect=W/H; cam.updateProjectionMatrix();
  const cw=caja.x1-caja.x0, ch=caja.y1-caja.y0, cx=(caja.x0+caja.x1)/2, cy=(caja.y0+caja.y1)/2;
  let dist=1; const q=new THREE.Vector3(), der=new THREE.Vector3(), arr=new THREE.Vector3(); t=t.clone(); dir=dir.clone().normalize();
  for(let it=0;it<10;it++){
    cam.position.copy(t).addScaledVector(dir,dist); cam.lookAt(t); cam.updateMatrixWorld();
    let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9;
    for(const p of pts){ q.copy(p).project(cam); const sx=(q.x+1)/2*W, sy=(1-q.y)/2*H;
      a0=Math.min(a0,sx); a1=Math.max(a1,sx); b0=Math.min(b0,sy); b1=Math.max(b1,sy); }
    const k=Math.max((a1-a0)/cw,(b1-b0)/ch), wpp=2*tan*dist/H;
    der.setFromMatrixColumn(cam.matrixWorld,0); arr.setFromMatrixColumn(cam.matrixWorld,1);
    t.addScaledVector(der,((a0+a1)/2-cx)*wpp).addScaledVector(arr,-((b0+b1)/2-cy)*wpp);
    dist*=k;
  }
  return [t.clone().addScaledVector(dir,dist),t];
}
const caja3=(x0,y0,z0,x1,y1,z1)=>{ const r=[]; for(const x of [x0,x1]) for(const y of [y0,y1]) for(const z of [z0,z1]) r.push(V3(x,y,z)); return r; };
/* Cuatro vistas. «Engranaje»: corte transversal del planetario; las otras tres, el
   corte longitudinal (todo el tren de lado, con el motor a la izquierda). */
const VISTAS={
  engranaje:{corte:'trans',dir:[0.07,0.11,1],pts:()=>caja3(-0.175,-0.150,-0.145,0.175,0.165,0)},
  tren:{corte:'long',dir:[1,0.16,0.02],pts:()=>caja3(-0.136,-0.178,-0.458,0,0.240,0.495)},
  motor:{corte:'long',dir:[1,0.10,0.05],pts:()=>caja3(-0.062,-0.085,0.112,0,0.240,0.495)},
  electrica:{corte:'long',dir:[1,0.30,0.12],pts:()=>caja3(-0.100,-0.112,-0.455,0,0.208,0.115)},
};
const VISTA={actual:'engranaje'};
function vistaCam(v){
  const V=VISTAS[v]||VISTAS.engranaje, H=huecoLibre(), pts=V.pts(), c=new THREE.Box3().setFromPoints(pts).getCenter(new THREE.Vector3());

function ponVista(v,dur){

function pasaCam(dt){
  if(!CAMT.on) return;
  CAMT.u=Math.min(1,CAMT.u+dt/Math.max(CAMT.dur,1e-3)); const e=ease(CAMT.u);

function flechaC(x,x0,y0,x1,y1,col,w){ const a=Math.atan2(y1-y0,x1-x0), L=Math.hypot(x1-x0,y1-y0), hd=Math.min(7,L*0.45);

/* —— El mapa de consumo del motor: bandas de g/kWh, plena carga, hipérbola de potencia constante y línea óptima. */
const MAPA={clave:'',c:document.createElement('canvas')};
const N_MIN=900, N_MAX=5400, T_MAX=125, NIVELES=[222,226,234,248,272,310,380];
const BANDAS=['#9DFFD8','#5EE3C3','#34BFB0','#2796A3','#21708F','#244C74','#232E55','#1b1a3a'];
const bandaDe=b=>{ let i=0; while(i<NIVELES.length&&b>NIVELES[i]) i++; return i; };
function capaMapa(Wd,Hd,dpr,m){
  const c=MAPA.c; c.width=Math.round(Wd*dpr); c.height=Math.round(Hd*dpr); const x=c.getContext('2d');
  const w=c.width, h=c.height, im=x.createImageData(w,h), idx=new Uint8Array(w*h);
  const px0=m.l*dpr, px1=(Wd-m.r)*dpr, py0=m.t*dpr, py1=(Hd-m.b)*dpr;
  for(let j=0;j<h;j++) for(let i=0;i<w;i++){
    const o=(j*w+i)*4;
    if(i<px0||i>px1||j<py0||j>py1){ idx[j*w+i]=255; continue; }
    const n=N_MIN+(i-px0)/(px1-px0)*(N_MAX-N_MIN), T=T_MAX*(1-(j-py0)/(py1-py0));
    const nn=n*RPM;
    if(T>parMaxICE(nn)||n<ICE.nmin||n>ICE.nmax||T<1){ idx[j*w+i]=254; im.data[o]=14; im.data[o+1]=22; im.data[o+2]=26; im.data[o+3]=255; continue; }
    const k=bandaDe(bsfc(nn,T)); idx[j*w+i]=k;
    const col=BANDAS[k], v=parseInt(col.slice(1),16); im.data[o]=v>>16; im.data[o+1]=(v>>8)&255; im.data[o+2]=v&255; im.data[o+3]=255;
  }
  // los bordes entre bandas: línea fina oscura
  for(let j=0;j<h-1;j++) for(let i=0;i<w-1;i++){ const a=idx[j*w+i]; if(a>=250) continue;
    if(idx[j*w+i+1]!==a&&idx[j*w+i+1]<250||idx[(j+1)*w+i]!==a&&idx[(j+1)*w+i]<250){ const o=(j*w+i)*4; im.data[o]*=0.55; im.data[o+1]*=0.6; im.data[o+2]*=0.65; } }
  x.putImageData(im,0,0);
}
function pintaMapa(){
  const L=LMAP, x=abre(L), Wd=L.w, Hd=L.h, p=SIM.pt;
  const m={l:30,r:8,t:8,b:20};
  const clave=Wd+'x'+Hd+'|'+L.dpr;
  if(clave!==MAPA.clave){ capaMapa(Wd,Hd,L.dpr,m); MAPA.clave=clave; }
  x.drawImage(MAPA.c,0,0,Wd,Hd);
  const X=n=>m.l+(n-N_MIN)/(N_MAX-N_MIN)*(Wd-m.l-m.r), Y=T=>m.t+(1-T/T_MAX)*(Hd-m.t-m.b);
  // ejes
  x.strokeStyle='rgba(143,179,172,0.35)'; x.lineWidth=1; x.strokeRect(m.l+0.5,m.t+0.5,Wd-m.l-m.r,Hd-m.t-m.b);
  for(const n of [1000,2000,3000,4000,5000]){ txt(x,fN(n/1000,0)+' k',X(n),Hd-8,'#8fb3ac',9,'center','500'); raya(x,X(n),Hd-m.b,X(n),Hd-m.b+3,'#3d5550'); }
  for(const T of [25,50,75,100]){ txt(x,fN(T,0),m.l-4,Y(T)+3,'#8fb3ac',9,'right','500'); raya(x,m.l-3,Y(T),m.l,Y(T),'#3d5550'); }
  txt(x,'rpm',Wd-m.r,Hd-1,'#6f8a85',8.5,'right','500'); txt(x,'N·m',m.l-4,m.t-1,'#6f8a85',8.5,'right','500');
  // los topes de MG1: a la velocidad del coche, el régimen del motor sólo puede estar entre dos rectas
  { const nr=p.wr/RPM, lo=(PSD.Zs*(-MG1.nmax)+PSD.Zr*nr)/(PSD.Zs+PSD.Zr), hi=(PSD.Zs*MG1.nmax+PSD.Zr*nr)/(PSD.Zs+PSD.Zr);
    x.fillStyle='rgba(244,71,94,0.22)';
    if(lo>N_MIN){ x.fillRect(X(N_MIN),m.t,Math.min(X(lo),X(N_MAX))-X(N_MIN),Hd-m.t-m.b); raya(x,X(lo),m.t,X(lo),Hd-m.b,'rgba(244,71,94,0.8)',1.2,[3,2]); }
    if(hi<N_MAX){ x.fillRect(X(hi),m.t,X(N_MAX)-X(hi),Hd-m.t-m.b); raya(x,X(hi),m.t,X(hi),Hd-m.b,'rgba(244,71,94,0.8)',1.2,[3,2]); } }
  const Pe=p.Pe;
  // hipérbola de potencia constante del punto en curso (P = T·ω)
  if(p.we>0&&Pe>500){ x.strokeStyle='rgba(255,255,255,0.55)'; x.lineWidth=1.2; x.setLineDash([4,3]); x.beginPath(); let ini=true;
    for(let n=ICE.nmin;n<=ICE.nmax;n+=20){ const T=Pe/(n*RPM); if(T>T_MAX) continue; ini?x.moveTo(X(n),Y(T)):x.lineTo(X(n),Y(T)); ini=false; } x.stroke(); x.setLineDash([]); }
  // plena carga
  x.strokeStyle='rgba(255,255,255,0.7)'; x.lineWidth=1.2; x.beginPath();
  for(let n=ICE.nmin;n<=ICE.nmax;n+=20){ const T=parMaxICE(n*RPM); n===ICE.nmin?x.moveTo(X(n),Y(T)):x.lineTo(X(n),Y(T)); } x.stroke();
  // la línea de operación óptima del motor solo (de 3 a 52 kW): no se enseña mientras el reto la pide
  if(!ocultaOpt()){ x.strokeStyle='rgba(255,226,120,1)'; x.lineWidth=2.4; x.setLineDash([3,3]); x.beginPath(); let ini=true;
    for(let P=2000;P<=54000;P+=1000){ const o=optimoMotor(P); if(!o) continue; ini?x.moveTo(X(o.n),Y(o.T)):x.lineTo(X(o.n),Y(o.T)); ini=false; } x.stroke(); x.setLineDash([]); }
  // el óptimo del vehículo para esta demanda (fantasma): sólo en marcha, o tras resolver el reto
  const opt=(EST.modo==='marcha'||GUIA.opOk)?optimoDe(p.q.vk,p.q.Pk):null;
  if(opt&&opt.motor&&!(EST.modo==='guia'&&GUIA.phase!==1)){ const ox=X(opt.n), oy=Y(opt.Te); x.strokeStyle='#FFE98A'; x.lineWidth=1.6; x.beginPath(); x.moveTo(ox-5,oy); x.lineTo(ox+5,oy); x.moveTo(ox,oy-5); x.lineTo(ox,oy+5); x.stroke(); }
  // el punto de operación y su estela
  if(p.we>0){ const t=SIM.estela; if(t.length>1){ x.strokeStyle='rgba(255,255,255,0.35)'; x.lineWidth=1.2; x.beginPath(); t.forEach(([n,T],i)=>i?x.lineTo(X(n),Y(T)):x.moveTo(X(n),Y(T))); x.stroke(); }
    const px=X(p.we/RPM), py=Y(p.Te); x.fillStyle='#ffffff'; x.beginPath(); x.arc(px,py,4,0,DOSPI); x.fill(); aro(x,px,py,7.5,'rgba(255,255,255,0.8)',1.4); }
  else txt(x,'motor apagado',(m.l+Wd-m.r)/2,(m.t+Hd-m.b)/2,'#9fb2ad',11,'center','700');
  el('t_map').textContent=p.we>0&&p.Pe>1?fN(p.bsfc,0)+' g/kWh · '+fN(p.Pe/1000,1)+' kW':'';
}

  const filas=[['Motor',p.Pe,COL_M],['MG1',-p.P1sh,COL_E],['MG2',p.P2sh,COL_E],['Batería',-p.Pbat,COL_B],['Rueda',p.Pw_real,COL_M]];
  const wB=Math.round(Wd*0.58), xc=Math.round(wB*0.52), rh=Math.min(15,(Hd-6)/5), esc=Math.max(30000,...filas.map(f=>Math.abs(f[1])*1.1));
  filas.forEach(([nom,v,col],i)=>{ const y=4+i*rh;
    txt(x,nom,4,y+rh-4,'#9fb2ad',9,'left','600');
    const x0=44, xz=x0+(wB-x0-34)*0.5, kk=(wB-x0-34)*0.5/esc;
    x.fillStyle='rgba(143,179,172,0.08)'; x.fillRect(x0,y+2,wB-x0-34,rh-4);
    x.fillStyle=col; x.globalAlpha=0.92; const wv=v*kk; x.fillRect(Math.min(xz,xz+wv),y+3,Math.max(1,Math.abs(wv)),rh-6); x.globalAlpha=1;
    raya(x,xz,y+1,xz,y+rh-1,'rgba(234,244,241,0.55)',1);
    txt(x,fN(v/1000,1),wB-3,y+rh-4,'#e7f3f0',9.5,'right','700');
  });
  // la demanda en la rueda: una marca sobre la barra de la rueda (se ve si MG2 falla)
  { const y=4+4*rh, x0=44, xz=x0+(wB-x0-34)*0.5, kk=(wB-x0-34)*0.5/esc, xd=xz+p.Pw*kk; raya(x,xd,y,xd,y+rh,'#ffffff',1.3,[2,2]); }
  // historia (derecha): SOC y P_bat
  const gx0=wB+8, gx1=Wd-6, gy0=6, gy1=Hd-14, H=SIM.hist;
  if(gx1-gx0>40){
    raya(x,gx0,gy1,gx1,gy1,'#3d5550',1);
    const ySoc=s=>gy1-(clamp(s,0.40,0.80)-0.40)/0.40*(gy1-gy0);
    for(const s of [0.5,0.6,0.7]) raya(x,gx0,ySoc(s),gx1,ySoc(s),s===0.6?'rgba(143,179,172,0.28)':'rgba(143,179,172,0.10)',1,s===0.6?[]:[2,3]);
    txt(x,'60 %',gx0+2,ySoc(0.6)-2,'#6f8a85',8,'left','500');
    if(H.length>1){ const t1=H[H.length-1].t, t0=t1-60, X=t=>gx0+(t-t0)/60*(gx1-gx0);
      x.strokeStyle=COL_B; x.lineWidth=1.8; x.beginPath(); H.forEach((q,i)=>{ const xx=X(q.t), yy=ySoc(q.soc); i?x.lineTo(xx,yy):x.moveTo(xx,yy); }); x.stroke();
      const yP=pb=>(gy0+gy1)/2-clamp(pb/30000,-1,1)*(gy1-gy0)/2*0.5;
      x.strokeStyle='rgba(79,209,197,0.85)'; x.lineWidth=1.2; x.beginPath(); H.forEach((q,i)=>{ const xx=X(q.t), yy=yP(q.pb); i?x.lineTo(xx,yy):x.moveTo(xx,yy); }); x.stroke(); }
    txt(x,'SOC '+fN(SIM.soc*100,1)+' %',gx1-2,gy0+9,COL_B,9.5,'right','700');
    txt(x,'últimos 60 s',gx0+2,Hd-3,'#6f8a85',8,'left','500'); txt(x,'P bat',gx1-2,Hd-3,'#4FD1C5',8,'right','600');
  }
  el('t_st').textContent=p.mf>0&&p.v>0.5?fN(consumoL100(p.mf,p.v),1)+' L/100 km':(p.mf>0?fN(p.mf*3.6,1)+' kg/h':'sin combustible');

const _cl=(id,c)=>{ const e=el(id); if(e.className!==c) e.className=c; };
function pintaDock(){
  const p=SIM.pt, set=(id,h)=>{ const e=el(id); if(e.innerHTML!==h) e.innerHTML=h; };
  if(ocultaS()){ set('f_ws','¿?'); _cl('f_ws','oculto'); } else { set('f_ws',fN(p.ws/RPM,0)+'<small> rpm</small>'); _cl('f_ws',p.lim.mg1v?'bad':''); }

  set('f_pb',fN(p.Pbat/1000,1)+'<small> kW</small>'); _cl('f_pb',p.lim.bat?'bad':(Math.abs(p.Pbat)<500?'':'warn'));
  set('f_bs',p.Pe>1000?fN(p.bsfc,0)+'<small> g/kWh</small>':'—'); _cl('f_bs','');
  const A=el('aviso'); let cl='', t='';
  if(!enDiagnostico()){
    if(p.lim.mg1v){ cl='mal'; t='MG1 pasaría de 10 000 rpm: el control no lo permite. Sube el régimen del motor o baja la velocidad.'; }
    else if(p.lim.iceT){ cl='mal'; t='El par pedido supera la plena carga del motor a ese régimen.'; }
    else if(p.lim.mg2T||p.lim.mg2P){ cl='mal'; t='MG2 no puede dar esa demanda: ha llegado a su par o su potencia máximos.'; }
    else if(p.lim.bat){ cl='mal'; t='La batería sale de su límite de ±21 kW.'; }

    else if(EST.modo==='marcha'&&p.we>0&&Math.abs(p.ws/RPM)<25){ cl='bien'; t='Solar casi parado: toda la potencia viaja por el camino mecánico, sin pérdidas eléctricas.'; }
    else if(EST.modo==='marcha'&&p.we>0&&p.ws<0&&p.P1sh>1000){ cl='ojo'; t='Solar al revés: MG1 hace de motor y la potencia circula en lazo por el camino eléctrico.'; }
    else if(EST.modo==='marcha'&&EST.gestion==='manual'&&Math.abs(p.Pbat)>1500){ cl='ojo'; t='La batería '+(p.Pbat>0?'se descarga':'se carga')+' a '+fN(Math.abs(p.Pbat)/1000,1)+' kW: el SOC no es neutro.'; }
  }
  A.className='dk-aviso'+(t?' on '+cl:''); if(A.textContent!==t) A.textContent=t;
  // la estela del punto del motor
  if(p.we>0&&performance.now()-SIM.tEst>90){ SIM.tEst=performance.now(); SIM.estela.push([p.we/RPM,p.Te]); if(SIM.estela.length>30) SIM.estela.shift(); } else if(p.we<=0) SIM.estela.length=0;
}

function colocaRotulos(){
  if(!ROT.on||esEstrecho()) return;
  const H=huecoLibre(), q=new THREE.Vector3(), cx=(H.x0+H.x1)/2, izq=[], der=[], lista=ANCLAS[EST.corte];
  lista.forEach(([t,f],i)=>{ q.copy(f()).project(camera); const x=(q.x+1)/2*innerWidth, y=(1-q.y)/2*innerHeight; (x<cx?izq:der).push({i,x,y}); });
  for(const [col,lado] of [[izq,-1],[der,1]]){ col.sort((a,b)=>a.y-b.y); let yMin=H.y0+4;

function ajustaHoja(){

/* ===================== 15. EL LABORATORIO GUIADO =====================
   Tres fases y un cierre:
   1 · Willis (calcular la velocidad del solar), 2 · Operación (fijar el punto
   del motor con SOC neutro y consumo mínimo), 3 · Diagnóstico (una de tres
   fallas al azar) y el quiz. Tres fallos en un reto cambian el dato (no se
   aprueba por eliminación). Nada de lo que se pide se enseña antes de validar. */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const shuffled=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const WILLIS_POOL=[{v:36,n:1500},{v:72,n:1800},{v:100,n:1200},{v:130,n:2400},{v:50,n:3000},{v:115,n:2100},{v:90,n:1000},{v:25,n:2600}];
const OPS_POOL=[{v:50,P:9},{v:70,P:16},{v:95,P:12},{v:110,P:22},{v:130,P:26},{v:60,P:20},{v:85,P:8},{v:145,P:30}];
const DX_POOL=[{v:60,P:16},{v:100,P:14},{v:125,P:22},{v:45,P:12},{v:85,P:18}];
const FALLAS=['mg1','bloq','mg2'];
let WILLIS=pickOne(WILLIS_POOL), OPS=pickOne(OPS_POOL), DX=pickOne(DX_POOL);
const RETO={intentos:0,resiembras:0,fallosW:0,fallosO:0,fallosDx:0,pistasW:0,pistasO:0,hecho:false};
const GUIA={phase:0,paso:'willis',iniciado:false,wOk:false,opOk:false,falla:null,reparado:false,nSel:2500,TSel:60,sintoma:''};
const nCoronaDe=v=>v/3.6*VEH.ifd/VEH.Rw/RPM;
const nSolarDe=(n,v)=>(PSD.Zs+PSD.Zr)*n/PSD.Zs-PSD.Zr*nCoronaDe(v)/PSD.Zs;
function sorteaWillis(){ const p=WILLIS; do{ WILLIS=pickOne(WILLIS_POOL); }while(WILLIS===p); }
function sorteaOps(){ const p=OPS; do{ OPS=pickOne(OPS_POOL); }while(OPS===p); GUIA.nSel=pickOne([1800,2200,2600,3000,3400]); GUIA.TSel=pickOne([40,55,70]); }
GUIA.nSel=pickOne([1800,2200,2600,3000]); GUIA.TSel=pickOne([40,55,70]);

/* ---------- Fase 1: Willis ---------- */
function checkWillis(){
  const raw=String((el('ansW')||{}).value||'').trim().replace(/\s| /g,'').replace('−','-').replace(',','.');
  const v=parseFloat(raw), correcto=nSolarDe(WILLIS.n,WILLIS.v);
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe el régimen del solar en rpm (con signo; coma o punto decimal).'); return; }
  RETO.intentos++;
  const tol=Math.max(40,0.015*Math.abs(correcto));
  if(Math.abs(v-correcto)<tol){
    RETO.fallosW=0; GUIA.wOk=true;
    feedback('good','¡Correcto! ✓',`n<sub>s</sub> = [(Z<sub>s</sub>+Z<sub>r</sub>)·n<sub>c</sub> − Z<sub>r</sub>·n<sub>r</sub>]/Z<sub>s</sub> = (108·${fN(WILLIS.n,0)} − 78·${fN(nCoronaDe(WILLIS.v),0)})/30 = ${fN(correcto,0)} rpm. ${correcto<0?'El signo negativo: el solar gira al revés que el motor.':'El solar gira en el mismo sentido que el motor.'}`,true);
    sonido.bien(); setTimeout(()=>{ GUIA.phase=1; sorteaOpsSiHaceFalta(); SIM.soc=0.60; pasoA('op'); },1800);
  } else {
    RETO.fallosW++; sonido.mal();
    const ingenuo=Math.abs(v-WILLIS.n)<60||Math.abs(v+correcto)<tol;
    if(RETO.fallosW>=3){ RETO.fallosW=0; RETO.resiembras++; sorteaWillis(); feedback('bad','Tres intentos fallidos','Cambia el estado del coche: vuelve a plantear el cálculo con los nuevos datos.'); setTimeout(()=>pasoA('willis'),1400); }
    else { feedback('bad','Revisa el cálculo',`Tu resultado (${fN(v,0)} rpm) no coincide.`+(ingenuo?' Fíjate en el signo y en qué eje va con qué dentado.':' Recuerda que cada velocidad pesa con el número de dientes de su engrane.')+` (intentos fallidos: ${RETO.fallosW}/3)`);
      const t=el('d_try'); if(t) t.textContent=RETO.fallosW; }
  }
}
function sorteaOpsSiHaceFalta(){ if(!GUIA.opIni){ GUIA.opIni=true; } }

/* ---------- Fase 2: la operación ---------- */
function checkOp(){
  const v=OPS.v/3.6, Pw=OPS.P*1000, we=GUIA.nSel*RPM;
  const p=punto({v,Pw,we,Te:GUIA.TSel,soc:SIM.soc}), r=neutro(v,Pw,we), opt=optimoDe(OPS.v,OPS.P);
  RETO.intentos++;
  const dev=p.Pbat, neutroOk=Math.abs(dev)<=800;
  const limites=p.lim.mg1v||p.lim.mg1T||p.lim.mg1P||p.lim.mg2T||p.lim.mg2P||p.lim.iceT||p.lim.bat;
  let ok=false, titulo='', msg='';
  if(!neutroOk){ titulo='La batería no queda neutra'; msg=`Con ese par la batería ${dev>0?'se descarga':'se carga'} a ${fN(Math.abs(dev)/1000,1)} kW. Ajusta el <b>par</b> hasta que no entre ni salga potencia.`; }
  else if(limites){ titulo='Fuera de los límites'; msg='Ese punto sobrepasa un límite de una máquina (se marca en rojo en el dock): el control no lo permitiría.'; }
  else if(!r.ok||r.sobra||!opt.motor){ titulo='Punto no válido'; msg='A ese régimen el motor, aun a plena carga, no llega al par que cierra el balance de la batería: sube el <b>régimen</b> o revisa el par.'; }
  else {
    const mfN=punto({v,Pw,we,Te:r.Te}).mf, sobre=mfN/opt.p.mf-1;
    if(sobre>0.015){ titulo='SOC neutro, pero no mínimo'; msg='La batería queda neutra, pero con ese <b>régimen</b> se quema más combustible del necesario (más de un 1,5 %). Mira dónde cae la línea de potencia constante sobre el mapa, y recuerda que parte de la potencia pasa por MG1 y MG2, que también pierden.'; }
    else ok=true;
  }
  if(ok){
    RETO.fallosO=0; GUIA.opOk=true; sonido.bien();
    const pn=punto({v,Pw,we:opt.we,Te:opt.Te,soc:SIM.soc});
    feedback('good','¡Punto óptimo! ✓',`A ${OPS.v} km/h y ${fN(OPS.P,0)} kW: SOC neutro (P<sub>bat</sub> ≈ ${fN(dev/1000,1)} kW) y consumo mínimo. El óptimo del vehículo cae en ${fN(opt.n,0)} rpm y ${fN(opt.Te,0)} N·m (${fN(pn.bsfc,0)} g/kWh, ${fN(consumoL100(pn.mf,v),1)} L/100 km); el solar gira a ${fN(pn.ws/RPM,0)} rpm. Ahora se ve la línea de operación óptima del motor en el mapa.`,true);
    pasoA('op');
    setTimeout(()=>{ GUIA.phase=2; startDx(); },3600);
  } else {
    RETO.fallosO++; sonido.mal();
    if(RETO.fallosO>=3){ RETO.fallosO=0; RETO.resiembras++; sorteaOps(); feedback('bad','Tres intentos fallidos','Cambia la demanda del coche: vuelve a plantear el punto del motor con los nuevos datos.'); setTimeout(()=>pasoA('op'),1400); }
    else { feedback('bad',titulo,msg+` (intentos fallidos: ${RETO.fallosO}/3)`); const t=el('d_tryo'); if(t) t.textContent=RETO.fallosO; }
  }
}

/* ---------- Fase 3: el diagnóstico ---------- */
function startDx(){
  GUIA.phase=2; GUIA.paso='dx'; GUIA.reparado=false; GUIA.falla=pickOne(FALLAS); DX=pickOne(DX_POOL); SIM.soc=0.60; SIM.hist.length=0;
  GUIA.sintoma=''; pintaHUD(); ponVista('engranaje');
