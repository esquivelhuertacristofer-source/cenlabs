}
function sintomaDe(f){
  if(f==='mg1') return 'SÍNTOMA: el motor térmico sube hasta el corte y se queda ahí; el solar gira muy deprisa, la potencia de MG1 es cero y la batería se vacía casi toda la potencia que pide la rueda. ¿Qué lo causa?';
  if(f==='bloq') return 'SÍNTOMA: el solar no gira. El régimen del motor ya no se elige: sube y baja con la velocidad del coche (compruébalo con el mando de velocidad) y no hay forma de mantener el SOC neutro. ¿Qué lo causa?';
  return 'SÍNTOMA: el motor y MG1 trabajan con normalidad, pero la rueda recibe menos potencia que la pedida (la barra queda corta de su marca) y la batería se carga sin parar. ¿Qué lo causa?';
}
function diagnostica(choice){
  if(!GUIA.falla||GUIA.paso!=='dx') return;
  RETO.intentos++;
  if(choice===GUIA.falla){ RETO.fallosDx=0; sonido.bien(); feedback('good','Diagnóstico correcto ✓',explica(GUIA.falla)+' <b>Ahora corrígelo.</b>',true); pasoA('reparar'); }
  else {
    RETO.fallosDx++; sonido.mal();
    if(RETO.fallosDx>=3){
      RETO.fallosDx=0; RETO.resiembras++; const p=GUIA.falla; GUIA.falla=pickOne(FALLAS.filter(f=>f!==p)); DX=pickOne(DX_POOL);
      feedback('bad','Tres intentos fallidos','El tren presenta ahora OTRA falla: observa de nuevo la escena y el dock.',true);
      GUIA.sintoma=sintomaDe(GUIA.falla); pintaHUD();
    } else { feedback('bad','No es esa la falla','Eso ('+nomFalla(choice)+') daría otro síntoma: '+contraria(choice)+' Observa otra vez. (intentos fallidos: '+RETO.fallosDx+'/3)',true); pintaHUD(); }
  }
}
const nomFalla=f=>f==='mg1'?'MG1 sin par':f==='bloq'?'MG1 bloqueado':'MG2 sin par';
function explica(f){
  if(f==='mg1') return 'Sin par en MG1 el solar no tiene quién lo frene. El conjunto planetario sólo transmite par si cada eje tiene su reacción (T<sub>s</sub> : T<sub>c</sub> : T<sub>r</sub> = 30 : 108 : 78): sin la del solar, el motor no empuja la corona y se embala.';
  if(f==='bloq') return 'Con el solar bloqueado (ω<sub>s</sub> = 0) Willis queda en ω<sub>c</sub> = Z<sub>r</sub>/(Z<sub>s</sub>+Z<sub>r</sub>)·ω<sub>r</sub> = 0,72·ω<sub>r</sub>: el motor ya no es libre, el planetario es una reducción fija.';
  return 'MG2 sin par: la corona sólo recibe el camino mecánico, 72 % del par del motor. Lo demás de la potencia de MG1 se va a la batería, y la rueda se queda corta.';
}
function contraria(f){
  if(f==='mg1') return 'si MG1 no diese par, el motor se embalaría y el solar giraría libre, no quedaría parado ni la rueda corta con la batería cargando.';
  if(f==='bloq') return 'un solar bloqueado deja el régimen del motor atado a la velocidad; no lo embala ni deja a la rueda corta.';
  return 'sin par en MG2 la rueda se queda corta de potencia, pero el solar sigue girando libre y el motor no se embala.';
}
function repara(){
  GUIA.reparado=true; GUIA.falla=null; RETO.hecho=true; sonido.bien();
  feedback('good','¡Reparado! 🎉','El tren vuelve a repartir la potencia con normalidad. Lo has calculado con Willis, has fijado un punto óptimo y has diagnosticado una falla real. Falta el cierre.',true);
  setTimeout(()=>{ startQuiz(); },2200);
}

/* ---------- el cierre: un quiz con las opciones barajadas ---------- */
const QZ_POOL=[{v:140,n:1900},{v:30,n:2500},{v:120,n:1500},{v:20,n:1400},{v:110,n:3200},{v:60,n:1000}];
const QZ={caso:null,opciones:[],correcta:-1,resp:-1,texto:''};
function startQuiz(){
  const c=pickOne(QZ_POOL), ns=nSolarDe(c.n,c.v), nr=nCoronaDe(c.v);
  const clave=ns>40?'gen':(ns<-40?'mot':'par');
  const base=[
    ['gen','Como <b>generador</b>: el solar gira en el sentido del motor y frena el reparto.'],
    ['mot','Como <b>motor</b>: el solar gira al revés y la potencia circula en lazo por el camino eléctrico.'],
    ['par','<b>Parado</b>: el solar está casi inmóvil y todo el par viaja por la vía mecánica.'],
    ['des','<b>Desconectado</b>: sin par en el solar no hay nada que hacer, por eso no gira.'],
  ];
  const ord=shuffled(base);
  QZ.caso=c; QZ.opciones=ord; QZ.correcta=ord.findIndex(o=>o[0]===clave); QZ.resp=-1; QZ.ns=ns; QZ.nr=nr;
  GUIA.paso='quiz'; GUIA.phase=3; pintaHUD();
}
function responde(i){
  if(QZ.resp>=0) return; QZ.resp=i;
  const ok=i===QZ.correcta, ns=QZ.ns;
  feedback(ok?'good':'bad',ok?'¡Correcto! ✓':'No era esa',`n<sub>s</sub> = (108·${fN(QZ.caso.n,0)} − 78·${fN(QZ.nr,0)})/30 = ${fN(ns,0)} rpm. `+(ns>40?'Gira en el mismo sentido que el motor y MG1 frena: genera.':(ns<-40?'Gira al revés mientras el motor empuja hacia delante: MG1 tiene que mover el solar (hace de motor) y la potencia circula.':'Casi no gira: no hay potencia que pase por la vía eléctrica.')),true);
  pasoA('completo');
}

/* ---------- el enrutador de acciones (la API de siempre) ---------- */
function pasoA(p){ GUIA.paso=p; if(EST.modo==='guia') pintaHUD(); }
function handleAction(act,btn){
  switch(act){
    case 'check-w': checkWillis(); break;
    case 'hint-w':
      if(RETO.pistasW===0){ RETO.pistasW=1; feedback('good','Pista 1 de 2','Willis: cada velocidad se pondera con el número de dientes de su engrane. El portasatélites lleva el conjunto de los dos: (Z<sub>s</sub>+Z<sub>r</sub>).'); }
      else if(RETO.pistasW===1){ RETO.pistasW=2; feedback('good','Pista 2 de 2','Despeja la velocidad del solar: es la que te falta. Las otras dos son los datos del enunciado.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break;
    case 'check-op': checkOp(); break;
    case 'hint-o':
      if(RETO.pistasO===0){ RETO.pistasO=1; feedback('good','Pista 1 de 2','Dos mandos, dos trabajos: el <b>par</b> cierra el balance de la batería (P<sub>bat</sub> = 0); el <b>régimen</b> decide cuánto combustible cuesta esa potencia.'); }
      else if(RETO.pistasO===1){ RETO.pistasO=2; feedback('good','Pista 2 de 2','Para una misma potencia del motor, la línea punteada del mapa es el lugar de todos los regímenes posibles: recórrela buscando el valle de consumo, sin olvidar que a veces conviene un poco más arriba de lo que dice el mapa.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto.');
      break;
    case 'dx-mg1': diagnostica('mg1'); break;
    case 'dx-bloq': diagnostica('bloq'); break;
    case 'dx-mg2': diagnostica('mg2'); break;
    case 'repair': if(GUIA.paso==='reparar') repara(); break;
    case 'restart': location.reload(); break;
    default: if(/^quiz-\d$/.test(act)) responde(+act.slice(5));
  }
}

/* ---------- lo que la guía enseña en cada paso ---------- */
function contenidoGuia(){
  const tri=(n,val)=>`<span class="tries">intentos fallidos: <b id="${n}">${val}</b>/3</span>`;
  switch(GUIA.paso){
    case 'willis': return {no:'Fase 1 · Willis',head:'Tu cálculo',title:'¿A qué régimen gira el solar?',
      teach:`El coche va a <b>${fN(WILLIS.v,0)} km/h</b>: la <b>corona</b> gira a <b>${fN(nCoronaDe(WILLIS.v),0)} rpm</b>. El motor, en el portasatélites, a <b>${fN(WILLIS.n,0)} rpm</b>.<div class="task">¿A qué régimen gira el <b>solar</b> (MG1), en rpm? El signo cuenta. ${tri('d_try',RETO.fallosW)}</div>`,
      acts:`<div class="calcrow"><input id="ansW" type="text" inputmode="decimal" autocomplete="off" placeholder="¿? rpm" aria-label="Régimen del solar en rpm"><button class="b primary" data-act="check-w">✓ Comprobar</button></div><button class="pista" id="btnHint">¿Necesitas una pista? (máx. 2)</button>`};
    case 'op': return {no:'Fase 2 · Operación',head:'Tu decisión',title:GUIA.opOk?'Punto óptimo conseguido':'Fija el punto del motor',
      teach:`A <b>${fN(OPS.v,0)} km/h</b> el coche pide <b>${fN(OPS.P,0)} kW</b> en la rueda. Elige régimen y par para que la <b>batería quede neutra</b> y se queme el <b>mínimo combustible</b>.<div class="task">${GUIA.opOk?'Resuelto. La línea óptima ya se ve en el mapa.':'P<sub>bat</sub> y el consumo se leen en el dock. '+tri('d_tryo',RETO.fallosO)}</div>`,
      acts:GUIA.opOk?'':`<div class="cg"><div class="cl"><div>Régimen del motor</div><b id="vNg">${fN(GUIA.nSel,0)} rpm</b></div><input type="range" id="rNg" min="1000" max="5200" step="10" value="${GUIA.nSel}" aria-label="Régimen del motor térmico"></div>
        <div class="cg"><div class="cl"><div>Par del motor</div><b id="vTg">${fN(GUIA.TSel,0)} N·m</b></div><input type="range" id="rTg" min="0" max="120" step="1" value="${GUIA.TSel}" aria-label="Par del motor térmico"></div>
        <button class="b primary" data-act="check-op">✓ Comprobar mi punto</button><button class="pista" id="btnHint">¿Necesitas una pista? (máx. 2)</button>`};
    case 'dx': return {no:'Fase 3 · Diagnóstico',head:'¿Cuál es la falla?',title:'El tren falla en operación',
      teach:`Observa la escena, la palanca y el reparto de potencia e <b>identifica la falla</b>.<div class="task" id="symptomTask">${GUIA.sintoma||'Observa el síntoma y elige el diagnóstico.'}</div><span class="tries">intentos fallidos: ${RETO.fallosDx}/3</span>`,
      acts:shuffled(['mg1','bloq','mg2']).map(k=>`<button class="b" data-act="dx-${k}"><span class="ic">${k==='mg1'?'⚡':k==='bloq'?'🔒':'⚙'}</span> ${k==='mg1'?'MG1 sin par (inversor abierto)':k==='bloq'?'MG1 bloqueado (solar parado)':'MG2 sin par'}</button>`).join('')};
    case 'reparar': return {no:'Fase 3 · Diagnóstico',head:'Reparación',title:'Corrige la falla',
      teach:`Diagnóstico correcto: <b>${nomFalla(GUIA.falla||'mg1')}</b>. Corrígela y mira volver el reparto.`,
      acts:`<button class="b primary good" data-act="repair">🔧 Corregir la falla</button>`};
    case 'quiz': return {no:'Cierre',head:'Una pregunta',title:'¿Cómo trabaja MG1?',
      teach:`La corona gira a <b>${fN(QZ.nr,0)} rpm</b> y el motor empuja a <b>${fN(QZ.caso.n,0)} rpm</b>.`,
      acts:QZ.opciones.map((o,i)=>`<button class="b" data-act="quiz-${i}" ${QZ.resp>=0?'disabled':''}><span>${o[1]}</span></button>`).join('')};
    case 'completo': return {no:'Laboratorio completado',head:'✓',title:'Calculado, optimizado y reparado',
      teach:`Puedes volver a <b>En marcha</b> y mover la velocidad y la demanda: mira cuándo el solar se para, dónde se pone al revés y cómo cambia el punto óptimo del motor.`,
      acts:`<button class="b primary" data-act="restart">↺ Reiniciar laboratorio</button>`};
  }
  return {no:'',head:'',title:'',teach:'',acts:''};
}
function htmlGuia(){
  const ps=['Willis','Operación','Diagnóstico'], C=contenidoGuia();
  const ok=i=>i<GUIA.phase||(i===2&&RETO.hecho);
  return `<div class="pasos">${ps.map((t,i)=>`<span class="ps ${ok(i)?'ok':(i===GUIA.phase?'on':'')}"><i>${ok(i)?'✓':i+1}</i>${t}</span>`).join('')}</div>
  <div class="retoBox"><div class="rt"><span>${C.no}</span><span>${C.head}</span></div><h3>${C.title}</h3><div class="rq">${C.teach}</div><div class="opt" id="actOpt">${C.acts}</div></div>`;
}
/* ---------- los modos ---------- */
function setMode(m,forzar){
  if(!forzar&&(m===EST.modo||EST.autoRunning)) return;
  if(m==='guia'){
    EST.modo='guia'; SIM.soc=0.60; SIM.hist.length=0;
    if(!GUIA.iniciado){ GUIA.iniciado=true; GUIA.phase=0; GUIA.paso='willis'; }
    ponVista('engranaje');
  } else { EST.modo='marcha'; SIM.soc=0.60; SIM.hist.length=0; ponVista('engranaje'); }
  document.body.classList.toggle('m-marcha',EST.modo==='marcha'); document.body.classList.toggle('m-guia',EST.modo==='guia');
  pintaHUD(); pintaDockFijo(); pintaBarras(); MAPA.clave='';
}
let fbTimer=null;
function feedback(type,title,text,sticky=false){ const f=el('feedback'); f.className='feedback show '+type; el('fbIcon').textContent=type==='good'?'✓':'✕'; el('fbTitle').textContent=title; el('fbText').innerHTML=text; clearTimeout(fbTimer); if(!sticky) fbTimer=setTimeout(()=>f.classList.remove('show'),7000); }
el('fbX').onclick=()=>el('feedback').classList.remove('show');

/* ---------- el recorrido guiado de «En marcha» ---------- */
const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function runAuto(){
  if(EST.autoRunning||EST.modo!=='marcha') return; EST.autoRunning=true; sonido.init();
  const hud=el('hud');
  const prev={v:EST.v,P:EST.P,gestion:EST.gestion,nMan:EST.nMan,TMan:EST.TMan,esc:EST.esc,pausa:EST.pausa,vista:VISTA.actual,escMano:EST.escMano};
  const fija=o=>{ Object.assign(EST,o); SIM.soc=0.60; pintaHUD(); hud.style.pointerEvents='none'; const b=el('btnAuto'); if(b){ b.disabled=true; b.textContent='Recorrido en curso…'; } pintaDockFijo(); pintaBarras(); };
  try{
    fija({v:0,P:0,gestion:'manual',nMan:1500,TMan:60,pausa:false}); ponVista('engranaje');
    showToast('Paso 1 · <b>Coche parado</b>, motor a 1 500 rpm. La corona no gira: todo el giro lo toma el <b>solar</b> (3,6 veces más deprisa). MG1 genera y carga la batería.',8000);
    await espera(8400);
    fija({v:30,P:6,gestion:'ev'});
    showToast('Paso 2 · <b>Arranque eléctrico</b> a 30 km/h. El motor está apagado; MG2 empuja la corona y el solar gira libre <b>hacia atrás</b>, a −2,6 veces la velocidad de la corona.',8000);
    await espera(8400);
    fija({v:60,P:14,gestion:'optimo'});
    showToast('Paso 3 · <b>Crucero a 60 km/h</b>. El motor entra donde consume menos con la batería neutra: el punto blanco del mapa cae sobre la línea óptima.',8000);
    await espera(8400);
    ponVista('tren');
    showToast('Paso 4 · El mismo tren, <b>cortado a lo largo</b>: el volante, los cuatro cilindros, MG1, el planetario, MG2, la PCU y la batería. Los puntos naranja son potencia mecánica; los cian, eléctrica.',9500);
    await espera(9900);
    fija({v:130,P:30,gestion:'optimo'}); ponVista('engranaje');
    showToast('Paso 5 · <b>Autopista a 130 km/h</b>: el solar queda casi parado. Toda la potencia viaja por el engranaje, sin pasar por la electricidad: es el punto más eficiente.',8500);
    await espera(8900);
    fija({v:150,P:30,gestion:'optimo'});
    showToast('Paso 6 · A 150 km/h el solar gira <b>al revés</b> aunque el motor empuja: MG1 trabaja de motor y la potencia circula en lazo. La palanca de Willis lo muestra.',8500);
    await espera(8900);
    fija({v:80,P:-15,gestion:'ev'});
    showToast('Paso 7 · <b>Frenada regenerativa</b>: MG2 se convierte en generador y devuelve energía a la batería (flecha amarilla hacia abajo).',7500);
    await espera(7900);
  } finally {
    Object.assign(EST,prev); EST.autoRunning=false; hud.style.pointerEvents='';
    pintaHUD(); pintaDockFijo(); ponVista(prev.vista); pintaBarras();
  }
}


/* ===================== 16. SONIDO (sintetizado) =====================
   El zumbido del motor térmico sigue a su régimen y el de las máquinas
   eléctricas a su velocidad: más agudo cuanto más deprisa. */
const sonido=(function(){
  let ctx=null,on=true,master=null,oscM=null,gM=null,oscE=null,gE=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      oscM=ctx.createOscillator(); oscM.type='sawtooth'; const fM=ctx.createBiquadFilter(); fM.type='lowpass'; fM.frequency.value=380; gM=ctx.createGain(); gM.gain.value=0; oscM.connect(fM); fM.connect(gM); gM.connect(master); oscM.start();
      oscE=ctx.createOscillator(); oscE.type='sine'; gE=ctx.createGain(); gE.gain.value=0; oscE.connect(gE); gE.connect(master); oscE.start();
    }catch(e){ ctx=null; } }
  function actualiza(p,activo){ if(!ctx) return; const t=ctx.currentTime;
    oscM.frequency.setTargetAtTime(30+p.we/RPM/60*2,t,0.08);                     // 4 cilindros: 2 explosiones por vuelta
    gM.gain.setTargetAtTime(on&&activo&&p.we>0?0.020*(0.4+Math.min(1,p.Te/100)):0,t,0.1);
    oscE.frequency.setTargetAtTime(380+Math.min(2600,Math.abs(p.wr/RPM)*0.25+Math.abs(p.ws/RPM)*0.08),t,0.08);
    gE.gain.setTargetAtTime(on&&activo?0.006*Math.min(1,(Math.abs(p.P1dc)+Math.abs(p.P2dc))/20000):0,t,0.1); }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); }
  return {init,actualiza,
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; },
    get vol(){ return gM?gM.gain.value:0; }, get freq(){ return oscM?oscM.frequency.value:0; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});

/* ===================== 17. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.min(devicePixelRatio,alta?2:1.5));
  const ms=alta?2048:1024; if(LUZ.clave.shadow.mapSize.x!==ms){ LUZ.clave.shadow.mapSize.set(ms,ms); if(LUZ.clave.shadow.map){ LUZ.clave.shadow.map.dispose(); LUZ.clave.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  M_PUNTOS.uniforms.uPx.value=innerHeight*renderer.getPixelRatio()/(2*Math.tan(camera.fov*Math.PI/360));
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  M_PUNTOS.uniforms.uPx.value=innerHeight*renderer.getPixelRatio()/(2*Math.tan(camera.fov*Math.PI/360));
  colocaBarras(); MAPA.clave='';
  clearTimeout(window.__rzTH); window.__rzTH=setTimeout(()=>ponVista(VISTA.actual,0.01),140);
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 18. EL LAZO: UN SOLO RELOJ =====================
   El estado del modelo (SIM.pt) se calcula una vez por cuadro y con ÉL se
   pintan la escena (giros de los tres ejes, émbolos, llamas, brillos y
   flujos) y el dock (palanca, mapa, reparto y SOC). */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  aplicaEscena(EST.pausa?0:dt*EST.esc,dt,t);
  pasaCam(dt);
  sonido.actualiza(SIM.pt,!EST.pausa);
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaLev(); pintaMapa(); pintaSt(); }
  controls.update();
  PASO_G.value=clamp(0.0030*camera.position.distanceTo(controls.target),0.0007,0.008);
  renderer.info.reset(); composer.render();
  colocaRotulos();
}

/* ===================== 19. ARRANQUE =====================
   Abre funcionando: 80 km/h pidiendo 18 kW, gestión óptima, corte transversal
   del planetario a cámara lenta ×1/60. */
disposicion();
ponCorte('trans');
aplicaCalidad();
pintaHUD();
calcula();
pintaDockFijo();
pintaBarras();
pintaRotulos();
ponVista('engranaje',0.001);
cuadro();
setTimeout(()=>showToast('Conjunto planetario <b>cortado por la mitad</b> y girando a cámara lenta ×1/60. '+(matchMedia('(hover: hover)').matches?'Pasa el ratón por':'Toca')+' una pieza para saber qué es.',5200),600);

window.__labDebug={

    P1sh:p.P1sh,P2sh:p.P2sh,P1dc:p.P1dc,P2dc:p.P2dc,Pbat:p.Pbat,mf:p.mf,bsfc:p.bsfc,soc:SIM.soc,lim:p.lim,falla:p.falla,
    residuoMec:residuoMecanico(p),residuoBal:residuoBalance(p),thS:G_SOL.rotation.z,thC:G_PORTA.rotation.z,thR:G_COR.rotation.z}; },
  escena(){ return {vista:VISTA.actual,corte:EST.corte,calidad:CAL.nivel,pixel:renderer.getPixelRatio(),rotulos:ROT.on,pausa:EST.pausa,esc:EST.esc,modo:EST.modo,

  cam(){ const r=v=>[+v.x.toFixed(3),+v.y.toFixed(3),+v.z.toFixed(3)]; return {pos:r(camera.position),target:r(controls.target),hueco:huecoLibre(),fps:FPS.v}; },
};
window.__test=Object.assign(window.__test||{},{

  audioState:()=>({ctxState:sonido.ctx?sonido.ctx.state:'none',vol:sonido.vol,freq:sonido.freq,soundOn:sonido.on}),

});

{ const bx=new THREE.Box3(), sz=new THREE.Vector3();
