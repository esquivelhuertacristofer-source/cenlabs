<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Seguridad Pasiva en el Choque — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#0b1017;--panel:rgba(11,17,25,.88);--line:#26364a;--ink:#EEF3F8;
    --dim:#93a8bd;--accent:#F08A3C;--accent2:#FFB27A;--hv:#FFD166;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cV:#4FD1C5;--cC:#FF8A3D;--cB:#FFD166;--cG:#9AA9FF;--cH:#FF5A5F;--cT:#9FF3FF;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#16202c;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#1c2a3a}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#1a0e04;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#1a0e04;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#ff9d55}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#1a0e04}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#F08A3C;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#7890a8;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c8d4e0;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#8aa0b6;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#04211c}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#0a1119;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(38,54,74,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(38,54,74,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#7890a8}
  .dk-tit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#a9bdd0;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(38,54,74,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c9c4;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#16202c;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfe0dc;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cT);flex:none}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(12,18,26,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(11,17,25,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d6d2}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e9f0f7;background:rgba(11,18,26,.92);border:1px solid rgba(240,138,60,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e9f0f7;background:rgba(11,18,26,.84);border:1px solid rgba(240,138,60,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}
  body.estrecho.ancho.t-panel .panel>.dk-fig{grid-column:1;grid-row:2}
  body.estrecho.ancho.t-panel .panel>.dk-row{grid-column:1;grid-row:3/6;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-fu{grid-column:2;grid-row:2;align-self:start}
  body.estrecho.ancho.t-panel .panel>.dk-g.fu{grid-column:2;grid-row:2/4;min-height:0;margin-top:18px}
  body.estrecho.ancho.t-panel .panel>.dk-ley{display:none}
  body.estrecho.ancho.t-panel .panel>.t-sp{grid-column:2;grid-row:4}
  body.estrecho.ancho.t-panel .panel>.dk-g.sp{grid-column:2;grid-row:5;min-height:0}
  body.estrecho.ancho.t-panel .panel>.dk-aviso{display:none}
  body.estrecho .hud details>.cuerpo{max-height:24vh}
  body.estrecho.ancho.t-hud .hud{display:grid;grid-template-columns:1fr 1.05fr;column-gap:14px;row-gap:7px;align-content:start;grid-auto-flow:row dense}
  body.estrecho.ancho .hud>.hcab,body.estrecho.ancho .hud>.modebar,body.estrecho.ancho .hud>.hdet,body.estrecho.ancho .hud>.pasos{grid-column:1}
  body.estrecho.ancho .hud>.hmandos,body.estrecho.ancho .hud>.retoBox{grid-column:2;grid-row:1/span 4}
  body.estrecho .hdet{flex-direction:row}body.estrecho .hdet>details{flex:1;min-width:0}
  body.estrecho .hdet details[open]{position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 54px);z-index:25;background:rgba(11,17,25,.97)}
  body.movil .lt{display:none} body.movil .tbar .modo,body.movil .tbar .reloj{display:none}
  body.movil .tbar{gap:6px;padding:5px 8px} body.movil .tbar .est{min-width:0}
  body.movil .dk-ley{display:none} body.movil .fg b{font-size:13.5px} body.movil .fg .fl{font-size:9.5px}
  body.movil .dk-g.fu{min-height:70px} body.movil .dk-g.sp{min-height:52px} body.movil .dk-row{min-height:150px}
  body.movil .hud h2{font-size:15.5px} body.movil .hud .intro{font-size:11.8px;line-height:1.42}
  body.estrecho .hud{overflow-y:auto}
  body.estrecho .vbar [data-t="rot"],body.estrecho .vbar .sep.s1{display:none}
  body.estrecho.ancho .vbar{top:60px}
  body.movil .vbar{flex-wrap:nowrap;gap:3px;padding:3px 4px;top:54px} body.movil .vbar .sep{display:none} body.movil .vbar .b.sm{padding:5px 7px;font-size:11px}
  body.movil .vbar .lg{display:none}
  body.movil .tbar .lento{display:none}
  body.movil .hud{gap:6px;padding:10px 12px 9px} body.movil .hud .eyebrow{display:none}
  body.movil .modebar .b{padding:6px 4px 5px}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   LAB — SEGURIDAD PASIVA · ZONA DE DEFORMACIÓN, CINTURÓN Y AIRBAG
   (Dinámica del vehículo · mecanica-137)

   Un choque frontal contra una barrera rígida, a cámara lenta y en
   corte longitudinal. La zona de deformación se aplasta con una fuerza
   F(x) (rampa, meseta y fondo de carrera); el maniquí avanza dentro del
   habitáculo, el pretensor recoge la holgura del cinturón, el limitador
   fija su fuerza y el airbag se infla (gas ideal, inflador y ventilas)
   cuando el sensor ve que el coche ha perdido el ΔV umbral.

   Es un modelo de parámetros concentrados de un eje: NO es elementos
   finitos ni cumple una homologación. La física (estructura, cinturón,
   bolsa y el criterio de 3 ms) está en un bloque puro que un script de
   Node extrae TAL CUAL y verifica.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO=' ';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }


/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos
   marcas— y lo prueba: lo que se prueba es lo que corre. */

/* FISICA:INICIO */
/* ---------- 1.1 El banco ----------
   Parámetros concentrados, un solo eje (el del choque). Vehículo de masa M
   contra una barrera rígida; un ocupante de masa efectiva m_o con cinturón
   (resorte–amortiguador con pretensor y limitador de fuerza) y airbag de
   conductor (gas ideal con inflador, ventilas y calor cedido a la tela). */
const G0=9.80665, P_ATM=101325;
const AIRE={ R:287, cp:1005, cv:1005-287 };
const VEH={ M:1400, vRef:56/3.6, eta:0.90, xr:0.06, cFondo:0.025, cDesc:0.010 };
/* Tres ocupantes. m = masa efectiva del tórax, la cabeza y los brazos que sostienen el cinturón y la bolsa
   (piernas, pelvis y asiento no se calculan); g0 = holgura del tórax al módulo del volante. */
const OCUP={ p5:{m:19,g0:0.27,nom:'Mujer p5 · 49 kg'}, p50:{m:32,g0:0.32,nom:'Hombre p50 · 78 kg'}, p95:{m:44,g0:0.36,nom:'Hombre p95 · 102 kg'} };
const D_CUBO=0.040;            // m: grosor del cubo y la bolsa plegada. Contacto duro desde g0 − 0,040
const D_GOLPE=0.060;           // m: tórax a menos de 6 cm del módulo ≡ «golpea el volante»
const K_CUBO=1.2e6, C_CUBO=2000;
const CINT={ kw:90e3, cw:1200, holgura:0.040, extra:0.005, tauPre:0.006, tPre:0.008, latencia:0.002 };
const BOLSA={ Vmax:0.055, A:0.12, V0:0.002, pU:3000, mInf:0.040, tInf:0.030, Tin:900, Tw:300, tauT:0.03, Av:0.0045, Cd:0.7,
  pAlivio:55e3, dAlivio:35e3, AvAlivio:0.0085 };

/** Estructura delantera de un coche cuya longitud útil de aplastamiento es L (m), afinada para parar el choque de
 *  vDis (m/s) usando el 90 % de L: s = x_r/2 + E/F_c ⇒ F_c = E/(η·L − x_r/2). */
function estructura(L,vDis){
  const Fc=0.5*VEH.M*vDis*vDis/(VEH.eta*L-VEH.xr/2);
  return { L, Fc, xr:VEH.xr, kb:Fc/VEH.cFondo, ku:Fc/VEH.cDesc };
}
/** Fuerza de carga de la barrera sobre el vehículo para un aplastamiento x (m). */
function fuerzaCarga(S,x){
  if(x<=0) return 0;
  return (x<S.xr?S.Fc*x/S.xr:S.Fc)+(x>S.L?S.kb*(x-S.L):0);
}
const suave=x=>x<=0?0:(x>=1?1:x*x*(3-2*x));

/** Presión de una bolsa que se despliega sin tocar nada: pU para vencer la tela, y nada si está desinflada. */
function pLibre(V,B){ return P_ATM+B.pU*suave(V/(0.12*B.Vmax)); }

/** Caudal de un orificio (subsónico o bloqueado), kg/s, de una cámara a p y T hacia el aire. */
function caudalOrificio(p,T,Av,Cd){
  if(p<=P_ATM) return 0;
  const g=1005/(1005-287), pr=P_ATM/p, crit=Math.pow(2/(g+1),g/(g-1));
  if(pr>crit) return Cd*Av*p*Math.sqrt(2*g/((g-1)*AIRE.R*T)*(Math.pow(pr,2/g)-Math.pow(pr,(g+1)/g)));
  return Cd*Av*p*Math.sqrt(g/(AIRE.R*T))*Math.pow(2/(g+1),(g+1)/(2*(g-1)));
}
/** Caudal del inflador: media senoide de masa total mInf en tInf, desde el disparo. */
function caudalInflador(tau,B){ return (tau>=0&&tau<=B.tInf)?(Math.PI/2)*(B.mInf/B.tInf)*Math.sin(Math.PI*tau/B.tInf):0; }
/** El gas de la bolsa. libre = la bolsa se infla sin tocar al ocupante, a la presión pU de desplegar la tela:
 *  m·c_p·dT/dt = ṁ_in·c_p·(T_in − T) − Q (las ventilas no cambian T). Con el volumen impuesto (tela tensa o
 *  comprimida por el ocupante): m·c_v·dT/dt = ṁ_in(c_p·T_in − c_v·T) − ṁ_out·R·T − p·dV/dt − Q. Q = m·c_v·(T − T_w)/τ. */
function derivGas(m,T,V,Vp,mIn,libre,B){
  const p=libre?pLibre(V,B):m*AIRE.R*T/V;
  const Av=B.Av+B.AvAlivio*suave((p-P_ATM-B.pAlivio)/B.dAlivio);
  const mOut=caudalOrificio(p,T,Av,B.Cd), Q=m*AIRE.cv*(T-B.Tw)/B.tauT;
  const dm=mIn-mOut;
  let dT;
  if(libre) dT=(mIn*AIRE.cp*(B.Tin-T)-Q)/(m*AIRE.cp);
  else dT=(mIn*(AIRE.cp*B.Tin-AIRE.cv*T)-mOut*AIRE.R*T-p*Vp-Q)/(m*AIRE.cv);
  return { dm, dT, mOut, p };
}
/** Presión, volumen y contacto de la bolsa para un tórax en ξ. */
function estadoBolsa(m,T,xi,g0,B){
  const Vlibre=m*AIRE.R*T/(P_ATM+B.pU), dist=Math.max(D_CUBO,g0-xi), Vgeo=B.A*dist, tope=Math.min(B.Vmax,Vgeo);
  if(Vlibre<=tope) return { libre:true, V:Vlibre, p:pLibre(Vlibre,B), contacto:false, tensa:false };
  const V=tope, contacto=Vgeo<B.Vmax;
  return { libre:false, V, p:m*AIRE.R*T/V, contacto, tensa:!contacto, Vp:null };
}

/** Criterio de 3 ms acumulados: el nivel de la serie (muestreada cada dt) que se supera durante 3 ms en total. */
function a3ms(serie,dt){
  const orden=serie.slice().sort((a,b)=>b-a), k=Math.max(0,Math.round(0.003/dt)-1);
  return orden[Math.min(k,orden.length-1)];
}
/** El choque completo. p = { vKmh, vDisKmh, L, ocup, Flim (N), dVth (km/h: el sensor dispara cuando el vehículo ha perdido esa velocidad), tFire (s, disparo fijo, o null: sin bolsa), pretensor, sinOcup, tFin, dt }.
 *  Devuelve las series cada 0,1 ms y las cifras de mérito. */
function simula(p){
  p=Object.assign({ vKmh:56, vDisKmh:56, L:0.60, ocup:'p50', Flim:5000, tFire:0.020, dVth:null, pretensor:true, sinOcup:false, tFin:0.20, dt:2.5e-5, sinCint:false, bolsa:null },p);
  const O=OCUP[p.ocup], mo=O.m, g0=O.g0, M=VEH.M, v0=p.vKmh/3.6, S=estructura(p.L,p.vDisKmh/3.6), B=Object.assign({},BOLSA,p.bolsa||{});
  const dt=p.dt, N=Math.round(p.tFin/dt), cada=Math.max(1,Math.round(1e-4/dt));
  // estado: x, v, ξ, w, m_gas, T_gas, W_c, W_rest, m_out
  let y=[0,v0,0,0, P_ATM*B.V0/(AIRE.R*300),300, 0,0,0];
  let tF=p.dVth!=null?Infinity:(p.tFire===null?Infinity:p.tFire);
  const modo={ desc:false, xmax:0, Fmax:0, xp:0, pay:0, lim:false, fired:false };
  const delta=t=>p.pretensor?CINT.holgura-(CINT.holgura+CINT.extra)*suave((t-CINT.tPre)/CINT.tauPre):CINT.holgura;
  const dDelta=t=>{ if(!p.pretensor) return 0; const u=(t-CINT.tPre)/CINT.tauPre; return (u<=0||u>=1)?0:-(CINT.holgura+CINT.extra)*6*u*(1-u)/CINT.tauPre; };
  const fuerzas=(t,s)=>{
    const [x,v,xi,w,m,T]=s;
    // vehículo
    let Fc=0;
    if(!modo.desc) Fc=fuerzaCarga(S,x); else Fc=x>modo.xp?modo.Fmax*(x-modo.xp)/(modo.xmax-modo.xp):0;
    // cinturón
    let Fb=0, e=xi-delta(t)-modo.pay;
    if(!p.sinCint&&e>0){ Fb=Math.min(Math.max(0,CINT.kw*e+CINT.cw*(w-dDelta(t))),p.Flim); }
    // cubo del volante
    const pen=xi-(g0-D_CUBO); let Fh=0; if(pen>0) Fh=Math.max(0,K_CUBO*pen+C_CUBO*w);
    // bolsa
    let Fg=0, bs=null, mIn=0;
    const activa=t>=tF;
    if(activa){ bs=estadoBolsa(m,T,xi,g0,B); mIn=caudalInflador(t-tF,B); if(bs.contacto&&bs.p>P_ATM) Fg=(bs.p-P_ATM)*B.A; }
    return { Fc, Fb, Fh, Fg, bs, mIn, activa };
  };
  const d=(t,s)=>{
    const [x,v,xi,w,m,T]=s, f=fuerzas(t,s);
    const Fo=p.sinOcup?0:f.Fb+f.Fh+f.Fg;
    const vp=(-f.Fc+Fo)/M, wp=p.sinOcup?-vp:-Fo/mo-vp;
    let dm=0,dT=0,mOut=0;
    if(f.activa){
      const Vp=(f.bs.contacto)?-B.A*w:0;
      const g=derivGas(m,T,f.bs.V,Vp,f.mIn,f.bs.libre,B); dm=g.dm; dT=g.dT; mOut=g.mOut;
    }
    return [v,vp,w,wp,dm,dT,f.Fc*v,Fo*w,mOut];
  };
  const out={ t:[], x:[], v:[], aV:[], xi:[], aCh:[], Fb:[], Fg:[], Fh:[], Fc:[], pg:[], Vb:[], Wc:[], Wr:[], KEv:[], KEo:[], contacto:[], mG:[] };
  let t=0;
  for(let n=0;n<=N;n++){
    if(n%cada===0){
      const s=y, f=fuerzas(t,s), Fo=p.sinOcup?0:f.Fb+f.Fh+f.Fg, dd=d(t,s);
      out.t.push(t); out.x.push(s[0]); out.v.push(s[1]); out.aV.push(-dd[1]/G0); out.xi.push(s[2]);
      out.aCh.push(Fo/(mo*G0)); out.Fb.push(f.Fb); out.Fg.push(f.Fg); out.Fh.push(f.Fh); out.Fc.push(f.Fc);
      out.pg.push(f.activa&&f.bs?(f.bs.p-P_ATM):0); out.Vb.push(f.activa&&f.bs?f.bs.V:0);
      out.Wc.push(s[6]); out.Wr.push(s[7]); out.mG.push(s[4]);
      out.KEv.push(0.5*M*s[1]*s[1]); out.KEo.push(0.5*mo*(s[1]+s[3])*(s[1]+s[3])); out.contacto.push(f.activa&&f.bs&&f.bs.contacto?1:0);
    }
    if(n===N) break;
    // RK4
    const k1=d(t,y), y2=y.map((q,i)=>q+0.5*dt*k1[i]), k2=d(t+dt/2,y2), y3=y.map((q,i)=>q+0.5*dt*k2[i]), k3=d(t+dt/2,y3),
          y4=y.map((q,i)=>q+dt*k3[i]), k4=d(t+dt,y4);
    const yn=y.map((q,i)=>q+dt/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i]));
    // gas: no cae por debajo de cero
    if(yn[4]<1e-9) yn[4]=1e-9;
    if(yn[0]<0&&modo.desc) yn[0]=yn[0];
    // descarga: cuando la velocidad se anula, el vehículo se para y empieza a recuperar
    if(!modo.desc&&yn[1]<=0&&y[1]>0){ modo.desc=true; modo.xmax=yn[0]; modo.Fmax=fuerzaCarga(S,yn[0]); modo.xp=modo.xmax-modo.Fmax/S.ku; }
    // cinturón: el exceso sobre el limitador se paga como tira de cinta
    { const tn=t+dt, e=yn[2]-delta(tn)-modo.pay; if(!p.sinCint&&CINT.kw*e>p.Flim){ modo.pay+=e-p.Flim/CINT.kw; } }
    // el sensor: dispara cuando la velocidad perdida por el vehículo alcanza el umbral (más el retardo del algoritmo)
    if(p.dVth!=null&&tF===Infinity&&(v0-yn[1])>=p.dVth/3.6) tF=t+dt+CINT.latencia;
    y=yn; t+=dt;
  }
  // —— cifras de mérito ——
  const nt=out.t.length, dtO=1e-4, g=G0;
  let aVmax=0, xmax=0, xiMax=0, FbMax=0, pgMax=0, ach=out.aCh.slice();
  for(let i=0;i<nt;i++){ if(out.aV[i]>aVmax) aVmax=out.aV[i]; if(out.x[i]>xmax) xmax=out.x[i]; if(out.xi[i]>xiMax) xiMax=out.xi[i]; if(out.Fb[i]>FbMax) FbMax=out.Fb[i]; if(out.pg[i]>pgMax) pgMax=out.pg[i]; }
  const a3=a3ms(ach,dtO);
  let iStop=out.v.findIndex(q=>q<=0); if(iStop<0) iStop=nt-1;
  const tStop=out.t[iStop], vRebote=Math.max(0,-out.v[nt-1]), dV=v0+Math.max(0,-Math.min(...out.v));
  const aMedia=v0/Math.max(tStop,1e-9)/g;
  const res={ tFire:tF===Infinity?null:tF, out, p, S, O, v0, aVmax, xmax, xiMax, FbMax, pgMax, a3, tStop, dV, aMedia, vRebote,
    golpe:xiMax>g0-D_GOLPE, fondo:xmax>S.L, hub:out.Fh.some(q=>q>0),
    xiHolgura:g0-D_GOLPE, mOcup:mo, g0, mFinal:y[4], mOutFinal:y[8], estado:y, modo };
  return res;
}
/** Parte de la física que mira el dock: el estado interpolado de la corrida a un tiempo t (s). */
function muestraEn(R,t){

   PBR con entorno. Nada de grano fino —se lee como lija—: variaciones lentas de rugosidad y, donde la pieza lo
   pide, su dibujo (juntas del hormigón, retícula del suelo, la diana del maniquí). */
function ruidoPeriodico(semilla,periodo){
  const g=(x,y)=>{ x=((x%periodo)+periodo)%periodo; y=((y%periodo)+periodo)%periodo;
    const s=Math.sin(x*127.1+y*311.7+semilla*13.13)*43758.5453; return s-Math.floor(s); };
  return (x,y)=>{ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    return g(xi,yi)*(1-u)*(1-v)+g(xi+1,yi)*u*(1-v)+g(xi,yi+1)*(1-u)*v+g(xi+1,yi+1)*u*v; };
}
/** Textura de baja frecuencia: media 0..1 con variación suave (rugosidad o tono). */
function manchas(semilla,{px=256,celdas=4,base=0.5,amp=0.1,tono=null}={}){
  const f=ruidoPeriodico(semilla,celdas), k=celdas/px, c=cv(px), x=c.getContext('2d'), im=x.createImageData(px,px);
  for(let j=0;j<px;j++) for(let i=0;i<px;i++){ const n=(f(i*k,j*k)-0.5)*2*amp, o=(j*px+i)*4;
    if(tono){ for(let q=0;q<3;q++) im.data[o+q]=clamp(tono[q]*(1+n),0,255); } else { const v=clamp(base+n,0,1)*255; im.data[o]=im.data[o+1]=im.data[o+2]=v; }
    im.data[o+3]=255; }
  x.putImageData(im,0,0); return c;
}

/** Un contorno [x,y] extruido a lo largo de Z (de z0 a z1), con bisel pequeño; las normales se sanean. */
function extruye(pts,z0,z1,{bisel=0.006,seg=3}={}){
  const sh=new THREE.Shape(pts.map(([x,y])=>new THREE.Vector2(x,y)));

/** Un listón de ancho w (en z) y grosor t siguiendo una polilínea [x,y] del plano XY: la sección plana de una chapa. */
function cinta(pts,t,z0,z1){
  const pos=[],nor=[],idx=[],n=pts.length;
  for(let i=0;i<n;i++){
    const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)]; let tx=b[0]-a[0],ty=b[1]-a[1]; const l=Math.hypot(tx,ty)||1; tx/=l; ty/=l;
    const nx=-ty,ny=tx; for(const s of [-1,1]) for(const z of [z0,z1]){ pos.push(pts[i][0]+nx*t/2*s,pts[i][1]+ny*t/2*s,z); nor.push(nx*s,ny*s,0); } }
  // por punto: 4 vértices (cara - z0, cara - z1, cara + z0, cara + z1); sólo las dos caras grandes y los cantos
  for(let i=0;i<n-1;i++){ const a=i*4,b=(i+1)*4;
    idx.push(a,b,a+1, a+1,b,b+1);        // cara −
    idx.push(a+2,a+3,b+2, a+3,b+3,b+2);  // cara +
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3)); g.setIndex(idx); return g;
}

/** Una malla cuadriculada (nu+1)×(nv+1) cuyos vértices se recolocan cada cuadro: la chapa y los largueros que se pliegan. */
class Malla{
  constructor(nu,nv,mat,k,{cerrada=false,sombra=true}={}){
    this.nu=nu; this.nv=nv; this.cerrada=cerrada;
    const nvv=nv+1, n=(nu+1)*nvv; this.pos=new Float32Array(n*3);
    const idx=[]; for(let i=0;i<nu;i++) for(let j=0;j<nv;j++){ const a=i*nvv+j, b=(i+1)*nvv+j, c=a+1, d=b+1; idx.push(a,b,c, c,b,d); }
    this.geo=new THREE.BufferGeometry(); this.geo.setAttribute('position',new THREE.BufferAttribute(this.pos,3).setUsage(THREE.DynamicDrawUsage));
    this.geo.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(n*3),3).setUsage(THREE.DynamicDrawUsage)); this.geo.setIndex(idx);
    this.mesh=new THREE.Mesh(this.geo,mat); this.mesh.castShadow=sombra; this.mesh.receiveShadow=true; this.mesh.frustumCulled=false; if(k) this.mesh.userData.pieza=k;
  }
  /** fn(i,j,out): llena out[0..2] con la posición del vértice (i a lo largo, j a lo ancho/alrededor). */
  rellena(fn){
    const o=[0,0,0], nvv=this.nv+1;
    for(let i=0;i<=this.nu;i++) for(let j=0;j<=this.nv;j++){ fn(i,j,o); const k=(i*nvv+j)*3; this.pos[k]=o[0]; this.pos[k+1]=o[1]; this.pos[k+2]=o[2]; }
    this.geo.attributes.position.needsUpdate=true; this.geo.computeVertexNormals();
    // normal nula = pantalla negra: donde un vértice sólo toca triángulos degenerados, se le da la dirección +Z
    const n=this.geo.attributes.normal; for(let q=0;q<n.count;q++){ const x=n.getX(q),y=n.getY(q),z=n.getZ(q); if(x*x+y*y+z*z<1e-10) n.setXYZ(q,0,0,1); }
    n.needsUpdate=true;
  }
}

/** Recoloca todo lo que se aplasta. L = recorrido útil; x = aplastamiento actual; cmax = lo máximo aplastado hasta ahora. */
function poseaFrente(L,x,cmax,calor){
  const Xe=-(L+U_PARA)+x;                                  // cara delantera del motor, mundo
  const Xv=-0.14;                                          // cara trasera del travesaño
  const Lc=Math.max(0.03,Xv-Xe);                           // lo que queda de la zona de deformación
  const c=clamp(cmax/L,0,1.25);
  const nF=clamp(Math.round(L/0.075),4,12);
  for(const R of RIEL){
    R.rellena((i,j,o)=>{
      const s=i/R.nu, th=j/R.nv*Math.PI*2, pli=Math.pow(Math.abs(Math.sin(Math.PI*nF*s)),1.1);
      const k=1+0.62*c*pli;
      const hy=0.055*k, hz=0.045*k;
      const cx=Math.cos(th), sx=Math.sin(th), e=0.32;           // sección «superelipse»: rectángulo de esquinas redondas
      const py=Math.sign(sx)*Math.pow(Math.abs(sx),e)*hy, pz=Math.sign(cx)*Math.pow(Math.abs(cx),e)*hz;
      o[0]=Xe+s*Lc; o[1]=R.y0+py+0.018*c*Math.sin(Math.PI*nF*s+R.id)+0.03*c*Math.sin(Math.PI*s)*(R.id?-1:1); o[2]=R.z0+pz+0.012*c*Math.sin(Math.PI*nF*s*0.5);
    });
  }
  M.rail.emissive.setRGB(1.0,0.30,0.06).multiplyScalar(0.9*clamp(calor,0,1));
  // capó: del borde del parabrisas (va con el habitáculo) al borde del paragolpes (fijo en la barrera); se arruga hacia arriba
  const Xw=-(L+U_PARA)+x+U_MOT1+0.06, Xf=-0.045, chord=Math.max(0.12,Xf-Xw), Lh0=(U_MOT1+0.06)+L+U_PARA-0.045;
  const exceso=Math.max(0,Lh0-chord), A=Math.min(0.40,(2/Math.PI)*Math.sqrt(exceso*chord));
  CAPO.rellena((i,j,o)=>{ const s=i/CAPO.nu, z=-0.86*(j/CAPO.nv);
    const yb=0.98-0.18*bezier(s), arr=A*Math.pow(Math.sin(Math.PI*s),1.0)+0.012*c*Math.sin(Math.PI*2.5*s)*Math.sin(Math.PI*s);
    o[0]=Xw+s*(Xf-Xw); o[1]=yb+arr; o[2]=z; });
  // aleta lejana: chapa vertical a z = −0,86 que se ondula
  ALETA.rellena((i,j,o)=>{ const s=i/ALETA.nu, v=j/ALETA.nv, yTop=0.98-0.18*bezier(s)+A*Math.sin(Math.PI*s), yBot=0.30;
    o[0]=Xw+s*(Xf-Xw); o[1]=yBot+(yTop-yBot)*v; o[2]=-0.86-0.035*c*Math.sin(Math.PI*nF*0.5*s)*Math.sin(Math.PI*v); });
  return {Xe,Lc};
}

/** Brazo de dos eslabones (planar en XY, con codo hacia abajo): hombro S, mano objetivo T, devuelve el codo. */
function codoIK(S,T,l1,l2,out){
  let dx=T.x-S.x, dy=T.y-S.y, d=Math.hypot(dx,dy); const dd=clamp(d,Math.abs(l1-l2)+1e-3,l1+l2-1e-3);
  const a=(l1*l1-l2*l2+dd*dd)/(2*dd), h=Math.sqrt(Math.max(0,l1*l1-a*a)), ux=dx/(d||1), uy=dy/(d||1);
  const ex=S.x+ux*a, ey=S.y+uy*a;
  // el codo cae hacia abajo y afuera: perpendicular con la componente −y
  let px=-uy, py=ux; if(py>0){ px=-px; py=-py; }
  out.set(ex+px*h,ey+py*h,S.z); return d>l1+l2? 'estirado':'doblado';
}

/* ===================== 6c. FUSIÓN DE LO ESTÁTICO =====================
   Cada pieza fija del habitáculo y de la pista se funde con las demás de su mismo material y su mismo nombre:
   ~110 mallas pasan a ~15 llamadas de dibujo. Las piezas que se mueven (maniquí, cinta, bolsa, chapa que se
   pliega, el asiento) NO se funden. El nombre de cada pieza se conserva para el tooltip. */
function fusionaEstatico(raiz,excluir){
  raiz.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(raiz.matrixWorld).invert(), cubos=new Map(), quitar=[];
  raiz.traverse(o=>{
    if(!o.isMesh||o.userData.dinamico) return;
    for(let p=o.parent;p&&p!==raiz;p=p.parent) if(excluir.includes(p)) return;
    const k=o.material.uuid+'|'+(o.userData.pieza||'')+'|'+(o.castShadow?1:0)+(o.receiveShadow?1:0)+'|'+(o.renderOrder||0);
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();
    g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld));
    const n=g.attributes.position.count; if(!g.attributes.uv) g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(n*2),2));
    for(const a of Object.keys(g.attributes)) if(!['position','normal','uv'].includes(a)) g.deleteAttribute(a);
    if(!cubos.has(k)) cubos.set(k,{mat:o.material,pieza:o.userData.pieza,cs:o.castShadow,rs:o.receiveShadow,ro:o.renderOrder,gs:[]});
    cubos.get(k).gs.push(g); quitar.push(o);
  });
  for(const o of quitar){ o.parent.remove(o); o.geometry.dispose(); }
  for(const c of cubos.values()){
    let n=0; for(const g of c.gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o3=0,o2=0;
    for(const g of c.gs){ pos.set(g.attributes.position.array,o3); nor.set(g.attributes.normal.array,o3); uv.set(g.attributes.uv.array,o2); o3+=g.attributes.position.count*3; o2+=g.attributes.position.count*2; g.dispose(); }
    const G=new THREE.BufferGeometry(); G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2)); G.computeBoundingSphere();
    const m=new THREE.Mesh(G,c.mat); m.castShadow=c.cs; m.receiveShadow=c.rs; m.renderOrder=c.ro; if(c.pieza) m.userData.pieza=c.pieza; raiz.add(m);
  }
}

/* ===================== 7. EL ESTADO Y LA CORRIDA =====================
   Una corrida = el choque completo calculado por `simula()` (el bloque verificado). Se recalcula sólo cuando cambia un
   mando; la escena y el dock leen de ella, con el MISMO reloj SIMU.t, el estado de cada instante. */
const T_PRE=-0.020, T_FIN=0.16, ESPERA=1.5;           // s: rodaje previo al contacto, fin de la corrida, pausa antes de repetir

function paramsActuales(){

    const b=DIS_BUENO(E), f=fault;
    return {vKmh:E.vKmh,vDisKmh:E.vKmh,L:b.L,ocup:E.ocup,Flim:f==='limitador'?11000:b.Flim,dVth:f==='airbag'?null:b.th,tFire:null,pretensor:f!=='pretensor'};
  }

  return {vKmh:V_DISENO,vDisKmh:V_DISENO,L:EST.L,ocup:'p50',Flim:EST.Flim,dVth:EST.th,tFire:null,pretensor:true};       // fundamento: un choque de muestra
}
function claveDe(p){ return [p.vKmh,p.vDisKmh,p.L.toFixed(3),p.ocup,p.Flim,p.dVth,p.pretensor].join('|'); }
function recalcula(reinicia=true){
  const p=paramsActuales(), k=claveDe(p);

  pintaDockFijo();
}
const reinicia=()=>{ SIMU.t=T_PRE; SIMU.espera=0; SIMU.cmax=0; };

/* ---- el estado que se ve en este cuadro ---- */
const ST={s:null,x:0,xv:0,xi:0,calor:0,tens:0,tEvento:'',pretCarga:0};
function eventoDe(t,R){
  const o=R.out; let ev=[[T_PRE,'Antes del contacto'],[0,'Contacto con la barrera']];
  if(R.p.pretensor) ev.push([CINT.tPre,'Pretensor recoge la holgura']);
  if(R.tFire!==null) ev.push([R.tFire,'El sensor dispara el airbag']);
  const iC=o.Fb.findIndex(q=>q>50); if(iC>=0) ev.push([o.t[iC],'El tórax carga el cinturón']);
  const iB=o.Fg.findIndex(q=>q>50); if(iB>=0) ev.push([o.t[iB],'El tórax carga la bolsa']);
  ev.push([R.tStop,'El vehículo se detiene']);
  const iX=o.xi.indexOf(Math.max(...o.xi)); ev.push([o.t[iX],'Tórax en su máximo']);
  ev.sort((a,b)=>a[0]-b[0]); let r=ev[0][1]; for(const [te,tx] of ev) if(t>=te) r=tx; return r;
}
/* Un cuadro de la escena. dtS: tiempo SIMULADO (s); dtR: tiempo de pantalla. */
function aplicaEscena(dtS,dtR,t){
  const R=SIMU.R; if(!R) return;
  if(!EST.pausa){
    if(SIMU.t<T_FIN) SIMU.t=Math.min(T_FIN,SIMU.t+dtS);
    else { SIMU.espera+=dtR; if(SIMU.espera>ESPERA){ reinicia(); } }
  }
  const tt=SIMU.t, s=muestraEn(R,Math.max(0,tt));
  const pre=tt<0, v0=R.v0, dx=pre?v0*tt:0, x=pre?0:s.x;
  ST.s=s; ST.x=x; ST.xi=pre?0:s.xi; ST.pre=pre;
  SIMU.cmax=Math.max(SIMU.cmax,x); if(tt<=T_PRE+1e-9) SIMU.cmax=0;
  const L=R.p.L, uB0=U_MOT1+L+U_PARA;
  CAB.position.x=-uB0+x+dx; FRENTE.position.x=dx;
  // la fracción de la energía que ya ha absorbido la estructura tiñe de rojo las chapas
  const E0=0.5*(VEH.M+R.mOcup)*v0*v0, wc=pre?0:interp(R.out.Wc,tt,R.out.t)/E0; ST.calor=clamp(wc*1.6,0,1);
  const fr=poseaFrente(L,x,SIMU.cmax,ST.calor); ST.railMid=fr.Xe+fr.Lc/2;
  const pose=poseaManiqui(ST.xi);
  const tens=pre?0:s.Fb/Math.max(1,R.p.Flim); ST.tens=tens;
  const tPret=tt-CINT.tPre, rec=R.p.pretensor&&tPret>=0&&tPret<0.02?Math.sin(clamp(tPret/0.02,0,1)*Math.PI):0;
  poseaCinturon(pose,ST.xi,tens,rec);
  const tF=R.tFire, visible=tF!==null&&tt>=tF;
  poseaBolsa(visible,visible?s.Vb/BOLSA.A:0,visible?s.pg:0,visible?tt-tF:-1);
  // destello del impacto y su luz
  const g=pre?0:clamp(1-tt/0.010,0,1);
  DESTELLO.visible=g>0; M.destello.opacity=0.85*g; if(g>0) DESTELLO.scale.setScalar(0.05+0.32*(1-g));
  LUZ.golpe.intensity=g*5;
  ST.tEvento=eventoDe(tt,R);
  el('rmsN').textContent=fN(tt*1000,1);
}
function interp(arr,t,ts){ const dt=ts[1]-ts[0]; let f=t/dt; if(f<=0) return arr[0]; if(f>=arr.length-1) return arr[arr.length-1]; const i=Math.floor(f); return arr[i]+(arr[i+1]-arr[i])*(f-i); }


/* ===================== 9. CÁMARAS ENCAJADAS EN EL HUECO LIBRE ===================== */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function encaja(t,dir,pts,caja,margen=0){
  if(margen){ const mx=(caja.x1-caja.x0)*margen, my=(caja.y1-caja.y0)*margen; caja={x0:caja.x0+mx,x1:caja.x1-mx,y0:caja.y0+my,y1:caja.y1-my}; }
  const cam=camera.clone(), W=innerWidth, H=innerHeight, tan=Math.tan(cam.fov*Math.PI/360);
  cam.aspect=W/H; cam.updateProjectionMatrix();
  const cw=caja.x1-caja.x0, ch=caja.y1-caja.y0, cx=(caja.x0+caja.x1)/2, cy=(caja.y0+caja.y1)/2;
  let dist=6; const q=new THREE.Vector3(), der=new THREE.Vector3(), arr=new THREE.Vector3(); t=t.clone(); dir=dir.clone().normalize();
  for(let it=0;it<10;it++){
    cam.position.copy(t).addScaledVector(dir,dist); cam.lookAt(t); cam.updateMatrixWorld();
    let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9;
    for(const p of pts){ q.copy(p).project(cam); const sx=(q.x+1)/2*W, sy=(1-q.y)/2*H;
      a0=Math.min(a0,sx); a1=Math.max(a1,sx); b0=Math.min(b0,sy); b1=Math.max(b1,sy); }
    const k=Math.max((a1-a0)/cw,(b1-b0)/ch), wpp=2*tan*dist/H;
    der.setFromMatrixColumn(cam.matrixWorld,0); arr.setFromMatrixColumn(cam.matrixWorld,1);
    t.addScaledVector(der,((a0+a1)/2-cx)*wpp).addScaledVector(arr,-((b0+b1)/2-cy)*wpp);
    dist*=k;
  }
  return [t.clone().addScaledVector(dir,dist),t];
}
const caja3=(x0,y0,z0,x1,y1,z1)=>{ const r=[]; for(const x of [x0,x1]) for(const y of [y0,y1]) for(const z of [z0,z1]) r.push(V3(x,y,z)); return r; };
const VISTA={actual:'conjunto',sigue:false};
const uB0Actual=()=>U_MOT1+(SIMU.R?SIMU.R.p.L:EST.L)+U_PARA;
function vistaCam(v){

  VISTA.sigue=(v==='ocupante'||v==='bolsa');

  if(v==='ocupante'){ const p=caja3(X(-1.30),0.12,-0.45,X(0.10),1.50,0.35); return encaja(cen(p),V3(0.14,0.10,1),p,H,0.03); }

function cambia(fn){ if(EST.autoRunning) return; fn(); recalcula(true); pintaDock(); }
function enlazaHUD(){
  const H=el('hud');
  H.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  let deb=null; const dif=(f)=>{ clearTimeout(deb); deb=setTimeout(f,70); };
  const sl=(id,lab,fmt,fn)=>{ const r=el(id); if(!r) return; r.oninput=()=>{ if(EST.autoRunning) return; fn(+r.value); el(lab).textContent=fmt(+r.value); dif(()=>{ recalcula(true); pintaDock(); }); }; };
  sl('rV','vV',v=>fN(v,0)+' km/h',v=>{ EST.vKmh=v; });

  H.querySelectorAll('[data-bag]').forEach(b=>b.onclick=()=>cambia(()=>{ EST.bolsa=b.dataset.bag==='1'; pintaHUD(); }));
  H.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>cambia(()=>{ EST.pretensor=b.dataset.pre==='1'; pintaHUD(); }));
  if(el('btnRep')) el('btnRep').onclick=()=>{ reinicia(); EST.pausa=false; pintaBarras(); };
  if(el('btnAuto')) el('btnAuto').onclick=runAuto;
  H.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>handleAction(b.dataset.act,b));
  const hint=el('btnHint'); if(hint) hint.onclick=()=>handleAction(GUIA.paso==='diseno'?'hint-d':'hint-s',null);
  if(EST.modo==='guia') enlazaDiseno();
}

/** Fuerza de aplastamiento F(x): el área bajo la curva es la energía; el punto es el instante del reloj. */
function pintaFx(){
  const R=SIMU.R, L=LFX, x=abre(L); if(!R) return;
  const S=R.S, Wd=L.w, Hd=L.h, X0=34, X1=Wd-8, Y0=8, Y1=Hd-16;
  const xmax=Math.max(S.L*1.18,R.xmax*1.08), Fmax=Math.max(S.Fc*1.15,Math.max(...R.out.Fc)*1.06), Xp=v=>X0+v/xmax*(X1-X0), Yp=f=>Y1-f/Fmax*(Y1-Y0);

  const n=140; const xc=ST.x;
  x.beginPath(); x.moveTo(Xp(0),Yp(0)); for(let i=0;i<=n;i++){ const v=Math.min(xc,xmax)*i/n; x.lineTo(Xp(v),Yp(fuerzaCarga(S,v))); } x.lineTo(Xp(Math.min(xc,xmax)),Yp(0)); x.closePath();

  x.strokeStyle='#d8dfe8'; x.lineWidth=1.6; x.beginPath(); for(let i=0;i<=200;i++){ const v=xmax*i/200; const px=Xp(v), py=Yp(fuerzaCarga(S,v)); i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke();

  txt(x,fN(S.Fc/1000,0)+' kN',X0-3,Yp(S.Fc)+3,'#a9bdd0',8.5,'right','600'); raya(x,X0-2,Yp(S.Fc),X0+2,Yp(S.Fc),'#3d4f66');
  for(const [v,t] of [[0,'0'],[S.L,fN(S.L*100,0)+' cm']]) txt(x,t,Xp(v),Hd-3,'#7890a8',8.5,v?'right':'center','500');

/** Energía: apilada, lo que queda cinético en el vehículo y el ocupante, y lo que ya se llevó la estructura y la sujeción. */
function pintaEn(){
  const R=SIMU.R, L=LEN, x=abre(L); if(!R) return; const O=R.out, Wd=L.w, Hd=L.h, X0=6, X1=Wd-6, Y0=6, Y1=Hd-14, n=O.t.length;
  const E0=0.5*(VEH.M+R.mOcup)*R.v0*R.v0, Xp=t=>X0+t/T_FIN*(X1-X0), Yp=f=>Y1-f*(Y1-Y0);
  const capas=[['Wc',COL.est],['Wr',COL.res],['KEo',COL.cho],['KEv',COL.veh]];
  const acum=new Float32Array(n);
  const paso=Math.max(1,Math.floor(n/200));
  for(const [k,col] of capas){
    x.beginPath(); x.moveTo(Xp(0),Yp(0));
    const base=acum.slice();
    for(let i=0;i<n;i+=paso){ x.lineTo(Xp(O.t[i]),Yp((base[i]+O[k][i]/E0))); }
    x.lineTo(Xp(O.t[n-1]),Yp(base[n-1]+O[k][n-1]/E0));
    for(let i=n-1;i>=0;i-=paso){ x.lineTo(Xp(O.t[i]),Yp(base[i])); }
    x.closePath(); x.fillStyle=col; x.globalAlpha=0.78; x.fill(); x.globalAlpha=1;
    for(let i=0;i<n;i++) acum[i]+=O[k][i]/E0;
  }
  raya(x,X0,Y1+0.5,X1,Y1+0.5,'#3d4f66');
  const tt=clamp(SIMU.t,0,T_FIN), xc=Xp(tt); raya(x,xc,Y0,xc,Y1,'rgba(255,255,255,0.85)',1.2);
  const i=Math.min(n-1,Math.round(tt/(O.t[1]-O.t[0]))), pc=v=>fN(v/E0*100,0)+' %';
  el('t_en').textContent='zona '+pc(O.Wc[i])+' · cinturón '+pc(O.Wr[i]);
  txt(x,'0',X0+2,Hd-3,'#7890a8',8.5,'left','500'); txt(x,fN(T_FIN*1000,0)+' ms',X1,Hd-3,'#7890a8',8.5,'right','500');
}
/** Deceleración del vehículo y del tórax. La capa fija se pinta una vez por corrida. */
function capaPu(R,Wd,Hd,dpr){
  const c=PU.c; c.width=Math.round(Wd*dpr); c.height=Math.round(Hd*dpr); const x=c.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,Wd,Hd);
  const O=R.out, X0=26, X1=Wd-8, Y0=8, Y1=Hd-16, ocu=ocultaR();
  const pico=Math.max(R.aVmax,Math.max(...O.aCh)); const ym=techo(pico*1.08,[30,40,50,60,80,100,120,160,200,300]);
  const Xp=t=>X0+t/T_FIN*(X1-X0), Yp=a=>Y1-clamp(a/ym,0,1.02)*(Y1-Y0);
  for(let q=0;q<=4;q++){ const v=ym*q/4; raya(x,X0,Yp(v),X1,Yp(v),'rgba(144,168,190,0.10)'); txt(x,fN(v,0),X0-3,Yp(v)+3,'#7890a8',8.5,'right','500'); }
  for(const t of [0,0.04,0.08,0.12,0.16]){ raya(x,Xp(t),Y1,Xp(t),Y1+3,'#3d4f66'); txt(x,fN(t*1000,0),Xp(t),Hd-3,'#7890a8',8.5,'center','500'); }
  raya(x,X0,Y1+0.5,X1,Y1+0.5,'#3d4f66');
  if(!ocu&&EST.modo==='marcha'){ raya(x,X0,Yp(60),X1,Yp(60),'rgba(255,90,95,0.45)',1,[2,3]); txt(x,'60 g · FMVSS 208',X1,Yp(60)-3,'#ff8a8f',8.5,'right','600'); }
  // tórax: área tenue + línea; vehículo: línea
  const line=(arr,col,w,fill)=>{ x.beginPath(); for(let i=0;i<arr.length;i++){ const px=Xp(O.t[i]), py=Yp(arr[i]); i?x.lineTo(px,py):x.moveTo(px,py); }
    if(fill){ x.save(); x.lineTo(Xp(O.t[arr.length-1]),Y1); x.lineTo(Xp(0),Y1); x.closePath(); x.fillStyle=fill; x.fill(); x.restore(); x.beginPath(); for(let i=0;i<arr.length;i++){ const px=Xp(O.t[i]), py=Yp(arr[i]); i?x.lineTo(px,py):x.moveTo(px,py); } }
    x.strokeStyle=col; x.lineWidth=w; x.lineJoin='round'; x.stroke(); };

}

/** Fuerzas sobre el tórax: cinturón, bolsa y, si lo golpea, el cubo del volante. */
function capaFr(R,Wd,Hd,dpr){
  const c=FR.c; c.width=Math.round(Wd*dpr); c.height=Math.round(Hd*dpr); const x=c.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,Wd,Hd);

  raya(x,X0,Y1+0.5,X1,Y1+0.5,'#3d4f66');
  const capa=(arr,base,col)=>{ x.beginPath(); for(let i=0;i<n;i++){ const px=Xp(O.t[i]), py=Yp(base[i]+arr[i]); i?x.lineTo(px,py):x.moveTo(px,py); } for(let i=n-1;i>=0;i--) x.lineTo(Xp(O.t[i]),Yp(base[i])); x.closePath(); x.fillStyle=col; x.fill(); };

function pintaDockFijo(){

/** La hoja mide lo que pide su contenido (entre 240 px y el 62 % del alto en el móvil), para que la guía nunca
    tenga que desplazarse por dentro; la cámara se vuelve a encajar en el hueco que queda. */
function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.47:0.43),240,450));
  let hh=base; const hud=el('hud');

  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;
    hh=Math.round(clamp(pide,240,Math.max(base,H*(movil?0.62:0.56)))); }
  const ant=parseFloat(b.style.getPropertyValue('--hojaH'))||0;
  if(Math.abs(ant-hh)>1){ b.style.setProperty('--hojaH',hh+'px'); colocaBarras();

}

/* ===================== 15. EL LABORATORIO GUIADO =====================
   Tres fases:
   1 · Fundamento (Reto 1: cuánta zona de deformación hace falta; Reto 2: qué pasa si se acorta),
   2 · Diseño (el reto insignia: longitud de deformación, limitador y disparo del airbag para un ensayo
       con tope de longitud; el pliego se revela SÓLO al validar),
   3 · Diagnóstico (una de tres fallas al azar: pretensor, limitador o airbag).
   Tres fallos en un reto cambian el dato (no se aprueba por eliminación). */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajaS=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
/* Los tres ensayos del reto de diseño: velocidad, ocupante, tope de longitud, y el pliego del tórax y de las costillas. */
const ESC_RETO=[
  {id:'A',vKmh:56,ocup:'p50',Lmax:0.50,a3:55,Frib:7000,nom:'Choque a 56 km/h · hombre p50'},
  {id:'B',vKmh:64,ocup:'p50',Lmax:0.60,a3:58,Frib:8000,nom:'Choque a 64 km/h · hombre p50'},
  {id:'C',vKmh:48,ocup:'p95',Lmax:0.40,a3:44,Frib:9000,nom:'Choque a 48 km/h · hombre p95'},
];
const V_NODISPARO=16;                                    // km/h: el golpe de aparcamiento en el que la bolsa NO debe salir
const BUENO={A:{L:0.50,Flim:6000,th:28},B:{L:0.60,Flim:7500,th:30},C:{L:0.40,Flim:8000,th:28}};
const DIS_BUENO=E=>BUENO[E.id];
const DIS={L:0.40,Flim:4000,th:18,bolsa:true};
const RETO={intentos:0,resiembras:0,fallosS:0,fallosQ:0,fallosD:0,fallosDx:0,pistasS:0,pistasD:0,hecho:false};
/* Reto 1: la longitud de deformación que da una deceleración media dada (ideal: s = v²/(2ā)). */
const S_CASOS=[[40,15],[50,20],[56,25],[64,30],[48,20],[56,20],[50,25]];
let sCaso=S_CASOS[Math.floor(Math.random()*S_CASOS.length)];
let fault=null, autoMode=false;
const GUIA={phase:0,paso:'s',caso:0,iniciado:false,validado:false,verdict:null,sintoma:'',opcQ:[0,1,2,3],opcDx:['pretensor','limitador','airbag']};
GUIA.caso=Math.floor(Math.random()*ESC_RETO.length);
const sRespuesta=()=>{ const v=sCaso[0]/3.6, a=sCaso[1]*G0; return v*v/(2*a)*100; };      // cm
const Q_OPC=[
  {t:'La deceleración media se duplica',ok:true},
  {t:'La deceleración media se reduce a la mitad'},
  {t:'No cambia: la energía es la misma'},
  {t:'La deceleración media se cuadruplica'},
];

/* ---------- Fase 1 · Fundamento ---------- */
function checkS(){
  const raw=String((el('ansS')||{}).value||'').trim().replace(/\s| /g,'').replace(',','.'), v=parseFloat(raw), ok_=sRespuesta();
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe la longitud en centímetros (con coma o punto decimal).'); return; }
  RETO.intentos++;
  const tol=Math.max(2,0.03*ok_);
  if(Math.abs(v-ok_)<tol){
    RETO.fallosS=0; sonido.bien();
    feedback('good','¡Correcto! ✓',`s = v²/(2ā) = (${fN(sCaso[0]/3.6,2)} m/s)² / (2 × ${sCaso[1]} × ${fN(G0,2)} m/s²) = ${fN(ok_,0)} cm. Es el caso ideal, a deceleración constante: una estructura real necesita además la rampa inicial, y por eso el simulador usa sólo el 90 % de L.`);
    setTimeout(()=>{ GUIA.opcQ=barajaS([0,1,2,3]); pasoA('q'); },1600);
  } else {
    RETO.fallosS++; sonido.mal();
    const sinConv=Math.abs(v-(sCaso[0]*sCaso[0]/(2*sCaso[1]*G0))*100)<Math.max(2,0.03*(sCaso[0]*sCaso[0]/(2*sCaso[1]*G0))*100);
    if(RETO.fallosS>=3){
      RETO.fallosS=0; RETO.resiembras++; const p=sCaso; do{ sCaso=pickOne(S_CASOS); }while(sCaso===p);
      feedback('bad','Tres intentos fallidos','Cambia el enunciado: vuelve a plantear el cálculo con los nuevos datos.'); setTimeout(()=>pasoA('s'),1500);
    } else {
      feedback('bad','Revisa el cálculo',`Tu resultado (${fN(v,v%1?1:0)} cm) está ${v>ok_?'alto':'bajo'}.`+(sinConv?' ¿Pasaste los km/h a m/s?':' Piensa en qué se convierte la energía cinética y en qué distancia lo hace.')+` (intentos fallidos: ${RETO.fallosS}/3)`);
      const t=el('d_try'); if(t) t.textContent=RETO.fallosS;
    }
  }
}
function eligeQ(i){
  const o=Q_OPC[i]; RETO.intentos++;
  if(o.ok){ RETO.fallosQ=0; sonido.bien(); feedback('good','Correcto ✓','Con la misma energía y la mitad de la distancia, F = E/s se duplica: ā = v²/(2s). Por eso un coche corto necesita un cinturón y un airbag mejores. Ahora lo vas a comprobar diseñando.'); setTimeout(()=>startPhase2(),1900); }
  else { RETO.fallosQ++; sonido.mal();
    if(RETO.fallosQ>=3){ RETO.fallosQ=0; RETO.resiembras++; GUIA.opcQ=barajaS([0,1,2,3]); feedback('bad','Tres intentos fallidos','Las opciones se barajan de nuevo: relaciona la distancia de frenado con la fuerza media, F·s = E.'); pasoA('q'); }
    else { feedback('bad','No es esa',[ 'Al acortar la distancia, la fuerza media sube, no baja.','La energía es la misma, pero la distancia para disiparla no: F·s = E.','Es una relación inversa simple, no cuadrática: ā = v²/(2s).'][i%3]+` (intentos fallidos: ${RETO.fallosQ}/3)`); const t=el('d_tryq'); if(t) t.textContent=RETO.fallosQ; }
  }
}

/* ---------- Fase 2 · Diseño ---------- */
function startPhase2(){
  GUIA.phase=1; GUIA.validado=false; GUIA.verdict=null;
  const E=ESC_RETO[GUIA.caso]; Object.assign(DIS,{L:Math.max(0.25,E.Lmax-0.10),Flim:4000,th:16,bolsa:true});
  pasoA('diseno'); recalcula(true); ponVista('conjunto'); pintaDock();
}
function evaluaDiseno(){
  const E=ESC_RETO[GUIA.caso];
  const base={vKmh:E.vKmh,vDisKmh:E.vKmh,L:DIS.L,ocup:E.ocup,Flim:DIS.Flim,dVth:DIS.th,tFin:T_FIN};
  const R=simula(base), B=simula(Object.assign({},base,{vKmh:V_NODISPARO,tFin:0.12}));
  const lim=E.ocup, xl=OCUP[lim].g0-D_GOLPE;
  const rows=[
    {ok:R.a3<=E.a3,t:`Tórax A<sub>3ms</sub> ≤ ${fN(E.a3,0)} g`,v:fN(R.a3,0)+' g'},
    {ok:!R.golpe,t:`Sin golpe al volante (avance ≤ ${fN(xl*1000,0)} mm)`,v:fN(R.xiMax*1000,0)+' mm'},
    {ok:R.FbMax<=E.Frib+1e-6,t:`Cinturón ≤ ${fN(E.Frib/1000,1)} kN (costillas)`,v:fN(R.FbMax/1000,1)+' kN'},
    {ok:R.tFire!==null,t:'El airbag dispara en el choque',v:R.tFire!==null?fN(R.tFire*1000,0)+' ms':'no'},
    {ok:B.tFire===null,t:`No dispara en el golpe a ${V_NODISPARO} km/h`,v:B.tFire===null?'no dispara':fN(B.tFire*1000,0)+' ms'},
  ];
  return {rows,ok:rows.every(r=>r.ok),R};
}
function validaDiseno(){
  if(DIS.L>ESC_RETO[GUIA.caso].Lmax+1e-9){ feedback('bad','Te pasas del paquete','La zona de deformación no cabe: este coche sólo admite '+fN(ESC_RETO[GUIA.caso].Lmax*100,0)+' cm.'); return; }
  RETO.intentos++;
  const V=evaluaDiseno(); GUIA.validado=true; GUIA.verdict=V; recalcula(false); pintaDock();
  if(V.ok){ RETO.fallosD=0; sonido.bien(); feedback('good','¡Diseño aprobado! ✓','El tórax queda bajo el pliego, no golpea el volante y el airbag sólo sale cuando debe. Fíjate en el compromiso: más limitador frena antes al tórax pero lo carga más; más zona de deformación suaviza todo, pero ocupa coche.',true); pasoA('diseno-ok'); }
  else {
    RETO.fallosD++; sonido.mal();
    if(RETO.fallosD>=5){
      RETO.fallosD=0; RETO.resiembras++; const p=GUIA.caso; do{ GUIA.caso=Math.floor(Math.random()*ESC_RETO.length); }while(GUIA.caso===p);
      feedback('bad','Cinco intentos fallidos','Cambia el ensayo: otro choque, otro ocupante y otro tope de longitud. Vuelve a plantear el diseño.'); setTimeout(()=>startPhase2(),1600);
    } else { GUIA.validado=true; feedback('bad','El diseño no cumple todo',`Mira qué criterios fallan en la guía y piensa qué mando los mueve. (intentos fallidos: ${RETO.fallosD}/5)`); pasoA('diseno'); }
  }
}

/* ---------- Fase 3 · Diagnóstico ---------- */
function startPhase3(){
  GUIA.phase=2; const faults=['pretensor','limitador','airbag']; fault=faults[Math.floor(Math.random()*faults.length)];
  GUIA.opcDx=barajaS(faults); GUIA.sintoma=''; pasoA('dx'); recalcula(true); ponVista('conjunto');
  setTimeout(()=>{ GUIA.sintoma=symptomS(fault); const s=el('symptomTask'); if(s){ s.innerHTML=GUIA.sintoma; ajustaHoja(); } },900);
}
function symptomS(f){
  if(f==='pretensor') return 'SÍNTOMA: la cinta va floja los primeros milisegundos; el tórax carga el cinturón más tarde que en el diseño aprobado y su pico de deceleración sube. ¿Qué lo causa?';
  if(f==='limitador') return 'SÍNTOMA: la fuerza del cinturón no se queda en una meseta: sube y sube mientras el tórax se detiene enseguida, con una deceleración muy alta. ¿Qué lo causa?';
  return 'SÍNTOMA: la bolsa no sale; el tórax sigue avanzando hasta casi tocar el volante, y el cinturón sostiene todo. ¿Qué lo causa?';
}
const nombreFalla=f=>f==='pretensor'?'pretensor que no dispara':(f==='limitador'?'limitador bloqueado':'airbag que no se despliega');
function explicaFalla(f){
  if(f==='pretensor') return 'El pretensor no recoge los 40 mm de holgura: la cinta empieza a trabajar tarde y con el tórax ya en movimiento, con un tirón mayor.';
  if(f==='limitador') return 'El limitador bloqueado deja de ceder: el cinturón se vuelve un muelle rígido, la fuerza sube a más de 15 kN y la deceleración del tórax se dispara aunque el avance sea corto.';
  return 'Sin la bolsa, sólo el cinturón con su limitador detiene el tórax: con el limitador de diseño el avance casi llega al volante.';
}
function diagnoseS(choice){
  if(!fault) return; RETO.intentos++;
  if(choice===fault){ RETO.fallosDx=0; sonido.bien(); feedback('good','Diagnóstico correcto ✓',explicaFalla(fault)+' <b>Ahora corrígelo.</b>',true); pasoA('reparar'); }
  else {
    RETO.fallosDx++; sonido.mal();
    if(RETO.fallosDx>=3){ RETO.fallosDx=0; RETO.resiembras++; const p=fault; const fs=['pretensor','limitador','airbag'].filter(f=>f!==p); fault=pickOne(fs); GUIA.opcDx=barajaS(['pretensor','limitador','airbag']); GUIA.sintoma=symptomS(fault);
      feedback('bad','Tres intentos fallidos','El banco presenta ahora OTRA falla: observa de nuevo la escena y el dock.',true); recalcula(true); pintaHUD(); }
    else { feedback('bad','No es esa falla','Eso ('+nombreFalla(choice)+') daría otro síntoma: '+wrongEx(choice)+' Observa otra vez. (intentos fallidos: '+RETO.fallosDx+'/3)',true); pintaHUD(); }
  }
}
function wrongEx(f){
  if(f==='pretensor') return 'la cinta arrancaría floja y el tórax cargaría tarde, pero la fuerza seguiría limitada y la bolsa saldría.';
  if(f==='limitador') return 'un cinturón sin meseta mostraría fuerzas altísimas, no una bolsa ausente ni una carga tardía.';
  return 'sin bolsa la cinta sí llega a la meseta del limitador, pero el tórax avanzaría casi hasta el volante.';
}
function reparaS(){
  fault=null; RETO.hecho=true; sonido.bien(); GUIA.sintoma='';
  feedback('good','¡Reparado! 🎉','El banco vuelve al diseño aprobado. Completaste las tres fases: calculaste la zona de deformación, diseñaste la sujeción de un ensayo y diagnosticaste una falla de seguridad pasiva.',true);
  pasoA('completo'); recalcula(true);
}
const pasoA=(p)=>{ GUIA.paso=p; if(EST.modo==='guia') pintaHUD(); };

/* ---------- el enrutador de acciones (la API de siempre) ---------- */
function handleAction(act,btn){
  switch(act){
    case 'check-s': checkS(); break;
    case 'hint-s':
      if(RETO.pistasS===0){ RETO.pistasS=1; feedback('good','Pista 1 de 2','Toda la energía cinética ½Mv² debe disiparse en la distancia de aplastamiento: ½Mv² = F_media·s, con F_media = M·ā.'); }
      else if(RETO.pistasS===1){ RETO.pistasS=2; feedback('good','Pista 2 de 2','La masa se cancela: queda v²/(2ā). Pasa antes los km/h a m/s y la deceleración de g a m/s².'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break;
    case 'q0': case 'q1': case 'q2': case 'q3': eligeQ(GUIA.opcQ[+act[1]]); break;
    case 'valida': validaDiseno(); break;
    case 'hint-d':
      if(RETO.pistasD===0){ RETO.pistasD=1; feedback('good','Pista 1 de 2','La deceleración del tórax es la fuerza total sobre él entre su masa: cinturón y bolsa suman. Un limitador bajo deja avanzar; uno alto carga más al pecho.'); }
      else if(RETO.pistasD===1){ RETO.pistasD=2; feedback('good','Pista 2 de 2','Si el umbral del sensor es muy bajo, un golpe de parking también dispara la bolsa; si es muy alto, la bolsa llega tarde. Busca el borde.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto.');
      break;
    case 'to-phase3': if(GUIA.phase!==1||GUIA.paso!=='diseno-ok') break; startPhase3(); break;
    case 'dx-pretensor': diagnoseS('pretensor'); break;
    case 'dx-limitador': diagnoseS('limitador'); break;
    case 'dx-airbag': diagnoseS('airbag'); break;
    case 'repara': if(GUIA.paso==='reparar') reparaS(); break;
    case 'restart': location.reload(); break;
  }
}

function chipsHtml(V,solo){ return `<div class="chips">${V.rows.map(r=>`<div class="chip ${r.ok?'ok':'no'}"><i>${r.ok?'✓':'✕'}</i><span>${r.t}</span><b>${r.v}</b></div>`).join('')}</div>`; }
function htmlGuia(){

/** Los mandos del diseño viven dentro del cuadro del reto: se enlazan sin repintar la guía. */

/* ---------- los modos ---------- */

let fbTimer=null;

/* ---------- el recorrido guiado de «En marcha» ---------- */
const espera=ms=>new Promise(r=>setTimeout(r,ms));
const cifraDe=(o)=>simula(Object.assign({vKmh:56,vDisKmh:V_DISENO,L:0.5,ocup:'p50',Flim:6000,dVth:26,tFin:T_FIN},o));
async function runAuto(){

  const hud=el('hud');
  const prev={vKmh:EST.vKmh,L:EST.L,Flim:EST.Flim,th:EST.th,ocup:EST.ocup,pretensor:EST.pretensor,bolsa:EST.bolsa,esc:EST.esc,pausa:EST.pausa,vista:VISTA.actual};
  const fija=o=>{ Object.assign(EST,o); pintaHUD(); hud.style.pointerEvents='none'; const b=el('btnAuto'); if(b){ b.disabled=true; b.textContent='Recorrido en curso…'; } recalcula(true); pintaDock(); pintaBarras(); };
  try{

    showToast(`Paso 3 · Sin airbag y con el limitador a 5 kN, el tórax avanza <b>${fN(c.xiMax*1000,0)} mm</b> y ${c.golpe?'<b>golpea el volante</b>':'queda cerca del volante'}.`,7600);
    await espera(8000);
    fija({bolsa:true,Flim:6000,th:26}); ponVista('bolsa'); const d=cifraDe({});

}


/* ===================== 16. SONIDO (sintetizado) =====================
   El golpe del impacto (ruido filtrado), el estallido seco del inflador y el chasquido del pretensor. */
const sonido=(function(){
  let ctx=null,on=true,master=null,ruido=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      const n=ctx.sampleRate*0.6, b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; ruido=b;
    }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); }
  function golpeR(fc,dur,vol){ if(!ctx||!on||!ruido) return; const s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain(), t=ctx.currentTime;
    s.buffer=ruido; f.type='lowpass'; f.frequency.value=fc; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+0.02); }
  return {init,
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    clac:()=>tono(320,0.06,0.04,'triangle'),
    impacto:()=>{ golpeR(380,0.5,0.35); tono(62,0.4,0.16,'sine'); },
    bolsa:()=>{ golpeR(2600,0.14,0.18); tono(140,0.1,0.06,'square'); },
    pret:()=>{ tono(900,0.04,0.04,'square'); },
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});

/* ===================== 17. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.min(devicePixelRatio,alta?2:1.5));
  const ms=alta?2048:1024; if(LUZ.clave.shadow.mapSize.x!==ms){ LUZ.clave.shadow.mapSize.set(ms,ms); if(LUZ.clave.shadow.map){ LUZ.clave.shadow.map.dispose(); LUZ.clave.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); PU.clave=''; FR.clave='';
  clearTimeout(window.__rzSEG); window.__rzSEG=setTimeout(()=>ponVista(VISTA.actual,0.01),140);
}

/* ===================== 18. EL LAZO: UN SOLO RELOJ =====================
   El tiempo simulado avanza dt·escala en cada cuadro, y con ESE tiempo se pintan la escena (chapa, maniquí,
   cinta, bolsa) y el dock (cursor de las gráficas, cifras, el reloj de milisegundos). */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0, tPrevS=T_PRE;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  aplicaEscena(EST.pausa?0:dt*EST.esc,dt,t);
  // los sonidos de los hitos, una sola vez por pasada
  const R=SIMU.R, ts=SIMU.t;
  if(R&&ts>tPrevS){ if(tPrevS<0&&ts>=0) sonido.impacto(); if(R.p.pretensor&&tPrevS<CINT.tPre&&ts>=CINT.tPre) sonido.pret(); if(R.tFire!==null&&tPrevS<R.tFire&&ts>=R.tFire) sonido.bolsa(); }
  tPrevS=ts;
  pasaCam(dt);
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaFx(); pintaEn(); pintaPu(); pintaFr(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos();
}
