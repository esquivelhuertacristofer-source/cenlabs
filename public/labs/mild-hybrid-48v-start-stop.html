<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Mild Hybrid de 48 V y Start-Stop — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#0A1C18;--panel:rgba(8,22,20,.86);--line:#244A3F;--ink:#ECF6F0;
    --dim:#9CB8AE;--accent:#8BD94E;--accent2:#C3F08F;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cF:#8BD94E;--cR:#FFB347;--cE:#FF4D5A;--cG:#C8D6D2;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#10252e;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#16323d}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#031a20;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#031a20;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#58d6e3}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#031a20}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#7CC4FF;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f87a0;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f90a8;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#031a20}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .escs{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
  .esc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px;font-size:11.5px;line-height:1.35;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);color:#c4d3e6}
  .esc .rs{font-weight:700;font-size:11px}.esc .rs.ok{color:var(--good)}.esc .rs.mal{color:#ff9a9a}
  .esc .pista{font-size:10.5px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#09121c;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(30,53,80,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,53,80,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f87a0}
  .dk-tit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#a3bcd6;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c6da;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#10252e;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfdcec;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,18,30,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,18,30,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d3e6}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,18,30,.92);border:1px solid rgba(124,196,255,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,18,30,.84);border:1px solid rgba(124,196,255,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .chips{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .chip{font-size:11.5px;line-height:1.35;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--dim)}
  .chip b{color:var(--ink)} .chip small{font-size:10.5px;color:var(--dim)}
  .chip.ok{border-color:rgba(52,211,153,.5)} .chip.ok b{color:var(--good)} .chip.mal{border-color:rgba(244,71,94,.5)} .chip.mal b{color:#ff9aa8}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}
  body.estrecho.ancho.t-panel .panel>.dk-fig{grid-column:1;grid-row:2}
  body.estrecho.ancho.t-panel .panel>.dk-row{grid-column:1;grid-row:3/6;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-fu{grid-column:2;grid-row:2;align-self:start}
  body.estrecho.ancho.t-panel .panel>.dk-g.fu{grid-column:2;grid-row:2/4;min-height:0;margin-top:18px}
  body.estrecho.ancho.t-panel .panel>.dk-ley{display:none}
  body.estrecho.ancho.t-panel .panel>.t-sp{grid-column:2;grid-row:4}
  body.estrecho.ancho.t-panel .panel>.dk-g.sp{grid-column:2;grid-row:5;min-height:0}
  body.estrecho.ancho.t-panel .panel>.dk-aviso{display:none}
  body.estrecho .hud details>.cuerpo{max-height:24vh}
  body.estrecho.ancho.t-hud .hud{display:grid;grid-template-columns:1fr 1.05fr;column-gap:14px;row-gap:7px;align-content:start;grid-auto-flow:row dense}
  body.estrecho.ancho .hud>.hcab,body.estrecho.ancho .hud>.modebar,body.estrecho.ancho .hud>.hdet,body.estrecho.ancho .hud>.pasos{grid-column:1}
  body.estrecho.ancho .hud>.hmandos,body.estrecho.ancho .hud>.retoBox{grid-column:2;grid-row:1/span 4}
  body.estrecho .hdet{flex-direction:row}body.estrecho .hdet>details{flex:1;min-width:0}
  body.estrecho .hdet details[open]{position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 54px);z-index:25;background:rgba(9,19,32,.97)}
  body.movil .lt{display:none} body.movil .tbar .modo,body.movil .tbar .reloj{display:none}
  body.movil .tbar{gap:6px;padding:5px 8px} body.movil .tbar .est{min-width:0}
  body.movil .dk-ley{display:none} body.movil .fg b{font-size:13.5px} body.movil .fg .fl{font-size:9.5px}
  body.movil .dk-g.fu{min-height:70px} body.movil .dk-g.sp{min-height:52px} body.movil .dk-row{min-height:150px}

/* ============================================================

/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos marcas— y lo prueba:
   lo que se prueba es lo que corre. */
/* FISICA:INICIO */
/* ---- Mild hybrid de 48 V y start-stop: física pura (sin three). Unidades SI salvo donde se diga. ---- */

/* Motor de gasolina de 1,5 L: línea de Willans. La potencia al freno es la indicada menos la de fricción y bombeo:
   P_b = η_i·P_comb − P_fr(n), con P_fr = fmep(n)·V_d·n/120. */
const MOT={Vd:1.5e-3,etaI:0.38,nRal:850,Jm:0.19};
const fmep=n=>{const s=n/1000;return (1.00+0.35*s+0.10*s*s)*1e5;};          // Pa

/* Alternador-arrancador por correa (BSG), 48 V: par y potencia máximos medidos EN EL CIGÜEÑAL; pérdidas del

/* Batería de 13 celdas de ión-litio, 10 Ah: Voc lineal en el SOC, resistencia interna fija. */

const vocDe=s=>39.5+14*s;

const pCargaMax=s=>-pTermDe(-BAT.Ichg,s);     // W que puede aceptar

/* Vehículo (compacto de 1 350 kg) y cargas de 12 V; el convertidor de CC baja de 48 a 12 V. */
const VEH={m:1350,kRot:0.04,CdA:0.62,Crr:0.011,rw:0.30,etaDL:0.92,P12:450,etaDC:0.94,etaAlt:0.62};
const MARCHAS=[[12,13.0],[25,7.6],[40,5.2],[60,3.9],[1e9,3.1]];               // [hasta km/h, relación total]

/* ---- Ciclo urbano SINTÉTICO (no es WLTP ni NEDC): [duración s, velocidad final km/h], con paradas de 3 a 22 s ---- */
const SEG=[[6,0],[12,45],[10,45],[9,0],[14,0],[8,30],[5,30],[6,0],[3,0],[13,50],[16,50],[6,20],[6,40],[8,0],[22,0],[10,35],[6,35],[7,0],[9,0],[14,55],[12,55],[10,0],[5,0]];
const PERFILES={fluido:{nombre:'Fluido',kDec:0.8,kAcc:0.8,kStop:0.6},urbano:{nombre:'Urbano',kDec:1,kAcc:1,kStop:1},denso:{nombre:'Denso',kDec:1.5,kAcc:1.3,kStop:1.5}};
const _cache={};
function generaCiclo(perfil,dt){

  for(let i=0;i<N;i++){ const im=Math.max(0,i-1), ip=Math.min(N-1,i+1); a[i]=(v[ip]-v[im])/((ip-im)*dt); if(i>0) x[i]=x[i-1]+0.5*(v[i]+v[i-1])*dt; }
  const paradas=[]; let ini=-1; for(let i=0;i<N;i++){ const q=v[i]<0.05; if(q&&ini<0) ini=i; if((!q||i===N-1)&&ini>=0){ paradas.push({t0:ini*dt,t1:i*dt,d:(i-ini)*dt}); ini=-1; } }
  return (_cache[k]={dt,N,T,v,a,x,paradas,dist:x[N-1],perfil:perfil||'urbano'});
}

/* ---- Arranque con el BSG: J·dω/dt = T_bsg − T_res(ω,θ),  T_res = T0(T_motor)·(1 + r·cos 2θ) + c_v·ω ---- */
const T0frio=Tc=>9+14*Math.exp(-(Tc-20)/45);                                    // N·m, par de arrastre medio del motor
const CV_ARR=0.045;                                                              // N·m·s/rad, parte viscosa
function arranque(o){

  const J=o.J||(MOT.Jm+BSG.Jr*BSG.i*BSG.i), wF=nF*DOSPI/60, T0=T0frio(Tc), dt=2e-4, tmax=3;
  let th=0,w=0,t=0,Emec=0,Eel=0; const tr={t:[0],w:[0],Tb:[Math.min(Tm,BSG.Pmax/1)],Tr:[T0*(1+ripple)]}; let paso=0;
  const Tb=w_=>Math.min(Tm,BSG.Pmax/Math.max(w_,1));
  const Tr=(th_,w_)=>T0*(1+ripple*Math.cos(2*th_))+CV_ARR*w_;
  const f=(th_,w_)=>[w_,(Tb(w_)-Tr(th_,w_))/J];
  while(w<wF&&t<tmax){
    const [k1t,k1w]=f(th,w), [k2t,k2w]=f(th+0.5*dt*k1t,w+0.5*dt*k1w), [k3t,k3w]=f(th+0.5*dt*k2t,w+0.5*dt*k2w), [k4t,k4w]=f(th+dt*k3t,w+dt*k3w);
    const wn=w+dt/6*(k1w+2*k2w+2*k3w+k4w), tn=th+dt/6*(k1t+2*k2t+2*k3t+k4t);
    const Pm=Tb(w)*w; Emec+=Pm*dt; Eel+=(Pm+perdidaBSG(Pm))*dt;

/* Forma cerrada con ripple = 0 y par constante: ω(t) = (A/c_v)(1 − e^(−c_v t/J)),  A = T − T0 */
function tArranqueCerrado(Tc,Tm,J,nF){

/* ---- Un paso de resolución de potencia, y la simulación del ciclo ---- */
function biseca(fn,hasta,obj){ // mayor x en [0,hasta] con fn(x) <= obj  (fn creciente)

function simula(par,cic,opt){

function optimo(perfil,P12){

/** Junta una pieza hecha de muchas mallas en una malla por material: así una bobina con 40 piezas cuesta pocas llamadas. */
function fusiona(grupo){
  grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map();
  grupo.traverse(o=>{ if(!o.isMesh) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(), m=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);
    g.applyMatrix4(m);
    if(!g.attributes.uv){ g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2)); }
    const k=o.material; if(!por.has(k)) por.set(k,[]); por.get(k).push(g); });
  const out=new THREE.Group();
  for(const [mat,gs] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count;
      pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry();
    G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const me=new THREE.Mesh(G,mat); me.castShadow=!mat.transparent; me.receiveShadow=true; out.add(me);

}

/** Funde las mallas ESTÁTICAS de un grupo en una malla por material (y por «clave» de pieza, para que el rótulo y el
 *  tooltip sigan sabiendo de qué pieza son). Las que se mueven, las instanciadas, las de material múltiple y el fondo se
 *  quedan como están. */
function fusionaPartes(grupo,excluir){
  excluir=excluir||[]; grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map(), viejas=[];
  const fuera=o=>{ for(let p=o;p&&p!==grupo;p=p.parent) if(excluir.includes(p)||(p.userData&&p.userData.fondo===true)) return true; return false; };
  grupo.traverse(o=>{ if(!o.isMesh||o.isInstancedMesh||fuera(o)||o.userData.noFusion) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(); g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld));
    if(!g.attributes.uv) g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
    const clave=o.userData.clave||'', ro=o.renderOrder||0;
    const mete=(mat,geo)=>{ const k=mat.uuid+'|'+clave; if(!por.has(k)) por.set(k,{mat,clave,gs:[],ro}); por.get(k).gs.push(geo); };
    if(Array.isArray(o.material)){
      const grupos=g.groups&&g.groups.length?g.groups:[{start:0,count:g.attributes.position.count,materialIndex:0}];
      for(const gr of grupos){ const mat=o.material[gr.materialIndex]; if(!mat) continue; const sub=new THREE.BufferGeometry();
        for(const nom of ['position','normal','uv']){ const at=g.attributes[nom]; sub.setAttribute(nom,new THREE.BufferAttribute(at.array.slice(gr.start*at.itemSize,(gr.start+gr.count)*at.itemSize),at.itemSize)); }
        mete(mat,sub); }
      g.dispose();
    } else mete(o.material,g);
    viejas.push(o); });
  for(const o of viejas){ o.parent.remove(o); }
  for(const [,{mat,clave,gs,ro}] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count; pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry(); G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const me=new THREE.Mesh(G,mat); me.castShadow=!mat.transparent&&!(mat.blending===THREE.AdditiveBlending); me.receiveShadow=true; me.renderOrder=ro; if(clave) me.userData.clave=clave; grupo.add(me);
  }
}

/* ===================== 7. UTILIDADES DE FORMA ===================== */
function ex2(pts,depth,z0,huecos){
  const sh=new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],p[1])));
  for(const h of huecos||[]) sh.holes.push(new THREE.Path(h.map(p=>new THREE.Vector2(p[0],p[1]))));
  const g=new THREE.ExtrudeGeometry(sh,{depth,bevelEnabled:false,curveSegments:8}); g.translate(0,0,z0); return sana(g);
}
const arcoP=(cx,cy,r,a0,a1,n)=>{const o=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return o;};
const rad=g=>g*Math.PI/180;
const addTo=(grp,geo,mat,opt)=>{const m=malla(geo,mat,opt); grp.add(m); return m;};

/* ===================== 8. EL MOTOR: UN CILINDRO EN CORTE (z = 0 es el plano de corte) =====================
   Motor de cuatro cilindros en línea. Se corta por el plano que contiene el eje del cilindro 1 y es perpendicular al
   cigüeñal: se ve el cilindro, el pistón (cortado por la mitad), la biela, el cigüeñal y la culata con sus válvulas y
   sus levas. Los otros tres cilindros están detrás, dentro del bloque. */
const YC=0.98, R_MAN=0.085, L_BIE=0.30, R_BORE=0.12, Y_DECK=1.44, RC=0.215, ZB=-1.3;
const ENG=new THREE.Group(); ENG.position.set(-0.20,0,0); MUNDO.add(ENG);
const EV={};   // piezas móviles del motor
{
  const dyBore=Math.sqrt(RC*RC-R_BORE*R_BORE), yB=YC+dyBore, aL=Math.atan2(dyBore,-R_BORE);
  // paredes del bloque a izquierda y derecha del cilindro (cara de corte rayada) y su cuerpo hacia atrás
  // izquierda y derecha
  const arcoL=arcoP(0,YC,RC,Math.PI,aL,10), arcoR=arcoP(0,YC,RC,Math.PI-aL,0,10);
  const L=[[-0.42,0.60],[-RC,0.60],...arcoL,[-R_BORE,Y_DECK],[-0.42,Y_DECK]];
  const Rr=[[RC,0.60],[0.42,0.60],[0.42,Y_DECK],[R_BORE,Y_DECK],...arcoR];
  for(const pts of [L,Rr]){
    const g=ex2(pts,-ZB,ZB,null); const m=malla(g,[M2.corteBloque,M2.fundicion]); ENG.add(m); }
  // relleno detrás de la media camisa y fondo de la cámara del cigüeñal
  addTo(ENG,new THREE.BoxGeometry(2*R_BORE+0.002,Y_DECK-yB,-ZB-R_BORE+0.002),M2.fundicion,{sombra:false}).position.set(0,(Y_DECK+yB)/2,(ZB-R_BORE)/2);
  addTo(ENG,new THREE.BoxGeometry(0.84,0.84,0.02),M2.fundicion,{sombra:false}).position.set(0,1.02,ZB);
  // media camisa (superficie bruñida del cilindro, vista desde dentro)
  { const g=new THREE.CylinderGeometry(R_BORE,R_BORE,Y_DECK-yB+0.001,36,1,true,Math.PI/2,Math.PI); const m=malla(g,M2.camisa,{sombra:false}); m.position.set(0,(Y_DECK+yB)/2,0); ENG.add(m); }
  // sombrerete (tapa) del cojinete de bancada: medio anillo bajo el cigüeñal
  { const pts=[...arcoP(0,YC,RC+0.075,Math.PI,2*Math.PI,18),...arcoP(0,YC,RC,2*Math.PI,Math.PI,18)];
    addTo(ENG,ex2(pts,-ZB,ZB,null),[M2.corteBloque,M2.fundicion]); }
  // cárter (U) con su aceite

    addTo(ENG,ex2(U,-ZB,ZB,null),[M2.corteCarter,M2.fundicion]);
    addTo(ENG,new THREE.BoxGeometry(0.72,0.30,0.02),M2.interior,{sombra:false}).position.set(0,0.46,ZB);
    const ac=addTo(ENG,new THREE.BoxGeometry(0.50,0.07,-ZB-0.02),M2.aceite,{sombra:false,recibe:false}); ac.position.set(0,0.375,ZB/2); ac.renderOrder=2;
    for(const sx of [-1,1]) addTo(ENG,new THREE.BoxGeometry(0.06,0.04,-ZB),M2.fundicion).position.set(sx*0.385,0.60,ZB/2); }
  // culata: cinco piezas con la cara de corte rayada; el hueco entre la pieza baja y la alta es el conducto
  { const bajoI=[[-0.42,Y_DECK],[-R_BORE,Y_DECK],[-R_BORE,1.465],[-0.088,1.503],[-0.42,1.600]];

    const pl=addTo(ENG,new RoundedBoxGeometry(0.16,0.30,0.95,3,0.03),M2.plenum,{sombra:false,recibe:false}); pl.position.set(-0.52,1.64,-0.70); pl.renderOrder=3;
    const tob=addTo(ENG,new THREE.CylinderGeometry(0.04,0.04,0.1,16),M2.acero2); tob.position.set(-0.52,1.64,-0.14); tob.rotation.x=Math.PI/2; }
  // escape: tubo que sale del conducto derecho, baja y se va hacia atrás
  { const cur=new THREE.CatmullRomCurve3([V3(0.40,1.635,0),V3(0.58,1.635,0),V3(0.70,1.55,0),V3(0.72,1.20,-0.01),V3(0.72,0.78,-0.08),V3(0.72,0.62,-0.50)],false,'centripetal');
    const t=malla(new THREE.TubeGeometry(cur,60,0.026,12,false),M2.escape,{sombra:false}); ENG.add(t); EV.escape=t; }
}

  cig.add(malla(ex2([[-0.034,0],[0.034,0],[0.03,R_MAN],[-0.03,R_MAN]],0.10,-0.05,null),M2.ciguenal));
  cig.add(malla(ex2([...arcoP(0,R_MAN,0.052,0,2*Math.PI,22)],0.10,-0.05,null),M2.ciguenal));
  const pin=malla(new THREE.CylinderGeometry(0.043,0.043,0.13,20),M2.acero2); pin.rotation.x=Math.PI/2; pin.position.set(0,R_MAN,0); cig.add(pin);
  const eje=malla(new THREE.CylinderGeometry(0.046,0.046,0.58-ZB,24),M2.acero2); eje.rotation.x=Math.PI/2; eje.position.z=(0.58+ZB)/2; cig.add(eje);

/* ---- válvulas, levas y bujía ---- */
{
  const lobulo=(r0,Lm,w)=>{ const pts=[]; for(let i=0;i<72;i++){ const th=-Math.PI+i/72*DOSPI; const a=th*180/Math.PI; const b=Math.abs(a)<w?Math.pow(Math.cos(Math.PI*a/(2*w)),2):0; const r=r0+Lm*b; pts.push([r*Math.sin(th),-r*Math.cos(th)]); } return pts; };
  EV.LIFT_MAX=0.034;
  EV.camAdm=new THREE.Group(); EV.camEsc=new THREE.Group();
  const defs=[{k:'adm',s:-1,cam:EV.camAdm,w:61},{k:'esc',s:1,cam:EV.camEsc,w:57}];
  EV.val={};
  for(const d of defs){
    const ang=rad(16)*(-d.s)*-1; // inclinación del eje: la admisión se abre hacia -x
    const dir=V3(-Math.sin(rad(16))*(d.s<0?1:-1),Math.cos(rad(16)),0);
    const seat=V3(d.s*0.088,1.503,0.013);
    const v=new THREE.Group(); v.position.copy(seat);
    v.rotation.z=(d.s<0?1:-1)*rad(16);
    const cab=malla(P3.revolucion([[0,0.012],[0.044,0.004],[0.046,-0.004],[0.03,-0.012],[0.012,0.02],[0.01,0.1]],{seg:24}),M2.acero2); cab.rotation.x=0; v.add(cab);
    const vas=malla(new THREE.CylinderGeometry(0.0095,0.0095,0.34,10),M2.acero2); vas.position.y=0.17; v.add(vas);
    const copa=malla(new THREE.CylinderGeometry(0.03,0.03,0.016,16),M.laton); copa.position.y=0.34; v.add(copa);
    ENG.add(v); EV.val[d.k]={g:v,seat,dir,w:d.w};
    // leva: centro sobre la copa
    const cpos=seat.clone().addScaledVector(dir,0.34+0.008+0.046); d.cam.position.copy(cpos); d.cam.position.z=0.013;
    d.cam.add(malla(ex2(lobulo(0.046,EV.LIFT_MAX,d.w),0.055,-0.0275,null),M2.biela));
    d.cam.add(malla(ex2(arcoP(0,0,0.016,0,DOSPI,12).slice(0,12),0.07,-0.035,null),M2.acero2));
    ENG.add(d.cam); EV.val[d.k].cpos=cpos;
  }
  // bujía
  const bj=new THREE.Group(); bj.position.set(0,1.62,0.013);
  bj.add(malla(new THREE.CylinderGeometry(0.019,0.019,0.18,6),M.acero));
  const ais=malla(P3.revolucion([[0,0.0],[0.017,0],[0.017,0.07],[0.011,0.09],[0.011,0.15],[0.006,0.16],[0,0.16]],{seg:20}),pbr({color:'#e8e6dc',roughness:0.3})); ais.position.y=0.07; bj.add(ais);
  const bor=malla(new THREE.CylinderGeometry(0.008,0.008,0.05,10),M.acero); bor.position.y=0.25; bj.add(bor);
  ENG.add(bj);
  // gas del cilindro: media columna entre la corona del pistón y la cámara
  const gg=new THREE.CylinderGeometry(R_BORE*0.985,R_BORE*0.985,1,28,1,false,Math.PI/2,Math.PI);
  const gas=new THREE.Mesh(gg,M2.gas.clone()); gas.renderOrder=4; gas.castShadow=false; ENG.add(gas); EV.gas=gas;
  const gl=new THREE.PointLight('#ff9a3c',0,1.4,2); gl.position.set(0,1.42,0.15); ENG.add(gl); EV.luzGas=gl;
}

/* ===================== 9. LA CORREA SERPENTINA, LAS POLEAS Y EL ALTERNADOR-ARRANCADOR (BSG) ===================== */
const ZP=0.54;                                      // plano de la correa
const POL={cig:{c:V3(-0.20,YC,ZP),R:0.19}, bsg:{c:V3(-0.99,1.62,ZP),R:0.0672}, ten:{c:V3(-0.86,0.70,ZP),R:0.046}};
const GIRO={cig:new THREE.Group(),bsg:new THREE.Group(),ten:new THREE.Group()};
{
  for(const k of ['cig','bsg','ten']){ GIRO[k].position.copy(POL[k].c); MUNDO.add(GIRO[k]); }
  // polea del cigüeñal: aro poly-V, cubo y cinco radios (se ve a su través el mecanismo)
  const R=POL.cig.R, per=[[R-0.025,-0.036],[R,-0.036],[R,-0.026],[R-0.006,-0.02],[R,-0.014],[R-0.006,-0.008],[R,-0.002],[R-0.006,0.004],[R,0.01],[R-0.006,0.016],[R,0.022],[R,0.036],[R-0.025,0.036]];
  const aro=malla(P3.revolucion(per,{seg:72}),M.acero); aro.rotation.x=Math.PI/2; GIRO.cig.add(aro);
  const cubo=malla(P3.revolucion([[0,-0.04],[0.065,-0.04],[0.07,-0.03],[0.07,0.05],[0.04,0.07],[0,0.07]],{seg:32}),M.acero); cubo.rotation.x=Math.PI/2; GIRO.cig.add(cubo);
  for(let i=0;i<5;i++){ const a=i/5*DOSPI; const r=malla(new THREE.BoxGeometry(R-0.07,0.028,0.022),M.acero); r.position.set(Math.cos(a)*(R+0.07)/2*0.92,Math.sin(a)*(R+0.07)/2*0.92,0); r.rotation.z=a; GIRO.cig.add(r); }
  const marca=malla(new THREE.BoxGeometry(0.03,0.012,0.04),new THREE.MeshBasicMaterial({color:'#ffb703',toneMapped:false}),{sombra:false}); marca.position.set(R-0.045,0,0.03); GIRO.cig.add(marca);
  // polea del BSG
  const Rb=POL.bsg.R;
  const pb=malla(P3.revolucion([[0,-0.03],[Rb-0.004,-0.03],[Rb,-0.02],[Rb,0.03],[Rb-0.004,0.034],[0,0.034]],{seg:40}),M.acero); pb.rotation.x=Math.PI/2; GIRO.bsg.add(pb);
  const tb=malla(new THREE.TorusGeometry(Rb*0.55,0.006,6,24),new THREE.MeshBasicMaterial({color:'#8bd94e',toneMapped:false}),{sombra:false}); tb.position.z=0.036; GIRO.bsg.add(tb);
  // tensor
  const pt=malla(P3.revolucion([[0,-0.03],[POL.ten.R,-0.03],[POL.ten.R,0.03],[0,0.03]],{seg:28}),M.acero); pt.rotation.x=Math.PI/2; GIRO.ten.add(pt);
  const brazo=malla(new RoundedBoxGeometry(0.46,0.05,0.04,2,0.01),M.carter); brazo.position.set(-0.86+0.15,0.70+0.0,ZP-0.06); brazo.rotation.z=-0.1; MUNDO.add(brazo);
  const muelleT=malla(new THREE.CylinderGeometry(0.05,0.05,0.07,18),M.negro); muelleT.rotation.x=Math.PI/2; muelleT.position.set(-0.55,0.66,ZP-0.06); MUNDO.add(muelleT);
}
/* correa: envolvente convexa de las tres poleas, recorrida como una curva cerrada; su textura de nervios se desplaza */
const CORREA=(function(){
  const pts=[];
  for(const k of ['cig','bsg','ten']){ const p=POL[k]; for(let i=0;i<48;i++){ const a=i/48*DOSPI; pts.push([p.c.x+(p.R+0.004)*Math.cos(a),p.c.y+(p.R+0.004)*Math.sin(a)]); } }
  pts.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cross=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const low=[]; for(const p of pts){ while(low.length>=2&&cross(low[low.length-2],low[low.length-1],p)<=0) low.pop(); low.push(p); }
  const up=[]; for(let i=pts.length-1;i>=0;i--){ const p=pts[i]; while(up.length>=2&&cross(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  up.pop(); low.pop(); const hull=low.concat(up);
  // remuestreo uniforme por longitud de arco
  const cur=new THREE.CatmullRomCurve3(hull.map(p=>V3(p[0],p[1],0)),true,'centripetal',0.2);
  const g=new THREE.TubeGeometry(cur,420,0.0095,8,true); sana(g);
  const c=cv(256,16),x=c.getContext('2d'); x.fillStyle='#16191b'; x.fillRect(0,0,256,16); x.fillStyle='#3d464b'; for(let i=0;i<16;i++) x.fillRect(i*16+2,0,6,16);
  const t=tex(c,{srgb:true}); t.repeat.set(70,1); t.anisotropy=4;
  const m=pbr({color:'#ffffff',map:t,roughness:0.8,metalness:0.05});
  const mesh=malla(g,m,{sombra:false}); mesh.scale.z=3.4; mesh.position.z=ZP; MUNDO.add(mesh);
  return {mesh,tex:t,len:cur.getLength()};
})();

/* ===================== 12. EL ESTADO Y EL RELOJ =====================
   Un solo cálculo (CALC) alimenta la escena, el dock y las cifras: se recalcula cuando cambia un mando. El reloj SIM.t es
   el tiempo del CICLO urbano (s) y avanza dt·velocidad; mueve el motor, la correa, el BSG, los flujos de energía, la
   carga de la batería y el cursor de todas las gráficas. Los giros visuales van a 1/40 de la velocidad real y, en cada
   arranque del motor, el reloj se frena solo (cámara lenta rotulada) para que se vea. */
const EST={modo:'marcha',perfil:'urbano',ss:true,vOff:6,pReg:12,pBoost:1.2,P12:450,vel:4,pausa:REDUCIDO,autoRunning:false,vista:'banco',rot:false};

/** Recalcula el modelo completo: el ciclo, el coche convencional, el mismo coche sin start-stop y la estrategia elegida. */
function calcula(p){
  const cic=generaCiclo(p.perfil,0.1);
  const tc=p.Tc!==undefined?p.Tc:90;
  const run=simula({ss:p.ss,vOff:p.vOff,pReg:p.pReg,pBoost:p.pBoost,P12:p.P12,Tc:tc,s0:p.s0},cic,{traza:true});
  const conv=simula({conv:true,P12:p.P12},cic,{traza:true});
  const sin=p.ss?simula({ss:false,pReg:p.pReg,pBoost:p.pBoost,P12:p.P12,Tc:tc,s0:p.s0},cic,{traza:true}):run;
  const arr=arranque({Tc:tc});

/* ---- el estado del sistema en el instante t: sale de las trazas de la simulación del ciclo ---- */
function estadoEn(t){
  const C=CALC; if(!C) return null;
  if(C.p.arranque){   // modo «arranque en bucle»: parado, motor apagado, arranque con el BSG y ralentí
    const tA=C.arr.t, P=1.0+tA+1.6, u=t%P, a=C.arr.tr;
    if(u<1.0) return {i:0,v:0,n:0,st:0,Pb:0,Pm:0,Pe:0,Pbat:C.p.P12/VEH.etaDC,soc:BAT.S0,fuel:0,Pf:0,u,fase:'off',tA};
    if(u<1.0+tA){ const te=u-1.0; let k=1; while(k<a.t.length-1&&a.t[k]<te) k++; const f=clamp((te-a.t[k-1])/Math.max(1e-9,a.t[k]-a.t[k-1]),0,1);
      const w=a.w[k-1]+(a.w[k]-a.w[k-1])*f, Tb=a.Tb[k-1]+(a.Tb[k]-a.Tb[k-1])*f, Pm=Tb*w;
      return {i:0,v:0,n:w*60/DOSPI,st:2,Pb:0,Pm,Pe:Pm+perdidaBSG(Pm),Pbat:Pm+perdidaBSG(Pm)+C.p.P12/VEH.etaDC,soc:BAT.S0,fuel:0,Pf:0,u,fase:'arr',tA,te}; }
    return {i:0,v:0,n:MOT.nRal,st:1,Pb:0,Pm:0,Pe:0,Pbat:C.p.P12/VEH.etaDC,soc:BAT.S0,fuel:0,Pf:pCombustible(0,MOT.nRal),u,fase:'ral',tA};
  }

}

  // ---- válvulas y levas, con la misma fase de 720° ----
  const ia=levanta(phiDeg,467,61), ie=levanta(phiDeg,260,57);
  for(const [k,q] of [['adm',ia],['esc',ie]]){ const V=EV.val[k]; V.g.position.copy(V.seat).addScaledVector(V.dir,-EV.LIFT_MAX*q.b); (k==='adm'?EV.camAdm:EV.camEsc).rotation.z=-q.a*Math.PI/180; }
  // ---- gas del cilindro: color por etapa (y combustión sólo si hay combustible) ----
  const quema=e.st===1&&e.Pf>0&&e.Pb>=0&&e.n>300;
  const corona=yp+0.07, top=1.495, h=Math.max(0.012,top-corona);
  EV.gas.scale.set(1,h,1); EV.gas.position.set(0,corona+h/2,0);
  const et=fasePistonesGas(phiDeg), gm=EV.gas.material;
  if(e.n<5){ gm.color.copy(COL_GAS.apag); gm.opacity=0.10; }
  else if(et==='adm'){ gm.color.copy(COL_GAS.adm); gm.opacity=0.14; }
  else if(et==='comp'){ const f=clamp((phiDeg-540)/180,0,1); gm.color.copy(COL_GAS.comp).lerp(COL_GAS.comp2,quema?f*f:0); gm.opacity=0.16+0.12*f; }
  else if(et==='exp'){ if(quema){ const f=clamp(phiDeg/180,0,1); gm.color.copy(COL_GAS.exp).lerp(COL_GAS.esc,f); gm.opacity=0.72-0.42*f; } else { gm.color.copy(COL_GAS.comp); gm.opacity=0.12; } }
  else { if(quema){ gm.color.copy(COL_GAS.esc); gm.opacity=0.22; } else { gm.color.copy(COL_GAS.adm); gm.opacity=0.10; } }
  EV.luzGas.intensity=(quema&&et==='exp')?1.6*(1-clamp(phiDeg/180,0,1)):0;
  // escape: se calienta con el combustible quemado
  const calor=e.n>5?clamp(e.Pf/9000,0,1):0; M2.escape.emissiveIntensity+=((quema?0.05+0.30*calor:0)-M2.escape.emissiveIntensity)*clamp(dtS*3,0,1);
  // ---- poleas, correa y BSG ----
  GIRO.cig.rotation.z=-phi; GIRO.bsg.rotation.z=-phi*POL.cig.R/POL.bsg.R; GIRO.ten.rotation.z=-phi*POL.cig.R/POL.ten.R;
  BSG_V.rotor.rotation.z=-phi*POL.cig.R/POL.bsg.R;
  CORREA.tex.offset.x+=(w*VISC*POL.cig.R)*dtS/CORREA.len*70;
  const potBSG=clamp(Math.abs(e.Pe)/10000,0,1);
  M2.bobina.emissiveIntensity+=((potBSG*2.2)-M2.bobina.emissiveIntensity)*clamp(dtS*6,0,1);
  M2.bobina.emissive.set(e.Pe<0?'#8bd94e':'#ffb703');

  ponCeldas(e.soc); M2.carga.color.set(e.soc<BAT.Smin?'#ff6a5a':(e.soc<0.45?'#ffb703':'#8bd94e'));
  // ---- cargas de 12 V ----
  SIM.fan+=(C.p.P12/450)*10*dtS; CARGA.userData.rotor.rotation.z=SIM.fan;
  // ---- flujos de energía: partículas en el sentido de la corriente ----
  const P48=C.p.P12/VEH.etaDC, flujos=[
    {P:Math.abs(e.Pe),dir:e.Pe<0?1:-1,col:e.Pe<0?'#8bd94e':'#ffb703',max:12000},     // BSG ↔ batería (curva: BSG → batería)
    {P:P48,dir:1,col:'#ffb703',max:1500},                                              // batería → convertidor
    {P:C.p.P12,dir:1,col:'#47d1ff',max:1500},                                           // convertidor → carga
  ];
  flujos.forEach((F,k)=>{
    const im=PART[k], cur=CABLES[k]; const act=F.P>15; const v=0.05+0.45*Math.sqrt(clamp(F.P/F.max,0,1));
    SIM.flujo[k]=(SIM.flujo[k]+F.dir*v*dtS+1)%1; _col.set(F.col);
    for(let i=0;i<NPAR;i++){ const u=((i/NPAR+SIM.flujo[k])%1+1)%1; cur.getPointAt(u,_pos); const g=act?0.015+0.012*clamp(F.P/F.max,0,1):0;
      _m4.compose(_pos,_q0,_sc.set(g,g,g)); im.setMatrixAt(i,_m4); im.setColorAt(i,_col); }
    im.instanceMatrix.needsUpdate=true; im.instanceColor.needsUpdate=true; });
  SIM.e=e;
}


/* ===================== 14. CÁMARAS =====================
   La escena se encuadra con el hueco que dejan la guía y el dock: la cámara se aleja lo justo para que la caja del
   «objeto» (ancho × alto en metros) quepa entera en ese hueco, y la proyección se desplaza para centrarla en él.
   Además el objeto nunca pasa del 66 % del alto del lienzo. */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}
const VISTAS={
  banco:{dir:V3(-0.30,0.24,1),anc:()=>V3(0.18,0.98,-0.1),toff:V3(0,0,0),obj:()=>({w:innerWidth<innerHeight*0.9?3.35:3.05,h:2.2}),fov:34,tope:0.66},
  motor:{dir:V3(-0.22,0.16,1),anc:()=>V3(-0.30,1.20,0),toff:V3(0,0,0),obj:()=>({w:1.55,h:1.95}),fov:34,tope:0.66},
  bsg:{dir:V3(-0.10,0.10,1),anc:()=>V3(-0.62,1.28,0.35),toff:V3(0,0,0),obj:()=>({w:1.9,h:1.45}),fov:34,tope:0.66},
  bateria:{dir:V3(-0.24,0.62,1),anc:()=>V3(0.30,0.28,-0.1),toff:V3(0,0,0),obj:()=>({w:3.25,h:1.35}),fov:34,tope:0.66},
};
const CAM={off:V3(-1.5,1.2,6),toff:V3(0,0,0),auto:true,previo:null,k:1,dur:1};
function fovVista(v){ return innerWidth<innerHeight*0.9?46:VISTAS[v].fov; }
function distanciaFit(w,h,fov,tope){
  const Hu=huecoLibre(), W=innerWidth, Hh=innerHeight, tv=Math.tan(fov*Math.PI/360), th=tv*(W/Hh);
  const wF=Math.max(80,Hu.x1-Hu.x0)/W, hF=Math.max(80,Hu.y1-Hu.y0)/Hh;
  const D=1.06*Math.max(w/(2*th*wF),h/(2*tv*hF));
  return Math.max(D,h/(2*tv*(tope||0.66)));
}
function ofsDeseado(v){
  const V=VISTAS[v], o=V.obj(), fov=fovVista(v), D=distanciaFit(o.w,o.h,fov,V.tope);
  return {off:V.dir.clone().normalize().multiplyScalar(D),toff:V.toff.clone(),fov};
}
function ponVista(v,dur){
  EST.vista=v; CAM.auto=true; CAM.dur=dur===undefined?1.0:dur;
  if(typeof pintaBarras==='function') pintaBarras();
  if(CAM.dur<=0.01){ const A=VISTAS[v].anc(), d=ofsDeseado(v); CAM.off.copy(d.off); CAM.toff.copy(d.toff); camera.fov=d.fov; camera.updateProjectionMatrix();
    camera.position.copy(A).add(CAM.off); controls.target.copy(A).add(CAM.toff); CAM.previo=A.clone(); }
}
function pasaCam(dt){
  const V=VISTAS[EST.vista], P=V.anc();
  if(CAM.auto){
    const d=ofsDeseado(EST.vista), k=1-Math.exp(-dt/Math.max(0.05,(CAM.dur||1)*0.30));
    CAM.off.lerp(d.off,k); CAM.toff.lerp(d.toff,k);
    if(Math.abs(camera.fov-d.fov)>0.05){ camera.fov+=(d.fov-camera.fov)*k; camera.updateProjectionMatrix(); }
    camera.position.copy(P).add(CAM.off); controls.target.copy(P).add(CAM.toff);
  } else if(CAM.previo){ const dP=P.clone().sub(CAM.previo); camera.position.add(dP); controls.target.add(dP); }
  CAM.previo=P.clone();
}
controls.addEventListener('start',()=>{ CAM.auto=false; });

/* ===================== 16. EL DOCK (derecha): cifras y gráficas DOM ===================== */
const FUENTE="'Outfit',system-ui,sans-serif";
function lienzo(id){ const box=el(id), c=box.querySelector('canvas'); return {box,c,ctx:c.getContext('2d'),w:0,h:0,dpr:1}; }
function abre(L){ const r=L.box.getBoundingClientRect(), dpr=Math.min(3,window.devicePixelRatio||1);

const GRID='rgba(160,210,190,0.10)', EJE='#3f6a5d', TXT='#8eb3a5';
/** Ejes de tiempo del ciclo: devuelve funciones de escala. */

function bandasApagado(x,X,Y0,Y1){ const T=CALC.run.traza.st, dt=CALC.run.dt, N=CALC.run.N; let ini=-1;
  for(let i=0;i<=N;i++){ const off=i<N&&T[i]===0; if(off&&ini<0) ini=i; if(!off&&ini>=0){ x.fillStyle='rgba(60,120,170,0.20)'; x.fillRect(X(ini*dt),Y0,X(i*dt)-X(ini*dt),Y1-Y0); ini=-1; } } }

/* ---- Potencias del ciclo (o, en el arranque, el par del BSG frente al resistente) ---- */
function pintaPot(){
  const x=abre(LFU), Wd=LFU.w, Hd=LFU.h, C=CALC; if(!C) return;
  const X0=30, X1=Wd-8, Y0=8, Y1=Hd-16;

  const T=C.run.traza, N=C.run.N, dt=C.run.dt, X=ejeT(Wd,X0,X1);
  let mx=4,mn=-4; for(let i=0;i<N;i+=2){ mx=Math.max(mx,T.Pb[i]/1e3,T.Pm[i]/1e3,T.Pbat[i]/1e3); mn=Math.min(mn,T.Pb[i]/1e3,T.Pm[i]/1e3,T.Pbat[i]/1e3); }
  mx=Math.ceil(mx/5)*5; mn=Math.floor(mn/5)*5; const Y=v=>Y1-(v-mn)/(mx-mn)*(Y1-Y0);

  for(let t=0;t<=C.cic.T;t+=50) { raya(x,X(t),Y1,X(t),Y1+3,EJE); txt(x,String(t),X(t),Hd-3,TXT,8.5,'center','500'); }
  txt(x,'kW',X0+4,Y0+8,TXT,8.5,'left','600'); txt(x,'s',X1,Hd-3,TXT,8.5,'right','600');
  const traza=(arr,col,w,f)=>{ x.strokeStyle=col; x.lineWidth=w; x.beginPath(); for(let i=0;i<N;i++){ const px=X(i*dt), py=Y(arr[i]/1e3*(f||1)); i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke(); };
  traza(T.Pbat,COL.bat,1.2); traza(T.Pm,COL.bsg,1.7); traza(T.Pb,COL.motor,1.4);

}
function pintaLeyPot(){
  const C=CALC;

   :`<span class="lg"><i style="--c:${COL.motor}"></i>motor al freno</span><span class="lg"><i style="--c:${COL.bsg}"></i>BSG (+ asiste, − genera)</span><span class="lg"><i style="--c:${COL.bat}"></i>batería (+ descarga)</span><span class="lg"><i class="bl" style="--c:rgba(60,120,170,.55)"></i>motor apagado</span>`;
  el('t_fuT').textContent=C&&C.p.arranque?'Par en el cigüeñal':'Potencias en el ciclo';
}
function pintaArranque(x,Wd,Hd){

  const k=claveDe(hitBajo(e.clientX,e.clientY)), t=k&&INFO[k];
  if(t){ TIP.textContent=t; TIP.style.display='block'; TIP.style.left=Math.min(innerWidth-TIP.offsetWidth-8,e.clientX+14)+'px'; TIP.style.top=(e.clientY+14)+'px'; }
  else TIP.style.display='none';
});
renderer.domElement.addEventListener('pointerleave',()=>{ TIP.style.display='none'; });
let toqueP=null, tipT=0;
renderer.domElement.addEventListener('pointerdown',e=>{ toqueP=e.pointerType==='mouse'?null:[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup',e=>{
  if(!toqueP||Math.hypot(e.clientX-toqueP[0],e.clientY-toqueP[1])>8) return;
  const k=claveDe(hitBajo(e.clientX,e.clientY)), t=k&&INFO[k]; if(!t) return;
  TIP.textContent=t; TIP.style.display='block';
  TIP.style.left=Math.max(8,Math.min(innerWidth-TIP.offsetWidth-8,e.clientX-TIP.offsetWidth/2))+'px'; TIP.style.top=Math.max(8,e.clientY-TIP.offsetHeight-18)+'px';
  clearTimeout(tipT); tipT=setTimeout(()=>{ TIP.style.display='none'; },2600);
});

/* ===================== 19. DISPOSICIÓN: ANCHO, ESTRECHO, MÓVIL =====================
   Si no caben guía, escena y dock lado a lado (el marco de la plataforma, una tableta), la escena va arriba
   y guía e instrumentos comparten una hoja con pestañas abajo. */
function disposicion(){
  const W=innerWidth, b=document.body;
  const estrecho=W<1080, movil=W<640;
  b.classList.toggle('estrecho',estrecho); b.classList.toggle('movil',movil); b.classList.toggle('ancho',estrecho&&!movil);
  if(estrecho){ if(!b.classList.contains('t-hud')&&!b.classList.contains('t-panel')) b.classList.add('t-hud'); ajustaHoja(); }
  el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('on',b.classList.contains('t-'+t.dataset.tab)));
}
function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.40:0.43),240,450));
  let hh=base; const hud=el('hud');
  if(movil&&b.classList.contains('t-panel')) hh=Math.round(clamp(H*0.55,240,540));
  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;
    hh=Math.round(clamp(pide,240,Math.max(base,H*(movil?0.45:0.56)))); }
  const ant=parseFloat(b.style.getPropertyValue('--hojaH'))||0;
  if(Math.abs(ant-hh)>1){ b.style.setProperty('--hojaH',hh+'px'); colocaBarras(); centraEnHueco(); }
}
el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.onclick=()=>{ const b=document.body; b.classList.remove('t-hud','t-panel'); b.classList.add('t-'+t.dataset.tab); disposicion(); centraEnHueco(); });


/* ===================== 20. EL LABORATORIO GUIADO =====================
   Tres fases: 1 · Calcula (cuánto tarda el BSG en arrancar el motor, con la aceleración angular), 2 · Ajusta (el umbral de
   parada, el límite de regeneración y la asistencia para consumir lo mínimo sin saturar la batería: el consumo sólo
   aparece al validar, y el óptimo es INTERIOR: apagar el motor demasiado pronto pierde regeneración, y asistir de más
   vacía la batería) y 3 · Diagnostica (¿por qué el motor no se apaga en la parada?, sólo con lo que se ve en el dock)
   y cierra con un quiz de tres preguntas. Cuatro validaciones fallidas cambian el escenario. */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETO={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'predice',iniciado:false,dxOk:false,r1:null,r2:null,dx:null,orden:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0};
const OPT={};
const optimoDe=(perfil,P12)=>{ const k=perfil+'|'+P12; return OPT[k]||(OPT[k]=optimo(perfil,P12)); };

/* ---------- Fase 1 · Calcula el tiempo de arranque ---------- */
const TEMPS1=[90,75,60,45];
function sorteaCaso1(){ const p=GUIA.r1&&GUIA.r1.Tc; let Tc; do{ Tc=pickOne(TEMPS1); }while(Tc===p);
  const J=MOT.Jm+BSG.Jr*BSG.i*BSG.i, wF=MOT.nRal*DOSPI/60, Tres=T0frio(Tc)+CV_ARR*wF/2;
  GUIA.r1={Tc,J,wF,Tres,T:BSG.Tmax,ans:J*wF/(BSG.Tmax-Tres)}; }
function numeroDe(txt){ const raw=String(txt||'').trim().replace(/\s/g,'').replace(/ /g,'').replace(',','.'); return parseFloat(raw); }
function checkPredice(){
  const v=numeroDe((el('ansV')||{}).value), r=GUIA.r1, ok=r.ans;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe el tiempo en segundos (con coma o punto decimal).'); return; }
  RETO.intentos++;
  if(Math.abs(v-ok)<=Math.max(0.04,0.06*ok)){
    RETO.fallos1=0; sonido.bien();
    const a=CALC.arr, tbe=(E_PEN+C_EQ*a.Eel)/pCombustible(0,MOT.nRal);
    feedback('good','¡Correcto! ✓',`t = J·ω<sub>f</sub> / (T − T̄<sub>res</sub>) = ${fN(r.J,3)}·${fN(r.wF,1)} / (${fN(r.T)} − ${fN(r.Tres,1)}) = <b>${fN(ok,2)} s</b>. Integrando el arranque completo, con el vaivén del par resistente en cada compresión, el modelo da <b>${fN(a.t,2)} s</b> y ${fN(a.Eel/1e3,2)} kJ eléctricos. Un rearranque también cuesta ${fN(E_PEN/1e3)} kJ de combustible de enriquecimiento: apagar el motor sólo compensa si la parada dura más de unos <b>${fN(tbe,0)} s</b>.`,true);
    paso('decide'); prepararDecide();
  } else {
    RETO.fallos1++; sonido.mal(); const d=v>ok?'alto':'bajo';
    if(RETO.fallos1>=3){ RETO.fallos1=0; RETO.resiembras++; sorteaCaso1(); feedback('bad','Tres intentos fallidos','Cambia el caso. Recuerda: ω en rad/s (rpm·2π/60) y el par que acelera es el del BSG menos el resistente.'); reiniciaCalculo(); pintaHUD(); }
    else { feedback('bad','Revisa el cálculo',`Tu resultado (${fN(v,2)} s) está ${d}. Pasa las rpm a rad/s y usa la aceleración angular α = (T − T̄<sub>res</sub>)/J. (intentos fallidos: ${RETO.fallos1}/3)`); const t=el('d_try'); if(t) t.textContent=RETO.fallos1; }
  }
}

/* ---------- Fase 2 · Ajusta la estrategia ---------- */
function prepararDecide(){
  let e; do{ e=pickOne(ESCENARIOS); }while(GUIA.r2&&ESCENARIOS.length>1&&e.perfil===GUIA.r2.perfil&&e.P12===GUIA.r2.P12&&RETO.resiembras>0);
  GUIA.r2={perfil:e.perfil,P12:e.P12,vOff:14,pReg:6,pBoost:0,validado:false,res:null,opt:null,intentos:0};
  reiniciaCalculo(); pintaHUD(); pintaChips();
}
function estadoRestricciones(){
  const C=CALC; if(!C||!GUIA.r2) return null; const R=C.run, dS=(R.socEnd-BAT.S0)*100, sat=R.tSatR+R.tSatB;
  return {socEnd:R.socEnd,okSOC:Math.abs(R.socEnd-BAT.S0)<=RETO_SOC.tol,sat,okSat:sat<=RETO_SOC.satMax,dS};
}
function pintaChips(){
  const c=estadoRestricciones(), e1=el('chipSoc'), e2=el('chipSat'); if(!c||!e1||!e2) return;
  e1.className='chip '+(c.okSOC?'ok':'mal'); e1.innerHTML=`SOC final <b>${fN(c.socEnd*100,1)} %</b> <small>(debe quedar entre ${fN((BAT.S0-RETO_SOC.tol)*100)} y ${fN((BAT.S0+RETO_SOC.tol)*100)} %)</small>`;
  e2.className='chip '+(c.okSat?'ok':'mal'); e2.innerHTML=`Batería saturada <b>${fN(c.sat,1)} s</b> <small>(máx. ${fN(RETO_SOC.satMax)} s)</small>`;
}
function validarDecide(){
  const r=GUIA.r2; if(!r) return;
  const par={vOff:r.vOff,pReg:r.pReg*1e3,pBoost:r.pBoost*1e3}, R=evaluaReto(par,r.perfil,r.P12), opt=optimoDe(r.perfil,r.P12);
  r.res=R; r.opt=opt; r.validado=true; r.intentos++; RETO.intentos++;
  const lim=opt.Feq*(1+RETO_SOC.tolFeq), okFuel=R.Feq<=lim, ok=R.ok&&okFuel;
  reiniciaCalculo();
  const base=`Consumes <b>${fN(R.L100,2)} L/100 km</b> (un coche convencional, ${fN(R.Lconv,2)}): ahorras el <b>${fN(R.ahorro*100,0)} %</b>. Consumo equivalente (con la batería al final del ciclo): ${fN(R.Feq,2)} L/100 km; el límite era <b>${fN(lim,2)}</b>.`;
  if(ok){
    RETO.fallos2=0; sonido.bien();
    feedback('good','¡Lo conseguiste! ✓',`${base} La mejor combinación que encuentra el motor es un umbral de <b>${fN(opt.vOff,1)} km/h</b>, ${fN(opt.pReg,1)} kW de regeneración y ${fN(opt.pBoost,2)} kW de asistencia. El umbral es interior: por encima de unos 6 km/h el motor ya no quema nada al frenar (corte de inyección) y apagarlo sólo hace perder regeneración; por debajo, el embrague se abre y el ralentí sí gasta.`,true);
    pintaHUD(); paso('diag'); iniciaDiag();
  } else {
    RETO.fallos2++; sonido.mal();
    let msg=base+' ';
    if(!R.ok){
      if(Math.abs(R.socEnd-BAT.S0)>RETO_SOC.tol) msg+=R.socEnd<BAT.S0?'La batería termina descargada: asististe con más energía de la que recuperaste. ':'La batería termina cargada de más: sobra energía que podías gastar en asistencia. ';
      if(R.tSatR+R.tSatB>RETO_SOC.satMax) msg+=R.tSatR>R.tSatB?'La batería se llenó y parte de la regeneración se perdió en los frenos. ':'La batería llegó al mínimo y la asistencia se recortó. ';
    } else {
      if(r.pReg<opt.pReg-1.5) msg+='Recuperas poca energía al frenar: con un límite de regeneración mayor sobra energía para asistir. ';
      else if(r.vOff>opt.vOff+4) msg+='Apagas el motor cuando aún gira arrastrado por las ruedas: ahí no quema nada y pierdes regeneración. ';
      else if(r.vOff<opt.vOff-4) msg+='Dejas el motor al ralentí en la última rodada antes de parar: ahí sí gasta. ';
      else msg+='Estás cerca: afina la asistencia hasta que el SOC termine donde empezó. ';
    }
    if(RETO.fallos2>=4){ RETO.fallos2=0; RETO.resiembras++; feedback('bad','Cuatro validaciones sin lograrlo',msg+'Cambia el escenario.',true); prepararDecide(); }
    else { feedback('bad','Todavía no',msg+`(validaciones fallidas: ${RETO.fallos2}/4)`,true); pintaHUD(); pintaChips(); }
  }
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const CASOS_DX=[
  {k:'soc',Tc:90,s0:0.31,P12:450},
  {k:'frio',Tc:38,s0:0.62,P12:450},
  {k:'carga',Tc:90,s0:0.62,P12:1350},
];
const NOMBRE_DX={soc:'Batería de 48 V descargada',frio:'Motor frío',carga:'Demasiada carga de 12 V'};
function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.k; let c; do{ c=pickOne(CASOS_DX); }while(c.k===p);
  GUIA.dx=c; GUIA.dxOk=false; GUIA.orden=barajar(CASOS_DX.map(x=>x.k));
  reiniciaCalculo(); pintaHUD(); pintaDockFijo();
}
function diagnostica(k){
  if(!GUIA.dx||GUIA.dxOk) return; RETO.intentos++;
  if(k===GUIA.dx.k){
    GUIA.dxOk=true; RETO.fallos3=0; sonido.bien();
    feedback('good','Diagnóstico correcto ✓',explicaDx(GUIA.dx.k),true);
    reiniciaCalculo(); pintaDockFijo(); paso('quiz'); iniciaQuiz();
  } else {
    RETO.fallos3++; sonido.mal();
    if(RETO.fallos3>=3){ RETO.fallos3=0; RETO.resiembras++; feedback('bad','Tres intentos fallidos','Es otro caso: compara cada lectura con su condición (SOC ≥ 35 %, motor ≥ 60 °C, cargas de 12 V ≤ 1 200 W).',true); iniciaDiag(); }
    else { feedback('bad','No es ese',noEs(k)+` (intentos fallidos: ${RETO.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(k){
  if(k==='soc') return `Con el SOC por debajo de ${fN(SS.SOCmin*100)} % no queda energía de sobra para rearrancar con el BSG ni para sostener las cargas con el motor apagado: la ECU deja el motor encendido hasta que el alternador-arrancador lo recargue.`;
  if(k==='frio') return `Con el motor por debajo de ${fN(SS.Tmin)} °C el par resistente es mucho mayor (aceite espeso) y el catalizador aún no ha llegado a su temperatura: apagar y rearrancar gastaría más de lo que ahorra.`;
  return `Con más de ${fN(SS.P12max)} W en 12 V (luneta, ventilador, desempañador) el convertidor descargaría la batería de 48 V en pocos segundos de parada: la ECU mantiene el motor encendido para que el BSG genere.`;
}
function noEs(k){
  if(k==='soc') return 'La carga de la batería de 48 V está por encima del mínimo: mira las otras lecturas.';
  if(k==='frio') return 'La temperatura del motor ya es suficiente: mira las otras lecturas.';
  return 'Las cargas de 12 V están dentro de lo que el convertidor aguanta: mira las otras lecturas.';
}
const QUIZ=[
  {q:'Un coche de 1 350 kg frena de 50 km/h hasta pararse. ¿Qué energía cinética hay disponible para recuperar?',ok:'≈ 0,036 kWh (130 kJ)',mal:['≈ 0,36 kWh','≈ 0,0036 kWh','≈ 3,6 kWh']},
  {q:'¿Por qué, con el pie levantado a 30 km/h y el motor acoplado, el motor no consume combustible?',ok:'La ECU corta la inyección y las ruedas lo arrastran',mal:['Porque el BSG lo mueve con la batería','Porque el motor se apaga solo','Porque el ralentí no gasta']},
  {q:'¿Por qué rearrancar el motor en una parada de 2 s gasta más de lo que ahorra?',ok:'Cada rearranque cuesta energía y combustible que no se compensan en tan poco tiempo apagado',mal:['Porque el BSG consume 12 kW todo el tiempo','Porque el motor frío no arranca nunca','Porque la batería de 12 V se descarga']},
];
function iniciaQuiz(){ GUIA.quizN=0; cargaPregunta(); }
function cargaPregunta(){ const Q=QUIZ[GUIA.quizN], opts=barajar([Q.ok,...Q.mal]); GUIA.quiz={q:Q.q,opts,ok:opts.indexOf(Q.ok)}; GUIA.quizResp=-1; GUIA.quizCorrecta=GUIA.quiz.ok; pintaHUD(); }
function respondeQuiz(i){
  if(GUIA.quizResp>=0) return; GUIA.quizResp=i; const ac=i===GUIA.quiz.ok; if(ac) RETO.quizAcierto++;
  if(ac) sonido.bien(); else sonido.mal();
  const ult=GUIA.quizN>=QUIZ.length-1;
  feedback(ac?'good':'bad',ac?'Correcto ✓':'No es esa',(ac?'':'La respuesta era: <b>'+GUIA.quiz.opts[GUIA.quiz.ok]+'</b>. ')+(ult?'Terminaste el laboratorio.':'Sigue con la siguiente.'),true);
  pintaHUD();
  if(ult){ RETO.hecho=true; paso('completo'); }
}
function siguientePregunta(){ if(GUIA.quizN<QUIZ.length-1){ GUIA.quizN++; cargaPregunta(); } }

/* ---------- el enrutador de acciones ---------- */
function paso(p){ GUIA.paso=p; GUIA.phase=({predice:0,decide:1,diag:2,quiz:2,completo:2})[p]; if(EST.modo==='guia'){ reiniciaCalculo(); pintaHUD(); } }
function handleAction(act,btn){
  switch(act){
    case 'check-v': checkPredice(); break;
    case 'hint-v':
      if(RETO.pistas===0){ RETO.pistas=1; feedback('good','Pista 1 de 2','La aceleración angular es α = (T − T̄res)/J. Parte de cero y llega a ω<sub>f</sub> con α constante: t = ω<sub>f</sub>/α.'); }
      else if(RETO.pistas===1){ RETO.pistas=2; feedback('good','Pista 2 de 2','ω<sub>f</sub> = n·2π/60 con n = 850 rpm. Usa el J y el par resistente medio que te da el enunciado.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break;
    case 'validar': validarDecide(); break;
    case 'dx-soc': diagnostica('soc'); break; case 'dx-frio': diagnostica('frio'); break; case 'dx-carga': diagnostica('carga'); break;
    case 'quiz-0': respondeQuiz(0); break; case 'quiz-1': respondeQuiz(1); break; case 'quiz-2': respondeQuiz(2); break; case 'quiz-3': respondeQuiz(3); break;
    case 'quiz-sig': siguientePregunta(); break;
    case 'restart': location.reload(); break;
  }
}

/* ---------- lo que la guía enseña en cada paso ---------- */
function contenidoGuia(){
  const tri=(n,v,m)=>`<span class="tries">intentos fallidos: <b id="${n}">${v}</b>/${m}</span>`;
  switch(GUIA.paso){
    case 'predice': { const r=GUIA.r1;
      return {no:'Fase 1 · Reto 1',head:'Tu cálculo',title:'¿Cuánto tarda el BSG en arrancar el motor?',
      teach:`Motor a <b>${fN(r.Tc)} °C</b>. Inercia del conjunto <b>${fN(r.J,3)} kg·m²</b>; par del BSG <b>${fN(r.T)} N·m</b>; par resistente medio <b>${fN(r.Tres,1)} N·m</b>.<div class="task">¿Cuántos segundos tarda en llevarlo de 0 a 850 rpm? ${tri('d_try',RETO.fallos1,3)}</div>`,
      acts:`<div class="calcrow"><input id="ansV" type="text" inputmode="decimal" autocomplete="off" placeholder="¿? segundos" aria-label="Tiempo de arranque en segundos"><button class="b primary" data-act="check-v">✓ Comprobar</button></div><button class="pista" id="btnHint">¿Necesitas una pista? (máx. 2)</button>`}; }
    case 'decide': { const r=GUIA.r2; if(!r) return {no:'Fase 2 · Reto 2',head:'Tu ajuste',title:'Preparando el escenario…',teach:'',acts:''};
      return {no:'Fase 2 · Reto 2',head:'Tu ajuste',title:`Consumir lo mínimo sin saturar la batería`,
      teach:`Tráfico <b>${NOMBRE_PERFIL[r.perfil].toLowerCase()}</b>, cargas de 12 V de <b>${fN(r.P12)} W</b>. Termina el ciclo con la carga donde empezó y sin recortar la regeneración ni la asistencia. El consumo se conoce al validar.<div class="why"><b>El objetivo:</b> quedar a menos del 0,8 % del mínimo que el motor encuentra. ${tri('d_try2',RETO.fallos2,4)}</div><div class="chips"><span class="chip" id="chipSoc"></span><span class="chip" id="chipSat"></span></div>`,
      acts:`<div class="cg"><div class="cl"><div>Umbral de parada</div><b id="v2U">${fN(r.vOff,1)} km/h</b></div><input type="range" id="r2U" min="0" max="25" step="0.5" value="${r.vOff}" aria-label="Umbral de parada"></div>
        <div class="cg"><div class="cl"><div>Límite de regeneración</div><b id="v2R">${fN(r.pReg,1)} kW</b></div><input type="range" id="r2R" min="1" max="12" step="0.5" value="${r.pReg}" aria-label="Límite de regeneración"></div>
        <div class="cg"><div class="cl"><div>Asistencia (boost)</div><b id="v2B">${fN(r.pBoost,2)} kW</b></div><input type="range" id="r2B" min="0" max="10" step="0.05" value="${r.pBoost}" aria-label="Asistencia"></div>
        <button class="b primary" data-act="validar">▶ Validar el consumo</button>`}; }
    case 'diag': { const ord=GUIA.orden||CASOS_DX.map(x=>x.k);
      return {no:'Fase 3 · Diagnóstico',head:'¿Qué le pasa?',title:'Averigua por qué no se apaga',
      teach:`El coche lleva parado varios segundos y el motor sigue encendido. Lee el dock: temperatura, carga, cargas de 12 V y tensión.<div class="task">¿Cuál es la causa? ${tri('d_try3',RETO.fallos3,3)}</div>`,
      acts:ord.map(k=>`<button class="b" data-act="dx-${k}">${NOMBRE_DX[k]}</button>`).join('')}; }
    case 'quiz': { const Q=GUIA.quiz; if(!Q) return {no:'',head:'',title:'',teach:'',acts:''}; const ya=GUIA.quizResp>=0;
      return {no:'Cierre · Pregunta '+(GUIA.quizN+1)+' de '+QUIZ.length,head:'Quiz',title:Q.q,teach:'',
      acts:Q.opts.map((o,i)=>`<button class="b ${ya?(i===Q.ok?'good':(i===GUIA.quizResp?'bad':'')):''}" data-act="quiz-${i}" ${ya?'disabled':''}>${o}</button>`).join('')+(ya&&GUIA.quizN<QUIZ.length-1?'<button class="b primary" data-act="quiz-sig">Siguiente →</button>':'')}; }
    case 'completo': return {no:'Laboratorio completado',head:'✓',title:'Calculaste, ajustaste y diagnosticaste',
      teach:`Acertaste ${RETO.quizAcierto} de ${QUIZ.length} en el quiz. Vuelve a <b>En marcha</b>, elige tráfico «denso» y apaga el start-stop: mira cuánto combustible regalas en cada parada.`,
      acts:`<button class="b primary" data-act="restart">↺ Reiniciar laboratorio</button>`};
  }
  return {no:'',head:'',title:'',teach:'',acts:''};
}
function htmlGuia(){
  const ps=['Calcula','Ajusta','Diagnostica'], C=contenidoGuia();
  const ok=i=>i<GUIA.phase||(i===2&&RETO.hecho);
  return `<div class="pasos">${ps.map((t,i)=>`<span class="ps ${ok(i)?'ok':(i===GUIA.phase?'on':'')}"><i>${ok(i)?'✓':i+1}</i>${t}</span>`).join('')}</div>
  <div class="retoBox"><div class="rt"><span>${C.no}</span><span>${C.head}</span></div><h3>${C.title}</h3><div class="rq">${C.teach}</div><div class="opt" id="actOpt">${C.acts}</div></div>`;
}
/** Lo que corre en el banco en cada paso del laboratorio guiado (null: lo que digan los mandos). */
function guiaParams(){
  if(GUIA.paso==='predice'&&GUIA.r1){ const r=GUIA.r1; return {perfil:'urbano',ss:true,vOff:6,pReg:12e3,pBoost:1.2e3,P12:450,Tc:r.Tc,arranque:true}; }
  if(GUIA.paso==='decide'&&GUIA.r2){ const r=GUIA.r2; return {perfil:r.perfil,ss:true,vOff:r.vOff,pReg:r.pReg*1e3,pBoost:r.pBoost*1e3,P12:r.P12,Tc:90}; }
  if((GUIA.paso==='diag'||GUIA.paso==='quiz'||GUIA.paso==='completo')&&GUIA.dx){ const c=GUIA.dx; return {perfil:'urbano',ss:true,vOff:6,pReg:12e3,pBoost:1.2e3,P12:c.P12,Tc:c.Tc,s0:c.s0}; }
  return null;
}
/* ---------- los modos ---------- */
function setMode(m,forzar){
  if(!forzar&&(m===EST.modo||EST.autoRunning)) return;
  if(m==='guia'){
    EST.modo='guia'; if(!GUIA.iniciado){ GUIA.iniciado=true; sorteaCaso1(); paso('predice'); }
  } else EST.modo='marcha';
  document.body.classList.toggle('m-marcha',EST.modo==='marcha'); document.body.classList.toggle('m-guia',EST.modo==='guia');
  el('feedback').classList.remove('show'); SIM.t=0; reiniciaCalculo(); ponVista(EST.vista,0.6); pintaHUD(); pintaDockFijo(); pintaBarras();
}
let fbTimer=null;
function feedback(type,title,text,sticky=false){ const f=el('feedback'); f.className='feedback show '+type; el('fbIcon').textContent=type==='good'?'✓':'✕'; el('fbTitle').textContent=title; el('fbText').innerHTML=text; clearTimeout(fbTimer); if(!sticky) fbTimer=setTimeout(()=>f.classList.remove('show'),7000); }
el('fbX').onclick=()=>el('feedback').classList.remove('show');
document.addEventListener('input',e=>{ const t=e.target; if(!t||!GUIA.r2||GUIA.paso!=='decide') return;
  const m={r2U:['vOff','v2U',v=>fN(v,1)+' km/h'],r2R:['pReg','v2R',v=>fN(v,1)+' kW'],r2B:['pBoost','v2B',v=>fN(v,2)+' kW']}[t.id]; if(!m) return;
  GUIA.r2[m[0]]=+t.value; GUIA.r2.validado=false; el(m[1]).textContent=m[2](+t.value); reiniciaCalculo(); pintaChips(); });

/* ---------- el recorrido guiado de «En marcha» ---------- */
const espera=ms=>new Promise(r=>setTimeout(r,ms));
function saltaA(t){ SIM.t=clamp(t,0,CALC.cic.T-1); SIM.nVis=0; const e=estadoEn(SIM.t); if(e) SIM.nVis=e.n; }
function buscaInstante(f,desde){ const R=CALC.run, T=R.traza; for(let i=Math.floor((desde||0)/R.dt);i<R.N;i++) if(f(T,i)) return i*R.dt; return 0; }
async function runAuto(){
  if(EST.autoRunning||EST.modo!=='marcha') return; EST.autoRunning=true; sonido.init();
  const hud=el('hud'), prev={perfil:EST.perfil,ss:EST.ss,vOff:EST.vOff,pReg:EST.pReg,pBoost:EST.pBoost,P12:EST.P12,vista:EST.vista,vel:EST.vel,pausa:EST.pausa};
  const fija=o=>{ Object.assign(EST,o); pintaHUD(); hud.style.pointerEvents='none'; const b=el('btnAuto'); if(b){ b.disabled=true; b.textContent='Recorrido en curso…'; } reiniciaCalculo(); pintaBarras(); };
  try{
    fija({perfil:'urbano',ss:true,vOff:6,pReg:12,pBoost:1.2,P12:450,vel:4,pausa:false}); ponVista('banco'); saltaA(0);
    showToast('Paso 1 · Con el start-stop activo, el motor <b>se apaga</b> en cada parada (franja azul en la gráfica) y las cargas de 12 V salen de la batería de 48 V.',8200);
    await espera(8800);
    ponVista('motor'); saltaA(buscaInstante((T,i)=>T.st[i]===2,5)-2.5);
    showToast('Paso 2 · Al soltar el freno el <b>BSG</b> gira el cigüeñal por la correa en menos de medio segundo. El reloj se frena a 1/5 para que lo veas.',8200);
    await espera(9400);
    ponVista('bsg'); saltaA(buscaInstante((T,i)=>T.Pm[i]<-3500&&T.st[i]===1,10)-0.5);
    showToast('Paso 3 · Al frenar, el motor deja de quemar combustible y el BSG <b>genera</b>: la energía cinética carga la batería (flujo verde).',8200);
    await espera(8800);
    saltaA(buscaInstante((T,i)=>T.Pm[i]>1000&&T.st[i]===1,15)-0.5);
    showToast('Paso 4 · Al acelerar, el BSG <b>asiste</b> con la energía guardada: el motor carga menos y quema menos (flujo ámbar).',8200);
    await espera(8800);
    ponVista('bateria'); saltaA(0);
    showToast('Paso 5 · La altura verde de las celdas es la carga: baja con las cargas de 12 V y las asistencias, y sube con cada frenada.',8600);
    await espera(9000);
  } finally {
    Object.assign(EST,prev); EST.autoRunning=false; hud.style.pointerEvents='';
    pintaHUD(); reiniciaCalculo(); ponVista(prev.vista); pintaBarras();
  }
}

/* ===================== 21. SONIDO (sintetizado) =====================
   Un zumbido grave del motor cuya altura sigue al régimen (muy atenuado) y los avisos de acierto y fallo. */
const sonido=(function(){
  let ctx=null,on=true,master=null,ult=0,zum=null,zg=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      zum=ctx.createOscillator(); zg=ctx.createGain(); zum.type='sawtooth'; zum.frequency.value=60; zg.gain.value=0; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=220; zum.connect(lp); lp.connect(zg); zg.connect(master); zum.start();
    }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); ult=f; }
  return {init,
    zumbido:(rpm)=>{ if(!ctx||!zum) return; const t=ctx.currentTime; zum.frequency.setTargetAtTime(30+rpm/30,t,0.15); zg.gain.setTargetAtTime(on&&rpm>0?0.012:0,t,0.15); },
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }, get freq(){ return ult; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});

/* ===================== 22. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.max(Math.min(devicePixelRatio,alta?2:1.5),Math.min(devicePixelRatio,1.5)>1?1.25:1));
  const ms=alta?2048:1024; if(LUZ.sol.shadow.mapSize.x!==ms){ LUZ.sol.shadow.mapSize.set(ms,ms); if(LUZ.sol.shadow.map){ LUZ.sol.shadow.map.dispose(); LUZ.sol.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); if(typeof ponVista==='function'&&CALC) ponVista(EST.vista,0.001); centraEnHueco();
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 23. EL LAZO: UN SOLO RELOJ =====================
   El tiempo simulado avanza dt·velocidad en cada cuadro (y a 1/5 en cada rearranque), y con ESE tiempo se mueven el
   motor, la correa, el BSG, los flujos de energía y la carga de la batería, y se pintan las gráficas del dock. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0, tSon=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  const arr=CALC&&CALC.p.arranque, dtS=EST.pausa?0:dt*SIM.warp, dtSim=dtS*(arr?0.25:EST.vel);
  aplicaEscena(dtS,dtSim);
  pasaCam(dt);
  if(t-tSon>0.4){ tSon=t; sonido.zumbido(SIM.e&&!EST.pausa?SIM.nVis:0); }
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaGraficas(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos();
}

/* ===================== 24. ARRANQUE =====================
   Abre funcionando: el coche acelera a 45 km/h con el motor encendido, el BSG asiste y enseguida frena y recupera;
   el motor se apagará solo en la primera parada. */
disposicion();
reiniciaCalculo();
SIM.t=15; { const e=estadoEn(SIM.t); SIM.nVis=e.n; }
aplicaCalidad();
pintaHUD();
aplicaEscena(0.02,0.02);
pintaBarras();
ponVista('banco',0.001);
centraEnHueco();
pintaDockFijo();
cuadro();
if(innerWidth>=640) setTimeout(()=>showToast('El motor se apaga solo en cada parada y el BSG lo <b>rearranca</b> al soltar el freno. '+(matchMedia('(hover: hover)').matches?'Pasa el ratón por':'Toca')+' cualquier pieza para saber qué es.',5600),700);

/* ===================== 25. GANCHOS DE PRUEBA ===================== */
/** Mide el objeto en lo VISIBLE: se pinta sin plataforma, suelo ni fondo sobre magenta puro y se toma la caja de los píxeles que no son magenta. */
function mideObjeto(){
  const ocultos=[]; PLATAFORMA.visible=false; scene.traverse(o=>{ if(o.userData&&o.userData.fondo&&o.visible){ o.visible=false; ocultos.push(o); } });
  const bg=scene.background, fog=scene.fog; scene.background=null; scene.fog=null; renderer.setClearColor(0xff00ff,1);
  renderer.render(scene,camera);
  const c=renderer.domElement, W=c.width, H=c.height, t=document.createElement('canvas'); t.width=W; t.height=H; const g=t.getContext('2d',{willReadFrequently:true}); g.drawImage(c,0,0);
  const d=g.getImageData(0,0,W,H).data; let x0=1e9,x1=-1,y0=1e9,y1=-1;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=(y*W+x)*4; if(!(d[i]>235&&d[i+1]<30&&d[i+2]>235)){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  PLATAFORMA.visible=true; for(const o of ocultos) o.visible=true; scene.background=bg; scene.fog=fog; renderer.setClearColor(0x000000,1);
  const k=W/innerWidth; return {x0:x0/k,x1:x1/k,y0:y0/k,y1:y1/k,altoPx:(y1-y0)/k,anchoPx:(x1-x0)/k,fracAlto:(y1-y0)/H,fracAncho:(x1-x0)/W,hueco:huecoLibre(),W:innerWidth,H:innerHeight};
}

  escena(){ return {vista:EST.vista,calidad:CAL.nivel,pixel:renderer.getPixelRatio(),rotulos:ROT.on,pausa:EST.pausa,vel:EST.vel,t:SIM.t,warp:SIM.warp,n:SIM.nVis,

  mideObjeto, objeto:mideObjeto,
};
window.__test=Object.assign(window.__test||{},{
