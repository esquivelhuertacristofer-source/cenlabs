    if(RETO_INV.fallosV>=3){
      RETO_INV.fallosV=0; RETO_INV.resiembras++; sorteaM();
      feedback('bad','Tres intentos fallidos','Cambia el índice de modulación del inversor: vuelve a plantear el cálculo con el nuevo valor.');
      setTimeout(()=>challengeVoltage(),1500);
    } else {
      feedback('bad','Revisa el cálculo',`Tu resultado (${fN(v,v%1?1:0)} V) está ${d}.`+(ingenuo?' ¿Aplicaste el índice de modulación m del enunciado?':' Revisa respecto a qué punto se mide la fase y qué fracción del máximo se usa.')+` (intentos fallidos: ${RETO_INV.fallosV}/3)`);
      const t=el('d_try'); if(t) t.textContent=RETO_INV.fallosV;
    }
  }
}

/* ---------- Fase 3: el diagnóstico ---------- */
function startPhase3(){
  GUIA.phase=2; GUIA.switching=true;
  const faults=['igbt','sequence','overheat']; fault=faults[Math.floor(Math.random()*faults.length)];
  GUIA.sintoma=''; pasoA('dx'); ponVista('conjunto');
  setTimeout(()=>{ GUIA.sintoma=symptomInv(fault); const s=el('symptomTask'); if(s){ s.innerHTML=GUIA.sintoma; ajustaHoja(); } },1200);
}
function symptomInv(f){
  if(f==='igbt') return 'SÍNTOMA: la fase C no lleva corriente —su barra y sus ranuras quedan apagadas y en el dock su corriente es una línea plana— y en el hexágono el giro se aplasta en una recta. ¿Qué lo causa?';
  if(f==='sequence') return 'SÍNTOMA: las tres corrientes existen, pero no están a 120° y tienen tamaños distintos: en el hexágono el giro se deforma en una elipse. ¿Qué lo causa?';
  if(f==='overheat') return 'SÍNTOMA: la temperatura de la unión sube hasta el corte, la corriente cae y vuelve una y otra vez, y la base del módulo se ve rojiza. ¿Qué lo causa?';
}
function diagnoseInv(choice){
  if(!fault) return;
  const correct=(choice===fault);
  RETO_INV.intentos++;
  if(correct){ RETO_INV.fallosDx=0; sonido.bien(); feedback('good','Diagnóstico correcto ✓',explainInvFault(fault)+' <b>Ahora corrígelo.</b>',true); pasoA('reparar'); }
  else {
    RETO_INV.fallosDx++; sonido.mal();
    if(RETO_INV.fallosDx>=3){
      // tres fallos: el inversor presenta otra falla distinta (no se aprueba por eliminación)
      RETO_INV.fallosDx=0; RETO_INV.resiembras++;
      const p=fault; const faults=['igbt','sequence','overheat'].filter(f=>f!==p); fault=faults[Math.floor(Math.random()*faults.length)];
      feedback('bad','Tres intentos fallidos','El inversor presenta ahora OTRA falla: observa de nuevo la escena y el dock.',true);
      GUIA.sintoma=symptomInv(fault); const s=el('symptomTask'); if(s) s.innerHTML=GUIA.sintoma;
      if(EST.modo==='guia') pintaHUD();
    } else {
      feedback('bad','No es esa la falla','Eso ('+fnameInv(choice)+') daría otro síntoma: '+wrongExInv(choice)+' Observa otra vez. (intentos fallidos: '+RETO_INV.fallosDx+'/3)',true);
      if(EST.modo==='guia') pintaHUD();
    }
  }
}
function explainInvFault(f){
  if(f==='igbt') return 'La rama C no conmuta: su IGBT (o su excitador) quedó en circuito abierto. Sin esa rama la corriente sólo puede ir de A a B y volver: el campo ya no gira, sólo late, y el motor pierde par y se calienta.';
  if(f==='sequence') return 'La placa de control dispara las ramas con un desfase de 48° en lugar de 120°. Las corrientes se desequilibran y el campo gira a tirones: el motor vibra.';
  if(f==='overheat') return 'La refrigeración no evacúa el calor (aquí la resistencia térmica es 4 veces la normal: bomba o radiador fallando). Al llegar a 150 °C el control recorta la corriente al 25 % para salvar los chips, y la devuelve por debajo de 120 °C. Es el compromiso de la Fase 2: más frecuencia, más pérdidas que evacuar.';
}
function fnameInv(f){ return f==='igbt'?'IGBT en falla':f==='sequence'?'secuencia incorrecta':'sobrecalentamiento'; }
function wrongExInv(f){
  if(f==='igbt') return 'una rama abierta dejaría una fase sin corriente (plana), no las tres deformadas ni subiendo y bajando con la temperatura.';
  if(f==='sequence') return 'un desfase incorrecto deforma y desequilibra las tres corrientes; no apaga una ni las hace subir y bajar con la temperatura.';
  if(f==='overheat') return 'el sobrecalentamiento recorta las tres corrientes por igual cuando la unión llega al corte; no apaga una fase ni cambia su desfase.';
}
function repairInv(){
  fault=null; RETO_INV.hecho=true; sonido.bien();
  feedback('good','¡Reparado! 🎉','El inversor vuelve a dar las 3 fases limpias y equilibradas. Completaste las tres fases: lo armaste, calculaste su salida y su frecuencia, y diagnosticaste una falla real de electrónica de potencia.',true);
  pasoA('completo');
}

/* ---------- el enrutador de acciones (la API de siempre) ---------- */
function handleAction(act,btn){
  switch(act){
    case 'place-heatsink':
      if(KIT.heatsink.instalada||KIT.heatsink.activa) break;
      installPiece('heatsink'); feedback('good','Placa fría en camino','La ves trasladarse desde la mesa hasta la carcasa.');
      setTimeout(()=>step_cap(),1150); break;
    case 'try-bus-first':
      if(KIT.heatsink.instalada) break;
      attemptBump('bus');
      feedback('bad','Las barras no pueden ir primero','Las barras de fase sacan las 3 fases del módulo ya gobernado. Sin placa fría, condensador ni módulo, no hay nada que conectar. Instala primero la placa fría.'); break;
    case 'place-cap':
      if(!listo('heatsink')||KIT.cap.instalada||KIT.cap.activa) break;
      installPiece('cap'); feedback('good','Condensador en camino','Se asienta sobre la placa fría, con su barra laminada.');
      setTimeout(()=>step_igbt(),1150); break;
    case 'place-igbt':
      if(!listo('cap')||KIT.igbt.instalada||KIT.igbt.activa) break;
      installPiece('igbt'); feedback('good','Módulo en camino','Sus aletas de pasador se bañan en el canal del refrigerante y sus patas se unen a la barra laminada.');
      setTimeout(()=>step_board(),1150); break;
    case 'place-board':
      if(!listo('igbt')||KIT.board.instalada||KIT.board.activa) break;
      installPiece('board'); feedback('good','Placa de control en camino','Se monta encima del módulo, sobre sus pines de puerta.');
      setTimeout(()=>step_bus(),1150); break;
    case 'place-bus':
      if(!listo('board')||KIT.bus.instalada||KIT.bus.activa) break;
      installPiece('bus'); feedback('good','Barras de fase en camino','Se atornillan a las patas de salida y bajan, por el sensor de corriente, a los bornes del motor.');
      setTimeout(()=>finishPhase1(),1150); break;
    case 'check-v': checkVoltage(); break;
    case 'hint-v':
      if(RETO_INV.pistasV===0){ RETO_INV.pistasV=1; feedback('good','Pista 1 de 2','Cada fase se mide respecto al punto medio del bus: piensa cuánto puede alejarse de ese punto, como máximo, hacia cada riel.'); }
      else if(RETO_INV.pistasV===1){ RETO_INV.pistasV=2; feedback('good','Pista 2 de 2','El máximo posible es una fracción fija del bus completo; el índice m dice qué parte de ese máximo se usa realmente.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break;
    case 'freq-low': eligeFreq('low'); break;
    case 'freq-mid': eligeFreq('mid'); break;
    case 'freq-high': eligeFreq('high'); break;
    case 'toggle-run':
      if(GUIA.phase!==1) break;
      GUIA.switching=!GUIA.switching; sonido.init();
      if(btn){ btn.textContent=(GUIA.switching?'⏸':'▶')+' Conmutación'; btn.classList.toggle('good',GUIA.switching); }
      if(GUIA.switching){ if(EST.pausa){ EST.pausa=false; pintaBarras(); } setTimeout(()=>{ GUIA.toP3=true; const b=el('toP3'); if(b) b.disabled=false; },2200); }
      pintaDockFijo(); break;
    case 'to-phase3': if(GUIA.phase!==1) break; startPhase3(); break;
    case 'dx-igbt': diagnoseInv('igbt'); break;
    case 'dx-sequence': diagnoseInv('sequence'); break;
    case 'dx-overheat': diagnoseInv('overheat'); break;
    case 'repair-inv': if(GUIA.paso==='reparar') repairInv(); break;
    case 'restart': location.reload(); break;
  }
}

/* ---------- el recorrido guiado de «En marcha» ---------- */

  if(EST.autoRunning||EST.modo!=='marcha') return; EST.autoRunning=true; sonido.init();
  const hud=el('hud');
  const prev={mod:EST.mod,m:EST.m,fsw:EST.fsw,td:EST.td,esc:EST.esc,pausa:EST.pausa,vista:VISTA.actual,lupa:EST.lupa,escMano:EST.escMano};
  const fija=o=>{ Object.assign(EST,o); pintaHUD(); hud.style.pointerEvents='none'; const b=el('btnAuto'); if(b){ b.disabled=true; b.textContent='Recorrido en curso…'; } pintaDockFijo(); pintaBarras(); };
  try{
    fija({mod:'svpwm',m:0.9,fsw:10000,td:2,esc:1/200,pausa:false,lupa:false}); ponVista('bus');
    showToast('Paso 1 · El bus de <b>350 V</b> llega por los cables naranjas (se ve su alma de cobre) al <b>condensador</b>: él da los picos de corriente que la batería no puede dar.',7000);
    await espera(7400);
    fija({esc:1e-4,lupa:true}); ponVista('modulo');
    showToast('Paso 2 · A ×1/10 000 se ve <b>cada estado</b>: en cada rama conduce el IGBT de arriba o el de abajo, o un diodo. Cian, IGBT; ámbar, diodo. El dock amplía ese periodo con T₁, T₂ y T₀.',9000);
    await espera(9400);
    fija({esc:1/200,lupa:false}); ponVista('conjunto');
    showToast('Paso 3 · Seis interruptores dan <b>ocho estados</b>: seis vectores activos y dos nulos. En el hexágono el vector de referencia gira y, en cada periodo, se arma con sus dos vecinos.',8000);
    await espera(8400);
    fija({mod:'spwm',m:1.15});
    showToast('Paso 4 · <b>SPWM</b> con m = 1,15: las referencias se recortan y en el espectro crecen el 5.º y el 7.º armónico.',6500);
    await espera(6900);
    fija({mod:'svpwm',m:1.15});
    showToast('Paso 5 · <b>SVPWM</b> con el mismo m: la secuencia cero aplana las referencias y caben sin recortar. Un 15,5 % más de tensión con el mismo bus.',7000);
    await espera(7400);
    fija({m:0.9}); ponVista('motor');
    showToast('Paso 6 · Las corrientes de las 24 ranuras crean un <b>campo que gira</b> (rojo norte, azul sur) y el rotor de jaula lo sigue, un 3 % más lento.',7000);

  } finally {
    Object.assign(EST,prev); EST.autoRunning=false; hud.style.pointerEvents='';

  }
}


/* ===================== 16. SONIDO (sintetizado) =====================
   El silbido de la conmutación: más audible a baja frecuencia y casi
   inaudible a alta, como en un coche de verdad. */
const sonido=(function(){
  let ctx=null,on=true,master=null,osc=null,gain=null,filt=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      osc=ctx.createOscillator(); osc.type='square'; filt=ctx.createBiquadFilter(); filt.type='highpass'; filt.frequency.value=200;
      gain=ctx.createGain(); gain.gain.value=0; osc.connect(filt); filt.connect(gain); gain.connect(master); osc.start();
    }catch(e){ ctx=null; } }
  function actualiza(conmuta,fsw){ if(!ctx) return; const t=ctx.currentTime;
    osc.frequency.setTargetAtTime(Math.min(1800,200+fsw/14),t,0.05);
    const aud=Math.max(0.15,1-(fsw-2000)/18000);
    gain.gain.setTargetAtTime(on&&conmuta?0.022*aud:0,t,0.1); }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); }
  return {init,actualiza,
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    clac:()=>tono(320,0.06,0.04,'triangle'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; },

/* ===================== 17. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.min(devicePixelRatio,alta?2:1.5));
  const ms=alta?2048:1024; if(LUZ.clave.shadow.mapSize.x!==ms){ LUZ.clave.shadow.mapSize.set(ms,ms); if(LUZ.clave.shadow.map){ LUZ.clave.shadow.map.dispose(); LUZ.clave.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  M_PUNTOS.uniforms.uPx.value=innerHeight*renderer.getPixelRatio()/(2*Math.tan(camera.fov*Math.PI/360));
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  M_PUNTOS.uniforms.uPx.value=innerHeight*renderer.getPixelRatio()/(2*Math.tan(camera.fov*Math.PI/360));
  colocaBarras(); SP.clave=''; FU.clave='';
  clearTimeout(window.__rzINV); window.__rzINV=setTimeout(()=>ponVista(VISTA.actual,0.01),140);
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 18. EL LAZO: UN SOLO RELOJ =====================
   El tiempo simulado avanza dt·escala en cada cuadro, y con ESE tiempo se
   pintan la escena (chips, puntos, campo, rotor) y el dock (cursor de la
   vuelta, periodo ampliado, hexágono). */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  aplicaEscena(EST.pausa?0:dt*EST.esc,dt,t);
  pasaCam(dt);
  sonido.actualiza(!!SIMU.W&&!EST.pausa,SIMU.W?SIMU.W.p.fsw:0);
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); pintaGuiaVivo(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaHex(); pintaTs(); pintaFu(); pintaSp(); }
  controls.update();
  PASO_G.value=clamp(0.0030*camera.position.distanceTo(controls.target),0.0007,0.008);
  renderer.info.reset(); composer.render();
  colocaRotulos();
}
