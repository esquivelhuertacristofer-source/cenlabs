<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.26, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;
    }
    if(hook)hook(dt,t); controls.update();
    if(bokeh) bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);
    composer.render(); }
  function start(){ if(!raf)loop(); }
  function stop(){ cancelAnimationFrame(raf); raf=null; window.removeEventListener('resize',resize); }

  return { THREE, renderer, scene, camera, controls, composer, bloom,
    setAnimate:fn=>hook=fn, start, stop, resize, clock,
    flyTo:(v)=>{ controls.target.copy(v); }, moveTo, setCinematicIdle };
}

function pickerFor(scene,camera,dom,onHit){
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(); let down=null;
  dom.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
  dom.addEventListener('pointerup',e=>{
    if(!down)return; const moved=Math.abs(e.clientX-down[0])+Math.abs(e.clientY-down[1])>6; down=null;
    if(moved)return;
    const r=dom.getBoundingClientRect();
    mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1;

  });
}

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

// GPIO, antirrebote e interrupciones en un MCU. Motor verificado numéricamente
// (verify_gpio.mjs, 291/291) y pegado aquí VERBATIM: simulación y verificación comparten
// implementación. Todo el tiempo está en MICROSEGUNDOS ENTEROS.
//   ACONDICIONAMIENTO: una entrada digital sin resistencia de polarización no tiene nivel
//     definido en reposo; el nodo lo fija la fuga de la bornera y lo que se le acople. El
//     pull-up decide TRES cosas a la vez: el nivel en reposo, la corriente que consume el
//     nodo y la impedancia que ve el ruido — Z = R/√(1+(ωRC)²).
//   HUMECTACIÓN: un contacto de plata necesita algún miliamperio para romper la película de
//     óxido y sulfuro. Es un PISO de corriente, no sólo un techo. Los contactos chapados en
//     oro (circuito seco) no lo necesitan.
//   ANTIRREBOTE: un duplicado exige DOS tramos contiguos del tren de rebotes —falso reposo y
//     re-cierre— confirmados por separado. Como los dos suman como mucho la ventana de rebote,
//     el mejor reparto para el rebote es la mitad y la mitad: la regla es t_est > t_reb/2.
//     El techo lo pone el suceso más corto (la pulsación si se sondea, el hueco si se rearma).
//   ESTRATEGIA: sondear en el lazo, sondear por temporizador o entrar por interrupción no son
//     equivalentes. Los pines de interrupción externa son un recurso escaso, el temporizador
//     puede estar ocupado y un nodo que duerme sólo despierta por interrupción.
//   Ref: ATmega328P (V_IH = 0,6·Vcc, V_IL = 0,3·Vcc, pull-up interno 20–50 kΩ) · 74HC14
//        (umbrales típicos a 5 V: 2,9 V de subida y 2,0 V de bajada) · IEC 60947-5-1 (los
//        fabricantes declaran una carga mínima de contacto) · verificación propia (291/291).

const VIH = 3.0;            // V — 0,6·Vcc (ATmega328P con Vcc > 2,4 V)
const VIL = 1.5;            // V — 0,3·Vcc
const VTP = 2.9;            // V — 74HC14, umbral de subida típico a 5 V
const VTM = 2.0;            // V — 74HC14, umbral de bajada típico a 5 V
const VN_MAX = 0.5;         // V — regla de diseño: el reposo no puede bajar de
                            //     4,5 V (1,5 V de margen sobre V_IH = 3,0 V)
const R_INT_V = 50000;      // Ω — pull-up interno, peor caso PARA EL NIVEL
const R_INT_I = 20000;      // Ω — pull-up interno, peor caso PARA EL CONSUMO
const R_EXT = 4700;         // Ω — pull-up externo
const RC_R1 = 10000;        // Ω — filtro: resistencia desde Vcc
const RC_R2 = 1000;         // Ω — filtro: resistencia en serie con el contacto
const RC_C = 100e-9;        // F  — condensador del filtro
const C_STRAY = 15e-12;     // F  — capacidad parásita del pin + cableado
const T_ISR = 10;           // µs — latencia de entrada a la ISR

const T_TIMER = 1000;       // µs — periodo del sondeo por temporizador
const HUM_HALF = 8333;      // µs — semiperiodo de 60 Hz (entrada flotante)
const F_NOISE = 4000;       // Hz — portadora típica de un variador

const TAU_O = RC_R1 * RC_C * 1e6;                              // µs — carga
const TAU_C = (RC_R1 * RC_R2 / (RC_R1 + RC_R2)) * RC_C * 1e6;  // µs — descarga
const V_CLOSED = VCC * RC_R2 / (RC_R1 + RC_R2);                // V — nodo con contacto cerrado
const TD_PRESS = TAU_C * Math.log((VCC - V_CLOSED) / (VTM - V_CLOSED));  // µs
const TD_REL = TAU_O * Math.log((VCC - V_CLOSED) / (VCC - VTP));         // µs
const TD_RC = Math.max(TD_PRESS, TD_REL);   // µs — el peor de los dos retardos
const DT_GAP = TD_REL - TD_PRESS;           // µs — lo que el filtro le roba al hueco

// ------------------------------------------------------------------ opciones

  { k: 'interno', n: 'Pull-up interno del MCU (20–50 kΩ)', rV: R_INT_V, rI: R_INT_I, c: C_STRAY, rc: false },
  { k: 'externo', n: 'Pull-up externo de 4,7 kΩ', rV: R_EXT, rI: R_EXT, c: C_STRAY, rc: false },
  { k: 'rc', n: 'Filtro 10 kΩ + 1 kΩ + 100 nF con Schmitt 74HC14', rV: RC_R1, rI: RC_R1 + RC_R2, c: RC_C, rc: true },
];
const ENT = Object.fromEntries(ENTRADAS.map(e => [e.k, e]));

const iQuiesc = e => e.rI === null ? 0 : VCC / e.rI * 1000;          // mA en reposo
const zNoise = e => e.rV === null ? 1e9                              // Ω a F_NOISE
  : e.rV / Math.sqrt(1 + (2 * Math.PI * F_NOISE * e.rV * e.c) ** 2);
const iAcOf = sc => 2 * Math.PI * F_NOISE * (sc.cCoup || 0) * (sc.vDrive || 0);  // A
const vLeak = (sc, e) => e.rV === null ? VCC : VCC * e.rV / (e.rV + (sc.rLeak ?? Infinity));
const vAc = (sc, e) => iAcOf(sc) * zNoise(e);
const vDrop = (sc, e) => vLeak(sc, e) + vAc(sc, e);      // V que pierde el reposo
const vRest = (sc, e) => VCC - vDrop(sc, e);             // V del nodo sin pulsar
const tDelayEnt = e => e.rc ? TD_RC : 0;                 // µs
const diasPila = (mAh, mA) => mAh / mA / 24;

const TESTS = [1000, 5000, 20000, 50000];   // µs — tiempo estable del antirrebote

const ADQS = [
  { k: 'lazo', n: 'Sondeo en el lazo principal', int: false, timer: false, sleep: false },
  { k: 'timer', n: 'Sondeo en interrupción de temporizador (1 ms)', int: false, timer: true, sleep: false },
  { k: 'intRaw', n: 'Interrupción externa sin antirrebote', int: true, timer: false, sleep: true },
  { k: 'intDeb', n: 'Interrupción externa con antirrebote', int: true, timer: false, sleep: true },
];
const ADQ = Object.fromEntries(ADQS.map(a => [a.k, a]));

// --------------------------------------------------------------- escenarios
// tb, pulseMin, gapMin, tLoop, tLatMax en µs · rLeak en Ω · cCoup en F
// iMaxIn (techo de consumo) e iMinIn (piso de humectación del contacto) en mA

    nota: '40 m de cable en la misma canaleta que el motor: 80 pF acoplan la portadora de 4 kHz.',
  },

const goodEnt = sc => sc.ent;
const goodTest = sc => sc.tEst;
const goodAdq = sc => sc.adq;
const GOOD = sc => ({ ent: goodEnt(sc), tEst: goodTest(sc), adq: goodAdq(sc) });
const RETO_POOL = [0, 1, 2, 3];
const NP = 24;      // pulsaciones por corrida
const I_MIN = 3;    // pulsación forzada al ancho mínimo
const I_GAP = 7;    // hueco forzado al mínimo
const I_BAD = 11;   // pulsación con el peor tren de rebotes

// ------------------------------------------------------------------- útiles
function lcg(s) { let x = s >>> 0; return () => { x = (Math.imul(x, 1664525) + 1013904223) >>> 0; return x / 4294967296; }; }

// Tren de rebotes: nº IMPAR de transiciones repartidas de forma irregular
// dentro de la ventana tb. La primera cae en t0 y la última en t0+tb.
function bounceEdges(t0, tb, rnd) {
  const nb = [3, 5, 7][Math.floor(rnd() * 3)];
  const k = nb - 1;
  const u = []; let s = 0;
  for (let i = 0; i < k; i++) { const v = 0.10 + 0.90 * rnd(); u.push(v); s += v; }
  const out = [t0]; let acc = 0;
  for (let i = 0; i < k; i++) { acc += u[i] / s; out.push(t0 + Math.round(acc * tb)); }
  for (let i = 1; i < out.length; i++) if (out[i] <= out[i - 1]) out[i] = out[i - 1] + 1;
  return out;
}
// Peor tren posible PARA UN ANTIRREBOTE: parte la ventana en dos mitades.
// Un duplicado exige DOS tramos contiguos (cierre y falso reposo) que el
// antirrebote confirme por separado; como los dos suman tb, el mejor reparto
// para el atacante es tb/2 + tb/2. Ningún otro tren llega más lejos.
function worstBounce(t0, tb) { return [t0, t0 + Math.round(tb / 2), t0 + tb]; }
const maxGapOf = tr => { let m = 0; for (let i = 1; i < tr.length; i++) m = Math.max(m, tr[i] - tr[i - 1]); return m; };
// Mayor valor de min(tramo_i, tramo_i+1): la cota real que debe superar el tEst.
const worstPairOf = tr => {
  let m = 0;
  for (let i = 2; i < tr.length; i++) m = Math.max(m, Math.min(tr[i - 1] - tr[i - 2], tr[i] - tr[i - 1]));
  return m;
};

function mergeEdges(...lists) {
  const all = [].concat(...lists).sort((a, b) => a - b);
  for (let i = 1; i < all.length; i++) if (all[i] <= all[i - 1]) all[i] = all[i - 1] + 1;
  return all;
}

function lvlAt(E, t) {
  let lo = 0, hi = E.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (E[m] <= t) lo = m + 1; else hi = m; }
  return lo & 1;
}

// ------------------------------------------------------- señal de la estación
const SIG_CACHE = new Map();
function baseSignal(sc) {
  if (SIG_CACHE.has(sc.id)) return SIG_CACHE.get(sc.id);
  const rnd = lcg(sc.seed);
  const presses = []; const trains = [];
  let t = 2 * sc.gapMin;
  for (let i = 0; i < NP; i++) {
    const dur = (i === I_MIN) ? sc.pulseMin : Math.round(sc.pulseMin * (1 + 0.6 * rnd()));
    const gap = (i === I_GAP) ? sc.gapMin : Math.round(sc.gapMin * (1 + 0.8 * rnd()));
    const mk = (i === I_BAD) ? worstBounce(t, sc.tb) : bounceEdges(t, sc.tb, rnd);
    const br = bounceEdges(t + dur, sc.tb, rnd);
    trains.push(mk, br);
    presses.push({ t, dur, gap, mk, br, end: t + dur + sc.tb });
    t = t + dur + sc.tb + gap;
  }
  const tEnd = t + 2 * sc.gapMin;
  const out = { E: mergeEdges(...trains), presses, tEnd, trains };
  SIG_CACHE.set(sc.id, out);
  return out;
}
function humEdges(tEnd) { const h = []; for (let t = 1234; t < tEnd; t += HUM_HALF) h.push(t); return h; }

// -------------------------------------------------- filtro RC + Schmitt exacto
// Integración analítica segmento a segmento: sin error de paso.
function rcFilter(E, tEnd) {
  const out = []; let v = VCC, outLvl = 0, lvl = 0, t = 0, li = 0;
  const segEnd = i => (i < E.length ? E[i] : tEnd);
  let guard = 0;
  while (t < tEnd && guard++ < 4e6) {
    const te = segEnd(li);
    const vinf = lvl ? V_CLOSED : VCC;
    const tau = lvl ? TAU_C : TAU_O;
    let tc = Infinity, nxt = outLvl;
    if (outLvl === 0) { if (vinf < VTM && v > VTM) { tc = t + tau * Math.log((v - vinf) / (VTM - vinf)); nxt = 1; } }
    else { if (vinf > VTP && v < VTP) { tc = t + tau * Math.log((vinf - v) / (vinf - VTP)); nxt = 0; } }
    if (tc < te) { out.push(Math.round(tc)); outLvl = nxt; v = (outLvl === 1 ? VTM : VTP); t = tc; }
    else {
      if (te > t) v = vinf + (v - vinf) * Math.exp(-(te - t) / tau);
      t = te; if (li < E.length) { lvl ^= 1; li++; } else break;
    }
  }
  for (let i = 1; i < out.length; i++) if (out[i] <= out[i - 1]) out[i] = out[i - 1] + 1;
  return out;
}
// Tensión del nodo instante a instante (para la vista de Aplica).
function rcTrace(E, t0, t1, n) {
  const pts = []; let v = VCC, lvl = 0, t = 0, li = 0;
  const step = (t1 - t0) / n;
  const advance = (to) => {
    while (li < E.length && E[li] <= to) {
      const te = E[li];
      const vinf = lvl ? V_CLOSED : VCC, tau = lvl ? TAU_C : TAU_O;
      v = vinf + (v - vinf) * Math.exp(-(te - t) / tau); t = te; lvl ^= 1; li++;
    }
    const vinf = lvl ? V_CLOSED : VCC, tau = lvl ? TAU_C : TAU_O;
    v = vinf + (v - vinf) * Math.exp(-(to - t) / tau); t = to;
  };
  advance(t0);
  for (let i = 0; i <= n; i++) { advance(t0 + i * step); pts.push({ t: t0 + i * step, v }); }
  return pts;
}

// ------------------------------------------------------------- antirrebotes
// Integrador: exige tEst de estabilidad medidos sobre muestras periódicas.
function integrador(E, tEnd, T, tEst, off) {
  const ev = []; let stable = 0, cand = 0, since = off;
  for (let ts = off; ts <= tEnd; ts += T) {
    const v = lvlAt(E, ts);
    if (v !== cand) { cand = v; since = ts; }
    else if (cand !== stable && ts - since >= tEst) { stable = cand; if (stable === 1) ev.push(ts); }
  }
  return ev;
}
// Lockout: acepta el flanco al vuelo y se re-arma tras tEst de reposo estable.
function lockout(E, tEnd, tEst, tIsr) {
  const ev = []; let armed = true, lvl = 0, lowSince = 0;
  for (let k = 0; k < E.length; k++) {
    const te = E[k], nl = lvl ^ 1;
    if (!armed && lvl === 0 && te - lowSince >= tEst) armed = true;
    if (nl === 1) { if (armed) { ev.push(te + tIsr); armed = false; } }
    else lowSince = te;
    lvl = nl;
  }
  return ev;
}

// --------------------------------------------------------- corrida y métricas
function attribute(ev, presses) {
  const n = presses.length, cnt = new Array(n).fill(0), lat = new Array(n).fill(null);
  let spurious = 0;
  for (const e of ev) {
    let lo = 0, hi = n;
    while (lo < hi) { const m = (lo + hi) >> 1; if (presses[m].t <= e) lo = m + 1; else hi = m; }
    const i = lo - 1;
    if (i < 0) { spurious++; continue; }
    cnt[i]++; if (lat[i] === null) lat[i] = e - presses[i].t;
  }
  const missed = cnt.filter(c => c === 0).length;
  const dupes = cnt.reduce((a, c) => a + Math.max(0, c - 1), 0);
  const lats = lat.filter(x => x !== null);
  return { events: ev.length, n, missed, dupes, spurious, maxLat: lats.length ? Math.max(...lats) : 0, cnt, lat };
}

function signalFor(sc, entK) {
  const b = baseSignal(sc), e = ENT[entK];
  if (entK === 'flotante') return { ...b, E: mergeEdges(b.E, humEdges(b.tEnd)) };
  if (e.rc) return { ...b, E: rcFilter(b.E, b.tEnd) };
  return b;
}

function runSim(sc, cfg, off) {
  const s = signalFor(sc, cfg.ent), a = ADQ[cfg.adq];
  const ev = a.int
    ? lockout(s.E, s.tEnd, a.k === 'intRaw' ? 0 : cfg.tEst, T_ISR)
    : integrador(s.E, s.tEnd, a.k === 'timer' ? T_TIMER : sc.tLoop, cfg.tEst, off);
  const r = attribute(ev, s.presses);
  r.isr = a.int ? ev.length : 0;
  return r;
}
const score = r => r.missed * 1e9 + r.dupes * 1e6 + r.spurious * 1e3 + r.maxLat / 1e6;

const RUN_CACHE = new Map();
function runC(sc, cfg) {
  const key = `${sc.id}|${cfg.ent}|${cfg.tEst}|${cfg.adq}`;
  if (RUN_CACHE.has(key)) return RUN_CACHE.get(key);
  const a = ADQ[cfg.adq];
  const T = a.int ? 0 : (a.k === 'timer' ? T_TIMER : sc.tLoop);
  const offs = a.int ? [0] : [0, Math.round(T / 4), Math.round(T / 2), Math.round(3 * T / 4)];
  let worst = null;
  for (const o of offs) { const r = runSim(sc, cfg, o); if (!worst || score(r) > score(worst)) worst = r; }
  worst.ok = worst.missed === 0 && worst.dupes === 0 && worst.spurious === 0 && worst.maxLat <= sc.tLatMax;
  RUN_CACHE.set(key, worst);
  return worst;
}

// --------------------------------------------------- calificación del Reto
function guardEnt(sc, entK) {
  const e = ENT[entK];
  if (e.rV === null) return false;                 // sin nivel definido en reposo
  if (iQuiesc(e) > sc.iMaxIn) return false;        // techo: presupuesto de consumo
  if (iQuiesc(e) < (sc.iMinIn || 0)) return false; // piso: humectación del contacto
  if (vDrop(sc, e) > VN_MAX) return false;         // margen de ruido en reposo
  return true;
}
function guardAdq(sc, adqK) {
  const a = ADQ[adqK];
  if (a.int && sc.nIn > N_INT) return false;       // pines de interrupción externa
  if (a.timer && !sc.timerLibre) return false;     // temporizador ocupado por el PWM
  if (sc.sleep && !a.sleep) return false;          // el nodo tiene que dormir
  return true;
}
function cfgOk(sc, cfg) {
  if (!guardEnt(sc, cfg.ent)) return false;
  if (!guardAdq(sc, cfg.adq)) return false;
  return runC(sc, cfg).ok;
}
const cfgWith = (sc, o) => ({ ...GOOD(sc), ...o });
const okEnt = (sc, k) => cfgOk(sc, cfgWith(sc, { ent: k }));
const okTest = (sc, t) => cfgOk(sc, cfgWith(sc, { tEst: t }));
const okAdq = (sc, k) => cfgOk(sc, cfgWith(sc, { adq: k }));

// ===================== 2b. ADAPTADORES DE PRESENTACIÓN =====================
// Nada de esto cambia el motor: sólo lo consulta para dibujar.
const EV_CACHE=new Map();
function evRun(sc,cfg){
  const key=`${sc.id}|${cfg.ent}|${cfg.tEst}|${cfg.adq}`;
  if(EV_CACHE.has(key))return EV_CACHE.get(key);
  const s=signalFor(sc,cfg.ent),a=ADQ[cfg.adq];
  const T=a.int?0:(a.k==='timer'?T_TIMER:sc.tLoop);
  const offs=a.int?[0]:[0,Math.round(T/4),Math.round(T/2),Math.round(3*T/4)];
  let worst=null,off=0;
  for(const o of offs){const r=runSim(sc,cfg,o);if(!worst||score(r)>score(worst)){worst=r;off=o;}}
  const ev=a.int?lockout(s.E,s.tEnd,a.k==='intRaw'?0:cfg.tEst,T_ISR)
                :integrador(s.E,s.tEnd,T,cfg.tEst,off);
  const out={s,ev,off,T,r:runC(sc,cfg)};
  EV_CACHE.set(key,out);return out;
}
// Ventana de observación centrada en una pulsación concreta de la corrida medida.
function winFor(sc,pi){
  const b=baseSignal(sc),p=b.presses[pi];
  const pre=Math.round(0.40*sc.tb)+Math.round(0.10*p.dur);
  const post=Math.round(0.55*p.gap);
  return {t0:p.t-pre,t1:p.t+p.dur+sc.tb+post,p,b};
}
// Ventana VÁLIDA de t_est MEDIDA por barrido (no una fórmula): 48 puntos log-espaciados.
const WIN_CACHE=new Map();
function winOf(sc){
  if(WIN_CACHE.has(sc.id))return WIN_CACHE.get(sc.id);
  const pts=[];
  for(let i=0;i<48;i++){
    const t=Math.round(100*Math.pow(2000,i/47));
    const r=runC(sc,cfgWith(sc,{tEst:t}));
    pts.push({t,ok:r.ok,missed:r.missed,dupes:r.dupes});
  }
  const g=goodTest(sc);
  let lo=100,hi=200000;
  for(const p of pts){if(p.t<g&&!p.ok)lo=Math.max(lo,p.t);if(p.t>g&&!p.ok)hi=Math.min(hi,p.t);}
  const out={pts,lo,hi};WIN_CACHE.set(sc.id,out);return out;
}
// Por qué se descarta cada opción: la razón la da el motor, no una tabla escrita a mano.
function whyRun(sc,cfg){
  const r=runC(sc,cfg);
  if(r.missed)return {ok:false,txt:'pierde '+r.missed+' de '+NP+' pulsaciones'};
  if(r.dupes)return {ok:false,txt:'cuenta '+r.dupes+' pulsaciones de más'};
  if(r.spurious)return {ok:false,txt:'inventa '+r.spurious+' eventos que nadie provocó'};
  if(r.maxLat>sc.tLatMax)return {ok:false,txt:'latencia '+fmtT(r.maxLat)+' sobre un máximo de '+fmtT(sc.tLatMax)};
  return {ok:true,txt:'cumple: 24 de 24, sin dobles y con '+fmtT(r.maxLat)+' de latencia'};
}
function whyEnt(sc,k){
  const e=ENT[k];
  if(e.rV===null)return {ok:false,txt:'entrada flotante: en reposo el nivel no está definido'};
  if(iQuiesc(e)>sc.iMaxIn)return {ok:false,txt:'consume '+n3(iQuiesc(e))+' mA y el presupuesto es '+n2(sc.iMaxIn)+' mA'};
  if(iQuiesc(e)<(sc.iMinIn||0))return {ok:false,txt:'sólo da '+n3(iQuiesc(e))+' mA y el contacto pide '+n1(sc.iMinIn)+' mA de humectación'};
  if(vDrop(sc,e)>VN_MAX)return {ok:false,txt:'el reposo cae a '+n2(vRest(sc,e))+' V (mínimo admitido '+n1(VCC-VN_MAX)+' V)'};
  return whyRun(sc,cfgWith(sc,{ent:k}));
}
function whyTest(sc,t){
  const r=runC(sc,cfgWith(sc,{tEst:t})),a=ADQ[goodAdq(sc)];
  if(r.dupes)return {ok:false,txt:'cuenta '+r.dupes+' de más: '+fmtT(t)+' no cubre la mitad de la ventana de rebote ('+fmtT(sc.tb/2)+')'};
  if(r.missed)return {ok:false,txt:a.int?('pierde '+r.missed+': exige '+fmtT(t)+' de reposo estable y el hueco más corto es '+fmtT(sc.gapMin))
                                        :('pierde '+r.missed+': exige '+fmtT(t)+' de nivel estable y la pulsación más corta es '+fmtT(sc.pulseMin))};
  return whyRun(sc,cfgWith(sc,{tEst:t}));
}
function whyAdq(sc,k){
  const a=ADQ[k];
  if(a.int&&sc.nIn>N_INT)return {ok:false,txt:'hacen falta '+sc.nIn+' entradas y el MCU sólo tiene '+N_INT+' pines de interrupción externa'};
  if(a.timer&&!sc.timerLibre)return {ok:false,txt:'el temporizador ya está ocupado generando el PWM'};
  if(sc.sleep&&!a.sleep)return {ok:false,txt:'el nodo tiene que dormir y el sondeo no despierta al MCU'};
  return whyRun(sc,cfgWith(sc,{adq:k}));
}

function seedReto(k){
  retoK=(k==null)?pickIdx(RETO_POOL.length,retoK):k;

  const badE=ENTRADAS.find(e=>!okEnt(sc,e.k));

function wave(c,x,y,w,h,E,t0,t1,col){
  const sx=t=>x+((t-t0)/(t1-t0))*w;
  const yHi=y+9,yLo=y+h-9;
  let lvl=lvlAt(E,t0),py=lvl?yHi:yLo;
  c.strokeStyle=col;c.lineWidth=2;c.beginPath();c.moveTo(x,py);
  for(const e of E){
    if(e<=t0)continue;
    if(e>t1)break;
    const ex=sx(e);c.lineTo(ex,py);lvl^=1;py=lvl?yHi:yLo;c.lineTo(ex,py);
  }
  c.lineTo(x+w,py);c.stroke();
  c.fillStyle='#6b7280';c.font='10px Outfit, sans-serif';c.textAlign='left';
  c.fillText('1',x+4,yHi+4);c.fillText('0',x+4,yLo+4);
}
function evLane(c,x,y,w,h,ev,t0,t1,col){
  let n=0;

    c.strokeStyle=col;c.lineWidth=2;c.beginPath();c.moveTo(px,y+h-8);c.lineTo(px,y+10);c.stroke();
    c.fillStyle=col;c.beginPath();c.arc(px,y+10,3.5,0,Math.PI*2);c.fill();
  });

}

}

// --- fotogramas DERIVADOS de una corrida medida (nunca escritos a mano) ---
function hwFrames(){
  const sc=curSc(),cfg=curCfg(),pi=curPress();
  const {t0,t1,b}=winFor(sc,pi);
  const R=evRun(sc,cfg);
  const N=48,out=[];
  for(let k=0;k<N;k++){
    const t=Math.round(t0+(t1-t0)*k/(N-1));
    const tp=k?Math.round(t0+(t1-t0)*(k-1)/(N-1)):t0-1;
    const evt=R.ev.some(e=>e>tp&&e<=t);
    out.push({raw:lvlAt(b.E,t),nod:lvlAt(R.s.E,t),evt,lab:n2((t-t0)/1000)+' ms'});
  }
  return out;
}
function frames(){if(!framesCache)framesCache=hwFrames();return framesCache;}
function hwCount(){return Math.max(1,frames().length);}

function updateHW(){
  const fs=frames(),fr=fs[hwStep%fs.length]||{raw:0,nod:0,evt:false};
  const ent=curCfg().ent;
  rPull.visible=(ent==='externo'||ent==='rc');
  rSer.visible=(ent==='rc');capF.visible=(ent==='rc');schmitt.visible=(ent==='rc');
  mcuRing.material.emissiveIntensity=(ent==='interno')?1.2:0.10;
  plunger.position.y=fr.raw?0.47:0.52;cap.position.y=fr.raw?0.58:0.63;
  ledRaw.material.emissiveIntensity=fr.raw?1.5:0.10;
  ledNode.material.emissiveIntensity=fr.nod?1.5:0.10;
  ledEvt.material.emissiveIntensity=fr.evt?1.8:0.10;
}

// ===================== 13. QUIZ =====================
function buildQuiz(){
  QUIZ={
    explora:{
      pregunta:'¿Por qué una entrada digital sin resistencia de polarización no vale, aunque en la mesa del taller «parezca que funciona»?',
      opciones:[
        {t:'Porque con el contacto abierto nadie fija la tensión del pin: la deciden la fuga de la bornera y lo que se acople al cable. Que funcione en la mesa sólo dice que allí no había ni humedad ni un variador cerca.',ok:true,why:'Correcto. Un nodo flotante no tiene nivel: tiene la tensión que le dejen. Y en CMOS, además, un pin parado a media escala hace conducir a la vez los dos transistores de entrada.'},
        {t:'Porque sin resistencia la corriente por el contacto es infinita y acaba soldando las láminas.',ok:false,why:'Con el contacto abierto no circula corriente, y con el contacto cerrado quien limita la corriente es precisamente el pull-up. Sin pull-up el problema es el contrario: no circula nada y el nodo queda al aire.'},
        {t:'Porque el microcontrolador no puede leer un 0 lógico si no hay una resistencia hacia Vcc.',ok:false,why:'El 0 lo da el contacto cerrado llevando el pin a masa, y eso funciona con o sin pull-up. Lo que falta sin pull-up es el 1: el estado de reposo.'},
        {t:'Porque la resistencia de polarización es la que produce el antirrebote y sin ella el contacto rebota más.',ok:false,why:'El pull-up no quita ni un rebote: los rebotes son mecánicos y ocurren igual. El antirrebote es del programa o de un filtro, no de la polarización.'},
      ],
    },
    aplica:{
      pregunta:'La regla de dimensionado del antirrebote es t_est &gt; t_reb/2. ¿Por qué la MITAD de la ventana de rebote y no la ventana entera?',
      opciones:[
        {t:'Porque para colar un conteo de más hacen falta DOS tramos contiguos —un falso reposo y un re-cierre— confirmados por separado, y los dos juntos no pueden pasar de la ventana. El mejor reparto para el rebote es mitad y mitad.',ok:true,why:'Correcto. Si un tramo mide más de la mitad, el contiguo mide menos, y el antirrebote sólo necesita ganar UNO de los dos. Por eso la cota es t_reb/2 y no t_reb.'},
        {t:'Porque el fabricante del pulsador especifica el rebote como el doble del valor real, por seguridad.',ok:false,why:'Los fabricantes declaran el rebote máximo, no el doble de nada. La mitad sale de la geometría del problema, no de una convención de catálogo.'},
        {t:'Porque el filtro RC ya se encarga de la primera mitad del tren de rebotes y el programa sólo tiene que cubrir la segunda.',ok:false,why:'La regla vale exista o no filtro. Y un filtro con τ de 1 ms no borra un tren de 60 ms: baja la impedancia y da histéresis, pero el antirrebote sigue siendo del programa.'},
        {t:'Porque poner t_est igual a la ventana entera haría perder pulsaciones.',ok:false,why:'Eso es cierto pero es el TECHO, y lo pone el suceso más corto —la pulsación o el hueco—, no la ventana de rebote. Son dos límites distintos y por motivos distintos.'},
      ],
    },
    reto:{
      pregunta:'¿Por qué un contacto de plata puede exigir una corriente MÍNIMA por la entrada, y uno chapado en oro no?',
      opciones:[
        {t:'Porque sobre la plata se forma una película de óxido y sulfuro que aísla: hace falta algo de corriente —del orden del miliamperio— para romperla. El oro no se sulfura, así que admite circuito seco.',ok:true,why:'Correcto: es la corriente de humectación. Un pull-up de 50 kΩ da 0,1 mA y deja el contacto sin limpiar: el conteo empieza a fallar meses después de la puesta en marcha.'},
        {t:'Porque la plata tiene más resistencia de contacto y hace falta más corriente para que la caída sea medible por el MCU.',ok:false,why:'La plata es de los mejores conductores que hay y su resistencia de contacto limpio es de miliohmios. El problema no es el metal: es la película que se forma encima.'},
        {t:'Porque el pull-up interno del microcontrolador no puede entregar más de 0,25 mA y por eso hay que poner uno externo siempre.',ok:false,why:'El pull-up interno sí entrega esa corriente, y en muchas estaciones basta con ella. La corriente mínima la pide el CONTACTO, no el microcontrolador.'},
        {t:'Porque una corriente mínima por el contacto reduce el tiempo de rebote de las láminas.',ok:false,why:'El rebote es mecánico: depende de la masa, del muelle y del recorrido. La corriente no lo cambia. Lo que la corriente hace es atravesar la película que se forma sobre el metal.'},
      ],
    },
  };
  Object.values(QUIZ).forEach(q=>{for(let i=q.opciones.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const tmp=q.opciones[i];q.opciones[i]=q.opciones[j];q.opciones[j]=tmp;}});
}
function clearDx(){const box=el('dxbtns');if(box)box.innerHTML='';}
function refreshQuestion(){
  const q=QUIZ[mode];if(!q)return;
  el('q_text').innerHTML=q.pregunta;
  const box=el('dxbtns');
  box.innerHTML=q.opciones.map((o,i)=>`<button class="b sm" data-i="${i}">${String.fromCharCode(65+i)}) ${o.t}</button>`).join('');
  box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(parseInt(b.dataset.i,10)));
}
function answer(i){
  const q=QUIZ[mode];if(!q)return;
  const box=el('dxbtns'),btns=box.querySelectorAll('[data-i]');
  if(!btns.length||btns[0].disabled)return;
  const o=q.opciones[i];btns.forEach(b=>b.disabled=true);btns[i].classList.add(o.ok?'right':'wrong');
  if(o.ok){synth.beep(1046,0.12,0.06);}else{synth.beep(220,0.15,0.06);}
  showToast((o.ok?'✔ ':'✗ ')+o.why);
}

pickerFor(scene,S.camera,S.renderer.domElement,hit=>{
  if(!hit)return;
  if(hit.object===board){boardClick();return;}
  let o=hit.object;while(o){if(o.userData&&o.userData.title){showToast('<b>'+o.userData.title+'</b><br>'+(o.userData.info||''));return;}o=o.parent;}
});
(function hoverLoop(){
  const ray=new THREE.Raycaster(),dom=S.renderer.domElement;let mx=0,my=0;
  dom.addEventListener('pointermove',e=>{const r=dom.getBoundingClientRect();mx=((e.clientX-r.left)/r.width)*2-1;my=-((e.clientY-r.top)/r.height)*2+1;});
  function tick(){
    ray.setFromCamera({x:mx,y:my},S.camera);let hovered=false;
    for(const [obj,spr] of HOVER_LABELS){if(!obj.visible){spr.visible=false;continue;}const on=ray.intersectObject(obj,true).length>0;spr.visible=on;if(on)hovered=true;}
    dom.style.cursor=hovered?'pointer':'default';requestAnimationFrame(tick);
  }
  tick();
})();

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function runAuto(){
  if(autoRunning)return;autoRunning=true;
  const btn=el('btnAuto'),label=btn.textContent;btn.disabled=true;btn.classList.add('on');btn.textContent='⏳ Recorriendo…';
  try{
    synth.init();synth.resume();clearDx();
    setMode('explora');
    expIdx=0;expEnt='externo';expEv=2;afterEdit();
    showToast('🔧 Contador de piezas. La pulsación 11 lleva el peor tren posible: la ventana de rebote partida en dos mitades iguales.');
    await sleep(4200);
    expEnt='flotante';afterEdit();
    showToast('⚠ Sin resistencia de polarización el nodo no tiene nivel: aparecen transiciones que no ha hecho nadie y el programa cuenta eventos inventados.');
    await sleep(4600);
    expEnt='interno';afterEdit();
    showToast('🔌 El pull-up interno da nivel, pero con la bornera húmeda de 330 kΩ el reposo se queda en 4,34 V: por debajo del mínimo de diseño.');
    await sleep(4600);
    expEnt='externo';afterEdit();
    showToast('✔ Con 4,7 kΩ el reposo sube a 4,93 V y además el contacto de plata recibe 1,06 mA: la corriente que le hace falta para romper el óxido.');
    await sleep(4600);
    expEv=0;afterEdit();
    showToast('⏱ Esta es la maniobra más corta de la corrida: 1,6 ms de pulso. Ningún sondeo de 25 ms la va a ver.');
    await sleep(4400);
    expEv=2;afterEdit();
    answer(QUIZ[mode].opciones.findIndex(o=>o.ok));await sleep(2600);

    setMode('aplica');
    apTopic='acond';apIdx=2;apEnt='externo';afterEdit();
    showToast('🔋 Botón a pilas: 2700 mAh para un año son 0,308 mA. El pull-up externo de 4,7 kΩ se come 1,06 mA él solo.');
    await sleep(4600);
    apEnt='interno';afterEdit();
    showToast('✔ El pull-up interno consume 0,25 mA y cabe en el presupuesto. Aquí la resistencia grande gana, y en el contador de piezas perdía.');
    await sleep(4600);
    apTopic='filtro';apIdx=3;afterEdit();
    showToast('〰 Filtro RC con Schmitt: carga por 10 kΩ y descarga por 10 kΩ ‖ 1 kΩ. Por eso tarda 98 µs en bajar y 772 µs en subir.');
    await sleep(4800);
    showToast('🔎 Con 60 ms de rebote el filtro NO hace de antirrebote: τ es 1 ms. Está ahí por el ruido del variador y por el nivel, no por los rebotes.');
    await sleep(4800);
    apTopic='tiempo';apIdx=1;apT=1;afterEdit();
    showToast('⏱ Final de carrera: 14 ms de rebote. Con 5 ms el antirrebote confirma el falso reposo y cuenta de más.');
    await sleep(4600);
    apT=2;afterEdit();
    showToast('✔ Con 20 ms se supera el suelo de 7 ms y todavía se queda por debajo de los 45 ms del pulso más corto. Esa es la ventana.');
    await sleep(4600);
    apT=3;afterEdit();
    showToast('✗ Con 50 ms el antirrebote es más largo que la propia pulsación: ahora se traga las maniobras enteras. Más largo no es más seguro.');
    await sleep(4800);
    apTopic='estrategia';apIdx=0;apA=2;afterEdit();
    showToast('🎛 Interrupción sin antirrebote: no pierde nada y por eso mismo entra a la ISR 128 veces para 24 maniobras.');
    await sleep(4800);
    apA=3;afterEdit();
    showToast('✔ La misma interrupción con bloqueo de rearme: 24 entradas para 24 maniobras y 10 µs de latencia.');
    await sleep(4400);
    apT=TESTS.indexOf(goodTest(POOL[apIdx]));afterEdit();
    answer(QUIZ[mode].opciones.findIndex(o=>o.ok));await sleep(2600);

    setMode('reto');
    seedReto(0);updateRetoSpec();afterEdit();
    showToast('🎯 Reto: la configuración de partida está mal en las tres decisiones. Lo comprobamos tal cual…');
    await sleep(3800);
    checkReto();
    await sleep(4400);
    const sc=retoSc();
    retoCh={ent:goodEnt(sc),tEst:goodTest(sc),adq:goodAdq(sc)};
    retoChecked=false;retoSolved=false;solved=false;afterEdit();
    showToast('✔ Pull-up que da nivel y humectación, antirrebote por encima de la mitad del rebote y por debajo del hueco, y la estrategia que cabe en los recursos del nodo.');
    await sleep(4000);
    checkReto();await sleep(2600);
    answer(QUIZ[mode].opciones.findIndex(o=>o.ok));
  }finally{
    btn.disabled=false;btn.classList.remove('on');btn.textContent=label;autoRunning=false;
  }
}

buildQuiz();
S.start();
setMode('explora');

  iQuiesc,zNoise,iAcOf,vLeak,vAc,vDrop,vRest,tDelayEnt,diasPila,

  rcFilter,rcTrace,integrador,lockout,attribute,signalFor,runSim,runC,score,
  guardEnt,guardAdq,cfgOk,cfgWith,okEnt,okTest,okAdq,goodEnt,goodTest,goodAdq,GOOD,
  // adaptadores
  evRun,winFor,winOf,whyEnt,whyTest,whyAdq,
  // explora
  expIdx:()=>expIdx, setExpIdx:i=>{expIdx=i;expEnt=goodEnt(POOL[i]);expEv=2;afterEdit();},
  expEnt:()=>expEnt, setExpEnt:k=>{expEnt=k;afterEdit();},
  expEv:()=>expEv, setExpEv:i=>{expEv=i;afterEdit();},
  expInfo:()=>{const sc=expSc(),e=ENT[expEnt];return {idx:expIdx,ent:expEnt,ev:expEv,
    iQ:iQuiesc(e),z:zNoise(e),vRest:vRest(sc,e),ok:okEnt(sc,expEnt)};},
  // aplica
  apTopic:()=>apTopic, setApTopic:k=>{apTopic=k;afterEdit();},
  apIdx:()=>apIdx, setApIdx:i=>{apIdx=i;apEnt=goodEnt(POOL[i]);apT=TESTS.indexOf(goodTest(POOL[i]));apA=ADQS.findIndex(a=>a.k===goodAdq(POOL[i]));afterEdit();},
  apEnt:()=>apEnt, setApEnt:k=>{apEnt=k;afterEdit();},
  apT:()=>apT, setApT:i=>{apT=i;afterEdit();},
  apA:()=>apA, setApA:i=>{apA=i;afterEdit();},
  apRun:()=>runC(POOL[apIdx],apCfg()),
  // reto
  retoK:()=>retoK, seedReto:k=>{seedReto(k);updateRetoSpec();afterEdit();},
  retoName:()=>retoSc().name, retoCfg:()=>retoCfg(),
  retoGet:()=>({ent:retoCh.ent,tEst:retoCh.tEst,adq:retoCh.adq}),
  retoSet:(f,v)=>{retoSet(f,v);afterEdit();},
  retoSolveBuild:()=>{const sc=retoSc();retoCh={ent:goodEnt(sc),tEst:goodTest(sc),adq:goodAdq(sc)};
    retoChecked=false;retoSolved=false;solved=false;afterEdit();},
  checkReto:()=>checkReto(),
  retoChecked:()=>retoChecked, retoOkEnt:()=>retoOkEnt, retoOkTest:()=>retoOkTest, retoOkAdq:()=>retoOkAdq, retoSolved:()=>retoSolved,
  // quiz / general
  quizCorrectIndex:()=>{const q=QUIZ[mode];return q?q.opciones.findIndex(o=>o.ok):-1;},
  quizAnswer:i=>answer(i),
  frames:()=>frames(),
  newSignal:()=>newSignal(),
  solved:()=>solved,
};
