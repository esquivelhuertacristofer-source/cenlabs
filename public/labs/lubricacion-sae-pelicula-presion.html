<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.26, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);

    if(camCine.active){

function pickerFor(scene,camera,dom,onHit){

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

const DEG = Math.PI / 180;

// ============================================================================
//  1 · VISCOSIDAD CONTRA TEMPERATURA — ASTM D341 (ecuacion de Walther)
//
//      log10(log10(nu + 0.7)) = A - B * log10(T)
//
//  con nu en mm2/s (cSt) y T en KELVIN. Dos puntos de la ficha del aceite
//  —40 y 100 C, que son los que publica todo fabricante— determinan A y B sin
//  ningun ajuste libre. B es la PENDIENTE: un aceite de indice de viscosidad
//  alto tiene la recta mas tumbada, y eso es exactamente lo que significa el IV.
// ============================================================================
const K = c => c + 273.15;
const ll = nu => Math.log10(Math.log10(nu + 0.7));

/** Coeficientes de Walther a partir de las dos viscosidades de catalogo. */
function walther(kv40, kv100) {
  const x1 = Math.log10(K(40)), x2 = Math.log10(K(100));
  const y1 = ll(kv40), y2 = ll(kv100);
  const B = (y1 - y2) / (x2 - x1);          // positiva: la viscosidad baja al calentar
  const A = y1 + B * x1;
  return { A, B };
}
/**
 * Viscosidad cinematica [mm2/s] a T [C].
 *
 * ATENCION — LA RECTA DE WALTHER NO SE EXTRAPOLA AL FRIO. D341 vale mientras el
 * aceite se comporta como un fluido newtoniano, es decir por encima del punto de
 * niebla. Por debajo, las parafinas empiezan a cristalizar y la viscosidad real
 * se dispara muy por encima de la recta; ademas el mejorador del indice de
 * viscosidad de un multigrado deja de aportar. Extrapolar a -30 C da un numero
 * que no cumpliria su propio grado SAE, y ese es un error clasico.
 *
 * Aqui se hace lo que hace un formulador: el tramo frio se ANCLA en un punto
 * MEDIDO, el del ensayo CCS de la norma, y se traza un segundo tramo de Walther
 * entre 0 C y ese punto. Por encima de 0 C manda la recta de catalogo.
 */
function nuT(T, oil) {
  const rec = (A, B) => Math.pow(10, Math.pow(10, A - B * Math.log10(K(T)))) - 0.7;
  if (T >= 0 || !oil.wFrio) return rec(oil.w.A, oil.w.B);
  return rec(oil.wFrio.A, oil.wFrio.B);
}
/** Densidad [kg/m3] a T [C]. Coeficiente de dilatacion tipico de un base mineral. */
function rhoT(T, oil) { return oil.rho15 * (1 - 0.00065 * (T - 15)); }
/** Viscosidad dinamica [Pa s] a T [C].  eta = nu * rho, con nu en m2/s. */
function etaT(T, oil) { return nuT(T, oil) * 1e-6 * rhoT(T, oil); }

// ============================================================================
//  2 · LOS ACEITES — SAE J300
//
//  `wGrado` es el numero de invierno y `vGrado` el de verano. Los limites que
//  se comprueban son los de la norma:
//    · arranque en frio (CCS) : viscosidad dinamica maxima, en mPa s, a la
//      temperatura que la norma asigna a cada grado W.
//    · bombeabilidad (MRV)    : maxima a 10 C por debajo de la del CCS.
//    · KV100                  : banda del grado de verano, en mm2/s.
//    · HTHS                   : minimo a 150 C y 10^6 1/s, en mPa s. Es el
//      numero que de verdad manda en el desgaste, y NO se deduce del grado.
// ============================================================================
/** Temperatura [C] a la que J300 mide el CCS de cada grado W, y su maximo [mPa s]. */
const J300_W = {
  0:  { tCCS: -35, ccsMax: 6200, tMRV: -40, mrvMax: 60000 },
  5:  { tCCS: -30, ccsMax: 6600, tMRV: -35, mrvMax: 60000 },
  10: { tCCS: -25, ccsMax: 7000, tMRV: -30, mrvMax: 60000 },
  15: { tCCS: -20, ccsMax: 7000, tMRV: -25, mrvMax: 60000 },
  20: { tCCS: -15, ccsMax: 9500, tMRV: -20, mrvMax: 60000 },

/** Banda de KV100 [mm2/s] de cada grado de verano, y HTHS minima [mPa s]. */
const J300_V = {
  20: { kvMin: 6.9,  kvMax: 9.29,  hthsMin: 2.6 },
  30: { kvMin: 9.3,  kvMax: 12.49, hthsMin: 2.9 },
  40: { kvMin: 12.5, kvMax: 16.29, hthsMin: 3.5 },   // 40 de grados 0W/5W/10W
  50: { kvMin: 16.3, kvMax: 21.89, hthsMin: 3.7 },
  60: { kvMin: 21.9, kvMax: 26.09, hthsMin: 3.7 },

function mkOil(o) {
  o.w = walther(o.kv40, o.kv100);

  // ensayo de arranque en frio, que el fabricante publica en mPa s y aqui se
  // pasa a cinematica con la densidad a esa temperatura.
  const nu0 = Math.pow(10, Math.pow(10, o.w.A - o.w.B * Math.log10(K(0)))) - 0.7;
  const rhoF = o.rho15 * (1 - 0.00065 * (o.tFrio - 15));
  const nuF = o.ccs / rhoF * 1000;                     // mPa s -> mm2/s
  const x1 = Math.log10(K(0)), x2 = Math.log10(K(o.tFrio));
  const y1 = ll(nu0), y2 = ll(nuF);
  const B = (y1 - y2) / (x2 - x1);
  o.wFrio = { A: y1 + B * x1, B };
  return o;
}

/** Viscosidad dinamica [mPa s] usada por los ensayos de arranque en frio. */
const etaMPas = (T, oil) => etaT(T, oil) * 1000;

/**
 * Verificacion contra J300. Devuelve, para cada criterio, el valor medido, el
 * limite y si cumple. Un monogrado NO tiene grado W y por eso su casilla de
 * arranque en frio se declara `null` en vez de inventarle un limite.
 */
function cumpleJ300(oil) {
  const v = J300_V[oil.vGrado];
  const out = {
    kv100: { val: oil.kv100, min: v.kvMin, max: v.kvMax,
      ok: oil.kv100 >= v.kvMin && oil.kv100 <= v.kvMax },
    hths: { val: oil.hths, min: v.hthsMin, ok: oil.hths >= v.hthsMin },
  };
  if (oil.wGrado === null) { out.ccs = null; out.mrv = null; return out; }
  const w = J300_W[oil.wGrado];
  // El CCS es un DATO MEDIDO de la ficha del aceite, no una extrapolacion de la
  // recta de Walther: por eso el modelo lo usa como ancla y no como resultado.
  out.ccs = { T: w.tCCS, val: oil.ccs, max: w.ccsMax, ok: oil.ccs <= w.ccsMax };
  out.mrv = { T: w.tMRV, val: oil.mrv, max: w.mrvMax, ok: oil.mrv !== null && oil.mrv <= w.mrvMax };
  return out;
}

// ============================================================================
//  3 · EL COJINETE DE BANCADA — solucion de cojinete corto (Ocvirk)
//
//  Para L/D <= 0.5 la componente circunferencial del flujo es despreciable
//  frente a la axial y la ecuacion de Reynolds tiene solucion cerrada. La
//  capacidad de carga vale
//
//     W = (mu * omega * L^3 * R / c^2) * eps/(2 (1-eps^2)^2)
//                                     * sqrt(pi^2 (1-eps^2) + 16 eps^2)
//
//  y es MONOTONA creciente en eps sobre [0,1), asi que dada la carga se
//  resuelve la excentricidad por biseccion y no hay ambiguedad.
//
//     h_min = c (1 - eps)
// ============================================================================
/** Capacidad de carga [N] de un cojinete corto con excentricidad relativa eps. */
function cargaOcvirk(eps, mu, omega, L, R, c) {
  const e2 = eps * eps;
  return (mu * omega * Math.pow(L, 3) * R / (c * c)) *
    (eps / (2 * Math.pow(1 - e2, 2))) * Math.sqrt(Math.PI * Math.PI * (1 - e2) + 16 * e2);
}
/**
 * Excentricidad relativa que equilibra una carga W. Biseccion sobre [0, 1).
 *
 * La capacidad de carga DIVERGE al acercarse eps a 1, asi que para cualquier
 * carga finita existe solucion y el resultado es siempre menor que 1: el
 * `return 1` es una red de seguridad para entradas degeneradas (viscosidad o
 * velocidad nulas), no un caso fisico. Quien quiera saber si hay contacto tiene
 * que mirar lambda, no eps.
 */
function excentricidad(W, mu, omega, L, R, c) {
  if (!(W > 0) || !(mu > 0) || !(omega > 0)) return 0;
  let lo = 1e-9, hi = 1 - 1e-9;
  if (cargaOcvirk(hi, mu, omega, L, R, c) < W) return 1;
  for (let i = 0; i < 120; i++) {
    const m = 0.5 * (lo + hi);
    if (cargaOcvirk(m, mu, omega, L, R, c) < W) lo = m; else hi = m;
  }
  return 0.5 * (lo + hi);
}
/** Espesor minimo de pelicula [m]. */
const hMin = (eps, c) => c * (1 - eps);
/**
 * Espesor especifico de pelicula. Es h_min medido en rugosidades: lambda < 1 es
 * regimen limite (contacto metal-metal), 1..3 mixto y >= 3 hidrodinamico pleno.
 * Divide por la rugosidad COMPUESTA de las dos superficies, no por una sola.
 */
const lambdaFilm = (h, rqA, rqB) => h / Math.sqrt(rqA * rqA + rqB * rqB);
const REGIMEN = l => l < 1 ? 'limite' : (l < 3 ? 'mixto' : 'hidrodinamico');

/**
 * Par de friccion [N m] de un cojinete. Petroff con correccion de excentricidad:
 * el termino viscoso domina y crece al acercarse el eje a la superficie.
 * NO incluye el termino de carga (el desplazamiento del punto de presion
 * maxima), que a excentricidades moderadas aporta menos del 10 %: esta
 * declarado en el contrato de fidelidad.
 */
function parFriccion(mu, omega, R, L, c, eps) {
  return 2 * Math.PI * mu * omega * Math.pow(R, 3) * L / (c * Math.sqrt(Math.max(1 - eps * eps, 1e-9)));
}

/**
 * Caudal de fuga axial de un cojinete alimentado por ranura circunferencial,
 * con la presion de galeria p [Pa]:
 *
 *     Q = (pi R c^3 p / (3 mu L)) * (1 + 1.5 eps^2)
 *
 * La ley del CUBO de la holgura es la que hace que un cojinete gastado se lleve
 * el aceite de todo el motor y hunda la presion.
 */
function caudalCojinete(p, mu, R, c, L, eps) {
  return (Math.PI * R * Math.pow(c, 3) * p / (3 * mu * L)) * (1 + 1.5 * eps * eps);
}

// ============================================================================
//  4 · LA CARGA DEL COJINETE
//
//  Se compone de la fuerza de gas en el pico de combustion y de la inercia
//  alternativa, que se restan porque actuan en sentidos contrarios en el PMS.
//  El analisis del cojinete se hace en REGIMEN ESTACIONARIO con la carga de
//  pico, que es el caso de diseño clasico de los abacos de Raimondi y Boyd.
//  Un cojinete real trabaja bajo carga variable y el efecto de pelicula
//  exprimida (squeeze film) le levanta h_min por encima de este valor: el
//  modelo es CONSERVADOR, y esta declarado.
// ============================================================================
/**
 * Fuerza maxima sobre el muñon [N] a un regimen y una carga del motor (0..1).
 *
 * La presion de pico NO es la de plena carga siempre. Sin carga, el pico del
 * cilindro es el de COMPRESION —la misma cifra que mide la practica de sellado
 * de este dominio, `pComp`— y solo al pedir par sube hasta el pico de combustion.
 * Por eso el cojinete de un motor a ralenti va comodo aunque la presion de
 * aceite sea baja, y el punto critico esta a regimen bajo con el pie a fondo.
 */
function cargaBancada(e, rpm, carga = 0) {
  const Ap = Math.PI * Math.pow(e.B / 1000, 2) / 4;        // m2
  const c = Math.max(0, Math.min(1, carga));
  const pPico = e.pComp + c * (e.pMax - e.pComp);          // bar absolutos
  const Fgas = pPico * 1e5 * Ap;                           // N
  const om = rpm * 2 * Math.PI / 60;
  const r = e.S / 2000;                                    // m
  const lam = r / (e.Lb / 1000);
  const Fin = e.mRecip * om * om * r * (1 + lam);          // N, en el PMS
  // En el PMS de combustion la inercia tira del piston hacia arriba y DESCARGA
  // el cojinete: por eso un motor a rpm altas no carga tanto el cojinete como
  // se cree, y el punto critico esta a regimen bajo con plena carga.
  // `fReparto` es la fraccion de esa fuerza que llega a UN cojinete de bancada:
  // cada bancada reparte con la de al lado la carga de los cilindros vecinos.
  return e.fReparto * Math.max(0.15 * Fgas, Fgas - Fin);
}
/**
 * Carga de DISEÑO para el analisis estacionario del cojinete.
 *
 * En un cuatro tiempos la fuerza de gas actua durante una fraccion pequeña de
 * los 720 grados; el resto del ciclo el cojinete va casi descargado. Meter el
 * PICO como carga estacionaria ignora el efecto de pelicula exprimida —el
 * aceite no tiene tiempo de salir mientras dura el pico— y da un h_min muy por
 * debajo del real. La practica de diseño con los abacos de cojinete corto usa
 * la carga MEDIA EQUIVALENTE del ciclo, del orden de un tercio del pico.
 * `F_MEDIA` es ese factor, y esta declarado en el contrato de fidelidad.
 */
const F_MEDIA = 0.34;
const cargaDiseno = (e, rpm, carga) => F_MEDIA * cargaBancada(e, rpm, carga);
/** Presion especifica del cojinete [MPa] = carga / area proyectada. */
const presionEsp = (W, e) => W / ((e.dMuñ / 1000) * (e.lCoj / 1000)) / 1e6;

// ============================================================================
//  5 · EL CIRCUITO — bomba, limitadora y galeria
//
//  La bomba es volumetrica: entrega D * n menos lo que se le escapa por los
//  huelgos, que crece con la presion y baja con la viscosidad. Los cojinetes
//  son la fuga util. La galeria se equilibra donde el caudal que entra iguala
//  al que sale, y la limitadora recorta por arriba.
// ============================================================================
/** Caudal de la bomba [m3/s] a la presion p [Pa] con viscosidad mu [Pa s]. */
function caudalBomba(e, rpm, mu, p, kDesl) {
  const n = rpm * e.relBomba / 60;                          // rev/s de la bomba
  const teo = e.despBomba * 1e-6 * n;                       // m3/s
  const desl = (kDesl ?? e.kDesl) * p / mu;                 // m3/s de resbalamiento
  return Math.max(0, teo - desl);
}
/** Suma del caudal que se van los cojinetes a la presion p. */
function caudalCircuito(e, mu, p, hol, epsPorCoj, kAux) {
  const R = e.dMuñ / 2000, L = e.lCoj / 1000;
  let q = 0;
  for (let i = 0; i < e.nCoj; i++) q += caudalCojinete(p, mu, R, hol[i], L, epsPorCoj[i]);
  // Surtidores de refrigeracion del piston y arbol de levas: restricciones fijas
  // que en un motor real se llevan una parte nada despreciable del caudal.
  q += (kAux ?? e.kAux) * p / mu;
  return q;
}

// ============================================================================
//  6 · AVERIAS Y ESCENARIOS
//
//  Cada averia se declara por lo que CAMBIA fisicamente, no por el sintoma:
//  holgura de un cojinete, holgura de todos, desgaste de la bomba, limitadora
//  agarrotada, filtro obstruido (abre su derivacion), aceite diluido o el
//  nivel bajo. El sintoma sale del modelo.
// ============================================================================
const FALLAS = {
  sano: { rot: 'Sin avería', nota: 'La holgura está en el nominal del fabricante y la bomba entrega lo suyo.' },
  cojGastado: { rot: 'Un cojinete de bancada gastado', holUno: 2.2,
    nota: 'La holgura al cubo: ese cojinete se bebe el aceite de todos los demás.' },
  cojTodos: { rot: 'Motor de muchos kilómetros, holguras al límite', holTodos: 1.7, kAuxMul: 2.4,
    nota: 'No son sólo las bancadas: en un motor gastado también lo están las bielas, los apoyos del árbol y los tensores. Por eso ÉSTE sí hunde la presión y un solo cojinete gastado no.' },
  bombaGastada: { rot: 'Bomba de aceite desgastada', kDeslMul: 4.5,
    nota: 'Se le escapa el aceite por los huelgos internos. Se nota más en caliente y a ralentí.' },
  limitadoraAbierta: { rot: 'Válvula limitadora agarrotada abierta', relMul: 0.42,
    nota: 'Recorta la presión mucho antes de lo debido. La galería nunca sube.' },
  limitadoraCerrada: { rot: 'Válvula limitadora agarrotada cerrada', relMul: Infinity,
    nota: 'No recorta NADA: la presión es la que da el balance del circuito, y en frío eso revienta el filtro o su junta. La limitadora no protege al motor: protege al circuito.' },
  filtroSucio: { rot: 'Filtro obstruido, derivación abierta', filtro: true,
    nota: 'Sigue llegando aceite, pero SIN FILTRAR. El manómetro no se entera de nada.' },
  aceiteDiluido: { rot: 'Aceite diluido con combustible', diluc: 0.55,
    nota: 'Baja la viscosidad como si el aceite fuera dos grados más fino. Es una avería de inyección vista desde el aceite.' },
  aceiteEnvejecido: { rot: 'Aceite pasado de intervalo, gelificado en frío', gelDelta: 26, viscMul: 1.35,
    nota: 'Gelifica MUCHO antes de lo que le tocaría. Pasa el ensayo de arranque y falla el de bombeo: el motor gira y no le llega aceite.' },
  antidrenaje: { rot: 'Antirretorno del filtro estropeado', drenMul: 5.0,
    nota: 'El circuito se vacía al cárter con el motor parado. En marcha no se nota NADA: sólo se paga en cada arranque.' },
  nivelBajo: { rot: 'Nivel de aceite bajo', aire: 0.30,
    nota: 'La bomba aspira aire a ratos: el caudal cae y la presión oscila.' },
};
const FALLA_KEYS = Object.keys(FALLAS);

/** Estado fisico del circuito con una averia montada. */
function fisicaDe(e, falla, oil, T) {
  const f = FALLAS[falla] || FALLAS.sano;
  const hol = [];
  for (let i = 0; i < e.nCoj; i++) {
    let h = e.holgura;                                   // m
    if (f.holTodos) h *= f.holTodos;
    if (f.holUno && i === e.cojMalo) h *= f.holUno;
    hol.push(h);
  }
  // Un solo factor para lo que la averia le hace a la viscosidad, y se devuelve
  // para que TODO el que la necesite use el mismo: dejarlo solo en `mu` hacia
  // que el analisis de aceite informara de la viscosidad del bidon, no de la
  // del carter, y con eso dos averias distintas caian en la misma firma.
  const viscMul = (f.diluc || 1) * (f.viscMul || 1);
  const mu = etaT(T, oil) * viscMul;
  return {
    hol, mu, viscMul,
    kDesl: e.kDesl * (f.kDeslMul || 1) * (f.aire ? 1 / (1 - f.aire) : 1),
    kAux: e.kAux * (f.kAuxMul || 1),
    pRel: e.pRel * (f.relMul || 1),
    filtrado: !f.filtro,
  };
}

/**
 * Estado completo del motor a un regimen, una temperatura, un aceite y una
 * averia. Resuelve el circuito y el cojinete a la vez, porque se necesitan
 * mutuamente: la excentricidad cambia el caudal y el caudal no cambia la
 * excentricidad —la carga la fija el ciclo, no la presion de alimentacion—,
 * asi que el orden correcto es cojinete primero y circuito despues.
 */
function estado(e, o = {}) {
  const oil = ACEITES[o.aceite ?? 'a5w30'];
  const T = o.T ?? 100, rpm = o.rpm ?? 2000, falla = o.falla ?? 'sano';
  const carga = o.carga ?? 0;
  const F = fisicaDe(e, falla, oil, T);
  const om = rpm * 2 * Math.PI / 60;
  const R = e.dMuñ / 2000, L = e.lCoj / 1000;
  const Wpico = cargaBancada(e, rpm, carga);
  const W = F_MEDIA * Wpico;

  // --- cojinetes: uno por uno, porque pueden tener holguras distintas -------
  const cojinetes = F.hol.map((c, i) => {
    const eps = excentricidad(W, F.mu, om, L, R, c);
    const h = hMin(eps, c);
    const lam = lambdaFilm(h, e.rqMuñ * 1e-6, e.rqCoj * 1e-6);
    // La solucion de cojinete corto se ajusta bien a la numerica hasta eps ~ 0,9.
    // Por encima, la cifra sigue siendo del lado conservador pero ya extrapola:
    // se marca en vez de callarlo.
    return { i, c, eps, h, lam, regimen: REGIMEN(lam), extrapola: eps > 0.90,
      par: parFriccion(F.mu, om, R, L, c, eps) };
  });
  const peor = cojinetes.reduce((a, b) => a.lam <= b.lam ? a : b);

  // --- circuito: biseccion sobre la presion de galeria ----------------------
  const eps = cojinetes.map(c => c.eps);
  const bal = p => caudalBomba(e, rpm, F.mu, p, F.kDesl) - caudalCircuito(e, F.mu, p, F.hol, eps, F.kAux);
  let lo = 0, hi = 80e5;
  if (bal(hi) > 0) lo = hi; else {
    for (let i = 0; i < 120; i++) { const m = 0.5 * (lo + hi); if (bal(m) > 0) lo = m; else hi = m; }
  }
  let p = 0.5 * (lo + hi);
  const pSinLim = p;
  // Una limitadora agarrotada cerrada tiene tarado infinito: no recorta, y la
  // presion es la que salga del balance. No se le pone un tarado alto a mano.
  const abreLim = isFinite(F.pRel) && p > F.pRel;
  if (abreLim) p = F.pRel;
  const saturado = !abreLim && p > 79e5;
  const Q = caudalCircuito(e, F.mu, p, F.hol, eps, F.kAux);

  const parTot = cojinetes.reduce((s, c) => s + c.par, 0);
  return {
    oil, T, rpm, carga, falla, mu: F.mu, nu: nuT(T, oil) * F.viscMul, viscMul: F.viscMul,
    W, Wpico, pEsp: presionEsp(Wpico, e), pEspDis: presionEsp(W, e),
    cojinetes, peor, extrapola: cojinetes.some(c => c.extrapola),
    p: p / 1e5, pSinLim: pSinLim / 1e5, pRel: F.pRel / 1e5, abreLim, saturado,
    Q: Q * 6e4,                       // L/min
    filtrado: F.filtrado,
    par: parTot, potFric: parTot * om,
    alarma: p / 1e5 < e.pAlarma,
    // Una limitadora que no abre no rompe el motor: rompe el ELEMENTO MAS DEBIL
    // del circuito, que es la carcasa del filtro o su junta. El modelo lo dice
    // en vez de publicar una presion enorme como si no pasara nada.
    revientaFiltro: p / 1e5 > e.pMaxFiltro,
  };
}

// ============================================================================
//  6 bis · EL ARRANQUE EN FRIO — donde de verdad se gasta el motor
//
//  En regimen estacionario un motor sano va sobrado de pelicula. El desgaste
//  vive en los primeros segundos: mientras la galeria se llena, el cojinete
//  trabaja con el aceite RESIDUAL, en regimen limite, y ahi si hay contacto.
//  Los dos limites de invierno de J300 existen exactamente por esto:
//    · CCS  garantiza que el motor de arranque pueda GIRARLO.
//    · MRV  garantiza que la bomba pueda ASPIRARLO. Si falla el MRV la bomba
//           se queda con una burbuja y el motor gira SIN aceite: es la averia
//           mas cara que existe, y el manometro tarda en enterarse.
// ============================================================================
/** Par resistente del motor al arrancar [N m]: arrastre viscoso + compresion. */
function parArrastre(e, oil, T, rpm) {
  const mu = etaT(T, oil), om = rpm * 2 * Math.PI / 60;
  const R = e.dMuñ / 2000, L = e.lCoj / 1000;
  let par = 0;
  for (let i = 0; i < e.nCoj; i++) par += parFriccion(mu, om, R, L, e.holgura, 0.6);
  // El resto del motor —faldas de piston, arboles, bomba— arrastra del orden de
  // tres veces lo que arrastran las bancadas, y ademas hay que comprimir.
  return par * 4.0 + e.parComp;
}
/**
 * Regimen de arranque real [rpm]. El motor de arranque tiene curva par-velocidad
 * lineal: da `parCal` parado y se queda a `nVacio` sin carga. Se cruza con el par
 * resistente, que crece con la viscosidad. Por eso el mismo motor gira a 250 rpm
 * en verano y a 90 en una helada con el aceite equivocado.
 */
function regimenArranque(e, oil, T) {
  const resist = n => parArrastre(e, oil, T, Math.max(n, 1));
  const motor = n => e.parCal * (1 - n / e.nVacio);
  if (motor(1) < resist(1)) return 0;                   // ni se mueve
  let lo = 1, hi = e.nVacio;
  for (let i = 0; i < 90; i++) {
    const m = 0.5 * (lo + hi);
    if (motor(m) > resist(m)) lo = m; else hi = m;
  }
  return 0.5 * (lo + hi);
}
/**
 * Diagnostico completo del arranque. `bombea` compara la viscosidad dinamica
 * con el umbral de bombeabilidad del circuito: por encima, la bomba aspira aire
 * en vez de aceite y no ceba, por muy bien que gire el motor.
 */
function arranque(e, o = {}) {
  const oil = ACEITES[o.aceite ?? e.aceiteOEM], T = o.T ?? -20;
  const f = FALLAS[o.falla ?? 'sano'] || FALLAS.sano;
  if (f.drenMul && o.drenMul === undefined) o = Object.assign({}, o, { drenMul: f.drenMul });
  const eta = etaMPas(T, oil) * (f.viscMul || 1);
  const n = regimenArranque(e, oil, T) / (f.viscMul || 1) ** 0.35;
  const arranca = n >= e.nMinArr;
  // Bombeabilidad: NO se deduce de la viscosidad de cizalla alta. Un aceite
  // puede pasar el CCS —que se mide a cizalla alta, como el motor de arranque—
  // y GELIFICAR a cizalla baja, que es lo que ve la aspiracion de la bomba. Por
  // eso J300 pide DOS ensayos de invierno y no uno. `tGel` es un dato declarado
  // de cada aceite, no una consecuencia de su viscosidad.
  const tGel = oil.tGel + (f.gelDelta || 0);
  const bombea = T > tGel && eta <= e.mrvLim;
  // Cebado: el tiempo que tarda la bomba en llenar el circuito girando a n.
  // Mientras la galeria se llena NO hay contrapresion, asi que la bomba entrega
  // su caudal teorico: evaluarla a la presion de tarado subestima el cebado.
  const mu = etaT(T, oil);
  const q = arranca ? caudalBomba(e, n, mu, 0, e.kDesl * (f.kDeslMul || 1)) : 0;
  // Y no hay que llenar el circuito entero: entre dos arranques solo se escurre
  // al carter lo que hay por encima de la valvula antirretorno del filtro. Si
  // esa valvula falla, se vacia mucho mas y el motor gira mas vueltas en seco.
  const vDren = e.volDren * (o.drenMul ?? 1);
  const tCeb = (arranca && bombea && q > 0) ? (vDren * 1e-6) / q : Infinity;
  // Mientras no hay presion, el cojinete va en regimen LIMITE. El desgaste de
  // un arranque se mide en vueltas dadas en seco, que es lo que de verdad
  // cuenta: girar mas despacio no ayuda tanto como cebar antes.
  const vueltasSeco = isFinite(tCeb) ? n / 60 * tCeb : Infinity;
  return { oil, T, eta, n, arranca, bombea, tCeb, vueltasSeco,
    limCCS: oil.wGrado === null ? null : J300_W[oil.wGrado].ccsMax,
    veredicto: !arranca ? 'el motor de arranque no lo gira'
      : (!bombea ? 'gira, pero la bomba no ceba: gira EN SECO'
        : (vueltasSeco > e.vueltasMax ? 'ceba tarde: demasiadas vueltas en seco' : 'arranque correcto')) };
}

// ============================================================================
//  7 · ESCENARIOS Y CENSO
// ============================================================================
const ESCEN = {
  sano:      { rot: 'Motor sano', falla: 'sano', clave: 'nada que reparar' },
  coj1:      { rot: 'Un cojinete de bancada gastado', falla: 'cojGastado', clave: 'holgura de cojinete' },
  cojN:      { rot: 'Todos los cojinetes al límite', falla: 'cojTodos', clave: 'holgura de cojinete' },
  bomba:     { rot: 'Bomba de aceite desgastada', falla: 'bombaGastada', clave: 'bomba' },
  limAb:     { rot: 'Limitadora agarrotada abierta', falla: 'limitadoraAbierta', clave: 'limitadora' },
  limCer:    { rot: 'Limitadora agarrotada cerrada', falla: 'limitadoraCerrada', clave: 'limitadora' },
  filtro:    { rot: 'Filtro obstruido, derivacion abierta', falla: 'filtroSucio', clave: 'filtro' },
  diluido:   { rot: 'Aceite diluido con combustible', falla: 'aceiteDiluido', clave: 'aceite equivocado o degradado' },
  nivel:     { rot: 'Nivel de aceite bajo', falla: 'nivelBajo', clave: 'nivel' },
  antidren:  { rot: 'Antirretorno del filtro estropeado', falla: 'antidrenaje', clave: 'antirretorno del filtro' },
  envejecido:{ rot: 'Aceite pasado de intervalo', falla: 'aceiteEnvejecido', clave: 'aceite equivocado o degradado' },
  finoFrio:  { rot: 'Aceite demasiado fino para el motor', falla: 'sano', aceite: 'a0w20', clave: 'aceite equivocado o degradado' },
  gruesoFrio:{ rot: 'Aceite demasiado grueso para el clima', falla: 'sano', aceite: 'a20w50', clave: 'aceite equivocado o degradado' },
};
const ESCEN_KEYS = Object.keys(ESCEN);

/** Lecturas del escenario en los tres puntos de trabajo del protocolo. */
const PUNTOS = [
  { k: 'frioRal', rot: 'frío, ralentí', T: 20, ral: true },
  { k: 'calRal',  rot: 'caliente, ralentí', T: 110, ral: true },
  { k: 'calAlto', rot: 'caliente, 3 000 rpm', T: 110, rpm: 3000 },
];
function lecturas(e, esc, o = {}) {
  const E = ESCEN[esc] || ESCEN.sano;
  const aceite = E.aceite || o.aceite || 'a5w30';
  const pts = PUNTOS.map(P => {
    const rpm = P.ral ? e.ralenti : P.rpm;
    const s = estado(e, { aceite, T: P.T, rpm, falla: E.falla });
    return { k: P.k, rot: P.rot, T: P.T, rpm, p: s.p, lam: s.peor.lam,
      regimen: s.peor.regimen, Q: s.Q, abreLim: s.abreLim, alarma: s.alarma,
      filtrado: s.filtrado, revienta: s.revientaFiltro };
  });
  const by = k => pts.find(p => p.k === k);
  const arr = arranque(e, { aceite, T: o.Tarr ?? 20, falla: E.falla });
  return {
    esc, rot: E.rot, clave: E.clave, aceite, pts, arr,
    // Las cuatro observaciones que un taller puede tomar de verdad:
    pFrio: by('frioRal').p, pCalRal: by('calRal').p, pCalAlto: by('calAlto').p,
    // y la que NO se puede tomar sin abrir el motor, que es la que protege
    lamPeor: Math.min(...pts.map(p => p.lam)),
    alarmaEn: pts.filter(p => p.alarma).map(p => p.k),
    revientaEn: pts.filter(p => p.revienta).map(p => p.k),
    sinFiltrar: pts.some(p => !p.filtrado),
  };
}

/**
 * Seis observaciones. Las tres primeras son lo que da un manometro; la cuarta,
 * lo que dice la luz roja; la quinta exige un analisis de aceite y la sexta,
 * abrir el motor y medir con plastigage. El censo demuestra cuales hacen falta.
 */
const OBS = [
  { k: 'pFrio',    rot: 'Presión en frío a ralentí', res: 0.25, uni: 'bar', taller: true },
  { k: 'pCalRal',  rot: 'Presión en caliente a ralentí', res: 0.25, uni: 'bar', taller: true },
  { k: 'pCalAlto', rot: 'Presión en caliente a 3 000 rpm', res: 0.25, uni: 'bar', taller: true },
  { k: 'luz',      rot: 'Se enciende la luz de presión', res: null, uni: '', taller: true },
  { k: 'vueltas',  rot: 'Vueltas en seco al arrancar (lo que tarda en apagarse la luz)', res: 0.5, uni: 'vueltas', taller: true },
  { k: 'visc',     rot: 'Análisis de aceite: viscosidad y contaminación', res: 1.0, uni: 'mm²/s', taller: false },
  { k: 'holgura',  rot: 'Holgura medida con plastigage', res: 0.005, uni: 'mm', taller: false },
];
const cuant = (x, r) => Math.round(x / r) * r;

function firmaObs(e, L, sub) {
  return sub.map(m => {
    if (m.k === 'luz') return L.alarmaEn.join('+') || 'no';
    if (m.k === 'vueltas') {
      const v = L.arr.vueltasSeco;
      return isFinite(v) ? cuant(v, m.res).toFixed(1) : 'nunca';
    }
    if (m.k === 'visc') {
      const s = estado(e, { aceite: L.aceite, T: 100, rpm: e.ralenti, falla: ESCEN[L.esc].falla });
      return cuant(s.nu, m.res).toFixed(1) + (s.filtrado ? '' : '+sucio');
    }
    if (m.k === 'holgura') {
      const F = fisicaDe(e, ESCEN[L.esc].falla, ACEITES[L.aceite], 100);
      return F.hol.map(h => cuant(h * 2000, m.res).toFixed(3)).join('/');
    }
    return cuant(L[m.k], m.res).toFixed(2);
  }).join('|');
}
function censoSub(e, o = {}) {
  const cache = ESCEN_KEYS.map(k => ({ k, L: lecturas(e, k, o) }));
  const out = [];
  for (let m = 1; m < (1 << OBS.length); m++) {
    const sub = OBS.filter((_, i) => m & (1 << i));
    const grupos = new Map();
    for (const { k, L } of cache) {
      const f = firmaObs(e, L, sub);
      if (!grupos.has(f)) grupos.set(f, []);
      grupos.get(f).push({ k, clave: L.clave });
    }
    let conflictos = 0, enConflicto = 0;
    for (const g of grupos.values()) {
      const claves = new Set(g.map(x => x.clave));
      if (claves.size > 1) { conflictos++; enConflicto += g.length; }
    }
    out.push({ mask: m, sub, clases: grupos.size, n: cache.length,
      conflictos, enConflicto, resueltos: cache.length - enConflicto });
  }
  out.sort((a, b) => (b.resueltos - a.resueltos) || (a.sub.length - b.sub.length) || (b.clases - a.clases));
  return out;
}
function casosReto() { return ESCEN_KEYS.filter(k => k !== 'sano'); }

  bx.save(); bx.strokeStyle='#1d2735'; bx.lineWidth=1;
  for(let i=0;i<=nx;i++){ const v=x0+(x1-x0)*i/nx, xx=X(v);
    bx.beginPath(); bx.moveTo(xx,P.y); bx.lineTo(xx,P.y+P.h); bx.stroke();
    if(fx) texto(fx(v),xx,P.y+P.h+19,{s:12,c:'#7b8697',al:'center'}); }
  for(let i=0;i<=ny;i++){ const v=y0+(y1-y0)*i/ny, yy=Y(v);
    bx.beginPath(); bx.moveTo(P.x,yy); bx.lineTo(P.x+P.w,yy); bx.stroke();
    if(fy) texto(fy(v),P.x-9,yy+4,{s:12,c:'#7b8697',al:'right'}); }
  bx.restore();
  bx.save(); bx.strokeStyle='#3a4658'; bx.lineWidth=1.5; bx.strokeRect(P.x,P.y,P.w,P.h); bx.restore();
  if(rx) texto(rx,P.x+P.w/2,P.y+P.h+44,{s:13,c:'#9aa6b6',al:'center'});
  if(ry){ bx.save(); bx.translate(P.x-58,P.y+P.h/2); bx.rotate(-Math.PI/2);
    texto(ry,0,0,{s:13,c:'#9aa6b6',al:'center'}); bx.restore(); }
  return {X,Y};
}
function serieXY(M,pts,c,w,dash){ linea(pts.map(p=>[M.X(p[0]),M.Y(p[1])]),c,w,dash); }
function punteo(M,x,y,c,r){
  bx.save(); bx.fillStyle=c; bx.beginPath(); bx.arc(M.X(x),M.Y(y),r||4.5,0,Math.PI*2); bx.fill(); bx.restore();
}
// Línea de referencia horizontal. Si el nivel cae fuera del recuadro no se
// pinta: una línea de límite dibujada sobre el borde miente sobre dónde está.
function nivel(P,M,v,c,rot,dash){
  const yy=M.Y(v);
  if(yy<P.y-1||yy>P.y+P.h+1) return;
  linea([[P.x,yy],[P.x+P.w,yy]],c,1.6,dash||[7,5]);
  if(rot) etiqueta(rot,P.x+P.w-8,yy-6,c,'right');
}

// ---------------------------------------------------------------- paleta y ejes
// Un color por aceite, el mismo en la gráfica de Walther, en la del arranque y
// en la leyenda. Si el alumno tiene que traducir entre vistas, la vista sobra.
const COL_AC={a0w20:'#8AB4F8', a5w30:'#7CD992', a10w40:'#E9C46A',
              a15w40:'#F2A65A', a20w50:'#EF8FB4', sae30:'#C08CF8'};

// Ejes de ASTM D341. La gracia de esta transformación es que en ella la
// viscosidad de un aceite es una RECTA, así que la pendiente se ve a ojo y es
// literalmente lo que el método normalizado llama la recta de Walther.
const KELV=T=>T+273.15;
const D341X=T=>Math.log10(KELV(T));
const D341Y=nu=>Math.log10(Math.log10(nu+0.7));
const T_TICK=[-35,-20,0,25,50,75,100,125,150];
const NU_TICK=[3,5,10,30,100,300,1000,5000,30000];
function ejesD341(P){
  const x0=D341X(-38), x1=D341X(155), y0=D341Y(2.4), y1=D341Y(45000);
  const X=T=>P.x+(D341X(T)-x0)/(x1-x0)*P.w;
  const Y=nu=>P.y+P.h-(D341Y(nu)-y0)/(y1-y0)*P.h;
  bx.save(); bx.strokeStyle='#1d2735'; bx.lineWidth=1;
  T_TICK.forEach(t=>{ const xx=X(t);
    bx.beginPath(); bx.moveTo(xx,P.y); bx.lineTo(xx,P.y+P.h); bx.stroke();
    texto(num(t,0),xx,P.y+P.h+19,{s:12,c:'#7b8697',al:'center'}); });
  NU_TICK.forEach(v=>{ const yy=Y(v);
    bx.beginPath(); bx.moveTo(P.x,yy); bx.lineTo(P.x+P.w,yy); bx.stroke();
    texto(num(v,0),P.x-9,yy+4,{s:12,c:'#7b8697',al:'right'}); });
  bx.restore();
  bx.save(); bx.strokeStyle='#3a4658'; bx.lineWidth=1.5; bx.strokeRect(P.x,P.y,P.w,P.h); bx.restore();
  texto('temperatura [°C] — escala de ASTM D341',P.x+P.w/2,P.y+P.h+44,{s:13,c:'#9aa6b6',al:'center'});
  bx.save(); bx.translate(P.x-66,P.y+P.h/2); bx.rotate(-Math.PI/2);
  texto('viscosidad cinemática [mm²/s]',0,0,{s:13,c:'#9aa6b6',al:'center'}); bx.restore();
  return {X,Y};
}

// Barras verticales con su rótulo. Se usa en arranque y en censo.
function barras(P,items,vmax,o={}){
  const n=items.length, gap=o.gap===undefined?12:o.gap;
  const bwid=(P.w-gap*(n-1))/n;
  items.forEach((it,i)=>{
    const x=P.x+i*(bwid+gap);
    const v=clamp(it.v,0,vmax);
    const h=v/vmax*P.h, y=P.y+P.h-h;
    rpanel(x,y,bwid,h,it.c,null,4);
    texto(it.top,x+bwid/2,y-6,{s:o.s||12,c:it.c,al:'center',b:true});
    textoFit(it.rot,x+bwid/2,P.y+P.h+18,bwid+gap-4,{s:11.5,c:'#9aa6b6',al:'center'});
    if(it.rot2) textoFit(it.rot2,x+bwid/2,P.y+P.h+34,bwid+gap-4,{s:11,c:it.c2||'#7b8697',al:'center'});
  });
}

// Tarjeta de veredicto: un rótulo, un valor y un color. Es la unidad de lectura
// rápida del pizarrón y aparece en cuatro vistas.
function tarjeta(x,y,w,h,rot,val,c,pie){
  rpanel(x,y,w,h,'rgba(255,255,255,0.030)','#1e2836',10);
  texto(rot,x+14,y+24,{s:12.5,c:'#8c98a9'});
  textoFit(val,x+14,y+54,w-28,{s:24,b:true,c});
  if(pie) wrapText(pie,x+14,y+76,w-28,15,{s:11.5,c:'#7b8697'});
}

// ------------------------------------------------------------- vista ENSAMBLE
function vistaEnsamble(){
  const hechas=PARTS.filter(p=>ASM.done.has(p.k));
  cabecera('Circuito de lubricación — montaje',
    'El aceite hace un circuito cerrado: el cárter lo guarda, la bomba lo mueve, la limitadora recorta el exceso, el filtro lo limpia, el radiador le quita calor, la galería lo reparte a las bancadas y de ahí cae otra vez al cárter. Falta una pieza y el circuito no es circuito.');

  // --- esquema del circuito -------------------------------------------------
  // Se dibuja SIEMPRE entero. Las piezas que faltan van en trazo discontinuo y
  // en gris: enseñar el hueco vale más que esconder la pieza.
  const NODO=[
    {k:'carter', x:70,  y:390, w:150, h:56, rot:'Cárter + colador'},
    {k:'bomba',  x:70,  y:270, w:150, h:56, rot:'Bomba'},
    {k:'limitadora', x:262, y:270, w:150, h:56, rot:'Limitadora'},
    {k:'filtro', x:454, y:270, w:150, h:56, rot:'Filtro'},
    {k:'radiador', x:646, y:270, w:150, h:56, rot:'Radiador'},
    {k:'galeria', x:646, y:390, w:150, h:56, rot:'Galería'},
    {k:'manocontacto', x:836, y:390, w:146, h:56, rot:'Manocontacto'},
  ];
  const puesta=k=>ASM.done.has(k);
  const N=k=>NODO.find(n=>n.k===k);
  const centro=n=>[n.x+n.w/2,n.y+n.h/2];
  function flecha(pts,c){
    linea(pts,c,2.2);
    const a=pts[pts.length-2], b=pts[pts.length-1];
    const dx=b[0]-a[0], dy=b[1]-a[1], m=Math.hypot(dx,dy)||1, ux=dx/m, uy=dy/m;
    linea([[b[0]-ux*11-uy*6,b[1]-uy*11+ux*6],[b[0],b[1]],[b[0]-ux*11+uy*6,b[1]-uy*11-ux*6]],c,2.2);
  }
  // El color de cada tramo dice si el aceite puede pasar por ahí ahora mismo.
  const tramo=(a,b,pts)=>flecha(pts, puesta(a)&&puesta(b)?AMBAR:'#39424f');
  tramo('carter','bomba',[[centro(N('carter'))[0],N('carter').y],[centro(N('bomba'))[0],N('bomba').y+N('bomba').h]]);
  tramo('bomba','limitadora',[[N('bomba').x+N('bomba').w,centro(N('bomba'))[1]],[N('limitadora').x,centro(N('limitadora'))[1]]]);
  tramo('limitadora','filtro',[[N('limitadora').x+N('limitadora').w,centro(N('limitadora'))[1]],[N('filtro').x,centro(N('filtro'))[1]]]);
  tramo('filtro','radiador',[[N('filtro').x+N('filtro').w,centro(N('filtro'))[1]],[N('radiador').x,centro(N('radiador'))[1]]]);
  tramo('radiador','galeria',[[centro(N('radiador'))[0],N('radiador').y+N('radiador').h],[centro(N('galeria'))[0],N('galeria').y]]);
  tramo('galeria','manocontacto',[[N('galeria').x+N('galeria').w,centro(N('galeria'))[1]],[N('manocontacto').x,centro(N('manocontacto'))[1]]]);
  // Los dos caminos de vuelta: el sobrante de la limitadora y el goteo de las
  // bancadas. Son la razón de que el circuito no gaste aceite: gasta PRESIÓN.
  {
    const l=N('limitadora'), c=N('carter'), g=N('galeria');
    linea([[centro(l)[0],l.y+l.h],[centro(l)[0],478],[c.x+c.w/2+42,478],[c.x+c.w/2+42,c.y+c.h]],
      puesta('limitadora')?'#5d6b7d':'#39424f',1.8,[8,6]);
    etiqueta('retorno de la limitadora',centro(l)[0]+10,474,'#8c98a9');
    linea([[centro(g)[0],g.y+g.h],[centro(g)[0],528],[c.x+c.w/2,528],[c.x+c.w/2,c.y+c.h]],
      puesta('galeria')?'#5d6b7d':'#39424f',1.8,[8,6]);
    etiqueta('goteo de las bancadas al cárter',centro(g)[0]-14,524,'#8c98a9','right');
  }
  NODO.forEach(n=>{
    const on=puesta(n.k);
    bx.save(); if(!on) bx.setLineDash([7,5]);
    rpanel(n.x,n.y,n.w,n.h,on?'rgba(224,163,62,0.13)':'rgba(255,255,255,0.02)',on?AMBAR:'#3a4658',9);
    bx.restore();
    textoFit(n.rot,n.x+n.w/2,n.y+26,n.w-16,{s:13.5,b:true,c:on?TINTA:'#6b7686',al:'center'});
    texto(on?'montada':'falta',n.x+n.w/2,n.y+44,{s:11.5,c:on?OK_HEX:'#6b7686',al:'center'});
  });

  // --- lista de piezas ------------------------------------------------------
  texto('Piezas del circuito — '+hechas.length+'/'+PARTS.length,42,576,{s:15,b:true});
  const filas=PARTS.map(p=>({v:[ASM.done.has(p.k)?'✔':'·', p.rot, p.fn, p.sin],
                             c:ASM.done.has(p.k)?TINTA:'#75808f'}));
  tabla(42,586,[{t:'',w:18,al:'center'},{t:'Pieza',w:160},{t:'Qué hace',w:330},{t:'Si falta',w:360}],
    filas,{rh:23,s:12.5});
}

// ----------------------------------------------------------- vista VISCOSIDAD
function vistaViscosidad(){
  const o=ACEITES[aceiteEfectivo()], j=cumpleJ300(o), s=EST();
  cabecera('Grado SAE y viscosidad — la recta de Walther',
    'ASTM D341 dice que log₁₀log₁₀(ν+0,7) es una recta contra log₁₀ de la temperatura absoluta. En estos ejes cada aceite es literalmente una recta y su PENDIENTE es lo que pierde al calentarse. Cada línea empieza en el punto MEDIDO de su ensayo de arranque en frío: por debajo no se extrapola, porque extrapolar ahí da cifras que no cumplirían ni su propio grado.');

  const P={x:104,y:152,w:512,h:462};
  const M=ejesD341(P);
  // Franja de la temperatura de servicio: la ventana donde el motor pasa la vida.
  enCaja(P,()=>{
    bx.save(); bx.fillStyle='rgba(124,217,146,0.055)';
    bx.fillRect(M.X(90),P.y,M.X(130)-M.X(90),P.h); bx.restore();
  });
  etiqueta('servicio',M.X(130)+4,P.y+16,'#7CD992');

  ACEITE_KEYS.forEach(k=>{
    const a=ACEITES[k], act=(k===o.key), pts=[];
    for(let i=0;i<=90;i++){
      const T=a.tFrio+(155-a.tFrio)*i/90;
      pts.push([M.X(T),M.Y(nuT(T,a))]);
    }
    enCaja(P,()=>{
      linea(pts,COL_AC[k],act?3.4:1.5,act?null:[6,5]);
      // El extremo frío es un DATO de ensayo, no un punto de la recta: se marca.
      bx.save(); bx.fillStyle=COL_AC[k];
      bx.beginPath(); bx.arc(M.X(a.tFrio),M.Y(nuT(a.tFrio,a)),act?6:3.6,0,Math.PI*2); bx.fill(); bx.restore();
    });
  });
  {
    const xT=M.X(G.T), yN=M.Y(s.nu), der=(xT+210>P.x+P.w);
    enCaja(P,()=>{
      linea([[xT,P.y],[xT,P.y+P.h]],CIAN,1.4,[5,5]);
      bx.save(); bx.fillStyle=CIAN; bx.beginPath(); bx.arc(xT,yN,6.5,0,Math.PI*2); bx.fill(); bx.restore();
    });
    etiqueta(num(G.T,0)+NBSP+'°C · '+cSt(s.nu)+' · '+mPas(s.mu*1000,1),
      der?xT-10:xT+10, clamp(yN-12,P.y+16,P.y+P.h-6), CIAN, der?'right':'left');
  }
  leyenda(P.x+14,P.y+26,ACEITE_KEYS.map(k=>[ACEITES[k].corto,COL_AC[k],k===o.key?null:[6,5]]));

  // --- tarjeta de J300 ------------------------------------------------------
  const X0=672, W0=310;
  texto('SAE J300 — ¿cumple su propio grado?',X0,168,{s:15,b:true});
  const fil=[
    {v:['KV a 100 °C',num(o.kv100,2)+NBSP+'mm²/s',
      num(J300_V[o.vGrado].kvMin,2)+'–'+num(J300_V[o.vGrado].kvMax,2),
      [j.kv100.ok?'cumple':'no',j.kv100.ok?OK_HEX:BAD_HEX]]},
    {v:['HTHS a 150 °C',num(o.hths,2)+NBSP+'mPa·s','≥'+NBSP+num(J300_V[o.vGrado].hthsMin,2),
      [j.hths.ok?'cumple':'no',j.hths.ok?OK_HEX:BAD_HEX]]},
  ];
  if(j.ccs){
    fil.push({v:['CCS a '+num(j.ccs.T,0)+NBSP+'°C',num(j.ccs.val,0)+NBSP+'mPa·s','≤'+NBSP+num(j.ccs.max,0),
      [j.ccs.ok?'cumple':'no',j.ccs.ok?OK_HEX:BAD_HEX]]});
    fil.push({v:['MRV a '+num(j.mrv.T,0)+NBSP+'°C',
      o.mrv===null?'sin dato':num(j.mrv.val,0)+NBSP+'mPa·s','≤'+NBSP+num(j.mrv.max,0),
      [j.mrv.ok?'cumple':'no',j.mrv.ok?OK_HEX:BAD_HEX]]});
  }else{
    fil.push({v:['Grado de invierno','no tiene','—',['monogrado',WARN_HEX]]});
  }
  fil.push({v:['Índice de viscosidad',num(o.iv,0),'D2270',['dato',GRIS]]});
  tabla(X0,198,[{t:'Criterio',w:118},{t:'Medido',w:86,al:'right'},
                {t:'J300',w:58,al:'right'},{t:'',w:48,al:'right'}],fil,{rh:24,s:12,gap:8});

  let yy=380;
  rpanel(X0,yy,W0,100,'rgba(255,255,255,0.030)','#1e2836',10);
  texto('Lo que NO dice el grado',X0+14,yy+22,{s:13,b:true,c:WARN_HEX});
  wrapText('El número de verano ordena la KV a 100 °C, no la protección. El 15W-40 de este banco tiene MENOS KV100 que el 10W-40 y MÁS HTHS ('+
    num(ACEITES.a15w40.hths,2)+' contra '+num(ACEITES.a10w40.hths,2)+NBSP+'mPa·s): el que manda en el desgaste es el HTHS, y hay que mirarlo aparte.',
    X0+14,yy+42,W0-28,15,{s:11.5});

  yy=494;
  rpanel(X0,yy,W0,124,'rgba(255,255,255,0.030)','#1e2836',10);
  texto('Pendiente ≠ índice de viscosidad',X0+14,yy+22,{s:13,b:true,c:VIO});
  wrapText('El IV de este aceite es '+num(o.iv,0)+' y la pendiente de su recta, '+num(o.w.B,3)+
    '. No están ordenados entre grados distintos: el 0W-20 tiene mejor IV que el 10W-40 ('+
    num(ACEITES.a0w20.iv,0)+' contra '+num(ACEITES.a10w40.iv,0)+') y MAYOR pendiente ('+
    num(ACEITES.a0w20.w.B,3)+' contra '+num(ACEITES.a10w40.w.B,3)+
    '). Por eso ASTM D2270 no mide la pendiente: compara contra aceites patrón de la misma KV100.',
    X0+14,yy+42,W0-28,15,{s:11.5});

  wrapText(o.nota,X0,644,W0,15,{s:11.5,c:'#8c98a9',b:true});
}

// -------------------------------------------------------------- vista PRESION
function vistaPresion(){
  const e=MQ(), s=EST();
  cabecera('Presión de galería — lo único que ve el conductor',
    'La presión no es una propiedad del aceite: es el equilibrio entre lo que la bomba mete y lo que el circuito deja salir. Sube con el régimen y con la viscosidad, y baja con la holgura —al cubo— y con la temperatura. La limitadora sólo recorta por arriba.');

  const rpmMax=6000, rpmMin=Math.min(e.ralenti,600);
  const relEje=isFinite(s.pRel)?s.pRel*1.15:0;
  const P1={x:96,y:172,w:392,h:236};
  const pMax=Math.max(2,Math.ceil(Math.max(s.p,relEje,EST({rpm:rpmMax}).p,
    EST({rpm:rpmMax,falla:'sano',aceite:e.aceiteOEM}).p)*1.15));
  const M1=ejes(P1,rpmMin,rpmMax,0,pMax,'régimen [rpm]','presión de galería [bar]',
    v=>num(v,0),v=>num(v,1),5,4);
  const curva=(fa,ac)=>{ const pts=[];
    for(let i=0;i<=36;i++){ const r=rpmMin+(rpmMax-rpmMin)*i/36;
      pts.push([r,EST({rpm:r,falla:fa,aceite:ac}).p]); }
    return pts; };
  enCaja(P1,()=>{
    serieXY(M1,curva('sano',e.aceiteOEM),'#5d6b7d',1.8,[7,5]);
    serieXY(M1,curva(FALLA(),aceiteEfectivo()),AZUL,3.2);
  });
  nivel(P1,M1,e.pAlarma,BAD_HEX,'luz roja: '+bar(e.pAlarma,2));
  if(isFinite(s.pRel)) nivel(P1,M1,s.pRel,VIO,'tarado: '+bar(s.pRel,2),[4,4]);
  punteo(M1,clamp(G.rpm,rpmMin,rpmMax),s.p,CIAN,6);
  leyenda(P1.x+14,P1.y+26,[['este motor, este aceite',AZUL],
    ['sano con el aceite del fabricante','#5d6b7d',[7,5]]]);

  const P2={x:592,y:172,w:392,h:236};
  const pTmax=Math.max(2,Math.ceil(Math.max(EST({T:-20}).p,relEje,4)*1.1));
  const M2=ejes(P2,-20,140,0,pTmax,'temperatura del aceite [°C]','presión de galería [bar]',
    v=>num(v,0),v=>num(v,1),4,4);
  const curvaT=(fa,ac)=>{ const pts=[];
    for(let i=0;i<=32;i++){ const T=-20+160*i/32; pts.push([T,EST({T,falla:fa,aceite:ac}).p]); }
    return pts; };
  enCaja(P2,()=>{
    serieXY(M2,curvaT('sano',e.aceiteOEM),'#5d6b7d',1.8,[7,5]);
    serieXY(M2,curvaT(FALLA(),aceiteEfectivo()),NARANJA,3.2);
  });
  nivel(P2,M2,e.pAlarma,BAD_HEX,'luz roja');
  nivel(P2,M2,e.pMaxFiltro,BAD_HEX,'lo que aguanta el filtro: '+bar(e.pMaxFiltro,1),[3,4]);
  punteo(M2,clamp(G.T,-20,140),s.p,CIAN,6);

  // --- tarjetas y telemetría -----------------------------------------------
  const yT=452;
  tarjeta(96,yT,208,96,'Presión de galería',bar(s.p),
    s.alarma?BAD_HEX:(s.abreLim?VIO:OK_HEX),

// ------------------------------------------------------------- vista PELICULA
function vistaPelicula(){
  const e=MQ(), s=EST(), V=veredicto();
  const rq=Math.sqrt(e.rqMuñ*e.rqMuñ+e.rqCoj*e.rqCoj);
  cabecera('Espesor de película — lo que de verdad protege',
    'El muñón flota sobre una cuña de aceite. Lo que separa las dos superficies es h mínima, y lo que dice si están separadas de verdad es λ = h ÷ rugosidad compuesta: por debajo de 1 hay contacto metal-metal; por encima de 3, película completa. Nada de esto sale en el manómetro.');

  const rpmMax=6000, rpmMin=Math.min(e.ralenti,600);
  const P1={x:96,y:172,w:392,h:236};
  const lamMax=Math.max(4,Math.ceil(Math.max(EST({rpm:rpmMax}).peor.lam,s.peor.lam)*1.15));
  const M1=ejes(P1,rpmMin,rpmMax,0,lamMax,'régimen [rpm]','espesor específico λ',
    q=>num(q,0),q=>num(q,1),5,4);
  // Bandas de régimen: el mismo código de color que el cojinete ampliado en 3D.
  enCaja(P1,()=>{
    const banda=(a,z,c)=>{ const yA=M1.Y(Math.min(z,lamMax)), yZ=M1.Y(a);
      bx.save(); bx.fillStyle=c; bx.fillRect(P1.x,yA,P1.w,yZ-yA); bx.restore(); };
    banda(0,1,'rgba(255,107,107,0.13)'); banda(1,3,'rgba(233,196,106,0.10)');
    banda(3,lamMax,'rgba(124,217,146,0.08)');
  });
  const lamCurva=ca=>{ const pts=[];
    for(let i=0;i<=36;i++){ const r=rpmMin+(rpmMax-rpmMin)*i/36;
      pts.push([r,EST({rpm:r,carga:ca}).peor.lam]); }
    return pts; };
  enCaja(P1,()=>{
    serieXY(M1,lamCurva(0),'#5d6b7d',1.8,[7,5]);
    serieXY(M1,lamCurva(1),BAD_HEX,2.0,[3,4]);
    serieXY(M1,lamCurva(G.carga),AZUL,3.2);
  });
  nivel(P1,M1,3,OK_HEX,'λ = 3 · película completa');
  nivel(P1,M1,1,BAD_HEX,'λ = 1 · empieza el contacto');
  punteo(M1,clamp(G.rpm,rpmMin,rpmMax),s.peor.lam,CIAN,6);
  leyenda(P1.x+14,P1.y+26,[['sin carga','#5d6b7d',[7,5]],['carga actual',AZUL],['pie a fondo',BAD_HEX,[3,4]]]);

  const P2={x:592,y:172,w:392,h:236};
  const hMax=Math.max(2,Math.ceil(EST({T:-20}).peor.h*1e6*1.1));
  const M2=ejes(P2,-20,140,0,hMax,'temperatura del aceite [°C]','h mínima [µm]',
    q=>num(q,0),q=>num(q,1),4,4);
  enCaja(P2,()=>{
    const pts=[];
    for(let i=0;i<=32;i++){ const T=-20+160*i/32; pts.push([T,EST({T}).peor.h*1e6]); }
    serieXY(M2,pts,NARANJA,3.2);
    serieXY(M2,[[-20,rq],[140,rq]],BAD_HEX,1.6);
    serieXY(M2,[[-20,3*rq],[140,3*rq]],OK_HEX,1.6);
  });
  etiqueta('Rq compuesta = '+um(rq),P2.x+P2.w-8,P2.y+P2.h-10,BAD_HEX,'right');
  punteo(M2,clamp(G.T,-20,140),s.peor.h*1e6,CIAN,6);

  // --- la tesis del laboratorio, en tres tarjetas --------------------------
  const yT=452;
  tarjeta(96,yT,300,104,'Lo que dice el manómetro',bar(s.p),V.presion?OK_HEX:BAD_HEX,
    V.presion?('Por encima del mínimo del fabricante ('+bar(e.pAlarma,2)+'): la luz está apagada y el conductor sigue conduciendo.')
      :('Por debajo del mínimo ('+bar(e.pAlarma,2)+'): la luz roja está encendida.'));
