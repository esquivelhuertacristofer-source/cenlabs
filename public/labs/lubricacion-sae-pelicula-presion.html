// ============================================================ T3a · EL MOTOR
// El motor se dibuja en corte y A ESCALA: un milímetro del arquetipo son ESC
// unidades de escena. El diámetro, la carrera, el diámetro del muñón, el ancho
// del cojinete y el número de bancadas salen del mismo objeto ARQ que usa el
// modelo numérico, así que cambiar de máquina cambia la geometría y las cifras
// a la vez y no pueden desmentirse entre sí.
//
// SIMPLIFICACIONES DECLARADAS (van también en el contrato de fidelidad):
//  · El corte es por el eje del cigüeñal y de la junta de culata hacia ABAJO.
//    Esta práctica no toca la combustión: no hay pistones, ni bielas, ni
//    culata. Lo que hay que ver es el circuito de aceite y las bancadas.
//  · Los cuatro arquetipos se dibujan con sus bancadas EN LÍNEA y equiespaciadas,
//    también el V8. Ninguna cifra depende de la disposición de los cilindros.
//  · La holgura real del cojinete es de micras: a escala sería invisible. En el
//    cojinete ampliado se dibuja MULTIPLICADA por un factor declarado en
//    pantalla, y la cifra que se publica es siempre la real.
const ESC=0.010;
const YC=0.50;                        // eje del cigüeñal sobre la raíz del motor

function dims(e){
  const B=e.B*ESC;
  const px=1.34*B;                                     // separación entre bancadas
  const luz=(e.nCoj-1)*px;
  const anchoTot=Math.max(luz+1.20*B,1.6);
  return {B,px,luz,anchoTot,
    rMun:e.dMuñ/2*ESC,                                 // radio del muñón de bancada
    lCoj:e.lCoj*ESC,                                   // ancho del cojinete
    rMan:e.dMuñ/2*ESC*0.86,                            // muñequilla, algo menor
    r:e.S/2*ESC,                                       // radio de manivela
    yDeck:YC+0.92*B,                                   // plano de junta de culata
    yGal:YC+0.60*B, zGal:-0.30*B,                      // galería principal
    yCar:YC-0.34*B, hCar:0.62*B};                      // cárter
}
const xBancada=(i,D,e)=>-D.luz/2+i*D.px;
// Escala del manometro: el fondo de escala es lo que aguanta el filtro. Asi la
// aguja se clava justo cuando el circuito esta a punto de romperse, que es la
// unica cifra de este instrumento que significa algo por si sola.
const escalaMan=e=>Math.ceil(e.pMaxFiltro);
// Las muñequillas van entre bancadas y desfasadas: sin desfase el cigüeñal
// parece una barra recta y deja de leerse que gira.
const faseMan=(i,e)=>(720/Math.max(1,e.nCoj-1))*i;

// Referencias vivas de la escena. Se separan a proposito en dos familias: lo
// que pertenece al MOTOR, que se rehace al cambiar de arquetipo, y lo que
// pertenece al KIT, que lo gestiona el ensamble. El cojinete ampliado no es de
// ninguna de las dos: se construye una sola vez y sobrevive a los cambios.
const RIG={motor:null, cigu:null, casq:[], sombrerete:[],
  piezas:{}, amp:null, lampara:null, aceite:null, aguja:null,
  rotor:null, rotorExt:null, relGer:1, deriv:null, antidren:null, embolo:null, aceiteH:0};

// Rótulo REESCRIBIBLE. El `labelSprite` del kit hornea el texto en su textura y
// no se puede cambiar; aquí hay tres rótulos que cambian con cada punto de
// trabajo, y crear un sprite nuevo por fotograma fuga memoria de vídeo.
function rotulo(color){
  const w=560,h=96;
  const lienzo=document.createElement('canvas'); lienzo.width=w; lienzo.height=h;
  const g=lienzo.getContext('2d');
  const tx=new THREE.CanvasTexture(lienzo); tx.colorSpace=THREE.SRGBColorSpace;
  tx.generateMipmaps=true; tx.minFilter=THREE.LinearMipmapLinearFilter;
  tx.magFilter=THREE.LinearFilter; tx.anisotropy=8;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,depthTest:false,transparent:true}));
  sp.scale.set(0.30*(w/h),0.30,1); sp.renderOrder=999;
  sp.userData.set=(txt,col)=>{
    const c=col||color;
    g.clearRect(0,0,w,h);
    // El lienzo tiene un ancho FIJO y fillText no recorta: desborda por las dos
    // puntas y el rótulo sale mutilado. Si el texto no cabe se encoge la letra.
    let px=36;
    g.font='bold '+px+'px Outfit, system-ui, sans-serif';
    const util=w-64, bruto=g.measureText(txt).width;
    if(bruto>util){
      px=Math.max(17,Math.floor(px*util/bruto));
      g.font='bold '+px+'px Outfit, system-ui, sans-serif';
    }
    const tw=Math.max(150,Math.min(w-8,g.measureText(txt).width+56)), x0=(w-tw)/2, r=18;
    g.beginPath();
    g.moveTo(x0+r,3); g.arcTo(x0+tw,3,x0+tw,93,r); g.arcTo(x0+tw,93,x0,93,r);
    g.arcTo(x0,93,x0,3,r); g.arcTo(x0,3,x0+tw,3,r); g.closePath();
    g.fillStyle='rgba(8,11,16,0.95)'; g.fill();
    g.strokeStyle=c; g.lineWidth=3; g.stroke();
    g.fillStyle=c; g.textAlign='center'; g.textBaseline='middle'; g.fillText(txt,w/2,48);
    tx.needsUpdate=true;
  };
  sp.userData.set('—',color);
  return sp;
}

function limpiaMotor(){
  if(RIG.motor){
    scene.remove(RIG.motor);
    RIG.motor.traverse(o=>{ if(o.geometry) o.geometry.dispose(); });
  }
  // Se limpia SOLO lo del motor. El cojinete ampliado y las piezas del kit
  // tienen su propio ciclo de vida: ponerlos a null aquí los deja huérfanos en
  // la escena, actualizándose nunca más, y eso no se ve hasta que se cambia de
  // arquetipo y el cojinete ampliado se queda congelado en la cifra anterior.
  RIG.motor=null; RIG.cigu=null; RIG.casq=[]; RIG.sombrerete=[];
}

function construyeMotor(){
  limpiaMotor();
  const e=MQ(), D=dims(e);
  const raiz=new THREE.Group(); raiz.position.set(0,0.86,0); scene.add(raiz); RIG.motor=raiz;

  // --- bloque en corte ------------------------------------------------------
  // El bloque no es una caja: es una caja SIN la mitad delantera, partida por el
  // plano que pasa por el eje del cigüeñal. Dibujarlo entero deja una pared lisa
  // y no se ve ni una bancada, que es lo único que hay que ver aquí.
  const zPared=-0.36*D.B, dPared=0.36*D.B;
  const alto=D.yDeck-YC+0.10;
  {
    const blq=roundedBox(D.anchoTot,alto,dPared,MAT.bloque,0.03);
    blq.position.set(0,YC+alto/2-0.05,zPared-dPared/2); blq.castShadow=true; raiz.add(blq);
    const deck=roundedBox(D.anchoTot,0.05,1.00*D.B,MAT.bloque,0.01);
    deck.position.set(0,D.yDeck,-0.18*D.B); raiz.add(deck);
    // faldón: la parte del bloque que baja por debajo del eje y cierra el cárter
    const fald=roundedBox(D.anchoTot,0.34*D.B,dPared,MAT.bloque,0.02);
    fald.position.set(0,YC-0.17*D.B,zPared-dPared/2); raiz.add(fald);
  }

  // --- bancadas: tabique, casquillo y sombrerete ---------------------------
  for(let i=0;i<e.nCoj;i++){
    const x=xBancada(i,D,e);
    const tab=roundedBox(D.lCoj*1.9,alto,0.96*D.B,MAT.bloque,0.012);
    tab.position.set(x,YC+alto/2-0.05,-0.16*D.B); raiz.add(tab);
    // Casquillo: media caña abierta hacia delante, que es por donde se mira.
    // El material es el antifricción, no el acero del muñón: son dos piezas y
    // el laboratorio habla todo el rato de la holgura entre ellas.
    const cas=new THREE.Mesh(
      new THREE.CylinderGeometry(D.rMun*1.16,D.rMun*1.16,D.lCoj,26,1,true,-Math.PI/2,Math.PI),
      MAT_CASQ.clone());
    cas.rotation.z=Math.PI/2; cas.position.set(x,YC,0); raiz.add(cas);
    RIG.casq.push(cas);
    const som=roundedBox(D.lCoj*1.8,0.30*D.B,0.62*D.B,MAT.bloque,0.012);
    som.position.set(x,YC-D.rMun*1.16-0.15*D.B,-0.06*D.B); raiz.add(som);
    RIG.sombrerete.push(som);
    for(const sx of [-1,1]){
      const per=new THREE.Mesh(new THREE.CylinderGeometry(0.020,0.020,0.30*D.B,10),MAT.acero);
      per.position.set(x+sx*D.lCoj*0.62,YC-D.rMun*1.16-0.15*D.B,-0.06*D.B); raiz.add(per);
    }
    const et=labelSprite('bancada '+(i+1),'#c8a06a');
    et.position.set(x,YC+0.40*D.B,0.40*D.B); et.scale.multiplyScalar(0.46); raiz.add(et);
  }

  // --- cigüeñal -------------------------------------------------------------
  {
    const cigu=new THREE.Group(); cigu.position.set(0,YC,0); raiz.add(cigu); RIG.cigu=cigu;
    for(let i=0;i<e.nCoj;i++){
      const mun=new THREE.Mesh(new THREE.CylinderGeometry(D.rMun,D.rMun,D.lCoj*0.96,26),MAT_MUNON);
      mun.rotation.z=Math.PI/2; mun.position.x=xBancada(i,D,e); cigu.add(mun);
    }
    for(let i=0;i<e.nCoj-1;i++){
      const g=new THREE.Group(); g.rotation.x=faseMan(i,e)*DEG; cigu.add(g);
      const xm=(xBancada(i,D,e)+xBancada(i+1,D,e))/2;
      const man=new THREE.Mesh(new THREE.CylinderGeometry(D.rMan,D.rMan,D.lCoj*0.92,22),MAT_MUNON);
      man.rotation.z=Math.PI/2; man.position.set(xm,D.r,0); g.add(man);
      for(const sx of [-1,1]){
        const bra=roundedBox(D.lCoj*0.55,D.r+D.rMun*1.7,D.rMun*1.7,
          std({...brush,color:0x8e9099,metalness:1.0,roughness:0.30}),0.012);
        bra.position.set(xm+sx*(D.px/2-D.lCoj*0.75),D.r/2,0); g.add(bra);
        const con=new THREE.Mesh(new THREE.CylinderGeometry(D.rMun*0.95,D.rMun*0.95,D.lCoj*0.5,18),
          std({...brush,color:0x8e9099,metalness:1.0,roughness:0.30}));
        con.rotation.z=Math.PI/2; con.position.set(xm+sx*(D.px/2-D.lCoj*0.75),-D.r*0.55,0); g.add(con);
      }
    }
    const eje=new THREE.Mesh(new THREE.CylinderGeometry(D.rMun*0.8,D.rMun*0.8,D.anchoTot+0.30,20),MAT_MUNON);
    eje.rotation.z=Math.PI/2; cigu.add(eje);
    const vol=new THREE.Mesh(new THREE.CylinderGeometry(0.44,0.44,0.10,40),
      std({...brush,metalness:1.0,roughness:0.44}));
    vol.rotation.z=Math.PI/2; vol.position.x=-(D.anchoTot/2+0.12); cigu.add(vol);
    const cor=new THREE.Mesh(new THREE.TorusGeometry(0.44,0.032,10,64),MAT.crom);
    cor.position.x=-(D.anchoTot/2+0.12); cor.rotation.y=Math.PI/2; cigu.add(cor);
  }

  // --- soporte del banco ----------------------------------------------------
  {
    const base=roundedBox(D.anchoTot+0.70,0.10,1.30,MAT.banco,0.03);
    base.position.set(0,-0.86,0); base.receiveShadow=true; raiz.add(base);
    for(const sx of [-1,1]) for(const sz of [-1,1]){
      const p=new THREE.Mesh(new THREE.BoxGeometry(0.11,0.72,0.11),MAT.banco);
      p.position.set(sx*(D.anchoTot/2+0.22),-0.50,sz*0.50); raiz.add(p);
    }
  }

  raiz.position.y=0.86;
  // El 5.0 V8 mide bastante más que el 1.6. Con un encuadre fijo se sale del
  // cuadro; con este factor la cámara y el pizarrón se separan lo justo.
  G.k=Math.max(1,(D.anchoTot+0.70)/4.6);
  colocaTablero(D.anchoTot);
  colocaAmpliado();
  return raiz;
}

// ------------------------------------------------------- el cojinete AMPLIADO
// Lo que de verdad protege el motor mide micras: a la escala del bloque no se
// ve. Aquí se dibuja UN cojinete en SECCIÓN —mirando a lo largo del eje, que es
// como se dibuja en cualquier libro— con la holgura multiplicada por un factor
// que se declara en pantalla. Todas las cifras que se publican son las reales.
//
// Cuatro discos concéntricos, del exterior al interior: dorso de acero,
// casquillo antifricción, película de aceite y muñón. Al desplazarse el muñón
// con la excentricidad, la corona de aceite se estrecha por abajo: ESA media
// luna es h mínima, y se ve sin que nadie tenga que explicarla.
const AMP={R:0.42, hol:0.24, x:0, y:1.95, z:1.05, factor:0};
function disco(r,esp,mat){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,esp,54),mat);
  m.rotation.x=Math.PI/2; return m;
}
function construyeAmpliado(){
  const g=new THREE.Group(); scene.add(g); RIG.amp=g;
  const R=AMP.R, c=R*AMP.hol;

  const dorso=disco(R*1.46,0.26,std({color:0x6f767f,metalness:0.60,roughness:0.62}));
  dorso.position.z=-0.06; g.add(dorso);
  const casq=disco(R*1.30,0.28,std({color:0xc8a06a,metalness:0.92,roughness:0.30}));
  casq.position.z=-0.02; g.add(casq);
  // La película. Su radio exterior es el del casquillo, y el muñón que va encima
  // la tapa salvo por la corona que queda libre: eso es el espesor de aceite.
  const peli=disco(R+c,0.30,MAT_PELIC.clone());
  peli.position.z=0.01; g.add(peli);

  const mun=new THREE.Group(); mun.position.z=0.04; g.add(mun);
  const cil=disco(R,0.32,MAT_MUNON); mun.add(cil);
  // Marca del muñón: sin ella, un disco liso girando no se ve girar.
  const marca=roundedBox(R*0.10,R*0.86,0.34,MAT.crom,0.02);
  marca.position.set(0,R*0.50,0.01); mun.add(marca);

  // Flecha de la carga: el muñón se desplaza en el sentido en que se le empuja.
  const vast=new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,R*0.62,12),
    std({color:0xff6b6b,emissive:0xff6b6b,emissiveIntensity:0.40,roughness:0.4}));
  vast.position.set(0,-R*1.98,0.06); g.add(vast);
  const punta=new THREE.Mesh(new THREE.ConeGeometry(0.070,0.20,16),
    std({color:0xff6b6b,emissive:0xff6b6b,emissiveIntensity:0.55,roughness:0.4}));
  punta.position.set(0,-R*1.62,0.06); punta.rotation.x=Math.PI; g.add(punta);

  const etReg=rotulo('#7CD992'); etReg.position.set(0,R*2.10,0.10);
  etReg.scale.multiplyScalar(0.62); g.add(etReg);
  const etH=rotulo('#E0A33E'); etH.position.set(0,R*1.62,0.10);
  etH.scale.multiplyScalar(0.56); g.add(etH);
  const etF=rotulo('#8c98a9'); etF.position.set(0,-R*2.60,0.10);
  etF.scale.multiplyScalar(0.48); g.add(etF);

  AMP.mun=mun; AMP.peli=peli; AMP.etReg=etReg; AMP.etH=etH; AMP.etF=etF;
  g.visible=false;
  colocaAmpliado();
  return g;
}
// El cojinete ampliado se aparta a la derecha del motor, a distancia fija de su
// extremo: con una coordenada escrita a mano se mete dentro del bloque en cuanto
// el motor es el V8, y eso no se ve venir escribiendo el número.
function colocaAmpliado(){
  if(!RIG.amp||!RIG.motor) return;
  const D=dims(MQ());
  AMP.x=D.anchoTot/2+1.55;
  RIG.amp.position.set(AMP.x,AMP.y,AMP.z);
}

// ================================================= T3b · EL CIRCUITO DE ACEITE
const nuevaFantasma=()=>std({color:0x5BD4E5,transparent:true,opacity:0.26,
  depthWrite:false,side:THREE.DoubleSide});
const MAT_ESFERA=std({color:0xf2f4f7,roughness:0.85,metalness:0.0});
const MAT_CRISTAL=std({color:0xffffff,transparent:true,opacity:0.16,roughness:0.06,metalness:0.0});
const MAT_AGUJA=std({color:0xff5252,emissive:0xff5252,emissiveIntensity:0.5,roughness:0.40});
const MAT_LATON=std({color:0xC8A24A,metalness:1.0,roughness:0.30});
const MAT_MANG=std({...rub,color:0x1a1f27,roughness:0.95,metalness:0.0});

/* Una pieza EN CORTE deja ver su interior, pero también deja ver el REVÉS de
   la pared del fondo: dibujando una sola cara, la pieza se vuelve transparente
   por el lado abierto y desaparece justo cuando se la mira de frente. Se
   descubrió con el cuerpo de la limitadora, que no salía en ninguna foto. */
const corte=(m)=>{ const c=m.clone(); c.side=THREE.DoubleSide; return c; };
function cil(r0,r1,h,mat,seg){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r0,r1,h,seg||22),mat);
  m.castShadow=true; return m;
}
function tubo(pts,r,mat){
  const m=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),
    Math.max(12,pts.length*8),r,10,false),mat);
  m.castShadow=true; return m;
}
function centra(g){
  const dentro=new THREE.Group();
  while(g.children.length) dentro.add(g.children[0]);
  const caja=new THREE.Box3().setFromObject(dentro);
  const c=new THREE.Vector3(); caja.getCenter(c);
  dentro.position.copy(c).negate();
  g.add(dentro);
  g.userData.home=c.clone(); g.userData.minY=caja.min.y-c.y;
  g.position.copy(c); return g;
}
function borra(o){
  o.traverse(n=>{ if(n.isMesh&&n.geometry) n.geometry.dispose(); });
  if(o.userData.gm) o.userData.gm.dispose();
  if(o.parent) o.parent.remove(o);
}
// Esfera de manómetro. Devuelve el grupo con setFrac: la aguja NUNCA se mueve a
// ojo, recibe la fracción de escala que le calcula el motor sellado.
function esfera(r,rojo){
  const g=new THREE.Group();
  const caja=cil(r,r,0.055,MAT.crom,34); caja.rotation.x=Math.PI/2; g.add(caja);
  const cara=cil(r*0.92,r*0.92,0.010,MAT_ESFERA,34); cara.rotation.x=Math.PI/2;
  cara.position.z=0.029; g.add(cara);
  const vid=cil(r*0.93,r*0.93,0.006,MAT_CRISTAL,34); vid.rotation.x=Math.PI/2;
  vid.position.z=0.036; g.add(vid);
  // Zona roja: por debajo del mínimo del fabricante. Es la única marca de la
  // esfera que significa algo, y por eso se dibuja del tamaño que le toca.
  if(rojo>0){
    // Las marcas de esta esfera van medidas desde las 12 y en el sentido del
    // reloj; RingGeometry mide desde el eje X y al reves. La conversion se hace
    // aqui una vez: girar la malla a ojo deja la zona roja en el lado que no es.
    const f=clamp(rojo,0,1);
    const arc=new THREE.Mesh(new THREE.RingGeometry(r*0.66,r*0.86,44,1,
      Math.PI/2+135*DEG-f*270*DEG, f*270*DEG), std({color:0xff5252,roughness:0.9}));
    arc.position.z=0.032; g.add(arc);
  }
  for(let i=0;i<=10;i++){
    const a=(-135+i*27)*DEG;
    const m=new THREE.Mesh(new THREE.BoxGeometry(0.006,r*0.16,0.004),std({color:0x1a2029,roughness:0.9}));
    m.position.set(Math.sin(a)*r*0.76,Math.cos(a)*r*0.76,0.034); m.rotation.z=-a; g.add(m);
  }
  const ag=new THREE.Group(); ag.position.z=0.038; g.add(ag);
  const cuerpo=new THREE.Mesh(new THREE.BoxGeometry(0.010,r*1.52,0.006),MAT_AGUJA);
  cuerpo.position.y=r*0.50; ag.add(cuerpo);
  ag.add(cil(0.016,0.016,0.012,MAT.crom,14).rotateX(Math.PI/2));
  g.userData.setFrac=f=>{ ag.rotation.z=-(-135+clamp(f,0,1)*270)*DEG; };
  g.userData.setFrac(0);
  return g;
}

// ------------------------------------------------------------- las siete piezas
function bCarter(){
  const e=MQ(), D=dims(e), g=new THREE.Group();
  const w=D.anchoTot*0.96, h=D.hCar, d=1.04*D.B;
  // Cárter en corte, como el bloque: sin la pared delantera, para que se vean el
  // nivel de aceite y el colador. Un cárter cerrado sería una caja opaca.
  const par=[[0,-h/2,0,w,0.045,d],[0,0,-d/2,w,h,0.045],
             [-w/2,0,0,0.045,h,d],[w/2,0,0,0.045,h,d]];
  par.forEach(([x,y,z,a,b,c])=>{
    const m=roundedBox(a,b,c,MAT_CARTER,0.012); m.position.set(x,y,z); g.add(m);
  });
  // El aceite. Su altura la fija el escenario: con el nivel bajo la bomba llega
  // a aspirar aire, y eso hay que verlo.
  const ace=roundedBox(w-0.09,h*0.46,d-0.09,MAT_BANO.clone(),0.01);
  ace.position.set(0,-h/2+h*0.24,0); g.add(ace);
  // La altura se publica aparte: RoundedBoxGeometry no expone sus cotas y
  // leerlas de geometry.parameters devuelve undefined sin avisar.
  g.userData.aceite=ace; g.userData.aceiteH=h*0.46;
  // Colador de aspiración: la boca por la que entra todo.
  const col=roundedBox(0.30*D.B,0.05,0.34*D.B,std({...brush,color:0x8b939d,roughness:0.55}),0.01);
  col.position.set(w*0.24,-h/2+0.10,0.10); g.add(col);
  g.add(tubo([new THREE.Vector3(w*0.24,-h/2+0.12,0.10),
              new THREE.Vector3(w*0.34,-h/2+0.30,0.14),
              new THREE.Vector3(w*0.46,h/2-0.02,0.16)],0.036,MAT_TUBO));
  const tap=cil(0.055,0.055,0.05,MAT_LATON,16); tap.position.set(-w*0.30,-h/2-0.02,0.10); g.add(tap);
  return g;
}
function bBomba(){
  const g=new THREE.Group();
  /* La bomba de aceite de un motor es un GEROTOR: rotor interior de SEIS
     lóbulos calado en el eje y rotor exterior de SIETE, suelto y descentrado.
     Esa diferencia de un diente es toda la máquina: entre los dos quedan cámaras
     que crecen por el lado de la aspiración y se encogen por el de la impulsión,
     y de ahí que el caudal salga proporcional a las vueltas —VOLUMÉTRICA—, que
     es la hipótesis de la que cuelga todo el balance de caudales de aquí. Siete
     cilindros sueltos dentro de un tambor no cerraban ninguna cámara. */
  const MATG={acero:std({...brush,color:0x9aa3ad,metalness:1.0,roughness:0.30}),
    cromo:std({...brush,color:0xc6ccd4,metalness:1.0,roughness:0.22})};
  const ger=P3.gerotor(MATG,{dientes:6,rExt:0.215,ancho:0.13});
  g.add(ger);
  const E=ger.userData.exc;
  // El cuerpo, EN CORTE: la tapa se queda fuera para que se vean los dos
  // rotores engranando, que es lo único que hay que ver aquí dentro.
  const mCuerpo=std({...alu,color:0x7b828b,metalness:0.55,roughness:0.62});
  const car=new THREE.Mesh(P3.revolucion(
    [[0.218,-0.075],[0.262,-0.075],[0.262,0.075],[0.218,0.075]],{seg:36}),mCuerpo);
  car.rotation.x=Math.PI/2; car.position.x=E; car.castShadow=true; g.add(car);
  const fon=new THREE.Mesh(P3.revolucion(
    [[0,0],[0.262,0],[0.262,0.024],[0,0.024]],{seg:36}),mCuerpo);
  fon.rotation.x=-Math.PI/2; fon.position.set(E,0,-0.075); g.add(fon);
  // Las dos lumbreras, en riñón: la de aspiración donde las cámaras crecen y la
  // de impulsión donde se encogen. Por eso una bomba tiene un sentido de giro.
  for(const sy of [-1,1]){
    const ri=[];
    for(let i=0;i<=14;i++){ const a=sy*(0.35+i/14*2.1);
      ri.push([Math.cos(a)*0.185,Math.sin(a)*0.185]); }
    for(let i=14;i>=0;i--){ const a=sy*(0.35+i/14*2.1);
      ri.push([Math.cos(a)*0.115,Math.sin(a)*0.115]); }
    const lu=new THREE.Mesh(P3.extruido(ri,{espesor:0.020,bisel:0.004}),MAT.crom);
    lu.position.set(E,0,-0.084); g.add(lu);
  }
  g.userData.rotor=ger.userData.interior;
  g.userData.rotorExt=ger.userData.exterior;
  g.userData.relGer=ger.userData.relacion;
  const ej=cil(0.030,0.030,0.34,MAT.acero,14); ej.rotation.x=Math.PI/2; g.add(ej);
  g.add(tubo([new THREE.Vector3(0,-0.22,0),new THREE.Vector3(0,-0.40,0.04)],0.036,MAT_TUBO));
  g.add(tubo([new THREE.Vector3(0,0.22,0),new THREE.Vector3(0,0.38,0.02)],0.032,MAT_TUBO));
  return g;
}
function bLimitadora(){
  const g=new THREE.Group();
  /* El cuerpo, EN CORTE y con su ASIENTO CÓNICO: contra ese cono apoya el
     émbolo, y cuando la presión lo levanta el aceite se va al cárter. Ese
     asiento es la pieza; un tubo liso no explica contra qué cierra. */
  const cu=new THREE.Mesh(P3.revolucion(
    [[0.082,-0.17],[0.100,-0.17],[0.100,0.17],[0.082,0.17],
      [0.082,-0.09],[0.056,-0.13],[0.056,-0.17]],
    {seg:26,fase:Math.PI*0.275,arco:Math.PI*1.45}),corte(MAT_LATON));
  cu.castShadow=true; g.add(cu);
  const hex=new THREE.Mesh(P3.revolucion(
    [[0,0],[0.130,0],[0.130,0.05],[0,0.05]],{seg:6}),MAT_LATON);
  hex.position.y=-0.215; g.add(hex);
  // El émbolo, con su falda cónica: se separa del asiento cuando la limitadora
  // abre, y ésa es toda la explicación de por qué la presión deja de subir.
  const emb=new THREE.Mesh(P3.revolucion(
    [[0,0],[0.078,0.030],[0.078,0.090],[0,0.090]],{seg:24}),MAT.crom);
  emb.position.y=-0.10; g.add(emb);
  g.userData.embolo=emb;
  const mue=P3.muelle({acero:std({...brush,color:0xb8bec6,metalness:1.0,roughness:0.34})},
    {r:0.056, largo:0.17, vueltas:8, hilo:0.013});
  mue.position.y=0.055; g.add(mue);
  g.add(tubo([new THREE.Vector3(0,-0.24,0),new THREE.Vector3(0.02,-0.40,0.06)],0.030,MAT_TUBO));
  // El retorno al cárter: por aquí se va el caudal que la limitadora recorta.
  g.add(tubo([new THREE.Vector3(0.09,-0.10,0),new THREE.Vector3(0.28,-0.22,0.02),
              new THREE.Vector3(0.34,-0.52,0.02)],0.026,MAT_TUBO));
  return g;
}
function bFiltro(){
  const g=new THREE.Group();
  /* El bote, EN CORTE. Un cilindro azul cerrado no enseña qué hay dentro, y lo
     que hay dentro es de lo que va la pieza: el PAPEL PLISADO, que es toda la
     superficie de filtrado, y el tubo central perforado por donde sale el
     aceite ya limpio. Un filtro se tapa porque ese papel se llena, y sin verlo
     no se entiende por qué abre la derivación. */
  const mLata=std({...brush,color:0x2f4f7a,metalness:0.70,roughness:0.44});
  const bote=new THREE.Mesh(P3.revolucion(
    [[0.190,-0.21],[0.205,-0.21],[0.205,0.20],[0.190,0.20]],
    {seg:34,fase:Math.PI*0.29,arco:Math.PI*1.42}),corte(mLata));
  bote.castShadow=true; g.add(bote);
  const fondo=new THREE.Mesh(P3.revolucion(
    [[0,0.19],[0.205,0.19],[0.205,0.21],[0,0.21]],{seg:34}),mLata);
  g.add(fondo);
  const pap=P3.filtroPlisado({papel:std({color:0xd9d2bc,roughness:0.92,metalness:0.03})},
    {rExt:0.163,rInt:0.108,alto:0.33,pliegues:40});
  g.add(pap);
  // El tubo central perforado: por sus agujeros sale el aceite ya filtrado.
  const cen=new THREE.Mesh(P3.revolucion(
    [[0.088,-0.17],[0.100,-0.17],[0.100,0.17],[0.088,0.17]],{seg:24}),
    std({...brush,color:0x8b939d,metalness:0.9,roughness:0.42}));
  g.add(cen);
  for(const sy of [-1,0,1]) for(let i=0;i<8;i++){
    const a=(i/8+sy*0.06)*Math.PI*2;
    const h=cil(0.016,0.016,0.03,MAT.goma,8);
    h.rotation.z=Math.PI/2; h.rotation.y=-a;
    h.position.set(Math.cos(a)*0.094,sy*0.10,Math.sin(a)*0.094); g.add(h);
  }
  // Los dos platos que cierran el papel por arriba y por abajo.
  for(const sy of [-1,1]){
    const pl=new THREE.Mesh(P3.revolucion(
      [[0.100,0],[0.172,0],[0.172,0.016],[0.100,0.016]],{seg:30}),MAT.goma);
    pl.position.y=sy*0.172-(sy>0?0.016:0); g.add(pl);
  }
  const tap=cil(0.205,0.185,0.05,std({...brush,color:0x9aa3ad,metalness:1.0,roughness:0.40}),30);
  tap.position.y=-0.22; g.add(tap);
  const jun=new THREE.Mesh(new THREE.TorusGeometry(0.165,0.016,10,40),MAT.goma);
  jun.rotation.x=Math.PI/2; jun.position.y=-0.245; g.add(jun);
  // Antirretorno: la membrana que impide que el filtro se vacíe al cárter con
  // el motor parado. No cambia NADA en marcha; sólo se paga en cada arranque.
  const mem=new THREE.Mesh(new THREE.TorusGeometry(0.115,0.020,10,36),MAT.goma);
  mem.rotation.x=Math.PI/2; mem.position.y=-0.20; g.add(mem);
  g.userData.antidren=mem;
  // Derivación: si el elemento se tapa, esta válvula abre y el aceite pasa SIN
  // FILTRAR. Se ilumina cuando eso ocurre, porque no hay ninguna otra señal.
  const der=cil(0.045,0.045,0.10,std({color:0x3a4658,emissive:0x000000,
    emissiveIntensity:0.0,roughness:0.5,metalness:0.4}),16);
  der.rotation.z=Math.PI/2; der.position.set(0.19,-0.14,0.06); g.add(der);
  g.userData.deriv=der;
  return g;
}
function bRadiador(){
  const g=new THREE.Group();
  /* Un enfriador de aceite es un PANAL: el aceite va por los tubos y el aire
     pasa entre las aletas. Once planchas apiladas delante de un bloque macizo
     daban la silueta, pero no dejaban ver por dónde pasa el aire —que es de lo
     que depende que enfríe—. */
  const pan=P3.panal({aluminio:std({...brush,color:0x8b939d,roughness:0.58})},
    {ancho:0.60, alto:0.42, prof:0.11, tubos:11, onda:9,
      colorTubo:0x3a4550, colorAleta:0x8b939d});
  g.add(pan);
  for(const sx of [-1,1]){
    const lr=roundedBox(0.035,0.46,0.12,std({...brush,color:0x3a4550,roughness:0.66}),0.16);
    lr.position.x=sx*0.305; g.add(lr);
  }
  for(const sy of [-1,1]){
    const co=cil(0.045,0.045,0.10,MAT_LATON,16);
    co.rotation.z=Math.PI/2; co.position.set(-0.34,sy*0.14,0); g.add(co);
  }
  return g;
}
function bGaleria(){
  const e=MQ(), D=dims(e), g=new THREE.Group();
  const L=D.luz+1.00*D.B;
  const gal=cil(0.052,0.052,L,MAT_TUBO,20); gal.rotation.z=Math.PI/2; g.add(gal);
  const tapa=cil(0.062,0.062,0.05,MAT_LATON,16);
  tapa.rotation.z=Math.PI/2; tapa.position.x=L/2; g.add(tapa);
  // Un taladro por bancada: el aceite entra al cojinete por aquí y sale por los
  // dos costados. Son la razón de que el caudal dependa de la holgura al cubo.
  for(let i=0;i<e.nCoj;i++){
    const x=xBancada(i,D,e);
    const t=cil(0.024,0.024,0.34*D.B,MAT_TUBO,12);
    t.position.set(x,-0.17*D.B,0); g.add(t);
    const bo=cil(0.034,0.028,0.04,MAT_LATON,14);
    bo.position.set(x,-0.34*D.B,0); g.add(bo);
  }
  return g;
}
function bManocontacto(){
  const g=new THREE.Group();
  const cu=cil(0.062,0.062,0.16,MAT_LATON,20); g.add(cu);
  const hex=cil(0.082,0.082,0.05,MAT_LATON,6); hex.position.y=-0.09; g.add(hex);

  lam.position.set(0.28,0.20,0.04); g.add(lam);
  g.userData.lampara=lam;

  sop.rotation.z=-0.9; sop.position.set(0.16,0.10,0.04); g.add(sop);

}

const Y0=0.86;                                   // altura de la raíz del motor
function ancla(){
  const e=MQ(), D=dims(e);
  const derecha=D.anchoTot/2, izq=-D.anchoTot/2;
  return {
    carter:   new THREE.Vector3(0, Y0+YC-0.34*D.B-D.hCar/2, 0),
    bomba:    new THREE.Vector3(derecha+0.30, Y0+YC-0.10, 0.34),
    limitadora:new THREE.Vector3(derecha+0.30, Y0+YC+0.46, 0.34),
    filtro:   new THREE.Vector3(derecha-0.10, Y0+YC+0.30, 0.88),
    radiador: new THREE.Vector3(derecha-1.16, Y0+YC+0.64, 1.00),
    galeria:  new THREE.Vector3(0, Y0+D.yGal, 0.30*D.B),
    manocontacto:new THREE.Vector3(izq+0.34, Y0+D.yDeck+0.16, 0.34),
  };
}

const STAGE_S=0.60;

const BENCH={cx:0.0,cz:4.55,top:0.90,cols:4,dx:1.00,dz:1.02,pedH:0.24};
const NFIL=Math.ceil(PARTS.length/BENCH.cols), PED_Y=BENCH.top+BENCH.pedH;
function pedXZ(i){
  const c=i%BENCH.cols, f=Math.floor(i/BENCH.cols);
  return [BENCH.cx+(c-(BENCH.cols-1)/2)*BENCH.dx, BENCH.cz+(f-(NFIL-1)/2)*BENCH.dz];
}
const peds=[];

let fantasmas=[], moviles=[], tweens=[], montadas=[];
let TH=0, animT=0;
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
let toastT=null;
function showToast(html,ms){
  const t=el('toast'); t.innerHTML=html; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms||3800);

function limpiaKit(){
  [...fantasmas,...moviles,...montadas].forEach(o=>borra(o));
  fantasmas=[]; moviles=[]; montadas=[]; tweens=[]; ASM.sel=null;
  RIG.piezas={}; RIG.aceite=null; RIG.lampara=null; RIG.aguja=null;
  RIG.rotor=null; RIG.deriv=null; RIG.antidren=null; RIG.embolo=null; RIG.aceiteH=0;
}
function haz(p){ const g=p.build(); centra(g); g.userData.pid=p.k; return g; }
// Registra los mandos internos de la pieza recién montada: la aguja, la luz, el
// nivel de aceite y las dos válvulas del filtro. Sin esto la pieza sería un
// adorno; con esto, la pieza es lo que el modelo dice que hace.
function registra(o){
  const k=o.userData.id, u=o.userData;
  RIG.piezas[k]=o;
  if(k==='carter'){ RIG.aceite=u.aceite; RIG.aceiteH=u.aceiteH; }
  if(k==='manocontacto'){ RIG.aguja=u.dial; RIG.lampara=u.lampara; }
  if(k==='bomba'){ RIG.rotor=u.rotor; RIG.rotorExt=u.rotorExt; RIG.relGer=u.relGer; }
  if(k==='filtro'){ RIG.deriv=u.deriv; RIG.antidren=u.antidren; }
  if(k==='limitadora') RIG.embolo=u.embolo;
}
function reposiciona(){
  const A=ancla();
  montadas.forEach(o=>{
    if(tweens.some(w=>w.o===o)) return;
    o.position.copy(A[o.userData.id]);
  });
  fantasmas.forEach(f=>{
    f.position.copy(A[f.userData.id]);
    f.userData.home=A[f.userData.id].clone();
  });
  armaCircuito();
}
function montaKit(){
  limpiaKit();
  PARTS.forEach(p=>{
    const g=haz(p); g.userData.kind='placed'; g.userData.id=p.k;
    scene.add(g); montadas.push(g); ASM.done.add(p.k); registra(g);
  });
  peds.forEach((_,i)=>pedHecho(i));
  reposiciona();
}
function initAssembly(){
  limpiaKit(); ASM.done.clear();
  PARTS.forEach((p,i)=>{
    const g=haz(p);
    g.scale.setScalar(STAGE_S);
    const [x,z]=pedXZ(i);
    const baseY=PED_Y+0.03-g.userData.minY*STAGE_S;
    g.position.set(x,baseY,z);
    g.userData.kind='part'; g.userData.id=p.k;
    g.userData.baseY=baseY; g.userData.fase=i*1.7; g.userData.lift=0;
    scene.add(g); moviles.push(g);

    const f=haz(p), gm=nuevaFantasma();
    f.traverse(o=>{ if(o.isMesh){ o.material=gm; o.castShadow=false; o.receiveShadow=false; }
                    if(o.isSprite) o.visible=false; });
    f.userData.kind='slot'; f.userData.id=p.k; f.userData.gm=gm; f.userData.shake=0;
    scene.add(f); fantasmas.push(f);
    pedLibre(i);
  });
  reposiciona(); muestraHueco(null);
  G.simUnlocked=false; G.resuelto=false;
  S.setCinematicIdle(false);
  S.moveTo([7.2,4.9,10.8],[0.6,1.95,0.30],1.3);
}
function muestraHueco(id){
  fantasmas.forEach(f=>{ f.visible=!ASM.done.has(f.userData.id)&&(!id||f.userData.id===id); });
}
function selPieza(o){
  if(ASM.sel===o){ deselec(); return; }

  muestraHueco(o.userData.id); synth.beep(660,0.06,0.04);
  showToast('<b>'+PART[o.userData.id].rot+'</b> en la mano. Ahora toca su <b>hueco luminoso</b> en el motor.',2600);
}
function deselec(){ if(ASM.sel){ ASM.sel.userData.lift=0; ASM.sel=null; } muestraHueco(null); }
function colocaPieza(o,f){
  const p=PART[o.userData.id], i=ORDEN.indexOf(p.k);
  f.visible=false;
  tweens.push({o, p0:o.position.clone(), p1:posDe(p.k).clone(),
    s0:o.scale.x, s1:1, t:0, dur:0.85,
    fin:()=>{ o.userData.kind='placed'; o.userData.lift=0; registra(o); armaCircuito(); }});
  ASM.done.add(p.k); ASM.sel=null; pedHecho(i);
  montadas.push(o); moviles=moviles.filter(m=>m!==o);
  synth.beep(880,0.07,0.05); setTimeout(()=>synth.beep(1174,0.09,0.05),90);
  showToast('✔ <b>'+p.rot+'</b> montado. '+p.nota,4400);

function finEnsamble(){
  G.simUnlocked=true; syncCtrlbar();

function autoAssemble(){
  const pend=PARTS.filter(p=>!ASM.done.has(p.k));
  pend.forEach((p,n)=>setTimeout(()=>{
    const o=moviles.find(m=>m.userData.id===p.k), f=fantasmas.find(x=>x.userData.id===p.k);
    if(o&&f&&!ASM.done.has(p.k)) colocaPieza(o,f);
  },320+n*640));

const CIRC={curva:null, gotas:[], n:26, u:0};

// ------------------------------------------------------------- las conducciones
// Cada tramo une DOS piezas y sólo existe si las dos están montadas: así el
// circuito se ve crecer, y mientras falte un tramo se ve exactamente por dónde
// está cortado. La ruta completa es además la trayectoria de las gotas.
const TRAMOS=[
  ['carter','bomba'], ['bomba','limitadora'], ['limitadora','filtro'],
  ['filtro','radiador'], ['radiador','galeria'], ['galeria','manocontacto'],
];
let mangueras=[];
function ruta(a,b){
  const A=ancla(), p=A[a].clone(), q=A[b].clone();
  const m=p.clone().lerp(q,0.5);
  m.z+=0.26; m.y+=0.10;
  return [p,m,q];
}
function armaCircuito(){
  mangueras.forEach(m=>borra(m)); mangueras=[];
  TRAMOS.forEach(([a,b])=>{
    if(!ASM.done.has(a)||!ASM.done.has(b)) return;
    const t=tubo(ruta(a,b),0.034,MAT_TUBO);
    scene.add(t); mangueras.push(t);
  });
  // La trayectoria de las gotas: cárter → bomba → limitadora → filtro →
  // radiador → galería, y de la galería otra vez al cárter por los cojinetes.
  const A=ancla(), pts=[];
  ['carter','bomba','limitadora','filtro','radiador','galeria'].forEach((k,i,arr)=>{
    if(i>0) pts.push(...ruta(arr[i-1],k).slice(1,2));
    pts.push(A[k].clone());
  });
  pts.push(new THREE.Vector3(A.galeria.x-0.20,A.galeria.y-0.30,A.galeria.z));
  pts.push(new THREE.Vector3(A.carter.x,A.carter.y+0.20,A.carter.z+0.16));
  CIRC.curva=new THREE.CatmullRomCurve3(pts,true);
}
function armaGotas(){
  CIRC.gotas.forEach(g=>borra(g)); CIRC.gotas=[];
  for(let i=0;i<CIRC.n;i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.052,12,9),MAT_ACEITE.clone());
    m.visible=false; scene.add(m); CIRC.gotas.push(m);
  }
}

// ================================ T3c · EL ACEITE EN MOVIMIENTO Y EL COJINETE
// Nada de lo que se mueve aquí es decorativo. La velocidad de las gotas sale
// del caudal que calcula el motor sellado, su color dice si el aceite está
// filtrado, la aguja lee la presión de galería, la luz se enciende con el mismo
// criterio que el manocontacto y el cojinete ampliado dibuja la excentricidad
// que resuelve la ecuación de cojinete corto.

// FACTORES DE ESCENA, declarados: el cigüeñal gira a FACTOR_GIRO veces su
// velocidad real —a 2 000 rpm reales serían 33 vueltas por segundo, un borrón—
// y las gotas viajan a FACTOR_GOTA vueltas de circuito por segundo y litro por
// minuto. Ninguno de los dos toca una sola cifra: el régimen que entra en el
// modelo es el real, no el de la pantalla.
const FACTOR_GIRO=0.030;
const FACTOR_GOTA=0.055;

function mueveAgujas(){
  if(!G.simUnlocked) return;
  const e=MQ(), s=EST();
  if(RIG.aguja) RIG.aguja.userData.setFrac(s.p/escalaMan(e));
  if(RIG.lampara){
    // La luz roja parpadea sólo si está encendida. Una luz que late apagada
    // sería un adorno; ésta es la única señal que tiene el conductor.
    const on=s.alarma?1:0;
    RIG.lampara.material.emissiveIntensity=on*(1.15+0.55*Math.sin(animT*7.5));
    RIG.lampara.material.color.setHex(on?0xff3b3b:0x4a1b1b);
  }
  if(RIG.deriv){
    const abierta=!s.filtrado;
    RIG.deriv.material.emissive.setHex(abierta?0xff6b6b:0x000000);
    RIG.deriv.material.emissiveIntensity=abierta?1.2:0.0;
  }
  if(RIG.antidren){
    const roto=(FALLA()==='antidrenaje');
    RIG.antidren.material.emissive.setHex(roto?0xE9C46A:0x000000);
    RIG.antidren.material.emissiveIntensity=roto?0.9:0.0;
  }
  // El émbolo de la limitadora se levanta cuando la válvula abre: eso es lo que
  // explica que la presión deje de subir aunque suban las vueltas.
  if(RIG.embolo) RIG.embolo.position.y=-0.06+(s.abreLim?0.055:0);
  // Nivel del cárter. El modelo no simula la altura del aceite: declara la
  // fracción de aire que la bomba llega a aspirar cuando el nivel está bajo.
  // El dibujo se limita a decir cuál de los dos casos está montado.
  if(RIG.aceite){
    const u=RIG.aceite.userData;
    if(u.y0===undefined) u.y0=RIG.aceite.position.y;
    const bajo=(FALLA()==='nivelBajo');
    RIG.aceite.scale.y=bajo?0.45:1.0;
    // Al encoger en Y la caja mengua respecto de su CENTRO: hay que bajarla la
    // mitad de lo que ha menguado o el aceite queda flotando sobre el fondo.
    RIG.aceite.position.y=u.y0-(bajo?RIG.aceiteH*0.275:0);
  }
  // Cada casquillo se tiñe con el régimen de SU bancada: no hay un color medio.
  s.cojinetes.forEach((c,i)=>{
    const m=RIG.casq[i]; if(!m) return;
    m.material.color.setHex(COL3_REG[c.regimen]);
    m.material.emissive.setHex(COL3_REG[c.regimen]);
    m.material.emissiveIntensity=c.regimen==='hidrodinamico'?0.18:0.55;
  });
}

// ------------------------------------------------------------ gotas de aceite
function mueveGotas(dt){
  const hay=G.simUnlocked&&CIRC.curva;
  CIRC.gotas.forEach(g=>{ g.visible=!!hay; });
  if(!hay) return;
  const s=EST();
  const sucio=!s.filtrado;
  CIRC.u=(CIRC.u+dt*s.Q*FACTOR_GOTA)%1;
  CIRC.gotas.forEach((g,i)=>{
    const u=(CIRC.u+i/CIRC.gotas.length)%1;
    g.position.copy(CIRC.curva.getPoint(u));
    const col=sucio?0x6b4a12:0xE0A33E;
    g.material.color.setHex(col); g.material.emissive.setHex(col);
    g.material.emissiveIntensity=sucio?0.35:0.60;
  });
}

// -------------------------------------------------------- el cojinete ampliado
function mueveAmpliado(){
  const g=RIG.amp; if(!g) return;
  g.visible=(G.modo==='pelicula')&&G.simUnlocked;
  if(!g.visible) return;
  const e=MQ(), s=EST(), c=s.peor;
  // La holgura dibujada es una fracción FIJA del radio del muñón; la real es la
  // del arquetipo. El cociente ES el factor de ampliación, y se publica en
  // pantalla para que nadie confunda el dibujo con una medida.
  const cDib=AMP.R*AMP.hol;
  AMP.factor=AMP.hol/(c.c/(e.dMuñ/2000));
  AMP.mun.position.y=-c.eps*cDib;
  AMP.mun.rotation.z=-TH*DEG;
  const col=COL3_REG[c.regimen];
  AMP.peli.material.color.setHex(col);
  AMP.peli.material.emissive.setHex(col);
  AMP.peli.material.emissiveIntensity=c.regimen==='hidrodinamico'?0.55:0.95;
  AMP.etReg.userData.set(ROT_REG[c.regimen]+' · λ '+num(c.lam,2),COL_REG[c.regimen]);
  AMP.etH.userData.set('h mínima '+um(c.h*1e6)+' · ε '+num(c.eps,3),'#E0A33E');
  AMP.etF.userData.set('holgura dibujada ×'+num(AMP.factor,0)+' · real '+um(c.c*1e6),'#8c98a9');
}

// ------------------------------------------------------------------- el latido
// Contador de fotogramas. No es depuración: es la única manera de que una
// prueba sepa que el bucle ha corrido, porque en un navegador sin GPU real la
// escena va a unos pocos fotogramas por segundo y esperar por reloj miente.
let PINTADAS=0;
function pinta3D(dt){
  animT+=dt; PINTADAS++;
  const t=animT;
  for(let i=tweens.length-1;i>=0;i--){
    const w=tweens[i]; w.t+=dt;
    const u=clamp(w.t/w.dur,0,1), q=ease(u);
    w.o.position.lerpVectors(w.p0,w.p1,q);
    w.o.position.y+=Math.sin(q*Math.PI)*0.42;
    const sc=w.s0+(w.s1-w.s0)*q; w.o.scale.setScalar(sc);
    if(u>=1){ w.o.position.copy(w.p1); w.o.scale.setScalar(w.s1);
      w.o.rotation.set(0,0,0); w.fin&&w.fin(); tweens.splice(i,1); }
  }
  moviles.forEach(o=>{
    if(o.userData.kind!=='part') return;
    const d=o.userData;
    o.position.y=d.baseY+Math.sin(t*1.6+d.fase)*0.02+d.lift;
    o.rotation.y=Math.sin(t*0.5+d.fase)*0.12;
  });
  fantasmas.forEach(f=>{
    const d=f.userData;
    if(d.gm) d.gm.opacity=0.22+0.13*Math.sin(t*3.2);
    if(d.shake>0){ d.shake=Math.max(0,d.shake-dt*1.7);
      f.position.x=(d.home?d.home.x:f.position.x)+Math.sin(t*48)*d.shake*0.04; }
  });
  // El motor gira siempre que el circuito esté montado: esta práctica se hace
  // con el motor en marcha, salvo el ensayo de arranque, que es otro modo.
  if(G.simUnlocked){
    TH=(TH+G.rpm*6*FACTOR_GIRO*dt)%720;
    if(RIG.cigu) RIG.cigu.rotation.x=-TH*DEG;
    if(RIG.rotor) RIG.rotor.rotation.z=-TH*DEG*MQ().relBomba;
    // El rotor exterior va MÁS DESPACIO, en la relación que impone el engrane:
    // seis dientes contra siete. Si girase igual no habría cámara que cambiase
    // de volumen y la bomba no daría caudal.
    if(RIG.rotorExt) RIG.rotorExt.rotation.z=-TH*DEG*MQ().relBomba*RIG.relGer;
  }
  mueveAgujas();
  mueveGotas(dt);
  mueveAmpliado();
}

// Los mandos se levantan desde el estado. Un mando que no puede hacer nada en el
// modo actual no se dibuja: un botón pulsable que no cambia nada enseña a
// desconfiar de la interfaz.
// Los botones de una barra se reparten el ancho a partes iguales, así que trece
// en una sola fila salen ilegibles y el último se sale del panel. Se cortan en
// varias barras de altura pareja, calculadas del número de opciones.
function fila(rot,attr,ops,cur){
  const filas=Math.ceil(ops.length/5), porFila=Math.ceil(ops.length/filas);
  let h='<div class="gl" style="margin:9px 0 4px"><span>'+rot+'</span></div>';
  for(let i=0;i<ops.length;i+=porFila){
    h+='<div class="modebar">'+ops.slice(i,i+porFila).map(o=>
      '<button class="b'+(String(o[0])===String(cur)?' on':'')+'" '+attr+'="'+o[0]+'">'+o[1]+'</button>'
    ).join('')+'</div>';
  }
  return h;
}

    h+=fila('Régimen del motor','data-rpm',
      rpmOps().map(r=>[r,num(r,0)+(r===e.ralenti?'*':'')]),G.rpm);
    h+=fila('Par pedido','data-cg',CARGA_OPS.map(c=>[c[0],c[1]]),G.carga);
  }
  if(G.modo==='arranque')
    h+=fila('Temperatura del ensayo','data-ta',T_ARR.map(t=>[t,num(t,0)+' °C']),G.Tarr);
  el('ctrlbar').innerHTML=h;
}
function syncCtrlbar(){
  MODES.forEach(m=>{
    const b=el('m_'+m); if(!b) return;
    const viva=(m==='ensamble')||G.simUnlocked;
    b.disabled=!viva; b.style.opacity=viva?'1':'0.45';
    b.classList.toggle('on',m===G.modo);
  });
  const rt=(G.modo==='reto');
  el('retoTitle').style.display=rt?'':'none';
  el('retoBox').style.display=rt?'':'none';
  el('p_mode').textContent=G.simUnlocked?('· '+MODE_META[G.modo].n):'· circuito incompleto';
  el('btnNew').textContent=rt?'🔀 Otro motor averiado'
    :(G.modo==='ensamble'?'🔁 Volver a montar':'🔀 Otro caso');
  el('btnAuto').disabled=autoRunning;
  buildControls();
}

// ---------------------------------------------------------------- telemetría
const gl=(l,v,c)=>'<div class="g"><div class="gl"><span>'+l+'</span><b'+(c?' class="'+c+'"':'')+'>'+v+'</b></div></div>';
function pintaTele(){
  if(!G.simUnlocked){
    el('tele').innerHTML=gl('Piezas montadas',ASM.done.size+' / '+PARTS.length,
      ASM.done.size===PARTS.length?'good':'warn')+
      gl('Siguiente','toca una pieza del banco','');
    return;
  }
  const e=MQ(), s=EST(), V=veredicto();
  let h='';
  // En el diagnóstico a ciegas sólo se publica lo que el alumno ha COMPRADO.
  // El aceite del cárter delata los dos escenarios de aceite equivocado, la
  // fila de filtrado delata el filtro obstruido y el veredicto los delata
  // todos: publicarlos aquí sería regalar la respuesta.
  if(G.modo==='reto'){
    // El motor y el «oculto» ya los escribe el panel justo encima: repetirlos
    // aquí sólo gasta las cuatro líneas que tiene la telemetría.
    h+=gl('Observaciones compradas',Object.keys(RETO.tomadas).length+' / '+OBS.length,
      Object.keys(RETO.tomadas).length?'':'warn');
    h+=gl('Familia elegida',RETO.eleccion||'ninguna todavía',RETO.eleccion?'':'warn');
    if(RETO.veredicto) h+=gl('Diagnóstico entregado',RETO.veredicto.ok?'acertado':'fallado',
      RETO.veredicto.ok?'good':'bad');
    el('tele').innerHTML=h;
    return;
  }
  h+=gl('Aceite en el cárter',ACEITES[aceiteEfectivo()].corto+(aceiteForzado()?' (impuesto)':''),
    aceiteForzado()?'warn':'');
  if(G.modo==='viscosidad'){
    const j=J300(), fallos=['kv100','hths','ccs','mrv'].filter(k=>j[k]&&!j[k].ok);
    h+=gl('Viscosidad a '+num(G.T,0)+' °C',cSt(s.nu)+' · '+mPas(s.mu*1000,1),'');
    h+=gl('Cumple su grado J300',fallos.length?('no: '+fallos.join(', ')):'sí',fallos.length?'bad':'good');
    h+=gl('HTHS a 150 °C',num(ACEITES[aceiteEfectivo()].hths,2)+NBSP+'mPa·s',
      j.hths.ok?'good':'bad');
  }
  if(G.modo==='presion'||G.modo==='pelicula'){
    h+=gl('Presión de galería',bar(s.p),s.alarma?'bad':(s.abreLim?'warn':'good'));
    h+=gl('Mínimo del fabricante',bar(e.pAlarma,2),'warn');
    h+=gl('Caudal por la galería',num(s.Q,2)+NBSP+'L/min','');
    h+=gl('Limitadora',s.abreLim?'abierta, recorta':'cerrada, no recorta',s.abreLim?'warn':'');
  }
  if(G.modo==='pelicula'){
    h+=gl('h mínima (bancada '+(s.peor.i+1)+')',um(s.peor.h*1e6),
      s.peor.lam<1?'bad':(s.peor.lam<3?'warn':'good'));
    h+=gl('Espesor específico λ',num(s.peor.lam,2)+' · '+ROT_REG[s.peor.regimen],
      s.peor.lam<1?'bad':(s.peor.lam<3?'warn':'good'));
    h+=gl('Excentricidad ε',num(s.peor.eps,3),s.peor.extrapola?'warn':'');
    h+=gl('Carga de diseño del cojinete',num(s.pEspDis,1)+NBSP+'MPa de '+num(s.pEsp,1)+' de pico','');
  }
  if(G.modo==='arranque'){
    const r=ARR(), VA=veredictoArranque();
    h+=gl('Viscosidad a '+num(G.Tarr,0)+' °C',mPas(r.eta,0),'');
    h+=gl('Régimen de arranque',num(r.n,0)+NBSP+'rpm (mín '+num(e.nMinArr,0)+')',
      r.arranca?'good':'bad');
    // «Bombeable» NO es «ceba»: es una propiedad del aceite a esa temperatura.
    // Un motor que no gira tiene el aceite perfectamente bombeable y aun así no
    // ceba nada, y llamar a las dos cosas igual convierte la fila en una
    // contradicción en pantalla.
    h+=gl('¿El aceite es bombeable?',r.bombea?'sí':'NO: gelificado',r.bombea?'good':'bad');
    h+=gl('Vueltas en seco',isFinite(r.vueltasSeco)?num(r.vueltasSeco,1)+' (máx '+num(e.vueltasMax,0)+')'
      :(r.arranca?'nunca ceba: gira EN SECO':'no llega a girar'),
      isFinite(r.vueltasSeco)?(r.vueltasSeco>e.vueltasMax?'warn':'good'):'bad');
    h+=gl('Veredicto del ensayo',VA.rot,VA.ok?'good':'bad');
  }
  if(G.modo==='censo'){
    const C=CENSO(), N=ESCEN_KEYS.length;
    const min=C.filter(x=>x.resueltos===N).sort((a,b)=>a.sub.length-b.sub.length)[0];
    const tal=C.find(x=>x.sub.length===OBS.filter(o=>o.taller).length&&x.sub.every(o=>o.taller));
    h+=gl('Escenarios en juego',String(N),'');
    h+=gl('Sólo con lo de taller',tal.resueltos+' / '+N,tal.resueltos===N?'good':'bad');
    h+=gl('Observaciones mínimas',min?String(min.sub.length):'—',min?'good':'bad');
  }
  h+=gl('Aceite filtrado',s.filtrado?'sí':'NO: derivación abierta',s.filtrado?'good':'bad');
  h+=gl('Veredicto con el motor en marcha',
    V.malo?'hay algo que corregir':(G.esc==='sano'?'todo en orden':'aquí no se nota nada'),
    V.malo?'bad':(G.esc==='sano'?'good':'warn'));
  el('tele').innerHTML=h;
}

// ------------------------------------------------------------------ informe
// El informe dice el veredicto Y por qué criterio, porque el laboratorio
// demuestra que los criterios no son equivalentes.
function pintaInforme(){
  const R=el('report'), e=MQ();
  if(!G.simUnlocked){
    R.innerHTML='<span class="mono">Faltan '+(PARTS.length-ASM.done.size)+
      ' piezas del circuito.</span> Toca una pieza del banco y luego su hueco luminoso en el motor.';
    return;
  }
  if(G.modo==='reto'){ pintaReto(); return; }
  const s=EST(), V=veredicto(), VA=veredictoArranque();
  const parte=[];
  if(!V.presion) parte.push('<b class="bad">presión por debajo del mínimo:</b> '+bar(s.p)+
    ' contra '+bar(e.pAlarma,2));
  if(!V.pelicula) parte.push('<b class="bad">régimen límite en la bancada '+(s.peor.i+1)+':</b> λ = '+
    num(s.peor.lam,2)+', hay contacto metal-metal');
  else if(!V.plena) parte.push('<b class="warn">régimen mixto en la bancada '+(s.peor.i+1)+':</b> λ = '+
    num(s.peor.lam,2)+', por debajo de la película completa');
  if(!V.filtrado) parte.push('<b class="bad">el aceite circula sin filtrar</b> (la derivación está abierta)');
  if(V.revienta) parte.push('<b class="bad">la presión pasa de lo que aguanta el filtro</b> ('+
    bar(e.pMaxFiltro,1)+')');

  let h;
  if(!parte.length){
    // Con una avería montada, «en orden» sería falso: lo que dice el modelo es
    // que en ESTE punto de trabajo no se nota. Esa distinción es la práctica.
    const sano=G.esc==='sano';
    h=(sano?'<b class="good">Circuito y cojinetes en orden.</b> '
           :'<b class="warn">En este punto de trabajo no se nota nada.</b> ')+
      bar(s.p)+' de galería, λ = '+
      num(s.peor.lam,2)+' en la peor bancada y '+num(s.Q,2)+NBSP+'L/min de caudal. '+
      (sano?'Conviene fijarse en que estas dos cifras no se implican: sube la temperatura y verás cuál cae antes. '
           :'Hay una avería montada y ninguna de las cuatro medidas se ha movido: cambia el régimen, la temperatura o el par pedido, o mira el ensayo de arranque, antes de dar el motor por bueno. ')+
      'Escenario montado: <b>'+ESCEN[G.esc].rot+'</b> — '+ESCEN[G.esc].clave+'.';
  }else{
    h='<b>Hallazgos:</b> '+parte.join(' · ')+'. ';
    // El criterio que se queda ciego, cuando lo hay: es el corazón de la práctica.
    const ciegos=[];
    if(V.presion&&!V.plena) ciegos.push('el manómetro NO lo ve: marca '+bar(s.p)+
      ' y la luz está apagada');
    if(!V.presion&&V.plena) ciegos.push('la película aguanta pese a la alarma: lo que ha caído es la resistencia del CIRCUITO, no la lubricación del cojinete');
    if(!V.filtrado) ciegos.push('el filtro obstruido no mueve el manómetro ni un dígito: sólo se paga en desgaste');
    if(!VA.ok&&V.presion&&V.plena) ciegos.push('con el motor caliente y en marcha no se ve nada: el ensayo de arranque a '+num(G.Tarr,0)+' °C sí ('+VA.rot+')');
    if(ciegos.length) h+='<span class="warn">Y esto es lo que hay que llevarse: '+ciegos.join('; ')+'.</span> ';
    h+='Escenario montado: <b>'+ESCEN[G.esc].rot+'</b> — '+ESCEN[G.esc].clave+'.';
  }
  // El arranque se informa aparte, y sólo en su modo: es otra pregunta.
  if(G.modo==='arranque') h+=' <b>Ensayo de arranque a '+num(G.Tarr,0)+' °C:</b> '+
    (VA.ok?'<b class="good">'+VA.rot+'</b>.':'<b class="bad">'+VA.rot+'</b>.')+
    ' Esto se juzga aparte de la presión: el motor en marcha y el motor arrancando son dos preguntas distintas.';
  if(s.extrapola) h+=' <span class="warn">Aviso del modelo: ε &gt; 0,90 en alguna bancada, '+
    'donde la solución de cojinete corto ya extrapola. La cifra sigue siendo conservadora, pero es una extrapolación.</span>';
  R.innerHTML=h;
}

// ------------------------------------------------------------------- modos
function afterEdit(){
  invalida();
  if(!rpmOps().includes(G.rpm)) G.rpm=2000;
  pintaTablero(); pintaTele(); pintaInforme(); syncCtrlbar();
}
function setMode(m){
  if(m!=='ensamble'&&!G.simUnlocked){
    showToast('Primero hay que <b>montar el circuito</b>.',2400);
    return;
  }
  if(G.modo==='ensamble'&&m!=='ensamble'&&ASM.done.size<PARTS.length){
    showToast('Faltan piezas por montar.',2200); return;
  }
  G.modo=m;
  // Volver a la vista de montaje NO desmonta lo ya montado. Si lo hiciera, mirar
  // cómo quedó el circuito costaría rehacerlo entero, y el alumno aprendería a
  // no volver nunca. Para practicar el montaje otra vez está «Volver a montar».
  if(m==='ensamble'){ if(ASM.done.size<PARTS.length) initAssembly(); }
  else if(ASM.done.size<PARTS.length){ montaKit(); }
  if(m==='reto') armaReto();
  pintaHUD(); afterEdit(); refrescaPregunta();
  // Encuadres. Los tres modos cuya materia está en el pizarrón van al pizarrón;
  // los dos que hablan del circuito montado van a un plano que coge el motor Y
  // el pizarrón a la vez, porque las gráficas y la telemetría se leen juntas; y
  // película va al cojinete ampliado, que es de lo que trata ese modo.
  if(m==='viscosidad'||m==='censo'){ const t=camTablero(); S.moveTo(t[0],t[1],1.1); return; }
  if(m==='reto'){ const t=camTablero(6.4); S.moveTo(t[0],t[1],1.1); return; }
  if(m==='pelicula'){ S.moveTo([AMP.x+0.10,AMP.y+0.16,AMP.z+3.15],[AMP.x,AMP.y-0.10,AMP.z],1.1); return; }
  if(m==='ensamble'){ const k=G.k||1;
    S.moveTo([7.2*k,4.9*Math.min(k,1.5),10.8*k],[0.6*k,1.95,0.30],1.2); return; }
  // Presion y arranque: la gráfica hay que LEERLA, así que se va al pizarrón,
  // pero corrido para que el motor —con su manómetro, su luz y el color del
  // aceite— entre por la derecha. Un encuadre que coge las dos cosas de lejos
  // deja la gráfica del tamaño de un sello y no sirve para nada.
  const d=8.2+1.5*((G.k||1)-1);
  const t=camTablero(d,0.321*d-1.75); S.moveTo(t[0],t[1],1.1);
}

// ============================== T4b · RETO, CUESTIONARIO, RECORRIDO Y ARRANQUE
// Las familias que se pueden diagnosticar son exactamente las `clave` que
// declara el motor sellado: si mañana se añade un escenario con una clave nueva,
// aparece sola en la lista en vez de quedarse fuera sin avisar.
const FAMILIAS=[...new Set(ESCEN_KEYS.map(k=>ESCEN[k].clave))];
const RETO={caso:null, tomadas:{}, eleccion:null, veredicto:null, pistas:0};

function barajaEn(a){                       // Fisher-Yates, para que la posición
  for(let i=a.length-1;i>0;i--){            // de la respuesta no sea la pista
    const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function armaReto(){
  const casos=casosReto();
  RETO.caso=casos[Math.floor(Math.random()*casos.length)];
  G.esc=RETO.caso;
  // El motor entra al taller con el aceite que pide su fabricante. Si la avería
  // es precisamente el aceite, el escenario lo impone y eso forma parte del caso.
  G.aceite=MQ().aceiteOEM;
  RETO.tomadas={}; RETO.eleccion=null; RETO.veredicto=null; RETO.pistas=0;
  invalida(); pintaObsReto(); pintaDxReto();
}
// Valor legible de cada observación. Sale del motor sellado, con la misma
// resolución que declara OBS: comprar el instrumento no da precisión infinita.
function valorObs(k){
  const e=MQ(), L=LECT(), o=OBS.find(x=>x.k===k);
  if(k==='luz') return L.alarmaEn.length
    ? 'se enciende en: '+L.alarmaEn.map(x=>PUNTOS.find(p=>p.k===x).rot).join(' y ')
    : 'no se enciende en ningún punto';
  if(k==='vueltas') return isFinite(L.arr.vueltasSeco)
    ? num(cuant(L.arr.vueltasSeco,o.res),1)+' vueltas en seco'
    : 'no llega a cebar';
  if(k==='visc'){
    const s=estado(e,{aceite:L.aceite,T:100,rpm:e.ralenti,falla:ESCEN[L.esc].falla});
    return num(cuant(s.nu,o.res),1)+NBSP+'mm²/s a 100 °C'+(s.filtrado?', limpio':', CON PARTÍCULAS');
  }
  if(k==='holgura'){
    const F=fisicaDe(e,ESCEN[L.esc].falla,ACEITES[L.aceite],100);
    return F.hol.map(h=>num(cuant(h*2000,o.res),3)).join(' / ')+NBSP+'mm';
  }
  return bar(cuant(L[k],o.res),2);
}
function mide(k){
  if(G.modo!=='reto'||RETO.tomadas[k]) return;
  RETO.tomadas[k]=valorObs(k);
  synth.beep(560,0.06,0.04);
  pintaObsReto(); pintaReto(); pintaTablero();
}
function pintaObsReto(){
  el('obsreto').innerHTML=OBS.map(o=>
    '<button class="b'+(RETO.tomadas[o.k]?' on':'')+'" data-obs="'+o.k+'">'+
    (o.taller?'':'💰 ')+corta(o.rot,30)+'</button>').join('');
}
function pintaDxReto(){
  const ops=barajaEn(FAMILIAS.slice());
  el('dxreto').innerHTML=ops.map(f=>
    '<button class="b'+(RETO.eleccion===f?' on':'')+'" data-fam="'+f+'">'+f+'</button>').join('');
}
function pintaReto(){
  const R=el('report'), n=Object.keys(RETO.tomadas).length;
  let h='<b>Motor bajo diagnóstico:</b> '+MQ().nombre+'. Observaciones compradas: '+n+'/'+OBS.length+'. ';
  if(RETO.veredicto) h+=(RETO.veredicto.ok?'<b class="good">Acertaste.</b> ':'<b class="bad">Fallaste.</b> ')+RETO.veredicto.texto;
  else h+='Compra lo que necesites, elige la familia y entrega el diagnóstico.';
  R.innerHTML=h;
  const spec=el('retoSpec');
  spec.innerHTML=n
    ? '<span class="mono">'+OBS.filter(o=>RETO.tomadas[o.k])
        .map(o=>corta(o.rot,34)+': '+RETO.tomadas[o.k]).join('<br>')+'</span>'
    : '<span class="mono">Sin observaciones todavía.</span> Las cuatro primeras se toman en el taller; las dos últimas cuestan un análisis y un desarme.';
}
function pista(){
  const e=MQ(), C=CENSO(), N=ESCEN_KEYS.length;
  const tal=C.find(x=>x.sub.length===OBS.filter(o=>o.taller).length&&x.sub.every(o=>o.taller));
  const p=[
    'Empieza por las tres presiones. Si las tres coinciden con las de un motor sano, la avería es de las que el manómetro no ve.',
    'Mira la luz y las vueltas en seco: hay una avería que sólo se paga al arrancar y no mueve la presión ni un dígito.',
    'Con todo lo de taller se separan '+tal.resueltos+' de los '+N+' escenarios de este '+e.corto+
      '. Si tu caso está entre los que quedan pegados, hace falta el análisis de aceite o el plastigage.',
  ];
  const i=Math.min(RETO.pistas,p.length-1);
  RETO.pistas++;
  showToast('💡 '+p[i],6500);
  synth.beep(520,0.07,0.04);
}
function checkReto(){
  if(!RETO.eleccion){ showToast('Elige primero una familia de avería.',2200); return; }
  const e=MQ(), L=LECT(), s=EST({T:110,rpm:e.ralenti}), ok=(RETO.eleccion===L.clave);
  const F=FALLAS[ESCEN[RETO.caso].falla];
  const forzado=ESCEN[RETO.caso].aceite;
  const queEra='Era <b>'+ESCEN[RETO.caso].rot+'</b> ('+L.clave+'). '+
    (forzado?('El motor llevaba '+ACEITES[forzado].rot+'. '):'')+F.nota;
  const pruebas='Lo que lo demostraba: presión en caliente a ralentí '+bar(L.pCalRal)+
    ' contra '+bar(lecturas(e,'sano',{aceite:e.aceiteOEM}).pCalRal)+' del motor sano, '+
    (isFinite(L.arr.vueltasSeco)?num(L.arr.vueltasSeco,1)+' vueltas en seco al arrancar':'una bomba que no ceba')+
    ' y λ = '+num(s.peor.lam,2)+' en la peor bancada.';
  let txt;
  if(ok){
    txt=queEra+' '+pruebas;
    const compradas=Object.keys(RETO.tomadas).length;
    if(compradas<3) txt+=' <span class="warn">Acertaste con sólo '+compradas+
      ' observación'+(compradas===1?'':'es')+': acertar por corazonada y acertar por método se parecen en la respuesta y en nada en el taller.</span>';
    G.resuelto=true;
    synth.beep(660,0.09,0.05); setTimeout(()=>synth.beep(880,0.13,0.05),110);
  }else{
    txt=queEra+' '+pruebas;
    synth.beep(180,0.14,0.05);
  }
  // Dos versiones del mismo veredicto: la del panel lleva etiquetas y la del
  // pizarron va en texto plano, porque un lienzo 2D dibujaria las etiquetas
  // literales. Guardar solo una obliga a que alguna de las dos mienta.
  RETO.veredicto={ok, texto:txt, plano:txt.replace(/<[^>]+>/g,'')};
  pintaReto(); pintaTablero();
}

// -------------------------------------------------------------- cuestionario
// Una pregunta por modo, con la respuesta calculada por el motor sellado y las
// opciones barajadas en cada refresco: la posición nunca es la pista.
let QUIZ=null;
function preguntaDe(m){
  const e=MQ();
  if(m==='viscosidad'){
    const a=ACEITES.a10w40, b=ACEITES.a15w40;
    const mejor=a.hths>=b.hths?a:b;
    return {t:'El '+b.corto+' tiene menos viscosidad a 100 °C que el '+a.corto+' ('+
      num(b.kv100,2)+' contra '+num(a.kv100,2)+NBSP+'mm²/s). ¿Cuál protege más el cojinete a 150 °C y cizalla alta?',
      ops:[[a.corto+', porque tiene más KV100',a===mejor],
           [b.corto+', porque tiene más HTHS ('+num(b.hths,2)+' contra '+num(a.hths,2)+')',b===mejor],
           ['Los dos igual: el grado de verano ya lo dice todo',false]],
      exp:'El número de verano ordena la KV a 100 °C, que se mide a cizalla baja. Lo que aguanta el cojinete es el HTHS, medido a 150 °C y 10⁶ s⁻¹, y NO se deduce del grado.'};
  }
  if(m==='presion'){
    const fr=EST({T:20,rpm:e.ralenti}), ca=EST({T:110,rpm:e.ralenti});
    return {t:'Con el motor a ralentí, la presión pasa de '+bar(fr.p)+' en frío a '+bar(ca.p)+
      ' en caliente. ¿Qué ha cambiado?',
      ops:[['La bomba entrega menos caudal al calentarse',false],
           ['El aceite se ha afinado y el circuito deja salir más por la misma presión',true],
           ['La limitadora ha empezado a abrir al calentarse',false]],
      exp:'La bomba es volumétrica: entrega prácticamente lo mismo. Lo que cambia es la viscosidad, y con ella la fuga de cada cojinete. La presión es el equilibrio entre las dos cosas.'};
  }
  if(m==='pelicula'){
    const a=EST({T:110,rpm:e.ralenti,carga:0}),
          b=EST({T:110,rpm:3000,carga:0}),
          c=EST({T:110,rpm:1200,carga:1});
    const peor=[['ralentí sin carga',a],['3 000 rpm sin carga',b],['1 200 rpm a plena carga',c]]
      .reduce((x,y)=>x[1].peor.lam<=y[1].peor.lam?x:y);
    return {t:'Los tres puntos están a 110 °C. ¿En cuál es más delgada la película?',
      ops:[['A ralentí sin carga (λ = '+num(a.peor.lam,2)+')',peor[0]==='ralentí sin carga'],
           ['A 3 000 rpm sin carga (λ = '+num(b.peor.lam,2)+')',peor[0]==='3 000 rpm sin carga'],
           ['A 1 200 rpm con el pie a fondo (λ = '+num(c.peor.lam,2)+')',peor[0]==='1 200 rpm a plena carga']],
      exp:'La carga del cojinete la fija la presión del cilindro, y sin par pedido el pico es el de COMPRESIÓN, no el de combustión. Además la inercia descarga el cojinete al subir de vueltas: el punto crítico está a régimen bajo con el pie a fondo, no arriba.'};
  }
  if(m==='arranque'){
    const g=arranque(e,{aceite:'a20w50',T:-20}), f=arranque(e,{aceite:'a0w20',T:-20});
    return {t:'A −20 °C, con '+ACEITES.a20w50.corto+' el motor da '+num(g.n,0)+
      ' rpm de arranque y con '+ACEITES.a0w20.corto+', '+num(f.n,0)+
      '. El mínimo para que encienda es '+num(e.nMinArr,0)+'. ¿Qué ensayo de J300 mide eso?',
      ops:[['El CCS: viscosidad a cizalla alta, la que ve el motor de arranque',true],
           ['El MRV: viscosidad a cizalla baja, la que ve la bomba',false],
           ['La KV a 100 °C del grado de verano',false]],
      exp:'J300 pide DOS ensayos de invierno porque miden cosas distintas: el CCS garantiza que el motor de arranque lo gire y el MRV, que la bomba lo aspire. Se puede pasar el primero y fallar el segundo, y entonces el motor gira EN SECO.'};
  }
  if(m==='censo'){
    const C=CENSO(), N=ESCEN_KEYS.length;
    const man=C.find(x=>x.sub.length===3&&x.sub.every(o=>o.k.startsWith('p')));
    return {t:'Con las tres presiones del protocolo y nada más se separan '+man.resueltos+
      ' de los '+N+' escenarios de este '+e.corto+'. ¿Por qué no llegan a los '+N+'?',
      ops:[['Porque el manómetro es poco preciso',false],
           ['Porque hay averías que no cambian la presión: el filtro obstruido y el antirretorno roto la dejan idéntica',true],
           ['Porque haría falta medir en más regímenes',false]],
      exp:'No es cuestión de precisión ni de más puntos: son dos averías cuya firma en presión es IDÉNTICA a la del motor sano, hasta el último dígito. Una se paga en desgaste y la otra, en vueltas en seco al arrancar.'};
  }
  if(m==='reto'){
    return {t:'Dos de los trece escenarios dejan la presión exactamente igual que la de un motor sano. ¿Cómo se cazan?',
      ops:[['Con el análisis de aceite y con las vueltas en seco al arrancar',true],
           ['Midiendo la presión a más regímenes',false],
           ['Con un manómetro de más resolución',false]],
      exp:'El filtro obstruido se delata en el análisis —el aceite lleva partículas— y el antirretorno roto, en las vueltas que el motor da en seco al arrancar. Ninguna de las dos cosas se lee en la galería.'};
  }
  const s=EST({T:110,rpm:e.ralenti,falla:'filtroSucio'}), b=EST({T:110,rpm:e.ralenti,falla:'sano'});
  return {t:'Con el filtro obstruido y su derivación abierta, la presión de galería a ralentí en caliente vale '+
    bar(s.p)+': exactamente la misma cifra que en el motor sano, '+bar(b.p)+
    '. ¿Qué pieza del circuito avisa de esa avería?',
    ops:[['El manocontacto: para eso está',false],
         ['Ninguna de las que se montan: no hay señal, y por eso el filtro se cambia por kilómetros',true],
         ['La limitadora, que abre antes',false]],
    exp:'La derivación existe para que el motor no se quede SIN aceite cuando el elemento se tapa, y hace bien su trabajo: sigue llegando el mismo caudal. El precio es que llega sin filtrar y nada lo indica.'};
}
function refrescaPregunta(){
  QUIZ=preguntaDe(G.modo);
  QUIZ.ops=barajaEn(QUIZ.ops.map(o=>({rot:o[0],ok:o[1]})));
  el('q_text').innerHTML=QUIZ.t;
  el('dxbtns').innerHTML=QUIZ.ops.map((o,i)=>
    '<button class="b" data-q="'+i+'">'+o.rot+'</button>').join('');
}
function responde(i){
  if(!QUIZ||!QUIZ.ops[i]) return;
  const o=QUIZ.ops[i];
  [...el('dxbtns').children].forEach((b,k)=>{
    b.classList.toggle('ok',QUIZ.ops[k].ok);
    b.classList.toggle('wrong',k===i&&!o.ok);
  });
  showToast((o.ok?'<b class="good">Correcto.</b> ':'<b class="bad">No.</b> ')+QUIZ.exp,7000);
  synth.beep(o.ok?740:190,0.10,0.05);
}

// -------------------------------------------------------------- otro caso
function otroCaso(){
  if(G.modo==='ensamble'){ initAssembly(); afterEdit(); return; }
  if(G.modo==='reto'){ armaReto(); afterEdit(); refrescaPregunta(); return; }
  const ops=ESCEN_KEYS.filter(k=>k!==G.esc);
  G.esc=ops[Math.floor(Math.random()*ops.length)];
  afterEdit(); refrescaPregunta();
  showToast('Escenario nuevo: <b>'+ESCEN[G.esc].rot+'</b>.',3000);
}

// ----------------------------------------------------------- recorrido guiado
let autoRunning=false, autoT=[];
function paraAuto(){ autoT.forEach(t=>clearTimeout(t)); autoT=[]; autoRunning=false; syncCtrlbar(); }
function auto(){
  if(autoRunning){ paraAuto(); return; }
  autoRunning=true; syncCtrlbar();
  const paso=[];
  let t=200;
  if(ASM.done.size<PARTS.length){
    paso.push([0,()=>{ setMode('ensamble'); showToast('<b>1 · Montaje.</b> Siete piezas, siete huecos.',3000); }]);
    paso.push([600,()=>autoAssemble()]);
    t=600+PARTS.length*640+1300;
  }
  const guion=[
    ['viscosidad','<b>2 · Viscosidad.</b> En los ejes de ASTM D341 cada aceite es una recta. La pendiente es lo que pierde al calentarse.'],
    ['presion','<b>3 · Presión.</b> Sube con las vueltas y cae con la temperatura. No es una medida de la lubricación.'],
    ['pelicula','<b>4 · Película.</b> Esto es lo que protege, y nadie lo mide con el motor montado.'],
    ['arranque','<b>5 · Arranque.</b> Aquí se gasta el motor: los dos ensayos de invierno de J300 miden cosas distintas.'],
    ['censo','<b>6 · Censo.</b> Con lo que se mide en el taller no se separan los trece escenarios.'],
  ];
  guion.forEach(([m,msg])=>{
    paso.push([t,()=>{ setMode(m); showToast(msg,4200); }]); t+=5200;
  });
  paso.push([t,()=>{ paraAuto(); showToast('Recorrido terminado. El reto sigue esperando.',3400); }]);
  paso.forEach(([ms,fn])=>autoT.push(setTimeout(fn,ms)));
}

// ------------------------------------------------------------------- mandos
el('panel').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  if(b.id&&b.id.startsWith('m_')){ setMode(b.id.slice(2)); return; }
  if(b.id==='btnAuto'){ auto(); return; }
  if(b.id==='btnNew'){ otroCaso(); return; }
  if(b.id==='btnPista'){ pista(); return; }
  if(b.id==='btnCheck'){ checkReto(); return; }
  if(b.dataset.mk){ setMaquina(b.dataset.mk); return; }
  if(b.dataset.esc){ G.esc=b.dataset.esc; afterEdit(); refrescaPregunta(); return; }
  if(b.dataset.ac){ G.aceite=b.dataset.ac; afterEdit(); refrescaPregunta(); return; }
  if(b.dataset.t){ G.T=+b.dataset.t; afterEdit(); return; }
  if(b.dataset.rpm){ G.rpm=+b.dataset.rpm; afterEdit(); return; }
  if(b.dataset.cg){ G.carga=+b.dataset.cg; afterEdit(); return; }
  if(b.dataset.ta){ G.Tarr=+b.dataset.ta; afterEdit(); return; }
  if(b.dataset.obs){ mide(b.dataset.obs); return; }
  if(b.dataset.fam){ RETO.eleccion=b.dataset.fam; pintaDxReto(); pintaTablero(); return; }
  if(b.dataset.q!==undefined){ responde(+b.dataset.q); return; }
});
function setMaquina(k){
  if(!ARQ[k]) return;
  G.maq=k;
  // El aceite vuelve al que pide el fabricante de ESE motor: arrastrar el del
  // motor anterior es exactamente el error que la práctica quiere enseñar a no
  // cometer, y hacerlo en silencio sería enseñarlo al revés.
  G.aceite=MQ().aceiteOEM;
  G.rpm=2000;
  construyeMotor();
  if(G.simUnlocked) montaKit(); else initAssembly();
  if(G.modo==='reto') armaReto();
  afterEdit(); refrescaPregunta();
}

el('soundBtn').addEventListener('click',()=>{
  const on=synth.toggle();
  el('soundBtn').classList.toggle('on',on);
  el('soundBtn').textContent=on?'🔊':'🔇';
});

// -------------------------------------------------------------------- puente
// Sonda de pruebas. Expone LO QUE SE VE, no atajos que salten la interfaz: cada

window.__labDebug={
  get mode(){ return G.modo; },
  get unlocked(){ return G.simUnlocked; },
  get solved(){ return G.resuelto; },
  get piezas(){ return ASM.done.size; },
  get total(){ return PARTS.length; },
  get maquina(){ return G.maq; },
  get aceite(){ return G.aceite; },
  get aceiteEf(){ return aceiteEfectivo(); },
  get esc(){ return G.esc; },
  get cabecera(){ return cabAceite(); },
  get T(){ return G.T; },
  get rpm(){ return G.rpm; },
  get carga(){ return G.carga; },
  get Tarr(){ return G.Tarr; },
  get est(){ const s=EST(); return {p:s.p, pSinLim:s.pSinLim, pRel:s.pRel, abreLim:s.abreLim,
    Q:s.Q, nu:s.nu, mu:s.mu, viscMul:s.viscMul, filtrado:s.filtrado, alarma:s.alarma,
    revienta:s.revientaFiltro, extrapola:s.extrapola, par:s.par, potFric:s.potFric,
    pEsp:s.pEsp, pEspDis:s.pEspDis, peor:{i:s.peor.i, eps:s.peor.eps, h:s.peor.h,
      lam:s.peor.lam, regimen:s.peor.regimen, c:s.peor.c},
    cojinetes:s.cojinetes.map(c=>({i:c.i,c:c.c,eps:c.eps,h:c.h,lam:c.lam,regimen:c.regimen})) }; },
  get arr(){ const r=ARR(); return {eta:r.eta,n:r.n,arranca:r.arranca,bombea:r.bombea,
    tCeb:r.tCeb,vueltasSeco:r.vueltasSeco,veredicto:r.veredicto,limCCS:r.limCCS}; },
  get lect(){ const L=LECT(); return {esc:L.esc,rot:L.rot,clave:L.clave,aceite:L.aceite,
    pFrio:L.pFrio,pCalRal:L.pCalRal,pCalAlto:L.pCalAlto,lamPeor:L.lamPeor,
    alarmaEn:L.alarmaEn.slice(),revientaEn:L.revientaEn.slice(),sinFiltrar:L.sinFiltrar,
    vueltas:L.arr.vueltasSeco}; },
  get j300(){ const j=J300(); return {kv100:j.kv100.ok, hths:j.hths.ok,
    ccs:j.ccs?j.ccs.ok:null, mrv:j.mrv?j.mrv.ok:null}; },
  get censo(){ const C=CENSO(), N=ESCEN_KEYS.length;
    const mejor={}; for(const c of C){ const n=c.sub.length;
      if(!mejor[n]||c.resueltos>mejor[n].resueltos) mejor[n]=c; }
    const min=C.filter(c=>c.resueltos===N).sort((a,b)=>a.sub.length-b.sub.length)[0];
    const tal=C.find(x=>x.sub.length===OBS.filter(o=>o.taller).length&&x.sub.every(o=>o.taller));
    return {N, taller:tal.resueltos, minTam:min.sub.length,
      minObs:min.sub.map(o=>o.k), porTam:Object.keys(mejor).map(n=>+mejor[n].resueltos)}; },
  get veredicto(){ return veredicto(); },
  get veredictoArr(){ return veredictoArranque(); },
  get reto(){ return {caso:RETO.caso, tomadas:Object.keys(RETO.tomadas),
    eleccion:RETO.eleccion, veredicto:RETO.veredicto?{ok:RETO.veredicto.ok}:null,
    pistas:RETO.pistas, familias:FAMILIAS.slice()}; },
  get quiz(){ return QUIZ?{t:QUIZ.t, ops:QUIZ.ops.map(o=>o.rot), ok:QUIZ.ops.findIndex(o=>o.ok)}:null; },
  get autoRunning(){ return autoRunning; },
  get amp(){ return {existe:!!RIG.amp, visible:!!(RIG.amp&&RIG.amp.visible),
    factor:AMP.factor, frames:PINTADAS}; },
  get gotas(){ return {n:CIRC.gotas.length, vivas:CIRC.gotas.filter(g=>g.visible).length}; },
  get mangueras(){ return mangueras.length; },
  setMode:m=>setMode(m),
  setMaquina:k=>setMaquina(k),
  setAceite:k=>{ if(ACEITES[k]){ G.aceite=k; afterEdit(); refrescaPregunta(); } },
  set:(k,v)=>{ if(k==='esc'){ G.esc=v; } else G[k]=v; afterEdit(); refrescaPregunta(); },
  ensambla:()=>autoAssemble(),
  mide:k=>mide(k),
  elige:f=>{ RETO.eleccion=f; pintaDxReto(); pintaTablero(); },
  entrega:()=>checkReto(),
  pista:()=>pista(),
  retoNuevo:()=>{ armaReto(); afterEdit(); },
  responde:i=>responde(i),
  otro:()=>otroCaso(),
  auto:()=>auto(),
  cifras:()=>el('tele').textContent+' | '+el('report').textContent,
  texto:()=>el('hud').textContent,
  panel:()=>el('panel').textContent,
};
