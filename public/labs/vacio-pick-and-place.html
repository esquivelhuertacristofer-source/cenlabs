<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.26, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;
    }
    if(hook)hook(dt,t); controls.update();
    if(bokeh) bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);
    composer.render(); }
  function start(){ if(!raf)loop(); }
  function stop(){ cancelAnimationFrame(raf); raf=null; window.removeEventListener('resize',resize); }

  /* Sonda de escena para las auditorías del 3D. No cambia nada de lo que se ve
     y cuelga de `window.__diag3d`, que ningún laboratorio pisa: así CUALQUIER
     laboratorio construido con este molde se puede auditar —salud(), mira(),
     piezas()— sin tocarle una línea. */
  try { instalaDiag(document.title || location.pathname,
    { escena:scene, camara:camera, controles:controls, renderizador:renderer }); } catch(_){}

  return { THREE, renderer, scene, camera, controls, composer, bloom,
    setAnimate:fn=>hook=fn, start, stop, resize, clock,
    flyTo:(v)=>{ controls.target.copy(v); }, moveTo, setCinematicIdle };
}

function pickerFor(scene,camera,dom,onHit){
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(); let down=null;
  dom.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
  dom.addEventListener('pointerup',e=>{
    if(!down)return; const moved=Math.abs(e.clientX-down[0])+Math.abs(e.clientY-down[1])>6; down=null;
    if(moved)return;
    const r=dom.getBoundingClientRect();
    mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(mouse,camera);
    const hits=ray.intersectObjects(scene.children,true);
    onHit(hits[0]||null);
  });
}

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

/* ============================================================
   LAB — VACÍO PARA PICK&PLACE · DIMENSIONADO DE VENTOSAS
   (Dominio D4 · Hidráulica y Neumática — fila d4-08 de la lista
   maestra). MOLDE E+S: ensamble 3D pieza por pieza del cabezal de
   vacío sobre un pórtico cartesiano (molde E) + pizarrón
   esquemático con modos de exploración sobre canvas (molde S),
   mismo patrón que los labs de máquinas eléctricas de D5
   (ver patron_molde_e_s_hibrido).

   Norma ancla / referencias: ISO 2533 (atmósfera tipo: el vacío de
   un eyector es un PORCENTAJE de la atmósfera LOCAL, y este banco
   está a 2 660 m) · ISO 8573-1 (calidad del aire comprimido, para
   la vida del eyector) · ISO 4414 (seguridad neumática: la pieza no
   puede caer al faltar la energía) · ISO 1219-1 (simbología) ·
   EN 13155 (equipos de elevación por vacío: factor de seguridad
   mínimo 2 en horizontal). Los factores de seguridad por estación
   son CRITERIOS DE PROYECTO declarados en el catálogo, no cifras
   de norma; el consumo de 0,10 kWh por Nm³ a 7 bar es el valor
   medio del rango industrial 0,09–0,12.

   MOTOR: copiado VERBATIM del verificador numérico sellado
   scratchpad/verif_vacio.mjs (912 aserciones, 0 fallos) entre las
   marcas MOTOR / FIN MOTOR. Ni una fórmula reescrita a mano.

   CERO Math.random() salvo en newReto() (qué estación se sortea) y
   en el barajado Fisher-Yates de las opciones del quiz.
   ============================================================ */

/* ============================ MOTOR ============================ */
/* Unidades: presion mbar (absoluta o de vacio, siempre dicho) ·
   volumen l · caudal l/s o Nl/min · fuerza N · longitud mm salvo
   la altitud, en m · energia Wh por ciclo. */

// verif_vacio.mjs — d4-08 / mecanica-100
// Dimensionado de un sistema de vacio para pick&place.
// Motor numerico sellado + banco de comprobaciones.

// ==================== MOTOR (pegar verbatim en el lab) ====================

// --- Constantes selladas ---
const P0_MAR    = 1013.25;  // mbar, atmosfera tipo ISO 2533 al nivel del mar
const L_TROPO   = 0.0065;   // K/m, gradiente termico de la troposfera (ISO 2533)
const T0_ISA    = 288.15;   // K, temperatura al nivel del mar (ISO 2533)
const EXP_ISA   = 5.255;    // exponente barometrico g*M/(R*L)
const H_BANCO   = 2660;     // m, altitud del banco (Toluca de Lerdo, UAEMEX)
const G_GRAV    = 9.80665;  // m/s2, aceleracion normal de la gravedad
const P_NORM    = 1013.25;  // mbar, presion de referencia del litro normal
const P_FUGA_REF= 600;      // mbar de vacio a los que se mide la fuga de catalogo
const T_VALV    = 0.010;    // s, conmutacion de la valvula de vacio
const E_AIRE    = 0.10;     // kWh por Nm3 de aire comprimido a 7 bar (rango 0,09-0,12)
const A_LAT_MAX = 2.0;      // m/s2, aceleracion lateral maxima admisible con fuelle
const SEP_VENT  = 10;       // mm de separacion minima entre ventosas
const HIST_ASC  = 30;       // mbar de histeresis del sensor de vacio (ahorro de aire)
const DT_SIM    = 0.0005;   // s, paso de integracion
const T_TOPE    = 6.0;      // s, tope de la integracion de agarre
const T_TOPE_F  = 30.0;     // s, tope de la integracion de retencion tras el fallo
const T_COLAPSO = 0.15;     // s que tarda en perderse el vacio sin antirretorno

// --- Atmosfera tipo ISO 2533 ---
// El vacio de un eyector es un PORCENTAJE de la atmosfera LOCAL: la altitud
// del banco cambia la fuerza de sujecion sin tocar ni una pieza del catalogo.
const pAtm = h => P0_MAR * Math.pow(1 - L_TROPO * h / T0_ISA, EXP_ISA);
const ALTITUDES = [
  {k:'mar',    nom:'Nivel del mar',       h:0},
  {k:'denver', nom:'Denver',              h:1609},
  {k:'puebla', nom:'Puebla',              h:2135},
  {k:'cdmx',   nom:'Ciudad de México',    h:2240},
  {k:'toluca', nom:'Toluca (este banco)', h:2660},
];
let H_SIM = H_BANCO;
let P_ATM = pAtm(H_SIM);
function setAltitud(h) { H_SIM = h; P_ATM = pAtm(h); }

// --- Catalogo de ventosas ---
// vol = volumen interior de la ventosa en cm3; dEf = diametro eficaz de catalogo
const VENTOSAS = {
  plana30:  {k:'plana30',  nom:'Plana Ø 30',              tipo:'plana',  dExt:30, dEf:28, vol:1.5,  coste:1},
  plana50:  {k:'plana50',  nom:'Plana Ø 50',              tipo:'plana',  dExt:50, dEf:47, vol:4.0,  coste:2},
  fuelle40: {k:'fuelle40', nom:'Fuelle 1,5 pliegues Ø 40', tipo:'fuelle', dExt:40, dEf:37, vol:12.0, coste:3},
  fuelle30: {k:'fuelle30', nom:'Fuelle 3,5 pliegues Ø 30', tipo:'fuelle', dExt:30, dEf:27, vol:20.0, coste:4},
};
const VENTK = ['plana30','plana50','fuelle40','fuelle30'];

// --- Catalogo de fuentes de vacio ---
// vacPct = vacio maximo como fraccion de la ATMOSFERA LOCAL (no absoluto)
// s0 = velocidad de aspiracion a la entrada en l/min; aire = consumo en Nl/min
// vtubo = volumen de manguera por ventosa en cm3; ret = antirretorno
const FUENTES = {
  eyector: {k:'eyector', nom:'Eyector Venturi básico',
            vacPct:0.85, s0:55,  aire:50,  ret:false, elec:0,    vtubo:12.6, asc:false, coste:3},
  grande:  {k:'grande',  nom:'Eyector Venturi de alto caudal',
            vacPct:0.85, s0:130, aire:120, ret:false, elec:0,    vtubo:12.6, asc:false, coste:5},
  asc:     {k:'asc',     nom:'Eyector con antirretorno y sensor (ahorro de aire)',
            vacPct:0.85, s0:55,  aire:50,  ret:true,  elec:0,    vtubo:12.6, asc:true,  coste:6},
  bomba:   {k:'bomba',   nom:'Bomba de vacío de paletas',
            vacPct:0.92, s0:100, aire:0,   ret:false, elec:0.25, vtubo:30.0, asc:false, coste:12},
};
const FUENTK = ['eyector','grande','asc','bomba'];

const NUMS = [1,2,4,6];

// --- Banco de estaciones ---
// caso: 'vert'  ventosa horizontal, movimiento vertical      F = m*(g+a)*S
//       'horiz' ventosa horizontal, movimiento horizontal    F = m*(g+a/mu)*S
//       'lat'   ventosa vertical, la friccion carga el peso  F = (m/mu)*(g+a)*S
// fuga: Nl/min por ventosa medidos a P_FUGA_REF mbar de vacio
// dpMax: mbar de vacio que la pieza tolera sin marcarse ni deformarse
const POOL = [
  {k:'vidrio', nom:'Panel de vidrio para fachada', mat:'Vidrio recocido 1 000 x 800 x 6 mm',
   m:12.0, mu:0.5, caso:'vert', a:1.0, sf:2.0, fuga:0, dpMax:900,
   util:[1000,800], nMax:6, desnivel:false,
   tMax:0.60, tSujeta:2.5, tCiclo:6.0, eMax:0.30, exigeFalla:true, tFalla:2.0,
   por:'La ventosa toma el panel por la cara y lo sube a la línea de montaje; el vidrio viaja por encima del puesto de trabajo.'},

  {k:'carton', nom:'Caja de cartón corrugado', mat:'Cartón corrugado de doble onda',
   m:3.0, mu:0.5, caso:'vert', a:2.0, sf:2.0, fuga:6, dpMax:450,
   util:[400,300], nMax:6, desnivel:true,
   tMax:0.40, tSujeta:1.2, tCiclo:2.0, eMax:0.22, exigeFalla:false, tFalla:0,
   por:'Las solapas dejan la cara superior desnivelada y el corrugado respira: la pieza tiene fuga y se marca con vacío alto.'},

  {k:'chapa', nom:'Chapa de acero aceitada', mat:'Acero laminado en frío con capa de aceite',
   m:8.0, mu:0.10, caso:'horiz', a:3.0, sf:1.5, fuga:0, dpMax:900,
   util:[600,400], nMax:6, desnivel:false,
   tMax:0.30, tSujeta:1.0, tCiclo:2.5, eMax:0.30, exigeFalla:true, tFalla:2.0,
   por:'Transferencia horizontal rápida hacia la prensa: el aceite deja el coeficiente de rozamiento en 0,10 y la aceleración es lateral.'},

  {k:'plastico', nom:'Pieza inyectada nervada', mat:'Polipropileno de pared delgada',
   m:0.9, mu:0.3, caso:'vert', a:4.0, sf:2.0, fuga:0, dpMax:650,
   util:[35,35], nMax:6, desnivel:true,
   tMax:0.050, tSujeta:0.5, tCiclo:1.2, eMax:0.20, exigeFalla:false, tFalla:0,
   por:'Entre los nervios sólo queda una isla plana de 35 x 35 mm con la línea de partición encima, y la pared es tan delgada que se hunde con vacío alto.'},

  {k:'bidon', nom:'Bidón de polietileno lleno', mat:'Polietileno de alta densidad, pared curva Ø 300',
   m:6.0, mu:0.3, caso:'lat', a:0.5, sf:2.0, fuga:0, dpMax:900,
   util:[600,400], nMax:6, desnivel:true,
   tMax:2.00, tSujeta:3.0, tCiclo:6.0, eMax:0.60, exigeFalla:false, tFalla:0,
   por:'Se toma por la pared lateral: la ventosa queda vertical y es el rozamiento el que sostiene los 6 kg sobre una superficie curva.'},
];
const POOLK = POOL.map(s => s.k);

// --- Geometria y fuerza ---
const AREA = d => Math.PI * d * d / 4e6;   // mm -> m2

function fuerzaReq(sc) {
  if (sc.caso === 'vert')  return sc.m * (G_GRAV + sc.a) * sc.sf;
  if (sc.caso === 'horiz') return sc.m * (G_GRAV + sc.a / sc.mu) * sc.sf;
  return (sc.m / sc.mu) * (G_GRAV + sc.a) * sc.sf;   // 'lat'
}
const aLateral = sc => (sc.caso === 'vert' ? 0 : sc.a);

// vacio requerido en mbar para sostener la pieza con n ventosas
function vacioReq(sc, kv, n) {
  const v = VENTOSAS[kv];
  return fuerzaReq(sc) / (n * AREA(v.dEf)) / 100;   // Pa -> mbar
}

// Caben n ventosas de ese tipo en la zona util. El labio tiene que apoyar entero
// sobre la pieza, asi que el centro de las ventosas de la orilla queda a dExt/2
// del borde: el ancho aprovechable para repartir centros es (util - dExt).
function cabenVentosas(sc, kv, n) {
  const v = VENTOSAS[kv];
  if (n > sc.nMax) return false;                                     // bocas del colector
  if (v.dExt > Math.min(sc.util[0], sc.util[1])) return false;       // no apoya el labio
  const paso = v.dExt + SEP_VENT;                                    // centro a centro
  const cols = Math.floor((sc.util[0] - v.dExt) / paso) + 1;
  const fils = Math.floor((sc.util[1] - v.dExt) / paso) + 1;
  return cols * fils >= n;
}

// --- Simulacion del circuito de vacio ---
// Estado: presion ABSOLUTA p [mbar] dentro de un volumen V [l].
// Aspiracion: S(pv) = s0*(1 - pv/pvMax) en l/s a la entrada (curva lineal declarada).
// Fuga:       Q(pv) = fuga*(pv/P_FUGA_REF) en Nl/s, laminar, proporcional al vacio.
// Balance:    V*dp/dt = -p*S(pv) + P_NORM*Q(pv)
function derivP(p, V, s0, pvMax, fugaNls, bombeando) {
  const pv = P_ATM - p;
  const S = bombeando ? s0 * Math.max(0, 1 - pv / pvMax) : 0;
  const Q = fugaNls * (pv / P_FUGA_REF);
  return (-p * S + P_NORM * Q) / V;
}

// vacio de equilibrio con la fuente bombeando sin parar
function vacioEq(s0, pvMax, fugaNls) {
  let lo = 0, hi = pvMax;
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2;
    const d = derivP(P_ATM - mid, 1, s0, pvMax, fugaNls, true);
    if (d < 0) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

function circuito(sc, cfg) {
  const v = VENTOSAS[cfg.ventosa], f = FUENTES[cfg.fuente], n = cfg.numero;
  const V       = n * (v.vol + f.vtubo) / 1000;   // l
  const s0      = f.s0 / 60;                      // l/s
  const pvMax   = f.vacPct * P_ATM;               // mbar
  const fugaNls = n * sc.fuga / 60;               // Nl/s
  const pvReq   = vacioReq(sc, cfg.ventosa, n);   // mbar
  const pvEq    = vacioEq(s0, pvMax, fugaNls);

  // --- fase de agarre: la ventosa toca la pieza a presion atmosferica ---
  let p = P_ATM, t = 0, tOn = 0;
  let tAgarre = Infinity;
  while (t < T_TOPE) {
    if (P_ATM - p >= pvReq) { tAgarre = t + T_VALV; break; }
    p += derivP(p, V, s0, pvMax, fugaNls, true) * DT_SIM;
    t += DT_SIM; tOn += DT_SIM;
  }
  if (!isFinite(tAgarre)) return {V, pvMax, pvReq, pvEq, tAgarre:Infinity,
    pvMin:pvEq, pvPico:pvEq, tOn:sc.tSujeta, duty:1, aire:0, energia:0, tRet:0, alcanza:false};

  // --- fase de sujecion ---
  let pvMin = P_ATM - p, pvPico = P_ATM - p, ts = 0, tOnS = 0, bomb = true;
  while (ts < sc.tSujeta) {
    const pv = P_ATM - p;
    if (f.asc) {
      if (bomb && pv >= pvReq + HIST_ASC) bomb = false;
      else if (!bomb && pv <= pvReq) bomb = true;
    }
    p += derivP(p, V, s0, pvMax, fugaNls, bomb) * DT_SIM;
    ts += DT_SIM; if (bomb) tOnS += DT_SIM;
    const pv2 = P_ATM - p;
    if (pv2 < pvMin) pvMin = pv2;
    if (pv2 > pvPico) pvPico = pv2;
  }
  tOn += tOnS;
  const duty = sc.tSujeta > 0 ? tOnS / sc.tSujeta : 1;

  // --- retencion al faltar la energia, justo al acabar la sujecion ---
  let tRet = 0;
  if (!f.ret) tRet = T_COLAPSO;
  else if (fugaNls <= 0) tRet = T_TOPE_F;
  else {
    let pf = p;
    while (tRet < T_TOPE_F && P_ATM - pf >= pvReq) {
      pf += derivP(pf, V, s0, pvMax, fugaNls, false) * DT_SIM;
      tRet += DT_SIM;
    }
  }

  // --- energia por ciclo ---
  const aire = f.aire * tOn / 60;                       // Nl por ciclo
  const energia = aire * E_AIRE + f.elec * 1000 * sc.tCiclo / 3600;   // Wh por ciclo
  return {V, pvMax, pvReq, pvEq, tAgarre, pvMin, pvPico, tOn, duty, aire, energia, tRet, alcanza:true};
}

// --- Criterios de calificacion, en orden de aplicacion ---
const CRIT = [
  {k:'okSuperficie', nom:'La ventosa es compatible con la pieza'},
  {k:'okFuerza',     nom:'Fuerza de sujeción con el factor de seguridad'},
  {k:'okMarca',      nom:'La pieza no se marca ni se deforma'},
  {k:'okTiempo',     nom:'Agarre dentro del tiempo disponible'},
  {k:'okFalla',      nom:'La pieza no cae al faltar la energía'},
  {k:'okConsumo',    nom:'Energía por ciclo dentro de lo contratado'},
];

const CFGS = [];
for (const kv of VENTK) for (const n of NUMS) for (const kf of FUENTK)
  CFGS.push({ventosa:kv, numero:n, fuente:kf});

const costeCfg = cfg => cfg.numero * VENTOSAS[cfg.ventosa].coste + FUENTES[cfg.fuente].coste;

function evalua(sc, cfg) {
  const v = VENTOSAS[cfg.ventosa], n = cfg.numero;
  const caben  = cabenVentosas(sc, cfg.ventosa, n);
  const desOK  = !sc.desnivel || v.tipo === 'fuelle';
  const latOK  = !(v.tipo === 'fuelle' && aLateral(sc) > A_LAT_MAX);
  const c = circuito(sc, cfg);
  const r = Object.assign({}, c, {
    caben, desOK, latOK,
    okSuperficie: caben && desOK && latOK,
    okFuerza: c.pvEq >= c.pvReq,
    okMarca:  c.pvPico <= sc.dpMax,
    okTiempo: c.tAgarre <= sc.tMax,
    okFalla:  !sc.exigeFalla || c.tRet >= sc.tFalla,
    okConsumo: c.energia <= sc.eMax,
    fReq: fuerzaReq(sc),
    fSuj: n * c.pvMin * 100 * AREA(v.dEf),
    coste: costeCfg(cfg),
  });
  r.valido = CRIT.every(x => r[x.k]);
  const pf = CRIT.find(x => !r[x.k]);
  r.primerFallo = pf ? pf.k : null;
  return r;
}

function GOOD(sc)     { return CFGS.filter(c => evalua(sc, c).valido); }
function costeMin(sc) { const g = GOOD(sc); return g.length ? Math.min.apply(null, g.map(costeCfg)) : Infinity; }
function OPTS(sc)     { const cm = costeMin(sc); return GOOD(sc).filter(c => costeCfg(c) === cm); }
function OPT(sc)      { const o = OPTS(sc); return o.length ? o[0] : null; }

// El reto se califica por ejes: cada eje se juzga con los otros dos ya en su valor optimo,
// y exige valido Y de coste minimo entre los validos de ese eje.
const LISTA_EJE = eje => (eje === 'ventosa' ? VENTK : eje === 'fuente' ? FUENTK : NUMS);
function ejeSol(sc, eje) {
  const base = OPT(sc);
  if (!base) return [];
  const val = LISTA_EJE(eje).filter(x => evalua(sc, Object.assign({}, base, {[eje]:x})).valido);
  if (!val.length) return [];
  const cm = Math.min.apply(null, val.map(x => costeCfg(Object.assign({}, base, {[eje]:x}))));
  return val.filter(x => costeCfg(Object.assign({}, base, {[eje]:x})) === cm);
}
const okEje = (sc, eje, valor) => ejeSol(sc, eje).indexOf(valor) >= 0;

// --- Formato: coma decimal y espacio fino de millares, nunca toLocaleString ---
function f1(x, d) {
  if (!isFinite(x)) return '—';
  const dd = (d === undefined) ? 1 : d;
  const s = Math.abs(x).toFixed(dd);
  let ent = s.split('.')[0], dec = s.split('.')[1] || '';
  let out = '';
  for (let i = 0; i < ent.length; i++) {
    if (i > 0 && (ent.length - i) % 3 === 0) out += ' ';
    out += ent[i];
  }
  return (x < 0 ? '-' : '') + out + (dd > 0 ? ',' + dec : '');
}

// --- Explicacion del primer criterio que falla ---
function whyCfg(sc, cfg) {
  const r = evalua(sc, cfg), v = VENTOSAS[cfg.ventosa], f = FUENTES[cfg.fuente];
  if (!r.okSuperficie) {
    if (!r.desOK) return 'La superficie está desnivelada o curva: una ventosa plana no sella, hace falta una de fuelle.';
    if (!r.latOK)  return 'Con ' + f1(aLateral(sc),1) + ' m/s² de aceleración lateral el fuelle se dobla; por encima de ' + f1(A_LAT_MAX,1) + ' m/s² hay que usar ventosa plana.';
    return 'No caben ' + cfg.numero + ' ventosas de Ø ' + v.dExt + ' mm en la zona útil de ' + sc.util[0] + ' × ' + sc.util[1] + ' mm.';
  }
  if (!r.okFuerza)  return 'Hacen falta ' + f1(r.pvReq,0) + ' mbar de vacío y el sistema sólo llega a ' + f1(r.pvEq,0) + ' mbar: faltan ' + f1(r.pvReq - r.pvEq,0) + ' mbar.';
  if (!r.okMarca)   return 'El vacío llega a ' + f1(r.pvPico,0) + ' mbar y la pieza sólo tolera ' + f1(sc.dpMax,0) + ' mbar antes de marcarse.';
  if (!r.okTiempo)  return 'El agarre tarda ' + f1(r.tAgarre*1000,0) + ' ms y el ciclo sólo deja ' + f1(sc.tMax*1000,0) + ' ms.';
  if (!r.okFalla)   return 'Al faltar la energía la pieza aguanta ' + f1(r.tRet,2) + ' s y se piden ' + f1(sc.tFalla,2) + ' s: ' + (f.ret ? 'el antirretorno no basta con esta fuga.' : 'esta fuente no tiene antirretorno y el vacío se pierde.');
  if (!r.okConsumo) return 'Gasta ' + f1(r.energia,3) + ' Wh por ciclo y el contrato son ' + f1(sc.eMax,3) + ' Wh.';
  if (r.coste !== costeMin(sc)) return 'Cumple los seis criterios pero cuesta ' + r.coste + ' u.c. y hay una solución de ' + costeMin(sc) + ' u.c.';
  return 'Cumple los seis criterios con el coste mínimo del banco.';
}

/* EL CABEZAL DIBUJA LO QUE HAY ELEGIDO. Antes montaba siempre cuatro copas
   planas iguales, dijera lo que dijera el catálogo, y eso tapaba justo la
   decisión de la práctica: el número de ventosas y —sobre todo— si son PLANAS o
   de FUELLE. El fuelle no es un adorno: sus pliegues son lo que le deja bajar
   sobre una pieza que no está a la altura prevista y agarrar una superficie
   curva, y es también lo que se dobla cuando la aceleración lateral aprieta. Un
   cabezal que enseña cuatro copas planas mientras el panel dice «fuelle de 3,5
   pliegues» está mintiendo sobre lo único que hay que decidir. */
let cupsG=null;
function refrescaVentosas(){
  if(!cupsG) return;
  while(cupsG.children.length){
    const c=cupsG.children.pop();
    c.traverse(o=>{ if(o.isMesh) o.geometry.dispose(); });
  }
  const cfg=cfgCI(), v=VENTOSAS[cfg.ventosa], n=cfg.numero;
  const D=v.dExt/1000*3.2;                       // Ø 30 mm → 0,096 de mundo
  const paso=n>1?Math.min(D*1.20,0.44/(n-1)):0;
  // Los pliegues son los del catálogo: 1,5 y 3,5 se dibujan como 2 y 4 rebordes.
  const fue=v.tipo==='fuelle'?(v.vol>=20?4:2):0;
  for(let i=0;i<n;i++){
    const vt=P3.ventosa(MATP,{d:D,fuelles:fue});
    // La BOCA de todas queda a la misma altura, sea cual sea el fuelle: es la
    // que toca la pieza, y es la cota que decide dónde para el eje Z.
    vt.position.set((i-(n-1)/2)*paso,-0.17-vt.userData.alturaBoca,0);
    vt.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
    cupsG.add(vt);
  }
}

// Fuerza que un eyector típico (85 % de la atmósfera local) puede dar con n ventosas.
const PV_TIPICO=0.85;
function fDisp(kv,n){ return n*(PV_TIPICO*P_ATM)*100*AREA(VENTOSAS[kv].dEf); }

// Reintegra el circuito con el mismo derivP y el mismo paso del MOTOR para poder DIBUJAR p(t).
// El harness comprueba que sus cifras coinciden con las de circuito().
function traza(sc,cfg){
  const c=circuito(sc,cfg);
  const v=VENTOSAS[cfg.ventosa], f=FUENTES[cfg.fuente], n=cfg.numero;
  const V=n*(v.vol+f.vtubo)/1000, s0=f.s0/60, pvMax=f.vacPct*P_ATM, fugaNls=n*sc.fuga/60;
  const pvReq=vacioReq(sc,cfg.ventosa,n);
  const dtAg=Math.max(DT_SIM,(isFinite(c.tAgarre)?c.tAgarre:T_TOPE)/180);
  const dtSu=Math.max(DT_SIM,Math.max(sc.tSujeta,0.05)/180);
  const dtRe=Math.max(DT_SIM,Math.max(c.tRet,0.05)/180);
  const ag=[], su=[], re=[];
  let p=P_ATM, t=0, tAg=Infinity, last=-1;
  while(t<T_TOPE){
    if(t-last>=dtAg){ ag.push({t,pv:P_ATM-p}); last=t; }
    if(P_ATM-p>=pvReq){ tAg=t+T_VALV; break; }
    p+=derivP(p,V,s0,pvMax,fugaNls,true)*DT_SIM; t+=DT_SIM;
  }
  ag.push({t,pv:P_ATM-p});
  if(!isFinite(tAg)) return {alcanza:false,pvReq,pvMax,tAg:Infinity,ag,su,re,tSu:sc.tSujeta,tRe:0,pvMin:0,pvPico:0,duty:1,pvEq:c.pvEq};
  let pvMin=P_ATM-p, pvPico=P_ATM-p, ts=0, tOnS=0, bomb=true; last=-1;
  while(ts<sc.tSujeta){
    const pv=P_ATM-p;
    if(f.asc){ if(bomb&&pv>=pvReq+HIST_ASC) bomb=false; else if(!bomb&&pv<=pvReq) bomb=true; }
    if(ts-last>=dtSu){ su.push({t:ts,pv}); last=ts; }
    p+=derivP(p,V,s0,pvMax,fugaNls,bomb)*DT_SIM;
    ts+=DT_SIM; if(bomb) tOnS+=DT_SIM;
    const pv2=P_ATM-p; if(pv2<pvMin)pvMin=pv2; if(pv2>pvPico)pvPico=pv2;
  }
  su.push({t:ts,pv:P_ATM-p});
  const duty=sc.tSujeta>0?tOnS/sc.tSujeta:1;
  let tRet=0; const pv0=P_ATM-p;
  if(!f.ret){ tRet=T_COLAPSO; for(let q=0;q<=16;q++) re.push({t:q/16*T_COLAPSO, pv:pv0*(1-q/16)}); }
  else if(fugaNls<=0){ tRet=T_TOPE_F; for(let q=0;q<=16;q++) re.push({t:q/16*T_TOPE_F, pv:pv0}); }
  else { let pf=p; last=-1;
    while(tRet<T_TOPE_F && P_ATM-pf>=pvReq){ if(tRet-last>=dtRe){ re.push({t:tRet,pv:P_ATM-pf}); last=tRet; }
      pf+=derivP(pf,V,s0,pvMax,fugaNls,false)*DT_SIM; tRet+=DT_SIM; }
    re.push({t:tRet,pv:P_ATM-pf}); }
  return {alcanza:true,pvReq,pvMax,tAg,ag,su,re,tSu:sc.tSujeta,tRe:tRet,pvMin,pvPico,duty,pvEq:c.pvEq};
}

// Por qué un valor de un eje no es la respuesta, con los otros dos ejes en su óptimo.
function whyEje(sc,eje,valor){
  const base=OPT(sc);
  if(!base) return 'En este banco no hay ninguna combinación válida para esta estación.';
  const cfg=Object.assign({},base,{[eje]:valor});
  const r=evalua(sc,cfg);
  if(!r.valido) return whyCfg(sc,cfg);
  const val=ejeSol(sc,eje);
  const cm=val.length?Math.min.apply(null,val.map(x=>costeCfg(Object.assign({},base,{[eje]:x})))):Infinity;
  return 'Cumple los seis criterios, pero el sistema sale a '+costeCfg(cfg)+' u.c. y en este mismo eje hay una opción válida de '+cm+' u.c.: sobredimensionar también es un error de proyecto.';
}

function cfgCI(){ return {ventosa:CI.ventosa, numero:CI.numero, fuente:CI.fuente}; }
function drawCircuito(){
  const sc=POOL[CI.k], f=FUENTES[CI.fuente];
  const r=evalua(sc,cfgCI()), tz=traza(sc,cfgCI());
  bg();
  labelAt(40,42,'Circuito de vacío: cuánto tarda, cuánto gasta y qué pasa si falta la energía','#8fd1ff',23);

  const ymax=Math.max(r.pvReq,tz.pvPico,r.pvEq,100)*1.20;
  // --- panel A: agarre ---
  const AX=100, AY=390, AW=350, AH=210;
  labelAt(AX,AY-AH-24,'Evacuación (agarre)','#8fd1ff',18);
  const xmaxA=Math.max(0.010,(isFinite(tz.tAg)?tz.tAg:T_TOPE))*1000;
  ejes(AX,AY,AW,AH,xmaxA,ymax,0,'ms','mbar de vacío');
  const yReq=AY-AH*clamp(r.pvReq/ymax,0,1);
  line(AX,yReq,AX+AW,yReq,'#f4c95d',2); labelAt(AX+AW-4,yReq-7,'Δp requerido '+f1(r.pvReq,0),'#f4c95d',13,'right');

  line(AX,yEq,AX+AW,yEq,'#4a5a66',2); labelAt(AX+4,yEq-7,'equilibrio '+f1(r.pvEq,0),'#7a8a96',13);
  curva(AX,AY,AW,AH,tz.ag.map(p=>({t:p.t*1000,pv:p.pv})),xmaxA,ymax,'#4FD1C5',3);
  if(isFinite(tz.tAg)) labelAt(AX+AW/2,AY-AH-2,`t agarre = ${f1(tz.tAg*1000,1)} ms (incluye ${f1(T_VALV*1000,0)} ms de válvula)`,'#43D9AD',14,'center');
  else labelAt(AX+AW/2,AY-AH-2,'Nunca llega al vacío requerido','#d64545',15,'center');

  // --- panel B: sujeción + corte de energía ---
  const BX=610, BY=390, BW=350, BH=210;
  labelAt(BX,BY-BH-24,'Sujeción y corte de energía','#8fd1ff',18);
  const xmaxB=Math.max(0.2,sc.tSujeta+Math.min(tz.tRe,T_TOPE_F));
  ejes(BX,BY,BW,BH,xmaxB,ymax,1,'s','mbar de vacío');
  const yReqB=BY-BH*clamp(r.pvReq/ymax,0,1);
  line(BX,yReqB,BX+BW,yReqB,'#f4c95d',2);
  if(tz.alcanza){
    curva(BX,BY,BW,BH,tz.su,xmaxB,ymax,'#4FD1C5',3);
    curva(BX,BY,BW,BH,tz.re.map(p=>({t:p.t+sc.tSujeta,pv:p.pv})),xmaxB,ymax,f.ret?'#43D9AD':'#d64545',3);
    const xc=BX+BW*clamp(sc.tSujeta/xmaxB,0,1);
    line(xc,BY,xc,BY-BH,'#8a5a2b',2);
    labelAt(xc+5,BY-BH+16,'⚡ corte','#f4c95d',13);
    labelAt(BX+4,BY-BH-2,`retención ${f1(Math.min(tz.tRe,T_TOPE_F),2)} s`+(sc.exigeFalla?` / se piden ${f1(sc.tFalla,2)} s`:' (no se exige)'),f.ret?'#43D9AD':'#d64545',14);
  } else labelAt(BX+BW/2,BY-BH/2,'Sin agarre no hay sujeción','#7a8a96',17,'center');

  // --- lectura ---
  let y=470;
  labelAt(40,y,`Volumen a evacuar V = ${CI.numero} × (${f1(VENTOSAS[CI.ventosa].vol,1)} + ${f1(f.vtubo,1)}) cm³ = ${f1(r.V,3)} l`,'#dfe7ee',17); y+=27;
  labelAt(40,y,`Fuga de la pieza = ${f1(CI.numero*sc.fuga,1)} Nl/min a ${f1(P_FUGA_REF,0)}${MB} · el equilibrio queda en ${f1(r.pvEq,0)}${MB}`,'#dfe7ee',17); y+=27;
  labelAt(40,y,`Ciclo de trabajo del eyector: ${f1(r.duty*100,0)} % — aire ${f1(r.aire,2)} Nl · energía ${f1(r.energia,4)} Wh de ${f1(sc.eMax,2)} Wh`,'#dfe7ee',17); y+=34;
  const crit=CRIT.map(c=>`${r[c.k]?'✔':'✗'} ${c.nom}`);
  crit.forEach((t,i)=>{ const c=CRIT[i]; labelAt(40+(i%2)*500,y+((i/2)|0)*26,t,r[c.k]?'#43D9AD':'#d64545',16); });
  y+=3*26+16;
  if(r.valido) wrapText(40,y,`✔ Válida. Coste del sistema: ${r.coste} u.c.` ,'#43D9AD',17,940,22);
  else wrapText(40,y,'✗ '+whyCfg(sc,cfgCI()),'#d64545',17,940,22);
  labelAt(40,752,'⚠ El modelo integra V·dp/dt = −p·S(pv) + p₀·Q(pv) con paso de 0,5 ms: caudal de bombeo lineal decreciente y fuga laminar proporcional al vacío.','#f4c95d',13);
  bTex.needsUpdate=true;
}

function quizOpts(){ const d=quizDef(); return quizOrder.map(i=>d.o[i]); }

function renderQuiz(){
  const d=quizDef(), opts=quizOpts();
  el('quizQ').textContent=d.q;
  el('dxbtns').innerHTML=opts.map((o,i)=>{
    const cls=quizPick<0?'b':(i===quizPick?(o.ok?'b ok':'b bad'):(o.ok&&quizPick>=0?'b ok':'b'));
    return `<button class="${cls}" data-i="${i}" style="text-align:left;white-space:normal;line-height:1.35">${o.t}</button>`;
  }).join('');
  document.querySelectorAll('#dxbtns [data-i]').forEach(b=>{ b.onclick=()=>answerQuiz(+b.dataset.i); });
  el('quizVerd').textContent = quizPick<0?'Sin responder' : (quizOkFlag?'✔ Correcta':'✗ Incorrecta');
  el('quizVerd').className = quizPick<0?'' : (quizOkFlag?'good':'bad');
}
function answerQuiz(i){
  if(quizPick>=0) return;
  quizPick=i; quizOkFlag=!!quizOpts()[i].ok;
  synth.beep(quizOkFlag?1046:200,0.12,0.06);
  showToast(quizOkFlag?'<span style="color:var(--good)">✔ Correcta.</span>':'<span style="color:var(--bad)">✗ Incorrecta.</span> La respuesta buena queda marcada en verde.');
  renderQuiz();
}
function newReto(){

  retoK=Math.floor(Math.random()*POOL.length);
  RET=startCfg(POOL[retoK]);
  retoChecked=false; retoSolved=false; retoOk={ventosa:false,numero:false,fuente:false};

  syncRetoBtns(); drawReto(); updateTele();
  showToast('🎲 Nueva estación asignada.');

    set('pr_opt',opt?VCORTO[opt.ventosa]+' × '+opt.numero+' + '+FCORTO[opt.fuente]:'sin solución',opt?'good':'bad');
  }
  if(mode==='reto'){
    const sc=POOL[retoK], e=evalua(sc,RET);
    set('re_coste',e.coste+' u.c.');
    set('re_pvreq',f1(e.pvReq,0)+MB);

/* ---------- ciclo animado del cabezal ---------- */
const FASES=[
  {k:'baja',   nom:'Bajada al palé'},
  {k:'agarra', nom:'Evacuación'},
  {k:'sube',   nom:'Elevación'},
  {k:'lleva',  nom:'Traslado'},
  {k:'posa',   nom:'Descenso a la mesa'},
  {k:'suelta', nom:'Soplado y suelta'},
  {k:'vuelve', nom:'Regreso'},
];
let cicloOn=false, cFase=0, cT=0, ciclos=0;
let armDrop=0, headZ=0, pieceHeld=false, pieceZ=Z_PALE, pieceY=1.02, pvNow=0;
let RCI=null;
function durFase(i){
  const r=RCI;
  const tag=(r&&isFinite(r.tAgarre))?clamp(r.tAgarre*8,0.35,2.2):1.6;
  return [0.9,tag,0.8,1.5,0.7,0.5,1.2][i];
}
function toggleCiclo(){
  if(!simUnlocked) return;
  cicloOn=!cicloOn;
  if(!cicloOn){ cFase=0; cT=0; armDrop=0; headZ=0; pieceHeld=false; pvNow=0;
    pieceZ=PART.pieza.home.z; pieceY=PART.pieza.home.y; }
  const b=el('btnCiclo'); if(b){ b.textContent=cicloOn?'⏸ Parar el ciclo':'▶ Ciclo de pick&place'; b.classList.toggle('on',cicloOn); }
  const f=el('ci_fase'); if(f&&!cicloOn) f.textContent='parado';
}
function stepCiclo(dt){
  if(!cicloOn||!RCI) return;
  cT+=dt;
  const D=durFase(cFase), u=clamp(cT/D,0,1);
  const pvT=RCI.alcanza?RCI.pvMin:RCI.pvEq;
  switch(FASES[cFase].k){
    case 'baja':   armDrop=DROP*ease(u); pieceHeld=false; break;
    case 'agarra': armDrop=DROP; pvNow=pvT*u; pieceHeld=u>0.85; break;
    case 'sube':   armDrop=DROP*(1-ease(u)); pieceHeld=true; break;
    case 'lleva':  headZ=(Z_MESA-Z_PALE)*ease(u); pieceHeld=true; break;
    case 'posa':   armDrop=DROP*ease(u); pieceHeld=true; break;
    case 'suelta': pvNow=pvT*(1-u); pieceHeld=false; pieceZ=Z_MESA; pieceY=0.96; break;
    case 'vuelve': armDrop=DROP*(1-ease(u)); headZ=(Z_MESA-Z_PALE)*(1-ease(u)); pieceHeld=false; break;
  }
  const f=el('ci_fase'); if(f) f.textContent=FASES[cFase].nom;
  if(u>=1){
    cT=0; cFase++;
    if(cFase>=FASES.length){ cFase=0; ciclos++; pieceZ=PART.pieza.home.z; pieceY=PART.pieza.home.y;
      const c=el('ci_ciclos'); if(c) c.textContent=String(ciclos); }
  }
}
function applyRig(){
  ['brazo','colector','ventosa'].forEach(id=>{
    const g=groups[id]; if(!g||!placed[id]) return;
    const h=PART[id].home; g.position.set(h.x,h.y-armDrop,h.z+headZ);
  });
  const gv=groups.ventosa;
  if(gv&&placed.ventosa){ const cups=gv.getObjectByName('cups');
    if(cups) cups.scale.y=1-0.28*clamp(pvNow/700,0,1); }
  if(pieceHeld){ pieceZ=PART.pieza.home.z+headZ; pieceY=PART.pieza.home.y-armDrop; }
  const gp=groups.pieza;
  if(gp&&placed.pieza) gp.position.set(PART.pieza.home.x,pieceY,pieceZ);
  const gs=groups.vacuostato;
  if(gs&&placed.vacuostato){ const led=gs.getObjectByName('led');
    if(led){ const on=RCI&&pvNow>=RCI.pvReq;
      led.material.color.set(on?0x43D9AD:0xf4c95d);
      led.material.emissive.set(on?0x2f9e86:0x8a6a1e);
      led.material.emissiveIntensity=pvNow>1?1.3:0.15; } }
  const ge=groups.eyector;
  if(ge&&placed.eyector){ const fl=ge.getObjectByName('flujo');
    if(fl) fl.material.emissiveIntensity=(cicloOn&&pvNow>1)?1.4:0.12; }
}

/* ---------- animación ---------- */
S.setAnimate((dt,t)=>{
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i]; tw.t+=dt;
    const u=clamp(tw.t/tw.dur,0,1), e=ease(u);
    tw.obj.position.lerpVectors(tw.fromP,tw.toP,e);
    tw.obj.position.y+=Math.sin(u*Math.PI)*0.45;
    const s=tw.fromS+(tw.toS-tw.fromS)*e; tw.obj.scale.setScalar(s);
    tw.obj.rotation.y=tw.roty0*(1-e);
    if(u>=1){ if(tw.onDone) tw.onDone(); tweens.splice(i,1); }
  }
  trayObjs.forEach(g=>{
    const d=g.userData; if(!d||d.kind!=='part') return;
    g.position.y=d.baseY+Math.sin(t*1.6+d.phase)*0.02;
    g.rotation.y+=dt*0.35;
    const want=(selectedId===d.id)?0.10:0;
    d.lift+=(want-d.lift)*Math.min(1,dt*6);
    g.position.y+=d.lift;
  });
  ghostObjs.forEach(gh=>{
    const d=gh.userData;
    if(d.fading){ d.gm.opacity=Math.max(0,d.gm.opacity-dt*1.4); if(d.gm.opacity<=0.01&&gh.parent) scene.remove(gh); }
    else d.gm.opacity=0.24+0.14*Math.sin(t*3.2);
    if(d.shake>0){ d.shake=Math.max(0,d.shake-dt*2.2); gh.position.x=d.homeX+Math.sin(t*40)*0.05*d.shake; }
    else gh.position.x=d.homeX;
  });
  if(simUnlocked&&tweens.length===0){ stepCiclo(dt); applyRig(); }
});
S.start();
