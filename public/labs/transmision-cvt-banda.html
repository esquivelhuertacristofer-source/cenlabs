<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Transmisión CVT de banda: relación continua, presión y deslizamiento — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#08161F;--panel:rgba(7,20,28,.88);--line:#21495C;--ink:#EAF4F8;
    --dim:#9BB8C4;--accent:#5BC8FF;--accent2:#A8E2FF;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cF:#5BC8FF;--cR:#FFA445;--cE:#3DDC97;--cG:#C8D6D2;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#0f2733;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#173748}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#031a20;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#031a20;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#8ad8ff}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#031a20}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#5BC8FF;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f87a0;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f90a8;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#031a20}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .escs{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
  .esc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px;font-size:11.5px;line-height:1.35;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);color:#c4d3e6}
  .esc .rs{font-weight:700;font-size:11px}.esc .rs.ok{color:var(--good)}.esc .rs.mal{color:#ff9a9a}
  .esc .pista{font-size:10.5px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#09121c;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(30,53,80,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-top{display:flex;gap:6px;align-items:stretch}
  .vol{flex:0 0 76px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid rgba(30,53,80,.9);position:relative;min-height:76px}
  .vol canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-fig{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,53,80,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f87a0}
  .dk-tit{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#a3bcd6;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c6da;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#0f2733;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfdcec;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  /* ---- el recorrido paso a paso y el aro que señala la pieza ---- */
  .tour{border:1px solid rgba(91,200,255,.38);background:rgba(91,200,255,.06);border-radius:12px;padding:10px 11px;display:flex;flex-direction:column;gap:7px}
  .tour .tn{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .tour .pts{display:flex;gap:5px}.tour .pts i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}.tour .pts i.on{background:var(--accent)}.tour .pts i.ok{background:var(--good)}
  .tour h3{font-size:16px;line-height:1.2}
  .tour .tx{font-size:13px;line-height:1.5;color:#d3e3ea}.tour .tx b{color:#fff}
  .tour .tb{display:flex;gap:6px}.tour .tb .b{flex:1}
  .tour .salta{align-self:flex-end;font-size:11px;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:0;font-family:inherit}
  .foco{position:fixed;z-index:14;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 3px rgba(91,200,255,.55),0 0 24px 6px rgba(91,200,255,.45);pointer-events:none;display:none;animation:pulso 1.5s ease-in-out infinite}
  @keyframes pulso{0%,100%{transform:scale(.88);opacity:.95}50%{transform:scale(1.12);opacity:.55}}
  @media (prefers-reduced-motion:reduce){.foco{animation:none}}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,18,30,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,18,30,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d3e6}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,18,30,.92);border:1px solid rgba(124,196,255,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,18,30,.84);border:1px solid rgba(124,196,255,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .chips{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .chip{font-size:11.5px;line-height:1.35;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--dim)}
  .chip b{color:var(--ink)} .chip small{font-size:10.5px;color:var(--dim)}
  .chip.ok{border-color:rgba(52,211,153,.5)} .chip.ok b{color:var(--good)} .chip.mal{border-color:rgba(244,71,94,.5)} .chip.mal b{color:#ff9aa8}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}
  body.estrecho.ancho.t-panel .panel>.dk-top{grid-column:1;grid-row:2}
  body.estrecho.ancho.t-panel .panel>.dk-row{grid-column:1;grid-row:3/6;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-fu{grid-column:2;grid-row:2;align-self:start}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   LAB — TRANSMISIÓN CVT DE BANDA: RELACIÓN CONTINUA, PRESIÓN Y DESLIZAMIENTO
   (Autotrónica · mecanica-156)

   Dos poleas de diámetro variable unidas por una banda metálica de empuje. Al acercar o separar las mitades cónicas de cada polea, la
   banda rueda a otro radio y la relación i = Rs/Rp cambia sin escalones. La banda transmite por fricción: el aceite a presión aprieta las
   poleas con una fuerza axial F_ax = F_t·cosβ/(2μ) y, si falta, patina. Un motor de gasolina con su mapa de consumo y la carga de la
   ruta cierran el modelo: relación, presión, deslizamiento, bomba y consumo son un único modelo, en un bloque puro que un script de
   Node extrae TAL CUAL y verifica.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO='\u202F';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }



/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos marcas— y lo prueba:
   lo que se prueba es lo que corre. */
/* FISICA:INICIO */
/* ---- Transmisión CVT de banda de empuje: física pura (sin three). SI salvo donde se diga. ----
   Dos poleas de garganta variable (cada una, dos mitades cónicas de semiángulo β) unidas por una banda metálica de empuje de longitud
   fija L. Con el radio de rodadura de la primaria Rp y el de la secundaria Rs, la relación continua es i = ω_primaria/ω_secundaria = Rs/Rp
   y la longitud de la banda (tangentes exteriores) fija el par (Rp, Rs) para cada i. La banda no tiene dientes: transmite por FRICCIÓN, y
   la fuerza de apriete axial que hace falta para llevar la fuerza tangencial F_t sin patinar es F_ax = F_t·cosβ / (2·μ). La presión de
   aceite en el cilindro de la secundaria da F_ap = p·A_s; u = F_ax/F_ap es el uso de la capacidad. Detrás va un motor de gasolina de 1,6 L
   con consumo por la recta de Willans (pérdidas mecánicas + bombeo) y la carga de la ruta (rodadura + aire + pendiente). */
const G=9.80665, DOSPI=Math.PI*2, RAD=Math.PI/180, RPM=Math.PI/30;     // RPM: rad/s por rpm
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const suave=t=>t*t*(3-2*t);

/* ---- La transmisión (cifras de orden de magnitud de una CVT de banda de empuje de un compacto) ---- */
const CVT={Rmin:0.0230, Rmax:0.0600, C:0.1700, beta:11*RAD, Wb:0.024, mu:0.09, As:3.2e-3, iMin:0.40, iMax:2.60,
  eta0:0.970, kEta:0.015,        // rendimiento mecánico de la banda: 0,970 − 0,015·(ln i)²
  s0:0.002,                      // creep: s = s0·u/(1−u) (microdeslizamiento; curva didáctica)
  sMax:0.30,                     // por encima de u = 1 la banda patina: se acota a 30 %
  pMin:0.5e6, pMax:7.0e6,        // presión de línea que el mando permite (Pa)
  Q0:5.0e-5, kLeak:3.0e-11, etaB:0.60 };   // bomba: caudal de control 3 L/min, fugas ∝ p, rendimiento 0,60
/* ---- La longitud de banda y la geometría de las dos poleas ---- */
function longitudBanda(Rp,Rs){
  const a=Math.asin(clamp((Rs-Rp)/CVT.C,-1,1));
  return 2*CVT.C*Math.cos(a)+Rp*(Math.PI-2*a)+Rs*(Math.PI+2*a);
}
const LBANDA=longitudBanda(CVT.Rmin,CVT.iMax*CVT.Rmin*0.9999);     // la banda se corta para que la relación máxima (2,6) quepa justo
/** Para una relación i: radios de rodadura, ángulos de abrazamiento y tramos rectos (bisección sobre la longitud fija). */
function geom(i){
  i=clamp(i,CVT.iMin,CVT.iMax);
  let lo=0.005, hi=0.12;
  for(let k=0;k<90;k++){ const m=(lo+hi)/2; if(longitudBanda(m,i*m)<LBANDA) lo=m; else hi=m; }
  const Rp=(lo+hi)/2, Rs=i*Rp, al=Math.asin((Rs-Rp)/CVT.C);
  return {i,Rp,Rs,alfa:al,thp:Math.PI-2*al,ths:Math.PI+2*al,tramo:CVT.C*Math.cos(al),L:longitudBanda(Rp,Rs)};
}
/** Recorrido de la banda (plano de las poleas): centros en (0,0) y (C,0). n puntos por vuelta {x,y,tx,ty,s}. Sentido antihorario. */
function trazadoBanda(Rp,Rs,n){
  const C=CVT.C, al=Math.asin((Rs-Rp)/C), pts=[];
  const Lt=C*Math.cos(al), Lp=Rp*(Math.PI-2*al), Ls=Rs*(Math.PI+2*al), L=2*Lt+Lp+Ls;
  for(let k=0;k<n;k++){
    const s=k/n*L; let x,y,tx,ty;
    if(s<Lt){                                  // tramo inferior: de la primaria a la secundaria (la normal exterior apunta a −π/2 − α)
      const ang=-Math.PI/2-al;
      x=Rp*Math.cos(ang)+s*Math.cos(al); y=Rp*Math.sin(ang)-s*Math.sin(al); tx=Math.cos(al); ty=-Math.sin(al);
    } else if(s<Lt+Ls){                        // arco de la secundaria (de abajo a arriba por la derecha)
      const th=(s-Lt)/Rs, ang=-Math.PI/2-al+th; x=C+Rs*Math.cos(ang); y=Rs*Math.sin(ang); tx=-Math.sin(ang); ty=Math.cos(ang);
    } else if(s<2*Lt+Ls){                      // tramo superior: de la secundaria a la primaria
      const u=s-Lt-Ls, ang=Math.PI/2+al; x=C+Rs*Math.cos(ang)-u*Math.cos(al); y=Rs*Math.sin(ang)-u*Math.sin(al); tx=-Math.cos(al); ty=-Math.sin(al);
    } else {                                   // arco de la primaria (de arriba a abajo por la izquierda)
      const th=(s-2*Lt-Ls)/Rp, ang=Math.PI/2+al+th; x=Rp*Math.cos(ang); y=Rp*Math.sin(ang); tx=-Math.sin(ang); ty=Math.cos(ang);
    }
    pts.push({x,y,tx,ty,s});
  }
  return {pts,L,Lt,Lp,Ls};
}
const etaMec=i=>CVT.eta0-CVT.kEta*Math.pow(Math.log(i),2);
/** Microdeslizamiento: s = s0·u/(1−u) hasta u = 1; por encima, la banda patina (acotado). */
const creep=u=>u>=1?CVT.sMax:Math.min(CVT.sMax,CVT.s0*u/(1-u));
/** Bomba de aceite: caudal de control + fugas ∝ p; potencia hidráulica p·Q y de accionamiento p·Q/η. */
function bomba(p){ const Q=CVT.Q0+CVT.kLeak*p; return {Q,Phid:p*Q,P:p*Q/CVT.etaB}; }
/** Fuerza de apriete axial (por polea) que evita el deslizamiento con fuerza tangencial F_t: F_ax = F_t·cosβ/(2μ). */
const apriete=Ft=>Ft*Math.cos(CVT.beta)/(2*CVT.mu);
/** Capacidad de par de una polea de radio R con apriete F: T_cap = 2·μ·R·F/cosβ. */
const parCapacidad=(R,F)=>2*CVT.mu*R*F/Math.cos(CVT.beta);

/* ---- El coche y la ruta ---- */
const VEH={m:1450, Crr:0.012, CdA:0.66, rho:1.20, rw:0.31, FD:3.50, etaFD:0.97};
function carga(v,pend){                     // v en m/s, pend en %: fuerza en la rueda y potencia
  const th=Math.atan(pend/100), Fr=VEH.m*G*VEH.Crr*Math.cos(th), Fa=0.5*VEH.rho*VEH.CdA*v*v, Fp=VEH.m*G*Math.sin(th), F=Fr+Fa+Fp;
  return {Fr,Fa,Fp,F,P:F*v};
}
const nSec=v=>v/VEH.rw*VEH.FD/RPM;           // rpm del eje secundario a la velocidad v
const nMotorPara=(v,i)=>nSec(v)*i;           // rpm del motor sin deslizamiento

/* ---- El motor: gasolina 1,6 L de aspiración natural. Consumo por Willans: combustible = (P_e + P_pérdidas)/η_i ---- */
const MOTOR={Vd:1.6e-3, nRal:900, nMax:6200, Tpk:150, nTpk:4200, wT:3300, kT:0.55, LHV:43.0e6, rhoC:745,
  etaI:0.400, xEnr:0.85, kEnr:0.30};
const Tmax=n=>MOTOR.Tpk*(1-MOTOR.kT*Math.pow((n-MOTOR.nTpk)/MOTOR.wT,2));            // N·m a plena carga
const fmep=n=>45e3+22e3*(n/1000)+1.2e3*Math.pow(n/1000,2);                          // fricción (Pa)
const pmep=x=>60e3*Math.pow(Math.max(0,1-x),1.3);                                    // bombeo por estrangulamiento (Pa)
const etaInd=n=>MOTOR.etaI*(1-0.06*Math.pow((n-3200)/3000,2));
const enriquece=x=>1+MOTOR.kEnr*Math.pow(Math.max(0,(x-MOTOR.xEnr)/(1-MOTOR.xEnr)),2);
/** Estado del motor en (n rpm, T N·m): potencia, pérdidas, combustible, BSFC (g/kWh). */
function motorEn(n,T){
  const w=n*RPM, Pe=T*w, x=T/Tmax(n);
  const Ppe=(fmep(n)+pmep(Math.min(x,1)))*MOTOR.Vd*(n/60)/2;                      // potencia de pérdidas (fricción + bombeo)
  const Pf=(Pe+Ppe)/etaInd(n)*enriquece(x);                                        // potencia en el combustible
  const md=Pf/MOTOR.LHV;                                                           // kg/s
  return {n,T,w,Pe,x,Ppe,Pf,md,bsfc:Pe>0?md/Pe*3.6e9:Infinity,etaB:Pe/Pf};
}
const bsfc=(n,T)=>motorEn(n,T).bsfc;

/* ---- Un punto de funcionamiento en régimen: velocidad, pendiente, relación y presión de línea ---- */
function punto(v,pend,i,p){
  const g=geom(i), c=carga(v,pend), ws=v/VEH.rw*VEH.FD, Ps=c.P/VEH.etaFD, Ts=Ps/ws;
  const Ft=Ts/g.Rs, Fax=apriete(Ft), Fap=p*CVT.As, u=Fax/Fap, s=creep(u), pat=u>=1;
  const eM=etaMec(g.i), Pin=Ps/(eM*(1-s)), bp=bomba(p), Pe=Pin+bp.P;
  const wp=g.i*ws/(1-s), ne=wp/RPM, Te=Pe/wp, m=motorEn(ne,Te);
  const lper100=(1000*m.md/MOTOR.rhoC)/v*1e5;                                      // L/100 km
  return {v,pend,i:g.i,g,c,ws,wp,ne,ns:ws/RPM,Ps,Ts,Ft,Fax,Fap,u,s,pat,eM,Pin,bomba:bp,Pe,Te,m,Pf:m.Pf,md:m.md,
    lper100,etaTrans:Ps/Pe,etaTot:c.P/m.Pf,tmax:Tmax(ne),
    finMotor:ne<MOTOR.nRal||ne>MOTOR.nMax, ahoga:Te>Tmax(ne)*0.98, bajo:ne<MOTOR.nRal, alto:ne>MOTOR.nMax};
}
/** Presión que deja el uso de la capacidad en u: p = F_ax/(u·A_s), acotada al rango del mando. */
function presionPara(v,pend,i,u){
  const g=geom(i), c=carga(v,pend), Ts=c.P/VEH.etaFD/(v/VEH.rw*VEH.FD);
  return clamp(apriete(Ts/g.Rs)/(u*CVT.As),CVT.pMin,CVT.pMax);
}
const U_OBJ=0.80, U_MAX=0.85, TOL=0.05;      // uso objetivo del apriete «justo» · tope de uso del reto · margen de consumo del reto
/** Relación y presión de mínimo consumo para una velocidad y una pendiente: barrido fino de i con el apriete «justo» en cada una. */
function optimo(v,pend,{n=480}={}){
  let mejor=null;
  for(let k=0;k<=n;k++){
    const i=CVT.iMin*Math.pow(CVT.iMax/CVT.iMin,k/n), p=presionPara(v,pend,i,U_OBJ), r=punto(v,pend,i,p);
    if(r.finMotor||r.ahoga||r.u>U_MAX) continue;
    if(!mejor||r.lper100<mejor.lper100) mejor=r;
  }
  return mejor;
}
/** Rango de relaciones que el motor admite (entre ralentí y régimen máximo) a la velocidad v. */
function rangoRelacion(v){ const ns=nSec(v); return [Math.max(CVT.iMin,MOTOR.nRal/ns),Math.min(CVT.iMax,MOTOR.nMax/ns)]; }

/* ---- Escenarios del reto ---- */
const ESCENARIOS=[
  {id:'llano',nombre:'Autovía en llano',desc:'80 km/h por una carretera plana',kmh:80,pend:0},
  {id:'subida',nombre:'Subida con carga',desc:'60 km/h en una cuesta del 6 %',kmh:60,pend:6},
  {id:'rapido',nombre:'Autopista rápida',desc:'110 km/h con una leve subida del 2 %',kmh:110,pend:2},
  {id:"ciudad",nombre:"Ciudad con repecho",desc:"45 km/h en una cuesta del 3 %",kmh:45,pend:3},
];
const escPorId=id=>ESCENARIOS.find(e=>e.id===id)||ESCENARIOS[0];
/** El veredicto del reto: sin patinar (con margen), motor dentro de sus límites y consumo a menos de TOL del mínimo posible. */
function evalua(esc,i,p,opIn){
  const v=esc.kmh/3.6, r=punto(v,esc.pend,i,p), op=opIn||optimo(v,esc.pend);
  const c={patina:r.u<=U_MAX, motor:!r.finMotor&&!r.ahoga, consumo:r.lper100<=op.lper100*(1+TOL)};
  return {r,op,c,ok:c.patina&&c.motor&&c.consumo};
}

function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h||w;return c;}
function tex(canvas,{srgb=false,flip=true}={}){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=srgb?THREE.SRGBColorSpace:THREE.NoColorSpace; t.flipY=flip;
  // Mipmaps sí: sin ellos cada píxel muestrea un texel suelto y el especular centellea al girar.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter; t.magFilter=THREE.LinearFilter; t.anisotropy=8;
  return t;
}
function fondoDegradado(arriba,medio,abajo){
  const c=cv(8,512),x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,512); g.addColorStop(0,arriba); g.addColorStop(0.5,medio); g.addColorStop(1,abajo);
  x.fillStyle=g; x.fillRect(0,0,8,512);
  const t=tex(c,{srgb:true}); t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping; return t;
}

/* ===================== 4. TEXTURAS Y MATERIALES =====================
   Nada de grano fino —se lee como lija sobre caras grandes—: variación lenta de tono y marcas propias de un banco técnico
   (retícula fina, viñeta, sectores radiales en las poleas) dibujadas como objetos, no como ruido. */
function texPlataforma(){
  const W=512,c=cv(W),x=c.getContext('2d');
  const g=x.createRadialGradient(W*0.45,W*0.4,W*0.05,W/2,W/2,W*0.75); g.addColorStop(0,'#2b4654'); g.addColorStop(1,'#14262f');
  x.fillStyle=g; x.fillRect(0,0,W,W);
  x.strokeStyle='rgba(120,210,226,0.10)'; x.lineWidth=1;
  for(let i=0;i<=16;i++){ const p=i*W/16; x.beginPath(); x.moveTo(p,0); x.lineTo(p,W); x.moveTo(0,p); x.lineTo(W,p); x.stroke(); }
  x.strokeStyle='rgba(120,210,226,0.22)'; x.lineWidth=2;
  for(let i=0;i<=4;i++){ const p=i*W/4; x.beginPath(); x.moveTo(p,0); x.lineTo(p,W); x.moveTo(0,p); x.lineTo(W,p); x.stroke(); }
  return tex(c,{srgb:true});
}
/** Polea: 24 sectores de pulido alterno (se ve girar) y un aro más oscuro cerca del borde. u = vuelta, v = del cubo al borde. */
function texPolea(){
  const W=512,H=128,c=cv(W,H),x=c.getContext('2d');
  const NS=24;
  for(let k=0;k<NS;k++){ const a=Math.round(W*k/NS), b=Math.round(W*(k+1)/NS), t=0.5+0.5*Math.sin(k*2.1)*0.0;
    x.fillStyle=k%2?'#8f9ca6':'#a9b6bf'; x.fillRect(a,0,b-a,H); }
  const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'rgba(0,0,0,0.22)'); g.addColorStop(0.18,'rgba(0,0,0,0)'); g.addColorStop(0.85,'rgba(255,255,255,0.0)'); g.addColorStop(1,'rgba(0,0,0,0.30)');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(20,40,50,0.55)'; for(let k=0;k<NS;k+=1){ const a=Math.round(W*k/NS); x.fillRect(a-1,0,2,H); }     // la línea de cada sector
  x.fillStyle='#5BC8FF'; x.fillRect(0,0,6,H);                                        // la marca de referencia: sólo ella cambia de color
  return tex(c,{srgb:true,flip:false});
}
/** Banda de empuje: cada repetición es un elemento (placa de acero con su hendidura). u = a lo largo de la banda, v = a lo ancho. */
function texBanda(){
  const W=64,H=64,c=cv(W,H),x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,W,0); g.addColorStop(0,'#59636b'); g.addColorStop(0.5,'#a8b2b9'); g.addColorStop(1,'#59636b');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(8,14,18,0.82)'; x.fillRect(0,0,6,H);                              // la junta entre elementos
  x.fillStyle='rgba(8,14,18,0.35)'; x.fillRect(0,H*0.44,W,H*0.12);                    // la ranura central (el paquete de anillos de acero)
  return tex(c,{srgb:true});
}

/* ===================== 6. LA TRANSMISIÓN =====================
   Escala: 1 unidad de la escena = 10 cm (los radios reales de 23 a 60 mm salen de 0,23 a 0,60). Dos poleas de ejes paralelos a Z, la de
   entrada (primaria, abajo a la izquierda) y la de salida (secundaria, arriba a la derecha), unidas por la banda; cada polea es un par de
   mitades cónicas (semiángulo β = 11°). La mitad cercana a la cámara es de cristal para ver la banda posada en la garganta. El eje de las
   poleas se dibuja ×1,6 (AX) para que se note el vaivén de las mitades: el ángulo real de 11° se conserva en las fórmulas y se dibuja ×1,6.
   Los giros se muestran en cámara lenta ×1/40 (mismo factor en motor, poleas, banda y salida: la relación entre ellos es exacta). */
const MUNDO=new THREE.Group(); scene.add(MUNDO);
const U=10, AX=1.6, TILT=52*RAD, K_LENTO=40, NEL=90;
const C10=CVT.C*U, TB=Math.tan(CVT.beta)*AX, R0=CVT.Rmin*U;
const RIM=0.67, HUBR=0.17, ESPES=0.30, ESP_BANDA=0.15;
const POS_P=V3(-0.55,0.92,0), POS_S=POS_P.clone().add(V3(Math.cos(TILT)*C10,Math.sin(TILT)*C10,0));
const wf=r=>AX*(r-R0)*Math.tan(CVT.beta);                    // altura de la cara cónica sobre el plano de referencia (hacia afuera)

/* una mitad de polea: cara cónica pulida, borde achaflanado, trasera plana y manguito del cubo. Eje del torno = +Y local (= hacia afuera). */
function geoMitad(){
  const rs=0.10, wB=wf(RIM)+ESPES;
  const perfil=[[rs,wf(HUBR)],[HUBR,wf(HUBR)],[HUBR,wf(HUBR)],[RIM-0.03,wf(RIM-0.03)],[RIM,wf(RIM)+0.03],[RIM,wf(RIM)+0.03],[RIM,wB-0.05],[RIM-0.05,wB],[RIM-0.05,wB],
    [0.34,wB],[0.34,wB],[0.26,wB+0.07],[0.26,wB+0.07],[0.26,wB+0.55],[0.26,wB+0.55],[rs,wB+0.55]];
  return P3.revolucion(perfil,{seg:72});
}
const GEO_MITAD=geoMitad();
const PUL={p:null,s:null};
/** Una polea completa. Todo lo que gira va dentro de `spin`; las mitades se deslizan en Z con la relación. */
function construyePolea(clave,material){
  const grupo=new THREE.Group(), spin=new THREE.Group(); grupo.add(spin); grupo.userData.clave=clave;
  const lejos=malla(GEO_MITAD.clone(),M.polea); lejos.rotation.x=-Math.PI/2;                       // +Y local → −Z
  const cerca=new THREE.Group(); cerca.rotation.x=Math.PI/2;                                        // +Y local → +Z
  const vid=malla(GEO_MITAD.clone(),M.vidrio,{sombra:false}); vid.renderOrder=3; cerca.add(vid);
  const aro=new THREE.Mesh(new THREE.TorusGeometry(RIM-0.005,0.014,8,96),M.eje); aro.rotation.x=Math.PI/2; aro.position.y=wf(RIM)+0.03; cerca.add(aro);
  const wB=wf(RIM)+ESPES;
  const cam=new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.36,0.50,40,1,true),M.aceite); cam.position.y=wB+0.34; cam.renderOrder=4; cerca.add(cam);
  const tapa=malla(new THREE.CylinderGeometry(0.30,0.30,0.06,40),M.carcasa); tapa.position.y=wB+0.62; cerca.add(tapa);
  const eje=malla(new THREE.CylinderGeometry(0.10,0.10,2.9,28).rotateX(Math.PI/2),M.eje); eje.position.z=-0.15;
  spin.add(lejos,cerca,eje);
  const arol=new THREE.Mesh(new THREE.TorusGeometry(RIM-0.005,0.014,8,96),M.eje); arol.position.z=-(0); lejos.add(arol); arol.rotation.x=0; arol.position.set(0,wf(RIM)+0.03,0); arol.rotation.x=Math.PI/2;
  return {grupo,spin,lejos,cerca,cam};
}

/* ---- la banda: una sección trapecial (cada flanco sigue el cono) barrida por el recorrido exacto de la banda ---- */
const BANDA={N:260,mesh:null,geo:null,Rp:-1,Rs:-1,fase:0};
(function(){
  const N=BANDA.N, nv=(N+1)*8, idx=[];
  for(let k=0;k<N;k++) for(let f=0;f<4;f++){ const a=k*8+f*2, b=a+1, c=(k+1)*8+f*2, d=c+1; idx.push(a,c,b, b,c,d); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(nv*3),3));
  g.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(nv*3),3));
  const uv=new Float32Array(nv*2);
  for(let k=0;k<=N;k++) for(let f=0;f<4;f++) for(let s=0;s<2;s++){ const j=k*8+f*2+s; uv[j*2]=k/N*NEL; uv[j*2+1]=s; }
  g.setAttribute('uv',new THREE.BufferAttribute(uv,2)); g.setIndex(idx);
  BANDA.geo=g; BANDA.mesh=new THREE.Mesh(g,M.banda); BANDA.mesh.castShadow=true; BANDA.mesh.receiveShadow=true; BANDA.mesh.frustumCulled=false;
  BANDA.mesh.userData.clave='banda'; CVT_G.add(BANDA.mesh);
  T_BAN.wrapS=THREE.RepeatWrapping; T_BAN.wrapT=THREE.ClampToEdgeWrapping;
})();
/** Reconstruye la banda para los radios (m) de rodadura Rp y Rs. */
function actualizaBanda(Rp,Rs){
  const N=BANDA.N, tr=trazadoBanda(Rp,Rs,N), P=BANDA.geo.attributes.position.array, Nn=BANDA.geo.attributes.normal.array;
  const bv=Math.atan(TB), sbv=Math.sin(bv), cbv=Math.cos(bv), hw0=AX*CVT.Wb*U/2, hwO=hw0+ESP_BANDA/2*TB, hwI=hw0-ESP_BANDA/2*TB, t2=ESP_BANDA/2;
  for(let k=0;k<=N;k++){
    const q=tr.pts[k%N], px=q.x*U, py=q.y*U, nx=q.ty, ny=-q.tx;
    const ox=px+nx*t2, oy=py+ny*t2, ix=px-nx*t2, iy=py-ny*t2;
    const V=[[ox,oy,-hwO, nx,ny,0],[ox,oy,hwO, nx,ny,0],                     // cara exterior
             [ix,iy,-hwI, -nx,-ny,0],[ix,iy,hwI, -nx,-ny,0],                // cara interior
             [ix,iy,hwI, -sbv*nx,-sbv*ny,cbv],[ox,oy,hwO, -sbv*nx,-sbv*ny,cbv],     // flanco +z (de dentro a fuera)
             [ix,iy,-hwI, -sbv*nx,-sbv*ny,-cbv],[ox,oy,-hwO, -sbv*nx,-sbv*ny,-cbv]]; // flanco −z
    for(let j=0;j<8;j++){ const o=(k*8+j)*3, v=V[j]; P[o]=v[0]; P[o+1]=v[1]; P[o+2]=v[2]; Nn[o]=v[3]; Nn[o+1]=v[4]; Nn[o+2]=v[5]; }
  }
  BANDA.geo.attributes.position.needsUpdate=true; BANDA.geo.attributes.normal.needsUpdate=true; BANDA.geo.computeBoundingSphere();
  BANDA.Rp=Rp; BANDA.Rs=Rs;
}
/** Coloca las mitades de cada polea según su radio de rodadura: la cara pasa a Wb/2 del plano de la banda justo en R. */
function colocaMitades(R10,P){
  const off=AX*(CVT.Wb*U/2)-AX*(R10-R0)*Math.tan(CVT.beta);
  P.lejos.position.z=-off; P.cerca.position.z=off;
}

  for(let k=0;k<4;k++){ const z=-2.95-0.72+k*0.48; const c=new THREE.CatmullRomCurve3([V3(-1.45,1.0,z),V3(-1.25,1.0,z),V3(-1.12,1.07,z),V3(-1.0,1.07,z)]);
    const tubo=malla(new THREE.TubeGeometry(c,12,0.065,10,false),M.eje); MOT.add(tubo); }

/* ===================== 11. EL ESTADO Y EL RELOJ =====================
   Un solo cálculo alimenta la escena, el dock y las cifras. Lo que el alumno (o el recorrido, o el reto) PIDE —relación y presión— se
   alcanza con un retardo suave (ACT: la transmisión no cambia de golpe, las mitades de las poleas tardan en deslizarse); con lo que
   hay AHORA se calcula el punto de funcionamiento completo (punto()) en cada cuadro. El reloj SIM.t es el tiempo de la escena (s) y
   avanza dt·velocidad: mueve las poleas, la banda, el volante, y el cursor y la ventana de las gráficas. Modos: «Recorrido»,
   «Probar» (mandos libres) y «Reto». */
const EST={modo:'tour',kmh:80,pend:0,i:0.75,p:3.0e6,rauto:true,pauto:true,vel:1,pausa:REDUCIDO,autoRunning:false,vista:'todo',rot:false};
const ACT={i:1.0,p:3.0e6};
const SIM={t:0,e:null,salto:true,th:{p:0,s:0},ver:0};
const HIST={t:[],ne:[],ns:[],l:[],u:[],T:[],ult:-1};
let CALC=null;
function paramsActuales(){
  if(EST.modo==='tour'){ const p=tourParams(); if(p) return p; }
  if(EST.modo==='reto'){ const p=guiaParams(); if(p) return p; }
  return {kmh:EST.kmh,pend:EST.pend,i:EST.i,p:EST.p,rauto:EST.rauto,pauto:EST.pauto};
}
const _opt=new Map();
function optimoCache(v,pend){ const k=v.toFixed(3)+'|'+pend; let o=_opt.get(k); if(!o){ o=optimo(v,pend); _opt.set(k,o); } return o; }
/** Lo que se pide ahora: relación y presión objetivo (las automáticas salen del modelo). */
function objetivo(pr){
  const v=pr.kmh/3.6, op=optimoCache(v,pr.pend);
  const i=pr.rauto?op.i:clamp(pr.i,CVT.iMin,CVT.iMax);
  const p=pr.pauto?presionPara(v,pr.pend,i,U_OBJ):clamp(pr.p,CVT.pMin,CVT.pMax);
  return {v,pend:pr.pend,i,p,op};
}
function reiniciaCalculo(){
  const pr=paramsActuales(); CALC={pr,obj:objetivo(pr)}; SIM.ver++;
  if(typeof pintaDockFijo==='function') pintaDockFijo();
}
/** Salta de golpe a lo pedido (al cambiar de paso o de modo): sin retardo ni historial. */
function saltaAlObjetivo(){
  if(!CALC) reiniciaCalculo(); ACT.i=CALC.obj.i; ACT.p=CALC.obj.p; SIM.salto=true; limpiaHist();
}
function limpiaHist(){ for(const k of ['t','ne','ns','l','u','T']) HIST[k].length=0; HIST.ult=-1; }

/* ---- lo que se ve ---- */
let slipK=0, ultAviso=false, cargaK=0;
function aplicaEscena(dtS,dtSim,dtR){
  if(dtR===undefined) dtR=dtS;
  const C=CALC; if(!C) return;
  const o=C.obj;
  if(SIM.salto){ ACT.i=o.i; ACT.p=o.p; }
  else { ACT.i=Math.exp(Math.log(ACT.i)+(Math.log(o.i)-Math.log(ACT.i))*(1-Math.exp(-dtSim/0.55)));
         ACT.p=ACT.p+(o.p-ACT.p)*(1-Math.exp(-dtSim/0.30)); }
  ACT.i=clamp(ACT.i,CVT.iMin,CVT.iMax);
  SIM.t+=dtSim;
  const e=punto(o.v,o.pend,ACT.i,ACT.p); SIM.e=e; const g=e.g;
  // ---- las poleas cambian de tamaño: la banda y las mitades siguen el radio de rodadura ----
  if(Math.abs(g.Rp-BANDA.Rp)>2e-6||Math.abs(g.Rs-BANDA.Rs)>2e-6){ actualizaBanda(g.Rp,g.Rs); colocaMitades(g.Rp*U,PUL.p); colocaMitades(g.Rs*U,PUL.s); }
  // ---- los giros, en cámara lenta ×1/40 (mismo factor para todo) ----
  const wp=e.wp/K_LENTO, wsd=e.ws/K_LENTO;
  SIM.th.p+=wp*dtSim; SIM.th.s+=wsd*dtSim;
  PUL.p.spin.rotation.z=SIM.th.p; PUL.s.spin.rotation.z=SIM.th.s;
  MOTOR3.vol.rotation.z=SIM.th.p; SAL3.pinon.rotation.z=SIM.th.s;
  BANDA.fase+=wp*g.Rp*U*dtSim*NEL/(g.L*U); T_BAN.offset.x=-(BANDA.fase%1);
  // ---- el aceite a presión: de ámbar a rojo y más brillante ----
  const kp=clamp((ACT.p-CVT.pMin)/(CVT.pMax-CVT.pMin),0,1);
  M.aceite.color.setRGB(1.0,mezcla(0.78,0.26,kp),mezcla(0.30,0.10,kp)); M.aceite.emissive.setRGB(1.0,mezcla(0.55,0.12,kp),0.02); M.aceite.emissiveIntensity=0.15+1.1*kp; M.aceite.opacity=0.42+0.3*kp;
  // ---- la banda patina: se pone al rojo ----
  const sl=clamp((e.u-0.88)/0.12,0,1);
  slipK+=(sl-slipK)*clamp(dtR*10,0,1);
  M.banda.emissiveIntensity=slipK*(0.55+0.35*Math.sin(performance.now()*0.014));
  const hay=e.u>=0.97; if(hay&&!ultAviso&&!EST.pausa&&typeof sonido!=='undefined') sonido.aviso(); ultAviso=hay;
  // ---- el escape se pone al rojo con la carga del motor ----
  const kc=clamp((e.m.x-0.35)/0.65,0,1); cargaK+=(kc-cargaK)*clamp(dtR*5,0,1);
  M.escape.emissiveIntensity=2.4*Math.pow(cargaK,1.6);
  // ---- el historial de las gráficas: 20 muestras por segundo de tiempo de la escena ----
  if(SIM.salto) limpiaHist();
  if(HIST.ult<0||SIM.t-HIST.ult>=0.05||SIM.t<HIST.ult){ if(SIM.t<HIST.ult) limpiaHist(); HIST.ult=SIM.t;
    HIST.t.push(SIM.t); HIST.ne.push(e.ne); HIST.ns.push(e.ns); HIST.l.push(e.lper100); HIST.u.push(e.u); HIST.T.push(e.Te);
    while(HIST.t.length&&SIM.t-HIST.t[0]>VENTANA+1){ for(const k of ['t','ne','ns','l','u','T']) HIST[k].shift(); } }
}
const VENTANA=30;       // segundos de historial que muestran las gráficas
const AVISO_U=0.97;

  } else if(EST.modo==='reto') h+=htmlGuia();

const FUENTE="'Outfit',system-ui,sans-serif";
function lienzo(id){ const box=el(id), c=box.querySelector('canvas'); return {box,c,ctx:c.getContext('2d'),w:0,h:0,dpr:1}; }
function abre(L){ const r=L.box.getBoundingClientRect(), dpr=Math.min(3,window.devicePixelRatio||1);
  const w=Math.max(20,Math.round(r.width)), h=Math.max(20,Math.round(r.height));
  if(L.w!==w||L.h!==h||L.dpr!==dpr){ L.c.width=Math.round(w*dpr); L.c.height=Math.round(h*dpr); L.w=w; L.h=h; L.dpr=dpr; L.fondo=null; }
  const x=L.ctx; x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h); return x; }
function txt(x,t,px,py,col,size,align,peso){ x.fillStyle=col; x.font=(peso||'600')+' '+(size||11)+'px '+FUENTE; x.textAlign=align||'left'; x.textBaseline='alphabetic'; x.fillText(t,px,py); }
function raya(x,x1,y1,x2,y2,col,w,dash){ x.strokeStyle=col; x.lineWidth=w||1; x.setLineDash(dash||[]); x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke(); x.setLineDash([]); }
const LMAPA=lienzo('gFu'), LRPM=lienzo('gTr'), LCON=lienzo('gFr'), LUSO=lienzo('gSp'), LESQ=lienzo('gVol');
const COL={ne:'#58d6ff',ns:'rgba(200,215,225,0.6)',con:'#ffc15a',uso:'#58d6ff',peligro:'rgba(244,71,94,0.20)',pelLin:'#ff6b7c',margen:'rgba(255,209,102,0.7)',opt:'#7dffb0'};
const GRID='rgba(160,200,220,0.10)', EJE='#3f6a80', TXT='#8eb3c5';
/** ¿Se puede enseñar ya el punto óptimo? En el reto, sólo tras validar (regla: no regalar la respuesta). */
const muestraOptimo=()=>EST.modo!=='reto'||(GUIA.paso==='ajusta'&&!!GUIA.r2&&GUIA.r2.validado);
/* ---- el mapa de consumo del motor: colores por tramos (g/kWh), línea de plena carga y el punto de funcionamiento ---- */
const NMIN=800, NMAX=6400, TMAXV=160;
const NIVELES=[[245,'#2fd6c2'],[260,'#5bd67d'],[285,'#b9d64a'],[320,'#f0b13a'],[380,'#e2662c'],[480,'#a8283a'],[1e9,'#6a1a2c']];
function colorBsfc(b){ for(const [lim,c] of NIVELES) if(b<=lim) return c; return NIVELES[NIVELES.length-1][1]; }
function fondoMapa(L,X0,X1,Y0,Y1){
  if(L.fondo&&L.fondo.w===L.w&&L.fondo.h===L.h&&L.fondo.dpr===L.dpr) return L.fondo.c;
  const c=document.createElement('canvas'); c.width=Math.round(L.w*L.dpr); c.height=Math.round(L.h*L.dpr); const g=c.getContext('2d'); g.setTransform(L.dpr,0,0,L.dpr,0,0);
  const paso=3, nx=Math.ceil((X1-X0)/paso), ny=Math.ceil((Y1-Y0)/paso);
  for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
    const px=X0+i*paso, py=Y0+j*paso, n=NMIN+(px+paso/2-X0)/(X1-X0)*(NMAX-NMIN), T=TMAXV*(1-(py+paso/2-Y0)/(Y1-Y0));
    if(T>Tmax(n)){ g.fillStyle='#0b1822'; }
    else g.fillStyle=colorBsfc(bsfc(n,Math.max(0.5,T)));

  for(const h of hits){ let vis=true; for(let p=h.object;p;p=p.parent) if(!p.visible||(p.userData&&p.userData.fondo===true)) vis=false; if(!vis) continue; if(h.object.material===M.vidrio) continue; return h; }
  return null;
}
function claveDe(h){ if(!h) return null; let o=h.object;
  while(o){ if(o.userData&&o.userData.clave) return o.userData.clave; o=o.parent; }
  return null; }
let hovT=0;
renderer.domElement.addEventListener('pointermove',e=>{

/* ===================== 17. DISPOSICIÓN: ANCHO, ESTRECHO, MÓVIL =====================
   Si no caben guía, escena y dock lado a lado (el marco de la plataforma, una tableta), la escena va arriba
   y guía e instrumentos comparten una hoja con pestañas abajo. */
function disposicion(){
  const W=innerWidth, b=document.body;
  const estrecho=W<1080, movil=W<640;
  b.classList.toggle('estrecho',estrecho); b.classList.toggle('movil',movil); b.classList.toggle('ancho',estrecho&&!movil);
  if(estrecho){ if(!b.classList.contains('t-hud')&&!b.classList.contains('t-panel')) b.classList.add('t-hud'); ajustaHoja(); }
  el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('on',b.classList.contains('t-'+t.dataset.tab)));
}
function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.40:0.43),240,450));
  let hh=base; const hud=el('hud');
  if(movil&&b.classList.contains('t-panel')) hh=Math.round(clamp(H*0.55,240,540));
  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;
    hh=Math.round(clamp(pide,240,Math.max(base,H*(movil?0.45:0.56)))); }
  const ant=parseFloat(b.style.getPropertyValue('--hojaH'))||0;
  if(Math.abs(ant-hh)>1){ b.style.setProperty('--hojaH',hh+'px'); colocaBarras(); centraEnHueco(); }
}
el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.onclick=()=>{ const b=document.body; b.classList.remove('t-hud','t-panel'); b.classList.add('t-'+t.dataset.tab); disposicion(); centraEnHueco(); });

/* ===================== 18. EL RECORRIDO PASO A PASO =====================
   Al abrir el lab arranca solo un recorrido de siete pasos que explica, sin siglas sin definir, qué se ve: las dos poleas y la banda,
   cómo cambiar el tamaño cambia la «marcha», el punto donde el motor gasta menos, la banda que patina si falta apriete, la bomba
   que gasta si sobra y tu turno. Cada paso lleva la cámara a su pieza y la señala con un aro. Las cifras de la prosa salen del motor. */

const PAR_BIEN={kmh:80,pend:0,i:0.75,p:3.0e6,rauto:true,pauto:true};

/* ===================== 19. EL RETO: CALCULA, AJUSTA, DIAGNOSTICA =====================
   Tres fases: 1 · Calcula (¿a cuántas vueltas gira el motor con esta relación y esta velocidad?), 2 · Ajusta (relación y apriete para una
   ruta: sin patinar con margen, motor dentro de sus límites y a menos de 5 % del consumo mínimo posible; la ventana es INTERIOR en la
   relación y en el apriete, y las cifras del veredicto y la mejor relación sólo aparecen al validar) y 3 · Diagnostica (¿qué le pasa a
   esta transmisión?, sólo con lo que se ve en el dock). Cierra con un quiz de tres preguntas. */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETOS={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'calcula',iniciado:false,dxOk:false,r1:null,r2:null,dx:null,orden:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0};

/* ---------- Fase 1 · Calcula: las vueltas del motor ---------- */
const CASOS_1=[{kmh:72,i:1.0},{kmh:90,i:0.6},{kmh:54,i:1.5},{kmh:108,i:0.5},{kmh:36,i:2.0},{kmh:80,i:0.8},{kmh:63,i:1.2}];
function sorteaCaso1(){ const p=GUIA.r1&&GUIA.r1.kmh+'|'+GUIA.r1.i; let c; do{ c=pickOne(CASOS_1); }while(c.kmh+'|'+c.i===p); GUIA.r1=Object.assign({},c,{res:nMotorPara(c.kmh/3.6,c.i)}); }
function numeroDe(txt){ const raw=String(txt||'').trim().replace(/\s/g,'').replace(/ /g,'').replace(',','.'); return parseFloat(raw); }
function checkCalcula(){
  const v=numeroDe((el('ansV')||{}).value), r=GUIA.r1, ok=r.res;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe las vueltas por minuto del motor (rpm).'); return; }
  RETOS.intentos++;
  if(Math.abs(v-ok)<=0.02*ok){
    RETOS.fallos1=0; sonido.bien();
    const ms=r.kmh/3.6, wr=ms/VEH.rw;
    feedback('good','¡Correcto! ✓',`${fN(r.kmh,0)} km/h ÷ 3,6 = ${fN(ms,1)} m/s. Las ruedas giran ${fN(ms,1)} ÷ ${fN(VEH.rw,2)} = ${fN(wr,1)} rad/s; la reductora final (×${fN(VEH.FD,1)}) deja el eje de salida a ${fN(wr*VEH.FD,1)} rad/s = ${fN(wr*VEH.FD/RPM,0)} rpm; y el motor gira ${fN(r.i,2)} veces eso: <b>${fN(ok,0)} rpm</b>.`,true);
    paso('ajusta'); prepararAjusta();
  } else {
    RETOS.fallos1++; sonido.mal();
    if(RETOS.fallos1>=3){ RETOS.fallos1=0; RETOS.resiembras++; sorteaCaso1(); feedback('bad','Tres intentos fallidos','Cambia el caso. Recuerda: vueltas de la rueda = velocidad ÷ radio; × reductora = salida; × relación = motor; y rad/s a rpm se multiplica por 30/π.'); reiniciaCalculo(); pintaHUD(); }
    else { feedback('bad','Revisa el cálculo',(v>ok*2?'Te quedó un número muy grande: ¿pasaste los km/h a m/s (÷ 3,6) y de rad/s a rpm (× 30/π)? ':'')+`Empieza por las vueltas de la rueda. (intentos fallidos: ${RETOS.fallos1}/3)`); const t=el('d_try'); if(t) t.textContent=RETOS.fallos1; }
  }
}

/* ---------- Fase 2 · Ajusta la relación y el apriete ---------- */
function prepararAjusta(){
  let e; do{ e=pickOne(ESCENARIOS); }while(GUIA.r2&&ESCENARIOS.length>1&&e.id===GUIA.r2.esc.id);
  GUIA.r2={esc:e,i:1.8,p:1.0e6,validado:false,res:null,intentos:0};
  reiniciaCalculo(); pintaHUD();
}
const evCache=new Map();
function evaluaC(esc,i,p){ const k=esc.id; let op=evCache.get(k); if(!op){ op=optimo(esc.kmh/3.6,esc.pend); evCache.set(k,op); } return evalua(esc,i,p,op); }
/** Rangos que cumplen todo con el otro mando como está (se muestran sólo tras acertar). */
function rangoMando(r,cual){
  let a=null,b=null;
  for(let k=0;k<=130;k++){ const i=cual==='i'?iDeU(k*100/130):r.i, p=cual==='p'?(0.5+6.5*k/130)*1e6:r.p; if(evaluaC(r.esc,i,p).ok){ const x=cual==='i'?i:p; if(a===null) a=x; b=x; } }
  return a===null?null:[a,b];
}
function validarAjusta(){
  const r=GUIA.r2; if(!r) return;
  const E=r.esc, V=evaluaC(E,r.i,r.p), m=V.r, op=V.op; r.res=V; r.validado=true; r.intentos++; RETOS.intentos++;
  const cifras=`Motor a <b>${fN(m.ne,0)} rpm</b> y <b>${fN(m.Te,0)} N·m</b>; uso del apriete <b>${fN(m.u*100,0)} %</b> (tope ${fN(U_MAX*100,0)} %); gasta <b>${fN(m.lper100,2)} L/100 km</b> y lo mínimo posible aquí es <b>${fN(op.lper100,2)}</b> (margen ${fN(TOL*100,0)} %).`;
  if(V.ok){
    RETOS.fallos2=0; sonido.bien(); const ri=rangoMando(r,'i'), rp=rangoMando(r,'p');
    feedback('good','¡Lo conseguiste! ✓',`${cifras} Con tu apriete, cualquier relación entre <b>${ri?fN(ri[0],2)+' y '+fN(ri[1],2):'—'}</b> habría servido; con tu relación, cualquier apriete entre <b>${rp?fN(rp[0]/1e6,1)+' y '+fN(rp[1]/1e6,1)+' MPa':'—'}</b>. Más suelto patina; más fuerte gasta en la bomba; y a pocas vueltas el motor se ahoga, a muchas gasta de más: la ventana está en el interior.`,true);
    reiniciaCalculo(); pintaHUD(); paso('diag'); iniciaDiag();
  } else {
    RETOS.fallos2++; sonido.mal();
    let msg=cifras+' ';
    if(!V.c.patina) msg+=(m.pat?'La banda <b>patina</b>: ':'La banda queda <b>sin margen</b>: ')+'el aceite no aprieta lo bastante para este esfuerzo. ';
    if(!V.c.motor) msg+=m.ahoga?'El motor <b>se ahoga</b>: a esas vueltas no da el par que pide el camino. ':(m.alto?'El motor está <b>pasado de vueltas</b>. ':'El motor bajó de su <b>ralentí</b>. ');
    if(V.c.patina&&V.c.motor&&!V.c.consumo) msg+=(m.ne>op.ne*1.1?'Gasta de más porque el motor va <b>muy revolucionado</b>. ':(m.ne<op.ne*0.9?'Gasta de más porque el motor va <b>forzado a pocas vueltas</b>. ':'Gasta de más porque la <b>bomba</b> trabaja con una presión mayor que la necesaria. '));
    if(RETOS.fallos2>=4){ RETOS.fallos2=0; RETOS.resiembras++; feedback('bad','Cuatro validaciones sin lograrlo',msg+'Cambia la ruta.',true); prepararAjusta(); }
    else { feedback('bad','Todavía no',msg+`(validaciones fallidas: ${RETOS.fallos2}/4)`,true); reiniciaCalculo(); pintaHUD(); }
  }
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const CASOS_DX=[
  {k:'patina',esc:'subida',i:1.15,p:2.0e6},
  {k:'ahoga',esc:'llano',i:0.42,p:4.5e6},
  {k:'revoluciona',esc:'llano',i:1.20,p:2.5e6},
  {k:'aprieta',esc:'llano',i:0.60,p:6.8e6},
];
const NOMBRE_DX={patina:'La banda patina',ahoga:'El motor va ahogado',revoluciona:'El motor va muy revolucionado',aprieta:'El aceite aprieta de más'};
function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.k; let c; do{ c=pickOne(CASOS_DX); }while(c.k===p);
  GUIA.dx=c; GUIA.dxOk=false; GUIA.orden=barajar(CASOS_DX.map(x=>x.k));

}
function diagnostica(k){
  if(!GUIA.dx||GUIA.dxOk) return; RETOS.intentos++;

    GUIA.dxOk=true; RETOS.fallos3=0; sonido.bien();

  } else {
    RETOS.fallos3++; sonido.mal();
    if(RETOS.fallos3>=3){ RETOS.fallos3=0; RETOS.resiembras++; feedback('bad','Tres intentos fallidos','Es otro caso: mira el uso del apriete (¿pasa de 100 %?), las vueltas del motor y su par frente a la línea blanca del mapa, y el gasto.',true); iniciaDiag(); }
    else { feedback('bad','No es ese',noEs(k)+` (intentos fallidos: ${RETOS.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(k){
  if(k==='patina') return 'El uso del apriete pasa de 100 %: el esfuerzo de la subida pide más fuerza de la que el aceite da, y la banda patina. Las vueltas del motor suben sin que el coche gane velocidad.';
  if(k==='ahoga') return 'La relación es tan larga que el motor gira a pocas vueltas y la subida le pide más par del que puede dar (la línea blanca del mapa): se ahoga.';
  if(k==='revoluciona') return 'La banda aprieta bien y el motor da lo que se le pide, pero a muchas vueltas: más fricción interna y más gasolina. Una relación más larga lo llevaría a la zona verde del mapa.';
  return 'El motor está en buenas vueltas, pero el uso del apriete es muy bajo: el aceite sujeta mucho más de lo necesario, y la bomba que lo presuriza gasta potencia que sale de la gasolina.';
}
function noEs(k){
  if(k==='patina') return 'Mira el uso del apriete: aquí no llega al 100 %.';
  if(k==='ahoga') return 'Mira el mapa: el punto del motor no está en el límite de par.';
  if(k==='revoluciona') return 'Mira las vueltas del motor: aquí no están por las nubes.';
  return 'Mira el uso del apriete: aquí no es tan bajo.';
}
const QUIZ=[
  {q:'Para que el motor gire más despacio a la misma velocidad del coche, ¿cómo deben quedar las poleas?',ok:'La de entrada (la del motor) grande y la de salida chica',mal:['La de entrada chica y la de salida grande','Las dos del mismo tamaño','Da igual: el motor siempre gira lo mismo']},
  {q:'Si el aceite aprieta poco la banda, ¿qué pasa?',ok:'La banda patina: se pierde potencia y se desgasta',mal:['Nada, sólo se ahorra aceite','El motor gira más despacio','El coche frena solo']},
  {q:'¿Por qué no conviene apretar la banda siempre al máximo?',ok:'La bomba de aceite gasta potencia del motor y sube el consumo',mal:['Porque las poleas se hacen más pequeñas','Porque la banda se estira y cambia la relación sola','No hay razón: apretar más siempre es mejor']},
];
function iniciaQuiz(){ el("feedback").classList.remove("show"); GUIA.quizN=0; cargaPregunta(); }
function cargaPregunta(){ const Q=QUIZ[GUIA.quizN], opts=barajar([Q.ok,...Q.mal]); GUIA.quiz={q:Q.q,opts,ok:opts.indexOf(Q.ok)}; GUIA.quizResp=-1; GUIA.quizCorrecta=GUIA.quiz.ok; pintaHUD(); }
function respondeQuiz(i){
  if(GUIA.quizResp>=0) return; GUIA.quizResp=i; const ac=i===GUIA.quiz.ok; if(ac) RETOS.quizAcierto++;
  if(ac) sonido.bien(); else sonido.mal();
  const ult=GUIA.quizN>=QUIZ.length-1;
  feedback(ac?'good':'bad',ac?'Correcto ✓':'No es esa',(ac?'':'La respuesta era: <b>'+GUIA.quiz.opts[GUIA.quiz.ok]+'</b>. ')+(ult?'Terminaste el laboratorio.':'Sigue con la siguiente.'),true);
  pintaHUD();
  if(ult){ RETOS.hecho=true; paso('completo'); }
}
function siguientePregunta(){ if(GUIA.quizN<QUIZ.length-1){ GUIA.quizN++; cargaPregunta(); } }

/* ---------- el enrutador de acciones ---------- */
function paso(p){ GUIA.paso=p; GUIA.phase=({calcula:0,ajusta:1,diag:2,quiz:2,completo:2})[p]; if(EST.modo==='reto'){ reiniciaCalculo(); pintaHUD(); } }
function handleAction(act,btn){
  if(act&&act.indexOf('dx-')===0){ diagnostica(act.slice(3)); return; }
  if(act&&act.indexOf('quiz-')===0&&act!=='quiz-sig'){ respondeQuiz(+act.slice(5)); return; }
  switch(act){
    case 't-sig': tourParaAuto(); tourVa(TOUR.paso+1); break;

      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break;
    case 'validar': validarAjusta(); break;

}

/* ===================== 20. CÁMARAS =====================
   La escena se encuadra con el hueco que dejan la guía y el dock: la cámara se aleja lo justo para que la caja del «objeto» (ancho × alto en
   unidades) quepa entera en ese hueco, y la proyección se desplaza para centrarla en él. Además el objeto nunca pasa del `tope` del alto
   del lienzo. Cada vista es una dirección (azimut desde el frente, elevación) hacia un punto fijo. */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}
const CENTRO=V3((POS_P.x+POS_S.x)/2,(POS_P.y+POS_S.y)/2,0);
const VISTAS={
  todo:{az:-28,el:14,tgt:()=>CENTRO.clone().add(V3(0,0,-0.2)),obj:{w:3.1,h:3.0},fov:36,tope:0.74},
  frente:{az:0,el:4,tgt:()=>CENTRO.clone(),obj:{w:2.9,h:3.0},fov:36,tope:0.74},
  costado:{az:-86,el:8,tgt:()=>V3(0,1.55,-1.5),obj:{w:6.9,h:3.2},fov:36,tope:0.74},
  motor:{az:-38,el:14,tgt:()=>V3(POS_P.x,1.0,-2.7),obj:{w:4.4,h:3.6},fov:36,tope:0.74},
};
const CAM={off:V3(5,3,8),auto:true,k:1,dur:1};
function fovVista(v){ return innerWidth<innerHeight*0.9?(VISTAS[v].fov+8):VISTAS[v].fov; }
function distanciaFit(w,h,fov,tope){
  const Hu=huecoLibre(), W=innerWidth, Hh=innerHeight, tv=Math.tan(fov*Math.PI/360), th=tv*(W/Hh);
  const wF=Math.max(80,Hu.x1-Hu.x0)/W, hF=Math.max(80,Hu.y1-Hu.y0)/Hh;
  const D=1.06*Math.max(w/(2*th*wF),h/(2*tv*hF));
  return Math.max(D,h/(2*tv*(tope||0.66)));
}
function ofsDeseado(v){
  const V=VISTAS[v], fov=fovVista(v), D=distanciaFit(V.obj.w,V.obj.h,fov,V.tope), az=V.az*RAD, ev=V.el*RAD;
  return {off:V3(Math.sin(az)*Math.cos(ev),Math.sin(ev),Math.cos(az)*Math.cos(ev)).multiplyScalar(D),fov};
}
function ponVista(v,dur){
  EST.vista=v; CAM.auto=true; CAM.dur=dur===undefined?1.0:dur; controls.enabled=true;
  if(typeof pintaBarras==='function') pintaBarras();
  if(CAM.dur<=0.01){ SIM.salto=true; pasaCam(1); }
}
function pasaCam(dt){
  const V=VISTAS[EST.vista], P=V.tgt(), snap=SIM.salto;
  if(CAM.auto){
    const d=ofsDeseado(EST.vista), k=snap?1:1-Math.exp(-dt/Math.max(0.05,(CAM.dur||1)*0.30));
    CAM.off.lerp(d.off,k);
    if(Math.abs(camera.fov-d.fov)>0.05){ camera.fov+=(d.fov-camera.fov)*(snap?1:k); camera.updateProjectionMatrix(); }
    camera.position.copy(P).add(CAM.off); controls.target.copy(P);
  }
  SIM.salto=false;
}

/* ===================== 21. SONIDO (sintetizado) =====================
   Un zumbido grave cuyo tono sigue a las vueltas del motor (muy atenuado), el aviso de patinaje (dos pitidos) y los avisos de acierto y fallo. */
const sonido=(function(){
  let ctx=null,on=true,master=null,ult=0,zum=null,zg=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      zum=ctx.createOscillator(); zg=ctx.createGain(); zum.type='sawtooth'; zum.frequency.value=60; zg.gain.value=0; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=220; zum.connect(lp); lp.connect(zg); zg.connect(master); zum.start();
    }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); ult=f; }
  return {init,
    zumbido:(q)=>{ if(!ctx||!zum) return; const t=ctx.currentTime; zum.frequency.setTargetAtTime(30+q*90,t,0.15); zg.gain.setTargetAtTime(on&&q>0?0.010:0,t,0.15); },
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    aviso:()=>{ tono(1500,0.09,0.05,'square'); setTimeout(()=>tono(1500,0.09,0.05,'square'),130); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }, get freq(){ return ult; }};
})();

soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };

  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;

}

/* ===================== 23. EL LAZO: UN SOLO RELOJ =====================
   El tiempo de la escena avanza dt·velocidad en cada cuadro, y con ESE tiempo se mueven las poleas, la banda, el volante, las lecturas
   y la ventana de las gráficas del dock. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0, tSon=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  const dtS=EST.pausa?0:dt, dtSim=dtS*EST.vel;
  aplicaEscena(dtS,dtSim,dt);
  pasaCam(dt);
  if(t-tSon>0.4){ tSon=t; sonido.zumbido(SIM.e&&!EST.pausa?clamp(SIM.e.ne/6200,0,1):0); }
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaGraficas(); }
  controls.update();
  renderer.info.reset(); composer.render();

}

/** Mide el objeto en lo VISIBLE: se pinta sin suelo ni fondo sobre magenta puro y se toma la caja de los píxeles que no son magenta.
 *  solo: 'cvt' pinta únicamente las poleas con su banda; por defecto, también el motor y la salida. */
function mideObjeto(solo){
  const ocultos=[]; scene.traverse(o=>{ if(o.userData&&o.userData.fondo&&o.visible){ o.visible=false; ocultos.push(o); } });
  if(solo==='cvt'){ for(const o of MUNDO.children) if(o!==CVT_G&&o.visible){ o.visible=false; ocultos.push(o); } }
  const bg=scene.background, fog=scene.fog; scene.background=null; scene.fog=null; renderer.setClearColor(0xff00ff,1);
  renderer.render(scene,camera);
  const c=renderer.domElement, W=c.width, H=c.height, t=document.createElement('canvas'); t.width=W; t.height=H; const g=t.getContext('2d',{willReadFrequently:true}); g.drawImage(c,0,0);
  const d=g.getImageData(0,0,W,H).data; let x0=1e9,x1=-1,y0=1e9,y1=-1;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=(y*W+x)*4; if(!(d[i]>235&&d[i+1]<30&&d[i+2]>235)){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  for(const o of ocultos) o.visible=true; scene.background=bg; scene.fog=fog; renderer.setClearColor(0x000000,1);
  const k=W/innerWidth; return {x0:x0/k,x1:x1/k,y0:y0/k,y1:y1/k,altoPx:(y1-y0)/k,anchoPx:(x1-x0)/k,fracAlto:(y1-y0)/H,fracAncho:(x1-x0)/W,hueco:huecoLibre(),W:innerWidth,H:innerHeight};
}

  pon:(o)=>{ Object.assign(EST,o); pintaHUD(); reiniciaCalculo(); pintaBarras(); },
  avanza:(s)=>{ aplicaEscena(s,s,Math.max(s,0.5)); },
  salta:(t)=>{ SIM.t=Math.max(0,t); SIM.salto=true; aplicaEscena(0.001,0.001,1.0); pasaCam(1); },
  vista:(v)=>ponVista(v,0.001),
  pausa:(on)=>{ EST.pausa=!!on; pintaBarras(); },
  rotulos:(on)=>{ ROT.on=!!on; pintaRotulos(); pintaBarras(); },
  calidad:(n)=>{ CAL.nivel=n; aplicaCalidad(); },
  tour:(n)=>{ if(EST.modo!=='tour') setMode('tour',true); tourVa(n,0.001,true); },
  paso:(p)=>{ if(EST.modo!=='reto') setMode('reto',true); paso(p); if(p==='ajusta') prepararAjusta(); if(p==='diag') iniciaDiag(); if(p==='quiz'){ iniciaDiag(); paso('quiz'); iniciaQuiz(); } },
  setAjusta:(ii,pp)=>{ const r=GUIA.r2; if(r){ r.i=ii; r.p=pp; r.validado=false; reiniciaCalculo(); pintaHUD(); } },
  escenario:(id)=>{ const r=GUIA.r2; if(r){ r.esc=escPorId(id); reiniciaCalculo(); pintaHUD(); } },
  dx:(k)=>{ GUIA.dx=CASOS_DX.find(c=>c.k===k); GUIA.dxOk=false; reiniciaCalculo(); pintaHUD(); pintaDockFijo(); },
});
instalaDiag('transmision-cvt-banda',{escena:scene,camara:camera,controles:controls,renderizador:renderer,
  grupos:{cvt:CVT_G,motor:MOT,salida:SAL,banda:BANDA.mesh}});
