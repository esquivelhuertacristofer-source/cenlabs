/* ===================== 23. EL LABORATORIO GUIADO =====================
   Tres fases: 1 · Predice (la distancia que corresponde a un tiempo de vuelo), 2 · Ajusta (láseres apilados, separación entre
   rayos, barridos por segundo y fuerza del láser para que el coche vea a un peatón concreto dentro de un presupuesto de puntos
   por segundo; el veredicto de cada criterio sólo aparece al validar) y 3 · Diagnostica (¿por qué falló este sensor?, sólo
   con lo que se ve en el dock y en la escena) y cierra con un quiz de tres preguntas. Cuatro validaciones fallidas cambian el
   escenario (no se aprueba por eliminación). */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETO={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'predice',iniciado:false,dxOk:false,r1:null,r2:null,dx:null,orden:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0,clave:''};
const CFG_RETO0=()=>({Nv:32,dth:0.2,f:10,P:60});

/* ---------- Fase 1 · Predice ---------- */
const CASOS1=[0.20,0.30,0.40,0.50,0.35,0.60,0.25,0.45,0.80,0.15];     // tiempos de vuelo (µs)
function sorteaCaso1(){ const p=GUIA.r1&&GUIA.r1.i; let i; do{ i=Math.floor(Math.random()*CASOS1.length); }while(i===p); const t=CASOS1[i];
  GUIA.r1={i,t,R:distDeTiempo(t*1e-6),ans:distDeTiempo(t*1e-6)}; }
function checkPredice(){
  const raw=String((el('ansV')||{}).value||'').trim().replace(/\s| /g,'').replace(',','.'), v=parseFloat(raw), r=GUIA.r1, ok=r.ans;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe la distancia en metros (con coma o punto decimal).'); return; }
  RETO.intentos++;
  if(Math.abs(v-ok)<=Math.max(0.5,0.03*ok)){
    RETO.fallos1=0; sonido.bien();
    feedback('good','¡Correcto! ✓',`La luz va a c = 299 792 458 m/s y en ${fN(r.t,2)} µs recorre ${fN(C0*r.t*1e-6,1)} m, pero esa es la ida <b>y</b> la vuelta. El obstáculo está a la mitad: d = c·t/2 = <b>${fN(ok,1)} m</b>. Un paso del reloj de 1 ns equivale a 15 cm.`,true);
    paso('decide'); prepararDecide();
  } else {
    RETO.fallos1++; sonido.mal();
    const q=v/ok; let pista;
    if(Math.abs(q-2)<0.12) pista='Has contado el viaje de ida y vuelta completo: el obstáculo está a la mitad de lo que recorre la luz.';
    else if(Math.abs(q-0.5)<0.06) pista='Has dividido dos veces entre 2: el tiempo ya es el de ida y vuelta, y sólo hay que partirlo una vez.';
    else if(Math.abs(q-1000)<80||Math.abs(q-0.001)<0.0001) pista='Revisa las unidades: el tiempo está en microsegundos (millonésimas de segundo) y la respuesta se pide en metros.';
    else pista=`Tu resultado está ${v>ok?'alto':'bajo'}. Multiplica la velocidad de la luz (300 000 km/s) por el tiempo y recuerda que la luz va y vuelve.`;
    if(RETO.fallos1>=3){ RETO.fallos1=0; RETO.resiembras++; sorteaCaso1(); feedback('bad','Tres intentos fallidos','Cambia el caso: piensa cuánto camino hace la luz en ese tiempo y cuánto de él es sólo la ida.'); marcaSucio(); pintaHUD(); pintaDockFijo(); }
    else { feedback('bad','Revisa el cálculo',pista+` (intentos fallidos: ${RETO.fallos1}/3)`); const t=el('d_try'); if(t) t.textContent=RETO.fallos1; }
  }
}

/* ---------- Fase 2 · Ajusta el láser ---------- */
const CLAVES_ESC=['osc_despejado','osc_lluvia','claro_niebla','osc_niebla','claro_lluvia','claro_lejos'];
function prepararDecide(){
  let c; do{ c=pickOne(CLAVES_ESC); }while(c===GUIA.clave&&CLAVES_ESC.length>1); GUIA.clave=c;
  GUIA.r2={clave:c,esc:Object.assign({},ESCENARIOS[c]),cfg:CFG_RETO0(),validado:false,res:null,intentos:0,ventana:null};
  marcaSucio(); pintaHUD(); pintaDockFijo();
}
const MENSAJES_CRIT={
  eco:(c,e,r)=>`<b>Eco:</b> al peatón le llega ${fN(-c.val,1)} dB menos luz de la necesaria para verlo el 90 % de las veces. La ropa ${e.rho>0.3?'clara':'oscura'}, los ${fN(e.R,0)} m y ${e.clima==='despejado'?'el aire':'la '+e.clima} se comen la luz: la fuerza del láser es lo que la repone.`,
  puntos:(c,e,r)=>`<b>Puntos:</b> al peatón le caen unos ${fN(c.val,1)} y hacen falta ${c.lim}. Entre un punto y otro hay ${fN(r.pe.sepH*100,0)} cm a lo ancho y ${fN(r.pe.sepV*100,0)} cm a lo alto, y el peatón sólo mide 50 × 170 cm.`,
  presupuesto:(c)=>`<b>Presupuesto:</b> tu ajuste lanza ${fN(c.val/1000,0)} mil puntos por segundo y el equipo sólo procesa ${fN(c.lim/1000,0)} mil.`,
  ojo:(c)=>`<b>Ojos:</b> ${fN(c.val,0)} W pasa del límite de seguridad de ${c.lim} W: un láser así puede dañar la vista de quien lo mire de cerca.`,
  reaccion:(c)=>`<b>Rapidez:</b> el coche necesita confirmar al peatón en 3 barridos seguidos en menos de ${fN(c.lim,2)} s, y con tus barridos por segundo tardaría ${fN(c.val,2)} s.`,
  fantasmas:(c,e)=>`<b>Falsos puntos:</b> con esta fuerza el ${fN(c.val*100,0)} % de los destellos rebota en las gotas de ${e.clima==='niebla'?'niebla':'lluvia'} cerca del coche y devuelve un punto que no existe (el máximo tolerado es ${fN(c.lim*100,0)} %).`,
};
const NOM_CRIT={eco:'Eco',puntos:'Puntos',presupuesto:'Presupuesto',ojo:'Seguridad ocular',reaccion:'Rapidez',fantasmas:'Falsos puntos'};
function validarDecide(){
  const r=GUIA.r2; if(!r) return;
  const ev=evaluaConfig(r.cfg,r.esc); r.res=ev; r.validado=true; r.intentos++; RETO.intentos++;
  const malos=ev.criterios.filter(c=>!c.ok);
  if(!malos.length){
    RETO.fallos2=0; sonido.bien(); r.ventana=ventanaReto(r.esc); const v=r.ventana;
    feedback('good','¡Lo conseguiste! ✓',`Con <b>${r.cfg.Nv} láseres</b>, <b>${fDth(r.cfg.dth)}</b>, <b>${r.cfg.f} barridos/s</b> y <b>${r.cfg.P} W</b> el coche ve al peatón con ~${fN(ev.pe.E,1)} puntos. Para este caso sirven ${v.canales.join(', ')} láseres, separaciones de hasta ${fDth(v.dthMax)}, entre ${v.fMin} y ${v.fMax} barridos por segundo y de ${v.Pmin} a ${v.Pmax} W. Cada mando compra algo y cuesta otra cosa: más láseres y rayos más juntos dan más puntos pero gastan presupuesto; más fuerza ve más lejos pero ilumina las gotas y se acerca al límite de los ojos.`,true);
    pintaHUD(); paso('diag'); iniciaDiag();
  } else {
    RETO.fallos2++; sonido.mal();
    const msg=malos.map(c=>MENSAJES_CRIT[c.k](c,r.esc,ev)).join('<br>');
    if(RETO.fallos2>=4){ RETO.fallos2=0; RETO.resiembras++; feedback('bad','Cuatro validaciones sin lograrlo',msg+'<br>Cambia el caso: el peatón, el tiempo y el presupuesto son otros.',true); prepararDecide(); }
    else { feedback('bad','Todavía no',msg+`<br>(validaciones fallidas: ${RETO.fallos2}/4)`,true); pintaHUD(); }
  }
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const CASOS_DX=[
  {k:'puntos', t:'Rayos demasiado separados', cfg:{Nv:16,dth:0.5,f:10,P:80}, esc:{R:50,rho:REFL.claro,clima:'despejado',presupuesto:1e9}},
  {k:'eco',    t:'Eco demasiado débil',       cfg:{Nv:64,dth:0.15,f:10,P:12}, esc:{R:85,rho:REFL.osc,clima:'despejado',presupuesto:1e9}},
  {k:'fantasma',t:'Falsos puntos de la niebla',cfg:{Nv:64,dth:0.25,f:10,P:100}, esc:{R:30,rho:REFL.claro,clima:'niebla',presupuesto:1e9}},
];
function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.k; let c; do{ c=pickOne(CASOS_DX); }while(c.k===p);
  GUIA.dx=c; GUIA.dxOk=false; GUIA.orden=barajar(CASOS_DX.map(x=>x.k)); marcaSucio(); pintaHUD(); pintaDockFijo();
}
function diagnostica(k){
  if(!GUIA.dx||GUIA.dxOk) return; RETO.intentos++;
  if(k===GUIA.dx.k){
    GUIA.dxOk=true; RETO.fallos3=0; sonido.bien();
    feedback('good','Diagnóstico correcto ✓',explicaDx(GUIA.dx.k),true);
    paso('quiz'); iniciaQuiz();
  } else {
    RETO.fallos3++; sonido.mal();
    if(RETO.fallos3>=3){ RETO.fallos3=0; RETO.resiembras++; feedback('bad','Tres intentos fallidos','Es otro caso: mira en la gráfica de abajo si el eco del peatón pasa del umbral, y en la nube si el peatón tiene puntos y si hay puntos de más pegados al coche.',true); iniciaDiag(); }
    else { feedback('bad','No es ese',noEs(k)+` (intentos fallidos: ${RETO.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(k){
  const e=GUIA.dx; const pe=pedEsperado(e.cfg,e.esc);
  if(k==='puntos') return `Rayos demasiado separados: el eco del peatón sí vuelve fuerte (+${fN(pe.margenDB,0)} dB sobre lo necesario), pero entre un punto y otro hay ${fN(pe.sepH*100,0)} cm a lo ancho y ${fN(pe.sepV*100,0)} cm a lo alto, y el peatón mide 50 × 170 cm: le caen ~${fN(pe.E,1)} puntos. Más láseres apilados o rayos más juntos (a costa de puntos por segundo) lo arreglan.`;
  if(k==='eco') return `Eco demasiado débil: a ${fN(e.esc.R,0)} m con ropa oscura y sólo ${e.cfg.P} W vuelve ${fN(-pe.margenDB,0)} dB menos luz de la necesaria. La gráfica lo muestra: el pico del peatón queda bajo el umbral, y los puntos que sí caerían en geometría no se detectan. Hace falta más fuerza (sin pasar del límite de los ojos) o acercarse.`;
  return `Falsos puntos de la niebla: con ${e.cfg.P} W cada destello tiene un ${fN(pe.pg*100,0)} % de rebotar en las gotas a menos de ${fN(rBs(e.cfg.P,CLIMAS.niebla.alfa),0)} m del coche. El peatón sí se ve, pero la nube se llena de una neblina de puntos que no existen. Bajar la fuerza del láser reduce esa neblina.`;
}
function noEs(k){
  if(k==='puntos') return 'Si fuera por rayos separados, el pico del eco del peatón estaría claramente por encima del umbral y el peatón tendría sólo uno o dos puntos.';
  if(k==='eco') return 'Si el problema fuera el eco débil, el pico del peatón en la gráfica de abajo se quedaría por debajo del umbral naranja.';
  return 'Los falsos puntos de la niebla no hacen desaparecer al peatón: aparecen como una neblina de puntos pegada al coche, y en la gráfica de abajo como un hombro al principio de la señal.';
}
const QUIZ=[
  {q:'Si el eco de un destello tarda el doble en volver, ¿qué pasó con la distancia al obstáculo?',ok:'Es el doble (d = c·t/2)',mal:['Es la mitad','Es cuatro veces mayor','No cambia: la luz siempre tarda lo mismo']},
  {q:'Un peatón se aleja al doble de distancia. Con el mismo láser, ¿cuántos puntos le caen aproximadamente?',ok:'Unos 4 veces menos: los puntos se reparten en ancho y en alto',mal:['La mitad','Los mismos','8 veces menos']},
  {q:'¿Por qué no basta con poner la fuerza del láser al máximo?',ok:'Por la seguridad de los ojos y porque la lluvia y la niebla devuelven más falsos puntos',mal:['Porque el láser se funde','Porque el eco llega más despacio','Porque la luz viaja más lenta con más fuerza']},
];
function iniciaQuiz(){ GUIA.quizN=0; cargaPregunta(); }
function cargaPregunta(){ const Q=QUIZ[GUIA.quizN], opts=barajar([Q.ok,...Q.mal]); GUIA.quiz={q:Q.q,opts,ok:opts.indexOf(Q.ok)}; GUIA.quizResp=-1; GUIA.quizCorrecta=GUIA.quiz.ok; pintaHUD(); }
function respondeQuiz(i){
  if(GUIA.quizResp>=0) return; GUIA.quizResp=i; const ac=i===GUIA.quiz.ok; if(ac) RETO.quizAcierto++;
  if(ac) sonido.bien(); else sonido.mal();
  const ult=GUIA.quizN>=QUIZ.length-1;
  feedback(ac?'good':'bad',ac?'Correcto ✓':'No es esa',(ac?'':'La respuesta era: <b>'+GUIA.quiz.opts[GUIA.quiz.ok]+'</b>. ')+(ult?'Terminaste el laboratorio.':'Sigue con la siguiente.'),true);
  pintaHUD();
  if(ult){ RETO.hecho=true; paso('completo'); }
}
function siguientePregunta(){ if(GUIA.quizN<QUIZ.length-1){ GUIA.quizN++; cargaPregunta(); } }

/* ---------- el enrutador de acciones ---------- */
const VISTA_PASO={predice:'sensor',decide:'peaton',diag:'calle',quiz:'calle',completo:'calle'};
function paso(p){ GUIA.paso=p; GUIA.phase=({predice:0,decide:1,diag:2,quiz:2,completo:2})[p]; if(EST.modo==='guia'){ ponVista(VISTA_PASO[p],0.8); pintaHUD(); marcaSucio(); } }
function handleAction(act,btn){
  switch(act){
    case 'check-v': checkPredice(); break;
    case 'hint-v':
      if(RETO.pistas===0){ RETO.pistas=1; feedback('good','Pista 1 de 2','La luz recorre unos 300 metros cada millonésima de segundo (1 µs). Calcula cuánto camino hace en el tiempo del enunciado.'); }
      else if(RETO.pistas===1){ RETO.pistas=2; feedback('good','Pista 2 de 2','Ese camino es de ida y vuelta, así que el obstáculo está a la mitad: d = c·t / 2.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break;
    case 'validar': validarDecide(); break;
    case 'dx-puntos': diagnostica('puntos'); break; case 'dx-eco': diagnostica('eco'); break; case 'dx-fantasma': diagnostica('fantasma'); break;
    case 'quiz-0': respondeQuiz(0); break; case 'quiz-1': respondeQuiz(1); break; case 'quiz-2': respondeQuiz(2); break; case 'quiz-3': respondeQuiz(3); break;
    case 'quiz-sig': siguientePregunta(); break;
    case 'restart': location.reload(); break;
    case 'tour-sig': if(EST.tour<TOUR.length-1){ EST.tour++; tourFija(EST.tour); pintaHUD(); } break;
    case 'tour-ant': if(EST.tour>0){ EST.tour--; tourFija(EST.tour); pintaHUD(); } break;
    case 'tour-fin': EST.tour=-1; document.querySelectorAll('.resalta').forEach(e=>e.classList.remove('resalta')); pintaHUD(); ponVista('calle',0.8); break;
    case 'tour-guia': EST.tour=-1; document.querySelectorAll('.resalta').forEach(e=>e.classList.remove('resalta')); setMode('guia',true); break;
    case 'ver-panel': { const b=document.body; if(b.classList.contains('estrecho')){ b.classList.remove('t-hud'); b.classList.add('t-panel'); disposicion(); centraEnHueco(); } break; }
  }
}

/* ---------- lo que la guía enseña en cada paso ---------- */
function contenidoGuia(){
  const tri=(n,v,m)=>`<span class="tries">intentos fallidos: <b id="${n}">${v}</b>/${m}</span>`;
  switch(GUIA.paso){
    case 'predice': { const r=GUIA.r1; return {no:'Fase 1 · Reto 1',head:'Tu cálculo',title:'¿A qué distancia está el obstáculo?',
      teach:`Un destello de láser sale del coche y su eco vuelve <b>${fN(r.t,2)} µs</b> después (µs = millonésima de segundo). La luz va a 300 000 km/s. En la gráfica de abajo, el pico es ese eco.<div class="task">¿A cuántos metros está el obstáculo? ${tri('d_try',RETO.fallos1,3)}</div>`,
      acts:`<div class="calcrow"><input id="ansV" type="text" inputmode="decimal" autocomplete="off" placeholder="¿? m" aria-label="Distancia en metros"><button class="b primary" data-act="check-v">✓ Comprobar</button></div><button class="pista" id="btnHint">¿Necesitas una pista? (máx. 2)</button>`}; }
    case 'decide': { const r=GUIA.r2; if(!r) return {no:'Fase 2 · Reto 2',head:'Tu ajuste',title:'Preparando…',teach:'',acts:''};
      const E=r.esc, ev=r.validado&&r.res?r.res:null;
      const filas=ev?ev.criterios.map(c=>`<div class="esc"><span>${NOM_CRIT[c.k]}</span><span class="rs ${c.ok?'ok':'mal'}">${c.ok?'✓':'✗'}</span></div>`).join(''):'';
      return {no:'Fase 2 · Reto 2',head:'Tu ajuste',title:'Que el coche vea al peatón',
      teach:`<b>${E.nombre}</b>: está a <b>${fN(E.R,0)} m</b>. Ajusta el láser para que el coche lo vea bien (unos ${LIDAR.Nmin} puntos o más), sin pasar de <b>${fN(E.presupuesto/1000,0)} mil puntos por segundo</b> y confirmándolo en 3 barridos seguidos en 0,3 s.${filas?`<div class="escs">${filas}</div>`:''}<div class="why"><b>Sin revelar.</b> El resultado de cada criterio sale sólo al validar. ${tri('d_try2',RETO.fallos2,4)}</div>`,
      acts:`${htmlMandosLaser(r.cfg)}<button class="b primary" data-act="validar">▶ Validar</button>`}; }
    case 'diag': { const ord=GUIA.orden||CASOS_DX.map(x=>x.k), N={puntos:'Rayos demasiado separados: al peatón le caen pocos puntos',eco:'Eco demasiado débil: no vuelve luz suficiente',fantasma:'Niebla: el láser dibuja puntos que no existen'};
      return {no:'Fase 3 · Diagnóstico',head:'¿Qué falló?',title:'Averigua la causa sin ver los mandos',
      teach:`Este sensor no consigue ver bien al peatón. Compara la nube, la gráfica del eco y el umbral naranja.<div class="task">¿Cuál es la causa? ${tri('d_try3',RETO.fallos3,3)}</div>`,
      acts:ord.map(k=>`<button class="b" data-act="dx-${k}">${N[k]}</button>`).join('')}; }
    case 'quiz': { const Q=GUIA.quiz; if(!Q) return {no:'',head:'',title:'',teach:'',acts:''}; const ya=GUIA.quizResp>=0;
      return {no:'Cierre · Pregunta '+(GUIA.quizN+1)+' de '+QUIZ.length,head:'Quiz',title:Q.q,teach:'',
      acts:Q.opts.map((o,i)=>`<button class="b ${ya?(i===Q.ok?'good':(i===GUIA.quizResp?'bad':'')):''}" data-act="quiz-${i}" ${ya?'disabled':''}>${o}</button>`).join('')+(ya&&GUIA.quizN<QUIZ.length-1?'<button class="b primary" data-act="quiz-sig">Siguiente →</button>':'')}; }
    case 'completo': return {no:'Laboratorio completado',head:'✓',title:'Calculaste, ajustaste y diagnosticaste',
      teach:`Acertaste ${RETO.quizAcierto} de ${QUIZ.length} en el quiz. Vuelve a <b>Explorar</b> y mueve el peatón, la ropa y el tiempo: ningún ajuste mejora todo a la vez, y ése es el diseño de un LiDAR.`,
      acts:`<button class="b primary" data-act="restart">↺ Reiniciar laboratorio</button>`};
  }
  return {no:'',head:'',title:'',teach:'',acts:''};
}
function htmlGuia(){
  const ps=['Calcula','Ajusta','Diagnostica'], C=contenidoGuia();
  const ok=i=>i<GUIA.phase||(i===2&&RETO.hecho);
  return `<div class="pasos">${ps.map((t,i)=>`<span class="ps ${ok(i)?'ok':(i===GUIA.phase?'on':'')}"><i>${ok(i)?'✓':i+1}</i>${t}</span>`).join('')}</div>
  <div class="retoBox"><div class="rt"><span>${C.no}</span><span>${C.head}</span></div><h3>${C.title}</h3><div class="rq">${C.teach}</div><div class="opt ${GUIA.paso==='decide'?'optM':''}" id="actOpt">${C.acts}</div></div>`;

/** Configuración y escena que corren en cada paso del laboratorio guiado (null: lo que digan los mandos). */

/* ===================== 24. SONIDO (sintetizado) =====================
   Los tonos de acierto y de fallo. */
const sonido=(function(){
  let ctx=null,on=true,master=null,ult=0;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination); }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); ult=f; }
  return {init,
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }, get freq(){ return ult; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});

/* ===================== 14. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.max(Math.min(devicePixelRatio,alta?2:1.5),Math.min(devicePixelRatio,1.5)>1?1.25:1));
  const ms=alta?2048:1024; if(LUZ.sol.shadow.mapSize.x!==ms){ LUZ.sol.shadow.mapSize.set(ms,ms); if(LUZ.sol.shadow.map){ LUZ.sol.shadow.map.dispose(); LUZ.sol.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  nubeMat.uniforms.uLuz.value=alta?1:1.25;           // sin resplandor la nube se compensa para leerse igual
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); ponVista(EST.vista,0.001); centraEnHueco(); RAD.ver++; pintaDockFijo();
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 15. EL LAZO: UN SOLO RELOJ ===================== */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  const ahora=performance.now();
  if(RAD.sucio||(!EST.pausa&&ahora-RAD.tUlt>RAD.intervalo)){ if(!RAD.sucio) RAD.semilla=(RAD.semilla+1)|0; recalculaLidar(); }
  aplicaEscena(dt);
  pasaCam(dt);
  if(t-tDock>0.066){ tDock=t; pintaDock(); }
  if(t-tLienzo>0.05&&seVe(el('panel'))){ tLienzo=t; pintaMp(); pintaSp(); pintaBt(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos();
}
