<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · LiDAR automotriz: tiempo de vuelo, nube de puntos y obstáculos — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#0A1C30;--panel:rgba(9,19,32,.86);--line:#1E3550;--ink:#EAF4F1;
    --dim:#93AFC9;--accent:#34D399;--accent2:#9BF0C8;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cF:#7EE8DD;--cR:#FFB347;--cE:#FF4D5A;--cG:#C8D6D2;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#14202e;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#182c40}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#032216;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#032216;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#5fe3b2}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#032216}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#7CC4FF;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f87a0;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f90a8;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#032216}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .escs{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
  .esc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px;font-size:11.5px;line-height:1.35;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);color:#c4d3e6}
  .esc .rs{font-weight:700;font-size:11px}.esc .rs.ok{color:var(--good)}.esc .rs.mal{color:#ff9a9a}
  .esc .pista{font-size:10.5px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#09121c;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(30,53,80,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,53,80,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f87a0}
  .dk-tit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#a3bcd6;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);min-height:0}
  .dk-g.mp{flex:1.9 1 0;min-height:120px;cursor:crosshair}
  .dk-g.sp{flex:1.05 1 0;min-height:70px}
  .dk-g.bt{flex:0.95 1 0;min-height:64px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c6da;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#14202e;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfdcec;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,18,30,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,18,30,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d3e6}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,18,30,.92);border:1px solid rgba(124,196,255,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,18,30,.84);border:1px solid rgba(124,196,255,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:auto auto auto 1fr auto 1fr;column-gap:10px;row-gap:4px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3;grid-row:1}
  body.estrecho.ancho.t-panel .panel>.dk-fig{grid-column:1/3;grid-row:2;grid-template-columns:repeat(6,1fr)}
  body.estrecho.ancho.t-panel .panel>.t-mp{grid-column:1;grid-row:3}
  body.estrecho.ancho.t-panel .panel>.dk-g.mp{grid-column:1;grid-row:4/7;min-height:0}
  body.estrecho.ancho.t-panel .panel>.dk-ley{display:none}
  body.estrecho.ancho.t-panel .panel>.t-sp{grid-column:2;grid-row:3}
  body.estrecho.ancho.t-panel .panel>.dk-g.sp{grid-column:2;grid-row:4;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-bt{grid-column:2;grid-row:5}
  body.estrecho.ancho.t-panel .panel>.dk-g.bt{grid-column:2;grid-row:6;min-height:0}
  body.estrecho.ancho.t-panel .panel>.dk-aviso{display:none}
  body.estrecho .hud details>.cuerpo{max-height:24vh}
  body.estrecho.ancho.t-hud .hud{display:grid;grid-template-columns:1fr 1.05fr;column-gap:14px;row-gap:7px;align-content:start;grid-auto-flow:row dense}
  body.estrecho.ancho .hud>.hcab,body.estrecho.ancho .hud>.modebar,body.estrecho.ancho .hud>.hdet,body.estrecho.ancho .hud>.pasos{grid-column:1}
  body.estrecho.ancho .hud>.hmandos,body.estrecho.ancho .hud>.retoBox{grid-column:2;grid-row:1/span 4}
  body.estrecho .hdet{flex-direction:row}body.estrecho .hdet>details{flex:1;min-width:0}
  body.estrecho .hdet details[open]{position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 54px);z-index:25;background:rgba(9,19,32,.97)}
  body.movil .lt{display:none} body.movil .tbar .modo,body.movil .tbar .reloj{display:none}
  body.movil .tbar{gap:6px;padding:5px 8px} body.movil .tbar .est{min-width:0}
  body.movil .dk-ley{display:none} body.movil .fg b{font-size:13.5px} body.movil .fg .fl{font-size:9.5px}
  body.movil .dk-g.mp{min-height:132px} body.movil .dk-g.sp{min-height:62px} body.movil .dk-g.bt{min-height:56px}
  body.movil .hud h2{font-size:15.5px} body.movil .hud .intro{font-size:11.8px;line-height:1.42}
  body.estrecho .hud{overflow-y:auto}
  body.estrecho .vbar [data-t="rot"],body.estrecho .vbar .sep.s1{display:none}
  body.estrecho.ancho .vbar{top:60px}
  body.movil .vbar{flex-wrap:nowrap;gap:3px;padding:3px 4px;top:54px} body.movil .vbar .sep{display:none} body.movil .vbar .b.sm{padding:5px 7px;font-size:11px}
  body.movil .vbar .lg{display:none}
  body.movil .tbar .lento{display:none}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   LAB — LiDAR AUTOMOTRIZ: TIEMPO DE VUELO, NUBE DE PUNTOS Y OBSTÁCULOS
   (Autotrónica · mecanica-145)

   Un coche con un LiDAR en el techo —abierto en corte: espejo poligonal giratorio,
   diodo láser, lente receptora y detector— barre 120° al frente con N láseres apilados.
   Cada pulso que rebota y vuelve es un PUNTO: la distancia sale del tiempo de vuelo
   (d = c·t/2); la nube se segmenta (suelo / obstáculos) y se agrupa en objetos. Un peatón
   cruza la calle: ajustar canales, separación entre rayos, barridos por segundo y potencia
   decide cuántos puntos le caen.

   Todo sale de un solo modelo: el bloque de física (ecuación del lidar, estadística del
   receptor, trazado de rayos, segmentación, agrupamiento por imagen de distancias) que un
   script de Node extrae TAL CUAL y verifica contra formas cerradas y Monte Carlo.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO=' ';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }

/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos
   marcas— y lo prueba: lo que se prueba es lo que corre.

   Un LiDAR (Light Detection And Ranging) de tiempo de vuelo lanza un pulso láser de
   4 ns a 905 nm, espera el eco y mide el retardo t: la distancia es d = c·t/2 (la luz
   va y vuelve). Un espejo poligonal giratorio barre 120° al frente y N láseres apilados
   cubren de −25° a +7° de elevación: cada pulso que vuelve es un PUNTO. La potencia del
   eco la da la ecuación del lidar para un blanco lambertiano que llena el haz:
       P_r = P_t·ρ·cosθ/π · A_r·η / R² · e^(−2αR)
   Un receptor con umbral k·σ_n (P_fa = 10⁻⁶) detecta con probabilidad Q(k − P_r/σ_n).
   Lluvia y niebla restan (e^(−2αR)) y devuelven ecos falsos cerca del sensor (retrodispersión
   β = α/S). La nube se segmenta (suelo por pendiente entre anillos contiguos) y se agrupa por
   imagen de distancias (ángulo β entre vecinos contiguos, Bogoslavskyi y Stachniss 2016).
   Convención de ejes: X al frente, Y arriba, Z a la derecha; azimut hacia +Z; elevación sobre el horizonte. */

/* FISICA:INICIO */
const DOSPI=2*Math.PI;
const C0=299792458;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const dB=x=>10*Math.log10(x), deDB=x=>Math.pow(10,x/10);
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function gauss(rng){ let u=0; while(u<1e-12) u=rng(); const v=rng(); return Math.sqrt(-2*Math.log(u))*Math.cos(DOSPI*v); }

/* ---------- 1.1 Estadística del receptor: erfc, Q y su inversa ---------- */
/** erfc(x): serie de Maclaurin de erf para x < 2,2 y fracción continua por encima (error relativo < 1e-13). */
function erfc(x){
  if(x<0) return 2-erfc(-x);
  if(x<2.2){
    let s=x, t=x; const x2=x*x;
    for(let n=1;n<120;n++){ t*=-x2/n; const d=t/(2*n+1); s+=d; if(Math.abs(d)<1e-18*Math.abs(s)) break; }
    return 1-2/Math.sqrt(Math.PI)*s;
  }
  let f=x; for(let n=120;n>=1;n--) f=x+(n/2)/f;           // erfc(x) = e^(−x²)/√π / (x + ½/(x + 1/(x + 3/2/(x + …))))
  return Math.exp(-x*x)/Math.sqrt(Math.PI)/f;
}
/** Cola superior de la normal estándar: Q(x) = P(Z > x). */
const Qn=x=>0.5*erfc(x/Math.SQRT2);
/** Inversa de Q por bisección (Q es estrictamente decreciente). */
function Qinv(p){ let lo=-12, hi=12; for(let i=0;i<200;i++){ const m=(lo+hi)/2; if(Qn(m)>p) lo=m; else hi=m; } return (lo+hi)/2; }

/* ---------- 1.2 El sensor y sus límites (valores didácticos de un LiDAR de 905 nm) ---------- */
const LIDAR={
  lam:905e-9,          // longitud de onda (m)
  tau:4e-9,            // anchura del pulso (s)
  trise:2e-9,          // tiempo de subida del pulso (s): fija la precisión de la distancia
  Ar:4.0e-4,           // área de la lente receptora (m²), Ø ≈ 22 mm
  eta:0.30,            // eficiencia óptica del receptor
  Pmin:2.0e-8,         // potencia de eco a la que el umbral dispara (W), con P_fa de diseño
  Pfa:1e-6,            // probabilidad de falsa alarma por muestra de distancia
  tGate:1e-9,          // paso del reloj de tiempo (s): 1 ns = 15 cm
  Rwin:250,            // ventana de distancia que mira el receptor (m)
  hs:1.80,             // altura del sensor sobre el suelo (m)
  fovH:120, el0:-25, el1:7,   // campo de visión horizontal y rango de elevación (°)
  thdiv:1.5e-3,        // divergencia del haz (rad): 15 cm de mancha a 100 m
  Pojo:100,            // tope didáctico de potencia de pico por seguridad ocular (W)
  tReac:0.30, vueltasConf:3,   // confirmar al peatón: 3 barridos seguidos en ≤ 0,30 s
  Nmin:10,             // puntos que debe reunir el peatón para darlo por visto
  PdMin:0.90,          // probabilidad de detección exigida al eco del peatón
  ghostMax:0.10,       // fracción de pulsos con eco falso que tolera el reto
  LR:20,               // razón de lidar S = α/β (sr) del agua en el aire
  betaMin:12, minPts:3, // agrupamiento por imagen de distancias: ángulo β mínimo (°) entre vecinos y puntos mínimos
  pedW:0.5, pedH:1.7,  // peatón: ancho y alto (m)
  slopeMax:10, zSuelo:0.30, bordillo:0.15   // segmentación del suelo: pendiente máxima (°), altura máxima de un punto de suelo y escalón de bordillo tolerado (m)
};
const K_UMBRAL=Qinv(LIDAR.Pfa);                  // umbral en desviaciones típicas del ruido
const SIGMA_N=LIDAR.Pmin/K_UMBRAL;               // ruido equivalente a la entrada del comparador (W)
const A90=K_UMBRAL-Qinv(LIDAR.PdMin);            // P_r/σ_n necesario para P_d = 90 %
const NGATES=Math.floor(2*LIDAR.Rwin/(C0*LIDAR.tGate));
const P_FA_RAYO=1-Math.pow(1-LIDAR.Pfa,NGATES); // falsa alarma por pulso: una por cada muestra de distancia
/** Atenuación α (1/m) a 905 nm. Despejado ≈ 0,2 km⁻¹ (visibilidad ~20 km); niebla de 300 m por Koschmieder α = 3,912/V;
 *  lluvia de 10 mm/h del orden de 1–2 km⁻¹ (valor didáctico, no una medida). */
const CLIMAS={
  despejado:{nombre:'Despejado',alfa:2.0e-4},
  lluvia:{nombre:'Lluvia',alfa:1.7e-3},
  niebla:{nombre:'Niebla',alfa:3.912/300}
};
const REFL={ suelo:0.12, pared:0.40, coche:0.50, camion:0.55, poste:0.35, tronco:0.15, copa:0.20, acera:0.25, osc:0.10, claro:0.60 };

/* ---------- 1.3 Tiempo de vuelo y ecuación del lidar ---------- */
const tVuelo=d=>2*d/C0;                 // retardo del eco (s)
const distDeTiempo=t=>C0*t/2;           // d = c·t/2
const transmision=(alfa,R)=>Math.exp(-2*alfa*R);   // ida y vuelta por la atmósfera
/** Potencia del eco (W) de un blanco lambertiano de reflectividad ρ que llena el haz; cosInc = cos del ángulo de incidencia. */
function potEco(P,rho,cosInc,R,alfa,fill=1){ return P*rho*Math.max(0,cosInc)/Math.PI*LIDAR.Ar*LIDAR.eta/(R*R)*Math.exp(-2*alfa*R)*fill; }
/** Fracción del haz que cae sobre un blanco de ancho w a distancia R. */
const llenado=(R,w=LIDAR.pedW)=>Math.min(1,w/(R*LIDAR.thdiv));
/** Probabilidad de que el umbral dispare con un eco de potencia Pr: Q(k − Pr/σ_n). */
const pDet=Pr=>Qn(K_UMBRAL-Pr/SIGMA_N);
/** Distancia a la que un blanco frontal devuelve P_r/σ_n = aObj (bisección; P_r decrece con R). */
function alcanceDe(P,rho,alfa,aObj=A90,cosInc=1,fillW=0){
  const f=R=>potEco(P,rho,cosInc,R,alfa,fillW?llenado(R,fillW):1)/SIGMA_N;
  if(f(0.5)<aObj) return 0;
  let lo=0.5, hi=5000; if(f(hi)>=aObj) return hi;
  for(let i=0;i<200;i++){ const m=(lo+hi)/2; if(f(m)>=aObj) lo=m; else hi=m; } return (lo+hi)/2;
}
/** Precisión de la distancia (m): tiempo de subida del pulso / relación señal–ruido en amplitud, con un suelo de 1 cm. */
const sigmaRango=Pr=>Math.max(0.01,(C0*LIDAR.trise/2)/(Pr/SIGMA_N));
/** Lluvia y niebla: retrodispersión β = α/S. Radio hasta el que el eco de las gotas pasa el umbral y probabilidad de un eco falso. */
const rBs=(P,alfa)=>Math.sqrt(P*(alfa/LIDAR.LR)*(C0*LIDAR.tau/2)*LIDAR.Ar*LIDAR.eta/LIDAR.Pmin);
const pGhost=(P,alfa)=>1-Math.exp(-alfa*rBs(P,alfa));
/** Potencia retrodispersada por las gotas a distancia r (W). */
const potBs=(P,alfa,r)=>P*(alfa/LIDAR.LR)*(C0*LIDAR.tau/2)*LIDAR.Ar*LIDAR.eta*Math.exp(-2*alfa*r)/(r*r);

/* ---------- 1.4 Geometría del barrido ---------- */
/** Canales Nv, separación horizontal dth (°), barridos por segundo f. Los puntos por segundo son los pulsos por segundo. */
function geomBarrido(cfg){
  const Nv=cfg.Nv, Naz=Math.round(LIDAR.fovH/cfg.dth), dEl=(LIDAR.el1-LIDAR.el0)/(Nv-1);
  return { Nv, Naz, dEl, rayos:Nv*Naz, ptsSeg:Nv*Naz*cfg.f, prfCanal:Naz*cfg.f, Runamb:C0/(2*Naz*cfg.f) };
}
const elDeCanal=(i,Nv)=>LIDAR.el0+i*(LIDAR.el1-LIDAR.el0)/(Nv-1);   // grados
/** Radio en el que un canal con depresión φ (°) toca un suelo plano: r = h/tan φ. */
const radioAnillo=(phiDeg,hs=LIDAR.hs)=>hs/Math.tan(-phiDeg*Math.PI/180);

/* ---------- 1.5 El mundo: primitivas que el pulso puede tocar ---------- */
function _caja(o){ return Object.assign({tipo:'caja',rho:REFL.pared,id:1},o); }
/** La calle de la escena. El peatón (cilindro de ancho 0,5 m, alto 1,7 m) está a x = xp, lateral zp. */
function construyeMundo(xp,zp,rhoPeaton,mostrarPeaton=true){
  const O=[];
  const caja=(x0,x1,y0,y1,z0,z1,rho,id=1)=>O.push(_caja({x0,x1,y0,y1,z0,z1,rho,id}));
  const cil=(cx,cz,r,y0,y1,rho,id=1)=>O.push({tipo:'cil',cx,cz,r,y0,y1,rho,id});
  const esf=(cx,cy,cz,r,rho,id=1)=>O.push({tipo:'esf',cx,cy,cz,r,rho,id});
  caja(-10,260,0,0.15,7,10,REFL.acera); caja(-10,260,0,0.15,-10,-7,REFL.acera);                       // aceras
  for(const [a,b,h] of [[10,26,9],[30,62,12],[66,110,8],[114,200,14],[204,260,10]]) caja(a,b,0,h,-13,-10,REFL.pared);   // fachadas izquierda
  for(const [a,b,h] of [[16,44,10],[48,92,8],[96,140,13],[144,200,9],[204,260,12]]) caja(a,b,0,h,10,13,REFL.pared);      // fachadas derecha
  for(const [xc,zc,fw] of [[16,-5.4,1],[33,-5.5,1],[52,5.6,1],[74,-5.4,1]]){                          // coches aparcados: carrocería + cabina
    caja(xc-2.15,xc+2.15,0.28,0.90,zc-0.9,zc+0.9,REFL.coche,1); caja(xc-1.1,xc+0.85,0.90,1.42,zc-0.78,zc+0.78,REFL.coche,1); }
  caja(95.0,103.0,0.9,3.85,3.8,6.3,REFL.camion,1); caja(103.0,105.4,0.9,3.25,3.9,6.2,REFL.camion,1);  // camión aparcado
  for(const x of [6,31,56,81,106,131,156,181,206,231]) for(const z of [-7.8,7.8]) cil(x,z,0.09,0,7,REFL.poste,1);   // farolas
  for(const x of [22,47,72,97,122,147,172,197]){ cil(x,8.2,0.2,0,3,REFL.tronco,1); esf(x,4.6,8.2,1.9,REFL.copa,1); }   // árboles
  if(mostrarPeaton) cil(xp,zp,LIDAR.pedW/2,0,LIDAR.pedH,rhoPeaton,2);
  // intervalo de azimut (rad) de cada primitiva, para no probar todas contra todos los rayos
  for(const o of O){
    let pts;
    if(o.tipo==='caja') pts=[[o.x0,o.z0],[o.x0,o.z1],[o.x1,o.z0],[o.x1,o.z1]];
    else if(o.tipo==='cil'){ const R=Math.hypot(o.cx,o.cz), a=Math.atan2(o.cz,Math.max(o.cx,0.01)), d=Math.asin(Math.min(1,o.r/Math.max(R,o.r*1.0001)))+0.002; o.a0=a-d; o.a1=a+d; continue; }
    else { const R=Math.hypot(o.cx,o.cz), a=Math.atan2(o.cz,Math.max(o.cx,0.01)), d=Math.asin(Math.min(1,o.r/Math.max(R,o.r*1.0001)))+0.002; o.a0=a-d; o.a1=a+d; continue; }
    let a0=1e9,a1=-1e9; for(const [x,z] of pts){ const a=Math.atan2(z,Math.max(x,0.01)); a0=Math.min(a0,a); a1=Math.max(a1,a); }
    o.a0=a0-0.002; o.a1=a1+0.002;
  }
  return {objs:O,xp,zp};
}
/** Primer cruce del rayo (origen en (0,hs,0), dirección unitaria d) con una primitiva: devuelve [t, cosInc] o null. */
function cruce(o,ox,oy,oz,dx,dy,dz,tmax){
  if(o.tipo==='caja'){
    let t0=0,t1=tmax;
    // método de las losas en X, Y, Z, recordando qué cara entra
    const lo=[o.x0,o.y0,o.z0], hi=[o.x1,o.y1,o.z1], O=[ox,oy,oz], D=[dx,dy,dz]; let cara=-1;
    for(let a=0;a<3;a++){
      if(Math.abs(D[a])<1e-12){ if(O[a]<lo[a]||O[a]>hi[a]) return null; continue; }
      let ta=(lo[a]-O[a])/D[a], tb=(hi[a]-O[a])/D[a]; if(ta>tb){ const q=ta; ta=tb; tb=q; }
      if(ta>t0){ t0=ta; cara=a; } if(tb<t1) t1=tb; if(t0>t1) return null;
    }
    if(cara<0||t0<=1e-6||t0>=tmax) return null;
    return [t0,Math.abs(D[cara])];
  }
  if(o.tipo==='cil'){
    const px=ox-o.cx, pz=oz-o.cz, a=dx*dx+dz*dz; if(a<1e-14) return null;
    const b=px*dx+pz*dz, c=px*px+pz*pz-o.r*o.r, disc=b*b-a*c; if(disc<0) return null;
    const t=(-b-Math.sqrt(disc))/a; if(t<=1e-6||t>=tmax) return null;
    const y=oy+dy*t; if(y<o.y0||y>o.y1) return null;
    const hx=px+dx*t, hz=pz+dz*t, inv=1/o.r;
    return [t,Math.max(0,-(hx*dx+hz*dz)*inv)];
  }
  // esfera
  const px=ox-o.cx, py=oy-o.cy, pz=oz-o.cz, b=px*dx+py*dy+pz*dz, c=px*px+py*py+pz*pz-o.r*o.r, disc=b*b-c; if(disc<0) return null;
  const t=-b-Math.sqrt(disc); if(t<=1e-6||t>=tmax) return null;
  const hx=px+dx*t, hy=py+dy*t, hz=pz+dz*t;
  return [t,Math.max(0,-(hx*dx+hy*dy+hz*dz)/o.r)];
}
/** Traza un rayo: el suelo (y = 0) y las primitivas. Devuelve {t,cos,rho,id} del primer contacto (id 0 = suelo) o null. */
function trazaRayo(lista,ox,oy,oz,dx,dy,dz,tmax=LIDAR.Rwin){
  let mejor=null, tm=tmax;
  if(dy<-1e-9){ const t=-oy/dy; if(t<tm){ tm=t; mejor={t,cos:-dy,rho:REFL.suelo,id:0}; } }
  for(const o of lista){ const r=cruce(o,ox,oy,oz,dx,dy,dz,tm); if(r){ tm=r[0]; mejor={t:r[0],cos:r[1],rho:o.rho,id:o.id}; } }
  return mejor;
}

/* ---------- 1.6 Un barrido: la nube de puntos ----------
   Para cada canal i y columna j se lanza un pulso con azimut −60° + (j + u)·dth, u ∈ [0,1) al azar (la fase del
   espejo cambia de un barrido al siguiente). Si hay contacto, el eco tiene P_r (ecuación del lidar); el umbral
   dispara con P_d(P_r); el punto se coloca en la distancia medida t_med·c/2 con el error σ_R. En lluvia o niebla,
   con probabilidad p_ghost el primer eco es una gota (punto falso entre 1 m y r_bs), que tapa al eco real.
   Además, una falsa alarma por ruido con probabilidad P_FA_RAYO por pulso. */
const CLASE={SUELO:0,ESTR:1,PEATON:2,FANTASMA:3,RUIDO:4};
function generaNube(cfg,esc,mundo,semilla=1,opts={}){
  const g=geomBarrido(cfg), rng=mulberry32(semilla>>>0), alfa=CLIMAS[esc.clima].alfa, P=cfg.P, hs=LIDAR.hs;
  const cap=g.rayos+Math.ceil(g.rayos*P_FA_RAYO*3)+64;
  const X=new Float32Array(cap), Y=new Float32Array(cap), Z=new Float32Array(cap), C=new Uint8Array(cap), AZ=new Float32Array(cap), RH=new Float32Array(cap), IN=new Float32Array(cap);
  const idx=new Int32Array(g.Nv*g.Naz).fill(-1);
  const pg=opts.sinFantasmas?0:pGhost(P,alfa), rb=rBs(P,alfa), u0=opts.fase!==undefined?opts.fase:rng();
  const sinRuido=!!opts.sinRuido;
  const sinEl=new Float64Array(g.Nv), cosEl=new Float64Array(g.Nv);
  for(let i=0;i<g.Nv;i++){ const e=elDeCanal(i,g.Nv)*Math.PI/180; sinEl[i]=Math.sin(e); cosEl[i]=Math.cos(e); }
  let n=0, nSuelo=0, nPeat=0, nFant=0, nRuido=0, nImp=0;
  const lista=[];
  for(let j=0;j<g.Naz;j++){
    const azDeg=-LIDAR.fovH/2+(j+u0)*cfg.dth, az=azDeg*Math.PI/180, ca=Math.cos(az), sa=Math.sin(az);
    lista.length=0; for(const o of mundo.objs) if(az>=o.a0&&az<=o.a1) lista.push(o);
    for(let i=0;i<g.Nv;i++){
      const dx=cosEl[i]*ca, dy=sinEl[i], dz=cosEl[i]*sa;
      const h=trazaRayo(lista,0,hs,0,dx,dy,dz,LIDAR.Rwin);
      let t=Infinity, clase=-1, rho=0, cs=0;
      if(h){
        // el capó del propio coche tapa los primeros metros del suelo
        if(!(h.id===0&&h.t*dx<2.6)){
          const fill=h.id===2?llenado(h.t):1, Pr=potEco(P,h.rho,h.cos,h.t,alfa,fill);
          if(rng()<pDet(Pr)){ const sg=sigmaRango(Pr); t=Math.max(0.3,h.t+sg*gauss(rng)); clase=h.id===0?CLASE.SUELO:(h.id===2?CLASE.PEATON:CLASE.ESTR); rho=h.rho; cs=Pr; }
        }
      }
      if(pg>0&&rng()<pg){ const r=1+(Math.max(rb,1.01)-1)*rng(); if(r<t){ t=r; clase=CLASE.FANTASMA; cs=potBs(P,alfa,r); } }
      if(clase<0) continue;
      const k=n++; X[k]=dx*t; Y[k]=hs+dy*t; Z[k]=dz*t; C[k]=clase; AZ[k]=j/g.Naz; RH[k]=t*cosEl[i]; IN[k]=cs; idx[i*g.Naz+j]=k;
      if(clase===CLASE.SUELO) nSuelo++; else if(clase===CLASE.PEATON) nPeat++; else if(clase===CLASE.FANTASMA) nFant++; else nImp++;
    }
    if(!sinRuido){
      for(let i=0;i<g.Nv;i++) if(rng()<P_FA_RAYO){ const r=2+(LIDAR.Rwin-2)*rng(), k=n++; X[k]=cosEl[i]*ca*r; Y[k]=hs+sinEl[i]*r; Z[k]=cosEl[i]*sa*r; C[k]=CLASE.RUIDO; AZ[k]=j/g.Naz; RH[k]=r*cosEl[i]; IN[k]=SIGMA_N*K_UMBRAL; nRuido++; }
    }
  }
  return {n,X,Y,Z,C,AZ,RH,IN,idx,Nv:g.Nv,Naz:g.Naz,rayos:g.rayos,nSuelo,nPeat,nFant,nRuido,nEstr:nImp,geom:g};
}

/* ---------- 1.7 Segmentación del suelo ----------
   En cada columna los anillos se recorren del más cercano al más lejano. Un punto es suelo si está a menos de zSuelo (0,30 m)
   de altura y no sube respecto al último punto de suelo más que tan(slopeMax)·Δr + 0,15 m (un bordillo). Un obstáculo vertical rompe la
   pendiente (≈ 90°); detrás de él el suelo se recupera. */
function segmentaSuelo(nube){
  const {Nv,Naz,idx,X,Y,Z,RH}=nube, suelo=new Uint8Array(nube.n), tg=Math.tan(LIDAR.slopeMax*Math.PI/180);
  for(let j=0;j<Naz;j++){
    let rg=-1, yg=0, tiene=false;
    for(let i=0;i<Nv;i++){
      const k=idx[i*Naz+j]; if(k<0) continue;
      const r=RH[k], y=Y[k];
      if(y>=LIDAR.zSuelo) continue;
      if(!tiene){ suelo[k]=1; tiene=true; rg=r; yg=y; continue; }
      const dr=r-rg, dz=y-yg;
      if(dz<=tg*Math.max(dr,0)+LIDAR.bordillo){ suelo[k]=1; rg=r; yg=y; }
    }
  }
  return suelo;
}

/* ---------- 1.8 Agrupamiento por imagen de distancias ----------
   Los puntos viven en una rejilla (canal, columna). Dos puntos vecinos (hasta 2 casillas) son del mismo objeto si
   el ángulo β = atan2(d₂·sen α, d₁ − d₂·cos α) —con d₁ ≥ d₂ las distancias y α el ángulo entre sus rayos— supera
   betaMin: una pared o una persona de frente da β grande; un salto de distancia (poste delante de una fachada) da β ≈ 0.
   Así la separación entre puntos no rompe a un peatón lejano en pedazos, como pasaría con una distancia fija en metros.
   Unión-búsqueda. Devuelve la etiqueta de cada punto (−1: no está en ningún grupo con minPts puntos o más). */
function agrupa(nube,incluir,betaMin=LIDAR.betaMin,minPts=LIDAR.minPts){
  const {n,X,Y,Z,idx,Nv,Naz}=nube, hs=LIDAR.hs, padre=new Int32Array(n); for(let i=0;i<n;i++) padre[i]=i;
  const raiz=i=>{ while(padre[i]!==i){ padre[i]=padre[padre[i]]; i=padre[i]; } return i; };
  const tb=Math.tan(betaMin*Math.PI/180);
  const vec=[[0,1],[1,0],[1,1],[1,-1],[0,2],[2,0]];
  const dist=k=>Math.sqrt(X[k]*X[k]+(Y[k]-hs)*(Y[k]-hs)+Z[k]*Z[k]);
  for(let i=0;i<Nv;i++) for(let j=0;j<Naz;j++){
    const a=idx[i*Naz+j]; if(a<0||!incluir[a]) continue;
    const da=dist(a);
    for(const [di,dj] of vec){
      const i2=i+di, j2=j+dj; if(i2<0||i2>=Nv||j2<0||j2>=Naz) continue;
      const b=idx[i2*Naz+j2]; if(b<0||!incluir[b]) continue;
      const db=dist(b), d1=Math.max(da,db), d2=Math.min(da,db);
      const cosA=(X[a]*X[b]+(Y[a]-hs)*(Y[b]-hs)+Z[a]*Z[b])/(da*db), sinA=Math.sqrt(Math.max(0,1-cosA*cosA));
      // tan β = d₂·sen α / (d₁ − d₂·cos α)  →  mismo objeto si β > betaMin
      const den=d1-d2*cosA; if(den<=0||d2*sinA>tb*den){ const ra=raiz(a), rb2=raiz(b); if(ra!==rb2) padre[ra]=rb2; }
    }
  }
  const cuenta=new Map(); for(let i=0;i<n;i++) if(incluir[i]){ const r=raiz(i); cuenta.set(r,(cuenta.get(r)||0)+1); }
  const etiqueta=new Int32Array(n).fill(-1), grupos=[], mapa=new Map();
  for(let i=0;i<n;i++){ if(!incluir[i]) continue; const r=raiz(i); if(cuenta.get(r)<minPts) continue;
    let gi=mapa.get(r); if(gi===undefined){ gi=grupos.length; mapa.set(r,gi); grupos.push({n:0,sx:0,sy:0,sz:0,x0:1e9,x1:-1e9,y0:1e9,y1:-1e9,z0:1e9,z1:-1e9,nPeat:0}); }
    const G=grupos[gi]; etiqueta[i]=gi; G.n++; G.sx+=X[i]; G.sy+=Y[i]; G.sz+=Z[i];
    G.x0=Math.min(G.x0,X[i]); G.x1=Math.max(G.x1,X[i]); G.y0=Math.min(G.y0,Y[i]); G.y1=Math.max(G.y1,Y[i]); G.z0=Math.min(G.z0,Z[i]); G.z1=Math.max(G.z1,Z[i]);
    if(nube.C[i]===CLASE.PEATON) G.nPeat++; }
  for(const G of grupos){ G.cx=G.sx/G.n; G.cy=G.sy/G.n; G.cz=G.sz/G.n; G.dist=Math.hypot(G.cx,G.cz); }
  return {etiqueta,grupos};
}
/** Procesa un barrido completo: nube → suelo → grupos → resumen del peatón. */
function procesaBarrido(cfg,esc,mundo,semilla=1,opts={}){
  const nube=generaNube(cfg,esc,mundo,semilla,opts), suelo=segmentaSuelo(nube), inc=new Uint8Array(nube.n);
  for(let i=0;i<nube.n;i++) inc[i]=suelo[i]?0:1;
  const ag=agrupa(nube,inc);
  // el grupo del peatón: el que reúne más de sus puntos
  let gp=-1,mejor=0; ag.grupos.forEach((G,i)=>{ if(G.nPeat>mejor){ mejor=G.nPeat; gp=i; } });
  let pedEnSuelo=0; for(let i=0;i<nube.n;i++) if(nube.C[i]===CLASE.PEATON&&suelo[i]) pedEnSuelo++;
  const tamPed=gp>=0?ag.grupos[gp].n:0;
  return {nube,suelo,ag,gp,nPed:nube.nPeat,tamPed,confirmado:tamPed>=LIDAR.Nmin,pedEnSuelo};
}

/* ---------- 1.9 Lo que se espera del peatón (forma cerrada) ----------
   Puntos esperados = columnas que le caen (ancho angular / separación horizontal, promedio sobre la fase del espejo) ·
   anillos que le tocan por encima de la altura máxima del suelo (la elevación de cada canal es fija: se cuentan
   exactamente) · P_d medio sobre el ancho (la luz llega rasante en los bordes del cilindro: cosθ = cos(el)·√(1−u²)) ·
   (1 − p_ghost) (un eco falso tapa al real). Los pies (y < 0,30 m) se clasifican como suelo y no cuentan. */
const _tanEl=new Map();
function tablaTan(Nv){ let t=_tanEl.get(Nv); if(!t){ t=new Float64Array(Nv); for(let i=0;i<Nv;i++) t[i]=Math.tan(elDeCanal(i,Nv)*Math.PI/180); _tanEl.set(Nv,t); } return t; }
/** Anillos que tocan al peatón en el eje (distancia R): n sobre la altura del suelo, nTotal contando los pies. */
function anillosPeaton(cfg,R){
  const tn=tablaTan(cfg.Nv); let n=0, nTotal=0; const y=[];
  for(let i=0;i<cfg.Nv;i++){ const yy=LIDAR.hs+R*tn[i];
    if(yy>=0&&yy<=LIDAR.pedH){ nTotal++; if(yy>=LIDAR.zSuelo){ n++; y.push(yy); } } }
  return {n,nTotal,y};
}
function pedEsperado(cfg,esc){
  const g=geomBarrido(cfg), alfa=CLIMAS[esc.clima].alfa, R=esc.R, hs=LIDAR.hs, r=LIDAR.pedW/2, h=LIDAR.pedH;
  const yc=h/2, Rs=Math.hypot(R,hs-yc), cosEl=R/Rs, tn=tablaTan(cfg.Nv), fill=llenado(Rs);
  const nh=2*Math.asin(Math.min(1,r/R))/(cfg.dth*Math.PI/180);
  // promedio sobre el ancho del cilindro (posición lateral normalizada u): el punto de contacto está a R − r·√(1−u²) y la luz llega rasante en los bordes
  let s=0, sPd=0; const M=24;
  for(let m=0;m<M;m++){ const u=(m+0.5)/M, c=Math.sqrt(1-u*u), Rm=R-r*c;
    let rings=0; for(let i=0;i<cfg.Nv;i++){ const yy=hs+Rm*tn[i]; if(yy>=LIDAR.zSuelo&&yy<=h) rings++; }
    const pd=pDet(potEco(cfg.P,esc.rho,cosEl*c,Rs,alfa,fill)); s+=rings*pd; sPd+=pd; }
  const pdMed=sPd/M, pg=pGhost(cfg.P,alfa), PrC=potEco(cfg.P,esc.rho,cosEl,Rs,alfa,fill), aC=PrC/SIGMA_N, an=anillosPeaton(cfg,R);
  return { E:nh*(s/M)*(1-pg), nh, nv:an.n, nvTotal:an.nTotal, pdMed, pg, PrC, aC, margenDB:dB(aC/A90), sepH:R*cfg.dth*Math.PI/180, sepV:R*g.dEl*Math.PI/180, Rs, pdC:pDet(PrC) };
}

/* ---------- 1.10 El reto: criterios y escenarios ---------- */
function evaluaConfig(cfg,esc){
  const g=geomBarrido(cfg), pe=pedEsperado(cfg,esc);
  const c=[
    {k:'eco',        ok:pe.aC>=A90,                                   val:pe.margenDB, lim:0},
    {k:'puntos',     ok:pe.E>=LIDAR.Nmin,                             val:pe.E,        lim:LIDAR.Nmin},
    {k:'presupuesto',ok:g.ptsSeg<=esc.presupuesto,                    val:g.ptsSeg,    lim:esc.presupuesto},
    {k:'ojo',        ok:cfg.P<=LIDAR.Pojo+1e-9,                       val:cfg.P,       lim:LIDAR.Pojo},
    {k:'reaccion',   ok:LIDAR.vueltasConf/cfg.f<=LIDAR.tReac+1e-12,   val:LIDAR.vueltasConf/cfg.f, lim:LIDAR.tReac},
    {k:'fantasmas',  ok:pe.pg<=LIDAR.ghostMax,                        val:pe.pg,       lim:LIDAR.ghostMax},
  ];
  return {criterios:c, ok:c.every(x=>x.ok), g, pe};
}
const NVS=[16,32,64,128];
const RANGO={ dth:[0.10,0.80,0.05], f:[5,20,1], P:[5,150,5] };
/** Recorre la rejilla de ajustes y devuelve los intervalos que sirven (sólo se calcula después de resolver el reto). */
function ventanaReto(esc){
  let n=0, dthMax=0, dthMin=9, Pmin=1e9, Pmax=0, fMin=99, fMax=0; const canales=new Set();
  for(const Nv of NVS) for(let dth=RANGO.dth[0];dth<=RANGO.dth[1]+1e-9;dth+=RANGO.dth[2]) for(let f=RANGO.f[0];f<=RANGO.f[1];f+=RANGO.f[2]) for(let P=RANGO.P[0];P<=RANGO.P[1];P+=RANGO.P[2]){
    if(evaluaConfig({Nv,dth:Math.round(dth*100)/100,f,P},esc).ok){ n++; canales.add(Nv); dthMax=Math.max(dthMax,dth); dthMin=Math.min(dthMin,dth); Pmin=Math.min(Pmin,P); Pmax=Math.max(Pmax,P); fMin=Math.min(fMin,f); fMax=Math.max(fMax,f); } }
  return {n,canales:[...canales],dthMax,dthMin,Pmin,Pmax,fMin,fMax};
}

function ruidoPeriodico(semilla,periodo){
  const g=(x,y)=>{ x=((x%periodo)+periodo)%periodo; y=((y%periodo)+periodo)%periodo;
    const s=Math.sin(x*127.1+y*311.7+semilla*13.13)*43758.5453; return s-Math.floor(s); };
  return (x,y)=>{ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    return g(xi,yi)*(1-u)*(1-v)+g(xi+1,yi)*u*(1-v)+g(xi,yi+1)*(1-u)*v+g(xi+1,yi+1)*u*v; };
}

    im.data[o]=im.data[o+1]=im.data[o+2]=v; im.data[o+3]=255; }
  x.putImageData(im,0,0); return tex(c,{srgb:true});
}

  x.strokeStyle='rgba(60,72,86,0.55)'; x.lineWidth=2.2; x.lineCap='butt';
  for(let k=-W;k<=W*2;k+=16){ x.beginPath(); x.moveTo(k,W); x.lineTo(k+W,0); x.stroke(); }

const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
/** Junta una pieza hecha de muchas mallas en una malla por material: así una rueda con 40 tacos cuesta 3 llamadas. */
function fusiona(grupo){
  grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map();
  grupo.traverse(o=>{ if(!o.isMesh) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(), m=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);
    g.applyMatrix4(m);
    if(!g.attributes.uv){ g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2)); }
    const k=o.material; if(!por.has(k)) por.set(k,[]); por.get(k).push(g); });
  const out=new THREE.Group();
  for(const [mat,gs] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count;
      pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry();
    G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const me=new THREE.Mesh(G,mat); me.castShadow=true; me.receiveShadow=true; out.add(me);

}
/** Una carrocería «lofteada»: anillos de superelipse que se estrechan hacia los extremos.
 *  secs: [{x, w (semianchura), y0, y1, n (exponente), tum (estrechamiento arriba, 0..1)}]. */
function lofteo(secs,seg=28){
  const pos=[],idx=[],nR=secs.length;
  for(const s of secs){
    const yc=(s.y0+s.y1)/2, hh=Math.max(1e-3,(s.y1-s.y0)/2), ex=2/(s.n||3);
    for(let k=0;k<seg;k++){
      const th=k/seg*DOSPI_, c=Math.cos(th), sn=Math.sin(th);
      const yy=yc+hh*Math.sign(sn)*Math.pow(Math.abs(sn),ex), f=(yy-s.y0)/(2*hh);
      const zz=Math.max(1e-3,s.w)*(1-(s.tum||0)*f*f)*Math.sign(c)*Math.pow(Math.abs(c),ex);
      pos.push(s.x,yy,zz);
    }

  const cI=pos.length/3; pos.push(secs[0].x,(secs[0].y0+secs[0].y1)/2,0); pos.push(secs[nR-1].x,(secs[nR-1].y0+secs[nR-1].y1)/2,0);
  for(let i=0;i<nR-1;i++) for(let k=0;k<seg;k++){
    const a=i*seg+k, b=i*seg+(k+1)%seg, c2=(i+1)*seg+k, d=(i+1)*seg+(k+1)%seg;
    idx.push(a,c2,b, b,c2,d);

  // el sentido de las caras: si el volumen con signo sale negativo, se invierten
  let vol=0; for(let i=0;i<idx.length;i+=3){ const a=idx[i]*3,b=idx[i+1]*3,c3=idx[i+2]*3;
    vol+=pos[a]*(pos[b+1]*pos[c3+2]-pos[b+2]*pos[c3+1])-pos[a+1]*(pos[b]*pos[c3+2]-pos[b+2]*pos[c3])+pos[a+2]*(pos[b]*pos[c3+1]-pos[b+1]*pos[c3]); }
  if(vol<0) for(let i=0;i<idx.length;i+=3){ const t=idx[i+1]; idx[i+1]=idx[i+2]; idx[i+2]=t; }

/* ===================== 7. EL COCHE (con el sensor en el techo) =====================
   Carrocería «lofteada» como las del resto de la plataforma: anillos de superelipse. Mide 4,5 m: la escena es a escala real. */
function lofteoCoche(mat){
  const secs=[], N=34, hl=2.25;
  const yt=perfil1D([[-2.25,0.62],[-2.0,0.80],[-1.3,0.90],[-0.4,0.88],[0.6,0.84],[1.3,0.76],[1.9,0.66],[2.25,0.50]]);
  for(let i=0;i<=N;i++){
    const x=-hl*Math.cos(Math.PI*i/N), u=x/hl, ab=Math.pow(Math.abs(u),4.2);
    const w=0.90*Math.pow(Math.max(0.0004,1-ab),1/4.2), yb=0.30+0.22*Math.pow(Math.min(1,Math.abs(u)),4), y1=Math.max(yb+0.06,yt(x));
    secs.push({x,w:Math.max(0.02,w),y0:yb,y1,n:3.4,tum:0.10});
  }
  return new THREE.Mesh(lofteo(secs,28),mat);
}
function cabinaCoche(){
  const cab=[], cabM=22, x0=-1.2, x1=0.75, yt=perfil1D([[-2.25,0.62],[-1.3,0.90],[-0.4,0.88],[0.6,0.84],[1.3,0.76]]);
  for(let i=0;i<=cabM;i++){ const t=i/cabM, x=mezcla(x0,x1,t), env=Math.pow(Math.sin(Math.PI*Math.pow(t,0.85)),0.55), base=yt(x)-0.03, techo=Math.max(base+0.03,mezcla(yt(x),1.43,env));
    cab.push({x,w:Math.max(0.03,0.80*Math.pow(env,0.35)),y0:base,y1:techo,n:3.0,tum:0.30}); }
  return new THREE.Mesh(lofteo(cab,24),M.cristal);
}
function ruedas(g,pos,r,ancho,matGoma,matLlanta){

/* ===================== 9. EL PEATÓN (animado: camina y cruza) =====================
   Dos prendas: oscura (ρ = 0,10) y clara con chaleco (ρ = 0,60). Pierna y brazo pivotan en cadera y hombro. */
function creaPeaton(oscuro){
  const mj=oscuro?pbr({color:'#171b22',roughness:0.9}):pbr({color:'#e9edf1',roughness:0.8}), mp=oscuro?pbr({color:'#101216',roughness:0.92}):pbr({color:'#cfd6de',roughness:0.85});
  const mv=oscuro?mj:M.chaleco;
  const raiz=new THREE.Group(), cuerpo=new THREE.Group();
  const cap=(r,l,mat,x,y,z,rz=0)=>{ const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,l,4,10),mat); m.position.set(x,y,z); m.rotation.z=rz; m.castShadow=true; return m; };
  const t=cap(0.17,0.30,mj,0,1.22,0); t.scale.set(0.78,1,1.15); cuerpo.add(t);
  const c=cap(0.178,0.22,mv,0,1.24,0); c.scale.set(0.80,1,1.17); cuerpo.add(c);
  const h=new THREE.Mesh(new THREE.SphereGeometry(0.11,18,14),M.piel); h.position.y=1.63; h.castShadow=true; cuerpo.add(h);
  raiz.add(cuerpo);
  const piernas=[], brazos=[];
  for(const lado of [-1,1]){
    const p=new THREE.Group(); p.position.set(0,0.88,lado*0.095); p.add(cap(0.075,0.60,mp,0,-0.45,0));
    const z=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.07,0.10),M.zapato); z.position.set(0.06,-0.82,0); p.add(z); raiz.add(p); piernas.push(p);
    const b=new THREE.Group(); b.position.set(0,1.42,lado*0.225); b.add(cap(0.05,0.42,mj,0,-0.24,0)); raiz.add(b); brazos.push(b);
  }
  raiz.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.userData.pieza='peaton'; } });
  return {raiz,piernas,brazos,cuerpo};
}

/** Configuración y escena que corren ahora: la de los mandos, o la que fija el paso del laboratorio guiado. */

const marcaSucio=()=>{ RAD.sucio=true; };
const RGB=c=>{ const k=new THREE.Color(c); return [k.r,k.g,k.b]; };

  for(let c=0;c<3;c++) o[k+c]=(a[1][c]+(b[1][c]-a[1][c])*t)*1.15; }
const C_SUELO=RGB('#3e78b8'), C_RUIDO=RGB('#8d99a6'), C_FANT=RGB('#b9c6d3'), C_AMBAR=RGB('#ffb02e'), C_PED=RGB('#46ff9a');

/** Corre un barrido completo con la configuración y la escena actuales. */
function recalculaLidar(){
  const t0=performance.now(), cfg=cfgActual(), esc=escActual();
  RAD.cfg=cfg; RAD.esc=esc; RAD.sucio=false; RAD.tUlt=performance.now();
  MUNDO=construyeMundo(esc.R,PEAT.z,esc.rho,true);
  const out=procesaBarrido(cfg,esc,MUNDO,RAD.semilla); RAD.out=out; RAD.pe=pedEsperado(cfg,esc); RAD.ok=true;
  const nube=out.nube, n=Math.min(nube.n,NUBE_MAX);
  const ocul=ocultaVerdad(), objetos=EST.color==='obj';
  for(let k=0;k<n;k++){
    nPos[k*3]=nube.X[k]; nPos[k*3+1]=nube.Y[k]; nPos[k*3+2]=nube.Z[k]; nAz[k]=nube.AZ[k];
    if(!objetos) colorDist(nube.RH[k],nCol,k*3);
    else {
      const c=nube.C[k], g=out.ag.etiqueta[k];
      let col;
      if(out.suelo[k]) col=C_SUELO; else if(c===CLASE.FANTASMA&&g<0) col=C_FANT; else if(c===CLASE.RUIDO||g<0) col=C_RUIDO;
      else if(!ocul&&g===out.gp) col=out.confirmado?C_PED:C_AMBAR; else col=PAL_GRUPO[g%PAL_GRUPO.length];
      const m=out.suelo[k]?0.8:1.3; nCol[k*3]=col[0]*m; nCol[k*3+1]=col[1]*m; nCol[k*3+2]=col[2]*m; }
  }
  nubeGeo.setDrawRange(0,n); nubeGeo.attributes.position.needsUpdate=true; nubeGeo.attributes.color.needsUpdate=true; nubeGeo.attributes.aAz.needsUpdate=true;
  if(objetos){
    // sólo los grupos con tamaño de objeto y a menos de 130 m, los más cercanos primero
    const orden=out.ag.grupos.map((G,i)=>i).filter(i=>{ const G=out.ag.grupos[i]; return G.n>=LIDAR.minPts&&G.dist<130&&G.y1>0.35&&G.n>=4; }).sort((a,b)=>out.ag.grupos[a].dist-out.ag.grupos[b].dist);
    const sel=orden.slice(0,BB_MAX), mapa=sel.map(i=>out.ag.grupos[i]);
    escribeCajas(mapa,(gi,G)=>{ const real=sel[gi]; if(!ocul&&real===out.gp) return out.confirmado?C_PED:C_AMBAR; return PAL_GRUPO[real%PAL_GRUPO.length]; });
  } else { bbGeo.setDrawRange(0,0); }

}
/** Qué parte de la verdad no se enseña todavía (reto sin resolver, diagnóstico, cálculo). */
const ocultaF=()=>EST.modo==='guia'&&GUIA.paso==='predice';
const ocultaVerdad=()=>EST.modo==='guia'&&(GUIA.paso==='decide'&&!(GUIA.r2&&GUIA.r2.validado)||GUIA.paso==='diag'&&!GUIA.dxOk||GUIA.paso==='predice')||!EST.verdad;
const ocultaAvisos=()=>EST.modo==='guia'&&(GUIA.paso==='decide'&&!(GUIA.r2&&GUIA.r2.validado)||GUIA.paso==='diag'&&!GUIA.dxOk);

/* ---------- la escena sigue al clima, al peatón y al barrido ---------- */
let CLIMA_APL='';
function aplicaClima(c){
  if(c===CLIMA_APL) return; CLIMA_APL=c;
  scene.fog.density=({despejado:0.0042,lluvia:0.0075,niebla:0.0130})[c]||0.0042;
  LLUVIA.visible=c==='lluvia'&&!REDUCIDO;
}
function muevePeatonEnMundo(){
  for(const o of MUNDO.objs) if(o.id===2){ o.cx=PEAT.x; o.cz=PEAT.z; const R=Math.hypot(o.cx,o.cz), a=Math.atan2(o.cz,Math.max(o.cx,0.01)), d=Math.asin(Math.min(1,o.r/Math.max(R,o.r*1.0001)))+0.002; o.a0=a-d; o.a1=a+d; }
}
const _v=new THREE.Vector3(), _q=new THREE.Quaternion(), _Y=new THREE.Vector3(0,1,0);
const _col=new THREE.Color();
function aplicaEscena(dt){
  const reloj=EST.pausa?0:dt*EST.vel;
  SIM.t+=reloj;
  const esc=RAD.esc||ESC_MARCHA(), ciclo=SIM.t/T_VIS, fase=ciclo-Math.floor(ciclo); SIM.fase=fase;
  aplicaClima(esc.clima);
  nubeMat.uniforms.uFase.value=fase;
  // --- el peatón cruza la calle; su distancia sigue al mando
  PEAT.x+=(esc.R-PEAT.x)*Math.min(1,dt*6); if(Math.abs(esc.R-PEAT.x)<0.002) PEAT.x=esc.R;
  const per=4*Z_CRUCE, s=((SIM.t*V_CRUCE)%per+per)%per, z=s<2*Z_CRUCE?-Z_CRUCE+s:Z_CRUCE-(s-2*Z_CRUCE), dir=s<2*Z_CRUCE?1:-1;
  if(!EST.pausa) PEAT.z=z; PEAT.dir=dir;
  const objetivoGiro=dir>0?-Math.PI/2:Math.PI/2; PEAT.giro+=(objetivoGiro-PEAT.giro)*Math.min(1,dt*7);
  const act=esc.rho>0.3?PEAT.claro:PEAT.osc, ina=act===PEAT.claro?PEAT.osc:PEAT.claro;
  act.raiz.visible=true; ina.raiz.visible=false;
  PEAT_GRUPO.position.set(PEAT.x,0,PEAT.z); PEAT_GRUPO.rotation.y=PEAT.giro;        // la persona mira hacia donde camina; su «adelante» local es +X
  const marcha=EST.pausa?0:1, ph=SIM.t*V_CRUCE*3.4, sw=Math.sin(ph)*0.55*marcha;
  act.piernas[0].rotation.z=sw; act.piernas[1].rotation.z=-sw; act.brazos[0].rotation.z=-sw*0.7; act.brazos[1].rotation.z=sw*0.7;
  act.cuerpo.position.y=Math.abs(Math.sin(ph))*0.015*marcha;
  CEBRA.position.set(PEAT.x,0,0); ARO_PEAT.position.set(PEAT.x,0,PEAT.z); { const k=1+0.06*Math.sin(SIM.t*3); ARO_PEAT.userData.a.scale.set(k,k,k); ARO_PEAT.userData.b.scale.set(1/k,1/k,1/k); }
  muevePeatonEnMundo();
  // --- el espejo gira con la fase del barrido: 60° por cada barrido de 120°
  MIR.rotation.y=-fase*Math.PI/3;

  SENS_PARTES.haz.quaternion.setFromUnitVectors(_Y,_v.set(dx,0,dz)); SENS_PARTES.haz.scale.set(1,0.0775,1);

  const cfg=RAD.cfg||CFG_MARCHA(), Nv=cfg.Nv, nVis=Math.min(Nv,HAZ_N), lista=[];

    const o=c*6;

    const i=nVis===Nv?c:Math.floor((c+0.5)*Nv/nVis), el=elDeCanal(i,Nv)*Math.PI/180, ce=Math.cos(el), se=Math.sin(el);
    const ex=ce*dx, ey=se, ez=ce*dz, h=trazaRayo(lista,0,H_S,0,ex,ey,ez,LIDAR.Rwin), L=h?Math.min(h.t,200):(ey>0?26:70);

    const dim=h?1:0.55; hazCol[o]=0.03*dim; hazCol[o+1]=0.10*dim; hazCol[o+2]=0.06*dim; hazCol[o+3]=0.22*dim; hazCol[o+4]=0.85*dim; hazCol[o+5]=0.52*dim;

  const blancos=[V3(PEAT.x,1.05,PEAT.z),V3(14.2,0.95,-5.5),V3(56,3.2,-7.8)];

    if(p.ida.visible){ const q=pos(R*tl/ida); p.ida.position.copy(q); p.ida.scale.setScalar(clamp(q.distanceTo(cam)*0.026,0.08,1.6)); }
    if(p.vuelta.visible){ const q=pos(R*(1-(tl-ida)/ida)); p.vuelta.position.copy(q); p.vuelta.scale.setScalar(clamp(q.distanceTo(cam)*0.026,0.08,1.6)); }

  nubeMat.uniforms.uMax.value=(esEstrecho()?14:22)*renderer.getPixelRatio();

/* ===================== 13. CÁMARAS =====================
   La cámara se aleja lo justo para que la caja del objeto (ancho × alto en unidades) quepa en el hueco que dejan la
   guía y el dock, y la proyección se desplaza para centrarla en él. */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}
const RPED=()=>(RAD.esc?RAD.esc.R:EST.dist);
/** Cada vista: dirección de la cámara desde el ancla, ancla, y la caja (ancho × alto, en m) que debe caber. */
const VISTAS={
  calle:{dir:V3(-0.88,0.33,0.24),anc:()=>V3(0.36*RPED()+2,1.0,0),obj:()=>({w:0.5*RPED()+19,h:0.14*RPED()+6.5}),fov:36},
  peaton:{dir:V3(-0.80,0.14,0.58),anc:()=>V3(PEAT.x,0.92,PEAT.z),obj:()=>({w:3.8,h:2.9}),fov:34},
  sensor:{dir:V3(0.34,0.26,0.90),anc:()=>V3(0,H_S+0.004,0),obj:()=>({w:0.30,h:0.25}),fov:34},
  cenit:{dir:V3(0.001,1,0.001),anc:()=>V3(0.4*RPED()+6,0,0),obj:()=>({w:0.9*RPED()+36,h:0.5*RPED()+20}),fov:34},
};
const CAM={off:V3(6,3,5),toff:V3(0,0,0),auto:true,previo:null,k:1,dur:1};
function fovVista(v){ return innerWidth<innerHeight*0.9?48:VISTAS[v].fov; }
function distanciaFit(w,h,fov){
  const Hu=huecoLibre(), W=innerWidth, Hh=innerHeight, tv=Math.tan(fov*Math.PI/360), th=tv*(W/Hh);
  const wF=Math.max(80,Hu.x1-Hu.x0)/W, hF=Math.max(80,Hu.y1-Hu.y0)/Hh;
  return 1.05*Math.max(w/(2*th*wF),h/(2*tv*hF));
}
function ofsDeseado(v){
  const V=VISTAS[v], o=V.obj(), fov=fovVista(v), D=distanciaFit(o.w,o.h,fov);
  return {off:V.dir.clone().normalize().multiplyScalar(D),toff:V3(0,0,0),fov};
}
function ponVista(v,dur){
  EST.vista=v; CAM.auto=true; CAM.dur=dur===undefined?1.0:dur;
  if(typeof pintaBarras==='function') pintaBarras();
  if(CAM.dur<=0.01){ const A=VISTAS[v].anc(), d=ofsDeseado(v); CAM.off.copy(d.off); CAM.toff.copy(d.toff); camera.fov=d.fov; camera.updateProjectionMatrix();
    camera.position.copy(A).add(CAM.off); controls.target.copy(A).add(CAM.toff); CAM.previo=A.clone(); }
}
function pasaCam(dt){
  const V=VISTAS[EST.vista], P=V.anc();
  if(CAM.auto){
    const d=ofsDeseado(EST.vista), k=1-Math.exp(-dt/Math.max(0.05,(CAM.dur||1)*0.30));
    CAM.off.lerp(d.off,k); CAM.toff.lerp(d.toff,k);
    if(Math.abs(camera.fov-d.fov)>0.05){ camera.fov+=(d.fov-camera.fov)*k; camera.updateProjectionMatrix(); }
    camera.position.copy(P).add(CAM.off); controls.target.copy(P).add(CAM.toff);
  }
}
controls.addEventListener('start',()=>{ CAM.auto=false; });
/** El objeto del estado: el sensor, el coche y la zona de la nube (caja envolvente proyectada) frente al hueco libre y la ventana. */
function medidaObjeto(){
  const b=new THREE.Box3(); b.expandByObject(EGO); b.expandByPoint(V3(RPED()+3,3.2,Z_CRUCE+1)); b.expandByPoint(V3(RPED()+3,0,-Z_CRUCE-1));
  const c=[]; for(const x of [b.min.x,b.max.x]) for(const y of [b.min.y,b.max.y]) for(const z of [b.min.z,b.max.z]) c.push(new THREE.Vector3(x,y,z));
  let y0=1e9,y1=-1e9,x0=1e9,x1=-1e9; const v=new THREE.Vector3();
  for(const p of c){ v.copy(p).project(camera); const sx=(v.x+1)/2*innerWidth, sy=(1-v.y)/2*innerHeight; y0=Math.min(y0,sy); y1=Math.max(y1,sy); x0=Math.min(x0,sx); x1=Math.max(x1,sx); }
  const H=huecoLibre(); return {h:y1-y0,w:x1-x0,frac_ventana:(y1-y0)/innerHeight,frac_hueco:(y1-y0)/(H.y1-H.y0),hueco:H,caja:[x0,y0,x1,y1]};
}

const MP={ver:-1,w:0,h:0,img:null,dpr:1,Rv:0};
function geomMapa(){ const Wd=LMP.w, Hd=LMP.h, X0=26, X1=Wd-6, Y0=6, Y1=Hd-15, Rv=Math.max(60,Math.ceil((RPED()+26)/20)*20), k=(X1-X0)/Rv; return {X0,X1,Y0,Y1,Rv,k,cy:(Y0+Y1)/2}; }

function construyeImagenMapa(){

/* ---- El tiempo de vuelo: lo que ve el sensor en el rayo que apunta al peatón ---- */
function pintaBt(){
  const x=abre(LBT), Wd=LBT.w, Hd=LBT.h; if(!RAD.ok) return;
  const cfg=RAD.cfg, esc=RAD.esc, al=CLIMAS[esc.clima].alfa, oF=ocultaF();
  const Rped=EST.modo==='guia'&&GUIA.paso==='predice'&&GUIA.r1?GUIA.r1.R:esc.R, Rv=Math.max(40,Math.ceil(Rped*1.3/10)*10), Tv=tVuelo(Rv);
  const Rs=Math.hypot(Rped,H_S-LIDAR.pedH/2), cosEl=Rped/Rs, Pr=potEco(cfg.P,esc.rho,cosEl,Rs,al,llenado(Rs)), aEco=Pr/SIGMA_N, tEco=tVuelo(Rs);
  const X0=30, X1=Wd-6, Y0=6, Y1=Hd-(oF?14:22), T=t=>X0+t/Tv*(X1-X0);
  const lo=-8, hi=46, Y=v=>Y1-(clamp(v,lo,hi)-lo)/(hi-lo)*(Y1-Y0);

  const dtU=nice(Tv*1e6,4)||1; for(let tu=0;tu<=Tv*1e6*0.999;tu+=dtU){ const px=T(tu*1e-6); raya(x,px,Y1,px,Y1+3,'#3d5470'); txt(x,fN(tu,dtU<1?1:0),px,Y1+12,'#8fa6bf',9.5,tu===0?'left':'center','500'); }
  txt(x,'µs',X1,Y1+12,'#8fa6bf',9.5,'right','600');
  if(!oF){ const dd=nice(Rv,4); for(let R=0;R<=Rv*0.999;R+=dd){ txt(x,String(R),T(tVuelo(R)),Hd-1,'rgba(155,240,200,0.85)',9.5,R===0?'left':'center','500'); } txt(x,'m',X1,Hd-1,'rgba(155,240,200,0.85)',9.5,'right','600'); }
  for(let v=0;v<=hi;v+=10){ raya(x,X0,Y(v),X1,Y(v),'rgba(143,179,200,0.08)'); txt(x,String(v),X0-4,Y(v)+3,'#8fa6bf',9.5,'right','500'); }
  txt(x,'dB',X0+3,Y0+9,'#cfe0f2',9.5,'left','700');
  const umbral=dB(K_UMBRAL); raya(x,X0,Y(umbral),X1,Y(umbral),'#FFB347',1.2,[4,3]); txt(x,'umbral',X1-3,Y(umbral)-3,'#FFB347',9.5,'right','700');

  const rng=mulberry32(RAD.semilla*7919+13), npx=Math.max(20,Math.floor(X1-X0)), dtp=Tv/npx;
  x.strokeStyle='#9BF0C8'; x.lineWidth=1.25; x.beginPath();

    const t=i*dtp, R=distDeTiempo(t); let sig=Math.abs(gauss(rng))*0.55+0.05*Math.abs(gauss(rng));
