      ' al año. Dentro de doce meses la precarga en frío habrá bajado de '+f1(pman(p.p0Fri),2)+
      ' a '+f1(pman(p.p0Der),2)+' bar y el aparato dará '+fin(p.valDer,4)+' '+p.unidad+
      ' en vez de '+fin(p.val,4)+' '+p.unidad+' ('+(p.okDeriva?'sigue cumpliendo':'ya no cumple')+').'];
  },
  botella(){
    const {p,c} = pickCtx();
    const bm = botellaMax(c.fk, p.tipo, p.v0);
    return ['Botellas de transferencia',
      'Montadas: '+(p.nbot?f1(p.nbot,0)+' × '+f1(V_BOT,0)+' L':'ninguna')+'. Amplían el GAS, no el sitio '+
      'donde meter aceite: el volumen total pasa a '+f1(p.vT,1)+' L pero el separador sólo puede barrer '+
      'los '+f1(p.v0,1)+' L del cuerpo. Con este modelo y esta faena el tope físico está en '+f1(bm,2)+
      ' L de botella; más allá el gas ya no cabe sin aplastar el separador contra el plato.'];
  },
  kit(){
    const {p} = pickCtx();
    return ['Kit de carga',
      'Botella de servicio, manómetro y latiguillo. Carga con una tolerancia de ±'+f1(TOL_KIT,0)+
      ' bar, y esa tolerancia se descuenta al juzgar la deriva de un año. La precarga se rotula '+
      'siempre a '+f1(T_REF,0)+' °C: aquí el kit dejaría '+f1(pman(p.p0Ref),2)+' bar en la etiqueta, '+
      'que en la máquina fría son '+f1(pman(p.p0Fri),2)+' bar por pura ley de Gay-Lussac.'];
  },
  bloque(){
    const {p} = pickCtx();
    return ['Bloque de seguridad',
      'Manómetro, válvula de descarga a tanque y llave de aislamiento: sin él no se puede desmontar un '+
      'acumulador cargado, que es de las maniobras más peligrosas de una sala de bombas (ISO 4413). '+
      'Cuesta '+f1(C_BLOQ,0)+' unidades y sólo aparece en la factura cuando hay botellas: '+
      (p.nbot?'este conjunto lo lleva':'este conjunto todavía no lo lleva')+'.'];
  },
  prensa(){
    const {p,c,F,d} = pickCtx();
    if(c.fk!=='emerg') return null;
    return ['Prensa de emergencia',
      'Cilindro de '+f1(F.dPis,0)+' mm con vástago de '+f1(F.dVas,0)+' mm: el área anular es '+
      f1(1e4*(d.area||0),2)+' cm², y subir la '+f1(F.carrera,0)+' mm de carrera con la bomba parada '+
      'exige '+fin(p.req,4)+' L. El acumulador tiene ahora mismo '+fin(p.val,4)+' L: '+
      (p.okFunc?'sube':'la prensa se queda a medio camino')+'.'];
  },
  bomba(){
    const {p,c,F,d} = pickCtx();
    if(c.fk!=='pulsa') return null;
    return ['Bomba de tres pistones',
      'Desplaza '+f1(F.dV,1)+' cm³ por pulso a '+f1(F.fPul,1)+' Hz. El acumulador se los traga con los '+
      fin(d.vg,3)+' L de gas que tiene a '+f1(F.pW,0)+' bar y el rizado queda en '+fin(p.val,4)+
      ' bar pico a pico, frente a los '+f1(F.rizMax,1)+' bar que admite la máquina: '+
      (p.okFunc?'vale':'no vale')+'. La estimación lineal de catálogo daría '+fin(d.lin,4)+' bar.'];
  },
  tuboAriete(){
    const {c,F,d} = pickCtx();
    if(c.fk!=='ariete') return null;
    return ['Tubería de impulsión',
      'DN '+f1(F.dTubo,0)+' con '+f1(F.eTubo,0)+' mm de pared y '+f1(F.lTubo,0)+' m de largo. Por ella '+
      'circulan '+f1(F.qLinea,0)+' L/min, o sea '+fin(d.vel,3)+' m/s. La onda de presión viaja a '+
      fin(d.cel,1)+' m/s —menos que en el aceite libre, porque el tubo se dilata— y tarda '+
      fin(1000*d.tReflejo,1)+' ms en ir hasta la bomba y volver.'];
  },
  valvAriete(){
    const {p,c,F,d} = pickCtx();
    if(c.fk!=='ariete') return null;
    return ['Válvula de cierre rápido',
      'Cierra en '+f1(1000*F.tCierre,0)+' ms, menos que los '+fin(1000*d.tReflejo,1)+
      ' ms de ida y vuelta de la onda: para la tubería es un cierre instantáneo y se lleva el golpe de '+
      'Joukowsky entero, '+fin(d.dpJ,2)+' bar, que sin acumulador llevarían la línea a '+fin(d.sinAcum,1)+
      ' bar. Con el acumulador el pico se queda en '+fin(p.val,2)+' bar frente al límite de '+
      f1(F.pLim,0)+' bar: '+(p.okFunc?'aguanta':'revienta el límite')+'.'];
  },
  amarre(){
    const {p,c,F,d} = pickCtx();
    if(c.fk==='termica')
      return ['Bloque de amarre sellado',
        'Sujeta la pieza con '+f1(F.vOil,1)+' L de aceite encerrados: ni entra ni sale nada. Al pasar de '+
        f1(F.tMin,0)+' a '+f1(F.tMax,0)+' °C el aceite se dilata '+fin(d.dvOil,4)+' L, y en un circuito '+
        'rígido eso son '+fin(d.sinAcum,0)+' bar. Con este acumulador la presión final se queda en '+
        fin(p.val,2)+' bar frente al límite de '+f1(F.pLim,0)+' bar: '+
        (p.okFunc?'el amarre sobrevive':'salta la válvula de seguridad o se rompe algo')+'.'];
    if(c.fk==='fugas')
      return ['Amarre con la bomba parada',
        'Las mordazas pierden '+f1(F.qFuga,0)+' cm³/min por los sellos, y el amarre tiene que aguantar '+
        f1(F.tReq,1)+' h sin que la línea baje de '+f1(F.p1,0)+' bar. Los '+fin(d.dv,4)+
        ' L que el acumulador entrega entre '+f1(F.p2,0)+' y '+f1(F.p1,0)+' bar dan para '+
        fin(p.val,3)+' h: '+(p.okFunc?'llega':'no llega')+'.'];
    return null;
  },
};

function boardClick(){
  showToast('<b>'+MODE_META[mode].nombre+'.</b> '+MODE_META[mode].mision);
}

// pickerFor NO filtra por visibilidad: hay que comprobarla a mano o el alumno
// acabaria pinchando la prensa mientras mira el golpe de ariete.
function visibleEnEscena(o){
  let n = o;
  while(n){ if(n.visible === false) return false; n = n.parent; }
  return true;
}
pickerFor(scene, S.camera, S.renderer.domElement, hit => {
  const o = hit && hit.object;
  if(!o) return;
  if(o === bmesh){ boardClick(); return; }
  if(!visibleEnEscena(o)) return;
  let n = o, k = null;
  while(n && !k){ k = n.userData && n.userData.key; n = n.parent; }
  if(!k || !PICK_INFO[k]) return;
  const inf = PICK_INFO[k]();
  if(!inf) return;
  synth.beep(760, 0.05, 0.05);
  showToast('<b>'+inf[0]+'</b> · '+inf[1]);
});

// ===================== 16. RECORRIDO GUIADO =====================
// Cinco bloques, uno por modo, con el mismo hilo: el gas manda. Ninguna cifra de
// los avisos esta escrita a mano; todas se leen del motor en el instante en que
// se lanza el aviso, asi que si cambia el catalogo cambia solo el guion.
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function runAuto(){
  if(autoRunning) return;
  autoRunning=true;
  const b=el('btnAuto'), rot=b.textContent;
  b.textContent='⏳ Recorriendo…';
  synth.init();synth.resume();clearDx();
  try{
    // --- 1. EL GAS: el mismo hierro entrega menos cuanto mas deprisa se trabaja
    setMode('gas');
    ST.fk='termica';ST.ak='v10';ST.prec=0.90;ST.nbot=0;ST.nGas=N_ISO;
    afterEdit();
    let G=gasInfo(ST.nGas);
    const dvLento=G.dv;
    showToast('Un acumulador no guarda aceite: guarda gas. Este cuerpo de '+f1(CUR.v0,0)+
      ' L precargado al '+f1(100*ST.prec,0)+' % de p₁ entrega <b>'+f1(G.dv,4)+' L</b> de aceite entre '+
      f1(FAENAS[ST.fk].p1,0)+' y '+f1(FAENAS[ST.fk].p2,0)+' bar… si el ciclo es lento (n = '+f1(N_ISO,1)+').');
    await sleep(4400);
    ST.nGas=N_ADI;afterEdit();G=gasInfo(ST.nGas);
    showToast('Mismo hierro, misma precarga y ciclo rápido: con n = '+f1(N_ADI,1)+
      ' el volumen útil cae a <b>'+f1(G.dv,4)+' L</b>, un '+pc1(1-G.dv/dvLento,2)+
      ' menos. Al comprimirse deprisa el nitrógeno se calienta y llega a '+f1(FAENAS[ST.fk].p2,0)+
      ' bar habiendo cedido menos volumen.');
    await sleep(4600);
    ST.nbot=NBOTS[NBOTS.length-1];afterEdit();G=gasInfo(ST.nGas);
    showToast('Con '+f1(ST.nbot,0)+' botellas hay '+f1(G.C.vT,0)+' L de nitrógeno instalado y el ΔV sube a '+
      f1(G.dv,4)+' L, pero en el punto alto el gas '+
      (G.est2==='ok'?'todavía respira':'queda '+EST_ROT[G.est2])+': por debajo de los '+f1(G.C.vBot,0)+
      ' L de las botellas ya no puede comprimirse más.');
    await sleep(4600);

    // --- 2. LA FAENA: la misma ley del gas contestando a cinco preguntas
    setMode('faena');
    const sE=solucion('emerg');
    ST.fk='emerg';ST.ak=sE.ak;ST.prec=sE.prec;ST.nbot=sE.nbot;afterEdit();
    showToast('<b>'+FAENAS.emerg.rot+'.</b> Aquí el criterio es volumen: el cilindro pide '+
      f1(CUR.req,4)+' L para su carrera y este montaje entrega '+f1(CUR.val,4)+' L, un '+
      pc1(CUR.margen,1)+' de margen.');
    await sleep(4200);
    const sA=solucion('ariete');
    ST.fk='ariete';ST.ak=sA.ak;ST.prec=sA.prec;ST.nbot=sA.nbot;afterEdit();
    showToast('<b>'+FAENAS.ariete.rot+'.</b> Al cerrar la válvula, Joukowsky pone '+f1(CUR.det.dpJ,2)+
      ' bar sobre la línea: '+f1(CUR.det.sinAcum,1)+' bar sin acumulador, por encima del límite de '+
      f1(CUR.req,0)+'. Con esta vejiga de '+f1(CUR.v0,0)+' L el pico se queda en '+f1(CUR.val,2)+' bar.');
    await sleep(4600);
    const sP=solucion('pulsa');
    ST.fk='pulsa';ST.ak=sP.ak;ST.prec=sP.prec;ST.nbot=sP.nbot;afterEdit();
    showToast('<b>'+FAENAS.pulsa.rot+'.</b> Tercera pregunta a la misma ley: la membrana de '+
      f1(CUR.v0,3)+' L deja '+f1(CUR.val,3)+' bar pico a pico y la línea admite '+f1(CUR.req,1)+
      '. Volumen, presión o tiempo: siempre es p·Vⁿ.');
    await sleep(4400);

    // --- 3. LA PRECARGA: ventana cerrada por arriba y por abajo
    setMode('precarga');
    ST.fk='emerg';ST.ak='p5';ST.nbot=0;ST.prec=PRECARGAS[0];afterEdit();
    showToast('Mismo pistón de '+f1(CUR.v0,0)+' L y misma faena: ahora sólo se toca la precarga. Al '+
      f1(100*ST.prec,0)+' % el gas apenas tiene recorrido y entrega '+f1(CUR.val,4)+
      ' L cuando hacen falta '+f1(CUR.req,4)+'.');
    await sleep(4200);
    ST.prec=PRECARGAS[PRECARGAS.length-1];afterEdit();
    showToast('Al '+f1(100*ST.prec,0)+' % entrega más aceite ('+f1(CUR.val,4)+' L) pero a '+
      f1(FAENAS[ST.fk].tMax,0)+' °C la precarga se dilata hasta '+f1(pman(CUR.p0Cal),2)+
      ' bar y la válvula de plato aguanta '+f1(pman(CUR.platoLim),2)+': el separador la golpea.');
    await sleep(4600);
    const vent=PRECARGAS.filter(pr=>punto(ST.fk,ST.ak,pr,ST.nbot).valida);
    if(vent.length){
      ST.prec=vent[0];afterEdit();
      const jj=PRECARGAS.indexOf(vent[0])-1;
      const qq=jj>=0?punto(ST.fk,ST.ak,PRECARGAS[jj],ST.nbot):null;
      showToast('La ventana entera de este modelo es '+vent.map(v=>f1(100*v,0)+' %').join(' · ')+
        '. Por arriba manda el plato en caliente; por abajo, la relación de compresión y la fuga de un año'+
        (qq&&qq.okFunc&&!qq.okDeriva
          ? ': al '+f1(100*PRECARGAS[jj],0)+' % hoy daría '+f1(qq.val,4)+' L, pero dentro de un año sólo '+
            f1(qq.valDer,4)+' y ya no llega.'
          : '.'));
      await sleep(4800);
    }

    // --- 4. EL CATALOGO: cumplir la funcion no basta
    setMode('catalogo');
    ST.fk='emerg';ST.prec=0.80;ST.nbot=0;ST.ak='p5';afterEdit();
    const cat=ACUM_KEYS.map(k=>punto(ST.fk,k,ST.prec,ST.nbot));
    const conFunc=cat.filter(p=>p.okFunc), okC=cat.filter(p=>p.valida);
    showToast('Diecinueve modelos, la misma faena y la misma precarga del '+f1(100*ST.prec,0)+' %: '+
      f1(conFunc.length,0)+' dan el volumen que se pide, pero sólo <b>'+f1(okC.length,0)+
      '</b> pasan los siete criterios a la vez.');
    await sleep(4400);
    const caido=conFunc.find(p=>!p.valida);
    if(caido){
      ST.ak=caido.ak;afterEdit();
      showToast('<b>'+ACUM_ROT[caido.ak]+'</b> entrega '+f1(caido.val,3)+' L, más del doble de lo que se pide, '+
        'y aun así cae. '+retoExplain(caido,{fk:ST.fk}));
      await sleep(4800);
    }
    if(okC.length){
      const barato=okC.reduce((a,p)=>p.coste<a.coste?p:a,okC[0]);
      const tipos=[];okC.forEach(p=>{const t=TIPOS[p.tipo].rot.toLowerCase();if(tipos.indexOf(t)<0)tipos.push(t);});
      ST.ak=barato.ak;afterEdit();
      showToast('Los que aguantan los siete son de '+tipos.join(' y ')+
        ', y el más barato es <b>'+ACUM_ROT[barato.ak]+'</b> con '+f1(barato.coste,0)+
        ' u. El catálogo no se elige por volumen: se elige por el criterio que primero te tumba.');
      await sleep(4600);
    }

    // --- 5. EL RETO: mas gas no es mas aceite
    setMode('reto');
    RETO.cfg.fk='fugas';retoSolveBuild(true);afterEdit();
    const TOTAL=ACUM_KEYS.length*PRECARGAS.length*NBOTS.length;
    showToast('<b>Reto · '+FAENAS.fugas.rot+'.</b> De las '+f1(TOTAL,0)+
      ' combinaciones del banco, '+f1(RETO.nval,0)+' cumplen los siete criterios; sólo una es la más barata.');
    await sleep(4400);
    checkReto();
    await sleep(4000);
    const s=RETO.sol;
    if(s){
      RETO.ejes={acum:s.ak,prec:s.prec,nbot:NBOTS[NBOTS.length-1]};
      afterEdit();checkReto();
      await sleep(3600);
      showToast('Con '+f1(CUR.nbot,0)+' botellas hay '+f1(CUR.vT,0)+' L de nitrógeno instalado y la reserva es de '+
        f1(CUR.val,3)+' '+CUR.unidad+': el gas sólo puede bajar hasta los '+f1(CUR.vBot,0)+
        ' L de las botellas, así que más gas no es más aceite.');
      await sleep(4800);
      RETO.ejes={acum:s.ak,prec:s.prec,nbot:s.nbot};
      afterEdit();checkReto();
      await sleep(1400);
      showToast('Ahí está: '+ACUM_ROT[s.ak]+' al '+f1(100*s.prec,0)+' % con '+
        (s.nbot?f1(s.nbot,0)+' botella'+(s.nbot>1?'s':''):'ninguna botella')+' da '+f1(s.val,3)+' '+
        s.unidad+' frente a '+f1(s.req,1)+' que pide el turno, por '+f1(s.coste,0)+' u.');
      await sleep(4600);
    }
    answer(quizCorrectIndex());
  } finally {
    autoRunning=false;
    el('btnAuto').textContent=rot;
  }
}

// ===================== 17. ANIMACIÓN, EVENTOS Y ARRANQUE =====================
// El unico reloj del laboratorio. paso3D recalcula el estado instantaneo del gas
// (no lo interpola: vuelve a resolver p·V^n en cada fotograma) y de ahi salen el
// nivel de aceite, el separador, los manometros y la faena.
S.setAnimate(dt=>{
  animT+=dt;
  paso3D(animT);
});

MODES.forEach(m=>{ el('m_'+m).onclick=()=>{ if(!autoRunning) setMode(m); }; });
el('btnAuto').onclick=()=>{ if(!autoRunning) runAuto(); };
el('btnNew').onclick=()=>{ if(autoRunning) return; newSignal(); };
el('btnCheck').onclick=()=>{ if(autoRunning) return; checkReto(); };
const soundBtn=el('soundBtn');
if(soundBtn){ soundBtn.onclick=()=>{ synth.toggle(); soundBtn.textContent=synth.isOn()?'🔊':'🔇'; }; }
document.addEventListener('pointerdown',()=>{ synth.init(); synth.resume(); },{once:true});

retoSolveBuild(true);
computa();
refrescaHW();
S.start();
setMode('gas');

// ===================== 18. PUENTE DE PRUEBAS =====================
// Todo lo que necesita un navegador de pruebas para reproducir el laboratorio sin
// tocar el DOM: el motor entero, el estado y los mismos setters que usan los
// botones. Si una cifra del panel no sale de aqui, es que esta escrita a mano.
window.__labDebug={
  // --- modos
  mode:()=>mode, setMode, modes:()=>MODES.slice(),
  // --- constantes del dominio
  P_ATM, T0K, T_REF, N_ISO, N_POL, N_ADI, K_PLATO, PERM_ANUAL, TOL_KIT,
  RHO_OIL, K_OIL, BETA_OIL, E_ACERO, V_BOT, C_BOT, C_BLOQ,
  // --- catalogo y faenas
  TIPOS, TIPO_KEYS, ACUM, ACUM_KEYS, ACUM_ROT, PRECARGAS, NBOTS,
  FAENAS, FAENA_KEYS, FAENA_ABR, CRIT, CRIT_ROT, CRIT_POR, EJES, EST_ROT,
  // --- motor
  kelvin, pabs, pman, p0Efect, vGasLibre, vGasReal, estadoGas, deltaV,
  celeridad, joukowsky, conjunto, funcion, punto, barrido, validas, mejor,
  solucion, empates, bandaMax, bandaMaxT, botellaMax,
  presionEntrega, presionRizado, presionTermicaEn, caudalPico,
  // --- estado vivo
  st:()=>({...ST}), cur:()=>CUR, hw:()=>({...hw}),
  gasInfo:n=>gasInfo(n), cfg:()=>cfgDe(mode), ventanaRot,
  // --- setters equivalentes a los botones
  setFaena:v=>{ST.fk=v;afterEdit();},
  setAcum:v=>{ST.ak=v;afterEdit();},
  setPrec:v=>{ST.prec=Number(v);afterEdit();},
  setNbot:v=>{ST.nbot=Number(v);afterEdit();},
  setN:v=>{ST.nGas=Number(v);afterEdit();},
  newSignal,
  // --- reto
  reto:()=>({cfg:{...RETO.cfg},ejes:{...RETO.ejes},sol:RETO.sol,nval:RETO.nval,
             resuelto:RETO.resuelto,msg:RETO.msg,pistas:{...RETO.pistas}}),
  setRetoFaena:v=>{RETO.cfg.fk=v;retoSolveBuild(true);afterEdit();},
  setRetoEje:(eje,v)=>{RETO.ejes[eje]=(eje==='acum'?v:Number(v));RETO.msg='';RETO.resuelto=false;afterEdit();},
  check:()=>checkReto(), pista:()=>pista(), FUNC_REQ,
  solved:()=>solved, retoSolveBuild,
  // --- cuestionario
  quizCorrectIndex, answer, quiz:()=>QUIZ[mode], qorden:()=>QORD.slice(),
  // --- etiquetas de seleccion
  pickKeys:()=>Object.keys(PICK_INFO), pick:k=>(PICK_INFO[k]?PICK_INFO[k]():null),
  // --- formato y recorrido
  f1, pc1, NBSP, toast:()=>el('toast').textContent,
  runAuto, autoRunning:()=>autoRunning,
};

// __END__
