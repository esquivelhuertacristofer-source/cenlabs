<style>
  :root{
    --bg:#08201C;--panel:rgba(9,26,23,.86);--line:#1E3A34;--ink:#EAF4F1;
    --dim:#8FB3AC;--accent:#2A9D8F;--accent2:#4FD1C5;--hv:#FFB703;--good:#34d399;--bad:#f4475e;

  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(10,13,18,.92),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

  .badge{position:fixed;top:16px;right:20px;z-index:20;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,209,102,.12);color:var(--hv);border:1px solid rgba(255,209,102,.35);padding:6px 12px;border-radius:20px}

  .hud{position:fixed;top:70px;left:18px;z-index:15;max-width:330px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-height:calc(100vh - 150px);overflow-y:auto}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .hud h2{font-size:19px;line-height:1.15;margin-bottom:9px}
  .hud p{font-size:13px;line-height:1.55;color:var(--dim);margin-bottom:10px}
  .hud .formula{font-family:var(--mono);color:var(--accent2);text-align:center;font-size:12.5px;margin:8px 0;padding:8px;background:rgba(0,0,0,.25);border-radius:8px;line-height:1.5}
  .hud .src{font-size:10.5px;color:#7a8894;font-style:italic;margin-top:4px;line-height:1.5}
  .legend{display:flex;flex-direction:column;gap:6px;margin:12px 0;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:10px}
  .legend .li{display:flex;align-items:center;gap:8px;font-size:11px;color:#c4d0da}
  .legend .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .fid{margin:10px 0 2px;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:10px;border:1px solid rgba(79,209,197,.18)}
  .fid .ft{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);margin-bottom:6px}
  .fid .fl{font-size:11px;color:#c4d0da;line-height:1.5;margin-bottom:5px}
  .fid .fl b{color:var(--ink)}
  .fid .fl.no b{color:var(--hv)}

  .panel{position:fixed;top:70px;right:18px;z-index:15;width:262px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:16px;max-height:calc(100vh - 150px);overflow-y:auto}
  .panel h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:2px 0 10px}

  .gl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .gl b{color:var(--accent2)}
  .gl b.good{color:var(--good)}.gl b.warn{color:var(--hv)}.gl b.bad{color:var(--bad)}
  .modebar{display:flex;gap:5px;margin-bottom:8px}
  .modebar .b{flex:1;padding:8px 4px;font-size:11px}
  .btns{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .b{font-family:system-ui;font-size:12.5px;padding:10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#1b242f;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#202c38}
  .b.on{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:bold}
  .b.primary{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:bold}
  .b.auto{border-color:var(--hv);color:var(--hv);background:rgba(255,183,3,.10);font-weight:bold}
  .b.auto:hover{background:rgba(255,183,3,.18);border-color:var(--hv)}
  .b.auto:disabled{opacity:.6;cursor:default}
  .b.dx{text-align:left;font-size:12px}
  .b.dx.right{background:rgba(52,211,153,.18);border-color:var(--good);color:var(--good);font-weight:bold}
  .b.dx.wrong{background:rgba(244,71,94,.15);border-color:var(--bad);color:var(--bad)}
  .console{font-family:var(--mono);font-size:11px;line-height:1.55;color:#c4d0da;background:rgba(0,0,0,.28);border-radius:9px;padding:10px 12px;margin-bottom:8px;min-height:56px}

  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(18,24,32,.95);border:1px solid var(--accent);padding:10px 20px;border-radius:40px;font-family:var(--mono);font-size:12px;opacity:0;transition:.3s;pointer-events:none;max-width:80vw;text-align:center}
  .toast.show{opacity:1}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}
  .soundBtn:hover{transform:scale(1.08)}
  .inspectHint{position:fixed;bottom:18px;right:18px;z-index:14;font-family:var(--mono);font-size:10px;color:var(--accent2);background:var(--panel);padding:7px 12px;border-radius:9px;border:1px solid var(--line)}

  @media(max-width:820px){
    .hud,.panel{position:fixed;left:8px;right:8px;top:auto;bottom:8px;max-width:none;width:auto;max-height:42vh;overflow-y:auto}
    .hud{bottom:calc(8px + 42vh + 8px)}
    .hint,.inspectHint{display:none}
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
  t.generateMipmaps=false; t.minFilter=THREE.LinearFilter; t.anisotropy=1; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.14, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;
    }
    if(hook)hook(dt,t); controls.update();
    if(bokeh) bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);
    composer.render(); }
  function start(){ if(!raf)loop(); }
  function stop(){ cancelAnimationFrame(raf); raf=null; window.removeEventListener('resize',resize); }

  return { THREE, renderer, scene, camera, controls, composer, bloom,
    setAnimate:fn=>hook=fn, start, stop, resize, clock,
    flyTo:(v)=>{ controls.target.copy(v); }, moveTo, setCinematicIdle };
}

function roundedBox(w,h,d,mat,rf=0.08){
  const r=Math.min(w,h,d)*rf;
  const m=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,4,r),mat);

}
function pickerFor(scene,camera,dom,onHit){
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(); let down=null;
  dom.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
  dom.addEventListener('pointerup',e=>{
    if(!down)return; const moved=Math.abs(e.clientX-down[0])+Math.abs(e.clientY-down[1])>6; down=null;
    if(moved)return;
    const r=dom.getBoundingClientRect();
    mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(mouse,camera);
    const hits=ray.intersectObjects(scene.children,true);
    onHit(hits[0]||null);
  });
}

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

// Fisica sellada del acumulador hidroneumatico. El gas es N2 IDEAL politropico.
// Presiones ABSOLUTAS en bar y volumenes en litros; solo los balances de energia
// (golpe de ariete) y de dilatacion (circuito sellado) bajan a SI.
// Comentarios en ASCII.
//
// 1) Ley politropica del gas encerrado:  p * V^n = constante.
//    n = 1,0 si al gas le da tiempo a cambiar calor con la pared (isotermo);
//    n = 1,4 si el ciclo es tan rapido que no hay tiempo (adiabatico, gas
//    diatomico); n = 1,2 es el caso intermedio de catalogo. n NO es una
//    propiedad del acumulador: es una propiedad de la VELOCIDAD del ciclo.
// 2) La precarga se ROTULA a 20 C y se corrige con Gay-Lussac a volumen
//    constante:  p0(T) = p0_ref * T/293,15.  En caliente sube (y golpea el
//    plato) y en frio baja (y se come el volumen util).
// 3) Volumen de gas recortado por los dos topes fisicos: no puede pasar del
//    volumen total del conjunto (acumulador vacio de aceite, con la vejiga
//    expandida del todo y aplastada contra la valvula de plato) ni bajar del
//    volumen de las botellas de transferencia (vejiga comprimida contra su
//    tope, sin mas sitio donde encogerse). Entre ambos el acumulador respira.
// 4) Celeridad de Korteweg en tubo elastico y sobrepresion de Joukowsky:
//      c = sqrt((K/rho) / (1 + K*D/(E*e)))       dp = rho * c * v
// 5) Absorcion politropica de la energia cinetica de la columna:
//      V_f^(1-n) = V_g^(1-n) + Ek*(n-1) / (p * V_g^n)
// 6) Circuito sellado que se calienta: la dilatacion del aceite se reparte
//    entre su propia compresibilidad y lo que el gas deja comprimirse. Se
//    resuelve por biseccion porque el gas tambien se calienta.

// ---------- utilidades ----------
function kelvin(c){ return c + T0K; }
function pabs(pm){ return pm + P_ATM; }
function pman(pa){ return pa - P_ATM; }

// Precarga rotulada a T_REF llevada a la temperatura tC (Gay-Lussac, volumen constante)
// El parentesis NO es decorativo: (p0*K)/K no devuelve p0 bit a bit, p0*(K/K) si.
function p0Efect(p0Ref, tC){ return p0Ref * (kelvin(tC) / kelvin(T_REF)); }

// Volumen de gas LIBRE (sin topes) a la presion p
function vGasLibre(vT, p0, p, n){ return vT * Math.pow(p0 / p, 1 / n); }
// Volumen de gas REAL: no puede pasar de vT (acumulador vacio) ni bajar de vBot (acumulador lleno)
function vGasReal(vT, vBot, p0, p, n){
  return Math.min(vT, Math.max(vBot, vGasLibre(vT, p0, p, n)));
}
function estadoGas(vT, vBot, p0, p, n){
  const v = vGasLibre(vT, p0, p, n);
  if(v >= vT) return 'vac';
  if(v <= vBot) return 'fondo';
  return 'ok';
}
// Aceite entregado al bajar de pAlta a pBaja
function deltaV(vT, vBot, p0, pBaja, pAlta, n){
  return vGasReal(vT, vBot, p0, pBaja, n) - vGasReal(vT, vBot, p0, pAlta, n);
}

// Celeridad de Korteweg en tubo elastico
function celeridad(dInt, esp){
  return Math.sqrt((K_OIL / RHO_OIL) / (1 + (K_OIL * dInt) / (E_ACERO * esp)));
}
function joukowsky(c, v){ return RHO_OIL * c * v; } // Pa

function conjunto(ak, nbot){
  const A = ACUM[ak];
  const vBot = nbot * V_BOT;
  return {
    v0:A.v0, vBot, vT:A.v0 + vBot,
    coste: A.coste + nbot * C_BOT + (nbot > 0 ? C_BLOQ : 0),
  };
}

// ---------- funcion de cada faena ----------
// p0 llega YA efectiva (corregida a la temperatura que corresponda).
function funcion(fk, ak, nbot, p0){
  const F = FAENAS[fk], A = ACUM[ak], T = TIPOS[A.tipo], C = conjunto(ak, nbot);
  const n = F.n;
  const p1a = pabs(F.p1) + T.dpFric;   // el piston pierde los primeros bares por friccion
  const p2a = pabs(F.p2) - T.dpFric;
  const base = { req:0, val:0, ok:false, margen:-1, unidad:F.unidad, rot:F.rotFun };

  if(fk === 'emerg'){
    const area = Math.PI * (F.dPis * F.dPis - F.dVas * F.dVas) / 4e6;   // m2 (anular)
    const req = area * (F.carrera / 1000) * 1000;                      // litros
    const val = deltaV(C.vT, C.vBot, p0, p1a, p2a, n);
    return { ...base, val, req, ok: val >= req, margen: val / req - 1, area,
             est1: estadoGas(C.vT, C.vBot, p0, p1a, n), est2: estadoGas(C.vT, C.vBot, p0, p2a, n) };
  }

  if(fk === 'pulsa'){
    const pW = pabs(F.pW), dv = F.dV / 1000;                           // cm3 -> L
    const vg = vGasLibre(C.vT, p0, pW, n);
    // Si el acumulador esta en un tope no puede absorber el pulso
    if(vg - dv / 2 <= C.vBot || vg + dv / 2 >= C.vT)
      return { ...base, val:Infinity, req:F.rizMax, vg, lin:Infinity, pMax:Infinity, pMin:0 };
    const pMax = pW * Math.pow(vg / (vg - dv / 2), n);
    const pMin = pW * Math.pow(vg / (vg + dv / 2), n);
    const val = pMax - pMin;
    const lin = n * dv * pW / vg;                                      // estimacion lineal de catalogo
    return { ...base, val, req:F.rizMax, ok: val <= F.rizMax, margen: F.rizMax / val - 1,
             vg, lin, pMax, pMin };
  }

  if(fk === 'ariete'){
    const dI = F.dTubo / 1000, area = Math.PI * dI * dI / 4;
    const vel = (F.qLinea / 60000) / area;
    const cel = celeridad(dI, F.eTubo / 1000);
    const dpJ = joukowsky(cel, vel) / 1e5;                             // bar
    const vLin = area * F.lTubo;                                       // m3 de aceite en la linea
    const Ek = 0.5 * RHO_OIL * vLin * vel * vel;                       // J
    const dpEner = vel * Math.sqrt(RHO_OIL * K_OIL) / 1e5;             // bar, metodo energetico sin tubo elastico
    const pLin = pabs(F.p1) * 1e5;                                     // Pa
    const est = estadoGas(C.vT, C.vBot, p0, pabs(F.p1), n);
    const vg = vGasReal(C.vT, C.vBot, p0, pabs(F.p1), n) / 1000;       // m3
    const vBotM3 = C.vBot / 1000;
    const com = { cel, vel, dpJ, Ek, vLin, dpEner, sinAcum: F.p1 + dpJ, tReflejo: 2 * F.lTubo / cel, est };
    if(est !== 'ok') return { ...base, val:Infinity, req:F.pLim, qPico:0, lin:Infinity, ...com };
    // Compresion politropica absorbiendo Ek: V^(1-n) = Vg^(1-n) + Ek(n-1)/(p*Vg^n)
    const vf0 = Math.pow(Math.pow(vg, 1 - n) + Ek * (n - 1) / (pLin * Math.pow(vg, n)), 1 / (1 - n));
    let vf, pPico;
    if(vf0 >= vBotM3){
      vf = vf0;
      pPico = pLin * Math.pow(vg / vf, n);
    } else {
      // El acumulador toca fondo: la energia que sobra la absorbe el aceite de la linea
      vf = vBotM3;
      const pFondo = pLin * Math.pow(vg / vf, n);
      const wAbs = (pLin * Math.pow(vg, n)) * (Math.pow(vf, 1 - n) - Math.pow(vg, 1 - n)) / (n - 1);
      const eRem = Math.max(0, Ek - wAbs);
      pPico = pFondo + Math.sqrt(2 * eRem * K_OIL / vLin);
    }
    const val = pPico / 1e5 - P_ATM;                                   // bar man
    const dV = (vg - vf) * 1000;                                       // litros
    const lin = F.p1 + n * dV * pabs(F.p1) / (vg * 1000);              // estimacion lineal, bar man
    return { ...base, val, req:F.pLim, ok: val <= F.pLim, margen: F.pLim / val - 1,
             qPico: dV / F.tCierre * 60, lin, dV, vg, vf, ...com };
  }

  if(fk === 'termica'){
    const vOil = F.vOil / 1000, dT = F.tMax - F.tMin;
    const pIni = pabs(F.p1) * 1e5, tIni = F.tMin, tFin = F.tMax;
    const dil = BETA_OIL * vOil * dT;                                  // m3 que se dilata el aceite
    const vT = C.vT / 1000, vBotM3 = C.vBot / 1000;
    // Con n = 1 y equilibrio termico permanente el gas sigue pV = mRT:
    // Vg(p,T) = vT * p0(tIni) * (T/TIni) / p, recortado entre vBot y vT.
    const p0Fin = p0 * kelvin(tFin) / kelvin(tIni);                    // bar, p0 efectiva en caliente
    const vgDe = (pPa, p0bar) => Math.min(vT, Math.max(vBotM3, vT * p0bar * 1e5 / pPa));
    const vg0 = vgDe(pIni, p0);
    // Balance de volumenes: lo que se dilata = lo que se comprime + lo que absorbe el acumulador
    const balance = (pPa) => dil - vOil * (pPa - pIni) / K_OIL - (vg0 - vgDe(pPa, p0Fin));
    let lo = pIni, hi = pIni + K_OIL * BETA_OIL * dT + 1e5;
    for(let i = 0; i < 200; i++){
      const mid = (lo + hi) / 2;
      if(balance(mid) > 0) lo = mid; else hi = mid;
    }
    const pFin = (lo + hi) / 2;
    const val = pFin / 1e5 - P_ATM;
    const sinAcum = (pIni + K_OIL * BETA_OIL * dT) / 1e5 - P_ATM;
    return { ...base, val, req:F.pLim, ok: val <= F.pLim, margen: F.pLim / val - 1,
             vg0: vg0 * 1000, sinAcum, dvOil: dil * 1000,
             est: estadoGas(C.vT, C.vBot, p0, pabs(F.p1), n) };
  }

  if(fk === 'fugas'){
    const dv = deltaV(C.vT, C.vBot, p0, p1a, p2a, n);
    const val = dv * 1000 / F.qFuga / 60;                              // horas
    return { ...base, val, req:F.tReq, ok: val >= F.tReq, margen: val / F.tReq - 1, dv,
             est1: estadoGas(C.vT, C.vBot, p0, p1a, n), est2: estadoGas(C.vT, C.vBot, p0, p2a, n) };
  }
  throw new Error('faena desconocida: ' + fk);
}

// ---------- lecturas continuas (para dibujar), derivadas de lo anterior ----------
// Presion en el puerto cuando el acumulador ya ha entregado vEnt litros partiendo de pAlta.
// Devuelve 0 cuando el gas ha llenado todo el cuerpo: ya no queda aceite que dar.
function presionEntrega(vT, vBot, p0, pAlta, n, vEnt){
  const vg2 = vGasReal(vT, vBot, p0, pAlta, n);
  const vg = vg2 + vEnt;
  if(vg >= vT) return 0;
  return p0 * Math.pow(vT / vg, n);
}
// Presion instantanea del rizado: s = -1 en el pico, s = +1 en el valle.
function presionRizado(vg, pW, n, dv, s){
  return pW * Math.pow(vg / (vg + s * dv / 2), n);
}
// Balance termico generalizado a una temperatura intermedia tC.
// En tC = tMax reproduce exactamente funcion('termica', ...).val
function presionTermicaEn(ak, nbot, p0, tC){
  const F = FAENAS.termica, C = conjunto(ak, nbot);
  const vOil = F.vOil / 1000, dT = tC - F.tMin;
  const pIni = pabs(F.p1) * 1e5, tIni = F.tMin;
  const dil = BETA_OIL * vOil * dT;
  const vT = C.vT / 1000, vBotM3 = C.vBot / 1000;
  const p0Fin = p0 * kelvin(tC) / kelvin(tIni);
  const vgDe = (pPa, p0bar) => Math.min(vT, Math.max(vBotM3, vT * p0bar * 1e5 / pPa));
  const vg0 = vgDe(pIni, p0);
  const balance = (pPa) => dil - vOil * (pPa - pIni) / K_OIL - (vg0 - vgDe(pPa, p0Fin));
  let lo = pIni, hi = pIni + K_OIL * BETA_OIL * dT + 1e5;
  for(let i = 0; i < 200; i++){
    const mid = (lo + hi) / 2;
    if(balance(mid) > 0) lo = mid; else hi = mid;
  }
  const pFin = (lo + hi) / 2;
  return pFin / 1e5 - P_ATM;
}

// Caudal pico que la faena exige al PUERTO del acumulador (L/min)
function caudalPico(fk, ak, nbot, p0){
  const F = FAENAS[fk];
  if(fk === 'emerg'){
    const area = Math.PI * (F.dPis * F.dPis - F.dVas * F.dVas) / 4e6;
    return area * (F.carrera / 1000) * 1000 / F.tDesc * 60;
  }
  if(fk === 'pulsa') return (F.dV / 1000) * F.fPul * 60;
  if(fk === 'ariete') return funcion(fk, ak, nbot, p0).qPico || 0;
  if(fk === 'termica') return funcion(fk, ak, nbot, p0).dvOil / F.tCalent * 60;
  if(fk === 'fugas') return F.qFuga / 1000;
  return 0;
}

// ---------- punto de trabajo completo ----------
function punto(fk, ak, prec, nbot){
  const F = FAENAS[fk], A = ACUM[ak], T = TIPOS[A.tipo], C = conjunto(ak, nbot);
  const p1a = pabs(F.p1), p2a = pabs(F.p2);
  const p0Ref = prec * p1a;                        // rotulo a 20 C
  const p0Cal = p0Efect(p0Ref, F.tMax);            // caliente: manda el plato
  const p0Fri = p0Efect(p0Ref, F.tMin);            // frio: mandan RC y la funcion
  const p0Der = p0Fri * (1 - PERM_ANUAL) - TOL_KIT;

  const fn = funcion(fk, ak, nbot, p0Fri);
  const fd = funcion(fk, ak, nbot, Math.max(p0Der, 0.1));
  const q = caudalPico(fk, ak, nbot, p0Fri);

  const okFunc = fn.ok;
  const okPlato = p0Cal <= K_PLATO * p1a + 1e-12;
  const okRC = p2a / p0Fri <= T.rc + 1e-12;
  const okPS = F.p2 <= A.ps + 1e-12;
  const okQ = q <= A.qmax + 1e-12;
  const okResp = T.tResp <= F.tRespReq + 1e-12;
  const okDeriva = fd.ok;

  const flags = { okFunc, okPlato, okRC, okPS, okQ, okResp, okDeriva };
  const fallos = CRIT.filter(c => !flags[c]);
  return {
    fk, ak, prec, nbot, tipo:A.tipo, v0:A.v0, vBot:C.vBot, vT:C.vT,
    coste:C.coste, ps:A.ps, qmax:A.qmax, rc:T.rc, tResp:T.tResp, dpFric:T.dpFric,
    p1a, p2a, p0Ref, p0Cal, p0Fri, p0Der,
    rcReal: p2a / p0Fri, platoLim: K_PLATO * p1a,
    val:fn.val, req:fn.req, margen:fn.margen, unidad:fn.unidad, rotFun:fn.rot,
    valDer:fd.val, q,
    ...flags, fallos, valida: fallos.length === 0, det:fn,
  };
}

function barrido(fk){
  const out = [];
  for(const ak of ACUM_KEYS) for(const prec of PRECARGAS) for(const nbot of NBOTS)
    out.push(punto(fk, ak, prec, nbot));
  return out;
}
function validas(fk){ return barrido(fk).filter(p => p.valida); }

// Orden lexicografico DECLARADO ANTES DE BARRER:
// 1) coste total  2) volumen de gas instalado (menor)  3) margen de la funcion (mayor)  4) precarga (menor)
function mejor(a, b){
  if(a.coste !== b.coste) return a.coste - b.coste;
  if(a.vT !== b.vT) return a.vT - b.vT;
  if(Math.abs(a.margen - b.margen) > 1e-12) return b.margen - a.margen;
  return a.p0Ref - b.p0Ref;
}
function solucion(fk){
  const v = validas(fk);
  return v.length ? v.slice().sort(mejor)[0] : null;
}
function empates(fk){
  const s = solucion(fk);
  return s ? validas(fk).filter(p => mejor(p, s) === 0) : [];
}

// Bandas de presion maximas admisibles
function bandaMax(tipoKey){ return K_PLATO * TIPOS[tipoKey].rc; }
function bandaMaxT(tipoKey, tMinC, tMaxC){
  return K_PLATO * TIPOS[tipoKey].rc * kelvin(tMinC) / kelvin(tMaxC);
}
// Tope de botella: hace falta (p0/p1)^(1/n) > vBot/vT  con p0 en su maximo
function botellaMax(fk, tipoKey, v0){
  const F = FAENAS[fk];
  const r = Math.pow(K_PLATO * kelvin(F.tMin) / kelvin(F.tMax), 1 / F.n);
  return v0 * r / (1 - r);   // litros de botella que aun dejan respirar al acumulador
}

const NBSP = ' ';   // espacio fino inseparable para los miles, nunca U+0020
function f1(x, d){
  if(!Number.isFinite(x)) return '—';
  const n = (d===undefined?2:d);
  const s = Math.abs(x).toFixed(n);
  const par = s.split('.');
  let ent = par[0], grp = '';
  while(ent.length>3){ grp = NBSP + ent.slice(-3) + grp; ent = ent.slice(0,-3); }
  ent = ent + grp;
  return (x<0?'−':'') + ent + (par[1]?','+par[1]:'');
}

    texto(CRIT_ROT[c],PX.x+34,y,p[c]?'#c8d3e2':BAD_HEX,13,'left','600');
    marca(PX.x+20,y-5,p[c]); y+=21;
  });
  return y;
}

// ---- vista GAS: la ley politrópica ----
function drawGas(){
  const c=cfgDe(mode), G=gasInfo(), C=G.C, F=G.F;
  title2('El nitrógeno es el resorte',ACUM_ROT[c.ak]+' · '+F.rot+' · p·Vⁿ = constante');
  const P={x:118,y:118,w:520,h:330};
  const ymax=pman(G.p2a)*1.25, xmax=C.vT*1.03;
  const A=ejes(P,0,xmax,0,ymax,'volumen de gas (L)','presión (bar)',
    v=>f1(v,1),v=>f1(v,0),6,5);
  if(C.vBot>0) banda(A,0,C.vBot,0,ymax,'rgba(255,107,107,0.10)');
  banda(A,G.vg2,G.vg1,pman(G.p1a),pman(G.p2a),'rgba(224,163,62,0.18)');
  const COLN={ '1':CIAN, '1.2':VIO, '1.4':NARANJA };
  [N_ISO,N_POL,N_ADI].forEach(n=>{
    const col=COLN[String(n)], sel=Math.abs(n-G.n)<1e-9;
    const vLow=Math.max(C.vBot,C.vT*Math.pow(G.p0/(ymax+P_ATM),1/n),xmax*0.012);
    const pts=[];
    for(let i=0;i<=180;i++){
      const v=vLow+(C.vT-vLow)*i/180;
      pts.push([A.X(v),A.Y(G.p0*Math.pow(C.vT/v,n)-P_ATM)]);
    }
    curva(pts,col,sel?3:1.6,sel?[]:[6,5]);
  });
  linea(A.X(0),A.Y(pman(G.p1a)),A.X(xmax),A.Y(pman(G.p1a)),'#5b6678',1,[5,5]);
  linea(A.X(0),A.Y(pman(G.p2a)),A.X(xmax),A.Y(pman(G.p2a)),'#5b6678',1,[5,5]);
  texto('p₁ = '+f1(F.p1,0)+' bar',A.X(xmax)-6,A.Y(pman(G.p1a))-8,'#8f9bb0',13,'right','700');
  texto('p₂ = '+f1(F.p2,0)+' bar',A.X(xmax)-6,A.Y(pman(G.p2a))-8,'#8f9bb0',13,'right','700');
  punteo(A.X(G.vg1),A.Y(pman(G.p1a)),AMBAR,6);
  punteo(A.X(G.vg2),A.Y(pman(G.p2a)),AMBAR,6);
  texto('ΔV = '+f1(G.dv,3)+' L',A.X((G.vg1+G.vg2)/2),A.Y(pman(G.p1a))+22,AMBAR,15,'center','800');
  if(C.vBot>0) texto('gas atrapado en las botellas',A.X(C.vBot/2),P.y+P.h-10,'rgba(255,107,107,0.75)',12,'center','700');
  leyenda(118,504,[['n = 1,0 isotermo',CIAN,[6,5]],['n = 1,2 politrópico',VIO,[6,5]],['n = 1,4 adiabático',NARANJA,[6,5]]]);
  const filas=[N_ISO,N_POL,N_ADI].map(n=>{
    const g=gasInfo(n);
    return [f1(n,1),f1(g.vg2,3)+' L',f1(g.vg1,3)+' L',f1(g.dv,3)+' L',
      (Math.abs(n-N_ISO)<1e-9?'—':pcm(g.dv/gasInfo(N_ISO).dv-1))];
  });
  tabla(118,556,['n','V gas a p₂','V gas a p₁','ΔV entregado','frente al isotermo'],
    filas,[70,140,140,140,150],(ri,ci)=>Math.abs([N_ISO,N_POL,N_ADI][ri]-G.n)<1e-9?AZUL:null);
  nota('El mismo acumulador entrega menos aceite cuanto más deprisa trabaja: el nitrógeno se calienta al '+
       'comprimirse y se enfría al expandirse, y ese calor que no da tiempo a salir se paga en volumen. '+
       'La banda ámbar es todo lo que este montaje puede dar entre p₁ y p₂.',676);
  rpanel(300);
  let y=PX.y+30;
  texto('LECTURA DEL GAS',PX.x+14,y,'#8ab4f8',13,'left','800'); y+=26;
  prow(y,'acumulador',ACUM_ROT[c.ak]); y+=23;
  prow(y,'volumen total V_T',f1(C.vT,2)+' L'); y+=23;
  prow(y,'volumen muerto V_bot',f1(C.vBot,2)+' L'); y+=23;
  prow(y,'p₀ rotulada a 20 °C',f1(pman(G.p0Ref),2)+' bar'); y+=23;
  prow(y,'p₀ efectiva a '+f1(F.tMin,0)+' °C',f1(pman(G.p0),2)+' bar'); y+=30;
  prow(y,'índice n en estudio',f1(G.n,1),AZUL); y+=23;
  prow(y,'V gas a p₂',f1(G.vg2,3)+' L'); y+=23;
  prow(y,'V gas a p₁',f1(G.vg1,3)+' L'); y+=23;
  prow(y,'ΔV entregado',f1(G.dv,3)+' L',AMBAR); y+=30;
  prow(y,'a p₁ el gas',EST_ROT[G.est1],G.est1==='ok'?OK_HEX:BAD_HEX); y+=23;
  prow(y,'a p₂ el gas',EST_ROT[G.est2],G.est2==='ok'?OK_HEX:BAD_HEX);
}

// ---- vista FAENA: qué le pide el circuito al acumulador ----
function avisoTope(P,txt){
  bx.fillStyle='rgba(255,107,107,0.10)'; bx.fillRect(P.x,P.y,P.w,P.h);
  wrapText(txt,P.x+24,P.y+P.h/2-10,P.w-48,22,'#ff9d9d',16);
}
function drawFaena(){
  const p=CUR, F=FAENAS[p.fk], d=p.det, n=F.n;
  const C=conjunto(p.ak,p.nbot);
  const pLo=p.p1a+p.dpFric, pHi=p.p2a-p.dpFric;
  title2(F.rot,ACUM_ROT[p.ak]+' · precarga '+f1(100*p.prec,0)+' % · n = '+f1(n,1));

  if(p.fk==='emerg'){
    const P={x:118,y:118,w:520,h:330};
    const xmax=Math.max(p.req,Number.isFinite(p.val)?p.val:0)*1.35;
    const ymax=pman(pHi)*1.18;
    const A=ejes(P,0,xmax,0,ymax,'aceite ya entregado (L)','presión del gas (bar)',
      v=>f1(v,1),v=>f1(v,0),6,5);
    banda(A,0,Math.min(p.req,xmax),0,ymax,'rgba(124,217,146,0.08)');
    const pts=[];
    for(let i=0;i<=200;i++){
      const v=xmax*i/200, pa=presionEntrega(C.vT,C.vBot,p.p0Fri,pHi,n,v);
      if(pa<=0) break;
      pts.push([A.X(v),A.Y(pa-P_ATM)]);
    }
    curva(pts,AMBAR,3);
    linea(A.X(0),A.Y(pman(pLo)),A.X(xmax),A.Y(pman(pLo)),BAD_HEX,1.6,[6,5]);
    texto('presión mínima útil '+f1(pman(pLo),1)+' bar',A.X(xmax)-6,A.Y(pman(pLo))-8,'#ff9d9d',13,'right','700');
    linea(A.X(p.req),A.Y(0),A.X(p.req),A.Y(ymax),VIO,1.8,[7,5]);
    texto('lo que pide el cilindro',A.X(p.req)+8,P.y+22,VIO,13,'left','700');
    if(Number.isFinite(p.val)&&p.val>0){
      linea(A.X(p.val),A.Y(0),A.X(p.val),A.Y(pman(pLo)),colOk(p.okFunc),2,[]);
      punteo(A.X(p.val),A.Y(pman(pLo)),colOk(p.okFunc),6);
      texto(f1(p.val,3)+' L',A.X(p.val)+8,A.Y(pman(pLo))+22,colOk(p.okFunc),14,'left','800');
    }
    leyenda(118,504,[['presión que queda en el gas',AMBAR],['piso útil',BAD_HEX,[6,5]],['lo exigido',VIO,[7,5]]]);
    nota('La corona del cilindro mide '+f1(d.area*1e4,2)+' cm² y ha de recorrer '+f1(F.carrera,0)+' mm: '+
         f1(p.req,4)+' L de aceite en '+f1(F.tDesc,1)+' s. El acumulador sólo entrega mientras su presión '+
         'siga por encima del piso útil; por debajo el aceite se queda dentro.',560);
    nota('Caudal pico exigido al puerto: '+f1(p.q,1)+' L/min (el acumulador admite '+f1(p.qmax,0)+' L/min).',628);
  }

  if(p.fk==='pulsa'){
    const P={x:118,y:118,w:520,h:330};
    const per=1/F.fPul, xmax=2*per*1000;
    if(!Number.isFinite(d.val)){
      ejes(P,0,xmax,F.p1,F.p2,'tiempo (ms)','presión (bar)',v=>f1(v,1),v=>f1(v,0),6,5);
      avisoTope(P,'Con esta precarga el gas está en un tope a '+f1(F.pW,0)+' bar: o aplastado contra el plato '+
        'o llenando todo el cuerpo. Un acumulador en un tope no es un resorte, es un tapón: no absorbe nada del pulso.');
    } else {
      const cen=F.pW, semi=Math.max(d.val,F.rizMax)*0.85+0.4;
      const ymin=cen-semi, ymax=cen+semi;
      const A=ejes(P,0,xmax,ymin,ymax,'tiempo (ms)','presión en la línea (bar)',
        v=>f1(v,1),v=>f1(v,2),6,6);
      banda(A,0,xmax,cen-F.rizMax/2,cen+F.rizMax/2,'rgba(124,217,146,0.10)');
      texto('banda tolerada '+f1(F.rizMax,1)+' bar pico a pico',A.X(xmax)-8,A.Y(cen+F.rizMax/2)-8,'rgba(124,217,146,0.85)',12,'right','700');
      const pts=[];
      for(let i=0;i<=300;i++){
        const t=xmax*i/300, s=Math.sin(2*Math.PI*F.fPul*t/1000);
        pts.push([A.X(t),A.Y(presionRizado(d.vg,pabs(F.pW),n,F.dV/1000,s)-P_ATM)]);
      }
      curva(pts,CIAN,3);
      linea(A.X(0),A.Y(pman(d.pMax)),A.X(xmax),A.Y(pman(d.pMax)),colOk(p.okFunc),1.4,[5,5]);
      linea(A.X(0),A.Y(pman(d.pMin)),A.X(xmax),A.Y(pman(d.pMin)),colOk(p.okFunc),1.4,[5,5]);
      texto('rizado real '+f1(d.val,3)+' bar',A.X(xmax)-8,A.Y(pman(d.pMax))-8,colOk(p.okFunc),14,'right','800');
      texto('estimación lineal de catálogo '+f1(d.lin,3)+' bar',A.X(0)+10,A.Y(ymin)-10,'#8f9bb0',12,'left','600');
      leyenda(118,504,[['presión instantánea',CIAN],['pico y valle',colOk(p.okFunc),[5,5]]]);
      nota('La bomba de tres pistones desplaza '+f1(F.dV,1)+' cm³ por pulso a '+f1(F.fPul,1)+' Hz. El acumulador '+
           'los absorbe con el gas que tiene a '+f1(F.pW,0)+' bar: '+f1(d.vg,3)+' L. La curva pVⁿ no es simétrica: '+
           'comprimir cuesta más que expandir, y el pico se sale un '+
           f1(100*((pman(d.pMax)-F.pW)/(F.pW-pman(d.pMin))-1),2)+' % más que el valle. Por eso la fórmula lineal '+
           'de catálogo ('+f1(d.lin,3)+' bar) se queda por debajo del rizado real ('+f1(d.val,3)+' bar).',560);
      nota('Un pulso dura '+f1(1000*per,2)+' ms; el separador de este acumulador responde en '+
           f1(1000*p.tResp,1)+' ms y la faena exige '+f1(1000*F.tRespReq,0)+' ms.',652);
    }
  }

  if(p.fk==='ariete'){
    const ymax=Math.max(d.sinAcum,F.pLim)*1.10;
    const barras=[
      ['presión de régimen',F.p1,GRIS],
      ['pico CON acumulador',p.val,colOk(p.okFunc)],
      ['pico SIN acumulador',d.sinAcum,BAD_HEX],
      ['límite de la instalación',F.pLim,VIO],
    ];
    let yy=136;
    barras.forEach(b=>{
      const v=Number.isFinite(b[1])?b[1]:ymax;
      texto(b[0],118,yy-6,'#a9b6c8',14,'left','700');
      hbar(118,yy,520,20,v/ymax,b[2]);
      texto(Number.isFinite(b[1])?f1(b[1],2)+' bar':'sin control',648,yy+16,b[2],15,'left','800');
      yy+=58;
    });
    linea(118+520*F.pLim/ymax,120,118+520*F.pLim/ymax,yy-40,VIO,1.6,[6,5]);
    const P={x:118,y:400,w:520,h:210};
    if(Number.isFinite(p.val)&&d.vf){
      const v1=d.vg*1000, v2=d.vf*1000;
      const A=ejes(P,v2*0.96,v1*1.02,F.p1*0.98,ymax,'volumen de gas (L)','presión (bar)',
        v=>f1(v,3),v=>f1(v,0),5,4);
      const pts=[];
      for(let i=0;i<=160;i++){
        const v=v2+(v1-v2)*i/160;
        pts.push([A.X(v),A.Y(pabs(F.p1)*Math.pow(v1/v,n)-P_ATM)]);
      }
      curva(pts,NARANJA,3);
      const pFondo=pabs(F.p1)*Math.pow(v1/v2,n)-P_ATM;
      if(Math.abs(pFondo-p.val)>1e-9){
        linea(A.X(v2),A.Y(pFondo),A.X(v2),A.Y(p.val),BAD_HEX,3,[5,4]);
        texto('el acumulador toca fondo: el resto lo absorbe el aceite',A.X(v2)+10,A.Y(p.val)-8,'#ff9d9d',12,'left','700');
      }
      punteo(A.X(v1),A.Y(F.p1),GRIS,6);
      punteo(A.X(v2),A.Y(p.val),colOk(p.okFunc),6);
      texto('el gas se comprime de '+f1(v1,3)+' a '+f1(v2,3)+' L',A.X(v1),A.Y(F.p1)-14,'#8f9bb0',13,'right','700');
    } else {
      ejes(P,0,1,0,1,'volumen de gas (L)','presión (bar)',v=>f1(v,2),v=>f1(v,0),5,4);
      avisoTope(P,'Con esta precarga el gas no respira a '+f1(F.p1,0)+' bar, así que no hay nada que comprimir: '+
        'el golpe llega entero a la instalación.');
    }
    nota('El aceite corre a '+f1(d.vel,3)+' m/s por un tubo de '+f1(F.dTubo,0)+'×'+f1(F.eTubo,0)+' mm. '+
         'La onda viaja a '+f1(d.cel,0)+' m/s (Korteweg: el tubo elástico la frena frente a los '+
         f1(Math.sqrt(K_OIL/RHO_OIL),0)+' m/s del aceite libre) y tarda '+f1(1000*d.tReflejo,1)+' ms en ir y volver, '+
         'mientras la válvula cierra en '+f1(1000*F.tCierre,0)+' ms: por eso el golpe se desarrolla entero.',640);
    nota('Joukowsky Δp = ρ·c·v = '+f1(d.dpJ,2)+' bar; la energía cinética atrapada en la línea es '+
         f1(d.Ek,1)+' J y es lo que el gas tiene que tragar.',700);
  }

  if(p.fk==='termica'){
    const P={x:118,y:118,w:520,h:330};
    const ymax=Math.max(d.sinAcum,F.pLim)*1.06, ymin=F.p1*0.94;
    const A=ejes(P,F.tMin,F.tMax,ymin,ymax,'temperatura del aceite (°C)','presión (bar)',
      v=>f1(v,0),v=>f1(v,0),7,5);
    banda(A,F.tMin,F.tMax,ymin,F.pLim,'rgba(124,217,146,0.07)');
    const sin=[],con=[];
    for(let i=0;i<=120;i++){
      const t=F.tMin+(F.tMax-F.tMin)*i/120;
      sin.push([A.X(t),A.Y(F.p1+(d.sinAcum-F.p1)*(t-F.tMin)/(F.tMax-F.tMin))]);
      con.push([A.X(t),A.Y(presionTermicaEn(p.ak,p.nbot,p.p0Fri,t))]);
    }
    curva(sin,BAD_HEX,2.4,[7,5]);
    curva(con,CIAN,3);
    linea(A.X(F.tMin),A.Y(F.pLim),A.X(F.tMax),A.Y(F.pLim),VIO,1.8,[6,5]);
    texto('límite de la instalación '+f1(F.pLim,0)+' bar',A.X(F.tMax)-6,A.Y(F.pLim)-8,VIO,13,'right','700');
    punteo(A.X(F.tMax),A.Y(p.val),colOk(p.okFunc),6);
    texto(f1(p.val,2)+' bar',A.X(F.tMax)-6,A.Y(p.val)+22,colOk(p.okFunc),15,'right','800');
    texto(f1(d.sinAcum,0)+' bar',A.X(F.tMax)-6,A.Y(Math.min(d.sinAcum,ymax))+18,BAD_HEX,14,'right','800');
    leyenda(118,504,[['circuito sellado sin acumulador',BAD_HEX,[7,5]],['con acumulador',CIAN]]);
    nota('El aceite dilata β = '+f1(BETA_OIL*1e4,1)+'·10⁻⁴ K⁻¹ y comprime con K = '+f1(K_OIL/1e9,2)+' GPa. '+
         'Los '+f1(F.vOil,1)+' L atrapados crecen '+f1(d.dvOil*1000,2)+' cm³ al subir '+f1(F.tMax-F.tMin,0)+' °C. '+
         'Sin acumulador esos centímetros cúbicos sólo caben comprimiendo el propio aceite, y eso cuesta '+
         f1(d.sinAcum-F.p1,0)+' bar. El acumulador ofrece '+f1(d.vg0,3)+' L de gas donde meterlos.',560);
    nota('Aquí n = 1: el calentamiento dura '+f1(F.tCalent/60,0)+' min y el gas tiene tiempo de sobra para '+
         'ceder su calor. La misma precarga sube también con la temperatura (Gay-Lussac) y ayuda menos de lo que parece.',652);
  }

  if(p.fk==='fugas'){
    const P={x:118,y:118,w:520,h:330};
    const xmax=Math.max(F.tReq,Number.isFinite(p.val)?p.val:0)*1.30;
    const ymax=pman(pHi)*1.15;
    const A=ejes(P,0,xmax,0,ymax,'tiempo con la bomba parada (h)','presión del amarre (bar)',
      v=>f1(v,1),v=>f1(v,0),6,5);
    banda(A,0,Math.min(F.tReq,xmax),0,ymax,'rgba(255,107,107,0.08)');
    const pts=[];
    for(let i=0;i<=220;i++){
      const t=xmax*i/220, vEnt=F.qFuga*(t*60)/1000;
      const pa=presionEntrega(C.vT,C.vBot,p.p0Fri,pHi,n,vEnt);
      if(pa<=0) break;
      pts.push([A.X(t),A.Y(pa-P_ATM)]);
    }
    curva(pts,AMBAR,3);
    linea(A.X(0),A.Y(pman(pLo)),A.X(xmax),A.Y(pman(pLo)),BAD_HEX,1.6,[6,5]);
    texto('el amarre se suelta por debajo de '+f1(pman(pLo),1)+' bar',A.X(xmax)-6,A.Y(pman(pLo))-8,'#ff9d9d',13,'right','700');
    linea(A.X(F.tReq),A.Y(0),A.X(F.tReq),A.Y(ymax),VIO,1.8,[7,5]);
    texto('turno exigido '+f1(F.tReq,0)+' h',A.X(F.tReq)+8,P.y+22,VIO,13,'left','700');
    if(Number.isFinite(p.val)&&p.val>0){
      punteo(A.X(Math.min(p.val,xmax)),A.Y(pman(pLo)),colOk(p.okFunc),6);
      texto(f1(p.val,2)+' h',A.X(Math.min(p.val,xmax))+8,A.Y(pman(pLo))+22,colOk(p.okFunc),15,'left','800');
    }
    leyenda(118,504,[['presión del amarre',AMBAR],['piso útil',BAD_HEX,[6,5]],['turno exigido',VIO,[7,5]]]);
    nota('La fuga interna del circuito es de '+f1(F.qFuga,0)+' cm³/min. El acumulador entrega '+f1(d.dv,3)+' L '+
         'entre '+f1(F.p2,0)+' y '+f1(F.p1,0)+' bar, y eso es lo que dura el amarre. Aquí n = 1 porque la descarga '+
         'tarda horas: el gas se mantiene a la temperatura del taller.',560);
    nota('Añadir botellas de transferencia agranda el volumen de gas sin tocar el cuerpo del acumulador, '+
         'pero el aceite sólo cabe en el cuerpo: pasada cierta cifra el gas ya no puede empujar más.',628);
  }
  panelPunto(p);
}

// ---- vista PRECARGA: la ventana tiene dos lados ----
function drawPrecarga(){
  const c=cfgDe(mode), F=FAENAS[c.fk], p=CUR;
  title2('La ventana de precarga',ACUM_ROT[c.ak]+' · '+F.rot+' · barrido de p₀ a volumen y botellas fijos');
  const P={x:118,y:118,w:520,h:330};
  const NS=71, prMin=0.35, prMax=1.05, paso=(prMax-prMin)/(NS-1);
  const muestra=[];
  for(let i=0;i<NS;i++) muestra.push(punto(c.fk,c.ak,prMin+paso*i,c.nbot));
  const fin=muestra.map(q=>q.val).filter(Number.isFinite);
  const vMax=fin.length?Math.max.apply(null,fin):p.req;
  const vMin=fin.length?Math.min.apply(null,fin):p.req;
  const ymax=Math.min(Math.max(p.req*1.25,vMax),p.req*3);
  const ymin=Math.max(0,Math.min(p.req,vMin)*0.80);
  const A=ejes(P,prMin,prMax,ymin,ymax,'precarga rotulada a 20 °C (fracción de p₁)',
    p.rotFun+' ('+p.unidad+')',v=>f1(100*v,0)+' %',v=>f1(v,2),7,5);
  for(let i=0;i<NS-1;i++) if(muestra[i].valida&&muestra[i+1].valida)
    banda(A,muestra[i].prec,muestra[i+1].prec,ymin,ymax,'rgba(124,217,146,0.10)');
  const LANES=[['okPlato',BAD_HEX],['okRC',VIO],['okFunc',NARANJA],['okDeriva',WARN_HEX]];

// ===================== 7. GRUPO 3D =====================
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
function tuboEntre(a,b,r,mat){
  const dir=new THREE.Vector3().subVectors(b,a), len=dir.length();
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,Math.max(len,1e-4),12),mat);
  m.position.copy(a).addScaledVector(dir,0.5);
  m.quaternion.setFromUnitVectors(V3(0,1,0),dir.clone().normalize());
  return m;
}
function mkManometro(r,rotulo){
  const g=new THREE.Group();
  const caja=new THREE.Mesh(new THREE.CylinderGeometry(r,r,0.055,26),MAT.acero);
  caja.rotation.x=Math.PI/2; g.add(caja);
  const esf=new THREE.Mesh(new THREE.CircleGeometry(r*0.86,26),std('#101722',0.85,0.05));
  esf.position.z=0.030; g.add(esf);
  for(let i=0;i<=10;i++){
    const a=Math.PI*1.25-Math.PI*1.5*i/10;
    const t=new THREE.Mesh(new THREE.BoxGeometry(0.012,r*0.16,0.006),std('#9fb0c6',0.7,0.1));
    t.position.set(Math.cos(a)*r*0.70,Math.sin(a)*r*0.70,0.033);
    t.rotation.z=a-Math.PI/2; g.add(t);
  }
  const ag=new THREE.Mesh(new THREE.BoxGeometry(0.014,r*0.72,0.008),MAT.rojo);
  ag.geometry.translate(0,r*0.36,0); ag.position.z=0.036; g.add(ag);
  const cen=new THREE.Mesh(new THREE.CylinderGeometry(r*0.10,r*0.10,0.02,14),MAT.acero);
  cen.rotation.x=Math.PI/2; cen.position.z=0.040; g.add(cen);
  g.userData.aguja=ag; g.userData.rot=rotulo;
  return g;
}
function setManometro(g,frac){
  g.userData.aguja.rotation.z=Math.PI*0.75-Math.PI*1.5*clamp(frac,0,1);
}

// ===================== 8. ACTUALIZACIÓN 3D =====================
// Piezas que cambian de color: material PROPIO, nunca el compartido de MAT.
M3.plato.material   = MAT.oro.clone();
M3.pis.material     = MAT.piston.clone();
M3.mem.material     = MAT.vejiga.clone();
M3.vej.material     = MAT.vejiga.clone();
M3.termCal.material = MAT.rojo.clone();
M3.arOnda.material  = MAT.rojo.clone();
M3.fugGota.material = MAT.gota.clone();

const CICLO = 7.0;      // segundos que dura un ciclo completo de la maquina
const VIS_FPUL = 1.6;   // Hz de PANTALLA para el rizado: a 72,5 Hz reales no se veria nada
const T_CIERRE_VIS = 0.55;  // fraccion del ciclo en la que cierra la valvula del ariete

let vgAnt = null;

// Todo lo que la maquina 3D necesita saber del punto de trabajo actual.
function refrescaHW(){
  const p = CUR, F = FAENAS[p.fk];
  hw = {
    fk:p.fk, tipo:p.tipo, ak:p.ak, nbot:p.nbot,
    v0:p.v0, vBot:p.vBot, vT:p.vT,
    n: (mode === 'gas' ? ST.nGas : F.n),
    p0:p.p0Fri, p0Ref:p.p0Ref, p1a:p.p1a, p2a:p.p2a,
    dpFric:TIPOS[p.tipo].dpFric,
    fs: Math.max(pman(p.p2a) * 1.25, 1),
    valida:p.valida,
    p:p.p1a, pAce:pman(p.p1a), vg:p.vT, est:'ok',
    u:0, ex:0, temp:F.tMin, dir:0, cerrada:false, onda:-1,
  };
  vgAnt = null;
  aplica3D();
  animaFaena(0);
}

// Estado instantaneo del gas. Toda la fisica sale de las funciones SELLADAS del motor:
// aqui solo se elige que instante del ciclo se esta mirando.
function paso3D(t){
  if(!CUR) return;
  const F = FAENAS[hw.fk], d = CUR.det || {};
  const u = (t / CICLO) % 1;
  let s = 0.5 - 0.5 * Math.cos(2 * Math.PI * u);   // 0 = a p1 (poco aceite), 1 = a p2
  let p = hw.p1a + (hw.p2a - hw.p1a) * s;
  let vg = null, ex = s, temp = F.tMin, cerrada = false, onda = -1;

  if(mode === 'faena'){
    if(hw.fk === 'emerg'){
      // descarga rapida en el primer cuarto del ciclo, recarga lenta en el resto
      s = u < 0.25 ? 0.5 + 0.5 * Math.cos(Math.PI * u / 0.25)
                   : 0.5 - 0.5 * Math.cos(Math.PI * (u - 0.25) / 0.75);
      p = hw.p1a + (hw.p2a - hw.p1a) * s;
      ex = 1 - s;
    } else if(hw.fk === 'pulsa'){
      const sr = Math.sin(2 * Math.PI * VIS_FPUL * t);
      p = (Number.isFinite(d.vg) && d.vg > 0)
        ? presionRizado(d.vg, pabs(F.pW), F.n, F.dV / 1000, sr)
        : pabs(F.pW);
      ex = 0.5 - 0.5 * sr;
    } else if(hw.fk === 'ariete'){
      const pico = Number.isFinite(CUR.val) ? CUR.val : F.p1;
      if(u < T_CIERRE_VIS){ p = hw.p1a; ex = 0; }
      else {
        const w = (u - T_CIERRE_VIS) / (1 - T_CIERRE_VIS);
        const env = Math.max(0, Math.exp(-3.2 * w) * Math.cos(2 * Math.PI * 2.2 * w));
        p = pabs(F.p1 + (pico - F.p1) * env);
        cerrada = true; ex = env; onda = w;
      }
    } else if(hw.fk === 'termica'){
      temp = F.tMin + (F.tMax - F.tMin) * s;
      p = pabs(presionTermicaEn(CUR.ak, CUR.nbot, CUR.p0Fri, temp));
      vg = vGasReal(hw.vT, hw.vBot, p0Efect(CUR.p0Ref, temp), p, N_ISO);
      ex = s;
    } else if(hw.fk === 'fugas'){
      s = 1 - u;                                   // la fuga vacia el acumulador sin pausa
      p = hw.p1a + (hw.p2a - hw.p1a) * s;
      ex = u;
    }
  }
  if(vg === null) vg = vGasReal(hw.vT, hw.vBot, hw.p0, p, hw.n);

  hw.dir = (vgAnt === null || Math.abs(vg - vgAnt) < 1e-12) ? 0 : (vg > vgAnt ? -1 : 1);
  vgAnt = vg;
  hw.u = u; hw.ex = ex; hw.temp = temp; hw.cerrada = cerrada; hw.onda = onda;
  hw.p = p; hw.vg = vg;
  // El manometro del aceite no marca lo mismo que el del gas: la friccion del piston
  // se resta al descargar y se suma al cargar. En vejiga y membrana dpFric = 0.
  hw.pAce = pman(p) + hw.dir * hw.dpFric;
  hw.est = vg >= hw.vT - 1e-12 ? 'vac' : (vg <= hw.vBot + 1e-12 ? 'fondo' : 'ok');
  aplica3D();
  animaFaena(t);
}

function aplica3D(){
  const vgCu = clamp(hw.vg - hw.vBot, 0, hw.v0);
  const hOil = ACU_H * (hw.v0 - vgCu) / hw.v0;
  const hGas = ACU_H - hOil, yI = ACU_Y + hOil;
  M3.aceite.visible = hOil > 0.004;
  M3.aceite.scale.y = Math.max(hOil, 1e-3);
  M3.aceite.position.y = ACU_Y + hOil / 2;
  M3.gas.visible = hGas > 0.004;
  M3.gas.scale.y = Math.max(hGas, 1e-3);
  M3.gas.position.y = ACU_Y + ACU_H - hGas / 2;

  M3.pis.visible = hw.tipo === 'piston';  M3.pis.position.y = yI + 0.045;
  M3.mem.visible = hw.tipo === 'membrana'; M3.mem.position.y = yI;
  M3.vej.visible = hw.tipo === 'vejiga';
  const rv = Math.max(hGas / 2, 0.012);
  M3.vej.scale.set(ACU_R * 0.965, rv, ACU_R * 0.965);
  M3.vej.position.y = ACU_Y + ACU_H - rv;

  const cAl = hw.est === 'vac' ? BAD_HEX : (hw.est === 'fondo' ? WARN_HEX : null);
  [M3.pis, M3.mem, M3.vej].forEach(m => {
    m.material.emissive.set(cAl || '#000000');
    m.material.emissiveIntensity = cAl ? 0.85 : 0.0;
  });
  M3.plato.material.emissive.set(hw.est === 'vac' ? BAD_HEX : '#000000');
  M3.plato.material.emissiveIntensity = hw.est === 'vac' ? 0.95 : 0.0;

  gBot.forEach((g, i) => { g.visible = i < hw.nbot; });
  FAENA_KEYS.forEach(k => { gFaena[k].visible = (k === hw.fk); });

  setManometro(M3.manGas, pman(hw.p) / hw.fs);
  setManometro(M3.manAce, hw.pAce / hw.fs);
  setManometro(M3.manKit, pman(hw.p0Ref) / hw.fs);
}

function animaFaena(t){
  if(hw.fk === 'emerg'){
    const yTop = 2.02, rec = 0.62;
    const yPis = yTop - 0.05 - rec * hw.ex;
    M3.presPis.position.set(0, yPis, 0);
    const hAce = Math.max(yTop - (yPis + 0.045), 1e-3);
    M3.presCam.scale.y = hAce;
    M3.presCam.position.set(0, yTop - hAce / 2, 0);
    M3.presVas.position.set(0, yPis - 0.60, 0);
    M3.presPlat.position.set(0, yPis - 1.19, 0);
  } else if(hw.fk === 'pulsa'){
    const ang = 2 * Math.PI * VIS_FPUL * t;
    M3.pulsDisc.rotation.y = ang;
    M3.pulsPis.forEach((m, i) => {
      m.position.x = -0.30 + 0.055 * Math.sin(ang + i * 2 * Math.PI / 3);
    });
  } else if(hw.fk === 'ariete'){
    M3.arPal.rotation.z = hw.cerrada ? 0 : 1.25;
    M3.arValv.scale.set(hw.cerrada ? 1 : 0.45, 1, hw.cerrada ? 1 : 0.45);
    const viva = hw.cerrada && hw.onda >= 0 && hw.onda < 0.55;
    M3.arOnda.visible = viva;
    if(viva){
      const w = (hw.onda / 0.55) * 2;                  // ida y vuelta por el tubo
      const z = w < 1 ? 2.30 - 2.30 * w : 2.30 * (w - 1);   // el tubo corre en z
      M3.arOnda.position.set(-0.30, 0.30, z);
      const e = 1 - hw.onda / 0.55;
      M3.arOnda.scale.setScalar(0.7 + 0.8 * e);
      M3.arOnda.material.emissiveIntensity = 0.4 + 1.2 * e;
    }
  } else if(hw.fk === 'termica'){
    const F = FAENAS.termica;
    const f = clamp((hw.temp - F.tMin) / (F.tMax - F.tMin), 0, 1);
    M3.termBloq.material.color.setRGB(0.35 + 0.55 * f, 0.38 - 0.14 * f, 0.44 - 0.24 * f);
    M3.termCal.material.emissiveIntensity = 0.25 + 1.35 * f;
    M3.termCal.scale.setScalar(1 + 0.03 * Math.sin(t * 3.1));
  } else if(hw.fk === 'fugas'){
    const g = (t * 1.2) % 1;
    M3.fugGota.visible = true;
    M3.fugGota.position.set(0.42, 1.00 - 0.72 * g * g, 0.30);
    M3.fugGota.scale.setScalar(0.85 + 0.35 * g);
    M3.fugMord.forEach((m, i) => { m.position.z = (i ? 0.26 : -0.26) + 0.004 * Math.sin(t * 2.2); });
  }
}

// Valores de un eje que aparecen en alguna configuracion optima (hay empates
// cuando dos montajes distintos cuestan lo mismo y ademas empatan en volumen,
// margen y precarga).
function ejeSolC(fk,eje){
  const campo=EJE_CAMPO[eje], out=[];
  empates(fk).forEach(p=>{ if(out.indexOf(p[campo])<0) out.push(p[campo]); });
  return out;
}
// Una pista destapa UN eje. No resuelve el reto: los tres ejes se juzgan juntos
// y acertar uno no garantiza que la combinacion cumpla los siete criterios.
function pista(){
  const eje=EJES.find(e=>!RETO.pistas[e]);
  if(!eje){showToast('💡 Ya has destapado los tres ejes. La combinación la tienes que cerrar tú.');return;}
  RETO.pistas[eje]=true;beep();
  const vals=ejeSolC(RETO.cfg.fk,eje).map(v=>EJE_VAL_ROT[eje](v)).join(' · ');
  showToast('💡 <b>'+EJE_ROT[eje]+'.</b> En el conjunto más barato aparece: '+
    (vals||'ningún valor: esta faena no tiene solución'));
  afterEdit();
}

// "Nuevo escenario": en el reto cambia de faena y rearma el montaje de partida;
// en los modos de estudio mueve el ensayo al siguiente caso que ensena algo, en
// vez de dejarlo donde estaba.
function newSignal(){
  if(mode==='gas'){
    const NS=[N_ISO,N_POL,N_ADI], i=NS.findIndex(n=>Math.abs(n-ST.nGas)<1e-9);
    ST.nGas=NS[(i+1)%NS.length];
    if(i+1>=NS.length){const j=FAENA_KEYS.indexOf(ST.fk);ST.fk=FAENA_KEYS[(j+1)%FAENA_KEYS.length];}
  }else if(mode==='faena'){
    const i=FAENA_KEYS.indexOf(ST.fk);ST.fk=FAENA_KEYS[(i+1)%FAENA_KEYS.length];
    const o=solucion(ST.fk);
    if(o){ST.ak=o.ak;ST.prec=o.prec;ST.nbot=o.nbot;}
  }else if(mode==='precarga'){
    const i=ACUM_KEYS.indexOf(ST.ak);ST.ak=ACUM_KEYS[(i+1)%ACUM_KEYS.length];
    if(i+1>=ACUM_KEYS.length){const j=FAENA_KEYS.indexOf(ST.fk);ST.fk=FAENA_KEYS[(j+1)%FAENA_KEYS.length];}
  }else if(mode==='catalogo'){
    const i=FAENA_KEYS.indexOf(ST.fk);ST.fk=FAENA_KEYS[(i+1)%FAENA_KEYS.length];
    const o=solucion(ST.fk);
    if(o){ST.prec=o.prec;ST.nbot=o.nbot;}
  }else{
    const i=FAENA_KEYS.indexOf(RETO.cfg.fk);RETO.cfg.fk=FAENA_KEYS[(i+1)%FAENA_KEYS.length];
    retoSolveBuild(true);
  }
  RETO.resuelto=false;solved=false;RETO.msg='';
  computa();refrescaHW();
  buildControls();updateScenarioInfo();
  clearDx();buildQuiz();refreshQuestion();
  if(mode==='reto')updateRetoSpec();
  refreshAll();
  showToast('🔀 <b>Escenario nuevo.</b> '+MODE_META[mode].mision);
}

// Precargas del kit que dejan valido el conjunto. Se enumeran una a una en vez de
// dar un intervalo: la ventana no tiene por que ser un tramo seguido.
function ventanaRot(fk,ak,nbot){
  const ok=PRECARGAS.filter(p=>punto(fk,ak,p,nbot).valida);
  if(!ok.length) return 'ninguna precarga vale';
  return ok.map(p=>f1(100*p,0)).join(' · ')+' % de p₁';
}

// Cada faena tiene su propia moraleja numerica, y sale del punto que hay montado.
function explicaFaena(c,r){
  const F=FAENAS[c.fk], d=r.det;
  if(c.fk==='emerg')
    return '> El cilindro anular de Ø'+f1(F.dPis,0)+'/Ø'+f1(F.dVas,0)+' con '+f1(F.carrera,0)+
      ' mm de carrera pide '+f1(r.req,4)+' L, y hay que darlos entre '+f1(F.p2,0)+' y '+f1(F.p1,0)+
      ' bar: el aceite que queda por debajo de '+f1(F.p1,0)+' bar no sirve, la prensa ya no se mueve.';
  if(c.fk==='pulsa')
    return '> El catálogo estima el rizado como n·ΔV·p_W/V_g = '+
      (Number.isFinite(d.lin)?f1(d.lin,4):'—')+' bar y la ley politrópica completa da '+
      (Number.isFinite(r.val)?f1(r.val,4):'—')+' bar: mientras los '+f1(F.dV,1)+
      ' cm³ del pulso sean pequeños frente a los '+
      (Number.isFinite(d.vg)?f1(1000*d.vg,1):'—')+' cm³ de gas, la curva pVⁿ es casi una recta y '+
      'las dos cuentas coinciden. Quien decide el rizado es V_g, y V_g lo fija la precarga.';
  if(c.fk==='ariete')
    return '> La celeridad de Korteweg es '+f1(d.cel,1)+' m/s con '+f1(d.vel,3)+
      ' m/s de aceite: Joukowsky pide '+f1(d.dpJ,2)+' bar de golpe, o sea '+f1(d.sinAcum,1)+
      ' bar sin acumulador. El acumulador absorbe '+f1(d.Ek,1)+' J y lo deja en '+
      (Number.isFinite(r.val)?f1(r.val,2):'—')+' bar.';
  if(c.fk==='termica')
    return '> El aceite se dilata '+f1(d.dvOil,4)+' L al subir de '+f1(F.tMin,0)+' a '+f1(F.tMax,0)+
      ' °C. Sin sitio donde meterlos el circuito llegaría a '+f1(d.sinAcum,0)+
      ' bar: la rigidez del aceite (K = 1,5 GPa) no perdona.';
  return '> Con la bomba parada la fuga de '+f1(F.qFuga,0)+' cm³/min se come el ΔV: '+
    f1(d.dv,4)+' L dan '+(Number.isFinite(r.val)?f1(r.val,3):'—')+' h de amarre, y hacen falta '+
    f1(F.tReq,1)+' h.';
}

// ===================== 13. RETO =====================
// El reto no compara contra una respuesta escrita a mano: barre las 399
// configuraciones de la faena (19 modelos x 7 precargas x 3 montajes de botella),
// se queda con las validas y ordena por el criterio lexicografico declarado en
// el motor. La respuesta sale de ahi, no de una tabla.
const CRIT_POR={
  okFunc:   'el acumulador tiene que dar lo que la faena pide, hoy y con el aceite frío',
  okPlato:  'al calentarse el gas se expande; si p₀ pasa de 0,90·p₁ el separador se echa sobre la válvula de plato y la golpea en cada ciclo',
  okRC:     'cada separador aguanta una relación p₂/p₀ distinta: 4 la vejiga, 8 la membrana, 10 el pistón',
  okPS:     'la presión de trabajo no puede pasar de la presión máxima admisible del cuerpo (Directiva 2014/68/UE)',
  okQ:      'el puerto de aceite tiene un caudal de paso máximo; por encima el separador se estrangula',
  okResp:   'la vejiga responde en 5 ms, la membrana en 15 y el pistón en 100: hay faenas que no esperan tanto',
  okDeriva: 'el nitrógeno permea un 3 % al año y el kit de carga tiene ±2 bar: tiene que seguir cumpliendo dentro de un año',
};
// Montaje de partida: lo mas barato y pequeno del catalogo, sin botellas y con la
// precarga mas baja. Es deliberadamente insuficiente, para que el alumno suba.
function startCfg(){ return { acum:'m008', prec:PRECARGAS[0], nbot:0 }; }

function retoSolveBuild(reset){
  const fk=RETO.cfg.fk;
  RETO.sol=solucion(fk);
  RETO.nval=validas(fk).length;
  if(reset){
    RETO.ejes=startCfg();
    RETO.pistas={};
    RETO.resuelto=false;
    RETO.msg='';
  }
}
function updateRetoSpec(){
  const fk=RETO.cfg.fk, F=FAENAS[fk];
  let h='<b>'+F.rot+'.</b> Monta el conjunto <b>válido más barato</b>. ';
  h+='Trabaja entre '+f1(F.p1,0)+' y '+f1(F.p2,0)+' bar, con n = '+f1(F.n,1)+' y de '+
     f1(F.tMin,0)+' a '+f1(F.tMax,0)+' °C. Tiene que '+
     (F.sentido==='ge'?'dar ':'quedarse por debajo de ')+'<b>'+
     (F.sentido==='ge'?'≥ ':'≤ ')+f1(FUNC_REQ(fk),3)+' '+F.unidad+'</b> de '+F.rotFun+
     ' y cumplir los siete criterios a la vez:';
  h+='<ul style="margin:6px 0 0 16px;padding:0">';
  CRIT.forEach(k=>{ h+='<li><b>'+CRIT_ROT[k]+'</b> — '+CRIT_POR[k]+'</li>'; });
  h+='</ul>';
  h+='<div style="margin-top:6px;color:var(--muted)">Empate de coste: gana el que menos gas instala; '+
     'si también empatan, el de más margen, y por último el de menor precarga.</div>';
  el('retoSpec').innerHTML=h;
}
// Lo que pide la faena no depende del acumulador salvo en el ariete y en el
// rizado, donde el requisito es un limite fijo. Se lee del motor, nunca a mano.
function FUNC_REQ(fk){ return punto(fk,ACUM_KEYS[0],PRECARGAS[0],0).req; }

// Explica por que la configuracion puesta no vale, eje por eje y con sus cifras.
function retoExplain(r,c){
  if(r.valida) return '';
  const F=FAENAS[c.fk];
  let p='Falla '+r.fallos.map(k=>CRIT_ROT[k]).join(', ')+'. ';
  if(!r.okPlato) p+='A '+f1(F.tMax,0)+' °C la precarga sube a '+f1(pman(r.p0Cal),2)+
    ' bar y el plato aguanta hasta '+f1(pman(r.platoLim),2)+': baja la precarga. ';
  else if(!r.okRC) p+='p₂/p₀ = '+f1(r.rcReal,2)+' y '+TIPOS[r.tipo].rot.toLowerCase()+
    ' sólo admite '+f1(r.rc,0)+': sube la precarga o cambia de separador. ';
  else if(!r.okPS) p+='La faena llega a '+f1(F.p2,0)+' bar y el cuerpo está timbrado a '+
    f1(r.ps,0)+': ese modelo no se puede montar aquí. ';
  else if(!r.okResp) p+='El '+TIPOS[r.tipo].rot.toLowerCase()+' tarda '+f1(1000*r.tResp,0)+
    ' ms en moverse y la faena da '+f1(1000*F.tRespReq,0)+' ms: llega tarde. ';
  else if(!r.okQ) p+='Por el puerto tienen que pasar '+f1(r.q,1)+' L/min y el modelo deja '+
    f1(r.qmax,0)+': hace falta un cuerpo mayor. ';
  else if(!r.okFunc) p+=(Number.isFinite(r.val)?'Da '+f1(r.val,3)+' '+r.unidad:'No llega')+
    ' y hacen falta '+(F.sentido==='ge'?'≥ ':'≤ ')+f1(r.req,3)+' '+r.unidad+
    ': más volumen de gas o mejor precarga. ';
  else if(!r.okDeriva) p+='Hoy cumple, pero al perder el 3 % anual más los '+f1(TOL_KIT,0)+
    ' bar del kit la precarga cae a '+f1(pman(r.p0Der),2)+' bar y ya no llega: te falta margen. ';
  return p;
}
function checkReto(){
  const c=cfgDe('reto'), s=RETO.sol;
  const r=punto(c.fk,c.ak,c.prec,c.nbot);
  if(!s){
    RETO.msg='Esta faena no tiene ningún conjunto válido en el catálogo.';
    RETO.resuelto=false;
    synth.beep(240,0.12,0.05);
    showToast('❌ <b>Sin solución.</b> '+RETO.msg);
  }else if(r.valida && mejor(r,s)===0){
    RETO.resuelto=true; solved=true;
    RETO.msg='Correcto: '+f1(r.coste,0)+' u con '+f1(r.vT,3)+
      ' L de gas instalado, el mínimo del catálogo.';
    synth.beep(880,0.10,0.06);
    showToast('✅ <b>Conjunto óptimo.</b> '+ACUM_ROT[c.ak]+' al '+f1(100*c.prec,0)+' % · '+
      f1(r.coste,0)+' u · '+pc1(r.margen,1)+' de margen.');
  }else if(r.valida){
    RETO.resuelto=false;
    RETO.msg=(r.coste!==s.coste)
      ? 'Válido, pero no es el más barato: '+f1(r.coste,0)+' u frente a '+f1(s.coste,0)+' u.'
      : (r.vT!==s.vT
        ? 'Válido y al precio mínimo, pero instala '+f1(r.vT,3)+' L de gas y hay otro igual de barato con '+f1(s.vT,3)+'.'
        : 'Válido y empatado en precio y volumen, pero con menos margen: '+pc1(r.margen,1)+
          ' frente a '+pc1(s.margen,1)+'.');
    synth.beep(520,0.09,0.05);
    showToast('🟡 <b>Cumple, pero no es el óptimo.</b> '+RETO.msg);
  }else{
    RETO.resuelto=false;
    RETO.msg=retoExplain(r,c);
    synth.beep(240,0.12,0.05);
    showToast('❌ <b>No cumple.</b> '+RETO.msg);
  }
  computa();
  refreshAll();
}

let QORD=[], answered=false;
function buildQuiz(){
  const q=QUIZ[mode];
  QORD=q.opciones.map((o,i)=>i);
  for(let i=QORD.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=QORD[i];QORD[i]=QORD[j];QORD[j]=t; }
  answered=false;
}
function clearDx(){ answered=false; }
function refreshQuestion(){
  const q=QUIZ[mode];
  el('q_text').textContent=q.pregunta;
  el('dxbtns').innerHTML=QORD.map((oi,i)=>'<button class="b" data-i="'+i+'">'+q.opciones[oi].t+'</button>').join('');
  el('dxbtns').querySelectorAll('[data-i]').forEach(b=>{
    b.onclick=()=>answer(Number(b.getAttribute('data-i')));
  });
}
function answer(i){
  if(answered) return;
  answered=true;
  const q=QUIZ[mode], btns=el('dxbtns').querySelectorAll('[data-i]');
  btns.forEach((b,k)=>{
    b.disabled=true;
    const o=q.opciones[QORD[k]];
    if(o.ok) b.classList.add('right');
    else if(k===i) b.classList.add('wrong');
  });
  const o=q.opciones[QORD[i]];
  synth.beep(o.ok?880:200,0.10,0.05);
  showToast((o.ok?'✅ ':'❌ ')+o.why);
}
function quizCorrectIndex(){ return QORD.indexOf(QUIZ[mode].opciones.findIndex(o=>o.ok)); }
