<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Subviraje, Sobreviraje y ESC — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#08201C;--panel:rgba(9,24,23,.86);--line:#1E3A34;--ink:#EAF4F1;
    --dim:#8FB3AC;--accent:#2A9D8F;--accent2:#4FD1C5;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cF:#4FD1C5;--cR:#FFB347;--cE:#FF4D5A;--cG:#C8D6D2;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#14201f;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#182a28}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#33b3a3}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#06120f}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#4FD1C5;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f8a85;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f948f;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#04211c}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#0a1219;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(30,58,52,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,58,52,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f8a85}
  .dk-tit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#9fbab4;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,58,52,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c9c4;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#14201f;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfe0dc;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(12,22,22,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,22,21,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d6d2}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,22,24,.92);border:1px solid rgba(79,209,197,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,22,24,.84);border:1px solid rgba(79,209,197,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}
  body.estrecho.ancho.t-panel .panel>.dk-fig{grid-column:1;grid-row:2}
  body.estrecho.ancho.t-panel .panel>.dk-row{grid-column:1;grid-row:3/6;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-fu{grid-column:2;grid-row:2;align-self:start}
  body.estrecho.ancho.t-panel .panel>.dk-g.fu{grid-column:2;grid-row:2/4;min-height:0;margin-top:18px}
  body.estrecho.ancho.t-panel .panel>.dk-ley{display:none}
  body.estrecho.ancho.t-panel .panel>.t-sp{grid-column:2;grid-row:4}
  body.estrecho.ancho.t-panel .panel>.dk-g.sp{grid-column:2;grid-row:5;min-height:0}
  body.estrecho.ancho.t-panel .panel>.dk-aviso{display:none}
  body.estrecho .hud details>.cuerpo{max-height:24vh}
  body.estrecho.ancho.t-hud .hud{display:grid;grid-template-columns:1fr 1.05fr;column-gap:14px;row-gap:7px;align-content:start;grid-auto-flow:row dense}
  body.estrecho.ancho .hud>.hcab,body.estrecho.ancho .hud>.modebar,body.estrecho.ancho .hud>.hdet,body.estrecho.ancho .hud>.pasos{grid-column:1}
  body.estrecho.ancho .hud>.hmandos,body.estrecho.ancho .hud>.retoBox{grid-column:2;grid-row:1/span 4}
  body.estrecho .hdet{flex-direction:row}body.estrecho .hdet>details{flex:1;min-width:0}
  body.estrecho .hdet details[open]{position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 54px);z-index:25;background:rgba(9,24,23,.97)}
  body.movil .lt{display:none} body.movil .tbar .modo,body.movil .tbar .reloj{display:none}
  body.movil .tbar{gap:6px;padding:5px 8px} body.movil .tbar .est{min-width:0}
  body.movil .dk-ley{display:none} body.movil .fg b{font-size:13.5px} body.movil .fg .fl{font-size:9.5px}
  body.movil .dk-g.fu{min-height:70px} body.movil .dk-g.sp{min-height:52px} body.movil .dk-row{min-height:150px}
  body.movil .hud h2{font-size:15.5px} body.movil .hud .intro{font-size:11.8px;line-height:1.42}
  body.estrecho .hud{overflow-y:auto}
  body.estrecho .vbar [data-t="rot"],body.estrecho .vbar .sep.s1{display:none}
  body.estrecho.ancho .vbar{top:60px}
  body.movil .vbar{flex-wrap:nowrap;gap:3px;padding:3px 4px;top:54px} body.movil .vbar .sep{display:none} body.movil .vbar .b.sm{padding:5px 7px;font-size:11px}
  body.movil .vbar .lg{display:none}
  body.movil .tbar .lento{display:none}
  body.movil .hud{gap:6px;padding:10px 12px 9px} body.movil .hud .eyebrow{display:none}
  body.movil .modebar .b{padding:6px 4px 5px}
  body.movil .hmandos{display:grid;grid-template-columns:1.3fr 1fr;gap:6px 8px}
  body.movil .hmandos>:nth-child(1),body.movil .hmandos>:nth-child(2),body.movil .hmandos>.fila{grid-column:1/-1}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   LAB — SUBVIRAJE, SOBREVIRAJE Y CONTROL DE ESTABILIDAD (ESC)
   (Dinámica del vehículo · mecanica-128)

   Un coche entra en una curva a la izquierda en una pista de pruebas. Abre
   en marcha, con DOS coches que hacen la misma maniobra a la vez: el
   translúcido, sin ESC, y el sólido, con ESC. Sobre el suelo, la trayectoria
   que dibujan; en cada neumático, la flecha de su fuerza dentro de su círculo
   de fricción —que se pone roja al saturarse—, y los discos que se encienden
   cuando el ESC frena UNA rueda.

   Todo sale de un modelo de bicicleta de 3 grados de libertad con neumáticos
   de fórmula mágica (Pacejka) y Runge–Kutta 4, un conductor que sigue la
   pista y un ESC que compara la guiñada real con la deseada. Esa física está
   en un bloque puro que un script de Node extrae TAL CUAL y verifica.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO=' ';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }


/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos
   marcas— y lo prueba: lo que se prueba es lo que corre.

   Modelo de bicicleta de 3 grados de libertad en el plano (vx, vy, r) con
   neumáticos de «fórmula mágica» de Pacejka saturados por la adherencia μ,
   integrado con Runge–Kutta de 4.º orden. Encima, un conductor que sigue la
   pista (persecución pura) y el control de estabilidad ESC, que frena una
   sola rueda para crear el momento de guiñada que el volante no consigue. */

/* FISICA:INICIO */
const DOSPI=2*Math.PI, G=9.81, RAD=Math.PI/180;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const angNorm=a=>{ while(a>Math.PI) a-=DOSPI; while(a<-Math.PI) a+=DOSPI; return a; };

/* ---------- 1.1 El coche ----------
   Un sedán compacto. a y b son las distancias del centro de masa a los ejes
   delantero y trasero; t, la vía. Cf0 es la rigidez de deriva del eje
   delantero (los dos neumáticos juntos) sobre seco, μ0 = 0,9: Cα ∝ μ (en la
   fórmula mágica, B·C·D con D = μ·Fz y B fijo). La rigidez trasera NO se da:
   sale de pedir el gradiente de subviraje K0 que elige el alumno. */
const VEH={ m:1500, Iz:2500, a:1.10, b:1.50, t:1.55, L:2.60, Cf0:90000, mu0:0.9,
  C:1.35, E:-0.5, crr:0.015, rho:1.2, CdA:0.65, dMax:0.55, dRate:2.5, tauDir:0.08 };
const SUPERFICIES={ seco:0.90, mojado:0.55, nieve:0.25, hielo:0.12 };

/** Rigideces y cargas a la adherencia μ para un gradiente K0 (°/g) a μ0.
 *  K = (m/L)(b/Cf − a/Cr)  [rad·s²/m];  r/δ|estacionario = V/(L + K·V²). */
function coefs(K0deg,mu){
  const {m,a,b,L,Cf0,mu0,C}=VEH, K0=K0deg*RAD/G;
  const Cr0=a/(b/Cf0-K0*L/m), k=mu/mu0, Cf=Cf0*k, Cr=Cr0*k;
  const Fzf=m*G*b/L, Fzr=m*G*a/L;
  return { mu,K0deg,Cf,Cr,Fzf,Fzr,Bf:Cf/(C*mu*Fzf),Br:Cr/(C*mu*Fzr),
    K:(m/L)*(b/Cf-a/Cr), Kdeg:(m/L)*(b/Cf-a/Cr)*G/RAD };
}
/** Fuerza lateral de un neumático (fórmula mágica): D·sen(C·atan(Bx − E(Bx − atan Bx))). */
function pacejka(alfa,B,C,D,E){ const x=B*alfa; return D*Math.sin(C*Math.atan(x-E*(x-Math.atan(x)))); }
/** Fuerza lateral de un eje con deriva α (positiva si la velocidad apunta a la izquierda de la rueda): se opone. */
function fyEje(alfa,B,Fz,mu){ return -pacejka(alfa,B,VEH.C,mu*Fz,VEH.E); }
/** Velocidad crítica de sobreviraje (sólo existe si K < 0). */
function vCritica(K){ return K<0?Math.sqrt(-VEH.L/K):Infinity; }
/** Velocidad angular de guiñada en régimen estacionario por unidad de volante. */
function gananciaGuinada(V,K){ return V/(VEH.L+K*V*V); }
/** Guiñada de referencia lineal V·δ/(L + K·V²) (se acota el denominador por encima de V_crit). */
function guinadaLineal(vx,delta,K){ const v=Math.max(vx,1); return v*delta/Math.max(VEH.L+K*v*v,0.3*VEH.L); }
/** Guiñada deseada del ESC: la lineal, acotada por lo que la adherencia permite (|r| ≤ μg/V). */
function guinadaDeseada(vx,delta,K,mu){
  const v=Math.max(vx,1), lim=mu*G/v;
  return clamp(guinadaLineal(v,delta,K),-lim,lim);
}

/* ---------- 1.2 Fuerzas y dinámica ----------
   Estado s = {x,y,psi,vx,vy,r} (ejes del cuerpo: x adelante, y a la izquierda).
   u = {delta, Fx:[FI,FD,TI,TD]} con Fx > 0 tracción y < 0 freno por rueda.
   Elipse de fricción: una rueda que reparte fuerza longitudinal Fx pierde
   lateral en la proporción √(1 − (Fx/μFz_rueda)²). */
function fuerzas(s,u,c,sinRes){
  const {m,a,b,t,Iz}=VEH, vx=Math.max(s.vx,0.5), Fx=u.Fx;
  const af=Math.atan2(s.vy+a*s.r,vx)-u.delta, ar=Math.atan2(s.vy-b*s.r,vx);
  const Dwf=c.mu*c.Fzf/2, Dwr=c.mu*c.Fzr/2;
  const el=(F,D)=>Math.sqrt(1-Math.pow(Math.min(0.98,Math.abs(F)/D),2));
  const sf=0.5*(el(Fx[0],Dwf)+el(Fx[1],Dwf)), sr=0.5*(el(Fx[2],Dwr)+el(Fx[3],Dwr));
  const Fyf=fyEje(af,c.Bf,c.Fzf,c.mu)*sf, Fyr=fyEje(ar,c.Br,c.Fzr,c.mu)*sr;
  const cd=Math.cos(u.delta), sd=Math.sin(u.delta), yw=[t/2,-t/2,t/2,-t/2];
  // fuerzas de cada rueda delantera en el cuerpo: longitudinal a lo largo de la rueda, lateral perpendicular
  let FxB=0, FyB=Fyr, Mz=-b*Fyr;
  for(let i=0;i<2;i++){
    const fx=Fx[i]*cd-0.5*Fyf*sd, fy=Fx[i]*sd+0.5*Fyf*cd;
    FxB+=fx; FyB+=fy; Mz+=a*fy-yw[i]*fx;
  }
  for(let i=2;i<4;i++){ FxB+=Fx[i]; Mz+=-yw[i]*Fx[i]; }
  const res=sinRes?0:VEH.crr*m*G+0.5*VEH.rho*VEH.CdA*vx*vx;
  return { af,ar,Fyf,Fyr,FxB,FyB,Mz,res,
    ax:(FxB-res)/m, ay:FyB/m, sf,sr };
}
function deriv(s,u,c,sinRes){
  const F=fuerzas(s,u,c,sinRes), cp=Math.cos(s.psi), sp=Math.sin(s.psi);
  return { x:s.vx*cp-s.vy*sp, y:s.vx*sp+s.vy*cp, psi:s.r,
    vx:F.ax+s.vy*s.r, vy:F.ay-s.vx*s.r, r:F.Mz/VEH.Iz };
}
const CLAVES=['x','y','psi','vx','vy','r'];
function suma(s,d,h){ const o={}; for(const k of CLAVES) o[k]=s[k]+d[k]*h; return o; }
/** Un paso de Runge–Kutta de 4.º orden con la entrada u constante. */
function rk4(s,u,c,h,sinRes){
  const k1=deriv(s,u,c,sinRes), k2=deriv(suma(s,k1,h/2),u,c,sinRes), k3=deriv(suma(s,k2,h/2),u,c,sinRes), k4=deriv(suma(s,k3,h),u,c,sinRes);
  const o={}; for(const k of CLAVES) o[k]=s[k]+h/6*(k1[k]+2*k2[k]+2*k3[k]+k4[k]);
  return o;
}
/** Energía cinética del coche (traslación y guiñada). */
function energiaCinetica(s){ return 0.5*VEH.m*(s.vx*s.vx+s.vy*s.vy)+0.5*VEH.Iz*s.r*s.r; }

/* ---------- 1.3 La pista ----------
   Recta de aproximación, un cuarto de circunferencia a la izquierda de radio
   R y recta de salida. Calzada de 7,2 m; el coche «se sale» cuando su eje se
   aleja más de 2,8 m de la línea central (su costado toca el borde). */
const PISTA={ S1:60, S3:30, semi:3.6, limite:2.8 };
function pistaLargo(R){ return PISTA.S1+R*Math.PI/2+PISTA.S3; }
/** Punto, rumbo y curvatura de la línea central a la longitud de arco s. */
function pistaPunto(s,R){
  const S1=PISTA.S1, S2=R*Math.PI/2;
  if(s<=S1) return {x:s,y:0,h:0,k:0};
  if(s<=S1+S2){ const th=(s-S1)/R; return {x:S1+R*Math.sin(th),y:R*(1-Math.cos(th)),h:th,k:1/R}; }
  return {x:S1+R,y:R+(s-S1-S2),h:Math.PI/2,k:0};
}
/** Proyección de (x,y) sobre la pista a partir de una estimación s0 (Newton sobre la tangente). */
function pistaProyecta(x,y,R,s0){
  let s=s0;
  for(let i=0;i<8;i++){ const p=pistaPunto(s,R), ds=(x-p.x)*Math.cos(p.h)+(y-p.y)*Math.sin(p.h); s+=ds; if(Math.abs(ds)<1e-6) break; }
  s=Math.max(0,s); const p=pistaPunto(s,R);
  return { s, ey:-(x-p.x)*Math.sin(p.h)+(y-p.y)*Math.cos(p.h), h:p.h };      // ey > 0: a la izquierda de la línea central
}

/* ---------- 1.4 El conductor y el ESC ----------
   Conductor: persecución pura. Mira un punto de la pista a Ld = 0,55·V (entre 5
   y 25 m) y gira lo que la geometría de bicicleta pide para llegar a él:
   δ = atan(2·L·sen η / Ld). Tiene retraso (τ = 80 ms), límite de ángulo
   (0,55 rad) y de velocidad de giro (2,5 rad/s). Mantiene la velocidad con el
   acelerador (tracción trasera) y su fuerza se reparte con la elipse. */
const ESC_P={ banda:0.05, bandaSub:0.07, kp:2.0*VEH.Iz, frenoComun:0.25*G };
function nuevaCorrida(par){
  const R=par.R, V=par.V, c=coefs(par.K0deg,par.mu), s0=Math.max(0,PISTA.S1-V*1.5), p=pistaPunto(s0,R);
  return { par,c,R,
    s:{x:p.x,y:p.y,psi:p.h,vx:V,vy:0,r:0},
    drv:{sP:s0,delta:0,dCmd:0},
    t:0, fin:false, causa:'', tLim:(pistaLargo(R)-s0)/Math.max(V,3)*1.8+6, maxEy:0, ey:0, sP:s0,
    esc:{act:false,rueda:-1,Fb:0,dM:0,rdes:0,rlin:0,e:0,tAct:0,testigo:false,sobre:false},
    u:{delta:0,Fx:[0,0,0,0]}, F:null, hist:par.hist?[]:null, tH:0, Fdrive:0, vMin:V };
}
/** Un paso de simulación de duración h. Devuelve la misma corrida. */
function pasoCorrida(q,h){
  if(q.fin) return q;
  const {s,c,par,drv}=q, vx=Math.max(s.vx,0.5);
  // --- conductor ---
  const pr=pistaProyecta(s.x,s.y,q.R,drv.sP); drv.sP=pr.s; q.sP=pr.s; q.ey=pr.ey; q.maxEy=Math.max(q.maxEy,Math.abs(pr.ey));
  const Ld=clamp(0.55*vx,5,25), tgt=pistaPunto(Math.min(pr.s+Ld,pistaLargo(q.R)),q.R);
  const eta=angNorm(Math.atan2(tgt.y-s.y,tgt.x-s.x)-s.psi);
  drv.dCmd=Math.atan(2*VEH.L*Math.sin(eta)/Math.max(Ld,1));
  const dd=clamp((drv.dCmd-drv.delta)/VEH.tauDir,-VEH.dRate,VEH.dRate);
  drv.delta=clamp(drv.delta+dd*h,-VEH.dMax,VEH.dMax);
  // --- ESC ---
  const E=q.esc; let FxR=[0,0,0,0], freno=0;
  const rlin=guinadaLineal(vx,drv.delta,c.K), rdes=guinadaDeseada(vx,drv.delta,c.K,c.mu), sgn=rlin>=0?1:-1;
  E.rdes=rdes; E.rlin=rlin; E.e=s.r-rdes;
  E.act=false; E.rueda=-1; E.Fb=0; E.dM=0;
  if(par.esc){
    // sobreviraje: el coche gira MÁS que lo que la adherencia deja (r pasa de r_des); subviraje: gira MENOS que lo que el volante pide
    const xo=sgn*(s.r-rdes)-ESC_P.banda, xu=sgn*(rlin-s.r)-ESC_P.bandaSub;
    if(xo>0||xu>0){
      const sobre=xo>0, mag=sobre?xo:xu, dM=(sobre?-1:1)*sgn*ESC_P.kp*mag;
      const izq=dM>0, rueda=(sobre?0:2)+(izq?0:1);          // sobreviraje: rueda delantera exterior; subviraje: trasera interior
      const Fmax=0.95*c.mu*(sobre?c.Fzf:c.Fzr)/2, Fb=Math.min(Math.abs(dM)/(VEH.t/2),Fmax);
      FxR[rueda]-=Fb; E.act=true; E.rueda=rueda; E.Fb=Fb; E.dM=Math.sign(dM)*Fb*VEH.t/2; E.sobre=sobre; E.testigo=true; E.tAct+=h;
      freno=ESC_P.frenoComun*Math.min(1,mag/0.3)*VEH.m/4;     // frenado común suave (y se corta el acelerador)
      for(let i=0;i<4;i++) FxR[i]-=freno;
    }
  }
  // --- acelerador: mantiene la velocidad (se corta mientras el ESC actúa) ---
  const res=VEH.crr*VEH.m*G+0.5*VEH.rho*VEH.CdA*vx*vx;
  let Fd=E.act?0:clamp(VEH.m*1.2*(par.V-vx)+res,0,0.9*c.mu*c.Fzr);
  q.Fdrive=Fd; FxR[2]+=Fd/2; FxR[3]+=Fd/2;
  q.u={delta:drv.delta,Fx:FxR};
  q.F=fuerzas(s,q.u,c,false);
  q.s=rk4(s,q.u,c,h,false); q.t+=h; q.vMin=Math.min(q.vMin,q.s.vx);
  // --- veredicto (la primera causa manda; con par.sigue la corrida continúa unos segundos para verla acabar) ---
  const L=pistaLargo(q.R), rumboPista=pr.h;
  if(!q.causa){
    if(!isFinite(q.s.x+q.s.vx+q.s.r)) q.causa='trompo';
    else if(Math.abs(q.ey)>PISTA.limite) q.causa=q.ey>0?'salida-interior':'salida-exterior';
    else if(Math.abs(angNorm(q.s.psi-rumboPista))>1.4) q.causa='trompo';
    else if(pr.s>=L-1) q.causa='ok';
    else if(q.t>q.tLim) q.causa='tiempo';
    if(q.causa) q.tCausa=q.t;
  }
  if(q.causa&&(!par.sigue||q.causa==='ok'||q.t>q.tCausa+(par.cola||3))) q.fin=true;
  if(q.hist&&q.t-q.tH>=0.02-1e-9){ q.tH=q.t; q.hist.push(muestra(q)); }
  return q;
}
/** Lo que se registra de cada instante (el dock y la escena leen de aquí). */
function muestra(q){
  const s=q.s, F=q.F||{af:0,ar:0,Fyf:0,Fyr:0,ay:0}, vv=Math.hypot(s.vx,s.vy);
  return { t:q.t,x:s.x,y:s.y,psi:s.psi,vx:s.vx,vy:s.vy,r:s.r,rdes:q.esc.rdes,delta:q.u.delta,
    af:F.af,ar:F.ar,Fyf:F.Fyf,Fyr:F.Fyr,ay:F.ay,beta:Math.atan2(s.vy,Math.max(s.vx,0.5)),
    dM:q.esc.dM,Fb:q.esc.Fb,rueda:q.esc.rueda,act:q.esc.act?1:0,ey:q.ey,V:vv,
    fxf:q.u.Fx[0]+q.u.Fx[1], fxr:q.u.Fx[2]+q.u.Fx[3], sf:F.sf, sr:F.sr };
}
/** Corre una maniobra completa sin dibujar. */
function simula(par,h=0.004){
  const q=nuevaCorrida(par); let n=0;
  while(!q.fin&&n++<20000) pasoCorrida(q,h);
  return q;
}
/** Velocidad límite (km/h) con la que una maniobra aún se completa, explorando de V0 a V1 en pasos de dV;
 *  devuelve la última velocidad que acaba bien antes del primer fallo. */
function velocidadLimite(base,esc,{v0=10,v1=150,dv=3}={}){
  let ult=0;
  for(let kmh=v0;kmh<=v1;kmh+=dv){
    const q=simula(Object.assign({},base,{V:kmh/3.6,esc,hist:false}));
    if(q.causa==='ok') ult=kmh; else break;
  }
  return ult;
}

   Nada de grano fino —se lee como lija sobre caras grandes—: variación lenta de tono y de rugosidad,

const DOSPI_=Math.PI*2;
function ruidoPeriodico(semilla,periodo){
  const g=(x,y)=>{ x=((x%periodo)+periodo)%periodo; y=((y%periodo)+periodo)%periodo;
    const s=Math.sin(x*127.1+y*311.7+semilla*13.13)*43758.5453; return s-Math.floor(s); };
  return (x,y)=>{ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    return g(xi,yi)*(1-u)*(1-v)+g(xi+1,yi)*u*(1-v)+g(xi,yi+1)*(1-u)*v+g(xi+1,yi+1)*u*v; };
}
function fbmP(semilla,periodo,oct){ const ns=[]; for(let o=0;o<oct;o++) ns.push(ruidoPeriodico(semilla+o*7,periodo*(1<<o)));
  return (x,y)=>{ let v=0,a=0.5; for(let o=0;o<oct;o++){ v+=ns[o](x*(1<<o),y*(1<<o))*a; a*=0.5; } return v; }; }

function texAsfalto(){
  const W=256,H=256,c=cv(W,H),x=c.getContext('2d'),im=x.createImageData(W,H),f=fbmP(5,3,3);
  for(let j=0;j<H;j++) for(let i=0;i<W;i++){
    const u=i/W, n=f(i/W*3,j/H*3), rod=Math.exp(-Math.pow((u-0.30)/0.07,2))+Math.exp(-Math.pow((u-0.70)/0.07,2));
    const v=Math.max(0,Math.min(255,(0.86+(n-0.5)*0.16-0.10*rod)*255)), o=(j*W+i)*4;
    im.data[o]=im.data[o+1]=im.data[o+2]=v; im.data[o+3]=255; }
  x.putImageData(im,0,0); return tex(c,{srgb:true});
}
/** Terreno: manchas muy lentas, sin grano. */
function texTerreno(){
  const W=256,c=cv(W),x=c.getContext('2d'),im=x.createImageData(W,W),f=fbmP(11,4,3);
  for(let j=0;j<W;j++) for(let i=0;i<W;i++){ const n=f(i/W*4,j/W*4), v=Math.max(0,Math.min(255,(0.80+(n-0.5)*0.34)*255)), o=(j*W+i)*4;
    im.data[o]=im.data[o+1]=im.data[o+2]=v; im.data[o+3]=255; }
  x.putImageData(im,0,0); const t=tex(c,{srgb:true}); t.repeat.set(60,60); return t;
}

const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
/** Junta una pieza hecha de muchas mallas en una malla por material: así una rueda con 40 tacos cuesta 3 llamadas. */
function fusiona(grupo){
  grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map();
  grupo.traverse(o=>{ if(!o.isMesh) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(), m=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);
    g.applyMatrix4(m);
    if(!g.attributes.uv){ g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2)); }
    const k=o.material; if(!por.has(k)) por.set(k,[]); por.get(k).push(g); });
  const out=new THREE.Group();
  for(const [mat,gs] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count;
      pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry();
    G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const me=new THREE.Mesh(G,mat); me.castShadow=true; me.receiveShadow=true; out.add(me);
  }
  return out;
}
/** Una carrocería «lofteada»: anillos de superelipse que se estrechan hacia los extremos.
 *  secs: [{x, w (semianchura), y0, y1, n (exponente), tum (estrechamiento arriba, 0..1)}]. */
function lofteo(secs,seg=28){
  const pos=[],idx=[],nR=secs.length;
  for(const s of secs){
    const yc=(s.y0+s.y1)/2, hh=Math.max(1e-3,(s.y1-s.y0)/2), ex=2/(s.n||3);
    for(let k=0;k<seg;k++){
      const th=k/seg*DOSPI_, c=Math.cos(th), sn=Math.sin(th);
      const yy=yc+hh*Math.sign(sn)*Math.pow(Math.abs(sn),ex), f=(yy-s.y0)/(2*hh);
      const zz=Math.max(1e-3,s.w)*(1-(s.tum||0)*f*f)*Math.sign(c)*Math.pow(Math.abs(c),ex);
      pos.push(s.x,yy,zz);
    }
  }
  const cI=pos.length/3; pos.push(secs[0].x,(secs[0].y0+secs[0].y1)/2,0); pos.push(secs[nR-1].x,(secs[nR-1].y0+secs[nR-1].y1)/2,0);
  for(let i=0;i<nR-1;i++) for(let k=0;k<seg;k++){
    const a=i*seg+k, b=i*seg+(k+1)%seg, c2=(i+1)*seg+k, d=(i+1)*seg+(k+1)%seg;
    idx.push(a,c2,b, b,c2,d);
  }
  for(let k=0;k<seg;k++){ idx.push(cI,k,(k+1)%seg); idx.push(cI+1,(nR-1)*seg+(k+1)%seg,(nR-1)*seg+k); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx);
  // el sentido de las caras: si el volumen con signo sale negativo, se invierten
  let vol=0; for(let i=0;i<idx.length;i+=3){ const a=idx[i]*3,b=idx[i+1]*3,c3=idx[i+2]*3;
    vol+=pos[a]*(pos[b+1]*pos[c3+2]-pos[b+2]*pos[c3+1])-pos[a+1]*(pos[b]*pos[c3+2]-pos[b+2]*pos[c3])+pos[a+2]*(pos[b]*pos[c3+1]-pos[b+1]*pos[c3]); }
  if(vol<0) for(let i=0;i<idx.length;i+=3){ const t=idx[i+1]; idx[i+1]=idx[i+2]; idx[i+2]=t; }
  g.setIndex(idx); g.computeVertexNormals(); g.computeBoundingSphere();
  return g;
}
const mezcla=(a,b,t)=>a+(b-a)*t, suave=t=>t*t*(3-2*t);
/** Interpola linealmente-suave una lista de puntos [x,valor]. */
function perfil1D(pts){ return x=>{ if(x<=pts[0][0]) return pts[0][1]; for(let i=1;i<pts.length;i++) if(x<=pts[i][0]){ const t=(x-pts[i-1][0])/(pts[i][0]-pts[i-1][0]); return mezcla(pts[i-1][1],pts[i][1],suave(t)); } return pts[pts.length-1][1]; }; }


/* ===================== 6. LA PISTA =====================
   Mapa de ejes: el plano de la simulación (x adelante, y a la izquierda) se pinta en three como
   (x, altura, −y). Así un giro a la izquierda va hacia −Z y el rumbo ψ es la rotación en Y. */
const PISTA3=new THREE.Group(); scene.add(PISTA3);
let PISTA_R=0, ARBOLES=null;
const aMundo=(x,y,h=0)=>V3(x,h,-y);
function ptLado(p,d){ return [p.x-d*Math.sin(p.h),-(p.y+d*Math.cos(p.h))]; }
function muestrasS(R,s0,s1){
  const S1=PISTA.S1, S2=R*Math.PI/2, set=new Set([s0,s1,S1,S1+S2]);
  for(let s=s0;s<s1;s+=((s>S1&&s<S1+S2)?0.9:8)) set.add(s);
  return [...set].filter(s=>s>=s0&&s<=s1).sort((a,b)=>a-b);
}
/** Una cinta plana sobre el suelo: entre los desvíos laterales d0 (derecha) y d1 (izquierda) de la línea central. */
function cintaArr(R,s0,s1,d0,d1,y,vEsc,acum){
  const S=muestrasS(R,s0,s1), P=acum.pos, U=acum.uv, I=acum.idx, base=P.length/3;
  for(const s of S){ const p=pistaPunto(s,R), a=ptLado(p,d0), b=ptLado(p,d1);
    P.push(a[0],y,a[1], b[0],y,b[1]); U.push(0,s/vEsc, 1,s/vEsc); }
  for(let i=0;i<S.length-1;i++){ const r0=base+i*2, l0=r0+1, r1=r0+2, l1=r0+3; I.push(r0,r1,l0, r1,l1,l0); }
}
const nuevoAcum=()=>({pos:[],uv:[],idx:[]});
function geoDeAcum(a){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(a.pos,3));
  const n=[]; for(let i=0;i<a.pos.length/3;i++) n.push(0,1,0);
  g.setAttribute('normal',new THREE.Float32BufferAttribute(n,3)); g.setAttribute('uv',new THREE.Float32BufferAttribute(a.uv,2)); g.setIndex(a.idx);
  g.computeBoundingSphere(); return g;
}
function semilla(n){ let s=n>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function texChevron(){
  const c=cv(64,128),x=c.getContext('2d'); x.fillStyle='#f2c200'; x.fillRect(0,0,64,128);
  x.strokeStyle='#15191c'; x.lineWidth=11; x.lineCap='butt'; x.lineJoin='miter';

}

  while(PISTA3.children.length) PISTA3.remove(PISTA3.children[0]);

function construyePista(R){

  let a=nuevoAcum(); cintaArr(R,s0,s1,-W,W,0.0,9,a); const asf=new THREE.Mesh(geoDeAcum(a),M.asfalto); asf.receiveShadow=true; asf.userData.pieza='asfalto'; PISTA3.add(asf);

  a=nuevoAcum(); cintaArr(R,s0,s1,-W+0.16,-W+0.30,0.004,6,a); cintaArr(R,s0,s1,W-0.30,W-0.16,0.004,6,a);

  cintaArr(R,sa,sb,W+0.0,W+0.55,0.012,2,a); cintaArr(R,sa,sb,-W-0.55,-W-0.0,0.012,2,a);
  const pia=new THREE.Mesh(geoDeAcum(a),M.piano); pia.receiveShadow=true; pia.userData.pieza='piano'; PISTA3.add(pia);
  // guardarraíl en el EXTERIOR de la curva (a la derecha, d < 0), con sus postes cada 4 m
  {
    const pos=[],nor=[],idx=[], dG=-(W+2.4), S=muestrasS(R,Math.max(s0,PISTA.S1-30),Math.min(L,PISTA.S1+R*Math.PI/2+40));
    const h0=0.46,h1=0.84; let base=0;

/** Una copia translúcida del coche (para el que va SIN ESC), con sus propias luces y discos. */
function fantasma(orig){

    const base=m.opacity!==undefined?m.opacity:1;
    c.opacity=(m===M.cristal?0.30:(m===M.goma?0.55:0.42))*Math.min(1,base+0.1);
    if(c.color) c.color.lerp(new THREE.Color('#ff9a86'),m===M.goma||m===M.bajos?0.15:0.55);
    if(c.emissive&&m!==M.piloto&&m!==M.faro&&!(m.userData&&(m.userData.disco!==undefined))) c.emissive.set(0x000000);
    c.envMapIntensity=0.7; mapa.set(m,c); return c; };

/** Recoge las asas (ruedas, discos, mordazas, luz de freno) de un coche por sus etiquetas. */
function asasDe(raiz){
  const A={pivs:[],spins:[],discos:[],mordazas:[],pilotos:[]};
  raiz.traverse(o=>{
    if(o.userData&&o.userData.rueda!==undefined){ A.pivs[o.userData.rueda]=o; A.spins[o.userData.rueda]=o.children[0]; }
    if(o.isMesh&&o.userData&&o.userData.disco!==undefined) A.discos[o.userData.disco]=o.material;
    if(o.isMesh&&o.userData&&o.userData.morda!==undefined) A.mordazas[o.userData.morda]=o.material;
    if(o.isMesh&&o.userData&&o.userData.piloto) A.pilotos.push(o.material);
  });
  A.caja=raiz.children[0]; return A;
}

   Dos corridas de la MISMA maniobra con el mismo reloj: la A (la que se mide, con o sin ESC según el mando) y,
   si se pide comparar, la B, siempre sin ESC (el coche fantasma). Todo lo que se ve —coches, flechas, trazas— y

const EST={modo:'marcha',sup:'mojado',K0:-1.5,V:66,esc:'comparar',R:70,vel:1,pausa:REDUCIDO,autoRunning:false,vista:'sigue',lazo:true,rot:false};

/** Lo que corre ahora: en «En marcha», lo que digan los mandos; en el laboratorio guiado, lo que pida el paso. */
function paramsActuales(){
  if(EST.modo==='guia'){ const p=guiaParams(); if(p) return p; }
  const base={K0deg:EST.K0,mu:MU(),R:EST.R,V:EST.V/3.6,hist:true,sigue:true,cola:2.2};
  return { A:Object.assign({},base,{esc:EST.esc!=='sin'}), B:EST.esc==='comparar'?Object.assign({},base,{esc:false}):null, sup:EST.sup, lazo:true };
}
function reiniciaCorridas(){
  const p=paramsActuales();
  if(p.sup!==SIM.supAct){ aplicaSuperficie(p.sup); SIM.supAct=p.sup; }
  if(p.A.R!==PISTA_R) construyePista(p.A.R);
  SIM.A=nuevaCorrida(p.A); SIM.B=p.B?nuevaCorrida(p.B):null; SIM.lazo=p.lazo!==false;
  SIM.t=0; SIM.espera=0; SIM.spinA=0; SIM.spinB=0; SIM.nA=0; SIM.nB=0; SIM.reinicios++;
  TRAZA_A.reset(); TRAZA_B.reset(); COCHE_B.visible=!!SIM.B;
  for(const f of FUERZAS){ f.anillo.visible=f.fl.visible=true; }
  if(typeof pintaDockFijo==='function') pintaDockFijo();

/** Avanza el modelo dt segundos de reloj de simulación. */
function avanzaSim(dt){
  if(!SIM.A) return;
  const objetivo=SIM.t+dt; let n=0;
  while(SIM.t<objetivo-1e-9&&n<80){
    const hh=Math.min(0.004,objetivo-SIM.t);
    if(!SIM.A.fin){ pasoCorrida(SIM.A,hh); SIM.spinA+=Math.max(0,SIM.A.s.vx)*hh/LRUEDA; }
    if(SIM.B&&!SIM.B.fin){ pasoCorrida(SIM.B,hh); SIM.spinB+=Math.max(0,SIM.B.s.vx)*hh/LRUEDA; }
    SIM.t+=hh; n++;
  }
  const acabo=SIM.A.fin&&(!SIM.B||SIM.B.fin);
  if(acabo){ SIM.espera+=dt; if(SIM.lazo&&EST.lazo&&SIM.espera>2.6) reiniciaCorridas(); }
  else SIM.espera=0;
}

function ponVista(v,dur){

function pasaCam(dt){
  const A=SIM.A; if(!A) return;

  for(let s=L;s>=-5;s-=(s>PISTA.S1&&s<PISTA.S1+R*Math.PI/2)?2:12){ const p=pistaPunto(s,R), [qx,qy]=P(p.x-W*-Math.sin(p.h),p.y-W*Math.cos(p.h)); x.lineTo(qx,qy); }

  x.setLineDash([3,3]); x.strokeStyle='rgba(127,227,216,0.55)'; x.beginPath(); for(let s=0;s<=L;s+=(s>PISTA.S1&&s<PISTA.S1+R*Math.PI/2)?2:12){ const p=pistaPunto(s,R), [qx,qy]=P(p.x,p.y); s===0?x.moveTo(qx,qy):x.lineTo(qx,qy); } x.stroke(); x.setLineDash([]);
  const traza=(q,col,w)=>{ if(!q||!q.hist||q.hist.length<2) return; x.strokeStyle=col; x.lineWidth=w; x.beginPath(); q.hist.forEach((m,i)=>{ const [qx,qy]=P(m.x,m.y); i?x.lineTo(qx,qy):x.moveTo(qx,qy); }); x.stroke(); };

/* ---- Círculo de fricción por eje ---- */
function pintaFr(){
  const x=abre(LFR), Wd=LFR.w, Hd=LFR.h, A=SIM.A; if(!A) return;
  const c=A.c, ejes=[['Delantero',c.Fzf,'fxf','Fyf',COL_F],['Trasero',c.Fzr,'fxr','Fyr',COL_R]];
  const r=Math.max(18,Math.min(Wd/4-5,Hd/2-17));

/* ===================== 16. DISPOSICIÓN: ANCHO, ESTRECHO, MÓVIL =====================
   Si no caben guía, escena y dock lado a lado (el marco de la plataforma, una tableta), la escena va arriba
   y guía e instrumentos comparten una hoja con pestañas abajo. */
function disposicion(){
  const W=innerWidth, b=document.body;
  const estrecho=W<1080, movil=W<640;
  b.classList.toggle('estrecho',estrecho); b.classList.toggle('movil',movil); b.classList.toggle('ancho',estrecho&&!movil);
  if(estrecho){ if(!b.classList.contains('t-hud')&&!b.classList.contains('t-panel')) b.classList.add('t-hud'); ajustaHoja(); }
  el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('on',b.classList.contains('t-'+t.dataset.tab)));
}
function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.47:0.43),240,450));
  let hh=base; const hud=el('hud');
  if(movil&&b.classList.contains('t-panel')) hh=Math.round(clamp(H*0.6,240,560));
  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;
    hh=Math.round(clamp(pide,240,Math.max(base,H*(movil?0.62:0.56)))); }
  const ant=parseFloat(b.style.getPropertyValue('--hojaH'))||0;
  if(Math.abs(ant-hh)>1){ b.style.setProperty('--hojaH',hh+'px'); colocaBarras(); centraEnHueco(); }
}
el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.onclick=()=>{ const b=document.body; b.classList.remove('t-hud','t-panel'); b.classList.add('t-'+t.dataset.tab); disposicion(); centraEnHueco(); });


/* ===================== 17. EL LABORATORIO GUIADO =====================
   Tres fases: 1 · Predice (la velocidad límite de una curva, con la fórmula), 2 · Decide (con una maniobra
   real: velocidad y ESC para pasar por encima de lo que un coche sin ESC aguanta) y 3 · Diagnostica (¿subvirador,
   neutro o sobrevirador?, sólo con lo que ves en el dock) y cierra con un quiz de tres preguntas.
   Tres intentos fallidos en un reto cambian el escenario (no se aprueba por eliminación). */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETO={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'predice',iniciado:false,dxOk:false,r1:null,r2:null,r2run:null,r2lim:{},preparando:false,dx:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0,eval:false};

/* ---------- Fase 1 · Predice ---------- */
const CASOS1=[{sup:'mojado',R:60},{sup:'seco',R:80},{sup:'nieve',R:50},{sup:'mojado',R:100},{sup:'hielo',R:40},{sup:'seco',R:45},{sup:'nieve',R:90},{sup:'mojado',R:75}];
const vIdeal=(mu,R)=>3.6*Math.sqrt(mu*G*R);                        // km/h: μ·m·g = m·V²/R
function sorteaCaso1(){ const p=GUIA.r1&&GUIA.r1.i; let i; do{ i=Math.floor(Math.random()*CASOS1.length); }while(i===p); const c=CASOS1[i], v=vIdeal(SUPERFICIES[c.sup],c.R);
  GUIA.r1={i,sup:c.sup,R:c.R,ans:v,run:v*(0.45+0.35*Math.random())/3.6}; }
function checkPredice(){
  const raw=String((el('ansV')||{}).value||'').trim().replace(/\s| /g,'').replace(',','.'), v=parseFloat(raw), r=GUIA.r1, ok=r.ans;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe la velocidad máxima en km/h (con coma o punto decimal).'); return; }
  RETO.intentos++;
  if(Math.abs(v-ok)<=Math.max(2,0.04*ok)){
    RETO.fallos1=0; sonido.bien();
    feedback('good','¡Correcto! ✓',`El rozamiento máximo da la fuerza centrípeta: μ·m·g = m·V²/R, así que V = √(μ·g·R) = √(${fN(SUPERFICIES[r.sup],2)} × 9,81 × ${fN(r.R)}) = ${fN(ok/3.6,1)} m/s = <b>${fN(ok,0)} km/h</b>. Es el techo de un coche ideal; el real, con conductor y neumáticos, queda por debajo.`,true);
    paso('decide'); prepararDecide();
  } else {
    RETO.fallos1++; sonido.mal();
    const d=v>ok?'alto':'bajo', ms=Math.abs(v-ok/3.6)<Math.max(2,0.04*ok/3.6);
    if(RETO.fallos1>=3){ RETO.fallos1=0; RETO.resiembras++; sorteaCaso1();
      feedback('bad','Tres intentos fallidos','Cambia la curva y la superficie: vuelve a plantear el equilibrio entre el rozamiento y la fuerza centrípeta.'); reiniciaCorridas(); pintaHUD(); pintaDockFijo();
    } else {
      feedback('bad','Revisa el cálculo',`Tu resultado (${fN(v,v%1?1:0)}) está ${d}.`+(ms?' ¿Lo diste en m/s? Aquí se pide en km/h.':' El techo lo marca la adherencia: piensa qué fuerza horizontal puede dar el suelo y cuál necesita la curva.')+` (intentos fallidos: ${RETO.fallos1}/3)`);
      const t=el('d_try'); if(t) t.textContent=RETO.fallos1;
    }
  }
}

/* ---------- Fase 2 · Decide ---------- */
const SUP2=['seco','mojado','nieve'];
/** Las velocidades límite, con y sin ESC, de un escenario (sobrevirador, curva de 70 m): salen del MISMO motor. Se calculan una vez y se guardan. */
function limitesDe(sup){
  if(GUIA.r2lim[sup]) return GUIA.r2lim[sup];
  const base={K0deg:-1.5,mu:SUPERFICIES[sup],R:70};
  const off=velocidadLimite(base,false,{v0:10,v1:150,dv:2}), on=velocidadLimite(base,true,{v0:10,v1:150,dv:2});
  return (GUIA.r2lim[sup]={off,on});
}
function prepararDecide(){
  GUIA.preparando=true; GUIA.r2run=null; GUIA.eval=false;
  const prev=GUIA.r2&&GUIA.r2.sup; const cand=barajar(SUP2.filter(s=>s!==prev));
  setTimeout(()=>{
    let elegido=null;
    for(const s of cand){ const l=limitesDe(s); if(l.on>=1.2*l.off&&l.on-1.1*l.off>=5){ elegido=s; break; } }
    if(!elegido) elegido=cand[0];
    GUIA.r2={sup:elegido,V:Math.round(clamp(vIdeal(SUPERFICIES[elegido],70)*0.6,25,100)),esc:true,intentos:0};
    GUIA.preparando=false; GUIA.r2run=null; reiniciaCorridas(); pintaHUD(); pintaDockFijo();
  },30);
}
function probarDecide(){
  const r=GUIA.r2; if(!r||GUIA.preparando) return;
  const V=r.V, esc=r.esc;
  r.V=V; r.esc=esc; GUIA.r2run={V,esc}; GUIA.eval=true; reiniciaCorridas(); pintaHUD(); pintaDockFijo();
}
/** Se llama cada cuadro: si la maniobra del reto 2 acabó, se evalúa una sola vez. */
function guiaTick(){
  if(EST.modo!=='guia'||GUIA.paso!=='decide'||!GUIA.eval||!SIM.A||!SIM.A.fin||!GUIA.r2run) return;
  GUIA.eval=false;
  const r=GUIA.r2, l=limitesDe(r.sup), q=SIM.A, V=GUIA.r2run.V;
  RETO.intentos++; r.intentos++;
  const pasa=q.causa==='ok'&&V>=1.1*l.off;
  if(pasa){
    RETO.fallos2=0; sonido.bien();
    feedback('good','¡Lo conseguiste! ✓',`Pasaste la curva a <b>${fN(V,0)} km/h ${GUIA.r2run.esc?'con':'sin'} ESC</b>. Un coche sin ESC sólo la aguanta hasta ≈ ${fN(l.off,0)} km/h en esta superficie: el sobrevirador pierde la cola antes de que el conductor pueda corregir. El ESC frena una rueda y devuelve la guiñada a donde el volante la pide; con él el límite sube a ≈ ${fN(l.on,0)} km/h.`,true);
    paso('diag'); iniciaDiag();
  } else {
    RETO.fallos2++; sonido.mal();
    let msg;
    if(q.causa==='ok') msg=`Completaste la curva a ${fN(V,0)} km/h, pero un coche sin ESC también podría a esa velocidad: no demuestras lo que el ESC aporta. Sube la velocidad y deja el ESC activo.`;
    else if(q.causa==='trompo') msg=`Trompo a ${fN(V,0)} km/h${GUIA.r2run.esc?' incluso con ESC: ya no le queda adherencia para frenar una rueda y corregir':': el eje trasero perdió el agarre y nadie lo corrigió'}.`;
    else msg=`Te saliste de la calzada a ${fN(V,0)} km/h por el ${q.causa==='salida-exterior'?'exterior':'interior'}${GUIA.r2run.esc?': el ESC no crea adherencia, sólo reparte la que hay':''}.`;
    if(RETO.fallos2>=4){ RETO.fallos2=0; RETO.resiembras++; feedback('bad','Cuatro intentos sin lograrlo',msg+' Cambia el escenario: la superficie es otra.',true); prepararDecide(); }
    else { feedback('bad','Todavía no',msg+` (intentos: ${RETO.fallos2}/4)`,true); GUIA.r2run=null; pintaHUD(); }
  }
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const TIPOS_DX=[{k:'sub',K0:3.5,t:'Subvirador'},{k:'neutro',K0:0,t:'Neutro'},{k:'sobre',K0:-2.5,t:'Sobrevirador'}];
function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.k; let t; do{ t=pickOne(TIPOS_DX); }while(t.k===p);
  GUIA.dx=t; GUIA.dxOk=false; GUIA.orden=barajar(['sub','neutro','sobre']); reiniciaCorridas(); pintaHUD(); pintaDockFijo();
}
function diagnostica(k){
  if(!GUIA.dx||GUIA.dxOk) return; RETO.intentos++;
  if(k===GUIA.dx.k){
    GUIA.dxOk=true; RETO.fallos3=0; sonido.bien();
    const c=SIM.A?SIM.A.c:null;
    feedback('good','Diagnóstico correcto ✓',explicaDx(GUIA.dx.k)+(c?` Su gradiente es K = ${fN(c.Kdeg,1)} °/g a esta adherencia.`:''),true);
    paso('quiz'); iniciaQuiz();
  } else {
    RETO.fallos3++; sonido.mal();
    if(RETO.fallos3>=3){ RETO.fallos3=0; RETO.resiembras++; feedback('bad','Tres intentos fallidos','Es otro coche: observa de nuevo la deriva de cada eje y el volante frente al que pide la geometría.',true); iniciaDiag(); }
    else { feedback('bad','No es ese',noEs(k)+` (intentos fallidos: ${RETO.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(k){
  if(k==='sub') return 'Subvirador: el eje delantero necesita más deriva que el trasero (α<sub>f</sub> &gt; α<sub>r</sub>) y el volante gira más que el ángulo geométrico L/R. Al límite, el frente se satura primero y el coche se abre.';
  if(k==='sobre') return 'Sobrevirador: el eje trasero trabaja con más deriva que el delantero (α<sub>r</sub> &gt; α<sub>f</sub>) y basta menos volante que el geométrico. Al límite, la cola se satura primero y el coche se cierra.';
  return 'Neutro: los dos ejes trabajan con la misma deriva (α<sub>f</sub> = α<sub>r</sub>) y el volante es el que pide la geometría, δ = L/R. K = 0.';
}
function noEs(k){
  if(k==='sub') return 'En un subvirador el eje delantero tendría MÁS deriva que el trasero y el volante pasaría del ángulo geométrico L/R.';
  if(k==='sobre') return 'En un sobrevirador el eje trasero tendría MÁS deriva que el delantero y el volante quedaría por debajo del ángulo geométrico L/R.';
  return 'En un coche neutro las dos derivas serían iguales y el volante coincidiría con L/R. Compara las dos derivas del dock.';
}
const QUIZ=[
  {q:'En una curva, el eje delantero llega al límite de adherencia antes que el trasero. ¿Qué hace el coche?',ok:'Se abre hacia el exterior: subviraje',mal:['Se cierra hacia el interior: sobreviraje','Sigue exactamente la trayectoria: el ESC siempre lo evita','Frena solo hasta detenerse']},
  {q:'Un coche sobrevira en una curva a la izquierda. ¿Qué rueda frena el ESC para corregirlo?',ok:'La delantera derecha (exterior)',mal:['La delantera izquierda (interior)','La trasera izquierda (interior)','Las cuatro por igual']},
  {q:'¿Qué NO puede hacer el control de estabilidad?',ok:'Crear más adherencia que la que ofrece el neumático sobre ese suelo',mal:['Comparar la guiñada real con la deseada','Frenar una sola rueda','Reducir la potencia del motor']},
];
function iniciaQuiz(){ GUIA.quizN=0; cargaPregunta(); }
function cargaPregunta(){ const Q=QUIZ[GUIA.quizN], opts=barajar([Q.ok,...Q.mal]); GUIA.quiz={q:Q.q,opts,ok:opts.indexOf(Q.ok)}; GUIA.quizResp=-1; GUIA.quizCorrecta=GUIA.quiz.ok; pintaHUD(); }
function respondeQuiz(i){
  if(GUIA.quizResp>=0) return; GUIA.quizResp=i; const ac=i===GUIA.quiz.ok; if(ac) RETO.quizAcierto++;
  if(ac) sonido.bien(); else sonido.mal();
  const ult=GUIA.quizN>=QUIZ.length-1;
  feedback(ac?'good':'bad',ac?'Correcto ✓':'No es esa',(ac?'':'La respuesta era: <b>'+GUIA.quiz.opts[GUIA.quiz.ok]+'</b>. ')+(ult?'Terminaste el laboratorio.':'Sigue con la siguiente.'),true);
  pintaHUD();
  if(ult){ RETO.hecho=true; paso('completo'); }
}
function siguientePregunta(){ if(GUIA.quizN<QUIZ.length-1){ GUIA.quizN++; cargaPregunta(); } }

/* ---------- el enrutador de acciones ---------- */
function paso(p){ GUIA.paso=p; GUIA.phase=({predice:0,decide:1,diag:2,quiz:2,completo:2})[p]; if(EST.modo==='guia') pintaHUD(); }
function handleAction(act,btn){
  switch(act){
    case 'check-v': checkPredice(); break;
    case 'hint-v':
      if(RETO.pistas===0){ RETO.pistas=1; feedback('good','Pista 1 de 2','En el límite, la fuerza horizontal que el suelo puede dar es el rozamiento máximo: μ por el peso del coche.'); }
      else if(RETO.pistas===1){ RETO.pistas=2; feedback('good','Pista 2 de 2','Esa fuerza es justo la centrípeta que pide una curva de radio R: m·V²/R. La masa se simplifica.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break;
    case 'probar': probarDecide(); break;
    case 'dx-sub': diagnostica('sub'); break;
    case 'dx-neutro': diagnostica('neutro'); break;
    case 'dx-sobre': diagnostica('sobre'); break;
    case 'quiz-0': respondeQuiz(0); break; case 'quiz-1': respondeQuiz(1); break; case 'quiz-2': respondeQuiz(2); break; case 'quiz-3': respondeQuiz(3); break;
    case 'quiz-sig': siguientePregunta(); break;
    case 'restart': location.reload(); break;
  }
}

/* ---------- lo que la guía enseña en cada paso ---------- */
function contenidoGuia(){
  const tri=(n,v,m)=>`<span class="tries">intentos fallidos: <b id="${n}">${v}</b>/${m}</span>`;
  switch(GUIA.paso){
    case 'predice': { const r=GUIA.r1; return {no:'Fase 1 · Reto 1',head:'Tu cálculo',title:'¿Hasta qué velocidad aguanta la curva?',
      teach:`Una curva de <b>${fN(r.R)} m</b> de radio sobre <b>${NOMBRE_SUP[r.sup].toLowerCase()}</b> (μ = ${fN(SUPERFICIES[r.sup],2)}). Un coche ideal gira tan rápido como el rozamiento deja.<div class="task">¿Cuál es la velocidad máxima, en km/h? ${tri('d_try',RETO.fallos1,3)}</div>`,
      acts:`<div class="calcrow"><input id="ansV" type="text" inputmode="decimal" autocomplete="off" placeholder="¿? km/h" aria-label="Velocidad máxima en kilómetros por hora"><button class="b primary" data-act="check-v">✓ Comprobar</button></div><button class="pista" id="btnHint">¿Necesitas una pista? (máx. 2)</button>`}; }
    case 'decide': { const r=GUIA.r2;
      if(GUIA.preparando||!r) return {no:'Fase 2 · Reto 2',head:'Tu decisión',title:'Preparando la pista…',teach:'Calculando el escenario.',acts:''};
      return {no:'Fase 2 · Reto 2',head:'Tu decisión',title:'Pasa por donde un coche sin ESC no pasa',
      teach:`Un <b>sobrevirador</b> (maletero cargado) toma una curva de 70 m sobre <b>${NOMBRE_SUP[r.sup].toLowerCase()}</b>. Elige la velocidad de entrada y si lleva ESC.<div class="why"><b>El objetivo:</b> completar la curva sin salirte, a una velocidad que un coche SIN ESC no aguantaría.</div><div class="task">Pruébalo en la pista. ${tri('d_try2',RETO.fallos2,4)}</div>`,
      acts:`<div class="cg"><div class="cl"><div>Velocidad de entrada</div><b id="v2V">${fN(r.V)} km/h</b></div><input type="range" id="r2V" min="20" max="130" step="1" value="${r.V}" aria-label="Velocidad de entrada"></div>
        <div class="seg" id="segR2"><button class="b ${r.esc?'on':''}" data-r2="con">Con ESC</button><button class="b ${r.esc?'':'on'}" data-r2="sin">Sin ESC</button></div>
        <button class="b primary" data-act="probar" ${GUIA.eval?'disabled':''}>${GUIA.eval?'Probando…':'▶ Probar la maniobra'}</button>`}; }
    case 'diag': { const ord=GUIA.orden||['sub','neutro','sobre'], N={sub:'Subvirador',neutro:'Neutro',sobre:'Sobrevirador'};
      return {no:'Fase 3 · Diagnóstico',head:'¿Qué coche es?',title:'Averigua su carácter sin ver su K',
      teach:`Va a ${fN(Math.round(SIM.A?SIM.A.par.V*3.6:56))} km/h por la curva, sin ESC y lejos del límite. Compara en el dock la <b>deriva de cada eje</b> y el <b>volante</b> con el ángulo geométrico L/R = ${fN(VEH.L/70*57.2958,1)}°.<div class="task">¿Subvirador, neutro o sobrevirador? ${tri('d_try3',RETO.fallos3,3)}</div>`,
      acts:ord.map(k=>`<button class="b" data-act="dx-${k}">${N[k]}</button>`).join('')}; }
    case 'quiz': { const Q=GUIA.quiz; if(!Q) return {no:'',head:'',title:'',teach:'',acts:''}; const ya=GUIA.quizResp>=0;
      return {no:'Cierre · Pregunta '+(GUIA.quizN+1)+' de '+QUIZ.length,head:'Quiz',title:Q.q,teach:'',
      acts:Q.opts.map((o,i)=>`<button class="b ${ya?(i===Q.ok?'good':(i===GUIA.quizResp?'bad':'')):''}" data-act="quiz-${i}" ${ya?'disabled':''}>${o}</button>`).join('')+(ya&&GUIA.quizN<QUIZ.length-1?'<button class="b primary" data-act="quiz-sig">Siguiente →</button>':'')}; }
    case 'completo': return {no:'Laboratorio completado',head:'✓',title:'Predijiste, decidiste y diagnosticaste',
      teach:`Acertaste ${RETO.quizAcierto} de ${QUIZ.length} en el quiz. Vuelve a <b>En marcha</b> y compara coches y superficies: el ESC corrige lo que el volante ya no consigue, pero la adherencia es siempre el techo.`,
      acts:`<button class="b primary" data-act="restart">↺ Reiniciar laboratorio</button>`};
  }
  return {no:'',head:'',title:'',teach:'',acts:''};
}
function htmlGuia(){
  const ps=['Predice','Decide','Diagnostica'], C=contenidoGuia();
  const ok=i=>i<GUIA.phase||(i===2&&RETO.hecho);
  return `<div class="pasos">${ps.map((t,i)=>`<span class="ps ${ok(i)?'ok':(i===GUIA.phase?'on':'')}"><i>${ok(i)?'✓':i+1}</i>${t}</span>`).join('')}</div>
  <div class="retoBox"><div class="rt"><span>${C.no}</span><span>${C.head}</span></div><h3>${C.title}</h3><div class="rq">${C.teach}</div><div class="opt" id="actOpt">${C.acts}</div></div>`;
}
/** Lo que corre en la pista en cada paso del laboratorio guiado (null: lo que digan los mandos). */
function guiaParams(){
  const base={hist:true,sigue:true,cola:2.2};
  if(GUIA.paso==='predice'&&GUIA.r1){ const r=GUIA.r1; return {A:Object.assign({K0deg:0,mu:SUPERFICIES[r.sup],R:r.R,V:r.run,esc:true},base),B:null,sup:r.sup,lazo:true}; }
  if(GUIA.paso==='decide'&&GUIA.r2){ const r=GUIA.r2, run=GUIA.r2run;
    return {A:Object.assign({K0deg:-1.5,mu:SUPERFICIES[r.sup],R:70,V:(run?run.V:30)/3.6,esc:run?run.esc:true},base),B:null,sup:r.sup,lazo:!run&&!GUIA.eval}; }
  if((GUIA.paso==='diag'||GUIA.paso==='quiz'||GUIA.paso==='completo')&&GUIA.dx){ const mu=SUPERFICIES.mojado;
    return {A:Object.assign({K0deg:GUIA.dx.K0,mu,R:70,V:Math.sqrt(mu*G*70)*0.8,esc:false},base),B:null,sup:'mojado',lazo:true}; }
  return null;
}
/* ---------- los modos ---------- */
function setMode(m,forzar){
  if(!forzar&&(m===EST.modo||EST.autoRunning)) return;
  if(m==='guia'){
    EST.modo='guia'; if(!GUIA.iniciado){ GUIA.iniciado=true; sorteaCaso1(); paso('predice'); }
  } else EST.modo='marcha';
  document.body.classList.toggle('m-marcha',EST.modo==='marcha'); document.body.classList.toggle('m-guia',EST.modo==='guia');
  reiniciaCorridas(); ponVista(EST.vista==='pista'?'pista':'sigue',0.6); pintaHUD(); pintaDockFijo(); pintaBarras();
}
let fbTimer=null;
function feedback(type,title,text,sticky=false){ const f=el('feedback'); f.className='feedback show '+type; el('fbIcon').textContent=type==='good'?'✓':'✕'; el('fbTitle').textContent=title; el('fbText').innerHTML=text; clearTimeout(fbTimer); if(!sticky) fbTimer=setTimeout(()=>f.classList.remove('show'),7000); }
el('fbX').onclick=()=>el('feedback').classList.remove('show');
document.addEventListener('input',e=>{ const t=e.target; if(t&&t.id==='r2V'){ const r=GUIA.r2; if(r){ r.V=+t.value; el('v2V').textContent=fN(r.V)+' km/h'; } } });
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('[data-r2]'); if(b){ const r=GUIA.r2; if(r){ r.esc=b.dataset.r2==='con'; el('segR2').querySelectorAll('.b').forEach(x=>x.classList.toggle('on',x===b)); } } });

/* ---------- el recorrido guiado de «En marcha» ---------- */
const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function runAuto(){
  if(EST.autoRunning||EST.modo!=='marcha') return; EST.autoRunning=true; sonido.init();
  const hud=el('hud'), prev={sup:EST.sup,K0:EST.K0,V:EST.V,esc:EST.esc,vista:EST.vista,vel:EST.vel};
  const fija=o=>{ Object.assign(EST,o); pintaHUD(); hud.style.pointerEvents='none'; const b=el('btnAuto'); if(b){ b.disabled=true; b.textContent='Recorrido en curso…'; } reiniciaCorridas(); pintaDockFijo(); pintaBarras(); };
  try{
    fija({sup:'mojado',K0:0,V:60,esc:'con',vel:1}); ponVista('sigue');
    showToast('Paso 1 · Un coche <b>neutro</b> a 60 km/h sobre mojado. Cada flecha es la fuerza de un neumático; su círculo es el límite (μ·F<sub>z</sub>). Aún sobra adherencia.',8200);
    await espera(8600);
    fija({K0:2,V:72,esc:'sin'});
    showToast('Paso 2 · <b>Subviraje</b>: el eje delantero se satura primero (flecha roja delante) y el coche se abre hacia el exterior, aunque el volante gire más.',8200);
    await espera(8600);
    fija({K0:-1.5,V:70,esc:'sin'});
    showToast('Paso 3 · <b>Sobreviraje</b>: ahora se satura el eje trasero, la cola se va y el coche se cierra hasta el trompo.',8200);
    await espera(8600);
    fija({esc:'comparar'});
    showToast('Paso 4 · Mismo coche, <b>con ESC</b> (el sólido): compara la guiñada con la deseada y <b>frena una sola rueda</b>, la delantera exterior. Mira el disco que se enciende.',9200);
    await espera(9600);
    fija({sup:'hielo',K0:-1.5,V:27,esc:'comparar'});
    showToast('Paso 5 · En <b>hielo</b> los círculos se encogen. El ESC no crea adherencia: sólo reparte la que hay.',8200);
    await espera(8600);
  } finally {
    Object.assign(EST,prev); EST.autoRunning=false; hud.style.pointerEvents='';
    pintaHUD(); reiniciaCorridas(); pintaDockFijo(); ponVista(prev.vista); pintaBarras();
  }
}


/* ===================== 18. SONIDO (sintetizado) =====================
   El chirrido del neumático saturado: sube de tono y de volumen cuanto más cerca del límite trabaja el eje. */
const sonido=(function(){
  let ctx=null,on=true,master=null,osc=null,gain=null,filt=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      osc=ctx.createOscillator(); osc.type='sawtooth'; filt=ctx.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=1500; filt.Q.value=3;
      gain=ctx.createGain(); gain.gain.value=0; osc.frequency.value=700; osc.connect(filt); filt.connect(gain); gain.connect(master); osc.start();
    }catch(e){ ctx=null; } }
  function actualiza(uso){ if(!ctx) return; const t=ctx.currentTime, u=Math.max(0,Math.min(1,(uso-0.92)/0.12));
    osc.frequency.setTargetAtTime(640+360*u,t,0.08); gain.gain.setTargetAtTime(on?0.05*u:0,t,0.06); }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); }
  return {init,actualiza,
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    clac:()=>tono(320,0.06,0.04,'triangle'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; },
    get vol(){ return gain?gain.gain.value:0; }, get freq(){ return osc?osc.frequency.value:0; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});

/* ===================== 19. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.min(devicePixelRatio,alta?2:1.5));
  const ms=alta?2048:1024; if(LUZ.sol.shadow.mapSize.x!==ms){ LUZ.sol.shadow.mapSize.set(ms,ms); if(LUZ.sol.shadow.map){ LUZ.sol.shadow.map.dispose(); LUZ.sol.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); centraEnHueco();
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 20. EL LAZO: UN SOLO RELOJ =====================
   El tiempo simulado avanza dt·velocidad en cada cuadro, y con ESE tiempo se pintan la escena (coches, flechas,
   trazas) y el dock (cursor de la guiñada, círculos, trayectoria). */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0;
const FPS={n:0,t0:0,v:0};
function usoMax(){ const A=SIM.A; if(!A||!A.hist||!A.hist.length) return 0; const m=A.hist[A.hist.length-1];
  return Math.max(Math.hypot(m.fxf,m.Fyf)/(A.c.mu*A.c.Fzf),Math.hypot(m.fxr,m.Fyr)/(A.c.mu*A.c.Fzr)); }
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  aplicaEscena(EST.pausa?0:dt*EST.vel,dt);
  guiaTick();
  pasaCam(dt);
  sonido.actualiza(EST.pausa||(SIM.A&&SIM.A.fin)?0:usoMax());
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaTr(); pintaFr(); pintaFu(); pintaSp(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos();
}
