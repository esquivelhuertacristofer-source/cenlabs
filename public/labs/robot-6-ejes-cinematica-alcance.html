<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Robot de 6 ejes: alcance y singularidades — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#0A1118;--panel:rgba(9,14,21,.90);--line:#2B3A52;--ink:#EAF4F8;
    --dim:#9BB8C4;--accent:#FF9A3C;--accent2:#FFD0A0;--hv:#FFA94D;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cF:#FF9A3C;--cR:#4DD2FF;--cE:#3DDC97;--cG:#C8D6D2;--cI:#C79BFF;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#04060a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#14202f;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#1f3248}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#2a1500;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#2a1500;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#ffd98a}
  .b.auto{border-color:rgba(255,154,60,.6);color:var(--hv);background:rgba(255,154,60,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,154,60,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  body:not(.m-tour) .hud{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2B3A52 transparent}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#2a1500}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#FF9A3C;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f87a0;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f90a8;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#2a1500}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,154,60,.35);background:rgba(255,154,60,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .escs{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
  .esc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px;font-size:11.5px;line-height:1.35;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.20);border:1px solid rgba(40,56,80,.7);color:#c4d3e6}
  .esc .rs{font-weight:700;font-size:11px}.esc .rs.ok{color:var(--good)}.esc .rs.mal{color:#ff9a9a}
  .esc .pista{font-size:10.5px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#0a1220;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .clases{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
  .clases .b{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;padding:4px 8px;font-size:12px;line-height:1.2}
  .clases .b small{font-size:9.5px;color:var(--dim);font-weight:400}
  .clases .b.on small{color:#5a2d00}
  .clases .b .pr{color:var(--hv);letter-spacing:.06em;font-size:10.5px}
  .clases .b.on .pr{color:#5a2d00}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(40,56,80,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(40,56,80,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f87a0}
  .dk-tit{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#a3bcd6;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(40,56,80,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c6da;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,154,60,.08);color:#ffd88a;border:1px solid rgba(255,154,60,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#14202f;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfdcec;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  /* ---- el recorrido paso a paso y el aro que señala la pieza ---- */
  .tour{border:1px solid rgba(255,154,60,.38);background:rgba(255,154,60,.06);border-radius:12px;padding:10px 11px;display:flex;flex-direction:column;gap:7px}
  .tour .tn{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .tour .pts{display:flex;gap:5px}.tour .pts i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}.tour .pts i.on{background:var(--accent)}.tour .pts i.ok{background:var(--good)}
  .tour h3{font-size:16px;line-height:1.2}
  .tour .tx{font-size:13px;line-height:1.5;color:#d3e3ea}.tour .tx b{color:#fff}
  .tour .tb{display:flex;gap:6px}.tour .tb .b{flex:1}
  .tour .salta{align-self:flex-end;font-size:11px;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:0;font-family:inherit}
  .foco{position:fixed;z-index:14;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 3px rgba(255,154,60,.55),0 0 24px 6px rgba(255,154,60,.45);pointer-events:none;display:none;animation:pulso 1.5s ease-in-out infinite}
  @keyframes pulso{0%,100%{transform:scale(.88);opacity:.95}50%{transform:scale(1.12);opacity:.55}}
  @media (prefers-reduced-motion:reduce){.foco{animation:none}}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,18,30,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,18,30,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d3e6}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,18,30,.92);border:1px solid rgba(255,214,130,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,18,30,.84);border:1px solid rgba(255,214,130,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .chips{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .chip{font-size:11.5px;line-height:1.35;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--dim)}
  .chip b{color:var(--ink)} .chip small{font-size:10.5px;color:var(--dim)}
  .chip.ok{border-color:rgba(52,211,153,.5)} .chip.ok b{color:var(--good)} .chip.mal{border-color:rgba(244,71,94,.5)} .chip.mal b{color:#ff9aa8}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}

/* ============================================================
LAB — ROBOT DE 6 EJES: ALCANCE, CINEMÁTICA INVERSA Y SINGULARIDADES
   (Autotrónica · mecanica-166)

   Un robot de soldadura de seis articulaciones (el modelo 3D real, escalado a ≈ 2,8 m) lleva la pinza a un punto que tú mueves.
   Para llegar, el robot resuelve la cinemática inversa en vivo: J1 gira la columna hacia el punto; J2 y J3 forman un brazo de DOS
   eslabones cuyo codo se calcula con la ley de los cosenos; J4–J6 orientan la pinza. El jacobiano dice qué tan fácil es mover la punta
   (índice de manipulabilidad) y qué velocidad articular exige: cuando el brazo se estira o la muñeca se alinea, J pierde rango y esa
   velocidad tiende a infinito. Todo sale de un bloque puro (FISICA) que un script de Node extrae TAL CUAL y prueba.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO='\u202F';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }



/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos marcas— y lo prueba:
   lo que se prueba es lo que corre. */
/* FISICA:INICIO */
/* ---- Robot de 6 ejes: alcance, cinemática inversa y singularidades. Física pura (sin three). SI: metros y radianes (la interfaz muestra grados). ----
   Cadena: el robot del modelo 3D (J1…J6) con sus pivotes y ejes REALES, a escala 3 (≈ 2,8 m de alto). La cinemática directa (FK) multiplica
   rotaciones y traslaciones de la base a la punta; el jacobiano geométrico J (6×6: 3 filas de velocidad lineal, 3 de angular) sale de los
   ejes y pivotes del mismo cálculo. La cinemática inversa (IK) se resuelve así: (1) J1 apunta el plano del brazo al punto (con el desvío
   lateral de la muñeca), (2) J2 y J3 son un brazo de DOS ESLABONES en ese plano resuelto con la LEY DE LOS COSENOS (codo arriba o codo abajo),
   (3) J4, J5 y J6 orientan la herramienta (descomposición exacta de la orientación pedida), y (4) unas iteraciones de Newton absorben el
   pequeño desvío de los pivotes del modelo real. Con el jacobiano se obtienen el índice de manipulabilidad (|det J|, Yoshikawa) y las
   velocidades articulares q̇ = J⁻¹·ξ que exige mover la punta a una velocidad dada. Un solo reloj: la pasada recta avanza con t. */
const DOSPI=Math.PI*2, RAD=Math.PI/180;
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const suave=t=>{ t=clamp(t,0,1); return t*t*(3-2*t); };

/* ---- Álgebra mínima: matrices 3×3 por filas (arreglo de 9) y vectores [x,y,z] ---- */
const I3=()=>[1,0,0, 0,1,0, 0,0,1];
const mmul=(A,B)=>{ const C=new Array(9); for(let i=0;i<3;i++) for(let j=0;j<3;j++) C[i*3+j]=A[i*3]*B[j]+A[i*3+1]*B[3+j]+A[i*3+2]*B[6+j]; return C; };
const mvec=(A,v)=>[A[0]*v[0]+A[1]*v[1]+A[2]*v[2], A[3]*v[0]+A[4]*v[1]+A[5]*v[2], A[6]*v[0]+A[7]*v[1]+A[8]*v[2]];
const mT=A=>[A[0],A[3],A[6], A[1],A[4],A[7], A[2],A[5],A[8]];
const vsum=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], vres=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], vesc=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const vdot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const vcruz=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const vnorma=a=>Math.sqrt(vdot(a,a));
const vunit=a=>{ const n=vnorma(a)||1; return [a[0]/n,a[1]/n,a[2]/n]; };
const col=(A,j)=>[A[j],A[3+j],A[6+j]];
const desdeCols=(c0,c1,c2)=>[c0[0],c1[0],c2[0], c0[1],c1[1],c2[1], c0[2],c1[2],c2[2]];
/** Rotación de un ángulo θ alrededor de un eje unitario (Rodrigues). */
function rotAx(a,th){ const c=Math.cos(th), s=Math.sin(th), t=1-c, [x,y,z]=a;
  return [t*x*x+c, t*x*y-s*z, t*x*z+s*y,  t*x*y+s*z, t*y*y+c, t*y*z-s*x,  t*x*z-s*y, t*y*z+s*x, t*z*z+c]; }
const Rx=th=>rotAx([1,0,0],th), Ry=th=>rotAx([0,1,0],th), Rz=th=>rotAx([0,0,1],th);

/* ---- El robot: pivotes y ejes del modelo 3D (posición local de cada nodo respecto al anterior, en metros = 3 × unidades del modelo) ---- */
const ESCALA=3;
const OFF=[[0,0,0], [0.36,1.20,0], [-0.36,1.17,0], [1.38,-0.24,-0.48], [0.42,0,0], [0.06,-0.27,-0.06]];   // J1…J6
const TCP_LOC=[0.45,-0.06,0];                                       // el punto medio entre los electrodos, en el marco de J6
const A4=vunit([0.98,-0.19,0]);                                     // J4 gira a lo largo del antebrazo, inclinado ≈ 11° respecto de X
const AX=[[0,1,0],[0,0,1],[0,0,1],A4,[0,0,1],[1,0,0]];
const KAPPA=Math.atan2(-A4[1],A4[0]);                               // 11°: con J5 = −κ la herramienta queda alineada con J4
/* Limites de carrera y de velocidad (didácticos, de un robot de soldadura de este tamaño; J5 se limita por θ5 = q5 + κ, la desviación de la muñeca) */
const NOMBRES=['J1','J2','J3','J4','J5','J6'];
const LIM_DEG=[[-170,170],[-105,45],[-40,125],[-200,200],[-120,120],[-360,360]];
const VMAX_DEG=[75,70,75,110,110,150];                              // °/s (reducidos por la inercia de la pinza cargada: didáctico)
const th5De=q=>q[4]+KAPPA;                                          // θ5: 0 = muñeca recta (J4 y J6 alineados)

/* ---- Cinemática directa y jacobiano ---- */
function fk(q){
  let R=I3(), p=[0,0,0]; const P=[], Ax=[];
  for(let i=0;i<6;i++){ p=vsum(p,mvec(R,OFF[i])); P.push(p); R=mmul(R,rotAx(AX[i],q[i])); Ax.push(mvec(R,AX[i])); }
  const tcp=vsum(p,mvec(R,TCP_LOC));
  return {P,Ax,R,tcp};
}
/** Jacobiano geométrico 6×6 (filas 0–2: velocidad lineal de la punta; 3–5: velocidad angular de la herramienta), por filas. */
function jacobiano(f){
  const J=[[],[],[],[],[],[]];
  for(let i=0;i<6;i++){ const z=f.Ax[i], v=vcruz(z,vres(f.tcp,f.P[i]));
    for(let r=0;r<3;r++){ J[r][i]=v[r]; J[3+r][i]=z[r]; } }
  return J;
}
/** Resuelve A·x = b (A n×n) con pivote parcial; devuelve null si es singular a la precisión de la máquina. */
function resuelve(A0,b0){
  const n=b0.length, A=A0.map(r=>r.slice()), b=b0.slice();
  for(let c=0;c<n;c++){ let m=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[m][c])) m=r;
    if(Math.abs(A[m][c])<1e-14) return null; if(m!==c){ [A[m],A[c]]=[A[c],A[m]]; [b[m],b[c]]=[b[c],b[m]]; }
    for(let r=c+1;r<n;r++){ const k=A[r][c]/A[c][c]; if(k===0) continue; for(let j=c;j<n;j++) A[r][j]-=k*A[c][j]; b[r]-=k*b[c]; } }
  const x=new Array(n); for(let r=n-1;r>=0;r--){ let s=b[r]; for(let j=r+1;j<n;j++) s-=A[r][j]*x[j]; x[r]=s/A[r][r]; }
  return x;
}
function det(A0){
  const n=A0.length, A=A0.map(r=>r.slice()); let d=1;
  for(let c=0;c<n;c++){ let m=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[m][c])) m=r;
    if(Math.abs(A[m][c])<1e-300) return 0; if(m!==c){ [A[m],A[c]]=[A[c],A[m]]; d=-d; }
    d*=A[c][c]; for(let r=c+1;r<n;r++){ const k=A[r][c]/A[c][c]; for(let j=c;j<n;j++) A[r][j]-=k*A[c][j]; } }
  return d;
}

/* ---- El brazo de dos eslabones (J2, J3) y la ley de los cosenos ---- */
const SOMBRO=[OFF[1][0],OFF[1][1]];                                  // J2 en el plano del brazo (u radial, v vertical) respecto del eje de J1
const L2=Math.hypot(OFF[2][0],OFF[2][1]), A2=Math.atan2(OFF[2][1],OFF[2][0]);                   // eslabón 2: hombro → codo
const WL=vsum(OFF[3],vesc(A4,vdot(A4,OFF[4])));                      // el «centro de la muñeca»: el punto del eje de J4 más cercano a J5
const L3=Math.hypot(WL[0],WL[1]), A3=Math.atan2(WL[1],WL[0]), E_LAT=WL[2];                      // eslabón 3: codo → muñeca, y su desvío lateral (−0,48 m)
const D_MAX=L2+L3, D_MIN=Math.abs(L3-L2);                           // alcance máximo y mínimo del centro de la muñeca desde el hombro
/** Ángulo entre los dos eslabones por la ley de los cosenos: d² = L2² + L3² + 2·L2·L3·cos φ (φ = 0 con el brazo estirado). */
const anguloCodo=d=>Math.acos(clamp((d*d-L2*L2-L3*L3)/(2*L2*L3),-1,1));
/** Distancia hombro–muñeca que da un ángulo de codo φ (la inversa de la anterior). */
const distanciaCodo=phi=>Math.sqrt(L2*L2+L3*L3+2*L2*L3*Math.cos(phi));
/**
 * J1, J2 y J3 para llevar el centro de la muñeca W (en el marco de la base) a su sitio. rama: 'arriba' (el codo por encima de la recta hombro–muñeca) o 'abajo'.
 * Devuelve ok=false si W cae fuera del anillo de alcance (entonces ajusta al borde más cercano, para dibujar al robot «estirándose»).
 */
function brazoIK(W,rama){
  const rho=Math.hypot(W[0],W[2]), uu2=rho*rho-E_LAT*E_LAT;
  let ok=true; const u=uu2>0?Math.sqrt(uu2):0; if(uu2<0) ok=false;                    // dentro del cilindro de radio |e|: el brazo no llega
  const q1=Math.atan2(-W[2],W[0])+Math.atan2(E_LAT,u);
  const dx=u-SOMBRO[0], dy=W[1]-SOMBRO[1], dRaw=Math.hypot(dx,dy);
  const d=clamp(dRaw,D_MIN+1e-9,D_MAX-1e-9); if(dRaw>D_MAX||dRaw<D_MIN) ok=false;
  const cphi=(d*d-L2*L2-L3*L3)/(2*L2*L3), phi=Math.acos(clamp(cphi,-1,1));
  const psi=Math.atan2(dy,dx), alfa=Math.atan2(L3*Math.sin(phi),L2+L3*Math.cos(phi));
  const arriba=rama!=='abajo';
  const thU=arriba?psi+alfa:psi-alfa, thF=arriba?thU-phi:thU+phi;
  const q2=thU-A2, q3=thF-A3-q2;
  return {ok,q1,q2,q3:Math.atan2(Math.sin(q3),Math.cos(q3)),phi,d:dRaw,dx,dy,u,thU,thF};
}

/* ---- La muñeca: R = Ra(q4)·Rz(q5)·Rx(q6) ---- */
function descompMuneca(Rw,qprev){
  const d=col(Rw,0), c5=clamp(vdot(A4,d),-1,1), t5=Math.acos(c5), cand=[];
  for(const s of [1,-1]){
    const q5=s*t5-KAPPA, v1=[Math.cos(q5),Math.sin(q5),0];
    const v1p=vres(v1,vesc(A4,vdot(A4,v1))), dp=vres(d,vesc(A4,vdot(A4,d)));
    let q4; if(vnorma(v1p)<1e-7||vnorma(dp)<1e-7) q4=qprev?qprev[3]:0;
    else q4=Math.atan2(vdot(A4,vcruz(v1p,dp)),vdot(v1p,dp));
    const M=mmul(mT(mmul(rotAx(A4,q4),Rz(q5))),Rw), q6=Math.atan2(M[7],M[4]);
    for(const k4 of [-1,0,1]) for(const k6 of [-1,0,1]){            // las vueltas completas de J4 y J6 también son soluciones: se elige la que cabe en la carrera

}

/* ===================== 7. EL ROBOT (GLB real) =====================
   54 mallas = 54 llamadas de dibujo: se fusionan por eslabón (clonando antes cada geometría y pasándola a Float32, porque la cuantización del
   archivo es de enteros normalizados) y quedan 7 mallas: la base y J1…J6. La jerarquía de nodos (J1 → … → J6 → punta) se conserva. */
let GLB;
try{
  const cargador=new GLTFLoader(); cargador.setMeshoptDecoder(MeshoptDecoder);
  GLB=await cargador.loadAsync('/labs/assets/robot-soldadura.glb');
}catch(err){ el('hud').innerHTML='<div class="intro">No se pudo cargar el modelo del robot. Recarga la página.</div>'; throw err; }
function geomFloat(g,m){
  const pos=g.attributes.position, nor=g.attributes.normal, uv=g.attributes.uv, n=pos.count, P=new Float32Array(n*3), N=new Float32Array(n*3), U=new Float32Array(n*2);
  for(let i=0;i<n;i++){ P[3*i]=pos.getX(i); P[3*i+1]=pos.getY(i); P[3*i+2]=pos.getZ(i);
    if(nor){ N[3*i]=nor.getX(i); N[3*i+1]=nor.getY(i); N[3*i+2]=nor.getZ(i); } if(uv){ U[2*i]=uv.getX(i); U[2*i+1]=uv.getY(i); } }
  const o=new THREE.BufferGeometry(); o.setAttribute('position',new THREE.BufferAttribute(P,3)); o.setAttribute('normal',new THREE.BufferAttribute(N,3)); o.setAttribute('uv',new THREE.BufferAttribute(U,2));
  if(g.index) o.setIndex(new THREE.BufferAttribute(Uint32Array.from(g.index.array),1)); o.applyMatrix4(m); return o;
}
const NODOS=['J1','J2','J3','J4','J5','J6'];
let MAT_ROBOT=null;
const CABLE={rango:null,geo:null,pos0:null,nor0:null,w:null,q2:null};
/** El mazo de cables del brazo (pieza 0 de J2) es rígido con el brazo: al subir o bajar J2 su extremo inferior se despegaba de los cables de la columna.
    Se dobla en el código: cada vértice del cable gira con J2 sólo en proporción a w (0 = sigue a la columna, 1 = sigue al brazo), sin tocar el archivo. */
function preparaCable(G){
  const [i0,i1]=CABLE.rango, P=G.attributes.position, N=G.attributes.normal; CABLE.geo=G; CABLE.pos0=P.array.slice(); CABLE.nor0=N.array.slice(); CABLE.w=new Float32Array(i1-i0);
  const ax=[-0.12,0.39], L2a=ax[0]*ax[0]+ax[1]*ax[1];
  for(let i=i0;i<i1;i++){ const x=CABLE.pos0[3*i], y=CABLE.pos0[3*i+1], t=(x*ax[0]+y*ax[1])/L2a;
    const u=clamp((t-CABLE_T0)/(CABLE_T1-CABLE_T0),0,1); CABLE.w[i-i0]=u*u*(3-2*u); }
}
const CABLE_T0=0.00, CABLE_T1=0.50;
function pliegaCable(q2){
  if(!CABLE.geo||CABLE.q2!==null&&Math.abs(CABLE.q2-q2)<1e-5) return; CABLE.q2=q2;
  const [i0,i1]=CABLE.rango, P=CABLE.geo.attributes.position, N=CABLE.geo.attributes.normal, p0=CABLE.pos0, n0=CABLE.nor0;
  for(let i=i0;i<i1;i++){ const a=-(1-CABLE.w[i-i0])*q2, c=Math.cos(a), s=Math.sin(a), k=3*i;
    P.array[k]=p0[k]*c-p0[k+1]*s; P.array[k+1]=p0[k]*s+p0[k+1]*c; P.array[k+2]=p0[k+2];
    N.array[k]=n0[k]*c-n0[k+1]*s; N.array[k+1]=n0[k]*s+n0[k+1]*c; N.array[k+2]=n0[k+2]; }
  P.needsUpdate=true; N.needsUpdate=true;
}
(function fusionaPorEslabon(){
  for(const nombre of ['L0_base',...NODOS]){
    const nodo=GLB.scene.getObjectByName(nombre), piezas=nodo.children.filter(o=>o.isMesh), geos=[];
    let cuenta=0;
    for(const p of piezas){ p.updateMatrix(); const gg=geomFloat(p.geometry,p.matrix); if(nombre==='J2'&&p.name==='tripo_part_0') CABLE.rango=[cuenta,cuenta+gg.attributes.position.count]; cuenta+=gg.attributes.position.count; geos.push(gg); if(!MAT_ROBOT) MAT_ROBOT=p.material; p.geometry.dispose(); }
    for(const p of piezas) nodo.remove(p);
    const G=BufferGeometryUtils.mergeGeometries(geos,false); for(const g of geos) g.dispose();
    if(nombre==='J2'&&CABLE.rango) preparaCable(G);
    const mesh=new THREE.Mesh(G,MAT_ROBOT); mesh.name='malla_'+nombre; mesh.castShadow=true; mesh.receiveShadow=true; mesh.userData.clave='robot_'+nombre; nodo.add(mesh);
  }
  MAT_ROBOT.envMapIntensity=1.0; MAT_ROBOT.roughness=Math.min(1,MAT_ROBOT.roughness); MAT_ROBOT.needsUpdate=true;
})();
const ROBOT={grupo:new THREE.Group(),raiz:GLB.scene,nodos:NODOS.map(n=>GLB.scene.getObjectByName(n)),hb:0};
ROBOT.raiz.scale.setScalar(ESCALA); ROBOT.raiz.position.set(0.29*ESCALA,0,-0.05*ESCALA);   // el pivote de J1 (−0,29; 0; 0,05) cae en el eje vertical del origen

const AXQ=new THREE.Vector3(A4[0],A4[1],A4[2]), AXZ=new THREE.Vector3(0,0,1), AXX=new THREE.Vector3(1,0,0);
/** Gira cada nodo J del modelo con los ángulos q (rad): J1 sobre Y, J2/J3/J5 sobre Z, J4 sobre el eje del antebrazo, J6 sobre X. */
function poseRobot(R,q){

  R.nodos[0].quaternion.setFromAxisAngle(V3(0,1,0),q[0]); R.nodos[1].quaternion.setFromAxisAngle(AXZ,q[1]); R.nodos[2].quaternion.setFromAxisAngle(AXZ,q[2]);
  R.nodos[3].quaternion.setFromAxisAngle(AXQ,q[3]); R.nodos[4].quaternion.setFromAxisAngle(AXZ,q[4]); R.nodos[5].quaternion.setFromAxisAngle(AXX,q[5]);
}

/* ===================== 8. LA PIEZA: UNA PUERTA SOBRE SU UTILLAJE =====================
   Una chapa de puerta (con su ventana) colgada de un utillaje, con una brida horizontal por la que corre la costura de puntos de soldadura. La punta del robot
   va a lo largo de esa brida; los puntos ya soldados se encienden detrás de la pinza. */
const PIEZA=new THREE.Group(); MUNDO.add(PIEZA);
const NPUNTOS=15;
const NUGGETS=new THREE.InstancedMesh(new THREE.SphereGeometry(0.022,10,8),M.punto,NPUNTOS); NUGGETS.frustumCulled=false; NUGGETS.userData.fondo=true; NUGGETS.raycast=()=>{}; NUGGETS.count=0; MUNDO.add(NUGGETS);
let PIEZA_ID=null;
function liberaGrupo(g){ for(let i=g.children.length-1;i>=0;i--){ const o=g.children[i]; g.remove(o); if(o.geometry) o.geometry.dispose(); } }
function construyePieza(esc){
  if(PIEZA_ID===esc.id) return; PIEZA_ID=esc.id; liberaGrupo(PIEZA);
  const H=esc.H, Lc=esc.Lc, hp=Math.min(0.95,H-0.10), W=Lc+0.35, prof=0.13;
  // chapa de la puerta: contorno redondeado con ventana, extruida y biselada, de pie bajo la brida
  const sh=new THREE.Shape(); const r=0.10, w2=W/2;
  sh.moveTo(-w2+r,0); sh.lineTo(w2-r,0); sh.quadraticCurveTo(w2,0,w2,r); sh.lineTo(w2,hp-r); sh.quadraticCurveTo(w2,hp,w2-r,hp); sh.lineTo(-w2+r,hp); sh.quadraticCurveTo(-w2,hp,-w2,hp-r); sh.lineTo(-w2,r); sh.quadraticCurveTo(-w2,0,-w2+r,0);
  if(hp>0.5){ const h=new THREE.Path(), a=0.16, b0=hp*0.34, b1=hp-0.14; h.moveTo(-w2+a+0.25,b0); h.lineTo(w2-a-0.05,b0); h.lineTo(w2-a-0.30,b1); h.lineTo(-w2+a+0.25,b1); h.closePath(); sh.holes.push(h); }
  const gc=new THREE.ExtrudeGeometry(sh,{depth:0.03,bevelEnabled:true,bevelThickness:0.01,bevelSize:0.01,bevelSegments:2,curveSegments:10}); gc.computeVertexNormals();
  const chapa=malla(gc,M.chapa); chapa.rotation.y=-Math.PI/2; chapa.position.set(prof,H-hp,0); chapa.userData.clave='pieza'; PIEZA.add(chapa);
  // la brida: una tira horizontal que sale hacia el robot a la altura H
  const brida=malla(new RoundedBoxGeometry(prof+0.02,0.016,W-0.06,2,0.006),M.chapaOsc); brida.position.set(prof/2,H-0.008,0); brida.userData.clave='pieza'; PIEZA.add(brida);
  // utillaje: dos montantes, zapatas y mordazas
  for(const sz of [-1,1]){ const z=sz*(W/2+0.12);
    const mont=malla(new RoundedBoxGeometry(0.10,H+0.05,0.10,2,0.012),M.aceroOsc); mont.position.set(prof+0.10,(H+0.05)/2,z); mont.userData.clave='utillaje'; PIEZA.add(mont);
    const pie=malla(new RoundedBoxGeometry(0.62,0.05,0.34,2,0.012),M.aceroOsc); pie.position.set(prof+0.10,0.025,z); pie.userData.clave='utillaje'; PIEZA.add(pie);
    const mor=malla(new RoundedBoxGeometry(0.16,0.10,0.14,2,0.015),M.amarillo); mor.position.set(prof+0.02,H-hp*0.35,sz*(W/2-0.04)); mor.userData.clave='utillaje'; PIEZA.add(mor); }
  PIEZA.userData.esc=esc;
}
/** Coloca la pieza para la distancia D y enciende los puntos ya soldados hasta la fracción s (0–1) de la costura. */
function ponPieza(esc,D,s){
  construyePieza(esc); PIEZA.position.set(D,0,0);
  const n=clamp(Math.floor(s*NPUNTOS+1e-9),0,NPUNTOS), m4=new THREE.Matrix4();
  for(let i=0;i<NPUNTOS;i++){ m4.makeTranslation(D,esc.H+0.004,-esc.Lc/2+esc.Lc*(i+0.5)/NPUNTOS); NUGGETS.setMatrixAt(i,m4); }
  NUGGETS.instanceMatrix.needsUpdate=true; NUGGETS.count=n;
}

/* el corte vertical del volumen de trabajo, sobre un plano que pasa por el eje de J1 y por el objetivo */
const CORTE={cv:cv(52,42),tex:null,mesh:null,clave:'',w:4.4,h:3.8,r0:0,h0:-0.2,mapa:null};

/** Pinta el mapa de alcance (las mismas celdas del dock): verde azulado = alcanza (más claro, más manipulable), rojizo rayado = alcanza pero un límite lo impide, morado = casi singular. */
function pintaCorte(c,mapa,conManip){
  if(c.width!==mapa.nx||c.height!==mapa.ny){ c.width=mapa.nx; c.height=mapa.ny; }
  const W=c.width,H=c.height,x=c.getContext('2d'), im=x.createImageData(W,H), D=im.data;

/* anillos de alcance a la altura de la punta: el mayor y el menor radio al que llega (a esa altura y con esa inclinación) */

/* ===================== 10. EL ESTADO Y EL RELOJ =====================

   va en CÁMARA LENTA ×1/4 (rotulada en la barra de abajo) porque a velocidad real una pasada dura menos de un segundo. En «Mover la punta» el robot
   sigue la bola con una suavización de 0,1 s; en una pasada la punta avanza a la velocidad pedida v (m/s) por la costura, de ida y vuelta.
   Modos: «Recorrido» (paso a paso), «Probar» (mandos libres) y «Reto». */
const EST={modo:'tour',sub:'punta',tx:2.5,ty:1.25,tz:0.35,incl:0,yaw:0,rama:'arriba',hb:0,esc:'puerta',D:2.6,v:1.5,pausa:REDUCIDO,vel:1,autoRunning:false,vista:'celda',rot:false,

const LENTO=0.25, V_REF=1.0;                                        // V_REF: velocidad de la punta (m/s) con la que se mide el «peor caso» en «Mover la punta»
let CALC=null;
const LIVE={q:SIM.q.slice(),llega:true,enLimites:true,limites:[],tcp:[0,0,0],tcpMundo:[0,0,0],rho:0,th5:0,phi:0,im:0,gan:null,qd:null,ratios:null,rmax:0,s:0,wa:[0,0,0],objetivo:[0,0,0],aprox:[1,0,0],rama:'arriba'};

/* ---- el corte del volumen de trabajo: un mapa por (inclinación, giro lateral, altura de la base, rama), calculado una sola vez ---- */
const MAPAS=new Map(); let MAPA_ULT=null, MAPA_T=null;

function mapaPara(o,sync){
  const k=claveMapa(o); if(MAPAS.has(k)){ MAPA_ULT=MAPAS.get(k); return MAPA_ULT; }
  const calc=()=>{ const m=mapaAlcance({incl:Math.round(o.incl),yaw:Math.round(o.yaw||0),hb:Math.round(o.hb*100)/100,rama:o.rama,nx:52,ny:42,rmax:4.4,hmin:-0.2,hmax:3.6}); m.clave=k; if(MAPAS.size>14) MAPAS.delete(MAPAS.keys().next().value); MAPAS.set(k,m); MAPA_ULT=m; return m; };
  if(sync||!MAPA_ULT) return calc();

}
/** Rango de radio al que llega la punta a la altura h (de la tabla del corte): [mínimo, máximo] sólo con celdas alcanzables y dentro de límites. */

  if(a<0) return null; const cw=(m.r1-m.r0)/m.nx; return [m.r0+a*cw,m.r0+(b+1)*cw];
}

/** Lo que corre ahora: en «Probar», lo que digan los mandos; en el recorrido y en el reto, lo que pida el paso. */
function paramsActuales(){

  if(EST.modo==='reto'){ const p=guiaParams(); if(p) return p; }
  if(EST.sub==='costura') return descPasada(escPorId(EST.esc),EST.D,EST.hb,EST.v);
  return {tipo:'punta',p:[EST.tx,EST.ty,EST.tz],incl:EST.incl,yaw:EST.yaw,rama:EST.rama,hb:EST.hb,ver:EST.ver,demo:null};

/** Descriptor de una pasada de costura del escenario `esc` a distancia D, base a altura hb y velocidad v. */
function descPasada(esc,D,hb,v,extra){

const rumboDe=(x,z)=>Math.atan2(-z,x);
const rtDe=(d,p)=>orientacion(dirAprox(d.incl*RAD,rumboDe(p[0],p[2])+(d.yaw||0)*RAD),(d.giro||0)*RAD);
function calcula(d,sync){

let CORTE_VER=-1;

/* ===================== 11. LO QUE SE VE ===================== */
const FRAC_PASADA=()=>CALC&&CALC.d.tipo==='pasada'?SIM.s:0;
/** El punto de «demostración» de los pasos del recorrido: una órbita suave de la punta (mundo). */
function demoPunto(d,t){

const _q=new THREE.Quaternion();

/* ===================== 12. EL HUD (izquierda) ===================== */

function pintaHUD(){

  else h+=htmlGuia();
  h+=`<div class="hdet"><details id="dEc"><summary>Ecuaciones</summary><div class="cuerpo">
    <div class="formula">c = (d² − L₂² − L₃²) / (2·L₂·L₃)   ·   φ = arccos c</div>
    <div class="fl">Los dos eslabones del brazo miden <b>L₂ = ${fN(L2,2)} m</b> y <b>L₃ = ${fN(L3,2)} m</b>. Si la muñeca está a una distancia <b>d</b> del hombro, la ley de los cosenos da el ángulo φ entre ellos: φ = 0 es el brazo estirado y d = ${fN(D_MAX,2)} m es lo más lejos que llega (lo más cerca: ${fN(D_MIN,2)} m).</div>

    <div class="fl">El <b>jacobiano J</b> relaciona las velocidades de las articulaciones con la de la punta. Su determinante, el <b>índice de manipulabilidad</b>, vale 0 en una singularidad: ahí J no se puede invertir y la velocidad articular que exige moverse tiende a infinito.</div>

}
function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.40:0.43),240,450));
  let hh=base; const hud=el('hud');
  if(movil&&b.classList.contains('t-panel')) hh=Math.round(clamp(H*0.55,240,540));
  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;

  const lat=Math.abs(A[0]-B[0])<1e-9&&Math.abs(A[1]-B[1])<1e-9, Lc=Math.abs(B[2]-A[2]);

  return Object.assign({tipo:'pasada',esc:null,pz,A,B,incl,yaw,giro:0,hb,v,vTakt:undefined,D:A[0],rama:'arriba',ver:VER({corte:false}),oculto:false},extra||{});

   Tres fases: 1 · Calcula (a mano: el ángulo del codo por la ley de los cosenos, el alcance máximo o mínimo, o la velocidad lineal de la punta),
   2 · Ajusta (a qué distancia poner la pieza, a qué altura la base y a qué velocidad pasar la punta para que la costura NO se salga del alcance, NO
   toque una singularidad y NO pida de más a ninguna articulación; el veredicto y las curvas de velocidad sólo aparecen al validar, y las ventanas son
   INTERIORES: cerca no llega, lejos se estira; lento no rinde, rápido no se puede) y 3 · Diagnostica (¿qué le pasa a esta pasada?, sólo con lo que se ve
   en el dock). Cierra con un quiz de tres preguntas. */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETOS={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'calcula',iniciado:false,dxOk:false,r1:null,r2:null,dx:null,orden:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0};
const ESC_RETO=['umbral','puerta','techo'];

/* ---------- Fase 1 · Calcula ---------- */
const CASOS_1=[
  {tipo:'codo',d:1.6},{tipo:'codo',d:2.0},{tipo:'codo',d:2.4},{tipo:'codo',d:2.8},{tipo:'codo',d:2.95},
  {tipo:'tope',cual:'max'},{tipo:'tope',cual:'min'},
  {tipo:'vel',w:30,rho:2.0},{tipo:'vel',w:45,rho:2.5},{tipo:'vel',w:60,rho:1.5},
];
function resCaso1(c){
  if(c.tipo==='codo') return anguloCodo(c.d)/RAD;
  if(c.tipo==='tope') return c.cual==='max'?D_MAX:D_MIN;
  return c.w*RAD*c.rho;
}
const claveC1=c=>c.tipo+'/'+(c.d||c.cual||'')+'/'+(c.w||'')+'/'+(c.rho||'');
function sorteaCaso1(){ const p=GUIA.r1&&claveC1(GUIA.r1); let c; do{ c=pickOne(CASOS_1); }while(claveC1(c)===p); GUIA.r1=Object.assign({},c,{res:resCaso1(c)}); }
function numeroDe(txt){ const raw=String(txt||'').trim().replace(/\s/g,'').replace(/ /g,'').replace(',','.'); return parseFloat(raw); }
const unidad1=r=>r.tipo==='codo'?'grados':(r.tipo==='tope'?'metros':'m/s');
function checkCalcula(){
  const v=numeroDe((el('ansV')||{}).value), r=GUIA.r1, ok=r.res;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe el resultado (con coma o punto decimal).'); return; }
  RETOS.intentos++;
  const tol=r.tipo==='codo'?Math.max(0.6,0.012*ok):(r.tipo==='tope'?0.03:Math.max(0.03,0.03*ok));
  if(Math.abs(v-ok)<=tol){
    RETOS.fallos1=0; sonido.bien();
    if(r.tipo==='codo') feedback('good','¡Correcto! ✓',`Con d = ${fN(r.d,2)} m: cos φ = (${fN(r.d,2)}² − ${fN(L2,2)}² − ${fN(L3,2)}²) / (2 · ${fN(L2,2)} · ${fN(L3,2)}) y φ = <b>${fN(ok,1)}°</b>. Con φ = 0 el brazo estaría estirado (d = ${fN(D_MAX,2)} m).`,true);
    else if(r.tipo==='tope') feedback('good','¡Correcto! ✓',r.cual==='max'?`Estirado (φ = 0) las barras se suman: L₂ + L₃ = <b>${fN(ok,2)} m</b>. Allí el brazo está en una singularidad: ya no puede empujar más hacia fuera.`:`Plegado del todo (φ = 180°) las barras se restan: |L₃ − L₂| = <b>${fN(ok,2)} m</b>. Más cerca, la muñeca no llega.`,true);
    else feedback('good','¡Correcto! ✓',`La velocidad lineal es v = ω · ρ con ω en rad/s: ${fN(r.w,0)}° /s = ${fN(r.w*RAD,3)} rad/s y v = ${fN(r.w*RAD,3)} · ${fN(r.rho,1)} = <b>${fN(ok,2)} m/s</b>. Por eso J1 se exige más cuando la costura pasa cerca del eje.`,true);
    paso('ajusta'); prepararAjusta();
  } else {
    RETOS.fallos1++; sonido.mal();
    if(RETOS.fallos1>=3){ RETOS.fallos1=0; RETOS.resiembras++; sorteaCaso1(); feedback('bad','Tres intentos fallidos',r.tipo==='codo'?'Cambia el caso. Recuerda: φ = arccos((d² − L₂² − L₃²) / (2·L₂·L₃)).':(r.tipo==='tope'?'Cambia el caso. Estirado: las barras se suman; plegado: se restan.':'Cambia el caso. Recuerda: v = ω · ρ, con ω en rad/s.'),true); reiniciaCalculo(); pintaHUD(); }
    else { let pista;
      if(r.tipo==='codo'){ pista=Math.abs(v-(180-ok))<=Math.max(0.6,0.012*(180-ok))?'Ese es el ángulo <b>interior</b> del triángulo; φ es el que falta para 180°. Revisa el signo en la ley de los cosenos.':'Despeja con la ley de los cosenos: d² = L₂² + L₃² + 2·L₂·L₃·cos φ; luego φ = arccos(…) y en grados.'; }
      else if(r.tipo==='tope') pista='Piensa las dos barras en línea recta: ¿se suman o se restan? Y la otra posición, plegadas una sobre otra.';
      else { const en_grados=Math.abs(v-r.w*r.rho)<=Math.max(0.5,0.03*r.w*r.rho); pista=en_grados?'Te faltó pasar ω a <b>rad/s</b> (1° = 0,01745 rad).':'v = ω · ρ, con ω en rad/s y ρ en metros.'; }
      feedback('bad','Revisa el cálculo',pista+` (intentos fallidos: ${RETOS.fallos1}/3)`); const t=el('d_try'); if(t) t.textContent=RETOS.fallos1; }
  }
}

/* ---------- Fase 2 · Ajusta la distancia de la pieza, la altura de la base y la velocidad ---------- */
function prepararAjusta(){
  let e; do{ e=escPorId(pickOne(ESC_RETO)); }while(GUIA.r2&&e.id===GUIA.r2.esc.id&&RETOS.resiembras>0);
  GUIA.r2={esc:e,D:1.8,hb:0,v:0.6,validado:false,res:null,intentos:0};
  SIM.s=0; SIM.dir=1; SIM.espera=0; reiniciaCalculo(true); pintaHUD();
}
const pidoDe=(PAS)=>{ for(let k=0;k<PAS.pts.length;k++) if(!PAS.pts[k].llega||!PAS.pts[k].enLimites) return k; return -1; };
function validarAjusta(){
  const r=GUIA.r2; if(!r) return;
  const E=r.esc, PAS=CALC.PAS; r.res=PAS; r.validado=true; r.intentos++; RETOS.intentos++;
  const ok=PAS.ok; reiniciaCalculo(true);
  if(ok){
    RETOS.fallos2=0; sonido.bien(); const wD=ventanaD(E,r.hb,r.v), wV=ventanaV(E,r.D,r.hb);
    feedback('good','¡La costura sale! ✓',`Alcanza todo el recorrido, el índice de manipulabilidad no baja de <b>${fN(PAS.imMin*100,0)} %</b> y ninguna articulación pasa del <b>${fN(PAS.ratioMax*100,0)} %</b> de su velocidad máxima (${fN(PAS.T,1)} s por pasada). Con esa base y esa velocidad, cualquier distancia entre <b>${wD?fN(wD[0],1):'—'}</b> y <b>${wD?fN(wD[1],1):'—'} m</b> habría servido; con esa distancia y esa base, cualquier velocidad entre <b>${wV?fN(wV[0],1):'—'}</b> y <b>${wV?fN(wV[1],1):'—'} m/s</b>. Más cerca no llega; más lejos se estira el brazo; más lento no rinde; más rápido una articulación no da.`,true);
    pintaHUD(); paso('diag'); iniciaDiag();
  } else {
    RETOS.fallos2++; sonido.mal(); const fil=[];
    if(!PAS.okAlcance){ const k=pidoDe(PAS); fil.push(!PAS.llegaTodo?`En el <b>${fN((k<0?0:k)/(PAS.pts.length-1)*100,0)} %</b> de la costura la punta <b>no llega</b>.`:`${PAS.limMal.map(i=>CORTO_J[i]).join(' y ')} <b>se pasa de su límite de giro</b> en la costura.`); }
    if(PAS.okAlcance&&!PAS.okSing){ let k=0; for(let i=1;i<PAS.pts.length;i++) if(PAS.pts[i].im<PAS.pts[k].im) k=i; const q=PAS.pts[k].q, causa=Math.abs(th5De(q))/RAD<12?'la muñeca casi recta (J5 ≈ '+fN(Math.abs(th5De(q))/RAD,0)+'°)':'el brazo casi estirado'; fil.push(`En el <b>${fN(k/(PAS.pts.length-1)*100,0)} %</b> de la costura el índice de manipulabilidad baja a <b>${fN(PAS.imMin*100,0)} %</b> (se pide al menos ${fN(IM_MIN*100,0)} %): cerca de una <b>singularidad</b>, por ${causa}.`); }
    if(PAS.okAlcance&&!PAS.okVel) fil.push(`${PAS.velMal.map(i=>CORTO_J[i]).join(' y ')} <b>no da la velocidad</b>: pide hasta ${fN(PAS.ratioMax*100,0)} % de su máximo.`);
    if(!PAS.okCiclo) fil.push(`A ${fN(r.v,1)} m/s la pasada tarda ${fN(PAS.T,1)} s y la línea necesita <b>al menos ${fN(E.vTakt,1)} m/s</b> para cumplir su ritmo.`);
    const msg=fil.join(' ')+' ';
    if(RETOS.fallos2>=4){ RETOS.fallos2=0; RETOS.resiembras++; feedback('bad','Cuatro validaciones sin lograrlo',msg+'Cambia la costura.',true); prepararAjusta(); }
    else { feedback('bad','Todavía no',msg+`(validaciones fallidas: ${RETOS.fallos2}/4)`,true); pintaHUD(); }
  }
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const CASOS_DX=[
  {k:'muneca',A:[2.6,1.1,-0.3],B:[2.6,1.3,0.3],incl:-26,yaw:-8.5,hb:0,v:0.8,sint:'Cerca del centro de la zona de trabajo la muñeca se sacude: J4 y J6 giran sin parar en sentidos contrarios mientras la pinza casi no se mueve.'},
  {k:'codo',A:[2.9,1.1,0],B:[3.88,1.1,0],incl:0,yaw:0,hb:0,v:0.5,sint:'Al llegar al fondo de la costura, J2 y J3 se disparan y el brazo casi no avanza.'},
  {k:'alcance',A:[3.4,1.1,-0.7],B:[4.3,1.1,0.7],incl:0,yaw:0,hb:0,v:0.8,sint:'El brazo se estira todo lo que puede, pero la pinza se queda corta: el robot no termina la costura.'},
  {k:'rapida',A:[2.8,1.1,-0.7],B:[2.8,1.1,0.7],incl:-10,yaw:0,hb:0.3,v:3.8,sint:'El robot llega a todas partes y no hay ningún tirón, pero varias articulaciones no dan la velocidad pedida y la pinza se retrasa.'},
];
const NOMBRE_DX={muneca:'La muñeca está recta (J5 ≈ 0)',codo:'El brazo está casi estirado',alcance:'La pieza está fuera del alcance',rapida:'La velocidad de la punta es demasiado alta'};
function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.k; let c; do{ c=pickOne(CASOS_DX); }while(c.k===p);
  GUIA.dx=c; GUIA.dxOk=false; GUIA.orden=barajar(CASOS_DX.map(x=>x.k)); SIM.s=0; SIM.dir=1; SIM.espera=0;
  reiniciaCalculo(true); pintaHUD(); pintaDockFijo();
}
function diagnostica(k){
  if(!GUIA.dx||GUIA.dxOk) return; RETOS.intentos++;
  if(k===GUIA.dx.k){
    GUIA.dxOk=true; RETOS.fallos3=0; sonido.bien();
    feedback('good','Diagnóstico correcto ✓',explicaDx(GUIA.dx.k),true);
    reiniciaCalculo(); pintaDockFijo(); paso('quiz'); iniciaQuiz();
  } else {
    RETOS.fallos3++; sonido.mal();
    if(RETOS.fallos3>=3){ RETOS.fallos3=0; RETOS.resiembras++; feedback('bad','Tres intentos fallidos','Es otro caso: mira en el corte de lado dónde queda la costura y en las curvas del dock dónde cae la facilidad de mover y qué articulaciones pasan de su raya de límite.',true); iniciaDiag(); }
    else { feedback('bad','No es ese',noEs(k)+` (intentos fallidos: ${RETOS.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(k){
  if(k==='muneca') return 'La pinza apunta casi en la dirección del antebrazo: J5 ≈ 0 y los ejes de J4 y J6 coinciden. Sólo cuenta la suma de sus giros; un pequeño cambio de la punta obliga a repartirla de golpe, y J4 y J6 giran enormes en sentidos opuestos. Se evita inclinando la pinza.';
  if(k==='codo') return 'Con el brazo casi estirado el jacobiano casi pierde rango: para ganar unos centímetros hacia fuera, J2 y J3 deben girar cada vez más rápido. Se evita acercando la pieza o subiendo la base.';
  if(k==='alcance') return 'La costura sale del anillo de alcance: el brazo ya está estirado del todo (d = L₂ + L₃) y la punta se queda corta. No es un problema de velocidad ni de singularidad: es de geometría.';
  return 'La forma de la pasada es buena (el índice de manipulabilidad se mantiene alto), pero a esa velocidad varias articulaciones pasan de su límite. Se resuelve bajando la velocidad de la punta, sin olvidar el ritmo mínimo de la línea.';
}
function noEs(k){
  if(k==='muneca') return 'Mira el ángulo de J5 en el dock: aquí la muñeca no queda recta.';
  if(k==='codo') return 'Mira el codo abierto: aquí el brazo no llega a estirarse del todo.';
  if(k==='alcance') return 'Mira el corte de lado: aquí la costura sí queda dentro del color de alcance.';
  return 'Mira la curva de facilidad: aquí cae a cero en algún punto, no es sólo cuestión de velocidad.';
}
const QUIZ=[
  {q:'Con el brazo totalmente estirado, ¿qué pasa con la velocidad que debe tener J2 o J3 para seguir moviendo la punta hacia fuera?',ok:'Se dispara: el jacobiano casi pierde rango y la velocidad articular crece muy rápido al acercarse al brazo recto',mal:['Se vuelve cero: el brazo se detiene solo','Se queda igual: sólo depende de la velocidad de la punta','Baja a la mitad, porque el codo está recto']},
  {q:'Si J5 ≈ 0 (la muñeca queda recta), ¿qué se pierde?',ok:'Un grado de libertad: J4 y J6 giran sobre el mismo eje y sólo importa su suma',mal:['El alcance máximo del robot','La fuerza de los electrodos de cobre','La capacidad de girar la columna (J1)']},
  {q:'¿Para qué sirve la ley de los cosenos en este robot?',ok:'Da el ángulo del codo a partir de la distancia hombro–muñeca y los largos de los dos eslabones',mal:['Calcula la corriente de la soldadura','Mide cuánto pesa la pinza','Decide cuántos puntos de soldadura caben en la costura']},
];
function iniciaQuiz(){ el("feedback").classList.remove("show"); GUIA.quizN=0; cargaPregunta(); }
function cargaPregunta(){ const Q=QUIZ[GUIA.quizN], opts=barajar([Q.ok,...Q.mal]); GUIA.quiz={q:Q.q,opts,ok:opts.indexOf(Q.ok)}; GUIA.quizResp=-1; GUIA.quizCorrecta=GUIA.quiz.ok; pintaHUD(); }
function respondeQuiz(i){
  if(GUIA.quizResp>=0) return; GUIA.quizResp=i; const ac=i===GUIA.quiz.ok; if(ac) RETOS.quizAcierto++;
  if(ac) sonido.bien(); else sonido.mal();
  const ult=GUIA.quizN>=QUIZ.length-1;
  feedback(ac?'good':'bad',ac?'Correcto ✓':'No es esa',(ac?'':'La respuesta era: <b>'+GUIA.quiz.opts[GUIA.quiz.ok]+'</b>. ')+(ult?'Terminaste el laboratorio.':'Sigue con la siguiente.'),true);
  pintaHUD();
  if(ult){ RETOS.hecho=true; paso('completo'); }
}
function siguientePregunta(){ if(GUIA.quizN<QUIZ.length-1){ GUIA.quizN++; cargaPregunta(); } }

/* ---------- el enrutador de acciones ---------- */
function paso(p){ GUIA.paso=p; GUIA.phase=({calcula:0,ajusta:1,diag:2,quiz:2,completo:2})[p]; if(EST.modo==='reto'){ reiniciaCalculo(true); pintaHUD(); } }
function handleAction(act,btn){
  switch(act){
    case 't-sig': tourParaAuto(); tourVa(TOUR.paso+1); break;
    case 't-atras': tourParaAuto(); tourVa(TOUR.paso-1); break;
    case 't-fin': tourParaAuto(); setMode('probar'); break;
    case 'check-v': checkCalcula(); break;
    case 'hint-v': { const r=GUIA.r1;
      const T=r.tipo;
      if(RETOS.pistas===0){ RETOS.pistas=1; feedback('good','Pista 1 de 2',T==='codo'?'La ley de los cosenos: <b>d² = L₂² + L₃² + 2·L₂·L₃·cos φ</b>.':(T==='tope'?'Dibuja las dos barras en línea recta y luego una sobre otra.':'La punta gira en un círculo de radio ρ: <b>v = ω · ρ</b>.')); }
      else if(RETOS.pistas===1){ RETOS.pistas=2; feedback('good','Pista 2 de 2',T==='codo'?'Despeja: <b>φ = arccos((d² − L₂² − L₃²) / (2·L₂·L₃))</b>, en grados.':(T==='tope'?'Estirado: <b>L₂ + L₃</b>. Plegado: <b>|L₃ − L₂|</b>.':'Pasa ω a rad/s: <b>1° = 0,01745 rad</b>.')); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break; }
    case 'validar': validarAjusta(); break;
    case 'dx-muneca': diagnostica('muneca'); break; case 'dx-codo': diagnostica('codo'); break; case 'dx-alcance': diagnostica('alcance'); break; case 'dx-rapida': diagnostica('rapida'); break;
    case 'quiz-0': respondeQuiz(0); break; case 'quiz-1': respondeQuiz(1); break; case 'quiz-2': respondeQuiz(2); break; case 'quiz-3': respondeQuiz(3); break;
    case 'quiz-sig': siguientePregunta(); break;
    case 'restart': location.reload(); break;
  }
}

/* ---------- lo que la guía enseña en cada paso ---------- */
function contenidoGuia(){
  const tri=(n,v,m)=>`<span class="tries">intentos fallidos: <b id="${n}">${v}</b>/${m}</span>`;
  switch(GUIA.paso){
    case 'calcula': { const r=GUIA.r1; let teach, title;
      if(r.tipo==='codo'){ title='¿Cuánto se abre el codo?'; teach=`Las dos barras del brazo miden <b>L₂ = ${fN(L2,2)} m</b> y <b>L₃ = ${fN(L3,2)} m</b>. La muñeca debe quedar a <b>d = ${fN(r.d,2)} m</b> del hombro.<div class="task">¿Qué ángulo φ (grados) separa las dos barras? (φ = 0: estiradas) ${tri('d_try',RETOS.fallos1,3)}</div>`; }
      else if(r.tipo==='tope'){ title=r.cual==='max'?'¿Hasta dónde llega la muñeca?':'¿Qué tan cerca puede llegar la muñeca?'; teach=`Las dos barras miden <b>L₂ = ${fN(L2,2)} m</b> y <b>L₃ = ${fN(L3,2)} m</b>.<div class="task">${r.cual==='max'?'Con el brazo totalmente estirado':'Con el brazo plegado del todo'}, ¿a qué distancia (m) del hombro queda la muñeca? ${tri('d_try',RETOS.fallos1,3)}</div>`; }
      else { title='¿Qué tan rápido va la punta?'; teach=`J1 gira la columna a <b>${fN(r.w,0)} °/s</b> y la punta está a <b>${fN(r.rho,1)} m</b> del eje.<div class="task">¿Qué velocidad lineal (m/s) lleva la punta? ${tri('d_try',RETOS.fallos1,3)}</div>`; }
      return {no:'Fase 1 · Reto 1',head:'Tu cálculo',title,teach,
      acts:`<div class="calcrow"><input id="ansV" type="text" inputmode="decimal" autocomplete="off" placeholder="¿? ${unidad1(r)}" aria-label="Tu resultado"><button class="b primary" data-act="check-v">✓ Comprobar</button></div><button class="pista" id="btnHint">¿Necesitas una pista? (máx. 2)</button>`}; }
    case 'ajusta': { const r=GUIA.r2; if(!r) return {no:'Fase 2 · Reto 2',head:'Tu ajuste',title:'Preparando la celda…',teach:'',acts:''};
      return {no:'Fase 2 · Reto 2',head:'Tu ajuste',title:'Planea la costura',
      teach:`Soldar <b>${r.esc.nombre.toLowerCase()}</b> (${fN(r.esc.Lc,1)} m de largo), con la pinza fija. Pide que el robot <b>llegue a todo el recorrido</b>, que <b>no pase cerca de una singularidad</b>, que <b>ninguna articulación pase de su velocidad máxima</b> y que la línea no se atrase.<div class="why"><b>Ojo:</b> el veredicto y las curvas de velocidad aparecen al validar. ${tri('d_try2',RETOS.fallos2,4)}</div>`,
      acts:`${mandosReto(r)}<button class="b primary" data-act="validar">▶ Validar</button>`}; }
    case 'diag': { const ord=GUIA.orden||CASOS_DX.map(x=>x.k);
      return {no:'Fase 3 · Diagnóstico',head:'¿Qué le pasa?',title:'Averigua por qué falla esta pasada',
      teach:`Síntoma: «${GUIA.dx?GUIA.dx.sint:'…'}»<div class="task">¿Cuál es la causa? ${tri('d_try3',RETOS.fallos3,3)}</div>`,
      acts:ord.map(k=>`<button class="b" data-act="dx-${k}">${NOMBRE_DX[k]}</button>`).join('')}; }
    case 'quiz': { const Q=GUIA.quiz; if(!Q) return {no:'',head:'',title:'',teach:'',acts:''}; const ya=GUIA.quizResp>=0;
      return {no:'Cierre · Pregunta '+(GUIA.quizN+1)+' de '+QUIZ.length,head:'Quiz',title:Q.q,teach:'',
      acts:Q.opts.map((o,i)=>`<button class="b ${ya?(i===Q.ok?'good':(i===GUIA.quizResp?'bad':'')):''}" data-act="quiz-${i}" ${ya?'disabled':''}>${o}</button>`).join('')+(ya&&GUIA.quizN<QUIZ.length-1?'<button class="b primary" data-act="quiz-sig">Siguiente →</button>':'')}; }
    case 'completo': return {no:'Laboratorio completado',head:'✓',title:'Calculaste, planeaste y diagnosticaste',
      teach:`Acertaste ${RETOS.quizAcierto} de ${QUIZ.length} en el quiz. Vuelve a <b>Probar</b>, activa «Otra solución» y arrastra la bola cerca del borde del alcance: mira cómo cambia el codo y qué pasa con las velocidades.`,
      acts:`<button class="b primary" data-act="restart">↺ Reiniciar laboratorio</button>`};
  }
  return {no:'',head:'',title:'',teach:'',acts:''};
}
function htmlGuia(){
  const ps=['Calcula','Ajusta','Diagnostica'], C=contenidoGuia();
  const ok=i=>i<GUIA.phase||(i===2&&RETOS.hecho);
  return `<div class="pasos">${ps.map((t,i)=>`<span class="ps ${ok(i)?'ok':(i===GUIA.phase?'on':'')}"><i>${ok(i)?'✓':i+1}</i>${t}</span>`).join('')}</div>
  <div class="retoBox"><div class="rt"><span>${C.no}</span><span>${C.head}</span></div><h3>${C.title}</h3><div class="rq">${C.teach}</div><div class="opt" id="actOpt">${C.acts}</div></div>`;
}
/** Lo que corre en la celda en cada paso del reto (null: lo que digan los mandos). */
function guiaParams(){
  if(GUIA.paso==='calcula') return PU([2.5,1.25,0.35],0,0,'arriba',0,{},{T:9,rx:0.30,ry:0.22,rz:0.40,fase:0});

  if((GUIA.paso==='diag'||GUIA.paso==='quiz'||GUIA.paso==='completo')&&GUIA.dx){ const c=GUIA.dx; return descCustom(c.A,c.B,c.incl,c.yaw,c.hb,c.v); }

}
/* ---------- los modos ---------- */
function setMode(m,forzar){
  if(!forzar&&(m===EST.modo||EST.autoRunning)) return;

  else if(m==='probar') EST.modo='probar';

  el('feedback').classList.remove('show');
  SIM.s=0; SIM.dir=1; SIM.espera=0;

  reiniciaCalculo(true); ponVista('celda',0.6); pintaHUD(); pintaDockFijo(); pintaBarras();
}

/* ---------- «Repetir el recorrido»: el mismo recorrido, pero avanza solo cada pocos segundos ---------- */
async function runAuto(){
  if(EST.autoRunning) return; EST.autoRunning=true; sonido.init(); TOUR.auto=true;
  EST.modo='tour'; document.body.classList.remove('m-probar','m-reto'); document.body.classList.add('m-tour'); tourVa(0,0.6); pintaBarras();
  const avanza=()=>{ if(!TOUR.auto) return; if(TOUR.paso>=TOUR_PASOS.length-1){ tourParaAuto(); return; } tourVa(TOUR.paso+1); TOUR.timer=setTimeout(avanza,9000); };
  TOUR.timer=setTimeout(avanza,9000);
}

/* ===================== 19. CÁMARAS =====================
   La escena se encuadra con el hueco que dejan la guía y el dock: la cámara se aleja lo justo para que la caja del
   «objeto» (ancho × alto en metros) quepa entera en ese hueco, y la proyección se desplaza para centrarla en él.
   Además el objeto nunca pasa del 80 % del alto del lienzo. */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}
const anclaCelda=()=>V3(1.65,1.35+ROBOT.hb*0.5,0);
const anclaLado=()=>V3(1.7,1.4+ROBOT.hb*0.5,0);
const anclaArriba=()=>V3(1.7,0,0);
const anclaPinza=()=>mundoDe(LIVE.tcp);
const VISTAS={
  celda:{dir:V3(0.66,0.30,0.69),anc:anclaCelda,toff:V3(0,0,0),obj:()=>({w:3.6,h:2.55}),fov:34,tope:0.80},
  lado:{dir:V3(0.03,0.07,1),anc:anclaLado,toff:V3(0,0,0),obj:()=>({w:4.0,h:2.8}),fov:34,tope:0.80},
  arriba:{dir:V3(0.001,1,0.10),anc:anclaArriba,toff:V3(0,0,0),obj:()=>({w:5.4,h:5.0}),fov:34,tope:0.9},
  pinza:{dir:V3(0.50,0.26,0.82),anc:anclaPinza,toff:V3(0,0,0),obj:()=>({w:1.9,h:1.5}),fov:34,tope:0.74},
};
const CAM={off:V3(3,6,5),toff:V3(0,0,0),auto:true,previo:null,k:1,dur:1,psi:0};
const dirVista=v=>VISTAS[v].dir.clone();
function fovVista(v){ return innerWidth<innerHeight*0.9?46:VISTAS[v].fov; }
function distanciaFit(w,h,fov,tope){
  const Hu=huecoLibre(), W=innerWidth, Hh=innerHeight, tv=Math.tan(fov*Math.PI/360), th=tv*(W/Hh);
  const wF=Math.max(80,Hu.x1-Hu.x0)/W, hF=Math.max(80,Hu.y1-Hu.y0)/Hh;
  const D=1.06*Math.max(w/(2*th*wF),h/(2*tv*hF));
  return Math.max(D,h/(2*tv*(tope||0.66)));
}
function ofsDeseado(v){
  const V=VISTAS[v], o=V.obj(), fov=fovVista(v), D=distanciaFit(o.w,o.h,fov,V.tope);
  return {off:dirVista(v).normalize().multiplyScalar(D),toff:V.toff.clone(),fov};
}
function ponVista(v,dur){
  EST.vista=v; CAM.auto=true; CAM.dur=dur===undefined?1.0:dur;
  if(typeof pintaBarras==='function') pintaBarras();
  if(CAM.dur<=0.01){ const A=VISTAS[v].anc(), d=ofsDeseado(v); CAM.off.copy(d.off); CAM.toff.copy(d.toff); camera.fov=d.fov; camera.updateProjectionMatrix();
    camera.position.copy(A).add(CAM.off); controls.target.copy(A).add(CAM.toff); CAM.previo=A.clone(); }
}
function pasaCam(dt){
  const V=VISTAS[EST.vista], P=V.anc();
  if(CAM.auto){
    const d=ofsDeseado(EST.vista), k=1-Math.exp(-dt/Math.max(0.05,(CAM.dur||1)*0.30));
    CAM.off.lerp(d.off,k); CAM.toff.lerp(d.toff,k);
    if(Math.abs(camera.fov-d.fov)>0.05){ camera.fov+=(d.fov-camera.fov)*k; camera.updateProjectionMatrix(); }
    camera.position.copy(P).add(CAM.off); controls.target.copy(P).add(CAM.toff);
  } else if(CAM.previo){ const dP=P.clone().sub(CAM.previo); camera.position.add(dP); controls.target.add(dP); }
  CAM.previo=P.clone();
}
controls.addEventListener('start',()=>{ CAM.auto=false; });

/* ===================== 20. SONIDO (sintetizado) =====================
   Un zumbido de servomotores cuyo tono sube con la velocidad articular que exige la pasada (muy atenuado) y los avisos de acierto y fallo. */
const sonido=(function(){
  let ctx=null,on=true,master=null,ult=0,zum=null,zg=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      zum=ctx.createOscillator(); zg=ctx.createGain(); zum.type='sawtooth'; zum.frequency.value=90; zg.gain.value=0; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420; zum.connect(lp); lp.connect(zg); zg.connect(master); zum.start();
    }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); ult=f; }
  return {init,
    zumbido:(q)=>{ if(!ctx||!zum) return; const t=ctx.currentTime; zum.frequency.setTargetAtTime(80+clamp(q,0,2)*160,t,0.15); zg.gain.setTargetAtTime(on&&q>0.02?0.006:0,t,0.15); },
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }, get freq(){ return ult; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});

/* ===================== 21. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.max(Math.min(devicePixelRatio,alta?2:1.5),Math.min(devicePixelRatio,1.5)>1?1.25:1));
  renderer.shadowMap.enabled=alta; LUZ.sol.castShadow=alta;
  scene.traverse(o=>{ if(o.material) o.material.needsUpdate=true; });
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); if(typeof ponVista==='function'&&CALC) ponVista(EST.vista,0.001); centraEnHueco();
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 22. EL LAZO: UN SOLO RELOJ =====================
   El tiempo avanza dt·velocidad·(cámara lenta) en cada cuadro, y con ESE tiempo se mueven la punta, el robot, las lecturas y el cursor de las
   gráficas del dock. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0, tSon=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  const dtS=EST.pausa?0:dt, dtSim=dtS*EST.vel*LENTO;
  aplicaEscena(dtS,dtSim,dt);
  pasaCam(dt);
  if(t-tSon>0.4){ tSon=t; sonido.zumbido(!EST.pausa&&LIVE.ratios&&CALC&&CALC.d.tipo==='pasada'?clamp(LIVE.rmax,0,2):0); }
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaGraficas(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos(); colocaFoco();
}

/* ===================== 23. ARRANQUE =====================
   Abre funcionando y con el recorrido en el paso 1: el robot ya sigue la bola naranja por su órbita, antes de que el alumno toque nada. */
disposicion();

/* ===================== 24. GANCHOS DE PRUEBA ===================== */
/** Mide el robot en lo VISIBLE: se pinta sólo el robot sobre magenta puro y se toma la caja de los píxeles que no son magenta. */
function mideObjeto(modo){
  const ocultos=[]; MUNDO.children.forEach(o=>{ if(o!==ROBOT.grupo&&o.visible){ o.visible=false; ocultos.push(o); } });
  if(modo==='escena'){ ocultos.forEach(o=>o.visible=true); ocultos.length=0; }
  const bg=scene.background, fog=scene.fog; scene.background=null; scene.fog=null; renderer.setClearColor(0xff00ff,1);
  renderer.render(scene,camera);
  const c=renderer.domElement, W=c.width, H=c.height, t=document.createElement('canvas'); t.width=W; t.height=H; const g=t.getContext('2d',{willReadFrequently:true}); g.drawImage(c,0,0);
  const d=g.getImageData(0,0,W,H).data; let x0=1e9,x1=-1,y0=1e9,y1=-1;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=(y*W+x)*4; if(!(d[i]>235&&d[i+1]<30&&d[i+2]>235)){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  for(const o of ocultos) o.visible=true; scene.background=bg; scene.fog=fog; renderer.setClearColor(0x000000,1);
  const k=W/innerWidth; return {x0:x0/k,x1:x1/k,y0:y0/k,y1:y1/k,altoPx:(y1-y0)/k,anchoPx:(x1-x0)/k,fracAlto:(y1-y0)/H,fracAncho:(x1-x0)/W,hueco:huecoLibre(),W:innerWidth,H:innerHeight};
}
