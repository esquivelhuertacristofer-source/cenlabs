  // apunta, y con la escala arrancando en 0,94 unas barras medidas desde cero
  // llenan el recuadro entero y parecen enormes aunque todos vayan iguales.
  // Y encima de cada barra va un punto, para que un reparto perfecto —barras de
  // altura nula— siga viéndose en vez de dejar la gráfica vacía.
  const anchoB=Math.min(34,P.w/(e.nCil*1.7));
  enCaja(P,()=>{
    s.cil.forEach(c=>{
      const y0=M.Y(V.obj), y1=M.Y(c.lam);
      bx.save(); bx.fillStyle=colLam(c.lam);
      bx.fillRect(M.X(c.i+1)-anchoB/2,Math.min(y0,y1),anchoB,Math.abs(y1-y0));
      bx.restore();
      punteo(M,c.i+1,c.lam,colLam(c.lam),5);
    });
  });
  nivel(P,M,V.obj,'#8AB4F8','objetivo '+lamT(V.obj));
  const disp=Math.max(...lams)-Math.min(...lams);
  texto('dispersión '+num(disp,3)+(disp<1e-6?'  ·  los cilindros van iguales':'  ·  la sonda sólo ve la MEZCLA de todos'),
    X,634,{s:12.5,c:disp>DISP_MIN?WARN_HEX:'#8c98a9'});

  // Debajo de la cadena queda hueco: ahí va lo que la cadena no dice por sí sola,
  // que es contra QUÉ objetivo hay que juzgar la mezcla en este punto de trabajo.
  rpanel(42,556,W,104,'rgba(255,255,255,0.03)','#1c2534',10);
  texto(s.lazoAbierto?'Objetivo con el lazo abierto':'Objetivo con el lazo cerrado',
    60,582,{s:14,b:true,c:CIAN});
  wrapText(s.lazoAbierto
    ? ('Por encima del '+pc(e.acelPotencia*100,0)+' de acelerador la centralita deja de mirar la sonda y enriquece ×'+
       num(s.enriq,2)+' para proteger el motor: aquí el objetivo es lambda '+lamT(V.obj)+', no uno. Sale '+
       lamT(s.lam)+', que se aparta '+num(V.desv,3)+'.')
    : ('Con el lazo cerrado el objetivo es lambda uno, porque es la única mezcla con la que el catalizador de tres vías trabaja. '+
       'Sale '+lamT(s.lam)+', que se aparta '+num(V.desv,3)+' de ese uno; la banda que este banco da por buena es ±'+num(BANDA_LAM,2)+'.'),
    60,604,W-36,19,{s:13,c:'#9aa6b6'});

  // --- veredicto
  const nivelV=V.malo?(V.miente||!V.enBanda?'bad':'warn'):'good';
  const rot=V.lazoAbierto
    ? (V.enBanda?'Lazo abierto y mezcla de potencia correcta':'Lazo abierto y la mezcla NO es la que protege el motor')
    : (V.miente?'La sonda miente y la centralita la cree'
      :(V.enBanda?'Mezcla centrada en el estequiométrico':'La mezcla no está donde debería'));
  const txt=V.lazoAbierto
    ? ('Con el pie a fondo la centralita deja de mirar la sonda y enriquece '+num(s.enriq,2)+
       ' veces para proteger el motor: el objetivo aquí es lambda '+lamT(V.obj)+', no uno. Sale '+
       lamT(s.lam)+', que se aparta '+num(V.desv,3)+'. Sin sonda que corrija, cualquier error de MEDIDA del aire pasa entero a la mezcla.')
    : (V.miente
      ? ('La centralita ha hecho su trabajo: ha movido el ajuste hasta que la sonda dice uno. Pero la sonda dice '+
         lamT(s.lamSonda)+' cuando la mezcla real es '+lamT(s.lam)+', así que la mezcla real acaba donde no debe. '+
         'El escáner sale '+(Math.abs(s.ajustePct)>=DTC_UMBRAL*100?'con ajuste alto':'impecable')+' y el analizador de gases, no.')
      : ('El lazo ha centrado la mezcla en '+lamT(s.lam)+' con un ajuste largo de '+firm(s.ajustePct,1)+
         '. Ese ajuste es la MEDIDA de lo que falla aguas arriba: cuanto más lejos de cero, más lejos está la centralita de acertar a la primera.'));
  banda(676,nivelV,rot,txt);
}

// ----------------------------------------------------------- 2 · CARGA DE AIRE
function vistaAire(){
  const e=MQ(), s=EST(), sn=EST({falla:'sano'}), F=FA();
  cabecera('La carga de aire: lo que entra y lo que se mide',
    'La masa de aire de un cilindro sale del volumen que desplaza, de la densidad que hay en el colector y del rendimiento volumétrico. '+
    'La presión del colector NO es un mando: es la consecuencia de la mariposa y del régimen, y a mariposa cerrada subir de vueltas la BAJA.');

  texto('Presión del colector contra el régimen',42,150,{s:15,b:true,c:CIAN});
  const P1={x:104,y:186,w:398,h:206};
  const techo=e.pMax===undefined?e.pAtm:e.pMax;
  const M1=ejes(P1,600,6000,0,Math.max(1.10,techo*1.06),'régimen (rpm)','presión absoluta (bar)',
    v=>num(v,0),v=>num(v,1),6,4);
  const ACEL=[[0,'#5BD4E5'],[0.2,'#8AB4F8'],[0.35,'#7CD992'],[0.6,'#E9C46A'],[1,'#F2A65A']];
  enCaja(P1,()=>{
    for(const [a,c] of ACEL){
      const pts=[]; for(let r=600;r<=6000;r+=100) pts.push([r,presionColector(e,r,a,F)]);
      serieXY(M1,pts,c,2.2);
    }
    punteo(M1,G.rpm,s.map,'#ffffff',5.4);
  });
  nivel(P1,M1,e.pAtm,'#6d788a','atmosférica',[4,4]);
  leyenda(P1.x+14,P1.y+22,ACEL.map(([a,c])=>['acelerador '+pc(a*100,0),c]));

  texto('Masa de aire por cilindro y ciclo',530,150,{s:15,b:true,c:CIAN});
  const P2={x:592,y:186,w:390,h:206};
  const serieR=[], serieM=[];
  for(let a=0;a<=1.0001;a+=0.025){
    const mp=presionColector(e,G.rpm,a,F);
    serieR.push([a*100,aireReal(e,G.rpm,mp,G.Tadm,F)*1000]);
    serieM.push([a*100,aireMedido(e,G.rpm,mp,G.Tadm,F)*1000]);
  }
  const tope=Math.max(...serieR.map(p=>p[1]),...serieM.map(p=>p[1]))*1.10;
  const M2=ejes(P2,0,100,0,tope,'acelerador (%)','masa de aire (mg)',v=>num(v,0),v=>num(v,0),5,4);
  enCaja(P2,()=>{
    serieXY(M2,serieR,'#7CD992',2.6);
    serieXY(M2,serieM,'#F2A65A',2.2,[7,5]);
    punteo(M2,G.acel*100,s.mAireCil*1000,'#ffffff',5.4);
  });
  leyenda(P2.x+14,P2.y+22,[['la que entra de verdad','#7CD992'],['la que mide el sensor','#F2A65A',[7,5]]]);

  const dif=(s.mMedido/s.mAireCil-1)*100;
  const rows=[
    {v:['Presión del colector',bar(s.map,3),bar(sn.map,3)]},
    {v:['Rendimiento volumétrico',pc(s.etaVol*100,1),pc(sn.etaVol*100,1)]},
    {v:['Aire que entra, por ciclo',mg(s.mAireCil*1000,2),mg(sn.mAireCil*1000,2)]},
    {v:['Aire que mide el sensor',mg(s.mMedido*1000,2),mg(sn.mMedido*1000,2)]},
    {v:['Diferencia medido − real',[firm(dif,2),Math.abs(dif)>0.5?WARN_HEX:OK_HEX],
      firm((sn.mMedido/sn.mAireCil-1)*100,2)]},
    {v:['Gasto total de aire',gs(s.mAireSeg,2),gs(sn.mAireSeg,2)]},
  ];
  tabla(42,478,[{t:'magnitud',w:340},{t:'con este escenario',w:250,al:'right',mono:true},
    {t:'motor sano, mismo punto',w:270,al:'right',mono:true}],rows,{rh:25,s:13.5});

  const nivelA=Math.abs(dif)>0.5?'warn':'good';
  banda(676,nivelA,
    Math.abs(dif)>0.5?'El sensor y el motor no cuentan lo mismo':'El sensor cuenta el aire que entra',
    Math.abs(dif)>0.5
      ? ('En este punto el sensor se aparta '+firm(dif,2)+' del aire que de verdad entra. La centralita dosifica sobre lo que MIDE, '+
         'así que ese error va entero a la mezcla y la sonda tiene que taparlo con el ajuste largo. '+
         'Un caudal de fuga constante pesa mucho a ralentí y casi nada a plena carga; un sensor sucio se equivoca en el mismo porcentaje siempre. '+
         'Esa diferencia de FORMA contra la carga es lo único que las separa.')
      : ('Aquí no hay aire sin contar: lo que mide el sensor es lo que entra. Si aun así la mezcla no sale bien, el fallo está aguas abajo —en el inyector, en el riel o en la sonda—, no en la medida del aire.'));
}

// -------------------------------------------------------------- 3 · EL INYECTOR
function vistaInyector(){
  const e=MQ(), s=EST(), sn=EST({falla:'sano'}), F=FA(), V=veredicto();
  cabecera('El inyector: cuánto entrega y en cuánto tiempo',
    'Un inyector es una válvula que se abre un rato. Lo que entrega es su caudal por el tiempo que está ABIERTO, y ése no es el que la centralita ordena: '+
    'hay que descontar lo que tarda en abrir, que crece muy deprisa cuando cae la tensión de batería. El caudal, además, escala con la RAÍZ de la caída de presión.');

  texto('Ciclo de trabajo contra el régimen',42,150,{s:15,b:true,c:CIAN});
  const P1={x:104,y:186,w:398,h:198};
  const M1=ejes(P1,600,6000,0,100,'régimen (rpm)','ciclo de trabajo (%)',v=>num(v,0),v=>num(v,0),6,5);
  const CG=[[0.15,'#5BD4E5'],[0.35,'#7CD992'],[0.6,'#E9C46A'],[1,'#F2A65A']];
  enCaja(P1,()=>{
    // Paso de 200 rpm y no de 100: cada punto resuelve un lazo completo por
    // bisección, y doblar la resolución dobla el coste de repintar sin añadir
    // una sola inflexión que la curva no tenga ya.
    for(const [a,c] of CG){
      const pts=[];
      for(let r=600;r<=6000;r+=200){ const p=EST({rpm:r,acel:a}); pts.push([r,p.ciclo]); }
      serieXY(M1,pts,c,2.2);
    }
    punteo(M1,G.rpm,s.ciclo,'#ffffff',5.4);
  });
  nivel(P1,M1,CICLO_TECHO,BAD_HEX,'techo '+pc(CICLO_TECHO,0));
  leyenda(P1.x+14,P1.y+22,CG.map(([a,c])=>['acelerador '+pc(a*100,0),c]));

  texto('Tiempo muerto contra la tensión de batería',530,150,{s:15,b:true,c:CIAN});
  const P2={x:606,y:186,w:376,h:198};
  const M2=ejes(P2,8,16,0,2.6,'tensión de batería (V)','tiempo muerto (ms)',v=>num(v,0),v=>num(v,1),4,4);
  enCaja(P2,()=>{
    const pts=[]; for(let v=8;v<=16.001;v+=0.1) pts.push([v,tMuerto(v)]);
    serieXY(M2,pts,'#C08CF8',2.6);
    TABLA_TMUERTO.forEach(([v,t])=>punteo(M2,v,t,'#C08CF8',3.6));
    punteo(M2,vBatEfectiva(),s.tMuerto,'#ffffff',5.4);
  });
  texto('los puntos son la tabla del catálogo; entre ellos se interpola',P2.x+8,P2.y+P2.h-12,{s:11.5,c:'#7b8697'});

  const dp=s.dpInyector;
  const rows=[
    {v:['Presión del riel',bar(e.pRiel*(F.pRielMul===undefined?1:F.pRielMul),2),bar(e.pRiel,2)]},
    {v:['Caída a través del inyector',bar(dp,2),bar(sn.dpInyector,2)]},
    {v:['Caudal con el inyector abierto',gs(s.qInyector,3),gs(sn.qInyector,3)]},
    {v:['Tiempo que ordena la centralita',mili(s.tOrden,3),mili(sn.tOrden,3)]},
    {v:['Tiempo muerto',mili(s.tMuerto,3),mili(sn.tMuerto,3)]},
    {v:['Tiempo de verdad abierto',mili(s.tAbierto,3),mili(sn.tAbierto,3)]},
    {v:['Ciclo de trabajo',[pc(s.ciclo,1),V.sinMargenInyector?BAD_HEX:TINTA],pc(sn.ciclo,1)]},
  ];
  tabla(42,462,[{t:'magnitud',w:330},{t:'con este escenario',w:250,al:'right',mono:true},
    {t:'motor sano, mismo punto',w:280,al:'right',mono:true}],rows,{rh:24,s:13.5});

  const relQ=s.qInyector/sn.qInyector, relP=dp/sn.dpInyector;
  banda(676,V.sinMargenInyector?'bad':'good',
    V.sinMargenInyector?'El inyector ya no tiene dónde crecer'
      :(e.referenciado?'Regulador referenciado al vacío: la caída es constante'
        :'Sin retorno: la caída sube con el vacío del colector'),
    (e.referenciado
      ? 'Con el regulador referenciado al colector, la caída a través del inyector no cambia con la carga: el mismo pulso entrega siempre lo mismo. '
      : 'Sin retorno, el riel está a presión fija contra la atmósfera, así que a ralentí —con vacío— la caída SUBE y el mismo pulso entrega más. La centralita lo sabe y lo compensa. ')+
    'Aquí la caída va '+num(relP,3)+' veces la del motor sano y el caudal, '+num(relQ,3)+
    ': el caudal escala con la raíz de la presión, no con la presión. '+
    (V.sinMargenInyector
      ? 'Y con el ciclo en '+pc(s.ciclo,1)+' ya no queda pulso que alargar: pedir más combustible aquí es imposible.'
      : 'Queda margen de pulso hasta el '+pc(CICLO_TECHO,0)+'.'));
}

// ----------------------------------------------------------------- 4 · LA SONDA
function vistaSonda(){
  const s=EST();
  // La cifra de la zona ciega NO se escribe a mano: se pide a la misma curva
  // que dibuja la gráfica, para que recalibrar la sonda no deje la frase
  // mintiendo en silencio.
  const CIEGO_A=0.80, CIEGO_B=0.90;
  const dV=Math.abs(tensionSonda(CIEGO_A)-tensionSonda(CIEGO_B));
  const carrera=V_RICA-V_POBRE;
  const dVsalto=Math.abs(tensionSonda(0.99)-tensionSonda(1.01));

  cabecera('La sonda de banda estrecha no mide la mezcla',
    'Es una celda de circonia: da la tensión de Nernst entre el oxígeno del escape y el del aire. '+
    'Su curva es casi vertical en el estequiométrico y casi plana a los dos lados, así que sirve para detectar un CRUCE y no para medir una mezcla.');

  const P={x:110,y:180,w:520,h:266};
  const M=ejes(P,0.78,1.26,0,1.0,'lambda de los gases','tensión de la sonda (V)',
    v=>num(v,2),v=>num(v,1),6,5);
  enCaja(P,()=>{
    // La zona ciega, sombreada: entre 0,80 y 0,90 la tensión no se mueve.
    bx.save(); bx.fillStyle='rgba(255,107,107,0.10)';
    bx.fillRect(M.X(CIEGO_A),P.y,M.X(CIEGO_B)-M.X(CIEGO_A),P.h); bx.restore();
    const pts=[]; for(let l=0.78;l<=1.2601;l+=0.002) pts.push([l,tensionSonda(l)]);
    serieXY(M,pts,'#5BD4E5',2.8);
    // Lo que hay y lo que la sonda dice que hay: si no coinciden, se ven los dos.
    linea([[M.X(s.lam),P.y],[M.X(s.lam),P.y+P.h]],colLam(s.lam),1.8,[6,5]);
    if(s.mienteSonda) linea([[M.X(s.lamSonda),P.y],[M.X(s.lamSonda),P.y+P.h]],BAD_HEX,1.8,[3,4]);
    punteo(M,s.lamSonda,s.vSonda,'#ffffff',5.6);
  });
  nivel(P,M,UMBRAL_CRUCE,'#E9C46A','umbral de cruce '+num(UMBRAL_CRUCE*1000,0)+NBSP+'mV');
  etiqueta('zona ciega',M.X(CIEGO_A)+8,P.y+24,BAD_HEX);
  etiqueta('lambda real '+lamT(s.lam),M.X(s.lam)+8,P.y+P.h-14,colLam(s.lam));
  if(s.mienteSonda) etiqueta('lo que la sonda dice: '+lamT(s.lamSonda),M.X(s.lamSonda)+8,P.y+P.h-38,BAD_HEX);

  // La columna arranca en 652 y no en 676: con las anchuras de antes la tabla
  // terminaba en 996 y el pizarrón acaba en 982, así que la columna de valores
  // se salía por el borde derecho y las cifras aparecían cortadas.
  const X=652;
  texto('Lo que se lee ahora',X,166,{s:15,b:true,c:CIAN});
  tabla(X,194,[{t:'magnitud',w:180},{t:'valor',w:116,al:'right',mono:true}],[
    {v:['Lambda real',[lamT(s.lam),colLam(s.lam)]]},
    {v:['Lambda que lee',[lamT(s.lamSonda),s.mienteSonda?BAD_HEX:TINTA]]},
    {v:['Tensión',num(s.vSonda*1000,0)+NBSP+'mV']},
    {v:['Dice que está',regimenLam(s.lamSonda)==='rica'?'rica':(regimenLam(s.lamSonda)==='pobre'?'pobre':'en el punto')]},
    {v:['Y de verdad está',[regimenLam(s.lam)==='rica'?'rica':(regimenLam(s.lam)==='pobre'?'pobre':'en el punto'),colLam(s.lam)]]},
  ],{rh:25,s:13.5});

  texto('La zona ciega, en números',X,368,{s:15,b:true,c:CIAN});
  tabla(X,396,[{t:'tramo de lambda',w:180},{t:'se mueve',w:116,al:'right',mono:true}],[
    {v:['de '+num(CIEGO_A,2)+' a '+num(CIEGO_B,2),[num(dV*1000,2)+NBSP+'mV',BAD_HEX]]},
    {v:['eso, de su carrera',[pc(dV/carrera*100,2),BAD_HEX]]},
    {v:['de 0,99 a 1,01',[num(dVsalto*1000,0)+NBSP+'mV',OK_HEX]]},
    {v:['eso, de su carrera',[pc(dVsalto/carrera*100,1),OK_HEX]]},
  ],{rh:25,s:13.5});

  banda(600,s.mienteSonda?'bad':'good',
    s.mienteSonda?'Esta sonda está mintiendo':'La sonda dice lo que hay',
    'Un motor que va a lambda '+num(CIEGO_A,2)+' —un 20 % rico, humo negro y catalizador arruinado— y otro a '+
    num(CIEGO_B,2)+' le dan a la centralita tensiones que se diferencian en '+num(dV*1000,2)+NBSP+'mV: el '+
    pc(dV/carrera*100,2)+' de su carrera. En cambio, entre 0,99 y 1,01 recorre '+num(dVsalto*1000,0)+NBSP+'mV. '+
    (s.mienteSonda
      ? 'Aquí la sonda lee '+lamT(s.lamSonda)+' cuando hay '+lamT(s.lam)+
        ', y la centralita no tiene forma de saberlo: hace exactamente lo que la sonda le pide y acaba con la mezcla donde no debe.'
      : 'Por eso una sonda sirve para centrar el lazo y NO sirve para medir cuánto de rica o de pobre va una mezcla: eso lo dice el analizador de gases o una sonda de banda ancha.'));
}

// -------------------------------------------------------- 5 · EL LAZO EN EL TIEMPO
function vistaLazo(){
  const e=MQ(), s=EST();
  cabecera('El lazo cerrado en el tiempo',
    'Como la sonda sólo dice de qué lado está la mezcla, el ajuste corto no puede quedarse quieto: al cruzar da un salto en sentido contrario y después una rampa lenta hasta el cruce siguiente. '+
    'La velocidad de esa oscilación la fijan el viaje de los gases hasta la sonda y la constante de tiempo de la sonda.');

  if(s.lazoAbierto){
    rpanel(120,210,BW-240,220,'rgba(233,196,106,0.09)',WARN_HEX,12);
    texto('Aquí no hay lazo que trazar',150,262,{s:22,b:true,c:WARN_HEX});
    wrapText('Con el acelerador en '+pc(G.acel*100,0)+' la centralita ha ABIERTO el lazo: por encima de '+
      pc(e.acelPotencia*100,0)+' deja de mirar la sonda y enriquece ×'+num(e.enriqPotencia,2)+
      ' para proteger el motor. El ajuste corto está congelado en cero y la sonda no manda nada.',
      150,296,BW-300,22,{s:14.5,c:'#c3ccd8'});
    wrapText('Eso no es un hueco del banco: es la lección. Con el lazo abierto no hay nada que tape un error de MEDIDA del aire, '+
      'y por eso las averías del sensor y del riel se destapan justo aquí mientras las de la sonda desaparecen. '+
      'Baja el acelerador por debajo del '+pc(e.acelPotencia*100,0)+' para ver el lazo trabajar.',
      150,378,BW-300,20,{s:13,c:'#8c98a9'});
    banda(676,'warn','Lazo abierto: la sonda no pinta nada',
      'La mezcla la fija el mapa de potencia, no la sonda. Objetivo lambda '+lamT(1/e.enriqPotencia)+
      ', y sale '+lamT(s.lam)+'.');
    return;
  }

  const T=TRZ(), Tsano=TRZ({falla:'sano'});
  const dur=T.traza.length?T.traza[T.traza.length-1].t:8;
  const t0=Math.max(0,dur-3);
  const ven=T.traza.filter(p=>p.t>=t0);

  texto('Últimos 3 s del ensayo · lambda de los gases y lo que ve la sonda',42,150,{s:15,b:true,c:CIAN});
  const P1={x:104,y:184,w:596,h:186};
  const ls=ven.map(p=>p.lam).concat(ven.map(p=>p.lamSonda));
  const lo=Math.min(...ls)-0.006, hi=Math.max(...ls)+0.006;
  const M1=ejes(P1,t0,dur,lo,hi,null,'lambda',v=>num(v-t0,1),v=>num(v,3),6,4);
  enCaja(P1,()=>{
    serieXY(M1,ven.map(p=>[p.t,p.lam]),'#7CD992',2.2);
    serieXY(M1,ven.map(p=>[p.t,p.lamSonda]),'#5BD4E5',2.0,[6,4]);
  });
  nivel(P1,M1,1,'#8AB4F8','lambda uno');
  leyenda(P1.x+14,P1.y+22,[['la mezcla que hay','#7CD992'],['lo que la sonda ve','#5BD4E5',[6,4]]]);

  texto('El ajuste corto, que es quien la mueve',42,412,{s:15,b:true,c:CIAN});
  const P2={x:104,y:446,w:596,h:142};
  const cs=ven.map(p=>p.corto);
  const cl=Math.min(...cs), ch=Math.max(...cs), pad=Math.max(0.6,(ch-cl)*0.20);
  const M2=ejes(P2,t0,dur,cl-pad,ch+pad,'tiempo (s)','ajuste corto (%)',v=>num(v-t0,1),v=>num(v,1),6,4);
  enCaja(P2,()=>serieXY(M2,ven.map(p=>[p.t,p.corto]),'#F2A65A',2.4));

  const X=736;

  // más fácil de cometer con un osciloscopio en la mano: el filtro de aire
  // tapado baja los cruces de 4,51 a 3,10 con la sonda perfectamente sana,
  // porque entra menos aire y los gases tardan más en llegar. Lo que acusa a la
  // sonda es su CONSTANTE DE TIEMPO, no la frecuencia del lazo.

    {v:['Lambda media',lamT(T.lamMedia)]},

  wrapText('Al cruzar, la centralita da un salto de '+pc(e.saltoCorto,1)+' en sentido contrario; '+
    'entre cruces sube o baja a '+num(e.rampaCorta,1)+NBSP+'%/s.',X,428,236,18,{s:12.5,c:'#8c98a9'});

  banda(628,sondaVieja?'bad':(lento?'warn':'good'),
    sondaVieja?'Esta sonda responde tarde'
      :(lento?'El lazo va más despacio, y NO es la sonda':'El lazo oscila a su ritmo'),
    'La mezcla MEDIA sale '+lamT(T.lamMedia)+' y el ajuste largo, '+firm(s.ajustePct,1)+
    ': dos cifras que un escáner da por buenas. '+
    (sondaVieja
      ? ('Lo que ha cambiado es la FRECUENCIA: '+num(T.cps,2)+' cruces por segundo contra '+num(Tsano.cps,2)+
         ' de una sonda sana, porque su constante de tiempo pasa de '+num(Tsano.tau*1000,0)+' a '+

           'y confundirlos hace cambiar una sonda que no tenía nada.')
        : ('El viaje de los gases hasta la sonda son '+num(T.tTrans*1000,0)+NBSP+'ms y la constante de la sonda, '+
           num(T.tau*1000,0)+'. Si los cruces bajan, hay que mirar cuál de los dos ha crecido antes de acusar a la sonda: '+
           'con menos aire por el motor el lazo se frena solo.'))));
}

// ---------------------------------------------------------------- 6 · EL CENSO
// Los grupos que un juego de instrumentos NO consigue separar. Se sacan con la
// MISMA firma que usa el censo del motor sellado: si la pantalla agrupara de
// otra manera que el censo, una de las dos estaría mintiendo.
function gruposDe(sub){
  const m=new Map();
  for(const k of ESCEN_KEYS){
    const L=LECT_DE(k), f=firmaObs(MQ(),L,sub);
    if(!m.has(f)) m.set(f,[]);
    m.get(f).push({k,clave:L.clave});
  }
  return [...m.values()];
}
const mascaraDe=ks=>ks.reduce((a,k)=>a|(1<<OBS.findIndex(o=>o.k===k)),0);

function vistaCenso(){

  cabecera('¿Con qué instrumentos se separan los '+N+' escenarios?',

  tabla(42,182,[{t:'juego de instrumentos',w:300},{t:'obs.',w:56,al:'right',mono:true},

  ],{rh:27,s:13.5});

  // Columna izquierda: los grupos que el escáner solo no consigue separar.
  texto('Lo que el escáner solo NO puede separar',42,356,{s:15,b:true,c:CIAN});
  const conf=gruposDe(escaner.sub).filter(g=>new Set(g.map(x=>x.clave)).size>1);

      42,382+4*46+18,{s:12.5,c:'#8c98a9'});

    rpanel(42,382,494,60,'rgba(124,217,146,0.09)',OK_HEX,10);

  for(const c of C){ const n=c.sub.length; if(!mejor[n]||c.resueltos>mejor[n].resueltos) mejor[n]=c; }

  enCaja(P,()=>{
    for(let n=1;n<=OBS.length;n++){

         'Y fíjate en que '+(min.sub.some(o=>!o.taller)
           ? 'ese juego mínimo incluye al menos una observación que NO está en un taller corriente: por eso el escáner solo se queda en '+escaner.resueltos+'/'+N+'.'
           : 'ese juego mínimo se toma entero con lo que hay en cualquier taller.'))
      : ('Hay escenarios que dan exactamente las mismas ocho lecturas. Separarlos pediría otra observación distinta, no más precisión en las que ya hay.'));
}
// Qué escenarios deja sin separar un juego de instrumentos, para la columna de
// la tabla. Se nombra a los que quedan en conflicto, no se cuentan a secas.
function queFalta(c){
  if(!c) return 'no evaluado';
  if(c.enConflicto===0) return 'nada: los separa todos';
  const g=gruposDe(c.sub).filter(x=>new Set(x.map(y=>y.clave)).size>1);
  const nom=g.slice(0,2).map(x=>x.map(y=>ESCEN[y.k].clave).join(' / ')).join('  ·  ');
  return nom+(g.length>2?('  · y '+(g.length-2)+' más'):'');
}

// ======================================================= T3a · EL BANCO Y EL AIRE
// Un banco de inyección: bloque y culata de recorte, colector de admisión con su
// mariposa y su medidor de aire, y —en T3b— el riel con los inyectores, el
// escape con la sonda y los instrumentos. No hay montaje que hacer: este molde
// es de panel-instrumento, así que todo está en su sitio desde el primer
// fotograma y lo que se manipula son los MANDOS, no las piezas.

// Cotas del banco, derivadas del número de cilindros. Fijarlas a mano dejaría al
// V6 con dos cilindros fuera del bloque, y eso no se ve venir escribiendo el
// número.
// Las cotas del banco NO se escriben a mano: se derivan del número de cilindros
// y de los voladizos reales de cada extremo —el filtro de aire por un lado y la
// cola del escape por el otro—. La primera versión declaraba un ancho inventado
// y dejaba media mesa vacía en primer plano con el motor fuera de cuadro; eso no
// se ve venir escribiendo el número, sólo mirando la pantalla.
function dims(e){
  const paso=0.42, largo=e.nCil*paso;
  const xTh=-(largo/2+0.30);            // eje del cuerpo de mariposa
  const xIzq=xTh-0.55-0.20;             // borde exterior del filtro de aire
  const xDer=largo/2+1.10+0.34;         // final del escape con su penacho
  // Lo que el encuadre está OBLIGADO a meter llega hasta el catalizador; la cola
  // y el penacho pueden quedarse debajo del panel de mandos. Exigir el banco
  // entero obliga a alejarse tanto que el pizarrón deja de leerse, y el pizarrón
  // es donde está la práctica.
  const xVista=largo/2+0.95;
  return { paso, largo, xTh, xIzq, xDer, xVista, ancho:xDer-xIzq, centro:(xIzq+xDer)/2 };
}
const xCil=(e,i)=>{ const d=dims(e); return -d.largo/2+d.paso*(i+0.5); };

// Cilindro entre dos puntos. Sale muchas veces —tubos de admisión, de escape y
// de combustible— y calcular la orientación a mano en cada uno es la forma más
// segura de dejar un tubo apuntando a ninguna parte.
/* Los nombres con los que trabaja la biblioteca de piezas (`P3`, que el molde
   ya importa), traducidos una vez a los materiales de este laboratorio. */
const MATP={aluminio:MAT.culata, acero:MAT.acero, cobre:MAT.crom, cromo:MAT.crom,
  chapa:MAT.acero, hierro:MAT.bloque, negro:MAT.goma, goma:MAT.goma,
  blanco:MAT.crom, ceramica:MAT.crom};
/* Una pieza EN CORTE deja ver el REVÉS de su pared del fondo: con una sola cara
   se vuelve transparente por el lado abierto y desaparece al mirarla de frente. */
const corte=(m)=>{ const c=m.clone(); c.side=THREE.DoubleSide; return c; };
function tuboEntre(a,b,r,mat,seg){
  const A=new THREE.Vector3(...a), B=new THREE.Vector3(...b);
  const d=new THREE.Vector3().subVectors(B,A), L=d.length();
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,L,seg||16),mat);
  m.position.copy(A).addScaledVector(d,0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());
  m.castShadow=true;
  return m;
}
// Tubo curvo por una lista de puntos de control. Los conductos de admisión y de
// escape no son rectos, y dibujarlos rectos hace que el banco parezca un
// esquema en vez de un motor.
function tuboCurvo(pts,r,mat,seg){
  const c=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));
  const m=new THREE.Mesh(new THREE.TubeGeometry(c,seg||28,r,14,false),mat);
  m.castShadow=true;
  return m;
}

// Coloca un objeto y lo devuelve, para poder colgarlo en la misma expresión.
const pon=(o,p)=>{ o.position.set(p[0],p[1],p[2]); return o; };
const corta=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
let toastT=null;
function showToast(html,ms){
  const t=el('toast'); t.innerHTML=html; t.classList.add('show');

}

const banco=new THREE.Group(); scene.add(banco);
// Todo lo que se reconstruye al cambiar de arquetipo cuelga de este grupo, y se
// vacía entero: dejar mallas viejas colgando duplica los inyectores del V6 sobre
// los del anterior y la escena empieza a mentir sin avisar.

// Referencias que el bucle de animación necesita tocar cada fotograma.
const REF={ inyectores:[], chorros:[], mariposa:null, sonda:null, sondaLuz:null,

function limpiaGrupo(g){
  while(g.children.length){
    const c=g.children.pop();
    c.traverse&&c.traverse(o=>{ if(o.geometry) o.geometry.dispose(); });
    g.remove(c);
  }
}

{

}
function construyeMesa(d){

  const L=d.ancho+0.60, Z=2.10, cx=d.centro;

  }

  trav.position.set(cx,0.26,0); mesaG.add(trav);
}

// ------------------------------------------------------- bloque, culata y aire
function construyeMotor(){
  limpiaGrupo(motorG);
  REF.inyectores=[]; REF.chorros=[]; REF.runners=[];
  const e=MQ(), d=dims(e);

  // --- bloque y culata
  const bloque=roundedBox(d.largo+0.26,0.52,0.64,MAT.bloque,0.04);
  bloque.position.set(0,1.18,0); bloque.castShadow=true; motorG.add(bloque);
  const culata=roundedBox(d.largo+0.26,0.22,0.64,MAT.culata,0.03);
  culata.position.set(0,1.55,0); culata.castShadow=true; motorG.add(culata);
  const tapa=roundedBox(d.largo+0.16,0.10,0.50,std({...plas,color:0x2a323c,roughness:0.48}),0.03);
  tapa.position.set(0,1.71,0); tapa.castShadow=true; motorG.add(tapa);
  // Aletas del bloque: dan escala y hacen que el V6 se lea como un motor mayor y
  // no como el mismo motor estirado.
  for(let i=0;i<e.nCil;i++){
    const a=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.44,0.68),MAT.bloque);
    a.position.set(xCil(e,i)+d.paso/2,1.18,0); motorG.add(a);
  }

  // --- colector de admisión: plénum, conductos y mariposa
  const plen=new THREE.Mesh(new THREE.CylinderGeometry(0.135,0.135,d.largo+0.34,24),
    std({...alu,color:0x8d949d,metalness:0.55,roughness:0.52}));
  plen.rotation.z=Math.PI/2; plen.position.set(0,2.06,0.62); plen.castShadow=true; motorG.add(plen);
  for(let i=0;i<e.nCil;i++){
    const x=xCil(e,i);
    const t=tuboCurvo([[x,2.02,0.62],[x,1.92,0.52],[x,1.78,0.40],[x,1.66,0.33]],0.055,
      std({...alu,color:0x8d949d,metalness:0.55,roughness:0.52}));
    motorG.add(t); REF.runners.push(t);
  }
  // Cuerpo de mariposa en el extremo del plénum, del lado del pizarrón, para que
  // se vea sin girar la cámara cuando se está leyendo el tablero.
  const xTh=d.xTh;
  /* El cuerpo de mariposa es un TUBO con bridas, no un tapón macizo: por dentro
     pasa todo el aire del motor y el plato tiene que caber girado del todo. */
  const cuerpo=new THREE.Mesh(P3.revolucion([
    [0.128,-0.15],[0.170,-0.15],[0.170,-0.12],[0.142,-0.11],
    [0.142,0.11],[0.170,0.12],[0.170,0.15],[0.128,0.15]],{seg:30}),
    std({...alu,color:0x9aa1aa,metalness:0.70,roughness:0.36}));
  cuerpo.rotation.z=Math.PI/2; cuerpo.position.set(xTh-0.12,2.06,0.62); cuerpo.castShadow=true; motorG.add(cuerpo);
  // La mariposa es una PLACA, no un disco tumbado: gira alrededor de un eje
  // perpendicular al flujo. Cerrada, su cara tapa el conducto —su normal va con
  // el aire—; abierta del todo se pone de canto. Modelarla como cilindro deja
  // una tapa que gira sobre sí misma sin abrir nada.
  const mari=new THREE.Mesh(P3.revolucion([
    [0,-0.007],[0.130,-0.012],[0.138,0],[0.130,0.012],[0,0.007]],{seg:28}),MAT.crom);
  mari.rotation.z=Math.PI/2;
  mari.position.set(xTh-0.12,2.06,0.62); motorG.add(mari);
  REF.mariposa=mari;
  const eje=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.32,10),MAT.acero);
  eje.position.set(xTh-0.12,2.06,0.62); motorG.add(eje);
  // Medidor de aire aguas arriba de la mariposa, con su filtro.
  const mafC=new THREE.Mesh(new THREE.CylinderGeometry(0.115,0.115,0.28,20),
    std({...plas,color:0x1e252e,roughness:0.52}));
  mafC.rotation.z=Math.PI/2; mafC.position.set(xTh-0.34,2.06,0.62); mafC.castShadow=true; motorG.add(mafC);
  REF.maf=mafC;
  // El elemento PLISADO: lo que filtra es la superficie, y el plisado es la
  // manera de meter un metro cuadrado de papel en un palmo de caja.
  const filtro=P3.filtroPlisado({papel:std({color:0xd9d2bc,roughness:0.92,metalness:0.03})},
    {rExt:0.20,rInt:0.135,alto:0.26,pliegues:36});
  filtro.rotation.z=Math.PI/2; filtro.position.set(xTh-0.55,2.06,0.62);
  filtro.traverse(o=>{if(o.isMesh)o.castShadow=true;}); motorG.add(filtro);
  for(let i=-2;i<=2;i++){
    const an=new THREE.Mesh(new THREE.TorusGeometry(0.203,0.010,8,28),MAT.goma);
    an.rotation.y=Math.PI/2; an.position.set(xTh-0.55+i*0.045,2.06,0.62); motorG.add(an);
  }

  construyeCombustible(e,d);
  construyeEscape(e,d);
  construyeMesa(d);
  colocaInstrumentos(d);
  colocaTablero(d);
}

// =========================================== T3b · COMBUSTIBLE, ESCAPE E INSTRUMENTOS

// ------------------------------------------------------------- el combustible
function construyeCombustible(e,d){
  const zR=0.30, yR=1.92;
  const riel=new THREE.Mesh(new THREE.CylinderGeometry(0.050,0.050,d.largo+0.30,20),MAT_RIEL);
  riel.rotation.z=Math.PI/2; riel.position.set(0,yR,zR); riel.castShadow=true; motorG.add(riel);
  for(const sx of [-1,1]){
    const tap=new THREE.Mesh(new THREE.SphereGeometry(0.052,16,12),MAT_RIEL);
    tap.position.set(sx*(d.largo/2+0.15),yR,zR); motorG.add(tap);
  }
  // Manguera de alimentación desde la bomba, por debajo de la mesa.
  motorG.add(tuboCurvo([[-(d.largo/2+0.15),yR,zR],[-(d.largo/2+0.55),1.72,0.38],
    [-(d.largo/2+0.72),1.30,0.62],[-(d.largo/2+0.72),1.02,0.78]],0.030,MAT_MANG));

  for(let i=0;i<e.nCil;i++){
    const x=xCil(e,i);
    /* EL INYECTOR, con lo que tiene un inyector: cuerpo de bobina, conector,
       las DOS juntas tóricas que lo sellan contra el riel y contra el colector
       —por ahí es por donde entra aire falso cuando se cuartean— y la tobera.
       Un cono truncado no enseña ninguna de las tres. */
    const cuerpo=P3.inyector(MATP,{d:0.072,largo:0.30});
    cuerpo.position.set(x,yR-0.10,zR+0.02); cuerpo.rotation.x=-0.16;
    cuerpo.traverse(o=>{if(o.isMesh)o.castShadow=true;});
    motorG.add(cuerpo);
    // El anillo del inyector es lo que PARPADEA: su brillo dice si está abierto
    // en este instante, y su color, cuánto entrega ese cilindro comparado con los
    // demás. Cada uno lleva su propio material —clonado— porque compartirlo haría
    // que los cuatro se encendieran a la vez y el reparto por cilindro dejaría de
    // verse.
    const anillo=new THREE.Mesh(new THREE.TorusGeometry(0.040,0.011,10,22),
      emis(0x7CD992,0.25).clone());
    anillo.rotation.x=Math.PI/2-0.16; anillo.position.set(x,yR-0.20,zR+0.035);
    motorG.add(anillo);
    // Chorro: cono translúcido que aparece mientras el inyector está abierto.
    const chorro=new THREE.Mesh(new THREE.ConeGeometry(0.038,0.13,14,1,true),
      std({color:0xF2A65A,emissive:0xF2A65A,emissiveIntensity:0.7,transparent:true,
        opacity:0.0,depthWrite:false,roughness:0.6}));
    chorro.position.set(x,yR-0.29,zR+0.05); chorro.rotation.x=Math.PI-0.16;
    motorG.add(chorro);
    REF.inyectores.push(anillo); REF.chorros.push(chorro);
  }
}

// ------------------------------------------------------------------- el escape
function construyeEscape(e,d){
  const yC=1.14, zC=-0.64;
  for(let i=0;i<e.nCil;i++){
    const x=xCil(e,i);
    motorG.add(tuboCurvo([[x,1.52,-0.32],[x,1.42,-0.44],[x,1.26,-0.58],[x,yC,zC]],0.048,MAT_ESCAPE));
  }
  const xCol0=-(d.largo/2+0.12), xCol1=d.largo/2+1.10;
  const col=new THREE.Mesh(new THREE.CylinderGeometry(0.078,0.078,xCol1-xCol0,20),MAT_ESCAPE);
  col.rotation.z=Math.PI/2; col.position.set((xCol0+xCol1)/2,yC,zC); col.castShadow=true; motorG.add(col);

  // La sonda va ANTES del catalizador y en el colector, donde ve la mezcla de
  // todos los escapes. Ponerla después mediría lo que sale del catalizador, que
  // es otra cosa.
  const xS=d.largo/2+0.32;
  const boss=new THREE.Mesh(new THREE.CylinderGeometry(0.048,0.048,0.10,14),MAT.acero);
  boss.position.set(xS,yC+0.10,zC); motorG.add(boss);
  /* LA SONDA, con su tubo de protección ranurado: el gas tiene que llegar al
     elemento de circonio, pero el elemento no puede recibir el chorro directo ni
     el agua de condensación. Esas ranuras SON la pieza, y el hexágono no es
     adorno —una sonda se aprieta con llave de vaso partido porque el cable no
     pasa por la llave—. */
  const sonda=P3.sondaLambda({...MATP,acero:std({...brush,color:0xb9c0c8,metalness:0.95,roughness:0.30})},
    {d:0.104,largo:0.46});
  sonda.position.set(xS,yC+0.34,zC);
  sonda.traverse(o=>{if(o.isMesh)o.castShadow=true;}); motorG.add(sonda);
  const cuerpo=sonda;
  const luz=new THREE.Mesh(new THREE.SphereGeometry(0.055,18,14),
    std({color:0x7CD992,emissive:0x7CD992,emissiveIntensity:1.4,roughness:0.4}));
  luz.position.set(xS,yC+0.44,zC); motorG.add(luz);
  REF.sonda=cuerpo; REF.sondaLuz=luz;
  // `labelSprite` del kit devuelve el sprite YA escalado y hornea el texto en su
  // textura: la posición la pone quien lo cuelga. Pasarle coordenadas como
  // segundo argumento lo dejaría con un color inválido y el rótulo en el origen.
  motorG.add(pon(labelSprite('sonda λ','#5BD4E5'),[xS,yC+0.66,zC]));

  // Catalizador y cola de escape.
  const xCat=d.largo/2+0.72;
  /* EL CATALIZADOR, EN CORTE. Un tubo cerrado no dice por qué convierte: lo que
     convierte es el MONOLITO cerámico de dentro, un panal de miles de canales
     rectos que da una superficie enorme sin ahogar el escape. Cuando se funde,
     esos canales se cierran: es la avería, y hay que poder verla. */
  const cat=new THREE.Mesh(P3.revolucion(
    [[0.140,-0.23],[0.150,-0.23],[0.150,0.23],[0.140,0.23]],
    {seg:28,fase:Math.PI*0.29,arco:Math.PI*1.42}),
    corte(std({...brush,color:0x8e959c,metalness:0.85,roughness:0.42})));
  cat.rotation.z=Math.PI/2; cat.position.set(xCat,yC,zC); cat.castShadow=true; motorG.add(cat);
  const mono=P3.monolito({ceramica:std({color:0xd7d2c6,roughness:0.86,metalness:0.02}),
    acero:std({...brush,color:0x8e959c,metalness:0.85,roughness:0.42})},
    {r:0.138,largo:0.42,celdas:11,carcasa:false});
  mono.rotation.y=Math.PI/2; mono.position.set(xCat,yC,zC); motorG.add(mono);
  for(const sx of [-1,1]){
    const cono=new THREE.Mesh(new THREE.CylinderGeometry(0.080,0.151,0.12,24),
      std({...brush,color:0x8e959c,metalness:0.85,roughness:0.42}));
    cono.rotation.z=sx*Math.PI/2; cono.position.set(xCat+sx*0.29,yC,zC); motorG.add(cono);
  }
  // Gases a la salida: su color es el de la lambda REAL, que es justo lo que la
  // sonda de banda estrecha no sabe decir.
  const gas=new THREE.Mesh(new THREE.ConeGeometry(0.14,0.56,18,1,true),
    std({color:0x7CD992,emissive:0x7CD992,emissiveIntensity:0.55,transparent:true,
      opacity:0.16,depthWrite:false,roughness:0.9}));
  gas.rotation.z=-Math.PI/2; gas.position.set(xCol1+0.30,yC,zC); motorG.add(gas);
  REF.escGas=gas;
}

// ------------------------------------------------------------------ animación
// Las inyecciones se pintan RALENTIZADAS: a 2 500 rpm hay veintiuna por segundo
// y por cilindro, y a esa velocidad los anillos son un borrón. El factor se
// declara en pantalla para que nadie confunda lo que ve con la frecuencia real.
const LENTO=8;
let RELOJ=0;
// Contador de FOTOGRAMAS de la escena, no de repintados del pizarrón. La Capa 2
// espera por él para leer cualquier cosa que sólo se actualice en el bucle, y si
// contara repintados del pizarrón —que sólo ocurren al tocar un mando— la espera
// se quedaría colgada para siempre en cuanto nadie tocara nada.
let PINTADAS=0;
function pinta3D(dt){
  RELOJ+=dt; PINTADAS++;
  const e=MQ(), s=EST(), d=dims(e);

  // --- mariposa: cerrada, su cara tapa el conducto; abierta, se pone de canto
  if(REF.mariposa) REF.mariposa.rotation.y=G.acel*(Math.PI/2)*0.94;

  // --- inyectores: uno detrás de otro, con el ciclo de trabajo que sale del motor
  const fCil=Math.max(0.4,(s.rpm/(2*60))/LENTO);      // aperturas por segundo y cilindro
  const duty=clamp(s.ciclo/100,0,1);
  REF.inyectores.forEach((an,i)=>{
    const fase=(RELOJ*fCil+i/Math.max(e.nCil,1))%1;
    const abierto=fase<duty;
    // El reparto por cilindro se ve en el COLOR del anillo: con un inyector
    // obstruido, el suyo se queda azul mientras los otros tres se van a naranja.
    const cil=s.cil[i]||s.cil[0];
    an.material.color.setHex(colorLam(cil.lam));
    an.material.emissive.setHex(colorLam(cil.lam));
    an.material.emissiveIntensity=abierto?1.9:0.20;
    const ch=REF.chorros[i];
    if(ch){
      const rel=s.mComb>1e-12?clamp(cil.mComb/s.mComb,0.2,1.8):1;
      ch.material.opacity=abierto?0.34*rel:0.0;
      ch.material.color.setHex(colorLam(cil.lam));
      ch.material.emissive.setHex(colorLam(cil.lam));
      ch.scale.set(1,rel,1);
    }
  });

  // --- la sonda: su luz es la TENSIÓN que entrega, no la mezcla que hay
  if(REF.sondaLuz){
    const T=s.lazoAbierto?null:TRZ();
    // Con el lazo cerrado la tensión no se está quieta: oscila al ritmo de los
    // cruces que ha medido la traza, y ese ritmo es lo único que delata una
    // sonda envejecida.
    let v=s.vSonda;
    if(T&&T.cps>0){
      const osc=Math.sin(2*Math.PI*(T.cps/LENTO)*RELOJ);
      v=clamp(V_POBRE+(V_RICA-V_POBRE)*(osc>0?0.86:0.14),0,1);
    }
    const c=colorLam(s.lamSonda);
    REF.sondaLuz.material.color.setHex(c);
    REF.sondaLuz.material.emissive.setHex(c);
    REF.sondaLuz.material.emissiveIntensity=0.5+2.0*v;
  }

  // --- gases a la salida: color de la lambda REAL
  if(REF.escGas){
    const c=colorLam(s.lam);
    REF.escGas.material.color.setHex(c);
    REF.escGas.material.emissive.setHex(c);
    REF.escGas.material.opacity=0.10+0.16*clamp(s.mAireSeg/24,0,1)+0.03*Math.sin(RELOJ*3.1);
  }

  // --- manómetro del riel: fondo de escala fijo, para poder comparar máquinas
  if(REF.aguja){
    const p=e.pRiel*(FA().pRielMul===undefined?1:FA().pRielMul);
    const u=clamp(p/6.0,0,1);
    REF.aguja.rotation.z=Math.PI*0.75-Math.PI*1.5*u;
  }

  // --- testigos
  if(REF.ledDtc){ REF.ledDtc.material.emissiveIntensity=s.dtc?(1.4+0.7*Math.sin(RELOJ*6)):0.10; }
  if(REF.ledLazo){
    const c=s.lazoAbierto?0xE9C46A:(s.saturado?0xff6b6b:0x7CD992);
    REF.ledLazo.material.color.setHex(c);
    REF.ledLazo.material.emissive.setHex(c);
    REF.ledLazo.material.emissiveIntensity=1.2;
  }
  pintaPanel3D();
}

// ------------------------------------------------------------------ controles
// Los mandos se levantan desde el estado. Un mando que no puede hacer nada en el
// modo actual no se dibuja: un botón pulsable que no cambia nada enseña a
// desconfiar de la interfaz.
// Los botones de una barra se reparten el ancho a partes iguales, así que trece
// en una sola fila salen ilegibles y el último se sale del panel. Se cortan en
// varias barras de altura pareja, calculadas del número de opciones.
function fila(rot,attr,ops,cur){
  const filas=Math.ceil(ops.length/5), porFila=Math.ceil(ops.length/filas);
  let h='<div class="gl" style="margin:9px 0 4px"><span>'+rot+'</span></div>';
  for(let i=0;i<ops.length;i+=porFila){
    h+='<div class="modebar">'+ops.slice(i,i+porFila).map(o=>
      '<button class="b'+(String(o[0])===String(cur)?' on':'')+'" '+attr+'="'+o[0]+'">'+o[1]+'</button>'
    ).join('')+'</div>';
  }
  return h;
}
// Rótulo corto de cada escenario para los botones. Si mañana aparece un
// escenario nuevo sin rótulo corto, cae en el recorte del largo en vez de
// quedarse sin botón.
const ESC_CORTO={sano:'sano', fugaVacio:'fuga de vacío', mafSucio:'sensor sucio',
  inyObstruido:'inyector obstruido', presionBaja:'riel bajo', presionAlta:'riel alto',
  sondaLenta:'sonda lenta', sondaVaga:'sonda contaminada', fugaEscape:'fuga de escape',
  purga:'purga pegada', filtroAire:'filtro tapado', bateriaBaja:'batería baja',
  combE85:'E85 en el depósito'};
// El ralentí es una PROPIEDAD de la máquina, así que siempre está entre las
// opciones y es adonde se vuelve al cambiar de motor. Si no, el panel ofrecería
// un régimen que ese motor no tiene y la cifra saldría de un punto inexistente.
const rpmOps=()=>[...new Set([MQ().ralenti,1500,2500,3500,4500,5500])].sort((a,b)=>a-b);
// Las opciones de acelerador incluyen SIEMPRE una por encima de la apertura del
// lazo y varias por debajo: si todas cayeran de un lado, media práctica —la
// mitad que enseña qué pasa cuando la sonda deja de mandar— sería inalcanzable.
const ACEL_OPS=[[0,'suelto'],[0.15,'poco'],[0.35,'crucero'],[0.6,'firme'],[0.85,'casi a fondo'],[1,'a fondo']];

function buildControls(){
  const e=MQ(), reto=(G.modo==='reto');

  else h+='<div class="gl" style="margin:9px 0 4px"><span>Motor bajo diagnóstico</span><b>'+e.corto+'</b></div>';

  if(!reto) h+=fila('Estado del sistema','data-esc',
    ESCEN_KEYS.map(k=>[k,ESC_CORTO[k]||corta(ESCEN[k].rot,16)]),G.esc);
  else h+='<div class="gl" style="margin:9px 0 4px"><span>Estado del sistema</span><b class="warn">oculto</b></div>';

  if(!reto){
    h+=fila('Combustible en el depósito','data-cb',COMB_KEYS.map(k=>[k,COMB[k].corto]),G.comb);
    if(combForzado())
      h+='<div class="gl" style="margin:4px 0 4px"><span>Ojo</span><b class="warn">el escenario impone '+
        CB().corto+'</b></div>';
  }
  if(G.modo==='mezcla'||G.modo==='aire'||G.modo==='inyector'||G.modo==='sonda'||G.modo==='lazo'){
    h+=fila('Régimen del motor','data-rpm',
      rpmOps().map(r=>[r,num(r,0)+(r===e.ralenti?'*':'')]),G.rpm);
    h+=fila('Acelerador','data-ac',ACEL_OPS.map(c=>[c[0],c[1]]),G.acel);
  }
  if(G.modo==='mezcla'||G.modo==='inyector'){
    h+=fila('Tensión de batería','data-vb',TENSIONES.map(v=>[v,num(v,1)+' V']),G.vBat);
    if(vBatForzada())
      h+='<div class="gl" style="margin:4px 0 4px"><span>Ojo</span><b class="warn">el escenario impone '+

    h+=fila('Aire de admisión','data-ta',TEMPS_ADM.map(t=>[t,num(t,0)+' °C']),G.Tadm);
  el('ctrlbar').innerHTML=h;
}

const gl=(l,v,c)=>'<div class="g"><div class="gl"><span>'+l+'</span><b'+(c?' class="'+c+'"':'')+'>'+v+'</b></div></div>';
function pintaTele(){
  const e=MQ(), s=EST(), V=veredicto();
  let h='';
  // En el diagnóstico a ciegas sólo se publica lo que se ha COMPRADO. Publicar
  // aquí la lambda, el ajuste o el veredicto sería regalar la respuesta.
  if(G.modo==='reto'){
    h+=gl('Observaciones compradas',Object.keys(RETO.tomadas).length+' / '+OBS.length,
      Object.keys(RETO.tomadas).length?'':'warn');
    h+=gl('Familia elegida',RETO.eleccion||'ninguna todavía',RETO.eleccion?'':'warn');
    if(RETO.veredicto) h+=gl('Diagnóstico entregado',RETO.veredicto.ok?'acertado':'fallado',
      RETO.veredicto.ok?'good':'bad');
    el('tele').innerHTML=h;
    return;
  }
  h+=gl('Combustible',CB().corto+(combForzado()?' (impuesto)':''),combForzado()?'warn':'');
  h+=gl('Lazo',s.lazoAbierto?'ABIERTO: manda el mapa de potencia':'cerrado: manda la sonda',
    s.lazoAbierto?'warn':'good');
  h+=gl('Lambda real',lamT(s.lam),V.enBanda?'good':'bad');
  // Que la sonda mienta es el hallazgo más importante que este banco puede dar,
  // y no depende del modo en el que se esté mirando: se publica siempre que
  // aparezca, no sólo en la vista de la sonda.
  if(s.mienteSonda) h+=gl('La sonda lee','λ '+lamT(s.lamSonda)+': MIENTE','bad');
  h+=gl('Ajuste largo',s.lazoAbierto?'—':firm(s.ajustePct,1),
    s.saturado?'bad':(Math.abs(s.ajustePct)>=DTC_UMBRAL*100?'warn':'good'));
  if(s.saturado) h+=gl('Autoridad','SATURADA en ±'+pc(AUTORIDAD*100,0),'bad');
  if(G.modo==='aire'){
    h+=gl('Presión del colector',bar(s.map,3),'');
    h+=gl('Rendimiento volumétrico',pc(s.etaVol*100,1),'');
    h+=gl('Aire que entra',mg(s.mAireCil*1000,2),'');
    h+=gl('Lo que mide el sensor',mg(s.mMedido*1000,2),
      roto(s.mMedido,s.mAireCil)?'warn':'good');
  }
  if(G.modo==='inyector'){
    h+=gl('Caída en el inyector',bar(s.dpInyector,2),'');
    h+=gl('Pulso ordenado',mili(s.tOrden,2),'');
    h+=gl('Tiempo muerto',mili(s.tMuerto,2),s.tMuerto>1.2?'warn':'');
    h+=gl('Ciclo de trabajo',pc(s.ciclo,1),V.sinMargenInyector?'bad':'good');
  }
  if(G.modo==='sonda'){
    h+=gl('Tensión de la sonda',num(s.vSonda*1000,0)+NBSP+'mV','');
    h+=gl('Dice que la mezcla está',ROT_MEZ[regimenLam(s.lamSonda)],
      s.mienteSonda?'bad':'good');
    h+=gl('Y de verdad está',ROT_MEZ[regimenLam(s.lam)],V.enBanda?'good':'bad');
  }
  if(G.modo==='lazo'){
    if(s.lazoAbierto) h+=gl('Cruces por segundo','no aplica: el lazo está abierto','warn');
    else{
      const T=TRZ(), Tsano=TRZ({falla:'sano'});
      // Los cruces bajan por dos motivos distintos —sonda vieja o poco aire— y
      // sólo el segundo campo distingue cuál: pintar los cruces de rojo a secas
      // acusaría a una sonda sana cada vez que se estrangula la admisión.
      const vieja=T.tau>Tsano.tau*1.5;
      h+=gl('Cruces por segundo',num(T.cps,2)+' (sano: '+num(Tsano.cps,2)+')',
        T.cps<Tsano.cps*0.75?(vieja?'bad':'warn'):'good');
      h+=gl('Viaje de los gases',num(T.tTrans*1000,0)+NBSP+'ms',
        T.tTrans>Tsano.tTrans*1.25?'warn':'');
      h+=gl('Constante de la sonda',num(T.tau*1000,0)+NBSP+'ms',vieja?'bad':'good');
    }
  }
  if(G.modo==='censo'){
    const C=CENSO(), N=ESCEN_KEYS.length;
    const min=C.filter(x=>x.resueltos===N).sort((a,b)=>a.sub.length-b.sub.length)[0];
    const tal=C.find(x=>x.sub.length===OBS.filter(o=>o.taller).length&&x.sub.every(o=>o.taller));
    const esc=C.find(x=>x.mask===mascaraDe(['ajRal','ajCruc']));
    h+=gl('Escenarios en juego',String(N),'');
    h+=gl('Sólo con los dos ajustes',esc.resueltos+' / '+N,esc.resueltos===N?'good':'bad');
    h+=gl('Con todo lo de taller',tal.resueltos+' / '+N,tal.resueltos===N?'good':'bad');
    h+=gl('Observaciones mínimas',min?String(min.sub.length):'—',min?'good':'bad');
  }
  h+=gl('Código de avería',s.dtc||'ninguno',s.dtc?'bad':'good');
  // El par se publica contra lo que daría ESTE motor sano en ESTE punto. El par
  // relativo a secas está normalizado a plena carga, así que a media carga vale
  // la mitad y leído solo parece una avería que no existe.
  h+=gl('Par contra este motor sano',pc(s.parRel/V.parSano*100,1),V.parCaido?'warn':'good');
  h+=gl('Veredicto con el motor en marcha',
    V.malo?'hay algo que corregir':(G.esc==='sano'?'todo en orden':'aquí no se nota nada'),
    V.malo?'bad':(G.esc==='sano'?'good':'warn'));
  el('tele').innerHTML=h;
}

// ------------------------------------------------------------------ informe
// El informe dice el veredicto Y por qué criterio, porque el laboratorio entero
// trata de que los criterios NO son equivalentes: hay averías que sólo caza el
// escáner, una que sólo caza el osciloscopio y dos en las que el escáner sale
// impecable mientras el analizador de gases dice que la mezcla está mal.
function pintaInforme(){
  const R=el('report'), e=MQ();
  if(G.modo==='reto'){ pintaReto(); return; }
  const s=EST(), V=veredicto(), E=veredictoEngano();
  const parte=[];
  if(!V.enBanda) parte.push('<b class="bad">la mezcla no está donde debería:</b> lambda '+
    lamT(s.lam)+' contra el objetivo '+lamT(V.obj)+
    (s.lazoAbierto?' del enriquecimiento de potencia':' del lazo cerrado'));
  if(V.miente) parte.push('<b class="bad">la sonda miente:</b> le dice a la centralita '+
    lamT(s.lamSonda)+' cuando hay '+lamT(s.lam));
  if(V.saturado) parte.push('<b class="bad">el ajuste está SATURADO</b> en su tope de ±'+
    pc(AUTORIDAD*100,0)+': la centralita ya no puede corregir más');
  if(V.sinMargenInyector) parte.push('<b class="warn">el inyector va al '+pc(s.ciclo,1)+
    ':</b> por encima del '+pc(CICLO_TECHO,0)+' no queda pulso que alargar');
  if(V.parCaido) parte.push('<b class="warn">el par ha caído a '+pc(s.parRel/V.parSano*100,1)+
    '</b> de lo que daría este motor sano en el mismo punto');
  if(s.dtc) parte.push('<b class="warn">'+s.dtc+'</b>');

  let h;
  if(!parte.length){
    // Con una avería montada, «en orden» sería falso: lo que dice el modelo es
    // que en ESTE punto de trabajo no se nota. Esa distinción es la práctica.
    const sano=G.esc==='sano';
    h=(sano?'<b class="good">Sistema de inyección en orden.</b> '
           :'<b class="warn">En este punto de trabajo no se nota nada.</b> ')+
      'Lambda '+lamT(s.lam)+', ajuste largo '+(s.lazoAbierto?'—':firm(s.ajustePct,1))+
      ', pulso '+mili(s.tOrden,2)+' y ciclo '+pc(s.ciclo,1)+'. '+
      (sano?'Conviene fijarse en que el ajuste largo y la mezcla real NO se implican: hay averías que dejan el ajuste limpio y la mezcla torcida, y al revés. '
           :'Hay una avería montada y ninguna medida del escáner se ha movido: cambia el punto de trabajo —sobre todo el acelerador— antes de dar el sistema por bueno. ')+
      'Escenario montado: <b>'+ESCEN[G.esc].rot+'</b> — '+ESCEN[G.esc].clave+'.';
  }else{
    h='<b>Hallazgos:</b> '+parte.join(' · ')+'. ';
    // El criterio que se queda ciego, cuando lo hay: es el corazón de la práctica.
    const ciegos=[];
    if(E.engana) ciegos.push('el escáner sale LIMPIO —su ajuste mayor es '+firm(E.max,1)+
      ', por debajo del ±'+pc(DTC_UMBRAL*100,0)+' que dispara un código— y sin embargo el analizador de gases mide lambda '+
      lamT(E.lam)+' en crucero');
    if(E.mudo) ciegos.push('el escáner no dice NADA —ni ajuste ni código— y aun así el motor sólo da el '+
      pc(E.par*100,1)+' de su par a plena carga');
    if(E.disperso) ciegos.push('la mezcla MEDIA sale bien y el escáner sale limpio, pero los cilindros van cada uno por su lado: '+
      num(E.disp,3)+' de dispersión entre el más pobre y el más rico. La sonda lee la mezcla de todos los escapes a la vez, '+
      'así que ese reparto no lo puede ver de ninguna manera');
    if(!s.lazoAbierto&&!V.enBanda&&Math.abs(s.ajustePct)<DTC_UMBRAL*100)
      ciegos.push('el ajuste largo se queda en '+firm(s.ajustePct,1)+', por debajo del umbral de código, con la mezcla ya fuera de banda');
    if(ciegos.length) h+='<span class="warn">Y esto es lo que hay que llevarse: '+ciegos.join('; ')+'.</span> ';
    h+='Escenario montado: <b>'+ESCEN[G.esc].rot+'</b> — '+ESCEN[G.esc].clave+'.';
  }
  // Lo que el protocolo completo enseña, que no es lo mismo que este punto.
  const L=LECT();
  h+=' <b>Protocolo:</b> ajuste '+firm(L.pts[0].ajuste,1)+' a ralentí y '+firm(L.pts[1].ajuste,1)+
    ' en crucero'+(L.pts[0].ajuste*L.pts[1].ajuste!==0&&Math.abs(L.pts[0].ajuste-L.pts[1].ajuste)>2
      ? ' — que no coincidan es el dato: un caudal de fuga constante pesa mucho abajo y casi nada arriba, y un sensor que se equivoca en porcentaje se equivoca igual en toda la banda'
      : ' — la misma cifra en los dos puntos apunta a un error proporcional, no a un caudal fijo')+'.';
  R.innerHTML=h;
}

// ============================== T4b · RETO, CUESTIONARIO, RECORRIDO Y ARRANQUE
const RETO={caso:null, tomadas:{}, eleccion:null, veredicto:null, pistas:0};

function barajaEn(a){                       // Fisher-Yates, para que la posición
  for(let i=a.length-1;i>0;i--){            // de la respuesta no sea la pista
    const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function armaReto(){
  const casos=casosReto();
  RETO.caso=casos[Math.floor(Math.random()*casos.length)];
  G.esc=RETO.caso;
  // El coche entra al taller con gasolina en el depósito, que es lo que dice su
  // manual. Si la avería es precisamente el combustible, el escenario lo impone
  // y eso ES el caso: por eso la cabecera no puede publicarlo en este modo.
  G.comb='g100';
  RETO.tomadas={}; RETO.eleccion=null; RETO.veredicto=null; RETO.pistas=0;
  invalida(); pintaObsReto(); pintaDxReto();
}
// Valor legible de cada observación. Sale del motor sellado y se publica con la
// MISMA resolución con la que el censo la cuenta: comprar el instrumento no da
// precisión infinita, y si la pantalla diera más dígitos que el censo, el censo
// estaría contando otra cosa que la que se ve en pantalla.
function valorObs(k){
  const L=LECT(), o=OBS.find(x=>x.k===k);
  if(k==='ajRal')   return firm(cuant(L.pts[0].ajuste,o.res),0);
  if(k==='ajCruc')  return firm(cuant(L.pts[1].ajuste,o.res),0);
  if(k==='ciclo')   return pc(cuant(L.pts[2].ciclo,o.res),0);
  if(k==='presion') return bar(cuant(L.pRiel,o.res),1);
  if(k==='bateria') return volt(cuant(L.vBat,o.res),1);
  if(k==='lambda')  return 'λ '+num(cuant(L.lamGases,o.res),2);
  if(k==='cruces')  return num(cuant(L.cps,o.res),1)+NBSP+'1/s';
  if(k==='balance') return num(cuant(L.disp,o.res),2);
  return '—';
}
function mide(k){
  if(G.modo!=='reto'||RETO.tomadas[k]) return;
  RETO.tomadas[k]=valorObs(k);
  synth.beep(560,0.06,0.04);
  pintaObsReto(); pintaReto(); pintaTablero(); pintaTele();
}
function pintaObsReto(){
  el('obsreto').innerHTML=OBS.map(o=>
    '<button class="b'+(RETO.tomadas[o.k]?' on':'')+'" data-obs="'+o.k+'">'+
    (o.taller?'':'💰 ')+(OBS_CORTO[o.k]||corta(o.rot,30))+'</button>').join('');
}
function pintaDxReto(){
  const ops=barajaEn(FAMILIAS_RETO.slice());
  el('dxreto').innerHTML=ops.map(f=>
    '<button class="b'+(RETO.eleccion===f?' on':'')+'" data-fam="'+f+'">'+f+'</button>').join('');
}
function pintaReto(){
  const R=el('report'), n=Object.keys(RETO.tomadas).length;
  let h='<b>Coche bajo diagnóstico:</b> '+MQ().nombre+'. Observaciones compradas: '+n+'/'+OBS.length+'. ';
  if(RETO.veredicto) h+=(RETO.veredicto.ok?'<b class="good">Acertaste.</b> ':'<b class="bad">Fallaste.</b> ')+RETO.veredicto.texto;
  else h+='Compra lo que necesites, elige la familia y entrega el diagnóstico.';
  R.innerHTML=h;
  const spec=el('retoSpec');
  spec.innerHTML=n
    ? '<span class="mono">'+OBS.filter(o=>RETO.tomadas[o.k])
        .map(o=>(OBS_CORTO[o.k]||corta(o.rot,34))+': '+RETO.tomadas[o.k]).join('<br>')+'</span>'
    : '<span class="mono">Sin observaciones todavía.</span> Las cinco primeras se toman con lo que hay en cualquier taller —escáner, manómetro y multímetro—; el analizador de gases, el osciloscopio y la prueba de corte hay que pedirlos aparte.';
}
function pista(){
  const e=MQ(), C=CENSO(), N=ESCEN_KEYS.length;
  const tal=C.find(x=>x.sub.length===OBS.filter(o=>o.taller).length&&x.sub.every(o=>o.taller));
  const esc=C.find(x=>x.mask===mascaraDe(['ajRal','ajCruc']));
  const p=[
    'Empieza por los dos ajustes del escáner: son los más baratos y ya separan '+esc.resueltos+
      ' de los '+N+' escenarios de este '+e.corto+'. Lo que importa no es cuánto valen, sino si COINCIDEN entre ralentí y crucero.',
    'Un ajuste que vale lo mismo abajo y arriba señala un error PROPORCIONAL —el sensor de aire, la presión del riel—. '+
      'Uno que es enorme a ralentí y casi nada en crucero señala un CAUDAL fijo: una fuga de aire o una purga pegada.',
    'Con todo lo que se mide en un taller corriente se separan '+tal.resueltos+' de los '+N+
      ' escenarios de este '+e.corto+'. '+(tal.resueltos===N
        ? 'En esta máquina alcanza: si sigues dudando, es que falta tomar alguna.'
        : 'En esta máquina NO alcanza: hay casos que sólo separan el analizador de gases, el osciloscopio o la prueba de corte.'),
  ];
  const i=Math.min(RETO.pistas,p.length-1);
  RETO.pistas++;
  showToast('💡 '+p[i],6800);
  synth.beep(520,0.07,0.04);
}
function checkReto(){
  if(!RETO.eleccion){ showToast('Elige primero una familia de avería.',2200); return; }
  const e=MQ(), L=LECT(), ok=(RETO.eleccion===L.clave);
  const F=FALLAS[ESCEN[RETO.caso].falla];
  const sano=lecturas(e,'sano',{comb:'g100',Tadm:G.Tadm});
  const queEra='Era <b>'+ESCEN[RETO.caso].rot+'</b> ('+L.clave+'). '+F.nota;
  const pruebas='Lo que lo demostraba: ajuste largo '+firm(L.pts[0].ajuste,1)+' a ralentí y '+
    firm(L.pts[1].ajuste,1)+' en crucero, contra '+firm(sano.pts[0].ajuste,1)+' y '+
    firm(sano.pts[1].ajuste,1)+' de un sistema sano; lambda de los gases '+lamT(L.lamGases)+
    ' contra '+lamT(sano.lamGases)+'; presión de riel '+bar(L.pRiel,2)+' contra '+bar(sano.pRiel,2)+
    '; batería '+volt(L.vBat,1)+'; cruces '+num(L.cps,2)+NBSP+'1/s contra '+num(sano.cps,2)+
    '; dispersión entre cilindros '+num(L.disp,3)+' contra '+num(sano.disp,3)+
    '; y par a plena carga '+pc(L.parPlena*100,1)+' contra '+pc(sano.parPlena*100,1)+'.';
  let txt=queEra+' '+pruebas;
  if(ok){
    const compradas=Object.keys(RETO.tomadas).length;
    if(compradas<3) txt+=' <span class="warn">Acertaste con sólo '+compradas+
      ' observación'+(compradas===1?'':'es')+': acertar por corazonada y acertar por método se parecen en la respuesta y en nada en el taller.</span>';
    G.resuelto=true;
    synth.beep(660,0.09,0.05); setTimeout(()=>synth.beep(880,0.13,0.05),110);
  }else{
    synth.beep(180,0.14,0.05);
  }
  // Dos versiones del mismo veredicto: la del panel lleva etiquetas y la del
  // pizarrón va en texto plano, porque un lienzo 2D dibujaría las etiquetas
  // literales. Guardar sólo una obliga a que alguna de las dos mienta.
  RETO.veredicto={ok, texto:txt, plano:txt.replace(/<[^>]+>/g,'')};
  pintaReto(); pintaTablero(); pintaTele();
}

// -------------------------------------------------------------- cuestionario
// Una pregunta por modo. La respuesta correcta NO se escribe a mano: se decide
// comparando cifras que acaba de dar el motor sellado, así que si mañana se
// recalibra un arquetipo la pregunta sigue siendo verdad o deja de compilar,
// pero no se queda mintiendo en silencio.
let QUIZ=null;
function preguntaDe(m){
  const e=MQ();
  if(m==='mezcla'){
    const fv=LECT_DE('fugaVacio'), ms=LECT_DE('mafSucio');
    const planoMaf=Math.abs(ms.pts[0].ajuste-ms.pts[1].ajuste)<Math.abs(fv.pts[0].ajuste-fv.pts[1].ajuste);
    return {t:'Una fuga de vacío da '+firm(fv.pts[0].ajuste,1)+' de ajuste a ralentí y '+
      firm(fv.pts[1].ajuste,1)+' en crucero. Un sensor de aire sucio da '+firm(ms.pts[0].ajuste,1)+
      ' y '+firm(ms.pts[1].ajuste,1)+'. ¿Por qué una se aplana y la otra no?',
      ops:[['Porque la fuga es un CAUDAL fijo y pesa cada vez menos cuando el motor bombea más aire, mientras que el sensor se equivoca en el mismo porcentaje siempre',planoMaf],
           ['Porque la fuga se cierra sola al subir la presión del colector',false],
           ['Porque el sensor mide peor a ralentí que en crucero',!planoMaf]],
      exp:'La fuga mete gramos por segundo, no un porcentaje: a ralentí eso es una parte enorme del aire total y a plena carga es una gota. El sensor sucio sub-reporta un tanto por ciento constante. Esa diferencia de FORMA contra la carga es lo único que las separa, y por eso el protocolo tiene que tomarse en más de un punto.'};
  }
  if(m==='aire'){
    const F=FA();
    const a=presionColector(e,e.ralenti,0,F), b=presionColector(e,3000,0,F);
    const baja=b<a;
    return {t:'Con la mariposa cerrada del todo, el colector está a '+bar(a,3)+' a ralentí. '+
      '¿Qué pasa si el motor sube a 3 000 rpm sin tocar la mariposa?',
      ops:[['Baja a '+bar(b,3)+': el motor bombea más deprisa contra la misma restricción y hace más vacío',baja],
           ['Sube a '+bar(b,3)+': más vueltas, más aire entrando',!baja],
           ['No cambia: la presión la fija sólo la mariposa',false]],
      exp:'La presión del colector no es un mando independiente: es el equilibrio entre lo que deja pasar la mariposa y lo que el motor se lleva. Subir de vueltas con la mariposa quieta AUMENTA el vacío. Por eso una fuga de vacío se nota tanto a ralentí, donde la diferencia de presión que la empuja es máxima.'};
  }
  if(m==='inyector'){
    const q1=caudalInyector(e,e.pAtm,{}), q4=caudalInyector(e,e.pAtm,{pRielMul:4});
    const raiz=Math.abs(q4/q1-2)<Math.abs(q4/q1-4);
    return {t:'Este inyector entrega '+gs(q1,3)+' con el riel a su presión nominal. '+
      'Si se cuadruplicara la caída de presión, ¿cuánto entregaría?',
      ops:[['El doble, '+gs(q4,3)+': el caudal va con la RAÍZ de la presión',raiz],
           ['El cuádruple: el caudal es proporcional a la presión',!raiz],
           ['Lo mismo: el caudal lo fija la sección del orificio',false]],
      exp:'Un inyector es un orificio, y por un orificio el caudal va con la raíz de la caída de presión. De ahí sale algo muy poco intuitivo: para recuperar un 10 % de caudal perdido hay que subir la presión un 21 %. Y por eso una presión de riel baja se nota sobre todo donde el pulso ya era largo — a plena carga.'};
  }
  if(m==='sonda'){
    const d1=Math.abs(tensionSonda(0.80)-tensionSonda(0.90));
    const d2=Math.abs(tensionSonda(0.99)-tensionSonda(1.01));
    const menos=d1<d2;
    return {t:'De lambda 0,80 a 0,90 —de humo negro a rica— la sonda mueve '+num(d1*1000,2)+
      NBSP+'mV. De 0,99 a 1,01 mueve '+num(d2*1000,0)+NBSP+'mV. ¿Qué se deduce?',
      ops:[['Que la sonda de banda estrecha sirve para detectar el CRUCE por lambda uno y no para medir cuánto de rica va una mezcla',menos],
           ['Que la sonda está averiada: debería responder igual en toda la banda',!menos],
           ['Que hay que calibrarla antes de cada medición',false]],
      exp:'La curva de Nernst es casi vertical en el estequiométrico. Eso la hace perfecta para lo único que la centralita necesita —saber de qué lado está para corregir— y completamente inútil para responder «¿cuánto de rica?». Esa pregunta la contesta el analizador de gases o una sonda de banda ancha, que es otro principio de medida.'};
  }
  if(m==='lazo'){
    const sn=TRZ({falla:'sano',rpm:2500,acel:0.35}), lt=TRZ({falla:'sondaLenta',rpm:2500,acel:0.35});
    const bajan=lt.cps<sn.cps;
    const medias=Math.abs(lt.lamMedia-sn.lamMedia)<0.01;
    return {t:'Una sonda envejecida da '+num(lt.cps,2)+' cruces por segundo contra '+num(sn.cps,2)+
      ' de una sana, y su mezcla media sale '+lamT(lt.lamMedia)+' contra '+lamT(sn.lamMedia)+
      '. ¿Qué instrumento la caza?',
      ops:[['El osciloscopio: lo único que ha cambiado es la FRECUENCIA, y el escáner no la mira',bajan&&medias],
           ['El escáner: el ajuste largo se dispara',false],
           ['El analizador de gases: la mezcla media se va rica',!medias]],
      exp:'Una sonda lenta sigue diciendo la verdad, sólo que tarde. El lazo la sigue centrando, la mezcla media sale bien y el ajuste largo se queda en cero: el escáner la da por buena y el analizador de gases también. Lo único que cambia es cada cuánto cruza, y ese número hay que ir a buscarlo con el osciloscopio.'};
  }
  if(m==='censo'){
    const C=CENSO(), N=ESCEN_KEYS.length;
    const esc=C.find(c=>c.mask===mascaraDe(['ajRal','ajCruc']));
    const min=C.filter(c=>c.resueltos===N).sort((a,b)=>a.sub.length-b.sub.length)[0];
    const hayFuera=min&&min.sub.some(o=>!o.taller);
    return {t:'Con los dos ajustes del escáner se separan '+esc.resueltos+' de los '+N+
      ' escenarios de este '+e.corto+'. ¿Por qué no llegan a los '+N+'?',
      ops:[['Porque hay averías que dejan los ajustes exactamente donde estaban: una sonda lenta y un filtro tapado no mueven la mezcla',true],
           ['Porque el escáner tiene poca resolución en el ajuste',false],
           ['Porque haría falta tomar los ajustes en más puntos de trabajo',false]],
      exp:'No es resolución ni número de puntos: hay averías que NO tocan la dosificación. Una sonda envejecida centra igual de bien y un filtro tapado se limita a estrangular el llenado, así que la centralita mide bien y dosifica bien. '+
        (hayFuera?'Por eso el juego mínimo que llega a '+N+'/'+N+' en esta máquina incluye una observación que no está en un taller corriente.'
                 :'En esta máquina el juego mínimo se toma entero con lo que hay en cualquier taller.')};
  }
  if(m==='reto'){
    const sv=LECT_DE('sondaVaga'), fa=LECT_DE('filtroAire');
    const svLimpia=Math.abs(sv.pts[1].ajuste)<DTC_UMBRAL*100;
    return {t:'Dos coches llegan con el escáner sin códigos. En uno la lambda de los gases es '+
      lamT(sv.lamGases)+' y en el otro, '+lamT(fa.lamGases)+' con el par a plena carga en '+
      pc(fa.parPlena*100,1)+'. ¿Qué tienen en común?',
      ops:[['Que el escáner no basta para ninguno de los dos: uno miente sobre la mezcla y al otro no le pasa nada que el escáner sepa medir',svLimpia],
           ['Que los dos son la misma avería vista en puntos distintos',false],
           ['Que los dos se arreglan cambiando la sonda',false]],
      exp:'La sonda contaminada dice «pobre» cuando la mezcla ya está bien, la centralita enriquece hasta creerla y la mezcla real se va rica: el ajuste se queda en '+
        firm(sv.pts[1].ajuste,1)+', por debajo del umbral de código. El filtro tapado no toca la dosificación en absoluto: lambda sale '+
        lamT(fa.lamGases)+' y los ajustes en cero, y lo único que se ha perdido es par. Un escáner limpio no es un motor sano.'};
  }
  const s=EST();
  return {t:'El escáner marca ajuste largo '+firm(s.ajustePct,1)+' y ningún código. ¿Qué NO se sabe con eso?',
    ops:[['Dónde está de verdad la mezcla, porque eso depende de si la sonda dice la verdad',true],
         ['Cuánto está corrigiendo la centralita',false],
         ['Si la corrección ha llegado al umbral de código',false]],
    exp:'El ajuste largo mide cuánto corrige la centralita para que la SONDA diga uno. Si la sonda miente, ese número puede salir impecable con la mezcla completamente torcida. Por eso hay que llevar el analizador de gases.'};
}
function refrescaPregunta(){
  QUIZ=preguntaDe(G.modo);
  QUIZ.ops=barajaEn(QUIZ.ops.map(o=>({rot:o[0],ok:o[1]})));
  el('q_text').innerHTML=QUIZ.t;
  el('dxbtns').innerHTML=QUIZ.ops.map((o,i)=>
    '<button class="b" data-q="'+i+'">'+o.rot+'</button>').join('');
}
function responde(i){
  if(!QUIZ||!QUIZ.ops[i]) return;
  const o=QUIZ.ops[i];
  [...el('dxbtns').children].forEach((b,k)=>{
    b.classList.toggle('ok',QUIZ.ops[k].ok);
    b.classList.toggle('wrong',k===i&&!o.ok);
  });
  showToast((o.ok?'<b class="good">Correcto.</b> ':'<b class="bad">No.</b> ')+QUIZ.exp,7600);
  synth.beep(o.ok?740:190,0.10,0.05);
}

function otroCaso(){

  const ops=ESCEN_KEYS.filter(k=>k!==G.esc);
  G.esc=ops[Math.floor(Math.random()*ops.length)];

// ----------------------------------------------------------- recorrido guiado
let autoRunning=false, autoT=[];
function paraAuto(){ autoT.forEach(t=>clearTimeout(t)); autoT=[]; autoRunning=false; syncCtrlbar(); }
function auto(){
  if(autoRunning){ paraAuto(); return; }
  autoRunning=true; syncCtrlbar();
  const paso=[]; let t=200;
  const guion=[
    ['mezcla','<b>1 · Mezcla.</b> El aire se mide, se divide entre 14,70 y se ordena un pulso. Lo que sale se lee al final, en el escape.'],
    ['aire','<b>2 · Aire.</b> A mariposa cerrada, subir de vueltas BAJA la presión del colector. Y lo que el sensor mide no siempre es lo que entra.'],
    ['inyector','<b>3 · Inyector.</b> El caudal va con la raíz de la presión, y el tiempo muerto se dispara cuando cae la batería.'],
    ['sonda','<b>4 · Sonda.</b> De lambda 0,80 a 0,90 no se mueve. Es un detector de cruce, no un medidor.'],
    ['lazo','<b>5 · Lazo.</b> El ajuste corto no puede quedarse quieto. Una sonda vieja sólo se delata en la frecuencia.'],
    ['censo','<b>6 · Censo.</b> Con los dos ajustes del escáner no se separan las trece averías en ninguna máquina.'],
  ];
  guion.forEach(([m,msg])=>{
    paso.push([t,()=>{ setMode(m); showToast(msg,4200); }]); t+=5200;
  });
  paso.push([t,()=>{ paraAuto(); showToast('Recorrido terminado. El reto sigue esperando.',3400); }]);
  paso.forEach(([ms,fn])=>autoT.push(setTimeout(fn,ms)));
}

// ------------------------------------------------------------------- mandos
el('panel').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  if(b.id&&b.id.startsWith('m_')){ setMode(b.id.slice(2)); return; }
  if(b.id==='btnAuto'){ auto(); return; }
  if(b.id==='btnNew'){ otroCaso(); return; }
  if(b.id==='btnPista'){ pista(); return; }
  if(b.id==='btnCheck'){ checkReto(); return; }
  if(b.dataset.mk){ setMaquina(b.dataset.mk); return; }
  if(b.dataset.esc){ G.esc=b.dataset.esc; afterEdit(); refrescaPregunta(); return; }
  if(b.dataset.cb){ G.comb=b.dataset.cb; afterEdit(); refrescaPregunta(); return; }
  if(b.dataset.rpm){ G.rpm=+b.dataset.rpm; afterEdit(); refrescaPregunta(); return; }
  if(b.dataset.ac){ G.acel=+b.dataset.ac; afterEdit(); refrescaPregunta(); return; }
  if(b.dataset.vb){ G.vBat=+b.dataset.vb; afterEdit(); refrescaPregunta(); return; }
  if(b.dataset.ta){ G.Tadm=+b.dataset.ta; afterEdit(); refrescaPregunta(); return; }
  if(b.dataset.obs){ mide(b.dataset.obs); return; }
  if(b.dataset.fam){ RETO.eleccion=b.dataset.fam; pintaDxReto(); pintaTablero(); pintaTele(); return; }
  if(b.dataset.q!==undefined){ responde(+b.dataset.q); return; }
});
function setMaquina(k){
  if(!ARQ[k]) return;
  G.maq=k;
  // El régimen vuelve a un valor que ESTE motor tiene. Arrastrar el ralentí del
  // anterior publicaría cifras de un punto de trabajo inexistente.
  G.rpm=2500;
  construyeMotor();
  if(G.modo==='reto') armaReto();
  afterEdit(); refrescaPregunta();
  // El banco cambia de ancho con el número de cilindros y el pizarrón se mueve
  // con él: reencuadrar es obligatorio, o el V6 se sale por la derecha.
  setMode(G.modo);
}

  get cabecera(){ return cabCombustible()+' | '+cabBateria(); },

  get rpm(){ return G.rpm; },
  get acel(){ return G.acel; },
  get vBat(){ return G.vBat; },
  get vBatEf(){ return vBatEfectiva(); },
  get Tadm(){ return G.Tadm; },
  get est(){ const s=EST(); return {maq:s.maq, comb:s.comb, afrEst:s.afrEst,
    rpm:s.rpm, acel:s.acel, vBat:s.vBat, falla:s.falla,
    lazoAbierto:s.lazoAbierto, saturado:s.saturado,
    map:s.map, etaVol:s.etaVol, mAireCil:s.mAireCil, mMedido:s.mMedido, mAireSeg:s.mAireSeg,
    ajuste:s.ajuste, ajustePct:s.ajustePct,
    tOrden:s.tOrden, tMuerto:s.tMuerto, tAbierto:s.tAbierto,
    ciclo:s.ciclo, dpInyector:s.dpInyector, qInyector:s.qInyector,
    mComb:s.mComb, mPedido:s.mPedido, enriq:s.enriq, afrReal:s.afrReal,
    lam:s.lam, lamSonda:s.lamSonda, vSonda:s.vSonda,
    cil:s.cil.map(c=>({i:c.i, mComb:c.mComb, lam:c.lam})),
    parRel:s.parRel, dtc:s.dtc, mienteSonda:s.mienteSonda}; },
  get traza(){ const s=EST(); if(s.lazoAbierto) return null;
    const T=TRZ(); return {cps:T.cps, cruces:T.cruces, tTrans:T.tTrans, tau:T.tau,
      lamMin:T.lamMin, lamMax:T.lamMax, lamMedia:T.lamMedia, amplitud:T.amplitud,
      n:T.traza.length}; },
  get lect(){ const L=LECT(); return {esc:L.esc, rot:L.rot, clave:L.clave,
    cps:L.cps, pRiel:L.pRiel, disp:L.disp, lamGases:L.lamGases, parPlena:L.parPlena,
    vBat:L.vBat, dtcEn:L.dtcEn.slice(),
    pts:L.pts.map(p=>({k:p.k, ajuste:p.ajuste, lam:p.lam, lamSonda:p.lamSonda,
      ciclo:p.ciclo, tOrden:p.tOrden, map:p.map, dtc:p.dtc, saturado:p.saturado,
      lazoAbierto:p.lazoAbierto, parRel:p.parRel, disp:p.disp}))}; },
  get censo(){ const C=CENSO(), N=ESCEN_KEYS.length;
    const mejor={}; for(const c of C){ const n=c.sub.length;
      if(!mejor[n]||c.resueltos>mejor[n].resueltos) mejor[n]=c; }
    const min=C.filter(c=>c.resueltos===N).sort((a,b)=>a.sub.length-b.sub.length)[0];
    const tal=C.find(x=>x.sub.length===OBS.filter(o=>o.taller).length&&x.sub.every(o=>o.taller));
    const esc=C.find(c=>c.mask===mascaraDe(['ajRal','ajCruc']));
    return {N, taller:tal.resueltos, escaner:esc.resueltos,
      minTam:min?min.sub.length:null, minObs:min?min.sub.map(o=>o.k):null,
      porTam:Object.keys(mejor).map(n=>+mejor[n].resueltos)}; },
  get veredicto(){ const V=veredicto(); return {obj:V.obj, desv:V.desv,

  get reto(){ return {caso:RETO.caso, tomadas:Object.keys(RETO.tomadas),

    veredicto:RETO.veredicto?{ok:RETO.veredicto.ok}:null,
    pistas:RETO.pistas, familias:FAMILIAS_RETO.slice()}; },
  get quiz(){ return QUIZ?{t:QUIZ.t, ops:QUIZ.ops.map(o=>o.rot), ok:QUIZ.ops.findIndex(o=>o.ok)}:null; },
  get autoRunning(){ return autoRunning; },
  get inyectores(){ return REF.inyectores.length; },
  get frames(){ return PINTADAS; },
  setMode:m=>setMode(m),

  mide:k=>mide(k),

  entrega:()=>checkReto(),
  pista:()=>pista(),
  retoNuevo:()=>{ armaReto(); afterEdit(); },
  responde:i=>responde(i),
  otro:()=>otroCaso(),
  auto:()=>auto(),
  cifras:()=>el('tele').textContent+' | '+el('report').textContent,
  texto:()=>el('hud').textContent,
  panel:()=>el('panel').textContent,
};

// ------------------------------------------------------------------- arranque
construyeMotor();
pintaHUD(); afterEdit(); refrescaPregunta();
// El hook del bucle se registra con setAnimate: start() no acepta callback, y
// pasárselo lo descarta en silencio dejando la escena congelada.
S.setAnimate(dt=>pinta3D(dt));
S.start();
// El encuadre de arranque se CALCULA, igual que el de cualquier otro modo, y se
// aplica de golpe. Dejar una cámara escrita a mano en la cabecera obliga a que
// esas seis cifras coincidan con las que sale del cálculo, y en cuanto cambia el
// ancho del banco o la forma de la ventana dejan de coincidir: la página abre en
// un cuadro y salta a otro en cuanto se toca el primer botón.
{ const t=camConjunto(1.00); S.moveTo(t[0],t[1],0.01); }
addEventListener('resize',()=>S.resize());
showToast('El escenario ya está montado. Mueve el <b>acelerador</b> y mira qué le pasa al <b>ajuste largo</b>: ahí empieza todo.',5200);
