<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.26, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);

  }

  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){

      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);

  /* Sonda de escena para las auditorías del 3D. No cambia nada de lo que se ve
     y cuelga de `window.__diag3d`, que ningún laboratorio pisa: así CUALQUIER
     laboratorio construido con este molde se puede auditar —salud(), mira(),

  try { instalaDiag(document.title || location.pathname,
    { escena:scene, camara:camera, controles:controls, renderizador:renderer }); } catch(_){}

    setAnimate:fn=>hook=fn, start, stop, resize, clock,

function pickerFor(scene,camera,dom,onHit){

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

/* ============================================================
   LAB — INYECCIÓN ELECTRÓNICA: SONDA LAMBDA Y AJUSTES DE MEZCLA
   (Dominio D6 · motor de combustión interna · práctica d6-07)

   Qué se mide y con qué
     · Con el escáner: los ajustes de mezcla —largo y corto— en los tres
       puntos del protocolo, el ciclo de trabajo del inyector y los códigos
       de avería.
     · Con el manómetro: la presión del riel. Con el multímetro: la tensión
       de batería con el motor en marcha.
     · Con el analizador de gases: lambda de VERDAD. Con el osciloscopio:
       la onda de la sonda y sus cruces por segundo. Con la prueba de corte:
       la dispersión entre cilindros.

   La tesis de la práctica
     La sonda de banda estrecha NO mide la mezcla: dice de qué lado del
     estequiométrico está. Entre lambda 0,80 y 0,90 su tensión no se mueve
     ni un 2 % de su carrera. Por eso una sonda que miente arrastra a la
     centralita hasta una mezcla rica de verdad mientras los ajustes salen
     impecables y no salta ningún código; y por eso hay averías que sólo se
     ven en la FORMA del ajuste contra la carga, no en su valor.

   Fuentes de referencia
     · Ecuación de Nernst para la celda de circonia y curva publicada de la
       sonda de banda estrecha (Bosch, «Automotive Handbook»).
     · Método de densidad y régimen (speed-density) y rendimiento
       volumétrico — Heywood, «Internal Combustion Engine Fundamentals»,
       cap. 6.
     · Caudal de inyector por raíz de la caída de presión y tabla de tiempo
       muerto contra tensión de batería — catálogo del fabricante.
     · SAE J1979 / ISO 15031-5, modos 01 y 06 del diagnóstico a bordo: de
       ahí salen los ajustes de mezcla y los códigos P0171 y P0172.
     · Manual de taller del fabricante — única fuente del caudal del
       inyector, de la presión del riel y del mapa de UNA centralita
       concreta. Los cuatro motores de este banco NO son comerciales.

   Modelo de ingeniería
     · El lazo cerrado se resuelve por bisección: se busca el ajuste que
       hace que la SONDA diga uno, no el que hace que la mezcla esté bien.
       Cuando la sonda miente, esas dos cosas no son la misma.
     · Mezclar escapes es sumar masas, no promediar lambdas: por eso un
       cilindro pobre arrastra a los otros tres cuando la centralita
       corrige.
     · El ajuste corto no puede quedarse quieto —la sonda sólo detecta el
       cruce—, así que oscila con salto y rampa contra el retardo de
       transporte de los gases y la constante de tiempo de la sonda. Esa
       oscilación es lo único que delata una sonda envejecida.
   ============================================================ */
const mount=document.getElementById('stage');

// Estas seis cifras sólo valen para el primer fotograma: en cuanto la escena
// arranca, el encuadre se CALCULA con camConjunto() y se aplica de golpe, porque

const S=createStage(mount,{cam:[2.2,3.1,4.4],target:[-1.6,1.6,-1.1],bgTop:'#101a24',bgBot:'#05070b',bloom:0.22,minD:2.4,maxD:36});

const el=id=>document.getElementById(id);
// `clamp` NO se declara aquí: lo declara el motor sellado unas líneas más abajo
// y declararlo dos veces es un SyntaxError que mata la página entera antes de
// que exista window.__labDebug.

// ============================================================================
// MOTOR SELLADO — copiado tal cual del fichero de Capa 1, sin tocar una sola
// cifra: lo unico que cambia es que se le quitan los `export`. Cualquier numero
// que aparezca en el pizarron, en la telemetria, en el informe o en el
// cuestionario sale de aqui. La interfaz no recalcula nada por su cuenta.
// ============================================================================

// ============================================================================
//  d6-07 · INYECCION DE COMBUSTIBLE Y SONDA LAMBDA — MOTOR SELLADO
//
//  Molde P+S: panel de instrumentos (escaner, osciloscopio, manometro y
//  analizador de gases) sobre una simulacion numerica del camino del
//  combustible. Aqui NO hay interfaz: aqui solo hay fisica, y todo lo que
//  aparezca en pantalla sale de este fichero.
//
//  La tesis de la practica: LA SONDA DE BANDA ESTRECHA NO MIDE LA MEZCLA. Su
//  tension es una curva de Nernst practicamente vertical en el estequiometrico:
//  a un lado dice «rica» y al otro «pobre», y en toda la banda util de un motor
//  no distingue lambda 0,80 de lambda 0,90. La centralita no regula a una
//  mezcla: regula a un CRUCE. De ahi salen los tres resultados incomodos del
//  laboratorio:
//
//   1. Si la sonda MIENTE —contaminada, o con una fuga de escape delante de
//      ella— la centralita corrige hasta que la sonda dice «uno» y la mezcla
//      REAL se va a donde haga falta. Los ajustes de combustible salen limpios
//      y el motor va rico.
//   2. Una fuga de vacio mete un caudal de aire CONSTANTE, no un porcentaje:
//      pesa muchisimo a ralenti y no se nota a plena carga. Un sensor de aire
//      sucio hace justo lo contrario. Los dos suben el ajuste; el que dice cual
//      es no es el numero, es su forma contra la carga.
//   3. El lazo se ABRE a plena carga y en arranque, que es cuando mas duele:
//      justo entonces la averia que el ajuste tapaba deja de estar tapada.
//
//  Fuentes: relacion estequiometrica de los combustibles y su poder calorifico
//  (Heywood, «Internal Combustion Engine Fundamentals», 1988, cap. 3);
//  ecuacion de Nernst para la celda de circonia y curva de la sonda de banda
//  estrecha (Bosch, «Automotive Handbook»); ecuacion de llenado por densidad y
//  regimen (speed-density) y rendimiento volumetrico (Heywood cap. 6); caudal
//  de inyector por raiz de la caida de presion y tiempo muerto contra tension
//  de bateria (dato de catalogo del fabricante del inyector); estrategia de
//  ajuste corto y largo y apertura del lazo (SAE J1979 / ISO 15031-5, modos 01
//  y 06 del diagnostico a bordo).
// ============================================================================

const DEG = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

// ============================================================================
//  1 · LOS COMBUSTIBLES
//
//  La relacion estequiometrica NO es una constante universal: es una propiedad
//  del combustible. 14,7 es la de la gasolina pura. Con etanol baja, porque el
//  etanol ya lleva oxigeno en la molecula y necesita menos aire. Por eso un
//  motor que corre con E85 pide casi un tercio mas de MASA de combustible para
//  la misma mezcla, y por eso meterle E85 a un motor mapeado para gasolina
//  agota el ajuste largo antes de llegar a nada.
// ============================================================================

const COMBUSTIBLES = [
  { key: 'g100', rot: 'Gasolina sin etanol', corto: 'gasolina', afr: 14.70, pci: 44.0,
    nota: 'La referencia: 14,70 kg de aire por kg de combustible y 44,0 MJ/kg.' },
  { key: 'e10', rot: 'Gasolina con 10 % de etanol', corto: 'E10', afr: 14.08, pci: 41.8,
    nota: 'La que se despacha en casi todas las estaciones. Pide un 4,4 % mas de masa para la misma mezcla.' },
  { key: 'e85', rot: 'E85 (85 % de etanol)', corto: 'E85', afr: 9.77, pci: 29.2,
    nota: 'Pide un 50 % mas de masa que la gasolina pura. En un motor mapeado para gasolina, el ajuste largo no da para tanto.' },
];
const COMB_KEYS = COMBUSTIBLES.map(c => c.key);
const COMB = Object.fromEntries(COMBUSTIBLES.map(c => [c.key, c]));

// La centralita SUPONE gasolina: ese es su numero grabado, y no lo mide.
const AFR_ECU = 14.70;

// ============================================================================
//  2 · LA CARGA DE AIRE
//
//  Metodo de densidad y regimen: la masa de aire que entra en un cilindro por
//  ciclo es el volumen desplazado por la densidad del colector y por el
//  rendimiento volumetrico. El rendimiento volumetrico NO es una constante: es
//  un mapa contra regimen y contra llenado, y su forma es la que le da al motor
//  su curva de par.
// ============================================================================

const R_AIRE = 287.05;                       // J/kg K
const K = c => c + 273.15;

// Rendimiento volumetrico. Una campana en el regimen —maxima donde el motor da
// su par— por un factor de llenado que cae cuando la mariposa esta cerrada,
// porque el cilindro se queda con los gases residuales que no consiguio echar.
function etaVol(e, rpm, mapBar) {
  const x = (rpm - e.rpmPar) / e.anchoRpm;
  const campana = 1 - 0.30 * x * x;
  // A mariposa muy cerrada el residual pesa mucho: lo que el cilindro no
  // consiguio echar se queda dentro y ocupa sitio. Por encima de la atmosferica
  // —un motor sobrealimentado— ese termino ya no penaliza nada.
  const carga = clamp(mapBar / e.pAtm, 0.05, 2.4);
  const resid = 1 - 0.42 * Math.pow(1 - Math.min(carga, 1), 1.6);
  return clamp(e.etaVolMax * campana * resid, 0.10, 1.10);
}

// Presion del colector. Es una CONSECUENCIA de la mariposa y del regimen, no un
// mando independiente. A mariposa cerrada, subir de vueltas BAJA la presion:
// el motor bombea mas deprisa contra la misma restriccion y hace mas vacio. Y
// un motor sobrealimentado pasa de la atmosferica en cuanto el turbo sopla.
function presionColector(e, rpm, acel, F) {
  const min = clamp(e.mapRalenti * Math.pow(e.ralenti / Math.max(rpm, 1), 0.34), 0.10, e.pAtm);
  const techo = e.pMax === undefined ? e.pAtm : e.pMax;
  // El soplado del turbo no aparece de golpe: necesita gasto, y por eso el
  // techo util crece con el regimen hasta el del compresor.
  const tope = e.pMax === undefined ? techo
    : e.pAtm + (techo - e.pAtm) * clamp((rpm - e.rpmSopla) / (e.rpmPar - e.rpmSopla), 0, 1);
  const p = min + (tope - min) * Math.pow(clamp(acel, 0, 1), 0.62);
  // Un filtro de aire tapado es una perdida de carga AGUAS ARRIBA: con la
  // mariposa abierta del todo, el colector ya no llega adonde llegaba.
  return clamp(p * (F.filtroMul === undefined ? 1 : F.filtroMul), 0.10, techo);
}

// Masa de aire por cilindro y por ciclo, en gramos. Esta es la que de verdad
// entra; lo que la centralita CREE que entra es otra cosa, y esa diferencia es
// media practica.
function masaAireCiclo(e, rpm, mapBar, Tadm) {
  const Vcil = (e.cil / e.nCil) * 1e-6;             // m3
  const rho = (mapBar * 1e5) / (R_AIRE * K(Tadm));  // kg/m3
  return etaVol(e, rpm, mapBar) * Vcil * rho * 1000;
}

// ============================================================================
//  3 · EL INYECTOR
//
//  Un inyector es una valvula que se abre un tiempo. Lo que entrega es su
//  caudal estatico por el tiempo que esta ABIERTO, y ese tiempo no es el que la
//  centralita ordena: hay que descontar lo que tarda en abrir, que depende de la
//  tension de la bateria y que la centralita compensa con una tabla. El caudal
//  estatico escala con la RAIZ de la caida de presion a traves del inyector.
// ============================================================================

// Tiempo muerto del inyector contra la tension de bateria, en milisegundos.
// Tabla del catalogo del inyector: crece muy deprisa al bajar la tension.
const TABLA_TMUERTO = [[8, 2.35], [10, 1.55], [12, 1.05], [13.5, 0.80], [14.5, 0.68], [16, 0.55]];
function tMuerto(vBat) {
  const T = TABLA_TMUERTO;
  if (vBat <= T[0][0]) return T[0][1];
  if (vBat >= T[T.length - 1][0]) return T[T.length - 1][1];
  for (let i = 1; i < T.length; i++) {
    if (vBat <= T[i][0]) {
      const [x0, y0] = T[i - 1], [x1, y1] = T[i];
      return y0 + (y1 - y0) * (vBat - x0) / (x1 - x0);
    }
  }
  return T[T.length - 1][1];
}

// Caida de presion a traves del inyector. Con regulador referenciado al vacio
// —el de los sistemas con retorno— la caida es CONSTANTE pase lo que pase en el
// colector. Sin retorno, el riel esta a presion fija contra la atmosfera y la
// caida sube con el vacio: el mismo tiempo de pulso entrega mas combustible a
// ralenti que a plena carga, y la centralita tiene que saberlo.
function caidaInyector(e, mapBar, F) {
  const riel = e.pRiel * (F.pRielMul === undefined ? 1 : F.pRielMul);
  return e.referenciado ? riel : clamp(riel + (e.pAtm - mapBar), 0.5, 12);
}

// Caudal estatico corregido por la caida real, en gramos por segundo.
function caudalInyector(e, mapBar, F) {
  const dp = caidaInyector(e, mapBar, F);
  return e.qEstatico * Math.sqrt(dp / e.pRiel);
}

// Ciclo de trabajo del inyector: en secuencial completa, una inyeccion cada dos
// vueltas. Por encima del 85 % el inyector ya no tiene donde crecer.
const cicloInyector = (tms, rpm) => (tms * rpm) / (2 * 60 * 1000) * 100;

// ============================================================================
//  4 · LA SONDA
//
//  Banda estrecha: celda de circonia que da una tension de Nernst entre los dos
//  lados. La curva es practicamente vertical en el estequiometrico. ESA es la
//  clave de la practica: la sonda no mide la mezcla, dice de que lado esta.
//
//  Banda ancha: celda de bombeo que MIDE lambda de verdad en toda la banda util.
//  Es la unica manera de saber si la de banda estrecha esta mintiendo.
// ============================================================================

const V_POBRE = 0.10, V_RICA = 0.90, K_NERNST = 78;
function tensionSonda(lam) {
  // Logistica muy empinada centrada en lambda = 1. Con K = 78, de 0,99 a 1,01
  // la tension recorre casi toda su carrera: eso es lo que hace que la sonda
  // sea un DETECTOR DE CRUCE y no un medidor.
  return V_POBRE + (V_RICA - V_POBRE) / (1 + Math.exp(K_NERNST * (lam - 1)));
}
const UMBRAL_CRUCE = 0.45;                   // el umbral que usa la centralita

// ============================================================================
//  5 · LAS AVERIAS
//
//  Cada averia se declara por lo que CAMBIA fisicamente, nunca por su sintoma.
//  El sintoma lo tiene que sacar el modelo.
// ============================================================================

const FALLAS = {

    nota: 'La sonda dice «pobre» cuando la mezcla ya está bien, y con el MISMO error en todos los puntos de trabajo. La centralita enriquece hasta que la sonda dice «uno», y la mezcla REAL se va rica. Los ajustes salen limpios y el analizador de gases no.' },
  fugaEscape: { fugaEscapeGs: 0.42, rot: 'Fuga de escape delante de la sonda',
    nota: 'Entra al escape un caudal de aire CONSTANTE por una junta rota. La sonda lo lee como mezcla pobre y la centralita enriquece. Igual que la sonda contaminada en el desenlace, pero su peso relativo se hunde con el gasto: molesta a ralentí y casi no se nota en crucero.' },
  purga: { combExtraGs: 0.0144, rot: 'Válvula de purga del cánister pegada',
    nota: 'Entra combustible que la centralita no ha inyectado. Como el caudal es casi constante, molesta a ralentí y desaparece con carga: el ajuste largo se va NEGATIVO abajo.' },
  filtroAire: { filtroMul: 0.72, rot: 'Filtro de aire tapado',
    nota: 'Estrangula el llenado. La centralita mide bien el aire que entra y dosifica bien: lambda no se mueve y los ajustes tampoco. Lo único que se pierde es par, y de eso el escáner no dice nada.' },
  bateriaBaja: { vBat: 10.6, rot: 'Tensión de batería baja',
    nota: 'El tiempo muerto del inyector se dispara. La centralita lo compensa con su tabla, así que la mezcla aguanta; lo que cambia es que el pulso ordenado crece y el ciclo de trabajo se acerca a su techo.' },
  combE85: { comb: 'e85', rot: 'Depósito lleno de E85',
    nota: 'Pide un 50 % más de masa. El ajuste largo se planta en su tope del 25 % y el motor se queda pobre de verdad: es la única avería en la que la centralita se rinde.' },
};
const FALLA_KEYS = Object.keys(FALLAS);

// ============================================================================
//  6 · EL LAZO
//
//  La centralita calcula el combustible con el aire que CREE que entra y con la
//  relacion estequiometrica que tiene GRABADA, y despues corrige con lo que le
//  dice la sonda. Aqui se resuelve el permanente: cuanto tiene que corregir para
//  que la sonda diga «uno», y a donde acaba yendo la mezcla de verdad.
// ============================================================================

const AUTORIDAD = 0.25;    // +-25 % de ajuste total. Valor DECLARADO.
const DTC_UMBRAL = 0.10;   // a partir de +-10 % de ajuste largo, codigo

// Lo que la centralita cree que entra de aire, por cilindro y ciclo, en gramos.
function aireMedido(e, rpm, mapBar, Tadm, F) {
  const real = masaAireCiclo(e, rpm, mapBar, Tadm);
  return real * (F.mafMul === undefined ? 1 : F.mafMul);
}

// Lo que de verdad entra: lo que pasa por el sensor mas lo que se cuela por la
// fuga. La fuga es un CAUDAL —gramos por segundo— y por eso su peso relativo
// depende del regimen y de la carga: ahi esta toda la gracia.
function aireReal(e, rpm, mapBar, Tadm, F) {
  const medido = masaAireCiclo(e, rpm, mapBar, Tadm);
  const ciclosPorSeg = rpm / (2 * 60) * e.nCil;     // inyecciones por segundo
  const fuga = (F.fugaGs || 0) / Math.max(ciclosPorSeg, 1e-9);
  return medido + fuga;
}

// El combustible que de verdad entra en UN cilindro, en gramos.
function combReal(e, i, tOrden, rpm, mapBar, F, vBat) {
  const q = caudalInyector(e, mapBar, F);           // g/s con el inyector abierto
  const td = tMuerto(vBat);
  const abierto = Math.max(tOrden - td, 0);         // ms de verdad abierto
  const mul = (F.injCilMul && F.injCilMul[i] !== undefined) ? F.injCilMul[i] : 1;
  const ciclosPorSeg = rpm / (2 * 60) * e.nCil;
  const extra = (F.combExtraGs || 0) / Math.max(ciclosPorSeg, 1e-9);
  return q * (abierto / 1000) * mul + extra;
}

// El tiempo que la centralita ORDENA para una masa de combustible pedida.
function tOrdenado(e, mComb, rpm, mapBar, F, vBat) {
  const q = caudalInyector(e, mapBar, F);
  // La centralita conoce su tabla de tiempo muerto y la suma. Lo que NO conoce
  // es que el riel este a otra presion: eso lo tiene que descubrir la sonda.
  const qCreido = e.qEstatico * Math.sqrt(caidaInyector(e, mapBar, {}) / e.pRiel);
  return (mComb / qCreido) * 1000 + tMuerto(vBat);
}

// Lambda de la mezcla de los cuatro escapes, y lambda de cada cilindro. La sonda
// va en el colector de escape: ve la MEZCLA, y mezclar escapes es sumar masas,
// no promediar lambdas.
function lambdaDe(mAire, mComb, afrEst) {
  return mComb > 1e-12 ? (mAire / mComb) / afrEst : Infinity;
}

// El camino del combustible en UN punto de trabajo, parametrizado por el ajuste
// total. Se saca aparte porque lo necesitan los dos: el permanente, que busca el
// ajuste que centra la sonda, y la traza, que perturba ese ajuste y mira a donde
// se va la mezcla. Calcularlo dos veces con codigo distinto es la forma mas
// segura de que el permanente y la traza acaben contando cosas diferentes.
function camino(e, o = {}) {
  const F = FALLAS[o.falla || 'sano'];
  const combKey = F.comb || o.comb || 'g100';
  const C = COMB[combKey];
  const rpm = o.rpm === undefined ? e.ralenti : o.rpm;
  const acel = o.acel === undefined ? 0 : clamp(o.acel, 0, 1);
  const Tadm = o.Tadm === undefined ? 35 : o.Tadm;
  const vBat = o.vBat === undefined ? (F.vBat === undefined ? 13.8 : F.vBat) : o.vBat;
  const lazoAbierto = !!o.abierto || acel >= e.acelPotencia;

  const map = presionColector(e, rpm, acel, F);
  const mAireCil = aireReal(e, rpm, map, Tadm, F);
  const mMedido = aireMedido(e, rpm, map, Tadm, F);

  // Lo que la sonda LEE no tiene por que ser lo que hay, y las dos maneras de
  // enganyarla NO se parecen aunque acaben igual:
  //   · una sonda contaminada tiene un SESGO propio, el mismo en todos los
  //     puntos de trabajo;
  //   · una fuga de escape delante de ella le mete un CAUDAL de aire constante,
  //     asi que su peso relativo se hunde en cuanto el motor bombea de verdad.
  // Esa diferencia de forma contra la carga es lo unico que las separa, y es lo
  // que el laboratorio quiere que se vea.
  const ciclosPorSeg = rpm / (2 * 60) * e.nCil;
  const aireEscapeCil = (F.fugaEscapeGs || 0) / Math.max(ciclosPorSeg, 1e-9);
  const leeSonda = (lam, mComb) => {
    const lamConFuga = mComb > 1e-12
      ? ((mAireCil + aireEscapeCil) / mComb) / C.afr
      : Infinity;
    return lamConFuga * (1 + (F.sondaSesgo || 0));
  };

  // Reparto por cilindro con un ajuste dado, y lambda de la mezcla de escapes.
  // Mezclar escapes es SUMAR MASAS, no promediar lambdas: por eso un cilindro
  // pobre arrastra a los otros tres cuando la centralita corrige.
  const conAjuste = T => {
    const pedido = (mMedido / AFR_ECU) * (1 + T) * (lazoAbierto ? e.enriqPotencia : 1);
    const tOrd = tOrdenado(e, pedido, rpm, map, F, vBat);
    let sumaC = 0;
    const cil = [];
    for (let i = 0; i < e.nCil; i++) {
      const mc = combReal(e, i, tOrd, rpm, map, F, vBat);
      sumaC += mc;
      cil.push({ i, mComb: mc, lam: lambdaDe(mAireCil, mc, C.afr) });
    }
    const mCombMedio = sumaC / e.nCil;
    const lam = lambdaDe(mAireCil, mCombMedio, C.afr);
    // `pedido` es lo que la centralita QUERIA meter; `mCombMedio` es lo que de
    // verdad entro. La diferencia entre los dos es exactamente el grupo de
    // averias del inyector y del riel, y por eso se publican los dos.
    return { T, tOrd, cil, pedido, mCombMedio, lam, lamSonda: leeSonda(lam, mCombMedio) };
  };

  // En lazo cerrado la centralita busca el ajuste que hace que la SONDA diga
  // uno. Es monotona decreciente en T —mas combustible, menos lambda— asi que
  // se resuelve por biseccion. Y tiene un tope: su autoridad.
  const centra = () => {
    if (lazoAbierto) return { T: 0, saturado: false };
    let lo = -AUTORIDAD, hi = AUTORIDAD;
    const f = t => conAjuste(t).lamSonda - 1;
    if (f(lo) < 0) return { T: lo, saturado: true };   // ni quitando todo baja a uno
    if (f(hi) > 0) return { T: hi, saturado: true };   // ni metiendo todo sube a uno
    for (let k = 0; k < 80; k++) {
      const mid = (lo + hi) / 2;
      if (f(mid) > 0) lo = mid; else hi = mid;
    }
    return { T: (lo + hi) / 2, saturado: false };
  };
  return { F, C, combKey, rpm, acel, Tadm, vBat, lazoAbierto, map, mAireCil, mMedido,
    conAjuste, centra, leeSonda };
}

function estado(e, o = {}) {
  const X = camino(e, o);
  const { F, C, combKey, rpm, acel, Tadm, vBat, lazoAbierto, map, mAireCil, mMedido } = X;
  const { T, saturado } = X.centra();
  const S = X.conAjuste(T);

  const ciclo = cicloInyector(S.tOrd, rpm);
  const dp = caidaInyector(e, map, F);
  const mAireSeg = mAireCil * (rpm / (2 * 60)) * e.nCil;
  // Par al freno: proporcional al COMBUSTIBLE QUEMADO, y sólo se quema lo que
  // encuentra oxígeno. Con mezcla rica sobra combustible; con mezcla pobre
  // sobra aire y el motor pierde par y acaba fallando.
  const quemado = Math.min(S.mCombMedio, mAireCil / C.afr);
  const parRel = clamp(quemado * C.pci / (e.mCombNom * COMB.g100.pci), 0, 2);

  return {
    maq: e.key, comb: combKey, afrEst: C.afr, rpm, acel, Tadm, vBat,
    falla: o.falla || 'sano', lazoAbierto, saturado,
    map, etaVol: etaVol(e, rpm, map), mAireCil, mMedido, mAireSeg,
    ajuste: T, ajustePct: T * 100,
    tOrden: S.tOrd, tMuerto: tMuerto(vBat), tAbierto: Math.max(S.tOrd - tMuerto(vBat), 0),
    ciclo, dpInyector: dp, qInyector: caudalInyector(e, map, F),
    mComb: S.mCombMedio, mPedido: S.pedido,
    enriq: lazoAbierto ? e.enriqPotencia : 1,
    afrReal: S.mCombMedio > 1e-12 ? mAireCil / S.mCombMedio : Infinity,
    lam: S.lam, lamSonda: S.lamSonda, vSonda: tensionSonda(S.lamSonda),
    cil: S.cil, parRel,
    dtc: !lazoAbierto && Math.abs(T) >= DTC_UMBRAL
      ? (T > 0 ? 'P0171 · sistema demasiado pobre' : 'P0172 · sistema demasiado rico') : null,
    // Lo que el analizador de gases mide es lambda REAL, no lo que dice la sonda.
    // Esa diferencia es el corazon de dos de las averias.
    mienteSonda: Math.abs(S.lamSonda - S.lam) > 1e-6,
  };
}

// ============================================================================
//  7 · EL LAZO EN EL TIEMPO
//
//  El permanente no cuenta toda la historia. La centralita de banda estrecha no
//  puede quedarse quieta: como la sonda solo dice de que lado esta, el ajuste
//  corto tiene que OSCILAR alrededor del estequiometrico. La frecuencia de esa
//  oscilacion la fija el retardo total del lazo —el viaje de los gases hasta la
//  sonda mas la constante de tiempo de la sonda— y es la unica manera de ver una
//  sonda envejecida, porque su mezcla MEDIA sigue saliendo bien.
// ============================================================================

function trazaLazo(e, o = {}) {
  const rpm = o.rpm === undefined ? 2500 : o.rpm;
  const dur = o.dur === undefined ? 8 : o.dur;
  const dt = o.dt === undefined ? 0.002 : o.dt;
  const X = camino(e, { ...o, rpm, abierto: false });
  const F = X.F;
  const { T: largo } = X.centra();
  const S0 = X.conAjuste(largo);
  const lam0 = S0.lam;
  // En KILOGRAMOS por segundo. `mAireCil` viene en gramos, y olvidar el factor
  // mil dejaba el retardo de transporte pegado a su tope inferior: el lazo
  // oscilaba a cuarenta y cinco cruces por segundo y una sonda envejecida daba
  // exactamente el mismo numero que una sana.
  const mAireSeg = X.mAireCil * (rpm / (2 * 60)) * e.nCil / 1000;

  // Retardo de transporte: lo que tardan los gases en llegar a la sonda. Va con
  // el inverso del gasto, porque el motor bombea mas deprisa. La sonda de un
  // motor a 5 000 rpm ve lo que paso hace mucho menos tiempo que la de un motor
  // a ralenti, y por eso el lazo oscila mas rapido arriba.
  const tTrans = clamp(e.volEscape / Math.max(mAireSeg / 1.18, 1e-9), 0.01, 1.2);
  const tau = e.tauSonda * (F.tauMul === undefined ? 1 : F.tauMul);
  const salto = e.saltoCorto, rampa = e.rampaCorta;   // % y %/s

  const nRet = Math.max(1, Math.round(tTrans / dt));
  const cola = new Array(nRet).fill(S0);
  let corto = 0, lamFiltrada = X.leeSonda(lam0, S0.mCombMedio), sentido = 0, cruces = 0;
  const traza = [];
  let primero = null, ultimo = null;

  for (let k = 0, t = 0; t <= dur; k++, t += dt) {
    // Mezcla instantanea: el ajuste largo que la centralita ya aprendio MAS el
    // corto de este instante, por el mismo camino de combustible que usa el
    // permanente. No hay una segunda formula que pueda decir otra cosa.
    const Si = X.conAjuste(largo + corto);
    const lamInst = Si.lam;
    cola.push(Si);
    const enSonda = cola.shift();
    // La sonda no responde al instante: primer orden con su constante de tiempo.
    const leido = X.leeSonda(enSonda.lam, enSonda.mCombMedio);
    lamFiltrada += (leido - lamFiltrada) * (dt / tau);
    const v = tensionSonda(lamFiltrada);

    // Estrategia de salto y rampa: al cruzar, un salto en sentido contrario y
    // despues una rampa lenta hasta el siguiente cruce.
    const rica = v > UMBRAL_CRUCE;
    const nuevoSentido = rica ? -1 : +1;
    if (sentido !== 0 && nuevoSentido !== sentido) {
      corto += nuevoSentido * salto / 100;
      cruces++;
      if (primero === null) primero = t;
      ultimo = t;
    } else {
      corto += nuevoSentido * (rampa / 100) * dt;
    }
    sentido = nuevoSentido;
    corto = clamp(corto, -AUTORIDAD, AUTORIDAD);
    if (k % 5 === 0) traza.push({ t, lam: lamInst, lamSonda: lamFiltrada, v, corto: corto * 100 });
  }

  // Los cruces por segundo se cuentan sobre la ventana en la que de verdad
  // hubo cruces: contar sobre toda la duracion penaliza el arranque del lazo.
  const ventana = (primero !== null && ultimo !== null && ultimo > primero) ? ultimo - primero : dur;
  const cps = cruces > 1 ? (cruces - 1) / ventana : 0;
  const lams = traza.map(p => p.lam);
  return {
    traza, cruces, cps, tTrans, tau,
    lamMin: Math.min(...lams), lamMax: Math.max(...lams),
    lamMedia: lams.reduce((a, b) => a + b, 0) / lams.length,
    amplitud: (Math.max(...lams) - Math.min(...lams)) / 2,
  };
}

// ============================================================================
//  8 · ESCENARIOS, PROTOCOLO Y CENSO
// ============================================================================

const ESCEN = {
  sano:         { rot: 'Sistema sano', falla: 'sano', clave: 'nada que reparar' },
  fugaVacio:    { rot: 'Fuga de vacío después de la mariposa', falla: 'fugaVacio', clave: 'aire sin medir' },
  mafSucio:     { rot: 'Sensor de aire sucio', falla: 'mafSucio', clave: 'medición de aire' },
  inyObstruido: { rot: 'Un inyector obstruido', falla: 'inyObstruido', clave: 'inyector' },
  presionBaja:  { rot: 'Presión de riel baja', falla: 'presionBaja', clave: 'presión de combustible' },
  presionAlta:  { rot: 'Presión de riel alta', falla: 'presionAlta', clave: 'presión de combustible' },
  sondaLenta:   { rot: 'Sonda envejecida: responde lenta', falla: 'sondaLenta', clave: 'sonda' },
  sondaVaga:    { rot: 'Sonda contaminada: lee pobre de más', falla: 'sondaVaga', clave: 'sonda' },
  fugaEscape:   { rot: 'Fuga de escape delante de la sonda', falla: 'fugaEscape', clave: 'escape' },
  purga:        { rot: 'Válvula de purga del cánister pegada', falla: 'purga', clave: 'combustible de más' },
  filtroAire:   { rot: 'Filtro de aire tapado', falla: 'filtroAire', clave: 'admisión estrangulada' },
  bateriaBaja:  { rot: 'Tensión de batería baja', falla: 'bateriaBaja', clave: 'alimentación eléctrica' },
  combE85:      { rot: 'Depósito lleno de E85', falla: 'combE85', clave: 'combustible equivocado' },
};
const ESCEN_KEYS = Object.keys(ESCEN);
const FAMILIAS = [...new Set(ESCEN_KEYS.map(k => ESCEN[k].clave))];

// Los tres puntos del protocolo. Se toman con el escaner conectado y el coche
// en el patio o dando una vuelta; no hace falta desmontar nada.
const PUNTOS = [
  { k: 'ralenti', rot: 'ralentí en el patio', ral: true, acel: 0 },
  { k: 'crucero', rot: '2 500 rpm a media carga', rpm: 2500, acel: 0.35 },
  { k: 'plena', rot: '4 000 rpm con el pie a fondo', rpm: 4000, acel: 1 },
];

function lecturas(e, esc, o = {}) {
  const E = ESCEN[esc];
  const base = { comb: o.comb || 'g100', Tadm: o.Tadm === undefined ? 35 : o.Tadm, falla: E.falla };
  const pts = PUNTOS.map(P => {
    const s = estado(e, { ...base, rpm: P.ral ? e.ralenti : P.rpm, acel: P.acel });
    return { k: P.k, rot: P.rot, ajuste: s.ajustePct, lam: s.lam, lamSonda: s.lamSonda,
      ciclo: s.ciclo, tOrden: s.tOrden, map: s.map, dtc: s.dtc, saturado: s.saturado,
      lazoAbierto: s.lazoAbierto, parRel: s.parRel,
      disp: Math.max(...s.cil.map(c => c.lam)) - Math.min(...s.cil.map(c => c.lam)) };
  });
  const T = trazaLazo(e, { ...base, rpm: 2500, acel: 0.35 });
  const pr = estado(e, { ...base, rpm: e.ralenti, acel: 0 });
  return { esc, rot: E.rot, clave: E.clave, pts, cps: T.cps,
    pRiel: e.pRiel * (FALLAS[E.falla].pRielMul === undefined ? 1 : FALLAS[E.falla].pRielMul),
    disp: pts[1].disp, lamGases: pts[1].lam, parPlena: pts[2].parRel, vBat: pr.vBat,
    dtcEn: pts.filter(p => p.dtc).map(p => p.k) };
}

// Las ocho observaciones. Las cinco primeras salen del escaner y del manometro,
// que hay en cualquier taller; las tres ultimas piden analizador de gases,
// osciloscopio o una prueba de corte, y por eso valen aparte.
const OBS = [
  { k: 'ajRal',   rot: 'Ajuste largo a ralentí (escáner)', res: 2, uni: '%', taller: true },
  { k: 'ajCruc',  rot: 'Ajuste largo en crucero (escáner)', res: 2, uni: '%', taller: true },
  { k: 'ciclo',   rot: 'Ciclo de trabajo del inyector a plena carga', res: 5, uni: '%', taller: true },
  { k: 'presion', rot: 'Presión del riel con el manómetro', res: 0.2, uni: 'bar', taller: true },
  { k: 'bateria', rot: 'Tensión de batería con el motor en marcha', res: 0.5, uni: 'V', taller: true },
  { k: 'lambda',  rot: 'Lambda real con el analizador de gases', res: 0.02, uni: '', taller: false },
  { k: 'cruces',  rot: 'Cruces por segundo de la sonda (osciloscopio)', res: 0.5, uni: '1/s', taller: false },
  { k: 'balance', rot: 'Dispersión entre cilindros (prueba de corte)', res: 0.05, uni: '', taller: false },
];
const cuant = (x, r) => Math.round(x / r) * r;

function firmaObs(e, L, sub) {
  return sub.map(m => {
    if (m.k === 'ajRal') return cuant(L.pts[0].ajuste, m.res).toFixed(0);
    if (m.k === 'ajCruc') return cuant(L.pts[1].ajuste, m.res).toFixed(0);
    if (m.k === 'ciclo') return cuant(L.pts[2].ciclo, m.res).toFixed(0);
    if (m.k === 'presion') return cuant(L.pRiel, m.res).toFixed(1);
    if (m.k === 'bateria') return cuant(L.vBat, m.res).toFixed(1);
    if (m.k === 'lambda') return cuant(L.lamGases, m.res).toFixed(2);
    if (m.k === 'cruces') return cuant(L.cps, m.res).toFixed(1);
    if (m.k === 'balance') return cuant(L.disp, m.res).toFixed(2);
    return '?';
  }).join('|');
}

function censoSub(e, o = {}) {
  const cache = ESCEN_KEYS.map(k => ({ k, L: lecturas(e, k, o) }));
  const out = [];
  for (let m = 1; m < (1 << OBS.length); m++) {
    const sub = OBS.filter((_, i) => m & (1 << i));
    const grupos = new Map();
    for (const { k, L } of cache) {
      const f = firmaObs(e, L, sub);
      if (!grupos.has(f)) grupos.set(f, []);
      grupos.get(f).push({ k, clave: L.clave });
    }
    let conflictos = 0, enConflicto = 0;
    for (const g of grupos.values()) {
      const claves = new Set(g.map(x => x.clave));
      if (claves.size > 1) { conflictos++; enConflicto += g.length; }
    }
    out.push({ mask: m, sub, clases: grupos.size, n: cache.length,
      conflictos, enConflicto, resueltos: cache.length - enConflicto });
  }
  out.sort((a, b) => (b.resueltos - a.resueltos) || (a.sub.length - b.sub.length) || (b.clases - a.clases));
  return out;
}
function casosReto() { return ESCEN_KEYS.filter(k => k !== 'sano'); }

// ============================================================================
//  9 · ARQUETIPOS
//
//  Cuatro motores de inyeccion. Sus cotas caen dentro de las bandas publicadas
//  para su familia, pero NO son modelos comerciales: el caudal del inyector, la
//  presion del riel y el mapa de una centralita concreta estan en su manual de
//  taller y en ningun otro sitio.
// ============================================================================

const mkMaq = m => ({ ...m,
  pAtm: 1.013,
  // Masa de combustible de referencia: la que pediria el motor con el colector
  // lleno del todo —atmosferica, o la presion del turbo si lo lleva— al
  // rendimiento volumetrico maximo y con gasolina. Sirve solo para normalizar el
  // par relativo, y por eso el turbo se normaliza contra SU techo y no contra la
  // atmosferica: si no, su par relativo saldria por encima de dos y no
  // significaria nada.
  mCombNom: (m.cil / m.nCil) * 1e-6 * ((m.pMax === undefined ? 1.013 : m.pMax) * 1e5 / (R_AIRE * K(35)))
    * m.etaVolMax * 1000 / COMB.g100.afr,
});

// Espacio fino no separable: el mismo que usa el resto del dominio D6. Nunca se
// llama a toLocaleString, que en este navegador formatea a la inglesa.
const NBSP=' ';
function num(x,d=1){
  if(x===null||x===undefined) return '—';
  if(!isFinite(x)) return x>0?'∞':'—';
  const s=Math.abs(x).toFixed(d);
  const [ent,dec]=s.split('.');
  let e=''; for(let i=0;i<ent.length;i++){ if(i>0 && (ent.length-i)%3===0) e+=NBSP; e+=ent[i]; }
  return (x<0?'−':'')+e+(dec?','+dec:'');
}
const gC=(x,d=0)=>num(x,d)+NBSP+'°C';
const bar=(x,d=2)=>num(x,d)+NBSP+'bar';
const volt=(x,d=1)=>num(x,d)+NBSP+'V';
const mili=(x,d=2)=>num(x,d)+NBSP+'ms';
const gs=(x,d=2)=>num(x,d)+NBSP+'g/s';
const mg=(x,d=1)=>num(x,d)+NBSP+'mg';
const pc=(x,d=1)=>num(x,d)+NBSP+'%';
const rpmT=x=>num(x,0)+NBSP+'rpm';
// El ajuste se escribe SIEMPRE con signo: un +12 % y un −12 % apuntan a averías
// opuestas, y un «12 %» a secas no dice nada.
const firm=(x,d=1)=>(x>=0?'+':'')+num(x,d)+NBSP+'%';
const lamT=(x,d=3)=>isFinite(x)?num(x,d):'—';

// --- estado observable ------------------------------------------------------
const G={
  maq:'g16',          // clave de ARQ
  comb:'g100',        // clave de COMB — lo que el alumno cree que hay en el depósito
  esc:'sano',         // clave de ESCEN
  rpm:2500,           // régimen del motor
  acel:0.35,          // posición del acelerador, 0..1
  vBat:13.8,          // tensión de batería con el motor en marcha
  Tadm:35,            // temperatura del aire de admisión, °C
  modo:'mezcla',
  resuelto:false
};
const MQ=()=>ARQ[G.maq];
const FALLA=()=>ESCEN[G.esc].falla;
const FA=()=>FALLAS[FALLA()];

// El escenario puede imponer el combustible —el depósito lleno de E85— y puede
// imponer la tensión de batería. Cuando lo hace, manda el escenario: es parte de
// la avería, no una elección de quien opera el banco.
const combEfectivo=()=>FA().comb||G.comb;
const combForzado=()=>!!FA().comb;
const vBatEfectiva=()=>FA().vBat===undefined?G.vBat:FA().vBat;
const vBatForzada=()=>FA().vBat!==undefined;
const CB=()=>COMB[combEfectivo()];

// --- capa de memoria --------------------------------------------------------
// `estado`, `trazaLazo` y `censoSub` se piden muchas veces por fotograma —y la
// traza recorre cuatro mil pasos—. Se cachean por firma EXACTA de los
// argumentos: si cambia un solo dígito se recalcula. Nunca se reutiliza una
// cifra «parecida».
const MEMO=new Map();
function memo(k,fn){ if(MEMO.has(k)) return MEMO.get(k); const v=fn(); MEMO.set(k,v); return v; }
function invalida(){ MEMO.clear(); }

// La tensión SÓLO se pasa cuando no la impone la avería: el motor sellado
// entiende `undefined` como «la que traiga el vehículo», y pasarle la del mando
// borraría la batería baja del escenario que la declara.
function argsPunto(o={}){
  return {
    comb:G.comb,
    rpm:o.rpm===undefined?G.rpm:o.rpm,
    acel:o.acel===undefined?G.acel:o.acel,
    Tadm:o.Tadm===undefined?G.Tadm:o.Tadm,
    vBat:o.vBat!==undefined?o.vBat:(vBatForzada()?undefined:G.vBat),
    falla:o.falla===undefined?FALLA():o.falla,
    abierto:o.abierto
  };
}
function EST(o={}){
  const a=argsPunto(o);
  return memo(`e|${G.maq}|${a.comb}|${a.falla}|${a.rpm}|${a.acel}|${a.Tadm}|${a.vBat}|${!!a.abierto}`,
    ()=>estado(MQ(),a));
}
function TRZ(o={}){
  const a=argsPunto(o);
  return memo(`t|${G.maq}|${a.comb}|${a.falla}|${a.rpm}|${a.acel}|${a.Tadm}|${a.vBat}`,
    ()=>trazaLazo(MQ(),a));
}
// El protocolo se toma con la máquina como está: en sus tres puntos, con el aire
// a la temperatura del banco y con la batería que traiga el vehículo. NO lleva
// los mandos de régimen, acelerador ni tensión, porque un protocolo que cambia
// con quien lo toma no sirve para comparar dos coches.
function LECT(){ return memo(`l|${G.maq}|${G.esc}|${G.comb}|${G.Tadm}`,
  ()=>lecturas(MQ(),G.esc,{comb:G.comb,Tadm:G.Tadm})); }
function LECT_DE(esc){ return memo(`l|${G.maq}|${esc}|${G.comb}|${G.Tadm}`,
  ()=>lecturas(MQ(),esc,{comb:G.comb,Tadm:G.Tadm})); }
function CENSO(){ return memo(`n|${G.maq}|${G.comb}|${G.Tadm}`,
  ()=>censoSub(MQ(),{comb:G.comb,Tadm:G.Tadm})); }

// ============================================================================
// VEREDICTOS
//
// Se evalúan SEPARADOS a propósito, porque el laboratorio demuestra que no son
// equivalentes: hay averías que sólo caza el escáner, hay una que sólo caza el
// osciloscopio, hay una que no caza NINGÚN instrumento del escáner porque no
// toca la mezcla, y hay dos en las que el escáner sale impecable mientras el
// analizador de gases dice que la mezcla está mal.
// ============================================================================

const BANDA_LAM=0.02;    // ±2 % alrededor del objetivo. Valor DECLARADO.
const CICLO_TECHO=85;    // % de ciclo de trabajo por encima del cual el inyector
                         // ya no tiene dónde crecer. Valor DECLARADO.
// Fracción del par que este motor daría SANO en el MISMO punto por debajo de la
// cual se declara que ha perdido potencia. Comparar el par relativo contra uno a
// secas condenaría a un motor perfectamente sano en cuanto se soltara el
// acelerador: el par relativo está normalizado a plena carga, así que a media
// carga vale la mitad y eso no es una avería, es la mariposa.
const PAR_MIN=0.90;
const DISP_MIN=0.05;     // dispersión entre cilindros por encima de la cual el
                         // reparto ya no es parejo. Valor DECLARADO.

// El objetivo de mezcla NO es siempre uno. En lazo abierto la centralita
// enriquece a propósito para proteger el motor, y juzgar esa mezcla contra el
// estequiométrico condenaría a un motor perfectamente sano a plena carga.
const lamObjetivo=s=>s.lazoAbierto?1/MQ().enriqPotencia:1;

function veredicto(o={}){
  const s=EST(o), obj=lamObjetivo(s), desv=Math.abs(s.lam-obj);
  // La referencia de par es el MISMO motor sin avería en el MISMO punto, no un
  // uno absoluto: sólo así «ha perdido par» significa lo que dice.
  const sn=EST({...o,falla:'sano'});
  const parCaido=s.parRel<sn.parRel*PAR_MIN;
  return {
    s, obj, desv, parSano:sn.parRel,
    lazoAbierto:s.lazoAbierto,
    enBanda:desv<=BANDA_LAM,
    // La sonda dice una cosa y el analizador de gases dice otra. Es el hallazgo
    // más importante que este banco puede dar y NO lo ve ningún escáner.
    miente:s.mienteSonda,
    saturado:s.saturado,
    dtc:s.dtc,
    ciclo:s.ciclo,
    sinMargenInyector:s.ciclo>=CICLO_TECHO,
    parCaido,
    malo:desv>BANDA_LAM||s.saturado||s.mienteSonda||s.ciclo>=CICLO_TECHO||parCaido
  };
}

// Lo que el escáner —y sólo el escáner— es capaz de ver del protocolo completo.
// Se mira únicamente en los puntos de LAZO CERRADO: en lazo abierto no hay
// ajuste que mirar porque la centralita no está corrigiendo nada.
function loQueVeElEscaner(){
  const L=LECT();
  const cerrados=L.pts.filter(p=>!p.lazoAbierto);
  const max=cerrados.length?Math.max(...cerrados.map(p=>Math.abs(p.ajuste))):0;
  return { max, limpio:max<DTC_UMBRAL*100, dtcEn:L.dtcEn, hayDtc:L.dtcEn.length>0 };
}

// El engaño: el escáner sale limpio —ningún ajuste llega al umbral de código— y
// sin embargo el analizador de gases dice que la mezcla real no está donde
// debería. Ésta es la conclusión que la práctica quiere que quede escrita.
function veredictoEngano(){
  const L=LECT(), esc=loQueVeElEscaner();
  const lam=L.pts[1].lam;                       // crucero: lazo cerrado
  const fuera=Math.abs(lam-1)>BANDA_LAM;
  // A plena carga el par relativo SÍ se compara contra uno: ahí su
  // normalización es exactamente ese punto.
  const par=L.parPlena, disp=L.disp;
  const engana=esc.limpio&&fuera;
  const mudo=esc.limpio&&!fuera&&par<PAR_MIN;
  const disperso=esc.limpio&&disp>DISP_MIN;
  return {
    limpio:esc.limpio, max:esc.max, lam, fuera, par, disp,
    // Tres maneras distintas de que el escáner no sirva: que mienta sobre la
    // mezcla; que la mezcla esté bien y aun así el motor no dé lo suyo; y que la
    // MEDIA esté bien mientras los cilindros van cada uno por su lado, que es lo
    // único que la sonda no puede ver porque lee la mezcla de todos los escapes.
    engana, mudo, disperso,
    nivel:engana?'bad':((mudo||disperso)?'warn':'good')
  };
}

// La mezcla se pinta del color de su LAMBDA, y con la misma escala en la escena,
// en el pizarrón y en la leyenda, para que nadie tenga que traducir entre
// vistas. Rica hacia el naranja, pobre hacia el azul, estequiométrica en verde.
function colorLam(lam){
  if(!isFinite(lam)) return 0x8f97a5;
  const u=clamp((lam-0.80)/(1.25-0.80),0,1);
  const P=[[0.00,0xff6b6b],[0.28,0xF2A65A],[0.44,0x7CD992],[0.56,0x7CD992],[0.74,0x5BD4E5],[1.00,0x8AB4F8]];
  for(let i=1;i<P.length;i++){
    if(u<=P[i][0]||i===P.length-1){
      const [u0,c0]=P[i-1],[u1,c1]=P[i];
      const t=clamp((u-u0)/(u1-u0||1),0,1);
      const mz=(a,b)=>Math.round(a+(b-a)*t);
      return (mz((c0>>16)&255,(c1>>16)&255)<<16)|(mz((c0>>8)&255,(c1>>8)&255)<<8)|mz(c0&255,c1&255);
    }
  }
  return 0x7CD992;
}
const hex6=n=>'#'+n.toString(16).padStart(6,'0');
const colLam=lam=>hex6(colorLam(lam));

// Régimen de mezcla: la misma clave en el 3D, en el pizarrón y en la leyenda.

function regimenLam(lam){
  if(!isFinite(lam)) return 'pobre';
  if(lam<1-BANDA_LAM) return 'rica';
  if(lam>1+BANDA_LAM) return 'pobre';
  return 'esteq';
}

// ============================================================ T2 · PIZARRÓN
// Un lienzo 2D de 1024×768 pegado a un panel 3D. Se llama `bcv` y no `cv`
// porque `cv` ya es la fábrica de lienzos del kit de la escena: reusar ese
// nombre rompe la página entera antes de que arranque nada.
const BW=1024, BH=768;
const bcv=document.createElement('canvas'); bcv.width=BW; bcv.height=BH;
const bx=bcv.getContext('2d');
const btex=new THREE.CanvasTexture(bcv);
btex.colorSpace=THREE.SRGBColorSpace;

const board=new THREE.Group();
scene.add(board);
// El pizarrón va siempre al costado izquierdo del banco, a distancia fija de su
// extremo. Fijar la coordenada a mano lo mete dentro del motor en cuanto el
// banco es más largo —el V6 lleva dos cilindros más—, y eso no se ve venir
// escribiendo el número.
// Cotas del pizarrón. Es GRANDE a propósito: los paneles de la interfaz tapan
// cuatro décimas del ancho de la pantalla, y con un pizarrón pequeño la única
// forma de que el banco entrara en el hueco que queda era alejarse tanto que el
// texto del tablero dejaba de leerse. Aquí la práctica está en el tablero.
const BW3=5.60, BH3=4.04, BY3=2.25;
function colocaTablero(d){
  board.rotation.y=0.70;
  // El pizarrón se pega al borde IZQUIERDO real del banco —el filtro de aire—,
  // descontando su propio medio ancho proyectado sobre el eje X. Colocarlo a
  // partir de un «ancho total» inventado dejaba un metro de mesa vacía entre los
  // dos y echaba el motor fuera del cuadro.
  const medio=(BW3/2+0.13)*Math.cos(board.rotation.y);
  board.position.set(d.xIzq-0.70-medio,0,0.95);
}
// Encuadre que mete el pizarrón Y el banco. La distancia NO se calcula con una
// regla de tres sobre el ancho: se PRUEBA contra el tronco de visión punto por
// punto y se busca la menor que los mete todos. Repartir el ancho como si todo
// estuviera a la misma profundidad deja al motor —que está mucho más cerca de la
// cámara que el pizarrón— ocupando tres cuartos del cuadro mientras el pizarrón
// se queda en un rincón, y eso sólo se ve mirando la pantalla.
function puntosClave(){
  const d=dims(MQ());
  const a=BW3/2, mx=a*Math.cos(board.rotation.y), mz=a*Math.sin(board.rotation.y);
  const y0=BY3-BH3/2, y1=BY3+BH3/2, bp=board.position;
  return [
    [bp.x-mx,y0,bp.z+mz],[bp.x+mx,y0,bp.z-mz],
    [bp.x-mx,y1,bp.z+mz],[bp.x+mx,y1,bp.z-mz],
    [d.xIzq,2.30,0.62],[d.xIzq,0.90,0.62],
    [d.xVista,1.14,-0.64],[d.xVista,2.10,0.30],
    [d.centro,0.84,1.05],[d.centro,2.20,-0.96],
  ].map(p=>new THREE.Vector3(...p));
}
// La franja de pantalla que de verdad se ve. El HUD tapa la izquierda y el panel
// de mandos tapa la derecha: encuadrar contra el ancho completo del lienzo mete
// casi cuatro décimas del banco DEBAJO de los paneles, y desde fuera parece que
// la cámara está mal cuando lo que está mal es la cuenta.
function zonaUtil(){
  const rM=mount.getBoundingClientRect();
  const W=rM.width||1600, H=rM.height||900;
  let x0=0, x1=W;
  const h=el('hud'), p=el('panel');
  if(h){ const r=h.getBoundingClientRect();
    if(r.width>0&&r.right-rM.left<W*0.60) x0=Math.max(x0,r.right-rM.left+18); }
  if(p){ const r=p.getBoundingClientRect();
    if(r.width>0&&r.left-rM.left>W*0.40) x1=Math.min(x1,r.left-rM.left-18); }
  // En una pantalla estrecha los paneles no dejan hueco: entonces se usa todo el
  // lienzo y que los paneles tapen lo que tapen, porque la alternativa es alejar
  // la cámara hasta que no se lea nada.
  if(x1-x0<W*0.34){ x0=0; x1=W; }
  return { W, H, x0, x1 };
}
function camConjunto(margen){
  const d=dims(MQ()), Z=zonaUtil();
  const asp=clamp(Z.W/Math.max(1,Z.H),0.60,2.60);
  const m=(margen===undefined?1:margen);
  const TV=0.4142, TH=TV*asp;                    // tangentes del medio ángulo
  const nx0=(2*Z.x0/Z.W-1)/m, nx1=(2*Z.x1/Z.W-1)/m, ny=0.94/m;
  const pts=puntosClave();
  const mx=1.86*Math.cos(board.rotation.y);
  let off=(((board.position.x-mx)+d.xDer)/2-board.position.x)/Math.cos(board.rotation.y);
  const proy=(dist,o)=>{
    const [P,C]=camTablero(dist,o);
    const p=new THREE.Vector3(...P), c=new THREE.Vector3(...C);
    const f=c.clone().sub(p).normalize();
    const r=new THREE.Vector3().crossVectors(f,new THREE.Vector3(0,1,0)).normalize();
    const u=new THREE.Vector3().crossVectors(r,f).normalize();
    let a=Infinity,b=-Infinity,vy=0,zs=0,n=0,malo=false;
    for(const q of pts){
      const v=q.clone().sub(p), z=v.dot(f);
      if(z<=0.2){ malo=true; continue; }
      a=Math.min(a,(v.dot(r)/z)/TH); b=Math.max(b,(v.dot(r)/z)/TH);
      vy=Math.max(vy,Math.abs((v.dot(u)/z)/TV)); zs+=z; n++;
    }
    return { a, b, vy, z:n?zs/n:1, malo };
  };
  const cabe=(dist,o)=>{ const e=proy(dist,o); return !e.malo&&e.a>=nx0&&e.b<=nx1&&e.vy<=ny; };
  let dist=26;
  for(let it=0;it<7;it++){
    // Menor distancia que mete todos los puntos clave dentro de la franja útil.
    if(cabe(26,off)){
      let lo=3, hi=26;
      for(let k=0;k<26;k++){ const mid=(lo+hi)/2; if(cabe(mid,off)) hi=mid; else lo=mid; }
      dist=hi;
    }else dist=26;
    // Y después se centra el contenido DENTRO de esa franja, no dentro del
    // lienzo: si no, el banco queda pegado al panel de mandos.
    const e=proy(dist,off);
    const dn=(nx0+nx1)/2-(e.a+e.b)/2;
    if(Math.abs(dn)<0.012) break;
    off-=dn*TH*e.z;
  }
  return camTablero(dist,off);
}
// Encuadre del pizarrón: se calcula desde su propia transformada, no con
// coordenadas escritas a mano, porque el pizarrón se mueve con el ancho del
// banco y unas coordenadas fijas lo dejan medio fuera de cuadro en cuanto se
// cambia de arquetipo.
function camTablero(d,off){
  const c=board.position.clone(); c.y=BY3;
  const n=new THREE.Vector3(Math.sin(board.rotation.y),0,Math.cos(board.rotation.y));
  const dd=d||5.85;
  // La altura sube con la distancia. Con una altura fija, alejarse deja la vista
  // casi horizontal y la mesa se ve de canto.
  const p=c.clone().addScaledVector(n,dd); p.y=BY3+0.13*dd;
  // El HUD tapa la franja izquierda de la pantalla, así que por omisión se apunta
  // un poco a la izquierda del centro del pizarrón para que el pizarrón caiga a
  // su derecha. Con un desplazamiento POSITIVO el pizarrón se corre hacia la
  // izquierda y el banco —que está a su derecha— entra en el cuadro.
  const tg=new THREE.Vector3(Math.cos(board.rotation.y),0,-Math.sin(board.rotation.y));
  const dx=(off===undefined)?-0.42:off;
  p.addScaledVector(tg,dx); c.addScaledVector(tg,dx);
  return [[p.x,p.y,p.z],[c.x,c.y,c.z]];
}

function rpanel(x,y,w,h,c,bd,rad){

function tabla(x,y,cols,rows,o={}){
  const rh=o.rh||26, fs=o.s||14, gap=o.gap===undefined?14:o.gap;
  const ancho=cols.reduce((a,c)=>a+c.w+gap,0)-gap;
  let cx=x;
  cols.forEach(c=>{ texto(c.t,c.al==='right'?cx+c.w:cx,y,{s:fs,b:true,c:'#9aa6b6',al:c.al||'left'}); cx+=c.w+gap; });
  linea([[x,y+8],[x+ancho,y+8]],'#243043',1.2);

    if(r.hl){ bx.save(); bx.fillStyle=r.hl; bx.fillRect(x-6,yy-rh+9,ancho+12,rh); bx.restore(); }

// Recorta al rectángulo de la gráfica. Sin esto, una barra o una curva que se

function enCaja(P,fn){ bx.save(); bx.beginPath(); bx.rect(P.x,P.y,P.w,P.h); bx.clip(); fn(); bx.restore(); }

function ejes(P,x0,x1,y0,y1,rx,ry,fx,fy,nx,ny){
  const X=v=>P.x+(v-x0)/(x1-x0)*P.w;
  const Y=v=>P.y+P.h-(v-y0)/(y1-y0)*P.h;
  bx.save(); bx.strokeStyle='#1d2735'; bx.lineWidth=1;
  for(let i=0;i<=nx;i++){ const v=x0+(x1-x0)*i/nx, xx=X(v);
    bx.beginPath(); bx.moveTo(xx,P.y); bx.lineTo(xx,P.y+P.h); bx.stroke();
    if(fx) texto(fx(v),xx,P.y+P.h+19,{s:12,c:'#7b8697',al:'center'}); }
  for(let i=0;i<=ny;i++){ const v=y0+(y1-y0)*i/ny, yy=Y(v);
    bx.beginPath(); bx.moveTo(P.x,yy); bx.lineTo(P.x+P.w,yy); bx.stroke();
    if(fy) texto(fy(v),P.x-9,yy+4,{s:12,c:'#7b8697',al:'right'}); }
  bx.restore();
  bx.save(); bx.strokeStyle='#3a4658'; bx.lineWidth=1.5; bx.strokeRect(P.x,P.y,P.w,P.h); bx.restore();
  if(rx) texto(rx,P.x+P.w/2,P.y+P.h+44,{s:13,c:'#9aa6b6',al:'center'});
  if(ry){ bx.save(); bx.translate(P.x-58,P.y+P.h/2); bx.rotate(-Math.PI/2);
    texto(ry,0,0,{s:13,c:'#9aa6b6',al:'center'}); bx.restore(); }
  return {X,Y};
}

// Cabecera común: toda vista dice qué motor, qué combustible y en qué punto de

function eslabon(x,y,w,rot,val,col,nota,alerta){

// Cuántas líneas ocupará un texto envuelto a un ancho dado. Se mide con la MISMA
// fuente con la que después se dibuja: contar caracteres a ojo deja la última
// línea fuera del recuadro y el pizarrón la recorta sin avisar.
function lineasDe(t,w,s){
  bx.font='400 '+s+'px Inter,system-ui,sans-serif';
  let ln='', n=1;
  for(const p of t.split(' ')){
    const test=ln?ln+' '+p:p;
    if(bx.measureText(test).width>w&&ln){ n++; ln=p; } else ln=test;
  }

}
// Banda de veredicto a pie de pizarrón. Un solo sitio, siempre el mismo, para
// que no haya que buscarlo en cada vista. La ALTURA sale del texto y la banda se
// sube sola si no cabe: una altura fija de sesenta píxeles dejaba la tercera
// línea del veredicto por debajo del borde del lienzo, y eso no lo ve ninguna
// prueba numérica porque el texto existe, sólo que nadie puede leerlo.
function banda(y,nivel,rot,txt){
  const c=nivel==='bad'?BAD_HEX:(nivel==='warn'?WARN_HEX:OK_HEX);
  const f=nivel==='bad'?'rgba(255,107,107,0.10)':(nivel==='warn'?'rgba(233,196,106,0.10)':'rgba(124,217,146,0.09)');
  const S=12.5, LH=17, W=BW-120;
  const h=Math.max(60, 32+lineasDe(txt,W,S)*LH+10);
  const yy=Math.min(y, BH-14-h);
  rpanel(42,yy,BW-84,h,f,c,10);
  texto(rot,60,yy+24,{s:15,b:true,c});

  return yy;
}

const roto=(a,b)=>isFinite(a)&&isFinite(b)&&Math.abs(a-b)>Math.max(1e-9,Math.abs(b)*0.005);

// -------------------------------------------------------------- 1 · LA MEZCLA
function vistaMezcla(){

    'Después mira la sonda y corrige con el ajuste largo. Cada eslabón de esa cadena puede fallar por su cuenta, y el resultado sólo se lee al final, en el escape.');

    (s.lazoAbierto?(' y enriquecido ×'+num(s.enriq,2)):''),false); y+=dy;
  eslabon(42,y,W,'Tiempo que ordena',mili(s.tOrden,2),TINTA,

  eslabon(42,y,W,'Lambda de verdad (analizador de gases)',lamT(s.lam),colLam(s.lam),
    'relación real '+num(s.afrReal,2)+' contra '+num(C.afr,2)+' del '+C.corto,
    Math.abs(s.lam-V.obj)>BANDA_LAM); y+=dy;
  eslabon(42,y,W,'Lo que la sonda le dice a la centralita',
    lamT(s.lamSonda)+'  ·  '+num(s.vSonda*1000,0)+NBSP+'mV',
    s.mienteSonda?BAD_HEX:colLam(s.lamSonda),
    s.mienteSonda?'MIENTE: se aparta '+firm((s.lamSonda/s.lam-1)*100,1)+' de la mezcla real'
      :'dice la verdad',s.mienteSonda); y+=dy;
  eslabon(42,y,W,'Ajuste largo que sostiene el lazo',
    s.lazoAbierto?'—  (lazo abierto)':firm(s.ajustePct,1),
    s.saturado?BAD_HEX:(Math.abs(s.ajustePct)>=DTC_UMBRAL*100?WARN_HEX:TINTA),

      :(s.saturado?'SATURADO en su tope de '+pc(AUTORIDAD*100,0)+': la centralita se ha rendido'

  texto('Lo que enseñaría el escáner',X,150,{s:15,b:true,c:CIAN});
  const rows=[
    {v:['Presión del colector',bar(s.map,3)]},

  const lo=Math.min(0.94,Math.min(...lams)-0.03), hi=Math.max(1.06,Math.max(...lams)+0.03);
  const P={x:X+74,y:446,w:WD-90,h:132};
