<style>
  :root{
    --bg:#08201C;--panel:rgba(9,26,23,.86);--line:#1E3A34;--ink:#EAF4F1;

  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(10,13,18,.92),transparent);pointer-events:none}

  .hud{position:fixed;top:70px;left:18px;z-index:15;max-width:330px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-height:calc(100vh - 150px);overflow-y:auto}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .hud h2{font-size:19px;line-height:1.15;margin-bottom:9px}
  .hud p{font-size:13px;line-height:1.55;color:var(--dim);margin-bottom:10px}
  .hud .formula{font-family:var(--mono);color:var(--accent2);text-align:center;font-size:12.5px;margin:8px 0;padding:8px;background:rgba(0,0,0,.25);border-radius:8px;line-height:1.5}
  .hud .src{font-size:10.5px;color:#7a8894;font-style:italic;margin-top:4px;line-height:1.5}
  .legend{display:flex;flex-direction:column;gap:6px;margin:12px 0;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:10px}

  .fid .ft{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);margin-bottom:6px}

  .fid .fl.no b{color:var(--hv)}

  .b{font-family:system-ui;font-size:12.5px;padding:10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#1b242f;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#202c38}
  .b.on{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:bold}
  .b.primary{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:bold}
  .b.auto{border-color:var(--hv);color:var(--hv);background:rgba(255,183,3,.10);font-weight:bold}

  .b.dx{text-align:left;font-size:12px}
  .b.dx.right{background:rgba(52,211,153,.18);border-color:var(--good);color:var(--good);font-weight:bold}

  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(18,24,32,.95);border:1px solid var(--accent);padding:10px 20px;border-radius:40px;font-family:var(--mono);font-size:12px;opacity:0;transition:.3s;pointer-events:none;max-width:80vw;text-align:center}
  .toast.show{opacity:1}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}
  .soundBtn:hover{transform:scale(1.08)}
  .inspectHint{position:fixed;bottom:18px;right:18px;z-index:14;font-family:var(--mono);font-size:10px;color:var(--accent2);background:var(--panel);padding:7px 12px;border-radius:9px;border:1px solid var(--line)}

  @media(max-width:820px){
    .hud,.panel{position:fixed;left:8px;right:8px;top:auto;bottom:8px;max-width:none;width:auto;max-height:42vh;overflow-y:auto}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.26, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;
    }
    if(hook)hook(dt,t); controls.update();
    if(bokeh) bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);
    composer.render(); }
  function start(){ if(!raf)loop(); }
  function stop(){ cancelAnimationFrame(raf); raf=null; window.removeEventListener('resize',resize); }

  return { THREE, renderer, scene, camera, controls, composer, bloom,
    setAnimate:fn=>hook=fn, start, stop, resize, clock,
    flyTo:(v)=>{ controls.target.copy(v); }, moveTo, setCinematicIdle };
}

function pickerFor(scene,camera,dom,onHit){
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(); let down=null;
  dom.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
  dom.addEventListener('pointerup',e=>{
    if(!down)return; const moved=Math.abs(e.clientX-down[0])+Math.abs(e.clientY-down[1])>6; down=null;

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

/* Análisis nodal modificado: incógnitas = n voltajes de nodo + 1 corriente
   por fuente de tensión. Gaussiana con pivoteo parcial. */
function solveMNA(net){
  const n=net.nodes;
  const vs=net.elems.filter(e=>e.type==='V');
  const N=n+vs.length;
  const A=Array.from({length:N},()=>new Array(N).fill(0));
  const z=new Array(N).fill(0);
  net.elems.forEach(e=>{
    if(e.type==='R'){
      const g=1/e.value, a=e.a-1, b=e.b-1;
      if(a>=0)A[a][a]+=g;
      if(b>=0)A[b][b]+=g;
      if(a>=0&&b>=0){A[a][b]-=g;A[b][a]-=g;}
    }
  });
  vs.forEach((e,k)=>{
    const r=n+k, a=e.a-1, b=e.b-1;
    if(a>=0){A[r][a]=1;A[a][r]=1;}
    if(b>=0){A[r][b]=-1;A[b][r]=-1;}
    z[r]=e.value;
  });
  // eliminación gaussiana con pivoteo parcial
  for(let c=0;c<N;c++){
    let p=c;
    for(let r=c+1;r<N;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;
    [A[c],A[p]]=[A[p],A[c]];[z[c],z[p]]=[z[p],z[c]];
    for(let r=c+1;r<N;r++){
      const f=A[r][c]/A[c][c];
      if(!f)continue;
      for(let k=c;k<N;k++)A[r][k]-=f*A[c][k];
      z[r]-=f*z[c];
    }
  }
  const x=new Array(N).fill(0);
  for(let r=N-1;r>=0;r--){
    let s=z[r];
    for(let k=r+1;k<N;k++)s-=A[r][k]*x[k];
    x[r]=s/A[r][r];
  }
  return {V:[0,...x.slice(0,n)],srcI:x.slice(n)};
}

function nodeCurrents(k){
  const list=[];
  NET.elems.forEach(e=>{
    if(e.type==='R'&&(e.a===k||e.b===k)){

      list.push({id:e.id,otro:NODE_NAME[e.a],into:-iThru(EL(SRC_SERIES[e.id]))});
    }
  });

}

  curH(c,344,150,'I1',EL('R1'),1,hide);
  curH(c,609,150,'I3',EL('R3'),1,hide);
  curH(c,884,150,'I5',EL('R5'),-1,hide);
  curV(c,390,555,'I2',EL('R2'),hide);

  bTex.needsUpdate=true;
}

function boardClick(u,v){
  const x=u*1024, y=(1-v)*768;
  let best=null,bd=1e9;
  HIT.forEach(h=>{const d=Math.hypot(x-h.x,y-h.y);if(d<h.r&&d<bd){bd=d;best=h;}});
  if(!best)return;
  if(best.el)toastEl(best.el);
  else if(best.mesh!==undefined){if(mode!=='mallas')setMode('mallas');selectMesh(best.mesh);}
  else{if(mode!=='nodos')setMode('nodos');selectNode(best.node);}
}

      `<span class="mono">LCK nodo B: (V_A−V_B)/R3 + (V_Q−V_B)/R5 − V_B/R4 = 0</span><br>`+
      `<span class="mono">→ ${sg(t3)} ${sg(u5)} ${sg(-u4)} = ${fmtSum(t3+u5-u4)} mA <span class="ok">✔</span></span><br>`+
      `<span class="mono">Toca el esquema: nodos A/B/ref, insignias M1–M3 y componentes.</span>`;
  }else if(mode==='nodos'){
    const flows=nodeCurrents(selNode);
    html+=`<span class="mono"><b>LCK — nodo ${NODE_NAME[selNode]}</b></span><br>`+
      flows.map(f=>`<span class="mono">${f.into>=0?'entra':'sale'} ${(Math.abs(f.into)*1e3).toFixed(3)} mA por ${f.id} (${f.into>=0?'desde':'hacia'} ${f.otro})</span>`).join('<br>')+
      `<br><span class="mono">ΣI = ${fmtSum(kclSum(selNode))} mA <span class="ok">✔ carga conservada</span></span>`;
  }else if(mode==='mallas'){
    html+=`<span class="mono"><b>LVK — ${MESHES[selMesh].nombre}</b></span><br>`+
      kvlSteps(selMesh).map(s=>`<span class="mono">${s.desde} → ${s.hasta} · ${s.el}: ${sg(s.dV)} V (${s.det})</span>`).join('<br>')+
      `<br><span class="mono">ΣV = ${fmtSum(kvlSum(selMesh))} V <span class="ok">✔ el lazo regresa al mismo potencial</span></span>`;
  }else{
    html+=retoMsg||`<span class="mono">Los valores de R y de las fuentes están en el esquema; V_A, V_B y las corrientes están OCULTOS. Resuelve el sistema 2×2 y escribe tu predicción abajo.</span>`;
  }
  el('report').innerHTML=html;
}
function refreshAll(){drawBoard();updateTele();updateReport();}

/* ============================================================
   10) RETO — predicción numérica + red aleatoria
   ============================================================ */
function checkReto(){
  const pa=parseFloat((el('inVA').value||'').replace(',','.'));
  const pb=parseFloat((el('inVB').value||'').replace(',','.'));
  if(!isFinite(pa)||!isFinite(pb)){showToast('Escribe ambas predicciones (en volts).');return;}
  const ta=SOL.V[2],tb=SOL.V[3];
  const tol=v=>Math.max(0.02,Math.abs(v)*0.01);
  const okA=Math.abs(pa-ta)<=tol(ta),okB=Math.abs(pb-tb)<=tol(tb);
  if(okA&&okB){
    retoSolved=true;synth.beep(1046,0.12,0.06);
    retoMsg=`<span class="mono"><span class="ok">✔ Predicción verificada.</span> V_A = ${ta.toFixed(3)} V (tuyo: ${pa.toFixed(3)}) · V_B = ${tb.toFixed(3)} V (tuyo: ${pb.toFixed(3)}). El esquema revela voltajes y corrientes.</span>`;
  }else{
    synth.beep(220,0.15,0.06);
    retoMsg=`<span class="mono"><span class="dtc">✗ Aún no.</span> ${okA?'V_A ✓':'V_A fuera de tolerancia'} · ${okB?'V_B ✓':'V_B fuera de tolerancia'}. Plantea LCK en A y en B (2 ecuaciones, 2 incógnitas) y reintenta.</span>`;
  }
  refreshAll();
}
function newNetwork(){
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  ['R1','R2','R3','R4','R5'].forEach(id=>{EL(id).value=Math.round(pick(E12)*1000);});
  EL('V1').value=pick([9,12,15,18,24]);
  EL('V2').value=pick([3.3,5,9]);
  resolve();buildQuiz();refreshNet3D();
  retoSolved=false;retoMsg='';
  el('inVA').value='';el('inVB').value='';
  if(mode!=='reto')setMode('reto');
  else{solved=false;clearDx();refreshQuestion();refreshAll();}
  showToast('🔀 <b>Red nueva.</b> Los valores están en el esquema (y en las bandas de colores); V_A y V_B te esperan.');
  synth.beep(520,0.08,0.05);
}

/* ============================================================
   11) PREGUNTAS DE INGENIERÍA (reconstruidas con la red viva)
   ============================================================ */
function buildQuiz(){
  const fA=nodeCurrents(2);
  const ins=fA.filter(f=>f.into>=0),outs=fA.filter(f=>f.into<0);
  const txt=fs=>fs.map(f=>`${(Math.abs(f.into)*1e3).toFixed(3)} mA (${f.id})`).join(' + ');
  const okBal=`Entra${ins.length>1?'n':''} ${txt(ins)} y sale${outs.length>1?'n':''} ${txt(outs)}`;
  const allIn=`Entran ${fA.map(f=>`${(Math.abs(f.into)*1e3).toFixed(3)} mA (${f.id})`).join(' + ')} — todas hacia el nodo`;
  let swapBal;
  if(outs.length===2&&Math.abs(Math.abs(outs[0].into)-Math.abs(outs[1].into))>0.005*Math.max(Math.abs(outs[0].into),Math.abs(outs[1].into))){
    swapBal=`Entra${ins.length>1?'n':''} ${txt(ins)} y salen ${(Math.abs(outs[1].into)*1e3).toFixed(3)} mA (${outs[0].id}) + ${(Math.abs(outs[0].into)*1e3).toFixed(3)} mA (${outs[1].id})`;
  }else swapBal='La corriente se reparte a partes iguales entre las ramas conectadas al nodo';
  const alt=JSON.parse(JSON.stringify(NET));
  alt.elems.find(e=>e.id==='R4').value*=2;
  const vb2=solveMNA(alt).V[3],vb=SOL.V[3];
  const cR2=Math.abs(iThru(EL('R2')))*EL('R2').value,cR4=Math.abs(iThru(EL('R4')))*EL('R4').value;
  QUIZ={
    explora:{
      pregunta:'Para resolver esta red por <b>análisis nodal</b>, ¿cuántas incógnitas de voltaje necesitas?',
      opciones:[
        {t:'5 — una por cada nodo (P, A, B, Q y ref)',ok:false,why:'ref es el cero por definición, y P y Q los fijan las fuentes ideales (V_P = V1, V_Q = V2). No son incógnitas.'},
        {t:'2 — solo V_A y V_B (P y Q los fijan las fuentes)',ok:true,why:'Con ref = 0, V_P = V1 y V_Q = V2, quedan V_A y V_B: dos ecuaciones LCK, sistema 2×2. Eso resuelve TODA la red.'},
        {t:'3 — una por cada malla',ok:false,why:'Las mallas dan CORRIENTES en el método de mallas; en análisis nodal las incógnitas son voltajes de nodo.'},
        {t:'1 — solo V_A, porque V_B depende de él',ok:false,why:'V_B es un nodo independiente: sin su propia ecuación LCK el sistema queda indeterminado.'},
      ],
    },
    nodos:{
      pregunta:'Con la red resuelta, ¿cuál es el balance de corrientes (LCK) correcto en el <b>nodo A</b>?',
      opciones:[
        {t:allIn,ok:false,why:'Si TODAS las corrientes entraran, ΣI > 0 y el nodo acumularía carga. La LCK exige que lo que entra, salga.'},
        {t:okBal,ok:true,why:'Cada rama lleva I = ΔV/R con la solución nodal; la suma algebraica en el nodo es exactamente cero (conservación de la carga).'},
        {t:swapBal,ok:false,why:'Las magnitudes no se reparten por igual ni se intercambian: cada rama toma I = ΔV/R con SU resistencia y SU diferencia de potencial.'},
        {t:'No se puede saber sin medir físicamente cada rama',ok:false,why:'El análisis nodal lo determina por completo: conocidos V_A y V_B, cada corriente es ΔV/R. Medir sirve para VERIFICAR el modelo.'},
      ],
    },
    mallas:{
      pregunta:'La malla 2 (R2–R3–R4) <b>no contiene ninguna fuente</b>. ¿Por qué su ΣV sigue siendo 0?',
      opciones:[
        {t:'Porque el potencial es función de punto: al cerrar el lazo regresas al mismo potencial',ok:true,why:'LVK es conservación de energía por unidad de carga: con o sin fuentes, el lazo cerrado vuelve al nodo (y potencial) de partida.'},
        {t:'Porque no circula corriente por esa malla',ok:false,why:'Sí circula: I2, I3 e I4 son distintas de cero. La LVK se cumple CON corrientes presentes.'},
        {t:'Porque las caídas de R2 y R4 se cancelan entre sí',ok:false,why:`No se cancelan por pareja: valen ${cR2.toFixed(3)} V y ${cR4.toFixed(3)} V. Es la suma algebraica del LAZO completo la que da cero.`},
        {t:'Solo las mallas que contienen una fuente cumplen la LVK',ok:false,why:'La LVK vale para TODO lazo cerrado de cualquier red de parámetros concentrados, tenga o no fuentes.'},
      ],
    },
    reto:{
      pregunta:`Reto de diseño: si duplicas R4 (${fmtR(EL('R4').value)} → ${fmtR(EL('R4').value*2)}), ¿qué pasa con V_B?`,
      opciones:[
        {t:'V_B no cambia: lo fija la fuente V2',ok:false,why:'V2 fija el nodo Q, no B: entre ellos está R5. V_B resulta del balance de TODA la red.'},
        {t:`V_B sube a ${vb2.toFixed(3)} V`,ok:true,why:`Con más resistencia hacia ref, el nodo B "se descarga" menos: el MNA con R4 duplicado da V_B = ${vb2.toFixed(3)} V (antes ${vb.toFixed(3)} V).`},
        {t:`V_B se duplica (${(vb*2).toFixed(3)} V)`,ok:false,why:'La red no es proporcional a un solo elemento: V_B depende de todas las conductancias (sistema 2×2), no linealmente de R4.'},
        {t:'V_B baja: más resistencia significa menos voltaje',ok:false,why:'Al revés: R4 conecta B con ref (0 V). Debilitar ese lazo (más Ω) deja a B más cerca de los potenciales positivos.'},
      ],
    },
  };
}
function clearDx(){el('dxbtns').querySelectorAll('.b.dx').forEach(b=>b.classList.remove('right','wrong'));}
function refreshQuestion(){
  const q=QUIZ[mode];
  el('q_text').innerHTML=q.pregunta;
  el('dxbtns').innerHTML=q.opciones.map((o,i)=>`<button class="b dx" data-i="${i}">${'ABCD'[i]} · ${o.t}</button>`).join('');
  el('dxbtns').querySelectorAll('.b.dx').forEach(btn=>{btn.onclick=()=>answer(+btn.dataset.i);});
}
function answer(i){
  const o=QUIZ[mode].opciones[i];clearDx();
  const btn=el('dxbtns').children[i];
  if(o.ok){
    btn.classList.add('right');solved=true;synth.beep(1046,0.12,0.06);
    showToast(`<span style="color:var(--good)">✔ Correcto.</span><br><span style="color:var(--dim);font-size:11px">${o.why}</span>`);
  }else{
    btn.classList.add('wrong');synth.beep(220,0.15,0.06);
    showToast(`<span style="color:var(--bad)">✗ Revisa el modelo.</span><br><span style="color:var(--dim);font-size:11px">${o.why}</span>`);
  }
}

/* ============================================================
   12) PICKING — pizarrón (por UV) + banco (por userData)
   ============================================================ */
pickerFor(scene,S.camera,S.renderer.domElement,hit=>{
  if(!hit)return;
  if(hit.object===board&&hit.uv){boardClick(hit.uv.x,hit.uv.y);return;}
  let o=hit.object;
  while(o){
    const u=o.userData||{};
    if(u.el){toastEl(u.el);return;}
    if(u.node!==undefined){if(mode!=='nodos')setMode('nodos');selectNode(u.node);return;}
    if(u.title){showToast(`<b style="color:var(--accent2)">${u.title}</b><br><span style="color:var(--dim);font-size:11px">${u.info}</span>`);return;}
    o=o.parent;
  }
});

/* hover: etiquetas flotantes + cursor */
(()=>{
  const ray=new THREE.Raycaster(),v2=new THREE.Vector2();
  S.renderer.domElement.addEventListener('pointermove',ev=>{
    const r=S.renderer.domElement.getBoundingClientRect();
    v2.x=((ev.clientX-r.left)/r.width)*2-1;v2.y=-((ev.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(v2,S.camera);
    const hits=ray.intersectObjects(scene.children,true);
    HOVER_LABELS.forEach(lb=>lb.visible=false);
    let cursor='default';
    if(hits.length){
      let o=hits[0].object;
      while(o){
        if(HOVER_LABELS.has(o)){HOVER_LABELS.get(o).visible=true;cursor='pointer';break;}
        if(o.userData&&(o.userData.el||o.userData.node!==undefined||o.userData.title||o===board))cursor='pointer';
        o=o.parent;
      }
      if(hits[0].object===board)cursor='pointer';
    }
    S.renderer.domElement.style.cursor=cursor;
  });
})();

/* ============================================================
   13) RECORRIDO AUTOMÁTICO
   ============================================================ */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function runAuto(){
  if(autoRunning)return;autoRunning=true;
  const btn=el('btnAuto'),label=btn.textContent;
  btn.disabled=true;btn.classList.add('on');btn.textContent='⏳ Recorrido guiado en curso…';
  try{
    synth.init();synth.resume();
    clearDx();
    setMode('explora');
    showToast('Paso 1 · La red: V1 y V2 alimentan 5 resistores. Solo hay 2 incógnitas: V_A y V_B.');await sleep(2600);
    setMode('nodos');selectNode(2);
    const fA=nodeCurrents(2),ins=fA.filter(f=>f.into>=0),outs=fA.filter(f=>f.into<0);
    const res=fs=>fs.map(f=>`${(Math.abs(f.into)*1e3).toFixed(3)} mA (${f.id})`).join(' y ');
    showToast(`Paso 2 · LCK en A: entra ${res(ins)}; sale ${res(outs)} — la suma algebraica es 0.`);await sleep(3000);
    selectNode(3);
    showToast('Paso 3 · LCK en B: mismo principio. ΣI = 0.000000 mA, sin importar cuántas ramas lleguen.');await sleep(2600);
    setMode('mallas');selectMesh(0);
    showToast('Paso 4 · LVK malla 1: la subida de V1 se gasta exactamente en R1 y R2. ΣV = 0.');await sleep(3000);
    selectMesh(1);
    showToast('Paso 5 · Malla 2, SIN fuentes: el lazo regresa al mismo potencial — ΣV = 0 de todos modos.');await sleep(3000);
    setMode('reto');
    showToast('Paso 6 · El reto: predecir V_A y V_B. Planteamos LCK en A y B y resolvemos el sistema 2×2…');await sleep(2800);
    el('inVA').value=SOL.V[2].toFixed(3);el('inVB').value=SOL.V[3].toFixed(3);
    checkReto();await sleep(2200);
    const q=QUIZ.reto,i=q.opciones.findIndex(o=>o.ok);
    clearDx();
    const dxBtn=el('dxbtns').children[i];
    if(dxBtn){dxBtn.classList.add('right');solved=true;synth.beep(1046,0.12,0.06);}
    showToast(`<span style="color:var(--good)">✔ ${q.opciones[i].t}</span><br><span style="color:var(--dim);font-size:11px">${q.opciones[i].why}</span>`);
  }finally{
    btn.disabled=false;btn.classList.remove('on');btn.textContent=label;autoRunning=false;
  }
}

/* ============================================================
   14) ANIMACIÓN + SONIDO + INIT
   ============================================================ */
S.setAnimate((dt,time)=>{
  const s=1+Math.sin(time*4)*0.25;
  [2,3,0].forEach(k=>{
    const g=TP_GLOW[k];if(!g)return;
    const on=(mode==='nodos'&&selNode===k);
    g.material.opacity=on?0.85:0.45;
    g.scale.setScalar(on?s:1);
  });
});

['explora','nodos','mallas','reto'].forEach(m=>{el('m_'+m).onclick=()=>{if(!autoRunning)setMode(m);};});
el('btnAuto').onclick=runAuto;
el('btnNew').onclick=newNetwork;
el('btnCheck').onclick=checkReto;
['inVA','inVB'].forEach(id=>{el(id).addEventListener('keydown',e=>{if(e.key==='Enter')checkReto();});});
el('soundBtn').onclick=()=>{const on=synth.toggle();el('soundBtn').textContent=on?'🔊 Sonido':'🔇 Sonido';};
document.addEventListener('pointerdown',()=>{synth.init();synth.resume();},{once:true});

resolve();buildQuiz();refreshNet3D();
S.start();
setMode('explora');

window.__labDebug={

};
