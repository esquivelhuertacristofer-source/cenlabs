<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.26, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;
    }
    if(hook)hook(dt,t); controls.update();
    if(bokeh) bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);
    composer.render(); }
  function start(){ if(!raf)loop(); }
  function stop(){ cancelAnimationFrame(raf); raf=null; window.removeEventListener('resize',resize); }

    setAnimate:fn=>hook=fn, start, stop, resize, clock,

function roundedBox(w,h,d,mat,rf=0.08){

function pickerFor(scene,camera,dom,onHit){
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(); let down=null;
  dom.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
  dom.addEventListener('pointerup',e=>{
    if(!down)return; const moved=Math.abs(e.clientX-down[0])+Math.abs(e.clientY-down[1])>6; down=null;
    if(moved)return;
    const r=dom.getBoundingClientRect();
    mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(mouse,camera);
    const hits=ray.intersectObjects(scene.children,true);
    onHit(hits[0]||null);
  });
}

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

// coeficientes de Walther, calculados una vez por grado
const WALTHER = {};
for(const k of ACEK){
  const a = ACEITES[k];
  const W = v => Math.log10(Math.log10(v + WAL_C));

  const B = (W(a.v40) - W(a.v100)) / (l2 - l1);

  const { A, B } = WALTHER[aceK];

function caudalTeorico(D, n){ return D * n / 1000; }           // L/min
function omega(n){ return 2 * PI * n / 60; }                    // rad/s
function despRad(D){ return D * 1e-6 / (2 * PI); }              // m3/rad

// fuga volumetrica de Wilson, L/min
function fuga(bombK, D, pBar, mu, n){
  const b = BOMBAS[bombK];
  return b.Cs * despRad(D) * (pBar * 1e5) / mu * 60000;
}
// caudal entregado a esa presion, L/min
function caudal(bombK, D, pBar, mu, n){
  return caudalTeorico(D, n) - fuga(bombK, D, pBar, mu, n);
}
function etaVol(bombK, D, pBar, mu, n){
  const Qt = caudalTeorico(D, n);
  return Qt > 0 ? 1 - fuga(bombK, D, pBar, mu, n) / Qt : NaN;
}
// pares, N.m
function pares(bombK, D, pBar, mu, n, Def){
  const b = BOMBAS[bombK];
  const Dp = despRad(Def === undefined ? D : Def);
  const DpFull = despRad(D);
  const w = omega(n);
  const Tid  = Dp * (pBar * 1e5);
  const Tfri = b.Cf * Dp * (pBar * 1e5);
  const Tvis = b.Cv * DpFull * mu * w;
  return { Tid, Tfri, Tvis, T: Tid + Tfri + Tvis };
}
function etaMec(bombK, D, pBar, mu, n){
  const p = pares(bombK, D, pBar, mu, n);
  return p.T > 0 ? p.Tid / p.T : NaN;
}
function etaTot(bombK, D, pBar, mu, n){
  return etaVol(bombK, D, pBar, mu, n) * etaMec(bombK, D, pBar, mu, n);
}
// potencia de eje, kW
function potEje(bombK, D, pBar, mu, n, Def){
  return pares(bombK, D, pBar, mu, n, Def).T * omega(n) / 1000;
}
function potHid(pBar, QLmin){ return pBar * QLmin / 600; }

// ===================== 2. LIMITADORA =====================
function tarado(estK, bombK){
  const est = ESTACIONES[estK];
  const pCarga = Math.max(...est.fases.map(f => f.p));
  if(BOMBAS[bombK].variable){
    const pComp = pCarga + MARGEN_COMP;
    return { pCarga, pComp, pc: pComp + MARGEN_SEG };
  }
  return { pCarga, pComp: null, pc: pCarga + MARGEN_LIM };
}
function pFull(pc, limK){ return pc * (1 + LIMS[limK].ovr); }
// caudal que se traga la limitadora a esa presion, L/min
function caudalLim(pBar, pc, limK){
  const L = LIMS[limK];
  if(pBar <= pc) return 0;
  return L.Qnom * (pBar - pc) / (pc * L.ovr);
}

// ===================== 3. ORIFICIO DE CARGA (banco) =====================
// area en mm2, caida en bar, caudal en L/min
function caudalOrificio(areaMm2, dpBar, rho){
  if(dpBar <= 0 || areaMm2 <= 0) return 0;
  const A = areaMm2 * 1e-6;
  return CD_ORIF * A * Math.sqrt(2 * dpBar * 1e5 / rho) * 60000;
}
// punto de trabajo del banco: bomba contra orificio y limitadora
function puntoBanco(bombK, D, areaMm2, aceK, T, n, pc, limK){
  const mu = muT(aceK, T), rho = rhoT(aceK, T);
  const g = p => caudal(bombK, D, p, mu, n) - caudalOrificio(areaMm2, p, rho) - caudalLim(p, pc, limK);
  let a = 0, b = P_BIS_MAX;
  if(g(a) <= 0) return { p:0, Q:caudal(bombK,D,0,mu,n), Qor:0, Qlim:0, mu, rho };
  for(let i = 0; i < 200; i++){
    const m = (a + b) / 2;
    if(g(m) > 0) a = m; else b = m;
  }
  const p = (a + b) / 2;
  return { p, Q: caudal(bombK, D, p, mu, n), Qor: caudalOrificio(areaMm2, p, rho), Qlim: caudalLim(p, pc, limK), mu, rho };
}

// ===================== 4. ASPIRACION =====================
function aspiracion(estK, bombK, D, aceK, T, n){
  const est = ESTACIONES[estK];
  const nu = nuT(aceK, T), rho = rhoT(aceK, T), mu = muT(aceK, T);
  const Q = caudalTeorico(D, n) / 60000;                 // m3/s
  const A = PI * est.dAsp * est.dAsp / 4;
  const v = Q / A;
  const Re = v * est.dAsp / (nu * 1e-6);
  const lam = Re < RE_CRIT;
  const f = lam ? 64 / Math.max(Re, 1e-9) : 0.3164 / Math.pow(Re, 0.25);
  const dpTub = f * (est.Lasp / est.dAsp) * rho * v * v / 2;   // Pa
  const dpFil = est.kFil * mu * Q;                             // Pa
  const dpAlt = rho * G * est.hAsp;                            // Pa (negativo si el deposito da carga)
  const pAsp = PATM_BAR - (dpTub + dpFil + dpAlt) / 1e5;       // bar abs
  return { nu, rho, mu, v, Re, lam, f, dpTub:dpTub/1e5, dpFil:dpFil/1e5, dpAlt:dpAlt/1e5,
           pAsp, pMin: BOMBAS[bombK].pAspMin, cavita: pAsp < BOMBAS[bombK].pAspMin };
}

// ===================== 5. CICLO =====================
// Resuelve una fase. Devuelve presion de bomba, caudal al actuador, tiempo
// real, potencia de eje y potencia util.
function resuelveFase(fase, cfg, estK, T){
  const b = BOMBAS[cfg.bomba];
  const D = cfg.D, n = N_BOMBA;
  const mu = muT(cfg.aceite, T);
  const tar = tarado(estK, cfg.bomba);
  const pc = tar.pc, lim = LIMS[cfg.lim];
  const Qt = caudalTeorico(D, n);
  let p, Qact, Def = D, lento = false, Qlim = 0, descargado = false;

  if(fase.libre){
    // el actuador se traga todo lo que la bomba da a la presion de la carga
    p = fase.p;
    Qact = caudal(cfg.bomba, D, p, mu, n);
    if(Qact < fase.Q - 1e-9) lento = true;   // no alcanza la velocidad de la fase
  } else if(fase.descargable && lim.desc && !b.variable){
    // el grupo descarga: la bomba gira contra 3 bar
    p = P_DESC; descargado = true;
    Qact = fase.Q;
    Qlim = caudal(cfg.bomba, D, p, mu, n) - Qact;
  } else if(b.variable){
    // compensador: si puede dar el caudal pedido a la presion de tarado, destroca
    const pComp = tar.pComp;
    if(caudal(cfg.bomba, D, pComp, mu, n) >= fase.Q){
      p = pComp; Qact = fase.Q;
      Def = Math.min(D, Math.max(0, (Qact + fuga(cfg.bomba, D, p, mu, n)) * 1000 / n));
    } else {
      p = fase.p; Qact = caudal(cfg.bomba, D, p, mu, n); lento = true;
    }
  } else {
    // cilindrada fija con regulador de caudal: lo que sobra por la limitadora
    if(caudal(cfg.bomba, D, fase.p, mu, n) <= fase.Q){
      p = fase.p; Qact = caudal(cfg.bomba, D, p, mu, n); lento = true;
    } else {
      const g = q => caudal(cfg.bomba, D, q, mu, n) - fase.Q - caudalLim(q, pc, cfg.lim);
      let a = fase.p, z = P_BIS_MAX;
      for(let i = 0; i < 200; i++){ const m = (a + z) / 2; if(g(m) > 0) a = m; else z = m; }
      p = (a + z) / 2; Qact = fase.Q; Qlim = caudal(cfg.bomba, D, p, mu, n) - Qact;
    }
  }
  if(Qact < 0) Qact = 0;
  const tReal = fase.libre
    ? (Qact > 1e-9 ? fase.t * fase.Q / Qact : Infinity)
    : (lento && fase.Q > 0 ? fase.t * fase.Q / Math.max(Qact, 1e-9) : fase.t);
  const Peje = potEje(cfg.bomba, D, p, mu, n, Def);
  const Putil = potHid(fase.p, Qact);
  return { id:fase.id, p, Qact, Qlim, Def, lento, descargado, tReal,
           Peje, Putil, Pcal: Peje - Putil, mu, Qt };
}

function ciclo(estK, cfg, T){
  const est = ESTACIONES[estK];
  const fs = est.fases.map(f => resuelveFase(f, cfg, estK, T));
  let tCic = 0, Eeje = 0, Eutil = 0, Ecal = 0, Ppico = 0, lento = false;
  for(const r of fs){
    if(!isFinite(r.tReal)){ lento = true; continue; }
    tCic += r.tReal; Eeje += r.Peje * r.tReal; Eutil += r.Putil * r.tReal; Ecal += r.Pcal * r.tReal;
    if(r.Peje > Ppico) Ppico = r.Peje;
    if(r.lento) lento = true;
  }
  const Pmed = tCic > 0 ? Eeje / tCic : Infinity;
  const Pcal = tCic > 0 ? Ecal / tCic : Infinity;
  return { fases:fs, tCic, Eeje, Eutil, Ecal, Pmed, Pcal, Ppico, lento,
           etaCic: Eeje > 0 ? Eutil / Eeje : 0 };
}

// temperatura de regimen: punto fijo T = Tamb + Pcal/kDis
function tRegimen(estK, cfg){
  const est = ESTACIONES[estK];
  const g = T => est.Tamb + ciclo(estK, cfg, T).Pcal * 1000 / est.kDis - T;
  let a = est.Tamb, b = T_BIS_MAX;
  if(!isFinite(g(a))) return { T: Infinity, conv:false };
  if(g(b) > 0) return { T: Infinity, conv:false };
  for(let i = 0; i < 160; i++){ const m = (a + b) / 2; if(g(m) > 0) a = m; else b = m; }
  const T = (a + b) / 2;
  // La biseccion encuentra un cambio de signo, y un cambio de signo no siempre
  // es una raiz: cuando el ciclo cambia de forma (una fase deja de alcanzar su
  // caudal y se alarga) la curva de calor da un escalon y el intervalo final se
  // queda montado sobre el salto. Ahi no hay regimen que valga: el aceite se
  // dispara. Se exige que el balance cierre de verdad antes de declarar
  // convergencia.
  if(Math.abs(g(T)) > 0.05) return { T: Infinity, conv:false };
  return { T, conv:true };
}

function motorPara(kW){
  for(const m of MOTORES) if(m.kW >= kW - 1e-9) return m;
  return null;
}

function costeCfg(estK, cfg, mot){
  const b = BOMBAS[cfg.bomba];
  const cB = b.kCoste * (10 + 0.55 * cfg.D);
  const cL = LIMS[cfg.lim].coste;
  const cA = ACEITES[cfg.aceite].coste;
  const cM = mot ? mot.coste : 0;
  return Math.round(cB + cL + cA + cM);
}

// ===================== 6. EVALUACION =====================
function evalua(estK, cfg){
  const est = ESTACIONES[estK];
  const tar = tarado(estK, cfg.bomba);
  const pff = pFull(tar.pc, cfg.lim);
  const reg = tRegimen(estK, cfg);
  const Tt = reg.conv ? reg.T : T_BIS_MAX;
  const cic = ciclo(estK, cfg, Tt);
  const nuTrab = nuT(cfg.aceite, Tt);
  const nuFrio = nuT(cfg.aceite, est.Tfrio);
  const asp = aspiracion(estK, cfg.bomba, cfg.D, cfg.aceite, est.Tfrio, N_BOMBA);
  const mot = motorPara(cic.Ppico);
  // para la factura se usa el motor que haria falta; si el pico se sale del
  // catalogo se usa el mayor, para que el criterio de energia no herede el
  // fallo del criterio de motor
  const motE = mot || MOTORES[MOTORES.length - 1];
  const kWh = isFinite(cic.Pmed) ? cic.Pmed / motE.eta * est.horas : Infinity;
  const coste = costeCfg(estK, cfg, motE);

  const res = {
    okCaudal:     !cic.lento,
    okPresion:    pff <= BOMBAS[cfg.bomba].pMax + 1e-9,
    okViscosidad: nuTrab >= NU_MIN_TRAB && nuTrab <= BOMBAS[cfg.bomba].nuMax && nuFrio <= BOMBAS[cfg.bomba].nuArr,
    okAspiracion: !asp.cavita,
    okTermico:    reg.conv && Tt <= T_MAX_ACEITE + 1e-9,
    okMotor:      mot !== null && mot.kW <= est.kwMax + 1e-9,
    okEnergia:    kWh <= est.Emax + 1e-9,
  };
  const fallos = CRIT.filter(k => !res[k]);
  return { ...res, fallos, primero: fallos[0] || null, valido: fallos.length === 0,
           tar, pff, reg, Treg:Tt, cic, nuTrab, nuFrio, asp, mot, motE, kWh, coste,
           extrapola: fueraBanda(Tt) || fueraBanda(est.Tfrio) };
}

// ===================== 7. BARRIDO =====================
const CFGS = [];
for(const b of BOMBK) for(const D of CILINDRADAS) for(const a of ACEK) for(const l of LIMK)
  CFGS.push({ bomba:b, D, aceite:a, lim:l });

function validas(estK){
  return CFGS.filter(c => evalua(estK, c).valido);
}
function costeMin(estK){
  const v = validas(estK);
  return v.length ? Math.min(...v.map(c => evalua(estK, c).coste)) : null;
}
// optimo: minimo coste; a igualdad de coste, menor consumo anual
function optimas(estK){
  const v = validas(estK);
  if(!v.length) return [];
  let mejor = null, lista = [];
  for(const c of v){
    const r = evalua(estK, c);
    const clave = [r.coste, Math.round(r.kWh * 1000)];
    if(!mejor || clave[0] < mejor[0] || (clave[0] === mejor[0] && clave[1] < mejor[1])){
      mejor = clave; lista = [c];
    } else if(clave[0] === mejor[0] && clave[1] === mejor[1]) lista.push(c);
  }
  return lista;
}

// ===================== 8. RETO: cuatro ejes =====================
const EJES = ['bomba','D','aceite','lim'];
const EJE_VAL = { bomba:BOMBK, D:CILINDRADAS, aceite:ACEK, lim:LIMK };
const EJE_ROT = { bomba:'Familia de bomba', D:'Cilindrada', aceite:'Grado del aceite', lim:'Limitadora' };

// Califica un eje con los otros tres ya en su optimo. El objetivo del reto es
// "una propuesta que cumpla los siete criterios al minimo coste": dos valores
// distintos de un eje que empaten en coste y ambos sean validos se dan los dos
// por buenos. El desempate por factura anual solo elige el optimo que se
// muestra, no lo que se califica.
function okEje(estK, eje, val){
  const o = optimas(estK);
  if(!o.length) return false;
  const cm = costeMin(estK);
  const r = evalua(estK, { ...o[0], [eje]: val });
  return r.valido && r.coste === cm;
}
function ejeSol(estK, eje){
  return EJE_VAL[eje].filter(v => okEje(estK, eje, v));
}
function startCfg(estK){
  const o = optimas(estK)[0];
  for(const b of BOMBK) for(const D of CILINDRADAS) for(const a of ACEK) for(const l of LIMK){
    const c = { bomba:b, D, aceite:a, lim:l };
    if(c.bomba !== o.bomba && c.D !== o.D && c.aceite !== o.aceite && c.lim !== o.lim) return c;
  }
  return null;
}

function whyCfg(estK, cfg){
  const r = evalua(estK, cfg);
  if(r.valido) return null;
  return { criterio: r.primero, texto: MOTIVO[r.primero], r };
}

  okViscosidad:'La viscosidad se sale de la ventana del fabricante, en trabajo o en el arranque en frío.',
  okAspiracion:'La bomba cavita en el arranque en frío: la aspiración no le llega.',
  okTermico:'El aceite se estabiliza por encima del límite: la instalación no disipa ese calor.',

// ---------- formato ----------
function f1(x, d){
  if(!isFinite(x)) return '—';
  const dd = (d === undefined) ? 1 : d;
  const s = Math.abs(x).toFixed(dd);
  const ent = s.split('.')[0], dec = s.split('.')[1] || '';
  let out = '';
  for(let i = 0; i < ent.length; i++){
    if(i > 0 && (ent.length - i) % 3 === 0) out += ' ';
    out += ent[i];
  }
  return (x < 0 ? '-' : '') + out + (dd > 0 ? ',' + dec : '');
}

// El barrido de 144 configuraciones por estacion se repite muchas veces (ejes

// memoriza el resultado de evalua y de los barridos: no cambia ni un numero,
// solo se deja de recalcular lo mismo en cada cuadro.
const _mEval={}, _evaluaRaw=evalua;
evalua=function(estK,cfg){
  const k=estK+'|'+cfg.bomba+'|'+cfg.D+'|'+cfg.aceite+'|'+cfg.lim;
  if(!(k in _mEval)) _mEval[k]=_evaluaRaw(estK,cfg);
  return _mEval[k];
};
const _memo1=f=>{const m={};return k=>{if(!(k in m))m[k]=f(k);return m[k];};};
const _validasRaw=validas, _costeMinRaw=costeMin, _optimasRaw=optimas;
validas=_memo1(_validasRaw); costeMin=_memo1(_costeMinRaw); optimas=_memo1(_optimasRaw);
const _mEje={};
function ejeSolC(estK,eje){const k=estK+'|'+eje;if(!(k in _mEje))_mEje[k]=ejeSol(estK,eje);return _mEje[k];}

// --- utileria de dibujo -----------------------------------------------------
function bg(c){c.fillStyle='#0c1016';c.fillRect(0,0,1024,768);}
function texto(c,t,x,y,col,font,align){
  c.fillStyle=col||'#F4EFEA';c.font=font||'15px Outfit, sans-serif';
  c.textAlign=align||'left';c.textBaseline='middle';c.fillText(t,x,y);
}
function linea(c,x1,y1,x2,y2,col,dash,lw){
  c.strokeStyle=col||'#39404f';c.lineWidth=lw||1;c.setLineDash(dash||[]);
  c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.setLineDash([]);
}
function curva(c,pts,col,lw,dash){
  if(pts.length<2)return;
  c.strokeStyle=col;c.lineWidth=lw||2;c.setLineDash(dash||[]);
  c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke();c.setLineDash([]);
}
function wrapText(c,text,x,y,maxW,lh){
  const words=String(text).split(' ');let ln='',yy=y;
  for(const w of words){
    const t=ln?ln+' '+w:w;
    if(c.measureText(t).width>maxW&&ln){c.fillText(ln,x,yy);ln=w;yy+=lh;}else ln=t;
  }
  if(ln)c.fillText(ln,x,yy);
  return yy;
}
function rpanel(c,x,y,w,h,title){
  c.fillStyle='#11161e';c.fillRect(x,y,w,h);
  c.strokeStyle='#2a3140';c.lineWidth=1;c.strokeRect(x+0.5,y+0.5,w-1,h-1);
  if(title){
    c.fillStyle='#1a212c';c.fillRect(x,y,w,30);
    texto(c,title,x+12,y+15,'#cfd6e2','bold 15px Outfit, sans-serif');
  }
}
function prow(c,x,y,w,l,v,col){
  texto(c,l,x+12,y,'#8f97a5','14px Outfit, sans-serif');
  texto(c,v,x+w-12,y,col||'#F4EFEA','bold 15px ui-monospace, monospace','right');
}
function title2(c,t,sub){
  texto(c,t,30,38,'#F4EFEA','bold 27px Outfit, sans-serif');
  if(sub)texto(c,sub,30,68,'#8f97a5','15px Outfit, sans-serif');
}
function nota(c,y,txt,col,h,x,w){
  const xx=x===undefined?30:x, ww=w===undefined?650:w, hh=h===undefined?78:h;
  c.fillStyle='#10151c';c.fillRect(xx,y,ww,hh);
  c.fillStyle=col||AZUL;c.fillRect(xx,y,4,hh);
  c.fillStyle='#c7cdd8';c.font='15px Outfit, sans-serif';c.textAlign='left';c.textBaseline='middle';
  wrapText(c,txt,xx+16,y+22,ww-32,21);
}
const PX={x:706,y:70,w:300};
function hbar(c,x,y,w,h,frac,col){
  c.fillStyle='#1a212c';c.fillRect(x,y,w,h);
  c.fillStyle=col||AZUL;c.fillRect(x,y,w*Math.max(0,Math.min(1,frac)),h);
  c.strokeStyle='#2a3140';c.lineWidth=1;c.strokeRect(x+0.5,y+0.5,w-1,h-1);
}
function marca(c,x,y,w,h,frac,col,txt){
  const mx=x+w*Math.max(0,Math.min(1,frac));
  linea(c,mx,y-4,mx,y+h+4,col||'#F4EFEA',[4,3],2);
  if(txt)texto(c,txt,Math.min(mx+6,x+w-4),y-12,col||'#F4EFEA','bold 13px Outfit, sans-serif',mx>x+w*0.78?'right':'left');
}
function colOk(b){return b?OK_HEX:BAD_HEX;}
function tabla(c,x,y,w,widths,rows,heads){
  const rh=28;let yy=y;
  if(heads){
    c.fillStyle='#1a212c';c.fillRect(x,yy,w,rh);
    let cx=x;
    heads.forEach((hd,i)=>{texto(c,hd,cx+10,yy+rh/2,'#cfd6e2','bold 14px Outfit, sans-serif');cx+=widths[i];});
    yy+=rh;
  }
  rows.forEach((r,ri)=>{
    c.fillStyle=r.hl?'#182231':(ri%2?'#0f141b':'#11161e');c.fillRect(x,yy,w,rh);
    let cx=x;
    r.c.forEach((cell,i)=>{
      texto(c,cell,cx+10,yy+rh/2,(r.cols&&r.cols[i])||'#F4EFEA',
        i===0?'14px Outfit, sans-serif':'14px ui-monospace, monospace');
      cx+=widths[i];
    });
    yy+=rh;
  });
  c.strokeStyle='#2a3140';c.lineWidth=1;c.strokeRect(x+0.5,y+0.5,w-1,yy-y-1);
  return yy;
}
function axn(v){return Math.abs(v)>=10?f1(v,0):f1(v,1);}
function ejes(c,x,y,w,h,xmax,ymax,xlab,ylab,y2max,y2lab){
  c.fillStyle='#0a0d13';c.fillRect(x,y,w,h);
  c.font='13px ui-monospace, monospace';c.textBaseline='middle';
  for(let i=0;i<=5;i++){
    const gx=x+w*i/5, gy=y+h-h*i/5;
    linea(c,gx,y,gx,y+h,'#1b2130',[],1);
    linea(c,x,gy,x+w,gy,'#1b2130',[],1);
    c.fillStyle='#6b7383';c.textAlign='center';c.fillText(axn(xmax*i/5),gx,y+h+15);
    c.textAlign='right';c.fillText(axn(ymax*i/5),x-7,gy);
    if(y2max){c.fillStyle='#a08a5e';c.textAlign='left';c.fillText(f1(y2max*i/5,2),x+w+7,gy);}
  }
  c.strokeStyle='#39404f';c.lineWidth=1;c.strokeRect(x+0.5,y+0.5,w-1,h-1);
  texto(c,xlab,x+w/2,y+h+36,'#8f97a5','14px Outfit, sans-serif','center');
  c.save();c.translate(x-46,y+h/2);c.rotate(-Math.PI/2);
  texto(c,ylab,0,0,'#8f97a5','14px Outfit, sans-serif','center');c.restore();
  if(y2lab){c.save();c.translate(x+w+50,y+h/2);c.rotate(-Math.PI/2);
    texto(c,y2lab,0,0,'#a08a5e','14px Outfit, sans-serif','center');c.restore();}
  return {X:v=>x+w*Math.max(0,Math.min(1,v/xmax)),
          Y:v=>y+h-h*Math.max(0,Math.min(1,v/ymax)),
          Y2:v=>y+h-h*Math.max(0,Math.min(1,v/(y2max||1))),
          x,y,w,h,xmax,ymax};
}
function ejesLog(c,x,y,w,h,xmin,xmax,ymin,ymax,xlab,ylab){
  c.fillStyle='#0a0d13';c.fillRect(x,y,w,h);
  const l0=Math.log10(ymin), l1=Math.log10(ymax);
  const X=v=>x+w*Math.max(0,Math.min(1,(v-xmin)/(xmax-xmin)));
  const Y=v=>y+h-h*Math.max(0,Math.min(1,(Math.log10(Math.max(v,1e-6))-l0)/(l1-l0)));
  c.font='13px ui-monospace, monospace';c.textBaseline='middle';
  for(let t=xmin;t<=xmax;t+=(xmax-xmin)/7){
    linea(c,X(t),y,X(t),y+h,'#1b2130',[],1);
    c.fillStyle='#6b7383';c.textAlign='center';c.fillText(f1(t,0),X(t),y+h+15);
  }
  for(const v of [10,100,1000]){
    for(let k=1;k<10;k++){const vv=v*k;if(vv<ymin||vv>ymax)continue;
      linea(c,x,Y(vv),x+w,Y(vv),k===1?'#232b39':'#161c26',[],1);}
    if(v>=ymin&&v<=ymax){c.fillStyle='#6b7383';c.textAlign='right';c.fillText(f1(v,0),x-7,Y(v));}
  }
  c.strokeStyle='#39404f';c.lineWidth=1;c.strokeRect(x+0.5,y+0.5,w-1,h-1);
  texto(c,xlab,x+w/2,y+h+36,'#8f97a5','14px Outfit, sans-serif','center');
  c.save();c.translate(x-48,y+h/2);c.rotate(-Math.PI/2);
  texto(c,ylab,0,0,'#8f97a5','14px Outfit, sans-serif','center');c.restore();
  return {X,Y,x,y,w,h};
}
function leyenda(c,x,y,items){
  let cx=x;
  for(const it of items){
    c.fillStyle=it[1];c.fillRect(cx,y-5,22,4);
    texto(c,it[0],cx+28,y,'#a8b0bd','13px Outfit, sans-serif');
    cx+=34+c.measureText(it[0]).width;
  }
}

function drawBanco(c){
  const B=BOMBAS[bcBomba], L=LIMS[bcLim];
  title2(c,'Curva P–Q en el banco de ensayo',
    B.nom+' · '+bcD+' cm³/rev · ISO VG 46 a 50 °C · '+f1(N_BOMBA,0)+' min⁻¹ · orificio de '+bcArea+' mm²');
  const mu=muT(ACE_BANCO,T_BANCO), rho=rhoT(ACE_BANCO,T_BANCO);
  const Qt=CUR.Qt, pt=CUR.pt;
  const ymax=Math.max(10,Math.ceil(Qt/10)*10);
  const A=ejes(c,72,106,566,326,350,ymax,'presión en la brida (bar)','caudal (L/min)',1,'rendimiento');
  // curvas P-Q de las tres bombas de cilindrada fija
  for(const b of BOMB_BANCO){
    const pm=BOMBAS[b].pMax, pts=[];
    for(let i=0;i<=60;i++){const p=pm*i/60;pts.push([A.X(p),A.Y(caudal(b,bcD,p,mu,N_BOMBA))]);}
    curva(c,pts,b===bcBomba?AZUL:'#39404f',b===bcBomba?3:1.5);
    linea(c,A.X(pm),A.Y(caudal(b,bcD,pm,mu,N_BOMBA)),A.X(pm),A.Y(0),b===bcBomba?'#4a5568':'#232b39',[3,3],1);
    texto(c,BOMBAS[b].abr,A.X(pm)-4,A.Y(caudal(b,bcD,pm,mu,N_BOMBA))-12,
      b===bcBomba?AZUL:'#59616f','12px Outfit, sans-serif','right');
  }
  // referencia: la de compensador no tiene UNA curva, se corta en su tarado
  {
    const pcomp=tarado('banco','var').pComp, pts=[];
    for(let i=0;i<=40;i++){const p=pcomp*i/40;pts.push([A.X(p),A.Y(caudal('var',bcD,p,mu,N_BOMBA))]);}
    pts.push([A.X(pcomp),A.Y(0)]);
    curva(c,pts,VIO,1.6,[6,4]);
    texto(c,'compensada',A.X(pcomp)+6,A.Y(0)-16,VIO,'12px Outfit, sans-serif');
  }
  // rendimientos de la bomba elegida (eje derecho)
  {
    const pv=[],ptt=[];
    for(let i=1;i<=60;i++){const p=B.pMax*i/60;
      pv.push([A.X(p),A.Y2(etaVol(bcBomba,bcD,p,mu,N_BOMBA))]);
      ptt.push([A.X(p),A.Y2(etaTot(bcBomba,bcD,p,mu,N_BOMBA))]);}
    curva(c,pv,VERDE,1.8,[5,3]);curva(c,ptt,NARANJA,2.2);
  }
  // caracteristica de la carga: orificio + limitadora
  {
    const pts=[],pl=[];
    for(let i=0;i<=70;i++){const p=350*i/70;
      pts.push([A.X(p),A.Y(caudalOrificio(bcArea,p,rho)+caudalLim(p,CUR.pc,bcLim))]);
      pl.push([A.X(p),A.Y(caudalLim(p,CUR.pc,bcLim))]);}
    curva(c,pts,'#F2A65A',2.2);curva(c,pl,BAD_HEX,1.6,[4,3]);
    linea(c,A.X(CUR.pc),A.y,A.X(CUR.pc),A.y+A.h,BAD_HEX,[2,4],1);
    texto(c,'tarado '+f1(CUR.pc,0)+' bar',A.X(CUR.pc)-5,A.y+14,BAD_HEX,'12px Outfit, sans-serif','right');
  }
  // punto de trabajo
  {
    const px=A.X(pt.p), py=A.Y(pt.Q);
    linea(c,px,A.y+A.h,px,py,'#F4EFEA',[3,3],1);
    linea(c,A.x,py,px,py,'#F4EFEA',[3,3],1);
    c.fillStyle='#F4EFEA';c.beginPath();c.arc(px,py,6,0,7);c.fill();
    texto(c,f1(pt.p,1)+' bar · '+f1(pt.Q,2)+' L/min',
      Math.min(px+12,A.x+A.w-8),py-16,'#F4EFEA','bold 14px Outfit, sans-serif',px>A.x+A.w*0.7?'right':'left');
  }
  leyenda(c,72,470,[['caudal de la bomba',AZUL],['carga (orificio + limitadora)','#F2A65A'],
    ['sólo limitadora',BAD_HEX],['ηV',VERDE],['ηT',NARANJA]]);

  rpanel(c,PX.x,PX.y,PX.w,368,'Punto de trabajo medido');
  let y=PX.y+52;const dy=27;
  prow(c,PX.x,y,PX.w,'presión',f1(pt.p,1)+' bar');y+=dy;
  prow(c,PX.x,y,PX.w,'caudal teórico Qt = D·n/1000',f1(Qt,2)+' L/min');y+=dy;
  prow(c,PX.x,y,PX.w,'fuga',f1(fuga(bcBomba,bcD,pt.p,mu,N_BOMBA),2)+' L/min',WARN_HEX);y+=dy;
  prow(c,PX.x,y,PX.w,'caudal entregado',f1(pt.Q,2)+' L/min',AZUL);y+=dy;
  prow(c,PX.x,y,PX.w,'  · por el orificio',f1(pt.Qor,2)+' L/min');y+=dy;
  prow(c,PX.x,y,PX.w,'  · por la limitadora',f1(pt.Qlim,2)+' L/min',pt.Qlim>0.01?BAD_HEX:GRIS);y+=dy+6;
  prow(c,PX.x,y,PX.w,'ηV = Q/Qt',f1(100*CUR.etaV,1)+' %',VERDE);y+=dy;
  prow(c,PX.x,y,PX.w,'ηM = Tid/T',f1(100*CUR.etaM,1)+' %');y+=dy;
  prow(c,PX.x,y,PX.w,'ηT = ηV·ηM',f1(100*CUR.etaT,1)+' %',NARANJA);y+=dy+6;
  prow(c,PX.x,y,PX.w,'par en el eje',f1(CUR.par.T,2)+' N·m');y+=dy;
  prow(c,PX.x,y,PX.w,'potencia de eje',f1(CUR.Pe,3)+' kW');y+=dy;
  prow(c,PX.x,y,PX.w,'potencia hidráulica p·Q/600',f1(CUR.Ph,3)+' kW');y+=dy;
  prow(c,PX.x,y,PX.w,'pérdida (todo calor)',f1(CUR.Pe-CUR.Ph,3)+' kW',BAD_HEX);

  rpanel(c,PX.x,458,PX.w,196,'Limitadora '+L.abr);
  y=458+52;
  prow(c,PX.x,y,PX.w,'tarado pc',f1(CUR.pc,0)+' bar');y+=dy;
  prow(c,PX.x,y,PX.w,'sobrepresión declarada',f1(100*L.ovr,0)+' %');y+=dy;
  prow(c,PX.x,y,PX.w,'presión a caudal completo',f1(CUR.pff,1)+' bar',colOk(CUR.pff<=B.pMax));y+=dy;
  prow(c,PX.x,y,PX.w,'presión máxima de la bomba',f1(B.pMax,0)+' bar');y+=dy;
  prow(c,PX.x,y,PX.w,'veredicto',CUR.pff<=B.pMax?'cabe':'NO cabe',colOk(CUR.pff<=B.pMax));

  const etaMax=(()=>{let b=0,bp=0;for(let p=2;p<=B.pMax;p+=1){const e=etaTot(bcBomba,bcD,p,mu,N_BOMBA);if(e>b){b=e;bp=p;}}return{b,bp};})();
  nota(c,494,'La curva P–Q no es plana: la fuga vale Cs·Dp·Δp/μ, o sea que crece con la presión, y el caudal baja en línea recta. De '+
    f1(caudal(bcBomba,bcD,0,mu,N_BOMBA),2)+' L/min a presión nula pasa a '+f1(caudal(bcBomba,bcD,B.pMax,mu,N_BOMBA),2)+
    ' L/min en su presión máxima: '+f1(100*(1-caudal(bcBomba,bcD,B.pMax,mu,N_BOMBA)/Qt),1)+' % menos.',AZUL,74);
  nota(c,578,'El rendimiento total tampoco es monótono: a presión baja lo mata el par viscoso (que no depende de la presión) y a presión alta lo mata la fuga. Con esta bomba el máximo, '+
    f1(100*etaMax.b,1)+' %, cae en '+f1(etaMax.bp,0)+' bar — ni en el mínimo ni en el máximo de la escala.',NARANJA,74);
  nota(c,662,pt.Qlim>0.01
    ? 'Con este orificio la bomba da más caudal del que el agujero se traga, así que la presión sube hasta el tarado y '+f1(pt.Qlim,2)+' L/min se van por la limitadora: esos '+f1(potHid(pt.p,pt.Qlim),2)+' kW son calor puro.'
    : 'Con este orificio la limitadora no interviene: todo el caudal pasa por el agujero y la presión la fija la carga, no el tarado. Baja el área y verás cuándo empieza a soplar la limitadora.',
    pt.Qlim>0.01?BAD_HEX:VERDE,74);
}

function faseEn(cic,t01){
  const tot=cic.fases.reduce((a,f)=>a+tFase(f),0);
  if(!(tot>0))return {i:0,u:0};
  const t=t01*tot;let acc=0;
  for(let i=0;i<cic.fases.length;i++){
    const d=tFase(cic.fases[i]);
    if(t<acc+d||i===cic.fases.length-1)return {i,u:d>0?Math.max(0,Math.min(1,(t-acc)/d)):0};
    acc+=d;
  }
  return {i:0,u:0};
}

function drawCiclo(c){
  const ev=CUR.ev, cic=ev.cic, est=CUR.est;
  title2(c,'El ciclo de la máquina y a dónde va la energía',
    est.nom+' · '+BOMBAS[CUR.cfg.bomba].nom+' · '+CUR.cfg.D+' cm³/rev · '+ACEITES[CUR.cfg.aceite].nom+' · '+LIMS[CUR.cfg.lim].abr);
  const x0=72,w0=918;
  // tira de fases
  const cur=faseEn(cic,animT);
  const tSum=cic.fases.reduce((a,f)=>a+tFase(f),0);
  const nInf=cic.fases.filter(f=>!isFinite(f.tReal)).length;
  const wInf=nInf?70:0, wRest=w0-wInf*nInf;
  const wArr=cic.fases.map(f=>isFinite(f.tReal)
    ? (tSum>0?wRest*f.tReal/tSum:wRest/cic.fases.length)
    : wInf);
  let cx=x0;
  for(let i=0;i<cic.fases.length;i++){
    const f=cic.fases[i], fw=wArr[i], inf=!isFinite(f.tReal);
    const col=inf?'#5c2b2b':(f.descargado?'#3a4250':(f.lento?'#5c2b2b':(f.Qlim>0.05?'#4a3a24':'#243448')));

  const curX=x0+wArr.slice(0,cur.i).reduce((a,b)=>a+b,0)+(wArr[cur.i]||0)*cur.u;
  linea(c,curX,98,curX,172,'#F4EFEA',[],2);
  texto(c,'ciclo de '+f1(cic.tCic,2)+' s',x0+w0,90,'#8f97a5','13px Outfit, sans-serif','right');

    c.fillStyle=BAD_HEX;c.fillRect(bx+i*cw+cw*0.18,by+bh-hu-hc,cw*0.64,hc);
    if(i===cur.i){c.strokeStyle='#F4EFEA';c.lineWidth=2;c.strokeRect(bx+i*cw+cw*0.18,by+bh-hu-hc,cw*0.64,hu+hc);}
    texto(c,f1(f.Peje,2),bx+i*cw+cw/2,by+bh-hu-hc-12,'#cfd6e2','bold 13px ui-monospace, monospace','center');
    texto(c,f.id,bx+i*cw+cw/2,by+bh+16,'#8f97a5','12px Outfit, sans-serif','center');
  }
  texto(c,'potencia de eje por fase (kW), pico '+f1(cic.Ppico,2)+' kW',bx,by-12,'#cfd6e2','bold 15px Outfit, sans-serif');
  leyenda(c,bx,by+bh+40,[['trabajo útil p·Q/600',VERDE],['calor',BAD_HEX]]);

  prow(c,PX.x,y,PX.w,'duración del ciclo',f1(cic.tCic,2)+' s',cic.lento?BAD_HEX:'#F4EFEA');y+=dy;
  prow(c,PX.x,y,PX.w,'energía útil',f1(cic.Eutil,1)+' kJ',VERDE);y+=dy;
  prow(c,PX.x,y,PX.w,'energía en calor',f1(cic.Ecal,1)+' kJ',BAD_HEX);y+=dy;
  prow(c,PX.x,y,PX.w,'rendimiento del ciclo',f1(100*cic.etaCic,1)+' %',NARANJA);y+=dy;

  const desc=cic.fases.filter(f=>f.descargado);

// ===================== 7. GRUPO HIDRAULICO 3D =====================
// Un grupo de accionamiento real, en el orden en que se recorre el aceite:
// deposito -> colador -> aspiracion -> bomba (arrastrada por el motor) ->
// bloque con manometro y limitadora -> linea de trabajo -> orificio calibrado
// (banco) o cilindro (instalacion) -> retorno al deposito.
const GEO_CIL=new THREE.CylinderGeometry(1,1,1,28);
const GEO_TUB=new THREE.CylinderGeometry(1,1,1,14);
const _vA=new THREE.Vector3(),_vB=new THREE.Vector3(),_vD=new THREE.Vector3(),_up=new THREE.Vector3(0,1,0);
function tuboAB(mat,padre){const m=new THREE.Mesh(GEO_TUB,mat);(padre||scene).add(m);return m;}
function setTuboAB(m,a,b,r){
  _vA.set(a[0],a[1],a[2]);_vB.set(b[0],b[1],b[2]);_vD.copy(_vB).sub(_vA);
  const L=_vD.length();
  m.position.copy(_vA).addScaledVector(_vD,0.5);
  m.scale.set(r,Math.max(L,0.001),r);
  m.quaternion.setFromUnitVectors(_up,_vD.normalize());
}
// tuberia poligonal: un tramo por segmento
function polit(pts,r,mat){
  const g=new THREE.Group();scene.add(g);
  const segs=[];
  for(let i=0;i<pts.length-1;i++){const m=new THREE.Mesh(GEO_TUB,mat);g.add(m);setTuboAB(m,pts[i],pts[i+1],r);segs.push(m);}
  return {g,segs,pts};
}
// marcadores de flujo: esferitas que recorren la polilinea. La VELOCIDAD es
// proporcional al caudal, asi que "se ve" cuando el caudal cae.
function largoPoli(pts){
  let L=0;for(let i=0;i<pts.length-1;i++){
    L+=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1],pts[i+1][2]-pts[i][2]);}
  return L;
}
function puntoPoli(pts,u){
  const L=largoPoli(pts);if(L<=0)return pts[0];
  let d=Math.max(0,Math.min(1,u))*L;
  for(let i=0;i<pts.length-1;i++){
    const s=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1],pts[i+1][2]-pts[i][2]);
    if(d<=s||i===pts.length-2){const t=s>0?d/s:0;
      return [pts[i][0]+(pts[i+1][0]-pts[i][0])*t,pts[i][1]+(pts[i+1][1]-pts[i][1])*t,pts[i][2]+(pts[i+1][2]-pts[i][2])*t];}
    d-=s;
  }
  return pts[pts.length-1];
}
const GEO_GOTA=new THREE.SphereGeometry(0.030,10,8);
function makeFlow(pts,n,mat){
  const ms=[];for(let i=0;i<n;i++){const m=new THREE.Mesh(GEO_GOTA,mat);scene.add(m);ms.push(m);}
  return {pts,ms,n};
}
function setFlow(fl,u0,visible,mat){
  for(let i=0;i<fl.n;i++){
    const m=fl.ms[i];m.visible=visible;
    if(mat&&m.material!==mat)m.material=mat;
    if(!visible)continue;
    const u=((u0+i/fl.n)%1+1)%1;
    const p=puntoPoli(fl.pts,u);m.position.set(p[0],p[1],p[2]);
  }
}

// Una sola funcion decide que le pasa al hardware en cada modo. Asi el 3D no
// tiene que saber nada de los modos: le llega un estado y lo dibuja.
function rodPos(estK,cic,cur){
  const tabla=FASE_POS[estK]||{};
  const f=cic.fases[cur.i];if(!f)return 0;
  const t=tabla[f.id]||{fin:0};
  const prev=cur.i>0?cic.fases[cur.i-1]:cic.fases[cic.fases.length-1];
  const p0=prev?((tabla[prev.id]||{fin:0}).fin):0;
  if(t.via!==undefined){
    return cur.u<0.5 ? p0+(t.via-p0)*(cur.u/0.5) : t.via+(t.fin-t.via)*((cur.u-0.5)/0.5);
  }
  return p0+(t.fin-p0)*cur.u;
}
function hwState(){
  const st={p:0,Q:0,Qlim:0,Qcarga:0,T:T_BANCO,ace:ACE_BANCO,cav:false,desc:false,
            rod:0,banco:false,crit:null,critOn:false,pc:0,pMax:350,rot:'',sub:''};
  if(mode==='banco'){
    const B=BOMBAS[bcBomba];
    st.banco=true;st.p=CUR.pt.p;st.Q=CUR.pt.Q;st.Qlim=CUR.pt.Qlim;st.Qcarga=CUR.pt.Qor;
    st.T=T_BANCO;st.ace=ACE_BANCO;st.pc=CUR.pc;st.pMax=B.pMax;
    st.rot='Banco de ensayo';st.sub='Orificio de '+f1(bcArea,0)+' mm²';
  }else if(mode==='aceite'){
    const B=BOMBAS[acBomba];
    st.T=acT;st.ace=acAce;st.cav=CUR.asp.cavita;st.Q=CUR.Qt;st.Qcarga=CUR.Qt;st.pMax=B.pMax;
    st.rot=CUR.est.nom;st.sub='Aceite a '+f1(acT,0)+' °C';
  }else{
    const ev=CUR.ev,cic=ev.cic,cfg=CUR.cfg,B=BOMBAS[cfg.bomba];
    const cur=faseEn(cic,animT);const f=cic.fases[cur.i];
    st.crit=ev;st.critOn=true;st.T=ev.Treg;st.ace=cfg.aceite;st.pc=ev.tar.pc;st.pMax=B.pMax;
    st.cav=ev.asp.cavita;
    if(f){
      st.p=f.p;st.Q=f.Qact+f.Qlim;st.Qlim=f.Qlim;st.Qcarga=f.Qact;st.desc=!!f.descargado;
      st.rod=rodPos(CUR.estK,cic,cur);
      st.rot=CUR.est.nom;st.sub=nomFase(CUR.estK,f.id)+(f.lento?' · no llega':'');
    }
  }
  return st;
}

const COL_ACE={vg32:0xE8C46A,vg46:0xD9A441,vg68:0xB07C2A};
let spin=0;
// Los tres lienzos (manometro, placa y tablero) se redibujan solo cuando su
// contenido cambia: la aguja gira cada cuadro, pero el DIBUJO de la esfera es
// el mismo mientras no cambie la lectura redondeada.
let _kMano='',_kPlaca='',_kCrit='';
function drawMano(p,pc,pMax){
  const k=f1(p,1)+'|'+pc+'|'+pMax;
  if(k===_kMano)return;_kMano=k;
  const c=manoCv.getContext('2d');
  c.fillStyle='#f2efe9';c.beginPath();c.arc(128,128,124,0,Math.PI*2);c.fill();
  c.strokeStyle='#1a1f27';c.lineWidth=6;c.beginPath();c.arc(128,128,120,0,Math.PI*2);c.stroke();
  // escala 0..400 bar sobre 270 grados
  for(let b=0;b<=400;b+=20){
    const a=Math.PI*0.75+ (b/400)*Math.PI*1.5;
    const r1=b%100===0?92:102, r2=112;
    c.strokeStyle=b>pMax?'#c05050':'#1a1f27';c.lineWidth=b%100===0?4:2;
    c.beginPath();c.moveTo(128+r1*Math.cos(a),128+r1*Math.sin(a));c.lineTo(128+r2*Math.cos(a),128+r2*Math.sin(a));c.stroke();
    if(b%100===0){
      c.fillStyle='#1a1f27';c.font='bold 20px Outfit, sans-serif';c.textAlign='center';c.textBaseline='middle';
      c.fillText(String(b),128+74*Math.cos(a),128+74*Math.sin(a));
    }
  }
  // arco rojo por encima de la presion maxima de la bomba
  {
    const a1=Math.PI*0.75+(Math.min(pMax,400)/400)*Math.PI*1.5, a2=Math.PI*0.75+Math.PI*1.5;
    c.strokeStyle='#c05050';c.lineWidth=8;c.beginPath();c.arc(128,128,116,a1,a2);c.stroke();
  }
  // marca del tarado
  if(pc>0){
    const a=Math.PI*0.75+(Math.min(pc,400)/400)*Math.PI*1.5;
    c.strokeStyle='#2a7f4f';c.lineWidth=6;
    c.beginPath();c.moveTo(128+96*Math.cos(a),128+96*Math.sin(a));c.lineTo(128+118*Math.cos(a),128+118*Math.sin(a));c.stroke();
  }
  c.fillStyle='#5a6270';c.font='bold 17px Outfit, sans-serif';c.textAlign='center';c.textBaseline='middle';
  c.fillText('bar',128,168);
  c.fillStyle='#1a1f27';c.font='bold 24px ui-monospace, monospace';
  c.fillText(f1(p,0),128,198);
  manoTex.needsUpdate=true;
}
function drawPlaca(st){
  const ev=st.crit;
  const mot=ev?ev.motE:null;
  const k=(ev?(ev.valido?1:0)+'|'+f1(ev.cic.Ppico,2):'-')+'#'+(mot?f1(mot.kW,1)+'|'+f1(mot.eta,4):'-');
  if(k===_kPlaca)return;_kPlaca=k;
  const c=plCv.getContext('2d');
  c.fillStyle='#0c1016';c.fillRect(0,0,256,160);
  c.strokeStyle=ev?(ev.valido?OK_HEX:BAD_HEX):'#3a4250';c.lineWidth=3;c.strokeRect(1.5,1.5,253,157);
  c.fillStyle='#F4EFEA';c.font='bold 15px Outfit, sans-serif';c.textAlign='left';c.textBaseline='alphabetic';
  c.fillText('MOTOR ASÍNCRONO',12,26);
  c.font='11px Outfit, sans-serif';c.fillStyle=GRIS;
  c.fillText('IEC 60034-30-1 · 4 polos · 60 Hz',12,44);
  c.font='13px ui-monospace, monospace';
  const filas=mot
    ? [['Potencia',f1(mot.kW,1)+' kW'],['Rendimiento',f1(100*mot.eta,1)+' %'],['Velocidad',f1(N_BOMBA,0)+' min⁻¹'],['Pico del ciclo',f1(ev.cic.Ppico,2)+' kW']]
    : [['Potencia','— kW'],['Rendimiento','— %'],['Velocidad',f1(N_BOMBA,0)+' min⁻¹'],['Pico del ciclo','—']];
  filas.forEach((f,i)=>{
    c.fillStyle=GRIS;c.fillText(f[0],12,72+i*20);
    c.fillStyle='#F4EFEA';c.textAlign='right';c.fillText(f[1],244,72+i*20);c.textAlign='left';
  });
  plTex.needsUpdate=true;
}
function drawCrit(st){
  const k=(st.critOn?1:0)+'|'+CRIT.map(q=>st.critOn&&st.crit?(st.crit[q]?1:0):'-').join('');
  if(k===_kCrit)return;_kCrit=k;
  const c=critCv.getContext('2d');
  c.clearRect(0,0,512,128);
  c.fillStyle='#0c1016';c.fillRect(0,0,512,128);
  c.fillStyle=GRIS;c.font='bold 15px Outfit, sans-serif';c.textAlign='left';c.textBaseline='middle';
  c.fillText(st.critOn?'CRITERIOS':'BANCO DE ENSAYO · sin criterios',14,22);
  CRIT.forEach((k,i)=>{
    const x=44+i*66, y=76;
    const on=st.critOn&&st.crit?st.crit[k]:null;
    c.fillStyle=on===null?'#2a3140':(on?'#1f4a33':'#4a2020');
    c.beginPath();c.arc(x,y,24,0,Math.PI*2);c.fill();
    c.strokeStyle=on===null?'#3a4250':(on?OK_HEX:BAD_HEX);c.lineWidth=3;c.stroke();
    c.fillStyle=on===null?'#6a7280':(on?OK_HEX:BAD_HEX);
    c.font='bold 24px Outfit, sans-serif';c.textAlign='center';
    c.fillText(CRIT_LET[k],x,y+1);
  });
  critTex.needsUpdate=true;
}

function updateHW(){
  const st=hwState();
  // eje y bomba: giran siempre (el motor no para), pero el 3D no cronometra
  ejeM.rotation.x=spin;chaveta.rotation.x=spin;
  // aceite del deposito y de la mirilla
  aceiteM.material.color.setHex(COL_ACE[st.ace]||0xD9A441);
  // termometro: -20..100 grados sobre 0.28 de columna
  {
    const T=isFinite(st.T)?Math.max(-20,Math.min(100,st.T)):100;
    const h=0.02+0.26*(T+20)/120;
    colTermo.scale.y=h;colTermo.position.y=0.44+h/2;
    const cal=T>T_MAX_ACEITE;
    colTermo.material.color.setHex(cal?0xff6b6b:(T<5?0x8AB4F8:0xE9C46A));
  }
  // manometro
  agujaG.rotation.z=2.356-4.712*Math.max(0,Math.min(1,st.p/400));
  drawMano(st.p,st.pc,st.pMax);
  // corredera de la limitadora: sube con el caudal que se le va por encima
  limAnillo.position.y=1.90+0.12*Math.max(0,Math.min(1,st.Qlim/40));
  // carga visible segun el modo
  bancoG.visible=st.banco;
  instG.visible=!st.banco;
  if(!st.banco){
    const x=2.90+0.50*st.rod;
    vastago.scale.y=0.56+0.50*st.rod;
    vastago.position.set(2.58+0.25*st.rod,1.62,0.30);
    cargaB.position.set(x+0.11,1.62,0.30);
  }
  // marcadores de flujo
  const uAsp=(spin*0.030)%1;
  setFlow(flAsp,uAsp,st.Q>0.05,st.cav?MAT.flujoCal:MAT.flujoAsp);
  setFlow(flTrab,uAsp*1.4%1,st.Qcarga>0.05,MAT.flujoOk);
  setFlow(flLim,uAsp*1.1%1,st.Qlim>0.05,MAT.flujoCal);
  // tableros
  drawPlaca(st);
  drawCrit(st);
  el('hwrot').textContent=st.rot;
  el('hwsub').textContent=st.sub+(st.desc?' · grupo descargado':'')+(st.cav?' · CAVITA':'');
}

function setMode(k){
  mode=k;animT=0;
  ['banco','aceite','ciclo','proyecto','reto'].forEach(m=>el('m_'+m).classList.toggle('on',m===k));
  el('p_mode').textContent=MODE_META[k].nombre;
  el('retoTitle').style.display=k==='reto'?'':'none';
  el('retoBox').style.display=k==='reto'?'':'none';
  computa();
  buildControls();updateScenarioInfo();
  clearDx();buildQuiz();refreshQuestion();
  if(k==='reto')updateRetoSpec();
  const cam=MODE_META[k].cam;S.moveTo(cam[0],cam[1]);
  refreshAll();
}
// "Nuevo escenario": cambia la estacion del reto y rearma la configuracion de
// partida; en los demas modos mueve el punto de ensayo.
function newSignal(){
  if(mode==='banco'){
    const i=AREAS.indexOf(bcArea);bcArea=AREAS[(i+1)%AREAS.length];
    const j=BOMB_BANCO.indexOf(bcBomba);if(i+1>=AREAS.length)bcBomba=BOMB_BANCO[(j+1)%BOMB_BANCO.length];
  }else if(mode==='aceite'){
    const i=ESTK.indexOf(acEst);acEst=ESTK[(i+1)%ESTK.length];
    acT=ESTACIONES[acEst].Tfrio<=8?10:50;
  }else if(mode==='ciclo'||mode==='proyecto'){
    const i=ESTK.indexOf(pjEst);pjEst=ESTK[(i+1)%ESTK.length];
  }else{
    const i=ESTK.indexOf(retoEst);retoEst=ESTK[(i+1)%ESTK.length];
    retoSolveBuild(true);
  }
  retoSolved=false;solved=false;retoMsg='';
  computa();buildControls();updateScenarioInfo();
  clearDx();buildQuiz();refreshQuestion();
  if(mode==='reto')updateRetoSpec();
  refreshAll();
  showToast('🔀 <b>Escenario nuevo.</b> '+MODE_META[mode].mision);
}

function retoSolveBuild(silent){
  const s=startCfg(retoEst);
  retoCfg=s?{...s}:{bomba:'eng',D:25,aceite:'vg46',lim:'dir'};
  retoSolved=false;retoMsg='';retoAxes={bomba:false,D:false,aceite:false,lim:false};
  if(!silent){computa();buildControls();updateRetoSpec();refreshAll();}
}
function updateRetoSpec(){
  const est=ESTACIONES[retoEst];
  const v=validas(retoEst).length, cm=costeMin(retoEst);
  el('retoSpec').innerHTML=
    '<b>'+est.nom+'</b><br>'+
    'Monta el grupo <b>válido más barato</b>: los siete criterios en verde y el coste mínimo. '+
    'De las '+f1(CFGS.length,0)+' combinaciones posibles, <b>'+f1(v,0)+'</b> son válidas y la más barata cuesta <b>'+f1(cm,0)+'</b> unidades.<br>'+
    '<span style="color:var(--muted)">Acometida '+f1(est.kwMax,1)+' kW · '+f1(est.horas,0)+' h/año · '+f1(est.Emax,0)+' kWh contratados · arranque a '+f1(est.Tfrio,0)+' °C.</span>';
}
function retoExplain(){
  const ev=evalua(retoEst,retoCfg), cm=costeMin(retoEst);
  if(!ev.valido)return 'Falla <b>'+CRIT_ROT[ev.primero]+'</b>. '+MOTIVO[ev.primero];
  if(ev.coste!==cm)return 'Válido, pero caro: cuesta '+f1(ev.coste,0)+' y el mínimo es '+f1(cm,0)+'. Hay al menos una combinación válida más barata.';
  return 'Los siete criterios en verde y al coste mínimo: '+f1(ev.coste,0)+' unidades.';
}
function checkReto(){
  const ev=evalua(retoEst,retoCfg), cm=costeMin(retoEst);
  EJES.forEach(e=>{retoAxes[e]=ejeSolC(retoEst,e).some(v=>String(v)===String(retoCfg[e]));});
  retoSolved=ev.valido&&cm!==null&&ev.coste===cm;
  retoGood=retoSolved;
  retoMsg=retoExplain();
  solved=retoSolved;
  synth.beep(retoSolved?880:200,0.10,0.05);
  refreshAll();
  if(!autoRunning)showToast((retoSolved?'✅ ':'❌ ')+retoMsg);
  return retoSolved;
}

(function hoverLoop(){
  const ray=new THREE.Raycaster();const m=new THREE.Vector2(-2,-2);
  S.renderer.domElement.addEventListener('pointermove',ev=>{
    const r=S.renderer.domElement.getBoundingClientRect();
    m.x=((ev.clientX-r.left)/r.width)*2-1;m.y=-((ev.clientY-r.top)/r.height)*2+1;
  });
  function tick(){
    ray.setFromCamera(m,S.camera);
    const objs=[...HOVER_LABELS.keys()];
    const hits=ray.intersectObjects(objs,true);
    const hitSet=new Set();
    hits.forEach(h=>{let o=h.object;while(o){if(HOVER_LABELS.has(o)){hitSet.add(o);break;}o=o.parent;}});
    HOVER_LABELS.forEach((spr,obj)=>{spr.visible=hitSet.has(obj);});
    requestAnimationFrame(tick);
  }
  tick();
})();

    await sleep(5600);
    pjBomba='var';afterEdit();
    showToast('<b>Sólo cambia la bomba</b> a cilindrada variable con compensador: '+f1(CUR.ev.Treg,1)+' °C y los siete criterios en verde. Lo que sobraba de caudal ya no se fabrica.');
    await sleep(5600);

    setMode('reto');
    retoEst='prensa';retoSolveBuild(true);afterEdit();
    showToast('<b>5 · El reto.</b> Cuatro ejes y un presupuesto: hay que montar el grupo válido más barato de la estación.');
    await sleep(5000);
    {
      const o=optimas(retoEst)[0];
      if(o){retoCfg={...o};afterEdit();}
    }
    checkReto();
    showToast('<b>Solución:</b> '+retoMsg);
    await sleep(5000);
    answer(QUIZ[mode].opciones.findIndex(o=>o.ok));
  }finally{
    const b=el('btnAuto');
    b.disabled=false;b.classList.remove('on');b.textContent=label;
    autoRunning=false;
  }
}

// ===================== 17. ANIMACION, EVENTOS, ARRANQUE =====================
const ANIM_CICLO=9.0;   // segundos de reloj por vuelta completa al ciclo
S.setAnimate((dt)=>{
  spin+=dt*6.0;
  if(mode==='ciclo'||mode==='proyecto'||mode==='reto'){
    animT=(animT+dt/ANIM_CICLO)%1;
  }
  updateHW();
});
['banco','aceite','ciclo','proyecto','reto'].forEach(m=>{
  el('m_'+m).onclick=()=>{if(!autoRunning)setMode(m);};
});
el('btnAuto').onclick=()=>{if(!autoRunning)runAuto();};
el('btnNew').onclick=()=>{if(autoRunning)return;newSignal();};
el('btnCheck').onclick=()=>{if(autoRunning)return;checkReto();};
const soundBtn=el('soundBtn');
if(soundBtn){soundBtn.onclick=()=>{synth.toggle();soundBtn.textContent=synth.isOn()?'🔊':'🔇';};}
document.addEventListener('pointerdown',()=>{synth.init();synth.resume();},{once:true});
retoSolveBuild(true);
buildQuiz();
computa();          // CUR poblado ANTES del primer cuadro: updateHW lo lee
S.start();
setMode('banco');
