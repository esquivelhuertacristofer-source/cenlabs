<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · ADAS: Radar, Cámara y Frenado Autónomo (AEB) — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#0A1C30;--panel:rgba(9,19,32,.86);--line:#1E3550;--ink:#EAF4F1;
    --dim:#93AFC9;--accent:#3B8EEA;--accent2:#7CC4FF;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cF:#7CC4FF;--cR:#FFB347;--cE:#FF4D5A;--cG:#C8D6D2;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#14202e;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#182c40}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#04101f;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#04101f;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#5aa6f2}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#04101f}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#7CC4FF;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f87a0;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f90a8;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#04101f}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .escs{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
  .esc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px;font-size:11.5px;line-height:1.35;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);color:#c4d3e6}
  .esc .rs{font-weight:700;font-size:11px}.esc .rs.ok{color:var(--good)}.esc .rs.mal{color:#ff9a9a}
  .esc .pista{font-size:10.5px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#09121c;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(30,53,80,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,53,80,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f87a0}
  .dk-tit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#a3bcd6;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c6da;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#14202e;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfdcec;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,18,30,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,18,30,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d3e6}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,18,30,.92);border:1px solid rgba(124,196,255,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,18,30,.84);border:1px solid rgba(124,196,255,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}
  body.estrecho.ancho.t-panel .panel>.dk-fig{grid-column:1;grid-row:2}
  body.estrecho.ancho.t-panel .panel>.dk-row{grid-column:1;grid-row:3/6;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-fu{grid-column:2;grid-row:2;align-self:start}
  body.estrecho.ancho.t-panel .panel>.dk-g.fu{grid-column:2;grid-row:2/4;min-height:0;margin-top:18px}
  body.estrecho.ancho.t-panel .panel>.dk-ley{display:none}
  body.estrecho.ancho.t-panel .panel>.t-sp{grid-column:2;grid-row:4}
  body.estrecho.ancho.t-panel .panel>.dk-g.sp{grid-column:2;grid-row:5;min-height:0}
  body.estrecho.ancho.t-panel .panel>.dk-aviso{display:none}
  body.estrecho .hud details>.cuerpo{max-height:24vh}
  body.estrecho.ancho.t-hud .hud{display:grid;grid-template-columns:1fr 1.05fr;column-gap:14px;row-gap:7px;align-content:start;grid-auto-flow:row dense}
  body.estrecho.ancho .hud>.hcab,body.estrecho.ancho .hud>.modebar,body.estrecho.ancho .hud>.hdet,body.estrecho.ancho .hud>.pasos{grid-column:1}
  body.estrecho.ancho .hud>.hmandos,body.estrecho.ancho .hud>.retoBox{grid-column:2;grid-row:1/span 4}
  body.estrecho .hdet{flex-direction:row}body.estrecho .hdet>details{flex:1;min-width:0}
  body.estrecho .hdet details[open]{position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 54px);z-index:25;background:rgba(9,19,32,.97)}
  body.movil .lt{display:none} body.movil .tbar .modo,body.movil .tbar .reloj{display:none}
  body.movil .tbar{gap:6px;padding:5px 8px} body.movil .tbar .est{min-width:0}
  body.movil .dk-ley{display:none} body.movil .fg b{font-size:13.5px} body.movil .fg .fl{font-size:9.5px}
  body.movil .dk-g.fu{min-height:70px} body.movil .dk-g.sp{min-height:52px} body.movil .dk-row{min-height:150px}
  body.movil .hud h2{font-size:15.5px} body.movil .hud .intro{font-size:11.8px;line-height:1.42}
  body.estrecho .hud{overflow-y:auto}
  body.estrecho .vbar [data-t="rot"],body.estrecho .vbar .sep.s1{display:none}
  body.estrecho.ancho .vbar{top:60px}
  body.movil .vbar{flex-wrap:nowrap;gap:3px;padding:3px 4px;top:54px} body.movil .vbar .sep{display:none} body.movil .vbar .b.sm{padding:5px 7px;font-size:11px}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   LAB — ADAS: RADAR, CÁMARA Y FRENADO AUTÓNOMO DE EMERGENCIA (AEB)
   (Autotrónica · mecanica-131)

   Una calle con un paso de peatones. Un coche con radar y cámara se acerca a
   40–60 km/h y un peatón cruza (o se queda en la acera). El cono del radar y
   el campo de la cámara se dibujan sobre el suelo; el coche mide la distancia
   con ruido, un filtro alfa-beta la limpia, y el AEB avisa, frena a medias o
   frena a fondo según el tiempo hasta la colisión.

   Todo sale de un solo modelo: cinemática exacta por tramos con latencia y
   rampa de presión, radar a 20 Hz con ruido gaussiano y un filtro de
   Benedict–Bordner. Esa física está en un bloque puro que un script de Node
   extrae TAL CUAL y verifica.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO=' ';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }


/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos
   marcas— y lo prueba: lo que se prueba es lo que corre.

   Un coche se acerca a un obstáculo (un peatón que cruza, o un coche parado).
   Un radar mide la distancia cada 50 ms con ruido; un filtro alfa-beta la
   suaviza y de ella saca la velocidad de cierre; con ellas se calcula el
   tiempo hasta la colisión (TTC = d/v) y, según un umbral, el AEB avisa, frena
   a media fuerza o frena a fondo. El freno tiene latencia y una rampa de
   presión. La cinemática es EXACTA por tramos: si no se evita el choque, la
   velocidad de impacto es la de la solución cerrada v² = v₀² − 2·a·d. */

/* FISICA:INICIO */
const DOSPI=2*Math.PI, G=9.81, RAD=Math.PI/180;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ---------- 1.1 Constantes del sistema ----------
   mu: adherencia de frenado (pico) de la calzada. Los valores del conjunto son de libro
   (seco ≈ 0,8; mojado ≈ 0,55; nieve ≈ 0,25; hielo ≈ 0,12) y se declaran como didácticos. */
const SUPERFICIES={ seco:0.80, mojado:0.55, nieve:0.25, hielo:0.12 };
const AEB={
  T:0.05,              // periodo del radar (20 Hz)
  dt:0.005,            // paso del integrador
  sigD:0.25,           // desviación típica del ruido del radar en distancia (m)
  rangoMax:80, rangoMin:1.5, semiRadar:25*RAD,     // cono del radar
  rangoCam:50, semiCam:35*RAD, nConf:3,            // cámara: campo y fotogramas para confirmar un peatón
  H:1.2,               // semianchura del corredor del coche + radio del peatón (m)
  tau:0.12,            // latencia del freno: orden → presión (s)
  J:60,                // rampa de la deceleración (m/s³)
  aParcial:4.0,        // freno parcial (m/s²)
  kTotal:0.65, kAviso:1.5,   // etapas: aviso a Tu·1,5 · parcial a Tu · total a Tu·0,65
  tr:1.2,              // reacción del conductor tras ver al peatón entrar en su carril (s)
  tPre:1.5,            // la pista del radar ya lleva 1,5 s encendida al empezar
  largoCoche:4.5
};

/* ---------- 1.2 Cinemática de parada ----------
   Con la orden a t=0: la presión tarda tau y sube con rampa J hasta a=μg.
   Distancia de parada exacta si v ≥ a·Tr/2:  d = v·(tau + Tr/2) + v²/(2a) − a·Tr²/24,  Tr = a/J. */
function dParada(v,mu,p=AEB){ const a=mu*G, Tr=a/p.J; return v*(p.tau+Tr/2)+v*v/(2*a)-a*Tr*Tr/24; }
/** Parada ideal sin latencia ni rampa (la fórmula de libro): d = v·t_r + v²/(2μg). */
function dParadaLibro(v,mu,tr=0){ return v*tr+v*v/(2*mu*G); }
const ttcDe=(d,vrel)=>vrel>1e-9?d/vrel:Infinity;                 // TTC = d / v_rel
const aRequerida=(d,vrel)=>d>1e-9?vrel*vrel/(2*d):Infinity;      // v² / (2d)
/** Velocidad de impacto si desde la distancia d se frena a a (constante) tras recorrer v·t_lat sin frenar. */
function vImpactoCerrada(v,d,a,tLat=0){ const r=d-v*tLat; return r<=0?v:Math.sqrt(Math.max(0,v*v-2*a*r)); }

/* ---------- 1.3 Filtro alfa-beta (Benedict–Bordner) ----------
   Predice x_p = x + v·T; el residuo r = z − x_p corrige la posición con α y la velocidad con β/T.
   Con β = α²/(2−α) es el filtro de Benedict–Bordner: el mínimo error transitorio para una rampa. */
function betaBB(alfa){ return alfa*alfa/(2-alfa); }
function nuevoFiltro(alfa,T=AEB.T){ return { alfa, beta:betaBB(alfa), T, x:0, v:0, n:0, r:0 }; }
function actualizaFiltro(f,z){
  if(f.n===0){ f.x=z; f.v=0; f.n=1; return f; }
  if(f.n===1){ f.v=(z-f.x)/f.T; f.x=z; f.n=2; return f; }       // arranque con dos puntos
  const xp=f.x+f.v*f.T, r=z-xp;
  f.x=xp+f.alfa*r; f.v+=f.beta/f.T*r; f.r=r; f.n++; return f;
}
function prediceFiltro(f){ if(f.n>=2) f.x+=f.v*f.T; return f; }
/** Razón de reducción de varianza de la posición filtrada con ruido blanco (Brookner). */
function vrrPosicion(alfa,beta){ return (2*alfa*alfa+2*beta-3*alfa*beta)/(alfa*(4-2*alfa-beta)); }

/* ---------- 1.4 Números aleatorios reproducibles ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function gauss(rnd){ let u=0; while(u<1e-12) u=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(DOSPI*rnd()); }

/* ---------- 1.5 El peatón (o el coche parado) ----------
   Lateral y(t) = y0 − vp·min(t, tStop): positivo a la derecha del eje del coche. */
const tStopDe=P=>(P.tStop===undefined||P.tStop===null)?1e9:P.tStop;
const pedY=(P,t)=>P.y0-P.vp*Math.min(Math.max(t,0),tStopDe(P));
const pedVy=(P,t)=>t<tStopDe(P)?-P.vp:0;
/** Instante en que el obstáculo entra en el corredor del coche (Infinity si nunca). */
function tEntra(P){
  if(Math.abs(P.y0)<AEB.H) return 0;
  if(P.vp<=0) return Infinity;
  const t=(P.y0-AEB.H)/P.vp; return t<=tStopDe(P)?t:Infinity;
}
/** ¿Chocaría el coche si no frenara nada? (llega al plano del obstáculo a t = d0/v0.) */
function colisionableSinFrenar(P){ return Math.abs(pedY(P,P.d0/P.v0))<AEB.H; }

/* ---------- 1.6 La corrida ----------
   P = {v0 (m/s), d0 (m), mu, y0, vp, tStop, Tu (s), alfa, aeb, conductor, semilla}.
   Paso fijo 5 ms; radar y decisión cada 50 ms. */
function nuevaCorrida(P){
  const q={ P, k:0, t:0, s:0, v:P.v0, a:0, X:P.d0, filt:nuevoFiltro(P.alfa===undefined?0.5:P.alfa),
    rnd:mulberry32(P.semilla===undefined?1:P.semilla), etapa:0, cmdA:0, cmdLog:[[-1e9,0]], conf:0, confirmado:false, det:false, z:NaN,
    tEntra:tEntra(P), colisionable:colisionableSinFrenar(P), tAeb:null, etapaMax:0, fin:false, causa:'', res:null, hist:[], rel:false,
    dEst:NaN, vEst:NaN, ttcEst:Infinity, aReq:0, mu:P.mu, Tu:P.Tu };
  q.tDriver=P.conductor===false?Infinity:q.tEntra+AEB.tr;
  // la pista del radar ya existía: el coche venía a v0 antes de t=0
  const nPre=Math.round(AEB.tPre/AEB.T);
  for(let i=-nPre;i<0;i++){ const tk=i*AEB.T; sensor(q,tk,P.v0*tk,false); }
  return q;
}
/** Una medición del radar y de la cámara; con decide=true, también la decisión del AEB. */
function sensor(q,t,s,decide){
  const P=q.P, d=q.X-s, y=pedY(P,t), ang=Math.atan2(Math.abs(y),Math.max(d,1e-9));
  const det=d<=AEB.rangoMax&&d>=AEB.rangoMin&&ang<AEB.semiRadar;
  q.det=det;
  if(det){ q.z=d+AEB.sigD*gauss(q.rnd); actualizaFiltro(q.filt,q.z); } else { q.z=NaN; prediceFiltro(q.filt); }
  if(ang<AEB.semiCam&&d<=AEB.rangoCam) q.conf++; else q.conf=0;
  q.confirmado=q.conf>=AEB.nConf;
  q.dEst=q.filt.x; q.vEst=-q.filt.v;
  q.ttcEst=q.filt.n>=2?ttcDe(q.dEst,q.vEst):Infinity;
  q.aReq=q.filt.n>=2?aRequerida(q.dEst,q.vEst):0;
  if(!decide) return;
  // ¿va a estar el obstáculo en el corredor cuando el coche llegue? (velocidad lateral constante)
  const vy=pedVy(P,t);
  q.rel=q.filt.n>=2&&q.confirmado&&q.vEst>0.5&&q.dEst>0&&Math.abs(y+vy*q.ttcEst)<AEB.H;
  let et=0;
  if(q.rel){ const T=q.ttcEst, Tu=P.Tu; et=T<=Tu*AEB.kTotal?3:(T<=Tu?2:(T<=Tu*AEB.kAviso?1:0)); }
  if(q.etapa>=2) et=Math.max(et,q.etapa);                 // una vez que frena, no suelta
  q.etapa=P.aeb===false?0:et; q.etapaMax=Math.max(q.etapaMax,q.etapa);
  q.cmdA=q.etapa===3?q.mu*G:(q.etapa===2?Math.min(AEB.aParcial,q.mu*G):0);
  if(q.cmdA>0&&q.tAeb===null) q.tAeb=t;
}
const NTAU=()=>Math.round(AEB.tau/AEB.dt);
function cmdRetardado(q,k){ const L=q.cmdLog; for(let i=L.length-1;i>=0;i--) if(L[i][0]<=k) return L[i][1]; return 0; }
/** Estado tras avanzar tt segundos con la deceleración yendo de a0 a aE en t1 s (lineal) y constante después. Exacto. */
function tramo(v,s,a0,aE,t1,tt){
  const u=Math.min(tt,t1), au=t1>0?(u>=t1?aE:a0+(aE-a0)*u/t1):aE;
  let vv=v-a0*u-(au-a0)*u/2, ss=s+v*u-a0*u*u/2-(au-a0)*u*u/6;
  if(t1===0){ vv=v; ss=s; }
  const w=tt-u; if(w>0){ ss=ss+vv*w-au*w*w/2; vv=vv-au*w; }
  return [vv,ss,tt>=t1?aE:au];
}
function biseca(fn,lo,hi){ for(let i=0;i<60;i++){ const m=(lo+hi)/2; if(fn(m)) hi=m; else lo=m; } return (lo+hi)/2; }
/** Avanza un paso de AEB.dt. Cada tramo se integra de forma exacta (rampa lineal y después constante). */
function pasoCorrida(q){
  if(q.fin) return;
  const h=AEB.dt, P=q.P, aMax=q.mu*G;
  if(q.k%10===0){ sensor(q,q.t,q.s,true); registra(q); }
  const cmd=Math.min(aMax,Math.max(q.cmdA,q.t>=q.tDriver?aMax:0));
  if(cmd!==q.cmdLog[q.cmdLog.length-1][1]) q.cmdLog.push([q.k,cmd]);
  const obj=cmdRetardado(q,q.k-NTAU()), a0=q.a, dif=obj-a0;
  let t1, aE;
  if(Math.abs(dif)<=AEB.J*h){ aE=obj; t1=Math.abs(dif)/AEB.J; if(!(t1>0)) t1=0; } else { aE=a0+Math.sign(dif)*AEB.J*h; t1=h; }
  const v0=q.v, s0=q.s;
  let [vN,sN,aN]=tramo(v0,s0,a0,aE,t1,h);
  let tf=h;                                   // duración efectiva del paso
  if(vN<=1e-9){ tf=biseca(x=>tramo(v0,s0,a0,aE,t1,x)[0]<=1e-12,0,h); [vN,sN,aN]=tramo(v0,s0,a0,aE,t1,tf); vN=0; }
  // ¿cruza el plano del obstáculo en este paso?
  if(!q.res&&sN>=q.X&&s0<q.X){
    const tc0=biseca(x=>tramo(v0,s0,a0,aE,t1,x)[1]>=q.X,0,tf), [vc]=tramo(v0,s0,a0,aE,t1,tc0), tc=q.t+tc0;
    if(Math.abs(pedY(P,tc))<AEB.H){
      q.res={ causa:'choque', vImp:Math.max(0,vc), tImp:tc, gap:0 };
      q.s=q.X; q.v=Math.max(0,vc); q.a=aN; q.k++; q.t=q.k*h; q.causa='choque'; q.fin=true; cierra(q); return;
    } else q.res={ causa:'paso', vImp:0, tImp:tc, gap:0 };
  }
  q.s=sN; q.v=vN; q.a=aN; q.k++; q.t=q.k*h;
  if(!q.res&&vN===0){ q.res={ causa:'detenido', vImp:0, tImp:q.t, gap:q.X-q.s }; q.causa='detenido'; q.fin=true; cierra(q); return; }
  if(q.res&&q.res.causa==='paso'&&q.s>=q.X+12){ q.causa='paso'; q.fin=true; cierra(q); return; }
  if(q.t>30){ q.res=q.res||{ causa:'tiempo', vImp:q.v, tImp:q.t, gap:q.X-q.s }; q.causa=q.res.causa; q.fin=true; cierra(q); }
}
function registra(q){
  const d=q.X-q.s, P=q.P;
  q.hist.push({ t:q.t, s:q.s, v:q.v, a:q.a, d, z:q.z, dEst:q.dEst, vEst:q.vEst, ttc:q.ttcEst, ttcV:ttcDe(d,q.v), aReq:q.aReq,
    dReq:dParada(q.v,q.mu), dReqEst:q.filt.n>=2?dParada(Math.max(0,q.vEst),q.mu):NaN, etapa:q.etapa, rel:q.rel, y:pedY(P,q.t), conf:q.confirmado, det:q.det });
}
function cierra(q){
  const r=q.res; r.falsoPos=!q.colisionable&&q.tAeb!==null; r.tAeb=q.tAeb; r.etapaMax=q.etapaMax; r.colisionable=q.colisionable;
  r.vImpKmh=r.vImp*3.6;
}
/** Corre una corrida completa y devuelve la corrida terminada. */
function simula(P){ const q=nuevaCorrida(P); let n=0; while(!q.fin&&n<20000){ pasoCorrida(q); n++; } return q; }

/* ---------- 1.7 Escenarios del reto ----------
   Cada uno: tipo, velocidad (km/h), superficie, y los parámetros del obstáculo. d0 = 3 s de marcha
   (el peatón cruza el carril a los 1,4–3,1 s; el 'para' se detiene en la acera a tStop). */
function paramsDe(E,Tu,alfa,semilla){
  return { v0:E.vKmh/3.6, d0:E.d0!==undefined?E.d0:E.vKmh/3.6*E.tLlega, mu:SUPERFICIES[E.sup], y0:E.y0, vp:E.vp, tStop:E.tStop, Tu, alfa:alfa===undefined?0.5:alfa,
    aeb:true, conductor:false, semilla:semilla===undefined?(E.semilla||1):semilla };
}
/** Evalúa un escenario con un umbral; 'ok' = lo que pide el reto (sin choque / sin frenar en falso). */
function evaluaEscenario(E,Tu,alfa){
  const q=simula(paramsDe(E,Tu,alfa)), r=q.res;
  const ok=q.colisionable?(r.causa!=='choque'):(!r.falsoPos);
  return { id:E.id, ok, causa:r.causa, vImpKmh:r.vImpKmh, falsoPos:r.falsoPos, colisionable:q.colisionable, gap:r.gap, tAeb:r.tAeb };
}
function evaluaConjunto(lista,Tu,alfa){ return lista.map(E=>evaluaEscenario(E,Tu,alfa)); }
/** Barre Tu y devuelve la ventana [lo,hi] en que TODOS los escenarios pasan (null si no hay). */
function ventanaTu(lista,alfa,t0=0.5,t1=3.0,paso=0.05){
  let lo=null, hi=null; const n=Math.round((t1-t0)/paso);
  for(let i=0;i<=n;i++){ const Tu=+(t0+i*paso).toFixed(4), ok=evaluaConjunto(lista,Tu,alfa).every(r=>r.ok);
    if(ok){ if(lo===null) lo=Tu; hi=Tu; } }
  return lo===null?null:{ lo, hi };

const DOSPI_=Math.PI*2;
function ruidoPeriodico(semilla,periodo){
  const g=(x,y)=>{ x=((x%periodo)+periodo)%periodo; y=((y%periodo)+periodo)%periodo;
    const s=Math.sin(x*127.1+y*311.7+semilla*13.13)*43758.5453; return s-Math.floor(s); };
  return (x,y)=>{ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    return g(xi,yi)*(1-u)*(1-v)+g(xi+1,yi)*u*(1-v)+g(xi,yi+1)*(1-u)*v+g(xi+1,yi+1)*u*v; };
}

}
/** Acera de baldosas: juntas finas cada 1 m y tono lento. */
function texAcera(){
  const W=256,c=cv(W),x=c.getContext('2d'),im=x.createImageData(W,W),f=fbmP(9,4,2);
  for(let j=0;j<W;j++) for(let i=0;i<W;i++){ const n=f(i/W*4,j/W*4); let v=(0.78+(n-0.5)*0.14);

const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
/** Junta una pieza hecha de muchas mallas en una malla por material: así una rueda con 40 tacos cuesta 3 llamadas. */
function fusiona(grupo){
  grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map();
  grupo.traverse(o=>{ if(!o.isMesh) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(), m=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);
    g.applyMatrix4(m);
    if(!g.attributes.uv){ g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2)); }
    const k=o.material; if(!por.has(k)) por.set(k,[]); por.get(k).push(g); });
  const out=new THREE.Group();
  for(const [mat,gs] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count;
      pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry();
    G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const me=new THREE.Mesh(G,mat); me.castShadow=true; me.receiveShadow=true; out.add(me);
  }
  return out;
}
/** Una carrocería «lofteada»: anillos de superelipse que se estrechan hacia los extremos.
 *  secs: [{x, w (semianchura), y0, y1, n (exponente), tum (estrechamiento arriba, 0..1)}]. */
function lofteo(secs,seg=28){
  const pos=[],idx=[],nR=secs.length;
  for(const s of secs){
    const yc=(s.y0+s.y1)/2, hh=Math.max(1e-3,(s.y1-s.y0)/2), ex=2/(s.n||3);
    for(let k=0;k<seg;k++){
      const th=k/seg*DOSPI_, c=Math.cos(th), sn=Math.sin(th);
      const yy=yc+hh*Math.sign(sn)*Math.pow(Math.abs(sn),ex), f=(yy-s.y0)/(2*hh);
      const zz=Math.max(1e-3,s.w)*(1-(s.tum||0)*f*f)*Math.sign(c)*Math.pow(Math.abs(c),ex);
      pos.push(s.x,yy,zz);
    }
  }
  const cI=pos.length/3; pos.push(secs[0].x,(secs[0].y0+secs[0].y1)/2,0); pos.push(secs[nR-1].x,(secs[nR-1].y0+secs[nR-1].y1)/2,0);
  for(let i=0;i<nR-1;i++) for(let k=0;k<seg;k++){
    const a=i*seg+k, b=i*seg+(k+1)%seg, c2=(i+1)*seg+k, d=(i+1)*seg+(k+1)%seg;
    idx.push(a,c2,b, b,c2,d);
  }
  for(let k=0;k<seg;k++){ idx.push(cI,k,(k+1)%seg); idx.push(cI+1,(nR-1)*seg+(k+1)%seg,(nR-1)*seg+k); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx);
  // el sentido de las caras: si el volumen con signo sale negativo, se invierten
  let vol=0; for(let i=0;i<idx.length;i+=3){ const a=idx[i]*3,b=idx[i+1]*3,c3=idx[i+2]*3;
    vol+=pos[a]*(pos[b+1]*pos[c3+2]-pos[b+2]*pos[c3+1])-pos[a+1]*(pos[b]*pos[c3+2]-pos[b+2]*pos[c3])+pos[a+2]*(pos[b]*pos[c3+1]-pos[b+1]*pos[c3]); }
  if(vol<0) for(let i=0;i<idx.length;i+=3){ const t=idx[i+1]; idx[i+1]=idx[i+2]; idx[i+2]=t; }
  g.setIndex(idx); g.computeVertexNormals(); g.computeBoundingSphere();
  return g;
}

function perfil1D(pts){ return x=>{ if(x<=pts[0][0]) return pts[0][1]; for(let i=1;i<pts.length;i++) if(x<=pts[i][0]){ const t=(x-pts[i-1][0])/(pts[i][0]-pts[i-1][0]); return mezcla(pts[i-1][1],pts[i][1],suave(t)); } return pts[pts.length-1][1]; }; }

const VEHV={a:1.10,b:1.50,t:1.55};                                // cotas del dibujo: ejes y vía (m)

  const secs=[], N=44;

    const x=xc-hl*Math.cos(Math.PI*i/N), u=(x-xc)/hl, ab=Math.pow(Math.abs(u),4.2);
    let w=0.90*Math.pow(Math.max(0.0004,1-ab),1/4.2);
    w-=0.12*(Math.exp(-Math.pow((x-VEHV.a)/0.40,2))+Math.exp(-Math.pow((x+VEHV.b)/0.40,2)));       // la carrocería se retranquea en cada rueda
    const yb=0.27+0.22*Math.pow(Math.min(1,Math.abs(u)),4), y1=Math.max(yb+0.06,yt(x));
    secs.push({x,w:Math.max(0.02,w),y0:yb,y1,n:3.4,tum:0.10});
  }
  const cuerpo=new THREE.Mesh(lofteo(secs,30),M.pintura); fija.add(cuerpo);
  // la cabina: cristal con tumblehome y un techo pintado encima
  const cab=[], cabM=26, x0=-1.28, x1=0.62;
  for(let i=0;i<=cabM;i++){
    const t=i/cabM, x=mezcla(x0,x1,t), env=Math.pow(Math.sin(Math.PI*Math.pow(t,0.85)),0.55), base=yt(x)-0.03, techo=Math.max(base+0.03,mezcla(yt(x),1.43,env));
    cab.push({x,w:Math.max(0.03,0.80*Math.pow(env,0.35)),y0:base,y1:techo,n:3.0,tum:0.30});
  }
  fija.add(new THREE.Mesh(lofteo(cab,26),M.cristal));
  const tec=[], tM=18, tx0=-0.92, tx1=0.30;
  for(let i=0;i<=tM;i++){
    const t=i/tM, x=mezcla(tx0,tx1,t), tx=(x-x0)/(x1-x0), env=Math.pow(Math.sin(Math.PI*Math.pow(tx,0.85)),0.55), techo=Math.max(yt(x)+0.05,mezcla(yt(x),1.43,env));
    const wtop=0.80*Math.pow(env,0.35)*(1-0.30);
    tec.push({x,w:Math.max(0.03,wtop+0.012),y0:techo-0.045,y1:techo+0.005,n:4.5,tum:0.0});
  }
  fija.add(new THREE.Mesh(lofteo(tec,20),M.pintura));
  // los bajos y los pasos de rueda (un disco oscuro tras cada rueda y un labio del color de la carrocería)
  const bajos=new THREE.Mesh(new THREE.BoxGeometry(4.0,0.07,1.30),M.bajos); bajos.position.set(-0.25,0.27,0); fija.add(bajos);
  for(const [px,pz] of POS_RUEDA){
    const lado=Math.sign(pz), liner=new THREE.Mesh(new THREE.CylinderGeometry(0.385,0.385,0.02,28),M.bajos); liner.rotation.x=Math.PI/2; liner.position.set(px,LRUEDA-0.12,lado*0.775); fija.add(liner);
    const labio=new THREE.Mesh(new THREE.TorusGeometry(0.405,0.034,8,28,Math.PI),M.pintura); labio.position.set(px,LRUEDA-0.12,lado*0.775); labio.rotation.z=0; fija.add(labio);
  }
  // sensores del ADAS: radar tras el paragolpes y cámara bajo el retrovisor
  const radarM=new THREE.Mesh(new THREE.BoxGeometry(0.10,0.15,0.50),M.sensor); radarM.position.set(1.93,0.50,0); fija.add(radarM);
  const camM=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.055,0.09,14),M.sensor); camM.rotation.z=Math.PI/2; camM.position.set(0.52,1.12,0); fija.add(camM);
  // luces
  for(const lado of [-1,1]){
    const faro=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.075,0.32),M.faro); faro.position.set(1.80,0.60,lado*0.58); faro.rotation.y=lado*0.18; fija.add(faro);
    const pil=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.09,0.34),M.piloto); pil.position.set(-2.26,0.70,lado*0.60); pil.rotation.y=lado*0.14; pil.userData.piloto=1; fija.add(pil);

  const fus=fusiona(fija); fus.traverse(o=>{ if(o.isMesh&&o.material===M.piloto) o.userData.piloto=1; });
  fus.position.y=-0.12; caja.add(fus);

  const pivs=[], spins=[], discos=[], mordazas=[];

    const lado=Math.sign(pz), piv=new THREE.Group(); piv.position.set(px,LRUEDA,pz); piv.userData.rueda=i; raiz.add(piv);
    const spin=new THREE.Group(); piv.add(spin);
    const t=P3.neumatico(M,{dExt:LRUEDA*2,dLlanta:0.43,ancho:0.215,tacos:0,radios:5}), tf=fusiona(t); tf.rotation.y=lado*Math.PI/2; spin.add(tf);
    const dm=M.acero.clone(); dm.emissive=new THREE.Color('#ff3a1e'); dm.emissiveIntensity=0;
    const disco=new THREE.Mesh(P3.revolucion([[0.085,-0.013],[0.196,-0.013],[0.196,0.013],[0.085,0.013]],{seg:40}),dm);
    disco.rotation.x=Math.PI/2; disco.position.z=-lado*0.03; disco.userData.disco=i; spin.add(disco);       // eje del disco = eje de la rueda (Z), un poco hacia dentro del plato

    pivs.push(piv); spins.push(spin); discos.push(dm); mordazas.push(mm);

  raiz.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });

  return raiz;
}
/** Una copia translúcida del coche (para el que va SIN ESC), con sus propias luces y discos. */
function fantasma(orig){
  const mapa=new Map(), g=orig.clone(true);
  const conv=m=>{ if(mapa.has(m)) return mapa.get(m); const c=m.clone(); c.transparent=true; c.depthWrite=false;
    const base=m.opacity!==undefined?m.opacity:1;
    c.opacity=(m===M.cristal?0.20:(m===M.goma?0.40:0.28))*Math.min(1,base+0.1);
    if(c.color) c.color.lerp(new THREE.Color('#ff9a86'),m===M.goma||m===M.bajos?0.15:0.55);
    if(c.emissive&&m!==M.piloto&&m!==M.faro&&!(m.userData&&(m.userData.disco!==undefined))) c.emissive.set(0x000000);
    c.envMapIntensity=0.7; mapa.set(m,c); return c; };
  g.traverse(o=>{ if(o.isMesh){ o.material=conv(o.material); o.castShadow=false; } });
  g.userData.asas=asasDe(g); return g;
}
/** Recoge las asas (ruedas, discos, mordazas, luz de freno) de un coche por sus etiquetas. */
function asasDe(raiz){
  const A={pivs:[],spins:[],discos:[],mordazas:[],pilotos:[]};
  raiz.traverse(o=>{
    if(o.userData&&o.userData.rueda!==undefined){ A.pivs[o.userData.rueda]=o; A.spins[o.userData.rueda]=o.children[0]; }
    if(o.isMesh&&o.userData&&o.userData.disco!==undefined) A.discos[o.userData.disco]=o.material;
    if(o.isMesh&&o.userData&&o.userData.morda!==undefined) A.mordazas[o.userData.morda]=o.material;
    if(o.isMesh&&o.userData&&o.userData.piloto) A.pilotos.push(o.material);
  });
  A.caja=raiz.children[0]; return A;
}

  const cap=(r,l,mat)=>{ const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,l,4,10),mat); m.castShadow=true; m.receiveShadow=true; return m; };

  const chaleco=cap(0.178,0.22,M.chaleco); chaleco.scale.set(0.80,1,1.17); chaleco.position.y=1.24; cuerpo.add(chaleco);

  const cuello=cap(0.045,0.05,M.piel); cuello.position.y=1.53; cuerpo.add(cuello);

    const mus=cap(0.075,0.30,M.pantalon); mus.position.y=-0.23; cad.add(mus);

    const br=cap(0.05,0.22,M.chaqueta); br.position.y=-0.16; hom.add(br);

    cuerpo.add(hom); return {hom,cod}; };

/** Un abanico (sector) sobre el suelo con transparencia que se desvanece con la distancia, aristas y arcos de alcance. */
function creaAbanico(semi,R,col,aOpac,arcos,alturaApice){
  const N=36, pos=[],colr=[],idx=[]; const c=new THREE.Color(col);
  pos.push(0,0.035,0); colr.push(1,1,1,aOpac);
  for(let i=0;i<=N;i++){ const a=-semi+2*semi*i/N; pos.push(Math.cos(a)*R,0.035,Math.sin(a)*R); colr.push(1,1,1,0); }
  for(let i=0;i<N;i++) idx.push(0,i+2,i+1);
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('color',new THREE.Float32BufferAttribute(colr,4)); g.setIndex(idx);
  const m=new THREE.MeshBasicMaterial({color:col,vertexColors:true,transparent:true,depthWrite:false,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-5,polygonOffsetUnits:-5,toneMapped:false});
  const sector=new THREE.Mesh(g,m); sector.renderOrder=7; sector.raycast=()=>{}; sector.userData.pieza='abanico';
  // aristas: del sensor (a su altura) a los extremos del arco en el suelo; y arcos de alcance
  const lp=[], h=alturaApice;
  for(const s of [-1,1]){ lp.push(0,h,0, Math.cos(semi)*R,0.035,s*Math.sin(semi)*R); }
  for(const r of arcos){ for(let i=0;i<N;i++){ const a0=-semi+2*semi*i/N, a1=-semi+2*semi*(i+1)/N; lp.push(Math.cos(a0)*r,0.04,Math.sin(a0)*r, Math.cos(a1)*r,0.04,Math.sin(a1)*r); } }
  const lg=new THREE.BufferGeometry(); lg.setAttribute('position',new THREE.Float32BufferAttribute(lp,3));
  const lm=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0.7,toneMapped:false,depthWrite:false});
  const lineas=new THREE.LineSegments(lg,lm); lineas.renderOrder=8; lineas.raycast=()=>{}; lineas.userData.pieza='abanico';
  // el pulso: un arco fino que se expande
  const pg=new THREE.RingGeometry(0.97,1.0,40,1,-semi,2*semi); pg.rotateX(-Math.PI/2);
  const pm=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide,toneMapped:false,blending:THREE.AdditiveBlending});
  const pulso=new THREE.Mesh(pg,pm); pulso.position.y=0.045; pulso.renderOrder=9; pulso.raycast=()=>{}; pulso.userData.pieza='abanico';
  const grupo=new THREE.Group(); grupo.add(sector,lineas,pulso);
  return {grupo,sector,lineas,pulso,mat:m,lmat:lm,pm,R,aOpac,colBase:c.clone(),cA:g.attributes.color};
}

/* ===================== 10. EL ESTADO Y EL RELOJ =====================
   Dos corridas de la MISMA maniobra con el mismo reloj: la A (la que se mide, con o sin AEB según el mando) y,
   si se pide comparar, la B, siempre sin AEB (el coche fantasma). Todo lo que se ve —coches, peatón, abanicos,
   banda de parada— y todo lo del dock sale de ellas en cada cuadro. */
const EST={modo:'marcha',obst:'cruza',sup:'seco',vKmh:50,Tu:1.7,alfa:0.5,aeb:'comparar',vel:1,pausa:REDUCIDO,autoRunning:false,vista:'sigue',lazo:true,rot:false,semilla:1};
const SIM={A:null,B:null,t:0,acc:0,espera:0,supAct:'',spinA:0,spinB:0,reinicios:0,fasePeaton:0,avisoT:0};
const NOMBRE_SUP={seco:'Seco',mojado:'Mojado',nieve:'Nieve',hielo:'Hielo'};
const NOMBRE_OBST={cruza:'Peatón cruza',para:'Peatón se detiene'};
const kmh=v=>v*3.6;
/** Lo que corre ahora: en «En marcha», lo que digan los mandos; en el laboratorio guiado, lo que pida el paso. */
function paramsActuales(){
  if(EST.modo==='guia'){ const p=guiaParams(); if(p) return p; }
  const E={vKmh:EST.vKmh,sup:EST.sup,tLlega:3.0,y0:3.2,vp:1.0,tStop:EST.obst==='para'?0.8:undefined};
  const P=paramsDe(E,EST.Tu,EST.alfa,EST.semilla);
  return { A:Object.assign({},P,{aeb:EST.aeb!=='sin'}), B:EST.aeb==='comparar'?Object.assign({},P,{aeb:false}):null, sup:EST.sup, lazo:true };
}
function reiniciaCorridas(){
  const p=paramsActuales();
  const sup=Object.keys(SUPERFICIES).find(k=>SUPERFICIES[k]===p.A.mu)||'seco';
  if(sup!==SIM.supAct){ aplicaSuperficie(sup); SIM.supAct=sup; }
  SIM.A=nuevaCorrida(p.A); SIM.B=p.B?nuevaCorrida(p.B):null; SIM.lazo=p.lazo!==false;
  SIM.t=0; SIM.acc=0; SIM.espera=0; SIM.spinA=0; SIM.spinB=0; SIM.reinicios++; SIM.aviso=0;
  COCHE_B.visible=false;
  if(typeof pintaDockFijo==='function') pintaDockFijo();
}
/** Avanza el modelo dt segundos de reloj de simulación (pasos de 5 ms). */
function avanzaSim(dt){
  if(!SIM.A) return;
  SIM.acc+=dt; let n=0;
  while(SIM.acc>=AEB.dt-1e-12&&n<600){
    SIM.acc-=AEB.dt; n++;
    if(!SIM.A.fin){ const v=SIM.A.v; pasoCorrida(SIM.A); SIM.spinA+=0.5*(v+SIM.A.v)*AEB.dt/LRUEDA; }
    if(SIM.B&&!SIM.B.fin){ const v=SIM.B.v; pasoCorrida(SIM.B); SIM.spinB+=0.5*(v+SIM.B.v)*AEB.dt/LRUEDA; }
    SIM.t+=AEB.dt;
  }
  const acabo=SIM.A.fin&&(!SIM.B||SIM.B.fin);
  if(acabo){ SIM.espera+=dt; if(SIM.lazo&&EST.lazo&&SIM.espera>3.0) reiniciaCorridas(); }
  else SIM.espera=0;
}

/* ===================== 11. LO QUE SE VE ===================== */
const _c=new THREE.Color(), C_NORM=new THREE.Color('#4aa8ff'), C_DET=new THREE.Color('#7cf2ff'), C_AV=new THREE.Color('#ffc233'), C_FR=new THREE.Color('#ff4655');
const C_CAM=new THREE.Color('#b58cff'), C_CAMC=new THREE.Color('#dcc4ff'), C_OKB=new THREE.Color('#34d399');
const clamp01=x=>Math.max(0,Math.min(1,x));
/** Pone un coche en su sitio: posición, giro de ruedas, cabeceo al frenar, discos y luz de freno. */
function aplicaCoche(raiz,q,spin){
  const A=raiz.userData.asas, aMax=q.mu*G;
  raiz.position.set(q.s-q.X-X_FRENTE,0,0);
  A.caja.rotation.z=-Math.min(0.045,0.0042*q.a);                 // cabeceo ilustrativo: el morro baja al frenar
  for(let i=0;i<4;i++){
    A.spins[i].rotation.z=-spin;
    const g=clamp01(q.a/aMax)*(q.a>0.3?1:0)*0.9;
    A.discos[i].emissiveIntensity=g*2.6; A.mordazas[i].emissiveIntensity=g*2.2;
  }
  const fr=q.a>0.3?1:0; for(const m of A.pilotos) m.emissiveIntensity=0.55+2.4*fr;
}
const _tintes={};
function aplicaSensores(q){
  const xf=q.s-q.X, t=SIM.t;
  const st=q.etapa, tracked=q.filt.n>=2&&q.det&&!(q.fin&&q.res&&q.res.causa==='choque');
  // el radar: azul en reposo, cian al fijar un objetivo, ámbar con el aviso, rojo al frenar
  const col=st>=2?C_FR:(st===1?C_AV:(tracked?C_DET:C_NORM));
  ABANICO_R.grupo.position.set(xf,0,0); ABANICO_R.grupo.visible=!(q.fin&&q.v<0.05&&false);
  coloreaAbanico(ABANICO_R,col,st>=1?0.95:0.7);
  ABANICO_R.mat.opacity=st>=2?1.0:(tracked?0.95:0.85);
  const u=(t*0.9)%1; ABANICO_R.pulso.scale.setScalar(Math.max(0.5,u*ABANICO_R.R)); ABANICO_R.pm.color.copy(col); ABANICO_R.pm.opacity=0.55*(1-u);
  // la cámara: violeta; más clara cuando confirma al peatón
  ABANICO_C.grupo.position.set(xf-1.43,0,0);
  coloreaAbanico(ABANICO_C,q.confirmado?C_CAMC:C_CAM,q.confirmado?0.95:0.6);
  const u2=(t*0.9+0.5)%1; ABANICO_C.pulso.scale.setScalar(Math.max(0.5,u2*ABANICO_C.R)); ABANICO_C.pm.color.copy(q.confirmado?C_CAMC:C_CAM); ABANICO_C.pm.opacity=0.45*(1-u2);
  // el objetivo fijado
  OBJETIVO.visible=tracked;
  if(tracked){ OBJETIVO.position.set(PEATON.position.x,0.98,PEATON.position.z); OBJETIVO.material.color.copy(st>=2?C_FR:(st===1?C_AV:C_OKB)); const p=1+0.04*Math.sin(t*10); OBJETIVO.scale.set(p,1,p); }
  // la banda de parada: hasta dónde llegaría el coche si frenara a fondo ahora mismo
  const dp=dParada(q.v,q.mu), ver=q.v>0.5&&!q.fin;
  const ver2=ver&&!ocultaParada(); BANDA.visible=BANDA_FIN.visible=ver2;
  if(ver2){ const queda=q.X-q.s, mal=dp>queda; BANDA.scale.x=Math.max(0.01,dp); BANDA.position.set(xf+dp/2,0.028,0); BANDA_FIN.position.set(xf+dp,0.03,0);
    _c.copy(mal?C_FR:C_OKB); BANDA_M.color.copy(_c); BANDA_FIN_M.color.copy(_c); BANDA_M.opacity=mal?0.30:0.20; }
}
/** El peatón y el destello del choque. */
function aplicaPeatonYFlash(){
  const A=SIM.A; if(!A) return; const P=A.P, t=SIM.t;
  let tp=t, caida=0, empuje=0;
  const ch=A.res&&A.res.causa==='choque'?A.res:null;
  if(ch){ const age=Math.max(0,t-ch.tImp); tp=Math.min(t,ch.tImp); caida=ease(clamp01(age/0.55)); empuje=Math.min(3.2,0.28*ch.vImp*(1-Math.exp(-3*age))); }
  const z=pedY(P,tp), anda=(tp<(P.tStop===undefined?1e9:P.tStop))&&tp>=0&&!ch&&P.vp>0;
  SIM.fasePeaton=Math.abs(P.y0-z)/1.3*DOSPI;
  aplicaPeaton(z,anda||tp>0?SIM.fasePeaton:0,anda,caida,empuje);
  // destello
  let age=-1, zf=z, big=1;
  if(ch) age=t-ch.tImp; else if(SIM.B&&SIM.B.res&&SIM.B.res.causa==='choque'){ age=t-SIM.B.res.tImp; zf=pedY(SIM.B.P,SIM.B.res.tImp); big=0.8; }
  if(age>=0&&age<0.75){ FLASH.visible=true; FLASH.position.set(0.3,0.9,zf); FLASH.scale.setScalar((0.25+age*3.2)*big); FLASH_M.opacity=0.85*(1-age/0.75); } else FLASH.visible=false;
}
function aplicaEscena(dtS){
  avanzaSim(dtS);
  const A=SIM.A; if(!A) return;
  aplicaCoche(COCHE_A,A,SIM.spinA);
  if(SIM.B){ aplicaCoche(COCHE_B,SIM.B,SIM.spinB); COCHE_B.visible=Math.abs(SIM.B.s-A.s)>1.4; }
  aplicaPeatonYFlash(); aplicaSensores(A);
  // el sol sigue al coche A para que la sombra suave sea siempre de la zona que se ve
  const p=COCHE_A.position; LUZ.sol.target.position.set(p.x+8,0,0); LUZ.sol.position.set(p.x-6,22,-12);
}

/* ===================== 12. CÁMARAS =====================
   La escena se encuadra con el hueco que dejan la guía y el dock: la cámara se aleja lo justo para que la caja del
   «objeto» (ancho × alto en metros) quepa entera en ese hueco, y la proyección se desplaza para centrarla en él. */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
/** Desplaza el centro de la proyección al centro del hueco libre. */
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}
const xCoche=()=>SIM.A?SIM.A.s-SIM.A.X-1.4:-30;
const brecha=()=>SIM.A?Math.max(0,SIM.A.X-SIM.A.s):30;
/** Cada vista: de dónde mira (dir, hacia la cámara desde el ancla), el ancla y la caja del objeto que debe caber. */
const VISTAS={
  sigue:{dir:V3(-0.86,0.33,-0.42),anc:()=>V3(xCoche()+0.6,0.6,0),toff:V3(0.3,0.45,0),obj:()=>({w:9.0,h:2.7}),fov:36},
  cenit:{dir:V3(-0.22,1,0),anc:()=>V3(xCoche()/2,0,-1.5),toff:V3(0,0,0),obj:()=>({w:13,h:Math.max(14,brecha()+9)}),fov:36},
  encuentro:{dir:V3(-0.16,0.20,-1),anc:()=>V3(xCoche()/2,0.9,0),toff:V3(0,0,0),obj:()=>({w:Math.max(11,brecha()+8),h:4.2}),fov:36},
};
const CAM={off:V3(-6,2.4,-4),toff:V3(2,0.4,0),auto:true,ancla:V3(),previo:null,k:1};
function fovVista(v){ return innerWidth<innerHeight*0.9?50:VISTAS[v].fov; }
/** Distancia a la que la caja w×h cabe en el hueco libre. */
function distanciaFit(w,h,fov){
  const Hu=huecoLibre(), W=innerWidth, Hh=innerHeight, tv=Math.tan(fov*Math.PI/360), th=tv*(W/Hh);
  const wF=Math.max(80,Hu.x1-Hu.x0)/W, hF=Math.max(80,Hu.y1-Hu.y0)/Hh;
  return 1.10*Math.max(w/(2*th*wF),h/(2*tv*hF));
}
function ofsDeseado(v){
  const V=VISTAS[v], o=V.obj(), fov=fovVista(v), D=distanciaFit(o.w,o.h,fov);
  let dir=V.dir.clone().normalize();
  return {off:dir.multiplyScalar(D),toff:V.toff.clone(),fov};
}
function ponVista(v,dur){
  EST.vista=v; CAM.auto=true; CAM.k=dur===0.001||dur===0?1:(dur===undefined?0.9:Math.max(0.2,dur))*1;
  CAM.dur=dur===undefined?1.0:dur;
  if(typeof pintaBarras==='function') pintaBarras();
  if(CAM.dur<=0.01){ const A=VISTAS[v].anc(), d=ofsDeseado(v); CAM.off.copy(d.off); CAM.toff.copy(d.toff); camera.fov=d.fov; camera.updateProjectionMatrix();
    camera.position.copy(A).add(CAM.off); controls.target.copy(A).add(CAM.toff); CAM.previo=A.clone(); }
}
function pasaCam(dt){
  if(!SIM.A) return;
  const V=VISTAS[EST.vista], P=V.anc();
  if(CAM.auto){
    const d=ofsDeseado(EST.vista), k=1-Math.exp(-dt/Math.max(0.05,(CAM.dur||1)*0.30));
    CAM.off.lerp(d.off,k); CAM.toff.lerp(d.toff,k);
    if(Math.abs(camera.fov-d.fov)>0.05){ camera.fov+=(d.fov-camera.fov)*k; camera.updateProjectionMatrix(); }
    camera.position.copy(P).add(CAM.off); controls.target.copy(P).add(CAM.toff);
  } else if(CAM.previo){
    const dP=P.clone().sub(CAM.previo); camera.position.add(dP); controls.target.add(dP);
  }
  CAM.previo=P.clone();
}
controls.addEventListener('start',()=>{ CAM.auto=false; });

function lienzo(id){ const box=el(id), c=box.querySelector('canvas'); return {box,c,ctx:c.getContext('2d'),w:0,h:0,dpr:1}; }
function abre(L){ const r=L.box.getBoundingClientRect(), dpr=Math.min(3,window.devicePixelRatio||1);
  const w=Math.max(20,Math.round(r.width)), h=Math.max(20,Math.round(r.height));
  if(L.w!==w||L.h!==h||L.dpr!==dpr){ L.c.width=Math.round(w*dpr); L.c.height=Math.round(h*dpr); L.w=w; L.h=h; L.dpr=dpr; }
  const x=L.ctx; x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h); return x; }
function txt(x,t,px,py,col,size,align,peso){ x.fillStyle=col; x.font=(peso||'600')+' '+(size||11)+'px '+FUENTE; x.textAlign=align||'left'; x.textBaseline='alphabetic'; x.fillText(t,px,py); }
function raya(x,x1,y1,x2,y2,col,w,dash){ x.strokeStyle=col; x.lineWidth=w||1; x.setLineDash(dash||[]); x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke(); x.setLineDash([]); }

  for(const d of [0.25,0.5,0.75,1]){ const dd=Math.round(A.X*d/5)*5; raya(x,X0,Y(dd),X1,Y(dd),'rgba(143,179,200,0.10)'); txt(x,String(dd),X0-3,Y(dd)+3,'#6f87a0',8.5,'right','500'); }
  for(let t=0;t<=T;t+=1){ raya(x,X(t),Y1,X(t),Y1+3,'#3d5470'); txt(x,t+' s',X(t),Hd-2,'#6f87a0',8.5,'center','500'); }
  const h=A.hist||[]; if(h.length<2){ sinDatos(x,Wd,Hd); return; }
  x.strokeStyle='rgba(200,214,230,0.35)'; x.lineWidth=1; x.setLineDash([3,3]); x.beginPath(); h.forEach((m,i)=>{ i?x.lineTo(X(m.t),Y(m.d)):x.moveTo(X(m.t),Y(m.d)); }); x.stroke(); x.setLineDash([]);
  x.fillStyle=COL_R; x.globalAlpha=0.75; for(const m of h){ if(isFinite(m.z)){ x.beginPath(); x.arc(X(m.t),Y(m.z),1.5,0,DOSPI); x.fill(); } } x.globalAlpha=1;
  x.strokeStyle=COL_F; x.lineWidth=1.9; x.beginPath(); let ini=true; for(const m of h){ if(!isFinite(m.dEst)) continue; if(ini){ x.moveTo(X(m.t),Y(m.dEst)); ini=false; } else x.lineTo(X(m.t),Y(m.dEst)); } x.stroke();

    txt(x,'σ '+fN(AEB.sigD,2)+' m · α '+fN(A.P.alfa===undefined?0.5:A.P.alfa,2),X1-2,Y0+9,'#8a9fb9',8.5,'right','600');

/* ---- Plano «distancia disponible – distancia necesaria» ---- */
function pintaFr(){
  const x=abre(LFR), Wd=LFR.w, Hd=LFR.h, A=SIM.A; if(!A) return;
  if(ocultaParada()){ sinDatos(x,Wd,Hd); return; }
  const X0=26, X1=Wd-6, Y0=6, Y1=Hd-14, M=Math.max(dParada(A.P.v0,A.mu)*1.15,A.X*0.55), Xm=A.X*1.05;
  const X=d=>X0+d/Xm*(X1-X0), Y=r=>Y1-r/M*(Y1-Y0);
  // zona imposible: por encima de la diagonal d_req = d
  x.fillStyle='rgba(255,70,85,0.13)'; x.beginPath(); x.moveTo(X(0),Y(0)); x.lineTo(X(Math.min(Xm,M)),Y(Math.min(Xm,M))); x.lineTo(X(Math.min(Xm,M)),Y(M)); x.lineTo(X(0),Y(M)); x.closePath(); x.fill();
  raya(x,X0,Y1+0.5,X1,Y1+0.5,'#3d5470'); raya(x,X0,Y0,X0,Y1,'#3d5470');
  raya(x,X(0),Y(0),X(Math.min(Xm,M)),Y(Math.min(Xm,M)),'rgba(255,120,130,0.8)',1.3,[4,3]);
  for(const d of [10,20,30,40,50,60]){ if(d<Xm){ raya(x,X(d),Y1,X(d),Y1+3,'#3d5470'); txt(x,String(d),X(d),Hd-2,'#6f87a0',8.5,'center','500'); } }
  for(const r of [10,20,30]){ if(r<M){ raya(x,X0,Y(r),X0+3,Y(r),'#3d5470'); txt(x,String(r),X0-3,Y(r)+3,'#6f87a0',8.5,'right','500'); } }
  const h=A.hist||[]; if(h.length<2){ sinDatos(x,Wd,Hd); return; }
  x.lineWidth=2; for(let i=1;i<h.length;i++){ x.strokeStyle=COL_ET[h[i].etapa]; x.beginPath(); x.moveTo(X(h[i-1].d),Y(h[i-1].dReq)); x.lineTo(X(h[i].d),Y(h[i].dReq)); x.stroke(); }
  const m=h[h.length-1]; x.fillStyle='#fff'; x.beginPath(); x.arc(X(m.d),Y(m.dReq),3.6,0,DOSPI); x.fill(); x.strokeStyle=COL_ET[m.etapa]; x.lineWidth=1.5; x.stroke();
  txt(x,'d necesaria ↑',X0+4,Y0+9,COL_V,8.5,'left','700'); txt(x,'d disponible →',X1-2,Y1-4,'#8a9fb9',8.5,'right','600');
}

function pintaFu(){

  const X0=28, X1=Wd-6, Y0=6, Y1=Hd-24, T=Math.max(3.4,A.X/Math.max(A.P.v0,3)+0.7), tmax=4.5;
  const X=t=>X0+t/T*(X1-X0), Y=v=>Y1-Math.min(v,tmax)/tmax*(Y1-Y0);
  raya(x,X0,Y1+0.5,X1,Y1+0.5,'#3d5470'); raya(x,X0,Y0,X0,Y1,'#3d5470');
  for(const v of [1,2,3,4]){ raya(x,X0,Y(v),X1,Y(v),'rgba(143,179,200,0.08)'); txt(x,v+' s',X0-3,Y(v)+3,'#6f87a0',8.5,'right','500'); }
  for(let t=0;t<=T;t+=1){ raya(x,X(t),Y1,X(t),Y1+3,'#3d5470'); txt(x,t+' s',X(t),Hd-3,'#6f87a0',8.5,'center','500'); }

  const h=A.hist||[]; if(h.length<2){ sinDatos(x,Wd,Hd); return; }

  // TTC verdadero (tenue) y estimado
  x.strokeStyle='rgba(200,214,230,0.35)'; x.lineWidth=1; x.setLineDash([3,3]); x.beginPath(); let a=true; for(const m of h){ if(!isFinite(m.ttcV)||m.ttcV>tmax*1.5) continue; a?x.moveTo(X(m.t),Y(m.ttcV)):x.lineTo(X(m.t),Y(m.ttcV)); a=false; } x.stroke(); x.setLineDash([]);
  x.strokeStyle=COL_F; x.lineWidth=1.9; x.beginPath(); a=true; for(const m of h){ if(!isFinite(m.ttc)||m.ttc>tmax*1.5) continue; a?x.moveTo(X(m.t),Y(m.ttc)):x.lineTo(X(m.t),Y(m.ttc)); a=false; } x.stroke();

  raya(x,X(m.t),Y0,X(m.t),Y1,'rgba(255,255,255,0.35)',1);
  el('t_fu').textContent=fN(SIM.t,1)+' s';
}

  x.fillStyle='rgba(255,179,71,0.20)'; x.beginPath(); x.moveTo(X(h[0].t),Ya(0)); for(const m of h) x.lineTo(X(m.t),Ya(m.a)); x.lineTo(X(h[h.length-1].t),Ya(0)); x.closePath(); x.fill();
  x.strokeStyle='#FFB347'; x.lineWidth=1.4; x.beginPath(); h.forEach((m,i)=>{ i?x.lineTo(X(m.t),Ya(m.a)):x.moveTo(X(m.t),Ya(m.a)); }); x.stroke();
  if(SIM.B&&SIM.B.hist&&SIM.B.hist.length>1){ x.strokeStyle=COL_FANT; x.lineWidth=1.2; x.setLineDash([3,3]); x.beginPath(); SIM.B.hist.forEach((m,i)=>{ i?x.lineTo(X(m.t),Yv(m.v*3.6)):x.moveTo(X(m.t),Yv(m.v*3.6)); }); x.stroke(); x.setLineDash([]); }
  x.strokeStyle=COL_F; x.lineWidth=2; x.beginPath(); h.forEach((m,i)=>{ i?x.lineTo(X(m.t),Yv(m.v*3.6)):x.moveTo(X(m.t),Yv(m.v*3.6)); }); x.stroke();

function pintaDock(){

  Av.className='dk-aviso'+(t?' on '+cl:''); if(Av.textContent!==t) Av.textContent=t;
}

  for(const [col,lado] of [[izq,-1],[der,1]]){ col.sort((a,b)=>a.y-b.y); let yMin=H.y0+4;

      e.d.style.left=x+'px'; e.d.style.top=y+'px'; const xa=lado<0?x+w:x; e.ln.setAttribute('d','M'+xa+' '+(y+h/2)+' L'+c.x+' '+c.y); }); }
}
const TIP=document.createElement('div'); TIP.className='tip3'; document.body.appendChild(TIP);

const RAY=new THREE.Raycaster(), PUN=new THREE.Vector2();
function hitBajo(cx,cy){
  const r=renderer.domElement.getBoundingClientRect(); PUN.set((cx-r.left)/r.width*2-1,-(cy-r.top)/r.height*2+1); RAY.setFromCamera(PUN,camera);
  const lista=[COCHE_A,SIM.B?COCHE_B:null,PEATON,CALLE,BANDA,OBJETIVO].filter(Boolean);
  const hits=RAY.intersectObjects(lista,true);
  for(const h of hits){ let vis=true; for(let p=h.object;p;p=p.parent) if(!p.visible) vis=false; if(!vis) continue; return h; }
  return null;
}
function claveDe(h){ if(!h) return null; let o=h.object;
  while(o){ if(o===COCHE_A) return 'coche'; if(o===COCHE_B) return 'cocheFantasma'; if(o===PEATON) return 'peaton'; if(o.userData&&o.userData.pieza&&INFO[o.userData.pieza]) return o.userData.pieza; o=o.parent; }
  return null; }
let hovT=0;

  if(t){ TIP.textContent=t; TIP.style.display='block'; TIP.style.left=Math.min(innerWidth-TIP.offsetWidth-8,e.clientX+14)+'px'; TIP.style.top=(e.clientY+14)+'px'; }

});

let toqueP=null, tipT=0;
renderer.domElement.addEventListener('pointerdown',e=>{ toqueP=e.pointerType==='mouse'?null:[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup',e=>{
  if(!toqueP||Math.hypot(e.clientX-toqueP[0],e.clientY-toqueP[1])>8) return;
  const k=claveDe(hitBajo(e.clientX,e.clientY)), t=k&&INFO[k]; if(!t) return;

  TIP.style.left=Math.max(8,Math.min(innerWidth-TIP.offsetWidth-8,e.clientX-TIP.offsetWidth/2))+'px'; TIP.style.top=Math.max(8,e.clientY-TIP.offsetHeight-18)+'px';

/* ===================== 17. DISPOSICIÓN: ANCHO, ESTRECHO, MÓVIL =====================
   Si no caben guía, escena y dock lado a lado (el marco de la plataforma, una tableta), la escena va arriba
   y guía e instrumentos comparten una hoja con pestañas abajo. */
function disposicion(){
  const W=innerWidth, b=document.body;
  const estrecho=W<1080, movil=W<640;
  b.classList.toggle('estrecho',estrecho); b.classList.toggle('movil',movil); b.classList.toggle('ancho',estrecho&&!movil);
  if(estrecho){ if(!b.classList.contains('t-hud')&&!b.classList.contains('t-panel')) b.classList.add('t-hud'); ajustaHoja(); }
  el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('on',b.classList.contains('t-'+t.dataset.tab)));
}
function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.47:0.43),240,450));
  let hh=base; const hud=el('hud');
  if(movil&&b.classList.contains('t-panel')) hh=Math.round(clamp(H*0.6,240,560));
  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;
    hh=Math.round(clamp(pide,240,Math.max(base,H*(movil?0.62:0.56)))); }
  const ant=parseFloat(b.style.getPropertyValue('--hojaH'))||0;
  if(Math.abs(ant-hh)>1){ b.style.setProperty('--hojaH',hh+'px'); colocaBarras(); centraEnHueco(); }
}
el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.onclick=()=>{ const b=document.body; b.classList.remove('t-hud','t-panel'); b.classList.add('t-'+t.dataset.tab); disposicion(); centraEnHueco(); });


/* ===================== 18. EL LABORATORIO GUIADO =====================
   Tres fases: 1 · Predice (la distancia de parada, con la fórmula), 2 · Ajusta (el umbral de disparo del AEB para
   un conjunto de cuatro escenarios: que no haya choque en los tres peligrosos y que NO frene en el inofensivo; el
   resultado de cada uno sólo aparece al validar) y 3 · Diagnostica (¿por qué falló este AEB?, sólo con lo que se
   ve en el dock) y cierra con un quiz de tres preguntas. Cuatro validaciones fallidas cambian el conjunto de
   escenarios (no se aprueba por eliminación). */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETO={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'predice',iniciado:false,dxOk:false,r1:null,r2:null,replay:null,dx:null,orden:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0,conj:-1};

/* ---------- Fase 1 · Predice ---------- */
const CASOS1=[{v:50,sup:'seco',tr:1.0},{v:60,sup:'mojado',tr:0.8},{v:40,sup:'nieve',tr:1.2},{v:70,sup:'seco',tr:0.5},{v:30,sup:'hielo',tr:1.0},{v:50,sup:'mojado',tr:1.0},{v:45,sup:'nieve',tr:0.7},{v:60,sup:'seco',tr:1.5}];
function sorteaCaso1(){ const p=GUIA.r1&&GUIA.r1.i; let i; do{ i=Math.floor(Math.random()*CASOS1.length); }while(i===p); const c=CASOS1[i];
  GUIA.r1={i,v:c.v,sup:c.sup,tr:c.tr,ans:dParadaLibro(c.v/3.6,SUPERFICIES[c.sup],c.tr)}; }
function checkPredice(){
  const raw=String((el('ansV')||{}).value||'').trim().replace(/\s| /g,'').replace(',','.'), v=parseFloat(raw), r=GUIA.r1, ok=r.ans;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe la distancia de parada en metros (con coma o punto decimal).'); return; }
  RETO.intentos++;
  if(Math.abs(v-ok)<=Math.max(1.5,0.04*ok)){
    RETO.fallos1=0; sonido.bien();
    feedback('good','¡Correcto! ✓',`La distancia de parada es lo que recorres mientras reaccionas más lo que tardas en frenar: d = v·t<sub>r</sub> + v²/(2μg) = ${fN(r.v/3.6,1)} × ${fN(r.tr,1)} + ${fN(r.v/3.6,1)}² / (2 × ${fN(SUPERFICIES[r.sup],2)} × 9,81) = <b>${fN(ok,1)} m</b>. El AEB tiene una latencia de sólo 0,12 s, pero el término v² manda.`,true);
    paso('decide'); prepararDecide();
  } else {
    RETO.fallos1++; sonido.mal();
    const d=v>ok?'alto':'bajo';
    if(RETO.fallos1>=3){ RETO.fallos1=0; RETO.resiembras++; sorteaCaso1();
      feedback('bad','Tres intentos fallidos','Cambia el caso: vuelve a separar lo que recorres reaccionando de lo que recorres frenando.'); reiniciaCorridas(); pintaHUD(); pintaDockFijo();
    } else {
      feedback('bad','Revisa el cálculo',`Tu resultado (${fN(v,v%1?1:0)}) está ${d}. Pasa la velocidad a m/s antes de operar y suma los dos tramos: el de reacción (a velocidad constante) y el de frenado (deceleración μg). (intentos fallidos: ${RETO.fallos1}/3)`);
      const t=el('d_try'); if(t) t.textContent=RETO.fallos1;
    }
  }
}

/* ---------- Fase 2 · Ajusta el umbral ---------- */
const nombreEsc=E=>`${E.id} · ${E.tipo==='cruza'?'Peatón cruza':'Peatón se detiene en la acera'} · ${E.vKmh} km/h · ${NOMBRE_SUP[E.sup].toLowerCase()}`;
function prepararDecide(){
  let i; do{ i=Math.floor(Math.random()*CONJUNTOS_RETO.length); }while(CONJUNTOS_RETO.length>1&&i===GUIA.conj&&RETO.resiembras===0&&false);
  if(CONJUNTOS_RETO.length>1&&i===GUIA.conj) i=(i+1)%CONJUNTOS_RETO.length;
  GUIA.conj=i; GUIA.r2={lista:CONJUNTOS_RETO[i],Tu:1.0,validado:false,res:null,intentos:0,ventana:null}; GUIA.replay=null;
  reiniciaCorridas(); pintaHUD(); pintaDockFijo();
}
function validarDecide(){
  const r=GUIA.r2; if(!r) return;
  const res=evaluaConjunto(r.lista,r.Tu,0.5); r.res=res; r.validado=true; r.intentos++; RETO.intentos++; GUIA.replay=null;
  const malos=res.filter(x=>!x.ok), choques=malos.filter(x=>x.colisionable), falsos=malos.filter(x=>!x.colisionable);
  if(!malos.length){
    RETO.fallos2=0; sonido.bien(); r.ventana=ventanaSegura(r.lista);
    feedback('good','¡Lo conseguiste! ✓',`Con un umbral de <b>${fN(r.Tu,2)} s</b> el AEB evita los tres choques y no frena en el escenario inofensivo. La ventana segura de este conjunto va de ≈ <b>${fN(r.ventana.lo,2)} s</b> a ≈ <b>${fN(r.ventana.hi,2)} s</b>: por debajo, el freno llega tarde; por encima, el AEB frena por peatones que no van a cruzar. Un umbral fijo es siempre un compromiso entre las dos.`,true);
    pintaHUD(); paso('diag'); iniciaDiag();
  } else {
    RETO.fallos2++; sonido.mal();
    let msg=''; if(choques.length) msg+=`Choca en ${choques.map(x=>x.id).join(', ')}: el AEB llega tarde. `; if(falsos.length) msg+=`Frena sin necesidad en ${falsos.map(x=>x.id).join(', ')}: el peatón no iba a cruzar. `;
    if(RETO.fallos2>=4){ RETO.fallos2=0; RETO.resiembras++; feedback('bad','Cuatro validaciones sin lograrlo',msg+'Cambia el conjunto de escenarios: las velocidades y la calzada son otras.',true); prepararDecide(); }
    else { feedback('bad','Todavía no',msg+`(validaciones fallidas: ${RETO.fallos2}/4)`,true); pintaHUD(); }
  }
}
/** Ventana de umbrales en que pasan los cuatro con SEIS semillas de ruido distintas (para decir algo que no dependa de una racha). */
function ventanaSegura(lista){
  let lo=null, hi=null;
  for(let i=0;i<=50;i++){ const Tu=+(0.5+i*0.05).toFixed(2);
    const ok=[1,2,3,4,5,6].every(sem=>lista.every(E=>{ const q=simula(paramsDe(E,Tu,0.5,sem)), re=q.res; return E.tipo==='cruza'?re.causa!=='choque':!re.falsoPos; }));
    if(ok){ if(lo===null) lo=Tu; hi=Tu; } }
  return lo===null?ventanaTu(lista,0.5):{lo,hi};
}
function verEscenario(id){
  const r=GUIA.r2; if(!r||!r.validado) return; const E=r.lista.find(e=>e.id===id); if(!E) return;
  GUIA.replay={E,Tu:r.Tu}; reiniciaCorridas(); pintaHUD(); pintaDockFijo();
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const CASOS_DX=[
  {k:'bajo',  t:'Umbral demasiado bajo', E:{vKmh:50,sup:'seco',   tLlega:3,y0:3.2,vp:1}, Tu:0.9},
  {k:'suelo', t:'Calzada demasiado resbaladiza', E:{vKmh:45,sup:'nieve',tLlega:3,y0:3.2,vp:1}, Tu:2.3},
  {k:'alto',  t:'Umbral demasiado alto', E:{vKmh:50,sup:'seco',   tLlega:3,y0:3.2,vp:1,tStop:0.8}, Tu:2.6}
];
function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.k; let c; do{ c=pickOne(CASOS_DX); }while(c.k===p);
  GUIA.dx=c; GUIA.dxOk=false; GUIA.orden=barajar(CASOS_DX.map(x=>x.k)); GUIA.replay=null; reiniciaCorridas(); pintaHUD(); pintaDockFijo();
}
function diagnostica(k){
  if(!GUIA.dx||GUIA.dxOk) return; RETO.intentos++;
  if(k===GUIA.dx.k){
    GUIA.dxOk=true; RETO.fallos3=0; sonido.bien();
    feedback('good','Diagnóstico correcto ✓',explicaDx(GUIA.dx.k),true);
    paso('quiz'); iniciaQuiz();
  } else {
    RETO.fallos3++; sonido.mal();
    if(RETO.fallos3>=3){ RETO.fallos3=0; RETO.resiembras++; feedback('bad','Tres intentos fallidos','Es otro caso: compara dónde están las líneas de umbral del dock con el TTC al que había que frenar, y fíjate en la calzada.',true); iniciaDiag(); }
    else { feedback('bad','No es ese',noEs(k)+` (intentos fallidos: ${RETO.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(k){
  if(k==='bajo') return 'Umbral demasiado bajo: el AEB sólo frena cuando el TTC ya es menor que el tiempo que necesita el coche para parar (v/(μg) más la latencia). En el plano del dock, la trayectoria cruza la zona roja <b>antes</b> de que aparezca el primer color de freno.';
  if(k==='suelo') return 'Calzada resbaladiza: el AEB actuó pronto, pero con μ = 0,25 la distancia de parada se multiplica por más de tres frente al seco. El umbral que sirve en asfalto seco no sirve en nieve: un AEB real adapta su umbral a la adherencia estimada.';
  return 'Umbral demasiado alto: el AEB decidió frenar cuando el peatón aún andaba hacia la calzada y su trayectoria prevista invadía el carril. El peatón se detuvo en la acera y el freno resultó innecesario: un falso positivo.';
}
function noEs(k){
  if(k==='bajo') return 'Si el umbral fuera demasiado bajo, las líneas de aviso, parcial y total del dock estarían muy cerca del choque, y el freno llegaría cuando ya no hay distancia.';
  if(k==='suelo') return 'Si fuera la calzada, el AEB habría actuado con holgura (umbral alto), pero la parada necesaria sería mayor que la distancia, con μ bajo a la vista.';
  return 'Un falso positivo aparece cuando no había peligro real: mira si el peatón llega a invadir el carril.';
}
const QUIZ=[
  {q:'Un obstáculo está a 20 m y el coche se acerca a 15 m/s. ¿Cuánto vale el TTC?',ok:'1,33 s',mal:['0,75 s','3,00 s','300 s']},
  {q:'¿Qué hace el filtro alfa-beta con las medidas de distancia del radar?',ok:'Reduce el ruido y estima también la velocidad de cierre, a costa de un pequeño retardo cuando el coche frena',mal:['Elimina el ruido por completo y sin ningún retardo','Mide la distancia con más precisión que el propio radar','Sólo sirve para decidir si el objeto es un peatón']},
  {q:'Si el coche va al doble de velocidad, ¿cuánto crece su distancia de frenado a fondo (sin contar la reacción)?',ok:'Se multiplica por 4',mal:['Se duplica','Se multiplica por 8','No cambia']},
];
function iniciaQuiz(){ GUIA.quizN=0; cargaPregunta(); }
function cargaPregunta(){ const Q=QUIZ[GUIA.quizN], opts=barajar([Q.ok,...Q.mal]); GUIA.quiz={q:Q.q,opts,ok:opts.indexOf(Q.ok)}; GUIA.quizResp=-1; GUIA.quizCorrecta=GUIA.quiz.ok; pintaHUD(); }
function respondeQuiz(i){
  if(GUIA.quizResp>=0) return; GUIA.quizResp=i; const ac=i===GUIA.quiz.ok; if(ac) RETO.quizAcierto++;
  if(ac) sonido.bien(); else sonido.mal();
  const ult=GUIA.quizN>=QUIZ.length-1;
  feedback(ac?'good':'bad',ac?'Correcto ✓':'No es esa',(ac?'':'La respuesta era: <b>'+GUIA.quiz.opts[GUIA.quiz.ok]+'</b>. ')+(ult?'Terminaste el laboratorio.':'Sigue con la siguiente.'),true);
  pintaHUD();
  if(ult){ RETO.hecho=true; paso('completo'); }
}
function siguientePregunta(){ if(GUIA.quizN<QUIZ.length-1){ GUIA.quizN++; cargaPregunta(); } }

/* ---------- el enrutador de acciones ---------- */
function paso(p){ GUIA.paso=p; GUIA.phase=({predice:0,decide:1,diag:2,quiz:2,completo:2})[p]; if(EST.modo==='guia') pintaHUD(); }
const enDiagnostico=()=>EST.modo==='guia'&&GUIA.paso==='diag'&&!GUIA.dxOk;
function handleAction(act,btn){
  switch(act){
    case 'check-v': checkPredice(); break;
    case 'hint-v':
      if(RETO.pistas===0){ RETO.pistas=1; feedback('good','Pista 1 de 2','Son dos tramos: mientras reaccionas el coche sigue a su velocidad (distancia = v × t_r) y después frena con deceleración constante.'); }
      else if(RETO.pistas===1){ RETO.pistas=2; feedback('good','Pista 2 de 2','En el frenado la energía cinética se disipa con la fuerza de rozamiento: ½·m·v² = μ·m·g·d, de donde d = v²/(2μg). La masa se simplifica.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break;
    case 'validar': validarDecide(); break;
    case 'ver-A': verEscenario('A'); break; case 'ver-B': verEscenario('B'); break; case 'ver-C': verEscenario('C'); break; case 'ver-D': verEscenario('D'); break;
    case 'dx-bajo': diagnostica('bajo'); break; case 'dx-suelo': diagnostica('suelo'); break; case 'dx-alto': diagnostica('alto'); break;
    case 'quiz-0': respondeQuiz(0); break; case 'quiz-1': respondeQuiz(1); break; case 'quiz-2': respondeQuiz(2); break; case 'quiz-3': respondeQuiz(3); break;
    case 'quiz-sig': siguientePregunta(); break;
    case 'restart': location.reload(); break;
  }
}

/* ---------- lo que la guía enseña en cada paso ---------- */
function contenidoGuia(){
  const tri=(n,v,m)=>`<span class="tries">intentos fallidos: <b id="${n}">${v}</b>/${m}</span>`;
  switch(GUIA.paso){
    case 'predice': { const r=GUIA.r1; return {no:'Fase 1 · Reto 1',head:'Tu cálculo',title:'¿Cuántos metros necesita para parar?',
      teach:`Un conductor va a <b>${fN(r.v)} km/h</b> sobre <b>${NOMBRE_SUP[r.sup].toLowerCase()}</b> (μ = ${fN(SUPERFICIES[r.sup],2)}) y tarda <b>${fN(r.tr,1)} s</b> en reaccionar.<div class="task">¿Qué distancia recorre hasta detenerse, en metros? ${tri('d_try',RETO.fallos1,3)}</div>`,
      acts:`<div class="calcrow"><input id="ansV" type="text" inputmode="decimal" autocomplete="off" placeholder="¿? m" aria-label="Distancia de parada en metros"><button class="b primary" data-act="check-v">✓ Comprobar</button></div><button class="pista" id="btnHint">¿Necesitas una pista? (máx. 2)</button>`}; }
    case 'decide': { const r=GUIA.r2; if(!r) return {no:'Fase 2 · Reto 2',head:'Tu ajuste',title:'Preparando los escenarios…',teach:'',acts:''};
      const lista=r.lista.map(E=>{ const x=r.validado&&r.res?r.res.find(y=>y.id===E.id):null;
        let est=''; if(x){ est=x.ok?'<span class="rs ok">✓ '+(x.colisionable?(x.causa==='detenido'?'sin choque':'sin choque'):'no frenó')+'</span>':'<span class="rs mal">✗ '+(x.colisionable?('choque a '+fN(x.vImpKmh,0)+' km/h'):'frenó sin motivo')+'</span>'; }
        return `<div class="esc"><span>${nombreEsc(E)}</span>${est}${x?`<button class="pista" data-act="ver-${E.id}">▶ ver</button>`:''}</div>`; }).join('');
      return {no:'Fase 2 · Reto 2',head:'Tu ajuste',title:'Un umbral para cuatro escenarios',
      teach:`Elige el TTC al que el AEB empieza a frenar. Tres escenarios tienen choque seguro si no frena; el cuarto es <b>inofensivo</b>: el AEB no debe actuar.<div class="escs">${lista}</div><div class="why"><b>El objetivo:</b> ningún choque y ningún freno en falso, a la vez. ${tri('d_try2',RETO.fallos2,4)}</div>`,
      acts:`<div class="cg"><div class="cl"><div>Umbral de frenado</div><b id="v2T">${fN(r.Tu,2)} s</b></div><input type="range" id="r2T" min="0.5" max="3" step="0.05" value="${r.Tu}" aria-label="Umbral de tiempo hasta la colisión"></div>
        <button class="b primary" data-act="validar">▶ Validar los 4 escenarios</button>`}; }
    case 'diag': { const ord=GUIA.orden||CASOS_DX.map(x=>x.k), N={bajo:'Umbral demasiado bajo',suelo:'Calzada demasiado resbaladiza',alto:'Umbral demasiado alto'};
      return {no:'Fase 3 · Diagnóstico',head:'¿Qué falló?',title:'Averigua la causa sin ver el umbral',
      teach:`Este AEB no ha ido bien. Fíjate en el <b>suelo</b>, en cuánto antes del impacto aparecen las líneas de umbral del dock y en si el peatón llegaba a cruzar.<div class="task">¿Cuál es la causa? ${tri('d_try3',RETO.fallos3,3)}</div>`,
      acts:ord.map(k=>`<button class="b" data-act="dx-${k}">${N[k]}</button>`).join('')}; }
    case 'quiz': { const Q=GUIA.quiz; if(!Q) return {no:'',head:'',title:'',teach:'',acts:''}; const ya=GUIA.quizResp>=0;
      return {no:'Cierre · Pregunta '+(GUIA.quizN+1)+' de '+QUIZ.length,head:'Quiz',title:Q.q,teach:'',
      acts:Q.opts.map((o,i)=>`<button class="b ${ya?(i===Q.ok?'good':(i===GUIA.quizResp?'bad':'')):''}" data-act="quiz-${i}" ${ya?'disabled':''}>${o}</button>`).join('')+(ya&&GUIA.quizN<QUIZ.length-1?'<button class="b primary" data-act="quiz-sig">Siguiente →</button>':'')}; }
    case 'completo': return {no:'Laboratorio completado',head:'✓',title:'Predijiste, ajustaste y diagnosticaste',
      teach:`Acertaste ${RETO.quizAcierto} de ${QUIZ.length} en el quiz. Vuelve a <b>En marcha</b> y mueve el umbral, el filtro y la calzada: el AEB siempre es un compromiso entre llegar a tiempo y no asustarse de más.`,
      acts:`<button class="b primary" data-act="restart">↺ Reiniciar laboratorio</button>`};
  }
  return {no:'',head:'',title:'',teach:'',acts:''};
}
function htmlGuia(){

}

function guiaParams(){
  if(GUIA.paso==='predice'&&GUIA.r1){ const r=GUIA.r1, E={vKmh:r.v,sup:r.sup,tLlega:4.5,y0:3.2,vp:0,tStop:0};
