    if(GUIA.replay){ const P=paramsDe(GUIA.replay.E,GUIA.replay.Tu,0.5); return {A:P,B:Object.assign({},P,{aeb:false}),sup:GUIA.replay.E.sup,lazo:true}; }
    const E=r.lista[0], P=paramsDe(E,r.Tu,0.5); return {A:Object.assign({},P,{aeb:false}),B:null,sup:E.sup,lazo:true}; }
  if((GUIA.paso==='diag'||GUIA.paso==='quiz'||GUIA.paso==='completo')&&GUIA.dx){ const c=GUIA.dx, P=paramsDe(c.E,c.Tu,0.5);
    return {A:P,B:null,sup:c.E.sup,lazo:true}; }

/* ---------- el recorrido guiado de «En marcha» ---------- */
const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function runAuto(){
  if(EST.autoRunning||EST.modo!=='marcha') return; EST.autoRunning=true; sonido.init();
  const hud=el('hud'), prev={obst:EST.obst,sup:EST.sup,vKmh:EST.vKmh,Tu:EST.Tu,alfa:EST.alfa,aeb:EST.aeb,vista:EST.vista,vel:EST.vel};
  const fija=o=>{ Object.assign(EST,o); pintaHUD(); hud.style.pointerEvents='none'; const b=el('btnAuto'); if(b){ b.disabled=true; b.textContent='Recorrido en curso…'; } reiniciaCorridas(); pintaDockFijo(); pintaBarras(); };
  try{
    fija({obst:'cruza',sup:'seco',vKmh:50,Tu:1.75,alfa:0.5,aeb:'comparar',vel:1}); ponVista('sigue');
    showToast('Paso 1 · El <b>radar</b> (azul) fija al peatón y la <b>cámara</b> (violeta) lo confirma. El coche sólido frena solo; el fantasma, sin AEB, lo atropella.',8200);
    await espera(8800);
    fija({alfa:0.9,aeb:'con'}); ponVista('cenit');
    showToast('Paso 2 · Con α alto el filtro apenas suaviza: en el dock, los puntos crudos del radar bailan y el TTC se vuelve ruidoso.',8200);
    await espera(8800);
    fija({alfa:0.15});
    showToast('Paso 3 · Con α bajo la línea es suave, pero al frenar el filtro va <b>un paso atrás</b>: sobrestima la velocidad de cierre.',8200);
    await espera(8800);
    fija({alfa:0.5,Tu:0.9}); ponVista('sigue');
    showToast('Paso 4 · Un umbral <b>bajo</b>: el AEB espera demasiado y el choque ya no se evita. Mira el plano d necesaria / d disponible.',8200);
    await espera(8800);
    fija({obst:'para',Tu:2.6,aeb:'con'});
    showToast('Paso 5 · Un umbral <b>alto</b> con un peatón que se detiene en la acera: el AEB frena en falso. Entre los dos extremos está el compromiso.',8600);
    await espera(9000);
  } finally {
    Object.assign(EST,prev); EST.autoRunning=false; hud.style.pointerEvents='';
    pintaHUD(); reiniciaCorridas(); pintaDockFijo(); ponVista(prev.vista); pintaBarras();
  }
}


/* ===================== 19. SONIDO (sintetizado) =====================
   El aviso del AEB: pitidos cortos con la etapa de aviso, tono continuo al frenar. Y un golpe sordo al chocar. */
const sonido=(function(){
  let ctx=null,on=true,master=null,ult=0;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination); }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); ult=f; }
  return {init,
    aviso:(et)=>{ if(et===1) tono(1760,0.09,0.035,'square'); else if(et>=2) tono(2100,0.16,0.04,'square'); },
    golpe:()=>tono(90,0.35,0.12,'sawtooth'),
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }, get freq(){ return ult; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});

/* ===================== 20. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.max(Math.min(devicePixelRatio,alta?2:1.5),Math.min(devicePixelRatio,1.5)>1?1.25:1));
  const ms=alta?2048:1024; if(LUZ.sol.shadow.mapSize.x!==ms){ LUZ.sol.shadow.mapSize.set(ms,ms); if(LUZ.sol.shadow.map){ LUZ.sol.shadow.map.dispose(); LUZ.sol.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); if(typeof ponVista==='function'&&SIM.A) ponVista(EST.vista,0.001); centraEnHueco();
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 21. EL LAZO: UN SOLO RELOJ =====================
   El tiempo simulado avanza dt·velocidad en cada cuadro, y con ESE tiempo se pintan la escena (coches, peatón,
   abanicos, banda) y el dock (cursores de las gráficas, plano d/d_req). */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0, etapaPrev=0, golpePrev=false, tBip=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  aplicaEscena(EST.pausa?0:dt*EST.vel);
  pasaCam(dt);
  const A=SIM.A;
  if(A&&!EST.pausa){
    if(A.etapa>=1&&t-tBip>(A.etapa===1?0.38:0.18)){ tBip=t; sonido.aviso(A.etapa); }
    const ch=!!(A.res&&A.res.causa==='choque'); if(ch&&!golpePrev) sonido.golpe(); golpePrev=ch;
  }
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaTr(); pintaFr(); pintaFu(); pintaSp(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos();
}
