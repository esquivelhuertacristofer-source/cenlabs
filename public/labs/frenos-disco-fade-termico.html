<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Frenos de Disco: Reparto y Fade Térmico — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D11;--panel:rgba(11,14,18,.88);--line:#2b333c;--ink:#EEF2F5;
    --dim:#A3B0BA;--accent:#FF8A4C;--accent2:#FFB48A;--hv:#FFD166;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cF:#4CC9F0;--cR:#FFB347;--cE:#FF6B3D;--cG:#C8D6E2;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05070a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#1a2027;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#2b2218}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#1a0d04;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#1a0d04;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#ffa56f}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#1a0d04}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#ff9a63;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f8a85;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f948f;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#1a0d04}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#0d1217;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(43,51,60,.8);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(43,51,60,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg .fl i{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}.cl-L{background:var(--cF)}.cl-R{background:var(--cR)}
  .hgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px 11px}
  .hgrid .cl{font-size:9.5px}.hgrid .cl b{font-size:12px}
  .cg.off{opacity:.4;pointer-events:none}
  .cg .cl em{color:#7d9792}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f8a85}
  .dk-tit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{flex-shrink:0;letter-spacing:0;text-transform:none;font-size:11px;color:#9fbab4;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(43,51,60,.8);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c9c4;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#1a2027;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfe0dc;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,20,30,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(11,14,18,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d6d2}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(14,17,21,.92);border:1px solid rgba(255,160,100,.45);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(14,17,21,.84);border:1px solid rgba(255,160,100,.35);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:11px 14px 9px}.hud h2{font-size:16.5px}.hud .intro{font-size:12px;line-height:1.4} .fg b{font-size:14px} .fg{padding:2px 7px} .cg input[type=range]{height:14px} .dk-row{min-height:96px} .dk-g.sp{min-height:84px} .modebar .b{padding:5px 4px} .seg .b{padding:5px 2px} .b.auto{padding:7px 8px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}
  body.estrecho.ancho.t-panel .panel>.dk-fig{grid-column:1;grid-row:2}
  body.estrecho.ancho.t-panel .panel>.dk-row{grid-column:1;grid-row:3/6;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-fu{grid-column:2;grid-row:2;align-self:start}
  body.estrecho.ancho.t-panel .panel>.dk-g.fu{grid-column:2;grid-row:2/4;min-height:0;margin-top:18px}
  body.estrecho.ancho.t-panel .panel>.dk-ley{display:none}
  body.estrecho.ancho.t-panel .panel>.t-sp{grid-column:2;grid-row:4}
  body.estrecho.ancho.t-panel .panel>.dk-g.sp{grid-column:2;grid-row:5;min-height:0}
  body.estrecho.ancho.t-panel .panel>.dk-aviso{display:none}
  body.estrecho .hud details>.cuerpo{max-height:24vh}
  body.estrecho.ancho.t-hud .hud{display:grid;grid-template-columns:1fr 1.05fr;column-gap:14px;row-gap:7px;align-content:start;grid-auto-flow:row dense}
  body.estrecho.ancho .hud>.hcab,body.estrecho.ancho .hud>.modebar,body.estrecho.ancho .hud>.hdet,body.estrecho.ancho .hud>.pasos{grid-column:1}
  body.estrecho.ancho .hud>.hmandos,body.estrecho.ancho .hud>.retoBox{grid-column:2;grid-row:1/span 4}
  body.estrecho .hdet{flex-direction:row}body.estrecho .hdet>details{flex:1;min-width:0}
  body.estrecho .hdet details[open]{position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 54px);z-index:25;background:rgba(11,14,18,.97)}
  body.movil .lt{display:none} body.movil .tbar .modo,body.movil .tbar .reloj{display:none}
  body.movil .tbar{gap:6px;padding:5px 8px} body.movil .tbar .est{min-width:0}
  body.movil .dk-ley{display:none} body.movil .fg b{font-size:13.5px} body.movil .fg .fl{font-size:9.5px}
  body.movil .dk-g.fu{min-height:80px} body.movil .dk-g.sp{min-height:84px} body.movil .dk-row{min-height:112px} body.movil .dk-aviso{display:none}
  body.movil .hud h2{font-size:15.5px} body.movil .hud .intro{font-size:11.8px;line-height:1.42}
  body.estrecho .hud{overflow-y:auto}
  body.estrecho .vbar [data-t="rot"],body.estrecho .vbar .sep.s1{display:none}
  body.estrecho.ancho .vbar{top:60px}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   LAB — FRENOS DE DISCO: REPARTO DE FRENADO Y FADE TÉRMICO
   (Dinámica del vehículo · mecanica-141)

   Una rueda delantera en media sección (neumático y llanta cortados, disco ventilado con
   una cuña recortada, pinza flotante cortada por la mitad con sus pastillas y su pistón) que
   frena cinco veces seguidas desde 150 km/h, y el coche entero en transparencia con las cargas
   y las fuerzas de cada eje. El bloque de física —que un script de Node extrae TAL CUAL y
   verifica— da la transferencia de carga N_f = m·g·(b + z·h)/L, el reparto ideal y el bloqueo
   de cada eje con un reparto fijo, el calor del disco por masa concentrada con convección y
   radiación (solución exacta con h constante), la caída de la fricción de la pastilla con la
   temperatura (fade) y la distancia de cada frenada.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO=' ';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }



/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos
   marcas— y lo prueba: lo que se prueba es lo que corre.

   Un turismo frena varias veces seguidas desde una velocidad alta. Tres cosas se
   acoplan:
   1) El REPARTO. Al frenar, la carga se va al eje delantero: N_f = m·g·(b + z·h)/L,
      N_r = m·g·(a − z·h)/L (z en g). El reparto IDEAL de fuerzas de freno es
      F_f/F = (b + z·h)/L. Un coche real tiene una línea FIJA F_r = F_f·(1 − β)/β
      que sólo cruza la curva ideal en un punto: antes de él se bloquea primero el
      eje delantero; después, el trasero (la combinación inestable).
   2) El CALOR. La energía cinética que se quita es calor; el disco la recibe con una
      fracción γ del reparto de efusividades térmicas disco–pastilla y la reparte,
      en masa concentrada, con convección h(v) y radiación:
         m·c·dT/dt = γ·F_eje·v/2 − h(v)·A·(T − T_a) − ε·σ·A·(T⁴ − T_a⁴)
      Con h constante y sin radiación hay solución exacta (convolución con e^(−t/τ)).
   3) El FADE. El coeficiente de fricción de la pastilla cae con la temperatura:
      μ(T). Con la pastilla caliente la fuerza de freno baja (a igual pedal) y el
      reparto efectivo se desplaza hacia el eje que se enfría mejor: el trasero. */

/* FISICA:INICIO */
const DOSPI=2*Math.PI, G=9.80665, RAD=Math.PI/180, SIGMA=5.670374419e-8;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const suave=t=>{ t=clamp(t,0,1); return t*t*(3-2*t); };

/* ---------- 1.1 El coche ----------
   a: distancia del centro de masa al eje delantero; b = L − a al trasero. h: altura del centro de masa.
   rw: radio dinámico de la rueda. aAcel: aceleración con la que recupera velocidad entre frenadas. */
const VEH={ m:1500, L:2.70, a:1.20, h:0.55, rw:0.325, Cd:0.30, A:2.2, rho:1.2, Crr:0.012, aAcel:4.5 };
VEH.b=VEH.L-VEH.a;

/* ---------- 1.2 Disco y pastilla ----------
   El disco es de fundición gris ventilado. Su masa sale de la geometría: corona de radio exterior d/2
   e interior kRi·d/2 con un espesor equivalente que ya descuenta el hueco de las aletas. La superficie que
   enfría cuenta las dos caras más las paredes de las aletas (factor 1,8). La fracción de calor que entra al
   disco sale del cociente de efusividades √(k·ρ·c): γ = 1/(1 + e_pastilla/e_disco). */
const DISCO={ rho:7200, c:460, eEq:0.0215, kRi:0.60, fAletas:1.8, eps:0.60, h0:12, kh:7.5, nh:0.8, reff:0.40, Ta:25 };
const EFUS={ disco:Math.sqrt(50*7200*460), pastilla:Math.sqrt(1.5*2500*1000) };      // k [W/m·K], ρ [kg/m³], c [J/kg·K]
const GAMMA=1/(1+EFUS.pastilla/EFUS.disco);
function disco(d){
  const ro=d/2, ri=ro*DISCO.kRi, anillo=Math.PI*(ro*ro-ri*ri), masa=DISCO.rho*anillo*DISCO.eEq;
  return { d, ro, ri, masa, A:2*anillo*DISCO.fAletas, C:masa*DISCO.c, reff:DISCO.reff*d };
}
const hConv=v=>DISCO.h0+DISCO.kh*Math.pow(Math.max(0,v),DISCO.nh);                 // W/m²K: la ventilación crece con la velocidad
/* Pastilla semimetálica: μ0 = 0,42 y una caída suave con la temperatura (didáctica, ver la ficha).
   fMu(T) es la fracción de μ0 que queda. A 25 °C la pastilla está un poco fría (−7 %). */
const PAD={ mu0:0.42, Tf:480, w:70, D:0.40, frio:0.10, tauFrio:60, Tref:100 };
const fMu=T=>(1-PAD.frio*Math.exp(-Math.max(T,0)/PAD.tauFrio))*(1-PAD.D/(1+Math.exp(-(T-PAD.Tf)/PAD.w)));
const F_REF=fMu(PAD.Tref);
const muRel=T=>fMu(T)/F_REF;                                                         // 1 con la pastilla a su temperatura de referencia
const muPad=T=>PAD.mu0*fMu(T);
const fade=T=>T<=PAD.Tref?0:Math.max(0,1-muRel(T));                                  // pérdida de fricción respecto a la nominal

/* ---------- 1.3 Cargas y reparto ---------- */
const cargasEje=z=>{ const W=VEH.m*G; return { Nf:W*(VEH.b+z*VEH.h)/VEH.L, Nr:W*(VEH.a-z*VEH.h)/VEH.L }; };
/** Reparto ideal: fracción de la fuerza de frenado que debe ir delante. */
const fracIdeal=z=>(VEH.b+z*VEH.h)/VEH.L;
/** Curva ideal en el plano (F_f, F_r)/(m·g): cada punto es una deceleración z. */
const puntoIdeal=z=>({ ff:z*fracIdeal(z), fr:z*(1-fracIdeal(z)) });
/** Reparto óptimo para una adherencia μ: el que bloquea los dos ejes a la vez. */
const betaIdeal=mu=>(VEH.b+mu*VEH.h)/VEH.L;
/** Deceleración (g) a la que se bloquea cada eje con reparto fijo β y adherencia μ, sin resistencias. */
function zBloqueo(beta,mu){
  const zf=mu*VEH.b/(VEH.L*beta-mu*VEH.h), zr=mu*VEH.a/(VEH.L*(1-beta)+mu*VEH.h);
  const fAxe=zf<=zr?'delantero':'trasero';
  return { zf:zf>0?zf:Infinity, zr, primero:fAxe, z:Math.min(zf>0?zf:Infinity,zr), eficacia:Math.min(zf>0?zf:Infinity,zr)/mu };
}
/** Deceleración de cruce de la línea real con la curva ideal: z* = (β·L − b)/h. */
const zCruce=beta=>(beta*VEH.L-VEH.b)/VEH.h;

/** Equilibrio de la frenada a una velocidad: pedido z_ped (g, con la pastilla en su μ nominal), reparto β,
    factores de fricción de cada eje (fF, fR), adherencia μ. Un eje no puede dar más que μ·N: ahí «bloquea».
    La deceleración z incluye la resistencia a la marcha y es la que mueve la carga. Cuatro casos cerrados. */
function equilibrio(zped,beta,fF,fR,mu,v,sinRes){
  const W=VEH.m*G, Fres=sinRes?0:VEH.Crr*W+0.5*VEH.rho*VEH.Cd*VEH.A*v*v;
  const DF=beta*W*zped*fF, DR=(1-beta)*W*zped*fR;
  const k=mu*VEH.h/VEH.L;
  let z=(DF+DR+Fres)/W, Ff=DF, Fr=DR, limF=false, limR=false;
  const ok1=()=>{ const c=cargasEje(z); return DF<=mu*c.Nf*(1+1e-12)&&DR<=mu*c.Nr*(1+1e-12); };
  if(!ok1()){
    // sólo el delantero limitado
    let z2=(mu*W*VEH.b/VEH.L+DR+Fres)/(W*(1-k)), c2=cargasEje(z2);
    if(DF>=mu*c2.Nf&&DR<=mu*c2.Nr){ z=z2; Ff=mu*c2.Nf; Fr=DR; limF=true; }
    else {
      // sólo el trasero limitado
      let z3=(DF+mu*W*VEH.a/VEH.L+Fres)/(W*(1+k)), c3=cargasEje(z3);
      if(DR>=mu*c3.Nr&&DF<=mu*c3.Nf){ z=z3; Fr=mu*c3.Nr; Ff=DF; limR=true; }
      else { z=mu+Fres/W; const c4=cargasEje(z); Ff=mu*c4.Nf; Fr=mu*c4.Nr; limF=limR=true; }
    }
  }
  const c=cargasEje(z);
  return { z, Ff, Fr, Fres, limF, limR, Nf:c.Nf, Nr:c.Nr, uF:c.Nf>0?Ff/(mu*c.Nf):0, uR:c.Nr>0?Fr/(mu*c.Nr):0 };
}

/* ---------- 1.4 El calentamiento exacto con h constante ----------
   C·dT/dt = q0 + q1·t − h·A·(T − T_a)  →  T(t) con τ = C/(h·A):
   T − T_a = (T0 − T_a)·e^(−t/τ) + [q0·τ·(1 − e^(−t/τ)) + q1·τ·(t − τ·(1 − e^(−t/τ)))]/C */
function calentamientoExacto(T0,Ta,hA,C,q0,q1,t){
  const tau=C/hA, e=Math.exp(-t/tau);
  return Ta+(T0-Ta)*e+(q0*tau*(1-e)+q1*tau*(t-tau*(1-e)))/C;
}

/* ---------- 1.5 Una serie de frenadas ----------
   Cada frenada parte del coche en crucero a v0 (o de la velocidad que haya recuperado), con el pedal fijo.
   Entre frenadas queda parado 1 s y recupera velocidad con aAcel. Pasos de dt: la velocidad se integra
   con z constante dentro del paso (exacto si z no cambia); la temperatura, con Heun, de modo que el
   calor que entra, lo que se pierde y lo que se almacena cierran EXACTO la energía.
   Opciones de verificación: h (convección constante), rad:false, fade:false, res:false. */
function serie(p){
  const o=Object.assign({ v0:150/3.6, zped:0.85, beta:0.72, dF:0.30, dR:0.27, mu:0.90, Tint:18, n:5, tPre:1.5, T0:DISCO.Ta, Ta:DISCO.Ta, dt:0.04, tCola:10, h:null, rad:true, fade:true, res:true },p);
  const dF=disco(o.dF), dR=disco(o.dR), dt=o.dt, W=VEH.m*G;
  const NM=Math.ceil((o.tPre+o.n*(o.Tint+30)+o.tCola+60)/dt)+4;
  const A=(n)=>new Float32Array(n);
  const S={ o, dF, dR, n:0, t:A(NM), v:A(NM), x:A(NM), z:A(NM), TF:A(NM), TR:A(NM), fF:A(NM), fR:A(NM), FF:A(NM), FR:A(NM), uF:A(NM), uR:A(NM), lim:new Uint8Array(NM), fase:new Uint8Array(NM) };
  let t=0, x=0, v=o.v0, TF=o.T0, TR=o.T0, i=0, k=0, fase=0, tRep=0, tFinal=Infinity;   // fase: 0 crucero 1 frenando 2 parado 3 acelerando
  const par=[]; let st=null;
  const acum={ Ebr:0, Eres:0, qF:0, qR:0, convF:0, radF:0, convR:0, radR:0, EbrF:0, EbrR:0 };
  const perdidas=(T,disc,vm)=>{ const hh=o.h===null?hConv(vm):o.h; const c=hh*disc.A*(T-o.Ta), r=o.rad?DISCO.eps*SIGMA*disc.A*(Math.pow(T+273.15,4)-Math.pow(o.Ta+273.15,4)):0; return [c,r]; };
  const guarda=(z,eq,lim)=>{ if(i>=NM) return; S.t[i]=t; S.v[i]=v; S.x[i]=x; S.z[i]=z; S.TF[i]=TF; S.TR[i]=TR; S.fF[i]=eq?eq.fFr:1; S.fR[i]=eq?eq.fRr:1;
    S.FF[i]=eq?eq.Ff:0; S.FR[i]=eq?eq.Fr:0; S.uF[i]=eq?eq.uF:0; S.uR[i]=eq?eq.uR:0; S.lim[i]=lim; S.fase[i]=fase; i++; };
  while(i<NM-2&&t<tFinal){
    // transiciones
    if(fase!==1&&k<o.n&&t>=o.tPre+k*o.Tint-1e-9&&v>1&&(fase===0||fase===3)){
      fase=1; st={ k, t0:t, v0:v, x0:x, TF0:TF, TR0:TR, TFmax:TF, TRmax:TR, fadeMax:0, EbrF:0, EbrR:0, limRsolo:0, limFsolo:0, ambos:0, zMax:0, zMed:0, tTop:0 };
    }
    // fuerzas de freno
    let eq=null, lim=0;
    if(fase===1){
      const fFr=o.fade?muRel(TF):1, fRr=o.fade?muRel(TR):1;
      eq=equilibrio(o.zped,o.beta,fFr,fRr,o.mu,v,!o.res); eq.fFr=fFr; eq.fRr=fRr;
      lim=(eq.limF?1:0)|(eq.limR?2:0);
    } else {
      eq={ Ff:0, Fr:0, uF:0, uR:0, fFr:o.fade?muRel(TF):1, fRr:o.fade?muRel(TR):1 };
    }
    guarda(fase===1?eq.z:0,eq,lim);
    // paso de velocidad y posición
    let dtp=dt, vN=v;
    if(fase===1){
      const dv=eq.z*G*dt;
      if(v-dv<=0){ dtp=v/(eq.z*G); vN=0; } else vN=v-dv;
    } else if(fase===3){ vN=Math.min(o.v0,v+VEH.aAcel*dt); if(vN>=o.v0) fase=0; }
    const dx=(v+vN)/2*dtp, vm=(v+vN)/2;
    // calor que entra a cada disco (por disco): γ·F_eje·dx/2/dtp
    const qF=fase===1?GAMMA*eq.Ff*dx/2/dtp:0, qR=fase===1?GAMMA*eq.Fr*dx/2/dtp:0;
    // Heun
    const intg=(T,disc,q)=>{ const [c1,r1]=perdidas(T,disc,vm), k1=(q-c1-r1)/disc.C, T2=T+dtp*k1, [c2,r2]=perdidas(T2,disc,vm), k2=(q-c2-r2)/disc.C;
      return { T:T+dtp*(k1+k2)/2, conv:dtp*(c1+c2)/2, rad:dtp*(r1+r2)/2 }; };
    const rf=intg(TF,dF,qF), rr=intg(TR,dR,qR);
    TF=rf.T; TR=rr.T;
    acum.qF+=qF*dtp; acum.qR+=qR*dtp; acum.convF+=rf.conv; acum.radF+=rf.rad; acum.convR+=rr.conv; acum.radR+=rr.rad;
    if(fase===1){

/* ---------- 1.6 El reto: frenar varias veces sin fade y sin bloquear primero el trasero ----------
   Se elige el reparto β y el diámetro del disco delantero. Cuatro criterios A LA VEZ: el trasero no
   bloquea antes que el delantero en ninguna frenada de la serie, el fade máximo del delantero no pasa
   de un tope, la última frenada no necesita más distancia que un tope, y el disco no pasa de una masa
   (rueda y peso no suspendido). La solución es una ventana INTERIOR: con β bajo bloquea el trasero;
   con β alto el delantero se sobrecalienta; y no se arregla con el disco más grande. */
const B_MIN=0.55, B_MAX=0.90, D_MIN=0.26, D_MAX=0.36;
function evaluaReto(sc,beta,dF){
  const S=serie(Object.assign({},sc.base,{beta,dF}));
  const P=S.paradas, dis=disco(dF), ult=P[P.length-1];
  const m={ S, masa:dis.masa, fade:S.fadeMax, dUlt:ult?ult.dist:Infinity, dPrim:P[0]?P[0].dist:Infinity, TFmax:S.TFmax, limRsolo:S.limRsolo,
    okT:S.limRsolo<=0.02, okFade:S.fadeMax<=sc.fadeMax, okD:(ult?ult.dist:Infinity)<=sc.Dmax, okM:dis.masa<=sc.Mmax };
  m.ok=m.okT&&m.okFade&&m.okD&&m.okM; return m;
}
function ventanaReto(sc,pb,pd){
  const celdas=[]; pb=pb||0.01; pd=pd||0.01;
  for(let b=B_MIN;b<=B_MAX+1e-9;b+=pb){ const row=[]; for(let d=D_MIN;d<=D_MAX+1e-9;d+=pd) row.push(evaluaReto(sc,Math.round(b*1000)/1000,Math.round(d*1000)/1000).ok); celdas.push(row); }
  return celdas;
}
function generaReto(rnd){
  const pick=a=>a[Math.floor(rnd()*a.length)];
  for(let intento=0;intento<14;intento++){
    const v0=pick([130,135,140,145]), mu=pick([0.80,0.85,0.90]), zped=pick([0.85,0.90,0.95]), Tint=pick([16,18,20,22]), n=pick([4,5]);
    const base={ v0:v0/3.6, mu, zped, Tint, n };
    const bStar=betaIdeal(mu);
    const sc={ base, v0, mu, zped, Tint, n, bStar, fadeMax:0.15, Mmax:8.5, Dmax:0 };
    // referencia: la serie con un reparto ligeramente delantero del ideal y un disco mediano
    const ref=evaluaReto({ base, fadeMax:0, Mmax:99, Dmax:1e9 },Math.min(B_MAX,bStar+0.03),0.30);
    sc.Dmax=Math.round(ref.dPrim*1.14);
    const cel=ventanaReto(sc,0.02,0.02);
    let cuenta=0, bMin=9, bMax=-1, dMin=9, dMax=-1;
    cel.forEach((row,i)=>row.forEach((ok,j)=>{ if(ok){ cuenta++; const b=B_MIN+0.02*i, d=D_MIN+0.02*j; bMin=Math.min(bMin,b); bMax=Math.max(bMax,b); dMin=Math.min(dMin,d); dMax=Math.max(dMax,d); } }));
    if(cuenta<4||cuenta>15||bMax-bMin<0.05) continue;      // ni vacía ni tan ancha que se acierte al azar
    if(bMax>B_MAX-0.04||bMin<B_MIN+0.06) continue;          // interior: no pegada a un extremo del mando
    if(dMin<=D_MIN+0.005) continue;                          // el disco más pequeño no puede bastar
    sc.ventana={ bMin, bMax, dMin, dMax, cuenta };
    return sc;
  }
  return null;
}

/* ---------- 1.7 Diagnóstico: ¿qué falla en este coche? ----------
   Tres fallos con firma distinta: el reparto trasero (bloquea primero el trasero), el reparto delantero
   (bloquea primero el delantero, a poca deceleración) y el disco corto (nada bloquea, pero el fade se come
   la deceleración serie tras serie). */
function generaDx(rnd){
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const tipo=pick(['trasero','delantero','fade']);
  const mu=0.9;
  if(tipo==='trasero') return { tipo, beta:0.50+rnd()*0.06, dF:0.30, mu };
  if(tipo==='delantero') return { tipo, beta:0.86+rnd()*0.04, dF:0.30, mu };
  return { tipo, beta:Math.round((betaIdeal(mu)+0.015)*100)/100, dF:0.26, mu };
}

const DOSPI_=Math.PI*2;

/** Disco: cuatro materiales con el mismo estado térmico (se actualizan juntos). La cara con mapa de brillo radial; el resto, sin mapa. */

function matDisco(conMapa){
  const m=pbr({color:'#9aa1a8',map:conMapa?T_DCARA:null,roughness:0.46,metalness:0.88,emissive:'#000000',emissiveIntensity:0,emissiveMap:conMapa?T_BRILLO:null,side:THREE.DoubleSide});

/* ===================== 5. GEOMETRÍA ===================== */
const V3=(x,y,z)=>new THREE.Vector3(x,y,z), V2=(x,y)=>new THREE.Vector2(x,y);
/** Junta una pieza hecha de muchas mallas en una malla por material: así una rueda con 40 tacos cuesta 3 llamadas. */
function fusiona(grupo,sombra=true){
  grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map();
  grupo.traverse(o=>{ if(!o.isMesh) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(), m=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);
    g.applyMatrix4(m);
    if(!g.attributes.uv){ g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2)); }
    const k=o.material; if(!por.has(k)) por.set(k,[]); por.get(k).push(g); });
  const out=new THREE.Group();
  for(const [mat,gs] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count;
      pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry();
    G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    P3.sanaNormales(G);
    const me=new THREE.Mesh(G,mat); me.castShadow=sombra; me.receiveShadow=true; out.add(me);
  }
  return out;
}
const mezcla=(a,b,t)=>a+(b-a)*t;


/* ===================== 6. EL SUELO =====================
   Marco de la rueda: z hacia fuera del coche (el lado izquierdo que vemos), x hacia atrás (el coche avanza hacia −x) y
   arriba. El origen del grupo EJE es el centro de la rueda; el suelo está a RT por debajo. La rueda gira con z creciente
   (el techo avanza hacia −x) y el suelo corre hacia +x, a la velocidad de rodadura. */
const RT=VEH.rw;                                                              // radio del neumático (y radio dinámico)
const SUELO=new THREE.Group(); scene.add(SUELO);
const piso=new THREE.Mesh(new THREE.PlaneGeometry(60,60),M.asfalto); piso.rotation.x=-Math.PI/2; piso.position.y=0; piso.receiveShadow=true; piso.userData.pieza='asfalto'; SUELO.add(piso);

/* ===================== 7. LA RUEDA CORTADA =====================
   Neumático, llanta y cubo giran con la rueda; el disco gira con ellos; la pinza, la mangueta y las pastillas no giran.
   Un plano de recorte en z = ZCORTE quita la mitad de fuera de la rueda y deja ver el interior; las caras de corte
   llevan el rayado técnico. Todo en metros, a escala real. */
const EJE=new THREE.Group(); EJE.position.set(0,RT,0); scene.add(EJE);
const RUEDA=new THREE.Group(); EJE.add(RUEDA);                                  // lo que gira
const FIJO=new THREE.Group(); EJE.add(FIJO);                                    // lo que no gira
const PIEZAS={};
/** Pieza de revolución con eje z (la lathe de three gira en torno a y: se rota). Perfil en [r, z]. arco opcional. */
function rev(perfil,mat,{seg=72,fase=0,arco=Math.PI*2,sombra=true}={}){
  const g=P3.revolucion(perfil,{seg,fase,arco}); const m=new THREE.Mesh(g,mat); m.rotation.x=Math.PI/2; m.castShadow=sombra; m.receiveShadow=true; return m;
}
/** Rectángulo plano en un plano que contiene al eje z: ancho w a lo largo de la dirección radial del ángulo a, alto h a lo largo de z. UV en metros para el rayado. */
function rectRadial(w,h,a,mat,cx,cz){
  const g=new THREE.PlaneGeometry(w,h); const uv=g.attributes.uv, p=g.attributes.position; for(let i=0;i<uv.count;i++) uv.setXY(i,p.getX(i)+cx,p.getY(i)+cz);
  const m=new THREE.Mesh(g,mat); const er=V3(Math.cos(a),Math.sin(a),0), ez=V3(0,0,1), et=V3().crossVectors(er,ez);
  m.matrixAutoUpdate=false; m.matrix.makeBasis(er,ez,et); m.matrix.setPosition(er.x*cx,er.y*cx,cz); m.receiveShadow=true; return m;
}

/* ===================== 8. EL DISCO VENTILADO =====================
   Dos pistas (z de 0,005 a 0,014 y de −0,014 a −0,005), 36 aletas rectas entre ellas, campana hacia fuera. Se dibuja a
   300 mm y se escala en el plano según el diámetro elegido (el espesor no cambia). Una cuña de recorte FIJA en el
   mundo —entre el ángulo de la pinza y 54° más— deja ver la sección de las pistas y las aletas girando. */
const RO=0.15, RI=0.09, ZP=[0.005,0.014];
const ANG_PINZA=135*RAD, ANG_CUNA=62*RAD;
const DISCO3={ gr:new THREE.Group(), vanes:null, k:1, caps:[], capGr:new THREE.Group() };
RUEDA.add(DISCO3.gr);
/** Planos de la cuña: lo que queda entre a1 y a2 (en sentido antihorario) se recorta. Planos por el eje de la rueda, en coordenadas de mundo. */
const CUNA=(function(){
  const n=(a)=>V3(-Math.sin(a),Math.cos(a),0);                                    // tangente antihoraria
  const c0=V3(0,RT,0);
  const p1=new THREE.Plane(n(ANG_PINZA).negate(),0), p2=new THREE.Plane(n(ANG_PINZA+ANG_CUNA),0);
  p1.constant=-p1.normal.dot(c0); p2.constant=-p2.normal.dot(c0);
  return [p1,p2];
})();
for(const m of T_DISCO){ m.clippingPlanes=CUNA; m.clipIntersection=true; m.clipShadows=true; }
(function(){
  const g=DISCO3.gr;
  // caras de las pistas (anillos con UV planares) en los cuatro planos
  const cara=(z,s)=>{ const m=new THREE.Mesh(new THREE.RingGeometry(RI,RO,128,1),M.discoCara); m.position.z=z; m.castShadow=s; m.receiveShadow=true; return m; };
  for(const [z,s] of [[ZP[1],true],[ZP[0],false],[-ZP[0],false],[-ZP[1],false]]) g.add(cara(z,s));
  // cantos exteriores e interiores de cada pista
  const banda=(r,z0,z1)=>{ const m=rev([[r,z0],[r,z1]],M.discoBorde,{seg:128,sombra:false}); return m; };
  g.add(banda(RO,ZP[0],ZP[1]),banda(RO,-ZP[1],-ZP[0]),banda(RI,ZP[0],ZP[1]),banda(RI,-ZP[1],-ZP[0]));
  // aletas: 36 cajas radiales entre las pistas
  const N=36, geo=new THREE.BoxGeometry(RO-RI-0.002,0.0042,2*ZP[0]+0.0008);
  const im=new THREE.InstancedMesh(geo,M.discoBorde,N), m4=new THREE.Matrix4(), q=new THREE.Quaternion(), s=V3(1,1,1);
  for(let i=0;i<N;i++){ const a=(i+0.5)/N*DOSPI+0.07, r=(RO+RI)/2; q.setFromAxisAngle(V3(0,0,1),a); m4.compose(V3(Math.cos(a)*r,Math.sin(a)*r,0),q,s); im.setMatrixAt(i,m4); }
  im.castShadow=false; im.receiveShadow=true; im.frustumCulled=false; g.add(im); DISCO3.vanes=im;
  g.userData.pieza='disco'; im.userData.pieza='aletas';
  // campana (gorro) del disco, hasta el cubo
  const camp=rev([[0.0905,0.0],[0.0905,0.018],[0.0800,0.038],[0.0800,0.0495],[0.0560,0.0495],[0.0560,0.0455],[0.0765,0.0455],[0.0765,0.0395],[0.0865,0.020],[0.0865,0.0]],M.fundicion,{seg:96,sombra:false});
  camp.userData.pieza='campana'; RUEDA.add(camp);
  // cinco orejas de la campana con sus taladros (se ven en el borde del cubo)
  const og=new THREE.Group();
  for(let i=0;i<5;i++){ const a=i/5*DOSPI+0.3, o=new THREE.Mesh(new THREE.CylinderGeometry(0.0125,0.0125,0.005,16),M.fundicion); o.rotation.x=Math.PI/2; o.position.set(Math.cos(a)*0.0525,Math.sin(a)*0.0525,0.0475); og.add(o); }
  RUEDA.add(fusiona(og,false));
})();
/* Secciones fijas de las pistas, en los dos planos de la cuña (rayado de hierro). Se rehacen al cambiar el diámetro. */
function construyeCaps(k){
  while(DISCO3.capGr.children.length){ const c=DISCO3.capGr.children.pop(); c.geometry.dispose(); }
  for(const a of [ANG_PINZA,ANG_PINZA+ANG_CUNA]){
    for(const [z0,z1] of [[ZP[0],ZP[1]],[-ZP[1],-ZP[0]]]){ const r=rectRadial((RO-RI)*k,z1-z0,a,M.discoCorte,(RO+RI)/2*k,(z0+z1)/2); r.userData.pieza='disco'; DISCO3.capGr.add(r); }
  }
}
FIJO.add(DISCO3.capGr); construyeCaps(1);
let PINZA_REF=null;                                                           // se asigna al crear la pinza
function ajustaDisco(d){
  const k=d/0.30; if(Math.abs(k-DISCO3.k)<1e-5) return; DISCO3.k=k;
  DISCO3.gr.scale.set(k,k,1); construyeCaps(k);
  if(PINZA_REF){ const dx=(k-1)*RO; PINZA_REF.position.set(Math.cos(ANG_PINZA)*dx,Math.sin(ANG_PINZA)*dx,0); }
}

   El chirrido del freno caliente (tono que sube con la presión y baja con el fade), el siseo del neumático y un golpe

const sonido=(function(){

    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      osc=ctx.createOscillator(); osc.type='sawtooth'; osc.frequency.value=70; og=ctx.createGain(); og.gain.value=0; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=500; osc.connect(lp); lp.connect(og); og.connect(master); osc.start();
      osc2=ctx.createOscillator(); osc2.type='triangle'; osc2.frequency.value=1500; og2=ctx.createGain(); og2.gain.value=0; osc2.connect(og2); og2.connect(master); osc2.start();
      const buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate), d=buf.getChannelData(0); let ult=0; for(let i=0;i<d.length;i++){ ult=(ult+0.02*(Math.random()*2-1))/1.02; d[i]=ult*3.5; }
      ruido=ctx.createBufferSource(); ruido.buffer=buf; ruido.loop=true; fl=ctx.createBiquadFilter(); fl.type='bandpass'; fl.frequency.value=900; fl.Q.value=0.8; ng=ctx.createGain(); ng.gain.value=0; ruido.connect(fl); fl.connect(ng); ng.connect(master); ruido.start();
    }catch(e){ ctx=null; } }
  function actualiza(v,fren,cal){ if(!ctx) return; const t=ctx.currentTime, u=clamp(v,0,1), b=clamp(fren,0,1), c=clamp(cal,0,1);
    osc.frequency.setTargetAtTime(55+120*u,t,0.1); og.gain.setTargetAtTime(on?0.010+0.03*u:0,t,0.12);
    osc2.frequency.setTargetAtTime(1800-700*c,t,0.05); og2.gain.setTargetAtTime(on?0.012*b*b*(0.4+0.6*c):0,t,0.08);
    fl.frequency.setTargetAtTime(500+700*u,t,0.1); ng.gain.setTargetAtTime(on?0.008+0.035*u*u+0.02*b:0,t,0.1); }

/* ===================== 14. EL ESTADO Y EL RELOJ =====================
   EST son los mandos (lo que pide el alumno). De ellos sale UNA serie de frenadas (SER) que se recalcula sólo si cambia
   algún mando; la escena, las flechas, el brillo del disco, las cifras y las gráficas del dock leen la MISMA serie en el
   MISMO instante SIM.t. La rueda se dibuja a 1/12 de su giro real: a 150 km/h son 20 vueltas por segundo y el ojo no las ve. */
const KVIS=1/12;
const EST={modo:'marcha',beta:0.74,dF:0.30,zped:0.90,mu:0.90,v0:160,Tint:16,n:5,eje:'F',vel:1,pausa:REDUCIDO,autoRunning:false,vista:'freno',rot:false};
const SIM={t:0,th:0,vueltas:0,ini:false,sc:0};
let SER=null, SERclave='', ST=null;
/** Lo que se calcula ahora: en «En marcha», los mandos; en el laboratorio guiado, lo que pida el paso. */
function paramsActuales(){
  if(EST.modo==='guia'){ const p=guiaParams(); if(p) return p; }
  return { beta:EST.beta, dF:EST.dF, zped:EST.zped, mu:EST.mu, v0:EST.v0, Tint:EST.Tint, n:EST.n };
}
function aseguraSerie(){
  const q=paramsActuales(), key=[q.beta.toFixed(3),q.dF.toFixed(3),q.zped.toFixed(3),q.mu.toFixed(3),q.v0.toFixed(1),q.Tint,q.n].join('|');
  if(key===SERclave&&SER) return false;
  SERclave=key; SER={ q, S:serie({ beta:q.beta, dF:q.dF, zped:q.zped, mu:q.mu, v0:q.v0/3.6, Tint:q.Tint, n:q.n }) };
  if(!SIM.ini){ SIM.ini=true; const P=SER.S.paradas, k=Math.min(4,P.length-1); SIM.t=Math.max(0,P[k].t0-1.0); }
  SIM.t=Math.min(SIM.t,SER.S.tTot);
  return true;
}
/** El instante actual de la serie con sus cifras derivadas. */
function calcula(){
  aseguraSerie();
  const S=SER.S, m=muestrea(S,SIM.t), q=SER.q, W=VEH.m*G;
  const dis=disco(EST.eje==='F'?q.dF:S.dR.d);
  const frenando=m.fase===1;
  // parada en curso (o la última) para las cifras
  let k=-1; for(let i=0;i<S.paradas.length;i++){ if(SIM.t>=S.paradas[i].t0-1e-6) k=i; }
  ST={ q, S, m, k, parada:k>=0?S.paradas[k]:null, frenando, W, ci:EST.eje==='F'?m.TF:m.TR, di:dis.d,
    fadeF:fade(m.TF), fadeR:fade(m.TR), zNom:q.zped, bl:zBloqueo(q.beta,q.mu) };
  return ST;
}

    const dm=[CC.front.userData.dm,CC.front2.userData.dm], dr=[CC.rear.userData.dm,CC.rear2.userData.dm];

  TIP.style.left=Math.max(8,Math.min(innerWidth-TIP.offsetWidth-8,e.clientX-TIP.offsetWidth/2))+'px'; TIP.style.top=Math.max(8,e.clientY-TIP.offsetHeight-18)+'px';
  clearTimeout(tipT); tipT=setTimeout(()=>{ TIP.style.display='none'; },2600);
});

/* ===================== 20. DISPOSICIÓN: ANCHO, ESTRECHO, MÓVIL =====================
   Si no caben guía, escena y dock lado a lado (el marco de la plataforma, una tableta), la escena va arriba
   y guía e instrumentos comparten una hoja con pestañas abajo. */
function disposicion(){
  const W=innerWidth, b=document.body;
  const estrecho=W<1080, movil=W<640;
  b.classList.toggle('estrecho',estrecho); b.classList.toggle('movil',movil); b.classList.toggle('ancho',estrecho&&!movil);
  if(estrecho){ if(!b.classList.contains('t-hud')&&!b.classList.contains('t-panel')) b.classList.add('t-hud'); ajustaHoja(); }
  el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('on',b.classList.contains('t-'+t.dataset.tab)));
}
function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.47:0.43),240,450));
  let hh=base; const hud=el('hud');
  if(movil&&b.classList.contains('t-panel')) hh=Math.round(clamp(H*0.6,240,560));
  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;
    hh=Math.round(clamp(pide,240,Math.max(base,H*(movil?0.62:0.56)))); }
  const ant=parseFloat(b.style.getPropertyValue('--hojaH'))||0;
  if(Math.abs(ant-hh)>1){ b.style.setProperty('--hojaH',hh+'px'); colocaBarras(); ponVista(EST.vista,0.001); centraEnHueco(); }
}
el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.onclick=()=>{ const b=document.body; b.classList.remove('t-hud','t-panel'); b.classList.add('t-'+t.dataset.tab); disposicion(); ponVista(EST.vista,0.001); centraEnHueco(); });


/* ===================== 21. EL LABORATORIO GUIADO =====================
   Tres fases: 1 · Predice (a qué deceleración bloquea el primer eje con un reparto fijo: transferencia de carga),
   2 · Diseña (reparto y diámetro del disco delantero para cinco frenadas seguidas sin que el trasero bloquee primero
   y sin fade excesivo; la solución es una ventana interior) y 3 · Diagnostica (¿reparto trasero, reparto delantero o
   disco corto?, sólo con lo que miden los ejes) y cierra con un quiz de tres preguntas. Varios intentos fallidos cambian
   el escenario (no se aprueba por eliminación). */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETO={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'predice',iniciado:false,dxOk:false,r1:null,r2:null,preparando:false,dx:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0,orden:null,dzp:0.80};
const NOM_DX={trasero:'Reparto demasiado trasero',delantero:'Reparto demasiado delantero',fade:'Disco corto: fade'};

/* ---------- Fase 1 · Predice ---------- */
function sorteaCaso1(){
  let c, zb; do{ c={beta:pickOne([0.60,0.64,0.68,0.72,0.76,0.80]),mu:pickOne([0.5,0.6,0.7,0.8,0.9])}; zb=zBloqueo(c.beta,c.mu);
  }while(Math.abs(zb.zf-zb.zr)/Math.min(zb.zf,zb.zr)<0.10||zb.z<0.40||zb.z>1.05||(GUIA.r1&&GUIA.r1.beta===c.beta&&GUIA.r1.mu===c.mu));
  c.zb=zb; c.ans=zb.z; GUIA.r1=c;
}
const leeNum=s=>{ const raw=String(s||'').trim().replace(/\s| /g,'').replace(',','.').replace(/g$/i,''); return parseFloat(raw); };
function checkPredice(){
  const v=leeNum((el('ansV')||{}).value), r=GUIA.r1;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe la deceleración en g (con coma o punto decimal).'); return; }
  RETO.intentos++;
  const ok=r.ans, tol=Math.max(0.02,0.025*ok);
  if(Math.abs(v-ok)<=tol){
    RETO.fallos1=0; sonido.bien();
    const z=r.zb;
    feedback('good','¡Correcto! ✓',`Con β = ${fN(r.beta,2)} y μ = ${fN(r.mu,2)}: z<sub>f</sub> = μ·b/(L·β − μ·h) = ${fN(z.zf,3)} g y z<sub>r</sub> = μ·a/(L·(1−β) + μ·h) = ${fN(z.zr,3)} g. Bloquea primero el eje <b>${z.primero}</b>, a <b>${fN(ok,2)} g</b>: sólo aprovechas el ${fN(z.eficacia*100,0)} % de la adherencia. El reparto ideal para este μ sería β* = ${fN(betaIdeal(r.mu),3)}.`,true);
    paso('decide'); prepararDecide();
  } else {
    RETO.fallos1++; sonido.mal();
    const z=r.zb, otro=r.zb.primero==='trasero'?z.zf:z.zr, esOtro=Math.abs(v-otro)<=Math.max(0.02,0.025*otro);
    if(RETO.fallos1>=3){ RETO.fallos1=0; RETO.resiembras++; sorteaCaso1();
      feedback('bad','Tres intentos fallidos','Cambia el caso. Plantea el equilibrio de cada eje: la fuerza de freno que le toca es β·m·g·z (delante) o (1−β)·m·g·z (detrás), y debe igualar μ·N con N = m·g·(b ± z·h)/L.'); pintaHUD(); pintaDockFijo();
    } else {
      feedback('bad','Revisa el cálculo',(esOtro?'Ese es el valor del otro eje: bloquea <b>después</b>, así que no es el primero. ':`Tu resultado (${fN(v,2)} g) está ${v>ok?'alto':'bajo'}. `)+`Recuerda que la carga cambia con z. (intentos fallidos: ${RETO.fallos1}/3)`);
      const t=el('d_try'); if(t) t.textContent=RETO.fallos1;
    }
  }
}

/* ---------- Fase 2 · Diseña ---------- */
function prepararDecide(){
  GUIA.preparando=true; GUIA.r2=null; SERclave='';
  setTimeout(()=>{
    let sc=null; for(let i=0;i<4&&!sc;i++) sc=generaReto(Math.random);
    if(!sc){ let x=7; sc=generaReto(()=>(x=x*48271%2147483647)/2147483647); }
    GUIA.r2={sc,beta:0.64,dF:0.28,intentos:0,res:null};
    GUIA.preparando=false; SERclave=''; pintaHUD(); pintaDockFijo();
  },20);
}
function validaDecide(){
  const r=GUIA.r2; if(!r||GUIA.preparando) return;
  const e=evaluaReto(r.sc,r.beta,r.dF); r.res=e; RETO.intentos++; r.intentos++;
  if(e.ok){
    RETO.fallos2=0; sonido.bien();
    feedback('good','¡Cumple los cuatro! ✓',`β = ${fN(r.beta,2)} y Ø ${fN(r.dF*1000,0)} mm: el trasero no bloquea primero (β* = ${fN(r.sc.bStar,2)}), el disco delantero llega a ${fN(e.TFmax,0)} °C con un fade de ${fN(e.fade*100,0)} %, la última frenada pide ${fN(e.dUlt,0)} m (tope ${fN(r.sc.Dmax,0)}) y el disco pesa ${fN(e.masa,1)} kg. Más reparto delantero evita el bloqueo trasero pero carga de calor el disco de delante; más diámetro lo enfría, pero pesa: la solución está en medio.`,true);
    paso('diag'); iniciaDiag();
  } else {
    RETO.fallos2++; sonido.mal();
    const f=[];
    if(!e.okT) f.push(`el eje trasero llega al límite antes que el delantero durante ${fN(e.limRsolo,1)} s: el coche se vuelve inestable`);
    if(!e.okFade) f.push(`el fade llega al ${fN(e.fade*100,0)} % (tope ${fN(r.sc.fadeMax*100,0)} %): el disco delantero alcanza ${fN(e.TFmax,0)} °C`);
    if(!e.okD) f.push(`la última frenada necesita ${fN(e.dUlt,0)} m (tope ${fN(r.sc.Dmax,0)} m)`);
    if(!e.okM) f.push(`el disco pesa ${fN(e.masa,1)} kg (tope ${fN(r.sc.Mmax,1)} kg)`);
    const msg='Falla: '+f.join('; ')+'.';
    if(RETO.fallos2>=4){ RETO.fallos2=0; RETO.resiembras++; feedback('bad','Cuatro intentos sin lograrlo',msg+' Cambia el escenario: la velocidad y la adherencia son otras.',true); prepararDecide(); }
    else { feedback('bad','Todavía no',msg+` (intentos: ${RETO.fallos2}/4)`,true); pintaHUD(); }
  }
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.tipo; let d; do{ d=generaDx(Math.random); }while(d.tipo===p);
  GUIA.dx=d; GUIA.dxOk=false; GUIA.dzp=0.80; GUIA.orden=barajar(['trasero','delantero','fade']); SERclave='';
  pintaHUD(); pintaDockFijo();
}
function diagnostica(k){
  if(!GUIA.dx||GUIA.dxOk) return; RETO.intentos++;
  if(k===GUIA.dx.tipo){
    GUIA.dxOk=true; RETO.fallos3=0; sonido.bien();
    feedback('good','Diagnóstico correcto ✓',explicaDx(GUIA.dx),true);
    paso('quiz'); iniciaQuiz();
  } else {
    RETO.fallos3++; sonido.mal();
    if(RETO.fallos3>=3){ RETO.fallos3=0; RETO.resiembras++; feedback('bad','Tres intentos fallidos','Es otro coche: mira qué eje llega al límite de adherencia y si la deceleración se cae con la temperatura aunque el pedal sea el mismo.',true); iniciaDiag(); }
    else { feedback('bad','No es ese',noEs(k)+` (intentos fallidos: ${RETO.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(d){
  const zb=zBloqueo(d.beta,d.mu);
  if(d.tipo==='trasero') return `Reparto trasero: con β = ${fN(d.beta,2)} el trasero llega a μ·N a ${fN(zb.zr,2)} g, antes que el delantero (${fN(zb.zf,2)} g). El ideal para μ = ${fN(d.mu,2)} sería β* = ${fN(betaIdeal(d.mu),2)}: hay que cargar más freno delante.`;
  if(d.tipo==='delantero') return `Reparto delantero: con β = ${fN(d.beta,2)} el delantero bloquea a ${fN(zb.zf,2)} g, antes de que el trasero haya trabajado (${fN(zb.zr,2)} g). Es estable, pero desperdicia el eje trasero y calienta de más el disco de delante.`;
  return `Disco corto: el reparto (β = ${fN(d.beta,2)}) está cerca del ideal y nada bloquea, pero el disco de ${fN(d.dF*1000,0)} mm de delante se calienta tanto que su pastilla pierde fricción: a igual pedal, la deceleración se cae serie tras serie.`;
}
function noEs(k){
  if(k==='trasero') return 'Con un reparto demasiado trasero el eje trasero llegaría al límite de adherencia antes que el delantero, con cualquier pedal fuerte desde la primera frenada.';
  if(k==='delantero') return 'Con un reparto demasiado delantero el delantero estaría siempre al límite desde la primera frenada, y la deceleración no dependería de la temperatura.';
  return 'Con un disco corto no bloquea ningún eje, y la deceleración empieza bien y se cae al calentarse: aquí no hay esa caída, o hay un eje al límite.';
}
const QUIZ=[
  {q:'Al frenar fuerte, la carga se va al eje delantero. ¿Cómo debe repartirse la fuerza de freno ideal?',ok:'Más delante cuanto mayor es la deceleración: F_f/F = (b + z·h)/L',mal:['Igual en los dos ejes, porque el coche es simétrico','Más detrás, para compensar que ese eje va más descargado','Fija: la misma que parado, sea cual sea la deceleración']},
  {q:'Tras varias frenadas fuertes seguidas el pedal sigue igual pero el coche frena menos. ¿Qué ha pasado?',ok:'La pastilla, al calentarse, tiene menos coeficiente de fricción: es el fade',mal:['El disco se ha vuelto más fino y no agarra','La presión del líquido ha bajado sola','El neumático ha perdido adherencia por el calor del freno']},
  {q:'Si el eje trasero bloquea antes que el delantero, el coche…',ok:'Es inestable: el trasero pierde la guía lateral y tiende a girar sobre sí mismo',mal:['Frena más corto, porque ese eje pesa menos','Sigue recto y estable, es lo que se busca','No cambia nada: el bloqueo sólo importa en mojado']},
  {q:'Para el mismo coche y las mismas frenadas, un disco de mayor diámetro…',ok:'Tiene más masa y más superficie: sube menos de temperatura, pero pesa más',mal:['Se calienta más, porque el brazo de palanca es mayor','Da lo mismo: el calor depende sólo de la pastilla','Frena menos, porque el neumático tiene menos agarre']},
];
function iniciaQuiz(){ GUIA.quizN=0; GUIA.quizSel=barajar([0,1,2,3]).slice(0,3); cargaPregunta(); }
function cargaPregunta(){ const Q=QUIZ[GUIA.quizSel[GUIA.quizN]], opts=barajar([Q.ok,...Q.mal]); GUIA.quiz={q:Q.q,opts,ok:opts.indexOf(Q.ok)}; GUIA.quizResp=-1; GUIA.quizCorrecta=GUIA.quiz.ok; pintaHUD(); }
function respondeQuiz(i){
  if(GUIA.quizResp>=0) return; GUIA.quizResp=i; const ac=i===GUIA.quiz.ok; if(ac) RETO.quizAcierto++;
  if(ac) sonido.bien(); else sonido.mal();
  const ult=GUIA.quizN>=2;
  feedback(ac?'good':'bad',ac?'Correcto ✓':'No es esa',(ac?'':'La respuesta era: <b>'+GUIA.quiz.opts[GUIA.quiz.ok]+'</b>. ')+(ult?'Terminaste el laboratorio.':'Sigue con la siguiente.'),true);
  pintaHUD();
  if(ult){ RETO.hecho=true; paso('completo'); }
}
function siguientePregunta(){ if(GUIA.quizN<2){ GUIA.quizN++; cargaPregunta(); } }

/* ---------- el enrutador de acciones ---------- */
function paso(p){ GUIA.paso=p; GUIA.phase=({predice:0,decide:1,diag:2,quiz:2,completo:2})[p]; if(EST.modo==='guia') pintaHUD(); }
function handleAction(act,btn){
  switch(act){
    case 'check-v': checkPredice(); break;
    case 'hint-v':
      if(RETO.pistas===0){ RETO.pistas=1; feedback('good','Pista 1 de 2','Un eje bloquea cuando la fuerza de freno que le toca iguala μ·N. Delante le toca β·m·g·z y su carga es N<sub>f</sub> = m·g·(b + z·h)/L; detrás, (1−β)·m·g·z con N<sub>r</sub> = m·g·(a − z·h)/L.'); }
      else if(RETO.pistas===1){ RETO.pistas=2; feedback('good','Pista 2 de 2','Despeja z en cada igualdad: β·z = μ·(b + z·h)/L da z<sub>f</sub> = μ·b/(L·β − μ·h); y (1−β)·z = μ·(a − z·h)/L da z<sub>r</sub> = μ·a/(L·(1−β) + μ·h). Bloquea primero el eje con el menor z.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break;
    case 'validar': validaDecide(); break;
    case 'dx-trasero': diagnostica('trasero'); break;
    case 'dx-delantero': diagnostica('delantero'); break;
    case 'dx-fade': diagnostica('fade'); break;
    case 'quiz-0': respondeQuiz(0); break; case 'quiz-1': respondeQuiz(1); break; case 'quiz-2': respondeQuiz(2); break; case 'quiz-3': respondeQuiz(3); break;
    case 'quiz-sig': siguientePregunta(); break;
    case 'restart': location.reload(); break;
  }
}

/* ---------- lo que la guía enseña en cada paso ---------- */
function contenidoGuia(){
  const tri=(n,v,m)=>`<span class="tries">intentos fallidos: <b id="${n}">${v}</b>/${m}</span>`;
  switch(GUIA.paso){
    case 'predice': { const r=GUIA.r1;
      return {no:'Fase 1 · Reto 1',head:'Tu cálculo',title:'¿A qué deceleración bloquea el primer eje?',
      teach:`Reparto fijo <b>β = ${fN(r.beta,2)}</b> (${fN(r.beta*100,0)} % delante) sobre <b>μ = ${fN(r.mu,2)}</b>. Coche: L = ${fN(VEH.L,2)} m, a = ${fN(VEH.a,2)} m, b = ${fN(VEH.b,2)} m, h = ${fN(VEH.h,2)} m. Mira cómo frena: el dock no da el resultado.<div class="task">¿A cuántos <b>g</b> empieza a bloquearse el primer eje? ${tri('d_try',RETO.fallos1,3)}</div>`,
      acts:`<div class="calcrow"><input id="ansV" type="text" inputmode="decimal" autocomplete="off" placeholder="¿? g" aria-label="Deceleración en g a la que bloquea el primer eje"><button class="b primary" data-act="check-v">✓ Comprobar</button></div><button class="pista" id="btnHint">¿Necesitas una pista? (máx. 2)</button>`}; }
    case 'decide': { const r=GUIA.r2;
      if(GUIA.preparando||!r) return {no:'Fase 2 · Reto 2',head:'Tu diseño',title:'Preparando la pista…',teach:'Calculando el escenario.',acts:''};
      const sc=r.sc, e=r.res, chip=(ok,t,v)=>`<div class="chip ${e?(ok?'ok':'no'):''}"><span>${t}</span><b>${v}</b></div>`;
      return {no:'Fase 2 · Reto 2',head:'Tu diseño',title:'Cinco frenadas sin fade ni bloqueo trasero',
      teach:`<b>${fN(sc.n)}</b> frenadas a fondo desde <b>${fN(sc.v0)} km/h</b>, una cada <b>${fN(sc.Tint)} s</b>, con pedal de ${fN(sc.zped,2)} g sobre μ = ${fN(sc.mu,2)}. Elige reparto y disco delantero para cumplir las <b>cuatro a la vez</b>. ${tri('d_try2',RETO.fallos2,4)}<div class="chips">
        ${chip(e&&e.okT,'Trasero no bloquea antes','sin límite trasero solo'+(e?' · '+fN(e.limRsolo,1)+' s':''))}
        ${chip(e&&e.okFade,'Fade del delantero','≤ '+fN(sc.fadeMax*100,0)+' %'+(e?' · '+fN(e.fade*100,0)+' %':''))}
        ${chip(e&&e.okD,'Última frenada','≤ '+fN(sc.Dmax,0)+' m'+(e?' · '+fN(e.dUlt,0):''))}
        ${chip(e&&e.okM,'Masa del disco','≤ '+fN(sc.Mmax,1)+' kg'+(e?' · '+fN(e.masa,1):''))}</div>`,
      acts:`<div class="cg"><div class="cl"><div>Reparto delantero</div><b id="v2B">${fN(r.beta*100,0)} : ${fN(100-r.beta*100,0)}</b></div><input type="range" id="r2B" min="${B_MIN}" max="${B_MAX}" step="0.01" value="${r.beta}" aria-label="Reparto de la fuerza de frenado, porcentaje delante"></div>
        <div class="cg"><div class="cl"><div>Disco delantero Ø</div><b id="v2D">${fN(r.dF*1000,0)} mm · ${fMasa(r.dF)}</b></div><input type="range" id="r2D" min="${D_MIN}" max="${D_MAX}" step="0.005" value="${r.dF}" aria-label="Diámetro del disco delantero"></div>
        <button class="b primary" data-act="validar">▶ Validar el diseño</button>`}; }
    case 'diag': { const ord=GUIA.orden||['trasero','delantero','fade'];
      return {no:'Fase 3 · Diagnóstico',head:'¿Qué le pasa?',title:'Averigua el fallo de este coche',
      teach:`No sabes el reparto ni el disco. Cambia el pedal y mira qué eje llega al límite y qué pasa con la deceleración serie tras serie.<div class="task">¿Qué le pasa a este coche? ${tri('d_try3',RETO.fallos3,3)}</div>`,
      acts:`<div class="cg"><div class="cl"><div>Pedal</div><b id="vdZ">${fN(GUIA.dzp,2)} g</b></div><input type="range" id="rdZ" min="0.5" max="1.0" step="0.01" value="${GUIA.dzp}" aria-label="Deceleración pedida con el pedal"></div>`
        +ord.map(k=>`<button class="b" data-act="dx-${k}">${NOM_DX[k]}</button>`).join('')}; }
    case 'quiz': { const Q=GUIA.quiz; if(!Q) return {no:'',head:'',title:'',teach:'',acts:''}; const ya=GUIA.quizResp>=0;
      return {no:'Cierre · Pregunta '+(GUIA.quizN+1)+' de 3',head:'Quiz',title:Q.q,teach:'',
      acts:Q.opts.map((o,i)=>`<button class="b ${ya?(i===Q.ok?'good':(i===GUIA.quizResp?'bad':'')):''}" data-act="quiz-${i}" ${ya?'disabled':''}>${o}</button>`).join('')+(ya&&GUIA.quizN<2?'<button class="b primary" data-act="quiz-sig">Siguiente →</button>':'')}; }
    case 'completo': return {no:'Laboratorio completado',head:'✓',title:'Predijiste, diseñaste y diagnosticaste',
      teach:`Acertaste ${RETO.quizAcierto} de 3 en el quiz. Vuelve a <b>En marcha</b> y prueba otros repartos y discos con la velocidad al máximo: en cuanto el disco pasa de unos 420 °C empieza el fade.`,
      acts:`<button class="b primary" data-act="restart">↺ Reiniciar laboratorio</button>`};
  }
  return {no:'',head:'',title:'',teach:'',acts:''};
}
function htmlGuia(){
  const ps=['Predice','Diseña','Diagnostica'], C=contenidoGuia();
  const ok=i=>i<GUIA.phase||(i===2&&RETO.hecho);
  return `<div class="pasos">${ps.map((t,i)=>`<span class="ps ${ok(i)?'ok':(i===GUIA.phase?'on':'')}"><i>${ok(i)?'✓':i+1}</i>${t}</span>`).join('')}</div>
  <div class="retoBox"><div class="rt"><span>${C.no}</span><span>${C.head}</span></div><h3>${C.title}</h3><div class="rq">${C.teach}</div><div class="opt" id="actOpt">${C.acts}</div></div>`;
}
/** Lo que corre en la escena en cada paso del laboratorio guiado (null: lo que digan los mandos). */
function guiaParams(){
  if(GUIA.paso==='predice'&&GUIA.r1){ const r=GUIA.r1; return {beta:r.beta,dF:0.30,zped:0.6,mu:r.mu,v0:100,Tint:14,n:2}; }
  if(GUIA.paso==='decide'&&GUIA.r2&&!GUIA.preparando){ const r=GUIA.r2, sc=r.sc; return {beta:r.beta,dF:r.dF,zped:sc.zped,mu:sc.mu,v0:sc.v0,Tint:sc.Tint,n:sc.n}; }
  if((GUIA.paso==='diag'||GUIA.paso==='quiz'||GUIA.paso==='completo')&&GUIA.dx){ const d=GUIA.dx; return {beta:d.beta,dF:d.dF,zped:GUIA.dzp,mu:d.mu,v0:150,Tint:18,n:5}; }
  return null;
}
/* ---------- los modos ---------- */
function setMode(m,forzar){
  if(!forzar&&(m===EST.modo||EST.autoRunning)) return;
  if(m==='guia'){
    EST.modo='guia'; if(!GUIA.iniciado){ GUIA.iniciado=true; sorteaCaso1(); paso('predice'); }
  } else EST.modo='marcha';
  document.body.classList.toggle('m-marcha',EST.modo==='marcha'); document.body.classList.toggle('m-guia',EST.modo==='guia');
  SERclave=''; SIM.ini=false; pintaHUD(); pintaDockFijo(); pintaBarras(); ponVista(EST.vista,0.6);
}
let fbTimer=null;
function feedback(type,title,text,sticky=false){ const f=el('feedback'); f.className='feedback show '+type; el('fbIcon').textContent=type==='good'?'✓':'✕'; el('fbTitle').textContent=title; el('fbText').innerHTML=text; clearTimeout(fbTimer); if(!sticky) fbTimer=setTimeout(()=>f.classList.remove('show'),7000); }
el('fbX').onclick=()=>el('feedback').classList.remove('show');
document.addEventListener('input',e=>{ const t=e.target; if(!t) return;
  if(t.id==='r2B'&&GUIA.r2){ const r=GUIA.r2; r.beta=+t.value; el('v2B').textContent=fN(r.beta*100,0)+' : '+fN(100-r.beta*100,0); r.res=null; }
  if(t.id==='r2D'&&GUIA.r2){ const r=GUIA.r2; r.dF=Math.round(+t.value*1000)/1000; el('v2D').textContent=fN(r.dF*1000,0)+' mm · '+fMasa(r.dF); r.res=null; }
  if(t.id==='rdZ'){ GUIA.dzp=+t.value; el('vdZ').textContent=fN(GUIA.dzp,2)+' g'; }
});

/* ---------- el recorrido guiado de «En marcha» ---------- */
const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function runAuto(){
  if(EST.autoRunning||EST.modo!=='marcha') return; EST.autoRunning=true; sonido.init();
  const hud=el('hud'), prev={beta:EST.beta,dF:EST.dF,zped:EST.zped,mu:EST.mu,v0:EST.v0,Tint:EST.Tint,eje:EST.eje,vista:EST.vista,vel:EST.vel};
  const fija=o=>{ Object.assign(EST,o); pintaHUD(); hud.style.pointerEvents='none'; const b=el('btnAuto'); if(b){ b.disabled=true; b.textContent='Recorrido en curso…'; } pintaDockFijo(); pintaBarras(); };
  const irA=(k)=>{ aseguraSerie(); const P=SER.S.paradas; SIM.t=Math.max(0,P[Math.min(k,P.length-1)].t0-1.0); };
  try{
    fija({beta:betaIdeal(0.9),dF:0.30,zped:0.80,mu:0.90,v0:150,Tint:18,eje:'F',vel:1}); SERclave=''; aseguraSerie(); SIM.t=0; ponVista('coche');
    const c8=cargasEje(0.8), zb=zBloqueo(EST.beta,0.9);
    showToast(`Paso 1 · Al frenar a 0,8 g la carga se va al eje delantero: lleva el ${fN(c8.Nf/(VEH.m*G)*100,0)} % del peso (parado, ${fN(VEH.b/VEH.L*100,0)} %). Con β = β* = ${fN(EST.beta,2)} los dos ejes bloquean a la vez, a ${fN(zb.z,2)} g.`,8200);
    await espera(8600);
    ponVista('freno'); irA(0);
    showToast('Paso 2 · Vista del freno delantero: la energía cinética se vuelve calor en el disco. Mira cómo se calienta y cómo la pastilla lo roza.',7600);
    await espera(8000);
    fija({vel:3,zped:0.90}); irA(2);
    showToast('Paso 3 · Tiempo ×3, varias frenadas seguidas: el disco pasa de los 400 °C, la pastilla pierde fricción y la deceleración baja (fade).',8200);
    await espera(10000);
    fija({vel:1,beta:0.60,zped:0.95}); irA(0); ponVista('coche');
    showToast(`Paso 4 · Con reparto ${fN(EST.beta*100,0)} : ${fN(100-EST.beta*100,0)} el eje trasero llega a μ·N antes que el delantero: bloquea a ${fN(zBloqueo(0.60,0.9).z,2)} g, frenada inestable.`,8200);
    await espera(8600);
  } finally {
    Object.assign(EST,prev); EST.autoRunning=false; hud.style.pointerEvents='';
    SERclave=''; pintaHUD(); pintaDockFijo(); ponVista(prev.vista); pintaBarras();
  }
}


/* ===================== 22. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.min(devicePixelRatio,alta?2:1.5));
  const ms=alta?2048:1024; if(LUZ.sol.shadow.mapSize.x!==ms){ LUZ.sol.shadow.mapSize.set(ms,ms); if(LUZ.sol.shadow.map){ LUZ.sol.shadow.map.dispose(); LUZ.sol.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); ponVista(EST.vista,0.001); centraEnHueco();
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 23. EL LAZO: UN SOLO RELOJ =====================
   El tiempo de la escena avanza dt·(velocidad elegida) en cada cuadro, y con ESE tiempo se leen la serie de frenadas, el giro
   de la rueda, el brillo del disco, las flechas del coche, las cifras y las gráficas del dock. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  aplicaEscena(EST.pausa?0:dt*EST.vel,dt);
  pasaCam(dt);
  if(ST) sonido.actualiza(EST.pausa?0:ST.m.v/50,EST.pausa||!ST.frenando?0:ST.m.z,ST.fadeF/0.35);
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.05&&seVe(el('panel'))){ tLienzo=t; pintaReparto(); pintaMu(); pintaTemp(); pintaDist(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos();
}

/* ===================== 24. ARRANQUE =====================
   Abre en marcha: el coche ya va por su cuarta frenada, con el disco delantero al rojo y las chispas del polvo de pastilla
   saliendo por el borde de las pastillas. Es el gancho: el alumno ve el calor antes de tocar nada. */
disposicion();
aplicaCalidad();
pintaHUD();
SERclave=''; aseguraSerie();
aplicaEscena(0,0);
pintaBarras();
ponVista('freno',0.001);
centraEnHueco();
pintaDockFijo();
cuadro();
setTimeout(()=>showToast('Quinta frenada a fondo desde 160 km/h: el disco delantero se pone al rojo y la pastilla pierde fricción.',6200),700);

/* ===================== 25. GANCHOS DE PRUEBA ===================== */
/** Extensión en pantalla de lo que SE VE de la rueda: vértices que el recorte no quita, proyectados con la cámara actual. */
function extensionVisible(raiz){
  const q=new THREE.Vector3(), M4=new THREE.Matrix4(); let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9, n=0;
  camera.updateMatrixWorld(true); raiz.updateMatrixWorld(true);
  raiz.traverse(o=>{
    if(!o.isMesh||o.isInstancedMesh||!o.geometry||!o.geometry.attributes.position) return;
    for(let p=o;p;p=p.parent) if(!p.visible) return;
    const pos=o.geometry.attributes.position, paso=Math.max(1,Math.floor(pos.count/1500)), mats=Array.isArray(o.material)?o.material:[o.material], planos=mats[0].clippingPlanes||[], inter=!!mats[0].clipIntersection;
    for(let i=0;i<pos.count;i+=paso){
      q.fromBufferAttribute(pos,i).applyMatrix4(o.matrixWorld);
      if(planos.length){ const dentro=planos.map(pl=>pl.distanceToPoint(q)>=0); const recortado=inter?dentro.every(d=>!d):dentro.some(d=>!d); if(recortado) continue; }
      q.project(camera); if(q.z>1) continue; const px=(q.x+1)/2*innerWidth, py=(1-q.y)/2*innerHeight;
      x0=Math.min(x0,px); x1=Math.max(x1,px); y0=Math.min(y0,py); y1=Math.max(y1,py); n++;
    } });
  void M4; return {x0:Math.round(x0),x1:Math.round(x1),y0:Math.round(y0),y1:Math.round(y1),alto:+((y1-y0)/innerHeight).toFixed(3),ancho:+((x1-x0)/innerWidth).toFixed(3),n};
}

  cam(){ const r=v=>[+v.x.toFixed(3),+v.y.toFixed(3),+v.z.toFixed(3)]; return {pos:r(camera.position),target:r(controls.target),hueco:huecoLibre(),fps:FPS.v}; },
};

});
