<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Faros matriciales adaptativos — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#070D16;--panel:rgba(8,13,22,.90);--line:#2B3A52;--ink:#EAF4F8;
    --dim:#9BB8C4;--accent:#FFC857;--accent2:#FFE3A3;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cF:#FFC857;--cR:#FFA445;--cE:#3DDC97;--cG:#C8D6D2;--cI:#C79BFF;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#04060a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#14202f;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#1f3248}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#2a1b00;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#2a1b00;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#ffd98a}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  body:not(.m-tour) .hud{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2B3A52 transparent}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#2a1b00}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#FFC857;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f87a0;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f90a8;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#2a1b00}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .escs{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
  .esc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px;font-size:11.5px;line-height:1.35;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.20);border:1px solid rgba(40,56,80,.7);color:#c4d3e6}
  .esc .rs{font-weight:700;font-size:11px}.esc .rs.ok{color:var(--good)}.esc .rs.mal{color:#ff9a9a}
  .esc .pista{font-size:10.5px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#0a1220;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .clases{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
  .clases .b{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;padding:4px 8px;font-size:12px;line-height:1.2}
  .clases .b small{font-size:9.5px;color:var(--dim);font-weight:400}
  .clases .b.on small{color:#5a3a00}
  .clases .b .pr{color:var(--hv);letter-spacing:.06em;font-size:10.5px}
  .clases .b.on .pr{color:#5a3a00}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(40,56,80,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(40,56,80,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f87a0}
  .dk-tit{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#a3bcd6;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(40,56,80,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c6da;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#14202f;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfdcec;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  /* ---- el recorrido paso a paso y el aro que señala la pieza ---- */
  .tour{border:1px solid rgba(255,200,87,.38);background:rgba(255,200,87,.06);border-radius:12px;padding:10px 11px;display:flex;flex-direction:column;gap:7px}
  .tour .tn{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .tour .pts{display:flex;gap:5px}.tour .pts i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}.tour .pts i.on{background:var(--accent)}.tour .pts i.ok{background:var(--good)}
  .tour h3{font-size:16px;line-height:1.2}
  .tour .tx{font-size:13px;line-height:1.5;color:#d3e3ea}.tour .tx b{color:#fff}
  .tour .tb{display:flex;gap:6px}.tour .tb .b{flex:1}
  .tour .salta{align-self:flex-end;font-size:11px;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:0;font-family:inherit}
  .foco{position:fixed;z-index:14;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 3px rgba(255,200,87,.55),0 0 24px 6px rgba(255,200,87,.45);pointer-events:none;display:none;animation:pulso 1.5s ease-in-out infinite}
  @keyframes pulso{0%,100%{transform:scale(.88);opacity:.95}50%{transform:scale(1.12);opacity:.55}}
  @media (prefers-reduced-motion:reduce){.foco{animation:none}}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,18,30,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,18,30,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d3e6}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,18,30,.92);border:1px solid rgba(255,214,130,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,18,30,.84);border:1px solid rgba(255,214,130,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .chips{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .chip{font-size:11.5px;line-height:1.35;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--dim)}
  .chip b{color:var(--ink)} .chip small{font-size:10.5px;color:var(--dim)}
  .chip.ok{border-color:rgba(52,211,153,.5)} .chip.ok b{color:var(--good)} .chip.mal{border-color:rgba(244,71,94,.5)} .chip.mal b{color:#ff9aa8}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}

<script type="module">
import * as THREE from 'three';

/* ============================================================
LAB — FAROS MATRICIALES ADAPTATIVOS: VER MUCHO SIN DESLUMBRAR
   (Autotrónica · mecanica-161)

   Un coche de noche ilumina la calle con un faro hecho de decenas de LED (la «matriz»). Una cámara ve al coche que viene de frente y
   apaga los LED que lo apuntan: una zona oscura que lo sigue. La luz que llega a un punto baja con el cuadrado de la distancia
   (E = I·cosθ/r²), así que el peatón del borde se ve (necesita ~1 lux) mientras el parabrisas del otro coche queda bajo ~1 lux.
   La cámara llega tarde (retraso τ), por eso la zona oscura necesita un margen; si el margen o los segmentos son demasiado anchos,
   se apaga también al peatón. El haz, la máscara y los lux son un único modelo en un bloque puro que un script de Node extrae TAL CUAL.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO='\u202F';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }



/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos marcas— y lo prueba:
   lo que se prueba es lo que corre. */
/* FISICA:INICIO */
/* ---- Faros matriciales adaptativos. Física pura (sin three). SI salvo donde se diga (ángulos del haz en grados). ----
   Cadena: un faro de N segmentos LED reparte la intensidad luminosa I (candelas) por ángulo, I(α) = Σ I_s · [Φ((α−a_s)/σb) − Φ((α−b_s)/σb)]
   (cada segmento es un «escalón» de luz emborronado por la óptica) → una cámara ve al coche que viene con un retraso τ → apaga los segmentos
   que tapan su ancho (más un margen) → la iluminancia en un punto a distancia r es E = I(α)·cosθ·T(r)/r² (ley del inverso del cuadrado y
   transmitancia de Beer–Lambert). Se compara la luz sobre el peatón con la que necesita verlo (E_min = 0,20/ρ lx) y la luz en el parabrisas
   del otro coche con el límite de deslumbramiento (1 lx). El mundo (coche que viene y peatón) se mueve con un único reloj t. */
const DOSPI=Math.PI*2, RAD=Math.PI/180;
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const suave=t=>{ t=clamp(t,0,1); return t*t*(3-2*t); };

/* ---- Fotometría ---- */
const E_REF=1.0, RHO_REF=0.20;            // 1 lx hace visible a una figura de reflectancia 0,20 (didáctico; ver ficha)
const E_LIM=1.0;                          // límite de deslumbramiento en el parabrisas del otro conductor (lx), didáctico
const eMin=rho=>E_REF*RHO_REF/rho;        // iluminancia mínima para ver al peatón: L = ρ·E/π ≥ L_umbral
const trans=(sig,r)=>Math.exp(-sig*r);    // Beer–Lambert: sig es el coeficiente de extinción (1/m); sig = 3,912/visibilidad
const ilum=(I,r,cosInc,sig)=>I*cosInc*trans(sig,r)/(r*r);   // E = I·cosθ·T/r²
/** Distancia máxima a la que una intensidad I (cd) deja E ≥ Eobj (lx): resuelve I·e^(−σr)/r² = Eobj por bisección (σ = 0 → √(I/E)). */
function distAlcance(I,Eobj,sig){
  if(!(sig>0)) return Math.sqrt(I/Eobj);
  let a=1e-3, b=Math.sqrt(I/Eobj)+1e-3;                // con σ>0 la raíz es menor que √(I/E)
  for(let i=0;i<80;i++){ const m=(a+b)/2; if(I*trans(sig,m)/(m*m)>=Eobj) a=m; else b=m; }
  return (a+b)/2;
}

/* ---- El haz ---- */
const FOV=12;                              // semiapertura de la matriz (°): cubre de −12° a +12°
const NSEG=[8,16,32,64];                   // segmentos que puede tener la matriz
const I_MAX=30000;                         // intensidad (cd) del segmento central de luces altas, con los dos faros (didáctico)
const SIG_H=7;                             // el reparto de intensidad entre segmentos es una campana de σ = 7°
const SIG_B=0.25;                          // borrosidad óptica de cada segmento (°)
const PARASITA=0.002;                      // luz parásita que se cuela aunque el segmento esté apagado (fracción de I_MAX)
const I_BAJAS=3500;                        // cd de las luces bajas hacia el borde derecho
/** Función de error (Abramowitz–Stegun 7.1.26, error ≤ 1,5·10⁻⁷) y distribución normal. */
function erf(x){ const s=x<0?-1:1; x=Math.abs(x); const t=1/(1+0.3275911*x);
  const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x); return s*y; }
const Phi=z=>0.5*(1+erf(z/Math.SQRT2));
const sigm=x=>1/(1+Math.exp(-x));
const _segs={};
function segmentos(N){ if(!_segs[N]){ const w=2*FOV/N, s=[]; for(let i=0;i<N;i++){ const a=-FOV+i*w, b=a+w, c=(a+b)/2; s.push({a,b,c,I0:I_MAX*Math.exp(-c*c/(2*SIG_H*SIG_H))}); } _segs[N]=s; } return _segs[N]; }
/** Intensidad (cd) de la matriz en la dirección ang (°) con los segmentos `on` encendidos y el nivel (0..1). */
function perfilHaz(N,on,nivel,ang){
  const S=segmentos(N), w=2*FOV/N; let I=0, hay=false;
  for(let i=0;i<N;i++){ if(!on[i]) continue; hay=true; const s=S[i]; if(Math.abs(ang-s.c)>w/2+6*SIG_B) continue;
    I+=s.I0*(Phi((ang-s.a)/SIG_B)-Phi((ang-s.b)/SIG_B)); }
  I*=nivel;
  if(hay) I+=PARASITA*I_MAX*nivel*Math.exp(-ang*ang/(2*SIG_H*SIG_H));
  return I;
}
/** Luces bajas: más luz a la derecha del eje, y por debajo del corte hacia la izquierda (donde viene el otro coche). */
const perfilBajas=ang=>I_BAJAS*(0.08+0.92*sigm((ang+0.2)/0.9))*Math.exp(-ang*ang/(2*8*8));
/** Intensidad según el modo del haz: 'bajas', 'altas' (todos los segmentos) o 'matriz' (con zona oscura). */
function intensidad(par,on,ang){ return par.modo==='bajas'?perfilBajas(ang):perfilHaz(par.N,on,par.nivel,ang); }

/* ---- Tiempo ---- */
const T_VENT=2.4, DT=0.02, NPAS=Math.round(T_VENT/DT);      // 2,4 s de aproximación, en pasos de 20 ms
const ANCHO_COCHE=1.8;                     // m, ancho del coche que viene
const DY_PARABRISAS=0.6;                   // m: se mide en los dos extremos del parabrisas (conductor y retrovisor)
const DY_PEATON=0.25;                      // m: el peatón se mide en tres puntos de su ancho
const L_MIRA=45;                           // m: hacia dónde apunta la luz de curva
const CAMARAS=[{id:'rapida',tau:0.05,nombre:'Rápida'},{id:'normal',tau:0.15,nombre:'Normal'},{id:'lenta',tau:0.30,nombre:'Lenta'},{id:'muylenta',tau:0.45,nombre:'Muy lenta'}];
const camPorId=id=>CAMARAS.find(c=>c.id===id)||CAMARAS[1];

/* ---- Escenarios: la calle, el peatón (de pie, fijo en el suelo) y el coche que viene. Las coordenadas son metros;
   x es lateral respecto al carril propio (derecha +), s es la distancia por la carretera ---- */
const ESCENARIOS=[
  {id:'recta',nombre:'Calle recta',corto:'Recta',ve:15,vc:15,car:{x:-3.5,s0:105},ped:{x:2.4,s0:100,rho:0.20,ropa:'chaqueta clara'},tau:0.15,sig:3.912/10000,R:0},
  {id:'oscura',nombre:'Ropa oscura',corto:'Ropa oscura',ve:15,vc:15,car:{x:-3.5,s0:105},ped:{x:2.6,s0:85,rho:0.08,ropa:'ropa oscura'},tau:0.15,sig:3.912/10000,R:0},
  {id:'lluvia',nombre:'Lluvia',corto:'Lluvia',ve:15,vc:15,car:{x:-3.5,s0:105},ped:{x:2.4,s0:100,rho:0.12,ropa:'impermeable gris'},tau:0.30,sig:3.912/1500,R:0},
  {id:'curva',nombre:'Curva a la izquierda',corto:'Curva',ve:15,vc:15,car:{x:-3.5,s0:105},ped:{x:2.4,s0:100,rho:0.15,ropa:'sudadera clara'},tau:0.15,sig:3.912/10000,R:250},
];
const escPorId=id=>ESCENARIOS.find(e=>e.id===id)||ESCENARIOS[0];

/** Un punto de la calle: s metros por delante (por el eje de MI carril) y x al lado. Devuelve su posición en el suelo (X derecha, Y adelante),
 *  su distancia r y el ángulo α (°) desde el rumbo del coche. En curva (círculo de radio R a la izquierda) es exacto. */
function posMundo(esc,s,x){
  let X,Y;
  if(!esc.R){ X=x; Y=s; } else { const R=esc.R, phi=s/R; X=-R+(R+x)*Math.cos(phi); Y=(R+x)*Math.sin(phi); }
  return {X,Y,r:Math.hypot(X,Y),ang:Math.atan2(X,Y)/RAD};
}
/** Rumbo del haz (°): con la luz de curva, el haz gira hacia donde irá el coche (el punto a L_MIRA metros). */
const rumboHaz=(esc,par)=>(par.swivel&&esc.R)?posMundo(esc,L_MIRA,0).ang:0;
const sPeaton=(esc,t)=>esc.ped.s0-esc.ve*t;
const sCoche=(esc,t)=>esc.car.s0-(esc.ve+esc.vc)*t;

/** La máscara que pide la cámara: ve al coche como estaba hace τ y apaga todo segmento que toque su ancho más el margen m (°). */
function mascara(esc,par,t){
  const S=segmentos(par.N), on=new Array(par.N).fill(true);
  if(par.modo!=='matriz') return {on,lo:null,hi:null,nOff:0,det:null};
  const beta=rumboHaz(esc,par), sd=sCoche(esc,t-par.tau);
  if(sd<=1) return {on,lo:null,hi:null,nOff:0,det:null};
  const a1=posMundo(esc,sd,esc.car.x-ANCHO_COCHE/2).ang-beta, a2=posMundo(esc,sd,esc.car.x+ANCHO_COCHE/2).ang-beta;
  const lo=Math.min(a1,a2)-par.m, hi=Math.max(a1,a2)+par.m; let nOff=0;
  for(let i=0;i<par.N;i++){ if(S[i].b>lo&&S[i].a<hi){ on[i]=false; nOff++; } }
  return {on,lo,hi,nOff,det:(a1+a2)/2};
}
/** Todo lo que pasa en el instante t: dónde están el peatón y el coche, la máscara, y la luz sobre el peatón y en el parabrisas del otro. */
function estadoEn(esc,par,t){
  const beta=rumboHaz(esc,par), M=mascara(esc,par,t), sP=sPeaton(esc,t), sC=sCoche(esc,t);
  // el peatón: tres puntos de su ancho
  let ePed=0, angP=0, rP=0;
  for(const dx of [-DY_PEATON,0,DY_PEATON]){ const p=posMundo(esc,sP,esc.ped.x+dx), a=p.ang-beta; ePed+=ilum(intensidad(par,M.on,a),p.r,Math.cos(p.ang*RAD),esc.sig)/3; if(dx===0){ angP=a; rP=p.r; } }
  // el coche que viene: los dos extremos del parabrisas
  let eOjo=0, angC=0, rC=0;
  for(const dx of [-DY_PARABRISAS,0,DY_PARABRISAS]){ const p=posMundo(esc,sC,esc.car.x+dx), a=p.ang-beta; if(dx===0){ angC=a; rC=p.r; continue; }
    eOjo=Math.max(eOjo,ilum(intensidad(par,M.on,a),p.r,1,esc.sig)); }
  const c1=posMundo(esc,sC,esc.car.x-ANCHO_COCHE/2).ang-beta, c2=posMundo(esc,sC,esc.car.x+ANCHO_COCHE/2).ang-beta;
  return {t,sP,sC,ePed,eOjo,angP,angC,rP,rC,carA:Math.min(c1,c2),carB:Math.max(c1,c2),beta,mask:M,ratio:ePed/eMin(esc.ped.rho)};
}
/** La simulación completa de la ventana: series y métricas. */
function simula(esc,par){
  const n=NPAS+1, S={n, t:new Array(n), ePed:new Array(n), eOjo:new Array(n), lo:new Array(n), hi:new Array(n), angP:new Array(n), angC:new Array(n), carA:new Array(n), carB:new Array(n), nOff:new Array(n), rP:new Array(n), rC:new Array(n)};
  let pedMin=Infinity, tPedMin=0, ojoMax=0, tOjoMax=0, offMax=0;
  for(let k=0;k<n;k++){ const t=k*DT, e=estadoEn(esc,par,t);
    S.t[k]=t; S.ePed[k]=e.ePed; S.eOjo[k]=e.eOjo; S.lo[k]=e.mask.lo; S.hi[k]=e.mask.hi; S.angP[k]=e.angP; S.angC[k]=e.angC; S.carA[k]=e.carA; S.carB[k]=e.carB; S.nOff[k]=e.mask.nOff; S.rP[k]=e.rP; S.rC[k]=e.rC;

function lofteo(secs,seg=28){

    const yc=(s.y0+s.y1)/2, hh=Math.max(1e-3,(s.y1-s.y0)/2), ex=2/(s.n||3);

  for(let i=0;i<nR-1;i++) for(let k=0;k<seg;k++){
    const a=i*seg+k, b=i*seg+(k+1)%seg, c2=(i+1)*seg+k, d=(i+1)*seg+(k+1)%seg;

/* ===================== 9. EL ESTADO Y EL RELOJ =====================
   Un solo cálculo (CALC) alimenta la escena, el dock y las cifras: se recalcula cuando cambia un mando. El reloj SIM.t es el tiempo
   del escenario (s, de 0 a T_VENT = 2,4 s de aproximación del coche que viene) y avanza dt·LENTO·velocidad: la escena va en CÁMARA
   LENTA ×1/4 (rotulada en la barra de abajo) porque a velocidad real el cruce dura 2,4 s. SIM.t mueve a los dos coches, la zona oscura, el
   brillo del peatón y el cursor de todas las gráficas. Los modos: «Recorrido» (paso a paso), «Probar» (mandos libres) y «Reto». */

  const k=clamp(0.5*Math.pow(Math.max(0,e.ratio),1.5),0,1.2), col=colorRopa(C.esc.ped.rho);

function pintaAlcance(){

  const X0=30, X1=Wd-8, Y0=5, Y1=Hd-14, dmax=150, X=d=>X0+d/dmax*(X1-X0), lgMin=-1, lgMax=2, Y=v=>Y1-(Math.log10(Math.max(v,0.1))-lgMin)/(lgMax-lgMin)*(Y1-Y0);

function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.40:0.43),240,450));
  let hh=base; const hud=el('hud');

  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;

];
function tourParams(){ const p=TOUR_PASOS[TOUR.paso]; return p?p.par:null; }
function htmlTour(){
  const Pp=TOUR_PASOS[TOUR.paso], n=TOUR_PASOS.length, ult=TOUR.paso===n-1;
  const pts=TOUR_PASOS.map((_,i)=>`<i class="${i<TOUR.paso?'ok':(i===TOUR.paso?'on':'')}"></i>`).join('');
  const tx=typeof Pp.x==='function'?(CALC?Pp.x():''):Pp.x;
  return `<div class="tour"><div class="tn"><span>Paso ${TOUR.paso+1} de ${n}</span><span class="pts">${pts}</span></div><h3>${Pp.t}</h3><p class="intro tx">${tx}</p>
    <div class="tb">${TOUR.paso>0?'<button class="b" data-act="t-atras">← Atrás</button>':''}${ult?'<button class="b primary" data-act="t-fin">Probar yo →</button>':'<button class="b primary" data-act="t-sig">Siguiente →</button>'}</div>
    ${ult?'':'<button class="salta" data-act="t-fin">Saltar el recorrido</button>'}</div>`;
}
function tourVa(n,ms){
  TOUR.paso=clamp(n,0,TOUR_PASOS.length-1); const Pp=TOUR_PASOS[TOUR.paso];
  reiniciaCalculo(); SIM.t=Pp.t0; ponVista(Pp.vista,ms===undefined?1.0:ms); pintaHUD(); pintaDockFijo();
}
function tourParaAuto(){ clearTimeout(TOUR.timer); TOUR.auto=false; EST.autoRunning=false; }

/* ===================== 17. EL RETO: CALCULA, AJUSTA, DIAGNOSTICA =====================
   Tres fases: 1 · Calcula (a mano: hasta dónde llega un faro o cuántos grados ocupa el coche), 2 · Ajusta (cuántos LED, qué margen y qué
   fuerza para ver al peatón sin deslumbrar al otro; la luz que le llega al otro conductor sólo aparece al validar, y la ventana de margen
   es INTERIOR: corto deslumbra, ancho apaga al peatón) y 3 · Diagnostica (¿por qué falla este faro?, sólo con lo que se ve en el dock).
   Cierra con un quiz de tres preguntas. */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETOS={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'calcula',iniciado:false,dxOk:false,r1:null,r2:null,dx:null,orden:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0};
const ESC_RETO=['recta','oscura','lluvia','curva'];

/* ---------- Fase 1 · Calcula: el alcance de un faro o el ancho en grados del coche ---------- */
const CASOS_1=[
  {tipo:'alcance',I:4000,rho:0.20},{tipo:'alcance',I:9000,rho:0.10},{tipo:'alcance',I:16000,rho:0.40},{tipo:'alcance',I:25000,rho:0.08},{tipo:'alcance',I:7000,rho:0.15},
  {tipo:'angulo',d:40},{tipo:'angulo',d:60},{tipo:'angulo',d:90},{tipo:'angulo',d:120},{tipo:'angulo',d:150},
];
function resCaso1(c){ return c.tipo==='alcance'?distAlcance(c.I,eMin(c.rho),0):2*Math.atan(ANCHO_COCHE/2/c.d)/RAD; }
const claveC1=c=>c.tipo+'/'+(c.I||c.d)+'/'+(c.rho||'');
function sorteaCaso1(){ const p=GUIA.r1&&claveC1(GUIA.r1); let c; do{ c=pickOne(CASOS_1); }while(claveC1(c)===p); GUIA.r1=Object.assign({},c,{res:resCaso1(c)}); }
function numeroDe(txt){ const raw=String(txt||'').trim().replace(/\s/g,'').replace(/ /g,'').replace(',','.'); return parseFloat(raw); }
function checkCalcula(){
  const v=numeroDe((el('ansV')||{}).value), r=GUIA.r1, ok=r.res;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe el resultado (con coma o punto decimal).'); return; }
  RETOS.intentos++;
  const tol=r.tipo==='alcance'?Math.max(0.8,0.03*ok):Math.max(0.05,0.04*ok);
  if(Math.abs(v-ok)<=tol){
    RETOS.fallos1=0; sonido.bien();
    if(r.tipo==='alcance') feedback('good','¡Correcto! ✓',`Con ρ = ${fN(r.rho,2)} necesita E<sub>mín</sub> = 0,20 / ${fN(r.rho,2)} = ${fN(eMin(r.rho),2)} lx, y como E = I / d², d = √(I / E<sub>mín</sub>) = √(${fN(r.I,0)} / ${fN(eMin(r.rho),2)}) = <b>${fN(ok,1)} m</b>. La ropa oscura necesita más luz, así que se ve más cerca.`,true);
    else feedback('good','¡Correcto! ✓',`El coche mide ${fN(ANCHO_COCHE,1)} m y está a ${fN(r.d,0)} m: ocupa 2 · atan(0,9 / ${fN(r.d,0)}) = <b>${fN(ok,2)}°</b>. Un segmento de 64 LED mide ${fN(2*FOV/64,3)}°, así que lo cubren unos ${fN(Math.ceil(ok/(2*FOV/64)),0)} segmentos; con 8 LED (${fN(2*FOV/8,1)}° cada uno) basta uno... pero apaga ${fN(2*FOV/8,1)}° de calle.`,true);
    paso('ajusta'); prepararAjusta();
  } else {
    RETOS.fallos1++; sonido.mal();
    if(RETOS.fallos1>=3){ RETOS.fallos1=0; RETOS.resiembras++; sorteaCaso1(); feedback('bad','Tres intentos fallidos',r.tipo==='alcance'?'Cambia el caso. Recuerda: E<sub>mín</sub> = 0,20 / ρ y d = √(I / E<sub>mín</sub>).':'Cambia el caso. Recuerda: el ángulo es 2 · atan(0,9 / d), en grados.'); reiniciaCalculo(); pintaHUD(); }
    else { let pista; if(r.tipo==='alcance'){ const sinRaiz=r.I/eMin(r.rho); pista=Math.abs(v-sinRaiz)<=Math.max(0.8,0.03*sinRaiz)?'Te faltó la <b>raíz cuadrada</b>: E = I / d², así que d = √(I / E<sub>mín</sub>).':'Primero E<sub>mín</sub> = 0,20 / ρ; luego d = √(I / E<sub>mín</sub>).'; }
      else { const mitad=Math.atan(ANCHO_COCHE/2/r.d)/RAD; pista=Math.abs(v-mitad)<=Math.max(0.05,0.04*mitad)?'Eso es sólo <b>la mitad</b> del ángulo: el coche ocupa a ambos lados del centro.':'El ángulo es 2 · atan(0,9 / d); pásalo a grados (1 rad = 57,3°).'; }
      feedback('bad','Revisa el cálculo',pista+` (intentos fallidos: ${RETOS.fallos1}/3)`); const t=el('d_try'); if(t) t.textContent=RETOS.fallos1; }
  }
}

/* ---------- Fase 2 · Ajusta cuántos LED, el margen y la fuerza ---------- */
function prepararAjusta(){
  let e; do{ e=escPorId(pickOne(ESC_RETO)); }while(GUIA.r2&&e.id===GUIA.r2.esc.id&&RETOS.resiembras>0);
  GUIA.r2={esc:e,N:16,m:0,nivel:0.5,validado:false,res:null,intentos:0};
  reiniciaCalculo(); pintaHUD();
}
/** Rango de margen (°) que cumple todo con los LED y la fuerza como están: la ventana. */
function rangoM(r){
  let a=null,b=null;
  for(let i=0;i<=30;i++){ const m=i/10, S=simula(r.esc,{modo:'matriz',N:r.N,m,nivel:r.nivel,tau:r.esc.tau,swivel:true}); if(S.ok){ if(a===null) a=m; b=m; } }
  return a===null?null:[a,b];
}
/** ¿El peatón quedó dentro de la zona oscura en su peor instante? */
function tragado(r){ const S=CALC.S.S; let kmin=0; for(let k=1;k<S.n;k++) if(S.ePed[k]<S.ePed[kmin]) kmin=k; return S.lo[kmin]!==null&&S.angP[kmin]>=S.lo[kmin]-0.3&&S.angP[kmin]<=S.hi[kmin]+0.3; }
function validarAjusta(){
  const r=GUIA.r2; if(!r) return;
  const E=r.esc, S=CALC.S; r.res=S; r.validado=true; r.intentos++; RETOS.intentos++;
  const ok=S.ok; const trag=!S.okPed&&tragado(r);
  reiniciaCalculo();
  const cifras=`Al peatón le llegó como mínimo <b>${fN(S.pedMin,2)} lx</b> (necesita ${fN(S.emin,2)}) y al otro conductor como máximo <b>${fN(S.ojoMax,2)} lx</b> (límite ${fN(E_LIM,1)}).`;
  if(ok){
    RETOS.fallos2=0; sonido.bien(); const rg=rangoM(r);
    feedback('good','¡Lo conseguiste! ✓',`${cifras} ${rg?`Con ${fN(r.N,0)} LED y esa fuerza, cualquier margen entre <b>${fN(rg[0],1)}°</b> y <b>${fN(rg[1],1)}°</b> habría servido: si es más corto, el retraso de la cámara (${fN(E.tau,2)} s) deja pasar luz al otro; si es más ancho, se apaga también al peatón. La ventana está en el interior.`:''}`,true);
    pintaHUD(); paso('diag'); iniciaDiag();
  } else {
    RETOS.fallos2++; sonido.mal();
    let msg=cifras+' ';
    if(!S.okOjo) msg+='Le diste <b>demasiada luz al otro conductor</b>: la cámara ve al coche con retraso y, al moverse, su cara queda fuera de la zona oscura. Ensancha el margen o mejora la resolución. ';
    if(!S.okPed) msg+=trag?'Tu zona oscura se <b>tragó al peatón</b>: el margen es muy ancho o los LED muy gruesos, y al apagar los que apuntan al coche se apagan también los del peatón. ':'El peatón <b>no recibe luz suficiente</b>: sube la fuerza (la ropa oscura o la lluvia piden más lux). ';
    if(RETOS.fallos2>=4){ RETOS.fallos2=0; RETOS.resiembras++; feedback('bad','Cuatro validaciones sin lograrlo',msg+'Cambia la situación.',true); prepararAjusta(); }
    else { feedback('bad','Todavía no',msg+`(validaciones fallidas: ${RETOS.fallos2}/4)`,true); pintaHUD(); }
  }
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const CASOS_DX=[
  {k:'camara',esc:'recta',modo:'matriz',N:64,m:0.75,nivel:0.8,tau:0.45,swivel:true},
  {k:'gruesa',esc:'curva',modo:'matriz',N:8,m:0.5,nivel:0.9,tau:0.15,swivel:true},
  {k:'tenue',esc:'oscura',modo:'matriz',N:32,m:1.0,nivel:0.35,tau:0.15,swivel:true},
  {k:'sinmargen',esc:'recta',modo:'matriz',N:64,m:0.0,nivel:0.8,tau:0.05,swivel:true},
];
const NOMBRE_DX={camara:'La cámara tarda demasiado',gruesa:'Los LED son demasiado gruesos',tenue:'La luz es demasiado débil',sinmargen:'La zona oscura no tiene margen'};
function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.k; let c; do{ c=pickOne(CASOS_DX); }while(c.k===p);
  GUIA.dx=c; GUIA.dxOk=false; GUIA.orden=barajar(CASOS_DX.map(x=>x.k));
  reiniciaCalculo(); pintaHUD(); pintaDockFijo();
}
function diagnostica(k){
  if(!GUIA.dx||GUIA.dxOk) return; RETOS.intentos++;
  if(k===GUIA.dx.k){
    GUIA.dxOk=true; RETOS.fallos3=0; sonido.bien();
    feedback('good','Diagnóstico correcto ✓',explicaDx(GUIA.dx.k),true);
    reiniciaCalculo(); pintaDockFijo(); paso('quiz'); iniciaQuiz();
  } else {
    RETOS.fallos3++; sonido.mal();
    if(RETOS.fallos3>=3){ RETOS.fallos3=0; RETOS.resiembras++; feedback('bad','Tres intentos fallidos','Es otro caso: mira en la primera gráfica dónde queda la zona oscura respecto al coche (franja azul) y al peatón, y compara la luz que recibe cada uno con su umbral.',true); iniciaDiag(); }
    else { feedback('bad','No es ese',noEs(k)+` (intentos fallidos: ${RETOS.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(k){
  if(k==='camara') return 'La zona oscura va corrida hacia atrás del coche: la cámara lo ve con mucho retraso y, cuando el coche se acerca, su borde queda fuera de la zona. El deslumbramiento se dispara justo al final, cuando el coche se mueve más rápido en ángulo.';
  if(k==='gruesa') return 'Con tan pocos LED cada uno ilumina muchos grados: al apagar el que apunta al coche se apaga también el que apuntaba al peatón. El otro conductor está a salvo, pero el peatón queda a oscuras.';
  if(k==='tenue') return 'La zona oscura está bien puesta y nadie sale deslumbrado, pero el faro manda poca luz: al peatón no le llega ni el umbral que necesita su ropa. Hay que subir la fuerza.';
  return 'La zona oscura es justa, del ancho exacto del coche: como la óptica difumina el borde de cada LED, se cuela un poco de luz sobre los extremos del parabrisas. Un margen pequeño lo arregla.';
}
function noEs(k){
  if(k==='camara') return 'Mira la zona oscura (franja naranja) respecto al coche (franja azul): aquí no va corrida hacia atrás.';
  if(k==='gruesa') return 'Cuenta los segmentos de la primera gráfica: aquí son muchos y finos.';
  if(k==='tenue') return 'Mira la luz que recibe el peatón: aquí sí alcanza su umbral.';
  return 'Mira la zona oscura: aquí sobra margen alrededor del coche.';
}
const QUIZ=[
  {q:'La luz de un faro llega a un peatón. Si el peatón está al doble de distancia, ¿cuánta luz le llega?',ok:'4 veces menos: la luz cae con el cuadrado de la distancia',mal:['La mitad','Igual, la luz no se pierde en el aire','2 veces más']},
  {q:'La cámara tarda en ver al coche que viene. ¿Qué conviene hacer con la zona oscura?',ok:'Ensancharla un margen para cubrir lo que el coche se movió',mal:['Hacerla más angosta que el coche','Apagar todo el faro','Subir la fuerza de la luz']},
  {q:'Con pocos LED muy gruesos, ¿qué riesgo hay al apagar los que apuntan al coche?',ok:'Que también se apague el peatón que está cerca del coche',mal:['Que el faro se funda','Que la cámara se vuelva más lenta','Que el otro conductor vea todavía más luz']},
];
function iniciaQuiz(){ el("feedback").classList.remove("show"); GUIA.quizN=0; cargaPregunta(); }
function cargaPregunta(){ const Q=QUIZ[GUIA.quizN], opts=barajar([Q.ok,...Q.mal]); GUIA.quiz={q:Q.q,opts,ok:opts.indexOf(Q.ok)}; GUIA.quizResp=-1; GUIA.quizCorrecta=GUIA.quiz.ok; pintaHUD(); }
function respondeQuiz(i){
  if(GUIA.quizResp>=0) return; GUIA.quizResp=i; const ac=i===GUIA.quiz.ok; if(ac) RETOS.quizAcierto++;
  if(ac) sonido.bien(); else sonido.mal();
  const ult=GUIA.quizN>=QUIZ.length-1;
  feedback(ac?'good':'bad',ac?'Correcto ✓':'No es esa',(ac?'':'La respuesta era: <b>'+GUIA.quiz.opts[GUIA.quiz.ok]+'</b>. ')+(ult?'Terminaste el laboratorio.':'Sigue con la siguiente.'),true);
  pintaHUD();
  if(ult){ RETOS.hecho=true; paso('completo'); }
}
function siguientePregunta(){ if(GUIA.quizN<QUIZ.length-1){ GUIA.quizN++; cargaPregunta(); } }

/* ---------- el enrutador de acciones ---------- */
function paso(p){ GUIA.paso=p; GUIA.phase=({calcula:0,ajusta:1,diag:2,quiz:2,completo:2})[p]; if(EST.modo==='reto'){ reiniciaCalculo(); pintaHUD(); } }
function handleAction(act,btn){
  switch(act){
    case 't-sig': tourParaAuto(); tourVa(TOUR.paso+1); break;
    case 't-atras': tourParaAuto(); tourVa(TOUR.paso-1); break;
    case 't-fin': tourParaAuto(); setMode('probar'); break;
    case 'check-v': checkCalcula(); break;
    case 'hint-v': { const r=GUIA.r1;
      if(RETOS.pistas===0){ RETOS.pistas=1; feedback('good','Pista 1 de 2',r&&r.tipo==='alcance'?'Primero calcula la luz mínima: <b>E<sub>mín</sub> = 0,20 / ρ</b>.':'El coche ocupa la mitad del ancho a cada lado del centro: <b>atan(0,9 / d)</b> es medio ángulo.'); }
      else if(RETOS.pistas===1){ RETOS.pistas=2; feedback('good','Pista 2 de 2',r&&r.tipo==='alcance'?'Como <b>E = I / d²</b>, despeja: <b>d = √(I / E<sub>mín</sub>)</b>.':'Duplica el medio ángulo y pásalo a grados: <b>2 · atan(0,9 / d) · 57,3</b>.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break; }
    case 'validar': validarAjusta(); break;
    case 'dx-camara': diagnostica('camara'); break; case 'dx-gruesa': diagnostica('gruesa'); break; case 'dx-tenue': diagnostica('tenue'); break; case 'dx-sinmargen': diagnostica('sinmargen'); break;
    case 'quiz-0': respondeQuiz(0); break; case 'quiz-1': respondeQuiz(1); break; case 'quiz-2': respondeQuiz(2); break; case 'quiz-3': respondeQuiz(3); break;
    case 'quiz-sig': siguientePregunta(); break;
    case 'restart': location.reload(); break;
  }
}

/* ---------- lo que la guía enseña en cada paso ---------- */
function contenidoGuia(){
  const tri=(n,v,m)=>`<span class="tries">intentos fallidos: <b id="${n}">${v}</b>/${m}</span>`;
  switch(GUIA.paso){
    case 'calcula': { const r=GUIA.r1;
      const teach=r.tipo==='alcance'
        ?`Un faro manda <b>${fN(r.I,0)} cd</b> hacia un peatón con ropa de reflectancia <b>${fN(r.rho,2)}</b>. Para verlo necesita <b>E<sub>mín</sub> = 0,20 / ρ</b> lux, y la luz que llega es <b>E = I / d²</b>.<div class="task">¿A qué distancia máxima (m) lo ves? ${tri('d_try',RETOS.fallos1,3)}</div>`
        :`El coche que viene mide <b>${fN(ANCHO_COCHE,1)} m</b> de ancho y está a <b>${fN(r.d,0)} m</b>.<div class="task">¿Cuántos grados ocupa en tu faro? ${tri('d_try',RETOS.fallos1,3)}</div>`;
      return {no:'Fase 1 · Reto 1',head:'Tu cálculo',title:r.tipo==='alcance'?'¿Hasta dónde ves?':'¿Cuántos grados ocupa el coche?',teach,
      acts:`<div class="calcrow"><input id="ansV" type="text" inputmode="decimal" autocomplete="off" placeholder="¿? ${r.tipo==='alcance'?'metros':'grados'}" aria-label="Tu resultado"><button class="b primary" data-act="check-v">✓ Comprobar</button></div><button class="pista" id="btnHint">¿Necesitas una pista? (máx. 2)</button>`}; }
    case 'ajusta': { const r=GUIA.r2; if(!r) return {no:'Fase 2 · Reto 2',head:'Tu ajuste',title:'Preparando el escenario…',teach:'',acts:''};
      return {no:'Fase 2 · Reto 2',head:'Tu ajuste',title:'Ve al peatón sin deslumbrar',
      teach:`Situación: <b>${r.esc.nombre.toLowerCase()}</b> (peatón con ${r.esc.ped.ropa}; cámara de <b>${fN(r.esc.tau,2)} s</b>). Meta: que el peatón reciba la luz que necesita y que al otro conductor no le lleguen más de <b>${fN(E_LIM,1)} lx</b>.<div class="why"><b>Ojo:</b> lo que le llega al otro conductor aparece al validar. ${tri('d_try2',RETOS.fallos2,4)}</div>`,
      acts:`${mandosReto(r)}<button class="b primary" data-act="validar">▶ Validar</button>`}; }
    case 'diag': { const ord=GUIA.orden||CASOS_DX.map(x=>x.k);
      return {no:'Fase 3 · Diagnóstico',head:'¿Qué le pasa?',title:'Averigua por qué falla este faro',
      teach:`Este faro no cumple. Mira la zona oscura respecto al coche y al peatón, y la luz que recibe cada uno.<div class="task">¿Cuál es la causa? ${tri('d_try3',RETOS.fallos3,3)}</div>`,
      acts:ord.map(k=>`<button class="b" data-act="dx-${k}">${NOMBRE_DX[k]}</button>`).join('')}; }
    case 'quiz': { const Q=GUIA.quiz; if(!Q) return {no:'',head:'',title:'',teach:'',acts:''}; const ya=GUIA.quizResp>=0;
      return {no:'Cierre · Pregunta '+(GUIA.quizN+1)+' de '+QUIZ.length,head:'Quiz',title:Q.q,teach:'',
      acts:Q.opts.map((o,i)=>`<button class="b ${ya?(i===Q.ok?'good':(i===GUIA.quizResp?'bad':'')):''}" data-act="quiz-${i}" ${ya?'disabled':''}>${o}</button>`).join('')+(ya&&GUIA.quizN<QUIZ.length-1?'<button class="b primary" data-act="quiz-sig">Siguiente →</button>':'')}; }
    case 'completo': return {no:'Laboratorio completado',head:'✓',title:'Calculaste, ajustaste y diagnosticaste',
      teach:`Acertaste ${RETOS.quizAcierto} de ${QUIZ.length} en el quiz. Vuelve a <b>Probar</b>, elige «Curva» y apaga la luz de curva: mira por qué el peatón se aleja del centro del haz.`,
      acts:`<button class="b primary" data-act="restart">↺ Reiniciar laboratorio</button>`};
  }
  return {no:'',head:'',title:'',teach:'',acts:''};
}
function htmlGuia(){
  const ps=['Calcula','Ajusta','Diagnostica'], C=contenidoGuia();
  const ok=i=>i<GUIA.phase||(i===2&&RETOS.hecho);
  return `<div class="pasos">${ps.map((t,i)=>`<span class="ps ${ok(i)?'ok':(i===GUIA.phase?'on':'')}"><i>${ok(i)?'✓':i+1}</i>${t}</span>`).join('')}</div>
  <div class="retoBox"><div class="rt"><span>${C.no}</span><span>${C.head}</span></div><h3>${C.title}</h3><div class="rq">${C.teach}</div><div class="opt" id="actOpt">${C.acts}</div></div>`;
}
/** Lo que corre en la calle en cada paso del reto (null: lo que digan los mandos). */
function guiaParams(){
  if(GUIA.paso==='calcula') return P('recta','matriz',32,1.0,0.8,'normal');
  if(GUIA.paso==='ajusta'&&GUIA.r2){ const r=GUIA.r2; return {esc:r.esc.id,modo:'matriz',N:r.N,m:r.m,nivel:r.nivel,tau:r.esc.tau,swivel:true}; }
  if((GUIA.paso==='diag'||GUIA.paso==='quiz'||GUIA.paso==='completo')&&GUIA.dx){ const c=GUIA.dx; return {esc:c.esc,modo:c.modo,N:c.N,m:c.m,nivel:c.nivel,tau:c.tau,swivel:c.swivel}; }
  return null;
}
/* ---------- los modos ---------- */
function setMode(m,forzar){
  if(!forzar&&(m===EST.modo||EST.autoRunning)) return;
  tourParaAuto();
  if(m==='reto'){ EST.modo='reto'; if(!GUIA.iniciado){ GUIA.iniciado=true; sorteaCaso1(); paso('calcula'); } }
  else if(m==='probar') EST.modo='probar';
  else { EST.modo='tour'; TOUR.paso=0; }
  document.body.classList.toggle('m-tour',EST.modo==='tour'); document.body.classList.toggle('m-probar',EST.modo==='probar'); document.body.classList.toggle('m-reto',EST.modo==='reto');
  el('feedback').classList.remove('show');
  if(EST.modo==='tour'){ tourVa(0,0.6); pintaBarras(); return; }
  SIM.t=0; reiniciaCalculo(); ponVista('todo',0.6); pintaHUD(); pintaDockFijo(); pintaBarras();
}

/* ---------- «Repetir el recorrido»: el mismo recorrido, pero avanza solo cada pocos segundos ---------- */
async function runAuto(){
  if(EST.autoRunning) return; EST.autoRunning=true; sonido.init(); TOUR.auto=true;
  EST.modo='tour'; document.body.classList.remove('m-probar','m-reto'); document.body.classList.add('m-tour'); tourVa(0,0.6); pintaBarras();

  TOUR.timer=setTimeout(avanza,9000);

/* ===================== 18. CÁMARAS =====================
   La escena se encuadra con el hueco que dejan la guía y el dock: la cámara se aleja lo justo para que la caja del
   «objeto» (ancho × alto en unidades) quepa entera en ese hueco, y la proyección se desplaza para centrarla en él.
   Además el objeto nunca pasa del 70 % del alto del lienzo. */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}
const anclaPed=()=>V3(PEATON.position.x,0.10,PEATON.position.z);
const anclaOtro=()=>V3(OTRO.position.x,0.10,OTRO.position.z);
const anclaCalle=()=>V3(0,0,-3.15);
const VISTAS={
  todo:{dir:V3(0.0,0.90,0.46),anc:anclaCalle,toff:V3(0,0,0),obj:()=>({w:7.0,h:7.7}),fov:34,tope:0.74},
  peaton:{dir:V3(0.0,0.80,0.60),anc:anclaPed,toff:V3(0,0,0),obj:()=>({w:2.3,h:2.0}),fov:34,tope:0.72},
  coche:{dir:V3(0.0,0.78,0.62),anc:anclaOtro,toff:V3(0,0,0),obj:()=>({w:2.3,h:2.0}),fov:34,tope:0.72},
  cenital:{dir:V3(0,1,0.07),anc:anclaCalle,toff:V3(0,0,0),obj:()=>({w:7.0,h:7.7}),fov:34,tope:0.74},
};
const CAM={off:V3(3,6,5),toff:V3(0,0,0),auto:true,previo:null,k:1,dur:1,psi:0};
const dirVista=v=>VISTAS[v].dir.clone();
function fovVista(v){ return innerWidth<innerHeight*0.9?46:VISTAS[v].fov; }
function distanciaFit(w,h,fov,tope){
  const Hu=huecoLibre(), W=innerWidth, Hh=innerHeight, tv=Math.tan(fov*Math.PI/360), th=tv*(W/Hh);
  const wF=Math.max(80,Hu.x1-Hu.x0)/W, hF=Math.max(80,Hu.y1-Hu.y0)/Hh;
  const D=1.06*Math.max(w/(2*th*wF),h/(2*tv*hF));
  return Math.max(D,h/(2*tv*(tope||0.66)));
}
function ofsDeseado(v){
  const V=VISTAS[v], o=V.obj(), fov=fovVista(v), D=distanciaFit(o.w,o.h,fov,V.tope);
  return {off:dirVista(v).normalize().multiplyScalar(D),toff:V.toff.clone(),fov};
}
function ponVista(v,dur){
  EST.vista=v; CAM.auto=true; CAM.dur=dur===undefined?1.0:dur;
  if(typeof pintaBarras==='function') pintaBarras();
  if(CAM.dur<=0.01){ const A=VISTAS[v].anc(), d=ofsDeseado(v); CAM.off.copy(d.off); CAM.toff.copy(d.toff); camera.fov=d.fov; camera.updateProjectionMatrix();
    camera.position.copy(A).add(CAM.off); controls.target.copy(A).add(CAM.toff); CAM.previo=A.clone(); }
}
function pasaCam(dt){
  const V=VISTAS[EST.vista], P=V.anc();
  if(CAM.auto){
    const d=ofsDeseado(EST.vista), k=1-Math.exp(-dt/Math.max(0.05,(CAM.dur||1)*0.30));
    CAM.off.lerp(d.off,k); CAM.toff.lerp(d.toff,k);
    if(Math.abs(camera.fov-d.fov)>0.05){ camera.fov+=(d.fov-camera.fov)*k; camera.updateProjectionMatrix(); }
    camera.position.copy(P).add(CAM.off); controls.target.copy(P).add(CAM.toff);
  } else if(CAM.previo){ const dP=P.clone().sub(CAM.previo); camera.position.add(dP); controls.target.add(dP); }
  CAM.previo=P.clone();
}
controls.addEventListener('start',()=>{ CAM.auto=false; });

/* ===================== 19. SONIDO (sintetizado) =====================
   Un zumbido grave de rodadura cuyo tono sigue a la velocidad del coche (muy atenuado) y los avisos de acierto y fallo. */
const sonido=(function(){
  let ctx=null,on=true,master=null,ult=0,zum=null,zg=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      zum=ctx.createOscillator(); zg=ctx.createGain(); zum.type='sawtooth'; zum.frequency.value=60; zg.gain.value=0; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=200; zum.connect(lp); lp.connect(zg); zg.connect(master); zum.start();
    }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); ult=f; }
  return {init,
    zumbido:(q)=>{ if(!ctx||!zum) return; const t=ctx.currentTime; zum.frequency.setTargetAtTime(38+q*50,t,0.15); zg.gain.setTargetAtTime(on&&q>0?0.008:0,t,0.15); },
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }, get freq(){ return ult; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});

/* ===================== 20. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.max(Math.min(devicePixelRatio,alta?2:1.5),Math.min(devicePixelRatio,1.5)>1?1.25:1));
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); if(typeof ponVista==='function'&&CALC) ponVista(EST.vista,0.001); centraEnHueco();
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 21. EL LAZO: UN SOLO RELOJ =====================
   El tiempo del escenario avanza dt·velocidad en cada cuadro, y con ESE tiempo se mueven el coche, las lecturas, la estimación
   y la elipse, y se dibujan las gráficas del dock. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0, tSon=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  const dtS=EST.pausa?0:dt, dtSim=dtS*EST.vel*LENTO;
  aplicaEscena(dtS,dtSim,dt);
  pasaCam(dt);
  if(t-tSon>0.4){ tSon=t; sonido.zumbido(!EST.pausa?0.6:0); }
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaGraficas(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos(); colocaFoco();
}

/* ===================== 22. ARRANQUE =====================
   Abre funcionando y con el recorrido en el paso 1: el faro ya ilumina la calle, el coche que viene se acerca con su zona oscura
   y el peatón espera, antes de que el alumno toque nada. */
disposicion();
reiniciaCalculo();
SIM.t=TOUR_PASOS[0].t0;
aplicaCalidad();
pintaHUD();
aplicaEscena(0.02,0.02);
pintaBarras();
ponVista('todo',0.001);
centraEnHueco();
pintaDockFijo();
cuadro();

/* ===================== 25. GANCHOS DE PRUEBA ===================== */
/** Mide el objeto en lo VISIBLE: se pinta sin suelo, edificios, farolas, halos ni brillos sobre magenta puro y se toma la caja de los píxeles que no son magenta.
 *  modo 'haz' (por defecto): el abanico de luz, los dos coches y el peatón · modo 'escena': además la calle. */
function mideObjeto(modo){
  const ocultos=[]; const oc=o=>{ if(o.visible){ o.visible=false; ocultos.push(o); } };
  scene.traverse(o=>{ if(o.userData&&o.userData.fondo) oc(o); if(o.isSprite) oc(o); });
  if(modo!=='escena'){ CALLE.children.forEach(oc); oc(HAZ.grid.mesh); }
  const bg=scene.background, fog=scene.fog; scene.background=null; scene.fog=null; renderer.setClearColor(0xff00ff,1);
  renderer.render(scene,camera);
  const c=renderer.domElement, W=c.width, H=c.height, t=document.createElement('canvas'); t.width=W; t.height=H; const g=t.getContext('2d',{willReadFrequently:true}); g.drawImage(c,0,0);
  const d=g.getImageData(0,0,W,H).data; let x0=1e9,x1=-1,y0=1e9,y1=-1;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=(y*W+x)*4; if(!(d[i]>235&&d[i+1]<30&&d[i+2]>235)){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  for(const o of ocultos) o.visible=true; scene.background=bg; scene.fog=fog; renderer.setClearColor(0x000000,1);
  const k=W/innerWidth; return {x0:x0/k,x1:x1/k,y0:y0/k,y1:y1/k,altoPx:(y1-y0)/k,anchoPx:(x1-x0)/k,fracAlto:(y1-y0)/H,fracAncho:(x1-x0)/W,hueco:huecoLibre(),W:innerWidth,H:innerHeight};
}

  cam(){ const r=v=>[+v.x.toFixed(3),+v.y.toFixed(3),+v.z.toFixed(3)]; return {pos:r(camera.position),target:r(controls.target),hueco:huecoLibre(),fps:FPS.v,fov:camera.fov}; },
  mideObjeto, objeto:mideObjeto,
};
window.__test=Object.assign(window.__test||{},{
