<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Estacionamiento automático en paralelo: geometría y sensores ultrasónicos — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#08161F;--panel:rgba(7,20,28,.88);--line:#21495C;--ink:#EAF4F8;
    --dim:#9BB8C4;--accent:#5BC8FF;--accent2:#A8E2FF;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cF:#5BC8FF;--cR:#FFA445;--cE:#3DDC97;--cG:#C8D6D2;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#0f2733;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#173748}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#031a20;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#031a20;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#8ad8ff}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#031a20}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#5BC8FF;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f87a0;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f90a8;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#031a20}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .escs{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
  .esc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px;font-size:11.5px;line-height:1.35;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);color:#c4d3e6}
  .esc .rs{font-weight:700;font-size:11px}.esc .rs.ok{color:var(--good)}.esc .rs.mal{color:#ff9a9a}
  .esc .pista{font-size:10.5px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#09121c;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(30,53,80,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-top{display:flex;gap:6px;align-items:stretch}
  .vol{flex:0 0 76px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid rgba(30,53,80,.9);position:relative;min-height:76px}
  .vol canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-fig{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,53,80,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f87a0}
  .dk-tit{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#a3bcd6;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c6da;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#0f2733;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfdcec;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  /* ---- el recorrido paso a paso y el aro que señala la pieza ---- */
  .tour{border:1px solid rgba(91,200,255,.38);background:rgba(91,200,255,.06);border-radius:12px;padding:10px 11px;display:flex;flex-direction:column;gap:7px}
  .tour .tn{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .tour .pts{display:flex;gap:5px}.tour .pts i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}.tour .pts i.on{background:var(--accent)}.tour .pts i.ok{background:var(--good)}
  .tour h3{font-size:16px;line-height:1.2}
  .tour .tx{font-size:13px;line-height:1.5;color:#d3e3ea}.tour .tx b{color:#fff}
  .tour .tb{display:flex;gap:6px}.tour .tb .b{flex:1}
  .tour .salta{align-self:flex-end;font-size:11px;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:0;font-family:inherit}
  .foco{position:fixed;z-index:14;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 3px rgba(91,200,255,.55),0 0 24px 6px rgba(91,200,255,.45);pointer-events:none;display:none;animation:pulso 1.5s ease-in-out infinite}
  @keyframes pulso{0%,100%{transform:scale(.88);opacity:.95}50%{transform:scale(1.12);opacity:.55}}
  @media (prefers-reduced-motion:reduce){.foco{animation:none}}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .onda{color:#8fd8ff;font-size:11px;display:none}.onda.on{display:inline}
  .hud .sub{font-size:11.5px;color:var(--dim);line-height:1.45}
  .hud .tabla{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:11.6px;margin:4px 0}.hud .tabla span:nth-child(odd){color:var(--dim)}.hud .tabla span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,18,30,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,18,30,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d3e6}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,18,30,.92);border:1px solid rgba(124,196,255,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,18,30,.84);border:1px solid rgba(124,196,255,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .chips{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .chip{font-size:11.5px;line-height:1.35;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--dim)}
  .chip b{color:var(--ink)} .chip small{font-size:10.5px;color:var(--dim)}
  .chip.ok{border-color:rgba(52,211,153,.5)} .chip.ok b{color:var(--good)} .chip.mal{border-color:rgba(244,71,94,.5)} .chip.mal b{color:#ff9aa8}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';

/* ============================================================
   LAB — ESTACIONAMIENTO AUTOMÁTICO EN PARALELO: GEOMETRÍA Y SENSORES ULTRASÓNICOS
   (Autotrónica · mecanica-157)

   Un coche pasa despacio frente a una fila de coches estacionados; un sensor ultrasónico de su costado mide el tiempo de vuelo del eco (d = c·t/2),
   encuentra el hueco y estima dónde están las caras de los dos vecinos. Con la cinemática de bicicleta (radio mínimo R = L/tanδ) planea una «S» de dos
   arcos en reversa y, si el hueco no alcanza, encadena más maniobras. La pasada, el eco, el hueco medido, el plan, el choque con los vecinos y las
   gráficas son un único modelo, en un bloque puro que un script de Node extrae TAL CUAL y verifica.
   ============================================================ */


/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO='\u202F';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }




/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos marcas— y lo prueba:
   lo que se prueba es lo que corre. */
/* FISICA:INICIO */
/* ---- Estacionamiento automático en paralelo: física pura (sin three). SI salvo donde se diga. ----
   Cinemática de bicicleta (rodadura sin deslizamiento a baja velocidad, Rajamani cap. 2; Paden et al. 2016 para el planificador de arcos):
   el punto de referencia es el CENTRO DEL EJE TRASERO (x, y), con rumbo θ (0 = mirando a +x, antihorario +). Con ruedas giradas δ y velocidad v
   (v < 0 = marcha atrás):  ẋ = v·cosθ,  ẏ = v·sinθ,  θ̇ = v·tanδ / L.  La curvatura es κ = tanδ / L y el radio mínimo de giro del eje trasero
   es R = L / tanδ_máx.  El mundo: la acera es la recta y = 0, los coches vecinos están pegados a ella y el hueco mide S entre ellos.
   El sensor ultrasónico mide tiempo de vuelo: d = c·t/2, con c = 331,3 + 0,606·T (T en °C). */
const DOSPI=Math.PI*2, RAD=Math.PI/180;
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const suave=t=>t*t*(3-2*t);

/* ---- El coche (un sedán mediano; mismas cotas que el modelo 3D) ---- */
const VEH={L:2.60, vd:0.85, vt:0.95, ancho:1.80, dMax:33*RAD, relVol:16, cham:0.22, vTramo:1.20};
VEH.largo=VEH.vt+VEH.L+VEH.vd;                                       // 4,40 m
VEH.rMinEje=VEH.L/Math.tan(VEH.dMax);                                 // radio mínimo del eje trasero a tope de volante
const radioDe=delta=>VEH.L/Math.tan(delta);                           // R = L / tanδ
const deltaDeVol=volGrados=>volGrados*RAD/VEH.relVol;                 // ángulo de las ruedas a partir del volante
const volDeDelta=d=>d*VEH.relVol/RAD;
const RESERVA=0.90;                                                   // el controlador no pide más del 90 % del giro máximo: deja reserva para corregir

/* ---- El sonido ---- */
const velSonido=T=>331.3+0.606*T;                                     // m/s
const distDeTiempo=(t,T)=>velSonido(T)*t/2;                           // d = c·t/2 (el pulso va y vuelve)
const tiempoDeDist=(d,T)=>2*d/velSonido(T);

/* ---- Geometría: polígonos convexos y distancia con signo ---- */
/** Rectángulo con las esquinas cortadas (octágono): [u0,u1] a lo largo, [n0,n1] a lo ancho, en el sistema del coche. */
function octagono(u0,u1,n0,n1,c){ return [[u0+c,n0],[u1-c,n0],[u1,n0+c],[u1,n1-c],[u1-c,n1],[u0+c,n1],[u0,n1-c],[u0,n0+c]]; }
const OCT_COCHE=octagono(-VEH.vt,VEH.L+VEH.vd,-VEH.ancho/2,VEH.ancho/2,VEH.cham);
function poseA(poly,x,y,th){ const c=Math.cos(th), s=Math.sin(th); return poly.map(([u,n])=>[x+u*c-n*s, y+u*s+n*c]); }
function cocheEn(x,y,th){ return poseA(OCT_COCHE,x,y,th); }
function ptSeg(px,py,ax,ay,bx,by){ const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy; let t=l2>0?((px-ax)*dx+(py-ay)*dy)/l2:0; t=t<0?0:(t>1?1:t); const qx=ax+t*dx-px, qy=ay+t*dy-py; return Math.sqrt(qx*qx+qy*qy); }
/** Separación entre dos polígonos convexos: > 0 es el hueco más corto entre ellos; ≤ 0 es que se tocan (−penetración mínima por ejes separadores). */
function separacion(P,Q){
  { let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9,c0=1e9,c1=-1e9,d0=1e9,d1=-1e9;                       // lejos: basta la separación de las cajas (cota inferior)
    for(const v of P){ if(v[0]<a0)a0=v[0]; if(v[0]>a1)a1=v[0]; if(v[1]<b0)b0=v[1]; if(v[1]>b1)b1=v[1]; }
    for(const v of Q){ if(v[0]<c0)c0=v[0]; if(v[0]>c1)c1=v[0]; if(v[1]<d0)d0=v[1]; if(v[1]>d1)d1=v[1]; }
    const gx=Math.max(c0-a1,a0-c1), gy=Math.max(d0-b1,b0-d1); if(Math.max(gx,gy)>1.5) return Math.max(gx,gy); }
  let pen=Infinity;
  for(const poly of [P,Q]) for(let i=0;i<poly.length;i++){
    const a=poly[i], b=poly[(i+1)%poly.length]; let nx=b[1]-a[1], ny=a[0]-b[0]; const l=Math.hypot(nx,ny); nx/=l; ny/=l;
    let p0=Infinity,p1=-Infinity,q0=Infinity,q1=-Infinity;
    for(const v of P){ const d=v[0]*nx+v[1]*ny; if(d<p0)p0=d; if(d>p1)p1=d; }
    for(const v of Q){ const d=v[0]*nx+v[1]*ny; if(d<q0)q0=d; if(d>q1)q1=d; }
    const solape=Math.min(p1,q1)-Math.max(p0,q0);       // > 0: se solapan en este eje
    if(solape<=0) { let m=Infinity;                       // hay eje separador: la distancia es el mínimo vértice–lado
      for(const [A,B] of [[P,Q],[Q,P]]) for(const v of A) for(let j=0;j<B.length;j++){ const d=ptSeg(v[0],v[1],B[j][0],B[j][1],B[(j+1)%B.length][0],B[(j+1)%B.length][1]); if(d<m)m=d; }
      return m; }
    if(solape<pen) pen=solape;
  }
  return -pen;
}

/* ---- La calle: acera, dos coches vecinos y el hueco de largo S ---- */
const CALLE={yAcera:0.10, yLado:0.30, anchoVec:1.80, largoB:4.60, largoA:4.20, gapLat:0.90};
CALLE.yLanda=CALLE.yLado+CALLE.anchoVec;                              // cara del vecino hacia la calzada: y = 2,10
CALLE.yFinal=CALLE.yLado+VEH.ancho/2;                                 // eje del coche ya estacionado: pegado a la línea de los vecinos
CALLE.yPaso=CALLE.yLanda+CALLE.gapLat+VEH.ancho/2;                    // eje del coche al pasar frente a los vecinos (0,90 m de la cara de ellos)
/** El mundo: la cara delantera del vecino de atrás B está en x = xB y la cara trasera del vecino de adelante A en x = xA; el hueco mide S = xA − xB. */
function mundo(S,xB){
  xB=xB||0; const xA=xB+S;
  const B=poseA(octagono(xB-CALLE.largoB,xB,CALLE.yLado,CALLE.yLanda,VEH.cham),0,0,0), A=poseA(octagono(xA,xA+CALLE.largoA,CALLE.yLado,CALLE.yLanda,VEH.cham),0,0,0);
  const acera=[[-60,-2],[90,-2],[90,CALLE.yAcera],[-60,CALLE.yAcera]];
  return {S,xA,xB,A,B,acera};
}
/* Las dos llantas del lado de la acera (la carrocería puede pasar por encima del bordillo; la llanta no). */
const RUEDA={larg:0.62, anch:0.215, lado:VEH.ancho/2-0.1075+0.025};
const OCT_RUEDAS=[octagono(-RUEDA.larg/2,RUEDA.larg/2,-RUEDA.lado-RUEDA.anch/2,-RUEDA.lado+RUEDA.anch/2,0.02), octagono(VEH.L-RUEDA.larg/2,VEH.L+RUEDA.larg/2,-RUEDA.lado-RUEDA.anch/2,-RUEDA.lado+RUEDA.anch/2,0.02)];
const BORDE_ACERA=0.10;                                                // la llanta puede acercarse a 5 cm del bordillo y la carrocería a 15 cm de un vecino: se compara con el mismo margen sumando 10 cm a la llanta
/** Hueco libre entre el coche y lo que lo rodea: {A, B} carrocería contra vecinos y acera = llanta más cercana al bordillo (+10 cm, ver arriba). */
function holguras(M,x,y,th){ const c=cocheEn(x,y,th); let ac=Infinity; for(const w of OCT_RUEDAS){ const d=separacion(poseA(w,x,y,th),M.acera); if(d<ac) ac=d; }
  return {A:separacion(c,M.A), B:separacion(c,M.B), acera:ac+BORDE_ACERA}; }
const holguraMin=h=>Math.min(h.A,h.B,h.acera);

/* ---- Paso circular exacto: avanza una longitud de arco s (con signo: < 0 es marcha atrás) con curvatura k = tanδ/L ---- */
function arco(est,k,s){
  const [x,y,th]=est;
  if(Math.abs(k)<1e-12) return [x+s*Math.cos(th), y+s*Math.sin(th), th];
  const th2=th+k*s;
  return [x+(Math.sin(th2)-Math.sin(th))/k, y-(Math.cos(th2)-Math.cos(th))/k, th2];
}
/** Los dos arcos y la recta de la «S»: ángulo de giro α para desplazarse lateralmente h con dos arcos iguales de radio R:  h = 2R(1 − cosα). */
const anguloS=(h,R)=>Math.acos(clamp(1-h/(2*R),-1,1));
const recorridoS=(h,R)=>{ const a=anguloS(h,R); return 2*R*Math.sin(a); };      // avance del eje trasero a lo largo de la calle = 2R·senα = √(4Rh − h²)



/* ---- El planificador: reversa con el volante a un lado hasta el punto de enderezar y, desde ahí, el volante al otro lado (la «S» de dos arcos);
   si un vecino lo impide, el tramo termina y se encadena un tramo hacia adelante con el volante hacia la acera y otra reversa (3, 5… tramos).
   Cada TRAMO es un movimiento continuo en una misma marcha: cambiar de marcha es una maniobra más. Arcos exactos; la holgura se mide contra los
   polígonos del mapa que el sistema CREE tener (el que midieron los sensores), con un margen de seguridad. Si al terminar queda menos de gMin delante
   o detrás, se centra con un tramo recto. ---- */
const PASO=0.02;                                                       // m de arco entre comprobaciones de choque
const PLAN={margen:0.15, gMin:0.25, maxTramos:9, tolY:0.03};           // margen de seguridad (m), hueco mínimo exigido al terminar (m), tramos máximos y tolerancia lateral (m)
const huecosFin=(Mp,e)=>({B:(e[0]-VEH.vt)-Mp.xB, A:Mp.xA-(e[0]+VEH.L+VEH.vd)});     // hueco libre detrás (hasta la cara delantera de B) y delante (hasta la cara trasera de A)
function planea(Mp,x0,prm){
  const R=prm.R, kR=1/R, m=prm.margen===undefined?PLAN.margen:prm.margen, yf=CALLE.yFinal, tolY=PLAN.tolY, maxT=prm.maxTramos||PLAN.maxTramos, gMin=prm.gMin===undefined?PLAN.gMin:prm.gMin;
  let est=[x0,prm.y0===undefined?CALLE.yPaso:prm.y0,0];
  const pts=[{x:est[0],y:est[1],th:est[2],k:0,dir:0,tr:0}], tramos=[]; let causa=null, ok=false;
  for(let it=0;it<maxT&&!ok;it++){
    const dir=(it%2===0)?-1:1, ini=pts.length-1; let paso=0, listo=false;
    for(let q=0;q<8000;q++){
      let k, s=dir*PASO, fin=false;
      if(dir<0){
        if(est[2]>1e-9){ const yEnd=est[1]-R*(1-Math.cos(est[2])); if(yEnd<=yf+0.004){ k=kR; const rest=est[2]/kR; if(rest<=PASO){ s=-rest; fin=true; } } else k=-kR; }
        else { if(Math.abs(est[1]-yf)<=tolY){ listo=true; break; } if(est[1]>yf) k=-kR; else break; }
      } else { if(est[2]<=1e-9) break; k=-kR; const rest=est[2]/kR; if(rest<=PASO){ s=rest; fin=true; } }
      const nx=arco(est,k,s); if(fin) nx[2]=0;
      if(holguraMin(holguras(Mp,nx[0],nx[1],nx[2]))<m){ causa='choque'; break; }
      est=nx; paso+=Math.abs(s); pts.push({x:est[0],y:est[1],th:est[2],k,dir,tr:it});
      if(fin){ if(dir<0&&Math.abs(est[1]-yf)<=tolY) listo=true; break; }
    }
    if(paso<0.03&&!listo){ causa=causa||'atascado'; break; }
    if(paso>=0.03) tramos.push({dir,ini,fin:pts.length-1,largo:paso});
    if(listo){ ok=true; break; }
  }
  if(ok){ causa=null;
    const g=huecosFin(Mp,est);
    if(Math.min(g.A,g.B)<gMin){
      const dx=(g.A-g.B)/2, dir=dx>0?1:-1, ultimo=tramos[tramos.length-1], mismo=ultimo.dir===dir; let paso=0, e2=est.slice(); const pts2=[];
      for(let q=0;q<4000&&paso<Math.abs(dx)-1e-9;q++){ const s=dir*Math.min(PASO,Math.abs(dx)-paso), nx=arco(e2,0,s); if(holguraMin(holguras(Mp,nx[0],nx[1],nx[2]))<m) break; e2=nx; paso+=Math.abs(s); pts2.push({x:e2[0],y:e2[1],th:e2[2],k:0,dir,tr:tramos.length-(mismo?1:0)}); }
      const g2=huecosFin(Mp,e2);
      if(Math.min(g2.A,g2.B)<gMin){ ok=false; causa='sin hueco'; }
      else { const ini=pts.length-1; for(const p of pts2) pts.push(p); est=e2; if(mismo) ultimo.fin=pts.length-1; else tramos.push({dir,ini,fin:pts.length-1,largo:paso}); }
    }
  }
  return {ok,causa,pts,tramos,n:tramos.length,fin:est};
}


/* ---- El sensor ultrasónico del costado derecho (en el guardabarros delantero): un cono de semiapertura β que mide el TIEMPO DE VUELO del eco
   más cercano: d = c·t/2. El haz se simula con rayos dentro del cono y se toma el eco que llega primero. Pita f veces por segundo, así que
   entre dos lecturas el coche avanza v/f metros: esa es la resolución con la que «ve» los bordes del hueco. ---- */
const SENSOR={u:3.0, n:-0.90, beta:30*RAD, rMax:4.5, rUmbral:2.0, f:10, nRayos:25, tAsum:20};
SENSOR.holgura=SENSOR.rUmbral*Math.sin(SENSOR.beta);                    // el eco de un vecino se oye hasta rUmbral·senβ antes/después de su cara: 1,0 m por lado
function rayoPoli(ox,oy,dx,dy,poly){
  let tm=Infinity;
  for(let i=0;i<poly.length;i++){ const a=poly[i], b=poly[(i+1)%poly.length], ex=b[0]-a[0], ey=b[1]-a[1], den=dx*ey-dy*ex; if(Math.abs(den)<1e-12) continue;
    const t=((a[0]-ox)*ey-(a[1]-oy)*ex)/den, u=((a[0]-ox)*dy-(a[1]-oy)*dx)/den; if(t>1e-9&&u>=0&&u<=1&&t<tm) tm=t; }
  return tm;
}
const PARED=[[-60,-4],[90,-4],[90,-1.0],[-60,-1.0]];                   // fachada o seto detrás de la acera: es lo que oye el sensor donde no hay coche
/** Distancia geométrica al eco más cercano dentro de un cono con eje en el ángulo ang (rad, en el plano de la calle) y semiapertura β (m), o Infinity si no hay eco a menos de rMax.
 *  Devuelve también el punto del eco {r, px, py}. */
function ecoDesde(M,ox,oy,ang,beta,rMax){
  beta=beta===undefined?SENSOR.beta:beta; rMax=rMax===undefined?SENSOR.rMax:rMax;
  let r=Infinity, px=NaN, py=NaN;
  for(let q=0;q<SENSOR.nRayos;q++){ const fi=ang-beta+2*beta*q/(SENSOR.nRayos-1), dx=Math.cos(fi), dy=Math.sin(fi);
    for(const P of [M.A,M.B,PARED]){ const t=rayoPoli(ox,oy,dx,dy,P); if(t<r){ r=t; px=ox+dx*t; py=oy+dy*t; } } }
  return r>rMax?{r:Infinity,px:NaN,py:NaN}:{r,px,py};
}
const ecoGeom=(M,sx,sy)=>ecoDesde(M,sx,sy,-Math.PI/2).r;
/** El sensor lateral derecho del coche en la pose (x, y, θ): origen y ángulo del eje del cono (apunta a la derecha del coche). */
function sensorLateral(x,y,th){ const c=Math.cos(th), s=Math.sin(th); return {ox:x+SENSOR.u*c-SENSOR.n*s, oy:y+SENSOR.u*s+SENSOR.n*c, ang:th-Math.PI/2}; }
/** Lo que LEE el sistema: el eco tarda t = 2d/c con la velocidad real del sonido (temperatura T) y el sistema lo convierte con la que supone (SENSOR.tAsum). */
function ecoLeido(M,sx,sy,T){ const r=ecoGeom(M,sx,sy); return isFinite(r)?distDeTiempo(tiempoDeDist(r,T),SENSOR.tAsum):Infinity; }

/** La pasada: el coche (eje trasero en xs0, rumbo 0) avanza a v por la calle a 0,90 m de la cara de los vecinos; el sensor pita cada 1/f s.
 *  Detecta el hueco entre el último eco de B y el primero de A y estima dónde están las dos caras (punto medio entre las dos lecturas que
 *  cruzan el umbral, menos/más lo que el cono se «come»). */
function mide(S,v,T,xs0){
  const M=mundo(S,0), dt=1/SENSOR.f, sy=CALLE.yPaso+SENSOR.n, mu=[];
  let estado=0, nCoche=0, iLibre=-1, jCoche=-1;
  for(let k=0;k<6000;k++){
    const t=k*dt, xr=xs0+v*t, sx=xr+SENSOR.u, r=ecoLeido(M,sx,sy,T), coche=r<SENSOR.rUmbral;
    mu.push({t,xr,sx,r,coche});
    if(estado===0){ if(coche){ nCoche++; if(nCoche>=2) estado=1; } else nCoche=0; }
    else if(estado===1){ if(!coche){ estado=2; iLibre=k; } }
    else if(estado===2){ if(coche){ estado=3; jCoche=k; break; } }
    if(sx>S+14) break;
  }
  if(estado<3) return {ok:false,mu,dx:v*dt};
  const sB=(mu[iLibre-1].sx+mu[iLibre].sx)/2, sA=(mu[jCoche-1].sx+mu[jCoche].sx)/2;
  const xBh=sB-SENSOR.holgura, xAh=sA+SENSOR.holgura;
  return {ok:true,mu,iLibre,jCoche,dx:v*dt,xBh,xAh,Sest:xAh-xBh,sB,sA,tA:mu[jCoche].t,xrA:mu[jCoche].xr};
}


/* ---- Los escenarios del reto: el largo real del hueco, la temperatura, cuántas maniobras se permiten y si hay tráfico detrás esperando ---- */
const ESCENARIOS=[
  {id:'amplio',nombre:'Calle tranquila · hueco amplio',desc:'hueco de 7,4 m, 20 °C, poca prisa',S:7.4,T:20,nMax:1,tPasoMax:16},
  {id:'justo',nombre:'Hueco justo',desc:'hueco de 6,9 m, 20 °C: una sola maniobra y no hay mucho tiempo',S:6.9,T:20,nMax:1,tPasoMax:12},
  {id:'corto',nombre:'Hueco corto con tráfico',desc:'hueco de 6,4 m, 5 °C: hasta 3 maniobras y alguien espera detrás',S:6.4,T:5,nMax:3,tPasoMax:10},
];
const escPorId=id=>ESCENARIOS.find(e=>e.id===id)||ESCENARIOS[0];
const XS0=-7.5;                                                        // eje trasero al empezar la pasada (m): el sensor arranca frente a la mitad del coche B
const VOL_MAX=volDeDelta(VEH.dMax);                                    // 528° de volante = 33° en las ruedas
const LIM={toque:0.05, hueco:0.15, aFrena:3.0, vTramo:1.0, aTramo:0.8, tPlan:1.2, tCambio:1.0, tFinal:1.5, rateRueda:40*RAD, tDecide:0.1};   // m, m, m/s², m/s, m/s², s, s, s, rad/s, s

/** Corre todo de principio a fin con los mandos del alumno: prm = {kmh, vol (° de volante), a (m: dónde para, medido desde la cara de A que cree el sistema)}. */
function corre(esc,prm){
  const v=prm.kmh/3.6, delta=deltaDeVol(Math.min(prm.vol,VOL_MAX)), R=radioDe(delta), S=esc.S, M=mundo(S,0);
  const sen=mide(S,v,esc.T,XS0);
  const res={esc,prm,v,delta,R,Sreal:S,dxPing:v/SENSOR.f,sen,detectado:sen.ok,volFrac:prm.vol/VOL_MAX};
  if(!sen.ok){ res.plan=null; res.ok=false; res.causa='no se vio el hueco'; res.n=0; res.cumple={detecta:false,sinToque:false,maniobras:false,huecos:false,reserva:res.volFrac<=RESERVA,tiempo:false}; return res; }
  res.eA=sen.xAh-S; res.eB=sen.xBh-0;                                       // error con que el sistema cree dónde están las caras (m)
  const Mp=mundo(sen.Sest,sen.xBh);                                         // el mapa que el sistema CREE tener
  // dónde frena: x0 = cara de A estimada + a; y no puede frenar antes de lo que su frenada le deja
  const xb=sen.xrA+v*LIM.tDecide, dMin=v*v/(2*LIM.aFrena);
  let x0=sen.xAh+prm.a; if(x0<xb+dMin) x0=xb+dMin;
  res.x0=x0; res.xb=xb;
  const plan=planea(Mp,x0,{R}); res.plan=plan; res.ok=plan.ok; res.causa=plan.causa; res.n=plan.n;
  // se ejecuta el recorrido planeado en la calle REAL
  let hmin=Infinity, hA=Infinity, hB=Infinity, hAc=Infinity;
  for(const p of plan.pts){ const h=holguras(M,p.x,p.y,p.th); if(h.A<hA)hA=h.A; if(h.B<hB)hB=h.B; if(h.acera<hAc)hAc=h.acera; }
  hmin=Math.min(hA,hB,hAc-BORDE_ACERA+LIM.toque);                           // la llanta puede rozar a 5 cm; la carrocería, no
  res.hA=hA; res.hB=hB; res.hAcera=hAc-BORDE_ACERA; res.hmin=Math.min(hA,hB,res.hAcera);
  const e=plan.fin, gf=huecosFin(M,e); res.gA=gf.A; res.gB=gf.B; res.xFin=e[0]; res.yFin=e[1]; res.thFin=e[2];
  res.tPaso=0;       // se completa en la línea de tiempo
  const L=linea(res); res.L=L; res.tPaso=L.tPaso;
  res.cumple={
    detecta:true,
    sinToque:plan.ok&&Math.min(hA,hB)>=LIM.toque&&res.hAcera>=0.0,
    maniobras:plan.ok&&plan.n<=esc.nMax,
    huecos:plan.ok&&gf.A>=LIM.hueco&&gf.B>=LIM.hueco,
    reserva:res.volFrac<=RESERVA+1e-9,
    tiempo:esc.tPasoMax===null||L.tPaso<=esc.tPasoMax,
  };
  return res;
}
const cumpleTodo=r=>{ const c=r.cumple; return c.detecta&&c.sinToque&&c.maniobras&&c.huecos&&c.reserva&&c.tiempo; };

/* ---- La línea de tiempo: UN reloj para la pasada, el frenado, el cálculo, cada tramo con su cambio de marcha y el volante con su velocidad
   máxima de giro. Se muestrea cada DTS s. ---- */
const DTS=0.02;
function perfilTrapecio(Ltot,vmax,acc){                                   // s(τ) con aceleración constante, crucero y frenada simétrica
  const dAc=vmax*vmax/(2*acc);
  if(Ltot>=2*dAc){ const tAc=vmax/acc, tCr=(Ltot-2*dAc)/vmax; return {T:2*tAc+tCr, s:t=>{ if(t<=0) return 0; if(t<tAc) return 0.5*acc*t*t; if(t<tAc+tCr) return dAc+vmax*(t-tAc); const u=Math.min(t-tAc-tCr,tAc); return dAc+vmax*tCr+vmax*u-0.5*acc*u*u; }}; }
  const vp=Math.sqrt(acc*Ltot), tAc=vp/acc;                               // triangular
  return {T:2*tAc, s:t=>{ if(t<=0) return 0; if(t<tAc) return 0.5*acc*t*t; const u=Math.min(t-tAc,tAc); return Ltot/2+vp*u-0.5*acc*u*u; }};
}
function linea(res){
  const v=res.v, sen=res.sen, plan=res.plan, out={t:[],x:[],y:[],th:[],dl:[],gear:[],vv:[],fase:[]};
  let t=0, dl=0, x=XS0, y=CALLE.yPaso, th=0, gear=1, vel=v, fase=0;
  const empuja=(tt)=>{ out.t.push(tt); out.x.push(x); out.y.push(y); out.th.push(th); out.dl.push(dl); out.gear.push(gear); out.vv.push(vel); out.fase.push(fase); };
  const mueveVolante=(meta,dt)=>{ const d=meta-dl, mx=LIM.rateRueda*dt; dl+=Math.abs(d)<=mx?d:Math.sign(d)*mx; };
  // 1 · pasada a velocidad constante hasta que el sistema decide (oyó la cara de A) y frenada hasta x0
  const tb=sen.tA+LIM.tDecide, xb=XS0+v*tb;
  const dFren=Math.max(res.x0-xb,v*v/(2*LIM.aFrena)), ab=v*v/(2*dFren), tFr=v/ab;
  res.tb=tb; res.tFren=tFr;
  for(;t<tb;t+=DTS){ x=XS0+v*t; vel=v; gear=1; fase=0; empuja(t); }
  for(let u=0;u<tFr;u+=DTS,t+=DTS){ x=xb+v*u-0.5*ab*u*u; vel=v-ab*u; fase=1; empuja(t); }
  x=xb+dFren; vel=0; gear=0; fase=2; res.tParo=t;
  const tPaso=t;                                                          // el tiempo que le tomó llegar a donde para
  // 2 · el sistema piensa (y gira el volante hacia donde lo pide el primer tramo)
  const tr0=plan&&plan.pts.length>1?plan.pts[1].k:0;
  for(let u=0;u<LIM.tPlan;u+=DTS,t+=DTS){ mueveVolante(Math.atan(tr0*VEH.L),DTS); empuja(t); }
  // 3 · los tramos del plan
  if(plan&&plan.pts.length>1){
    const P=plan.pts;
    for(let i=0;i<plan.tramos.length;i++){
      const tm=plan.tramos[i];
      if(i>0){ const kNext=P[tm.ini+1].k; for(let u=0;u<LIM.tCambio;u+=DTS,t+=DTS){ mueveVolante(Math.atan(kNext*VEH.L),DTS); gear=0; vel=0; fase=2; empuja(t); } }
      // longitud de arco acumulada del tramo
      const sc=[0]; for(let j=tm.ini+1;j<=tm.fin;j++) sc.push(sc[sc.length-1]+Math.hypot(P[j].x-P[j-1].x,P[j].y-P[j-1].y));
      const Lt=sc[sc.length-1], pf=perfilTrapecio(Lt,LIM.vTramo,LIM.aTramo); let j=0;
      for(let u=0;u<pf.T;u+=DTS,t+=DTS){ const s=pf.s(u); while(j<sc.length-2&&sc[j+1]<s) j++;
        const f=sc[j+1]>sc[j]?clamp((s-sc[j])/(sc[j+1]-sc[j]),0,1):0, a=P[tm.ini+j], b=P[tm.ini+j+1];
        x=a.x+(b.x-a.x)*f; y=a.y+(b.y-a.y)*f; th=a.th+(b.th-a.th)*f; gear=tm.dir; vel=tm.dir*(j<sc.length-2||u<pf.T-DTS?(pf.s(u+DTS)-pf.s(u))/DTS:0); fase=3;
        mueveVolante(Math.atan(b.k*VEH.L),DTS); empuja(t); }
      const q=P[tm.fin]; x=q.x; y=q.y; th=q.th; vel=0; gear=0;
    }
  }
  // 4 · quieto, ya estacionado
  for(let u=0;u<LIM.tFinal;u+=DTS,t+=DTS){ mueveVolante(0,DTS); fase=4; empuja(t); }
  out.N=out.t.length; out.T=t; out.tPaso=tPaso;
  return out;
}


/* ---- La «S» de libro en forma cerrada y el hueco mínimo para una sola maniobra ----
   Dos arcos iguales de radio R y ángulo α (h = 2R(1 − cosα)): el eje trasero recorre 2R·senα a lo largo de la calle. Con el eje trasero en (x0, y0) al empezar,
   el primer arco lo lleva a (x0 − R·senθ, y0 − R(1 − cosθ)) con rumbo θ y el segundo deshace el giro. */
const H_LAT=CALLE.yPaso-CALLE.yFinal;                                   // cuánto hay que correr de lado: 2,70 m
function poseS(R,x0,t){                                                 // t ∈ [0, 2α]: posición y rumbo del eje trasero a lo largo de la «S»
  const al=anguloS(H_LAT,R);
  if(t<=al) return [x0-R*Math.sin(t), CALLE.yPaso-R*(1-Math.cos(t)), t];
  const x1=x0-R*Math.sin(al), y1=CALLE.yPaso-R*(1-Math.cos(al)), ph=2*al-t;
  return [x1+R*(Math.sin(ph)-Math.sin(al)), y1+R*(Math.cos(al)-Math.cos(ph)), ph];
}
/** Hasta dónde puede estar adelantado el eje trasero respecto de la cara trasera del vecino A (a, m) para que la «S» no se le acerque a menos del margen. */
function aMaxS(R,margen){
  const M=mundo(60,0), al=anguloS(H_LAT,R), N=70; margen=margen===undefined?PLAN.margen:margen;
  const libre=a=>{ for(let i=0;i<=N;i++){ const p=poseS(R,60+a,i/N*2*al); if(separacion(cocheEn(p[0],p[1],p[2]),M.A)<margen) return false; } return true; };
  let lo=-3, hi=4; for(let i=0;i<20;i++){ const m=(lo+hi)/2; if(libre(m)) lo=m; else hi=m; } return lo;
}
/** Hueco mínimo para estacionar en UNA maniobra con un volante dado (° de volante): el coche termina con gMin detrás, empezando lo más adelantado que permite A. */
function huecoMin1(volGrados){
  const R=radioDe(deltaDeVol(Math.min(volGrados,VOL_MAX)));
  return PLAN.gMin+VEH.vt+recorridoS(H_LAT,R)-aMaxS(R);
}
/** Ángulos de las dos ruedas delanteras para un giro del eje trasero de radio con signo Rc = L/tanδ (Ackermann): la interior gira más. */
function angulosRuedas(delta){
  if(Math.abs(delta)<1e-9) return [0,0];
  const Rc=VEH.L/Math.tan(delta), t=1.55;                                 // t: vía (m)
  return [Math.atan(VEH.L/(Rc-t/2)), Math.atan(VEH.L/(Rc+t/2))];         // [izquierda, derecha]
}

function ruidoPeriodico(semilla,periodo){

    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);

/** Junta una pieza hecha de muchas mallas en una malla por material: así una rueda con 40 piezas cuesta pocas llamadas. */
function fusiona(grupo){
  grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map();
  grupo.traverse(o=>{ if(!o.isMesh) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(), m=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);
    g.applyMatrix4(m);

    const k=o.material; if(!por.has(k)) por.set(k,[]); por.get(k).push(g); });
  const out=new THREE.Group();
  for(const [mat,gs] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count;
      pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry();

/** Una carrocería «lofteada»: anillos de superelipse que se estrechan hacia los extremos.
 *  secs: [{x, w (semianchura), y0, y1, n (exponente), tum (estrechamiento arriba, 0..1)}]. */
function lofteo(secs,seg=28){
  const pos=[],idx=[],nR=secs.length;
  for(const s of secs){
    const yc=(s.y0+s.y1)/2, hh=Math.max(1e-3,(s.y1-s.y0)/2), ex=2/(s.n||3);
    for(let k=0;k<seg;k++){
      const th=k/seg*DOSPI, c=Math.cos(th), sn=Math.sin(th);
      const yy=yc+hh*Math.sign(sn)*Math.pow(Math.abs(sn),ex), f=(yy-s.y0)/(2*hh);
      const zz=Math.max(1e-3,s.w)*(1-(s.tum||0)*f*f)*Math.sign(c)*Math.pow(Math.abs(c),ex);
      pos.push(s.x,yy,zz);
    }
  }
  const cI=pos.length/3; pos.push(secs[0].x,(secs[0].y0+secs[0].y1)/2,0); pos.push(secs[nR-1].x,(secs[nR-1].y0+secs[nR-1].y1)/2,0);
  for(let i=0;i<nR-1;i++) for(let k=0;k<seg;k++){
    const a=i*seg+k, b=i*seg+(k+1)%seg, c2=(i+1)*seg+k, d=(i+1)*seg+(k+1)%seg;
    idx.push(a,c2,b, b,c2,d);
  }
  for(let k=0;k<seg;k++){ idx.push(cI,k,(k+1)%seg); idx.push(cI+1,(nR-1)*seg+(k+1)%seg,(nR-1)*seg+k); }

  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx);

  let vol=0; for(let i=0;i<idx.length;i+=3){ const a=idx[i]*3,b=idx[i+1]*3,c3=idx[i+2]*3;
    vol+=pos[a]*(pos[b+1]*pos[c3+2]-pos[b+2]*pos[c3+1])-pos[a+1]*(pos[b]*pos[c3+2]-pos[b+2]*pos[c3])+pos[a+2]*(pos[b]*pos[c3+1]-pos[b+1]*pos[c3]); }
  if(vol<0) for(let i=0;i<idx.length;i+=3){ const t=idx[i+1]; idx[i+1]=idx[i+2]; idx[i+2]=t; }

  let nOnda=0;
  if(e.fase<=1){
    for(let j=0;j<ONDAS.length;j++){ const kp=kUlt-j, w=ONDAS[j]; if(kp<0){ w.visible=false; continue; } const tp=kp*per, edad=SIM.t-tp; if(edad>vida||edad<0){ w.visible=false; continue; }
      let r=ECO_CACHE.get(kp); if(r===undefined){ const kk=clamp(Math.round(tp/DTS),0,L.N-1), s2=sensorLateral(L.x[kk],L.y[kk],L.th[kk]), q=ecoDesde(C.M,s2.ox,s2.oy,s2.ang); r={r:q.r,ox:s2.ox,oy:s2.oy,th:L.th[kk]}; ECO_CACHE.set(kp,r); }
      const tope=isFinite(r.r)?r.r:SENSOR.rMax, rad=Math.min(V_ONDA*edad,tope), pasada=V_ONDA*edad>tope?Math.min(1,(V_ONDA*edad-tope)/(0.15*V_ONDA)):0;
      w.visible=true; w.position.set(r.ox,0.45,WZ(r.oy)); w.rotation.y=r.th; w.scale.set(rad,1,rad); w.material.opacity=0.75*(1-edad/vida)*(1-pasada); nOnda++; }
  } else for(const w of ONDAS) w.visible=false;
  SIM.ondas=nOnda;
  // ---- el hueco medido, el punto de frenado, la huella y las siluetas ----
  const visto=C.sen.ok&&SIM.t>=C.sen.tA;
  SLOT.fill.visible=SLOT.borde.visible=visto; PARADA.visible=visto;
  TRAIL.geo.setDrawRange(0,Math.max(0,Math.min(TRAIL.n-1,Math.floor(e.k/C.trailK)))*6);
  { let c=0; while(c<FANT.n&&FANT.tt[c]<=SIM.t) c++; FANT.geo.setDrawRange(0,c*16); }
  PLANV.mesh.visible=verPlanAhora()&&PLANV.mesh.count>0;
  // ---- el círculo de giro con el volante de este instante ----
  const kc=Math.tan(e.dl)/VEH.L, ver=circuloAhora()&&Math.abs(e.dl)>1.5*RAD&&e.fase>=2;
  for(const o of [CIRC.aro,CIRC.radio,CIRC.centro]) o.visible=ver;
  if(ver){ const Rr=1/Math.abs(kc), cx=e.x-Math.sin(e.th)/kc, cy=e.y+Math.cos(e.th)/kc;
    CIRC.aro.position.set(cx,0.04,WZ(cy)); CIRC.aro.scale.set(Rr,1,Rr); CIRC.centro.position.set(cx,0.04,WZ(cy));
    const p=CIRC.radio.geometry.attributes.position; p.setXYZ(0,cx,0.045,WZ(cy)); p.setXYZ(1,e.x,0.045,WZ(e.y)); p.needsUpdate=true; CIRC.radio.geometry.computeBoundingSphere(); }
  // ---- los vecinos se tiñen de rojo si el coche se les acerca a menos del margen ----
  for(const [pint,g] of [[pintA,e.gA],[pintB,e.gB]]){ const q=clamp(1-g/LIM.hueco,0,1); pint.emissive.set('#ff2a3a'); pint.emissiveIntensity+=((q*0.9)-pint.emissiveIntensity)*clamp(dtR*10,0,1); }
  // ---- la luz del sol acompaña al hueco ----
  LUZ.sol.target.position.set(C.esc.S/2,0,-2); LUZ.sol.position.set(C.esc.S/2-3,11,6);
  // ---- el sonido: un tic suave por cada pitido del sensor y, al maniobrar, el pitido de proximidad de los sensores de parking ----
  if(!EST.pausa&&typeof sonido!=='undefined'){
    if(e.fase<=1&&kUlt!==ultPing&&dtSim>0) sonido.tic();
    if(e.fase===3&&e.vv!==0){ const g=e.gMin, ints=clamp(g*1.1,0.12,1.0); ultBip+=dtR; if(g<0.9&&ultBip>=ints){ ultBip=0; sonido.bip(g<LIM.hueco); } }
  }
  ultPing=kUlt;
}

  H.innerHTML=h; H.classList.toggle('guia',EST.modo!=='probar'); enlazaHUD(); ajustaHoja();

function enlazaHUD(){
  const H=el('hud'), re=()=>{ reiniciaCalculo(); };

/* ===================== 14. EL DOCK (derecha): cifras y gráficas DOM ===================== */
const FUENTE="'Outfit',system-ui,sans-serif";
function lienzo(id){ const box=el(id), c=box.querySelector('canvas'); return {box,c,ctx:c.getContext('2d'),w:0,h:0,dpr:1}; }
function abre(L){ const r=L.box.getBoundingClientRect(), dpr=Math.min(3,window.devicePixelRatio||1);
  const w=Math.max(20,Math.round(r.width)), h=Math.max(20,Math.round(r.height));
  if(L.w!==w||L.h!==h||L.dpr!==dpr){ L.c.width=Math.round(w*dpr); L.c.height=Math.round(h*dpr); L.w=w; L.h=h; L.dpr=dpr; }
  const x=L.ctx; x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h); return x; }
function txt(x,t,px,py,col,size,align,peso){ x.fillStyle=col; x.font=(peso||'600')+' '+(size||11)+'px '+FUENTE; x.textAlign=align||'left'; x.textBaseline='alphabetic'; x.fillText(t,px,py); }
function raya(x,x1,y1,x2,y2,col,w,dash){ x.strokeStyle=col; x.lineWidth=w||1; x.setLineDash(dash||[]); x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke(); x.setLineDash([]); }
const LFU=lienzo('gFu'), LSO=lienzo('gTr'), LCO=lienzo('gFr'), LVE=lienzo('gSp'), LVO=lienzo('gVol');
const COL={e:'#58d6ff',libre:'#FFB703',vol:'#3DDC97',rev:'rgba(255,176,59,0.18)',avd:'rgba(111,224,255,0.16)',peligro:'rgba(244,71,94,0.20)',pelLin:'#ff6b7c',hueco:'rgba(61,220,151,0.20)',huecoLin:'#7dffc0',real:'rgba(200,215,225,0.55)'};
const GRID='rgba(160,200,220,0.10)', EJE='#3f6a80', TXT='#8eb3c5';
function cursorT(x,X,Y0,Y1){ const px=X(SIM.t); raya(x,px,Y0,px,Y1,'rgba(255,255,255,0.85)',1.2); }
function ejeY(x,X0,X1,Y,vals,fmt){ let ult=-99; for(const v of vals){ raya(x,X0,Y(v),X1,Y(v),GRID); if(Math.abs(Y(v)-ult)>=11){ ult=Y(v); txt(x,fmt?fmt(v):String(v),X0-4,Y(v)+3,TXT,8.5,'right','500'); } } }
function ejeXt(x,X,Hd,paso,T){ for(let t=0;t<=T;t+=paso){ raya(x,X(t),Hd-14,X(t),Hd-11,EJE); txt(x,String(t),X(t),Hd-3,TXT,8.5,'center','500'); } }
/* bandas de marcha: ámbar = reversa, celeste = adelante */
function bandasMarcha(x,X,Y0,Y1,C){ const L=C.L; let ini=-1, g=0;
  for(let k=0;k<=L.N;k+=2){ const gg=k<L.N&&L.fase[k]===3?L.gear[k]:0; if(gg!==g){ if(g!==0){ x.fillStyle=g<0?COL.rev:COL.avd; x.fillRect(X(L.t[ini]),Y0,X(L.t[Math.min(k,L.N-1)])-X(L.t[ini]),Y1-Y0); } g=gg; ini=k; } } }

/* ---- lo que oye el sensor: la distancia del eco en cada pitido, a lo largo de la calle ---- */
function pintaSensor(){
  const x=abre(LFU), Wd=LFU.w, Hd=LFU.h, C=CALC; if(!C) return;
  const X0=30, X1=Wd-8, Y0=8, Y1=Hd-16, XA=-5, XB=17, RM=5, X=s=>X0+(s-XA)/(XB-XA)*(X1-X0), Y=r=>Y1-r/RM*(Y1-Y0), sen=C.sen, mu=sen.mu;
  x.save(); x.beginPath(); x.rect(X0,Y0,X1-X0,Y1-Y0); x.clip();
  // lo que hay de verdad (sólo cuando ya no es el misterio del reto): la distancia al coche o al seto
  if(!ocultaVerdad()){ x.strokeStyle=COL.real; x.lineWidth=1; x.beginPath(); const pv=C.perfilVerdad; for(let i=0;i<pv.length;i++){ const px=X(-5+i*0.1), py=Y(pv[i]); i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke(); }
  // el hueco medido
  if(sen.ok&&SIM.t>=sen.tA){ x.fillStyle=COL.hueco; x.fillRect(X(sen.sB),Y0,X(sen.sA)-X(sen.sB),Y1-Y0); raya(x,X(sen.sB),Y0,X(sen.sB),Y1,COL.huecoLin,1,[3,3]); raya(x,X(sen.sA),Y0,X(sen.sA),Y1,COL.huecoLin,1,[3,3]); }
  // los pitidos ya dados
  for(let k=0;k<mu.length;k++){ const q=mu[k]; if(q.t>SIM.t) break; const car=q.coche, py=Y(isFinite(q.r)?q.r:RM-0.12);
    x.fillStyle=car?COL.e:COL.libre; x.beginPath(); x.arc(X(q.sx),py,2.3,0,DOSPI); x.fill(); }
  x.restore();
  ejeY(x,X0,X1,Y,[0,1,2,3,4,5],v=>String(v));
  for(let s=-5;s<=17;s+=5){ raya(x,X(s),Hd-14,X(s),Hd-11,EJE); txt(x,String(s),X(s),Hd-3,TXT,8.5,'center','500'); }
  raya(x,X0,Y(SENSOR.rUmbral),X1,Y(SENSOR.rUmbral),COL.pelLin,1,[4,3]); txt(x,'umbral '+fN(SENSOR.rUmbral,1)+' m',X1-3,Y(SENSOR.rUmbral)-3,COL.pelLin,8.5,'right','600');
  txt(x,'m del eco',X0+4,Y0+8,TXT,8.5,'left','600'); txt(x,'calle (m)',X1,Hd-3,TXT,8.5,'right','600');
  if(sen.ok&&SIM.t>=sen.tA){ const cx=(X(sen.sB)+X(sen.sA))/2; txt(x,'hueco medido '+fN(sen.Sest,2)+' m',cx,Y0+20,COL.huecoLin,9.5,'center','700'); }
  const e=SIM.e; if(e&&e.fase<=1){ const sx=e.x+SENSOR.u; raya(x,X(sx),Y0,X(sx),Y1,'rgba(255,255,255,0.85)',1.2); }
  el('t_fu').textContent='un pitido cada '+fN(C.dxPing*100,0)+' cm';
}
function pintaLeySensor(){
  el('leyFu').innerHTML=`<span class="lg"><i class="bl" style="--c:${COL.e}"></i>eco de un coche</span><span class="lg"><i class="bl" style="--c:${COL.libre}"></i>eco lejano: hueco</span><span class="lg"><i class="bl" style="--c:rgba(61,220,151,.5)"></i>hueco que mide</span>`;

/* ---- el volante y la marcha ---- */
function pintaVolante(){
  const x=abre(LSO), Wd=LSO.w, Hd=LSO.h, C=CALC; if(!C) return;
  const T=C.L.T, X0=28, X1=Wd-6, Y0=6, Y1=Hd-14, X=t=>X0+t/T*(X1-X0), RM=VOL_MAX*1.08, Y=v=>(Y0+Y1)/2-v/RM*((Y1-Y0)/2), L=C.L, f=VEH.relVol/RAD;
  x.save(); x.beginPath(); x.rect(X0,Y0,X1-X0,Y1-Y0); x.clip();
  bandasMarcha(x,X,Y0,Y1,C);
  x.strokeStyle=COL.vol; x.lineWidth=1.8; x.beginPath(); for(let k=0;k<L.N;k+=4){ const px=X(L.t[k]), py=Y(L.dl[k]*f); k?x.lineTo(px,py):x.moveTo(px,py); } x.stroke();
  x.restore();
  ejeY(x,X0,X1,Y,[-500,0,500],v=>fN(v,0)); raya(x,X0,Y(0),X1,Y(0),'rgba(160,200,220,0.28)',1);
  raya(x,X0,Y(VOL_MAX),X1,Y(VOL_MAX),COL.pelLin,1,[4,3]); raya(x,X0,Y(-VOL_MAX),X1,Y(-VOL_MAX),COL.pelLin,1,[4,3]);
  cursorT(x,X,Y0,Y1); txt(x,'° de volante',X0+3,Y0+8,TXT,8.5,'left','600');

}
/* ---- el margen a los vecinos en el tiempo (cm): por debajo de 15 cm el planificador no se atreve; en 0 se tocan ---- */
function pintaMargen(){
  const x=abre(LCO), Wd=LCO.w, Hd=LCO.h, C=CALC, e=SIM.e; if(!C||!e) return;
  const T=C.L.T, X0=26, X1=Wd-6, Y0=6, Y1=Hd-14, X=t=>X0+t/T*(X1-X0), RM=100, Y=v=>Y1-Math.max(0,Math.min(v,RM))/RM*(Y1-Y0), n=C.hs.length/3, ST=C.hsST;
  x.save(); x.beginPath(); x.rect(X0,Y0,X1-X0,Y1-Y0); x.clip();
  bandasMarcha(x,X,Y0,Y1,C);
  x.fillStyle=COL.peligro; x.fillRect(X0,Y(LIM.hueco*100),X1-X0,Y1-Y(LIM.hueco*100));
  x.strokeStyle='#ffd166'; x.lineWidth=1.6; x.beginPath(); for(let i=0;i<n;i++){ const px=X(i*ST*DTS), py=Y(Math.min(C.hs[i*3],C.hs[i*3+1])*100); i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke();
  x.strokeStyle='rgba(160,200,220,0.65)'; x.lineWidth=1; x.beginPath(); for(let i=0;i<n;i++){ const px=X(i*ST*DTS), py=Y((C.hs[i*3+2]-BORDE_ACERA+LIM.toque)*100); i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke();
  x.restore();
  ejeY(x,X0,X1,Y,[0,25,50,100],v=>String(v)); raya(x,X0,Y(LIM.hueco*100),X1,Y(LIM.hueco*100),COL.pelLin,1,[4,3]);
  cursorT(x,X,Y0,Y1); txt(x,'cm',X0+3,Y0+8,TXT,8.5,'left','600');
  el('t_fr').textContent=e.fase>=2?fN(e.gMin*100,0)+' cm':'';
}
/* ---- el hueco mínimo para una sola maniobra según el volante, con el hueco que midió el sistema ---- */
const S0C=new Map();                                              // volante redondeado a 20° → hueco mínimo
const s0Clave=v=>Math.round(clamp(v,MIN_VOL,VOL_MAX)/20)*20;

   y guía e instrumentos comparten una hoja con pestañas abajo. */
function disposicion(){
  const W=innerWidth, b=document.body;
  const estrecho=W<1080, movil=W<640;
  b.classList.toggle('estrecho',estrecho); b.classList.toggle('movil',movil); b.classList.toggle('ancho',estrecho&&!movil);
  if(estrecho){ if(!b.classList.contains('t-hud')&&!b.classList.contains('t-panel')) b.classList.add('t-hud'); ajustaHoja(); }
  el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('on',b.classList.contains('t-'+t.dataset.tab)));
}
function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.40:0.43),240,450));
  let hh=base; const hud=el('hud');
  if(movil&&b.classList.contains('t-panel')) hh=Math.round(clamp(H*0.55,240,540));
  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;
    hh=Math.round(clamp(pide,240,Math.max(base,H*(movil?0.45:0.56)))); }
  const ant=parseFloat(b.style.getPropertyValue('--hojaH'))||0;
  if(Math.abs(ant-hh)>1){ b.style.setProperty('--hojaH',hh+'px'); colocaBarras(); centraEnHueco(); }
}

   Al abrir el lab arranca solo un recorrido de siete pasos que explica, sin siglas sin definir, qué se ve: el sensor que oye, el eco, por qué pasar rápido
   emborrona los bordes, el círculo de giro, la «S», el hueco corto con más maniobras y tu turno. Cada paso lleva la cámara a su pieza y la señala con un aro. */
const TOUR={paso:0,auto:false,timer:null};
/** Instante en que el sensor lateral está frente a la posición sx de la calle durante la pasada. */
const tSensorEn=(C,sx)=>Math.max(0,(sx-SENSOR.u-XS0)/C.v);
/** Instante en una fracción del tramo i (1, 2…) de la maniobra. */
function tTramo(C,i,fr){ const L=C.L; let a=-1,b=-1; for(let k=0;k<L.N;k++){ if(C.tramoK[k]===i&&L.fase[k]===3){ if(a<0) a=k; b=k; } } if(a<0) return Math.max(0,L.T-LIM.tFinal-0.5); return L.t[a]+(L.t[b]-L.t[a])*fr; }
const posSensor=()=>EGO.localToWorld(V3(SENSOR.u,0.45,-SENSOR.n));
const posEje=()=>EGO.localToWorld(V3(0,0.35,0));
const posRuedasDel=()=>EGO.localToWorld(V3(VEH.L,0.35,0.9));
const posHuecoMedido=()=>CALC&&CALC.sen.ok?mundoDe(CALC.sen.xBh+CALC.sen.Sest/2,CALLE.yLado+0.9,0.05):mundoDe(3.5,1.2,0.05);
const posEco=()=>ECO.punto.visible?ECO.punto.position.clone():posSensor();
const PAR_BIEN={esc:'amplio',kmh:8,vol:470,a:1.3};
const TOUR_PASOS=[
  {t:'Un coche que busca hueco',vista:'todo',foco:posSensor,par:PAR_BIEN,t0:()=>0.4,
   x:()=>'Este coche va a estacionarse <b>solo</b> entre los dos coches parados. Primero pasa despacio y <b>escucha</b> con un sensor de ultrasonido en su costado derecho (el punto con el aro).'},
  {t:'Mide con el eco',vista:'todo',foco:posEco,par:PAR_BIEN,t0:C=>tSensorEn(C,-2.4),
   x:()=>'El sensor lanza un <b>pitido</b> y mide cuánto tarda en volver el eco. La distancia es <b>velocidad del sonido × tiempo ÷ 2</b>, porque el sonido va y vuelve. Frente a un coche el eco vuelve pronto; frente al hueco, mucho más tarde.'},
  {t:'Pasar rápido emborrona los bordes',vista:'cenital',foco:posHuecoMedido,par:{esc:'amplio',kmh:18,vol:470,a:1.3},t0:C=>tSensorEn(C,2.2),
   x:()=>`El sensor pita sólo ${SENSOR.f} veces por segundo. A 18 km/h el coche avanza <b>${fN(18/3.6/SENSOR.f*100,0)} cm entre pitidos</b>, y el borde del hueco queda con esa incertidumbre. Despacio, la medida es mucho más fina.`},
  {t:'El volante manda el radio de giro',vista:'cenital',foco:posEje,par:{esc:'amplio',kmh:8,vol:528,a:1.3},circulo:true,t0:C=>tTramo(C,1,0.4),
   x:()=>`Con las ruedas giradas un ángulo δ, el coche recorre un círculo de radio <b>R = L ÷ tan δ</b>, con L = ${fN(VEH.L,2)} m entre ejes. A tope de volante R = <b>${fN(VEH.rMinEje,1)} m</b>: no puede girar más cerrado.`},
  {t:'Dos arcos: la «S»',vista:'cenital',foco:posEje,par:PAR_BIEN,t0:C=>tTramo(C,1,0.25),
   x:()=>`Marcha atrás con el volante a un lado y, a mitad de camino, al otro: una <b>S de dos arcos iguales</b>. Corre el coche ${fN(H_LAT,1)} m de lado y lo deja paralelo a la acera en <b>una sola maniobra</b>.`},
  {t:'Hueco más justo, más maniobras',vista:'cenital',foco:posRuedasDel,par:{esc:'corto',kmh:9,vol:470,a:1.2},t0:C=>tTramo(C,2,0.5),
   x:C=>`En un hueco justo, la S no cabe de una. El coche se mide, <b>cambia de marcha</b> y corrige: cada cambio es una <b>maniobra más</b>. Aquí necesita ${C&&C.plan?C.plan.n:'varias'}, y hay menos margen con los vecinos.`},
  {t:'Tu turno',vista:'todo',foco:null,par:PAR_BIEN,t0:C=>tTramo(C,1,0.1),
   x:()=>'Tú decides la <b>velocidad</b> al pasar, el <b>giro del volante</b> y <b>dónde se detiene</b> antes de retroceder. Pulsa «Probar yo» y busca que entre sin rozar a nadie.'},
];
function tourParams(){ const p=TOUR_PASOS[TOUR.paso]; return p?p.par:null; }
const circuloAhora=()=>EST.circulo||(EST.modo==='tour'&&!!TOUR_PASOS[TOUR.paso].circulo);
function htmlTour(){
  const P=TOUR_PASOS[TOUR.paso], n=TOUR_PASOS.length, ult=TOUR.paso===n-1;
  const pts=TOUR_PASOS.map((_,i)=>`<i class="${i<TOUR.paso?'ok':(i===TOUR.paso?'on':'')}"></i>`).join('');
  return `<div class="tour"><div class="tn"><span>Paso ${TOUR.paso+1} de ${n}</span><span class="pts">${pts}</span></div><h3>${P.t}</h3><p class="intro tx">${P.x(CALC)}</p>
    <div class="tb">${TOUR.paso>0?'<button class="b" data-act="t-atras">← Atrás</button>':''}${ult?'<button class="b primary" data-act="t-fin">Probar yo →</button>':'<button class="b primary" data-act="t-sig">Siguiente →</button>'}</div>
    ${ult?'':'<button class="salta" data-act="t-fin">Saltar el recorrido</button>'}</div>`;
}
function tourVa(n,ms){
  TOUR.paso=clamp(n,0,TOUR_PASOS.length-1); const P=TOUR_PASOS[TOUR.paso];
  reiniciaCalculo(); SIM.t=clamp(P.t0(CALC),0,CALC.L.T-0.1); SIM.salto=true; ponVista(P.vista,ms===undefined?1.0:ms); pintaHUD(); pintaDockFijo();
}
function tourParaAuto(){ clearTimeout(TOUR.timer); TOUR.auto=false; EST.autoRunning=false; }

/* ===================== 19. EL RETO: CALCULA, AJUSTA, DIAGNOSTICA =====================
   Tres fases: 1 · Calcula (a qué distancia está el coche por el tiempo del eco, y qué radio de giro da un ángulo de ruedas); 2 · Ajusta (velocidad al pasar, giro del volante y
   punto de arranque para un hueco: sin tocar a nadie, en pocas maniobras, con 15 cm libres y sin pedir más del 90 % del giro; la ventana es INTERIOR y los números del
   veredicto sólo aparecen al validar) y 3 · Diagnostica (¿por qué falla este sistema?, sólo con lo que se ve en el dock). Cierra con un quiz de tres preguntas. */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETOS={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'calcula',iniciado:false,dxOk:false,r1:null,r2:null,dx:null,orden:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0};

/* ---------- Fase 1 · Calcula: distancia por el eco y radio de giro ---------- */
const CASOS_TOF=[{T:20,ms:5.8},{T:0,ms:6.2},{T:30,ms:4.6},{T:-10,ms:7.4},{T:35,ms:9.0},{T:20,ms:11.7}];
const CASOS_RAD=[{g:33},{g:25},{g:20},{g:28},{g:15},{g:30}];
const distEco=(ms,T)=>distDeTiempo(ms/1000,T);
function sorteaCaso1(){
  const p=GUIA.r1&&GUIA.r1.tof&&GUIA.r1.tof.ms+'|'+GUIA.r1.tof.T, q=GUIA.r1&&GUIA.r1.rad&&GUIA.r1.rad.g;
  let a,b; do{ a=pickOne(CASOS_TOF); }while(a.ms+'|'+a.T===p); do{ b=pickOne(CASOS_RAD); }while(b.g===q);
  GUIA.r1={sub:GUIA.r1?GUIA.r1.sub:0,tof:Object.assign({},a,{res:distEco(a.ms,a.T),c:velSonido(a.T)}),rad:Object.assign({},b,{res:radioDe(b.g*RAD)})};
}
function numeroDe(txt){ const raw=String(txt||'').trim().replace(/\s/g,'').replace(/ /g,'').replace(',','.'); return parseFloat(raw); }
function checkCalcula(){
  const v=numeroDe((el('ansV')||{}).value), r=GUIA.r1, sub=r.sub, ok=sub===0?r.tof.res:r.rad.res, tol=sub===0?0.02:0.05;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe el resultado en metros (con coma o punto decimal).'); return; }
  RETOS.intentos++;
  if(Math.abs(v-ok)<=tol){
    RETOS.fallos1=0; sonido.bien();
    if(sub===0){
      feedback('good','¡Correcto! ✓',`A ${fN(r.tof.T,0)} °C el sonido va a c = 331,3 + 0,606·${fN(r.tof.T,0)} = <b>${fN(r.tof.c,1)} m/s</b>. El eco tardó ${fN(r.tof.ms,1)} ms ida y vuelta, así que d = c·t/2 = <b>${fN(ok,2)} m</b>. Ahora el radio de giro.`,true);
      r.sub=1; pintaHUD();
    } else {
      feedback('good','¡Correcto! ✓',`Con las ruedas giradas ${fN(r.rad.g,0)}°, R = L / tan δ = ${fN(VEH.L,2)} / tan ${fN(r.rad.g,0)}° = <b>${fN(ok,2)} m</b>. Cuanto más giradas las ruedas, más cerrado el círculo.`,true);
      paso('ajusta'); prepararAjusta();
    }
  } else {
    RETOS.fallos1++; sonido.mal();
    if(RETOS.fallos1>=3){ RETOS.fallos1=0; RETOS.resiembras++; sorteaCaso1(); feedback('bad','Tres intentos fallidos',sub===0?'Cambia el caso. Recuerda: d = c·t/2, con t en segundos y c = 331,3 + 0,606·T.':'Cambia el caso. Recuerda: R = L / tan δ, con L = 2,60 m.'); reiniciaCalculo(); pintaHUD(); }
    else { feedback('bad','Revisa el cálculo',(sub===0&&v>ok*1.7?'Te quedó una distancia muy grande: ¿olvidaste dividir entre 2 (el sonido va y vuelve)? ':'')+(sub===0?'Pasa los milisegundos a segundos y calcula c con la temperatura del caso.':'Usa la tangente del ángulo de las ruedas, no el seno.')+` (intentos fallidos: ${RETOS.fallos1}/3)`); const t=el('d_try'); if(t) t.textContent=RETOS.fallos1; }
  }
}

/* ---------- Fase 2 · Ajusta velocidad, volante y punto de arranque ---------- */
function prepararAjusta(){
  let e; do{ e=pickOne(ESCENARIOS); }while(GUIA.r2&&ESCENARIOS.length>1&&e.id===GUIA.r2.esc.id);
  GUIA.r2={esc:e,kmh:14,vol:300,a:0.0,validado:false,res:null,intentos:0,ventana:null};
  reiniciaCalculo(); pintaHUD();
}
/** Rangos que cumplen todo con los otros dos mandos como están (se calculan por pasos para no congelar la pantalla). */
async function ventanas(r){
  const esc=r.esc, base={kmh:r.kmh,vol:r.vol,a:r.a}, out={}, pasos=[['kmh',MIN_KMH,MAX_KMH,2],['vol',MIN_VOL,Math.round(VOL_MAX),12],['a',MIN_A,MAX_A,0.1]];
  for(const [campo,lo,hi,st] of pasos){ let a=null,b=null;
    for(let v=lo;v<=hi+1e-9;v+=st){ const p=Object.assign({},base,{[campo]:+v.toFixed(3)}), res=corre(esc,p); if(cumpleTodo(res)){ if(a===null) a=p[campo]; b=p[campo]; } await new Promise(r2=>setTimeout(r2,0)); }
    out[campo]=a===null?null:[a,b]; }
  return out;
}
function validarAjusta(){
  const r=GUIA.r2; if(!r) return;
  const E=r.esc, C=CALC; r.res=C; r.validado=true; r.intentos++; RETOS.intentos++;
  const c=C.cumple, ok=cumpleTodo(C);
  reiniciaCalculo(); SIM.t=0;
  const sen=C.sen, pedido=sen.ok?sen.xAh+C.prm.a:NaN, paso=sen.ok?C.x0-pedido:0;
  const cifras=sen.ok?`El sistema midió <b>${fN(sen.Sest,2)} m</b> y el hueco real era <b>${fN(C.Sreal,2)} m</b> (un error de ${fN(Math.abs(sen.Sest-C.Sreal)*100,0)} cm con un pitido cada ${fN(C.dxPing*100,0)} cm). Se detuvo ${paso>0.03?fN(paso*100,0)+' cm después de lo pedido, porque frenar tarda':'donde pediste'}. ${C.plan&&C.plan.ok?`Hizo <b>${C.n}</b> maniobra${C.n>1?'s':''} (se permiten ${E.nMax}); el margen más justo fue <b>${fN(C.hmin*100,0)} cm</b> (se piden 15, sin tocar) y quedó a ${fN(Math.min(C.gA,C.gB)*100,0)} cm del vecino más cercano. `:'Se rindió: no le cupo. '}El volante llegó al <b>${fN(C.volFrac*100,0)} %</b> del tope (máximo ${fN(RESERVA*100,0)} %).${E.tPasoMax?` La pasada duró <b>${fN(C.tPaso,1)} s</b> (máximo ${fN(E.tPasoMax,0)} s: alguien espera detrás).`:''}`:'No alcanzó a ver el hueco.';
  if(ok){
    RETOS.fallos2=0; sonido.bien();
    feedback('good','¡Lo conseguiste! ✓',cifras+' Calculando cuánto margen tenías…',true);
    pintaHUD(); paso2('diag'); iniciaDiag();
    ventanas(r).then(w=>{ r.ventana=w; const f=(a,u,d)=>a?fN(a[0],d)+' a '+fN(a[1],d)+u:'—';
      if(GUIA.paso==='diag') feedback('good','¡Lo conseguiste! ✓',cifras+` Con tus otros dos mandos, la velocidad podía ser de <b>${f(w.kmh,' km/h',0)}</b>, el volante de <b>${f(w.vol,'°',0)}</b> y el punto de parada de <b>${f(w.a,' m',2)}</b>. Muy lento incumple el tiempo o no lo ves; muy rápido el sensor se equivoca y frena tarde; con poco volante no cabe y con todo el volante no queda reserva: la ventana está en el interior.`,true); });
  } else {
    RETOS.fallos2++; sonido.mal();
    let msg=cifras+' ';
    if(!c.detecta) msg+='Baja la velocidad para que el sensor alcance a ver el hueco. ';
    else {
      if(C.plan&&!C.plan.ok) msg+=(C.volFrac<0.75?'Con tan poco volante el radio es grande y la «S» no cabe: gira más. ':'Con ese punto de arranque el coche queda demasiado cerca de un vecino: mueve dónde se detiene. ');
      else if(!c.sinToque) msg+='Rozó a un vecino: el sensor se equivocó por la separación entre pitidos o el punto de parada quedó mal. Pasa más despacio. ';
      if(c.sinToque&&!c.maniobras) msg+='Necesitó más maniobras de las permitidas: más volante o mejor punto de parada. ';
      if(c.sinToque&&c.maniobras&&!c.huecos) msg+='Terminó demasiado pegado a un vecino (menos de 15 cm). ';
      if(!c.reserva) msg+='Pediste más del 90 % del giro: sin reserva, el controlador no puede corregir. ';
      if(!c.tiempo) msg+='Pasaste tan despacio que se pasó el tiempo (alguien espera detrás): sube la velocidad al pasar. ';
    }
    if(RETOS.fallos2>=4){ RETOS.fallos2=0; RETOS.resiembras++; feedback('bad','Cuatro validaciones sin lograrlo',msg+'Cambia el hueco.',true); prepararAjusta(); }
    else { feedback('bad','Todavía no',msg+`(validaciones fallidas: ${RETOS.fallos2}/4)`,true); pintaHUD(); }
  }
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const CASOS_DX=[
  {k:'rapido',esc:'justo',kmh:20,vol:450,a:1.3},
  {k:'giro',esc:'justo',kmh:8,vol:300,a:1.3},
  {k:'adelante',esc:'justo',kmh:8,vol:450,a:2.0},
  {k:'atras',esc:'justo',kmh:8,vol:450,a:-0.4},
];
const NOMBRE_DX={rapido:'Pasó demasiado rápido',giro:'Giró poco el volante',adelante:'Se detuvo demasiado adelantado',atras:'Se detuvo demasiado atrás'};
function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.k; let c; do{ c=pickOne(CASOS_DX); }while(c.k===p);
  GUIA.dx=c; GUIA.dxOk=false; GUIA.orden=barajar(CASOS_DX.map(x=>x.k));
  reiniciaCalculo(); SIM.t=0; pintaHUD(); pintaDockFijo();
}
function diagnostica(k){
  if(!GUIA.dx||GUIA.dxOk) return; RETOS.intentos++;
  if(k===GUIA.dx.k){
    GUIA.dxOk=true; RETOS.fallos3=0; sonido.bien();
    feedback('good','Diagnóstico correcto ✓',explicaDx(GUIA.dx.k),true);
    reiniciaCalculo(); pintaDockFijo(); paso2('quiz'); iniciaQuiz();
  } else {
    RETOS.fallos3++; sonido.mal();
    if(RETOS.fallos3>=3){ RETOS.fallos3=0; RETOS.resiembras++; feedback('bad','Tres intentos fallidos','Es otro caso: mira cada cuánto pitó el sensor, el radio de giro frente al hueco mínimo de una maniobra, y dónde paró el coche.',true); iniciaDiag(); }
    else { feedback('bad','No es ese',noEs(k)+` (intentos fallidos: ${RETOS.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(k){
  if(k==='rapido') return 'Pasó a 20 km/h: el sensor da un pitido cada medio metro, el borde del hueco queda con esa incertidumbre y además el coche frena tarde: se detiene más allá del punto previsto y el plan ya no le sirve.';
  if(k==='giro') return 'Con ese volante el radio es grande y el hueco mínimo para una sola maniobra (curva amarilla) queda por encima del hueco medido: la «S» no cabe y el sistema se rinde tras zigzaguear.';
  if(k==='adelante') return 'Se detuvo con el eje trasero muy adelantado: al retroceder, la esquina trasera se acerca al coche de adelante antes de entrar en el hueco y el sistema se rinde en el primer movimiento.';
  return 'Se detuvo demasiado atrás: la «S» lo deja pegado al coche de atrás antes de terminar. Aunque el hueco alcanzaba para una maniobra con ese volante, no queda sitio y se rinde tras varias idas y vueltas.';
}
function noEs(k){
  if(k==='rapido') return 'Mira la separación entre lecturas en el dock: aquí no es grande y el coche se detuvo donde debía.';
  if(k==='giro') return 'Compara el radio con el hueco mínimo: aquí el hueco medido sí alcanza para una maniobra con ese volante.';
  if(k==='adelante') return 'Mira dónde se detuvo y cómo termina: aquí no se rinde en el primer movimiento.';
  return 'Mira cómo termina: aquí no se pega al coche de atrás.';
}
const QUIZ=[
  {q:'El eco tarda 6 ms en volver. ¿Por qué la distancia es c·t/2 y no c·t?',ok:'Porque el sonido va hasta el coche y vuelve: el trayecto es el doble de la distancia',mal:['Porque el sonido se frena al rebotar','Porque el sensor sólo mide la mitad del cono','Porque el eco viaja más lento que el pitido']},
  {q:'Si pasas el doble de rápido frente al hueco, ¿qué pasa con el borde que mide el sensor?',ok:'Hay el doble de distancia entre lecturas, así que el borde queda con el doble de incertidumbre',mal:['El eco tarda el doble en volver','El cono se hace más ancho y ve mejor','No cambia: el sonido es mucho más rápido que el coche']},
  {q:'Giras más el volante (ruedas más giradas). ¿Qué pasa con el hueco mínimo para estacionar en una maniobra?',ok:'Disminuye: el radio de giro es menor y la «S» cabe en menos calle',mal:['Aumenta, porque el coche se mueve más','No cambia: sólo depende del largo del coche','Aumenta, porque el sensor ve menos']},
];
function iniciaQuiz(){ el('feedback').classList.remove('show'); GUIA.quizN=0; cargaPregunta(); }
function cargaPregunta(){ const Q=QUIZ[GUIA.quizN], opts=barajar([Q.ok,...Q.mal]); GUIA.quiz={q:Q.q,opts,ok:opts.indexOf(Q.ok)}; GUIA.quizResp=-1; GUIA.quizCorrecta=GUIA.quiz.ok; pintaHUD(); }
function respondeQuiz(i){
  if(GUIA.quizResp>=0) return; GUIA.quizResp=i; const ac=i===GUIA.quiz.ok; if(ac) RETOS.quizAcierto++;
  if(ac) sonido.bien(); else sonido.mal();
  const ult=GUIA.quizN>=QUIZ.length-1;
  feedback(ac?'good':'bad',ac?'Correcto ✓':'No es esa',(ac?'':'La respuesta era: <b>'+GUIA.quiz.opts[GUIA.quiz.ok]+'</b>. ')+(ult?'Terminaste el laboratorio.':'Sigue con la siguiente.'),true);
  pintaHUD();
  if(ult){ RETOS.hecho=true; paso2('completo'); }
}
function siguientePregunta(){ if(GUIA.quizN<QUIZ.length-1){ GUIA.quizN++; cargaPregunta(); } }

/* ---------- el enrutador de acciones ---------- */
function paso2(p){ GUIA.paso=p; GUIA.phase=({calcula:0,ajusta:1,diag:2,quiz:2,completo:2})[p]; if(EST.modo==='reto'){ reiniciaCalculo(); pintaHUD(); } }
const paso=paso2;
function handleAction(act,btn){
  switch(act){
    case 't-sig': tourParaAuto(); tourVa(TOUR.paso+1); break;
    case 't-atras': tourParaAuto(); tourVa(TOUR.paso-1); break;
    case 't-fin': tourParaAuto(); setMode('probar'); break;
    case 'check-v': checkCalcula(); break;
    case 'hint-v': {
      const sub=GUIA.r1?GUIA.r1.sub:0;
      if(RETOS.pistas===0){ RETOS.pistas=1; feedback('good','Pista 1 de 2',sub===0?'La velocidad del sonido es <b>c = 331,3 + 0,606·T</b> (T en °C), en m/s. Los milisegundos se dividen entre 1000.':'El radio es <b>L ÷ tan δ</b>: la tangente, con la calculadora en grados.'); }
      else if(RETOS.pistas===1){ RETOS.pistas=2; feedback('good','Pista 2 de 2',sub===0?'El eco va y vuelve: la distancia es <b>la mitad</b> de c·t.':'Con L = 2,60 m.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break; }
    case 'validar': validarAjusta(); break;
    case 'dx-rapido': diagnostica('rapido'); break; case 'dx-giro': diagnostica('giro'); break; case 'dx-adelante': diagnostica('adelante'); break; case 'dx-atras': diagnostica('atras'); break;
    case 'quiz-0': respondeQuiz(0); break; case 'quiz-1': respondeQuiz(1); break; case 'quiz-2': respondeQuiz(2); break; case 'quiz-3': respondeQuiz(3); break;
    case 'quiz-sig': siguientePregunta(); break;
    case 'restart': location.reload(); break;
  }
}

/* ---------- lo que la guía enseña en cada paso ---------- */
function contenidoGuia(){

/* ---------- los modos ---------- */

  if(!forzar&&m===EST.modo&&!EST.autoRunning) return;

  else { EST.modo='tour'; TOUR.paso=0; }
  document.body.classList.toggle('m-tour',EST.modo==='tour'); document.body.classList.toggle('m-probar',EST.modo==='probar'); document.body.classList.toggle('m-reto',EST.modo==='reto');
  el('feedback').classList.remove('show');
  if(EST.modo==='tour'){ tourVa(0,0.6); pintaBarras(); return; }
  SIM.t=0; SIM.salto=true; reiniciaCalculo(); ponVista('todo',0.6); pintaHUD(); pintaDockFijo(); pintaBarras();
}
