/* ---------- «Repetir el recorrido»: el mismo recorrido, pero avanza solo cada pocos segundos ---------- */
async function runAuto(){
  if(EST.autoRunning) return; EST.autoRunning=true; sonido.init(); TOUR.auto=true;
  EST.modo='tour'; document.body.classList.remove('m-probar','m-reto'); document.body.classList.add('m-tour'); tourVa(0,0.6); pintaBarras();
  const avanza=()=>{ if(!TOUR.auto) return; if(TOUR.paso>=TOUR_PASOS.length-1){ tourParaAuto(); return; } tourVa(TOUR.paso+1); TOUR.timer=setTimeout(avanza,10000); };
  TOUR.timer=setTimeout(avanza,10000);
}


/* ===================== 20. CÁMARAS =====================
   La escena se encuadra con el hueco que dejan la guía y el dock: la cámara se aleja lo justo para que la caja del «objeto» (ancho × alto en metros) quepa entera en ese hueco, y
   la proyección se desplaza para centrarla en él. Además el objeto nunca pasa de cierta fracción del alto del lienzo. Durante la pasada la cámara acompaña al coche
   un poco por delante; en cuanto frena, se queda mirando el hueco. */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}
const _anc=V3(3.5,0.3,-2.2);
function anclaAccion(){
  const C=CALC, e=SIM.e, S=C?C.esc.S:7;
  if(C&&e){ if(e.fase<=1) return V3(clamp(e.x+3.2,-3,S+4),0.3,-2.6); return V3(S/2+0.2,0.3,-2.4); }
  return V3(S/2,0.3,-2.4);
}
function anclaCerca(){ const e=SIM.e; return e?V3(e.x+1.2,0.3,WZ(e.y)*0.55-0.9):V3(3,0.3,-2.4); }
const VISTAS={
  todo:{dir:[-0.20,0.76,0.62],anc:anclaAccion,obj:()=>({w:7.4,h:4.0}),fov:34,tope:0.80},
  cenital:{dir:[0,1,0.07],anc:anclaAccion,obj:()=>({w:8.6,h:5.0}),fov:30,tope:0.86},
  cerca:{dir:[-0.34,0.52,0.78],anc:anclaCerca,obj:()=>({w:6.4,h:3.5}),fov:36,tope:0.80},
};
const CAM={off:V3(3,6,-5),toff:V3(0,0,0),auto:true,previo:null,k:1,dur:1};
function fovVista(v){ return innerWidth<innerHeight*0.9?(VISTAS[v].fov+8):VISTAS[v].fov; }
function distanciaFit(w,h,fov,tope){
  const Hu=huecoLibre(), W=innerWidth, Hh=innerHeight, tv=Math.tan(fov*Math.PI/360), th=tv*(W/Hh);
  const wF=Math.max(80,Hu.x1-Hu.x0)/W, hF=Math.max(80,Hu.y1-Hu.y0)/Hh;
  const D=1.06*Math.max(w/(2*th*wF),h/(2*tv*hF));
  return Math.max(D,h/(2*tv*(tope||0.66)));
}
function ofsDeseado(v){
  const V=VISTAS[v], o=V.obj(), fov=fovVista(v), D=distanciaFit(o.w,o.h,fov,V.tope);
  return {off:V3(V.dir[0],V.dir[1],V.dir[2]).normalize().multiplyScalar(D),fov};
}
function ponVista(v,dur){
  EST.vista=v; CAM.auto=true; CAM.dur=dur===undefined?1.0:dur; controls.enabled=true;
  if(typeof pintaBarras==='function') pintaBarras();
  if(CAM.dur<=0.01){ SIM.salto=true; pasaCam(1); }
}
const _ancAct=V3(3.5,0.3,-2.4); let _ancInit=false;
function pasaCam(dt){
  const V=VISTAS[EST.vista], P=V.anc(), snap=SIM.salto||!_ancInit;
  if(snap){ _ancAct.copy(P); _ancInit=true; } else _ancAct.lerp(P,1-Math.exp(-dt/0.55));
  if(CAM.auto){
    const d=ofsDeseado(EST.vista), k=snap?1:1-Math.exp(-dt/Math.max(0.05,(CAM.dur||1)*0.30));
    CAM.off.lerp(d.off,k);
    if(Math.abs(camera.fov-d.fov)>0.05){ camera.fov+=(d.fov-camera.fov)*(snap?1:k); camera.updateProjectionMatrix(); }
    camera.position.copy(_ancAct).add(CAM.off); controls.target.copy(_ancAct);
  } else if(CAM.previo){ const dP=_ancAct.clone().sub(CAM.previo); camera.position.add(dP); controls.target.add(dP); }
  CAM.previo=_ancAct.clone(); SIM.salto=false;
}
controls.addEventListener('start',()=>{ CAM.auto=false; });

/* ===================== 21. SONIDO (sintetizado) =====================
   Un «tic» muy suave por cada pitido del sensor durante la pasada, el pitido de proximidad de los sensores de parking al maniobrar (más seguido cuanto más cerca del vecino)
   y los avisos de acierto y fallo. */
const sonido=(function(){
  let ctx=null,on=true,master=null,ult=0;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination); }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); ult=f; }
  return {init,
    tic:()=>tono(3200,0.014,0.010),
    bip:(urgente)=>tono(urgente?1900:1100,urgente?0.16:0.07,0.035,'square'),
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }, get freq(){ return ult; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});

/* ===================== 22. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.max(Math.min(devicePixelRatio,alta?2:1.5),Math.min(devicePixelRatio,1.5)>1?1.25:1));
  const ms=alta?2048:1024; if(LUZ.sol.shadow.mapSize.x!==ms){ LUZ.sol.shadow.mapSize.set(ms,ms); if(LUZ.sol.shadow.map){ LUZ.sol.shadow.map.dispose(); LUZ.sol.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); if(typeof ponVista==='function'&&CALC) ponVista(EST.vista,0.001); centraEnHueco();
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 23. EL LAZO: UN SOLO RELOJ =====================
   El tiempo del escenario avanza dt·velocidad en cada cuadro, y con ESE tiempo se mueven el coche, el cono, los pulsos y la huella, y se dibujan las gráficas del dock. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0, nFrames=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  const dtS=EST.pausa?0:dt, dtSim=dtS*EST.vel;
  aplicaEscena(dtS,dtSim,dt);
  pasaCam(dt);
  if(nFrames++%3===0) llenaS0();
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaGraficas(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos(); colocaFoco();
}

/* ===================== 24. ARRANQUE =====================
   Abre funcionando y con el recorrido en el paso 1: el coche rueda frente a los vecinos, el sensor pita y el hueco se va midiendo antes de que el alumno toque nada. */
disposicion();
reiniciaCalculo();
SIM.t=TOUR_PASOS[0].t0(CALC); SIM.salto=true;
aplicaCalidad();

/* ===================== 25. GANCHOS DE PRUEBA ===================== */
/** Mide el objeto en lo VISIBLE: se pinta sin suelo ni contexto (calle, acera, seto) sobre magenta puro y se toma la caja de los píxeles que no son magenta.
 *  solo: 'coche' pinta únicamente el coche que se estaciona; por defecto, los tres coches y todo lo que se dibuja sobre la calle. */
function mideObjeto(solo){
  const ocultos=[]; const oculta=o=>{ if(o.visible){ o.visible=false; ocultos.push(o); } };
  scene.traverse(o=>{ if(o.userData&&o.userData.fondo) oculta(o); });
  if(solo==='coche'){ for(const o of MUNDO.children) if(o!==EGO) oculta(o); }
  else for(const o of MUNDO.children){ const k=o.userData&&o.userData.clave; if(k==='calle'||k==='acera'||k==='seto') oculta(o); }
  const bg=scene.background, fog=scene.fog; scene.background=null; scene.fog=null; renderer.setClearColor(0xff00ff,1);
  renderer.render(scene,camera);
  const c=renderer.domElement, W=c.width, H=c.height, t=document.createElement('canvas'); t.width=W; t.height=H; const g=t.getContext('2d',{willReadFrequently:true}); g.drawImage(c,0,0);
  const d=g.getImageData(0,0,W,H).data; let x0=1e9,x1=-1,y0=1e9,y1=-1;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=(y*W+x)*4; if(!(d[i]>235&&d[i+1]<30&&d[i+2]>235)){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  for(const o of ocultos) o.visible=true; scene.background=bg; scene.fog=fog; renderer.setClearColor(0x000000,1);
  const k=W/innerWidth; return {x0:x0/k,x1:x1/k,y0:y0/k,y1:y1/k,altoPx:(y1-y0)/k,anchoPx:(x1-x0)/k,fracAlto:(y1-y0)/H,fracAncho:(x1-x0)/W,hueco:huecoLibre(),W:innerWidth,H:innerHeight};
}

  salta:(t)=>{ SIM.t=clamp(t,0,CALC.L.T-0.06); SIM.salto=true; aplicaEscena(0.001,0.001,1.0); pasaCam(1); },
  vista:(v)=>ponVista(v,0.001),
  pausa:(on)=>{ EST.pausa=!!on; pintaBarras(); },
  rotulos:(on)=>{ ROT.on=!!on; pintaRotulos(); pintaBarras(); },
  calidad:(n)=>{ CAL.nivel=n; aplicaCalidad(); },
  tour:(n)=>{ if(EST.modo!=='tour') setMode('tour',true); tourVa(n,0.001); },
  paso:(p)=>{ if(EST.modo!=='reto') setMode('reto',true); paso2(p); if(p==='ajusta') prepararAjusta(); if(p==='diag') iniciaDiag(); if(p==='quiz'){ iniciaDiag(); paso2('quiz'); iniciaQuiz(); } },
  setAjusta:(kmh,vol,a)=>{ const r=GUIA.r2; if(r){ r.kmh=kmh; r.vol=vol; r.a=a; r.validado=false; reiniciaCalculo(); pintaHUD(); } },
  escenario:(id)=>{ const r=GUIA.r2; if(r){ r.esc=escPorId(id); reiniciaCalculo(); pintaHUD(); } },
  dx:(k)=>{ GUIA.dx=CASOS_DX.find(c=>c.k===k); GUIA.dxOk=false; reiniciaCalculo(); SIM.t=0; pintaHUD(); pintaDockFijo(); },
  tiempoHasta:(f)=>{ const C=CALC; return f==='paro'?C.tParo:(f==='fin'?C.L.T-LIM.tFinal:(f==='tramo1'?tTramo(C,1,0.5):0)); },
});
