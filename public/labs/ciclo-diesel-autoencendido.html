const TRAMO_ROT={cerrado:'',soplado:'soplado de escape',escape:'carrera de escape',cruce:'cruce de válvulas',admision:'admisión',arrastre:'arrastre'};
function pintaBarra(){
  if(!CUR||!MQ) return;
  const E=ESTADO, P=maqAct(); if(E.c===undefined) return;
  // el MISMO θ que el dock (desde el PMS de combustión), no el ángulo de ciclo de 0 a 720°
  const thR=Math.round(E.th);
  const rel=thR===0?'en el PMS':(f0(Math.abs(thR))+'° '+(thR<0?'antes':'después')+' del PMS');
  el('tb_th').innerHTML='<b>'+E.fase+'</b> · '+rel+' <span style="color:var(--dim)">(θ '+(thR<0?'−':'')+f0(Math.abs(thR))+'°)</span>';
  const sup=el('tb_sup');
  sup.style.display=E.frio||!E.cerrado?'':'none';
  sup.textContent=E.frio?'arrastre':'supuesto';
  sup.title=E.frio?'Modo de frío: el motor gira a '+f0(P.rpmArr)+' rpm de arrastre; la compresión es la politrópica del motor sellado y la llama, ilustrativa'
                  :'El motor no integra el periodo abierto: este estado es supuesto';
  const rpm=rpmVista(), Nef=RELOJ.N*RELOJ.k, tc=720/(6*rpm);
  el('tb_vel').title='Cámara lenta: ×1/'+sepMil(String(Math.round(Nef/10)*10))+' respecto a las '+sepMil(String(rpm))+
    ' rpm reales'+(RELOJ.k>1.05?' (lento en la combustión)':'')+'. Un ciclo real dura '+f1(tc*1000)+' ms.';
  el('tb_play').textContent=RELOJ.pausa?'▶':'⏸';
  el('tb_vel').value=String(RELOJ.N);
  el('tb_lento').checked=RELOJ.lento;
  el('tb_rot').classList.toggle('on',ROT3.on);
  el('tb_cal').innerHTML='Calidad: <b>'+CAL3.nivel+'</b>';
  el('tb_cal').title='Calidad de imagen: '+CAL3.nivel+(CAL3.motivo?' ('+CAL3.motivo+')':'')+
    '. Pulsa para pasar a '+(calAlta()?'media: menos partículas, sombras más simples y sin desenfoque de profundidad; la resolución no baja.':'alta.');
  document.querySelectorAll('#vbar [data-vista]').forEach(x=>x.classList.toggle('on',x.getAttribute('data-vista')===VISTA.actual));
  const lo=250, hi=3500, pos=t=>clamp((t-lo)/(hi-lo),0,1)*100+'%';
  const mu=el('tb_mu');
  mu.style.display='block'; mu.style.left=pos(E.T);
  mu.title='gas del cilindro (media de la masa) '+f0(E.T)+' K';
}

// --- rótulos: apagados de inicio; el botón enciende las OCHO piezas esenciales ---
const ROT3={on:false, items:[], svg:null, divs:[], hov:null};
(function(){
  ROT3.svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); ROT3.svg.setAttribute('class','rot3svg');
  document.body.appendChild(ROT3.svg);
  ROT3.hov=document.createElement('div'); ROT3.hov.className='rot3 hov'; ROT3.hov.style.display='none';
  document.body.appendChild(ROT3.hov);
})();
function construyeRotulos(mq){
  const {G,d}=mq, B=G.B, VA=G.VA, VE=G.VE, it=[];
  const vv=i=>mq.valv[i];
  const add=(txt,lado,fn)=>it.push({txt,lado,fn});
  // el chorro sólo se rotula mientras existe; la cámara en el pistón, siempre
  add('Válvula de admisión',-1,()=>{ const L=vv(0).L||0; return [VA.cx-VA.n[0]*L-0.30*VA.d,VA.cy-VA.n[1]*L+0.02*B,0]; });
  add('Chorro de gasóleo',-1,()=>{ const E=ESTADO; if(!E.iny||!(E.S>0.02*B)) return null;
    const Gr=MQ.Gr, o=origenChorro(Gr), s=0.55*Math.min(E.S,E.Lw||E.S);
    return [-o[0]-Math.cos(Gr.delta)*s,o[1]-Math.sin(Gr.delta)*s,0]; });
  add('Pistón',-1,()=>[-G.R*0.80,(ESTADO.yCor||0)-0.10*B,0]);
  add('Biela',-1,()=>{ const t=(ESTADO.th||0)*DEG, x=G.a*Math.sin(t)*0.55, y=G.a*Math.cos(t)+((ESTADO.yBul||0)-G.a*Math.cos(t))*0.45; return [x,y,0.12*B]; });
  add('Inyector',1,()=>[0.05*B,d.yAsiento+0.10*B,0]);
  add('Válvula de escape',1,()=>{ const L=vv(1).L||0; return [VE.cx-VE.n[0]*L+0.30*VE.d,VE.cy-VE.n[1]*L+0.02*B,0]; });
  add('Cámara en el pistón',1,()=>{ const Gr=MQ&&MQ.Gr; if(!Gr||ESTADO.yCor===undefined) return null;
    const F=Gr.bol; return [0.5*(F.rM+F.rP)*0.9,ESTADO.yCor-0.55*F.D,0]; });
  add('Cigüeñal',1,()=>{ const t=(ESTADO.th||0)*DEG; return [-d.rCw*0.7*Math.sin(t),-d.rCw*0.7*Math.cos(t),-0.2*B]; });
  ROT3.items=it;
  for(const x of ROT3.divs) x.remove();
  ROT3.divs=it.map(r=>{ const e=document.createElement('div'); e.className='rot3'; e.textContent=r.txt; e.style.display='none'; document.body.appendChild(e); return e; });
}
const _p=new THREE.Vector3();
function aPantalla(x,y,z){ const W=innerWidth, H=innerHeight; _p.set(x,y,z); MOTOR.localToWorld(_p); _p.project(S.camera);
  return [(_p.x+1)/2*W,(1-_p.y)/2*H,_p.z<1]; }
function pintaRotulos(){
  const ver=ROT3.on&&MQ&&innerWidth>820;
  ROT3.svg.style.display=ver?'':'none';
  if(!ver){ for(const e of ROT3.divs) e.style.display='none'; ROT3.svg.innerHTML=''; return; }
  const W=innerWidth, H=innerHeight;
  // la caja del motor en pantalla
  const b=MQ.caja; let x0=1e9, x1=-1e9;
  for(const X of [b.min.x,b.max.x]) for(const Y of [b.min.y,b.max.y]) for(const Zz of [b.min.z,0]){
    const s=aPantalla(X,Y,Zz); x0=Math.min(x0,s[0]); x1=Math.max(x1,s[0]); }
  const hud=el('hud').getBoundingClientRect(), pan=el('panel').getBoundingClientRect();
  const vb=el('vbar').getBoundingClientRect(), tb=el('tbar').getBoundingClientRect();
  const minX=hud.right+8, maxX=pan.left-8, yMin=vb.bottom+14, yMax=tb.top-14;
  const lados={'-1':[],'1':[]};
  ROT3.items.forEach((r,i)=>{ const a=r.fn(); if(!a){ ROT3.divs[i].style.display='none'; return; } const s=aPantalla(a[0],a[1],a[2]);
    const dentro=s[2]&&s[0]>minX&&s[0]<maxX&&s[1]>yMin&&s[1]<yMax;
    if(dentro) lados[r.lado].push({i,ax:s[0],ay:s[1]}); else ROT3.divs[i].style.display='none'; });
  let svg='';
  for(const lado of [-1,1]){
    const L=lados[lado].sort((p,q)=>p.ay-q.ay), paso=26;
    let y=yMin; for(const q of L){ q.y=Math.max(q.ay,y); y=q.y+paso; }
    let exceso=L.length?L[L.length-1].y-yMax:0;
    if(exceso>0) for(let k=L.length-1;k>=0;k--){ const lim=k<L.length-1?L[k+1].y-paso:yMax; L[k].y=Math.min(L[k].y,lim); }
    for(const q of L){
      const e=ROT3.divs[q.i]; e.style.display='block';
      const w=e.offsetWidth||120;
      const x=lado<0?Math.max(minX,x0-28-w):Math.min(maxX-w,x1+28);
      e.style.left=x+'px'; e.style.top=(q.y-11)+'px';
      const xl=lado<0?x+w:x;
      svg+='<polyline points="'+xl+','+q.y+' '+(xl+lado*12)+','+q.y+' '+q.ax+','+q.ay+'" fill="none" stroke="rgba(160,220,214,.6)" stroke-width="1"/>'+
        '<circle cx="'+q.ax+'" cy="'+q.ay+'" r="2.6" fill="#bfeee8"/>';
    }
  }
  ROT3.svg.innerHTML=svg;
}

/* --- selección al pasar el ratón: la pieza se resalta y aparece SU nombre ---
   El resaltado es una segunda malla que comparte la geometría de la pieza, con
   un material aditivo tenue, colgada de la propia pieza: se mueve con ella. */
const HL_MAT=new THREE.MeshBasicMaterial({color:'#4FD1C5',transparent:true,opacity:0.20,depthWrite:false,
  blending:THREE.AdditiveBlending,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2,toneMapped:false});
const SEL={k:null,ov:[],ray:new THREE.Raycaster(),ndc:new THREE.Vector2(),x:0,y:0,pend:false,t:0,fijo:0};
const NOM_PIEZA=k=>{ const f=PICK_INFO[k]; try{ return f?f()[0]:k; }catch(_){ return k; } };
function claveDe(hit){
  const o=hit&&hit.object; if(!o) return null;
  if(o===gasPlano&&MQ){ const p=MOTOR.worldToLocal(hit.point.clone()), E=ESTADO, G=MQ.Gr;
    // la lámina contesta según dónde se toque: en el chorro, el chorro; con llama, la llama
    if(E.iny&&E.S>0){ const o=origenChorro(G), dx=-Math.cos(G.delta), dy=-Math.sin(G.delta);
      for(const l of (GAS_U.uDos.value?[1,-1]:[1])){
        const qx=p.x-l*(-o[0]), qy=p.y-o[1], s=qx*dx*l+qy*dy, t=Math.abs(qx*dy-qy*dx*l);
        if(s>0&&s<Math.min(E.S,E.Lw||E.S)+0.03*G.B&&t<Math.tan(chorroCfg().C.semi)*s*1.3+0.02*G.B)
          return E.ardiendo&&s>E.Lliq?'llama':'chorro'; } }
    return E.ardiendo?'llama':'camisa'; }
  let n=o; while(n){ if(n.userData&&n.userData.key) return n.userData.key; n=n.parent; }
  return null;
}
function resalta(k){
  if(SEL.k===k) return;
  for(const m of SEL.ov) m.parent&&m.parent.remove(m);
  SEL.ov=[]; SEL.k=k;
  if(!k||k==='llama'||k==='chorro') return;
  MOTOR.traverse(o=>{
    if(!o.isMesh||o===gasPlano||!o.visible||o.material===HL_MAT) return;
    let n=o, kk=null; while(n&&!kk){ if(n.userData&&n.userData.key) kk=n.userData.key; n=n.parent; }
    if(kk!==k) return;
    const ov=new THREE.Mesh(o.geometry,HL_MAT); ov.raycast=()=>{}; ov.renderOrder=9; o.add(ov); SEL.ov.push(ov);
  });
}
function pickEn(x,y){
  const r=S.renderer.domElement.getBoundingClientRect();
  SEL.ndc.set(((x-r.left)/r.width)*2-1,-((y-r.top)/r.height)*2+1);
  SEL.ray.setFromCamera(SEL.ndc,S.camera);
  const hits=SEL.ray.intersectObject(MOTOR,true);
  return hits.length?hits[0]:null;
}
S.renderer.domElement.addEventListener('pointermove',e=>{ if(e.pointerType==='touch') return;
  SEL.x=e.clientX; SEL.y=e.clientY; SEL.pend=true; });
S.renderer.domElement.addEventListener('pointerleave',()=>{ if(!SEL.fijo){ resalta(null); ROT3.hov.style.display='none'; } });
function tickSeleccion(dt){
  SEL.t+=dt; if(SEL.fijo>0){ SEL.fijo=Math.max(0,SEL.fijo-dt); if(SEL.fijo===0){ resalta(null); ROT3.hov.style.display='none'; } }
  if(!SEL.pend||SEL.t<0.07||SEL.fijo>0) return;
  SEL.pend=false; SEL.t=0;
  const k=claveDe(pickEn(SEL.x,SEL.y));
  resalta(k);
  S.renderer.domElement.style.cursor=k?'pointer':'';
  const h=ROT3.hov;
  if(!k){ h.style.display='none'; return; }
  h.textContent=NOM_PIEZA(k); h.style.display='block';
  h.style.left=Math.min(innerWidth-h.offsetWidth-8,SEL.x+16)+'px'; h.style.top=(SEL.y+14)+'px';
}
// Al tocar (o pinchar) una pieza: resaltado y nombre durante unos segundos.
function marcaPieza(k,x,y,seg){
  resalta(k); SEL.fijo=k?(seg||3.2):0;
  const h=ROT3.hov; if(!k){ h.style.display='none'; return; }
  h.textContent=NOM_PIEZA(k); h.style.display='block';
  h.style.left=Math.min(innerWidth-h.offsetWidth-8,x+16)+'px'; h.style.top=(y+14)+'px';
}

// --- calidad ---
function aplicaCalidad(rehacer){
  const alta=calAlta(), pr=alta?Math.min(devicePixelRatio,2):Math.min(devicePixelRatio,1.5);
  S.renderer.setPixelRatio(pr); if(S.composer.setPixelRatio) S.composer.setPixelRatio(pr); S.resize();
  S.composer.passes.forEach(p=>{ if(p instanceof BokehPass) p.enabled=alta; });
  const sol=LUZ.clave;
  if(sol){ const n=alta?2048:1024; if(sol.shadow.mapSize.x!==n){ sol.shadow.mapSize.set(n,n);
    // con VSM hay DOS blancos: el mapa y el del desenfoque (mapPass); si sólo se rehace
    // el mapa, el desenfoque sigue al tamaño viejo y en el suelo aparece una sombra fantasma
    for(const t of ['map','mapPass']) if(sol.shadow[t]){ sol.shadow[t].dispose(); sol.shadow[t]=null; } } }
  if(!rehacer) return;
  marcaPieza(null);      // las mallas de resaltado y su rótulo se van con la maqueta vieja
  for(const k in MAQUETAS){ const m=MAQUETAS[k];
    if(m===MQ) MOTOR.remove(m.g);
    const tira=o=>o.traverse(n=>{ if(n.isMesh||n.isPoints) n.geometry.dispose(); });
    tira(m.g); for(const r in m.pistones){ tira(m.pistones[r]); const mt=m.pistones[r].userData.mat; if(mt) mt.dispose(); }
    delete MAQUETAS[k]; }
  MQ=null; mkVisto=null; preparaParticulas(); aplicaGeom();
}
aplicaCalidad(false);

// Dos pistas como máximo, y ninguna da un valor de la terna: orientan hacia DÓNDE
// mirar. La primera dice cuál es el muro de esta máquina (el criterio que más
// veces tumba EN SOLITARIO, que es el dato del censo); la segunda, en qué eje se
// decide el gasto de combustible entre las calibraciones válidas.
function ejeDecisivo(mk){
  const v=valM(mk); let mejor=null, sp=-1;
  for(const [e,campo] of [['fk','fuel'],['r','r'],['soi','soi'],['pIny','pIny']]){
    const porVal={};
    v.forEach(x=>{ const k=x[campo]; if(porVal[k]===undefined||x.coste5<porVal[k]) porVal[k]=x.coste5; });
    const cs=Object.keys(porVal).map(k=>porVal[k]);
    const spread=cs.length>1?Math.max.apply(null,cs)-Math.min.apply(null,cs):0;
    if(spread>sp){ sp=spread; mejor=e; }
  }
  return mejor;
}
function pista(){
  if(nPistas()>=MAX_PISTAS){ showToast('💡 Ya has usado las '+MAX_PISTAS+' pistas de este caso.'); return; }
  const mk=RETO.cfg.mk, cn=censoM(mk);
  if(!cn.validas){ showToast('💡 Esta máquina no tiene ninguna calibración válida: no hay nada que orientar.'); return; }
  let txt;
  if(!RETO.pistas.p1){
    RETO.pistas.p1=true;
    const dec=CRIT.slice().sort((a,b)=>cn.solo[b]-cn.solo[a])[0];
    txt=cn.solo[dec]>0
      ? 'De las '+f0(cn.n)+' calibraciones montables en esta máquina pasan '+f0(cn.validas)+
        '. El muro es «'+CRIT_ROT[dec]+'»: es el criterio que más veces tumba una calibración él solo.'
      : 'De las '+f0(cn.n)+' calibraciones montables en esta máquina pasan '+f0(cn.validas)+
        '. Aquí ningún criterio tumba nada en solitario: las que se caen se caen por varios a la vez.';
  }else{
    RETO.pistas.p2=true;
    txt='Entre las '+f0(RETO.nval)+' válidas, el eje donde más cambia el gasto de combustible es el de «'+
      EJE_ROT[ejeDecisivo(mk)]+'». Compara el coste de las válidas moviendo ése.';
  }
  RETO.pistaTxt.push(txt);
  beep();
  showToast('💡 <b>Pista '+nPistas()+' de '+MAX_PISTAS+'.</b> '+txt);
  afterEdit();
}

// "Otro caso": en el reto cambia de máquina y rearma la partida; en los modos de
// estudio avanza al siguiente caso que enseña algo distinto del anterior.
function newSignal(){
  const sig=(arr,v)=>arr[(arr.indexOf(v)+1)%arr.length];
  // Un ejemplo VÁLIDO pero no el más barato: llevar los mandos a la solución del
  // reto era regalar la respuesta desde un modo de estudio.
  const alOptimo=()=>{ const v=valM(ST.mk), o=solM(ST.mk);
    const ej=v.filter(x=>x!==o).sort((a,b)=>b.coste5-a.coste5)[0]||o;
    if(ej){ ST.r=ej.r; ST.soi=ej.soi; ST.pIny=ej.pIny; ST.fk=ej.fuel; }
    else { ST.r=opcionesR(ST.mk)[0]; ST.soi=SOI_G[2]; ST.pIny=opcionesP(ST.mk)[0]; ST.fk=FUEL_KEYS[0]; } };
  if(mode==='ciclo'||mode==='censo'){
    aplicaMaquina(sig(MAQ_KEYS,ST.mk)); alOptimo();
  }else if(mode==='retardo'){
    ST.soi=sig(SOI_G,ST.soi);
    if(ST.soi===SOI_G[0]){ aplicaMaquina(sig(MAQ_KEYS,ST.mk)); alOptimo(); }
  }else if(mode==='riel'){
    ST.fk=sig(FUEL_KEYS,ST.fk);
    if(ST.fk===FUEL_KEYS[0]){ aplicaMaquina(sig(MAQ_KEYS,ST.mk)); alOptimo(); }
  }else if(mode==='frio'){
    ST.fk=sig(FUEL_KEYS,ST.fk);
    if(ST.fk===FUEL_KEYS[0]){ aplicaMaquina(sig(MAQ_KEYS,ST.mk)); ST.r=opcionesR(ST.mk).slice(-1)[0]; }
  }else{
    RETO.cfg.mk=sig(RETO_MAQS,RETO.cfg.mk);
    retoSolveBuild();
  }
  solved=false;
  buildControls(); updateScenarioInfo();
  clearDx(); buildQuiz(); refreshQuestion();
  if(mode==='reto')updateRetoSpec();
  refreshAll();
  { const c=cfgDe(mode), P=MAQ[c.mk];
    showToast('🔀 <b>Escenario nuevo.</b> '+ICONO[c.mk]+' '+P.nom+' · r '+f0(c.r)+' · SOI '+f0(c.soi)+'° · riel '+
      f0(c.pIny)+' bar · '+FCOR[c.fk]); }
}

// ===================== 14. RETO =====================
// Cuántas calibraciones válidas empatan en coste con la más barata. Si empatan
// varias, el reto se firma con cualquiera de ellas.
const EMP_C=new Map();
function empM(mk){
  let v=EMP_C.get(mk);
  if(v===undefined){
    const s=solM(mk);
    v=s?valM(mk).filter(x=>Math.abs(x.coste5-s.coste5)<1e-6).length:0;
    EMP_C.set(mk,v);
  }
  return v;
}
const SERV={

  if(!RETO.msg) h+='Ahora mismo: <b>'+(R.valida?'pasa el pliego, '+f0(R.coste5)+' €'
    :(R.construible?'falla '+fallosDe(R).map(k=>CRIT_COR[k]).join(', '):'no es montable'))+'</b>.<br>';

// El juicio puro: no toca ni `solved` ni los intentos. Lo usa Entregar y también
// el recorrido guiado, que sólo DEMUESTRA y jamás firma el reto del alumno.
function juzgaReto(){
  const mk=RETO.cfg.mk, S=RETO.sol, R=CUR;
  if(!S) return {ok:false, msg:'En esta máquina NINGUNA calibración pasa el pliego entero: no hay nada que firmar. '+
      'Pasa a otra máquina con «Otro caso».'};
  if(!R.construible)
    return {ok:false, msg:'No es montable: '+(R.rMecOk?'':'r = '+f0(R.r)+' supera el máximo de '+f0(MAQ[mk].rMax)+'. ')+
      (R.pInyOk?'':'el riel de '+f0(R.pIny)+' bar supera la bomba montada de '+f0(MAQ[mk].pInyMax)+' bar. ')+
      'Las opciones marcadas con ⚠ el banco las simula, pero no se pueden montar en esta máquina.'};
  if(!R.valida){
    const f=fallosDe(R);
    return {ok:false, msg:'Rechazada. Falla '+f0(f.length)+(f.length===1?' criterio: ':' criterios: ')+
      f.map(k=>CRIT_ROT[k]).join(', ')+'. Mira la telemetría: cada fila lleva su límite al lado.'};
  }
  if(R.coste5>S.coste5+1e-6)
    return {ok:false, msg:'Pasa el pliego, pero no es la más barata: hay otra válida que gasta menos '+
      'combustible en '+f0(ANIOS)+' años. Quedan '+f0(RETO.nval)+' calibraciones válidas en esta máquina; '+
      'busca entre ellas y compara el coste.'};
  return {ok:true, msg:'Calibración firmada. r = '+f0(R.r)+', SOI '+f0(R.soi)+'°, riel '+f0(R.pIny)+' bar con '+
    FCOR[R.fuel]+': pasa los '+f0(CRIT.length)+' criterios y es la más barata de las '+f0(RETO.nval)+
    ' válidas — '+f0(R.coste5)+' € de combustible en '+f0(ANIOS)+' años, '+fin(R.bsfc,1)+' g/kWh, '+
    pc1(R.etaB)+' al freno.'};
}
// El botón se bloquea durante el recorrido guiado, pero la función NO. Al fallar
// NO se dice cuánto falta ni cuál era: se dice qué no cuadra. A los tres fallos el
// caso se cambia por otro (otra máquina), para que nadie apruebe recorriendo las
// pocas válidas hasta que una acierte.
function checkReto(){
  if(RETO.resuelto) return;
  const j=juzgaReto();
  RETO.aviso='';
  if(j.ok){
    RETO.msg=j.msg; RETO.resuelto=true; solved=true;
    [523,659,784].forEach((f,i)=>setTimeout(()=>synth.beep(f,0.16,0.05),i*90));
    afterEdit();
    showToast('✅ Firmada: '+f0(CUR.coste5)+' € a '+f0(ANIOS)+' años.');
    return;
  }
  RETO.resuelto=false; solved=false;
  if(!RETO.sol){
    RETO.msg=j.msg; synth.beep(180,0.22,0.05); afterEdit();
    showToast('⚠️ Esta máquina no tiene solución. Nada que entregar.');
    return;
  }
  RETO.intentos++;
  RETO.msg=j.msg+' Intento '+f0(RETO.intentos)+' de '+MAX_INTENTOS+'.';
  synth.beep(200,0.20,0.05);
  if(RETO.intentos>=MAX_INTENTOS){
    const sig=(arr,v)=>arr[(arr.indexOf(v)+1)%arr.length];
    RETO.cfg.mk=sig(RETO_MAQS,RETO.cfg.mk);
    retoSolveBuild();
    RETO.aviso='Tres entregas sin acertar: este caso se cierra sin revelarlo y llega otra máquina.';
    afterEdit();
    showToast('🔀 <b>Caso nuevo.</b> Tres intentos sin acertar. Otra máquina, otro encargo.');
    return;
  }
  afterEdit();
  showToast('⚠️ '+j.msg);
}

  retardo:{pregunta:'En el compacto urbano (r 16 · SOI 10° · riel 1'+NBSP+'800 bar) el B20 inyecta 28,25 mg y el DMA marino sólo 27,06 mg — un 4,4 % menos de combustible. Y sin embargo el DMA levanta 10,45 bar/° de gradiente y el B20 se queda en 9,75. ¿Cómo puede hacer más ruido el que menos masa mete?',
    opciones:[

       why:'Exacto. Ese retardo se paga entero en la premezcla: β pasa de 0,130 con B20 a 0,145 con DMA. Cuando por fin prende, ese 14,5 % de la dosis ya está mezclado y arde de golpe. El B20 mete más masa total, pero la mete casi toda cuando ya hay llama, y eso se quema al ritmo al que se mezcla, no de golpe.'},

  riel:{pregunta:'Subir el riel del compacto urbano de 600 a 1'+NBSP+'800 bar multiplica el caudal por 1,7945 (la raíz del salto de presión) pero multiplica por tres lo que cobra la bomba, de 0,160 a 0,479 bar de presión media. Una ganancia con raíz contra una pérdida lineal. ¿Por qué gana la raíz en este caso?',
    opciones:[
      {t:'Porque a 600 bar la inyección dura 41,10° y el 90 % no acaba de quemar hasta +65,75°: el ciclo se queda con una penalización por quemado tardío de ×0,8712 que vale muchísimo más que los 0,319 bar de la bomba.',ok:true,

  frio:{pregunta:'El tractor calienta el AIRE DE ADMISIÓN 50,5 K con la rejilla; el compacto urbano calienta el SITIO DEL ENCENDIDO 178,7 K con la bujía incandescente. En el punto muerto superior, ¿cuánto acaba valiendo cada aportación?',

  censo:{pregunta:'En la camioneta hay 400 calibraciones montables y el criterio de «arranque en frío» reprueba exactamente 300: tres cuartas partes justas. ¿Qué está diciendo una cifra tan redonda?',

  reto:{pregunta:'En el motor marino, la calibración más eficiente que el banco puede montar (r = 16) da 39,95 % al freno y sale MÁS BARATA en cinco años que la que se firma. Cumple presión (135,7 de 140 bar), fase (CA50 9,90°), escape (748 de 772 K) y par (12,79 de 12,10 bar). ¿Por qué se rechaza?',

function buildQuiz(){
  const q=QUIZ[mode];
  QORD=q.opciones.map((o,i)=>i);
  for(let i=QORD.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));
    const t=QORD[i];QORD[i]=QORD[j];QORD[j]=t; }
  answered=false;
}
function clearDx(){ answered=false; }
function refreshQuestion(){
  const q=QUIZ[mode];
  el('q_text').textContent=q.pregunta;
  el('dxbtns').innerHTML=QORD.map((oi,i)=>'<button class="b" data-i="'+i+'">'+q.opciones[oi].t+'</button>').join('');
  el('dxbtns').querySelectorAll('[data-i]').forEach(b=>{
    b.onclick=()=>answer(Number(b.getAttribute('data-i')));
  });
}
function answer(i){
  if(answered) return;
  answered=true;
  const q=QUIZ[mode], btns=el('dxbtns').querySelectorAll('[data-i]');
  btns.forEach((b,k)=>{ b.disabled=true; const o=q.opciones[QORD[k]];
    if(o.ok) b.classList.add('right'); else if(k===i) b.classList.add('wrong'); });
  const o=q.opciones[QORD[i]];
  synth.beep(o.ok?880:200,0.10,0.05);
  showToast((o.ok?'✅ ':'❌ ')+o.why);
}
function quizCorrectIndex(){ return QORD.indexOf(QUIZ[mode].opciones.findIndex(o=>o.ok)); }

// Ninguna cifra está escrita a mano: todas salen de la traza, del estado del
// ángulo que se está viendo, de la máquina elegida o de las constantes selladas.
function pickCtx(){
  const c=cfgDe(mode), P=MAQ[c.mk], R=CUR, tr=R&&R.traza;
  return {c,P,F:FUEL[c.fk],R,tr,i:idxFR(),G:geom(P,c.r),E:ESTADO};
}

      'inyección más corta ('+gra(R.thIny)+'), así que la combustión termina antes —CA90 a '+

      f0(A.TtdcEf)+' K. La de fluidez: el CFPP de este combustible es '+f0(F.cfpp)+
      ' °C y se homologa a '+f0(P.Thom)+' °C. Gelificado, el gasóleo no llega a la tobera y da igual '+

// Al tocar una pieza: se resalta, aparece su nombre y el aviso cuenta qué decide.
// La lámina de gas contesta según dónde se toque: el chorro, la llama o la carga.
pickerFor(scene,S.camera,S.renderer.domElement,hit=>{
  const k=claveDe(hit);
  if(!k||!PICK_INFO[k]) return;
  const inf=PICK_INFO[k]();
  if(!inf) return;
  const s=hit.point.clone().project(S.camera);
  marcaPieza(k,(s.x+1)/2*innerWidth,(1-s.y)/2*innerHeight);
  synth.beep(760,0.05,0.05);
  showToast('<b>'+inf[0]+'</b> · '+inf[1]);
});

// ===================== 17. RECORRIDO GUIADO =====================
// Una sola historia: en un diésel no hay chispa, así que el instante en que
// empieza a arder no lo elige el calibrador —lo elige el combustible—; de ese
// retardo salen el ruido, el pico de presión y la mitad de los rechazos; la
// presión de riel compra tiempo pero se paga en la bomba; el frío tiene dos
// puertas que no se abren con lo mismo; y la calibración que se firma es la más
// barata de las ENTREGABLES, que nunca es la que más rinde.
// Ninguna cifra de los avisos está escrita a mano: todas se recalculan aquí.
const sleep=t=>new Promise(r=>setTimeout(r,t));   // «ms» ya es el formateador de milisegundos
async function runAuto(){
  if(autoRunning) return;
  autoRunning=true;
  const b=el('btnAuto'), rot=b.textContent;
  b.textContent='⏳ Recorriendo…';
  synth.init();synth.resume();clearDx();
  // El recorrido es una DEMOSTRACIÓN: guarda el reto del alumno, hace la demo sobre
  // OTRA máquina y al terminar lo devuelve tal cual estaba (sin resolver si no lo
  // estaba). Jamás deja `solved` en true.
  const snap={ mk:RETO.cfg.mk, ejes:{...RETO.ejes}, pistas:{...RETO.pistas},
    pistaTxt:RETO.pistaTxt.slice(), intentos:RETO.intentos, aviso:RETO.aviso, msg:RETO.msg,
    resuelto:RETO.resuelto, solved, tenia:!!RETO.sol, st:{...ST} };
  try{
    // --- 1. un ciclo entero y los tres techos que caben encima ----------
    aplicaMaquina('urbano'); ST.r=16; ST.soi=10; ST.pIny=1800; ST.fk='uba';
    setMode('ciclo');
    {
      const c=cfgDe('ciclo'), R=CUR;
      showToast('🔧 <b>Un ciclo cerrado, entero.</b> '+MAQ[c.mk].nom+' a '+f0(MAQ[c.mk].rpm)+
        ' rpm con r = '+f0(c.r)+'. Encima del ciclo medido caben TRES techos de aire frío, todos '+
        'con el mismo γ = '+f1(G_FRIO)+' y exactamente el mismo calor ('+f1(R.Q)+' J): Otto '+
        pc2(R.etaOttoId)+', Dual '+pc2(R.etaDualId)+' y Diésel '+pc2(R.etaDieselId)+
        '. Lo único que los separa es DÓNDE entra ese calor, y eso se lee en cuánta expansión queda '+
        'después de la combustión: '+f0(c.r)+' veces en Otto, '+f3(c.r/R.rcDual)+' en Dual y '+
        f3(c.r/R.rcId)+' en Diésel, porque quemar a presión constante empuja el pistón hacia abajo '+
        'mientras arde. Lo que este motor hace de verdad son '+pc2(R.etaI)+' indicados y '+
        pc2(R.etaB)+' al freno.');
    }
    await sleep(6200);

    // --- 2. no hay chispa: el que decide cuándo arde es el combustible --
    setMode('retardo');
    {
      const c=cfgDe('retardo'), P=MAQ[c.mk];
      const S4=FUEL_KEYS.map(fk=>({fk,s:simT({mk:c.mk,r:c.r,soi:c.soi,pIny:c.pIny,fk})}));
      const ruid=S4.slice().sort((x,y)=>y.s.dpMax-x.s.dpMax);
      const A=ruid[0], Z=ruid[ruid.length-1];
      showToast('⏱️ <b>Aquí no hay chispa.</b> La tobera abre a '+gra(c.soi)+' antes del PMS, pero '+
        'nada arde hasta que el aire está lo bastante caliente. El banco pide la dosis en ENERGÍA '+
        '('+f0(P.Qdem)+' J por ciclo y cilindro), así que los cuatro combustibles entregan el mismo '+
        'calor y sólo cambian en el número de cetano. Con '+FCOR[A.fk]+' (CN '+f0(FUEL[A.fk].cn)+
        ') el retardo es '+ms(A.s.tRet)+' ms —'+gra(A.s.thRet)+' de cigüeñal— y para cuando prende '+
        'ya hay dentro el '+pc1(A.s.beta)+' de la dosis sin quemar: se va de golpe y el gradiente '+
        'llega a '+fN(A.s.dpMax,2)+' bar/°. Con '+FCOR[Z.fk]+' (CN '+f0(FUEL[Z.fk].cn)+
        ') el retardo baja a '+gra(Z.s.thRet)+', la premezcla a '+pc1(Z.s.beta)+' y el gradiente a '+
        fN(Z.s.dpMax,2)+' bar/° — con MÁS masa inyectada ('+mg(Z.s.mComb)+' mg contra '+
        mg(A.s.mComb)+'), porque su poder calorífico es menor. Más cetano no es más energía: es '+
        'encender antes.');
    }
    await sleep(6200);

    // --- 3. el riel: la raíz contra la línea recta ----------------------
    setMode('riel');
    {
      const c=cfgDe('riel'), sw=sweepP(c);
      const a=sw[0], z=sw[sw.length-1];
      const raiz=Math.sqrt((z.pIny*1e5-z.pSoi)/(a.pIny*1e5-a.pSoi));
      showToast('🛢️ <b>Sube el riel de '+f0(a.pIny)+' a '+f0(z.pIny)+' bar.</b> El caudal por la '+
        'tobera NO se multiplica por '+f2(z.pIny/a.pIny)+': se multiplica por '+f4(z.mdot/a.mdot)+
        ', que es exactamente la raíz del cociente de saltos de presión ('+f4(raiz)+
        '), porque Bernoulli manda. Aun así gana: la inyección se acorta de '+gra(a.thIny)+' a '+
        gra(z.thIny)+', el 90 % de la masa acaba de arder en '+gra(z.ca90)+' en vez de '+
        gra(a.ca90)+', y la penalización por quemado tardío pasa de ×'+f4(a.penTarde)+' a ×'+
        f4(z.penTarde)+'. Lo que sí crece en línea recta es lo que cobra la bomba: de '+
        f3(a.fmepIny)+' a '+f3(z.fmepIny)+' bar. Saldo al freno: '+pc2(a.etaB)+' → '+pc2(z.etaB)+
        '. Y fíjate en lo que NO cambia: el retardo es '+gra(a.thRet)+' a '+f0(a.pIny)+' bar y '+
        gra(z.thRet)+' a '+f0(z.pIny)+' bar. Mientras no hay llama la tobera no calienta el aire, '+
        'así que el instante en que prende lo sigue eligiendo el combustible.');
    }
    await sleep(6200);

    // --- 4. frío: calentar el aire ANTES de comprimirlo ------------------
    aplicaMaquina('tractor');
    ST.r=opcionesR('tractor').slice(-1)[0]; ST.pIny=opcionesP('tractor').slice(-1)[0]; ST.fk='uba';
    setMode('frio');
    {
      const c=cfgDe('frio'), P=MAQ[c.mk], A=CUR.arr, mult=Math.pow(A.rEf,A.n-1);
      showToast('❄️ <b>'+P.nom+': rejilla de admisión.</b> Se homologa a '+f0(P.Thom)+
        ' °C. La rejilla calienta el AIRE antes de comprimirlo, y ahí está el truco: aporta '+
        f1(A.dRej)+' K en el colector, pero la compresión los multiplica por r_ef^(n−1) = '+
        f3(mult)+', así que en el punto muerto superior valen '+f1(A.dRej*mult)+' K. Ojo con la n: '+
        'girando a '+f0(A.rpm)+' rpm de arrastre y con las paredes heladas la compresión NO es '+
        'adiabática, el motor declara n = '+f4(A.n)+' y no γ = '+f1(G_FRIO)+' (con γ saldrían '+
        f1(A.dRej*Math.pow(A.rEf,G_FRIO-1))+' K: '+f1(A.dRej*Math.pow(A.rEf,G_FRIO-1)-A.dRej*mult)+
        ' K de regalo que no existen). Se llega a '+f0(A.TtdcEf)+' K contra los '+f0(A.Tai)+
        ' K que pide el '+FUEL[c.fk].nom+', o sea '+f0(A.margen)+' K de margen térmico.');
    }
    await sleep(6200);

    // --- 5. frío: la otra puerta no se abre con calor -------------------
    aplicaMaquina('urbano');
    ST.r=opcionesR('urbano').slice(-1)[0]; ST.pIny=opcionesP('urbano').slice(-1)[0]; ST.fk='agricola';
    afterEdit();
    {
      const c=cfgDe('frio'), P=MAQ[c.mk], F=FUEL[c.fk], A=CUR.arr;
      showToast('🧊 <b>'+P.nom+': bujías incandescentes… y aun así no arranca.</b> La bujía calienta '+
        'la CÁMARA, ya al final de la carrera, así que sus '+f1(A.dBuj)+
        ' K se suman tal cual y no los multiplica nadie. Térmicamente sobra: '+f0(A.TtdcEf)+
        ' K contra '+f0(A.Tai)+' K de umbral, '+f0(A.margen)+' K de sobra. Pero se homologa a '+
        f0(P.Thom)+' °C y el '+F.nom+' gelifica a '+f0(F.cfpp)+' °C: el ambiente está '+
        f0(F.cfpp-P.Thom)+' K POR DEBAJO de su punto de obstrucción, la parafina ya ha cristalizado '+
        'y el gasóleo no atraviesa el filtro. La cámara puede estar al rojo; si el combustible no '+
        'llega, no hay arranque. El '+FUEL.uba.nom+' obstruye a '+f0(FUEL.uba.cfpp)+' °C y deja '+
        f0(P.Thom-FUEL.uba.cfpp)+' K de holgura a esa misma temperatura: ése sí fluye. Son dos '+
        'puertas y hay que pasar las dos.');
    }
    await sleep(6200);

    // --- 6. el censo: quién decide de verdad ---------------------------
    aplicaMaquina('camioneta');
    ST.r=opcionesR('camioneta')[0]; ST.pIny=opcionesP('camioneta').slice(-1)[0]; ST.fk='uba';
    setMode('censo');
    {
      const c=cfgDe('censo'), P=MAQ[c.mk], C=censoM(c.mk), B=barM(c.mk);
      const peor=CRIT.slice().sort((x,y)=>C.tot[y]-C.tot[x])[0];
      const dec=CRIT.slice().sort((x,y)=>C.solo[y]-C.solo[x])[0];
      const noArr=B.filter(s=>!s.okFrio);
      const gel=noArr.filter(s=>!s.arr.okFluido).length;
      const ter=noArr.filter(s=>s.arr.okFluido&&!s.arr.okTermico).length;
      showToast('📊 <b>Las '+f0(C.n)+' calibraciones montables de '+P.nom+', por el pliego.</b> '+
        'Sobreviven '+f0(C.validas)+'. El criterio con más bajas es «'+CRIT_ROT[peor]+'» ('+
        f0(C.tot[peor])+'), pero esa columna engaña porque casi nunca falla solo; el que de verdad '+
        'decide es «'+CRIT_ROT[dec]+'», que tumba '+f0(C.solo[dec])+' configuraciones a las que no '+
        'les pasaba nada más. Y mira de qué muere el arranque a '+f0(P.Thom)+' °C: de las '+
        f0(noArr.length)+' que no arrancan, gelificadas '+f0(gel)+' y cortas de temperatura '+
        f0(ter)+'. No es un problema de compresión: es de surtidor.');
    }
    await sleep(6200);

    // --- 7. el encargo -------------------------------------------------
    RETO.cfg.mk=(snap.mk==='marino')?'planta':'marino'; retoSolveBuild();
    setMode('reto');
    {
      const P=MAQ[RETO.cfg.mk], s=RETO.sol, F=FUEL[s.fuel];
      showToast('🎯 <b>El encargo.</b> De las '+f0(RETO.nval)+' calibraciones que pasan el pliego '+
        'en el '+P.nom+', la más barata de ALIMENTAR durante '+f0(ANIOS)+' años. El servicio son '+
        f0(P.wAnio)+' kWh/año al freno; con '+pc1(s.etaB)+' de rendimiento eso son '+fin(s.bsfc,1)+
        ' g/kWh de '+F.nom+' a '+f2(F.precio)+' €/L, o sea '+fin(s.coste5,0)+' € de combustible. Un '+
        'punto de rendimiento aquí no es un punto: son '+f0(ANIOS)+' años de facturas.');
    }
    await sleep(6000);

    // --- 8. la que más rinde no se puede firmar -------------------------
    {
      const mk=RETO.cfg.mk, s=RETO.sol;
      const mejor=barM(mk).slice().sort((x,y)=>y.etaB-x.etaB)[0];
      const fal=fallosDe(mejor);
      RETO.ejes={mk,r:mejor.r,soi:mejor.soi,pIny:mejor.pIny,fk:mejor.fuel};
      RETO.msg=''; RETO.resuelto=false; afterEdit();
      showToast('🏁 <b>La que más rinde.</b> De las '+f0(barM(mk).length)+
        ' montables, la de mayor rendimiento al freno es r = '+f0(mejor.r)+' · SOI '+gra(mejor.soi)+
        ' · riel '+f0(mejor.pIny)+' bar con '+FCOR[mejor.fuel]+': '+pc2(mejor.etaB)+' frente a '+
        pc2(s.etaB)+' de la aceptada más barata, y encima '+fin(s.coste5-mejor.coste5,0)+
        ' € más barata de alimentar. Suena a ganga. Entrégala y que conteste el pliego: falla por '+
        fal.map(k=>CRIT_COR[k]).join(' y ')+'.');
      await sleep(2600);
      RETO.msg=juzgaReto().msg; afterEdit();
    }
    await sleep(6200);

    // --- 9. la que sí se firma -----------------------------------------
    {
      const mk=RETO.cfg.mk, s=RETO.sol;
      const mejor=barM(mk).slice().sort((x,y)=>y.etaB-x.etaB)[0];
      RETO.ejes={mk,r:s.r,soi:s.soi,pIny:s.pIny,fk:s.fuel};
      RETO.msg=''; RETO.resuelto=false; afterEdit();
      showToast('✍️ <b>Un punto menos de relación de compresión.</b> De r = '+f0(mejor.r)+' a r = '+
        f0(s.r)+', con el mismo avance y el mismo riel: el gradiente cae de '+fN(mejor.dpMax,2)+
        ' a '+fN(s.dpMax,2)+' bar/° y entra bajo el límite de '+fN(MAQ[mk].dpLim,1)+
        '. Se pagan '+pc2(mejor.etaB-s.etaB)+' de rendimiento y '+fin(s.coste5-mejor.coste5,0)+
        ' € en '+f0(ANIOS)+' años. Ése es el precio de poder firmar.');
      await sleep(2600);
      RETO.msg=juzgaReto().msg; afterEdit();
    }
    await sleep(6000);
    // la pregunta vive en el cajón del dock: se abre para que la respuesta se vea
    abreCajon(true);
    answer(quizCorrectIndex());
  } finally {
    // Devuelve el reto del alumno, sin resolver si no lo estaba.
    Object.assign(ST,snap.st);
    RETO.cfg.mk=snap.mk;
    if(snap.tenia){
      RETO.sol=solM(snap.mk); RETO.nval=valM(snap.mk).length;
      RETO.ejes=snap.ejes; RETO.pistas=snap.pistas; RETO.pistaTxt=snap.pistaTxt;
      RETO.intentos=snap.intentos; RETO.aviso=snap.aviso; RETO.msg=snap.msg;
      RETO.resuelto=snap.resuelto;
    } else { RETO.sol=null; retoSolveBuild(); }
    solved=snap.solved;
    buildControls(); updateScenarioInfo(); if(mode==='reto') updateRetoSpec(); refreshAll();
    autoRunning=false;
    el('btnAuto').textContent=rot;
    buildControls();
  }
}

// ===================== 18. ANIMACIÓN, EVENTOS Y ARRANQUE =====================
// El 3D se repinta en cada cuadro porque el pistón, las válvulas, el chorro, la
// llama, el color del gas y la aguja del manómetro van sobre el MISMO reloj; la
// telemetría viva se refresca a ~12 Hz, que es de sobra para leerla y evita
// rehacer el HTML del panel sesenta veces por segundo.
let liveT=0;
S.setAnimate(dt=>{
  animT+=dt;
  pinta3D(dt);
  tickSeleccion(dt||0);
  liveT+=dt;
  if(liveT>=0.08){ liveT=0; updateLive(); }
});

MODES.forEach(m=>{ el('m_'+m).onclick=()=>{ if(!autoRunning) setMode(m); }; });
el('btnAuto').onclick=()=>{ if(!autoRunning) runAuto(); };
el('btnNew').onclick=()=>{ if(autoRunning) return; newSignal(); };
el('btnCheck').onclick=()=>{ if(autoRunning) return; checkReto(); };
// El botón de sonido viene en la plantilla del laboratorio.
const soundBtn=el('soundBtn');
if(soundBtn){ soundBtn.onclick=()=>{
  synth.toggle();
  const on=synth.isOn();
  soundBtn.textContent=on?'🔊':'🔇';
  soundBtn.classList.toggle('on',on);
}; }
// Los navegadores no dejan sonar nada hasta que el usuario toca la página.
document.addEventListener('pointerdown',()=>{ synth.init(); synth.resume(); },{once:true});

// pinta3D() no dibuja hasta que el modo haya calculado CUR y montado la maqueta.
S.start();
setMode('ciclo');
colocaBarras();
// El aviso de cómo se usa sale UNA vez y se desvanece: no hay barra de pistas fija.
setTimeout(()=>{ if(!autoRunning) showToast('🖱️ Arrastra para girar · rueda para acercar · toca una pieza para saber qué decide'); },900);

// ===================== 19. PUENTE DE PRUEBAS =====================
// Todo lo que la Capa 2 necesita para comprobar en un navegador de verdad que lo
// que se ve en pantalla es exactamente lo que calculó el motor sellado: las
// constantes del dominio, el motor entero, las derivaciones que hace este cuerpo
// (barM/censoM/solM/valM/pisM) para contrastarlas contra barrido/censo/solucion/
// validas/pistas, el estado vivo, los equivalentes de cada botón, el recorrido y,
// desde que el 3D sigue al modelo, el reloj, las cotas y el dock.
window.__labDebug={
  // --- modos
  mode:()=>mode, setMode, modes:()=>MODES.slice(), modeMeta:()=>MODE_META,
  // --- constantes del dominio
  R_GAS, P_ATM, CP_FRIO, CV_FRIO, G_FRIO, DEG, H_PASO, TH_IVC, TH_EVO,
  C1_WOS, C2_WOS, N_MOT, K_PORT, ETA_COMB, AFR_ST, LAM_HUMO,
  HH_A, HH_B, HH_EA, HH_CN0, R_MOL, HH_TREF, HH_P0, HH_PC, HH_PMIN, HH_EXMX,
  A_PREM, A_DIF, M_PREM, M_DIF, D_P0, D_P1, K_SPR, D_MIX, K_PREM,
  BETA_MIN, BETA_MAX, TH_TARDE, K_TARDE, CF_A, CF_B, CF_C, CF_D,
  K_FUGA, ETA_BOM, N_HI, DN_ARR, RPM_ARR, B_REF, TAI_0, TAI_K, TAI_CN0, ANIOS,
  R_G, SOI_G, PINY_G, T_G, NPTS, NMEC, NPM, ESC3, get PER3D(){ return PER3D; },
  // --- catálogo, pliego y rótulos
  FUEL, FUEL_KEYS, MAQ, MAQ_KEYS, CRIT, CRIT_ROT, CRIT_COR, CALENT_ROT,
  ICONO, ROT, FCOR, FCOL, EJE_ROT, PIS_EJE, SERV,
  // --- motor sellado
  cpAire, gammaAire, gammaQuem, gammaMez, cv:cvGas, geom, vol, dvol, area,
  tauHH, wiebeP, dwiebeP, wiebeD, dwiebeD, mdotIny,
  etaOttoId, etaDieselId, etaDualId, cicloIdeal, nArrastre, tAutoenc, arranque,
  sim, opcionesR, opcionesP, barrido, censo, solucion, validas, pistas,
  // --- derivaciones de este cuerpo (deben coincidir con las del motor)
  simT, barM, censoM, solM, valM, pisM, empM, pliegoFilas, fallosDe, construible,
  sweepR, sweepS, sweepP, sweepSF, arrR, arrT,
  // --- estado vivo
  st:()=>({...ST}), cur:()=>CUR, cfg:()=>cfgDe(mode), cfgDe,
  frame:()=>FR, idxFR, maq:()=>maqAct(),
  reto:()=>({cfg:{...RETO.cfg}, ejes:{...RETO.ejes}, sol:RETO.sol, nval:RETO.nval,
             resuelto:RETO.resuelto, msg:RETO.msg, pistas:{...RETO.pistas},
             nPistas:nPistas(), intentos:RETO.intentos}),
  intentos:()=>RETO.intentos,
  // --- setters equivalentes a los botones de la barra
  setMaquina:v=>{ aplicaMaquina(v); afterEdit(); },
  setR:v=>{ ST.r=Number(v); afterEdit(); },
  setSoi:v=>{ ST.soi=Number(v); afterEdit(); },
  setPiny:v=>{ ST.pIny=Number(v); afterEdit(); },
  setFuel:v=>{ ST.fk=v; afterEdit(); },
  setST:(mk,r,soi,pIny,fk)=>{ aplicaMaquina(mk);
    ST.r=Number(r); ST.soi=Number(soi); ST.pIny=Number(pIny); ST.fk=fk; afterEdit(); },
  newSignal,
  // --- reto
  setRetoMaquina:v=>{ RETO.cfg.mk=v; retoSolveBuild(); afterEdit(); },
  setRetoR:v=>{ RETO.ejes.r=Number(v); RETO.msg=''; RETO.resuelto=false; afterEdit(); },
  setRetoSoi:v=>{ RETO.ejes.soi=Number(v); RETO.msg=''; RETO.resuelto=false; afterEdit(); },
  setRetoPiny:v=>{ RETO.ejes.pIny=Number(v); RETO.msg=''; RETO.resuelto=false; afterEdit(); },
  setRetoFuel:v=>{ RETO.ejes.fk=v; RETO.msg=''; RETO.resuelto=false; afterEdit(); },
  setReto:(r,soi,pIny,fk)=>{ RETO.ejes={mk:RETO.cfg.mk,r:Number(r),soi:Number(soi),
    pIny:Number(pIny),fk}; RETO.msg=''; RETO.resuelto=false; afterEdit(); },
  check:()=>checkReto(), pista:()=>pista(), retoSolveBuild,
  solved:()=>solved,
  // --- cuestionario
  quizCorrectIndex, answer, quiz:()=>QUIZ[mode], qorden:()=>QORD.slice(),
  // --- etiquetas de selección
  pickKeys:()=>Object.keys(PICK_INFO), pick:k=>(PICK_INFO[k]?PICK_INFO[k]():null),
  boardClick,
  // --- el motor en 3D: un solo reloj, el ángulo de ciclo c ∈ [0, 720) con 0 en el PMS de combustión
  theta:()=>RELOJ.c,
  setTheta:v=>{ RELOJ.c=cicloDe(Number(v)); RELOJ.pausa=true; pinta3D(0); updateLive(); pintaBarra(true); return ESTADO.c; },
  pausa:v=>{ if(v!==undefined) RELOJ.pausa=!!v; return RELOJ.pausa; },
  velocidad:v=>{ if(v!==undefined){ RELOJ.N=Number(v); RELOJ.auto=false; PER3D=720/(6*rpmVista())*RELOJ.N; }
    return {N:RELOJ.N, k:RELOJ.k, lento:RELOJ.lento, per3d:PER3D}; },
  lento:v=>{ if(v!==undefined) RELOJ.lento=!!v; return RELOJ.lento; },
  estado3D:()=>Object.assign({},ESTADO),
  cotas3D, dims3D:()=>MQ&&MQ.d, DIST, CRUCE, PROP3D, alzado, leyAlzado, perfilLeva, empujeLeva, camRot,
  bulonY, coronaY, volCamara3D, bielaAng, bolForma, bolRo, bolRi, volBol, orificios, visibleOr,
  penetracionHA, tRuptura, semiCono, longLiquida, K_LIQ, chorroDe, sPorcion, paredChorro, origenChorro, enCamara,
  ritmos, estadoAbierto, estadoArrastre, colorT, ESCALA_T,
  chorro:()=>Object.assign({},chorroCfg().C),
  piezas3D:()=>{ if(!MQ) return null; const p={valvA:MQ.valv[0].grp.position.toArray(), valvE:MQ.valv[1].grp.position.toArray(),
    levaA:MQ.valv[0].leva.rotation.z, levaE:MQ.valv[1].leva.rotation.z, cig:MQ.cig.rotation.z,
    piston:MQ.pis.position.y, biela:[MQ.bie.position.x,MQ.bie.position.y,MQ.bie.rotation.z],
    corona:GAS_U.uCor.value, chorro:{S:GAS_U.uS.value, S0:GAS_U.uS0.value, Lliq:GAS_U.uLl.value, liq:GAS_U.uSp.value,
      vapor:GAS_U.uVap.value, pared:GAS_U.uWr.value}, llama:{prem:GAS_U.uFp.value, dif:GAS_U.uFd.value, bowl:GAS_U.uFb.value},
    bowlD:GAS_U.uD.value, brilloBujia:GLOW.vaina.emissiveIntensity, brilloRejilla:GLOW.cinta.emissiveIntensity,
    caja:[MQ.caja.min.toArray(),MQ.caja.max.toArray()]}; return p; },
  // cuánto de la pantalla ocupa la maqueta (con su pedestal), medido sobre sus vértices proyectados
  encuadre:()=>{ if(!MQ) return null; let y0=1e9,y1=-1e9,x0=1e9,x1=-1e9; const v=new THREE.Vector3();
    MQ.g.updateMatrixWorld(true);
    MQ.g.traverse(o=>{ if(!o.isMesh||!o.visible||o.material===HL_MAT) return; const p=o.geometry.attributes.position, st=Math.max(1,Math.floor(p.count/600));
      for(let i=0;i<p.count;i+=st){ v.fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld).project(S.camera);
        const sx=(v.x+1)/2*innerWidth, sy=(1-v.y)/2*innerHeight;
        x0=Math.min(x0,sx); x1=Math.max(x1,sx); y0=Math.min(y0,sy); y1=Math.max(y1,sy); } });
    return {alto:+((y1-y0)/innerHeight).toFixed(3), ancho:+((x1-x0)/innerWidth).toFixed(3),
      y0:Math.round(y0), y1:Math.round(y1), x0:Math.round(x0), x1:Math.round(x1)}; },
  calidad:v=>{ if(v){ CAL3.nivel=v; aplicaCalidad(true); } return CAL3.nivel; },
  vista:v=>{ if(v){ if(v==='pizarron') v='34'; ponVista(v,0.01); } return VISTA.actual; }, vistas:()=>Object.keys(NOM_VISTA),
  rotulos:v=>{ if(v!==undefined){ ROT3.on=!!v; pintaRotulos(); ponVista(VISTA.actual,0.01); } return ROT3.on; },
  rotulosVisibles:()=>ROT3.divs.filter(d=>d.style.display==='block').map(d=>{ const r=d.getBoundingClientRect(); return {t:d.textContent,x:r.left,y:r.top,w:r.width,h:r.height}; }),
  // --- el dock de instrumentos: lo que marca el cursor θ y lo que dibujó cada gráfica
  dock:()=>({modo:mode, cursor:DK.cur?Object.assign({},DK.cur):null, chip:DK.chip,
    lienzos:[LZ.A,LZ.B].map(L=>({w:L.w,h:L.h,dpr:L.dpr,px:[L.c.width,L.c.height]})),
    figuras:[...document.querySelectorAll('#dkFig .fg')].map(f=>f.textContent)}),
  chip:k=>tocaChip(k), cajon:v=>abreCajon(v),
  resalta:k=>{ resalta(k||null); return SEL.k; },
  marca:(k,x,y,seg)=>{ marcaPieza(k,x||innerWidth/2,y||innerHeight/2,seg); return SEL.k; },
  // --- formato y recorrido
  fN, f0, f1, f2, f3, f4, pc1, pc2, pcm, fin, bar, cm3, gra, mg, ms,
  runAuto, autoRunning:()=>autoRunning,
};
