<style>
  :root{
    --bg:#08201C;--panel:rgba(9,26,23,.86);--line:#1E3A34;--ink:#EAF4F1;
    --dim:#8FB3AC;--accent:#2A9D8F;--accent2:#4FD1C5;--hv:#FFB703;--good:#34d399;--bad:#f4475e;

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(10,13,18,.92),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}

  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .hud h2{font-size:19px;line-height:1.15;margin-bottom:9px}
  .hud p{font-size:13px;line-height:1.55;color:var(--dim);margin-bottom:10px}
  .hud .formula{font-family:var(--mono);color:var(--accent2);text-align:center;font-size:12.5px;margin:8px 0;padding:8px;background:rgba(0,0,0,.25);border-radius:8px;line-height:1.5}
  .hud .src{font-size:10.5px;color:#7a8894;font-style:italic;margin-top:4px;line-height:1.5}
  .legend{display:flex;flex-direction:column;gap:6px;margin:12px 0;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:10px}
  .legend .li{display:flex;align-items:center;gap:8px;font-size:11px;color:#c4d0da}
  .legend .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .fid{margin:10px 0 2px;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:10px;border:1px solid rgba(79,209,197,.18)}
  .fid .ft{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);margin-bottom:6px}
  .fid .fl{font-size:11px;color:#c4d0da;line-height:1.5;margin-bottom:5px}
  .fid .fl b{color:var(--ink)}
  .fid .fl.no b{color:var(--hv)}

  .panel{position:fixed;top:70px;right:18px;z-index:15;width:262px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:16px;max-height:calc(100vh - 150px);overflow-y:auto}
  .panel h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:2px 0 10px}
  .panel h4.sec{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .g{margin-bottom:6px}
  .gl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .gl b{color:var(--accent2)}
  .gl b.good{color:var(--good)}.gl b.warn{color:var(--hv)}.gl b.bad{color:var(--bad)}

  .trow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--mono);font-size:11px;color:var(--dim);padding:2px 0}

  .b:hover{border-color:var(--accent);background:#202c38}
  .b.on{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:bold}
  .b.primary{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:bold}

  .console{font-family:var(--mono);font-size:11px;line-height:1.55;color:#c4d0da;background:rgba(0,0,0,.28);border-radius:9px;padding:10px 12px;margin-bottom:8px;min-height:56px}
  .console .dtc{color:var(--bad);font-weight:bold}
  .console .ok{color:var(--good)}
  .console .mono{color:var(--dim)}

  .hint{position:fixed;bottom:18px;left:18px;z-index:14;font-family:var(--mono);font-size:10px;color:var(--dim);background:var(--panel);padding:7px 12px;border-radius:9px;border:1px solid var(--line)}

  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0xdde7f0, 10, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0d1218, roughness:0.48, metalness:0.3, envMapIntensity:0.8 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

const T_TAB = [200, 250, 300, 350, 400, 450, 500, 550, 600, 650, 700, 750, 800,
  850, 900, 950, 1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900,
  2000, 2100, 2200, 2300, 2400, 2500];
const CP_TAB = [1002.5, 1003.4, 1004.9, 1008.2, 1014.0, 1020.7, 1029.5, 1039.2,
  1051.0, 1063.5, 1075.2, 1087.0, 1098.7, 1110.1, 1121.2, 1132.1, 1141.7,
  1160.0, 1176.0, 1190.0, 1202.0, 1212.0, 1220.0, 1229.0, 1237.0, 1244.0,

function cpAire(T) {
  if (T <= T_TAB[0]) return CP_TAB[0];
  const n = T_TAB.length;
  if (T >= T_TAB[n - 1]) {
    const p = (CP_TAB[n - 1] - CP_TAB[n - 2]) / (T_TAB[n - 1] - T_TAB[n - 2]);
    return CP_TAB[n - 1] + p * (T - T_TAB[n - 1]);
  }
  let i = 0;
  while (T > T_TAB[i + 1]) i++;
  const f = (T - T_TAB[i]) / (T_TAB[i + 1] - T_TAB[i]);
  return CP_TAB[i] + f * (CP_TAB[i + 1] - CP_TAB[i]);
}
function gammaAire(T) { const cp = cpAire(T); return cp / (cp - R_GAS); }
function gammaQuem(T) { return 1.338 - 6.0e-5 * T + 1.0e-8 * T * T; }
function gammaMez(T, xp) {
  const g = (1 - xp) * gammaAire(T) + xp * gammaQuem(T);
  return g < 1.15 ? 1.15 : g;
}
function cvGas(T, xp) { return R_GAS / (gammaMez(T, xp) - 1); }

// ------------------------------------------------------------------ geometria
function geom(P, r) {
  const Ap = Math.PI / 4 * P.B * P.B;
  const Vd = Ap * P.S;
  return { Ap, Vd, Vc: Vd / (r - 1), a: P.S / 2, L: P.L };
}
function vol(G, th) {
  const st = Math.sin(th);
  const s = Math.sqrt(G.L * G.L - G.a * G.a * st * st);
  return G.Vc + G.Ap * (G.L + G.a - G.a * Math.cos(th) - s);
}
function dvol(G, th) {
  const st = Math.sin(th), ct = Math.cos(th);
  const s = Math.sqrt(G.L * G.L - G.a * G.a * st * st);
  return G.Ap * G.a * (st + G.a * st * ct / s);
}
function area(G, V, B) { return Math.PI * B * B / 2 + 4 * V / B; }

// -------------------------------------------- retardo de Hardenberg y Hase
// Devuelve el retardo en GRADOS de cigueñal: la correlacion ya lleva dentro
// el efecto de la velocidad por la velocidad media del piston.
function tauHH(cn, p, T, Sp) {
  const pb = Math.max(p / 1e5, HH_PMIN);
  const Ea = HH_EA / (cn + HH_CN0);
  let ex = Ea * (1 / (R_MOL * T) - 1 / HH_TREF) * Math.pow(HH_P0 / (pb - HH_PC), 0.63);
  if (ex > HH_EXMX) ex = HH_EXMX;
  return (HH_A + HH_B * Sp) * Math.exp(ex);
}

// --------------------------------------------------------------- doble Wiebe
// La premezcla es un pico que se agota: con A_PREM = 6,908 esta quemada al
// 99,9 % cuando y = 1, y ahi se corta. La difusion NO: su duracion es una
// escala de mezcla, no un final, asi que y sigue creciendo mas alla de 1 y la
// cola se apaga sola. Es la asimetria que da su forma al diagrama diesel.
function wiebeP(th, ths, dth, m) {
  if (th <= ths) return 0;
  const y = (th - ths) / dth;
  if (y >= 1) return 1;
  return 1 - Math.exp(-A_PREM * Math.pow(y, m + 1));
}
function dwiebeP(th, ths, dth, m) {
  if (th <= ths || th >= ths + dth) return 0;
  const y = (th - ths) / dth;
  return A_PREM * (m + 1) / dth * Math.pow(y, m)
       * Math.exp(-A_PREM * Math.pow(y, m + 1));
}
function wiebeD(th, ths, dth, m) {
  if (th <= ths) return 0;
  const y = (th - ths) / dth;
  return 1 - Math.exp(-A_DIF * Math.pow(y, m + 1));
}
function dwiebeD(th, ths, dth, m) {
  if (th <= ths) return 0;
  const y = (th - ths) / dth;
  return A_DIF * (m + 1) / dth * Math.pow(y, m)
       * Math.exp(-A_DIF * Math.pow(y, m + 1));
}

// ------------------------------------------------------------ caudal inyectado
// Bernoulli por los orificios de la tobera; la contrapresion es la del
// cilindro en el instante de abrir.
function mdotIny(P, F, pIny, pCil) {
  const dP = Math.max(pIny * 1e5 - pCil, 1e5);
  const A = P.nOr * Math.PI / 4 * P.dOr * P.dOr;
  return P.cd * A * Math.sqrt(2 * dP * F.rho * 1000);
}

// ================================================== ciclos ideales de aire frio
function etaOttoId(r, g) { return 1 - Math.pow(r, 1 - (g || G_FRIO)); }

function etaDieselId(r, rc, g) {
  const G = g || G_FRIO;
  if (Math.abs(rc - 1) < 1e-12) return etaOttoId(r, G);
  return 1 - (1 / G) * Math.pow(r, 1 - G) * (Math.pow(rc, G) - 1) / (rc - 1);
}

function etaDualId(r, alfa, rc, g) {
  const G = g || G_FRIO;
  const den = (alfa - 1) + G * alfa * (rc - 1);
  if (Math.abs(den) < 1e-14) return etaOttoId(r, G);
  return 1 - Math.pow(r, 1 - G) * (alfa * Math.pow(rc, G) - 1) / den;
}

// Reparte el calor del ciclo entre volumen y presion constantes de forma que
// la relacion de presiones del tramo isocoro sea la que de verdad alcanzo el
// motor. Devuelve tambien los dos casos limite ya resueltos.
function cicloIdeal(r, T1, p1, q, alfaReal) {
  const T2 = T1 * Math.pow(r, G_FRIO - 1);
  const p2 = p1 * Math.pow(r, G_FRIO);
  const T3 = T2 + q / CP_FRIO;
  const rc = T3 / T2;
  const eOtto = etaOttoId(r, G_FRIO);
  const eDiesel = etaDieselId(r, rc, G_FRIO);
  // dual: el tramo isocoro se lleva alfa; si no cabe, el ciclo degenera en Otto
  const alfaMax = 1 + q / (CV_FRIO * T2);
  let alfa = alfaReal;
  if (!(alfa > 1)) alfa = 1;
  if (alfa > alfaMax) alfa = alfaMax;
  const Tx = T2 * alfa;
  const qv = CV_FRIO * (Tx - T2);
  const qp = Math.max(q - qv, 0);
  const rcD = 1 + qp / (CP_FRIO * Tx);
  const eDual = etaDualId(r, alfa, rcD, G_FRIO);
  return { T2, p2, T3, rc, alfa, alfaMax, Tx, rcD, eOtto, eDiesel, eDual };
}

// ============================================================ arranque en frio
// Politropica de arrastre con exponente declarado: engloba las fugas por
// segmentos y la perdida a unas paredes que estan a la temperatura ambiente.
function nArrastre(P, rpm) {
  const f = Math.exp(-rpm / RPM_ARR) * Math.sqrt(B_REF / P.B);
  return N_HI - DN_ARR * f;
}
function tAutoenc(F) { return TAI_0 - TAI_K * (F.cn - TAI_CN0); }

function arranque(mk, r, fk, Tamb, opts) {
  const o = opts || {};
  const P = MAQ[mk], F = FUEL[fk];
  const G = geom(P, r);
  const rpm = o.rpm != null ? o.rpm : P.rpmArr;
  const t = o.t != null ? o.t : P.tCal;
  const TambK = Tamb + 273.15;
  const Vivc = vol(G, TH_IVC * DEG);
  const rEf = Vivc / G.Vc;
  const n = nArrastre(P, rpm);
  // el calentador de rejilla calienta el AIRE (y la compresion lo multiplica),
  // la bujia incandescente calienta el SITIO del encendido (y no se multiplica)
  const usaRej = P.calent === 'rejilla' || P.calent === 'ambas' || P.calent === 'agua';
  const usaBuj = P.calent === 'bujias' || P.calent === 'ambas';
  const dRej = usaRej ? P.dTcal * (1 - Math.exp(-t / P.tauCal)) : 0;
  const dBujBase = P.calent === 'ambas' ? P.dTbuj : P.dTcal;
  const tauB = P.calent === 'ambas' ? P.tauBuj : P.tauCal;
  const dBuj = usaBuj ? dBujBase * (1 - Math.exp(-t / tauB)) : 0;
  const Tadm = TambK + dRej;
  const Ttdc = Tadm * Math.pow(rEf, n - 1);
  const ptdc = P.pAdm * Math.pow(rEf, n);
  const TtdcEf = Ttdc + dBuj;
  const Tai = tAutoenc(F);
  const Tcfpp = F.cfpp;
  const okFluido = Tamb >= Tcfpp - 1e-9;
  const okTermico = TtdcEf >= Tai - 1e-9;
  const Sp = 2 * P.S * rpm / 60;
  return {
    rpm, t, Tamb, TambK, n, rEf, dRej, dBuj, Tadm, Ttdc, ptdc, TtdcEf, Tai,
    Tcfpp, okFluido, okTermico, arranca: okFluido && okTermico,
    margen: TtdcEf - Tai, tauArr: tauHH(F.cn, ptdc, TtdcEf, Sp),
  };
}

// ==================================================================== simulacion
function sim(mk, r, soi, pIny, fk, opts) {
  const o = opts || {};
  const P = MAQ[mk], F = FUEL[fk];
  const G = geom(P, r);
  const w = P.rpm * 2 * Math.PI / 60;
  const Sp = 2 * P.S * P.rpm / 60;
  const thSOI = -soi;
  const Vivc = vol(G, TH_IVC * DEG);
  const rEf = Vivc / G.Vc;
  const pEsc = P.pEscBase;
  const guardar = !!o.traza;
  const h = o.paso || H_PASO;
  const N = Math.round((TH_EVO - TH_IVC) / h);

  // dosis: la energia pedida la fija el banco, la masa la fija el combustible
  const mComb = P.Qdem / F.lhv;

  let Texh = 800, out = null, iters = 0, dTexh = Infinity;
  for (let it = 0; it < 8; it++) {
    iters = it + 1;
    // ---- mezcla atrapada en el cierre de admision ------------------------
    const mRes = pEsc * G.Vc / (R_GAS * Texh);
    let Tivc = P.Tadm + 20, mTot = 0, mFres = 0;
    for (let k = 0; k < 40; k++) {
      mTot = P.pAdm * Vivc / (R_GAS * Tivc);
      mFres = mTot - mRes;
      if (mFres < 1e-9) mFres = 1e-9;
      Tivc = (mFres * P.Tadm + mRes * Texh) / (mFres + mRes);
    }
    const fRes = mRes / mTot;
    const mAire = mFres;                    // en Diesel solo entra aire
    const lam = mAire / (mComb * F.afr);
    // El calor NO se conoce todavia: depende de donde caiga la combustion, y
    // eso lo decide el retardo. Se fija abajo, en el instante del encendido.
    let etaC = 0, Q = 0, penTarde = 1, ca10 = null, ca50 = null, ca90 = null;
    const T0 = Tivc;
    // fraccion de la masa total que acaba siendo producto de combustion
    const xpMax = Math.min(0.98, mComb * (1 + F.afr) / mTot);

    // ---- inyeccion --------------------------------------------------------
    const Vsoi = vol(G, thSOI * DEG);
    const pSoi = P.pAdm * Math.pow(Vivc / Vsoi, N_MOT);
    const mdot = mdotIny(P, F, pIny, pSoi);
    const tIny = mComb / mdot;                       // s
    const thIny = tIny * 6 * P.rpm;                  // grados

    // ---- integracion del ciclo cerrado ------------------------------------
    let T = T0, Wg = 0, pmax = 0, thPmax = 0, Tmax = 0, Qht = 0;
    let dpMax = -1e9, thDpMax = 0;
    let acc = 0, thSOC = null, invPrev = 0, arrancado = false;
    let beta = 0, dthP = 0, dthD = 0, tRet = 0, thRet = 0;
    let pPrev = P.pAdm, Vprev = Vivc;
    const tz = guardar ? { th: [], V: [], p: [], T: [], xb: [], acc: [], dp: [] } : null;

    const xbDe = (th) => {
      if (thSOC === null || th <= thSOC) return 0;
      return beta * wiebeP(th, thSOC, dthP, M_PREM)
           + (1 - beta) * wiebeD(th, thSOC, dthD, M_DIF);
    };
    const dxbDe = (th) => {
      if (thSOC === null || th <= thSOC) return 0;
      return beta * dwiebeP(th, thSOC, dthP, M_PREM)
           + (1 - beta) * dwiebeD(th, thSOC, dthD, M_DIF);
    };
    // angulo al que la fraccion quemada llega a f (CA10, CA50, CA90)
    const angDe = (f) => {
      if (thSOC === null) return null;
      let lo = thSOC, hi = TH_EVO;
      if (xbDe(hi) < f) return hi;
      for (let k = 0; k < 60; k++) {
        const m = 0.5 * (lo + hi);
        if (xbDe(m) < f) lo = m; else hi = m;
      }
      return 0.5 * (lo + hi);
    };

    const dTdth = (th, T, xb) => {
      const V = vol(G, th * DEG), dV = dvol(G, th * DEG);
      const p = mTot * R_GAS * T / V;
      const dQc = Q * dxbDe(th);
      const pMot = P.pAdm * Math.pow(Vivc / V, N_MOT);
      const c2 = (thSOC !== null && th > thSOC) ? C2_WOS : 0;
      const wg = C1_WOS * Sp + c2 * (G.Vd * T0 / (P.pAdm * Vivc)) * (p - pMot);
      const wg2 = wg > 0.5 ? wg : 0.5;
      const hc = 3.26 * Math.pow(P.B, -0.2) * Math.pow(p / 1000, 0.8)
               * Math.pow(T, -0.55) * Math.pow(wg2, 0.8);
      const dQh_deg = hc * area(G, V, P.B) * (T - P.Tpar) / w * DEG;
      return { d: (dQc - dQh_deg - p * dV * DEG) / (mTot * cvGas(T, xb * xpMax)),
               p, V, dQh_deg };
    };

    for (let i = 0; i <= N; i++) {
      const th = TH_IVC + i * h;
      const xb = xbDe(th);
      const V = vol(G, th * DEG);
      const p = mTot * R_GAS * T / V;
      if (p > pmax) { pmax = p; thPmax = th; }
      if (T > Tmax) Tmax = T;
      if (i > 0) {
        Wg += 0.5 * (p + pPrev) * (V - Vprev);
        const dp = (p - pPrev) / 1e5 / h;            // bar por grado
        if (dp > dpMax) { dpMax = dp; thDpMax = th; }
      }
      // ---- retardo de autoencendido integrado ----------------------------
      if (thSOC === null && th >= thSOI - 1e-9) {
        const inv = 1 / tauHH(F.cn, p, T, Sp);
        if (!arrancado) { arrancado = true; invPrev = inv; }
        else {
          const dAcc = 0.5 * h * (invPrev + inv);
          if (acc + dAcc >= 1) {
            const frac = (1 - acc) / dAcc;
            thSOC = th - h + frac * h;
            acc = 1;
            // ahora ya se puede repartir la dosis en premezcla y difusion
            thRet = thSOC - thSOI;
            tRet = thRet / (6 * P.rpm);
            const mPre = Math.min(mComb, mdot * tRet) * K_PREM;
            beta = Math.min(BETA_MAX, Math.max(BETA_MIN, mPre / mComb));
            dthP = D_P0 + D_P1 * thRet;
            dthD = K_SPR * thIny + D_MIX * Math.sqrt(Sp / 10);
            // Con la forma de la combustion ya cerrada se sabe cuanto se
            // quema tarde: lo que llega al final encuentra un gas que ya se
            // expande y se enfria, y no acaba de oxidarse.
            ca10 = angDe(0.10); ca50 = angDe(0.50); ca90 = angDe(0.90);
            penTarde = 1 - K_TARDE * Math.max(0, ca90 - TH_TARDE);
            etaC = ETA_COMB * Math.min(1, 0.90 + 0.25 * (lam - 1)) * penTarde;
            Q = P.Qdem * etaC;
          } else { acc += dAcc; invPrev = inv; }
        }
      }
      const cadaTz = Math.max(1, Math.round((o.pasoTraza != null ? o.pasoTraza : 2) / h));
      if (guardar && (i % cadaTz === 0)) {
        tz.th.push(th); tz.V.push(V); tz.p.push(p); tz.T.push(T);
        tz.xb.push(xb); tz.acc.push(acc);
        tz.dp.push(i > 0 ? (p - pPrev) / 1e5 / h : 0);
      }
      pPrev = p; Vprev = V;
      if (i === N) break;
      const k1 = dTdth(th, T, xbDe(th));
      const k2 = dTdth(th + h / 2, T + h / 2 * k1.d, xbDe(th + h / 2));
      const k3 = dTdth(th + h / 2, T + h / 2 * k2.d, xbDe(th + h / 2));
      const k4 = dTdth(th + h, T + h * k3.d, xbDe(th + h));
      Qht += (k1.dQh_deg + 2 * k2.dQh_deg + 2 * k3.dQh_deg + k4.dQh_deg) / 6 * h;
      T = T + h / 6 * (k1.d + 2 * k2.d + 2 * k3.d + k4.d);
      if (T < 200) T = 200;
      if (T > 4000) T = 4000;
    }

    const Vevo = vol(G, TH_EVO * DEG);
    const pEvo = mTot * R_GAS * T / Vevo;
    const Tevo = T;
    const gE = gammaMez(Tevo, xpMax);
    const TexhNew = Tevo * Math.pow(pEsc / pEvo, (gE - 1) / gE);
    const Tbrida = P.Tpar + (TexhNew - P.Tpar) * K_PORT;

    // ---- indicadores -------------------------------------------------------
    const imepG = Wg / G.Vd / 1e5;
    const pmep = (pEsc - P.pAdm) / 1e5;
    const imepN = imepG - pmep;
    const fmepMec = CF_A + CF_B * (pmax / 1e5) + CF_C * Sp + CF_D * Sp * Sp;
    const fmepIny = K_FUGA * mComb * pIny * 1e5 / (F.rho * 1000 * ETA_BOM) / G.Vd / 1e5;
    const fmep = fmepMec + fmepIny;
    const bmep = imepN - fmep;
    const par = bmep * 1e5 * G.Vd * P.ncil / (4 * Math.PI);
    const pot = par * w;
    const etaI = imepG * 1e5 * G.Vd / (mComb * F.lhv);
    const etaB = bmep * 1e5 * G.Vd / (mComb * F.lhv);
    const bsfc = etaB > 0 ? 3.6e9 / (etaB * F.lhv) : Infinity;
    const rhoAdm = P.pAdm / (R_GAS * P.Tadm);
    const etaV = mAire / (rhoAdm * G.Vd);
    // techos ideales de aire frio, con el reparto real de presiones
    const q = Q / mTot;
    const p2Id = P.pAdm * Math.pow(r, G_FRIO);
    const ci = cicloIdeal(r, T0, P.pAdm, q, pmax / p2Id);
    const ciEf = cicloIdeal(rEf, T0, P.pAdm, q, pmax / (P.pAdm * Math.pow(rEf, G_FRIO)));
    const coste5 = etaB > 0
      ? ANIOS * P.wAnio * 3.6e6 / (etaB * F.lhv) / F.rho * F.precio
      : Infinity;

    out = {
      r, soi, pIny, fuel: fk, rEf, fRes, mAire, mComb, lam, Q, etaC, Tivc: T0,
      penTarde, ca10, ca50, ca90, enciende: thSOC !== null,
      mdot, tIny, thIny, pSoi, thSOC, thRet, tRet, beta, dthP, dthD, acc,
      imepG, pmep, imepN, fmepMec, fmepIny, fmep, bmep, par, pot,
      etaI, etaB, bsfc, etaV, pmax, thPmax, Tmax, Tevo, dpMax, thDpMax,
      Qht, Qfrac: Q > 0 ? Qht / Q : 0, Texh: TexhNew, Tbrida, coste5,
      rcId: ci.rc, alfaId: ci.alfa, rcDual: ci.rcD, T2Id: ci.T2, T3Id: ci.T3,
      etaOttoId: ci.eOtto, etaDieselId: ci.eDiesel, etaDualId: ci.eDual,
      etaDieselIdEf: ciEf.eDiesel, rcIdEf: ciEf.rc,
      traza: tz, mTot, Sp, Vd: G.Vd, Vc: G.Vc, Vivc, xpMax, pEvo, Vevo, gEvo: gE,
    };
    dTexh = Math.abs(TexhNew - Texh);
    if (dTexh < 0.05) { Texh = TexhNew; break; }
    Texh = TexhNew;
  }
  out.iters = iters;
  out.dTexh = dTexh;
  out.convTexh = dTexh < 0.05;

  // ---- pliego --------------------------------------------------------------
  const arr = arranque(mk, r, fk, P.Thom);
  out.arr = arr;
  out.okFase  = out.ca50 !== null && out.ca50 >= P.ca50Lo && out.ca50 <= P.ca50Hi;
  out.okRuido = out.dpMax <= P.dpLim;
  out.okPres  = out.pmax <= P.pLim;
  out.okEsc   = out.Tbrida <= P.tEscLim;
  out.okPar   = out.bmep >= P.bmepMin;
  out.okFrio  = arr.arranca;
  // margen de humo: NO es criterio, es una lectura que el laboratorio declara
  out.margenHumo = out.lam - LAM_HUMO;
  out.rMecOk  = r <= P.rMax;
  out.pInyOk  = pIny <= P.pInyMax;
  out.construible = out.rMecOk && out.pInyOk;
  out.valida  = CRIT.every(k => out[k]) && out.construible;
  return out;
}

// ==================================================================== barridos
function opcionesR(mk) { return R_G.filter(r => r <= MAQ[mk].rMax); }
function opcionesP(mk) { return PINY_G.filter(p => p <= MAQ[mk].pInyMax); }

// sim() es pura y determinista, asi que el barrido de una maquina se calcula
// una sola vez y se guarda. Nadie modifica la lista devuelta: validas() la
// filtra (array nuevo) y solucion() ordena esa copia, no el original.
const _BAR = new Map();
function barrido(mk) {
  const hit = _BAR.get(mk);
  if (hit) return hit;
  const res = [];
  for (const r of opcionesR(mk)) for (const s of SOI_G)
    for (const pi of opcionesP(mk)) for (const fk of FUEL_KEYS) {
      res.push(sim(mk, r, s, pi, fk));
    }
  _BAR.set(mk, res);
  return res;
}
function validas(mk) { return barrido(mk).filter(s => s.valida); }

function solucion(mk) {
  const v = validas(mk);
  if (!v.length) return null;
  v.sort((a, b) => (a.coste5 - b.coste5) || (a.pmax - b.pmax)
                || (a.r - b.r) || (a.soi - b.soi) || (a.pIny - b.pIny));
  return v[0];
}

function censo(mk) {
  const b = barrido(mk);
  const tot = {}, solo = {};
  for (const k of CRIT) { tot[k] = 0; solo[k] = 0; }
  let val = 0;
  for (const s of b) {
    const fallan = CRIT.filter(k => !s[k]);
    if (!fallan.length) { val++; continue; }
    for (const k of fallan) tot[k]++;
    if (fallan.length === 1) solo[fallan[0]]++;
  }
  return { n: b.length, validas: val, tot, solo };
}

function pistas(mk) {
  const v = validas(mk);
  if (!v.length) return [];
  const s = solucion(mk);
  const out = [];
  let c = v.slice();
  c = c.filter(x => x.fuel === s.fuel);
  out.push({ txt: 'combustible', v: s.fuel, n: c.length });
  c = c.filter(x => x.r === s.r);
  out.push({ txt: 'relacion de compresion', v: s.r, n: c.length });
  c = c.filter(x => x.pIny === s.pIny);
  out.push({ txt: 'presion de inyeccion', v: s.pIny, n: c.length });
  return out;
}

// ====================================================== FORMATO DE CIFRAS
const NBSP=' ';
const sepMil=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,NBSP);
function fN(x,n){
  if(!isFinite(x)) return '∞';
  const neg=x<0||Object.is(x,-0);
  const a=Math.abs(x).toFixed(n);
  const [e,d]=a.split('.');
  return (neg?'−':'')+sepMil(e)+(d?','+d:'');
}
const f0=x=>fN(x,0), f1=x=>fN(x,1), f2=x=>fN(x,2), f3=x=>fN(x,3), f4=x=>fN(x,4);
const pc1=x=>fN(100*x,1)+NBSP+'%';
const pc2=x=>fN(100*x,2)+NBSP+'%';
const pcm=x=>Number.isFinite(x)?((x>=0?'+':'')+pc1(x)):'—';
const fin=(x,n)=>Number.isFinite(x)?fN(x,n===undefined?1:n):'∞';
const bar=p=>fN(p/1e5,1);            // Pa  → bar
const cm3=v=>fN(v*1e6,1);            // m³  → cm³
const gra=t=>fN(t,1)+'°';            // grados de cigüeñal
const mg=m=>fN(m*1e6,1);             // kg  → mg
const ms=t=>fN(t*1000,3);            // s   → ms

// ============================================================ §3 ESTADO
const MODES=['ciclo','retardo','riel','frio','censo','reto'];
let mode='ciclo';
let animT=0, autoRunning=false, solved=false;

// El banco ofrece la rejilla COMPLETA: 8 relaciones de compresión, 5 avances de
// inyección, 4 presiones de riel y 4 combustibles. No todas se pueden montar en
// todas las máquinas —el bloque tiene un tope mecánico y la bomba un tope de
// presión—, así que las combinaciones fuera de alcance se marcan como NO
// CONSTRUIBLES y quedan fuera del censo del pliego.
const ST={mk:'urbano',r:16,soi:10,pIny:1800,fk:'uba'};
const RETO={cfg:{mk:'marino'},ejes:{r:R_G[0],soi:SOI_G[0],pIny:PINY_G[0],fk:FUEL_KEYS[0]},
            sol:null,nval:0,resuelto:false,msg:'',
            // Dos pistas como máximo, registradas; ninguna da valores de la terna.
            pistas:{p1:false,p2:false},pistaTxt:[],intentos:0,aviso:''};
const MAX_INTENTOS=3, MAX_PISTAS=2;
const nPistas=()=>(RETO.pistas.p1?1:0)+(RETO.pistas.p2?1:0);
// El compacto urbano NO entra en el reto: su solución es justo el punto con que
// arranca el modo de estudio (y el de los enunciados del cuestionario), así que
// sortearlo sería regalarla. Las otras cuatro máquinas rotan.
const RETO_MAQS=['tractor','camioneta','planta','marino'];
let CUR=null;

const ICONO={tractor:'🚜',camioneta:'🛻',planta:'🏭',urbano:'🚗',marino:'🚢'};
const CALENT_ROT={rejilla:'rejilla de admisión',bujias:'bujías incandescentes',
                  ambas:'rejilla + bujías',agua:'precalentador de agua'};
const CRIT_ROT={okFase:'fase de combustión (CA50)',okRuido:'gradiente de presión',
                okPres:'presión máxima',okEsc:'temperatura de escape',
                okPar:'par entregado',okFrio:'arranque en frío'};
const CRIT_COR={okFase:'fase',okRuido:'ruido',okPres:'presión',okEsc:'escape',
                okPar:'par',okFrio:'frío'};

// barrido de ambiente para la vista de frío: cubre desde por debajo del CFPP
// más bajo (−28 °C) hasta muy por encima de la homologación más cálida (+5 °C)
const T_G=[]; for(let t=-32;t<=20;t+=1) T_G.push(t);

const NPTS=MAQ_KEYS.length*R_G.length*SOI_G.length*PINY_G.length*FUEL_KEYS.length;
const NMEC=MAQ_KEYS.reduce((a,mk)=>a+opcionesR(mk).length*SOI_G.length*opcionesP(mk).length*FUEL_KEYS.length,0);

function cfgDe(m){
  if(m==='reto') return {mk:RETO.cfg.mk,r:RETO.ejes.r,soi:RETO.ejes.soi,pIny:RETO.ejes.pIny,fk:RETO.ejes.fk};
  return {mk:ST.mk,r:ST.r,soi:ST.soi,pIny:ST.pIny,fk:ST.fk};
}
const kDe=c=>c.mk+'|'+c.r+'|'+c.soi+'|'+c.pIny+'|'+c.fk;

// Una sola simulación por configuración, con traza. Todo lo que se pinta, se
// rotula o se responde sale de este objeto.
const _SIM=new Map();
function simT(c){
  const k=kDe(c); let v=_SIM.get(k);
  if(!v){ v=sim(c.mk,c.r,c.soi,c.pIny,c.fk,{traza:true}); _SIM.set(k,v); }
  return v;
}

// Un solo barrido por máquina. De esa lista salen el censo, las válidas, la
// solución y las pistas. El motor sellado tiene sus propias funciones
// censo()/validas()/solucion()/pistas(); el puente de pruebas comprueba que lo
// que aquí se deriva coincide exactamente con lo que devuelven ellas.
const BAR_C=new Map(), CEN_C=new Map(), SOL_C=new Map(), VAL_C=new Map(), PIS_C=new Map();
function barM(mk){ let v=BAR_C.get(mk); if(!v){ v=barrido(mk); BAR_C.set(mk,v); } return v; }
function valM(mk){ let v=VAL_C.get(mk); if(!v){ v=barM(mk).filter(s=>s.valida); VAL_C.set(mk,v); } return v; }
function solM(mk){
  let v=SOL_C.get(mk);
  if(v===undefined){
    const c=valM(mk).slice();
    c.sort((a,b)=>(a.coste5-b.coste5)||(a.pmax-b.pmax)||(a.r-b.r)||(a.soi-b.soi)||(a.pIny-b.pIny));
    v=c.length?c[0]:null; SOL_C.set(mk,v);
  }
  return v;
}
function censoM(mk){
  let v=CEN_C.get(mk);
  if(!v){
    const b=barM(mk), tot={}, solo={};
    for(const k of CRIT){ tot[k]=0; solo[k]=0; }
    let val=0;
    for(const s of b){
      const f=CRIT.filter(k=>!s[k]);
      if(!f.length){ val++; continue; }
      for(const k of f) tot[k]++;
      if(f.length===1) solo[f[0]]++;
    }
    v={n:b.length,validas:val,tot,solo}; CEN_C.set(mk,v);
  }
  return v;
}
// El embudo de pistas va combustible → relación de compresión → presión de
// riel. El avance de inyección NO se regala nunca: es el eje que el alumno
// tiene que cerrar leyendo el pliego.
function pisM(mk){
  let v=PIS_C.get(mk);
  if(!v){
    const val=valM(mk), s=solM(mk);
    if(!s){ v=[]; }
    else{
      let c=val.slice(); v=[];
      c=c.filter(x=>x.fuel===s.fuel);   v.push({txt:'combustible',v:s.fuel,n:c.length});
      c=c.filter(x=>x.r===s.r);         v.push({txt:'relación de compresión',v:s.r,n:c.length});
      c=c.filter(x=>x.pIny===s.pIny);   v.push({txt:'presión de riel',v:s.pIny,n:c.length});
    }
    PIS_C.set(mk,v);
  }
  return v;
}
const PIS_EJE=['fk','r','pIny'];
const EJE_ROT={r:'relación de compresión',soi:'avance de inyección',pIny:'presión de riel',fk:'combustible'};

// barridos de un eje con el resto de la configuración congelada
const _SW=new Map();
function swp(tag,c,eje,vals){
  const k=tag+'|'+kDe(c);
  let v=_SW.get(k);
  if(!v){
    v=vals.map(x=>{ const d={mk:c.mk,r:c.r,soi:c.soi,pIny:c.pIny,fk:c.fk}; d[eje]=x;
                    return sim(d.mk,d.r,d.soi,d.pIny,d.fk); });
    _SW.set(k,v);
  }
  return v;
}
const sweepR=c=>swp('r',c,'r',R_G);
const sweepS=c=>swp('s',c,'soi',SOI_G);
const sweepP=c=>swp('p',c,'pIny',PINY_G);
// para la vista de retardo: el barrido de avance repetido con los 4 combustibles
function sweepSF(c){
  return FUEL_KEYS.map(fk=>({fk,serie:sweepS({mk:c.mk,r:c.r,soi:c.soi,pIny:c.pIny,fk})}));
}
// arranque en frío: barrido de r a la temperatura de homologación, y barrido de
// temperatura ambiente con la r elegida
const arrR=c=>R_G.map(r=>arranque(c.mk,r,c.fk,MAQ[c.mk].Thom));
const arrT=c=>T_G.map(t=>arranque(c.mk,c.r,c.fk,t));

const maqAct=()=>MAQ[cfgDe(mode).mk];
const fallosDe=s=>CRIT.filter(k=>!s[k]);
function construible(c){ const P=MAQ[c.mk]; return c.r<=P.rMax && c.pIny<=P.pInyMax; }

// Cambiar de máquina nunca deja al alumno en una configuración imposible: lo
// que se sale del tope mecánico o del tope de bomba baja al mayor valor que esa
// máquina sí monta. Elegir a mano una opción marcada con ⚠ sigue permitido —de
// eso trata media práctica—, pero entonces es una decisión, no una herencia.
function aplicaMaquina(mk){
  const P=MAQ[mk];
  ST.mk=mk;
  ST.r=clamp(ST.r,R_G[0],R_G[R_G.length-1]);
  if(ST.r>P.rMax) ST.r=opcionesR(mk).slice(-1)[0];
  ST.pIny=PINY_G.indexOf(ST.pIny)<0?PINY_G[PINY_G.length-1]:ST.pIny;
  if(ST.pIny>P.pInyMax) ST.pIny=opcionesP(mk).slice(-1)[0];
  ST.soi=SOI_G.indexOf(ST.soi)<0?SOI_G[2]:ST.soi;
  if(FUEL_KEYS.indexOf(ST.fk)<0) ST.fk=FUEL_KEYS[0];
  return P;
}

// ===================== 5. EL PLIEGO =====================
// Las seis filas del pliego con el valor medido y el límite al lado. Es la
// única fuente del veredicto: el dock, el informe y el reto leen de aquí.
// En los 3 200 puntos de la rejilla la integral del retardo SIEMPRE llega a 1
// antes de la apertura de escape: no hay ninguna configuración que no encienda,
// así que ca50 nunca es nulo y el pliego no necesita un caso «no arranca».
function pliegoFilas(s,P){
  const frio=!s.arr.okFluido ? 'gelificado a '+f0(P.Thom)+' °C'
                             : fN(s.arr.margen,0)+' K';
  return [
    {k:'okFase', med:fN(s.ca50,2)+'°',        lim:f0(P.ca50Lo)+'–'+f0(P.ca50Hi)+'°',   ok:s.okFase},
    {k:'okRuido',med:fN(s.dpMax,2)+' bar/°',  lim:'≤ '+fN(P.dpLim,1)+' bar/°',         ok:s.okRuido},
    {k:'okPres', med:bar(s.pmax)+' bar',      lim:'≤ '+f0(P.pLim/1e5)+' bar',          ok:s.okPres},
    {k:'okEsc',  med:f0(s.Tbrida)+' K',       lim:'≤ '+f0(P.tEscLim)+' K',             ok:s.okEsc},
    {k:'okPar',  med:fN(s.bmep,2)+' bar',     lim:'≥ '+fN(P.bmepMin,2)+' bar',         ok:s.okPar},
    {k:'okFrio', med:frio,                    lim:'≥ 0 K a '+f0(P.Thom)+' °C',         ok:s.okFrio},
  ];
}
// Lo que exige cada criterio, en una línea: es lo que dice la ficha al tocarla.
const CRIT_POR={
  okFase:'el 50 % de la dosis tiene que estar quemado en la ventana del pliego, después del PMS: ni empujando contra el pistón que sube ni tan tarde que la expansión ya no lo aproveche.',
  okRuido:'el gradiente de presión es el picado del diésel: lo pone la premezcla, lo que se inyectó durante el retardo y arde de golpe.',
  okPres:'el pico de presión no puede pasar de lo que aguantan el bloque, la junta y los cojinetes de esta máquina.',
  okEsc:'el gas que llega a la brida no puede pasar de lo que aguantan la válvula, el colector y la turbina.',
  okPar:'la presión media al freno tiene que dar el par que pide el encargo, después de pagar bombeo, fricción y bomba de inyección.',
  okFrio:'a la temperatura de homologación el gasóleo tiene que llegar líquido (CFPP) y el aire comprimido tiene que pasar su umbral de autoencendido.'};

// ===================== 6. EL DOCK DE INSTRUMENTOS =====================
/* Las gráficas no viven en la escena: un pizarrón 3D se ve ladeado, pequeño y
   borroso. Viven en el panel derecho, en lienzos del DOM medidos en píxeles de
   la pantalla (devicePixelRatio), con la tipografía del laboratorio, y se leen
   igual a 1366 que a 2000 al 125 %. Cada lienzo lleva encima una capa
   transparente donde sólo se pinta el cursor θ: la gráfica se repinta al
   cambiar la calibración; el cursor, en cada cuadro, con el MISMO reloj que
   mueve el pistón y el chorro (sección 9.4). */
const FUENTE_DOCK='Outfit,system-ui,"Segoe UI",Roboto,sans-serif';
let bx=null;                                   // el contexto en el que pintan las primitivas
const LZ={};                                   // los dos lienzos del dock
const DK={A:null,B:null,yMax:0,cur:null,chip:null};
function lienzo(id){
  const box=el(id);
  const c=box.querySelector('canvas.g'), o=box.querySelector('canvas.o');
  return {box,c,o,ctx:c.getContext('2d'),octx:o.getContext('2d'),w:0,h:0,dpr:1};
}
// El lienzo se dimensiona a su caja en CSS por la densidad de la pantalla.
function ajustaLienzo(L){
  const r=L.box.getBoundingClientRect(), dpr=Math.min(3,window.devicePixelRatio||1);
  const w=Math.max(20,Math.round(r.width)), h=Math.max(20,Math.round(r.height));
  if(L.w===w&&L.h===h&&L.dpr===dpr) return false;
  for(const c of [L.c,L.o]){ c.width=Math.round(w*dpr); c.height=Math.round(h*dpr); }
  L.w=w; L.h=h; L.dpr=dpr; return true;
}
function abre(L){ ajustaLienzo(L); bx=L.ctx; bx.setTransform(L.dpr,0,0,L.dpr,0,0); bx.clearRect(0,0,L.w,L.h); }
// El marco de una gráfica dentro de su lienzo: sitio para los números de los ejes.
const marco=L=>({x:46,y:12,w:L.w-46-12,h:L.h-12-36});

function texto(t,x,y,col,size,align,weight){
  bx.fillStyle=col||TINTA;
  bx.font=(weight||'600')+' '+(size||12)+'px '+FUENTE_DOCK;
  bx.textAlign=align||'left'; bx.textBaseline='alphabetic';
  bx.fillText(t,x,y); bx.textAlign='left'; }
function linea(x1,y1,x2,y2,col,w,dash){
  bx.strokeStyle=col||'#2b3446'; bx.lineWidth=w||1;
  bx.setLineDash(dash||[]); bx.beginPath(); bx.moveTo(x1,y1); bx.lineTo(x2,y2); bx.stroke();
  bx.setLineDash([]); }
function curva(pts,col,w,dash){ if(!pts.length) return;
  bx.strokeStyle=col||AZUL; bx.lineWidth=w||2; bx.setLineDash(dash||[]); bx.lineJoin='round';
  bx.beginPath(); bx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) bx.lineTo(pts[i][0],pts[i][1]);
  bx.stroke(); bx.setLineDash([]); }
// Área bajo una curva hasta la línea y0 (en píxeles).
function relleno(pts,y0,col){ if(pts.length<2) return;
  bx.fillStyle=col; bx.beginPath(); bx.moveTo(pts[0][0],y0);
  for(const p of pts) bx.lineTo(p[0],p[1]);
  bx.lineTo(pts[pts.length-1][0],y0); bx.closePath(); bx.fill(); }
// Ejes con rejilla. `tx`/`ty` son el número de divisiones o la lista de marcas.
function ejes(P,xmin,xmax,ymin,ymax,rotX,rotY,fmtX,fmtY,tx,ty){
  const X=v=>P.x+P.w*(v-xmin)/(xmax-xmin), Y=v=>P.y+P.h-P.h*(v-ymin)/(ymax-ymin);
  const marcas=(t,a,b)=>Array.isArray(t)?t:Array.from({length:(t||5)+1},(_,i)=>a+(b-a)*i/(t||5));
  const mx=marcas(tx,xmin,xmax), my=marcas(ty,ymin,ymax);
  bx.strokeStyle='rgba(143,179,172,0.10)'; bx.lineWidth=1;
  for(const v of mx){ const x=Math.round(X(v))+0.5; bx.beginPath(); bx.moveTo(x,P.y); bx.lineTo(x,P.y+P.h); bx.stroke(); }
  for(const v of my){ const y=Math.round(Y(v))+0.5; bx.beginPath(); bx.moveTo(P.x,y); bx.lineTo(P.x+P.w,y); bx.stroke(); }
  linea(P.x,P.y+P.h+0.5,P.x+P.w,P.y+P.h+0.5,'#3d5550',1);
  linea(P.x-0.5,P.y,P.x-0.5,P.y+P.h,'#3d5550',1);
  for(const v of mx) texto(fmtX?fmtX(v):fN(v,1),X(v),P.y+P.h+14,'#8fa6a1',11,'center','500');
  for(const v of my) texto(fmtY?fmtY(v):fN(v,1),P.x-6,Y(v)+4,'#8fa6a1',11,'right','500');
  if(rotX) texto(rotX,P.x+P.w/2,P.y+P.h+31,'#b4c9c4',11.5,'center','600');
  if(rotY){ bx.save(); bx.translate(13,P.y+P.h/2); bx.rotate(-Math.PI/2);
    texto(rotY,0,0,'#b4c9c4',11.5,'center','600'); bx.restore(); }
  return {X,Y,P,xmin,xmax,ymin,ymax}; }
function punteo(x,y,col,r){ bx.fillStyle=col||AZUL; bx.beginPath(); bx.arc(x,y,r||3.5,0,Math.PI*2);
  bx.fill(); bx.strokeStyle='#0a1513'; bx.lineWidth=1.2; bx.stroke(); }
function anillo(x,y,col,r){ bx.strokeStyle=col||'#eaf1fb'; bx.lineWidth=1.8;
  bx.beginPath(); bx.arc(x,y,r||7,0,Math.PI*2); bx.stroke(); }
function banda(A,x1,x2,y1,y2,col){ bx.fillStyle=col;
  const a=Math.max(A.X(x1),A.P.x), b=Math.min(A.X(x2),A.P.x+A.P.w);
  if(b>a) bx.fillRect(a,A.Y(y2),b-a,A.Y(y1)-A.Y(y2)); }
function hbar(x,y,w,h,frac,col){ bx.fillStyle='rgba(255,255,255,0.06)';
  bx.beginPath(); bx.roundRect(x,y,w,h,h/2); bx.fill();
  const f=Math.max(0,Math.min(1,frac));
  if(f>0){ bx.fillStyle=col||AZUL; bx.beginPath(); bx.roundRect(x,y,Math.max(h,w*f),h,h/2); bx.fill(); } }
const colOk=b=>b?OK_HEX:BAD_HEX;
// Traza del ciclo en el plano p–V; barridos; series genéricas; ventana en θ.
function seriePV(A,tr){ const pts=[];
  for(let i=0;i<tr.V.length;i++) pts.push([A.X(tr.V[i]*1e6),A.Y(tr.p[i]/1e5)]); return pts; }
function serieBar(A,arr,ejeX,fnY){ return arr.map(s=>[A.X(s[ejeX]),A.Y(fnY(s))]); }
function serieXY(A,arr,fnX,fnY){ return arr.map((s,i)=>[A.X(fnX(s,i)),A.Y(fnY(s,i))]); }
function serieVen(A,tr,fn,x0,x1){ const p=[];
  for(let i=0;i<tr.th.length;i++){ const th=tr.th[i]; if(th<x0||th>x1) continue; p.push([A.X(th),A.Y(fn(i))]); }
  return p; }
// El lazo de bombeo SUPUESTO: V y p del periodo abierto, que el motor no integra.
function lazoAbierto(R,P){
  const pts=[];
  for(let c=TH_EVO;c<=DIST.ivc;c+=2){ const A=estadoAbierto(R,P,c); pts.push([A.V,A.p]); }
  return pts;
}
// La liberación de calor de la calibración, de grado en cuarto de grado: los
// dos ritmos del motor sellado y su máximo, para normalizar la curva.
const _HRR=new Map();
function hrrDe(R){
  let v=_HRR.get(R); if(v) return v;
  const th=[], p=[], d=[]; let mx=1e-12;
  for(let t=-60;t<=TH_EVO;t+=0.25){ const q=ritmos(R,t); th.push(t); p.push(q.p); d.push(q.d); mx=Math.max(mx,q.p+q.d); }
  let mp=1e-12, md=1e-12; for(let i=0;i<th.length;i++){ mp=Math.max(mp,p[i]); md=Math.max(md,d[i]); }
  v={th,p,d,mx,mp,md}; _HRR.set(R,v); return v;
}

// ---- 6.2 las vistas del dock, una por modo ----
const VEN_B=[-40,100];                       // ventana en θ de la gráfica de la combustión
function dockCiclo(conCoste){
  const c=cfgDe(mode), P=MAQ[c.mk], s=CUR, tr=s.traza;
  // p–V: el ciclo real contra el Dual ideal de aire frío con el MISMO calor
  abre(LZ.A);
  const Vc=s.Vc, p2=P.pAdm*Math.pow(c.r,G_FRIO)/1e5, al=s.alfaId, rcD=s.rcDual;
  const Vmax=Math.ceil((s.Vc+s.Vd)*1e6/100)*100;
  const yT=Math.max(20,Math.ceil(Math.max(s.pmax/1e5,al*p2)*1.06/20)*20);
  const A=ejes(marco(LZ.A),0,Vmax,0,yT,'volumen del cilindro V (cm³)','presión p (bar)',v=>f0(v),v=>f0(v),5,4);
  const idl=[];
  for(let i=0;i<=48;i++){ const V=Vc*(c.r-(c.r-1)*i/48);
    idl.push([A.X(V*1e6),A.Y(P.pAdm/1e5*Math.pow(c.r*Vc/V,G_FRIO))]); }
  idl.push([A.X(Vc*1e6),A.Y(al*p2)]);
  const Vx=Vc*rcD, px=al*p2;
  idl.push([A.X(Vx*1e6),A.Y(px)]);
  for(let i=0;i<=48;i++){ const V=Vx+(c.r*Vc-Vx)*i/48;
    idl.push([A.X(V*1e6),A.Y(px*Math.pow(Vx/V,G_FRIO))]); }
  idl.push([A.X(c.r*Vc*1e6),A.Y(P.pAdm/1e5)]);
  bx.save(); bx.beginPath(); bx.rect(A.P.x,A.P.y,A.P.w,A.P.h); bx.clip();
  curva(idl,VIO,1.4,[5,4]);
  curva(lazoAbierto(s,P).map(q=>[A.X(q[0]*1e6),A.Y(q[1]/1e5)]),WARN_HEX,1.5,[2,3]);
  curva(seriePV(A,tr),AZUL,2.4);
  bx.restore();
  texto('PMS',A.X(s.Vc*1e6)+4,A.P.y+A.P.h-5,'#8fa6a1',10.5,'left','600');
  texto('PMI',A.X((s.Vc+s.Vd)*1e6)-4,A.P.y+A.P.h-5,'#8fa6a1',10.5,'right','600');

// ===================== 8. MÁQUINA EN 3D =====================
/* El motor de este laboratorio, cortado por un plano que pasa por el eje del
   primer cilindro, como los motores seccionados de los talleres de formación:
   se conserva la mitad de atrás y las caras del corte van rayadas. El resto
   del bloque —tres, cuatro o seis cilindros según la máquina— sigue detrás SIN
   CORTAR, y se lee en la culata, en los inyectores y en el colector.
   Nada de lo que se mueve tiene una cota inventada: carrera, biela, diámetro y
   relación de compresión se leen de la máquina elegida y del motor sellado;
   lo que se añade —culata, levas, válvulas, tobera, la forma del bowl— son
   proporciones de oficio que se declaran en la ficha y que el script de
   verificación comprueba. */

// ---- 8.1 · COTAS Y LEYES DEL 3D (aritmética pura, sin three.js) ----
// Todo lo que se mueve en la escena sale de aquí, y este bloque no sabe nada de
// mallas: un script de node lo extrae tal cual y lo comprueba contra el motor
// sellado (posición del pistón, Vc = Vd/(r − 1) con el bowl, sincronía 2:1,
// alzados, holguras y penetración del chorro).
const ESC3=10;                         // 1 m del motor = 10 unidades de escena
const CRUCE=12;                        // ° de cruce a cada lado del PMS de escape (declarado)
// La distribución en grados de ciclo c ∈ [0,720), c = 0 en el PMS de combustión.
// IVC y EVO son los del motor sellado; IVO y EVC son los típicos y se declaran.
const DIST={ivo:360-CRUCE, ivc:TH_IVC+720, evo:TH_EVO, evc:360+CRUCE};
const LEVA_F=0.10;                     // flancos de aceleración: 10 % de la apertura a cada lado
const cicloDe=th=>((th%720)+720)%720;
// θ en [−360, 360): el mismo ángulo que usa la traza del motor (0 = PMS de combustión).
const thDe=c=>{ const x=cicloDe(c); return x>=360?x-720:x; };
const FASES=[['admisión',360,540],['compresión',540,720],['expansión',0,180],['escape',180,360]];
function faseDe(c){ c=cicloDe(c);
  for(const f of FASES) if(c>=f[1]&&c<f[2]) return f[0];
  return 'admisión'; }

/* LEY DE ALZADO: aceleración senoidal por tramos —un pulso positivo corto en
   cada flanco y uno negativo largo en la nariz—. Es continua hasta la
   aceleración (C²): el taqué no recibe ningún golpe al abrir ni al cerrar, y
   la leva que la genera es CONVEXA con un taqué plano. Normalizada: L(0)=L(1)=0,
   L(½)=1. Devuelve alzado, velocidad y aceleración respecto de u. */
function leyAlzado(u){
  const f=LEVA_F, W=1-2*f, A=Math.PI/(f*(f+2*W/Math.PI)), D=2*A*f/W;
  if(u<=0||u>=1) return {L:0,v:0,a:0};
  if(u>0.5){ const r=leyAlzado(1-u); return {L:r.L,v:-r.v,a:r.a}; }
  if(u<=f){ const s=Math.sin(Math.PI*u/f), c=Math.cos(Math.PI*u/f);
    return {L:A*f/Math.PI*(u-f/Math.PI*s), v:A*f/Math.PI*(1-c), a:A*s}; }
  const vf=2*A*f/Math.PI, Lf=A*f*f/Math.PI, w=u-f;
  const s=Math.sin(Math.PI*w/W), c=Math.cos(Math.PI*w/W);
  return {L:Lf+vf*w-D*W/Math.PI*(w-W/Math.PI*s), v:vf-D*W/Math.PI*(1-c), a:-D*s};
}
// Alzado de una válvula en el ciclo c (°). `dL` es dL/dθ en unidades por RADIÁN
// de cigüeñal, que es lo que pide la síntesis de la leva.
function alzado(V,c){
  c=cicloDe(c);
  let d=c-V.c0; if(d<0) d+=720;
  if(d>=V.dur) return {L:0,dL:0};
  const k=leyAlzado(d/V.dur), durRad=V.dur*DEG;
  return {L:V.Lmax*k.L, dL:V.Lmax*k.v/durRad};
}

/* LAS COTAS DE LA MÁQUINA EN LA ESCENA. Origen en el eje del cigüeñal; y hacia
   arriba; el plano de corte es z = 0 y se conserva la mitad z ≤ 0.
   Culata de inyección directa: cara de fuego PLANA, inyector vertical en el eje
   del cilindro y la cámara labrada en el pistón (el bowl). Dos árboles en
   cabeza con taqués de vaso; en el corte se ve una válvula de admisión y una de
   escape EN EL PLANO, como lo dibujan los manuales —en la culata real de cuatro
   válvulas la gemela de cada una está desplazada a lo largo del cigüeñal—. Las
   válvulas van casi verticales: la inclinación es la MÍNIMA con la que el
   lóbulo de la leva libra el pozo del inyector, y como la cara de fuego es
   plana, el plato inclinado queda rehundido en su asiento (el receso cuenta en
   el volumen muerto). */
const PROP3D={            // proporciones de oficio respecto del diámetro B (o en metros, donde se dice)
  dAdm:0.33, dEsc:0.29,   // diámetro de las cabezas de válvula (culata diésel de 4 válvulas)
  LDadm:0.23, LDesc:0.25, // alzado máximo / diámetro de válvula
  rb:0.18,                // radio del círculo base de la leva (> 2,15·L_máx: nariz convexa)
  vastago:0.060, largoV:1.30, // diámetro del vástago y largo de la válvula
  vaso:0.150, vasoH:0.27, vasoT:0.036, // radio, altura y espesor de corona del taqué
  muelleR:0.105, muelleHilo:0.018, muelleL:0.42, muelleVueltas:5.5,
  asiento:0.032,          // anillo del asiento postizo alrededor del plato
  libre:0.020,            // holgura mínima lóbulo / vaso – pozo del inyector
  hComp:0.62,             // altura de compresión del pistón, FIJA: la r la elige el bowl
  squish:0.0009,          // m — holgura pistón–culata en el PMS (0,9 mm)
  junta:0.0012,           // m — junta de culata comprimida: el pistón asoma 0,3 mm sobre el bloque
  toberaR:0.040,          // radio del cuerpo de la tobera en la culata
  puntaR:0.019,           // radio de la punta (el saco de los orificios)
  puntaSale:0.028,        // cuánto asoma la punta bajo la cara de fuego
  inyR:0.090,             // radio del cuerpo del inyector en el pozo
  pozoHolg:0.012,         // holgura del pozo alrededor del cuerpo
  delta:15,               // ° — ejes de los chorros bajo la horizontal (cono de 150°)
  bolLabio:0.27,          // radio del labio del bowl (la boca, más estrecha: bowl reentrante)
  bolMax:0.31,            // radio máximo del bowl, bajo el labio
  bolPivote:0.10,         // radio del pie del cono central
  zMaxRel:0.40,           // profundidad del radio máximo / profundidad del bowl
  bujR:0.026,             // radio de la vaina de la bujía incandescente
  bujSale:0.040,          // cuánto asoma bajo la cara de fuego
  bujRad:0.17,            // a qué radio del eje cae su punta
  bujInc:22,              // ° de inclinación de su eje respecto de la vertical
  ldOrif:5,               // largo/diámetro del orificio de la tobera (para el ángulo del cono)
};
// Perfil del bowl en ω: radio exterior r_o(z) y del cono central r_i(z) a la
// profundidad z bajo la corona, para una profundidad total D. El labio es más
// estrecho que el vientre (reentrante): r_o sube con una S de pendiente nula en
// los dos extremos y baja por un cuarto de toro hasta el fondo.
function bolForma(G,D){
  const zM=PROP3D.zMaxRel*D, rho=D-zM, zP=Math.max(0.32*D,G.zPmin);
  return {D,zM,rho,zP,rL:G.rL,rM:G.rM,rP:G.rP};
}
function bolRo(F,z){
  if(z<0||z>F.D) return 0;
  if(z<=F.zM){ const s=Math.sin(Math.PI*z/(2*F.zM)); return F.rL+(F.rM-F.rL)*s*s; }
  const q=z-F.zM; return F.rM-F.rho+Math.sqrt(Math.max(0,F.rho*F.rho-q*q));
}
function bolRi(F,z){ return z<=F.zP?0:F.rP*(z-F.zP)/(F.D-F.zP); }
// Volumen del bowl: π·∫(r_o² − r_i²) dz, Simpson con 400 tramos.
function volBol(F){
  const N=400, h=F.D/N; let s=0;
  for(let i=0;i<=N;i++){ const z=i===N?F.D:i*h, ro=bolRo(F,z), ri=bolRi(F,z);
    s+=(ro*ro-ri*ri)*(i===0||i===N?1:(i%2?4:2)); }
  return Math.PI*s*h/3;
}
// Ángulos (azimut alrededor del eje) de los orificios de la tobera. El primero
// apunta a −x, en el plano de corte; los que salen hacia z > 0 caen en la mitad
// que se quita y no se dibujan.
function orificios(n){ const a=[]; for(let k=0;k<n;k++) a.push(Math.PI+2*Math.PI*k/n); return a; }
const visibleOr=phi=>Math.sin(phi)<=1e-9;

function cotas3D(mk,r){
  const P=MAQ[mk], E=ESC3, B=P.B*E, R=B/2, a=P.S/2*E, L=P.L*E;
  const Ap=Math.PI*R*R, Vd=Ap*P.S*E, Vc=Vd/(r-1);
  const hComp=PROP3D.hComp*B, sq=PROP3D.squish*E;
  const yHd=a+L+hComp+sq;                             // cara de fuego de la culata
  const tG=PROP3D.junta*E, yBd=yHd-tG;                 // cara superior del bloque
  // la tobera: cuerpo, punta y cuánto asoma
  const rNoz=PROP3D.toberaR*B, rT=PROP3D.puntaR*B, prot=PROP3D.puntaSale*B;
  const yT=yHd-prot;                                   // lo más bajo de la punta
  const rIny=PROP3D.inyR*B, rWell=rIny+PROP3D.pozoHolg*B;
  const valv=(lado,dRel,LD,c0,dur)=>{
    const d=dRel*B, rv=d/2, s=lado, Lmax=LD*d, rb=PROP3D.rb*B, Lv=PROP3D.largoV*B;
    const rIns=rv+PROP3D.asiento*B, xV=R-0.022*B-rIns;
    const camS=Lv+PROP3D.vasoT*B+rb;                   // de la cara del plato al centro del árbol
    const rTaq=PROP3D.vaso*B+0.006*B, sVaso=Lv+PROP3D.vasoT*B-PROP3D.vasoH*B;
    const lib=PROP3D.libre*B;
    // La inclinación MÍNIMA con la que el lóbulo (radio r_b + L_máx) y el vaso
    // libran el pozo del inyector. Con cero no caben: el pozo pasa entre los árboles.
    const sL=(rWell+lib+rb+Lmax-xV)/camS, sV=(rWell+lib+rTaq-xV)/sVaso;
    const alfa=Math.asin(clamp(Math.max(sL,sV,0),0,Math.sin(12*DEG)));
    const ca=Math.cos(alfa), sa=Math.sin(alfa);
    const n=[s*sa,ca];                                 // eje de la válvula, hacia arriba y afuera
    // El borde exterior del plato —el más bajo— queda al ras de la cara de fuego.
    const cx=s*xV, cy=yHd+rv*sa;
    return {lado:s, d, rv, rIns, xV, alfa, cx, cy, n, Lv, c0, dur, Lmax, rb, camS, rTaq,
      cam:[cx+n[0]*camS, cy+n[1]*camS],
      receso:Math.PI*rv*rv*rv*Math.tan(alfa)};         // la cuña entre la cara de fuego y el plato
  };
  const VA=valv(-1,PROP3D.dAdm,PROP3D.LDadm,DIST.ivo,DIST.ivc-DIST.ivo);
  const VE=valv( 1,PROP3D.dEsc,PROP3D.LDesc,DIST.evo,DIST.evc-DIST.evo);
  // Cuatro válvulas por cilindro: dos dibujadas y sus gemelas, con el mismo receso.
  const Vrec=2*VA.receso+2*VE.receso;
  // Lo que asoma dentro de la cámara y le quita volumen: la punta de la tobera
  // (cilindro y casquete) y, si la máquina la lleva, la bujía incandescente.
  const Vtip=Math.PI*rT*rT*(prot-rT)+2/3*Math.PI*rT*rT*rT;
  let buj=null, Vbuj=0;
  if(P.calent==='bujias'||P.calent==='ambas'){
    const rg=PROP3D.bujR*B, inc=PROP3D.bujInc*DEG, sale=PROP3D.bujSale*B, rad=PROP3D.bujRad*B;
    const ors=orificios(P.nOr).filter(visibleOr), paso=2*Math.PI/P.nOr;
    // entre dos chorros, en el que más mira hacia el fondo (z < 0), lejos del corte
    let psi=Math.PI+paso/2, mejor=1e9;
    for(let k=0;k<P.nOr;k++){ const p=Math.PI+(k+0.5)*paso; if(Math.sin(p)>-0.5) continue;
      const e=Math.abs(p-1.5*Math.PI); if(e<mejor){ mejor=e; psi=p; } }
    const Lc=(sale-rg)/Math.cos(inc);                  // de la cara de fuego al centro del casquete, por el eje
    const centro=[rad*Math.cos(psi), yHd-(sale-rg), rad*Math.sin(psi)];
    const eje=[Math.sin(inc)*Math.cos(psi), Math.cos(inc), Math.sin(inc)*Math.sin(psi)];
    buj={rg, inc, sale, rad, psi, Lc, centro, eje};
    Vbuj=Math.PI*rg*rg*Lc+2/3*Math.PI*rg*rg*rg;
  }
  // El bowl: su profundidad se resuelve para que el volumen muerto sea V_d/(r − 1).
  //   V_c = A_p·squish + V_bowl + V_recesos − V_punta − V_bujía
  const zPmin=prot-sq+0.022*B;                         // el cono central no toca la punta en el PMS
  const G0={rL:PROP3D.bolLabio*B, rM:PROP3D.bolMax*B, rP:PROP3D.bolPivote*B, zPmin};
  const Vobj=Vc-Ap*sq-Vrec+Vtip+Vbuj;
  let lo=zPmin*1.05, hi=0.40*B;
  for(let k=0;k<64;k++){ const m=(lo+hi)/2; if(volBol(bolForma(G0,m))<Vobj) lo=m; else hi=m; }
  const bol=bolForma(G0,(lo+hi)/2), Vbol=volBol(bol);
  // los chorros
  const delta=PROP3D.delta*DEG;
  const ors=orificios(P.nOr);
  return {mk,r,B,R,a,L,Ap,Vd,Vc,hComp,sq,yHd,yBd,tG,rNoz,rT,prot,yT,rIny,rWell,VA,VE,
    Vrec,Vtip,buj,Vbuj,bol,Vbol,Vobj,delta,ors,orVis:ors.filter(visibleOr),nOr:P.nOr,dOr:P.dOr};
}
// Mecanismo biela-manivela exacto: y del eje del bulón medido desde el cigüeñal.
// x(θ) = a·cosθ + √(L² − a²·sen²θ) — la MISMA fórmula que alimenta vol() del motor.
function bulonY(G,th){ const t=th*DEG, s=Math.sin(t);
  return G.a*Math.cos(t)+Math.sqrt(G.L*G.L-G.a*G.a*s*s); }
const coronaY=(G,th)=>bulonY(G,th)+G.hComp;
// Volumen encerrado leído de la GEOMETRÍA dibujada (unidades de escena³): el
// cilindro entre la corona y la cara de fuego, el bowl y los recesos, menos lo
// que asoma (punta de la tobera y bujía).
const volCamara3D=(G,th)=>G.Ap*(G.yHd-coronaY(G,th))+G.Vbol+G.Vrec-G.Vtip-G.Vbuj;
// Inclinación de la biela (rad), positiva cuando la muñequilla está a +x.
function bielaAng(G,th){ const t=th*DEG; return Math.atan2(G.a*Math.sin(t),
  Math.sqrt(G.L*G.L-G.a*G.a*Math.sin(t)**2)); }
/* SÍNTESIS DE LA LEVA para taqué plano. El taqué toca la leva en una recta
   perpendicular a su eje; con la leva girada, esa recta está a rb + L(θ) del
   centro. La envolvente de esas rectas ES el perfil:
        P(ψ) = (rb + L)·u(ψ) + (dL/dψ)·u⊥(ψ)
   donde ψ es la dirección del taqué vista desde la leva. La leva gira a la
   MITAD que el cigüeñal (ψ = ψ₀ + θ/2), así que dL/dψ = 2·dL/dθ. El perfil no
   se dibuja «a ojo»: es exactamente el que produce el alzado de arriba. */
const camRot=th=>-th*DEG/2;                           // giro del árbol (rotation.z), horario visto de frente
function perfilLeva(V,N){
  const n=N||240, w=Math.atan2(-V.n[1],-V.n[0]), pts=[];  // w: del centro de la leva hacia el taqué
  for(let k=0;k<n;k++){
    const c=720*k/n, al=alzado(V,c), psi=w+c*DEG/2;
    const R=V.rb+al.L, t=2*al.dL;
    pts.push([R*Math.cos(psi)-t*Math.sin(psi), R*Math.sin(psi)+t*Math.cos(psi)]);
  }
  return pts;
}
// Lo que la leva ya girada empuja: el apoyo del perfil en la dirección del taqué.
function empujeLeva(pts,V,th){
  const ph=camRot(th), c=Math.cos(ph), s=Math.sin(ph), wx=-V.n[0], wy=-V.n[1];
  let m=-1e9;
  for(const p of pts){ const x=c*p[0]-s*p[1], y=s*p[0]+c*p[1]; m=Math.max(m,x*wx+y*wy); }
  return m-V.rb;
}
// Punto más bajo del plato de una válvula con alzado L (el borde exterior).
const platoBajo=(V,L)=>[V.cx+V.lado*V.rv*Math.cos(V.alfa)-V.n[0]*L, V.cy-V.rv*Math.sin(V.alfa)-V.n[1]*L];

/* EL CHORRO. Penetración de Hiroyasu y Arai (SAE 900475): antes de romperse,
   el líquido avanza a 0,39·√(2Δp/ρ_l); después, como una mezcla turbulenta,
   S = 2,95·(Δp/ρ_a)^¼·√(d₀·t). El ángulo del cono es el de Reitz y Bracco
   (tan θ/2 = 4π/A·√(ρ_a/ρ_l)·√3/6, A = 3 + 0,28·l/d₀). La longitud líquida es
   ESQUEMÁTICA: L_liq = 18·d₀·√(ρ_l/ρ_a), del orden de las medidas de Siebers;
   más allá sólo hay vapor. El motor sellado no usa nada de esto: es dibujo, y
   se declara. */
function penetracionHA(t,dp,rhoL,rhoA,d0){
  if(!(t>0)) return 0;
  const tb=28.65*rhoL*d0/Math.sqrt(rhoA*dp);
  return t<tb?0.39*Math.sqrt(2*dp/rhoL)*t:2.95*Math.pow(dp/rhoA,0.25)*Math.sqrt(d0*t);
}
const tRuptura=(dp,rhoL,rhoA,d0)=>28.65*rhoL*d0/Math.sqrt(rhoA*dp);
function semiCono(rhoA,rhoL){ const A=3+0.28*PROP3D.ldOrif;
  return Math.atan(4*Math.PI/A*Math.sqrt(rhoA/rhoL)*Math.sqrt(3)/6); }
const K_LIQ=18;
const longLiquida=(d0,rhoL,rhoA)=>K_LIQ*d0*Math.sqrt(rhoL/rhoA);
// Datos del chorro de una calibración (en metros y segundos): lo que no cambia
// con el ángulo. ρ_a es la densidad del gas en el inicio de la inyección.
function chorroDe(R,mk,fk){
  const P=MAQ[mk], F=FUEL[fk], G=geom(P,R.r);
  const rhoL=F.rho*1000, rhoA=R.mTot/vol(G,-R.soi*DEG), dp=Math.max(R.pIny*1e5-R.pSoi,1e5);
  return {thSOI:-R.soi, thEOI:-R.soi+R.thIny, w:6*P.rpm, rhoL, rhoA, dp, d0:P.dOr,
    tb:tRuptura(dp,rhoL,rhoA,P.dOr), semi:semiCono(rhoA,rhoL), Lliq:longLiquida(P.dOr,rhoL,rhoA),
    vIny:0.39*Math.sqrt(2*dp/rhoL)};
}
// Penetración (m) de una porción inyectada en θi, vista en θ.
const sPorcion=(C,thi,th)=>penetracionHA((th-thi)/C.w,C.dp,C.rhoL,C.rhoA,C.d0);
// ¿Dentro de la cámara? (x radial, y, en unidades de escena; yC = corona)
function enCamara(G,rad,y,yC){
  if(y>G.yHd||rad>G.R) return false;
  if(y>=yC) return true;
  const z=yC-y, F=G.bol;
  return z<=F.D&&rad<bolRo(F,z)&&rad>bolRi(F,z);
}
// Distancia (escena) desde el orificio hasta la pared a lo largo del eje del chorro.
function paredChorro(G,yC){
  const o=origenChorro(G), c=Math.cos(G.delta), s=Math.sin(G.delta), h=G.B/400;
  let t=0;
  while(t<1.2*G.B){ const t2=t+h; if(!enCamara(G,o[0]+t2*c,o[1]-t2*s,yC)) break; t=t2; }
  return t;
}
// El orificio: en el casquete de la punta, en la dirección del chorro.
const origenChorro=G=>[G.rT*Math.cos(G.delta), G.yT+G.rT-G.rT*Math.sin(G.delta)];
// Los dos ritmos de quemado del motor sellado, por separado (fracción de la
// dosis por grado): la premezcla —lo que se acumuló durante el retardo— y la
// difusión. Su suma es exactamente la dx_b/dθ que integra el motor.
function ritmos(R,th){
  if(R.thSOC===null||!(th>R.thSOC)) return {p:0,d:0};
  return {p:R.beta*dwiebeP(th,R.thSOC,R.dthP,M_PREM), d:(1-R.beta)*dwiebeD(th,R.thSOC,R.dthD,M_DIF)};
}

/* EL PERIODO ABIERTO —de EVO a IVC— NO LO INTEGRA EL MOTOR. Para que el
   pistón, las gráficas y el panel no se queden congelados 450° de cada 720, se
   dibuja con un estado SUPUESTO que empalma con la traza en sus dos extremos y
   que la pantalla declara como tal:
     · soplado (EVO → PMI): p cae de p_EVO a p_esc con una ley cuadrática en el
       ángulo, y T sigue la isentrópica del gas quemado —la misma con la que el
       motor calcula su T de escape—, así que en el PMI vale exactamente T_esc;
     · carrera de escape: p_esc y T_esc;
     · cruce (IVO → EVC): p pasa de p_esc a p_adm en línea recta;
     · admisión: p_adm, y T es la mezcla por masas del residual a T_esc con el
       AIRE que ya entró (en un diésel no entra combustible por la admisión):
       en el IVC da la T₀ con la que arranca la traza;
     · PMI → IVC: p pasa de p_adm al p₀ con que arranca la traza.
   Q es la fracción del aire ya admitido, medida por volumen barrido. V sale de
   vol(), la misma función que integra el motor. */
function estadoAbierto(R,P,c){
  c=cicloDe(c);
  const tr=R.traza, n=tr.th.length, Gm=geom(P,R.r);
  const Vde=x=>vol(Gm,thDe(x)*DEG);
  const pE=tr.p[n-1], TE=tr.T[n-1], pEsc=P.pEscBase, pAdm=P.pAdm, p0=tr.p[0];
  const g=gammaMez(TE,R.xpMax), k=(g-1)/g;
  const mRes=R.fRes*R.mTot, mFres=R.mTot-mRes;
  const Vi=Vde(DIST.ivo), Vb=Vde(540);
  const Q=c<=DIST.ivo?0:clamp((Vde(Math.min(c,540))-Vi)/(Vb-Vi),0,1);
  let p, T, tramo;
  if(c<=180){ const u=clamp((c-TH_EVO)/(180-TH_EVO),0,1);
    p=pEsc+(pE-pEsc)*(1-u)*(1-u); T=TE*Math.pow(p/pE,k); tramo='soplado'; }
  else if(c<=DIST.ivo){ p=pEsc; T=R.Texh; tramo='escape'; }
  else{
    if(c<DIST.evc){ p=pEsc+(pAdm-pEsc)*(c-DIST.ivo)/(DIST.evc-DIST.ivo); tramo='cruce'; }
    else if(c<=540){ p=pAdm; tramo='admision'; }
    else { p=pAdm+(p0-pAdm)*(c-540)/(DIST.ivc-540); tramo='admision'; }
    T=(Q*mFres*P.Tadm+mRes*R.Texh)/(Q*mFres+mRes);
  }
  return {p, T, Q, V:Vde(c), tramo};
}
/* EL ARRASTRE EN FRÍO. El motor sellado no integra un ciclo de arranque: da la
   politrópica de arrastre (n, r_ef, T y p en el PMS). En el modo de frío el 3D
   gira a las vueltas de arrastre y pinta ESA politrópica entre IVC y EVO:
   T(θ) = T_adm·(V_IVC/V)^(n−1), p(θ) = p_adm·(V_IVC/V)^n, que en el PMS dan
   exactamente la T y la p de arranque() del motor. */
function estadoArrastre(A,P,r,th){
  const Gm=geom(P,r), Vivc=vol(Gm,TH_IVC*DEG), V=vol(Gm,th*DEG), q=Vivc/V;
  return {p:P.pAdm*Math.pow(q,A.n), T:A.Tadm*Math.pow(q,A.n-1), V};
}

// ---- 8.2 · CALIDAD, MATERIALES Y RAYADOS ----
/* Dos niveles de calidad. «media» —móviles, pantallas estrechas, equipos que
   declaran dos núcleos o menos, o ?calidad=media en la dirección— lleva menos
   partículas, menos segmentos en las piezas de revolución, sombras a 1024 y
   sin el desenfoque de profundidad, que es el pase de postproceso caro. La
   resolución NO baja: píxel min(DPR, 1,5) y el mismo antialias, porque una
   imagen escalada se ve borrosa y eso no ahorra lo que cuesta. Antes «media»
   se elegía con cuatro núcleos o menos y pintaba a píxel 1: en una pantalla al
   125 % eso es una imagen estirada. Se cambia en vivo desde la barra de vistas. */
const CAL3={nivel:'alta',motivo:''};
(function(){
  const q=(location.search.match(/[?&]calidad=(alta|media)\b/)||[])[1];
  const movil=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  const nucleos=navigator.hardwareConcurrency||8;
  const flojo=movil||innerWidth<820||nucleos<=2;
  CAL3.nivel=q||(flojo?'media':'alta');
  CAL3.motivo=q?'elegida en la dirección':(flojo?(movil?'móvil':(innerWidth<820?'pantalla estrecha':'el equipo declara '+nucleos+' núcleos')):'');
})();
const calAlta=()=>CAL3.nivel==='alta';
const SEG3=()=>calAlta()?40:24;          // segmentos de las medias piezas de revolución

/* LA PIEL DE LAS PIEZAS FUNDIDAS. Un solo juego de mapas para todo el motor
   —la arena del molde deja la misma piel en el bloque que en la culata—, hecho
   con la piel suave de §21: sin poro de alta frecuencia (el de castAluminum()
   se leía como lija sobre caras grandes) y con rugosidad que cambia despacio. */
const PIEL=P3.pielFundicion({semilla:11,celda:52,relieve:2.4});
for(const t of [PIEL.map,PIEL.roughnessMap,PIEL.normalMap]) t.repeat.set(0.55,0.55);
const pbr=(c,r,m,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r,metalness:m},o||{}));
const conPiel=(k)=>({map:PIEL.map, roughnessMap:PIEL.roughnessMap, normalMap:PIEL.normalMap,
  normalScale:new THREE.Vector2(k,k)});
/* Tinte por posición en el sombreador: el color de la pieza se multiplica por
   una función de su posición EN EL MOTOR (no de las uv), así el revenido del
   colector arranca en la brida de la culata y el aceite se oscurece con la
   profundidad sin vértices de color ni mallas aparte. */
function conTinte(mat,clave,uniformes,glsl,emisivo){
  mat.userData.u=uniformes;
  mat.customProgramCacheKey=()=>'tinte-'+clave;
  mat.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,uniformes);
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vPosM;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\nvPosM=transformed;');
    const decl=Object.keys(uniformes).map(k=>'uniform '+(uniformes[k].value&&uniformes[k].value.isVector2?'vec2':
      (uniformes[k].value&&uniformes[k].value.isColor?'vec3':'float'))+' '+k+';').join('\n');

      .replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\n'+(emisivo||''));
  };

const ESC_U={uBrida:{value:new THREE.Vector2()},uLargo:{value:1},uCalor:{value:0}};

vec3 tinte(vec3 p){

}

M3.tuboAlta=pbr('#b9c0c8',0.24,1.00,{envMapIntensity:1.0});   // tubo de alta presión, acero estirado
