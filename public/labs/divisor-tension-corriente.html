<style>
  :root{
    --bg:#08201C;--panel:rgba(9,26,23,.86);--line:#1E3A34;--ink:#EAF4F1;

  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(10,13,18,.92),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}

  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

  .badge{position:fixed;top:16px;right:20px;z-index:20;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,209,102,.12);color:var(--hv);border:1px solid rgba(255,209,102,.35);padding:6px 12px;border-radius:20px}

  .hud{position:fixed;top:70px;left:18px;z-index:15;max-width:330px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-height:calc(100vh - 150px);overflow-y:auto}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .hud h2{font-size:19px;line-height:1.15;margin-bottom:9px}
  .hud p{font-size:13px;line-height:1.55;color:var(--dim);margin-bottom:10px}
  .hud .formula{font-family:var(--mono);color:var(--accent2);text-align:center;font-size:12.5px;margin:8px 0;padding:8px;background:rgba(0,0,0,.25);border-radius:8px;line-height:1.5}
  .hud .src{font-size:10.5px;color:#7a8894;font-style:italic;margin-top:4px;line-height:1.5}
  .legend{display:flex;flex-direction:column;gap:6px;margin:12px 0;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:10px}

  .fid{margin:10px 0 2px;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:10px;border:1px solid rgba(79,209,197,.18)}
  .fid .ft{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);margin-bottom:6px}
  .fid .fl{font-size:11px;color:#c4d0da;line-height:1.5;margin-bottom:5px}
  .fid .fl b{color:var(--ink)}
  .fid .fl.no b{color:var(--hv)}

  .panel{position:fixed;top:70px;right:18px;z-index:15;width:262px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:16px;max-height:calc(100vh - 150px);overflow-y:auto}
  .panel h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:2px 0 10px}
  .panel h4.sec{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .g{margin-bottom:6px}
  .gl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .gl b{color:var(--accent2)}
  .gl b.good{color:var(--good)}.gl b.warn{color:var(--hv)}.gl b.bad{color:var(--bad)}
  .modebar{display:flex;gap:5px;margin-bottom:8px}
  .modebar .b{flex:1;padding:8px 4px;font-size:11px}
  .btns{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .b{font-family:system-ui;font-size:12.5px;padding:10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#1b242f;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#202c38}
  .b.on{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:bold}
  .b.primary{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:bold}
  .b.auto{border-color:var(--hv);color:var(--hv);background:rgba(255,183,3,.10);font-weight:bold}
  .b.auto:hover{background:rgba(255,183,3,.18);border-color:var(--hv)}
  .b.auto:disabled{opacity:.6;cursor:default}
  .b.dx{text-align:left;font-size:12px}
  .b.dx.right{background:rgba(52,211,153,.18);border-color:var(--good);color:var(--good);font-weight:bold}
  .b.dx.wrong{background:rgba(244,71,94,.15);border-color:var(--bad);color:var(--bad)}
  .console{font-family:var(--mono);font-size:11px;line-height:1.55;color:#c4d0da;background:rgba(0,0,0,.28);border-radius:9px;padding:10px 12px;margin-bottom:8px;min-height:56px}

  .hint{position:fixed;bottom:18px;left:18px;z-index:14;font-family:var(--mono);font-size:10px;color:var(--dim);background:var(--panel);padding:7px 12px;border-radius:9px;border:1px solid var(--line)}
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(18,24,32,.95);border:1px solid var(--accent);padding:10px 20px;border-radius:40px;font-family:var(--mono);font-size:12px;opacity:0;transition:.3s;pointer-events:none;max-width:80vw;text-align:center}
  .toast.show{opacity:1}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}
  .soundBtn:hover{transform:scale(1.08)}
  .inspectHint{position:fixed;bottom:18px;right:18px;z-index:14;font-family:var(--mono);font-size:10px;color:var(--accent2);background:var(--panel);padding:7px 12px;border-radius:9px;border:1px solid var(--line)}

  @media(max-width:820px){
    .hud,.panel{position:fixed;left:8px;right:8px;top:auto;bottom:8px;max-width:none;width:auto;max-height:42vh;overflow-y:auto}
    .hud{bottom:calc(8px + 42vh + 8px)}
    .hint,.inspectHint{display:none}
  }

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.26, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;
    }
    if(hook)hook(dt,t); controls.update();
    if(bokeh) bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);
    composer.render(); }
  function start(){ if(!raf)loop(); }
  function stop(){ cancelAnimationFrame(raf); raf=null; window.removeEventListener('resize',resize); }

  return { THREE, renderer, scene, camera, controls, composer, bloom,
    setAnimate:fn=>hook=fn, start, stop, resize, clock,
    flyTo:(v)=>{ controls.target.copy(v); }, moveTo, setCinematicIdle };
}

function pickerFor(scene,camera,dom,onHit){
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(); let down=null;
  dom.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);

    if(!down)return; const moved=Math.abs(e.clientX-down[0])+Math.abs(e.clientY-down[1])>6; down=null;

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

/* Análisis nodal modificado, extendido con e.on!==false para poder
   desconectar (circuito abierto) una rama resistiva como RL. */
function solveMNA(net){
  const n=net.nodes;
  const vs=net.elems.filter(e=>e.type==='V');
  const N=n+vs.length;
  const A=Array.from({length:N},()=>new Array(N).fill(0));
  const z=new Array(N).fill(0);
  net.elems.forEach(e=>{
    if(e.type==='R'&&e.on!==false){
      const g=1/e.value, a=e.a-1, b=e.b-1;
      if(a>=0)A[a][a]+=g;
      if(b>=0)A[b][b]+=g;
      if(a>=0&&b>=0){A[a][b]-=g;A[b][a]-=g;}
    }else if(e.type==='I'){
      const a=e.a-1, b=e.b-1;
      if(a>=0)z[a]-=e.value;
      if(b>=0)z[b]+=e.value;
    }
  });
  vs.forEach((e,k)=>{
    const r=n+k, a=e.a-1, b=e.b-1;
    if(a>=0){A[r][a]=1;A[a][r]=1;}
    if(b>=0){A[r][b]=-1;A[b][r]=-1;}
    z[r]=e.value;
  });
  for(let c=0;c<N;c++){
    let p=c;
    for(let r=c+1;r<N;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;
    [A[c],A[p]]=[A[p],A[c]];[z[c],z[p]]=[z[p],z[c]];
    for(let r=c+1;r<N;r++){
      const f=A[r][c]/A[c][c];
      if(!f)continue;
      for(let k=c;k<N;k++)A[r][k]-=f*A[c][k];
      z[r]-=f*z[c];
    }
  }
  const x=new Array(N).fill(0);
  for(let r=N-1;r>=0;r--){
    let s=z[r];
    for(let k=r+1;k<N;k++)s-=A[r][k]*x[k];
    x[r]=s/A[r][r];
  }
  return {V:[0,...x.slice(0,n)],srcI:x.slice(n)};
}

/* Resuelve el divisor de tensión con y sin carga y devuelve Vo cargado,
   Vo ideal, error de carga (%) y corriente de reposo (mA) — usado tanto
   por el reto como por el motor de verificación. */
function retoSolve(V,RL,r1,r2){
  const netLoaded={nodes:2,elems:[
    {id:'V1',type:'V',a:1,b:0,value:V},
    {id:'R1',type:'R',a:1,b:2,value:r1},
    {id:'R2',type:'R',a:2,b:0,value:r2},
    {id:'RL',type:'R',a:2,b:0,value:RL,on:true},
  ]};
  const netIdeal=JSON.parse(JSON.stringify(netLoaded));
  netIdeal.elems.find(e=>e.id==='RL').on=false;
  const vo=solveMNA(netLoaded).V[2];
  const voIdeal=solveMNA(netIdeal).V[2];
  const err=Math.abs(voIdeal-vo)/voIdeal*100;
  const iq=V/(r1+r2)*1000;
  return {vo,voIdeal,err,iq};
}

function boardClick(u,v){
  const x=u*1024,y=(1-v)*768;
  const HIT=mode==='corriente'?HIT_CORRIENTE:HIT_DIVISOR;
  let best=null,bd=1e9;
  HIT.forEach(h=>{const d=Math.hypot(x-h.x,y-h.y);if(d<h.r&&d<bd){bd=d;best=h;}});
  if(!best)return;
  if(mode==='corriente'){toastEl(best.el,true);return;}
  if(best.sw){
    if(mode==='carga'){toggleCarga();}
    else if(mode==='reto'){showToast('En el reto, RL siempre está conectada: forma parte del problema de diseño.');}
    else{showToast('El interruptor de RL se controla desde el modo Carga.');}
    return;
  }
  if(best.vo){toastVo();return;}
  toastEl(best.el,false);
}

function showToast(html){
  const t=el('toast');t.innerHTML=html;t.classList.add('show');
  clearTimeout(showToast._t);showToast._t=setTimeout(()=>t.classList.remove('show'),3200);
}
function toastEl(id,isI){
  if(isI){
    const e=ELI(id);
    if(e.type==='I'){
      showToast(`<b style="color:var(--accent2)">${id} · ${fmtI(e.value)}</b><br><span style="color:var(--dim);font-size:11px">Fuente de corriente ideal: entrega ${fmtI(e.value)} sin importar la resistencia de la red (modelo — sin resistencia interna).</span>`);
    }else{
      const i=iThruI(e),b=bandsFor(e.value);
      const bandas=`${BAND_NAMES[b.d1]}-${BAND_NAMES[b.d2]}-${BAND_NAMES[b.mult]}-oro`;
      showToast(`<b style="color:var(--accent2)">${id} · ${fmtR(e.value)}</b><br><span style="color:var(--dim);font-size:11px">Bandas: ${bandas}. I = ${fmtI(Math.abs(i))} (reparto de corriente, inverso a la resistencia).</span>`);
    }
    return;
  }
  const e=EL(id);
  if(e.type==='V'){
    showToast(`<b style="color:var(--accent2)">${id} · ${fmtV(e.value)}</b><br><span style="color:var(--dim);font-size:11px">Fuente ideal: fija el voltaje de entrada del divisor (sin resistencia interna — modelo).</span>`);
    return;
  }
  const off=e.on===false;
  const i=off?0:iThru(e),b=bandsFor(e.value);
  const bandas=`${BAND_NAMES[b.d1]}-${BAND_NAMES[b.d2]}-${BAND_NAMES[b.mult]}-oro`;
  const info=off?`Bandas: ${bandas}. Desconectada (circuito abierto): I = 0 mA.`:`Bandas: ${bandas}. I = ${fmtI(Math.abs(i))}.`;
  showToast(`<b style="color:var(--accent2)">${id} · ${fmtR(e.value)}${off?' · OFF':''}</b><br><span style="color:var(--dim);font-size:11px">${info}</span>`);
}
function toastVo(){
  const on=EL('RL').on;
  const err=on?Math.abs(SOL_IDEAL.V[2]-SOL.V[2])/SOL_IDEAL.V[2]*100:0;
  const info=on
    ?`Vo ideal (sin carga) = ${SOL_IDEAL.V[2].toFixed(3)} V · Vo actual (con RL) = ${SOL.V[2].toFixed(3)} V · error de carga = ${err.toFixed(2)} %.`
    :`Vo = ${SOL.V[2].toFixed(3)} V (RL desconectada: coincide con el ideal).`;
  showToast(`<b style="color:var(--accent2)">Nodo Vo</b><br><span style="color:var(--dim);font-size:11px">${info}</span>`);
}

  corriente:{nombre:'Corriente',cam:[[-0.1,2.2,4.3],[-0.9,1.75,-0.8]],mision:'Un segundo circuito, con fuente de corriente ideal: el reparto I1/I2 es inverso a la resistencia.'},

function setMode(k){

      teleRow('Vin',fmtV(EL('V1').value))+

    const on=EL('RL').on;

  }else if(mode==='corriente'){
    const i1=iThruI(ELI('R1c'))*1e3,i2=iThruI(ELI('R2c'))*1e3,i0=selI0*1e3;
    t.innerHTML=
      teleRow('I0',fmtI(selI0))+
      teleRow('R1c',fmtR(selR1c))+
      teleRow('R2c',fmtR(selR2c))+
      teleRow('I1 (por R1c)',i1.toFixed(3)+' mA','good')+
      teleRow('I2 (por R2c)',i2.toFixed(3)+' mA','good')+
      teleRow('ΣI − I0',fmtSum(i1+i2-i0)+' mA','good');
  }else{
    const r1=numOr('inR1'),r2=numOr('inR2'),sc=RETO_SCENARIOS[retoIdx];

        teleRow('I reposo','—')+
        teleRow('RL (fija)',fmtR(sc.RL))+
        teleRow('Estado','Escribe R1 y R2','warn');

        teleRow('I reposo',r.iq.toFixed(2)+' mA',okI?'good':'warn')+
        teleRow('RL (fija)',fmtR(sc.RL))+
        teleRow('Estado',retoSolved?'✔ DISEÑO VALIDADO':(okV&&okErr&&okI?'Cumple — pulsa Comprobar':'No cumple aún'),retoSolved?'good':'warn');

function checkDesign(){
  const r1=numOr('inR1'),r2=numOr('inR2');
  if(!isFinite(r1)||!isFinite(r2)||r1<=0||r2<=0){showToast('Escribe R1 y R2 en Ω (números positivos).');return;}
  const sc=RETO_SCENARIOS[retoIdx];
  const r=retoSolve(sc.V,sc.RL,r1,r2);
  const tol=Math.max(0.05,sc.VoObj*0.02);
  const okV=Math.abs(r.vo-sc.VoObj)<=tol,okErr=r.err<=5,okI=r.iq<=25;
  if(okV&&okErr&&okI){
    retoSolved=true;synth.beep(1046,0.12,0.06);
    retoMsg=`<span class="mono"><span class="ok">✔ Diseño válido.</span> Vo = ${r.vo.toFixed(3)} V (objetivo ${sc.VoObj} V) · error de carga = ${r.err.toFixed(2)} % (≤5 %) · I reposo = ${r.iq.toFixed(2)} mA (≤25 mA).<br>Ejemplo de referencia (no la única solución): R1≈${sc.ref.R1} Ω, R2≈${sc.ref.R2} Ω.</span>`;
  }else{
    synth.beep(220,0.15,0.06);
    retoMsg=`<span class="mono"><span class="dtc">✗ Aún no.</span> Vo=${r.vo.toFixed(3)} V (${okV?'✓ dentro de tolerancia':'✗ fuera de objetivo '+sc.VoObj+' V'}) · error=${r.err.toFixed(2)}% (${okErr?'✓':'✗ supera 5 %'}) · I reposo=${r.iq.toFixed(2)} mA (${okI?'✓':'✗ supera 25 mA'}).</span>`;
  }
  resolve();refreshAll();
}
function updateRetoSpec(){
  const sc=RETO_SCENARIOS[retoIdx];
  el('retoSpec').innerHTML=`Con V=${fmtV(sc.V)} y RL=${fmtR(sc.RL)} (fijas), diseña R1 y R2 para lograr <b>Vo ≈ ${sc.VoObj} V</b>, con error de carga ≤5 % y corriente de reposo ≤25 mA.<br><span style="color:var(--dim)">Estos presupuestos (5 %, 25 mA) son la especificación de ESTE ejercicio, no una norma de fabricante.</span>`;
}
function newScenario(){
  const pick=()=>Math.floor(Math.random()*RETO_SCENARIOS.length);
  let idx=pick();
  if(RETO_SCENARIOS.length>1)while(idx===retoIdx)idx=pick();
  retoIdx=idx;retoSolved=false;retoMsg='';
  el('inR1').value='';el('inR2').value='';
  if(mode!=='reto')setMode('reto');
  else{updateRetoSpec();resolve();buildQuiz();solved=false;clearDx();refreshQuestion();refreshAll();}
  showToast('🔀 <b>Nuevo reto.</b> Nuevo objetivo de Vo y/o RL — vuelve a diseñar R1 y R2.');
  synth.beep(520,0.08,0.05);
}

/* ============================================================
   11) PREGUNTAS DE INGENIERÍA (reconstruidas con la red viva)
   ============================================================ */
function buildQuiz(){
  const exampleRL=EL('R2').value;
  const netEx=JSON.parse(JSON.stringify(NET));
  netEx.elems.find(e=>e.id==='RL').value=exampleRL;netEx.elems.find(e=>e.id==='RL').on=true;
  const vEx=solveMNA(netEx).V[2];
  const netOn=JSON.parse(JSON.stringify(NET));
  netOn.elems.find(e=>e.id==='RL').on=true;
  const vOn=solveMNA(netOn).V[2];
  const errOn=Math.abs(SOL_IDEAL.V[2]-vOn)/SOL_IDEAL.V[2]*100;
  const Rth=1/(1/EL('R1').value+1/EL('R2').value);
  const symmetric=selR1c===selR2c;
  const i1c=iThruI(ELI('R1c'))*1e3,i2c=iThruI(ELI('R2c'))*1e3;
  const smaller=selR1c<selR2c?'R1c':(selR2c<selR1c?'R2c':null);
  const sc=RETO_SCENARIOS[retoIdx],base=sc.ref;
  const stiff=retoSolve(sc.V,sc.RL,base.R1/3,base.R2/3);
  const loose=retoSolve(sc.V,sc.RL,base.R1*3,base.R2*3);
  QUIZ={
    explora:{
      pregunta:`Si más adelante conectas una RL = ${fmtR(exampleRL)} en paralelo con R2 (sin cambiar R1 ni R2), ¿qué le pasará a Vo?`,
      opciones:[
        {t:'Vo subirá, porque RL aporta otra trayectoria de corriente hacia la fuente',ok:false,why:'RL no aporta corriente extra a la fuente: es una carga, retira corriente del nodo Vo. Vo no puede subir por encima del valor sin carga.'},
        {t:'Vo se mantiene igual — el divisor no depende de lo que conectes a la salida',ok:false,why:'Es el error de diseño más común. La fórmula ideal Vo=V·R2/(R1+R2) solo vale con la salida en circuito abierto.'},
        {t:`Vo bajará a ${vEx.toFixed(3)} V, porque R2‖RL (${Math.round(1/(1/EL('R2').value+1/exampleRL))} Ω) es menor que R2 solo`,ok:true,why:`R2‖RL siempre es MENOR que R2 solo, así que el divisor entrega una fracción menor de V. Con RL=R2, Vo cae de ${SOL.V[2].toFixed(3)} V a ${vEx.toFixed(3)} V.`},
        {t:'Vo se invertirá (voltaje negativo)',ok:false,why:'Con fuentes y resistores positivos en este circuito no hay forma de que Vo cambie de signo.'},
      ],
    },
    carga:{
      pregunta:`Con R1=${fmtR(EL('R1').value)} y R2=${fmtR(EL('R2').value)}, al conectar RL el error de carga es ${errOn.toFixed(2)} %. ¿A qué se debe, exactamente?`,
      opciones:[
        {t:'A que la fuente V1 pierde voltaje bajo carga (tiene resistencia interna)',ok:false,why:'En este modelo V1 es una fuente IDEAL (sin resistencia interna) — el contrato de fidelidad lo declara. El error viene del divisor, no de la fuente.'},
        {t:`A que R2‖RL (${Math.round(1/(1/EL('R2').value+1/EL('RL').value))} Ω) es menor que R2 (${EL('R2').value} Ω), así que Vo=V·(R2‖RL)/(R1+(R2‖RL)) da un valor menor`,ok:true,why:`Exacto: al conectar RL en paralelo con R2, la resistencia combinada baja, y con ella la fracción de V que llega a Vo. Vth=${SOL_IDEAL.V[2].toFixed(3)} V, Rth=${Math.round(Rth)} Ω lo confirman: Vo=Vth·RL/(RL+Rth)=${vOn.toFixed(3)} V.`},
        {t:'A que R1 cambia de valor cuando hay carga conectada',ok:false,why:'R1 es un resistor fijo: su valor no cambia por lo que se conecte en la salida.'},
        {t:'Es un error de redondeo del simulador, no un efecto real',ok:false,why:'Es un efecto real y medible en cualquier divisor físico — por eso todo diseño de divisores debe considerar la impedancia de la siguiente etapa.'},
      ],
    },
    corriente:symmetric?{
      pregunta:`Con R1c = R2c = ${fmtR(selR1c)} (iguales), ¿cómo se reparte I0 = ${fmtI(selI0)} entre las dos ramas?`,
      opciones:[
        {t:`Mitad y mitad: I1 = I2 = ${i1c.toFixed(3)} mA`,ok:true,why:'Con resistencias iguales, el reparto del divisor de corriente es simétrico: cada rama se lleva exactamente la mitad de I0.'},
        {t:'Toda la corriente va por R1c porque aparece primero en el esquema',ok:false,why:'El orden en el dibujo no afecta el reparto físico: ambas ramas están en paralelo entre el mismo par de nodos.'},
        {t:'I1 será mayor porque R1c tiene una letra "1"',ok:false,why:'El reparto depende solo de los VALORES de resistencia, no de las etiquetas.'},
        {t:'No se puede repartir corriente entre dos resistencias iguales',ok:false,why:'Sí se puede — y de hecho es el caso más simple de todos: reparto exactamente igual.'},
      ],
    }:{
      pregunta:`Con R1c=${fmtR(selR1c)} y R2c=${fmtR(selR2c)}, ¿cuál rama se lleva MÁS corriente?`,
      opciones:[
        {t:`${smaller} (la de MENOR resistencia) se lleva más corriente: I=${(smaller==='R1c'?i1c:i2c).toFixed(3)} mA contra ${(smaller==='R1c'?i2c:i1c).toFixed(3)} mA`,ok:true,why:'El divisor de corriente reparte de forma INVERSA a la resistencia: el camino más "fácil" (menor R) se lleva la mayor parte de I0.'},
        {t:`${smaller==='R1c'?'R2c':'R1c'} (la de MAYOR resistencia) se lleva más corriente`,ok:false,why:'Es al revés: a mayor resistencia, mayor oposición al paso de corriente, así que esa rama recibe MENOS, no más.'},
        {t:'Ambas ramas llevan exactamente la misma corriente sin importar su valor',ok:false,why:`Solo ocurre cuando R1c=R2c. Aquí son distintas (${selR1c} Ω vs ${selR2c} Ω), así que el reparto también lo es.`},
        {t:'La corriente no se reparte: toda pasa por la de menor resistencia y nada por la otra',ok:false,why:`Ambas ramas están en paralelo entre los mismos dos nodos: SIEMPRE llevan algo de corriente (aquí ${i1c.toFixed(3)} mA y ${i2c.toFixed(3)} mA), nunca cero.`},
      ],
    },
    reto:{
      pregunta:`Si divides entre 3 los valores de referencia de este reto (R1≈${Math.round(base.R1/3)} Ω, R2≈${Math.round(base.R2/3)} Ω), ¿qué pasa con el error de carga y la corriente de reposo?`,
      opciones:[
        {t:`El error de carga baja a ${stiff.err.toFixed(2)} % pero I reposo SUBE a ${stiff.iq.toFixed(2)} mA — más "rígido" cuesta más corriente`,ok:true,why:`Resistencias más pequeñas hacen al divisor menos sensible a RL (más rígido), pero también dejan pasar más corriente de reposo: es la disyuntiva central del diseño de divisores.`},
        {t:`Ambos bajan: error a ${stiff.err.toFixed(2)} % y corriente a ${stiff.iq.toFixed(2)} mA`,ok:false,why:`Solo el error de carga baja. La corriente de reposo I=V/(R1+R2) SUBE cuando R1+R2 baja — no pueden mejorar los dos a la vez con este cambio.`},
        {t:'Ninguno cambia: el error de carga y la corriente de reposo no dependen de R1 ni R2',ok:false,why:'Ambos dependen directamente de R1 y R2 — por eso el reto pide diseñarlos, no adivinarlos.'},
        {t:`Multiplicar R1 y R2 por 3 (no dividir) sería la forma de bajar AMBOS a la vez: error ${loose.err.toFixed(2)} % e I reposo ${loose.iq.toFixed(2)} mA`,ok:false,why:`Al multiplicar por 3 la I reposo SÍ baja (${loose.iq.toFixed(2)} mA) pero el error de carga SUBE (${loose.err.toFixed(2)} %) — sigue siendo una disyuntiva, no una mejora conjunta.`},
      ],
    },
  };
}
function clearDx(){el('dxbtns').querySelectorAll('.b.dx').forEach(b=>b.classList.remove('right','wrong'));}
function refreshQuestion(){
  const q=QUIZ[mode];
  el('q_text').innerHTML=q.pregunta;
  el('dxbtns').innerHTML=q.opciones.map((o,i)=>`<button class="b dx" data-i="${i}">${'ABCD'[i]} · ${o.t}</button>`).join('');
  el('dxbtns').querySelectorAll('.b.dx').forEach(btn=>{btn.onclick=()=>answer(+btn.dataset.i);});
}
function answer(i){
  const o=QUIZ[mode].opciones[i];clearDx();
  const btn=el('dxbtns').children[i];
  if(o.ok){
    btn.classList.add('right');solved=true;synth.beep(1046,0.12,0.06);
    showToast(`<span style="color:var(--good)">✔ Correcto.</span><br><span style="color:var(--dim);font-size:11px">${o.why}</span>`);
  }else{
    btn.classList.add('wrong');synth.beep(220,0.15,0.06);
    showToast(`<span style="color:var(--bad)">✗ Revisa el modelo.</span><br><span style="color:var(--dim);font-size:11px">${o.why}</span>`);
  }
}

pickerFor(scene,S.camera,S.renderer.domElement,hit=>{
  if(!hit)return;
  if(hit.object===board&&hit.uv){boardClick(hit.uv.x,hit.uv.y);return;}
  let o=hit.object;
  while(o){
    const u=o.userData||{};
    if(u.el){toastEl(u.el,false);return;}
    if(u.title){showToast(`<b style="color:var(--accent2)">${u.title}</b><br><span style="color:var(--dim);font-size:11px">${u.info}</span>`);return;}
    o=o.parent;
  }
});

/* hover: etiquetas flotantes + cursor */
(()=>{
  const ray=new THREE.Raycaster(),v2=new THREE.Vector2();
  S.renderer.domElement.addEventListener('pointermove',ev=>{
    const r=S.renderer.domElement.getBoundingClientRect();
    v2.x=((ev.clientX-r.left)/r.width)*2-1;v2.y=-((ev.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(v2,S.camera);
    const hits=ray.intersectObjects(scene.children,true);
    HOVER_LABELS.forEach(lb=>lb.visible=false);
    let cursor='default';
    if(hits.length){
      let o=hits[0].object;
      while(o){
        if(HOVER_LABELS.has(o)){HOVER_LABELS.get(o).visible=true;cursor='pointer';break;}
        if(o.userData&&(o.userData.el||o.userData.title||o===board))cursor='pointer';
        o=o.parent;
      }
      if(hits[0].object===board)cursor='pointer';
    }
    S.renderer.domElement.style.cursor=cursor;
  });
})();

/* ============================================================
   13) RECORRIDO AUTOMÁTICO
   ============================================================ */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function runAuto(){
  if(autoRunning)return;autoRunning=true;
  const btn=el('btnAuto'),label=btn.textContent;
  btn.disabled=true;btn.classList.add('on');btn.textContent='⏳ Recorrido guiado en curso…';
  try{
    synth.init();synth.resume();
    clearDx();
    setMode('explora');
    showToast(`Paso 1 · Divisor ideal: Vo = V·R2/(R1+R2) = ${SOL.V[2].toFixed(3)} V, sin carga en la salida.`);await sleep(2600);
    setMode('carga');
    if(!cargaOn)toggleCarga();
    const err=Math.abs(SOL_IDEAL.V[2]-SOL.V[2])/SOL_IDEAL.V[2]*100;
    showToast(`Paso 2 · Con RL conectada, Vo cae a ${SOL.V[2].toFixed(3)} V (ideal ${SOL_IDEAL.V[2].toFixed(3)} V) — error de carga ${err.toFixed(2)} %.`);await sleep(3000);
    setMode('corriente');
    const i1c=iThruI(ELI('R1c'))*1e3,i2c=iThruI(ELI('R2c'))*1e3;
    showToast(`Paso 3 · Divisor de corriente: I1=${i1c.toFixed(3)} mA por R1c, I2=${i2c.toFixed(3)} mA por R2c — inverso a la resistencia.`);await sleep(3000);
    setMode('reto');
    showToast('Paso 4 · El reto: diseñar R1 y R2, no despejarlos de una fórmula única.');await sleep(2400);
    const sc=RETO_SCENARIOS[retoIdx];
    el('inR1').value=sc.ref.R1;el('inR2').value=sc.ref.R2;
    checkDesign();await sleep(2400);
    const q=QUIZ.reto,i=q.opciones.findIndex(o=>o.ok);
    clearDx();
    const dxBtn=el('dxbtns').children[i];
    if(dxBtn){dxBtn.classList.add('right');solved=true;synth.beep(1046,0.12,0.06);}
    showToast(`<span style="color:var(--good)">✔ ${q.opciones[i].t}</span><br><span style="color:var(--dim);font-size:11px">${q.opciones[i].why}</span>`);
  }finally{
    btn.disabled=false;btn.classList.remove('on');btn.textContent=label;autoRunning=false;
  }
}

/* ============================================================
   14) ANIMACIÓN + SONIDO + INIT
   ============================================================ */
S.setAnimate((dt,time)=>{
  const s=1+Math.sin(time*4)*0.18;
  Object.values(TP_GLOW).forEach(g=>g.scale.setScalar(s));
});

['explora','carga','corriente','reto'].forEach(m=>{el('m_'+m).onclick=()=>{if(!autoRunning)setMode(m);};});
el('btnAuto').onclick=runAuto;
el('btnNew').onclick=newScenario;
el('btnCheck').onclick=checkDesign;
['inR1','inR2'].forEach(id=>{
  el(id).addEventListener('input',onRetoInput);
  el(id).addEventListener('keydown',e=>{if(e.key==='Enter')checkDesign();});
});
el('soundBtn').onclick=()=>{const on=synth.toggle();el('soundBtn').textContent=on?'🔊 Sonido':'🔇 Sonido';};
document.addEventListener('pointerdown',()=>{synth.init();synth.resume();},{once:true});

resolve();buildQuiz();refreshNet3D();
