<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Postratamiento SCR con AdBlue — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#08161F;--panel:rgba(7,20,28,.88);--line:#21495C;--ink:#EAF4F8;
    --dim:#9BB8C4;--accent:#5BC8FF;--accent2:#A8E2FF;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cF:#5BC8FF;--cR:#FF6A55;--cE:#FF4D5A;--cG:#C8D6D2;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#0f2733;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#173748}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#031a20;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#031a20;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#8ad8ff}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#031a20}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#5BC8FF;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f87a0;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f90a8;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#031a20}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .escs{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
  .esc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px;font-size:11.5px;line-height:1.35;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);color:#c4d3e6}
  .esc .rs{font-weight:700;font-size:11px}.esc .rs.ok{color:var(--good)}.esc .rs.mal{color:#ff9a9a}
  .esc .pista{font-size:10.5px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#09121c;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(30,53,80,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,53,80,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f87a0}
  .dk-tit{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#a3bcd6;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c6da;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#0f2733;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfdcec;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  /* ---- el recorrido paso a paso y el aro que señala la pieza ---- */
  .tour{border:1px solid rgba(91,200,255,.38);background:rgba(91,200,255,.06);border-radius:12px;padding:10px 11px;display:flex;flex-direction:column;gap:7px}
  .tour .tn{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .tour .pts{display:flex;gap:5px}.tour .pts i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}.tour .pts i.on{background:var(--accent)}.tour .pts i.ok{background:var(--good)}
  .tour h3{font-size:16px;line-height:1.2}
  .tour .tx{font-size:13px;line-height:1.5;color:#d3e3ea}.tour .tx b{color:#fff}
  .tour .tb{display:flex;gap:6px}.tour .tb .b{flex:1}
  .tour .salta{align-self:flex-end;font-size:11px;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:0;font-family:inherit}
  .foco{position:fixed;z-index:14;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 3px rgba(91,200,255,.55),0 0 24px 6px rgba(91,200,255,.45);pointer-events:none;display:none;animation:pulso 1.5s ease-in-out infinite}
  @keyframes pulso{0%,100%{transform:scale(.88);opacity:.95}50%{transform:scale(1.12);opacity:.55}}
  @media (prefers-reduced-motion:reduce){.foco{animation:none}}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,18,30,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,18,30,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d3e6}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,18,30,.92);border:1px solid rgba(124,196,255,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,18,30,.84);border:1px solid rgba(124,196,255,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .chips{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .chip{font-size:11.5px;line-height:1.35;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--dim)}
  .chip b{color:var(--ink)} .chip small{font-size:10.5px;color:var(--dim)}
  .chip.ok{border-color:rgba(52,211,153,.5)} .chip.ok b{color:var(--good)} .chip.mal{border-color:rgba(244,71,94,.5)} .chip.mal b{color:#ff9aa8}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}
  body.estrecho.ancho.t-panel .panel>.dk-fig{grid-column:1;grid-row:2}
  body.estrecho.ancho.t-panel .panel>.dk-row{grid-column:1;grid-row:3/6;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-fu{grid-column:2;grid-row:2;align-self:start}
  body.estrecho.ancho.t-panel .panel>.dk-g.fu{grid-column:2;grid-row:2/4;min-height:0;margin-top:18px}
  body.estrecho.ancho.t-panel .panel>.dk-ley{display:none}
  body.estrecho.ancho.t-panel .panel>.t-sp{grid-column:2;grid-row:4}
  body.estrecho.ancho.t-panel .panel>.dk-g.sp{grid-column:2;grid-row:5;min-height:0}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';

/* ============================================================
   LAB — POSTRATAMIENTO SCR CON ADBLUE: NOx, DOSIFICACIÓN Y AMONÍACO RESIDUAL
   (Autotrónica · mecanica-144)

   El escape de un diésel en media sección: el motor suelta NOx, un inyector rocía AdBlue (urea al 32,5 %), el calor la
   vuelve amoníaco (NH3) y el catalizador de zeolita lo almacena y lo hace reaccionar con el NOx. El motor, la
   descomposición de la urea, el almacenamiento de NH3 por celdas y el balance de nitrógeno son un único modelo, en un
   bloque puro que un script de Node extrae TAL CUAL y verifica.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO='\u202F';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }



/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos marcas— y lo prueba:
   lo que se prueba es lo que corre. */
/* FISICA:INICIO */
/* ---- SCR con AdBlue: física pura (sin three). Unidades SI salvo donde se diga. ----
   Cadena: motor diésel (NOx crudo, gas de escape, temperatura) → inyección de AdBlue (urea 32,5 %) → descomposición de la
   urea en NH3 → catalizador de zeolita con cobre dividido en N celdas en serie, con NH3 ALMACENADO (cobertura θ)
   → NOx y NH3 a la salida. Todo cierra su balance de nitrógeno. */
const DOSPI=Math.PI*2, R_GAS=8.314462618;
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const suave=t=>t*t*(3-2*t);

/* ---- AdBlue: solución de urea al 32,5 % en masa (ISO 22241). Cada mol de urea da 2 mol de NH3:
   (NH2)2CO + H2O → 2 NH3 + CO2. ---- */
const ADB={w:0.325,rho:1.090,Murea:60.056,MNH3:17.031,MNO2:46.0055,Tcong:-11};      // kg/L; g/mol; °C
const NH3_L=2*ADB.w*ADB.rho*1000/ADB.Murea;                                         // mol de NH3 por litro de AdBlue
const molNH3DeLh=Lh=>Lh/3600*NH3_L;                                                  // L/h → mol/s de NH3 (urea completa)
const LhDeMolNH3=n=>n*3600/NH3_L;                                                    // mol/s de NH3 → L/h de AdBlue
const gUreaPorMol=ADB.Murea/2;                                                        // g de urea por mol de NH3
const molDeNOxGh=g=>g/ADB.MNO2/3600;                                                  // g/h de NOx (como NO2) → mol/s

/* ---- Motor diésel de 120 kW (mapa didáctico en la carga L de 0 a 1) ---- */
const MOT={Pmax:120e3,etaE:0.40,LHVd:35.9e6,cpG:1100,etaCal:0.80};                  // J/L de diésel; cp del gas J/(kg·K)
const motor=L=>{
  L=clamp(L,0,1); const P=L*MOT.Pmax, eNOx=3.0+4.5*L;                               // g/kWh de NOx crudo (como NO2)
  return {L,P,eNOx,mNOx:eNOx*P/1000,mGas:0.025+0.135*L,Tg:120+360*Math.pow(L,0.8),Pcomb:P/MOT.etaE};
};

/* ---- Catalizador de zeolita con cobre: V = 14 L en N = 8 celdas en serie ----
   Almacenamiento de NH3 de Langmuir con K(T) (la capacidad cae al subir T), reacción estándar
   4 NH3 + 4 NO + O2 → 4 N2 + 6 H2O (relación 1:1) sobre el NH3 adsorbido, y oxidación del NH3 almacenado a alta T. */
const CAT={V:0.014,N:8,Om:12,K0:500,Tref:623,dHK:4300,kd0:2.5,Ed:8420,ks0:700,Ts0:573,Es:7500,km0:140,ko0:0.20,To0:823,Eo:15000};
const Kads=T=>CAT.K0*Math.exp(CAT.dHK*(1/T-1/CAT.Tref));                             // m³/mol
const kdes=T=>CAT.kd0*Math.exp(-CAT.Ed*(1/T-1/CAT.Tref));                            // 1/s
const kads=T=>Kads(T)*kdes(T)*CAT.Om;                                                // balance detallado: ka/(kd·Ω) = K
const kreac=(T,f)=>{ const ks=CAT.ks0*Math.exp(-CAT.Es*(1/T-1/CAT.Ts0))*(f===undefined?1:f), km=CAT.km0*Math.pow(T/CAT.Ts0,1.5); return 1/(1/ks+1/km); };
const koxi=T=>CAT.ko0*Math.exp(-CAT.Eo*(1/T-1/CAT.To0));

/* ---- Descomposición de la urea (termólisis + hidrólisis) y cristales ----
   A baja temperatura la urea no se vuelve NH3: forma biuret y ácido cianúrico, los cristales blancos del mezclador. */
const fUrea=Tc=>1/(1+Math.exp(-(Tc-165)/10));                                        // fracción que llega como NH3

/** Un paso del catalizador completo (N celdas). Estado: th[0..N-1] (cobertura de NH3). Devuelve los flujos. */
function pasoCat(th,e,dt){
  const N=CAT.N, Vc=CAT.V/N, T=e.T, q=e.Vdot, Ka=kads(T), Kd=kdes(T), Ks=kreac(T,e.fKs), Ko=koxi(T);
  // pasos interiores: el más rápido de los tiempos de relajación manda (sin sobrepasar θ en [0, 1])
  const cMax=(e.FNH3+1e-12)/q, lam=Kd+Ko+Ka*cMax/CAT.Om+Ks*(e.FNOx+1e-12)/q/CAT.Om;
  const ns=Math.max(1,Math.ceil(dt*lam/0.2)), h=dt/ns;
  let rS=0, rO=0, ads=0, des=0, FNOxO=0, FNH3O=0;
  const pN=new Float64Array(N), pA=new Float64Array(N);
  const th0=th.slice();
  for(let s=0;s<ns;s++){
    let Fn=e.FNOx, Fa=e.FNH3;
    for(let i=0;i<N;i++){
      const t=th[i];
      const FnO=Fn/(1+Ks*t*Vc/q);                                                    // NOx: Fout = Fin / (1 + k·θ·V/q)
      const Rd=Kd*CAT.Om*t*Vc, A=Ka*(1-t)*Vc/q, FaO=(Fa+Rd)/(1+A);                  // NH3 en gas
      const rAds=A*FaO, rSCR=Fn-FnO, rOx=Ko*t*CAT.Om*Vc;
      th[i]=t+h*(rAds-Rd-rSCR-rOx)/(CAT.Om*Vc);
      rS+=rSCR*h; rO+=rOx*h; ads+=rAds*h; des+=Rd*h;
      Fn=FnO; Fa=FaO; pN[i]+=FnO*h; pA[i]+=FaO*h;
    }
    FNOxO+=Fn*h; FNH3O+=Fa*h;
  }
  let dS=0; for(let i=0;i<N;i++) dS+=(th[i]-th0[i])*CAT.Om*Vc;
  for(let i=0;i<N;i++){ pN[i]/=dt; pA[i]/=dt; }
  return {FNOxO:FNOxO/dt,FNH3O:FNH3O/dt,rSCR:rS/dt,rOx:rO/dt,dStored:dS,ns,pN,pA};
}
/** Perfil estacionario del catalizador (sin dinámica): bisección por celda sobre θ. Devuelve conv, deslizamiento, perfil. */
function estacionario(e){
  const N=CAT.N, Vc=CAT.V/N, T=e.T, q=e.Vdot, Ka=kads(T), Kd=kdes(T), Ks=kreac(T,e.fKs), Ko=koxi(T);
  let Fn=e.FNOx, Fa=e.FNH3; const th=[], cn=[], ca=[];
  for(let i=0;i<N;i++){
    const g=t=>{ const FnO=Fn/(1+Ks*t*Vc/q), Rd=Kd*CAT.Om*t*Vc, A=Ka*(1-t)*Vc/q, FaO=(Fa+Rd)/(1+A); return A*FaO-Rd-(Fn-FnO)-Ko*t*CAT.Om*Vc; };
    let a=0, b=1; // g decrece con θ: g(0)≥0 y g(1)≤0
    for(let k=0;k<70;k++){ const m=(a+b)/2; if(g(m)>0) a=m; else b=m; }
    const t=(a+b)/2, FnO=Fn/(1+Ks*t*Vc/q), Rd=Kd*CAT.Om*t*Vc, A=Ka*(1-t)*Vc/q, FaO=(Fa+Rd)/(1+A);
    th.push(t); Fn=FnO; Fa=FaO; cn.push(Fn); ca.push(Fa);
  }
  return {th,FNOxO:Fn,FNH3O:Fa,conv:e.FNOx>0?1-Fn/e.FNOx:0,cn,ca};
}
/** Entrada del catalizador a partir del punto del motor, la dosis (% del NH3 estequiométrico) y la temperatura del lecho. */
function entradaCat(m,dosis,Tbed,Tinj,dosisOn,fKs){
  const nTot=m.mGas/0.02897, FNOx=molDeNOxGh(m.mNOx), FdemNH3=dosis*FNOx*(dosisOn?1:0), fu=fUrea(Tinj);
  const Tk=Tbed+273.15, q=nTot*R_GAS*Tk/1.05e5;
  return {FNOx,FNH3:FdemNH3*fu,FNH3dem:FdemNH3,Vdot:q,T:Tk,nTot,fu,fKs};
}
/** Ventana de actividad: conversión y deslizamiento estacionarios del NOx a la temperatura T (°C) y dosis dadas, a la carga L. */
function ventana(L,dosis,T,fKs){
  const m=motor(L), e=entradaCat(m,dosis,T,T,true,fKs), r=estacionario(e);
  return {conv:r.conv,slip:r.FNH3O/e.nTot*1e6,nox:r.FNOxO/e.nTot*1e6,th:r.th,sv:e.Vdot/CAT.V*3600};
}

/* ---- Ciclos de carga del motor (carga L en el tiempo, tramos lineales) ---- */
const CICLOS={
  frio:{nombre:'Arranque en frío',T:300,Tb0:55,L:[[0,0.05],[30,0.05],[50,0.28],[90,0.34],[110,0.18],[130,0.40],[180,0.46],[200,0.30],[230,0.55],[270,0.55],[300,0.50]]},
  puerto:{nombre:'Subida de puerto',T:300,Tb0:250,pre:150,L:[[0,0.28],[70,0.28],[100,0.80],[190,0.80],[215,0.15],[300,0.15]]},
};
const cargaEn=(c,t)=>{ const k=c.L; if(t<=k[0][0]) return k[0][1]; for(let i=1;i<k.length;i++) if(t<=k[i][0]){ const u=(t-k[i-1][0])/(k[i][0]-k[i-1][0]); return k[i-1][1]+(k[i][1]-k[i-1][1])*u; } return k[k.length-1][1]; };
/** Punto de funcionamiento fijo (para el diagnóstico): carga constante, catalizador ya en régimen. */
const cicloFijo=L=>({nombre:'Punto fijo',T:120,Tb0:motor(L).Tg,pre:240,L:[[0,L],[120,L]]});
const TAU_TERM=45;                                    // s: constante térmica del lecho

/** Simula un ciclo completo. par: {ciclo, dosis (0..1,6), Ton (°C), dT (°C de calentamiento), fKs (envejecimiento 0..1),
 *  kInj (fracción entregada por el inyector), dt}. Devuelve trazas y balances. */
function simula(par){
  const c=par.cicloObj||(par.ciclo==='fijo'?cicloFijo(par.Lfija):CICLOS[par.ciclo||'frio']), dt=par.dt||0.5, N=Math.round(c.T/dt)+1, Nc=CAT.N;
  const dosis=par.dosis!==undefined?par.dosis:1, Ton=par.Ton!==undefined?par.Ton:180, dT=par.dT||0, fKs=par.fKs===undefined?1:par.fKs, kInj=par.kInj===undefined?1:par.kInj;
  const th=new Float64Array(Nc).fill(par.th0||0);
  const tr={t:new Float64Array(N),L:new Float64Array(N),P:new Float64Array(N),Tg:new Float64Array(N),Tb:new Float64Array(N),noxIn:new Float64Array(N),noxOut:new Float64Array(N),nh3:new Float64Array(N),
    conv:new Float64Array(N),dosisLh:new Float64Array(N),on:new Uint8Array(N),thM:new Float64Array(N),thP:new Float32Array(N*Nc),cris:new Float64Array(N),mNOx:new Float64Array(N),stored:new Float64Array(N),fnP:new Float32Array(N*Nc).fill(1),faP:new Float32Array(N*Nc),nh3in:new Float64Array(N),dem:new Float64Array(N)};
  let Tb=par.Tb0!==undefined?par.Tb0:c.Tb0;
  // ciclos «en caliente»: antes de t = 0 el motor lleva `pre` s en la carga inicial y el catalizador ya está en régimen
  if(c.pre){ const m0=motor(c.L[0][1]), Tin0=m0.Tg+dT, on0=Tin0>=Ton;
    for(let k=0;k<Math.round(c.pre/dt);k++){ const e=entradaCat(m0,dosis,Tb,Tin0,on0,fKs); e.FNH3*=kInj; pasoCat(th,e,dt); Tb+=(Tin0-Tb)*(1-Math.exp(-dt/TAU_TERM)); } }
  let stored0=0; for(let i=0;i<Nc;i++) stored0+=th[i]*CAT.Om*CAT.V/Nc;
  const A={nIn:0,nOut:0,rS:0,rO:0,aIn:0,aOut:0,aDem:0,urea:0,cris:0,Esal:0,Ecomb:0,Eheat:0,adbL:0,nh3sum:0,nh3pk:0,work:0};
    for(let k=0;k<N;k++){
    const t=k*dt, L=cargaEn(c,t), m=motor(L), Tin=m.Tg+dT, on=Tin>=Ton;
    const e=entradaCat(m,dosis,Tb,Tin,on,fKs); e.FNH3*=kInj; e.FNH3dem*=kInj;
    const nS=th.reduce((a,x)=>a+x,0)/Nc;
    tr.t[k]=t; tr.L[k]=L; tr.P[k]=m.P; tr.Tg[k]=Tin; tr.Tb[k]=Tb; tr.noxIn[k]=e.FNOx/e.nTot*1e6; tr.on[k]=on?1:0; tr.mNOx[k]=m.mNOx;
    tr.thM[k]=nS; for(let i=0;i<Nc;i++) tr.thP[k*Nc+i]=th[i];
    tr.dosisLh[k]=LhDeMolNH3(e.FNH3dem);
    if(k===N-1) { tr.noxOut[k]=tr.noxOut[k-1]; tr.nh3[k]=tr.nh3[k-1]; tr.conv[k]=tr.conv[k-1]; tr.cris[k]=A.cris; let st=0; for(let i=0;i<Nc;i++) st+=th[i]*CAT.Om*CAT.V/Nc; tr.stored[k]=st; break; }

/** Junta una pieza hecha de muchas mallas en una malla por material: así una bobina con 40 piezas cuesta pocas llamadas. */
function fusiona(grupo){
  grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map();
  grupo.traverse(o=>{ if(!o.isMesh) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(), m=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);
    g.applyMatrix4(m);
    if(!g.attributes.uv){ g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2)); }
    const k=o.material; if(!por.has(k)) por.set(k,[]); por.get(k).push(g); });
  const out=new THREE.Group();
  for(const [mat,gs] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count;
      pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry();
    G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const me=new THREE.Mesh(G,mat); me.castShadow=!mat.transparent; me.receiveShadow=true; out.add(me);
  }

}

/** Funde las mallas ESTÁTICAS de un grupo en una malla por material (y por «clave» de pieza, para que el rótulo y el
 *  tooltip sigan sabiendo de qué pieza son). Las que se mueven, las instanciadas, las de material múltiple y el fondo se
 *  quedan como están. */
function fusionaPartes(grupo,excluir){
  excluir=excluir||[]; grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map(), viejas=[];
  const fuera=o=>{ for(let p=o;p&&p!==grupo;p=p.parent) if(excluir.includes(p)||(p.userData&&p.userData.fondo===true)) return true; return false; };
  grupo.traverse(o=>{ if(!o.isMesh||o.isInstancedMesh||fuera(o)||o.userData.noFusion) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(); g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld));
    if(!g.attributes.uv) g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
    const clave=o.userData.clave||'', ro=o.renderOrder||0;
    const mete=(mat,geo)=>{ const k=mat.uuid+'|'+clave; if(!por.has(k)) por.set(k,{mat,clave,gs:[],ro}); por.get(k).gs.push(geo); };
    if(Array.isArray(o.material)){
      const grupos=g.groups&&g.groups.length?g.groups:[{start:0,count:g.attributes.position.count,materialIndex:0}];
      for(const gr of grupos){ const mat=o.material[gr.materialIndex]; if(!mat) continue; const sub=new THREE.BufferGeometry();
        for(const nom of ['position','normal','uv']){ const at=g.attributes[nom]; sub.setAttribute(nom,new THREE.BufferAttribute(at.array.slice(gr.start*at.itemSize,(gr.start+gr.count)*at.itemSize),at.itemSize)); }
        mete(mat,sub); }
      g.dispose();
    } else mete(o.material,g);
    viejas.push(o); });
  for(const o of viejas){ o.parent.remove(o); }
  for(const [,{mat,clave,gs,ro}] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count; pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry(); G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const me=new THREE.Mesh(G,mat); me.castShadow=!mat.transparent&&!(mat.blending===THREE.AdditiveBlending); me.receiveShadow=true; me.renderOrder=ro; if(clave) me.userData.clave=clave; grupo.add(me);
  }
}

   Una poligonal con tres tramos: el tubo de arriba (el gas sale del motor hacia la izquierda), el bajante
   (donde el inyector rocía el AdBlue y el mezclador revuelve) y la fila de abajo, que atraviesa el catalizador

  const P=[V3(X_MOT,Y_ARR,0),V3(X_BAJ,Y_ARR,0),V3(X_BAJ,Y_ABA,0),V3(X_FIN,Y_ABA,0)], L=[0];
  for(let i=1;i<P.length;i++) L.push(L[i-1]+P[i].distanceTo(P[i-1]));
  return {P,L,total:L[L.length-1]};
})();

const S_CAT0=RUTA.L[2]+(X_CAT0-X_BAJ), S_CAT1=RUTA.L[2]+(X_CAT1-X_BAJ);
function rutaEn(s,out){
  const R=RUTA; s=clamp(s,0,R.total-1e-6); let i=1; while(i<R.P.length-1&&s>R.L[i]) i++;
  const u=(s-R.L[i-1])/(R.L[i]-R.L[i-1]); out.copy(R.P[i-1]).lerp(R.P[i],u); return i;
}

};

MUNDO.traverse(o=>{ if(o.isMesh&&['tanque','inyector','mezclador','escape','sensorT','sensorNOx','sensorNH3'].includes(o.userData.clave)) o.castShadow=false; });

/* ===================== 11. LAS PARTÍCULAS: NOx, AMONÍACO, ROCÍO Y PENACHO =====================
   Cada partícula lleva un número fijo entre 0 y 1 («umbral»). El modelo dice qué FRACCIÓN del NOx queda tras cada celda;
   una partícula de NOx se convierte (de rojo a verde: nitrógeno y agua) donde esa fracción baja de su umbral. Lo mismo
   con el amoníaco: se queda pegado al panal donde la fracción de NH3 libre baja de su umbral. */
const _m4=new THREE.Matrix4(), _q0=new THREE.Quaternion(), _col=new THREE.Color(), _p=V3(0,0,0), _p2=V3(0,0,0);
function instancias(n,geo,mat){ const im=new THREE.InstancedMesh(geo,mat,n); im.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(n*3).fill(1),3); im.frustumCulled=false; im.castShadow=false; im.receiveShadow=false; im.renderOrder=5; MUNDO.add(im); return im; }
const ESF=new THREE.SphereGeometry(1,10,8);
const MAT_PART=new THREE.MeshBasicMaterial({color:'#ffffff',toneMapped:false});
const NN=150, NA=90, NR=34, NP=46;
const rnd=(function(){ let s=20260;  return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; })();
const PN=[], PA=[], PR=[], PP=[];
for(let i=0;i<NN;i++) PN.push({s:rnd()*RUTA.total,th:rnd(),oy:(rnd()*2-1),oz:(rnd()*2-1),act:rnd()<0.7,ve:0.85+0.3*rnd(),h:rnd(),conv:0});
for(let i=0;i<NA;i++) PA.push({s:S_INY+rnd()*(RUTA.total-S_INY),th:rnd(),oy:(rnd()*2-1),oz:(rnd()*2-1),act:false,ve:0.85+0.3*rnd(),h:rnd()});
for(let i=0;i<NR;i++) PR.push({u:rnd(),x:(rnd()*2-1),z:(rnd()*2-1),h:rnd()});
for(let i=0;i<NP;i++) PP.push({u:rnd(),vy:0.18+0.14*rnd(),vx:0.30+0.28*rnd(),w:rnd()*DOSPI,tipo:0,h:rnd()});
const IM_NOX=instancias(NN,ESF,MAT_PART), IM_NH3=instancias(NA,ESF,MAT_PART), IM_ROC=instancias(NR,ESF,MAT_PART), IM_PEN=instancias(NP,ESF,MAT_PART);
const C_NOX=new THREE.Color('#ff4a38'), C_N2=new THREE.Color('#8ff7c2'), C_NH3=new THREE.Color('#58d6ff'), C_ROC=new THREE.Color('#9ad4ff'), C_HUMO=new THREE.Color('#dfe9ee');
const _vz=V3(0,0,1);


/* ===================== 12. EL ESTADO Y EL RELOJ =====================
   Un solo cálculo (CALC) alimenta la escena, el dock y las cifras: se recalcula cuando cambia un mando. El reloj SIM.t es
   el tiempo del CICLO (s) y avanza dt·velocidad; mueve las partículas, el color de cada celda del catalizador, el rocío,
   los cristales y el cursor de todas las gráficas. Los modos: «Recorrido» (paso a paso), «Probar» (mandos libres) y «Reto». */
const EST={modo:'tour',ciclo:'puerto',dosis:100,Ton:180,dT:0,vel:4,pausa:REDUCIDO,autoRunning:false,vista:'todo',rot:false};
const SIM={t:0,calc:null,ver:0,e:null,vD:1,fase:0};
let CALC=null;
const NCE=CAT.N;

/** Lo que corre ahora: en «Probar», lo que digan los mandos; en el recorrido y el reto, lo que pida el paso. */
function paramsActuales(){
  if(EST.modo==='tour'){ const p=tourParams(); if(p) return p; }
  if(EST.modo==='reto'){ const p=guiaParams(); if(p) return p; }
  return {ciclo:EST.ciclo,dosis:EST.dosis/100,Ton:EST.Ton,dT:EST.dT};
}
function calcula(p){
  const run=simula(Object.assign({dt:1},p));
  return {p,run,fija:p.ciclo==='fijo'};
}
function reiniciaCalculo(){
  CALC=calcula(paramsActuales()); SIM.calc=CALC; SIM.ver++;
  SIM.t=Math.min(SIM.t,CALC.run.ciclo.T-1.01); if(SIM.t<0) SIM.t=0;
  if(typeof pintaDockFijo==='function') pintaDockFijo();
}

/* ---- el estado del sistema en el instante t: sale de las trazas de la simulación del ciclo ---- */
function estadoEn(t){
  const C=CALC; if(!C) return null; const R=C.run, T=R.tr, i=clamp(Math.floor(t/R.dt),0,R.N-1);
  return {i,t,L:T.L[i],P:T.P[i],Tg:T.Tg[i],Tb:T.Tb[i],noxIn:T.noxIn[i],noxOut:T.noxOut[i],nh3:T.nh3[i],conv:T.conv[i],on:T.on[i],thM:T.thM[i],
    dem:T.dem[i],nh3in:T.nh3in[i],cris:T.cris[i]*1000,mNOx:T.mNOx[i],mGas:motor(T.L[i]).mGas};
}

/* ===================== 13. LO QUE SE VE ===================== */
const C_VACIA=new THREE.Color('#3a464e'), C_LLENA=new THREE.Color('#1f9dff'), C_PELIGRO=new THREE.Color('#ff6a55'), C_OK=new THREE.Color('#34d399'), C_AMBAR=new THREE.Color('#ffb703'), C_NEUTRO=new THREE.Color('#6b7a84');
const ocultaSalida=()=>EST.modo==='reto'&&GUIA.paso==='ajusta'&&!(GUIA.r2&&GUIA.r2.validado);   // la salida, mientras se ajusta
function aplicaEscena(dtS,dtSim){
  const C=CALC; if(!C) return;
  const Tc=C.run.ciclo.T; SIM.t+=dtSim; if(SIM.t>=Tc-1.0) SIM.t=SIM.t-(Tc-1.0);
  const e=estadoEn(SIM.t); if(!e) return; SIM.e=e;
  const R=C.run, Tr=R.tr, Nc=R.Nc, base=e.i*Nc;
  const oculta=ocultaSalida();
  // ---- el catalizador: cada celda se pinta con su cobertura de NH3 ----
  for(let j=0;j<Nc;j++){ const th=Tr.thP[base+j], m=CELDA.mat[j]; m.color.copy(C_VACIA).lerp(C_LLENA,Math.pow(th,0.8)); m.emissiveIntensity=0.02+1.25*th; }
  const cal=clamp((e.Tb-200)/320,0,1), calG=clamp((e.Tg-160)/330,0,1);
  M2.inoxCalor.emissiveIntensity+=(0.55*cal*cal-M2.inoxCalor.emissiveIntensity)*clamp(dtS*4,0,1);
  M2.colector.emissiveIntensity+=(0.75*calG*calG-M2.colector.emissiveIntensity)*clamp(dtS*4,0,1);
  // ---- el inyector: cono de rocío con la dosis ----
  const rocio=e.on&&e.dem>1e-4?clamp(e.dem/1.0,0,1):0, puls=0.75+0.25*Math.sin(performance.now()*0.03);
  M2.rocio.opacity+=((rocio>0?0.07+0.20*Math.sqrt(rocio)*puls:0)-M2.rocio.opacity)*clamp(dtS*10,0,1);
  const led=INYECTOR.userData.led; led.material.color.set(rocio>0?'#7ccaff':(e.dem>1e-4?'#ff6a55':'#6b7a84'));
  // ---- el depósito: el nivel baja un poco con el gasto acumulado (a escala didáctica) ----
  // ---- los cristales de urea: crecen con lo acumulado ----
  const fc=clamp(e.cris/9,0,1.4);
  CRISTALES.children.forEach(m=>{ const k=m.userData.k/16, v=fc>k*0.9?1:0; const s=m.userData.base*(0.35+0.9*Math.min(1,fc))*v; m.scale.setScalar(Math.max(0.0001,s)); m.visible=v>0; });
  // ---- el motor vibra y gira sus poleas con la carga ----
  MOTOR.position.y=1.98+0.0035*e.L*Math.sin(performance.now()*0.045); for(const p of POLEAS) p.rotation.y+=(4+16*e.L)*dtS;
  // ---- los testigos de los sensores de salida ----
  const nOk=e.noxIn<30||e.noxOut/Math.max(e.noxIn,1)<0.12, aOk=e.nh3<10;
  SENSORES.userData.nox.children[SENSORES.userData.nox.children.length-1].material.color.copy(oculta?C_NEUTRO:(nOk?C_OK:(e.noxOut/Math.max(e.noxIn,1)<0.30?C_AMBAR:C_PELIGRO)));
  SENSORES.userData.nh3.children[SENSORES.userData.nh3.children.length-1].material.color.copy(oculta?C_NEUTRO:(aOk?C_OK:(e.nh3<25?C_AMBAR:C_PELIGRO)));
  // ---- las partículas ----
  SIM.vD=0.75+2.3*clamp(e.mGas/0.16,0,1);
  const noxFrac=clamp(e.noxIn/700,0.08,1), a1=Math.sqrt(clamp(e.nh3in/260,0,1));
  const fnAt=(s)=>{ if(s<=S_CAT0) return 1; if(s>=S_CAT1) return Tr.fnP[base+Nc-1]; const u=(s-S_CAT0)/(S_CAT1-S_CAT0)*Nc, j=Math.min(Nc-1,Math.floor(u)), f=u-j, a=j===0?1:Tr.fnP[base+j-1], b=Tr.fnP[base+j]; return a+(b-a)*f; };
  const gAt=(s)=>{ const ref=Math.max(e.nh3in,8); if(s<=S_CAT0) return 1; const u=clamp((s-S_CAT0)/(S_CAT1-S_CAT0),0,1)*Nc, j=Math.min(Nc-1,Math.floor(u)), f=u-j, a=j===0?ref:Tr.faP[base+j-1], b=Tr.faP[base+j]; return clamp((a+(b-a)*f)/ref,0,1); };

    if(p.s>=RUTA.total){ p.s-=RUTA.total; p.act=rnd()<noxFrac; p.th=rnd(); }
    let vis=p.act, conv=false; if(vis){ const f=fnAt(p.s); conv=p.s>S_CAT0&&p.th>f; if(p.s>S_CAT1) conv=p.th>Tr.fnP[base+Nc-1]; }

    // desplazamiento perpendicular a la ruta, en el plano y en z

    const r=vis?(conv?0.019:0.030):0.0001; _col.copy(conv?C_N2:C_NOX); if(!conv&&vis) _col.multiplyScalar(1.15);
    _m4.compose(_p2,_q0,V3(r,r,r)); IM_NOX.setMatrixAt(i,_m4); IM_NOX.setColorAt(i,_col); }
  // NH3: nace en el inyector con el rocío y se queda pegado al panal donde el modelo lo agota
  for(let i=0;i<NA;i++){ const p=PA[i]; p.s+=SIM.vD*p.ve*0.92*dtS;
    if(p.s>=RUTA.total){ p.s=S_INY+rnd()*0.4; p.act=rnd()<a1; p.th=rnd(); }
    let vis=p.act&&e.on; if(vis&&p.s>S_CAT0){ const g=gAt(p.s); if(p.th>g) vis=false; }
    if(oculta&&p.s>sSal) vis=false;
    const idx=rutaEn(p.s,_p), rd=radioEn(p.s); const dirx=idx===3?1:(idx===2?0:-1), diry=idx===2?-1:0;
    const px=-diry, py=dirx; const enC=p.s>S_CAT0&&p.s<S_CAT1;
    _p2.set(_p.x+px*p.oy*rd,_p.y+py*p.oy*rd,enC?0.04+0.14*p.h:p.oz*rd);
    const r=vis?0.021:0.0001; _col.copy(C_NH3).multiplyScalar(1.2);
    _m4.compose(_p2,_q0,V3(r,r,r)); IM_NH3.setMatrixAt(i,_m4); IM_NH3.setColorAt(i,_col); }
  // rocío del inyector: gotas que bajan por el bajante un tramo corto (y se vuelven amoníaco)
  for(let i=0;i<NR;i++){ const p=PR[i]; p.u+=dtS*(1.4+1.1*p.h); if(p.u>=1){ p.u-=1; p.x=rnd()*2-1; p.z=rnd()*2-1; }

    _m4.compose(_p2,_q0,V3(r,r,r)); IM_ROC.setMatrixAt(i,_m4); IM_ROC.setColorAt(i,_col); }
  // penacho a la salida (exagerado a propósito para poder leerse): humo claro, puntos rojos (NOx) y celestes (NH3)
  const fR=clamp(e.noxOut/90,0,1), fA=clamp(e.nh3/30,0,1);
  for(let i=0;i<NP;i++){ const p=PP[i]; p.u+=dtS*(0.28+0.2*p.h); if(p.u>=1){ p.u-=1; p.w=rnd()*DOSPI; const q=rnd(); p.tipo=q<fR*0.55?1:(q<fR*0.55+fA*0.45?2:0); }
    const t=p.u, x=X_FIN+0.02+p.vx*t*1.2, y=Y_ABA+0.02+p.vy*t*1.6+0.05*Math.sin(p.w+t*5), z=0.10*Math.sin(p.w*2+t*3);
    _p2.set(x,y,z); let r=0.0001; if(!oculta){ r=(p.tipo===0?0.030:0.020)*(0.5+t*1.2)*(1-t*0.8); _col.copy(p.tipo===0?C_HUMO:(p.tipo===1?C_NOX:C_NH3)); if(p.tipo===0) _col.multiplyScalar(0.55); }

    _m4.compose(_p2,_q0,V3(r,r,r)); IM_PEN.setMatrixAt(i,_m4); IM_PEN.setColorAt(i,_col); }
  for(const im of [IM_NOX,IM_NH3,IM_ROC,IM_PEN]){ im.instanceMatrix.needsUpdate=true; im.instanceColor.needsUpdate=true; }
}

/* ===================== 14. CÁMARAS =====================
   La escena se encuadra con el hueco que dejan la guía y el dock: la cámara se aleja lo justo para que la caja del
   «objeto» (ancho × alto en metros) quepa entera en ese hueco, y la proyección se desplaza para centrarla en él.
   Además el objeto nunca pasa del 66 % del alto del lienzo. */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}
const VISTAS={
  todo:{dir:V3(-0.16,0.20,1),anc:()=>V3(0.12,1.30,0),toff:V3(0,0,0),obj:()=>({w:4.85,h:3.05}),fov:34,tope:0.70},
  motor:{dir:V3(-0.22,0.14,1),anc:()=>V3(1.45,1.95,0),toff:V3(0,0,0),obj:()=>({w:3.4,h:2.3}),fov:34,tope:0.66},
  inyector:{dir:V3(-0.10,0.14,1),anc:()=>V3(-1.25,1.62,0),toff:V3(0,0,0),obj:()=>({w:2.9,h:2.2}),fov:34,tope:0.66},
  catalizador:{dir:V3(-0.12,0.22,1),anc:()=>V3(-0.15,0.70,0),toff:V3(0,0,0),obj:()=>({w:3.0,h:1.1}),fov:34,tope:0.66},
  salida:{dir:V3(-0.16,0.14,1),anc:()=>V3(1.60,0.78,0),toff:V3(0,0,0),obj:()=>({w:3.1,h:1.7}),fov:34,tope:0.66},
};
const CAM={off:V3(-1.5,1.2,6),toff:V3(0,0,0),auto:true,previo:null,k:1,dur:1};
function fovVista(v){ return innerWidth<innerHeight*0.9?46:VISTAS[v].fov; }
function distanciaFit(w,h,fov,tope){
  const Hu=huecoLibre(), W=innerWidth, Hh=innerHeight, tv=Math.tan(fov*Math.PI/360), th=tv*(W/Hh);
  const wF=Math.max(80,Hu.x1-Hu.x0)/W, hF=Math.max(80,Hu.y1-Hu.y0)/Hh;
  const D=1.06*Math.max(w/(2*th*wF),h/(2*tv*hF));
  return Math.max(D,h/(2*tv*(tope||0.66)));
}
function ofsDeseado(v){
  const V=VISTAS[v], o=V.obj(), fov=fovVista(v), D=distanciaFit(o.w,o.h,fov,V.tope);
  return {off:V.dir.clone().normalize().multiplyScalar(D),toff:V.toff.clone(),fov};
}
function ponVista(v,dur){
  EST.vista=v; CAM.auto=true; CAM.dur=dur===undefined?1.0:dur;
  if(typeof pintaBarras==='function') pintaBarras();
  if(CAM.dur<=0.01){ const A=VISTAS[v].anc(), d=ofsDeseado(v); CAM.off.copy(d.off); CAM.toff.copy(d.toff); camera.fov=d.fov; camera.updateProjectionMatrix();
    camera.position.copy(A).add(CAM.off); controls.target.copy(A).add(CAM.toff); CAM.previo=A.clone(); }
}
function pasaCam(dt){
  const V=VISTAS[EST.vista], P=V.anc();
  if(CAM.auto){
    const d=ofsDeseado(EST.vista), k=1-Math.exp(-dt/Math.max(0.05,(CAM.dur||1)*0.30));
    CAM.off.lerp(d.off,k); CAM.toff.lerp(d.toff,k);
    if(Math.abs(camera.fov-d.fov)>0.05){ camera.fov+=(d.fov-camera.fov)*k; camera.updateProjectionMatrix(); }
    camera.position.copy(P).add(CAM.off); controls.target.copy(P).add(CAM.toff);
  } else if(CAM.previo){ const dP=P.clone().sub(CAM.previo); camera.position.add(dP); controls.target.add(dP); }
  CAM.previo=P.clone();
}
controls.addEventListener('start',()=>{ CAM.auto=false; });

    <div class="formula">AdBlue → NH<sub>3</sub>: 1 L trae ${fN(NH3_L,2)} mol de NH<sub>3</sub> · 4 NH<sub>3</sub> + 4 NO + O<sub>2</sub> → 4 N<sub>2</sub> + 6 H<sub>2</sub>O (1 a 1)</div>
    <div class="fl">La urea (32,5 %) da <b>2 NH<sub>3</sub> por molécula</b>. Entre 150 y 200 °C se descompone sólo en parte: el resto cristaliza.</div>
    <div class="formula">Ω·dθ/dt = r<sub>ads</sub> − r<sub>des</sub> − r<sub>SCR</sub> − r<sub>ox</sub> · r<sub>SCR</sub> = k<sub>s</sub>(T)·θ·C<sub>NOx</sub></div>
    <div class="fl">θ es la fracción de NH<sub>3</sub> guardada en la pared. La capacidad cae al subir T (Langmuir con K(T)) y a más de 400 °C parte del NH<sub>3</sub> se quema (r<sub>ox</sub>). El balance de nitrógeno cierra con ${fN(Math.abs(CALC?Math.max(Math.abs(CALC.run.bal.nox)/CALC.run.bal.nIn,Math.abs(CALC.run.bal.nh3)/Math.max(CALC.run.bal.aIn,1e-9)):0),3)} de residuo relativo.</div>
  </div></details>
  <details id="dSim"><summary>Simplificaciones</summary><div class="cuerpo"><ul class="no">
    <li>El catalizador son <b>8 celdas en serie</b> con el gas en régimen y el amoníaco guardado como estado; sólo reacción estándar 1:1 (sin NO<sub>2</sub> ni reacción rápida).</li>
    <li>La capacidad de almacenamiento (${fN(CAT.Om*CAT.V,2)} mol) se redujo para que se llene en minutos; los ciclos duran 5 min y son <b>sintéticos</b>, no WHTC.</li>
    <li>El motor es un mapa didáctico de 120 kW; la temperatura del lecho sigue al gas con una constante de ${fN(TAU_TERM)} s.</li>
    <li>El penacho se exagera a propósito para poder leerse. No es CFD ni una homologación.</li>
  </ul><div class="src">Johnson, <i>Diesel emission control in review</i> · Guzzella y Onder, <i>Introduction to Modeling and Control of IC Engine Systems</i> · ISO 22241 (AdBlue).</div></div></details></div>`;
  H.innerHTML=h; H.classList.toggle('guia',EST.modo!=='probar'); enlazaHUD(); ajustaHoja();
}
function enlazaHUD(){

/* ===================== 16. EL DOCK (derecha): cifras y gráficas DOM ===================== */
const FUENTE="'Outfit',system-ui,sans-serif";
function lienzo(id){ const box=el(id), c=box.querySelector('canvas'); return {box,c,ctx:c.getContext('2d'),w:0,h:0,dpr:1}; }
function abre(L){ const r=L.box.getBoundingClientRect(), dpr=Math.min(3,window.devicePixelRatio||1);
  const w=Math.max(20,Math.round(r.width)), h=Math.max(20,Math.round(r.height));
  if(L.w!==w||L.h!==h||L.dpr!==dpr){ L.c.width=Math.round(w*dpr); L.c.height=Math.round(h*dpr); L.w=w; L.h=h; L.dpr=dpr; }
  const x=L.ctx; x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h); return x; }
function txt(x,t,px,py,col,size,align,peso){ x.fillStyle=col; x.font=(peso||'600')+' '+(size||11)+'px '+FUENTE; x.textAlign=align||'left'; x.textBaseline='alphabetic'; x.fillText(t,px,py); }
function raya(x,x1,y1,x2,y2,col,w,dash){ x.strokeStyle=col; x.lineWidth=w||1; x.setLineDash(dash||[]); x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke(); x.setLineDash([]); }
const LFU=lienzo('gFu'), LSO=lienzo('gTr'), LCO=lienzo('gFr'), LVE=lienzo('gSp');
const sinDatos=(x,Wd,Hd,t)=>{ txt(x,t||'—',Wd/2,Hd/2+4,'#7f9aa8',t?11:14,'center','500'); };
const COL={nox:'#ff6a55',noxIn:'#8fa1ab',nh3:'#58d6ff',conv:'#34d399',tg:'#ffb347',tb:'#ff6a55',cris:'#f3ecd5',on:'rgba(91,200,255,0.16)'};
const GRID='rgba(160,200,220,0.10)', EJE='#3f6a80', TXT='#8eb3c5';
const ejeT=(Wd,X0,X1)=>{ const T=CALC.run.ciclo.T; return t=>X0+t/T*(X1-X0); };
function cursor(x,X,Y0,Y1){ const px=X(SIM.t); raya(x,px,Y0,px,Y1,'rgba(255,255,255,0.85)',1.2); }
function bandasDosis(x,X,Y0,Y1){ const T=CALC.run.tr.on, dt=CALC.run.dt, N=CALC.run.N; let ini=-1;
  for(let i=0;i<=N;i++){ const on=i<N&&T[i]===1; if(on&&ini<0) ini=i; if(!on&&ini>=0){ x.fillStyle=COL.on; x.fillRect(X(ini*dt),Y0,X(i*dt)-X(ini*dt),Y1-Y0); ini=-1; } } }
function ejeY(x,X0,X1,Y,vals,fmt){ x.__uy=undefined; for(const v of vals){ raya(x,X0,Y(v),X1,Y(v),GRID); if(Math.abs(Y(v)-(x.__uy===undefined?-99:x.__uy))>=11){ x.__uy=Y(v); txt(x,fmt?fmt(v):String(v),X0-4,Y(v)+3,TXT,8.5,'right','500'); } } }
function ejeX(x,X,T,Hd,paso){ for(let t=0;t<=T;t+=paso){ raya(x,X(t),Hd-14,X(t),Hd-11,EJE); txt(x,String(t),X(t),Hd-3,TXT,8.5,'center','500'); } }

/* ---- NOx: lo que entra (gris) y lo que sale (rojo) ---- */
function pintaNOx(){
  const x=abre(LFU), Wd=LFU.w, Hd=LFU.h, C=CALC; if(!C) return;
  const X0=34, X1=Wd-8, Y0=8, Y1=Hd-16, T=C.run.tr, N=C.run.N, dt=C.run.dt, X=ejeT(Wd,X0,X1);
  let mx=50; for(let i=0;i<N;i+=2) mx=Math.max(mx,T.noxIn[i]); mx=Math.ceil(mx/100)*100; const Y=v=>Y1-v/mx*(Y1-Y0);
  bandasDosis(x,X,Y0,Y1);
  ejeY(x,X0,X1,Y,[0,mx/4,mx/2,3*mx/4,mx],v=>fN(v)); ejeX(x,X,C.run.ciclo.T,Hd,50);
  txt(x,'ppm',X0+4,Y0+8,TXT,8.5,'left','600'); txt(x,'s',X1,Hd-3,TXT,8.5,'right','600');
  x.fillStyle='rgba(143,161,171,0.18)'; x.beginPath(); x.moveTo(X(0),Y(0)); for(let i=0;i<N;i+=2) x.lineTo(X(i*dt),Y(T.noxIn[i])); x.lineTo(X(C.run.ciclo.T),Y(0)); x.closePath(); x.fill();
  const traza=(arr,col,w)=>{ x.strokeStyle=col; x.lineWidth=w; x.beginPath(); for(let i=0;i<N;i++){ const px=X(i*dt), py=Y(arr[i]); i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke(); };
  traza(T.noxIn,COL.noxIn,1.4);
  if(ocultaSalida()) sinDatos(x,Wd,Hd,'lo que sale se muestra al validar'); else traza(T.noxOut,COL.nox,2);
  cursor(x,X,Y0,Y1); el('t_fu').textContent='t = '+fN(SIM.t,0)+' s';
}
function pintaLeyNOx(){
  el('leyFu').innerHTML=`<span class="lg"><i style="--c:${COL.noxIn}"></i>NOx que entra</span><span class="lg"><i style="--c:${COL.nox}"></i>NOx que sale</span><span class="lg"><i class="bl" style="--c:rgba(91,200,255,.45)"></i>inyectando AdBlue</span>`;
}
/* ---- amoníaco que se escapa ---- */
function pintaNH3(){
  const x=abre(LSO), Wd=LSO.w, Hd=LSO.h, C=CALC; if(!C) return;
  if(ocultaSalida()){ sinDatos(x,Wd,Hd,'se muestra al validar'); el('t_pw').textContent=''; return; }
  const X0=26, X1=Wd-6, Y0=6, Y1=Hd-14, X=ejeT(Wd,X0,X1), T=C.run.tr, N=C.run.N, dt=C.run.dt;
  let mx=20; for(let i=0;i<N;i+=2) mx=Math.max(mx,T.nh3[i]); mx=Math.ceil(mx*1.1/10)*10; const Y=v=>Y1-v/mx*(Y1-Y0);
  ejeY(x,X0,X1,Y,[0,mx/2,mx],v=>fN(v));
  raya(x,X0,Y(RETO.slip),X1,Y(RETO.slip),'rgba(255,183,3,0.65)',1,[3,3]); txt(x,'10 ppm',X1-2,Y(RETO.slip)-3,'#ffcf66',8.5,'right','600');
  x.strokeStyle=COL.nh3; x.lineWidth=1.9; x.beginPath(); for(let i=0;i<N;i++){ const px=X(i*dt), py=Y(T.nh3[i]); i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke();
  cursor(x,X,Y0,Y1); txt(x,'ppm',X0+3,Y0+8,TXT,8.5,'left','600');
  el('t_pw').textContent='media '+fN(C.run.nh3Medio,1)+' ppm';
}
/* ---- la ventana de temperatura: limpieza estacionaria del NOx según la temperatura del catalizador ---- */
const _vent={};
function curvaVentana(L,dosis){ const k=Math.round(L*50)+'|'+Math.round(dosis*100); if(_vent[k]) return _vent[k]; const pts=[]; for(let T=120;T<=560;T+=10){ const w=ventana(L,dosis,T); pts.push([T,w.conv,w.slip]); } return (_vent[k]=pts); }
function pintaVentana(){
  const x=abre(LCO), Wd=LCO.w, Hd=LCO.h, C=CALC, e=SIM.e; if(!C||!e) return;
  if(ocultaSalida()){ sinDatos(x,Wd,Hd,'se muestra al validar'); el('t_fr').textContent=''; return; }
  const X0=26, X1=Wd-6, Y0=6, Y1=Hd-14, Tmin=120, Tmax=560, X=T=>X0+(T-Tmin)/(Tmax-Tmin)*(X1-X0), Y=v=>Y1-v*(Y1-Y0);
  const dosis=C.p.dosis!==undefined?C.p.dosis:1, pts=curvaVentana(e.L,dosis);
  ejeY(x,X0,X1,Y,[0,0.5,1],v=>fN(v*100));
  for(const T of [150,250,350,450,550]){ raya(x,X(T),Y1,X(T),Y1+3,EJE); txt(x,String(T),X(T),Hd-3,TXT,8.5,'center','500'); }
  // la zona buena (≥ 90 %)
  x.fillStyle='rgba(52,211,153,0.10)'; let a=-1; for(let i=0;i<=pts.length;i++){ const ok=i<pts.length&&pts[i][1]>=0.9; if(ok&&a<0) a=i; if(!ok&&a>=0){ x.fillRect(X(pts[a][0]),Y0,X(pts[i-1][0])-X(pts[a][0]),Y1-Y0); a=-1; } }
  raya(x,X(180),Y0,X(180),Y1,'rgba(243,236,213,0.55)',1,[3,3]);
  x.strokeStyle=COL.conv; x.lineWidth=2; x.beginPath(); pts.forEach(([T,c],i)=>{ i?x.lineTo(X(T),Y(c)):x.moveTo(X(T),Y(c)); }); x.stroke();
  x.strokeStyle='rgba(88,214,255,0.8)'; x.lineWidth=1.2; x.setLineDash([2,2]); x.beginPath(); pts.forEach(([T,,s],i)=>{ const v=clamp(s/100,0,1); i?x.lineTo(X(T),Y(v)):x.moveTo(X(T),Y(v)); }); x.stroke(); x.setLineDash([]);
  const cp=ventana(e.L,dosis,e.Tb).conv; x.fillStyle='#fff'; x.beginPath(); x.arc(X(clamp(e.Tb,Tmin,Tmax)),Y(cp),3.6,0,DOSPI); x.fill();
  txt(x,'% NOx',X0+3,Y0+8,TXT,8.5,'left','600'); txt(x,'°C',X1,Hd-3,TXT,8.5,'right','600');
  el('t_fr').textContent='a '+fN(dosis*100)+' %';
}
/* ---- temperatura del gas y del catalizador ---- */
function pintaTemp(){
  const x=abre(LVE), Wd=LVE.w, Hd=LVE.h, C=CALC; if(!C) return;
  const X0=30, X1=Wd-6, Y0=4, Yb=Hd-14, X=ejeT(Wd,X0,X1), T=C.run.tr, N=C.run.N, dt=C.run.dt, Tmx=560, Y=v=>Yb-v/Tmx*(Yb-Y0);
  x.fillStyle='rgba(243,236,213,0.10)'; x.fillRect(X0,Y(180),X1-X0,Yb-Y(180));
  ejeY(x,X0,X1,Y,[0,180,360,540],v=>String(v)); ejeX(x,X,C.run.ciclo.T,Hd+2,50);
  txt(x,'cristales',X1-3,Y(180)-3,'#e9e0c3',8.5,'right','600');
  if(C.p.Ton!==undefined) raya(x,X0,Y(C.p.Ton),X1,Y(C.p.Ton),'rgba(255,183,3,0.65)',1,[4,3]);
  const tz=(arr,col,w,dash)=>{ x.setLineDash(dash||[]); x.strokeStyle=col; x.lineWidth=w; x.beginPath(); for(let i=0;i<N;i++){ const px=X(i*dt), py=Y(arr[i]); i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke(); x.setLineDash([]); };
  tz(T.Tg,COL.tg,1.2,[3,3]); tz(T.Tb,COL.tb,2);
  cursor(x,X,Y0,Yb); txt(x,'°C',X0+3,Y0+8,TXT,8.5,'left','600');
  el('t_sp').textContent=C.p.Ton!==undefined&&!C.fija?'inyecta desde '+fN(C.p.Ton)+' °C':'';
}

const _cl=(id,c)=>{ const e=el(id); if(e.className!==c) e.className=c; };
function pintaDock(){
  const C=CALC, e=SIM.e; if(!C||!e) return; const set=(id,h)=>{ const q=el(id); if(q.innerHTML!==h) q.innerHTML=h; };
  const sm=(v,u,d)=>fN(v,d||0)+'<small> '+u+'</small>';
  const Av=el('aviso'); let cl='',t=''; const oc=ocultaSalida();
  el('p_sub').textContent=C.fija?'':'t = '+fN(SIM.t,0)+' s';
  const dosisOn=e.on&&e.dem>1e-4;
  if(enDiagnostico()){
    const D=GUIA.dx, kI=D.kInj||1;
    set('f_1',sm(e.noxOut,'ppm')); set('f_2',sm(e.nh3,'ppm')); set('f_3',sm(e.Tb,'°C')); set('f_4',sm(e.noxIn,'ppm')); set('f_5',sm(e.dem/kI,'L/h',2)); set('f_6',sm(e.dem,'L/h',2));
    for(const i of [1,2,3,4,5,6]) _cl('f_'+i,''); Av.className='dk-aviso'; Av.textContent=''; return; }
  if(oc){ set('f_1','¿?'); _cl('f_1','oculto'); set('f_2','¿?'); _cl('f_2','oculto'); set('f_3','¿?'); _cl('f_3','oculto'); }
  else { set('f_1',sm(e.noxOut,'ppm')); _cl('f_1',e.noxOut/Math.max(e.noxIn,1)>0.3&&e.noxIn>30?'bad':'');
    set('f_2',sm(e.nh3,'ppm',e.nh3<10?1:0)); _cl('f_2',e.nh3>=RETO.slip?'bad':'');
    set('f_3',e.noxIn>30?sm(e.conv*100,'%'):'<small>—</small>'); _cl('f_3',''); }
  set('f_4',sm(e.Tb,'°C')); _cl('f_4','');
  set('f_5',dosisOn?sm(e.dem,'L/h',2):'<small>no inyecta</small>'); _cl('f_5','');
  set('f_6',sm(e.thM*100,'%')); _cl('f_6','');
  if(!oc&&dosisOn&&e.Tg<180){ cl='mal'; t='Con el escape a menos de 180 °C la urea no se descompone: se pega como cristales blancos.'; }
  else if(!e.on&&e.noxIn>30){ cl='ojo'; t='El escape está más frío que tu límite: no se inyecta y el NOx sale sin limpiar.'; }
  else if(!oc&&e.nh3>=RETO.slip){ cl='ojo'; t='Sobra amoníaco: el catalizador ya no puede guardar más y se escapa por el tubo.'; }
  else if(e.Tb>430&&dosisOn){ cl='ojo'; t='Muy caliente: la pared guarda poco amoníaco y parte se quema, así que limpia menos.'; }
  else if(dosisOn){ cl='bien'; t='Inyectando AdBlue: el amoníaco se guarda en la pared (azul) y reacciona con el NOx.'; }
  Av.className='dk-aviso'+(t?' on '+cl:''); if(Av.textContent!==t) Av.textContent=t;
}

function disposicion(){

  b.classList.toggle('estrecho',estrecho); b.classList.toggle('movil',movil); b.classList.toggle('ancho',estrecho&&!movil);

function ajustaHoja(){

  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.40:0.43),240,450));
  let hh=base; const hud=el('hud');

/* ===================== 21. EL RETO: CALCULA, AJUSTA, DIAGNOSTICA =====================
   Tres fases: 1 · Calcula (cuántos litros de AdBlue por hora hacen falta para el NOx que sale del motor), 2 · Ajusta (la dosis,
   la temperatura mínima para inyectar y el calentamiento, para que salga poco NOx y poco amoníaco sin cristalizar urea ni
   gastar mucho diésel: la salida sólo aparece al validar, y la ventana es INTERIOR en la dosis y en la temperatura) y 3 ·
   Diagnostica (¿por qué sale NOx o amoníaco?, sólo con lo que se ve en el dock). Cierra con un quiz de tres preguntas. */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- Fase 1 · Calcula el AdBlue ---------- */
const NOX_CASOS=[180,240,320,420];                                   // g/h de NOx que sale del motor (como NO2)

    else { feedback('bad','Revisa el cálculo',`Tu resultado (${fN(v,2)} L/h) está ${d}. Pasa los gramos de NOx a moles, y de moles de amoníaco a litros con los moles por litro. (intentos fallidos: ${RETOS.fallos1}/3)`); const t=el('d_try'); if(t) t.textContent=RETOS.fallos1; }

/* ---------- Fase 2 · Ajusta la dosis y la temperatura ---------- */

    }

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const CASOS_DX=[
  {k:'frio',L:0.08,dosis:1,Ton:180,dT:0},
  {k:'sobre',L:0.5,dosis:1.4,Ton:180,dT:0},
  {k:'viejo',L:0.5,dosis:1,Ton:180,dT:0,fKs:0.015},
  {k:'iny',L:0.5,dosis:1,Ton:180,dT:0,kInj:0.45},

const NOMBRE_DX={frio:'El escape está frío',sobre:'Se inyecta de más',viejo:'El catalizador está viejo',iny:'El inyector está tapado'};
function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.k; let c; do{ c=pickOne(CASOS_DX); }while(c.k===p);
  GUIA.dx=c; GUIA.dxOk=false; GUIA.orden=barajar(CASOS_DX.map(x=>x.k));
  reiniciaCalculo(); pintaHUD(); pintaDockFijo();
}
function diagnostica(k){
  if(!GUIA.dx||GUIA.dxOk) return; RETOS.intentos++;
  if(k===GUIA.dx.k){
    GUIA.dxOk=true; RETOS.fallos3=0; sonido.bien();
    feedback('good','Diagnóstico correcto ✓',explicaDx(GUIA.dx.k),true);
    reiniciaCalculo(); pintaDockFijo(); paso('quiz'); iniciaQuiz();
  } else {
    RETOS.fallos3++; sonido.mal();
    if(RETOS.fallos3>=3){ RETOS.fallos3=0; RETOS.resiembras++; feedback('bad','Tres intentos fallidos','Es otro caso: compara la temperatura, el NOx y el amoníaco con lo que pide el AdBlue y lo que entrega el inyector.',true); iniciaDiag(); }
    else { feedback('bad','No es ese',noEs(k)+` (intentos fallidos: ${RETOS.fallos3}/3)`,true); pintaHUD(); }
  }

function explicaDx(k){
  if(k==='frio') return `Con el escape a menos de 180 °C la computadora no inyecta: la urea no se descompondría y dejaría cristales. Por eso el NOx pasa sin limpiar mientras el catalizador se calienta.`;
  if(k==='sobre') return `Se inyecta mucho más de lo que pide el NOx: el catalizador se llena y el amoníaco sobrante se escapa por el tubo. El NOx sale limpio, pero el amoníaco huele y también contamina.`;
  if(k==='viejo') return `Con el catalizador envejecido la reacción es lenta: ni el NOx ni el amoníaco se aprovechan, y los dos salen. La dosis está bien; lo que falla es la pieza.`;
  return `El inyector entrega menos de lo que se le pide (se ve en las dos cifras de AdBlue): falta amoníaco y el NOx pasa. No es la temperatura ni el catalizador.`;

/* ===================== 21. SONIDO (sintetizado) =====================
   Un soplido grave del escape cuyo tono sigue al caudal de gas (muy atenuado) y los avisos de acierto y fallo. */
const sonido=(function(){
  let ctx=null,on=true,master=null,ult=0,zum=null,zg=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      zum=ctx.createOscillator(); zg=ctx.createGain(); zum.type='sawtooth'; zum.frequency.value=60; zg.gain.value=0; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=220; zum.connect(lp); lp.connect(zg); zg.connect(master); zum.start();
    }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); ult=f; }
  return {init,
    zumbido:(q)=>{ if(!ctx||!zum) return; const t=ctx.currentTime; zum.frequency.setTargetAtTime(34+q*60,t,0.15); zg.gain.setTargetAtTime(on&&q>0?0.010:0,t,0.15); },
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }, get freq(){ return ult; }};
})();

/* ===================== 22. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.max(Math.min(devicePixelRatio,alta?2:1.5),Math.min(devicePixelRatio,1.5)>1?1.25:1));
  const ms=alta?2048:1024; if(LUZ.sol.shadow.mapSize.x!==ms){ LUZ.sol.shadow.mapSize.set(ms,ms); if(LUZ.sol.shadow.map){ LUZ.sol.shadow.map.dispose(); LUZ.sol.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); if(typeof ponVista==='function'&&CALC) ponVista(EST.vista,0.001); centraEnHueco();
}

/* ===================== 23. EL LAZO: UN SOLO RELOJ =====================
   El tiempo del ciclo avanza dt·velocidad en cada cuadro, y con ESE tiempo se mueven las partículas, se pintan las celdas del
   catalizador, el rocío y los cristales, y se dibujan las gráficas del dock. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0, tSon=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  const dtS=EST.pausa?0:dt, dtSim=dtS*(CALC&&CALC.fija?1:EST.vel);
  aplicaEscena(dtS,dtSim);
  pasaCam(dt);
  if(t-tSon>0.4){ tSon=t; sonido.zumbido(SIM.e&&!EST.pausa?clamp(SIM.e.mGas/0.16,0,1):0); }
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaGraficas(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos(); colocaFoco();
}

/** Mide el objeto en lo VISIBLE: se pinta sin plataforma, suelo ni fondo sobre magenta puro y se toma la caja de los píxeles que no son magenta. */
function mideObjeto(){
  const ocultos=[]; PLATAFORMA.visible=false; scene.traverse(o=>{ if(o.userData&&o.userData.fondo&&o.visible){ o.visible=false; ocultos.push(o); } });
  const bg=scene.background, fog=scene.fog; scene.background=null; scene.fog=null; renderer.setClearColor(0xff00ff,1);
  renderer.render(scene,camera);
  const c=renderer.domElement, W=c.width, H=c.height, t=document.createElement('canvas'); t.width=W; t.height=H; const g=t.getContext('2d',{willReadFrequently:true}); g.drawImage(c,0,0);
  const d=g.getImageData(0,0,W,H).data; let x0=1e9,x1=-1,y0=1e9,y1=-1;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=(y*W+x)*4; if(!(d[i]>235&&d[i+1]<30&&d[i+2]>235)){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  PLATAFORMA.visible=true; for(const o of ocultos) o.visible=true; scene.background=bg; scene.fog=fog; renderer.setClearColor(0x000000,1);
  const k=W/innerWidth; return {x0:x0/k,x1:x1/k,y0:y0/k,y1:y1/k,altoPx:(y1-y0)/k,anchoPx:(x1-x0)/k,fracAlto:(y1-y0)/H,fracAncho:(x1-x0)/W,hueco:huecoLibre(),W:innerWidth,H:innerHeight};
}

  tour:(n)=>{ if(EST.modo!=='tour') setMode('tour',true); tourVa(n,0.001); },
  paso:(p)=>{ if(EST.modo!=='reto') setMode('reto',true); paso(p); if(p==='ajusta') prepararAjusta(); if(p==='diag') iniciaDiag(); if(p==='quiz'){ iniciaDiag(); paso('quiz'); iniciaQuiz(); } },
  setAjusta:(d,Ton,dT)=>{ const r=GUIA.r2; if(r){ r.dosis=d; r.Ton=Ton; r.dT=dT; r.validado=false; reiniciaCalculo(); pintaHUD(); pintaChips(); } },
  escenario:(c)=>{ const r=GUIA.r2; if(r){ r.esc=ESCENARIOS.find(e=>e.ciclo===c)||r.esc; reiniciaCalculo(); pintaHUD(); pintaChips(); } },
  dx:(k)=>{ GUIA.dx=CASOS_DX.find(c=>c.k===k); GUIA.dxOk=false; reiniciaCalculo(); pintaHUD(); pintaDockFijo(); },
});
instalaDiag('scr-adblue-nox',{escena:scene,camara:camera,controles:controls,renderizador:renderer,
  grupos:{motor:MOTOR,tanque:TANQUE,inyector:INYECTOR,catalizador:CATG,sensores:SENSORES,tubos:TUBOS}});
