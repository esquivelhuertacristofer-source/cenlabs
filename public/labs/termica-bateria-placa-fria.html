<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Batería de VE: placa fría y carga rápida — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#07202A;--panel:rgba(6,24,33,.88);--line:#1E4B5E;--ink:#EBF6F9;
    --dim:#9CBCCB;--accent:#4FC3F0;--accent2:#A6E4FA;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cF:#4FC3F0;--cR:#FFB347;--cE:#FF4D5A;--cG:#C8D6D2;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#10252e;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#16323d}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#031a20;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#031a20;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#7fd6f6}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .modebar .b{padding:7px 3px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#031a20}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#7CC4FF;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f87a0;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f90a8;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#031a20}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .escs{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
  .esc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px;font-size:11.5px;line-height:1.35;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);color:#c4d3e6}
  .esc .rs{font-weight:700;font-size:11px}.esc .rs.ok{color:var(--good)}.esc .rs.mal{color:#ff9a9a}
  .esc .pista{font-size:10.5px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#09121c;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(30,53,80,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,53,80,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f87a0}
  .dk-tit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#a3bcd6;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c6da;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#10252e;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfdcec;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,18,30,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,18,30,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d3e6}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,18,30,.92);border:1px solid rgba(124,196,255,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,18,30,.84);border:1px solid rgba(124,196,255,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .chips{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .chip{font-size:11.5px;line-height:1.35;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--dim)}
  .chip b{color:var(--ink)} .chip small{font-size:10.5px;color:var(--dim)}
  .chip.ok{border-color:rgba(52,211,153,.5)} .chip.ok b{color:var(--good)} .chip.mal{border-color:rgba(244,71,94,.5)} .chip.mal b{color:#ff9aa8}
  .leyT{display:flex;flex-direction:column;gap:3px}
  .leyT .barra{height:9px;border-radius:5px;background:linear-gradient(90deg,#2f5fd0 0%,#2aa8d8 20%,#3fd6a4 41%,#6fdc5a 57%,#e0d83c 65%,#ffb02e 71%,#ff6a2a 84%,#e8262a 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .leyT .eti{display:flex;justify-content:space-between;font-size:10px;color:var(--dim)}
  .leyT .eti b{color:var(--ink);font-weight:600}
  .tour{border:1px solid rgba(79,195,240,.40);background:rgba(79,195,240,.07);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .tour .tn{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);display:flex;justify-content:space-between}
  .tour h3{font-size:15.5px;line-height:1.25}
  .tour p{font-size:12.8px;line-height:1.5;color:#d3e3ea}
  .tour p b{color:#fff}
  .tour .pts{display:flex;gap:4px}
  .tour .pts i{flex:1;height:4px;border-radius:2px;background:var(--line)}
  .tour .pts i.on{background:var(--accent)}
  .tour .nav{display:flex;gap:6px}.tour .nav .b{flex:1}
  .tour .salta{font-size:11px;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:0;font-family:inherit;align-self:center}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}
  body.estrecho.ancho.t-panel .panel>.dk-fig{grid-column:1;grid-row:2}
  body.estrecho.ancho.t-panel .panel>.dk-row{grid-column:1;grid-row:3/6;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-fu{grid-column:2;grid-row:2;align-self:start}
  body.estrecho.ancho.t-panel .panel>.dk-g.fu{grid-column:2;grid-row:2/4;min-height:0;margin-top:18px}
  body.estrecho.ancho.t-panel .panel>.dk-ley{display:none}
  body.estrecho.ancho.t-panel .panel>.t-sp{grid-column:2;grid-row:4}
  body.estrecho.ancho.t-panel .panel>.dk-g.sp{grid-column:2;grid-row:5;min-height:0}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   LAB — GESTIÓN TÉRMICA DE UNA BATERÍA DE VE: PLACA FRÍA LÍQUIDA Y CARGA RÁPIDA
   (Autotrónica · mecanica-146)

   Un módulo de 12 celdas en tres filas escalonadas, cada fila sobre su tramo de placa fría. Por la placa corre una mezcla
   de agua y glicol que llega fría del enfriador, pasa por la bomba y se lleva el calor de las celdas. La carga rápida
   (10 → 80 %) calienta cada celda (I²R + calor entrópico); el modelo térmico, el circuito del líquido (ε-NTU), el recorte
   de corriente por temperatura y las potencias son UN solo modelo, en un bloque puro que un script de Node extrae TAL
   CUAL y verifica. La escena, el dock y las cifras salen del mismo estado y del mismo reloj.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO='\u202F';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }



/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos marcas— y lo prueba:
   lo que se prueba es lo que corre. */
/* FISICA:INICIO */
/* ---- Gestión térmica de una batería de VE: placa fría líquida y carga rápida. Física pura (sin three). SI salvo donde se diga. ----
   Un módulo de NC celdas prismáticas en serie, cada una pegada a una placa fría por la que corre una mezcla agua-glicol.
   · Calor de la celda: q = I²·R(T,SOC) + I·T·dU/dT   (I > 0 al cargar; el segundo término es el calor entrópico, reversible)
   · Celda: C·dT/dt = q − Q_i + G·(vecinas)            (masa térmica concentrada, una temperatura por celda)
   · Celda → líquido: resistencia en serie  R_cp (almohadilla + conducción interna)  y  1/(h·A) (convección en el canal)
   · Líquido: método ε-NTU por tramo, ε = 1 − exp(−UA/(ṁ·cp)),  Q_i = ε·ṁ·cp·(T_i − T_líq,entrada)   → ΔT_total = ΣQ/(ṁ·cp)
   · Canal: Nu y factor de fricción laminar (4,364 y 64/Re), turbulento (Gnielinski y Petukhov) y transición lineal 2300-4000
   · Carga: la corriente pedida baja al llegar a ~50 % de SOC; el BMS la recorta por temperatura (frío: plating; calor: protección). */
const DOSPI=Math.PI*2;
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const K0=273.15;

/* Celda prismática de 80 A·h (didáctica, no de un fabricante) */
const CEL={Q:80,m:1.20,cp:950,Rcp:0.30,R25:1.20e-3,B:3000,dUdT:-0.10e-3,Gcc:0.4};
CEL.C=CEL.m*CEL.cp;                                  // J/K
const NC=12;                                          // celdas del módulo, en el orden en que las recorre el líquido
const resistencia=(T,s)=>CEL.R25*Math.exp(CEL.B*(1/(T+K0)-1/(25+K0)))*(1+0.8*Math.pow(1-s,3));   // Ω: Arrhenius en T, sube con poca carga
const calorCelda=(I,T,s)=>I*I*resistencia(T,s)+I*(T+K0)*CEL.dUdT;                                  // W
/* Las dos celdas de los extremos llevan además el calor de la barra de cobre que lleva la corriente al módulo: I²·R_barra */
const R_BARRA=0.25e-3;
const calorExtra=(I,i,N)=>(i===0||i===N-1)?I*I*R_BARRA:0;

/* Mezcla agua-etilenglicol 50/50: propiedades en función de la temperatura (°C), aproximaciones lineales/exponencial de tabla */
const propsF=T=>({rho:1075-0.6*(T-25),cp:3300+5.5*(T-25),k:0.395+0.0005*(T-25),mu:3.8e-3*Math.exp(-0.0255*(T-25))});
const PROPS_CTE={rho:1075,cp:3300,k:0.395,mu:3.8e-3};          // para las pruebas de forma cerrada
let USA_CTE=false;
const props=T=>USA_CTE?PROPS_CTE:propsF(T);
function usaCte(b){ USA_CTE=!!b; }                              // sólo para las pruebas de forma cerrada

/* Placa fría: un solo canal serpenteante bajo las NC celdas */
const PLACA={Dh:6e-3,A:4.8e-5,Per:32e-3,L:1.6,K:4.0,etaB:0.30};   // m, m², m, m, pérdidas singulares (curvas, entrada/salida), rendimiento bomba+motor
PLACA.Lseg=PLACA.L/NC;
const nuLam=4.364;
function nusselt(Re,Pr){
  const turb=R=>{ const f=Math.pow(0.790*Math.log(R)-1.64,-2); return (f/8)*(R-1000)*Pr/(1+12.7*Math.sqrt(f/8)*(Math.pow(Pr,2/3)-1)); };
  if(Re<=2300) return nuLam;
  if(Re>=4000) return turb(Re);
  const g=(Re-2300)/1700; return (1-g)*nuLam+g*turb(4000);
}
function friccion(Re){                                // factor de Darcy
  const turb=R=>Math.pow(0.790*Math.log(R)-1.64,-2);
  if(Re<=2300) return 64/Math.max(Re,1e-9);
  if(Re>=4000) return turb(Re);
  const g=(Re-2300)/1700; return (1-g)*64/2300+g*turb(4000);
}

/* Cargador y BMS */
const CARGA={s0:0.10,s1:0.80,sCC:0.50,fFin:0.25,Ccc:3.0};
const iPedida=(s,Ccc)=>Ccc*CEL.Q*(s<=CARGA.sCC?1:1-(1-CARGA.fFin)*clamp((s-CARGA.sCC)/(CARGA.s1-CARGA.sCC),0,1));    // A
const LIM={frio0:0,frio1:15,cal0:40,cal1:50,vent0:15,vent1:35,gradMax:3.5,Tmax:40,Tplating:15};     // °C
const factorFrio=T=>clamp((T-LIM.frio0)/(LIM.frio1-LIM.frio0),0,1);
const factorCalor=T=>clamp((LIM.cal1-T)/(LIM.cal1-LIM.cal0),0,1);
/* Enfriador (chiller): potencia eléctrica = calor retirado / COP, con COP = 35 % del de Carnot, entre 1,5 y 8. Si el líquido
   tiene que CALENTAR las celdas (arranque en frío), un calentador de resistencia PTC: COP = 1. */
const TAMB_DEF=35;
const copChiller=(Tin,Tamb)=>clamp(0.35*(Tin+K0)/Math.max(Tamb-Tin,0.5),1.5,8);

/* ---- Un instante: derivadas de las NC temperaturas y del SOC, potencias y estado del circuito ---- */
function evalua(T,s,par){
  const N=T.length, Tin=par.Tin, pi=props(Tin);
  const mdot=Math.max(par.V,0)/60000*pi.rho;                      // kg/s: el caudal se fija en L/min a la entrada
  let Tmin=1e9,Tmax=-1e9; for(let i=0;i<N;i++){ if(T[i]<Tmin) Tmin=T[i]; if(T[i]>Tmax) Tmax=T[i]; }
  let I; if(par.Ifija!==undefined) I=par.Ifija; else if(s>=CARGA.s1-1e-12) I=0; else I=iPedida(s,par.Ccc)*Math.min(factorFrio(Tmin),factorCalor(Tmax));
  const dT=new Array(N), Q=new Array(N), q=new Array(N), Tf=new Array(N+1); Tf[0]=Tin;
  let Qtot=0,qtot=0,dp=0,Re0=0,hAm=0;
  for(let i=0;i<N;i++){
    q[i]=calorCelda(I,T[i],s)+calorExtra(I,i,N); qtot+=q[i];
    if(mdot>0){
      const p=props(Tf[i]), cap=mdot*p.cp, v=mdot/(p.rho*PLACA.A), Re=mdot*PLACA.Dh/(PLACA.A*p.mu), Pr=p.mu*p.cp/p.k;
      const hA=nusselt(Re,Pr)*p.k/PLACA.Dh*PLACA.Per*PLACA.Lseg, UA=1/(CEL.Rcp+1/hA), eps=1-Math.exp(-UA/cap);
      Q[i]=eps*cap*(T[i]-Tf[i]); Tf[i+1]=Tf[i]+Q[i]/cap; Qtot+=Q[i];
      dp+=friccion(Re)*(PLACA.Lseg/PLACA.Dh)*0.5*p.rho*v*v; if(i===0){ Re0=Re; } hAm+=hA/N;
    } else { Q[i]=0; Tf[i+1]=Tf[i]; }
  }
  if(mdot>0){ const v0=mdot/(pi.rho*PLACA.A); dp+=PLACA.K*0.5*pi.rho*v0*v0; }
  for(let i=0;i<N;i++){
    const izq=i>0?T[i-1]-T[i]:0, der=i<N-1?T[i+1]-T[i]:0;
    dT[i]=(q[i]-Q[i]+CEL.Gcc*(izq+der))/CEL.C;
  }
  const Ph=mdot>0?dp*(mdot/pi.rho):0, Pb=Ph/PLACA.etaB;            // W hidráulicos y eléctricos de la bomba
  const Pch=Qtot>=0?Qtot/copChiller(Tin,par.Tamb===undefined?TAMB_DEF:par.Tamb):-Qtot;      // si el líquido calienta a las celdas, resistencia PTC: COP = 1
  return {dT,dS:par.congela?0:I/(CEL.Q*3600),I,q,Q,Tf,Qtot,qtot,dp,Pb,Pch,Re:Re0,hA:hAm,mdot,Tout:Tf[N],Tmin,Tmax,fr:factorFrio(Tmin),fc:factorCalor(Tmax)};
}

/* ---- Integración (RK4) de una carga o de un tiempo fijo. Acumula energías con los MISMOS pesos que la integración, así que
        Eq_generada − Eq_retirada = C·ΣΔT se cumple al redondeo. ---- */
function simula(par,opt){
  opt=opt||{};
  const dt=par.dt||1, N=par.N||NC, tmax=par.tmax||4000, hasta=par.hasta, traza=!!opt.traza;
  const T=new Array(N).fill(par.T0===undefined?28:par.T0); let s=par.s0===undefined?CARGA.s0:par.s0, t=0;
  const o={t:[],Tmax:[],Tmin:[],Tm:[],I:[],s:[],Tout:[],Qtot:[],Pb:[],Pch:[],Ti:[],Pcal:[]};
  let Egen=0,Eq=0,Epb=0,Epc=0,Ahc=0,pico=-1e9,minDurante=1e9,gradMax=0,tFrio=0,tCal=0,tLim=0;
  const T00=T.slice(), s00=s;
  const evaluar=(Tx,sx)=>evalua(Tx,sx,par);
  const fin=()=>hasta!==undefined?t>=hasta-1e-9:s>=CARGA.s1-1e-12;
  let pasos=0;
  let e0=evaluar(T,s);
  while(!fin()&&t<tmax){
    if(traza&&(pasos%(opt.cada||1)===0)) guarda(o,t,T,s,e0);
    const k1=e0, T2=T.map((x,i)=>x+0.5*dt*k1.dT[i]), s2=s+0.5*dt*k1.dS, k2=evaluar(T2,s2);
    const T3=T.map((x,i)=>x+0.5*dt*k2.dT[i]), s3=s+0.5*dt*k2.dS, k3=evaluar(T3,s3);
    const T4=T.map((x,i)=>x+dt*k3.dT[i]), s4=s+dt*k3.dS, k4=evaluar(T4,s4);
    const w=(f)=>(f(k1)+2*f(k2)+2*f(k3)+f(k4))/6;
    for(let i=0;i<N;i++) T[i]+=dt*(k1.dT[i]+2*k2.dT[i]+2*k3.dT[i]+k4.dT[i])/6;
    s+=dt*w(k=>k.dS);
    Egen+=dt*w(k=>k.qtot); Eq+=dt*w(k=>k.Qtot); Epb+=dt*w(k=>k.Pb); Epc+=dt*w(k=>k.Pch); Ahc+=dt*w(k=>k.I)/3600;
    t+=dt; pasos++;
    e0=evaluar(T,s);
    if(e0.Tmax>pico) pico=e0.Tmax;
    if(e0.I>0.02*CEL.Q){ if(e0.Tmin<minDurante) minDurante=e0.Tmin; if(e0.Tmin<LIM.Tplating) tFrio+=dt; }
    if(e0.Tmax-e0.Tmin>gradMax) gradMax=e0.Tmax-e0.Tmin;
    if(e0.Tmax>LIM.Tmax) tCal+=dt;
    if(e0.I<iPedida(s,par.Ccc)*0.999&&par.Ifija===undefined) tLim+=dt;
  }
  if(traza&&!(par.hasta===undefined&&s>=CARGA.s1-1e-12)) guarda(o,t,T,s,e0);   // en el instante final I = 0: no se anota
  let dUint=0; for(let i=0;i<N;i++) dUint+=CEL.C*(T[i]-T00[i]);
  const llego=s>=CARGA.s1-1e-12;
  return {t,s,T,llego,pico,minDurante:minDurante>1e8?e0.Tmin:minDurante,gradMax,tFrio,tCal,tLim,Egen,Eq,Epb,Epc,Ah:Ahc,dUint,
    balance:Egen-Eq-dUint,Pbomba:t>0?Epb/t:0,Pchiller:t>0?Epc/t:0,Pref:t>0?(Epb+Epc)/t:0,traza:traza?o:null,fin:e0,s00};
}
function guarda(o,t,T,s,e){
  o.t.push(t); o.Tmax.push(e.Tmax); o.Tmin.push(e.Tmin); o.Tm.push(T.reduce((a,b)=>a+b,0)/T.length); o.I.push(e.I); o.s.push(s); o.Tout.push(e.Tout);
  o.Qtot.push(e.Qtot); o.Pb.push(e.Pb); o.Pch.push(e.Pch); o.Pcal.push(e.qtot); o.Ti.push(T.slice());
}
/* tiempo ideal: la carga pedida sin ningún recorte térmico (corriente = la pedida) */
function tiempoIdeal(Ccc){ let s=CARGA.s0,t=0; const dt=0.5; while(s<CARGA.s1-1e-12&&t<20000){ s+=dt*iPedida(s,Ccc)/(CEL.Q*3600); t+=dt; } return t; }

/* ---- El reto ---- */
const RETO={dtBarrido:2,tolPot:0.20,tolTiempo:0.04};
const ESCENARIOS=[{T0:35,Ccc:3.0,Tamb:38},{T0:32,Ccc:3.0,Tamb:33},{T0:36,Ccc:2.7,Tamb:40},{T0:30,Ccc:3.2,Tamb:32},{T0:34,Ccc:2.9,Tamb:36}];
function evaluaReto(V,Tin,esc,dt){
  const r=simula({V,Tin,T0:esc.T0,Ccc:esc.Ccc,Tamb:esc.Tamb,dt:dt||RETO.dtBarrido});
  const tId=tiempoIdeal(esc.Ccc), tOk=r.t<=tId*(1+RETO.tolTiempo);
  const c={calor:r.pico<=LIM.Tmax, grad:r.gradMax<=LIM.gradMax, frio:r.tFrio<=0, tiempo:r.llego&&tOk};

/** Junta una pieza hecha de muchas mallas en una malla por material: así una bobina con 40 piezas cuesta pocas llamadas. */
function fusiona(grupo){
  grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map();
  grupo.traverse(o=>{ if(!o.isMesh) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(), m=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);
    g.applyMatrix4(m);
    if(!g.attributes.uv){ g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2)); }
    const k=o.material; if(!por.has(k)) por.set(k,[]); por.get(k).push(g); });
  const out=new THREE.Group();
  for(const [mat,gs] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count;
      pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry();
    G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const me=new THREE.Mesh(G,mat); me.castShadow=!mat.transparent; me.receiveShadow=true; out.add(me);
  }
  return out;
}

/** Funde las mallas ESTÁTICAS de un grupo en una malla por material (y por «clave» de pieza, para que el rótulo y el
 *  tooltip sigan sabiendo de qué pieza son). Las que se mueven, las instanciadas, las de material múltiple y el fondo se
 *  quedan como están. */
function fusionaPartes(grupo,excluir){
  excluir=excluir||[]; grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map(), viejas=[];
  const fuera=o=>{ for(let p=o;p&&p!==grupo;p=p.parent) if(excluir.includes(p)||(p.userData&&p.userData.fondo===true)) return true; return false; };
  grupo.traverse(o=>{ if(!o.isMesh||o.isInstancedMesh||fuera(o)||o.userData.noFusion) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(); g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld));
    if(!g.attributes.uv) g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
    const clave=o.userData.clave||'', ro=o.renderOrder||0;
    const mete=(mat,geo)=>{ const k=mat.uuid+'|'+clave; if(!por.has(k)) por.set(k,{mat,clave,gs:[],ro}); por.get(k).gs.push(geo); };
    if(Array.isArray(o.material)){
      const grupos=g.groups&&g.groups.length?g.groups:[{start:0,count:g.attributes.position.count,materialIndex:0}];
      for(const gr of grupos){ const mat=o.material[gr.materialIndex]; if(!mat) continue; const sub=new THREE.BufferGeometry();
        for(const nom of ['position','normal','uv']){ const at=g.attributes[nom]; sub.setAttribute(nom,new THREE.BufferAttribute(at.array.slice(gr.start*at.itemSize,(gr.start+gr.count)*at.itemSize),at.itemSize)); }
        mete(mat,sub); }
      g.dispose();
    } else mete(o.material,g);
    viejas.push(o); });
  for(const o of viejas){ o.parent.remove(o); }
  for(const [,{mat,clave,gs,ro}] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count; pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry(); G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const me=new THREE.Mesh(G,mat); me.castShadow=!mat.transparent&&!(mat.blending===THREE.AdditiveBlending); me.receiveShadow=true; me.renderOrder=ro; if(clave) me.userData.clave=clave; grupo.add(me);
  }
}

/* ===================== 12. EL ESTADO Y EL RELOJ =====================
   Un solo cálculo (CALC) alimenta la escena, el dock y las cifras: se recalcula cuando cambia un mando. El reloj SIM.t es
   el tiempo de la CARGA (s) y avanza BASE_T·velocidad segundos de carga por segundo de pantalla; con él se mueven los
   colores de las celdas, el color y el avance del líquido, el calor de cada celda, la corriente del cargador y el cursor de
   todas las gráficas. Al terminar la carga (80 %) el reloj espera un instante y empieza otra vez. */
const BASE_T=40;
const AMB={fria:{T0:10,Tamb:5,nombre:'Fría (10 °C)'},templada:{T0:25,Tamb:25,nombre:'Templada (25 °C)'},caliente:{T0:35,Tamb:38,nombre:'Caliente (35 °C)'}};
const EST={modo:'tour',V:9,Tin:10,ini:'templada',vel:1,pausa:REDUCIDO,autoRunning:false,vista:'todo',rot:false};
const SIM={t:0,hold:0,e:null,calc:null,ver:0,xray:0,fan:0,imp:0,phLiq:0,phMote:0,phCar:0,frame:0};
let CALC=null;

/** Lo que corre ahora: en «Probar», lo que digan los mandos; en el recorrido y en el reto, lo que pida el paso. */
function paramsActuales(){
  if(EST.modo==='tour'){ const p=tourParams(); if(p) return p; }
  if(EST.modo==='reto'){ const p=retoParams(); if(p) return p; }
  const a=AMB[EST.ini];
  return {V:EST.V,Tin:EST.Tin,T0:a.T0,Tamb:a.Tamb,Ccc:CARGA.Ccc};
}
/** Recalcula la carga completa con esos mandos, y la misma carga SIN enfriar (bomba parada) como referencia. */
function calcula(p){
  const base={V:p.V,Tin:p.Tin,T0:p.T0,Tamb:p.Tamb,Ccc:p.Ccc,s0:p.s0,dt:RETO.dtBarrido};
  const run=simula(base,{traza:true,cada:1});
  const sin=p.V>0&&!p.sinRef?simula(Object.assign({},base,{V:0}),{traza:true,cada:1}):null;
  return {p,run,sin,tIdeal:tiempoIdeal(p.Ccc),T:run.t};
}
function reiniciaCalculo(){
  const prev=CALC; CALC=calcula(paramsActuales()); SIM.calc=CALC; SIM.ver++;
  if(!prev||prev.p.T0!==CALC.p.T0||prev.p.s0!==CALC.p.s0||prev.p.Ccc!==CALC.p.Ccc) { SIM.t=0; SIM.hold=0; }
  SIM.t=Math.min(SIM.t,Math.max(0,CALC.T-1));
  if(typeof pintaDockFijo==='function') pintaDockFijo();
}

/* ---- el estado del módulo en el instante t: se interpola la traza y se vuelve a evaluar el circuito (Tf, Q de cada celda) ---- */
const _TI=new Array(NC).fill(25);
function estadoEn(t){
  const C=CALC; if(!C) return null;
  const o=C.run.traza, n=o.t.length, tt=clamp(t,0,o.t[n-1]);
  let i=Math.min(n-2,Math.max(0,Math.floor(tt/(o.t[1]-o.t[0])))); if(n<2) i=0;
  const f=n<2?0:clamp((tt-o.t[i])/(o.t[i+1]-o.t[i]),0,1), a=o.Ti[i], b=o.Ti[Math.min(i+1,n-1)];
  for(let k=0;k<NC;k++) _TI[k]=a[k]+(b[k]-a[k])*f;
  const s=o.s[i]+(o.s[Math.min(i+1,n-1)]-o.s[i])*f;
  const par={V:C.p.V,Tin:C.p.Tin,Tamb:C.p.Tamb,Ccc:C.p.Ccc};
  const ev=evalua(_TI,s,par);
  return Object.assign(ev,{i,s,Ti:_TI,t:tt,Ipedida:iPedida(s,C.p.Ccc),grad:ev.Tmax-ev.Tmin,Pref:ev.Pb+ev.Pch});
}

/* ===================== 13. LO QUE SE VE ===================== */
let XRAY_OBJ=0;
function aplicaEscena(dtS,dtSim){
  const C=CALC; if(!C) return;
  const fin=C.T;
  if(SIM.hold>0){ SIM.hold-=dtS; if(SIM.hold<=0){ SIM.hold=0; SIM.t=0; } }
  else { SIM.t+=dtSim; if(SIM.t>=fin-0.5){ SIM.t=fin-0.5; SIM.hold=2.2; } }
  const e=estadoEn(SIM.t); if(!e) return; SIM.e=e; SIM.frame++;
  // ---- rayos X: en la vista de la placa las celdas se vuelven de vidrio ----
  XRAY_OBJ=(EST.vista==='placa')?1:0; SIM.xray+=(XRAY_OBJ-SIM.xray)*clamp(dtS*5+(dtS===0?1:0),0,1);
  const op=1-0.78*SIM.xray;
  const qmax=70;
  for(let i=0;i<NC;i++){
    const c=CE[i], T=e.Ti[i];
    colorT(T,_col); c.mat.emissive.copy(_col); c.mat.color.copy(_col).multiplyScalar(0.78);
    const cal=clamp((T-30)/12,0,1);
    c.mat.emissiveIntensity=0.05+0.22*cal+0.30*SIM.xray;
    c.mat.opacity=op; c.mat.depthWrite=SIM.xray<0.05;
    VENT.win.setColorAt(i,_col.set(colorT(T,_cT2)).multiplyScalar(1.0));
    c.timMat.emissiveIntensity=clamp(e.Q[i]/qmax,0,1.2)*1.6; c.timMat.opacity=0.85-0.45*SIM.xray;
  }
  VENT.win.instanceColor.needsUpdate=true; VENT.win.visible=VENT.marco.visible=SIM.xray<0.3;
  // ---- el líquido: color del tubo (cada dos cuadros) y partículas ----
  if(SIM.frame%2===0||dtS===0){
    const col=TUBO.col, nr=NRAD_TUBO+1;
    for(let j=0;j<=NSEG_TUBO;j++){ colorT(tempLazo(j/NSEG_TUBO,e),_col); const r=_col.r*0.95+0.03,g=_col.g*0.95+0.03,b=_col.b*0.95+0.03;
      for(let k=0;k<nr;k++){ const idx=j*nr+k; if(idx<col.count) col.setXYZ(idx,r,g,b); } }
    col.needsUpdate=true;
  }
  const flujo=C.p.V>0, vVis=flujo?0.07+0.045*C.p.V:0;
  SIM.phLiq=(SIM.phLiq+vVis*dtS/LAZO_LEN)%1;
  for(let i=0;i<NPAR;i++){
    const u=((i/NPAR+SIM.phLiq)%1+1)%1; LAZO.getPointAt(u,_pos);
    const T=tempLazo(u,e); colorT(T,_col); const g=flujo?0.0150:0.0;
    _m4.compose(_pos,_q0,_sc.set(g,g,g)); PAR_L.setMatrixAt(i,_m4); PAR_L.setColorAt(i,_col.multiplyScalar(1.15)); }
  PAR_L.instanceMatrix.needsUpdate=true; PAR_L.instanceColor.needsUpdate=true;
  // ---- el calor que sube de cada celda ----
  SIM.phMote=(SIM.phMote+dtS*0.55)%1;
  for(let i=0;i<NC;i++){
    const p=cePos(i), k=clamp(e.q[i]/90,0,1.1);
    for(let m=0;m<3;m++){ const idx=i*3+m, u=((SIM.phMote+m/3)%1), amp=0.02*Math.sin((u*6+m*2+i)*1.3);
      _pos.set(p.x+(m-1)*0.07+amp,p.y+CEL_H+0.08+u*0.30,p.z+0.01*Math.cos(i+m)); const g=k>0.02?0.006+0.010*k*(1-u):0.0;
      _m4.compose(_pos,_q0,_sc.set(g,g,g)); MOTES.setMatrixAt(idx,_m4); MOTES.setColorAt(idx,_col.set('#ff9a4a').multiplyScalar(0.6+0.8*(1-u))); } }
  MOTES.instanceMatrix.needsUpdate=true; MOTES.instanceColor.needsUpdate=true;
  // ---- el cargador: corriente entrando por la celda 1 y saliendo por la 12 ----
  const fI=clamp(e.I/(CARGA.Ccc*CEL.Q),0,1.05);
  SIM.phCar=(SIM.phCar+dtS*(0.1+0.9*fI))%1;
  M2.cableCarga.emissiveIntensity=0.05+0.45*fI;
  for(const [im,cur] of [[CAR_A,CAB_A],[CAR_B,CAB_B]]){
    for(let i=0;i<NCAR;i++){ const u=((i/NCAR+SIM.phCar)%1); cur.getPointAt(u,_pos); const g=e.I>1?0.006+0.006*fI:0;
      _m4.compose(_pos,_q0,_sc.set(g,g,g)); im.setMatrixAt(i,_m4); im.setColorAt(i,_col.set('#ffd24a')); }
    im.instanceMatrix.needsUpdate=true; im.instanceColor.needsUpdate=true; }
  // ---- bomba y ventilador ----
  SIM.imp+=dtS*(flujo?3+1.1*C.p.V:0); BOMBAV.imp.rotation.z=-SIM.imp;
  SIM.fan+=dtS*(2+8*clamp(e.Qtot/900,0,1)); ENFV.rot.rotation.z=SIM.fan;
  colorT(C.p.Tin,_col); M2.led.color.copy(_col);
}

/* ===================== 14. CÁMARAS =====================
   La escena se encuadra con el hueco que dejan la guía y el dock: la cámara se aleja lo justo para que la caja del
   «objeto» (ancho × alto en metros) quepa entera en ese hueco, y la proyección se desplaza para centrarla en él.
   Además el objeto nunca pasa del 66 % del alto del lienzo. */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}
const VISTAS={
  todo:{dir:V3(-0.30,0.62,1),anc:()=>V3(0.10,0.40,-0.30),toff:V3(0,0,0),obj:()=>({w:innerWidth<innerHeight*0.9?3.0:2.80,h:1.95}),fov:34,tope:0.70},
  celdas:{dir:V3(-0.18,0.42,1),anc:()=>V3(0,0.52,-0.05),toff:V3(0,0,0),obj:()=>({w:2.30,h:1.45}),fov:34,tope:0.70},
  placa:{dir:V3(-0.10,1.25,0.85),anc:()=>V3(0,0.20,-0.02),toff:V3(0,0,0),obj:()=>({w:2.55,h:2.45}),fov:34,tope:0.70},
  circuito:{dir:V3(-0.25,1.15,0.75),anc:()=>V3(0.0,0.25,-0.55),toff:V3(0,0,0),obj:()=>({w:2.90,h:2.60}),fov:34,tope:0.70},
};
const CAM={off:V3(-1.5,1.6,6),toff:V3(0,0,0),auto:true,previo:null,k:1,dur:1};
function fovVista(v){ return innerWidth<innerHeight*0.9?46:VISTAS[v].fov; }
function distanciaFit(w,h,fov,tope){
  const Hu=huecoLibre(), W=innerWidth, Hh=innerHeight, tv=Math.tan(fov*Math.PI/360), th=tv*(W/Hh);
  const wF=Math.max(80,Hu.x1-Hu.x0)/W, hF=Math.max(80,Hu.y1-Hu.y0)/Hh;
  const D=1.06*Math.max(w/(2*th*wF),h/(2*tv*hF));
  return Math.max(D,h/(2*tv*(tope||0.66)));
}
function ofsDeseado(v){
  const V=VISTAS[v], o=V.obj(), fov=fovVista(v), D=distanciaFit(o.w,o.h,fov,V.tope);
  return {off:V.dir.clone().normalize().multiplyScalar(D),toff:V.toff.clone(),fov};
}
function ponVista(v,dur){
  EST.vista=v; CAM.auto=true; CAM.dur=dur===undefined?1.0:dur;
  if(typeof pintaBarras==='function') pintaBarras();
  if(CAM.dur<=0.01){ const A=VISTAS[v].anc(), d=ofsDeseado(v); CAM.off.copy(d.off); CAM.toff.copy(d.toff); camera.fov=d.fov; camera.updateProjectionMatrix();
    camera.position.copy(A).add(CAM.off); controls.target.copy(A).add(CAM.toff); CAM.previo=A.clone(); }
}
function pasaCam(dt){
  const V=VISTAS[EST.vista], P=V.anc();
  if(CAM.auto){
    const d=ofsDeseado(EST.vista), k=1-Math.exp(-dt/Math.max(0.05,(CAM.dur||1)*0.30));
    CAM.off.lerp(d.off,k); CAM.toff.lerp(d.toff,k);
    if(Math.abs(camera.fov-d.fov)>0.05){ camera.fov+=(d.fov-camera.fov)*k; camera.updateProjectionMatrix(); }
    camera.position.copy(P).add(CAM.off); controls.target.copy(P).add(CAM.toff);
  } else if(CAM.previo){ const dP=P.clone().sub(CAM.previo); camera.position.add(dP); controls.target.add(dP); }
  CAM.previo=P.clone();
}
controls.addEventListener('start',()=>{ CAM.auto=false; });


/* ===================== 15. EL HUD (izquierda) ===================== */
const ocultaPotencia=()=>EST.modo==='reto'&&RETOG.paso==='decide'&&!(RETOG.r2&&RETOG.r2.validado);   // el gasto de enfriar, mientras se ajusta

const enCalculo=()=>EST.modo==='reto'&&RETOG.paso==='predice';
const slider=(id,lab,val,min,max,step,u,d,m1,m2,aria)=>`<div class="cg"><div class="cl"><div>${lab}</div><b id="v_${id}">${fN(val,d)} ${u}</b></div><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" aria-label="${aria}"><div class="marcas"><span>${m1}</span><span>${m2}</span></div></div>`;
const leyendaT=()=>`<div class="leyT"><div class="barra"></div><div class="eti"><span>frío</span><span><b>15 a 35 °C</b> · bien</span><span>caliente</span></div></div>`;
function pintaHUD(){
  const H=el('hud');

  h+=EST.modo!=='reto'?`<h2>Enfrías la batería de un coche eléctrico para que cargue rápido sin sobrecalentarse.</h2></div>`:`<h2>Reto: calcula, ajusta y diagnostica</h2></div>`;

  if(EST.modo==='tour') h+=htmlTour();
  else if(EST.modo==='libre'){
    h+=`<div class="hmandos">
    ${slider('rV','Cuánto líquido pasa',EST.V,0,14,0.5,'L/min',1,'0 · parada','14','Caudal del líquido en litros por minuto')}
    ${slider('rT','Qué tan frío entra el líquido',EST.Tin,5,35,0.5,'°C',1,'5','35','Temperatura del líquido a la entrada de la placa en grados')}
    <div class="cg"><div class="cl">La batería empieza</div><div class="seg" id="segIni">${Object.keys(AMB).map(k=>`<button class="b ${EST.ini===k?'on':''}" data-ini="${k}">${AMB[k].nombre.split(' ')[0]}</button>`).join('')}</div></div>
    ${leyendaT()}
    <div class="fila"><button class="b auto" id="btnAuto">Ver el recorrido otra vez</button></div></div>`;
  } else h+=htmlReto();
  h+=`<div class="hdet"><details id="dEc"><summary>Ecuaciones</summary><div class="cuerpo">${htmlEcuaciones()}</div></details>
  <details id="dSim"><summary>Simplificaciones</summary><div class="cuerpo"><ul class="no">
    <li>Un <b>módulo de ${NC} celdas</b> con una sola temperatura por celda (masa térmica concentrada); no se resuelve el calor <i>dentro</i> de la celda. No es CFD ni FEM.</li>
    <li>La carga (10 → 80 %) es un perfil didáctico: ${fN(CARGA.Ccc,1)}C hasta el ${fN(CARGA.sCC*100)} % y después baja. Los límites de temperatura y el recorte de corriente son <b>didácticos</b>, no de un fabricante.</li>
    <li>La aceleración térmica (el sobrecalentamiento descontrolado, que ocurre mucho más allá de 60 °C) <b>no se modela</b>: sólo se muestra el recorte de protección.</li>

    <li><b>Recorte de corriente</b>: el BMS deja pasar menos corriente para proteger las celdas; la carga tarda más.</li>

function htmlEcuaciones(){

/* ---- Temperatura de las celdas en el tiempo: la franja entre la más fría y la más caliente ---- */

  el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('on',b.classList.contains('t-'+t.dataset.tab)));
}
function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.40:0.43),240,450));
  let hh=base; const hud=el('hud');
  if(movil&&b.classList.contains('t-panel')) hh=Math.round(clamp(H*0.55,240,540));
  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;
    hh=Math.round(clamp(pide,240,Math.max(base,H*(movil?0.45:0.56)))); }
  const ant=parseFloat(b.style.getPropertyValue('--hojaH'))||0;
  if(Math.abs(ant-hh)>1){ b.style.setProperty('--hojaH',hh+'px'); colocaBarras(); centraEnHueco(); }
}
el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.onclick=()=>{ const b=document.body; b.classList.remove('t-hud','t-panel'); b.classList.add('t-'+t.dataset.tab); disposicion(); centraEnHueco(); });


/* ===================== 20. EL RECORRIDO GUIADO (modo por defecto) =====================
   Seis pasos que se avanzan con «Siguiente»: qué es lo que se ve, por qué se calienta, qué hace la placa, qué manda el
   alumno, cuál es la zona buena y el reto. Cada paso mueve la cámara y deja la escena viva; sólo el cuarto suelta los mandos. */
const TOUR={paso:0};
const PASOS_TOUR=[
  {t:'Una batería que se carga',vista:'todo',txt:'Estas 12 piezas son <b>celdas</b>: como pilas grandes que guardan la energía del coche. Ahora se están cargando muy rápido.'},
  {t:'Cargar rápido las calienta',vista:'celdas',txt:'Al pasar tanta corriente, cada celda <b>se calienta</b>. Su color dice cuánto:',leyenda:true},
  {t:'Una placa fría se lleva el calor',vista:'placa',txt:'Bajo las celdas hay una <b>placa de metal</b> con un tubo. Por él corre líquido frío, que recoge el calor y lo lleva al enfriador.'},
  {t:'Tú mandas el líquido',vista:'todo',txt:'Pruébalo: cambia <b>cuánto líquido pasa</b> y <b>qué tan frío entra</b>. Con poco líquido las celdas se calientan; con mucho, la bomba gasta más.',mandos:true},
  {t:'Ni muy caliente ni muy frío',vista:'celdas',txt:'De <b>15 a 35 °C</b> las celdas están bien. Sobre 40 °C la batería <b>recorta la corriente</b> para protegerse. Muy frías, el litio se pega como una costra metálica y las daña.',leyenda:true},
  {t:'Ahora, el reto',vista:'todo',txt:'Un día caluroso: termina la carga a tiempo, sin pasar de 40 °C, con las celdas parejas y gastando lo menos posible.',fin:true},
];
function tourParams(){
  if(TOUR.paso===3) return {V:EST.V,Tin:EST.Tin,T0:26,Tamb:32,Ccc:CARGA.Ccc};     // el paso de los mandos usa lo que ponga el alumno
  return {V:9,Tin:10,T0:26,Tamb:32,Ccc:CARGA.Ccc};
}
function htmlTour(){
  const P=PASOS_TOUR[TOUR.paso], n=PASOS_TOUR.length;
  let h=`<div class="tour"><div class="tn"><span>Paso ${TOUR.paso+1} de ${n}</span><span>Recorrido guiado</span></div>
    <div class="pts">${PASOS_TOUR.map((_,i)=>`<i class="${i<=TOUR.paso?'on':''}"></i>`).join('')}</div>
    <h3>${P.t}</h3><p>${P.txt}</p>`;
  if(P.leyenda) h+=leyendaT();
  if(P.mandos) h+=`<div class="hmandos">${slider('rV','Cuánto líquido pasa',EST.V,0,14,0.5,'L/min',1,'0 · parada','14','Caudal del líquido en litros por minuto')}${slider('rT','Qué tan frío entra el líquido',EST.Tin,5,35,0.5,'°C',1,'5','35','Temperatura del líquido a la entrada de la placa en grados')}</div>`;
  h+=`<div class="nav">${TOUR.paso>0?'<button class="b" data-act="tour-ant">← Atrás</button>':''}<button class="b primary" data-act="tour-sig">${P.fin?'★ Empezar el reto':'Siguiente →'}</button></div>`;
  if(!P.fin) h+=`<button class="salta" data-act="tour-salta">Saltar el recorrido y probar yo mismo</button>`;
  return h+`</div>`;
}
function tourVa(n){
  TOUR.paso=clamp(n,0,PASOS_TOUR.length-1); const P=PASOS_TOUR[TOUR.paso];
  SIM.t=0; SIM.hold=0; reiniciaCalculo(); ponVista(P.vista,0.9); pintaHUD(); pintaBarras();
}

/* ===================== 21. EL RETO =====================
   Tres fases: 1 · Calcula (cuánto sube la temperatura del líquido al pasar por la placa: ΔT = Q/(ṁ·cp)), 2 · Ajusta
   (caudal y temperatura del líquido para cargar a tiempo, sin pasar de 40 °C, con las celdas parejas y sin enfriarlas de
   más, gastando lo mínimo: el gasto sólo aparece al validar, y el óptimo es INTERIOR: poco caudal no se lleva el calor,
   mucho gasta de más en la bomba, y un líquido demasiado frío cuesta en el enfriador) y 3 · Diagnostica (¿por qué baja la
   corriente permitida?, sólo con lo que se ve en el dock) y cierra con un quiz de tres preguntas. Cuatro validaciones
   fallidas cambian el escenario. */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETO_ST={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const RETOG={phase:0,paso:'predice',iniciado:false,dxOk:false,r1:null,r2:null,dx:null,orden:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0};
const OPT={};
const claveEsc=e=>e.T0+'|'+e.Ccc+'|'+e.Tamb;
const optimoDe=e=>OPT[claveEsc(e)]||(OPT[claveEsc(e)]=optimo(e));

/* ---------- Fase 1 · Calcula cuánto se calienta el líquido ---------- */
function sorteaCaso1(){ const p=RETOG.r1&&RETOG.r1.Q; let Q; do{ Q=pickOne([420,540,660,780,900]); }while(Q===p);
  const V=pickOne([3,4,5,6,8]), mdot=V/60000*1075, cp=3300;
  RETOG.r1={Q,V,mdot:Math.round(mdot*10000)/10000,cp,ans:Q/(Math.round(mdot*10000)/10000*cp)}; }
function numeroDe(txt){ const raw=String(txt||'').trim().replace(/\s/g,'').replace(/ /g,'').replace(',','.'); return parseFloat(raw); }
function checkPredice(){
  const v=numeroDe((el('ansV')||{}).value), r=RETOG.r1, ok=r.ans;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe los grados que sube el líquido (con coma o punto decimal).'); return; }
  RETO_ST.intentos++;
  if(Math.abs(v-ok)<=Math.max(0.1,0.06*ok)){
    RETO_ST.fallos1=0; sonido.bien();
    feedback('good','¡Correcto! ✓',`ΔT = Q / (ṁ·cp) = ${fN(r.Q)} / (${fN(r.mdot,4)} · ${fN(r.cp)}) = <b>${fN(ok,2)} °C</b>. Si el caudal baja a la mitad, el líquido sube el doble de grados: por eso con poco caudal las últimas celdas reciben líquido más caliente y se calientan más que las primeras.`,true);
    paso('decide'); prepararDecide();
  } else {
    RETO_ST.fallos1++; sonido.mal(); const d=v>ok?'alto':'bajo';
    if(RETO_ST.fallos1>=3){ RETO_ST.fallos1=0; RETO_ST.resiembras++; sorteaCaso1(); feedback('bad','Tres intentos fallidos','Cambia el caso. Recuerda: el calor que se lleva el líquido es Q = ṁ · cp · ΔT; despeja ΔT.'); reiniciaCalculo(); pintaHUD(); }
    else { feedback('bad','Revisa el cálculo',`Tu resultado (${fN(v,2)} °C) está ${d}. Pasa a la forma ΔT = Q / (ṁ · cp), con ṁ en kg/s. (intentos fallidos: ${RETO_ST.fallos1}/3)`); const t=el('d_try'); if(t) t.textContent=RETO_ST.fallos1; }
  }
}

/* ---------- Fase 2 · Ajusta el caudal y la temperatura del líquido ---------- */
const NOMBRE_ESC=e=>e.T0>=34?'día muy caluroso':(e.T0>=31?'día caluroso':'tarde templada');
function prepararDecide(){
  let e; do{ e=pickOne(ESCENARIOS); }while(RETOG.r2&&ESCENARIOS.length>1&&claveEsc(e)===claveEsc(RETOG.r2.esc)&&RETO_ST.resiembras>0);
  RETOG.r2={esc:e,nombre:NOMBRE_ESC(e),V:4,Tin:28,validado:false,res:null,opt:null,intentos:0};
  reiniciaCalculo(); pintaHUD(); pintaChips();
  setTimeout(()=>{ if(RETOG.r2&&RETOG.r2.esc===e) optimoDe(e); },900);                 // el óptimo se calcula mientras el alumno lee
}
function retoParams(){
  if(RETOG.paso==='predice'&&RETOG.r1) return {V:RETOG.r1.V,Tin:15,T0:35,Tamb:38,Ccc:CARGA.Ccc};
  if(RETOG.paso==='decide'&&RETOG.r2){ const r=RETOG.r2, e=r.esc; return {V:r.V,Tin:r.Tin,T0:e.T0,Tamb:e.Tamb,Ccc:e.Ccc}; }
  if((RETOG.paso==='diag'||RETOG.paso==='quiz'||RETOG.paso==='completo')&&RETOG.dx) return Object.assign({},RETOG.dx.p);
  return null;
}
function estadoRestricciones(){
  const C=CALC; if(!C||!RETOG.r2) return null; const R=C.run, tId=C.tIdeal, lim=tId*(1+RETO.tolTiempo);
  return {pico:R.pico,okCalor:R.pico<=LIM.Tmax,grad:R.gradMax,okGrad:R.gradMax<=LIM.gradMax,min:R.minDurante,okFrio:R.tFrio<=0,t:R.t,lim,okT:R.llego&&R.t<=lim};
}
function pintaChips(){
  const c=estadoRestricciones(); if(!c) return; const set=(id,ok,html)=>{ const e=el(id); if(e){ e.className='chip '+(ok?'ok':'mal'); e.innerHTML=html; } };
  set('chipCal',c.okCalor,`Celda más caliente <b>${fN(c.pico,1)} °C</b> <small>(máx. ${LIM.Tmax})</small>`);
  set('chipGrad',c.okGrad,`Diferencia entre celdas <b>${fN(c.grad,1)} °C</b> <small>(máx. ${fN(LIM.gradMax,1)})</small>`);
  set('chipFrio',c.okFrio,`Celda más fría <b>${fN(c.min,1)} °C</b> <small>(mín. ${LIM.Tplating})</small>`);
  set('chipT',c.okT,`Tiempo de carga <b>${fN(c.t/60,1)} min</b> <small>(máx. ${fN(c.lim/60,1)})</small>`);
}
function validarDecide(){
  const r=RETOG.r2; if(!r) return;
  const R=evaluaReto(r.V,r.Tin,r.esc), opt=optimoDe(r.esc);
  r.res=R; r.opt=opt; r.validado=true; r.intentos++; RETO_ST.intentos++;
  const lim=opt.Pref*(1+RETO.tolPot), okPot=R.Pref<=lim, ok=R.ok&&okPot;
  reiniciaCalculo();
  const base=`Tu ajuste gasta <b>${fN(R.Pref,0)} W</b> en enfriar (bomba ${fN(R.Pbomba,0)} W + enfriador ${fN(R.Pchiller,0)} W); el límite era <b>${fN(lim,0)} W</b>.`;
  if(ok){
    RETO_ST.fallos2=0; sonido.bien();
    feedback('good','¡Lo conseguiste! ✓',`${base} La mejor combinación que encuentra el modelo es ${fN(opt.V,1)} L/min con el líquido entrando a ${fN(opt.Tin,1)} °C. Es un punto interior: con menos caudal las celdas pasan de 40 °C o quedan muy desparejas, y con más la bomba gasta de más; con el líquido muy frío paga el enfriador, y con él muy tibio no alcanza para el calor.`,true);
    pintaHUD(); paso('diag'); iniciaDiag();
  } else {
    RETO_ST.fallos2++; sonido.mal();
    let msg=base+' ';
    if(!R.ok){
      if(!R.c.calor) msg+=`Una celda llega a ${fN(R.pico,1)} °C (máx. ${LIM.Tmax}): sube el caudal o baja la temperatura del líquido. `;
      if(!R.c.grad) msg+=`Hay ${fN(R.gradMax,1)} °C entre la celda más caliente y la más fría (máx. ${fN(LIM.gradMax,1)}): el líquido necesita más caudal para llegar parejo a todas. `;
      if(!R.c.frio) msg+=`Alguna celda baja de ${LIM.Tplating} °C mientras carga: el líquido está demasiado frío y el litio podría pegarse como costra. `;
      if(!R.c.tiempo) msg+=`La carga se alarga a ${fN(R.t/60,1)} min porque el BMS recortó la corriente (límite ${fN(R.tId*(1+RETO.tolTiempo)/60,1)} min). `;
    } else {
      if(r.V>opt.V+1.5) msg+='Estás usando más caudal del necesario: la bomba gasta de más. ';
      else if(r.Tin<opt.Tin-3) msg+='Enfrías el líquido más de lo necesario: el enfriador gasta de más. ';
      else msg+='Estás cerca: afina el caudal y la temperatura. ';
    }
    if(RETO_ST.fallos2>=4){ RETO_ST.fallos2=0; RETO_ST.resiembras++; feedback('bad','Cuatro validaciones sin lograrlo',msg+'Cambia el escenario.',true); prepararDecide(); }
    else { feedback('bad','Todavía no',msg+`(validaciones fallidas: ${RETO_ST.fallos2}/4)`,true); pintaHUD(); pintaChips(); }
  }
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const CASOS_DX=[
  {k:'calor',p:{V:1.5,Tin:30,T0:37,Tamb:38,s0:0.45,Ccc:3.0}},
  {k:'frio',p:{V:7,Tin:6,T0:4,Tamb:2,s0:0.25,Ccc:3.0}},
  {k:'llena',p:{V:8,Tin:15,T0:30,Tamb:35,s0:0.60,Ccc:3.0}},
];
const NOMBRE_DX={calor:'Las celdas están demasiado calientes',frio:'Las celdas están demasiado frías',llena:'Es normal: la batería se está llenando'};
function iniciaDiag(){
  const p=RETOG.dx&&RETOG.dx.k; let c; do{ c=pickOne(CASOS_DX); }while(c.k===p);
  RETOG.dx=c; RETOG.dxOk=false; RETOG.orden=barajar(CASOS_DX.map(x=>x.k));
  SIM.t=0; reiniciaCalculo(); pintaHUD(); pintaDockFijo();
}
function diagnostica(k){
  if(!RETOG.dx||RETOG.dxOk) return; RETO_ST.intentos++;
  if(k===RETOG.dx.k){
    RETOG.dxOk=true; RETO_ST.fallos3=0; sonido.bien();
    feedback('good','Diagnóstico correcto ✓',explicaDx(RETOG.dx.k),true);
    reiniciaCalculo(); pintaDockFijo(); paso('quiz'); iniciaQuiz();
  } else {
    RETO_ST.fallos3++; sonido.mal();
    if(RETO_ST.fallos3>=3){ RETO_ST.fallos3=0; RETO_ST.resiembras++; feedback('bad','Tres intentos fallidos','Es otro caso: compara las temperaturas del dock con la zona buena (15 a 35 °C) y la corriente permitida con la pedida.',true); iniciaDiag(); }
    else { feedback('bad','No es ese',noEs(k)+` (intentos fallidos: ${RETO_ST.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(k){
  if(k==='calor') return `Con las celdas sobre ${LIM.Tmax} °C y poco líquido, el BMS deja pasar menos corriente de la que pide el cargador: se ve en la franja roja de la gráfica de corriente. Más caudal o un líquido más frío evitarían el recorte.`;
  if(k==='frio') return `Con las celdas por debajo de ${LIM.Tplating} °C el litio no entra bien en el grafito y puede pegarse como costra metálica. El BMS recorta la corriente al empezar, hasta que la propia carga calienta las celdas. Un líquido más tibio al arrancar acorta la espera.`;
  return `Las celdas están a buena temperatura y la corriente permitida es igual a la que pide el cargador. Al pasar del ${fN(CARGA.sCC*100)} % de carga el cargador mismo baja la corriente para no forzar las celdas: no es un problema térmico.`;
}
function noEs(k){
  if(k==='calor') return 'Las celdas no pasan de 40 °C: mira el máximo en el dock.';
  if(k==='frio') return 'Las celdas no están por debajo de 15 °C: mira el mínimo en el dock.';
  return 'La corriente permitida sí es menor que la que pide el cargador: algo la está recortando.';
}
const QUIZ=[
  {q:'¿Por qué se calienta una batería al cargarla muy rápido?',ok:'Porque una corriente grande produce calor en la resistencia interna de cada celda',mal:['Porque el cargador manda calor por el cable','Porque el líquido de la placa está caliente','Porque las celdas se hacen más grandes']},
  {q:'¿Qué pasa si una celda está muy fría mientras se carga con mucha corriente?',ok:'El litio puede pegarse como costra metálica y dañarla; por eso se recorta la corriente',mal:['Carga más rápido porque está fría','No pasa nada mientras no se congele el líquido','La celda se descarga sola']},
  {q:'Si pasas el doble de líquido por la placa, ¿cuánto más gasta la bomba?',ok:'Mucho más del doble: la potencia crece más rápido que el caudal',mal:['Lo mismo','Justo el doble','La mitad']},
];
function iniciaQuiz(){ RETOG.quizN=0; cargaPregunta(); }
function cargaPregunta(){ const Q=QUIZ[RETOG.quizN], opts=barajar([Q.ok,...Q.mal]); RETOG.quiz={q:Q.q,opts,ok:opts.indexOf(Q.ok)}; RETOG.quizResp=-1; RETOG.quizCorrecta=RETOG.quiz.ok; pintaHUD(); }
function respondeQuiz(i){
  if(RETOG.quizResp>=0) return; RETOG.quizResp=i; const ac=i===RETOG.quiz.ok; if(ac) RETO_ST.quizAcierto++;
  if(ac) sonido.bien(); else sonido.mal();
  const ult=RETOG.quizN>=QUIZ.length-1;
  let extra=''; if(RETOG.quizN===2){ const a=simula({V:5,Tin:20,T0:30,Ccc:3,Tamb:35,dt:2}), b=simula({V:10,Tin:20,T0:30,Ccc:3,Tamb:35,dt:2}); extra=` En este módulo, con 5 L/min la bomba gasta ${fN(a.Pbomba,1)} W y con 10 L/min, ${fN(b.Pbomba,1)} W.`; }
  feedback(ac?'good':'bad',ac?'Correcto ✓':'No es esa',(ac?'':'La respuesta era: <b>'+RETOG.quiz.opts[RETOG.quiz.ok]+'</b>. ')+extra+(ult?' Terminaste el laboratorio.':' Sigue con la siguiente.'),true);
  pintaHUD();
  if(ult){ RETO_ST.hecho=true; paso('completo'); }
}
function siguientePregunta(){ if(RETOG.quizN<QUIZ.length-1){ RETOG.quizN++; cargaPregunta(); } }

/* ---------- el enrutador de acciones ---------- */
function paso(p){ RETOG.paso=p; RETOG.phase=({predice:0,decide:1,diag:2,quiz:2,completo:2})[p]; if(EST.modo==='reto'){ reiniciaCalculo(); pintaHUD(); } }
function handleAction(act,btn){
  switch(act){
    case 'tour-sig': if(PASOS_TOUR[TOUR.paso].fin) setMode('reto'); else tourVa(TOUR.paso+1); break;
    case 'tour-ant': tourVa(TOUR.paso-1); break;
    case 'tour-salta': setMode('libre'); break;
    case 'check-v': checkPredice(); break;
    case 'hint-v':
      if(RETO_ST.pistas===0){ RETO_ST.pistas=1; feedback('good','Pista 1 de 2','La energía que se lleva el líquido cada segundo es Q = ṁ · cp · ΔT. Aquí te dan Q, ṁ y cp.'); }
      else if(RETO_ST.pistas===1){ RETO_ST.pistas=2; feedback('good','Pista 2 de 2','Despeja: ΔT = Q / (ṁ · cp). Usa ṁ en kg/s tal como te lo dan.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break;
    case 'validar': validarDecide(); break;
    case 'dx-calor': diagnostica('calor'); break; case 'dx-frio': diagnostica('frio'); break; case 'dx-llena': diagnostica('llena'); break;
    case 'quiz-0': respondeQuiz(0); break; case 'quiz-1': respondeQuiz(1); break; case 'quiz-2': respondeQuiz(2); break; case 'quiz-3': respondeQuiz(3); break;
    case 'quiz-sig': siguientePregunta(); break;
    case 'restart': location.reload(); break;
  }
}

/* ---------- lo que la guía enseña en cada paso del reto ---------- */
function contenidoReto(){
  const tri=(n,v,m)=>`<span class="tries">intentos fallidos: <b id="${n}">${v}</b>/${m}</span>`;
  switch(RETOG.paso){
    case 'predice': { const r=RETOG.r1;
      return {no:'Fase 1 · Reto 1',head:'Tu cálculo',title:'¿Cuánto se calienta el líquido al pasar por la placa?',
      teach:`El líquido se lleva <b>${fN(r.Q)} W</b> de calor. Pasan <b>${fN(r.V)} L/min</b>, o sea <b>${fN(r.mdot,4)} kg</b> cada segundo, y cada kg necesita <b>${fN(r.cp)} J</b> para subir 1 °C.<div class="task">¿Cuántos °C sube el líquido entre la entrada y la salida? ${tri('d_try',RETO_ST.fallos1,3)}</div>`,
      acts:`<div class="calcrow"><input id="ansV" type="text" inputmode="decimal" autocomplete="off" placeholder="¿? °C" aria-label="Grados que sube el líquido"><button class="b primary" data-act="check-v">✓ Comprobar</button></div><button class="pista" id="btnHint">¿Necesitas una pista? (máx. 2)</button>`}; }
    case 'decide': { const r=RETOG.r2; if(!r) return {no:'Fase 2 · Reto 2',head:'Tu ajuste',title:'Preparando el escenario…',teach:'',acts:''};
      const tId=tiempoIdeal(r.esc.Ccc), tl=tId*(1+RETO.tolTiempo);
      return {no:'Fase 2 · Reto 2',head:'Tu ajuste',title:'Cargar a tiempo gastando lo mínimo',
      teach:`Es un <b>${r.nombre}</b>: la batería empieza a <b>${fN(r.esc.T0)} °C</b>. Elige el líquido para cargar de 10 a 80 % en menos de <b>${fN(tl/60,1)} min</b>, sin pasar de ${LIM.Tmax} °C. El gasto se conoce al validar.<div class="why"><b>El objetivo:</b> cumplir los cuatro puntos con un gasto a menos del ${fN(RETO.tolPot*100)} % sobre el mínimo. ${tri('d_try2',RETO_ST.fallos2,4)}</div><div class="chips"><span class="chip" id="chipCal"></span><span class="chip" id="chipGrad"></span><span class="chip" id="chipFrio"></span><span class="chip" id="chipT"></span></div>`,
      acts:`${slider('r2V','Cuánto líquido pasa',r.V,0.5,14,0.5,'L/min',1,'0,5','14','Caudal del líquido en litros por minuto')}${slider('r2T','Qué tan frío entra el líquido',r.Tin,5,35,0.5,'°C',1,'5','35','Temperatura del líquido a la entrada en grados')}<button class="b primary" data-act="validar">▶ Validar el gasto</button>`}; }
    case 'diag': { const ord=RETOG.orden||CASOS_DX.map(x=>x.k);
      return {no:'Fase 3 · Diagnóstico',head:'¿Qué le pasa?',title:'La corriente permitida baja. ¿Por qué?',
      teach:`El cargador pide una corriente, pero la batería deja pasar menos. Mira las temperaturas y las corrientes del dock.<div class="task">¿Cuál es la causa? ${tri('d_try3',RETO_ST.fallos3,3)}</div>`,
      acts:ord.map(k=>`<button class="b" data-act="dx-${k}">${NOMBRE_DX[k]}</button>`).join('')}; }
    case 'quiz': { const Q=RETOG.quiz; if(!Q) return {no:'',head:'',title:'',teach:'',acts:''}; const ya=RETOG.quizResp>=0;
      return {no:'Cierre · Pregunta '+(RETOG.quizN+1)+' de '+QUIZ.length,head:'Quiz',title:Q.q,teach:'',
      acts:Q.opts.map((o,i)=>`<button class="b ${ya?(i===Q.ok?'good':(i===RETOG.quizResp?'bad':'')):''}" data-act="quiz-${i}" ${ya?'disabled':''}>${o}</button>`).join('')+(ya&&RETOG.quizN<QUIZ.length-1?'<button class="b primary" data-act="quiz-sig">Siguiente →</button>':'')}; }
    case 'completo': return {no:'Laboratorio completado',head:'✓',title:'Calculaste, ajustaste y diagnosticaste',
      teach:`Acertaste ${RETO_ST.quizAcierto} de ${QUIZ.length} en el quiz. Vuelve a <b>Probar</b>, pon la bomba en 0 y mira qué tan rápido suben las celdas sin enfriar.`,
      acts:`<button class="b primary" data-act="restart">↺ Reiniciar laboratorio</button>`};
  }
  return {no:'',head:'',title:'',teach:'',acts:''};
}

/* ===================== 22. SONIDO (sintetizado) =====================
   Un zumbido grave de la bomba cuya altura sigue al caudal (muy atenuado) y los avisos de acierto y fallo. */
const sonido=(function(){
  let ctx=null,on=true,master=null,ult=0,zum=null,zg=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      zum=ctx.createOscillator(); zg=ctx.createGain(); zum.type='sawtooth'; zum.frequency.value=60; zg.gain.value=0; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=220; zum.connect(lp); lp.connect(zg); zg.connect(master); zum.start();
    }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); ult=f; }
  return {init,
    zumbido:(V)=>{ if(!ctx||!zum) return; const t=ctx.currentTime; zum.frequency.setTargetAtTime(48+V*5,t,0.15); zg.gain.setTargetAtTime(on&&V>0?0.010:0,t,0.15); },
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }, get freq(){ return ult; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});

/* ===================== 23. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.max(Math.min(devicePixelRatio,alta?2:1.5),Math.min(devicePixelRatio,1.5)>1?1.25:1));
  const ms=alta?2048:1024; if(LUZ.sol.shadow.mapSize.x!==ms){ LUZ.sol.shadow.mapSize.set(ms,ms); if(LUZ.sol.shadow.map){ LUZ.sol.shadow.map.dispose(); LUZ.sol.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); if(typeof ponVista==='function'&&CALC) ponVista(EST.vista,0.001); centraEnHueco();
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 24. EL LAZO: UN SOLO RELOJ =====================
   El tiempo de carga avanza BASE_T·velocidad segundos por segundo de pantalla, y con ESE tiempo se mueven los colores de las
   celdas, el líquido, el calor y la corriente, y se pintan las gráficas del dock. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0, tSon=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  const dtS=EST.pausa?0:dt, dtSim=dtS*BASE_T*EST.vel;
  aplicaEscena(dtS,dtSim);
  pasaCam(dt);
  if(t-tSon>0.4){ tSon=t; sonido.zumbido(CALC&&!EST.pausa?CALC.p.V:0); }
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaGraficas(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos();
}

   Abre funcionando: la batería ya se carga a toda corriente, el líquido corre y las celdas ya muestran su gradiente de
   color; el recorrido guiado empieza en el paso 1. */
disposicion();

/* ===================== 26. GANCHOS DE PRUEBA ===================== */
/** Mide el objeto en lo VISIBLE: se pinta sin plataforma, suelo ni fondo sobre magenta puro y se toma la caja de los píxeles que no son magenta. */
function mideObjeto(){
  const ocultos=[]; PLATAFORMA.visible=false; scene.traverse(o=>{ if(o.userData&&o.userData.fondo&&o.visible){ o.visible=false; ocultos.push(o); } });
  const bg=scene.background, fog=scene.fog; scene.background=null; scene.fog=null; renderer.setClearColor(0xff00ff,1);
  renderer.render(scene,camera);
  const c=renderer.domElement, W=c.width, H=c.height, t=document.createElement('canvas'); t.width=W; t.height=H; const g=t.getContext('2d',{willReadFrequently:true}); g.drawImage(c,0,0);
  const d=g.getImageData(0,0,W,H).data; let x0=1e9,x1=-1,y0=1e9,y1=-1;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=(y*W+x)*4; if(!(d[i]>235&&d[i+1]<30&&d[i+2]>235)){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  PLATAFORMA.visible=true; for(const o of ocultos) o.visible=true; scene.background=bg; scene.fog=fog; renderer.setClearColor(0x000000,1);
  const k=W/innerWidth; return {x0:x0/k,x1:x1/k,y0:y0/k,y1:y1/k,altoPx:(y1-y0)/k,anchoPx:(x1-x0)/k,fracAlto:(y1-y0)/H,fracAncho:(x1-x0)/W,hueco:huecoLibre(),W:innerWidth,H:innerHeight};
}

  mideObjeto, objeto:mideObjeto,
};
