<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Posicionamiento del coche: GNSS más IMU — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#08161F;--panel:rgba(7,20,28,.88);--line:#21495C;--ink:#EAF4F8;
    --dim:#9BB8C4;--accent:#5BC8FF;--accent2:#A8E2FF;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cF:#5BC8FF;--cR:#FFA445;--cE:#3DDC97;--cG:#C8D6D2;--cI:#C79BFF;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#0f2733;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#173748}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#031a20;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#031a20;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#8ad8ff}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#031a20}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#5BC8FF;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f87a0;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f90a8;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#031a20}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .escs{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
  .esc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px;font-size:11.5px;line-height:1.35;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);color:#c4d3e6}
  .esc .rs{font-weight:700;font-size:11px}.esc .rs.ok{color:var(--good)}.esc .rs.mal{color:#ff9a9a}
  .esc .pista{font-size:10.5px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#09121c;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .clases{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
  .clases .b{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;padding:4px 8px;font-size:12px;line-height:1.2}
  .clases .b small{font-size:9.5px;color:var(--dim);font-weight:400}
  .clases .b.on small{color:#0b3b4a}
  .clases .b .pr{color:var(--hv);letter-spacing:.06em;font-size:10.5px}
  .clases .b.on .pr{color:#5a3a00}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(30,53,80,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,53,80,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f87a0}
  .dk-tit{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#a3bcd6;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c6da;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#0f2733;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfdcec;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  /* ---- el recorrido paso a paso y el aro que señala la pieza ---- */
  .tour{border:1px solid rgba(91,200,255,.38);background:rgba(91,200,255,.06);border-radius:12px;padding:10px 11px;display:flex;flex-direction:column;gap:7px}
  .tour .tn{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .tour .pts{display:flex;gap:5px}.tour .pts i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}.tour .pts i.on{background:var(--accent)}.tour .pts i.ok{background:var(--good)}
  .tour h3{font-size:16px;line-height:1.2}
  .tour .tx{font-size:13px;line-height:1.5;color:#d3e3ea}.tour .tx b{color:#fff}
  .tour .tb{display:flex;gap:6px}.tour .tb .b{flex:1}
  .tour .salta{align-self:flex-end;font-size:11px;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:0;font-family:inherit}
  .foco{position:fixed;z-index:14;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 3px rgba(91,200,255,.55),0 0 24px 6px rgba(91,200,255,.45);pointer-events:none;display:none;animation:pulso 1.5s ease-in-out infinite}
  @keyframes pulso{0%,100%{transform:scale(.88);opacity:.95}50%{transform:scale(1.12);opacity:.55}}
  @media (prefers-reduced-motion:reduce){.foco{animation:none}}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,18,30,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,18,30,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d3e6}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,18,30,.92);border:1px solid rgba(124,196,255,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,18,30,.84);border:1px solid rgba(124,196,255,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .chips{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .chip{font-size:11.5px;line-height:1.35;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--dim)}
  .chip b{color:var(--ink)} .chip small{font-size:10.5px;color:var(--dim)}
  .chip.ok{border-color:rgba(52,211,153,.5)} .chip.ok b{color:var(--good)} .chip.mal{border-color:rgba(244,71,94,.5)} .chip.mal b{color:#ff9aa8}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}
  body.estrecho.ancho.t-panel .panel>.dk-fig{grid-column:1;grid-row:2}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   LAB — POSICIONAMIENTO DEL COCHE: GNSS MÁS SENSOR INERCIAL (IMU) EN UN TÚNEL
   (Autotrónica · mecanica-158)

   Un coche recorre un mapa y entra a un túnel. El GNSS (el «GPS») le da su posición con un error de varios metros, pero se
   pierde sin cielo; el IMU (giroscopio y acelerómetro) y las ruedas le dicen cuánto avanzó y cuánto giró, pero con un
   pequeño error que se acumula: el sesgo del giroscopio desvía la ruta de lado con el cuadrado del tiempo. Un filtro de Kalman
   mezcla las tres fuentes, aprende los sesgos mientras hay cielo y lleva la cuenta de su duda (el círculo verde). Los sensores,
   el filtro y las métricas son un único modelo, en un bloque puro que un script de Node extrae TAL CUAL y verifica.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO='\u202F';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }



/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos marcas— y lo prueba:
   lo que se prueba es lo que corre. */
/* FISICA:INICIO */
/* ---- Posicionamiento del coche: GNSS + sensor inercial (IMU) + odometría de ruedas, en un túnel. Física pura (sin three). SI salvo donde se diga. ----
   Cadena: el coche recorre una ruta EXACTA (rectas y arcos de círculo) con un perfil de velocidad que frena antes del túnel y
   acelera al salir → el GNSS mide la posición con ruido CORRELACIONADO en el tiempo (AR(1)) cuya desviación sale del número de
   satélites (HDOP) y se pierde en el túnel; el IMU mide la velocidad de giro (giroscopio, con sesgo y ruido) y la aceleración a lo largo
   (acelerómetro, con sesgo y ruido); las ruedas dan la rapidez (odometría, con un pequeño error de escala) → un filtro de Kalman en
   «estado de error» (7 estados: posición E y N, rapidez, rumbo, sesgo del giroscopio, sesgo del acelerómetro y escala de las ruedas) navega a ciegas con el
   IMU y se corrige con el GNSS y las ruedas. Los errores del ruido, del sesgo y de la escala de la odometría son de SEMILLA FIJA. */
const DOSPI=Math.PI*2, RAD=Math.PI/180;
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const suave=t=>{ t=clamp(t,0,1); return t*t*(3-2*t); };

/* ---- Tiempo ---- */
const DT=0.05, TFIN=60, NPAS=Math.round(TFIN/DT);              // paso de todo: 20 Hz; 1201 instantes visibles de 0 a 60 s
const PRE=40, KPRE=Math.round(PRE/DT), NT=KPRE+NPAS+1;           // el coche ya lleva 40 s rodando por una recta antes del instante 0: el filtro llega «asentado». Índice k ↔ t = (k − KPRE)·DT
const tDe=k=>(k-KPRE)*DT, kDe=t=>KPRE+Math.round(t/DT);
const HZ_GNSS=[1,2,5,10];                                       // frecuencias de fijación que puede elegir el alumno (Hz)
const SIG_U=2.0;                                                // error equivalente de distancia a un satélite (1σ, m): σ_pos = SIG_U·HDOP
const T_REACQ=2.5;                                              // al salir de un túnel el receptor tarda en volver a fijar (s)
const SIG_ODO=0.08;                                             // ruido blanco de la rapidez de las ruedas (m/s)
const G0=9.80665;

/* ---- La ruta: recta, arco a la izquierda, recta, arco a la derecha, recta. Posición EXACTA a partir de la longitud recorrida s ---- */
const RADIO=100;
const SEGS=[{L:300,k:0},{L:Math.PI*RADIO,k:1/RADIO},{L:170,k:0},{L:Math.PI*RADIO,k:-1/RADIO},{L:330,k:0}];
const RUTA=(()=>{ let s=0,E=0,N=0,ps=0; const q=[];
  for(const g of SEGS){ q.push({s0:s,L:g.L,k:g.k,E0:E,N0:N,p0:ps}); const e=posSeg({s0:s,L:g.L,k:g.k,E0:E,N0:N,p0:ps},s+g.L); s+=g.L; E=e.E; N=e.N; ps=e.psi; }
  return {segs:q,L:s};
  function posSeg(S,ss){ const u=ss-S.s0;
    if(Math.abs(S.k)<1e-12) return {E:S.E0+u*Math.cos(S.p0),N:S.N0+u*Math.sin(S.p0),psi:S.p0,k:0};
    const p=S.p0+S.k*u; return {E:S.E0+(Math.sin(p)-Math.sin(S.p0))/S.k,N:S.N0-(Math.cos(p)-Math.cos(S.p0))/S.k,psi:p,k:S.k}; }
})();
function posRuta(s){ const q=RUTA.segs; if(s<0) return {E:s,N:0,psi:0,k:0};   // antes del origen, la recta se prolonga hacia atrás (el pre-rodaje)
  let i=q.length-1; while(i>0&&s<q[i].s0) i--; const S=q[i], u=s-S.s0;
  if(Math.abs(S.k)<1e-12) return {E:S.E0+u*Math.cos(S.p0),N:S.N0+u*Math.sin(S.p0),psi:S.p0,k:0};
  const p=S.p0+S.k*u; return {E:S.E0+(Math.sin(p)-Math.sin(S.p0))/S.k,N:S.N0-(Math.cos(p)-Math.cos(S.p0))/S.k,psi:p,k:S.k}; }

/* ---- Clases de IMU (datos de catálogo DIDÁCTICOS, del orden de magnitud de las hojas de datos MEMS; a verificar con la del fabricante) ----
   bg: sesgo del giroscopio (°/s) · arw: ruido de ángulo (°/√h) · ba: sesgo del acelerómetro (mg) · vrw: ruido de velocidad (m/s/√h) · sf: error de escala del giroscopio (%) */
const CLASES=[
  {id:'basico',nombre:'Básico',precio:1,bg:0.30,arw:3.0,ba:50,vrw:0.30,sf:2.0},
  {id:'consumo',nombre:'De consumo',precio:2,bg:0.08,arw:0.7,ba:20,vrw:0.10,sf:0.5},
  {id:'industrial',nombre:'Industrial',precio:3,bg:0.015,arw:0.15,ba:5,vrw:0.03,sf:0.1},
  {id:'tactico',nombre:'Táctico',precio:4,bg:0.003,arw:0.03,ba:1,vrw:0.01,sf:0.02}
];
const clasePorId=id=>CLASES.find(c=>c.id===id)||CLASES[1];
/** Pasa la ficha de una clase a unidades SI: sesgos (rad/s, m/s²) y densidades de ruido (rad/√s, m/s/√s). */
function siDe(c){ return {bg:c.bg*RAD, ba:c.ba*1e-3*G0, arw:c.arw*RAD/60, vrw:c.vrw/60, sf:c.sf/100}; }

/* ---- Los escenarios: dónde se pierde la señal y cuánto se equivocan de verdad los sensores (kB, kA, kO), que el alumno descubre al validar ----
   sIn, sOut: longitud de ruta donde empieza y termina la zona sin buena señal · tipo: 'tunel' (sin satélites) o 'canon' (pocos satélites y rebotes)
   kB, kA: el sesgo REAL del giroscopio y del acelerómetro frente al de catálogo (con signo) · kS: signo del error de escala REAL del giroscopio · kO: error de escala de las ruedas (fracción) */
const ESCENARIOS=[
  {id:'medio',nombre:'Túnel de 520 m con curvas',tipo:'tunel',sIn:380,sOut:900,nOpen:11,kMP:1,tauG:0.5,kB:1.35,kA:-0.9,kS:1,kO:0.004,psi0:0.06,semilla:1581,
   lim:{pico:6.0,lat:2.0,rec:6}},
  {id:'largo',nombre:'Túnel largo de 750 m',tipo:'tunel',sIn:300,sOut:1050,nOpen:10,kMP:1,tauG:0.5,kB:-1.45,kA:1.2,kS:-1,kO:-0.005,psi0:-0.05,semilla:2689,
   lim:{pico:8.0,lat:2.4,rec:8}},
  {id:'corto',nombre:'Túnel recto de 170 m',tipo:'tunel',sIn:614,sOut:784,nOpen:11,kMP:1,tauG:0.5,kB:1.2,kA:0.8,kS:1,kO:0.003,psi0:0.04,semilla:3797,
   lim:{pico:3.0,lat:1.6,rec:6}},
  {id:'canon',nombre:'Cañón urbano de 520 m',tipo:'canon',sIn:420,sOut:940,nOpen:11,kMP:3.0,tauG:2.0,nCan:5,pDrop:0.35,kB:-1.3,kA:1.1,kS:-1,kO:0.004,psi0:-0.07,semilla:4909,
   lim:{pico:6.5,lat:2.2,rec:6}}
];
const escPorId=id=>ESCENARIOS.find(e=>e.id===id)||ESCENARIOS[0];
const V_CRU=25, V_ZON=18.3, A_FRE=-1.2, A_ACE=0.9, K_VEL=0.8, D_FRE=135;   // 90 km/h, 66 km/h; frenada y aceleración suaves; el coche frena 135 m antes de la zona

/* ---- La verdad: el coche sigue la ruta con un perfil de velocidad que sale del objetivo de rapidez (aceleración constante en cada paso) ---- */
function verdad(esc){
  const N=NT, T={t:new Float64Array(N),s:new Float64Array(N),v:new Float64Array(N),a:new Float64Array(N),E:new Float64Array(N),Nn:new Float64Array(N),psi:new Float64Array(N),r:new Float64Array(N)};
  let s=-V_CRU*PRE, v=V_CRU;
  for(let k=0;k<N;k++){
    const objetivo=(s>=esc.sIn-D_FRE&&s<esc.sOut)?V_ZON:V_CRU;
    let a=clamp(K_VEL*(objetivo-v),A_FRE,A_ACE);
    const p=posRuta(s); T.t[k]=k*DT; T.s[k]=s; T.v[k]=v; T.a[k]=a; T.E[k]=p.E; T.Nn[k]=p.N; T.psi[k]=p.psi;
    const sN=s+v*DT+0.5*a*DT*DT; T.r[k]=(posRuta(sN).psi-p.psi)/DT;   // velocidad de giro media del paso (rad/s)
    s=sN; v=Math.max(0,v+a*DT);
  }
  return T;
}
/* instantes de entrada y salida de la zona sin buena señal */
function marcas(esc,V){ const N=NT; let kIn=N-1,kOut=N-1,a=false; for(let k=0;k<N;k++){ if(!a&&V.s[k]>=esc.sIn){ kIn=k; a=true; } if(a&&V.s[k]>=esc.sOut){ kOut=k; break; } } return {kIn,kOut,kRe:Math.min(N-1,kOut+Math.round(T_REACQ/DT))}; }

/* ---- Satélites visibles y calidad del GNSS en cada paso ---- */
const hdopDe=n=>n>=4?3.2/Math.sqrt(n-2):Infinity;
function cielo(esc,V){
  const N=NT, M=marcas(esc,V), nS=new Int8Array(N), kMP=new Float64Array(N);
  for(let k=0;k<N;k++){ const s=V.s[k]; let n=esc.nOpen, mp=1;
    if(esc.tipo==='tunel'){
      const d=esc.sIn-s;
      if(k>=M.kOut){ const u=(k-M.kOut)*DT-T_REACQ; n=u<0?0:Math.round(esc.nOpen*suave(u/3)); }
      else if(s>=esc.sIn) n=Math.round(3*(1-suave((s-esc.sIn)/10)));
      else if(d<60) n=Math.round(esc.nOpen-(esc.nOpen-3)*suave((60-d)/60));
    } else {
      const f=suave((s-esc.sIn)/40)*(1-suave((s-esc.sOut)/40));
      n=Math.round(esc.nOpen+(esc.nCan-esc.nOpen)*f); mp=1+(esc.kMP-1)*f;
    }
    nS[k]=Math.max(0,Math.round(n)); kMP[k]=mp; }
  return {nS,kMP,M};
}

/* ---- Generador pseudoaleatorio (mulberry32) y normal de Box–Muller ---- */
function prng(semilla){ let a=semilla>>>0; return ()=>{ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function normal(rnd){ let u=rnd(); if(u<1e-12) u=1e-12; const v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(DOSPI*v); }

/* ---- Lo que miden los sensores. Siempre se sortean los mismos números por paso (no dependen de la clase, ni de la frecuencia, ni del filtro) ---- */
function medidas(esc,cls){
  const V=verdad(esc), C=cielo(esc,V), I=siDe(cls), rnd=prng(esc.semilla), N=NT;
  const M={V,C,gE:new Float64Array(N),gN:new Float64Array(N),gOk:new Uint8Array(N),sigG:new Float64Array(N),hdop:new Float64Array(N),
    wz:new Float64Array(N),ax:new Float64Array(N),vo:new Float64Array(N),bgT:new Float64Array(N),baT:new Float64Array(N)};
  const phi=Math.exp(-DT/esc.tauG), sq=Math.sqrt(1-phi*phi);
  let eE=normal(rnd), eN=normal(rnd), bg=esc.kB*I.bg, ba=esc.kA*I.ba;
  for(let k=0;k<N;k++){
    const nE=normal(rnd), nN=normal(rnd), ng=normal(rnd), na=normal(rnd), no=normal(rnd), nbg=normal(rnd), nba=normal(rnd), ud=rnd();
    const hd=hdopDe(C.nS[k]), sg=SIG_U*hd*C.kMP[k];
    eE=k===0?eE:phi*eE+sq*nE; eN=k===0?eN:phi*eN+sq*nN;
    M.hdop[k]=hd; M.sigG[k]=sg;

/* ---- Álgebra 7×7 mínima ---- */
const NE=7;                                                      // estados del error: [E, N, rapidez, rumbo, sesgo del giro, sesgo del acelerómetro, escala de las ruedas]

function transicion(v,psi,h){ const F=new Float64Array(NE*NE), c=Math.cos(psi), s=Math.sin(psi);
  F[0*NE+2]=c; F[0*NE+3]=-v*s; F[1*NE+2]=s; F[1*NE+3]=v*c; F[2*NE+5]=-1; F[3*NE+4]=-1;

function prediceP(P,v,psi,h,q){ const Phi=transicion(v,psi,h), R=mul(mul(Phi,P),trans(Phi));
  R[2*NE+2]+=q.v*h; R[3*NE+3]+=q.psi*h; R[4*NE+4]+=q.bg*h; R[5*NE+5]+=q.ba*h; R[6*NE+6]+=q.ko*h; return R; }

function corrigeEsc(P,h,R){
  const Ph=new Float64Array(NE); for(let i=0;i<NE;i++){ let a=0; for(const [j,w] of h) a+=P[i*NE+j]*w; Ph[i]=a; }
  let S=R; for(const [j,w] of h) S+=w*Ph[j];

  const A=eye(); for(let i=0;i<NE;i++) for(const [j,w] of h) A[i*NE+j]-=K[i]*w;
  const Pn=mul(mul(A,P),trans(A)); for(let i=0;i<NE;i++) for(let j=0;j<NE;j++) Pn[i*NE+j]+=K[i]*R*K[j];

/* ---- El filtro: navega con el IMU, se corrige con el GNSS (a la frecuencia elegida) y con las ruedas ----

function ruidoPeriodico(semilla,periodo){

/** Junta una pieza hecha de muchas mallas en una malla por material: así una rueda con 40 piezas cuesta pocas llamadas. */
function fusiona(grupo){
  grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map();
  grupo.traverse(o=>{ if(!o.isMesh) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(), m=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);
    g.applyMatrix4(m);
    if(!g.attributes.uv){ g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2)); }
    const k=o.material; if(!por.has(k)) por.set(k,[]); por.get(k).push(g); });
  const out=new THREE.Group();
  for(const [mat,gs] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count;
      pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry();
    G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const me=new THREE.Mesh(G,mat); me.castShadow=!mat.transparent; me.receiveShadow=true; out.add(me);
  }

}
/** Una carrocería «lofteada»: anillos de superelipse que se estrechan hacia los extremos.
 *  secs: [{x, w (semianchura), y0, y1, n (exponente), tum (estrechamiento arriba, 0..1)}]. */
function lofteo(secs,seg=28){
  const pos=[],idx=[],nR=secs.length;
  for(const s of secs){
    const yc=(s.y0+s.y1)/2, hh=Math.max(1e-3,(s.y1-s.y0)/2), ex=2/(s.n||3);
    for(let k=0;k<seg;k++){
      const th=k/seg*DOSPI, c=Math.cos(th), sn=Math.sin(th);
      const yy=yc+hh*Math.sign(sn)*Math.pow(Math.abs(sn),ex), f=(yy-s.y0)/(2*hh);
      const zz=Math.max(1e-3,s.w)*(1-(s.tum||0)*f*f)*Math.sign(c)*Math.pow(Math.abs(c),ex);
      pos.push(s.x,yy,zz);
    }
  }
  const cI=pos.length/3; pos.push(secs[0].x,(secs[0].y0+secs[0].y1)/2,0); pos.push(secs[nR-1].x,(secs[nR-1].y0+secs[nR-1].y1)/2,0);
  for(let i=0;i<nR-1;i++) for(let k=0;k<seg;k++){
    const a=i*seg+k, b=i*seg+(k+1)%seg, c2=(i+1)*seg+k, d=(i+1)*seg+(k+1)%seg;
    idx.push(a,c2,b, b,c2,d);
  }
  for(let k=0;k<seg;k++){ idx.push(cI,k,(k+1)%seg); idx.push(cI+1,(nR-1)*seg+(k+1)%seg,(nR-1)*seg+k); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx);
  // el sentido de las caras: si el volumen con signo sale negativo, se invierten
  let vol=0; for(let i=0;i<idx.length;i+=3){ const a=idx[i]*3,b=idx[i+1]*3,c3=idx[i+2]*3;
    vol+=pos[a]*(pos[b+1]*pos[c3+2]-pos[b+2]*pos[c3+1])-pos[a+1]*(pos[b]*pos[c3+2]-pos[b+2]*pos[c3])+pos[a+2]*(pos[b]*pos[c3+1]-pos[b+1]*pos[c3]); }
  if(vol<0) for(let i=0;i<idx.length;i+=3){ const t=idx[i+1]; idx[i+1]=idx[i+2]; idx[i+2]=t; }
  g.setIndex(idx); g.computeVertexNormals(); g.computeBoundingSphere();
  return g;
}
/** Interpola de forma suave una lista de puntos [x,valor]. */
function perfil1D(pts){ return x=>{ if(x<=pts[0][0]) return pts[0][1]; for(let i=1;i<pts.length;i++) if(x<=pts[i][0]){ const t=(x-pts[i-1][0])/(pts[i][0]-pts[i-1][0]); return mezcla(pts[i-1][1],pts[i][1],suave(t)); } return pts[pts.length-1][1]; }; }

const AW_TUNEL=0.36, AH_TUNEL=0.34;

function seccionArco(p,th,aw,ah){ const nx=-Math.sin(p.psi), ny=Math.cos(p.psi), lat=Math.cos(th)*aw/SC; return [mx(p.E+nx*lat),Math.sin(th)*ah+ALTO_CAL,mz(p.N+ny*lat)]; }

  for(const o of [ZONA.cuerpo,ZONA.lineas,ZONA.edif,...ZONA.portales]) if(o){ ZONA.grupo.remove(o); if(o.geometry) o.geometry.dispose(); }
  ZONA.cuerpo=ZONA.lineas=ZONA.edif=null; ZONA.portales=[];

function construyeZona(esc){
  if(ZONA.id===esc.id) return; ZONA.id=esc.id; liberaZona();
  const sA=esc.sIn, sB=esc.sOut;
  if(esc.tipo==='tunel'){
    const n=Math.max(4,Math.ceil((sB-sA)/4)), m=16, pos=[], idx=[];
    for(let i=0;i<=n;i++){ const p=posRuta(sA+(sB-sA)*i/n); for(let j=0;j<=m;j++) pos.push(...seccionArco(p,Math.PI*j/m,AW_TUNEL,AH_TUNEL)); }
    for(let i=0;i<n;i++) for(let j=0;j<m;j++){ const a=i*(m+1)+j, b=a+1, c=a+m+1, d=c+1; idx.push(a,b,c, b,d,c); }
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals(); g.computeBoundingSphere();
    const cu=new THREE.Mesh(g,M_TUNEL); cu.renderOrder=3; cu.userData.clave='tunel'; ZONA.grupo.add(cu); ZONA.cuerpo=cu;
    // aristas longitudinales: las dos del suelo y la clave del arco, más cinco costillas
    const lp=[]; const P=(i,j)=>{ const o=(i*(m+1)+j)*3; return [pos[o],pos[o+1],pos[o+2]]; };
    for(const j of [0,m/2,m]) for(let i=0;i<n;i++) lp.push(...P(i,j),...P(i+1,j));
    for(let q=0;q<=6;q++){ const i=Math.round(n*q/6); for(let j=0;j<m;j++) lp.push(...P(i,j),...P(i,j+1)); }
    const lg=new THREE.BufferGeometry(); lg.setAttribute('position',new THREE.Float32BufferAttribute(lp,3));
    const li=new THREE.LineSegments(lg,M_TUNEL_L); li.renderOrder=4; li.raycast=()=>{}; ZONA.grupo.add(li); ZONA.lineas=li;
    // los dos portales: un arco luminoso en cada boca
    for(const s of [sA,sB]){ const p=posRuta(s), pts=[]; for(let j=0;j<=24;j++) pts.push(V3(...seccionArco(p,Math.PI*j/24,AW_TUNEL,AH_TUNEL)));
      const t=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),48,0.016,6,false),M_PORTAL); t.userData.clave='portal'; t.castShadow=false; ZONA.grupo.add(t); ZONA.portales.push(t); }
  } else {
    // cañón urbano: edificios a los dos lados de la ruta, altos y juntos
    const filas=[]; for(let s=sA-10;s<=sB+10;s+=26){ for(const lado of [-1,1]){ const h=((Math.floor(s)*7+lado*13)%9+9)%9; filas.push({s,lado,h}); } }
    const im=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),M_EDIF,filas.length), m4=new THREE.Matrix4(), col=new THREE.Color();
    filas.forEach((f,i)=>{ const p=posRuta(f.s), nx=-Math.sin(p.psi), ny=Math.cos(p.psi), off=(0.36+0.10*((i*5)%3))/SC*f.lado + f.lado*0, alt=0.55+0.07*f.h, anc=0.32+0.04*((i*3)%4), prof=0.42;
      m4.compose(V3(mx(p.E+nx*off*1.0),alt/2,mz(p.N+ny*off*1.0)),new THREE.Quaternion().setFromAxisAngle(V3(0,1,0),p.psi),V3(prof,alt,anc)); im.setMatrixAt(i,m4);
      col.setHSL(0.56+0.03*(i%3),0.25,0.20+0.06*((i*7)%5)/5); im.setColorAt(i,col); });
    im.castShadow=true; im.receiveShadow=true; im.frustumCulled=false; im.userData.clave='canon'; ZONA.grupo.add(im); ZONA.edif=im;
  }
}

/* ===================== 7. LOS COCHES =====================

const POS_RUEDA=[[1.10,-0.775],[1.10,0.775],[-1.50,-0.775],[-1.50,0.775]];

    const x=xc-hl*Math.cos(Math.PI*i/N), u=(x-xc)/hl, ab=Math.pow(Math.abs(u),4.2);
    let w=0.90*Math.pow(Math.max(0.0004,1-ab),1/4.2);

  }

  for(let i=0;i<=cabM;i++){
    const t=i/cabM, x=mezcla(x0,x1,t), env=Math.pow(Math.sin(Math.PI*Math.pow(t,0.85)),0.55), base=yt(x)-0.03, techo=Math.max(base+0.03,mezcla(yt(x),1.43,env));
    cab.push({x,w:Math.max(0.03,0.80*Math.pow(env,0.35)),y0:base,y1:techo,n:3.0,tum:0.30});
  }

/* ===================== 8. LO QUE CREE EL COCHE: SU POSICIÓN, SU RUTA Y SU DUDA =====================
   Verde: la posición estimada (una caja del tamaño del coche con una punta que marca el rumbo que cree), la ruta que ha creído

/* la elipse del 95 %: una cinta delgada que se reconstruye cada cuadro con los semiejes y el giro que salen de la covarianza */
const NEL=72, ELI={g:new THREE.BufferGeometry(),pos:new Float32Array((NEL+1)*2*3)};
{
  const ix=[]; for(let i=0;i<NEL;i++){ const a=i*2,b=i*2+1,c=i*2+2,d=i*2+3; ix.push(a,b,c,b,d,c); }
  ELI.g.setAttribute('position',new THREE.BufferAttribute(ELI.pos,3)); ELI.g.setIndex(ix);
  ELI.mesh=new THREE.Mesh(ELI.g,new THREE.MeshBasicMaterial({color:'#3DDC97',toneMapped:false,side:THREE.DoubleSide,depthWrite:false,transparent:true,opacity:0.95,polygonOffset:true,polygonOffsetFactor:-8,polygonOffsetUnits:-8}));
  ELI.mesh.frustumCulled=false; ELI.mesh.renderOrder=9; ELI.mesh.raycast=()=>{}; ELI.mesh.userData.clave='elipse'; MUNDO.add(ELI.mesh);
  ELI.fill=new THREE.Mesh(new THREE.CircleGeometry(1,64).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:'#3DDC97',transparent:true,opacity:0.20,depthWrite:false,toneMapped:false,polygonOffset:true,polygonOffsetFactor:-7,polygonOffsetUnits:-7}));
  ELI.fill.renderOrder=8; ELI.fill.raycast=()=>{}; ELI.fill.userData.clave='elipse'; MUNDO.add(ELI.fill);
}
const Q95=Math.sqrt(5.991464547107979);            // semieje del 95 % para 2 grados de libertad: √χ²(2; 0,95)
const VIS_MIN=0.05;                                 // la elipse nunca se dibuja menor que esto (unidades, ≈ 2,5 m): sólo para que se vea

    for(let q=0;q<2;q++){ const k=q?1:-1, ra=a+k*t, rb=b+k*t, ue=ra*c*c0-rb*s*s0, un=ra*c*s0+rb*s*c0, o=i*6+q*3;

/* la ruta que ha creído: una cinta verde que crece con el reloj (se rehace cuando cambia el modelo) */
const NTR=620, TR={pos:new Float32Array(NTR*2*3),g:new THREE.BufferGeometry(),n:0};

  const idx=[]; for(let i=0;i<NTR-1;i++){ const k=i*2; idx.push(k,k+1,k+2, k+1,k+3,k+2); }
  TR.g.setAttribute('position',new THREE.BufferAttribute(TR.pos,3)); TR.g.setIndex(idx); TR.g.setDrawRange(0,0);
  TR.mesh=new THREE.Mesh(TR.g,new THREE.MeshBasicMaterial({color:'#3DDC97',toneMapped:false,transparent:true,opacity:0.92,depthWrite:false,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-5,polygonOffsetUnits:-5}));
  TR.mesh.frustumCulled=false; TR.mesh.renderOrder=7; TR.mesh.raycast=()=>{}; TR.mesh.userData.clave='ruta'; MUNDO.add(TR.mesh);
}
function rehazRuta(T,k0,k1,paso){

    const x=mx(T.E[k]), z=mz(T.Nn[k]); const o=n*6; TR.pos[o]=x-nx; TR.pos[o+1]=0.034; TR.pos[o+2]=z+nn; TR.pos[o+3]=x+nx; TR.pos[o+4]=0.034; TR.pos[o+5]=z-nn; n++; }

/* las lecturas del GNSS: las últimas 3 s (naranja) y la última fijación, que se queda donde el GNSS la dejó */
const NFIX=32, IM_FIX=new THREE.InstancedMesh(new THREE.SphereGeometry(1,10,8),new THREE.MeshBasicMaterial({color:'#ffffff',toneMapped:false}),NFIX);
IM_FIX.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(NFIX*3).fill(1),3); IM_FIX.frustumCulled=false; IM_FIX.castShadow=false; IM_FIX.renderOrder=6; IM_FIX.userData.clave='lecturas'; MUNDO.add(IM_FIX);

const PIN=new THREE.Group(); MUNDO.add(PIN);

/** Cajas (en metros del mapa) de una porción de la ruta, para encuadrar la cámara. */

/* ===================== 9. EL ESTADO Y EL RELOJ =====================
   Un solo cálculo (CALC) alimenta la escena, el dock y las cifras: se recalcula cuando cambia un mando. El reloj SIM.t es el tiempo
   visible del escenario (s, de 0 a TFIN; el coche ya llevaba 40 s rodando) y avanza dt·velocidad; mueve al coche, las lecturas, la
   estimación, el círculo de duda y el cursor de todas las gráficas. Los modos: «Recorrido» (paso a paso), «Probar» (mandos libres)
   y «Reto». */
const EST={modo:'tour',esc:'medio',cls:'consumo',hz:5,u:0,odo:true,vel:1,pausa:REDUCIDO,autoRunning:false,vista:'todo',rot:false};
const SIM={t:0,calc:null,ver:0,e:null};
let CALC=null;
const BASE={};                                      // por (escenario, clase de IMU): la verdad y las medidas (no dependen de la frecuencia ni de la confianza)
function baseDe(id,cls){ const key=id+'|'+cls; if(!BASE[key]){ const esc=escPorId(id), c=clasePorId(cls); BASE[key]={esc,cls:c,M:medidas(esc,c)}; } return BASE[key]; }
/** Lo que corre ahora: en «Probar», lo que digan los mandos; en el recorrido y el reto, lo que pida el paso. */
function paramsActuales(){
  if(EST.modo==='tour'){ const p=tourParams(); if(p) return p; }
  if(EST.modo==='reto'){ const p=guiaParams(); if(p) return p; }
  return {esc:EST.esc,cls:EST.cls,hz:EST.hz,u:EST.u,odo:EST.odo};
}
function calcula(p){
  const B=baseDe(p.esc,p.cls), T=filtra(B.esc,B.cls,{hz:p.hz,u:p.u,odo:p.odo},B.M), m=metricas(B.esc,T,B.M);
  return {p,B,esc:B.esc,cls:B.cls,M:B.M,V:B.M.V,C:B.M.C,T,m,c:cumple(m,B.esc)};
}
function reiniciaCalculo(){
  CALC=calcula(paramsActuales()); SIM.calc=CALC; SIM.ver++;
  construyeZona(CALC.esc); rehazRuta(CALC.T,KPRE,NT-1,2);
  SIM.t=Math.min(SIM.t,TFIN-DT*2-0.001); if(SIM.t<0) SIM.t=0;
  if(typeof pintaDockFijo==='function') pintaDockFijo();
}
const lerpA=(a,k,f)=>{ const k1=Math.min(k+1,a.length-1); return a[k]+(a[k1]-a[k])*f; };
/* ---- el estado del sistema en el instante t: la verdad es la de la ruta; la estimación, interpolada entre pasos del filtro ---- */
function estadoEn(t){
  const C=CALC; if(!C) return null; const T=C.T, V=C.V, M=C.M, kf=KPRE+clamp(t,0,TFIN)/DT, k=clamp(Math.floor(kf),0,NT-2), f=clamp(kf-k,0,1);

  const a=lerpA(T.pEE,k,f), b=lerpA(T.pEN,k,f), d=lerpA(T.pNN,k,f), tr=(a+d)/2, dis=Math.sqrt(Math.max(0,((a-d)/2)**2+b*b));
  const l1=Math.max(1e-6,tr+dis), l2=Math.max(1e-6,tr-dis), th=0.5*Math.atan2(2*b,a-d);
  const dE=eE-E, dN=eN-N, c=Math.cos(psi), s=Math.sin(psi);
  const nS=C.C.nS[k], disp=nS>=4;
  return {k,t,E,N,psi,s:lerpA(V.s,k,f),v:lerpA(V.v,k,f),a:V.a[k],eE,eN,ePsi,err:Math.hypot(dE,dN),eAl:dE*c+dN*s,eLa:-dE*s+dN*c,
    s1:Math.sqrt(l1),s2:Math.sqrt(l2),th,duda:Q95*Math.sqrt(l1),nS,disp,hdop:M.hdop[k],
    bg:lerpA(T.bg,k,f),bgT:lerpA(M.bgT,k,f),sbg:Math.sqrt(Math.max(0,lerpA(T.pbg,k,f))),kG:T.kG[k],edad:T.edadFix[k],
    fixE:T.fixE[k],fixN:T.fixN[k]};
}

/* ===================== 10. LO QUE SE VE ===================== */
const _m4=new THREE.Matrix4(), _q0=new THREE.Quaternion(), _col=new THREE.Color(), _p=new THREE.Vector3(), _s=new THREE.Vector3();
const ocultaVerdad=()=>EST.modo==='reto'&&GUIA.paso==='ajusta'&&!(GUIA.r2&&GUIA.r2.validado);   // el error real, mientras se ajusta
let pulsoPin=0;
/* los satélites quedan fijos en el cielo; sólo cambia cuáles se ven */
for(let i=0;i<NSAT;i++){ _m4.makeTranslation(SAT_DEF[i].x,SAT_DEF[i].y,SAT_DEF[i].z); IM_SAT.setMatrixAt(i,_m4); }
IM_SAT.instanceMatrix.needsUpdate=true;
const C_SAT_ON=new THREE.Color('#9dfbc4'), C_SAT_OFF=new THREE.Color('#2b3e4a');
function aplicaEscena(dtS,dtSim,dtR){
  if(dtR===undefined) dtR=dtS;                       // dtR: tiempo real del cuadro; suaviza lo visual aunque el reloj del escenario esté en pausa
  const C=CALC; if(!C) return;
  const Tc=TFIN-DT*2; SIM.t+=dtSim; if(SIM.t>=Tc) SIM.t=SIM.t-Tc;
  const e=estadoEn(SIM.t); if(!e) return; SIM.e=e;

  // ---- la estimación del filtro ----

  pintaElipse(mx(e.eE),mz(e.eN),Q95*e.s1*SC,Q95*e.s2*SC,e.th);
  const nv=Math.max(0,Math.min(TR.n-1,Math.floor((e.k-KPRE)/2))); TR.g.setDrawRange(0,nv*6);
  // ---- las lecturas del GNSS que el filtro usó (3 s) y la última fijación ----
  let nf=0; const k0=e.k;
  for(let j=k0;j>=Math.max(0,k0-60)&&nf<NFIX;j--){ if(!T.usa[j]) continue; const edad=(k0-j)*DT, fr=1-edad/3;
    const r=0.034*(0.55+0.45*fr); _m4.compose(_p.set(mx(M.gE[j]),0.05,mz(M.gN[j])),_q0,_s.set(r,r,r)); IM_FIX.setMatrixAt(nf,_m4);
    _col.copy(C_GPS).multiplyScalar(0.35+0.9*fr*fr); IM_FIX.setColorAt(nf,_col); nf++; }
  _m4.compose(_p.set(0,-5,0),_q0,_s.set(0.0001,0.0001,0.0001)); for(let i=nf;i<NFIX;i++) IM_FIX.setMatrixAt(i,_m4);
  IM_FIX.count=NFIX; IM_FIX.instanceMatrix.needsUpdate=true; if(IM_FIX.instanceColor) IM_FIX.instanceColor.needsUpdate=true;
  PIN.position.set(mx(e.fixE),0,mz(e.fixN));
  const perdido=e.edad>1.5; pulsoPin+=dtR*(perdido?5.5:2.2);
  PIN.userData.aro.scale.setScalar(perdido?1+0.35*Math.abs(Math.sin(pulsoPin)):1);
  PIN.userData.aro.material.color.set(perdido?'#ff7a45':'#FFA445');

    if(ve){ const o=ri*6; RAYOS.pos[o]=mx(e.E); RAYOS.pos[o+1]=0.10; RAYOS.pos[o+2]=mz(e.N); RAYOS.pos[o+3]=SAT_DEF[i].x; RAYOS.pos[o+4]=SAT_DEF[i].y; RAYOS.pos[o+5]=SAT_DEF[i].z; ri++; } }
  RAYOS.g.setDrawRange(0,ri*2); RAYOS.g.attributes.position.needsUpdate=true; IM_SAT.instanceMatrix.needsUpdate=true; if(IM_SAT.instanceColor) IM_SAT.instanceColor.needsUpdate=true;
  RAYOS.mat.opacity=0.55+0.03*nS;
}

/* ===================== 11. EL HUD (izquierda) ===================== */

const txtU=u=>Math.abs(u)<0.06?'equilibrado':(u>0?'más al IMU ×':'más al GPS ×')+fN(Math.pow(3,Math.abs(u)),1);
function mandosHTML(p,ids,presupuesto){

function pintaHUD(){

  else h+=`</div>`;

  if(EST.modo==='tour') h+=htmlTour();
  else if(EST.modo==='probar'){
    h+=`<div class="hmandos">
    <div class="cg"><div class="cl">Situación</div><div class="clases" id="segEsc">${Object.keys(NOMBRE_ESC).map(k=>`<button class="b ${EST.esc===k?'on':''}" data-esc="${k}"><span>${NOMBRE_ESC[k]}</span></button>`).join('')}</div></div>
    ${mandosHTML(EST,['rU'],0)}
    <div class="fila"><button class="b sm ${EST.odo?'on':''}" id="btnOdo" title="Las ruedas dan la rapidez (odómetro)">Ruedas: ${EST.odo?'sí':'no'}</button><button class="b auto sm" id="btnAuto">Repetir el recorrido</button></div></div>`;
  } else h+=htmlGuia();
  const m=CALC?CALC.m:null;
  h+=`<div class="hdet"><details id="dEc"><summary>Ecuaciones</summary><div class="cuerpo">
    <div class="formula">lado ≈ ½ · v · b · t²  (sesgo b del giroscopio, rapidez v)</div>
    <div class="fl">Un sesgo constante <b>b</b> en el giroscopio hace que el rumbo creído se aparte b·t; al avanzar a v, la posición se aparta de lado ½·v·b·t². A lo largo, un sesgo <b>a</b> del acelerómetro da ½·a·t². Por eso el error crece con el <b>cuadrado del tiempo</b> sin GPS.</div>
    <div class="formula">x̂ = x⁻ + K·(z − x⁻) · P = (I − K·H)·P⁻</div>
    <div class="fl">El filtro de Kalman lleva 7 números: posición Este y Norte, rapidez, rumbo, sesgo del giroscopio, sesgo del acelerómetro y escala de las ruedas. Predice con el IMU (P⁻ = Φ·P·Φᵀ + Q, que <b>crece</b> sin lecturas) y se corrige con el GPS (R = (σ<sub>u</sub>·HDOP)², σ<sub>u</sub> = ${fN(SIG_U,1)} m) y con las ruedas.</div>
    <div class="fl">Honestidad: NEES = eᵀ·P⁻¹·e debe valer 2 en promedio. ${m?`Aquí: NEES ${fN(m.nees,1)}.`:''}</div>
  </div></details>
  <details id="dSim"><summary>Simplificaciones</summary><div class="cuerpo"><ul class="no">
    <li>Ruta, sensores y túneles son <b>sintéticos</b> (semilla fija). El GPS tiene error correlacionado en el tiempo; los satélites visibles y su geometría (HDOP) salen de una fórmula didáctica, no de efemérides.</li>
    <li>El mapa <b>no está a escala</b>: la carretera se dibuja ×2 y el coche ×6 para leerse; el círculo de duda sí está a escala (95 %, con un mínimo visible).</li>
    <li>Un solo filtro de 7 estados en el plano; sin altura, sin pendiente, sin magnetómetro, sin mapas (map-matching) ni más constelaciones.</li>
    <li>Las clases de IMU son <b>ordenes de magnitud</b> de hojas de datos MEMS, a verificar con el fabricante. No es un sistema de producción ni una homologación.</li>
  </ul><div class="src">Groves, <i>Principles of GNSS, Inertial, and Multisensor Integrated Navigation Systems</i> (a verificar edición) · Kalman (1960) · IEEE Std 952 (giroscopios, a verificar).</div></div></details></div>`;
  H.innerHTML=h; H.classList.toggle('guia',EST.modo!=='probar'); enlazaHUD(); ajustaHoja();
}

/* ===================== 12. EL DOCK (derecha): cifras y gráficas DOM ===================== */
const FUENTE="'Outfit',system-ui,sans-serif";
function lienzo(id){ const box=el(id), c=box.querySelector('canvas'); return {box,c,ctx:c.getContext('2d'),w:0,h:0,dpr:1}; }
function abre(L){ const r=L.box.getBoundingClientRect(), dpr=Math.min(3,window.devicePixelRatio||1);
  const w=Math.max(20,Math.round(r.width)), h=Math.max(20,Math.round(r.height));
  if(L.w!==w||L.h!==h||L.dpr!==dpr){ L.c.width=Math.round(w*dpr); L.c.height=Math.round(h*dpr); L.w=w; L.h=h; L.dpr=dpr; }
  const x=L.ctx; x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h); return x; }
function txt(x,t,px,py,col,size,align,peso){ x.fillStyle=col; x.font=(peso||'600')+' '+(size||11)+'px '+FUENTE; x.textAlign=align||'left'; x.textBaseline='alphabetic'; x.fillText(t,px,py); }
function raya(x,x1,y1,x2,y2,col,w,dash){ x.strokeStyle=col; x.lineWidth=w||1; x.setLineDash(dash||[]); x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke(); x.setLineDash([]); }
const LFU=lienzo('gFu'), LSO=lienzo('gTr'), LCO=lienzo('gFr'), LVE=lienzo('gSp');
const sinDatos=(x,Wd,Hd,t)=>{ txt(x,t||'—',Wd/2,Hd/2+4,'#7f9aa8',t?11:14,'center','500'); };
const COL={gps:'#FFA445',est:'#3DDC97',ver:'#F2F5F7',zona:'rgba(200,215,225,0.13)',banda:'rgba(61,220,151,0.20)',giro:'#C79BFF',largo:'#5BC8FF',lado:'#FFA445'};
const GRID='rgba(160,200,220,0.10)', EJE='#3f6a80', TXT='#8eb3c5';
const ejeT=(X0,X1)=>t=>X0+t/TFIN*(X1-X0);
function cursor(x,X,Y0,Y1){ const px=X(SIM.t); raya(x,px,Y0,px,Y1,'rgba(255,255,255,0.85)',1.2); }
/** La franja gris: de la entrada a la salida de la zona sin buena señal, más lo que tarda el receptor en volver. */
function bandaZona(x,X,Y0,Y1){ const C=CALC; if(!C) return; const M=C.C.M, a=tDe(M.kIn), b=tDe(M.kRe); x.fillStyle=COL.zona; x.fillRect(X(Math.max(0,a)),Y0,X(Math.min(TFIN,b))-X(Math.max(0,a)),Y1-Y0); }
function ejeY(x,X0,X1,Y,vals,fmt){ x.__uy=undefined; for(const v of vals){ raya(x,X0,Y(v),X1,Y(v),GRID); if(Math.abs(Y(v)-(x.__uy===undefined?-99:x.__uy))>=11){ x.__uy=Y(v); txt(x,fmt?fmt(v):String(v),X0-4,Y(v)+3,TXT,8.5,'right','500'); } } }
function ejeX(x,X,Hd,paso){ for(let t=0;t<=TFIN;t+=paso){ raya(x,X(t),Hd-14,X(t),Hd-11,EJE); txt(x,String(t),X(t),Hd-3,TXT,8.5,'center','500'); } }
const kV=i=>KPRE+i;                                  // índice visible → índice del arreglo
function lineaSerie(x,X,Y,arr,col,w,dash,paso){ x.setLineDash(dash||[]); x.strokeStyle=col; x.lineWidth=w; x.beginPath(); const p=paso||2; for(let i=0;i<=NPAS;i+=p){ const px=X(i*DT), py=Y(arr[kV(i)]); i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke(); x.setLineDash([]); }
const bonito=(v,c)=>{ for(const q of c) if(v<=q) return q; return c[c.length-1]; };

/* ---- error de posición: la duda del filtro (95 %) como banda y, si se puede, el error real ---- */
function dudaSerie(C,i){ const k=kV(i), a=C.T.pEE[k], d=C.T.pNN[k], b=C.T.pEN[k], tr=(a+d)/2, dis=Math.sqrt(Math.max(0,((a-d)/2)**2+b*b)); return Q95*Math.sqrt(Math.max(1e-6,tr+dis)); }
function pintaErrorPos(){
  const x=abre(LFU), Wd=LFU.w, Hd=LFU.h, C=CALC; if(!C) return;
  const X0=30, X1=Wd-8, Y0=8, Y1=Hd-16, X=ejeT(X0,X1), oc=ocultaVerdad();
  let mx_=2; for(let i=0;i<=NPAS;i+=4){ mx_=Math.max(mx_,dudaSerie(C,i)); if(!oc) mx_=Math.max(mx_,C.m.err[kV(i)]); }
  const top=bonito(mx_*1.08,[4,8,15,25,40,60,100]); const Y=v=>Y1-v/top*(Y1-Y0);
  bandaZona(x,X,Y0,Y1);
  const vals=[]; const stp=top<=8?2:(top<=25?5:(top<=60?10:25)); for(let v=0;v<=top+1e-9;v+=stp) vals.push(v); ejeY(x,X0,X1,Y,vals,v=>String(v)); ejeX(x,X,Hd,10);
  txt(x,'m',X0+4,Y0+8,TXT,8.5,'left','600'); txt(x,'s',X1,Hd-3,TXT,8.5,'right','600');
  x.fillStyle=COL.banda; x.beginPath(); for(let i=0;i<=NPAS;i+=2){ const px=X(i*DT), py=Y(dudaSerie(C,i)); i?x.lineTo(px,py):x.moveTo(px,py); } x.lineTo(X(NPAS*DT),Y(0)); x.lineTo(X(0),Y(0)); x.closePath(); x.fill();
  x.strokeStyle=COL.est; x.lineWidth=1.4; x.beginPath(); for(let i=0;i<=NPAS;i+=2){ const px=X(i*DT), py=Y(dudaSerie(C,i)); i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke();
  if(!oc) lineaSerie(x,X,Y,C.m.err,COL.ver,1.6,null);
  else txt(x,'el error real se muestra al validar',(X0+X1)/2,Y0+22,'#7f9aa8',10.5,'center','500');
  cursor(x,X,Y0,Y1); el('t_fu').textContent='t = '+fN(SIM.t,0)+' s';
}
function pintaLeyError(){
  el('leyFu').innerHTML=`<span class="lg"><i class="bl" style="--c:rgba(61,220,151,.55)"></i>duda del filtro (95 %)</span><span class="lg"><i style="--c:${COL.ver}"></i>${ocultaVerdad()?'error real (al validar)':'error real'}</span><span class="lg"><i class="bl" style="--c:rgba(200,215,225,.35)"></i>sin buena señal</span>`;
}
/* ---- satélites que se ven: el GPS necesita al menos 4 ---- */
function pintaSats(){
  const x=abre(LSO), Wd=LSO.w, Hd=LSO.h, C=CALC; if(!C) return;
  const X0=24, X1=Wd-6, Y0=6, Y1=Hd-14, X=ejeT(X0,X1), Y=v=>Y1-v/12*(Y1-Y0);
  bandaZona(x,X,Y0,Y1); ejeY(x,X0,X1,Y,[0,4,8,12],v=>String(v));
  raya(x,X0,Y(4),X1,Y(4),'rgba(255,170,90,0.55)',1,[3,3]);
  x.fillStyle='rgba(94,242,168,0.22)'; x.beginPath(); x.moveTo(X(0),Y(0)); for(let i=0;i<=NPAS;i+=2){ x.lineTo(X(i*DT),Y(C.C.nS[kV(i)])); } x.lineTo(X(NPAS*DT),Y(0)); x.closePath(); x.fill();
  x.strokeStyle='#5ef2a8'; x.lineWidth=1.6; x.beginPath(); for(let i=0;i<=NPAS;i+=2){ const px=X(i*DT), py=Y(C.C.nS[kV(i)]); i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke();
  cursor(x,X,Y0,Y1); txt(x,'mín. 4',X1-2,Y(4)-3,'#d8a070',8.5,'right','600');
  const e=SIM.e; el('t_pw').textContent=e?(e.nS>=4?fN(e.nS,0)+' · HDOP '+fN(e.hdop,1):fN(e.nS,0)+' · sin fijar'):'';
}
/* ---- sesgo del giroscopio (°/h): lo que cree el filtro y, si se puede, el real ---- */
function pintaSesgo(){
  const x=abre(LCO), Wd=LCO.w, Hd=LCO.h, C=CALC, e=SIM.e; if(!C||!e) return;
  const X0=30, X1=Wd-6, Y0=6, Y1=Hd-14, X=ejeT(X0,X1), T=C.T, M=C.M, oc=ocultaVerdad(), cv_=3600/RAD;
  let lo=1e9,hi=-1e9; for(let i=0;i<=NPAS;i+=6){ const k=kV(i), b=T.bg[k]*cv_, sg=2*Math.sqrt(T.pbg[k])*cv_; lo=Math.min(lo,b-sg); hi=Math.max(hi,b+sg); if(!oc){ lo=Math.min(lo,M.bgT[k]*cv_); hi=Math.max(hi,M.bgT[k]*cv_); } }
  lo=Math.min(lo,0); hi=Math.max(hi,0); const sp=hi-lo||1, paso=bonito(sp/3,[1,2,5,10,20,50,100,200,500,1000,2000]); lo=Math.floor(lo/paso)*paso; hi=Math.ceil(hi/paso)*paso; const Y=v=>Y1-(v-lo)/(hi-lo)*(Y1-Y0);
  bandaZona(x,X,Y0,Y1); const vv=[]; for(let v=lo;v<=hi+1e-9;v+=paso) vv.push(v); ejeY(x,X0,X1,Y,vv,v=>fN(v,0)); raya(x,X0,Y(0),X1,Y(0),'rgba(160,200,220,0.30)',1);
  x.fillStyle='rgba(199,155,255,0.16)'; x.beginPath(); for(let i=0;i<=NPAS;i+=4){ const k=kV(i); const px=X(i*DT), py=Y((T.bg[k]+2*Math.sqrt(T.pbg[k]))*cv_); i?x.lineTo(px,py):x.moveTo(px,py); }
  for(let i=NPAS;i>=0;i-=4){ const k=kV(i); x.lineTo(X(i*DT),Y((T.bg[k]-2*Math.sqrt(T.pbg[k]))*cv_)); } x.closePath(); x.fill();
  if(!oc){ x.setLineDash([3,3]); x.strokeStyle=COL.ver; x.lineWidth=1.2; x.beginPath(); for(let i=0;i<=NPAS;i+=4){ const px=X(i*DT), py=Y(M.bgT[kV(i)]*cv_); i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke(); x.setLineDash([]); }
  x.strokeStyle=COL.giro; x.lineWidth=1.8; x.beginPath(); for(let i=0;i<=NPAS;i+=4){ const px=X(i*DT), py=Y(T.bg[kV(i)]*cv_); i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke();
  cursor(x,X,Y0,Y1); txt(x,'°/h',X0+3,Y0+8,TXT,8.5,'left','600');
  el('t_fr').textContent=fN(e.bg*cv_,0)+' °/h';
}
/* ---- error a lo largo del camino y de lado (necesita la verdad: se oculta mientras se ajusta) ---- */
function pintaLados(){
  const x=abre(LVE), Wd=LVE.w, Hd=LVE.h, C=CALC; if(!C) return;
  if(ocultaVerdad()){ sinDatos(x,Wd,Hd,'el error real se muestra al validar'); el('t_sp').textContent=''; return; }
  const X0=30, X1=Wd-6, Y0=4, Yb=Hd-14, X=ejeT(X0,X1), m=C.m;
  let mxv=1; for(let i=0;i<=NPAS;i+=4){ mxv=Math.max(mxv,Math.abs(m.eAl[kV(i)]),Math.abs(m.eLa[kV(i)])); } const top=bonito(mxv*1.1,[2,4,8,15,25,40,60,100]);
  const Y=v=>(Y0+Yb)/2-v/top*((Yb-Y0)/2);
  bandaZona(x,X,Y0,Yb); ejeY(x,X0,X1,Y,[-top,0,top],v=>fN(v,0)); raya(x,X0,Y(0),X1,Y(0),'rgba(160,200,220,0.30)',1); ejeX(x,X,Hd+2,10);
  lineaSerie(x,X,Y,m.eAl,COL.largo,1.5,null,2); lineaSerie(x,X,Y,m.eLa,COL.lado,1.5,null,2);
  cursor(x,X,Y0,Yb); txt(x,'m',X0+3,Y0+8,TXT,8.5,'left','600');
  el('t_sp').innerHTML=`<i style="color:${COL.largo}">▬</i> a lo largo <i style="color:${COL.lado}">▬</i> de lado`;
}

function ajustaHoja(){

  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.40:0.43),240,450));

/* ===================== 17. EL RETO: CALCULA, AJUSTA, DIAGNOSTICA =====================
   Tres fases: 1 · Calcula (cuánto se aparta de lado un coche que navega a ciegas con un sesgo de giroscopio: ½·v·b·t²), 2 · Ajusta
   (qué sensor de movimiento, cuántas lecturas del GPS por segundo y en quién confiar, para cuatro condiciones a la vez: el peor
   error dentro de la zona sin señal, el error de lado, lo que tarda en recuperarse al salir y un filtro «honesto»; el error real sólo
   aparece al validar, y la ventana de confianza es INTERIOR) y 3 · Diagnostica (¿por qué falla este sistema?, sólo con lo que se ve en el
   dock). Cierra con un quiz de tres preguntas. */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETOS={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'calcula',iniciado:false,dxOk:false,r1:null,r2:null,dx:null,orden:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0};
const ESC_RETO=['medio','largo','canon'];

/* ---------- Fase 1 · Calcula: la deriva de lado por un sesgo del giroscopio ---------- */
const CASOS_1=[{v:20,b:0.05,t:30},{v:15,b:0.10,t:20},{v:25,b:0.02,t:40},{v:18,b:0.06,t:25},{v:22,b:0.03,t:35},{v:12,b:0.15,t:20},{v:30,b:0.04,t:30}];
function sorteaCaso1(){ const p=GUIA.r1&&GUIA.r1.v+'/'+GUIA.r1.b; let c; do{ c=pickOne(CASOS_1); }while(c.v+'/'+c.b===p); GUIA.r1=Object.assign({},c,{res:derivaLateral(c.v,c.b*RAD,c.t)}); }
function numeroDe(txt){ const raw=String(txt||'').trim().replace(/\s/g,'').replace(/ /g,'').replace(',','.'); return parseFloat(raw); }
function checkCalcula(){
  const v=numeroDe((el('ansV')||{}).value), r=GUIA.r1, ok=r.res;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe los metros que se aparta de lado (con coma o punto decimal).'); return; }
  RETOS.intentos++;
  if(Math.abs(v-ok)<=Math.max(0.25,0.04*ok)){
    RETOS.fallos1=0; sonido.bien();
    feedback('good','¡Correcto! ✓',`El rumbo creído se aparta b·t = ${fN(r.b,2)}° /s · ${fN(r.t,0)} s = ${fN(r.b*r.t,2)}°, y la posición se aparta de lado ½·v·b·t² = ½ · ${fN(r.v,0)} · ${fN(r.b*RAD,5)} · ${fN(r.t,0)}² = <b>${fN(ok,2)} m</b>. Si el tiempo se duplica, el error se <b>cuadruplica</b>.`,true);
    paso('ajusta'); prepararAjusta();
  } else {
    RETOS.fallos1++; sonido.mal(); const mitad=Math.abs(v-2*ok)<=Math.max(0.25,0.04*ok);
    if(RETOS.fallos1>=3){ RETOS.fallos1=0; RETOS.resiembras++; sorteaCaso1(); feedback('bad','Tres intentos fallidos','Cambia el caso. Recuerda: pasa los grados a radianes (1° = 0,01745 rad) y usa ½ · v · b · t².'); reiniciaCalculo(); pintaHUD(); }
    else { feedback('bad','Revisa el cálculo',(mitad?'Te sobró un factor 2: el error de lado crece parejo, así que es la <b>mitad</b> de v·b·t². ':'Pasa primero b a radianes por segundo (1° = 0,01745 rad). ')+`El lado es ½ · v · b · t². (intentos fallidos: ${RETOS.fallos1}/3)`); const t=el('d_try'); if(t) t.textContent=RETOS.fallos1; }
  }
}

/* ---------- Fase 2 · Ajusta la clase de IMU, las lecturas por segundo y la confianza ---------- */
function prepararAjusta(){
  let e; do{ e=escPorId(pickOne(ESC_RETO)); }while(GUIA.r2&&e.id===GUIA.r2.esc.id&&RETOS.resiembras>0);
  GUIA.r2={esc:e,cls:'consumo',hz:5,u:0,validado:false,res:null,intentos:0};
  reiniciaCalculo(); pintaHUD();
}
/** Rango de la confianza (u) que cumple todo con la clase y la frecuencia como están: la ventana. */
function rangoU(r){
  const B=baseDe(r.esc.id,r.cls); let a=null,b=null;
  for(let i=-12;i<=12;i++){ const u=i*0.25, T=filtra(B.esc,B.cls,{hz:r.hz,u,odo:true},B.M), m=metricas(B.esc,T,B.M); if(cumpleTodo(m,B.esc)){ if(a===null) a=u; b=u; } }
  return a===null?null:[a,b];
}
function validarAjusta(){
  const r=GUIA.r2; if(!r) return;
  const E=r.esc, m=CALC.m; r.res=m; r.validado=true; r.intentos++; RETOS.intentos++;
  const c=cumple(m,E), ok=cumpleTodo(m,E);
  reiniciaCalculo();
  const cifras=`Peor error dentro de la zona <b>${fN(m.pico,1)} m</b> (máx. ${fN(E.lim.pico,1)}), de lado <b>${fN(m.laPico,1)} m</b> (máx. ${fN(E.lim.lat,1)}), te recuperaste <b>${fN(m.recupera,0)} s</b> después de salir (máx. ${fN(E.lim.rec,0)}) y el filtro fue <b>${m.nees<RETO.neesMin?'tímido':(m.nees>RETO.neesMax?'presumido':'honesto')}</b> (NEES ${fN(m.nees,1)}; ideal 2).`;
  if(ok){
    RETOS.fallos2=0; sonido.bien(); const rg=rangoU(r);
    feedback('good','¡Lo conseguiste! ✓',`${cifras} ${rg?`Con ese sensor y esas lecturas, cualquier confianza entre <b>${txtU(rg[0])}</b> y <b>${txtU(rg[1])}</b> habría servido: si te fías demasiado del GPS el filtro se agita y presume; si te fías demasiado del IMU tarda en corregirse. La ventana está en el interior, no en los extremos.`:''}`,true);
    pintaHUD(); paso('diag'); iniciaDiag();
  } else {
    RETOS.fallos2++; sonido.mal();
    let msg=cifras+' ';
    if(!c.pico) msg+='El peor error dentro de la zona es <b>grande</b>: el sensor de movimiento acumula demasiado sesgo. Prueba con uno mejor (hasta el presupuesto) o deja que el filtro aprenda el sesgo con el GPS antes de entrar al túnel. ';
    if(!c.lat) msg+='Te <b>saliste de tu carril</b> (error de lado): el sesgo del giroscopio desvía la ruta, sobre todo en las curvas. ';
    if(!c.rec) msg+='Tardaste mucho en <b>recuperarte</b> al salir: el filtro se fía tanto del sensor de movimiento que le cuesta hacer caso al GPS que vuelve. ';
    if(!c.nees) msg+=m.nees>RETO.neesMax?'El filtro es <b>presumido</b>: su círculo es más chico que su error real. El error del GPS se repite en lecturas seguidas, así que más lecturas por segundo no son información nueva: fíate menos del GPS o pide menos lecturas. ':'El filtro es <b>tímido</b>: su círculo es mucho mayor que su error real y desperdicia lo que sabe. ';
    if(RETOS.fallos2>=4){ RETOS.fallos2=0; RETOS.resiembras++; feedback('bad','Cuatro validaciones sin lograrlo',msg+'Cambia la situación.',true); prepararAjusta(); }
    else { feedback('bad','Todavía no',msg+`(validaciones fallidas: ${RETOS.fallos2}/4)`,true); pintaHUD(); }
  }
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const CASOS_DX=[

  const p=GUIA.dx&&GUIA.dx.k; let c; do{ c=pickOne(CASOS_DX); }while(c.k===p);

  }
}
function explicaDx(k){

  if(k==='sinruedas') return 'Sin odómetro el filtro sólo cuenta con el acelerómetro para la rapidez, y su sesgo se integra dos veces: el error crece sobre todo a lo largo de la carretera, no de lado.';
  if(k==='gps') return 'Con tanta fe en cada lectura, el filtro copia el ruido del GPS y el sesgo que cree del giroscopio se agita en lugar de asentarse; al entrar al túnel lleva un sesgo mal aprendido y se desvía.';
  return 'En el cañón el GPS miente más de lo que dice su calidad, y a 10 lecturas por segundo repite el mismo error muchas veces: el filtro las toma por información nueva, encoge su círculo y se queda muy seguro y muy equivocado.';
}
function noEs(k){

/* ===================== 18. CÁMARAS =====================
   La escena se encuadra con el hueco que dejan la guía y el dock: la cámara se aleja lo justo para que la caja del
   «objeto» (ancho × alto en unidades) quepa entera en ese hueco, y la proyección se desplaza para centrarla en él.
   Además el objeto nunca pasa del 70 % del alto del lienzo. */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}
const anclaCoche=()=>SIM.e?V3(mx(SIM.e.E),0.10,mz(SIM.e.N)):V3(0,0.10,0);
/** El objeto de la vista «Coche» es el coche MÁS su círculo de duda: la cámara se aleja justo lo que crece el círculo. */
const objCoche=()=>{ const r=Math.max(LARGO_COCHE*0.56,SIM.e?Math.max(VIS_MIN,Q95*SIM.e.s1*SC):0), d=2*r+0.3; return {w:d*1.12,h:d*0.80}; };
const anclaTunel=()=>{ const C=CALC; if(!C) return V3(0,0,0); const b=cajaRuta(C.esc.sIn,C.esc.sOut); return V3(mx((b.e0+b.e1)/2),0.05,mz((b.n0+b.n1)/2)); };
const objTunel=()=>{ const C=CALC; if(!C) return {w:5,h:4}; const b=cajaRuta(C.esc.sIn,C.esc.sOut); return {w:(b.e1-b.e0)*SC+1.5,h:(b.n1-b.n0)*SC*0.9+1.3}; };
const VISTAS={
  todo:{dir:V3(0.0,0.98,0.50),anc:()=>V3(0,0,0.15),toff:V3(0,0,0),obj:()=>({w:10.6,h:8.0}),fov:34,tope:0.72},
  coche:{dir:V3(0.0,0.96,0.58),anc:anclaCoche,toff:V3(0,0,0),obj:objCoche,fov:34,tope:0.72,sigue:true},   // la cámara va detrás del coche y gira con su rumbo
  tunel:{dir:V3(0.0,0.98,0.50),anc:anclaTunel,toff:V3(0,0,0),obj:objTunel,fov:34,tope:0.72},
  cenital:{dir:V3(0.0,1,0.10),anc:()=>V3(0,0,0.15),toff:V3(0,0,0),obj:()=>({w:10.6,h:8.6}),fov:34,tope:0.72},
};
const CAM={off:V3(3,6,5),toff:V3(0,0,0),auto:true,previo:null,k:1,dur:1,psi:0};
const dirVista=v=>{ const V=VISTAS[v]; return (V.sigue&&SIM.e)?V3(-0.58*Math.cos(CAM.psi),0.96,0.58*Math.sin(CAM.psi)):V.dir.clone(); };
function fovVista(v){ return innerWidth<innerHeight*0.9?46:VISTAS[v].fov; }
function distanciaFit(w,h,fov,tope){
  const Hu=huecoLibre(), W=innerWidth, Hh=innerHeight, tv=Math.tan(fov*Math.PI/360), th=tv*(W/Hh);
  const wF=Math.max(80,Hu.x1-Hu.x0)/W, hF=Math.max(80,Hu.y1-Hu.y0)/Hh;
  const D=1.06*Math.max(w/(2*th*wF),h/(2*tv*hF));
  return Math.max(D,h/(2*tv*(tope||0.66)));
}
function ofsDeseado(v){
  const V=VISTAS[v], o=V.obj(), fov=fovVista(v), D=distanciaFit(o.w,o.h,fov,V.tope);
  return {off:dirVista(v).normalize().multiplyScalar(D),toff:V.toff.clone(),fov};
}
function ponVista(v,dur){
  EST.vista=v; CAM.auto=true; CAM.dur=dur===undefined?1.0:dur;
  if(typeof pintaBarras==='function') pintaBarras();
  if(VISTAS[v].sigue&&SIM.e) CAM.psi=SIM.e.psi;
  if(CAM.dur<=0.01){ const A=VISTAS[v].anc(), d=ofsDeseado(v); CAM.off.copy(d.off); CAM.toff.copy(d.toff); camera.fov=d.fov; camera.updateProjectionMatrix();
    camera.position.copy(A).add(CAM.off); controls.target.copy(A).add(CAM.toff); CAM.previo=A.clone(); }
}
function pasaCam(dt){
  const V=VISTAS[EST.vista], P=V.anc();
  if(V.sigue&&SIM.e){ let d=SIM.e.psi-CAM.psi; d=Math.atan2(Math.sin(d),Math.cos(d)); CAM.psi+=d*(1-Math.exp(-dt/0.45)); }
  if(CAM.auto){
    const d=ofsDeseado(EST.vista), k=1-Math.exp(-dt/Math.max(0.05,(CAM.dur||1)*0.30));
    CAM.off.lerp(d.off,k); CAM.toff.lerp(d.toff,k);
    if(Math.abs(camera.fov-d.fov)>0.05){ camera.fov+=(d.fov-camera.fov)*k; camera.updateProjectionMatrix(); }
    camera.position.copy(P).add(CAM.off); controls.target.copy(P).add(CAM.toff);
  } else if(CAM.previo){ const dP=P.clone().sub(CAM.previo); camera.position.add(dP); controls.target.add(dP); }
  CAM.previo=P.clone();
}
controls.addEventListener('start',()=>{ CAM.auto=false; });

/* ===================== 19. SONIDO (sintetizado) =====================
   Un zumbido grave de rodadura cuyo tono sigue a la velocidad del coche (muy atenuado) y los avisos de acierto y fallo. */
const sonido=(function(){
  let ctx=null,on=true,master=null,ult=0,zum=null,zg=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      zum=ctx.createOscillator(); zg=ctx.createGain(); zum.type='sawtooth'; zum.frequency.value=60; zg.gain.value=0; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=200; zum.connect(lp); lp.connect(zg); zg.connect(master); zum.start();
    }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); ult=f; }
  return {init,
    zumbido:(q)=>{ if(!ctx||!zum) return; const t=ctx.currentTime; zum.frequency.setTargetAtTime(38+q*50,t,0.15); zg.gain.setTargetAtTime(on&&q>0?0.008:0,t,0.15); },
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }, get freq(){ return ult; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});

/* ===================== 20. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.max(Math.min(devicePixelRatio,alta?2:1.5),Math.min(devicePixelRatio,1.5)>1?1.25:1));
  const ms=alta?2048:1024; if(LUZ.sol.shadow.mapSize.x!==ms){ LUZ.sol.shadow.mapSize.set(ms,ms); if(LUZ.sol.shadow.map){ LUZ.sol.shadow.map.dispose(); LUZ.sol.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); if(typeof ponVista==='function'&&CALC) ponVista(EST.vista,0.001); centraEnHueco();
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 21. EL LAZO: UN SOLO RELOJ =====================
   El tiempo del escenario avanza dt·velocidad en cada cuadro, y con ESE tiempo se mueven el coche, las lecturas, la estimación
   y la elipse, y se dibujan las gráficas del dock. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0, tSon=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  const dtS=EST.pausa?0:dt, dtSim=dtS*EST.vel;
  aplicaEscena(dtS,dtSim,dt);
  pasaCam(dt);
  if(t-tSon>0.4){ tSon=t; sonido.zumbido(SIM.e&&!EST.pausa?clamp(SIM.e.v/25,0,1):0); }
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaGraficas(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos(); colocaFoco();
}

/* ===================== 22. ARRANQUE =====================
   Abre funcionando y con el recorrido en el paso 1: el coche rueda hacia el túnel, el GPS suelta sus lecturas y el filtro ya
   sigue al coche, antes de que el alumno toque nada. */
disposicion();

SIM.t=TOUR_PASOS[0].t0;

aplicaEscena(0.02,0.02);

/** Mide el objeto en lo VISIBLE: se pinta sin plataforma, suelo, fondo, satélites ni rayos sobre magenta puro y se toma la caja de los píxeles que no son magenta.
 *  modo 'ruta' (por defecto): la ruta con su túnel y el coche · modo 'coche': sólo el coche, su caja verde y su círculo de duda. */
function mideObjeto(modo){
  const ocultos=[]; const oc=o=>{ if(o.visible){ o.visible=false; ocultos.push(o); } };
  oc(PLATAFORMA); scene.traverse(o=>{ if(o.userData&&o.userData.fondo) oc(o); }); oc(IM_SAT); oc(RAYOS.lineas);
  if(modo==='coche'){ for(const o of [ZONA.grupo,TR.mesh,IM_FIX,PIN]) oc(o); MUNDO.children.forEach(c=>{ if(c.geometry&&c.material===M_CALZADA) oc(c); }); }
  const bg=scene.background, fog=scene.fog; scene.background=null; scene.fog=null; renderer.setClearColor(0xff00ff,1);
  renderer.render(scene,camera);
  const c=renderer.domElement, W=c.width, H=c.height, t=document.createElement('canvas'); t.width=W; t.height=H; const g=t.getContext('2d',{willReadFrequently:true}); g.drawImage(c,0,0);
  const d=g.getImageData(0,0,W,H).data; let x0=1e9,x1=-1,y0=1e9,y1=-1;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=(y*W+x)*4; if(!(d[i]>235&&d[i+1]<30&&d[i+2]>235)){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  for(const o of ocultos) o.visible=true; scene.background=bg; scene.fog=fog; renderer.setClearColor(0x000000,1);
  const k=W/innerWidth; return {x0:x0/k,x1:x1/k,y0:y0/k,y1:y1/k,altoPx:(y1-y0)/k,anchoPx:(x1-x0)/k,fracAlto:(y1-y0)/H,fracAncho:(x1-x0)/W,hueco:huecoLibre(),W:innerWidth,H:innerHeight};
}
