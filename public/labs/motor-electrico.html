<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Motor Eléctrico de Tracción — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#08201C;--panel:rgba(9,24,23,.86);--line:#1E3A34;--ink:#EAF4F1;
    --dim:#8FB3AC;--accent:#2A9D8F;--accent2:#4FD1C5;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cA:#FF8A3D;--cB:#37E0C7;--cC:#6FB6FF;--cN:#5b8cff;--cS:#ff5a6e;--cMag:#ffd166;--cV:#c79bff;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#14201f;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#182a28}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#33b3a3}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#06120f}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#4FD1C5;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f8a85;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f948f;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#04211c}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#0a1219;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(30,58,52,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,58,52,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f8a85}
  .dk-tit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#9fbab4;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,58,52,.7);min-height:0}
  .dk-g.pl{flex:2.7 1 0;min-height:150px}
  .dk-g.tn{flex:1.2 1 0;min-height:84px}
  .dk-g.vu{flex:1 1 0;min-height:70px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c9c4;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#14201f;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfe0dc;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cT);flex:none}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(12,22,22,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,22,21,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d6d2}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,22,24,.92);border:1px solid rgba(79,209,197,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,22,24,.84);border:1px solid rgba(79,209,197,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto auto 1fr auto 1fr;grid-template-areas:"tt tt" "tpl fig" "pl fig" "pl ttn" "pl tn" "pl tvu" "pl vu";column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-area:tt}
  body.estrecho.ancho.t-panel .panel>.t-pl{grid-area:tpl}
  body.estrecho.ancho.t-panel .panel>.dk-fig{grid-area:fig}
  body.estrecho.ancho.t-panel .panel>.dk-g.pl{grid-area:pl;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-tn{grid-area:ttn}
  body.estrecho.ancho.t-panel .panel>.dk-g.tn{grid-area:tn;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-vu{grid-area:tvu}
  body.estrecho.ancho.t-panel .panel>.dk-g.vu{grid-area:vu;min-height:0}
  body.estrecho.ancho.t-panel .panel>.dk-ley{display:none}
  body.estrecho.ancho.t-panel .panel>.dk-aviso{display:none}
  body.estrecho .hud details>.cuerpo{max-height:24vh}
  body.estrecho.ancho.t-hud .hud{display:grid;grid-template-columns:1fr 1.05fr;column-gap:14px;row-gap:7px;align-content:start;grid-auto-flow:row dense}
  body.estrecho.ancho .hud>.hcab,body.estrecho.ancho .hud>.modebar,body.estrecho.ancho .hud>.hdet,body.estrecho.ancho .hud>.pasos{grid-column:1}
  body.estrecho.ancho .hud>.hmandos,body.estrecho.ancho .hud>.retoBox{grid-column:2;grid-row:1/span 4}
  body.estrecho .hdet{flex-direction:row}body.estrecho .hdet>details{flex:1;min-width:0}
  body.estrecho .hdet details[open]{position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 54px);z-index:25;background:rgba(9,24,23,.97)}
  body.movil .lt{display:none} body.movil .tbar .modo,body.movil .tbar .reloj{display:none}
  body.movil .tbar{gap:6px;padding:5px 8px} body.movil .tbar .est{min-width:0}
  body.movil .dk-ley{display:none} body.movil .fg b{font-size:13.5px} body.movil .fg .fl{font-size:9.5px}
  body.movil .dk-g.pl{min-height:150px} body.movil .dk-g.tn{min-height:60px} body.movil .dk-g.vu{min-height:52px}
  body.movil .hud h2{font-size:15.5px} body.movil .hud .intro{font-size:11.8px;line-height:1.42}
  body.estrecho .hud{overflow-y:auto}
  body.estrecho .vbar [data-t="rot"],body.estrecho .vbar .sep.s1{display:none}
  body.estrecho.ancho .vbar{top:60px}
  body.movil .vbar{flex-wrap:nowrap;gap:3px;padding:3px 4px;top:54px} body.movil .vbar .sep{display:none} body.movil .vbar .b.sm{padding:5px 7px;font-size:11px}
  body.movil .vbar .lg{display:none}
  body.movil .tbar .lento{display:none}
  body.movil .hud{gap:6px;padding:10px 12px 9px} body.movil .hud .eyebrow{display:none}
  body.movil .modebar .b{padding:6px 4px 5px}
  body.movil .hmandos{display:grid;grid-template-columns:1.3fr 1fr;gap:6px 8px}
  body.movil .hmandos>:nth-child(1),body.movil .hmandos>:nth-child(2),body.movil .hmandos>.fila{grid-column:1/-1}

<script type="module">

import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';

/* ============================================================
   LAB — MOTOR ELÉCTRICO DE TRACCIÓN · SÍNCRONO DE IMANES ENTERRADOS
   (Autotrónica · mecanica-1)

   VERSIÓN DE ESCAPARATE. Un motor de tracción de 8 polos y 48 ranuras
   cortado por la mitad (plano z = 0): el estátor con su camisa de agua, las
   48 ranuras con el devanado trifásico, y el rotor con los imanes
   ENTERRADOS en V, sus barreras de flujo y su eje. Cada ranura enseña con
   un punto o una cruz hacia dónde va su corriente; en el entrehierro se ve el
   campo del estátor girar —rojo, su polo S; azul, su polo N— y el rotor lo
   sigue con su ángulo de carga.

   Abre funcionando: un barrido de velocidad con el pedal a fondo, y el punto
   de operación viaja por el plano id–iq (MTPA, debilitamiento de campo) y
   por la envolvente par–velocidad a la vez que se mueve el rotor. Todo sale
   del mismo estado del modelo en cada cuadro.

   La física (modelo dq con inductancias Ld y Lq, par de imán + reluctancia,
   MTPA, límites de corriente y de tensión, pérdidas) está en un bloque puro
   que un script de Node extrae TAL CUAL y verifica.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO=' ';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }


/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos
   marcas— y lo prueba: lo que se prueba es lo que corre. */

/* FISICA:INICIO */
/* ---------- 1.1 La máquina ----------
   Un motor de tracción síncrono de imanes permanentes enterrados (IPM) de 8
   polos y 48 ranuras, alimentado a 350 V. Parámetros representativos de un
   motor de 110 kW de punta, ajustados para que el modelo dq reproduzca lo que
   el laboratorio siempre ha dicho: 320 N·m hasta ≈ 3 283 rpm y, por encima,
   potencia casi constante hasta 10 500 rpm (700 Hz eléctricos).
   Todas las cantidades dq son de AMPLITUD INVARIANTE (valores pico). */
const DOSPI=2*Math.PI, RAIZ3=Math.sqrt(3), GRAD=Math.PI/180;
const PM={
  p:4, polos:8, ranuras:48,          // pares de polos, polos, ranuras
  psi:0.0978,                        // Wb · flujo de los imanes visto por una fase (pico)
  Ld:0.30e-3, Lq:0.75e-3,             // H · inductancias del eje d y del eje q (Lq > Ld: polaridad inversa de un IPM)
  Rs:0.010,                           // Ω · resistencia de fase en caliente
  Imax:450,                           // A pico · límite térmico de corriente (círculo)
  Vdc:350,                            // V · bus de continua
  Tlim:320,                           // N·m · par máximo que el control permite
  rpmMax:10500,                       // rpm · velocidad máxima (700 Hz eléctricos)
  fHierro:700,                        // Hz · límite de frecuencia del acero laminado
};
PM.Vmax=PM.Vdc/RAIZ3;                 // V pico de fase · lado del hexágono de la SVPWM (m = 1,155)
/* Pérdidas: hierro con histéresis (∝ f) y corrientes parásitas (∝ f²) por el cuadrado del flujo, que
   satura (tanh) como lo hace el acero; mecánicas, rozamiento y ventilación. Representativas, no medidas. */
const PERD={ kh:3.5, ke:0.0173, psiRef:0.10, psiSat:0.14, cf:0.3, cw:1.0e-3 };
const rpmDe=w=>w*30/Math.PI, wDe=rpm=>rpm*Math.PI/30;           // rad/s mecánicos ↔ rpm
const feDe=rpm=>rpm*PM.polos/120;                               // Hz eléctricos: n·P/120

/* ---------- 1.2 Transformadas de Clarke y de Park (amplitud invariante) ---------- */
function clarke(a,b,c){ return [(2*a-b-c)/3,(b-c)/RAIZ3]; }
function clarkeInv(al,be){ return [al,-al/2+RAIZ3/2*be,-al/2-RAIZ3/2*be]; }
function park(al,be,th){ const c=Math.cos(th), s=Math.sin(th); return [al*c+be*s,-al*s+be*c]; }
function parkInv(d,q,th){ const c=Math.cos(th), s=Math.sin(th); return [d*c-q*s,d*s+q*c]; }
const abcDeDq=(d,q,th)=>{ const [al,be]=parkInv(d,q,th); return clarkeInv(al,be); };
const dqDeAbc=(a,b,c,th)=>{ const [al,be]=clarke(a,b,c); return park(al,be,th); };

/* ---------- 1.3 Las ecuaciones del motor en el marco que gira con el rotor ----------
     v_d = R·i_d − ω_e·L_q·i_q
     v_q = R·i_q + ω_e·(L_d·i_d + ψ_m)
     T   = 3/2·p·[ψ_m·i_q + (L_d − L_q)·i_d·i_q]  =  T_imán + T_reluctancia */
const parMag=(id,iq)=>1.5*PM.p*PM.psi*iq;
const parRel=(id,iq)=>1.5*PM.p*(PM.Ld-PM.Lq)*id*iq;
const par=(id,iq)=>parMag(id,iq)+parRel(id,iq);
function tension(id,iq,we){ const vd=PM.Rs*id-we*PM.Lq*iq, vq=PM.Rs*iq+we*(PM.Ld*id+PM.psi); return [vd,vq,Math.hypot(vd,vq)]; }
const flujo=(id,iq)=>[PM.psi+PM.Ld*id,PM.Lq*iq];

/* ---------- 1.4 MTPA: máximo par por amperio ----------
   Con |i| = I fijo y id = −I·sen β, iq = I·cos β, el par es
   T(β) = 3/2·p·[ψ_m·I·cos β + ½(Lq − Ld)·I²·sen 2β]. dT/dβ = 0 da, con
   ΔL = Lq − Ld,   id = ψ_m/(4ΔL) − √(ψ_m²/(16ΔL²) + I²/2).               */
function mtpaId(I){ const d=PM.Lq-PM.Ld; return PM.psi/(4*d)-Math.sqrt(PM.psi*PM.psi/(16*d*d)+I*I/2); }
function mtpaDeI(I){ const id=mtpaId(I); return [id,Math.sqrt(Math.max(0,I*I-id*id))]; }
/** La corriente de módulo mínimo que da el par T sobre la trayectoria MTPA (bisección: T crece con I). */
function mtpaDePar(T){ let lo=0, hi=PM.Imax*1.6; for(let k=0;k<60;k++){ const m=(lo+hi)/2, [d,q]=mtpaDeI(m); if(par(d,q)<T) lo=m; else hi=m; }
  const I=(lo+hi)/2; return [...mtpaDeI(I),I]; }

/* ---------- 1.5 Límites: el círculo de corriente y la elipse de tensión ----------
   v = A·i + b con A = [[R, −ω_e·Lq],[ω_e·Ld, R]] y b = [0, ω_e·ψ_m]. El
   conjunto |v| ≤ Vmax es el INTERIOR de una elipse en el plano (id, iq),
   centrada donde v = 0 (≈ (−ψ_m/Ld, 0)) y con semiejes ≈ Vmax/(ω_e·Ld) y
   Vmax/(ω_e·Lq). Se encoge cuando sube la velocidad. */
function elipse(we,n=120){
  const R=PM.Rs, a=-we*PM.Lq, c=we*PM.Ld, det=R*R-a*c, b2=we*PM.psi;
  // centro: A·ic = −b  →  ic = −A⁻¹·b
  const ic=[ (a*b2)/det, (-R*b2)/det ];
  // A⁻¹ = (1/det)·[[R, −a],[−c, R]]  →  ic = −(1/det)·[−a·b2, R·b2]
  const pts=[];
  for(let k=0;k<=n;k++){ const f=k/n*DOSPI, u=[Math.cos(f),Math.sin(f)], vu=Math.hypot(R*u[0]+a*u[1],c*u[0]+R*u[1]), s=PM.Vmax/vu;
    pts.push([ic[0]+s*u[0],ic[1]+s*u[1]]); }
  return { centro:ic, pts };
}
/** Un punto (r, β) del plano de corriente: id = −r·sen β, iq = r·cos β. */
const polar=(r,b)=>[-r*Math.sin(b),r*Math.cos(b)];
/** Intervalo de módulos r (sobre la semirrecta de ángulo β) que cumplen |v| ≤ Vmax. */
function intervaloV(b,we){
  const R=PM.Rs, a1=-R*Math.sin(b)-we*PM.Lq*Math.cos(b), a2=R*Math.cos(b)-we*PM.Ld*Math.sin(b), c2=we*PM.psi;
  const A=a1*a1+a2*a2, B=2*a2*c2, C=c2*c2-PM.Vmax*PM.Vmax;
  if(A<1e-18) return C<=0?[0,Infinity]:null;
  const disc=B*B-4*A*C; if(disc<0) return null;
  const sq=Math.sqrt(disc), r1=(-B-sq)/(2*A), r2=(-B+sq)/(2*A);
  return [Math.max(0,r1),r2];
}
/** El par de módulo r y ángulo β. */
const parPolar=(r,b)=>{ const [d,q]=polar(r,b); return par(d,q); };

/** El par MÁXIMO que el motor puede dar a la velocidad we (rad/s eléctricos):
 *  para cada β, el mayor r permitido por la corriente y la tensión; se queda con el
 *  β de mayor par. Cubre de una vez la región de par constante (MTPA, límite de
 *  corriente), el debilitamiento de campo (corriente y tensión) y MTPV. */
function parMax(we){
  let mejor={T:0,b:0,r:0};
  const eval1=b=>{ const iv=intervaloV(b,we); if(!iv) return null; const r=Math.min(iv[1],PM.Imax); if(r<iv[0]-1e-9) return null; return {T:parPolar(r,b),b,r}; };
  const N=720; let kb=-1, Tb=-1;
  for(let k=0;k<=N;k++){ const b=k/N*(Math.PI/2), e=eval1(b); if(e&&e.T>Tb){ Tb=e.T; kb=k; mejor=e; } }
  if(kb<0) return {T:0,b:0,r:0,id:0,iq:0};
  let lo=Math.max(0,(kb-1)/N*(Math.PI/2)), hi=Math.min(Math.PI/2,(kb+1)/N*(Math.PI/2));
  for(let it=0;it<50;it++){ const m1=lo+(hi-lo)/3, m2=hi-(hi-lo)/3, e1=eval1(m1), e2=eval1(m2), t1=e1?e1.T:-1, t2=e2?e2.T:-1;
    if(t1<t2) lo=m1; else hi=m2; }
  const e=eval1((lo+hi)/2); if(e&&e.T>=mejor.T) mejor=e;
  const [id,iq]=polar(mejor.r,mejor.b); return {T:mejor.T,b:mejor.b,r:mejor.r,id,iq};
}

/* ---------- 1.6 El punto de operación ----------
   Dado un par pedido y una velocidad, la corriente de MENOR módulo que da ese
   par sin salirse del círculo ni de la elipse. Con tensión de sobra es la
   MTPA; al faltar tensión el punto se desliza a lo largo de la elipse
   (debilitamiento de campo: id más negativa). Estrategia 'id0': sólo imanes
   (id = 0, sin par de reluctancia) mientras quepa; si no cabe, cae a lo mismo. */
function rParaPar(b,T){            // módulo r de la semirrecta β que da el par T (null si no existe)
  const k=1.5*PM.p, s=Math.sin(b), c=Math.cos(b), dL=PM.Lq-PM.Ld, A=k*dL*s*c, B=k*PM.psi*c;
  if(Math.abs(A)<1e-12) return B>1e-12?T/B:null;
  const D=B*B+4*A*T; if(D<0) return null; return (-B+Math.sqrt(D))/(2*A);
}
function puntoMinI(T,we){
  let mejor=null;
  const f=b=>{ const r=rParaPar(b,T); if(r===null||r<0||r>PM.Imax+1e-9) return null; const iv=intervaloV(b,we); if(!iv||r<iv[0]-1e-9||r>iv[1]+1e-9) return null; return r; };
  const N=1440; let kb=-1, rb=Infinity;
  for(let k=0;k<=N;k++){ const b=k/N*(Math.PI/2), r=f(b); if(r!==null&&r<rb){ rb=r; kb=k; } }
  if(kb<0) return null;
  let lo=Math.max(0,(kb-1)/N*(Math.PI/2)), hi=Math.min(Math.PI/2,(kb+1)/N*(Math.PI/2));
  for(let it=0;it<50;it++){ const m1=lo+(hi-lo)/3, m2=hi-(hi-lo)/3, r1=f(m1), r2=f(m2);
    if((r1===null?1e9:r1)<(r2===null?1e9:r2)) hi=m2; else lo=m1; }
  const b=(lo+hi)/2, r=f(b); if(r!==null&&r<=rb){ rb=r; kb=b; mejor={b,r}; } else mejor={b:kb/N*(Math.PI/2),r:rb};
  return mejor;
}
/** Todo lo que el motor hace en un punto: corrientes, tensiones, flujos, par y su reparto, potencias, pérdidas, rendimiento. */
function evaluaPunto(id,iq,rpm){
  const wm=wDe(rpm), we=wm*PM.p, [vd,vq,V]=tension(id,iq,we), [pd,pq]=flujo(id,iq), I=Math.hypot(id,iq);
  const Tm=parMag(id,iq), Tr=parRel(id,iq), T=Tm+Tr, fe=feDe(rpm), psiM=Math.hypot(pd,pq);
  const Pcu=1.5*PM.Rs*I*I, psiFe=PERD.psiSat*Math.tanh(psiM/PERD.psiSat), Pfe=(PERD.kh*fe+PERD.ke*fe*fe)*Math.pow(psiFe/PERD.psiRef,2), Pmec=PERD.cf*wm+PERD.cw*wm*wm;
  const Pint=T*wm, Pej=Pint-Pmec, Pin=Pint+Pcu+Pfe;
  return { id,iq,I,vd,vq,V,pd,pq,psi:psiM, T,Tm,Tr, wm,we,fe,rpm, delta:Math.atan2(pq,pd), gamma:Math.atan2(iq,id), beta:Math.atan2(-id,iq),
    Pint,Pej,Pin,Pcu,Pfe,Pmec, eta:Pin>1?Pej/Pin:0, Vfrac:V/PM.Vmax, Ifrac:I/PM.Imax };
}
/** Operación a (par pedido en N·m, rpm, estrategia). Devuelve el punto y qué lo limita. */
function operacion(Tped,rpm,estr){
  const wm=wDe(rpm), we=wm*PM.p, mx=parMax(we), Tdisp=Math.min(PM.Tlim,mx.T);
  let T=Math.max(0,Math.min(Tped,Tdisp)), lim=Tped>Tdisp+1e-9?(mx.T<PM.Tlim?'envolvente':'par'):null;
  let id=0, iq=0, modo='MTPA';
  if(T<=1e-9){ id=0; iq=0; modo='reposo'; }
  else {
    let hecho=false;
    if(estr==='id0'){ iq=T/(1.5*PM.p*PM.psi); id=0; const v=tension(id,iq,we)[2];
      if(iq<=PM.Imax&&v<=PM.Vmax+1e-9){ hecho=true; modo='id=0'; } }
    if(!hecho){ const q=puntoMinI(T,we);
      if(q){ [id,iq]=polar(q.r,q.b); }
      else { const e=parMax(we); id=e.id; iq=e.iq; T=e.T; lim='envolvente'; }
      const [dm,qm]=mtpaDePar(T);
      modo=(Math.abs(id-dm)<0.5&&Math.abs(iq-qm)<0.5)?'MTPA':(Math.hypot(id,iq)>=PM.Imax-0.5&&tension(id,iq,we)[2]<PM.Vmax-1?'corriente':'debilitamiento'); }
  }
  const o=evaluaPunto(id,iq,rpm); o.modo=modo; o.lim=lim; o.Tped=Tped; o.Tdisp=Tdisp; o.mx=mx; return o;
}
/** La envolvente par–velocidad: par máximo y potencia a cada rpm. */
function envolvente(n=210){
  const rpm=[], T=[], P=[];
  for(let k=0;k<=n;k++){ const r=PM.rpmMax*1.04*k/n, we=wDe(r)*PM.p, t=Math.min(PM.Tlim,parMax(we).T); rpm.push(r); T.push(t); P.push(t*wDe(r)); }
  return {rpm,T,P};
}
/** La velocidad a la que el par disponible deja de ser Tlim: el codo de la envolvente (bisección). */
function rpmBase(){ let lo=100, hi=PM.rpmMax; for(let k=0;k<60;k++){ const m=(lo+hi)/2; if(parMax(wDe(m)*PM.p).T>=PM.Tlim) lo=m; else hi=m; } return (lo+hi)/2; }

/* ---------- 1.7 Las corrientes de fase y el par instantáneo ----------
   th es el ángulo eléctrico del rotor (eje d medido desde el eje de la fase A).
   La corriente gira a la misma velocidad: i_a = I·cos(θ + atan2(iq, id)). */
function fasesDe(id,iq,th){ return abcDeDq(id,iq,th); }
/** Par instantáneo con una falla: 'phase' (la fase B abierta: el control reparte la corriente en las otras dos)
 *  o 'magnet' (un polo con la polaridad invertida: falta par cada vez que pasa por las fases).
 *  La primera es exacta en el modelo dq; la segunda es CUALITATIVA (un hueco de par por vuelta). */
function parInstante(id,iq,th,thM,falla,kPolo=3){
  let [a,b,c]=fasesDe(id,iq,th);
  if(falla==='phase'){ const x=(a-c)/2; a=x; b=0; c=-x; }
  const [d,q]=dqDeAbc(a,b,c,th);
  let T=par(d,q);
  if(falla==='magnet'){ const paso=DOSPI/PM.polos, dx=((thM-kPolo*paso+Math.PI)%DOSPI+DOSPI)%DOSPI-Math.PI; T*=1-0.55*Math.exp(-Math.pow(dx/(0.55*paso),2)); }
  return T;
}
/** Figura cualitativa del campo del estátor: la FMM de las tres corrientes, en electrógrados. Devuelve [Fα, Fβ] (Clarke) y su ángulo. */
function fmmDe(a,b,c){ const [al,be]=clarke(a,b,c); return [al,be,Math.atan2(be,al),Math.hypot(al,be)]; }
/* FISICA:FIN */


/* ===================== 2. ESCENA, CÁMARA, LUZ ===================== */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);

/* ===================== 4. TEXTURAS Y MATERIALES =====================
   PBR con entorno. Nada de poro ni grano fino —se lee como lija sobre caras
   grandes—: variaciones lentas de rugosidad (la piel de fundición de §21) y,
   donde la pieza lo pide, su dibujo: la serigrafía de la placa. */
const DOSPI_=Math.PI*2;
function normalDeAltura(W,H,h,fuerza){
  const c=cv(W,H),x=c.getContext('2d'),im=x.createImageData(W,H);
  const A=(i,j)=>h((i+W)%W,(j+H)%H);
  for(let j=0;j<H;j++) for(let i=0;i<W;i++){
    const dx=(A(i+1,j)-A(i-1,j))*fuerza, dy=(A(i,j+1)-A(i,j-1))*fuerza, L=Math.hypot(dx,dy,1), o=(j*W+i)*4;
    im.data[o]=(-dx/L*0.5+0.5)*255; im.data[o+1]=(-dy/L*0.5+0.5)*255; im.data[o+2]=(1/L*0.5+0.5)*255; im.data[o+3]=255; }
  x.putImageData(im,0,0); return c;
}
function ruidoPeriodico(semilla,periodo){
  const g=(x,y)=>{ x=((x%periodo)+periodo)%periodo; y=((y%periodo)+periodo)%periodo;
    const s=Math.sin(x*127.1+y*311.7+semilla*13.13)*43758.5453; return s-Math.floor(s); };
  return (x,y)=>{ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    return g(xi,yi)*(1-u)*(1-v)+g(xi+1,yi)*u*(1-v)+g(xi,yi+1)*(1-u)*v+g(xi+1,yi+1)*u*v; };
}
function fbmP(semilla,periodo,oct){ const ns=[]; for(let o=0;o<oct;o++) ns.push(ruidoPeriodico(semilla+o*7,periodo*(1<<o)));
  return (x,y)=>{ let v=0,a=0.5; for(let o=0;o<oct;o++){ v+=ns[o](x*(1<<o),y*(1<<o))*a; a*=0.5; } return v; }; }
function pielLenta(semilla,{px=256,celdas=4,oct=3,rug0=0.45,rugA=0.08,relieve=0.5}={}){
  const f=fbmP(semilla,celdas,oct), k=celdas/px;
  const c=cv(px), x=c.getContext('2d'), im=x.createImageData(px,px);
  for(let j=0;j<px;j++) for(let i=0;i<px;i++){ const v=clamp(rug0+(f(i*k,j*k)-0.5)*2*rugA,0,1)*255, o=(j*px+i)*4;
    im.data[o]=im.data[o+1]=im.data[o+2]=v; im.data[o+3]=255; }
  x.putImageData(im,0,0);
  return {r:tex(c),n:tex(normalDeAltura(px,px,(i,j)=>f(i*k,j*k),relieve))};
}

/* EL CORTE. Toda la exposición se secciona por el plano z = 0 y se conserva la
   mitad de atrás. Las caras de sección no son geometría: cada pieza es un
   sólido cerrado y, donde el plano la abre, lo que se ve por el hueco son sus
   caras de ATRÁS. Ésas se pintan como la cara de corte de un plano de taller:
   el punto se lleva por el rayo de la cámara hasta el plano y allí se dibuja
   el patrón de la pieza —rayado a ±45° en lo macizo, anillos en las bobinas de
   película del condensador, hilos en el cobre de las ranuras— iluminado como
   una cara plana que mira a +Z. El cobre de las ranuras conserva su brillo en
   la sección: es la corriente que lo recorre. */
const PLANO=new THREE.Plane(new THREE.Vector3(0,0,-1),0);
const PASO_G={value:0.0028};
const LUCES_CORTE=THREE.ShaderChunk.lights_fragment_begin.replaceAll('receiveShadow','(receiveShadow&&gl_FrontFacing)');
function corte(m,o={}){
  m.side=THREE.DoubleSide; m.clippingPlanes=[PLANO]; m.clipShadows=true;
  const pat=o.patron==='anillos'?1:(o.patron==='hilos'?2:0);
  const U={cFondo:{value:new THREE.Color(o.fondo||'#8a9096')},cLinea:{value:new THREE.Color(o.linea||'#5d636a')},
    cSent:{value:o.sentido||1},cPaso:{value:o.paso||1},cPasoG:PASO_G,cRay:{value:o.rayado===false?0:1},cRug:{value:o.rug??0.64},
    cPat:{value:pat},cCentro:{value:new THREE.Vector2(...(o.centro||[0,0]))},cBrillo:{value:o.brillo?1:0}};
  m.userData.cap=U;
  m.onBeforeCompile=(sh)=>{
    Object.assign(sh.uniforms,U);
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vMundoC;')
      .replace('#include <fog_vertex>','#include <fog_vertex>\n{ vec4 wc=vec4(transformed,1.0);\n#ifdef USE_INSTANCING\n wc=instanceMatrix*wc;\n#endif\n vMundoC=(modelMatrix*wc).xyz; }');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vMundoC;\nfloat cLnG=0.0;\nuniform vec3 cFondo; uniform vec3 cLinea; uniform float cSent; uniform float cPaso; uniform float cPasoG; uniform float cRay; uniform float cRug; uniform float cPat; uniform vec2 cCentro; uniform float cBrillo;')
      .replace('#include <normal_fragment_maps>',`#include <normal_fragment_maps>
      if(!gl_FrontFacing){
        vec3 dC=vMundoC-cameraPosition;
        float tC=clamp(-cameraPosition.z/(dC.z<-1e-5?dC.z:-1e-5),0.0,1.0);
        vec3 pC=cameraPosition+dC*tC;
        if(cRay>0.5){
          float ln=0.0;
          if(cPat<0.5){
            float uu=(pC.x*cSent+pC.y)*0.70710678/(cPaso*cPasoG);
            float fw=clamp(fwidth(uu),0.0,0.5);
            float dl=0.5-abs(fract(uu)-0.5);
            ln=(1.0-smoothstep(0.12-fw,0.12+fw,dl))*(1.0-smoothstep(0.25,0.5,fw));
          } else if(cPat<1.5){
            float uu=length(pC.xy-cCentro)/(cPaso*0.0011);
            float fw=clamp(fwidth(uu),0.0,0.5);
            float dl=0.5-abs(fract(uu)-0.5);
            ln=(1.0-smoothstep(0.16-fw,0.16+fw,dl))*(1.0-smoothstep(0.25,0.5,fw));
          } else {
            vec2 q=pC.xy/(cPaso*0.0016); q.y*=1.1547; q.x+=0.5*mod(floor(q.y),2.0);
            vec2 f=fract(q)-0.5; f.y/=1.1547; float r=length(f);
            float fw=clamp(fwidth(r)*1.5,0.0,0.5);
            ln=smoothstep(0.38-fw,0.38+fw,r)*(1.0-smoothstep(0.18,0.35,fw));
          }
          diffuseColor.rgb=mix(cFondo,cLinea,ln*0.9);
          metalnessFactor=0.12; cLnG=ln;
        }
        roughnessFactor=cRug;
        normal=normalize((viewMatrix*vec4(0.0,0.0,1.0,0.0)).xyz);
      }`)
      .replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\nif(!gl_FrontFacing) totalEmissiveRadiance*=cBrillo*(1.0-0.8*cLnG);')
      .replace('#include <lights_physical_fragment>','#include <lights_physical_fragment>\n#ifdef USE_CLEARCOAT\nif(!gl_FrontFacing) material.clearcoat=0.0;\n#endif\n#ifdef USE_SHEEN\nif(!gl_FrontFacing) material.sheenColor=vec3(0.0);\n#endif')
      .replace('#include <lights_fragment_begin>',LUCES_CORTE);
  };
  m.customProgramCacheKey=()=>'corte'+pat+(o.brillo?'b':'');
  return m;
}

/* ===================== 5. GEOMETRÍA =====================
   `torno` revoluciona un perfil cerrado (a, r) alrededor del eje X con
   normales ANALÍTICAS: ninguna sale nula y las aristas vivas no se
   redondean. `prisma` extruye a lo largo de Z un contorno con sus huecos, con
   normales suaves en las curvas y vivas en las esquinas: así se hacen las
   chapas del estátor y del rotor, que el corte enseña de frente. */
const DOSPI3=Math.PI*2;
function preparaPerfil(perfil){
  let P=[];
  for(const p of perfil){ const q=[p[0],Math.max(0,p[1])], u=P[P.length-1]; if(!u||Math.hypot(u[0]-q[0],u[1]-q[1])>1e-9) P.push(q); }
  while(P.length>2&&Math.hypot(P[0][0]-P[P.length-1][0],P[0][1]-P[P.length-1][1])<1e-9) P.pop();
  let A=0; for(let i=0;i<P.length;i++){ const p=P[i],q=P[(i+1)%P.length]; A+=p[0]*q[1]-q[0]*p[1]; }
  if(A<0) P.reverse();
  return P;
}
function orienta(pos,nor,idx,i0){
  let S=0;
  for(let k=i0;k<idx.length;k+=3){ const a=idx[k]*3,b=idx[k+1]*3,c=idx[k+2]*3;
    const ux=pos[b]-pos[a],uy=pos[b+1]-pos[a+1],uz=pos[b+2]-pos[a+2], vx=pos[c]-pos[a],vy=pos[c+1]-pos[a+1],vz=pos[c+2]-pos[a+2];

/* ===================== 7. EL ESTADO Y EL PUNTO DE OPERACIÓN =====================
   Un solo estado manda en cada cuadro: la velocidad y el par pedidos fijan un
   punto de operación (id, iq) con `operacion()` (el bloque verificado); con él
   se pintan las corrientes de fase, el campo, las ranuras y el rotor, y el dock
   dibuja el mismo punto. El tiempo de pantalla avanza a cámara lenta: el ángulo
   del rotor es ωm·dt·escala, y la escala se rotula en la barra de abajo. */
const EST={modo:'marcha',rpm:1280,Tped:320,estr:'mtpa',barrido:true,esc:1/100,escMano:false,pausa:REDUCIDO,autoRunning:false,mover:true};
const SIMU={thM:0.35,t:0,sw:0.10,op:null,clave:'',hist:[],tHist:0,tCalc:0,rpmBase:rpmBase(),env:null,corre:true};
SIMU.env=envolvente(210);
const SW={periodo:42,rpmMin:300};                    // el barrido: una subida y una bajada cada 42 s de reloj de pared
const RPM_SW=s=>SW.rpmMin+(PM.rpmMax-SW.rpmMin)*(0.5-0.5*Math.cos(DOSPI*s));
/** Lo que el motor hace según el modo. En marcha: lo que digan los mandos. En el laboratorio guiado:
    parado hasta el Reto 3, y en el Diagnóstico con la velocidad que fija la falla. */
function paramsActuales(){
  if(EST.modo==='marcha') return {rpm:EST.rpm,Tped:EST.Tped,estr:EST.estr};
  if(GUIA.phase===1&&GUIA.running) return {rpm:GUIA.rpm,Tped:PM.Tlim,estr:'mtpa'};
  if(GUIA.phase===2&&GUIA.running) return {rpm:GUIA.rpm,Tped:120,estr:'mtpa'};
  return null;
}
function actualizaOperacion(dtR){
  if(EST.modo==='guia'&&GUIA.running) GUIA.rpm+=(GUIA.rpmObj-GUIA.rpm)*(1-Math.exp(-Math.min(dtR,0.1)/0.5));
  if(EST.modo==='marcha'&&EST.barrido&&!EST.pausa){ SIMU.sw=(SIMU.sw+dtR/SW.periodo)%1; EST.rpm=RPM_SW(SIMU.sw); }
  const p=paramsActuales();
  if(!p){ if(SIMU.op){ SIMU.op=null; SIMU.clave=''; } return; }
  const k=Math.round(p.rpm)+'|'+p.Tped.toFixed(1)+'|'+p.estr;
  if(k===SIMU.clave) return;
  const t0=performance.now(); SIMU.op=operacion(p.Tped,Math.max(1,p.rpm),p.estr); SIMU.tCalc=performance.now()-t0; SIMU.clave=k;
}

/* ===================== 8. LO QUE SE VE: CAMPO, CORRIENTE Y BRILLO ===================== */
/** La falla (o el polo mal puesto del Armado) que hace falta pintar: qué tipo y en qué polo. */
function fallaActiva(){
  if(GUIA.fallaViva&&(fault==='phase'||fault==='magnet')) return {f:fault,k:3};
  if(EST.modo==='guia'&&GUIA.poloMal>=0&&GUIA.phase>=1) return {f:'magnet',k:GUIA.poloMal};
  return {f:null,k:3};
}
const FL={activo:false,i:[0,0,0],F:[0,0],fmm:0,th:0,thM:0,Tinst:0,vi:new Float32Array(N_RAN)};
const ROJO_S=[1.0,0.27,0.34], AZUL_N=[0.30,0.50,1.0];
/** El estado de este cuadro: ángulo eléctrico, corrientes de fase (con la falla que haya) y FMM del estátor. */
function evalua(){
  const op=SIMU.op;
  if(!op){ FL.activo=false; FL.i[0]=FL.i[1]=FL.i[2]=0; FL.F[0]=FL.F[1]=0; FL.vi.fill(0); FL.Tinst=0; return; }
  FL.activo=true;
  const th=PM.p*SIMU.thM; FL.th=th; FL.thM=SIMU.thM;
  const fa=fallaActiva();
  let [a,b,c]=fasesDe(op.id,GUIA.sentido*op.iq,th);
  if(fa.f==='phase'){ const x=(a-c)/2; a=x; b=0; c=-x; }
  FL.i[0]=a; FL.i[1]=b; FL.i[2]=c;
  const fm=fmmDe(a,b,c); FL.F[0]=fm[0]/PM.Imax; FL.F[1]=fm[1]/PM.Imax; FL.fmm=fm[2];
  for(let j=0;j<N_RAN;j++) FL.vi[j]=signoDeRanura(j)*FL.i[faseDeRanura(j)]/PM.Imax;
  FL.Tinst=parInstante(op.id,op.iq,th,SIMU.thM,fa.f,fa.k);
}

/* El campo del entrehierro: la onda de fuerza magnetomotriz de las tres corrientes,
   F(φ) = Fα·cos p(φ − φA) + Fβ·sen p(φ − φA), con (Fα, Fβ) la transformada de Clarke de
   (ia, ib, ic). Donde F > 0 el flujo sale hacia el rotor: allí el estátor presenta un polo S
   (rojo); donde F < 0, un polo N (azul). Gira porque giran las corrientes. */
const M_CAMPO=new THREE.ShaderMaterial({
  uniforms:{uF:{value:new THREE.Vector2()},uA:{value:0},uFase0:{value:FASE0},uP:{value:PM.p}},
  vertexShader:'varying vec2 vP; void main(){ vP=position.xy; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:`uniform vec2 uF; uniform float uA; uniform float uFase0; uniform float uP; varying vec2 vP;
    void main(){ float r=length(vP), an=atan(vP.y,vP.x)-uFase0;
      float b=uF.x*cos(uP*an)+uF.y*sin(uP*an);
      float rad=exp(-pow((r-0.0810)/0.0068,2.0));
      vec3 c=b>0.0?vec3(1.0,0.27,0.34):vec3(0.30,0.50,1.0);
      float a=clamp(abs(b),0.0,1.25)*rad*uA; if(a<0.004) discard;
      gl_FragColor=vec4(c*1.2,a); }`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
});
const CAMPO=new THREE.Mesh(new THREE.RingGeometry(0.0640,0.0990,192,1),M_CAMPO);
CAMPO.position.set(0,YM,0.0009); CAMPO.renderOrder=3; CAMPO.raycast=()=>{}; scene.add(CAMPO);

/* La camisa de agua: el refrigerante recorre el anillo, que es una franja del canal helicoidal en el corte. */
const M_AGUA=new THREE.ShaderMaterial({
  uniforms:{uT:{value:0}},
  vertexShader:'varying vec2 vP; void main(){ vP=position.xy; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:`uniform float uT; varying vec2 vP;
    void main(){ float r=length(vP), an=atan(vP.y,vP.x);
      float tira=0.5+0.5*sin(an*18.0-uT*2.4+sin(an*5.0)*1.4);
      float borde=smoothstep(0.1303,0.1318,r)*(1.0-smoothstep(0.1372,0.1388,r));
      float a=borde*(0.10+0.34*pow(tira,3.0)); if(a<0.004) discard;
      gl_FragColor=vec4(0.42,0.95,0.90,a); }`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
});
const AGUA=new THREE.Mesh(new THREE.RingGeometry(0.1300,0.1392,160,1),M_AGUA);
AGUA.position.set(0,YM,0.0007); AGUA.renderOrder=2; AGUA.raycast=()=>{}; scene.add(AGUA);

/* La corriente de cada ranura: un punto ( ● ) si va hacia ti, una cruz ( ✕ ) si se aleja; más fuerte cuanta más corriente.
   Cada fase con su color. Es el dibujo de libro, vivo. */
const C_FASE=['#FF8A3D','#37E0C7','#6FB6FF'].map(c=>new THREE.Color(c));
const gSim=new THREE.BufferGeometry();
const sPos=new Float32Array(N_RAN*3), sCol=new Float32Array(N_RAN*3), sVal=new Float32Array(N_RAN);
for(let j=0;j<N_RAN;j++){ const c=j*DOSPI/N_RAN, r=0.0945; sPos[j*3]=r*Math.cos(c); sPos[j*3+1]=YM+r*Math.sin(c); sPos[j*3+2]=0.0022;
  const col=C_FASE[faseDeRanura(j)]; sCol[j*3]=col.r; sCol[j*3+1]=col.g; sCol[j*3+2]=col.b; }
gSim.setAttribute('position',new THREE.BufferAttribute(sPos,3));
gSim.setAttribute('aColor',new THREE.BufferAttribute(sCol,3));
gSim.setAttribute('aVal',new THREE.BufferAttribute(sVal,1).setUsage(THREE.DynamicDrawUsage));
const M_SIM=new THREE.ShaderMaterial({
  uniforms:{uPx:{value:600},uTam:{value:0.0105}},
  vertexShader:`attribute vec3 aColor; attribute float aVal; varying vec3 vC; varying float vV; uniform float uPx; uniform float uTam;
    void main(){ vC=aColor; vV=aVal; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_Position=projectionMatrix*mv; gl_PointSize=clamp(uTam*uPx/(-mv.z),4.0,34.0); }`,
  fragmentShader:`varying vec3 vC; varying float vV;
    void main(){ vec2 d=gl_PointCoord-0.5; float r=length(d), a=abs(vV); if(a<0.02) discard;
      float f;
      if(vV>0.0){ f=1.0-smoothstep(0.30,0.38,r); }
      else { vec2 q=vec2(d.x+d.y,d.x-d.y)*0.7071; float w=min(abs(q.x),abs(q.y)); f=(1.0-smoothstep(0.045,0.085,w))*(1.0-smoothstep(0.36,0.44,max(abs(q.x),abs(q.y)))); }
      float ring=smoothstep(0.38,0.46,r)*(1.0-smoothstep(0.46,0.5,r))*0.5;
      float al=(f+ring)*clamp(0.25+0.75*a*1.4,0.0,1.0); if(al<0.02) discard;
      gl_FragColor=vec4(mix(vC,vec3(1.0),0.35)*1.15,al); }`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
});
const SIMBOLOS=new THREE.Points(gSim,M_SIM); SIMBOLOS.frustumCulled=false; SIMBOLOS.renderOrder=4; scene.add(SIMBOLOS);

/* El brillo de las ranuras (la corriente de cada fase) y el tinte del hierro con la frecuencia. */
function pintaBrillos(){
  for(let x=0;x<3;x++){ const e=Math.max(clamp(Math.abs(FL.i[x])/PM.Imax,0,1.2),0.9*pulsoFase(x)); M_RANURA[x].emissive.copy(C_FASE[x]).multiplyScalar(0.75*e); }
  M_CAMPO.uniforms.uF.value.set(FL.F[0],FL.F[1]); M_CAMPO.uniforms.uA.value=(FL.activo&&GUIA.campoOn)?0.62:0;
  const sv=gSim.attributes.aVal.array; for(let j=0;j<N_RAN;j++) sv[j]=FL.vi[j]; gSim.attributes.aVal.needsUpdate=true;
}
/** La polaridad de cada polo del rotor (la falla del imán invertido da vuelta el polo 3). */
function pintaPolos(){
  for(const im of IMANES){ const norte=GUIA.fallaViva&&fault==='magnet'&&im.k===3?!im.base:im.base;
    if(im.norte!==norte){ im.norte=norte; const m=matIman(norte); im.malla.material=m; im.mat=m; } }
}

/* El montaje: cada pieza vuela de su cuna a su sitio. El vuelo se mide con el reloj de pared
   (no con los cuadros): aunque el equipo dibuje a pocos cuadros por segundo, la pieza aterriza
   a su hora y el orden de montaje no se atasca. */
const easeOutBack=x=>{ const c1=1.4,c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); };
const VUELO_MS=REDUCIDO?250:1050;
const listo=k=>KIT[k].instalada||(KIT[k].activa&&performance.now()-KIT[k].t0>=VUELO_MS);
function pasaMontaje(dt,t){
  for(const k of Object.keys(KIT)){
    const K=KIT[k], G=PZ[k];
    if(K.activa){ K.t=Math.min(1,(performance.now()-K.t0)/VUELO_MS); const e=easeOutBack(K.t);
      G.position.copy(K.pos).multiplyScalar(1-e); G.position.y+=Math.sin(Math.min(1,K.t*1.15)*Math.PI)*0.10*(1-K.t*0.3);
      if(K.t>=1){ K.activa=false; K.instalada=true; G.position.set(0,0,0); } }
    else if(!K.instalada){ G.position.copy(K.pos); if(K.bump>0){ K.bump=Math.max(0,K.bump-dt*2.2); G.position.y+=Math.sin(K.bump*Math.PI)*0.035; } }
    else G.position.set(0,0,0);
    const sig=K.instalada||K.activa?false:(nextRequired()===k);
    K.aro.material.opacity=K.instalada||K.activa?0:(sig?0.38+0.28*Math.sin(t*3.2):0.10);
    K.aro.visible=!(K.instalada||K.activa); K.pad.visible=!K.instalada;
  }
  // los imanes: vuelan de afuera hacia su bolsillo (una estela luminosa que se dibuja por encima de todo)
  for(const im of IMANES){
    if(im.vuelo){ const u=Math.min(1,(performance.now()-im.vuelo.t0)/(REDUCIDO?200:650)), e=1-Math.pow(1-u,3), c=FASE0+im.k*PASO_POL;
      const d=(1-e)*0.20; im.malla.position.set(Math.cos(c)*d,Math.sin(c)*d,0); im.malla.visible=true;
      im.estela.visible=u<1; im.estela.position.set(Math.cos(c)*d,Math.sin(c)*d,0.0016); im.estela.material.opacity=0.85*(1-u);
      if(u>=1){ im.vuelo=null; im.malla.position.set(0,0,0); im.instalado=true; im.estela.visible=false; } }
    else im.malla.visible=im.instalado;
    FANTASMAS[im.k].visible=!im.instalado&&!im.vuelo&&GUIA.fantasmas;
    FANTASMAS[im.k].material.opacity=0.30+0.22*Math.sin(t*3.2+im.k);
  }
}
for(const im of IMANES){
  const g=fus(POLOS[im.k].bolsillo.map(b=>new THREE.ShapeGeometry(new THREE.Shape(b.map(p=>new THREE.Vector2(p[0],p[1]))),2)));
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:im.base?'#6f9bff':'#ff7a8c',transparent:true,opacity:0,depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide}));
  m.renderOrder=6; m.visible=false; ROTOR.add(m); im.estela=m;
}

/* Un cuadro de la escena. dtS: tiempo SIMULADO (s); dtR: tiempo de pantalla. */
function aplicaEscena(dtS,dtR,t){
  actualizaOperacion(dtR);
  const op=SIMU.op;
  if(op&&KIT.rotor.instalada){ SIMU.thM=(SIMU.thM+GUIA.sentido*op.wm*dtS)%(DOSPI*1000); }
  SIMU.t+=dtS;
  evalua();
  ROTOR.rotation.z=SIMU.thM%DOSPI;
  pintaPolos();
  pintaBrillos();
  M_AGUA.uniforms.uT.value=EST.pausa?M_AGUA.uniforms.uT.value:M_AGUA.uniforms.uT.value+dtR;
  if(op&&!EST.pausa){ SIMU.tHist+=dtR; if(SIMU.tHist>0.05){ SIMU.tHist=0; SIMU.hist.push([op.id,op.iq]); if(SIMU.hist.length>90) SIMU.hist.shift(); } }
  pasaMontaje(dtR,t);
}


/* ===================== 9. CÁMARAS ENCAJADAS EN EL HUECO LIBRE ===================== */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function encaja(t,dir,pts,caja,margen=0){
  if(margen){ const mx=(caja.x1-caja.x0)*margen, my=(caja.y1-caja.y0)*margen; caja={x0:caja.x0+mx,x1:caja.x1-mx,y0:caja.y0+my,y1:caja.y1-my}; }
  const cam=camera.clone(), W=innerWidth, H=innerHeight, tan=Math.tan(cam.fov*Math.PI/360);
  cam.aspect=W/H; cam.updateProjectionMatrix();
  const cw=caja.x1-caja.x0, ch=caja.y1-caja.y0, cx=(caja.x0+caja.x1)/2, cy=(caja.y0+caja.y1)/2;
  let dist=3; const q=new THREE.Vector3(), der=new THREE.Vector3(), arr=new THREE.Vector3(); t=t.clone(); dir=dir.clone().normalize();
  for(let it=0;it<10;it++){
    cam.position.copy(t).addScaledVector(dir,dist); cam.lookAt(t); cam.updateMatrixWorld();
    let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9;
    for(const p of pts){ q.copy(p).project(cam); const sx=(q.x+1)/2*W, sy=(1-q.y)/2*H;
      a0=Math.min(a0,sx); a1=Math.max(a1,sx); b0=Math.min(b0,sy); b1=Math.max(b1,sy); }
    const k=Math.max((a1-a0)/cw,(b1-b0)/ch), wpp=2*tan*dist/H;
    der.setFromMatrixColumn(cam.matrixWorld,0); arr.setFromMatrixColumn(cam.matrixWorld,1);
    t.addScaledVector(der,((a0+a1)/2-cx)*wpp).addScaledVector(arr,-((b0+b1)/2-cy)*wpp);
    dist*=k;
  }
  return [t.clone().addScaledVector(dir,dist),t];
}
const caja3=(x0,y0,z0,x1,y1,z1)=>{ const r=[]; for(const x of [x0,x1]) for(const y of [y0,y1]) for(const z of [z0,z1]) r.push(V3(x,y,z)); return r; };
const VISTA={actual:'conjunto'};
function vistaCam(v){
  const H=huecoLibre(), cen=pts=>new THREE.Box3().setFromPoints(pts).getCenter(new THREE.Vector3());
  if(v==='estator'){ const p=caja3(-0.140,YM+0.020,-0.01,0.020,YM+0.145,0); return encaja(cen(p),V3(0.05,0.10,1),p,H,0.03); }
  if(v==='rotor'){ const p=caja3(-0.088,YM-0.088,-0.02,0.088,YM+0.088,0); return encaja(cen(p),V3(0.16,0.12,1),p,H,0.04); }
  if(v==='camisa'){ const p=caja3(0.060,YM-0.062,-0.12,0.160,YM+0.062,0); return encaja(cen(p),V3(0.70,0.22,1),p,H,0.04); }
  if(v==='rodamiento'){ const p=caja3(-0.075,YM-0.075,-0.240,0.075,YM+0.060,-0.160); return encaja(cen(p),V3(-0.55,0.42,-1),p,H,0.05); }
  if(v==='armado'){ const p=caja3(-0.58,0,-0.60,0.58,YM+0.10,0.02); return encaja(cen(p),V3(0.14,1.05,1),p,H,0.02); }
  const p=caja3(-0.175,0,-0.100,0.175,YM+0.200,0);
  return encaja(cen(p),V3(0.36,0.30,1),p,H,0.05);
}
const CAMT={on:false};
function ponVista(v,dur){
  VISTA.actual=v; const [p,t]=vistaCam(v);
  Object.assign(CAMT,{on:true,u:0,dur:dur===undefined?(REDUCIDO?0.001:1.2):dur,p0:camera.position.clone(),t0:controls.target.clone(),p1:p,t1:t});
  pintaBarras();
}
function pasaCam(dt){
  if(!CAMT.on) return;
  CAMT.u=Math.min(1,CAMT.u+dt/Math.max(CAMT.dur,1e-3)); const e=ease(CAMT.u);
  camera.position.lerpVectors(CAMT.p0,CAMT.p1,e); controls.target.lerpVectors(CAMT.t0,CAMT.t1,e);
  if(CAMT.u>=1) CAMT.on=false;
}

    <div class="cg"><div class="cl"><div>Par pedido</div><b id="vT">${fN(EST.Tped,0)} N·m</b></div><input type="range" id="rT" min="0" max="${PM.Tlim}" step="5" value="${EST.Tped}" aria-label="Par pedido en newton metro">
      <div class="marcas"><span>0</span><span class="lim">${PM.Tlim}</span></div></div>
    <div class="cg"><div class="cl">Estrategia de corriente</div><div class="seg" id="segE"><button class="b ${EST.estr==='mtpa'?'on':''}" data-e="mtpa">MTPA</button><button class="b ${EST.estr==='id0'?'on':''}" data-e="id0">sólo imanes · id = 0</button></div></div>
    <div class="fila"><button class="b ${EST.barrido?'on':''}" id="btnSw">${EST.barrido?'⏸ Barrido de velocidad':'↻ Barrido de velocidad'}</button><button class="b auto" id="btnAuto">Recorrido guiado</button></div></div>`;
  } else h+=htmlGuia();
  h+=`<div class="hdet"><details id="dEc"><summary>Ecuaciones</summary><div class="cuerpo">
    <div class="fl">Se mira el motor desde el rotor (transformada de Park): la corriente es (<i>i</i><sub>d</sub>, <i>i</i><sub>q</sub>) y el flujo de los imanes ψ<sub>m</sub> queda sobre el eje d.</div>
    <div class="formula">v<sub>d</sub> = R·i<sub>d</sub> − ω<sub>e</sub>·L<sub>q</sub>·i<sub>q</sub><br>v<sub>q</sub> = R·i<sub>q</sub> + ω<sub>e</sub>·(L<sub>d</sub>·i<sub>d</sub> + ψ<sub>m</sub>)<br>T = 3/2·p·[ψ<sub>m</sub>·i<sub>q</sub> + (L<sub>d</sub> − L<sub>q</sub>)·i<sub>d</sub>·i<sub>q</sub>]</div>
    <div class="fl">El primer término del par es el de los <b>imanes</b>; el segundo, el de <b>reluctancia</b>: como L<sub>q</sub> &gt; L<sub>d</sub>, una <i>i</i><sub>d</sub> negativa lo hace positivo.</div>
    <div class="fl"><b>MTPA</b> (máximo par por amperio), con ΔL = L<sub>q</sub> − L<sub>d</sub>: <span class="formula" style="display:inline-block;margin:2px 0">i<sub>d</sub> = ψ<sub>m</sub>/(4ΔL) − √(ψ<sub>m</sub>²/(16ΔL²) + I²/2)</span></div>
    <div class="fl"><b>Límites.</b> Corriente: <i>i</i><sub>d</sub>² + <i>i</i><sub>q</sub>² ≤ I<sub>máx</sub>² (círculo de 450 A). Tensión: |v| ≤ V<sub>dc</sub>/√3 = 202 V, una <b>elipse</b> centrada en (−ψ<sub>m</sub>/L<sub>d</sub>, 0) que se encoge al subir ω<sub>e</sub>.</div>
    <div class="fl"><b>Debilitamiento de campo.</b> Pasado el codo (320 N·m × ω = 110 kW), el punto resbala por la elipse con <i>i</i><sub>d</sub> más negativa: menos flujo, menos par, y la potencia casi no cae.</div>
    <div class="fl">Potencia útil = T·ω<sub>m</sub> − pérdidas mecánicas; entrada = T·ω<sub>m</sub> + 3/2·R·I² + P<sub>hierro</sub>. ω<sub>e</sub> = p·ω<sub>m</sub>, f = n·P/120.</div>
  </div></details>
  <details id="dSim"><summary>Simplificaciones</summary><div class="cuerpo"><ul class="no">
    <li>L<sub>d</sub>, L<sub>q</sub> y ψ<sub>m</sub> constantes: sin saturación del hierro ni efecto de la temperatura en los imanes. Valores representativos de un motor de 110 kW, no de uno concreto.</li>
    <li>Sin armónicos espaciales ni par de cogging: con corrientes senoidales el par instantáneo es constante. La fase abierta es exacta en el modelo dq; el imán invertido es un hueco de par cualitativo.</li>
    <li>El bus de 350 V y el inversor son ideales: |v| ≤ V<sub>dc</sub>/√3 (SVPWM). Las pérdidas del hierro y las mecánicas son un modelo agrupado, no medido.</li>
    <li>La cámara lenta es de pantalla: el rotor gira ω<sub>m</sub>·escala. El anillo de color es la fuerza magnetomotriz de las tres corrientes (esquema), no el campo calculado con elementos finitos.</li>
    <li>La camisa de agua es de canal helicoidal: en el corte se ve como un anillo. Las cabezas de bobina y el rodamiento son esquemáticos.</li>
  </ul><div class="src">Pillay y Krishnan, <i>Modeling, simulation and analysis of PM motor drives</i> · Morimoto et al., MTPA y debilitamiento de campo en IPM · Soong y Miller, «Field-weakening in IPM machines» · IEC 60034-2-1.</div></div></details></div>`;
  H.innerHTML=h; H.classList.toggle('guia',EST.modo!=='marcha'); enlazaHUD(); ajustaHoja();
}

const FUENTE="'Outfit',system-ui,sans-serif";
function lienzo(id){ const box=el(id), c=box.querySelector('canvas'); return {box,c,ctx:c.getContext('2d'),w:0,h:0,dpr:1}; }
function abre(L){ const r=L.box.getBoundingClientRect(), dpr=Math.min(3,window.devicePixelRatio||1);
  const w=Math.max(20,Math.round(r.width)), h=Math.max(20,Math.round(r.height));
  if(L.w!==w||L.h!==h||L.dpr!==dpr){ L.c.width=Math.round(w*dpr); L.c.height=Math.round(h*dpr); L.w=w; L.h=h; L.dpr=dpr; }
  const x=L.ctx; x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h); return x; }
function txt(x,t,px,py,col,size,align,peso){ x.fillStyle=col; x.font=(peso||'600')+' '+(size||11)+'px '+FUENTE; x.textAlign=align||'left'; x.textBaseline='alphabetic'; x.fillText(t,px,py); }
function raya(x,x1,y1,x2,y2,col,w,dash){ x.strokeStyle=col; x.lineWidth=w||1; x.setLineDash(dash||[]); x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke(); x.setLineDash([]); }
function aro(x,cx,cy,r,col,w,dash){ x.strokeStyle=col; x.lineWidth=w||1; x.setLineDash(dash||[]); x.beginPath(); x.arc(cx,cy,r,0,DOSPI); x.stroke(); x.setLineDash([]); }
function flecha(x,x0,y0,x1,y1,col,w){ const a=Math.atan2(y1-y0,x1-x0), L=Math.hypot(x1-x0,y1-y0), hd=Math.min(7,L*0.4);
  x.strokeStyle=col; x.fillStyle=col; x.lineWidth=w; x.beginPath(); x.moveTo(x0,y0); x.lineTo(x1-Math.cos(a)*hd*0.7,y1-Math.sin(a)*hd*0.7); x.stroke();
  if(L>2){ x.beginPath(); x.moveTo(x1,y1); x.lineTo(x1-Math.cos(a-0.42)*hd,y1-Math.sin(a-0.42)*hd); x.lineTo(x1-Math.cos(a+0.42)*hd,y1-Math.sin(a+0.42)*hd); x.closePath(); x.fill(); } }
const LPL=lienzo('gPl'), LTN=lienzo('gTn'), LVU=lienzo('gVu');
const COLF=['#FF8A3D','#37E0C7','#6FB6FF'];

/* El plano de corriente: lo que el motor puede hacer es la intersección del círculo de corriente
   y de la elipse de tensión; la MTPA es la mejor curva de abajo; el punto de operación viaja. */
function pintaPlano(){
  const L=LPL, x=abre(L), W=L.w, Hh=L.h, op=SIMU.op, I=PM.Imax;
  const X0=-I*1.16, X1=I*0.13, Y0=-I*0.08, Y1=I*1.12, mL=27, mR=8, mT=8, mB=17;
  const s=Math.min((W-mL-mR)/(X1-X0),(Hh-mT-mB)/(Y1-Y0)), pw=s*(X1-X0), ph=s*(Y1-Y0), cx0=mL+(W-mL-mR-pw)/2, cy1=Hh-mB-(Hh-mT-mB-ph)/2;
  const PX=a=>cx0+(a-X0)*s, PY=b=>cy1-(b-Y0)*s;
  x.save(); x.beginPath(); x.rect(cx0,cy1-ph,pw,ph); x.clip();
  // rejilla cada 100 A
  for(let a=-500;a<=0;a+=100) raya(x,PX(a),cy1-ph,PX(a),cy1,'rgba(143,179,172,0.07)');
  for(let b=0;b<=500;b+=100) raya(x,cx0,PY(b),cx0+pw,PY(b),'rgba(143,179,172,0.07)');
  // la región factible: dentro del círculo y de la elipse
  const el_=op?elipse(op.we):null;
  x.save(); x.beginPath(); x.arc(PX(0),PY(0),I*s,0,DOSPI); x.clip();
  if(el_){ x.beginPath(); el_.pts.forEach(([a,b],k)=>k?x.lineTo(PX(a),PY(b)):x.moveTo(PX(a),PY(b))); x.closePath(); x.fillStyle='rgba(79,209,197,0.085)'; x.fill(); }
  else { x.fillStyle='rgba(79,209,197,0.04)'; x.fillRect(cx0,cy1-ph,pw,ph); }
  // curvas de par constante
  for(const T of [80,160,240,320]){ x.strokeStyle='rgba(180,200,196,0.22)'; x.lineWidth=1; x.beginPath(); let ini=false;
    for(let a=X0;a<=0.5;a+=6){ const d=1.5*PM.p*(PM.psi+(PM.Ld-PM.Lq)*a); if(d<=1e-6) continue; const b=T/d; if(b>Y1) continue; const px=PX(a), py=PY(b); ini?x.lineTo(px,py):x.moveTo(px,py); ini=true; } x.stroke(); }
  x.restore();
  // ejes
  raya(x,PX(0),cy1-ph,PX(0),cy1,'rgba(200,214,210,0.45)',1); raya(x,cx0,PY(0),cx0+pw,PY(0),'rgba(200,214,210,0.45)',1);
  // el círculo de corriente
  x.strokeStyle='rgba(255,183,3,0.85)'; x.lineWidth=1.5; x.setLineDash([5,3]); x.beginPath(); x.arc(PX(0),PY(0),I*s,0,DOSPI); x.stroke(); x.setLineDash([]);
  // la elipse de tensión
  if(el_){ x.strokeStyle='rgba(199,155,255,0.95)'; x.lineWidth=1.6; x.beginPath(); el_.pts.forEach(([a,b],k)=>k?x.lineTo(PX(a),PY(b)):x.moveTo(PX(a),PY(b))); x.stroke();
    if(el_.centro[0]>X0){ const cxp=PX(el_.centro[0]), cyp=PY(el_.centro[1]); raya(x,cxp-3,cyp,cxp+3,cyp,'rgba(199,155,255,0.9)'); raya(x,cxp,cyp-3,cxp,cyp+3,'rgba(199,155,255,0.9)'); } }
  // la MTPA
  x.strokeStyle='rgba(255,255,255,0.88)'; x.lineWidth=1.5; x.beginPath(); for(let k=0;k<=60;k++){ const [a,b]=mtpaDeI(I*k/60); k?x.lineTo(PX(a),PY(b)):x.moveTo(PX(a),PY(b)); } x.stroke();
  // la estela del punto
  if(SIMU.hist.length>2){ const h=SIMU.hist; for(let k=1;k<h.length;k++){ x.strokeStyle='rgba(255,226,140,'+(0.08+0.55*k/h.length).toFixed(3)+')'; x.lineWidth=1.8; x.beginPath(); x.moveTo(PX(h[k-1][0]),PY(h[k-1][1])); x.lineTo(PX(h[k][0]),PY(h[k][1])); x.stroke(); } }
  x.restore();
  // marcos y rótulos
  x.strokeStyle='rgba(143,179,172,0.35)'; x.lineWidth=1; x.strokeRect(cx0+0.5,cy1-ph+0.5,pw-1,ph-1);
  for(let a=-400;a<=0;a+=200) txt(x,fN(a),PX(a),cy1+11,'#6f8a85',8.5,'center','500');
  for(let b=200;b<=400;b+=200) txt(x,fN(b),cx0-3,PY(b)+3,'#6f8a85',8.5,'right','500');
  txt(x,'i_d (A)',cx0+pw-2,PY(0)-4,'#8fb3ac',9,'right','600'); txt(x,'i_q (A)',PX(0)+4,cy1-ph+10,'#8fb3ac',9,'left','600');
  txt(x,'450 A',PX(0)-I*s*0.71+2,PY(0)-I*s*0.71+10,'#c99a3a',8.5,'left','600');
  if(!op){ txt(x,'motor parado: sin corriente',cx0+pw/2,cy1-ph/2,'#7f9893',10.5,'center','600'); el('t_pl').textContent=''; return; }
  // el punto de operación: su vector, sus componentes y el punto
  const px=PX(op.id), py=PY(op.iq), col=COL_MODO[op.modo]||'#fff';
  raya(x,px,py,px,PY(0),'rgba(255,226,140,0.55)',1,[3,2]); raya(x,px,py,PX(0),py,'rgba(255,226,140,0.55)',1,[3,2]);
  flecha(x,PX(0),PY(0),px,py,'rgba(255,209,102,0.95)',1.8);
  x.fillStyle='#fff'; x.beginPath(); x.arc(px,py,4.2,0,DOSPI); x.fill(); aro(x,px,py,7.2,col,2);
  el('t_pl').textContent=NOM_MODO[op.modo]||'';
}

  x.strokeStyle='#FFB703'; x.lineWidth=1.6; x.beginPath(); E.rpm.forEach((r,k)=>{ k?x.lineTo(PX(r),YP(E.P[k])):x.moveTo(PX(r),YP(E.P[k])); }); x.stroke();

/* Una vuelta eléctrica de las tres corrientes (arriba) y el par instantáneo en una vuelta del rotor (abajo). */
const VU={clave:'',tr:null};
function trazasVu(op){
  const fa=fallaActiva(), viva=fa.f, N=180, ia=[],ib=[],ic=[],T=[];
  for(let k=0;k<=N;k++){ const th=k/N*DOSPI; let [a,b,c]=fasesDe(op.id,GUIA.sentido*op.iq,GUIA.sentido*th); if(viva==='phase'){ const q=(a-c)/2; a=q; b=0; c=-q; } ia.push(a); ib.push(b); ic.push(c);
    T.push(parInstante(op.id,op.iq,th*PM.p,th,viva,fa.k)); }
  return {ia,ib,ic,T,viva};
}
function pintaVu(){
  const L=LVU, x=abre(L), W=L.w, Hh=L.h, op=SIMU.op;
  if(!op){ txt(x,'motor parado',W/2,Hh/2,'#7f9893',10.5,'center','600'); return; }
  const fa=fallaActiva(), fv=(fa.f||'')+fa.k+'|'+GUIA.sentido;
  const clave=SIMU.clave+'|'+fv; if(clave!==VU.clave||!VU.tr){ VU.tr=trazasVu(op); VU.clave=clave; }
  const tr=VU.tr, X0=24, X1=W-8, an=X1-X0, h1=Math.max(22,(Hh-6)*0.56), y1a=4, y1b=y1a+h1, y2a=y1b+9, y2b=Hh-11;
  const Xp=f=>X0+f*an, Yi=i=>y1a+h1/2-(i/PM.Imax)*h1/2*0.95;
  raya(x,X0,Yi(0),X1,Yi(0),'rgba(143,179,172,0.18)');
  [tr.ia,tr.ib,tr.ic].forEach((arr,f)=>{ x.strokeStyle=COLF[f]; x.lineWidth=1.4; x.beginPath(); arr.forEach((v,k)=>{ const px=Xp(k/180), py=Yi(v); k?x.lineTo(px,py):x.moveTo(px,py); }); x.stroke(); });
  const tmax=Math.max(1,...tr.T)*1.08, tmin=Math.min(0,...tr.T), Yt=t=>y2b-(t-tmin)/(tmax-tmin)*(y2b-y2a);

/** La hoja mide lo que pide su contenido (entre 240 px y el 62 % del alto en el
    móvil), para que la guía nunca tenga que desplazarse por dentro; la cámara se
    vuelve a encajar en el hueco que queda. Los instrumentos usan la altura base
    (en el móvil, el 60 % del alto, para que el hexágono y el periodo se lean). */
function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.47:0.43),240,450));
  let hh=base; const hud=el('hud');
  if(movil&&b.classList.contains('t-panel')) hh=Math.round(clamp(H*0.6,240,560));
  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;
    hh=Math.round(clamp(pide,240,Math.max(base,H*(movil?0.62:0.56)))); }
  const ant=parseFloat(b.style.getPropertyValue('--hojaH'))||0;
  if(Math.abs(ant-hh)>1){ b.style.setProperty('--hojaH',hh+'px'); colocaBarras();

}
