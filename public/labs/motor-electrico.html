function montaTodo(){
  for(const k of PIECE_ORDER){ Object.assign(KIT[k],{instalada:true,activa:false,t:0,bump:0}); PZ[k].position.set(0,0,0); }
  for(const im of IMANES){ im.base=im.k%2===0; im.instalado=true; im.vuelo=null; im.malla.visible=true; im.malla.position.set(0,0,0); }
  GUIA.fantasmas=false;
}
function startPhase1(){
  GUIA.phase=0; GUIA.iniciado=true; GUIA.running=false; GUIA.fOk=false; GUIA.rpm=0; GUIA.magIndex=0; GUIA.poloMal=-1; GUIA.sentido=1; fault=null;
  for(const k of PIECE_ORDER){ Object.assign(KIT[k],{instalada:false,activa:false,t:0,bump:0}); PZ[k].position.copy(KIT[k].pos); }
  for(const im of IMANES){ im.base=im.k%2===0; im.instalado=false; im.vuelo=null; im.malla.visible=false; }
  GUIA.fantasmas=false;
  BANDEJAS.visible=true; ponVista('armado');
  step_estator();
}
const pasoA=(p)=>{ GUIA.paso=p; if(EST.modo==='guia') pintaHUD(); };
function step_estator(){ pasoA('estator'); if(autoMode) setTimeout(()=>{ if(!KIT.estator.instalada&&!KIT.estator.activa) handleAction('place-stator',null); },1900); }
function step_rotor(){ pasoA('rotor'); if(autoMode) setTimeout(()=>{ if(!KIT.rotor.instalada&&!KIT.rotor.activa) handleAction('place-rotor',null); },1900); }
function step_imanes(){ pasoA('imanes'); GUIA.fantasmas=true; ponVista('rotor');
  if(autoMode){ const auto=()=>{ if(GUIA.paso==='imanes'&&GUIA.magIndex<N_POL){ placeNextMagnet(); setTimeout(auto,650);} }; setTimeout(auto,1500); } }
function step_fases(){ pasoA('fases'); GUIA.fantasmas=false; ponVista('conjunto'); if(autoMode) setTimeout(()=>{ if(GUIA.paso==='fases') handleAction('phase-abc',null); },1900); }
/** Un pulso de corriente recorre cada fase en el orden elegido (no sólo un botón abstracto). */
function animateWiring(order){ order.forEach((ph,i)=>setTimeout(()=>GUIA.pulsos.push({ph,t0:performance.now()}),i*460)); }
const pulsoFase=ph=>{ const ahora=performance.now(); let m=0; for(const p of GUIA.pulsos){ const u=(ahora-p.t0)/520; if(p.ph===ph&&u>=0&&u<=1) m=Math.max(m,Math.sin(u*Math.PI)); } GUIA.pulsos=GUIA.pulsos.filter(p=>ahora-p.t0<700); return m; };
function finishPhase1(){
  feedback('good','¡Motor armado! 🎉','Construiste un PMSM completo: estátor de 48 ranuras, rotor de 8 polos con imanes enterrados en V y conexión trifásica. Ahora vas a hacerlo girar usando física real.',true);
  setTimeout(()=>startPhase2(),1200);
}
/* ---- los imanes: cada polo (dos imanes en V) vuela desde afuera hasta su bolsillo ---- */
function placeNextMagnet(forced){
  if(GUIA.magIndex>=N_POL) return;
  const k=GUIA.magIndex, wantNorth=k%2===0, isNorth=forced===undefined?wantNorth:(forced==='north');
  const im=IMANES[k]; im.base=isNorth; im.norte=isNorth; im.malla.material=matIman(isNorth); im.vuelo={t0:performance.now()}; im.instalado=false; im.malla.visible=true; sonido.clac();
  if(forced!==undefined&&isNorth!==wantNorth){
    if(GUIA.poloMal<0) GUIA.poloMal=k;
    feedback('bad','Polaridad incorrecta','Este polo debía ser '+(wantNorth?'Norte':'Sur')+' para alternar con el anterior. Mira cómo queda en el rotor: dos polos iguales seguidos. El campo del estátor no puede arrastrarlos de forma coherente y, en un motor real, esto causa vibración y pérdida de par. Puedes seguir, pero el par tendrá un hueco por vuelta.',true);
  } else if(k>0){
    feedback('good','Polaridad correcta','Alternaste bien: '+(isNorth?'Norte':'Sur')+' después de '+(!isNorth?'Norte':'Sur')+'. Así el rotor presenta polos que el campo rotatorio puede arrastrar.');
  }
  GUIA.magIndex++;
  const mc=el('magCount'); if(mc) mc.textContent=GUIA.magIndex+' / 8';
  if(GUIA.magIndex>=N_POL){
    const todoBien=IMANES.every(q=>q.base===(q.k%2===0));
    if(todoBien) feedback('good','¡8 polos correctos!','Rotor completo con polaridad perfectamente alternada N-S-N-S-N-S-N-S. Listo para conectar las fases.');
    else feedback('bad','Rotor con polos mal alternados','Colocaste los 8 polos pero algunos quedaron con polaridad repetida. El motor girará de forma irregular: el par tiene un hueco cada vuelta. Para el laboratorio puedes continuar, pero un rotor real así produciría menos par y más vibración.');
    setTimeout(()=>step_fases(),1400);
  }
}

/* ---------- Fase 2: el fundamento ---------- */
function startPhase2(){ GUIA.phase=1; BANDEJAS.visible=false; GUIA.fantasmas=false; ponVista('conjunto'); challenge1(); }
function challenge1(){ pasoA('frecuencia'); }
function challenge2(){ GUIA.opcOrden=shuffledM(['more','less','swap','open']); pasoA('polos'); }
function challenge3(){
  GUIA.running=true; GUIA.rpm=0; GUIA.rpmObj=0; GUIA.toP3=false; EST.pausa=false; GUIA.campoOn=true; pasoA('girar'); ponVista('conjunto');
}
function eligePolos(k){
  const caso=POLOS_CASOS[poloCaso];
  RETO_M.intentos++;
  if(k===caso.ok){
    RETO_M.fallos2=0;
    feedback('good','Correcto ✓', k==='more'
      ?'Más polos = más par a la misma corriente, porque cada par de polos aporta par. El costo: mayor frecuencia eléctrica para la misma velocidad y, por tanto, menor velocidad máxima. Por eso los motores de rueda (in-wheel) usan muchos polos: mucho par, baja velocidad.'
      :'Menos polos exigen menos frecuencia eléctrica para la misma velocidad, así que el motor alcanza más rpm antes de topar con el límite del hierro, a cambio de menos par.');
    setTimeout(()=>challenge3(),1500);
  } else {
    RETO_M.fallos2++;
    if(RETO_M.fallos2>=3){
      RETO_M.fallos2=0; RETO_M.resiembras++; poloCaso=(poloCaso+1)%POLOS_CASOS.length;
      feedback('bad','Tres intentos fallidos','Cambia el requisito del diseño: lee el nuevo enunciado.');
      setTimeout(()=>challenge2(),1400);
    } else {
      feedback('bad','No cumple el requisito','Esa modificación no resuelve el compromiso entre par y velocidad máxima que pide el enunciado. (intentos fallidos: '+RETO_M.fallos2+'/3)');
      if(EST.modo==='guia') pintaHUD();
    }
  }
}
function checkCalc1(){
  const raw=String((el('ans1')||{}).value||'').trim().replace(/\s| /g,'').replace(',','.');
  const v=parseFloat(raw), correct=feDe(rpmObjetivo);
  if(isNaN(v)){ feedback('bad','Escribe un número','Ingresa tu cálculo de la frecuencia en Hz (con coma o punto decimal).'); return; }
  RETO_M.intentos++;
  if(Math.abs(v-correct)<1){
    RETO_M.fallos1=0; GUIA.fOk=true;
    feedback('good','¡Correcto! ✓',`f = ${fN(rpmObjetivo,0)} × ${PM.polos} / 120 = <b>${fN(correct,0)} Hz</b>. Esa es la frecuencia que el inversor debe generar para girar a ${fN(rpmObjetivo,0)} rpm con ${PM.polos} polos. A más polos, más frecuencia para la misma velocidad.`);
    sonido.bien(); setTimeout(()=>challenge2(),1600);
  } else {
    RETO_M.fallos1++; sonido.mal();
    const diff=v>correct?'alto':'bajo';
    if(RETO_M.fallos1>=3){
      RETO_M.fallos1=0; RETO_M.resiembras++;
      const p=rpmObjetivo; do{ rpmObjetivo=pickOne(RPM_CASOS); }while(rpmObjetivo===p);
      feedback('bad','Tres intentos fallidos','El variador debe llevar el motor a OTRA velocidad: vuelve a plantear el cálculo con el nuevo valor.');
      setTimeout(()=>challenge1(),1500);
    } else {
      feedback('bad','Revisa el cálculo',`Tu resultado (${fN(v,v%1?1:0)} Hz) está ${diff}. Revisa cómo entran las rpm y el número de polos. (intentos fallidos: ${RETO_M.fallos1}/3)`);
      const t=el('d_try1'); if(t) t.textContent=RETO_M.fallos1;
    }
  }
}

/* ---------- Fase 3: el diagnóstico ---------- */
function startPhase3(){
  GUIA.phase=2; GUIA.running=true; GUIA.campoOn=true;
  fault=pickOne(['phase','magnet','overspeed']);
  aplicaFalla(fault);
  GUIA.sintoma=''; pasoA('dx'); ponVista('conjunto');
  setTimeout(()=>{ GUIA.sintoma=symptomText(fault); const s=el('symptomTask'); if(s){ s.innerHTML=GUIA.sintoma; ajustaHoja(); } },800);
}
function aplicaFalla(f){ GUIA.rpmObj=f==='overspeed'?PM.rpmMax*1.05:PM.rpmMax*0.5; GUIA.rpm=GUIA.rpmObj; }
function symptomText(f){
  if(f==='phase') return 'SÍNTOMA: el motor vibra, gira con tirones y le falta par. En el dock, una de las tres corrientes es una línea plana y el par oscila dos veces por ciclo. ¿Qué lo causa?';
  if(f==='magnet') return 'SÍNTOMA: hay una zona donde el giro «tropieza» cada vuelta y se siente un golpeteo: en el dock, el par se hunde una vez por vuelta del rotor, y en la sección dos polos seguidos tienen el mismo color. ¿Qué lo causa?';
  if(f==='overspeed') return 'SÍNTOMA: la frecuencia eléctrica supera los 700 Hz y el hierro se sobrecalienta. ¿Qué lo causa?';
}
function revertFalla(f){ if(f==='overspeed'||true){ GUIA.rpmObj=PM.rpmMax*0.5; } }
function diagnose(choice){
  if(!fault) return;
  const correct=(choice===fault);
  RETO_M.intentos++;
  if(correct){
    RETO_M.fallosDx=0; sonido.bien();
    feedback('good','Diagnóstico correcto ✓', explainFault(fault)+' <b>Ahora corrígelo.</b>',true);
    pasoA('reparar');
  } else {
    RETO_M.fallosDx++; sonido.mal();
    if(RETO_M.fallosDx>=3){
      // tres fallos: el motor llega con OTRA falla (no se aprueba por eliminación)
      RETO_M.fallosDx=0; RETO_M.resiembras++;
      const prev=fault; revertFalla(prev);
      fault=pickOne(['phase','magnet','overspeed'].filter(x=>x!==prev));
      aplicaFalla(fault);
      feedback('bad','Tres intentos fallidos','El motor presenta ahora OTRA falla: vuelve a observar su comportamiento y la telemetría.',true);
      GUIA.sintoma=symptomText(fault); const s=el('symptomTask'); if(s) s.innerHTML=GUIA.sintoma;
      if(EST.modo==='guia') pintaHUD();
    } else {
      feedback('bad','No es esa la falla', 'Lo que elegiste ('+faultName(choice)+') produciría otro síntoma: '+wrongExplain(choice)+' Vuelve a observar el comportamiento y prueba otro diagnóstico. (intentos fallidos: '+RETO_M.fallosDx+'/3)',true);
      if(EST.modo==='guia') pintaHUD();
    }
  }
}
function explainFault(f){
  if(f==='phase') return 'Una fase abierta deja al motor con solo 2 de 3 corrientes, por eso el campo rotatorio queda incompleto: en lugar de girar, late; el par oscila al doble de la frecuencia, hay vibración, tirones y pérdida de par.';
  if(f==='magnet') return 'Un imán invertido rompe la secuencia N-S-N-S en un punto. Ahí el campo del estátor empuja en sentido contrario por un instante: el «tropiezo» cada vuelta.';
  if(f==='overspeed') return 'Por encima de la velocidad máxima, la frecuencia eléctrica rebasa el límite del acero laminado (≈700 Hz aquí) y las pérdidas en el hierro disparan la temperatura.';
}
function faultName(f){ return f==='phase'?'fase desconectada':f==='magnet'?'imán invertido':'sobrevelocidad'; }
function wrongExplain(f){
  if(f==='phase') return 'una fase abierta daría corriente desequilibrada y tirones constantes, no un golpeteo localizado.';
  if(f==='magnet') return 'un imán invertido daría un tropiezo en un punto fijo de cada vuelta, no un calentamiento general.';
  if(f==='overspeed') return 'la sobrevelocidad calienta el hierro por alta frecuencia, no produce desequilibrio de corriente.';
}
function repair(){
  const f=fault; revertFalla(f);
  fault=null; RETO_M.hecho=true; sonido.bien();
  feedback('good','¡Reparado! 🎉','El motor vuelve a operar correctamente. Completaste las tres fases: lo armaste, aplicaste la física para hacerlo girar, y diagnosticaste y corregiste una falla. Eso es el ciclo completo de un técnico en electromovilidad.',true);
  pasoA('completo');
}

/* ---------- el enrutador de acciones (la API de siempre) ---------- */
function handleAction(act,btn){
  switch(act){
    case 'place-stator':
      if(KIT.estator.instalada||KIT.estator.activa) break;
      installPiece('estator'); feedback('good','Estátor en camino','Obsérvalo trasladarse desde la mesa de piezas hasta el banco. El estátor con sus 48 ranuras se está asentando.');
      setTimeout(()=>step_rotor(),1150); break;
    case 'try-rotor-first':
      if(KIT.estator.instalada) break;
      attemptBump('rotor');
      feedback('bad','El rotor no puede ir primero','Lo intentaste mover, pero no encaja: el rotor gira DENTRO del estátor, y el estátor sigue en la mesa de piezas. Instala primero el estátor.'); break;
    case 'place-rotor':
      if(!listo('estator')||KIT.rotor.instalada||KIT.rotor.activa) break;
      installPiece('rotor'); feedback('good','Rotor en camino','El rotor se desliza dentro del estátor, dejando el entrehierro correcto.');
      setTimeout(()=>step_imanes(),1150); break;
    case 'mag-auto': if(GUIA.paso==='imanes') placeNextMagnet(); break;
    case 'mag-north': if(GUIA.paso==='imanes') placeNextMagnet('north'); break;
    case 'mag-south': if(GUIA.paso==='imanes') placeNextMagnet('south'); break;
    case 'phase-abc': if(GUIA.paso!=='fases') break; GUIA.sentido=1; animateWiring([0,1,2]); feedback('good','Secuencia A-B-C','Campo rotatorio en sentido horario. Observa el pulso recorriendo cada bobinado en orden — así fluye la corriente real.'); finishPhase1(); break;
    case 'phase-acb': if(GUIA.paso!=='fases') break; GUIA.sentido=-1; animateWiring([0,2,1]); feedback('bad','Secuencia A-C-B → giro invertido','Conectaste dos fases intercambiadas. El campo (y el motor) girará al REVÉS. Esto no daña el motor —de hecho así se invierte el giro a propósito— pero para esta máquina queríamos giro horario. Observa el pulso: recorre las bobinas en otro orden.'); setTimeout(()=>finishPhase1(),600); break;
    case 'check1': checkCalc1(); break;
    case 'hint1':
      if(RETO_M.pistas1===0){ RETO_M.pistas1=1; feedback('good','Pista 1 de 2','La frecuencia eléctrica depende de las rpm y del número de polos, no sólo de las vueltas por segundo: el campo da un ciclo completo cada vez que pasa un par de polos.'); }
      else if(RETO_M.pistas1===1){ RETO_M.pistas1=2; feedback('good','Pista 2 de 2','Es la relación de la forma f = n·P/120 (n en rpm, P en polos). Sustituye tus valores.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto.');
      break;
    case 'poles-more': eligePolos('more'); break;
    case 'poles-less': eligePolos('less'); break;
    case 'poles-swap': eligePolos('swap'); break;
    case 'poles-open': eligePolos('open'); break;
    case 'to-phase3': if(GUIA.phase!==1||GUIA.paso!=='girar') break; startPhase3(); break;
    case 'toggle-field': GUIA.campoOn=!GUIA.campoOn; if(btn){ btn.textContent='🧲 Campo magnético: '+(GUIA.campoOn?'ON':'OFF'); btn.classList.toggle('good',GUIA.campoOn); } break;
    case 'dx-phase': diagnose('phase'); break;
    case 'dx-magnet': diagnose('magnet'); break;
    case 'dx-overspeed': diagnose('overspeed'); break;
    case 'repair': if(GUIA.paso==='reparar') repair(); break;
    case 'restart': location.reload(); break;
  }
}

/* ---------- lo que la guía enseña en cada paso ---------- */
function contenidoGuia(){
  const tri=(n,v)=>`<span class="tries">intentos fallidos: <b id="${n}">${v}</b>/3</span>`;
  switch(GUIA.paso){
    case 'estator': return {no:'Fase 1 · Paso 1',head:'Mesa de piezas',title:'Instala el estátor',
      teach:`El <b>estátor</b> está sobre la mesa, a la izquierda, tal cual llegaría de fábrica con su bobinado trifásico ya hecho en las 48 ranuras. Es lo primero que se monta porque todo lo demás va dentro de él.<div class="why"><b>¿Por qué primero?</b> El estátor es la carcasa estructural. El rotor gira <b>dentro</b> de él, así que no puedes colocar el rotor antes que su alojamiento.</div><div class="task">Toca la pieza en la mesa, o usa el botón, para instalar el estátor.</div>`,
      acts:`<button class="b primary" data-act="place-stator"><span class="ic">⬇</span> Instalar estátor (48 ranuras)</button><button class="b" data-act="try-rotor-first"><span class="ic">⬇</span> Instalar rotor primero</button>`};
    case 'rotor': return {no:'Fase 1 · Paso 2',head:'Mesa de piezas',title:'Instala el rotor',
      teach:`El <b>rotor</b> espera a la derecha, con su eje ya integrado y los bolsillos vacíos. Va centrado dentro del estátor, dejando un pequeño <b>entrehierro</b>.<div class="why"><b>El entrehierro importa:</b> si fuera cero, rotor y estátor se rozarían; si fuera muy grande, el campo magnético se debilitaría. Aquí mide 1 mm.</div><div class="task">Toca el rotor en la mesa, o usa el botón, para insertarlo.</div>`,
      acts:`<button class="b primary" data-act="place-rotor"><span class="ic">⬇</span> Insertar rotor + eje</button>`};
    case 'imanes': return {no:'Fase 1 · Paso 3',head:'Imán a colocar',title:'Coloca los imanes: ¡cuidado con la polaridad!',
      teach:`El rotor necesita <b>8 polos</b>; cada uno son dos imanes en V que se abren hacia el entrehierro. Alterna <b style="color:#6f9bff">Norte</b> y <b style="color:#ff6b7f">Sur</b>. Cada polo vuela hasta el bolsillo que brilla.<div class="why"><b>¿Por qué alternar?</b> El campo rotatorio del estátor «jala» polos opuestos. Si pones dos polos iguales juntos, se repelen de forma incoherente y el motor no produce par neto. La alternancia N-S-N-S es lo que permite el giro.</div><div class="task">Coloca los 8 polos alternando polaridad. Usa los botones o toca el rotor.</div>`,
      acts:`<button class="b primary" data-act="mag-auto"><span class="ic">⊕</span> Colocar siguiente (alternado)</button><button class="b" data-act="mag-north"><span class="ic" style="color:#6f9bff">N</span> Forzar Norte</button><button class="b" data-act="mag-south"><span class="ic" style="color:#ff6b7f">S</span> Forzar Sur</button><div class="mini"><span>Polos colocados</span><b id="magCount">${GUIA.magIndex} / 8</b></div>`};
    case 'fases': return {no:'Fase 1 · Paso 4',head:'Secuencia de fases',title:'Conecta las 3 fases',
      teach:`El estátor se alimenta con corriente <b>trifásica</b>: tres bobinados (fase A, B, C) desfasados 120°. El <b>orden</b> de conexión define el sentido de giro.<div class="why"><b>Secuencia y giro:</b> conectar en orden <b>A-B-C</b> crea un campo que gira en un sentido. Si inviertes dos fases (<b>A-C-B</b>), el campo gira al revés y el motor también. Así se invierte el giro de un motor trifásico en la práctica.</div><div class="task">Conecta las fases en la secuencia correcta para giro horario.</div>`,
      acts:`<button class="b primary" data-act="phase-abc"><span class="ic">↻</span> Conectar A → B → C</button><button class="b" data-act="phase-acb"><span class="ic">↺</span> Conectar A → C → B</button>`};
    case 'frecuencia': return {no:'Fase 2 · Reto 1',head:'Tu cálculo',title:'Calcula la frecuencia eléctrica',
      teach:`Para que el motor gire a una velocidad, el variador (inverter) debe alimentar el estátor a la <b>frecuencia eléctrica</b> correcta. Este motor tiene <b>${PM.polos} polos</b>.<div class="task">¿Qué frecuencia (Hz) se necesita para girar a <b>${fN(rpmObjetivo,0)} rpm</b>? ${tri('d_try1',RETO_M.fallos1)}</div>`,
      acts:`<div class="calcrow"><input id="ans1" type="text" inputmode="decimal" autocomplete="off" placeholder="¿? Hz" aria-label="Frecuencia eléctrica en hercios"><button class="b primary" data-act="check1">✓ Comprobar</button></div><button class="pista" id="btnHint">¿Necesitas una pista? (máx. 2)</button>`};
    case 'polos': { const caso=POLOS_CASOS[poloCaso]; return {no:'Fase 2 · Reto 2',head:'Tu decisión',title:'Par contra velocidad: ¿qué se rediseña?',
      teach:`Tienes libertad de rediseñar el motor.<div class="task">${caso.req} ¿Qué haces? ${tri('d_try2',RETO_M.fallos2)}</div>`,
      acts:GUIA.opcOrden.map(k=>`<button class="b" data-act="poles-${k}">${POLOS_OPC[k]}</button>`).join('')}; }
    case 'girar': return {no:'Fase 2 · Reto 3',head:'Acelerador',title:'Haz girar el motor',
      teach:`Ahora controlas el acelerador, que comanda la velocidad. Observa cómo la <b>frecuencia eléctrica</b>, el <b>par</b> y la <b>potencia</b> cambian, todos calculados en vivo con el modelo dq.<div class="why"><b>Observa la transición:</b> hasta ${fN(SIMU.rpmBase,0)} rpm el par es constante (${PM.Tlim} N·m). Por encima entra «potencia constante»: el par baja y la potencia se mantiene cerca de 110 kW. En el plano de corriente, el punto resbala por la elipse.</div><div class="task">Lleva el motor por encima de ${fN(SIMU.rpmBase,0)} rpm y observa cómo cae el par mientras la potencia se mantiene.</div>`,
      acts:`<div class="sl">Velocidad comandada</div><input type="range" id="thr2" min="0" max="100" value="${Math.round(GUIA.rpmObj/PM.rpmMax*100)}" aria-label="Velocidad comandada">
        <div class="mini"><span>n</span><b id="d_rpm">0 rpm</b></div><div class="mini"><span>f eléctrica</span><b id="d_freq">0 Hz</b></div><div class="mini"><span>Par</span><b id="d_trq">0 N·m</b></div><div class="mini"><span>Potencia</span><b id="d_pow">0 kW</b></div>
        <button class="b good" data-act="toggle-field" id="fieldBtn">🧲 Campo magnético: ${GUIA.campoOn?'ON':'OFF'}</button>
        <button class="b primary" data-act="to-phase3" id="toP3" ${GUIA.rpmObj>SIMU.rpmBase+500?'':'disabled'}>Continuar al diagnóstico →</button>`};
    case 'dx': return {no:'Fase 3 · Diagnóstico',head:'¿Cuál es la falla?',title:'El motor llegó averiado',
      teach:`Un motor llega al taller con una falla. Observa su comportamiento (la sección, el campo y los instrumentos) e <b>identifica el problema</b>. Como técnico, primero diagnosticas, luego reparas.<div class="task" id="symptomTask">${GUIA.sintoma||'Observa el síntoma y selecciona el diagnóstico correcto.'}</div><span class="tries">intentos fallidos: ${RETO_M.fallosDx}/3</span>`,
      acts:`<button class="b" data-act="dx-phase"><span class="ic">⚡</span> Una fase desconectada</button><button class="b" data-act="dx-magnet"><span class="ic">🧲</span> Un imán invertido</button><button class="b" data-act="dx-overspeed"><span class="ic">🔥</span> Sobrevelocidad (sobre límite)</button>`};
    case 'reparar': return {no:'Fase 3 · Diagnóstico',head:'Reparación',title:'Corrige la falla',
      teach:`Diagnóstico correcto: <b>${faultName(fault)}</b>. Corrígela y mira volver el giro limpio.`,
      acts:`<button class="b primary good" data-act="repair">🔧 Corregir la falla</button>`};
    case 'completo': return {no:'Laboratorio completado',head:'✓',title:'Armado, medido y reparado',
      teach:`El motor gira otra vez sin tirones. Puedes volver a <b>En marcha</b> y probar la MTPA, el debilitamiento de campo o el barrido de velocidad.`,
      acts:`<button class="b primary" data-act="restart">↺ Reiniciar laboratorio</button>`};
  }
  return {no:'',head:'',title:'',teach:'',acts:''};
}
function htmlGuia(){
  const ps=['Armado','Fundamento','Diagnóstico'], C=contenidoGuia();
  const ok=i=>i<GUIA.phase||(i===2&&RETO_M.hecho);
  return `<div class="pasos">${ps.map((t,i)=>`<span class="ps ${ok(i)?'ok':(i===GUIA.phase?'on':'')}"><i>${ok(i)?'✓':i+1}</i>${t}</span>`).join('')}</div>
  <div class="retoBox"><div class="rt"><span>${C.no}</span><span>${C.head}</span></div><h3>${C.title}</h3><div class="rq">${C.teach}</div><div class="opt" id="actOpt">${C.acts}</div></div>`;
}
/** La telemetría viva del Reto 3 (la que sale del modelo, no de la fórmula). */
function pintaGuiaVivo(){
  if(EST.modo!=='guia'||GUIA.paso!=='girar') return;
  const op=SIMU.op, s=(id,t)=>{ const e=el(id); if(e&&e.textContent!==t) e.textContent=t; };
  s('d_rpm',fN(GUIA.rpm,0)+' rpm'); s('d_freq',fN(feDe(GUIA.rpm),0)+' Hz'); s('d_trq',op?fN(op.T,0)+' N·m':'0 N·m'); s('d_pow',op?fN(op.Pej/1000,1)+' kW':'0 kW');
}
/* ---------- los modos ---------- */
function setMode(m,forzar){
  if(!forzar&&(m===EST.modo||EST.autoRunning)) return;
  if(m==='guia'){
    EST.modo='guia'; if(!EST.escMano) EST.esc=1/100;
    if(!GUIA.iniciado) startPhase1();
    else { if(GUIA.phase===0&&GUIA.kitGuardado){ for(const k of PIECE_ORDER){ KIT[k].instalada=GUIA.kitGuardado.kit.includes(k); KIT[k].activa=false; PZ[k].position.copy(KIT[k].instalada?V3(0,0,0):KIT[k].pos); }
        for(const im of IMANES){ im.instalado=im.k<GUIA.magIndex; im.vuelo=null; im.malla.visible=im.instalado; im.malla.position.set(0,0,0); } BANDEJAS.visible=true; GUIA.fantasmas=GUIA.paso==='imanes'; ponVista(GUIA.paso==='imanes'?'rotor':'armado'); } else ponVista('conjunto'); }
  } else {
    if(EST.modo==='guia'&&GUIA.phase===0) GUIA.kitGuardado={kit:PIECE_ORDER.filter(k=>KIT[k].instalada||KIT[k].activa)};
    EST.modo='marcha'; montaTodo(); BANDEJAS.visible=false; if(!EST.escMano) EST.esc=1/100; ponVista('conjunto');
  }
  document.body.classList.toggle('m-marcha',EST.modo==='marcha'); document.body.classList.toggle('m-guia',EST.modo==='guia');
  pintaHUD(); pintaDockFijo(); pintaBarras(); VU.clave='';
}
let fbTimer=null;
function feedback(type,title,text,sticky=false){ const f=el('feedback'); f.className='feedback show '+type; el('fbIcon').textContent=type==='good'?'✓':'✕'; el('fbTitle').textContent=title; el('fbText').innerHTML=text; clearTimeout(fbTimer); if(!sticky) fbTimer=setTimeout(()=>f.classList.remove('show'),7000); }
el('fbX').onclick=()=>el('feedback').classList.remove('show');

/* ---------- el recorrido guiado de «En marcha» ---------- */
const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function runAuto(){
  if(EST.autoRunning||EST.modo!=='marcha') return; EST.autoRunning=true; sonido.init();
  const hud=el('hud');
  const prev={rpm:EST.rpm,Tped:EST.Tped,estr:EST.estr,barrido:EST.barrido,esc:EST.esc,pausa:EST.pausa,vista:VISTA.actual,escMano:EST.escMano};
  const fija=o=>{ Object.assign(EST,o); pintaHUD(); hud.style.pointerEvents='none'; const b=el('btnAuto'); if(b){ b.disabled=true; b.textContent='Recorrido en curso…'; } pintaDockFijo(); pintaBarras(); };
  try{
    fija({barrido:false,rpm:1000,Tped:320,estr:'mtpa',pausa:false}); ponVista('conjunto');
    showToast('Paso 1 · A 1 000 rpm y con el pedal a fondo, el control elige la <b>MTPA</b>: la mínima corriente para 320 N·m. Mira el punto en el plano <b>i<sub>d</sub>–i<sub>q</sub></b>, sobre la curva blanca.',8200);
    await espera(8600);
    ponVista('rotor');
    showToast('Paso 2 · Cada polo son <b>dos imanes en V</b>. El polo S del estátor (rojo) va un poco adelantado al imán N (azul): <b>ese ángulo de carga</b> es el que da par. Con la polaridad inversa, el hierro del rotor también aporta.',9200);
    await espera(9600);
    fija({estr:'id0'}); ponVista('conjunto');
    showToast('Paso 3 · <b>Sólo imanes</b> (i<sub>d</sub> = 0): sin par de reluctancia. Para los mismos 320 N·m el punto se va a la derecha y hace falta más corriente.',8000);
    await espera(8400);
    fija({estr:'mtpa',rpm:SIMU.rpmBase});
    showToast('Paso 4 · En el <b>codo</b> el punto toca el círculo de 450 A y la elipse de tensión, que se encoge al subir la velocidad. 320 N·m × ω = 110 kW.',8000);
    await espera(8400);
    fija({rpm:6500});
    showToast('Paso 5 · <b>Debilitamiento de campo</b>: el punto resbala por la elipse con i<sub>d</sub> más negativa. El par baja y la potencia casi se queda en 110 kW.',8000);
    await espera(8400);
    fija({rpm:PM.rpmMax});
    showToast('Paso 6 · A 10 500 rpm la frecuencia llega a 700 Hz, el límite del acero laminado. El motor sigue dando potencia, pero con poco par.',7000);
    await espera(7400);
  } finally {
    Object.assign(EST,prev); EST.autoRunning=false; hud.style.pointerEvents='';
    pintaHUD(); pintaDockFijo(); ponVista(prev.vista); pintaBarras();
  }
}


/* ===================== 16. SONIDO (sintetizado) =====================
   El zumbido del motor: su tono sigue a la frecuencia eléctrica (escalada
   al rango audible) y se oye más fuerte con más par. */
const sonido=(function(){
  let ctx=null,on=true,master=null,osc=null,osc2=null,gain=null,filt=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      osc=ctx.createOscillator(); osc.type='sawtooth'; osc2=ctx.createOscillator(); osc2.type='square';
      filt=ctx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=500; filt.Q.value=4;
      gain=ctx.createGain(); gain.gain.value=0; osc.connect(filt); osc2.connect(filt); filt.connect(gain); gain.connect(master); osc.start(); osc2.start();
    }catch(e){ ctx=null; } }
  function actualiza(corre,rpm){ if(!ctx) return; const t=ctx.currentTime;
    const f=55+rpm/50; osc.frequency.setTargetAtTime(f,t,0.05); osc2.frequency.setTargetAtTime(f*1.5,t,0.05);
    filt.frequency.setTargetAtTime(380+rpm*0.55,t,0.05);
    const vol=rpm<10?0:Math.min(0.1,0.015+rpm/9000*0.1);
    gain.gain.setTargetAtTime(on&&corre?vol:0,t,0.08); }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); }
  return {init,actualiza,
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    clac:()=>tono(320,0.06,0.04,'triangle'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; },
    get vol(){ return gain?gain.gain.value:0; }, get freq(){ return osc?osc.frequency.value:0; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});

/* ===================== 17. CALIDAD Y TAMAÑO ===================== */
const pxSimbolo=()=>innerHeight*renderer.getPixelRatio()/(2*Math.tan(camera.fov*Math.PI/360));
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.min(devicePixelRatio,alta?2:1.5));
  const ms=alta?2048:1024; if(LUZ.clave.shadow.mapSize.x!==ms){ LUZ.clave.shadow.mapSize.set(ms,ms); if(LUZ.clave.shadow.map){ LUZ.clave.shadow.map.dispose(); LUZ.clave.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  M_SIM.uniforms.uPx.value=pxSimbolo();
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  M_SIM.uniforms.uPx.value=pxSimbolo();
  colocaBarras();
  clearTimeout(window.__rzMOT); window.__rzMOT=setTimeout(()=>ponVista(VISTA.actual,0.01),140);
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 18. EL LAZO: UN SOLO RELOJ =====================
   El tiempo simulado avanza dt·escala en cada cuadro, y con ESE tiempo se
   pintan la escena (rotor, campo, ranuras) y el dock (punto de operación,
   cursores de la vuelta eléctrica). */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  aplicaEscena(EST.pausa?0:dt*EST.esc,EST.pausa?0:dt,t);
  pasaCam(dt);
  sonido.actualiza(!!SIMU.op&&!EST.pausa,SIMU.op?SIMU.op.rpm:0);
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); pintaGuiaVivo(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaPlano(); pintaTn(); pintaVu(); }
  controls.update();
  PASO_G.value=clamp(0.0030*camera.position.distanceTo(controls.target),0.0007,0.008);
  renderer.info.reset(); composer.render();
  colocaRotulos();
}

/* ===================== 19. ARRANQUE =====================
   Abre funcionando: un barrido de velocidad con el pedal a fondo, MTPA, a
   cámara lenta ×1/100. El punto de operación viaja por el plano id–iq. */
disposicion();
aplicaCalidad();
pintaHUD();
actualizaOperacion(0);
pintaDockFijo();
pintaBarras();
ponVista('conjunto',0.001);
cuadro();
setTimeout(()=>showToast('Motor de tracción <b>cortado por la mitad</b> y funcionando, a cámara lenta ×1/100. '+(matchMedia('(hover: hover)').matches?'Pasa el ratón por':'Toca')+' una pieza para saber qué es.',5200),600);

/* ===================== 20. GANCHOS DE PRUEBA ===================== */
window.__labDebug={
  get mode(){ return EST.modo==='marcha'?'marcha':(['armado','fundamento','diagnostico'][GUIA.phase]||'armado'); },

  get autoRunning(){ return EST.autoRunning; },
  modelo(){ const o=SIMU.op; if(!o) return {activo:false};
    return {activo:true,modo:o.modo,lim:o.lim,rpm:o.rpm,fe:o.fe,Tped:o.Tped,estr:EST.estr,id:o.id,iq:o.iq,I:o.I,V:o.V,beta:o.beta*180/Math.PI,delta:o.delta*180/Math.PI,
      T:o.T,Tm:o.Tm,Tr:o.Tr,Pej:o.Pej,Pin:o.Pin,Pcu:o.Pcu,Pfe:o.Pfe,Pmec:o.Pmec,eta:o.eta,Tdisp:o.Tdisp,rpmBase:SIMU.rpmBase,thM:SIMU.thM,th:FL.th,Tinst:FL.Tinst,
      fases:FL.i.slice(),F:FL.F.slice(),tCalc:SIMU.tCalc}; },
  escena(){ return {vista:VISTA.actual,calidad:CAL.nivel,pixel:renderer.getPixelRatio(),rotulos:ROT.on,pausa:EST.pausa,esc:EST.esc,modo:EST.modo,barrido:EST.barrido,
    tri:renderer.info.render.triangles,llamadas:renderer.info.render.calls,fps:FPS.v,
    ranuras:M_RANURA.map(m=>+m.emissive.getHSL({}).l.toFixed(3)),rotor:+ROTOR.rotation.z.toFixed(3),bandejas:BANDEJAS.visible,
    simbolos:Array.from(gSim.attributes.aVal.array).slice(0,12).map(v=>+v.toFixed(2)),polos:IMANES.map(i=>i.norte?'N':'S').join('')}; },
  cam(){ const r=v=>[+v.x.toFixed(3),+v.y.toFixed(3),+v.z.toFixed(3)]; return {pos:r(camera.position),target:r(controls.target),hueco:huecoLibre(),fps:FPS.v}; },
};
window.__test=Object.assign(window.__test||{},{
  start:()=>{ setMode('guia',true); },
  action:(a)=>handleAction(a,null),

  state:()=>({phase:GUIA.phase,step:['estator','rotor','imanes','fases','frecuencia','polos','girar','dx','reparar','completo'].indexOf(GUIA.paso),magIndex:GUIA.magIndex,rpm:Math.round(GUIA.rpm),fault,
    statorInstalled:KIT.estator.instalada,rotorInstalled:KIT.rotor.instalada,statorTraveling:KIT.estator.activa,rotorTraveling:KIT.rotor.activa}),
  audioState:()=>({ctxState:sonido.ctx?sonido.ctx.state:'none',vol:sonido.vol,freq:sonido.freq,soundOn:sonido.on}),

  setMode:(m)=>setMode(m,true),

});
