<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.26, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){

function pickerFor(scene,camera,dom,onHit){

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

//    3 · CATALIZADOR — oxida CO y HC y reduce NOx, con una ventana estrecha

//                      de encendido. El carbono NO se crea ni se destruye al

//    4 · SONDA       — lo que el analizador chupa puede venir mezclado con aire

//                      DILUYEN la muestra. Todo baja y el O₂ sube hacia el 20,9

//  Y encima de los cuatro, el VEREDICTO: las dos tablas de la

//  Lambda calculado con Brettschneider a partir de los gases MEDIDOS —no del λ
//  del motor— y la regla 5.1.5, que exige no rebasar NINGUNO de los límites.
//
//  QUÉ NO SE MODELA, Y HAY QUE DECIRLO

//  · El método SDB, que sustituye la medición por la lectura del OBD en los

//    laboratorio entero.

//  · La química fina del HC: aquí el HC es un solo número en base hexano, como
//    lo mide el equipo y como lo define la NOM-041 num. 3.6.2. No hay reparto
//    entre metano, aromáticos ni aldehídos.
//  · El transitorio del catalizador al calentarse: se modela por encima o por
//    debajo de su temperatura de encendido, sin la curva del arranque en frío.

//    lenta 350–1 100 rpm, promedio de los segundos 26 a 30) y método dinámico
//    (PAS 5024 a 24 km/h ± 2,4 y PAS 2540 a 40 km/h ± 4, promedio de t = 21 a
//    t = 30), y la Tabla 3 de exactitud del analizador.
// ============================================================================

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

// ============================================================================
// 1 · EL COMBUSTIBLE
// ============================================================================
// La gasolina se trata como un solo hidrocarburo CH_HCV. La relación H/C manda
// en TODO: en el aire estequiométrico, en el CO₂ máximo alcanzable y en el
// denominador de Brettschneider.
const HCV = 1.85;     // átomos de H por átomo de C
const OCV = 0;        // átomos de O por átomo de C: gasolina sin oxigenados
const K_AGUA = 3.5;   // [CO]·[H₂O] = K·[CO₂]·[H₂] — el «3,5» de Brettschneider
const K1_HEXANO = 6;  // el HC se mide en base hexano (NOM-041 num. 3.6.2)
const O2_AIRE = 20.9; // % vol de oxígeno en el aire seco
const N2_AIRE = 79.1;

// Oxígeno estequiométrico por átomo de carbono: CH_n + (1 + n/4 − o/2) O₂
const O2_ESTEQ = 1 + HCV / 4 - OCV / 2;
// Y la relación aire/combustible estequiométrica en masa, que es la cifra que
// todo el mundo cita como «14,7».
const M_C = 12.011, M_H = 1.008, M_O = 15.999, M_AIRE = 28.96;
const AFR_ESTEQ = (O2_ESTEQ * (100 / O2_AIRE) * M_AIRE) / (M_C + HCV * M_H);

// ============================================================================
// 2 · LA CÁMARA — el balance de átomos
// ============================================================================
// Se razona sobre UN mol de carbono de combustible. Entra aire en proporción λ
// respecto del estequiométrico. Una fracción `fFallo` de la carga no se quema y
// sale entera: su combustible entero como HC y su aire entero como O₂.
const CO_RESIDUAL = 0.004;   // mol de CO por mol de C quemado, lado pobre
// El combustible que se apaga contra la pared fría del cilindro y sale entero.
// Va DENTRO del balance, como una fracción de carga que no se quema, no como un
// número de ppm añadido al final: si se sumara aparte, sería combustible que
// aparece de la nada, el balance no cerraría y el λ calculado con
// Brettschneider —que sí lo cuenta— saldría sesgado contra el λ del motor.
const F_PARED = 0.0070;      // fracción de carga apagada contra la pared

// Reparto rico por el equilibrio agua-gas, resuelto exactamente.
// Incógnitas: co, co2, h2, h2o con
//   co + co2 = cQ                                   (carbono)
//   h2 + h2o = hTot = cQ·HCV/2                      (hidrógeno)
//   2·o2Q = 2·co2 + co + h2o                        (oxígeno)
//   [CO]·[H₂O] = K·[CO₂]·[H₂]                       (equilibrio agua-gas)
// Con d = 2·o2Q − 2·cQ queda co2 = cQ − co, h2o = co + d, h2 = hTot − co − d, y
// el equilibrio se convierte en una cuadrática en co:
//   (K − 1)·co² + [K·(d − cQ − hTot) − d]·co + K·cQ·(hTot − d) = 0
function resuelveRica(cQ, o2Q, hTot) {
  const d = 2 * o2Q - 2 * cQ;
  const A = K_AGUA - 1;
  const B = K_AGUA * (d - cQ - hTot) - d;
  const C = K_AGUA * cQ * (hTot - d);
  // De las dos raíces sólo una es física: la que deja las cuatro especies con
  // cantidad no negativa. Se elige por eso, no por el signo del discriminante.
  const cand = [];
  if (Math.abs(A) < 1e-12) {
    if (Math.abs(B) > 1e-12) cand.push(-C / B);
  } else {
    const disc = B * B - 4 * A * C;
    if (disc >= 0) {
      const r = Math.sqrt(disc);
      cand.push((-B - r) / (2 * A), (-B + r) / (2 * A));
    }
  }
  const bueno = cand.filter(x => x >= -1e-9 && x <= cQ + 1e-9 &&
    x + d >= -1e-9 && hTot - x - d >= -1e-9);
  const co = clamp(bueno.length ? bueno[0] : Math.max(0, -d), 0, cQ);
  const co2 = cQ - co;
  const h2o = Math.max(0, co + d);
  const h2 = Math.max(0, hTot - h2o);
  return { co, co2, h2, h2o, raices: cand.slice() };
}

// El límite de mezcla pobre: por encima de cierto λ la llama se vuelve tan
// lenta que hay ciclos que no llegan a quemar. Esto NO es una constante de la
// naturaleza, es un ajuste didáctico, y por eso se declara aquí con nombre.
const LAM_POBRE_ESTABLE = 1.25;   // hasta aquí, combustión limpia
const LAM_APAGA = 1.60;           // aquí ya falla la mitad de los ciclos
function falloPorPobre(lam) {
  if (lam <= LAM_POBRE_ESTABLE) return 0;
  const u = (lam - LAM_POBRE_ESTABLE) / (LAM_APAGA - LAM_POBRE_ESTABLE);
  return clamp(0.5 * u * u, 0, 0.5);
}

// Los gases CRUDOS, en % vol de gas seco (y el HC en ppm de hexano).
function cruda(lam, fFalloBase) {
  const l = Math.max(0.30, lam);
  const f = clamp(fFalloBase + falloPorPobre(l) + F_PARED, 0, 0.6);
  const cQ = 1 - f;                       // carbono que sí se quema
  const o2Disp = l * O2_ESTEQ;            // O₂ que entra por mol de C total
  const o2Q = o2Disp * cQ;                // el que acompaña a la parte quemada
  const hTot = cQ * HCV / 2;
  let co2, co, o2, h2;
  if (l < 1) {
    const R = resuelveRica(cQ, o2Q, hTot);
    co = R.co; co2 = R.co2; h2 = R.h2;
    // La carga que NO se quema sale entera: su combustible como HC y SU AIRE
    // como O₂. Ponerlo a cero aquí —que es lo que hacía este modelo— tiraba a
    // la basura el oxígeno de esa fracción, el balance no cerraba, y además
    // dejaba a los motores ricos con un oxígeno exactamente nulo, que ningún
    // analizador lee jamás.
    o2 = o2Disp - o2Q;
  } else {
    co = CO_RESIDUAL * cQ;
    co2 = cQ - co;
    h2 = 0;
    // Lo que sobra tras quemar la parte quemada. El aire de la carga fallada no
    // se toca, y por eso un fallo de encendido SUBE el oxígeno medido.
    o2 = o2Disp - (co2 + co / 2 + cQ * HCV / 4);
  }
  // El combustible crudo de los ciclos fallados, más el apagado contra la pared.
  const hcC = f;                          // mol de C crudo por mol de C total
  const n2 = o2Disp * (N2_AIRE / O2_AIRE);
  // Gas SECO: el analizador condensa el agua antes de medir.
  const seco = co2 + co + Math.max(0, o2) + h2 + n2 + hcC;
  const pc = x => (x / seco) * 100;
  return {
    lam: l, fFallo: f,
    CO2: pc(co2), CO: pc(co), O2: pc(Math.max(0, o2)), H2: pc(h2),
    HC: (hcC / seco) * 1e6 / K1_HEXANO,
    seco, moles: { co2, co, o2: Math.max(0, o2), h2, n2, hcC },
  };
}

// ============================================================================
// 3 · NOx — la temperatura de pico, no el balance de átomos
// ============================================================================
// Zeldovich: la formación de NO va con exp(−E/T) y con la raíz del oxígeno
// disponible. El resultado, que NO se escribe sino que sale, es que el máximo
// cae del lado POBRE —hay más oxígeno y todavía hace calor— y que en rica se
// hunde aunque la temperatura sea alta.
// Las cuatro constantes del ajuste. NO son constantes de la naturaleza: son un
// ajuste didáctico calibrado para que las cifras caigan donde caen en un banco
// real, y por eso llevan nombre y se declaran en la ficha.
const T_ADIAB = 2600;      // K de pico a λ de máxima llama, plena carga, sin EGR
const E_NOx = 21000;       // K, energía de activación reducida de Zeldovich
const K_NOx = 3.90e7;      // ppm, factor de escala
const T_MIN_NOx = 1200;    // K por debajo de los cuales no se forma NO apreciable
const LAM_T_MAX = 0.95;    // el pico de temperatura cae del lado RICO
const SIGMA_T = 0.40;      // anchura de la campana de temperatura
const K_EGR_T = 0.62;      // cuánto enfría el pico lo recirculado
const K_AVANCE_T = 0.0055; // por grado de avance sobre el nominal
const O2_DISOC = 0.30;     // % de O₂ que la disociación deja a λ = 1
const N_DISOC = 6;         // con cuánta fuerza se hunde ese resto en rica

// La temperatura de pico: baja al alejarse del estequiométrico por los dos
// lados, sube con la carga y con el avance, y baja con lo recirculado.
function tPico(e, lam, carga, F = {}) {
  const l = Math.max(0.5, lam);
  // El máximo de temperatura cae un poco del lado RICO, donde la llama es más
  // rápida. El de NOx, en cambio, caerá del lado POBRE: eso no se escribe aquí,
  // sale de multiplicar esta campana por el oxígeno disponible.
  const dl = l - LAM_T_MAX;
  const forma = Math.exp(-(dl * dl) / (2 * SIGMA_T * SIGMA_T));
  const egr = clamp((e.egr || 0) * (F.egrMul === undefined ? 1 : F.egrMul), 0, 0.30);
  const avance = (e.avance || 12) + (F.avanceExtra || 0);
  const fAv = 1 + K_AVANCE_T * (avance - 12);
  const fCarga = 0.86 + 0.14 * clamp(carga, 0, 1);
  return T_ADIAB * forma * fCarga * fAv * (1 - K_EGR_T * egr);
}
// El oxígeno del término de Zeldovich NO es una curva ajustada: es el O₂ que el
// balance de átomos dice que hay, con un suelo por la disociación —a esas
// temperaturas queda algo de O₂ libre incluso en mezcla rica—. Así el máximo de
// NOx cae donde cae por una razón, no porque se haya puesto ahí: la temperatura
// tira hacia el lado rico y el oxígeno hacia el pobre, y ganan a medias.
function noxCrudo(e, lam, carga, g0, F = {}) {
  const T = tPico(e, lam, carga, F);
  if (T <= T_MIN_NOx) return 0;
  // El resto de disociación no es constante: cuanto más rica es la mezcla,
  // menos oxígeno libre queda incluso a temperatura de pico. Sin esta caída, el
  // modelo daba 2 200 ppm a λ = 0,85, que es el doble de lo que da un motor.
  const suelo = O2_DISOC * Math.pow(Math.min(1, lam), N_DISOC);
  const o2 = Math.max(g0.O2, suelo);
  return K_NOx * Math.exp(-E_NOx / T) * Math.sqrt(o2);
}

// ============================================================================
// 4 · EL CATALIZADOR
// ============================================================================
// Oxida CO y HC —para lo que necesita oxígeno, o sea λ ≥ 1— y reduce NOx —para
// lo que necesita lo contrario—. Por eso la ventana de los tres a la vez es
// estrecha, y por eso el lazo cerrado oscila alrededor de λ = 1 en lugar de
// quedarse quieto en un lado.
const T_ENCENDIDO = 550;   // K de encendido del catalizador (light-off)
// Los dos bordes de la ventana y su anchura. Están puestos de modo que en
// λ = 1,000 las DOS reacciones vayan casi al máximo a la vez —que es lo que
// hace que la ventana exista— y que fuera de ella cada una se caiga sola.
const LAM_OX = 0.985, LAM_RED = 1.020, W_CAT = 0.005;
const ETA_OX = 0.985, ETA_RED = 0.975;

function eficacias(e, lam, F = {}) {
  const salud = clamp((e.catSalud === undefined ? 1 : e.catSalud) *
    (F.catMul === undefined ? 1 : F.catMul), 0, 1);
  const tCat = (e.tCat || 750) + (F.tCatDelta || 0);
  if (!e.catalizador || salud <= 0 || tCat < T_ENCENDIDO) {
    return { ox: 0, red: 0, salud, tCat, encendido: tCat >= T_ENCENDIDO,
      hay: !!e.catalizador, treVias: !!e.treVias };
  }
  // Oxidación: necesita oxígeno. Se cae por debajo de λ = 1.
  const ox = salud * ETA_OX / (1 + Math.exp(-(lam - LAM_OX) / W_CAT));
  // Reducción: necesita atmósfera reductora. Se cae por encima de λ = 1. Un
  // catalizador de DOS vías no reduce nada: sólo oxida.
  const red = !e.treVias ? 0
    : salud * ETA_RED / (1 + Math.exp((lam - LAM_RED) / W_CAT));
  return { ox, red, salud, tCat, encendido: true, hay: true, treVias: !!e.treVias };
}

// El paso por el catalizador, con el carbono contado. Oxidar CO gasta medio O₂
// por mol y pasa ese carbono a CO₂; oxidar HC gasta más y también lo pasa. El
// CARBONO TOTAL no cambia: entra y sale el mismo. De ahí sale, sin que nadie lo
// escriba, que CO+CO₂ mida la MUESTRA y no el estado del motor.
function pasaCatalizador(e, g, nox, lam, F = {}) {
  const ef = eficacias(e, lam, F);
  const m = g.moles;
  const coQuemado = m.co * ef.ox;
  // El HC en moles de carbono: el que hay en ppm de hexano por 6 carbonos.
  const hcC0 = m.hcC;
  const hcQuemado = hcC0 * ef.ox;
  const co = m.co - coQuemado;
  const hcC = hcC0 - hcQuemado;
  const co2 = m.co2 + coQuemado + hcQuemado;
  // El oxígeno que se gasta: 1/2 por CO y (1 + HCV/4) por carbono de HC.
  const o2Gasto = coQuemado / 2 + hcQuemado * O2_ESTEQ;
  const o2 = Math.max(0, m.o2 - o2Gasto);
  const seco = co2 + co + o2 + m.h2 + m.n2 + hcC;
  const pc = x => (x / seco) * 100;
  return {
    CO2: pc(co2), CO: pc(co), O2: pc(o2), H2: pc(m.h2),
    HC: (hcC / seco) * 1e6 / K1_HEXANO,
    NOx: nox * (1 - ef.red),
    ef, seco, moles: { co2, co, o2, h2: m.h2, n2: m.n2, hcC },
  };
}

// ============================================================================
// 5 · LA SONDA — la dilución
// ============================================================================
// Una fuga en el escape antes del punto de muestreo, o la sonda mal metida,
// mezcla el gas con aire de la calle. `dil` es la fracción de aire en lo que el
// equipo chupa. Todo baja proporcionalmente y el O₂ sube hacia el 20,9 del aire.
function diluye(g, dil) {
  const d = clamp(dil, 0, 0.95);
  const k = 1 - d;
  return {
    CO2: g.CO2 * k, CO: g.CO * k, O2: g.O2 * k + O2_AIRE * d,
    H2: g.H2 * k, HC: g.HC * k, NOx: g.NOx * k, dil: d,
  };
}

// ============================================================================
// 6 · EL FACTOR LAMBDA — Brettschneider sobre lo MEDIDO
// ============================================================================
// La NOM-041 num. 3.5 nombra la fórmula pero no fija sus constantes, y circulan
// variantes. Ésta es la forma publicada por Bosch, con Hcv, Ocv y K₁ declarados
// arriba. Se calcula sobre los gases que el equipo MIDE, no sobre el λ del
// motor: si la muestra viene diluida, este número también viene mal, y eso es
// justo lo que el criterio de dilución existe para atrapar.
function brettschneider(G) {
  const CO = G.CO, CO2 = G.CO2, O2 = G.O2;
  const HC = G.HC / 1e4;                 // ppm hexano → % vol
  if (CO2 <= 1e-9) return null;
  const agua = HCV / 4 * (K_AGUA / (K_AGUA + CO / CO2)) - OCV / 2;
  const num = CO2 + CO / 2 + O2 + agua * (CO2 + CO);
  const den = (1 + HCV / 4 - OCV / 2) * (CO2 + CO + K1_HEXANO * HC);
  return den > 0 ? num / den : null;
}

const DIL_MIN = 13, DIL_MAX = 16.5, LAMBDA_MAX = 1.05;
const TABLA1 = [   // método dinámico, num. 4.2.1
  { hasta: 1990, rot: '1990 y anteriores', HC: 350, CO: 2.5, O2: 2.0, NOx: 2500 },

// El λ que el motor mantiene en un punto de trabajo dado. En lazo cerrado la
// sonda lo clava en 1,00 salvo a plena carga, donde el mapa enriquece para
// proteger; en lazo abierto manda el mapa y nada lo corrige.
// El enriquecimiento de POTENCIA sólo entra cerca de mariposa abierta. Ninguna
// de las cuatro fases de las dos pruebas llega ahí: las dos del método dinámico
// piden trabajo, pero un 24 o un 40 km/h sostenidos son carga parcial. Ponerlo
// más bajo hacía que todos los vehículos sanos suspendieran el dinámico, que es
// justo lo contrario de lo que pasa en un centro de verificación.
const CARGA_ENRIQUECE = 0.80;
function lambdaEn(e, carga, F = {}) {
  const c = clamp(carga, 0, 1);
  const base = c >= CARGA_ENRIQUECE ? e.lamCarga
    : c <= 0.03 ? e.lamRalenti
      : e.lamCrucero;
  const cerrado = e.lazoCerrado && !F.lazoAbierto;
  // Con lazo cerrado y sin avería, la sonda clava λ = 1 mientras no haya
  // enriquecimiento de potencia. Sin lazo cerrado manda el mapa y nada corrige.
  const conLazo = cerrado && c < CARGA_ENRIQUECE ? 1.00 : base;
  return conLazo * (F.lamMul === undefined ? 1 : F.lamMul);
}

// ============================================================================
// 11 · LA MEDICIÓN COMPLETA EN UN PUNTO
// ============================================================================
function mide(e, P, F = {}) {
  const carga = P.carga;
  const rpm = P.ralenti ? e.ralenti : P.rpm;
  const lam = lambdaEn(e, carga, F);
  const g0 = cruda(lam, F.fallo || 0);
  const nox0 = noxCrudo(e, lam, carga, g0, F);
  const gc = pasaCatalizador(e, g0, nox0, lam, F);
  // El goteo de un inyector añade crudo que el catalizador ya no ve.
  const gHC = { ...gc, HC: gc.HC + (F.hcExtra || 0) };
  const G = diluye(gHC, F.dil || 0);
  const lamCalc = brettschneider(G);
  return {
    k: P.k, rot: P.rot, metodo: P.metodo, rpm, carga, ralenti: !!P.ralenti,
    lamMotor: lam, lamCalc,
    CO: G.CO, CO2: G.CO2, O2: G.O2, HC: G.HC, NOx: G.NOx,
    dilucion: G.CO + G.CO2, dil: G.dil,
    fFallo: g0.fFallo, tPico: tPico(e, lam, carga, F), ef: gc.ef,
    crudo: { CO: g0.CO, CO2: g0.CO2, O2: g0.O2, HC: g0.HC, NOx: nox0 },
    sinDiluir: { CO: gHC.CO, CO2: gHC.CO2, O2: gHC.O2, HC: gHC.HC, NOx: gHC.NOx },
  };
}

// ============================================================================
// 11 bis · LO QUE EL EQUIPO PUBLICA — la traza y la ventana de la norma
// ============================================================================
// El analizador no publica el estado estacionario: publica el PROMEDIO de una
// ventana de segundos que la NOM-047 fija. Y la fija tarde por una razón: entre
// la sonda y la celda hay manguera, y el gas tarda en llegar. Si se promediara
// al principio de la fase, la lectura saldría por debajo de lo que el motor
// está echando de verdad. Eso no se afirma aquí: se mide en la Capa 1.
const RESP_TAU = 4.0;      // s de constante de la manguera y la celda
const DUR_ESTATICO = 30;   // s de cada fase del método estático
const DUR_DINAMICO = 60;   // s de cada fase del método dinámico

// El rizo del instrumento. Las amplitudes son las de RUIDO de la Tabla 3 de la
// NOM-047. Es determinista y su periodo divide exactamente la ventana de cada
// método, así que su promedio sobre la ventana es CERO por construcción: lo que
// se publica es el promedio del transitorio, no un número que dependa del rizo.
// Un equipo real no tiene esa suerte, y por eso la norma le exige la exactitud
// de esa misma tabla.
const RUIDO = { CO: 0.02, CO2: 0.20, O2: 0.30, HC: 6, NOx: 16 };
const FASE_RUIDO = { CO: 0, CO2: 1.1, O2: 2.3, HC: 0.7, NOx: 1.9 };
function ventanaDe(metodo) {
  return metodo === 'dinamico' ? SEG_DINAMICO : SEG_ESTATICO;
}
function periodoRuido(metodo) {
  return ventanaDe(metodo).length;   // 5 s en estático, 10 s en dinámico
}
function rizo(gas, t, metodo) {
  const T = periodoRuido(metodo);
  return RUIDO[gas] * Math.sin(2 * Math.PI * t / T + FASE_RUIDO[gas]);
}

// La traza segundo a segundo de una fase completa.
function traza(e, P, F = {}, o = {}) {
  const est = mide(e, P, F);
  const dur = P.metodo === 'dinamico' ? DUR_DINAMICO : DUR_ESTATICO;
  const paso = o.paso || 1;
  const gases = ['CO', 'CO2', 'O2', 'HC', 'NOx'];
  const pts = [];
  for (let t = 0; t <= dur + 1e-9; t += paso) {
    const sube = 1 - Math.exp(-t / RESP_TAU);
    const p = { t };
    // El rizo NO se multiplica por la subida y NO se recorta en cero: el ruido
    // del instrumento está ahí llegue o no el gas, y recortarlo sesgaría el
    // promedio hacia arriba justo en las lecturas pequeñas —un CO de 0,006 %
    // con un ruido de ±0,02 % salía un 62 % alto sólo por el recorte—. Que la
    // traza baje de cero un instante es lo que hace un equipo de verdad cuando
    // la lectura es del tamaño de su propio ruido, y verlo enseña algo.
    for (const g of gases) p[g] = est[g] * sube + rizo(g, t, P.metodo);
    pts.push(p);
  }
  return { pts, dur, est, ventana: ventanaDe(P.metodo), metodo: P.metodo };
}

// El promedio de la ventana: ESTO es lo que el equipo publica y lo que se juzga.
function lectura(e, P, F = {}) {
  const T = traza(e, P, F, { paso: 1 });
  const seg = T.ventana;
  const gases = ['CO', 'CO2', 'O2', 'HC', 'NOx'];
  const out = {};
  for (const g of gases) {
    let s = 0;
    for (const t of seg) s += T.pts[t][g];
    out[g] = s / seg.length;
  }
  return { ...T.est, ...out, dilucion: out.CO + out.CO2,
    lamCalc: brettschneider(out), estacionario: T.est, ventana: seg };
}

// ============================================================================
// 12 · EL VEREDICTO
// ============================================================================
// NOM-041 num. 5.1.5: cumple cuando no rebasa NINGUNO de los límites. Y hay dos
// criterios que no son límites de emisión sino de validez de la medición: la
// dilución y —salvo en marcha mínima, num. 4.2.2.1— el Factor Lambda.
function juzgaPunto(e, m, F = {}) {
  const L = limites(m.metodo, e.anio);
  const fallos = [];
  if (m.HC > L.HC) fallos.push('HC');
  if (m.CO > L.CO) fallos.push('CO');
  if (m.O2 > L.O2) fallos.push('O2');
  if (L.NOx !== null && m.NOx > L.NOx) fallos.push('NOx');
  const dilBaja = m.dilucion < L.dilMin;
  const dilAlta = m.dilucion > L.dilMax;
  // num. 4.2.2.1: «No aplicará el valor del Factor Lambda en el caso de la
  // prueba en marcha mínima». El num. 4.3 exceptúa además a los vehículos que
  // POR DISEÑO operan con mezcla pobre; ninguno de los cuatro de este banco lo
  // es, así que esa excepción se cita en la ficha y no se modela: ponerla aquí
  // sería una rama que nunca se recorre.
  const lamAplica = !m.ralenti;
  const lamFalla = lamAplica && m.lamCalc !== null && m.lamCalc > L.lambda;
  if (lamFalla) fallos.push('lambda');
  return {
    ...m, L, fallos,
    dilBaja, dilAlta, dilValida: !dilBaja && !dilAlta,
    lamAplica, lamFalla,
    // Una medición con la dilución fuera de ventana NO es una aprobación ni un
    // rechazo por emisiones: es una medición que no vale.
    valida: !dilBaja && !dilAlta,
    aprueba: !dilBaja && !dilAlta && fallos.length === 0,
  };
}

function verifica(e, esc, metodo) {
  const F = FALLAS[ESCEN[esc].falla];
  // Se juzga lo que el EQUIPO PUBLICA —el promedio de la ventana de la norma—,
  // no el estado estacionario del motor. Son distintos, y por poco: la
  // diferencia es justo el transitorio de la manguera.
  const pts = PUNTOS[metodo].map(P => juzgaPunto(e, lectura(e, P, F), F));
  const invalida = pts.some(p => !p.valida);
  const aprueba = !invalida && pts.every(p => p.aprueba);
  const motivos = [...new Set(pts.flatMap(p => p.fallos))];
  return {
    metodo, anio: e.anio, L: limites(metodo, e.anio), pts,
    invalida, aprueba, motivos,
    // Cuál de los dos puntos manda el rechazo, que casi nunca son los dos.
    peor: pts.slice().sort((a, b) => (a.aprueba ? 1 : 0) - (b.aprueba ? 1 : 0))[0],
  };
}

// ============================================================================
// 13 · ESCENARIOS
// ============================================================================
const ESCEN = {
  sano: { falla: 'sano', rot: 'sistema sano', clave: 'ninguna' },
  mezclaRica: { falla: 'mezclaRica', rot: 'mezcla rica en todo el rango', clave: 'mezcla' },
  mezclaPobre: { falla: 'mezclaPobre', rot: 'mezcla pobre en todo el rango', clave: 'mezcla' },
  sondaVaga: { falla: 'sondaVaga', rot: 'sonda de oxígeno perezosa', clave: 'lazo' },
  catalizadorMuerto: { falla: 'catalizadorMuerto', rot: 'catalizador agotado', clave: 'postratamiento' },
  catalizadorFrio: { falla: 'catalizadorFrio', rot: 'catalizador por debajo de su encendido', clave: 'postratamiento' },
  falloEncendido: { falla: 'falloEncendido', rot: 'fallo de encendido intermitente', clave: 'combustión' },
  fugaEscape: { falla: 'fugaEscape', rot: 'fuga en el escape antes de la sonda', clave: 'muestreo' },
  sondaMalMetida: { falla: 'sondaMalMetida', rot: 'sonda del analizador mal metida', clave: 'muestreo' },
  egrPegada: { falla: 'egrPegada', rot: 'recirculación pegada cerrada', clave: 'NOx' },
  avanceExcesivo: { falla: 'avanceExcesivo', rot: 'avance de encendido excesivo', clave: 'NOx' },
  filtroSucio: { falla: 'filtroSucio', rot: 'filtro de aire tapado', clave: 'mezcla' },
  inyectorGoteo: { falla: 'inyectorGoteo', rot: 'inyector que gotea', clave: 'mezcla' },
};
const ESCEN_KEYS = Object.keys(ESCEN);
const FAMILIAS = [...new Set(ESCEN_KEYS.map(k => ESCEN[k].clave))];

// Hay averías que NO PUEDEN darse en una máquina concreta: un catalizador
// agotado en un coche que nunca llevó catalizador, o uno por debajo de su
// temperatura de encendido en el mismo caso. El modelo las calcula igual y
// devuelve exactamente las cifras del sistema sano; eso, sin avisar, se lee
// como «la avería no hace nada», que es una lectura falsa. Por eso hay que
// poder preguntarlo, y la interfaz lo dice en pantalla.
function aplica(e, esc) {
  const F = FALLAS[ESCEN[esc].falla];
  if (!e.catalizador && (F.catMul !== undefined || F.tCatDelta !== undefined)) return false;
  if (F.lazoAbierto && !e.lazoCerrado) return false;
  return true;
}
function porQueNoAplica(e, esc) {
  if (aplica(e, esc)) return null;
  const F = FALLAS[ESCEN[esc].falla];
  if (!e.catalizador && (F.catMul !== undefined || F.tCatDelta !== undefined))
    return 'esta máquina no lleva catalizador';
  if (F.lazoAbierto && !e.lazoCerrado) return 'esta máquina no tiene lazo cerrado que perder';
  return 'no aplica';
}
const escenariosDe = e => ESCEN_KEYS.filter(k => aplica(e, k));

// ============================================================================
// 14 · LA LECTURA COMPLETA DE UN CASO
// ============================================================================
// Un escenario, las dos pruebas enteras, y lo que de ahí se sigue. Es lo único
// que la interfaz necesita pedir.
const CRITERIOS = ['HC', 'CO', 'O2', 'NOx', 'lambda', 'dilucion'];

function lecturas(e, esc) {
  const F = FALLAS[ESCEN[esc].falla];
  const est = verifica(e, esc, 'estatico');
  const din = verifica(e, esc, 'dinamico');
  const cae = V => {
    const s = new Set(V.motivos);
    if (V.pts.some(p => p.dilBaja)) s.add('dilucionBaja');
    if (V.pts.some(p => p.dilAlta)) s.add('dilucionAlta');
    return [...s];
  };
  return {
    esc, rot: ESCEN[esc].rot, clave: ESCEN[esc].clave, falla: ESCEN[esc].falla,
    aplica: aplica(e, esc), porQueNo: porQueNoAplica(e, esc),
    est, din,
    criteriosEst: cae(est), criteriosDin: cae(din),
    // Que los dos métodos no den lo mismo NO es un fallo del modelo: los cortes
    // de año de la TABLA 1 y de la TABLA 2 no coinciden, y el método estático no
    // tiene límite de NOx ninguno.
    discrepan: est.aprueba !== din.aprueba,
    soloPorTabla: est.aprueba !== din.aprueba &&
      limites('estatico', e.anio).rot !== limites('dinamico', e.anio).rot,
    // El λ del motor y el que sale de los gases: iguales mientras la muestra sea
    // buena, distintos en cuanto entra aire por donde no debe.
    lamMotor: est.pts[0].lamMotor, lamCalc: est.pts[0].lamCalc,
    sesgoLambda: est.pts[0].lamCalc === null ? null
      : est.pts[0].lamCalc - est.pts[0].lamMotor,
  };
}

// ¿Qué criterio atrapa cada avería, y cuál se le escapa? Es la cuenta que
// justifica que la norma tenga SEIS criterios y no sólo dos límites de emisión.
function censoCriterios(e, metodo) {
  const out = [];
  for (const c of CRITERIOS) {
    const atrapa = escenariosDe(e).filter(k => {
      if (k === 'sano') return false;
      const L = lecturas(e, k);
      const cs = metodo === 'dinamico' ? L.criteriosDin : L.criteriosEst;
      return c === 'dilucion' ? cs.includes('dilucionBaja') || cs.includes('dilucionAlta')
        : cs.includes(c);
    });
    out.push({ criterio: c, atrapa, n: atrapa.length });
  }
  return out.sort((a, b) => b.n - a.n);
}
// Y las que NINGÚN criterio atrapa: el vehículo pasa la verificación con la
// avería puesta. Que existan es el resultado más incómodo de esta práctica.
function pasanConAveria(e, metodo) {
  return escenariosDe(e).filter(k => k !== 'sano' &&
    (metodo === 'dinamico' ? lecturas(e, k).din : lecturas(e, k).est).aprueba);
}

// El separador de millares es U+202F, un espacio fino que no rompe línea. NO se
// usa toLocaleString: en este proyecto ya costó un error que 'es-MX' formateara
// a la inglesa en el navegador de las pruebas y no en el del desarrollo.
const NBSP=' ';
function num(x,d=1){
  if(x===null||x===undefined) return '—';
  if(!isFinite(x)) return x>0?'∞':'—';
  const s=Math.abs(x).toFixed(d);
  const [ent,dec]=s.split('.');
  let e=''; for(let i=0;i<ent.length;i++){ if(i>0 && (ent.length-i)%3===0) e+=NBSP; e+=ent[i]; }
  return (x<0?'−':'')+e+(dec?','+dec:'');
}
const pcv=(x,d=2)=>num(x,d)+NBSP+'%';          // por ciento de volumen
const ppm=(x,d=0)=>num(x,d)+NBSP+'ppm';
const lamF=(x,d=3)=>x===null?'—':num(x,d);
const rpmT=x=>num(x,0)+NBSP+'rpm';
const kmh=(x,d=0)=>num(x,d)+NBSP+'km/h';
const gra=(x,d=1)=>num(x,d)+NBSP+'°';
const kel=(x,d=0)=>num(x,d)+NBSP+'K';
const seg=(x,d=0)=>num(x,d)+NBSP+'s';
const pcc=(x,d=0)=>num(x,d)+NBSP+'%';          // por ciento a secas
const vec=(x,d=2)=>num(x,d)+NBSP+'×';
// Un año-modelo NO lleva separador de millares: `num(1992,0)` imprime «1 992»,
// que se lee como una cantidad y no como una fecha. Esto no lo ve ninguna prueba
// numérica —la cifra es correcta—; se vio en una captura.

const corta=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;

const UNI={CO:'%',CO2:'%',O2:'%',HC:'ppm',NOx:'ppm'};
function gasF(g,v){
  if(v===null||v===undefined) return '—';
  return g==='HC'||g==='NOx' ? ppm(v,0) : pcv(v, g==='CO'?3:2);
}
const GAS_ROT={CO:'CO',CO2:'CO₂',O2:'O₂',HC:'HC',NOx:'NOx'};
const GAS_COL={CO:BAD_HEX,CO2:OK_HEX,O2:AZUL,HC:NARANJA,NOx:VIO};

};
const MQ=()=>ARQ[G.maq];
const FA=()=>FALLAS[ESCEN[G.esc].falla];

// --------------------------------------------------------------------- memo
// El censo de criterios recorre 13 escenarios × 2 métodos × 2 puntos por
// máquina, y cada punto arrastra una traza de 60 muestras. Sin memoria, cada
// repintado del pizarrón lo recalcularía y la escena se caería a cero
// fotogramas.
const MEMO=new Map();
function memo(k,fn){ if(!MEMO.has(k)) MEMO.set(k,fn()); return MEMO.get(k); }
function invalida(){ MEMO.clear(); }

function LECT(){ return LECT_DE(G.esc); }
function LECT_DE(esc){ return memo(`l|${G.maq}|${esc}`,()=>lecturas(MQ(),esc)); }
function VERIF(){ return G.metodo==='dinamico'?LECT().din:LECT().est; }
function CENSO(met){ return memo(`n|${G.maq}|${met||G.metodo}`,
  ()=>censoCriterios(MQ(),met||G.metodo)); }
function PASAN(met){ return memo(`p|${G.maq}|${met||G.metodo}`,
  ()=>pasanConAveria(MQ(),met||G.metodo)); }
function PUNTOS_M(){ return PUNTOS[G.metodo]; }
// La fase que se está mirando, recortada al número de fases que el método tiene.
// Sin el recorte, cambiar de método con la fase 2 elegida deja un `undefined` en
// media telemetría y el panel imprime «—» sin que nada falle.
function FASE(){ return Math.min(G.fase,PUNTOS_M().length-1); }
function TRAZA(P){ return memo(`t|${G.maq}|${G.esc}|${P.k}`,
  ()=>traza(MQ(),P,FA(),{paso:1})); }

// El punto LIBRE: la mezcla y la carga las pone el alumno, y de ahí salen los
// gases por el mismo camino que en una fase de la prueba. Es la única forma de
// ver la curva entera sin que la sonda del lazo cerrado la clave en λ = 1.
function PUNTO_LIBRE(){
  const e=MQ(), F=FA();
  // El λ NO se lee de G.lam sino de LAM_AQUI(): con el mando libre apagado, el
  // que hay de verdad lo pone el motor, y una tabla calculada a G.lam mientras
  // la gráfica marca otro λ enseña dos cifras distintas del mismo punto.
  const l=LAM_AQUI();
  return memo(`q|${G.maq}|${G.esc}|${l}|${G.carga}`,()=>{
    const g0=cruda(l,F.fallo||0);
    const nox0=noxCrudo(e,l,G.carga,g0,F);
    const gc=pasaCatalizador(e,g0,nox0,l,F);
    const gHC={...gc,HC:gc.HC+(F.hcExtra||0)};
    const Gm=diluye(gHC,F.dil||0);
    return {lam:l, crudo:g0, cat:gHC, medido:Gm, ef:gc.ef, nox0,
      lamCalc:brettschneider(Gm), tPico:tPico(e,l,G.carga,F),
      dilucion:Gm.CO+Gm.CO2};
  });
}

// El λ que de verdad hay en el punto de trabajo: en las fases del protocolo lo
// pone el motor; en el punto libre lo pone el mando.
function LAM_AQUI(){ return G.libre?G.lam:lambdaEn(MQ(),G.carga,FA()); }

  const L=LECT(), V=VERIF(), e=MQ();

  const SV=G.metodo==='dinamico'?S.din:S.est;

    // Lo que se ha movido respecto del mismo vehículo sano en la misma prueba.
    subeCO:V.pts[0].CO>SV.pts[0].CO*1.5,

    aplica:L.aplica, porQueNo:L.porQueNo,

}

// Un lienzo 2D de 1024×768 pegado a un panel 3D. Se llama `bcv` y no `cv`
// porque `cv` ya es la fábrica de lienzos del kit de la escena: reusar ese

const BW=1024, BH=768;

const board=new THREE.Group();

// Cotas del pizarrón. Es GRANDE a propósito: los paneles de la interfaz tapan
// cuatro décimas del ancho de la pantalla, y con un pizarrón pequeño la única
// forma de que el banco entrara en el hueco que queda era alejarse tanto que el
// texto dejaba de leerse. Aquí la práctica está en el tablero; el banco explica
// de dónde sale la muestra, que es justo lo que este laboratorio discute.
// El tamaño del pizarrón se elige por lo que MIDE EN PANTALLA, no por lo que
// parece razonable en metros. La textura tiene 1 024 px de ancho: si el pizarrón
// sale a 420 px de ventana, el texto de 13 px del lienzo llega al ojo a 5 y no se
// lee. El laboratorio anterior lo saca a 535 px con un banco más estrecho; aquí
// el vehículo es un coche entero, así que el pizarrón tiene que crecer con él.
const BW3=8.20, BH3=5.92, BY3=3.20;
function colocaTablero(d){
  board.rotation.y=0.70;
  // El pizarrón se pega al borde IZQUIERDO real del banco, descontando su propio
  // medio ancho proyectado sobre el eje X. Colocarlo a partir de un «ancho
  // total» inventado deja un metro de mesa vacía entre los dos y echa el banco
  // fuera del cuadro.
  const medio=(BW3/2+0.13)*Math.cos(board.rotation.y);
  board.position.set(d.xIzq-0.45-medio,0,0.95);
}
// Encuadre que mete el pizarrón Y el banco. La distancia NO se calcula con una
// regla de tres sobre el ancho: se PRUEBA contra el tronco de visión punto por
// punto y se busca la menor que los mete todos. Repartir el ancho como si todo
// estuviera a la misma profundidad deja al banco —que está mucho más cerca de la
// cámara que el pizarrón— ocupando tres cuartos del cuadro mientras el pizarrón
// se queda en un rincón, y eso sólo se ve mirando la pantalla.
function puntosClave(){
  const d=dims(MQ());
  const a=BW3/2, mx=a*Math.cos(board.rotation.y), mz=a*Math.sin(board.rotation.y);
  const y0=BY3-BH3/2, y1=BY3+BH3/2, bp=board.position;
  return [
    [bp.x-mx,y0,bp.z+mz],[bp.x+mx,y0,bp.z-mz],
    [bp.x-mx,y1,bp.z+mz],[bp.x+mx,y1,bp.z-mz],
    // Los extremos REALES del banco: el morro del vehículo, la cola con la
    // sonda, lo alto del analizador y los dos bordes en profundidad. Sin el
    // borde del analizador aquí, la cámara lo deja debajo del panel de mandos y
    // el encuadre parece bueno hasta que se mira la pantalla.
    [d.xIzq,0.05,0.80],[d.xIzq,1.60,-0.80],
    [d.xDer,0.05,0.80],[d.xDer,1.10,-0.95],
    [d.xEsc,0.05,-0.42],[d.xAna,1.55,d.zAna],
    [d.xAna-0.40,0.05,d.zAna-0.30],[d.xAna+0.40,0.05,d.zAna-0.30],
    [d.centro,1.72,0.80],[d.centro,0.05,-0.95],
    [d.xRod,0.05,0.80],[d.xRod,0.05,-0.95],
  ].map(p=>new THREE.Vector3(...p));
}
// La franja de pantalla que de verdad se ve. El HUD tapa la izquierda y el panel
// de mandos tapa la derecha: encuadrar contra el ancho completo del lienzo mete
// casi cuatro décimas del banco DEBAJO de los paneles, y desde fuera parece que
// la cámara está mal cuando lo que está mal es la cuenta.
function zonaUtil(){
  const rM=mount.getBoundingClientRect();
  const W=rM.width||1600, H=rM.height||900;
  let x0=0, x1=W;
  const h=el('hud'), p=el('panel');
  if(h){ const r=h.getBoundingClientRect();
    if(r.width>0&&r.right-rM.left<W*0.60) x0=Math.max(x0,r.right-rM.left+18); }
  if(p){ const r=p.getBoundingClientRect();
    if(r.width>0&&r.left-rM.left>W*0.40) x1=Math.min(x1,r.left-rM.left-18); }
  // En una pantalla estrecha los paneles no dejan hueco: entonces se usa todo el
  // lienzo y que los paneles tapen lo que tapen, porque la alternativa es alejar
  // la cámara hasta que no se lea nada.
  if(x1-x0<W*0.34){ x0=0; x1=W; }
  return { W, H, x0, x1 };
}
function camConjunto(margen){
  const d=dims(MQ()), Z=zonaUtil();
  const asp=clamp(Z.W/Math.max(1,Z.H),0.60,2.60);
  const m=(margen===undefined?1:margen);
  const TV=0.4142, TH=TV*asp;                    // tangentes del medio ángulo
  const nx0=(2*Z.x0/Z.W-1)/m, nx1=(2*Z.x1/Z.W-1)/m, ny=0.94/m;
  const pts=puntosClave();
  const mx=1.86*Math.cos(board.rotation.y);
  let off=(((board.position.x-mx)+d.xDer)/2-board.position.x)/Math.cos(board.rotation.y);
  const proy=(dist,o)=>{
    const [P,C]=camTablero(dist,o);
    const p=new THREE.Vector3(...P), c=new THREE.Vector3(...C);
    const f=c.clone().sub(p).normalize();
    const r=new THREE.Vector3().crossVectors(f,new THREE.Vector3(0,1,0)).normalize();
    const u=new THREE.Vector3().crossVectors(r,f).normalize();
    let a=Infinity,b=-Infinity,vy=0,zs=0,n=0,malo=false;
    for(const q of pts){
      const v=q.clone().sub(p), z=v.dot(f);
      if(z<=0.2){ malo=true; continue; }
      a=Math.min(a,(v.dot(r)/z)/TH); b=Math.max(b,(v.dot(r)/z)/TH);
      vy=Math.max(vy,Math.abs((v.dot(u)/z)/TV)); zs+=z; n++;
    }
    return { a, b, vy, z:n?zs/n:1, malo };
  };
  const cabe=(dist,o)=>{ const e=proy(dist,o); return !e.malo&&e.a>=nx0&&e.b<=nx1&&e.vy<=ny; };
  let dist=26;
  for(let it=0;it<7;it++){
    // Menor distancia que mete todos los puntos clave dentro de la franja útil.
    if(cabe(26,off)){
      let lo=3, hi=26;
      for(let k=0;k<26;k++){ const mid=(lo+hi)/2; if(cabe(mid,off)) hi=mid; else lo=mid; }
      dist=hi;
    }else dist=26;
    // Y después se centra el contenido DENTRO de esa franja, no dentro del
    // lienzo: si no, el banco queda pegado al panel de mandos.
    const e=proy(dist,off);
    const dn=(nx0+nx1)/2-(e.a+e.b)/2;
    if(Math.abs(dn)<0.012) break;
    off-=dn*TH*e.z;
  }
  return camTablero(dist,off);
}
// Encuadre del pizarrón: se calcula desde su propia transformada, no con
// coordenadas escritas a mano, porque el pizarrón se mueve con el ancho del
// banco y unas coordenadas fijas lo dejan medio fuera de cuadro en cuanto se
// cambia de arquetipo.
function camTablero(d,off){
  const c=board.position.clone(); c.y=BY3;
  const n=new THREE.Vector3(Math.sin(board.rotation.y),0,Math.cos(board.rotation.y));
  const dd=d||5.85;
  // La altura sube con la distancia. Con una altura fija, alejarse deja la vista
  // casi horizontal y la mesa se ve de canto.
  const p=c.clone().addScaledVector(n,dd); p.y=BY3+0.13*dd;
  // El HUD tapa la franja izquierda de la pantalla, así que por omisión se apunta
  // un poco a la izquierda del centro del pizarrón para que el pizarrón caiga a
  // su derecha. Con un desplazamiento POSITIVO el pizarrón se corre hacia la
  // izquierda y el banco —que está a su derecha— entra en el cuadro.
  const tg=new THREE.Vector3(Math.cos(board.rotation.y),0,-Math.sin(board.rotation.y));
  const dx=(off===undefined)?-0.42:off;
  p.addScaledVector(tg,dx); c.addScaledVector(tg,dx);
  return [[p.x,p.y,p.z],[c.x,c.y,c.z]];
}

  const marco=roundedBox(BW3+0.26,BH3+0.24,0.10,std({...plas,metalness:0.30,roughness:0.58}),0.05);
  marco.position.y=BY3; board.add(marco);

function tabla(x,y,cols,rows,o={}){

function enCaja(P,fn){ bx.save(); bx.beginPath(); bx.rect(P.x,P.y,P.w,P.h); bx.clip(); fn(); bx.restore(); }

function ejes(P,x0,x1,y0,y1,rx,ry,fx,fy,nx,ny){
  const X=v=>P.x+(v-x0)/(x1-x0)*P.w;
  const Y=v=>P.y+P.h-(v-y0)/(y1-y0)*P.h;
  bx.save(); bx.strokeStyle='#1d2735'; bx.lineWidth=1;
  for(let i=0;i<=nx;i++){ const v=x0+(x1-x0)*i/nx, xx=X(v);
    bx.beginPath(); bx.moveTo(xx,P.y); bx.lineTo(xx,P.y+P.h); bx.stroke();
    if(fx) texto(fx(v),xx,P.y+P.h+19,{s:12,c:'#7b8697',al:'center'}); }
  for(let i=0;i<=ny;i++){ const v=y0+(y1-y0)*i/ny, yy=Y(v);
    bx.beginPath(); bx.moveTo(P.x,yy); bx.lineTo(P.x+P.w,yy); bx.stroke();
    if(fy) texto(fy(v),P.x-9,yy+4,{s:12,c:'#7b8697',al:'right'}); }
  bx.restore();
  bx.save(); bx.strokeStyle='#3a4658'; bx.lineWidth=1.5; bx.strokeRect(P.x,P.y,P.w,P.h); bx.restore();
  if(rx) texto(rx,P.x+P.w/2,P.y+P.h+44,{s:13,c:'#9aa6b6',al:'center'});
  if(ry){ bx.save(); bx.translate(P.x-58,P.y+P.h/2); bx.rotate(-Math.PI/2);
    texto(ry,0,0,{s:13,c:'#9aa6b6',al:'center'}); bx.restore(); }
  return {X,Y};
}
