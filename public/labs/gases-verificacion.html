// La columna derecha del pizarrón. Las gráficas llegan hasta x = 694 y el margen
// del tablero está en 982, así que TODA tabla de la derecha vive entre esos dos
// números. Escribir anchos a mano en cada vista deja las tablas cortadas por el
// borde, y eso sólo se ve mirando la pantalla.
const DER_X=708, DER_W=274;
function tablaDer(y,rot,rows,o={}){
  const nv=rot.length-1;
  const wv=nv===1?110:(nv===2?76:56), gap=8;
  const w0=DER_W-(wv+gap)*nv;
  const cols=[{t:rot[0]||'',w:w0}];
  for(let i=0;i<nv;i++) cols.push({t:rot[i+1]||'',w:wv,al:'right'});
  // Una fila con menos celdas que columnas pinta «undefined» en la última, y eso
  // pasa desapercibido en cualquier prueba numérica: se rellena aquí.
  rows.forEach(r=>{ while(r.v.length<cols.length) r.v.push(''); });
  return tabla(DER_X,y,cols,rows,Object.assign({rh:25,s:13,gap},o));
}

// El barrido de λ que casi todas las vistas necesitan. Se memoriza: recorrerlo a
// cada repintado tira los fotogramas al suelo.
const LAM0=0.75, LAM1=1.35, NLAM=121;
function barrido(){
  const e=MQ(), F=FA();
  return memo(`b|${G.maq}|${G.esc}|${G.carga}`,()=>{
    const out=[];
    for(let i=0;i<NLAM;i++){
      const l=LAM0+(LAM1-LAM0)*i/(NLAM-1);
      const g0=cruda(l,F.fallo||0);
      const n0=noxCrudo(e,l,G.carga,g0,F);
      const gc=pasaCatalizador(e,g0,n0,l,F);
      const gm=diluye({...gc,HC:gc.HC+(F.hcExtra||0)},F.dil||0);
      out.push({lam:l, crudo:g0, cat:gc, med:gm, nox0:n0,
        ef:gc.ef, T:tPico(e,l,G.carga,F)});
    }
    return out;
  });
}

// ---------------------------------------------------------- 1 · LA MEZCLA
// Los cinco gases contra λ. Es la vista madre: todo lo demás son cortes de aquí.
function vistaQuimica(){
  cabecera('La mezcla manda: los cinco gases contra λ',
    'Un solo mando —cuánto aire por cuánta gasolina— y los cinco gases se mueven a la vez, cada uno a su manera. '+
    'El CO₂ es máximo justo en el estequiométrico y cae por los DOS lados, así que un CO₂ bajo siempre significa algo. '+
    'La curva de puntos es lo que sale del motor; la llena, lo que el equipo mide después del catalizador y de la sonda.');
  const B=barrido();
  const P={x:96,y:150,w:598,h:250};
  const M=ejes(P,LAM0,LAM1,0,17,'Factor Lambda λ','% de volumen  (HC y NOx a escala aparte)',
    v=>num(v,2),v=>num(v,0),6,6);
  enCaja(P,()=>{
    for(const g of ['CO2','CO','O2']){
      serieXY(M,B.map(p=>[p.lam,p.crudo[g]]),GAS_COL[g],1.6,[5,4]);
      serieXY(M,B.map(p=>[p.lam,p.med[g]]),GAS_COL[g],2.6);
    }
    // HC y NOx viven en ppm: se pintan sobre el mismo recuadro con su propia
    // escala y se dice cuál es, porque si no la comparación visual mentiría.
    const mxHC=Math.max(...B.map(p=>Math.max(p.crudo.HC,p.med.HC)),400);
    const mxN=Math.max(...B.map(p=>Math.max(p.nox0,p.med.NOx)),1500);
    serieXY(M,B.map(p=>[p.lam,p.crudo.HC/mxHC*17]),GAS_COL.HC,1.6,[5,4]);
    serieXY(M,B.map(p=>[p.lam,p.med.HC/mxHC*17]),GAS_COL.HC,2.6);
    serieXY(M,B.map(p=>[p.lam,p.nox0/mxN*17]),GAS_COL.NOx,1.6,[5,4]);
    serieXY(M,B.map(p=>[p.lam,p.med.NOx/mxN*17]),GAS_COL.NOx,2.6);
    const l=LAM_AQUI();
    linea([[M.X(l),P.y],[M.X(l),P.y+P.h]],TINTA,1.6,[4,4]);
    etiqueta('aquí λ = '+lamF(l),M.X(l)+8,P.y+18,TINTA);
    etiqueta('HC a fondo de escala '+ppm(mxHC,0),P.x+P.w-8,P.y+40,GAS_COL.HC,'right');
    etiqueta('NOx a fondo de escala '+ppm(mxN,0),P.x+P.w-8,P.y+62,GAS_COL.NOx,'right');
  });
  leyenda(120,P.y+22,[['a la salida del motor',GRIS,[5,4]],['lo que el equipo mide',TINTA]]);

  const Q=PUNTO_LIBRE(), l=LAM_AQUI();
  tablaDer(150,['gas','motor','equipo'],
    ['CO2','CO','O2','HC','NOx'].map(g=>({v:[GAS_ROT[g],
      gasF(g,g==='NOx'?Q.nox0:Q.crudo[g]), gasF(g,Q.medido[g])],c:GAS_COL[g]})));
  tablaDer(340,['','valor'],[
    {v:['λ del motor',lamF(l)]},
    {v:['λ de los gases',lamF(Q.lamCalc)],c:Q.lamCalc!==null&&Math.abs(Q.lamCalc-l)>0.02?BAD_HEX:OK_HEX},
    {v:['CO + CO₂',pcv(Q.dilucion)],c:Q.dilucion<DIL_MIN||Q.dilucion>DIL_MAX?BAD_HEX:OK_HEX},
    {v:['temperatura de pico',kel(Q.tPico)]},
  ]);

  const ok=Q.lamCalc!==null&&Math.abs(Q.lamCalc-l)<=0.02;
  banda(560,ok?'ok':'bad',
    ok?'El λ de los gases ES el λ del motor':'El λ de los gases NO es el λ del motor',
    ok?('El equipo no mide λ: lo CALCULA con Brettschneider a partir del CO, el CO₂, el O₂ y el HC. '+
        'Con la muestra limpia le sale '+lamF(Q.lamCalc)+' contra los '+lamF(l)+' que hay de verdad. '+
        'Que coincidan no es magia: el balance de átomos que produce los gases y la fórmula que los lee son la misma contabilidad.')
      :('El equipo calcula '+lamF(Q.lamCalc)+' cuando el motor está en '+lamF(l)+'. '+
        'La fórmula no se ha equivocado: le han dado una muestra que no es la del escape. '+
        'Con aire de la calle metido en la manguera, el O₂ sube y el CO₂ baja, y Brettschneider lee eso como una mezcla pobre que no existe.'));
}

// ------------------------------------------------------- 2 · LOS CUATRO PASOS
function vistaCadena(){
  cabecera('De la cámara a la pantalla: los cuatro pasos',
    'Entre lo que el motor echa y lo que el equipo imprime hay tres cosas que pasan, y cada una mueve los gases en otra dirección. '+
    'La cuenta es la misma para los cinco: el catalizador quema, la dilución reparte, y sólo entonces se lee.');
  const Q=PUNTO_LIBRE(), l=LAM_AQUI(), e=MQ(), F=FA();
  const pasos=[
    {k:'crudo', rot:'1 · sale de la cámara', v:Q.crudo, nox:Q.nox0},
    {k:'cat',   rot:'2 · pasa el catalizador', v:Q.cat, nox:Q.cat.NOx},
    {k:'med',   rot:'3 · llega a la celda', v:Q.medido, nox:Q.medido.NOx},
  ];
  const P={x:96,y:158,w:598,h:236};
  const gases=['CO2','CO','O2','HC','NOx'];
  // Cada gas, normalizado a su valor CRUDO, para poder ver los cinco juntos:
  // el CO₂ está en porcentaje y el NOx en partes por millón, y sin normalizar
  // sólo se vería una barra.
  const M=ejes(P,-0.5,gases.length-0.5,0,1.30,'','fracción de lo que salió del motor',
    null,v=>num(v*100,0)+' %',gases.length,5);
  const anc=P.w/gases.length*0.22;
  enCaja(P,()=>{
    gases.forEach((g,i)=>{
      const base=g==='NOx'?Q.nox0:Q.crudo[g];
      pasos.forEach((s,j)=>{
        const v=g==='NOx'?s.nox:s.v[g];
        const f=base>1e-9?v/base:0;
        const x=M.X(i)+(j-1)*anc*1.15;
        const y0=M.Y(0), y1=M.Y(clamp(f,0,1.30));
        bx.save(); bx.globalAlpha=0.35+0.32*j; bx.fillStyle=GAS_COL[g];
        bx.fillRect(x-anc/2,Math.min(y0,y1),anc,Math.abs(y1-y0)); bx.restore();
        // Una barra recortada por el techo del recuadro se lee como «justo en el
        // tope» valga lo que valga: si se ha cortado, se DICE cuánto vale.
        if(f>1.30) texto(vec(f,1),x,P.y+14,{s:11,c:GAS_COL[g],al:'center',b:true});
      });
    });
    nivel(P,M,1,GRIS,'lo que salió del motor',[6,5]);
  });
  gases.forEach((g,i)=>{
    texto(GAS_ROT[g],M.X(i),P.y+P.h+22,{s:14,c:GAS_COL[g],al:'center',b:true});
    const base=g==='NOx'?Q.nox0:Q.crudo[g];
    const fin=g==='NOx'?Q.medido.NOx:Q.medido[g];
    texto(base>1e-9?pcc(fin/base*100,0):'—',M.X(i),P.y+P.h+40,
      {s:12,c:'#8c98a9',al:'center'});
  });
  leyenda(120,P.y+22,[['1 · cámara',GRIS],['2 · tras el catalizador','#8fa0b4'],['3 · en la celda',TINTA]]);

  const ef=Q.ef;
  tablaDer(158,['paso','qué hace'],[
    {v:['catalizador',ef.hay?(ef.encendido?'oxida '+pcc(ef.ox*100,0):'apagado'):'no lleva'],
      c:ef.hay&&ef.encendido?OK_HEX:WARN_HEX},
    {v:['',ef.treVias?('reduce '+pcc(ef.red*100,0)):'no reduce NOx'],
      c:ef.treVias&&ef.red>0.5?OK_HEX:WARN_HEX},
    {v:['dilución',F.dil?('aire '+pcc((F.dil||0)*100,0)):'ninguna'],c:F.dil?BAD_HEX:OK_HEX},
    {v:['CO + CO₂',pcv(Q.dilucion)],c:Q.dilucion<DIL_MIN?BAD_HEX:TINTA},
  ]);
  // El carbono, que es lo que NO cambia. Y hay que contarlo en MOLES: en tanto
  // por ciento la suma CO+CO₂ sí se mueve un poco al pasar el catalizador,
  // porque oxidar consume O₂ y el gas seco total encoge. Decir «no cambia»
  // enseñando dos cifras distintas es exactamente el tipo de cosa que un alumno
  // atento pilla y un laboratorio honesto no puede permitirse.
  const mC=Q.crudo.moles, mM=Q.cat.moles;
  const carbC=mC.co2+mC.co+mC.hcC, carbM=mM.co2+mM.co+mM.hcC;
  const cC=Q.crudo.CO+Q.crudo.CO2, cM=Q.cat.CO+Q.cat.CO2;
  tablaDer(292,['el carbono','cámara','celda'],[
    {v:['carbono total (mol)',num(carbC,4),num(carbM,4)],
      c:Math.abs(carbM-carbC)>1e-6?BAD_HEX:OK_HEX},
    {v:['de él, como HC (mol)',num(mC.hcC,4),num(mM.hcC,4)]},
    {v:['gas seco (mol)',num(Q.crudo.seco,3),num(Q.cat.seco,3)]},
    {v:['CO + CO₂',pcv(cC,2),pcv(cM,2)]},
    {v:['tras la sonda','',pcv(Q.dilucion,2)],
      c:Math.abs(Q.dilucion-cM)>0.05?BAD_HEX:TINTA},
  ]);

  // La suma CO+CO₂ SÍ se mueve un poco al pasar el catalizador, y hay que decir
  // por qué en vez de afirmar que no cambia enseñando dos cifras distintas: el
  // carbono que venía como HC pasa a CO₂ —y el HC no entraba en esa suma—, y
  // encima oxidar consume O₂ y el gas seco total encoge.
  const dCat=cM-cC, dDil=Q.dilucion-cM;
  const porHC=(mC.hcC-mM.hcC)/Q.cat.seco*100;
  banda(560,F.dil?'bad':'ok',
    F.dil?'CO+CO₂ ha bajado, y el catalizador no ha sido':'El catalizador no crea ni destruye carbono',
    'Por el catalizador entran '+num(carbC,4)+' mol de carbono y salen '+num(carbM,4)+': los mismos, hasta la cuarta cifra. '+
    (Math.abs(dCat)<0.005
      ? 'Y la suma CO+CO₂ tampoco se mueve. '
      : 'La suma CO+CO₂ sí se mueve, de '+pcv(cC,2)+' a '+pcv(cM,2)+' —'+pcc(dCat,2)+'—, y no porque aparezca carbono: '+
        pcc(porHC,2)+' de ese salto es el carbono que venía como HC sin quemar y que el catalizador ha pasado a CO₂, y el resto, que oxidar consume O₂ y el gas seco encoge de '+
        num(Q.crudo.seco,3)+' a '+num(Q.cat.seco,3)+' mol. ')+
    (F.dil
      ? 'La sonda hace algo de otro orden: de '+pcv(cM,2)+' a '+pcv(Q.dilucion,2)+', '+pcc(dDil,2)+', sin que el motor toque nada. Ése es el único motivo por el que la norma pone un mínimo de '+num(DIL_MIN,0)+' %.'
      : 'Una fuga en el escape, en cambio, se lleva varios enteros de golpe. Por eso la norma pone un mínimo de '+num(DIL_MIN,0)+' %: no para vigilar el catalizador, sino para vigilar la muestra.'));
}

// ------------------------------------------------------- 3 · LA VENTANA DEL CAT
function vistaCatalizador(){
  cabecera('La ventana del catalizador: dos reacciones que se estorban',
    'Oxidar CO y HC pide oxígeno; reducir NOx pide justo lo contrario. Las dos curvas son independientes y se cruzan en un sitio muy estrecho: '+
    'ésa es la ventana, y es la razón de que el lazo cerrado oscile alrededor de λ = 1 en vez de quedarse quieto en un lado.');
  const e=MQ(), F=FA(), B=barrido();
  const P={x:96,y:150,w:598,h:236};
  const M=ejes(P,LAM0,LAM1,0,100,'Factor Lambda λ','eficacia de conversión (%)',
    v=>num(v,2),v=>num(v,0),6,5);
  enCaja(P,()=>{
    serieXY(M,B.map(p=>[p.lam,p.ef.ox*100]),NARANJA,2.8);
    serieXY(M,B.map(p=>[p.lam,p.ef.red*100]),VIO,2.8);
    // La ventana: donde las DOS pasan del 80 %.
    const dentro=B.filter(p=>p.ef.ox>0.80&&p.ef.red>0.80);
    if(dentro.length){
      bx.save(); bx.fillStyle='rgba(124,217,146,0.14)';
      bx.fillRect(M.X(dentro[0].lam),P.y,M.X(dentro[dentro.length-1].lam)-M.X(dentro[0].lam),P.h);
      bx.restore();
    }
    const l=LAM_AQUI();
    linea([[M.X(l),P.y],[M.X(l),P.y+P.h]],TINTA,1.6,[4,4]);
    etiqueta('aquí λ = '+lamF(l),M.X(l)+8,P.y+18,TINTA);
  });
  leyenda(120,P.y+22,[['oxida CO y HC',NARANJA],['reduce NOx',VIO]]);

  const ef=eficacias(e,LAM_AQUI(),F);
  const dentro=B.filter(p=>p.ef.ox>0.80&&p.ef.red>0.80);
  tablaDer(150,['','valor'],[
    {v:['catalizador',ef.hay?(e.treVias?'tres vías':'dos vías'):'no lleva'],c:ef.hay?TINTA:WARN_HEX},
    {v:['temperatura',kel(ef.tCat)],c:ef.encendido?OK_HEX:BAD_HEX},
    {v:['encendido a partir de',kel(T_ENCENDIDO)]},
    {v:['salud',pcc(ef.salud*100,0)],c:ef.salud<0.4?BAD_HEX:OK_HEX},
    {v:['oxida aquí',pcc(ef.ox*100,0)],c:ef.ox>0.8?OK_HEX:BAD_HEX},
    {v:['reduce aquí',pcc(ef.red*100,0)],c:ef.red>0.8?OK_HEX:(e.treVias?BAD_HEX:GRIS)},
  ]);
  tablaDer(348,['la ventana','λ'],[
    {v:['las dos por encima del 80 %',dentro.length?lamF(dentro[0].lam,3)+' – '+lamF(dentro[dentro.length-1].lam,3):'no existe'],
      c:dentro.length?OK_HEX:BAD_HEX},
    {v:['anchura',dentro.length?num((dentro[dentro.length-1].lam-dentro[0].lam),3):'—']},
  ]);

  const anch=dentro.length?dentro[dentro.length-1].lam-dentro[0].lam:0;
  banda(548, !ef.hay?'warn':(ef.encendido&&ef.salud>0.5?'ok':'bad'),
    !ef.hay?'Este vehículo no lleva catalizador'
      :(ef.encendido&&ef.salud>0.5?'La ventana existe, y mide '+num(anch,3)+' de λ':'Aquí no hay ventana'),
    !ef.hay
      ? 'Un '+e.anio+' sin catalizador sale de fábrica así. Todo lo que el motor echa llega tal cual a la cola del escape, y por eso sus límites de la '+limites(G.metodo,e.anio).tabla+' son más anchos: la norma sabía a quién se los ponía.'
      : (e.treVias
        ? 'Las dos reacciones pasan del 80 % a la vez sólo en '+num(anch,3)+' de λ. Fuera de ahí una de las dos se cae: en rica deja de oxidar y el CO se va entero a la calle; en pobre deja de reducir y el NOx pasa de largo. Mantenerse dentro es literalmente el trabajo de la sonda de oxígeno.'
        : 'Un catalizador de DOS vías sólo oxida: no reduce NOx en ningún λ, no porque esté malo sino porque no lleva el metal que hace falta. Por eso los vehículos de esa época controlaban el NOx con recirculación de gases y no con el catalizador.'));
}

// ------------------------------------------------------------- 4 · EL NOx
function vistaNox(){
  cabecera('NOx: dos máximos que no coinciden',
    'La temperatura de pico es máxima un poco del lado RICO, donde la llama va más deprisa. El oxígeno disponible sólo crece hacia el POBRE. '+
    'El NOx es el producto de los dos, y por eso su máximo cae entre ellos, en mezcla ligeramente pobre. No está puesto ahí: sale de multiplicar.');
  const e=MQ(), F=FA(), B=barrido();
  const P={x:96,y:150,w:598,h:236};
  const mxN=Math.max(...B.map(p=>p.nox0),1000)*1.12;
  const M=ejes(P,LAM0,LAM1,0,mxN,'Factor Lambda λ','NOx a la salida del motor (ppm)',
    v=>num(v,2),v=>num(v,0),6,5);
  enCaja(P,()=>{
    // La temperatura, normalizada al mismo recuadro, para poder compararlas.
    const mxT=Math.max(...B.map(p=>p.T));
    serieXY(M,B.map(p=>[p.lam,p.T/mxT*mxN]),WARN_HEX,2.0,[6,5]);
    serieXY(M,B.map(p=>[p.lam,p.nox0]),VIO,3.0);
    serieXY(M,B.map(p=>[p.lam,p.med.NOx]),VIO,2.2,[3,3]);
    const iT=B.reduce((a,p,i)=>p.T>B[a].T?i:a,0);
    const iN=B.reduce((a,p,i)=>p.nox0>B[a].nox0?i:a,0);
    linea([[M.X(B[iT].lam),P.y],[M.X(B[iT].lam),P.y+P.h]],WARN_HEX,1.4,[4,4]);
    linea([[M.X(B[iN].lam),P.y],[M.X(B[iN].lam),P.y+P.h]],VIO,1.4,[4,4]);
    etiqueta('T máxima en λ '+lamF(B[iT].lam),M.X(B[iT].lam)-8,P.y+20,WARN_HEX,'right');
    etiqueta('NOx máximo en λ '+lamF(B[iN].lam),M.X(B[iN].lam)+8,P.y+42,VIO);
    etiqueta('temperatura a fondo de escala '+kel(mxT),P.x+P.w-8,P.y+P.h-12,WARN_HEX,'right');
  });
  leyenda(120,P.y+64,[['temperatura de pico',WARN_HEX,[6,5]],
    ['NOx del motor',VIO],['NOx en la cola del escape',VIO,[3,3]]]);

  const Q=PUNTO_LIBRE(), ef=Q.ef;
  tablaDer(150,['','valor'],[
    {v:['temperatura de pico',kel(Q.tPico)]},
    {v:['recirculación',pcc((e.egr||0)*(F.egrMul===undefined?1:F.egrMul)*100,0)],
      c:F.egrMul===0?BAD_HEX:TINTA},
    {v:['avance',gra((e.avance||12)+(F.avanceExtra||0),0)],c:F.avanceExtra?BAD_HEX:TINTA},
    {v:['NOx del motor',ppm(Q.nox0,0)]},
    {v:['reduce el catalizador',pcc(ef.red*100,0)],c:ef.red>0.5?OK_HEX:WARN_HEX},
    {v:['NOx en la cola',ppm(Q.medido.NOx,0)],c:TINTA},
  ]);
  const L=limites(G.metodo,e.anio);
  tablaDer(348,['contra la norma','valor'],[
    {v:[L.tabla+' límite',L.NOx===null?'no hay':ppm(L.NOx,0)],c:L.NOx===null?WARN_HEX:TINTA},
    {v:['aquí',ppm(Q.medido.NOx,0)],c:L.NOx!==null&&Q.medido.NOx>L.NOx?BAD_HEX:OK_HEX},
  ]);

  const esconde=Q.nox0>1200&&Q.medido.NOx<Q.nox0*0.4;
  banda(548, L.NOx===null?'warn':(esconde?'warn':'ok'),
    L.NOx===null?'El método estático no mide el NOx contra nada'
      :(esconde?'El catalizador esconde el NOx del motor':'El NOx que sale es el que se juzga'),
    L.NOx===null
      ? 'La TABLA 2 no tiene columna de NOx: el método estático no lo limita. Con el motor sin carga apenas se forma, así que medirlo ahí no diría gran cosa —pero eso significa que una avería de NOx pasa la prueba estática entera sin que nadie se entere.'
      : (esconde
        ? 'El motor está echando '+ppm(Q.nox0,0)+' y por la cola salen '+ppm(Q.medido.NOx,0)+': el catalizador se come el '+pcc(ef.red*100,0)+'. La verificación mide la cola, así que aprueba. Eso es correcto —lo que sale a la atmósfera es lo que importa— pero quien lea el resultado como un diagnóstico del motor se equivocará.'
        : 'Sin reducción por catalizador, lo que el motor forma es lo que se mide. En estos vehículos el único freno del NOx es la recirculación de gases de escape, y por eso una válvula pegada se ve entera en la lectura.'));
}

// -------------------------------------------------- 5 · LA VENTANA DE LA NORMA
function vistaTraza(){
  cabecera('La ventana de la norma: por qué se promedia al final',
    'Entre la sonda y la celda hay manguera, y el gas tarda en llegar. La NOM-047 promedia los últimos segundos de cada fase, no los primeros. '+
    'Aquí se ve cuánto costaría promediar en el sitio equivocado.');
  const e=MQ(), F=FA();
  const Ps=PUNTOS_M();
  const P={x:96,y:150,w:598,h:230};
  const T0=TRAZA(Ps[0]);
  const gas=G.gasTraza||'CO2';
  const mx=Math.max(...T0.pts.map(p=>p[gas]),1)*1.20;
  const M=ejes(P,0,T0.dur,0,mx,'segundos desde el inicio de la fase',
    GAS_ROT[gas]+' ('+UNI[gas]+')',v=>num(v,0),v=>num(v,gas==='CO'?2:(gas==='HC'||gas==='NOx'?0:1)),6,5);
  enCaja(P,()=>{
    // La franja de la ventana de la norma.
    bx.save(); bx.fillStyle='rgba(90,209,230,0.14)';
    const a=M.X(T0.ventana[0]), b=M.X(T0.ventana[T0.ventana.length-1]);
    bx.fillRect(a,P.y,Math.max(2,b-a),P.h); bx.restore();
    Ps.forEach((Pt,i)=>{
      const T=TRAZA(Pt);
      serieXY(M,T.pts.map(p=>[p.t,p[gas]]),i?ROSA:CIAN,2.4);
    });
    const L0=lectura(e,Ps[0],F);
    nivel(P,M,L0[gas],OK_HEX,'lo que se publica: '+gasF(gas,L0[gas]),[6,5]);
  });
  etiqueta('ventana de la norma: segundos '+T0.ventana[0]+' a '+T0.ventana[T0.ventana.length-1],
    M.X((T0.ventana[0]+T0.ventana[T0.ventana.length-1])/2),P.y+P.h+62,CIAN,'center');
  leyenda(120,P.y+22,Ps.map((Pt,i)=>[Pt.rot,i?ROSA:CIAN]));

  // Qué habría salido promediando en otro sitio. La comparación es la lección.
  const T=T0, prom=(a,b)=>{ let s=0,n=0; for(let t=a;t<=b;t++){ s+=T.pts[t][gas]; n++; } return s/n; };
  const Lb=lectura(e,Ps[0],F);
  const est=mide(e,Ps[0],F);
  tablaDer(150,['dónde se promedia',GAS_ROT[gas]],[
    {v:['segundos 1 a 5',gasF(gas,prom(1,5))],c:BAD_HEX},
    {v:['segundos 11 a 15',gasF(gas,prom(11,15))],c:WARN_HEX},
    {v:['la ventana de la norma',gasF(gas,Lb[gas])],c:OK_HEX},
    {v:['el motor, de verdad',gasF(gas,est[gas])],c:TINTA},
  ]);
  tablaDer(300,['','valor'],[
    {v:['constante de la manguera',seg(RESP_TAU,1)]},
    {v:['duración de la fase',seg(T.dur,0)]},
    {v:['se queda corto en',pcc((1-Lb[gas]/est[gas])*100,3)]},
  ]);

  const err=(1-prom(1,5)/est[gas])*100;
  banda(538,'ok','La ventana está al final por una razón',
    'Promediando los cinco primeros segundos, este mismo vehículo publicaría '+gasF(gas,prom(1,5))+
    ' en vez de '+gasF(gas,est[gas])+': un '+pcc(err,0)+' por debajo, sólo porque el gas todavía viene por la manguera. '+
    'Con la ventana de la norma la lectura se queda corta en un '+pcc((1-Lb[gas]/est[gas])*100,3)+', que es despreciable frente a la exactitud que la propia NOM-047 le exige al equipo. '+
    'El rizo que se ve es el RUIDO de la Tabla 3 de esa norma, y su periodo divide exactamente la ventana: promediado, se va.');
}

// --------------------------------------------------------- 6 · EL VEREDICTO
function vistaVeredicto(){
  const e=MQ(), V=VERIF(), L=limites(G.metodo,e.anio);
  cabecera('El veredicto: seis criterios, y basta que caiga uno',
    'La NOM-041 num. 5.1.5 dice que el vehículo cumple cuando no rebasa NINGUNO de los límites. Aquí están los seis, fase por fase, '+
    'con lo medido al lado de lo permitido. El Factor Lambda no aplica en marcha mínima (num. 4.2.2.1), y eso también se ve.');
  const P={x:96,y:150,w:598,h:238};
  const crit=['HC','CO','O2'].concat(L.NOx===null?[]:['NOx']);
  const M=ejes(P,-0.5,crit.length-0.5,0,1.60,'','fracción del límite permitido',
    null,v=>pcc(v*100,0),crit.length,4);
  const anc=P.w/crit.length*0.26;
  enCaja(P,()=>{
    crit.forEach((c,i)=>{
      V.pts.forEach((p,j)=>{
        const lim=L[c], v=p[c];
        const f=lim>0?v/lim:0;
        const x=M.X(i)+(j-0.5)*anc*1.2;
        const y0=M.Y(0), y1=M.Y(Math.min(f,1.60));
        bx.save(); bx.fillStyle=f>1?BAD_HEX:GAS_COL[c];
        bx.globalAlpha=j?0.95:0.60;
        bx.fillRect(x-anc/2,Math.min(y0,y1),anc,Math.abs(y1-y0)); bx.restore();
        // Una barra recortada por el techo se lee como «justo pasado el límite»
        // valga lo que valga: un CO al 221 % del límite tiene que DECIR 2,2 ×.
        if(f>1.60) texto(vec(f,1),x,P.y+14,{s:11,c:BAD_HEX,al:'center',b:true});
      });
    });
    nivel(P,M,1,BAD_HEX,'el límite',[6,5]);
  });
  crit.forEach((c,i)=>{
    texto(CRIT_ROT[c],M.X(i),P.y+P.h+22,{s:14,c:TINTA,al:'center',b:true});
    texto('≤ '+num(L[c],c==='CO'||c==='O2'?1:0),M.X(i),P.y+P.h+40,{s:12,c:'#8c98a9',al:'center'});
  });
  leyenda(120,P.y+22,V.pts.map((p,j)=>[p.rot,j?TINTA:'#8fa0b4']));

  // Los dos criterios que NO son límites de emisión sino de validez.
  const p0=V.pts[0];
  tablaDer(150,['criterio','valor','límite'],[
    {v:['CO + CO₂',pcv(p0.dilucion),'≥ '+num(DIL_MIN,0)],
      c:p0.dilBaja?BAD_HEX:(p0.dilAlta?WARN_HEX:OK_HEX)},
    {v:['Factor Lambda',lamF(p0.lamCalc),'≤ '+num(LAMBDA_MAX,2)],
      c:p0.lamFalla?BAD_HEX:(p0.lamAplica?OK_HEX:GRIS)},
  ]);
  const filas=V.pts.map(p=>({v:[p.rot.replace(/ ·.*/,''),
    p.aprueba?'aprueba':(p.valida?'rechaza':'inválida')],
    c:p.aprueba?OK_HEX:(p.valida?BAD_HEX:WARN_HEX)}));
  tablaDer(266,['fase','resultado'],filas);
  const otro=G.metodo==='dinamico'?LECT().est:LECT().din;
  tablaDer(380,['el otro método','resultado'],[
    {v:[MET_ROT[G.metodo==='dinamico'?'estatico':'dinamico'],
      otro.aprueba?'aprueba':'rechaza'],c:otro.aprueba?OK_HEX:BAD_HEX},
    {v:[otro.L.tabla+' «'+otro.L.rot+'»','']},
  ]);

  const cs=(G.metodo==='dinamico'?LECT().criteriosDin:LECT().criteriosEst)
    .map(c=>CRIT_ROT[c]||c);
  banda(500, V.invalida?'warn':(V.aprueba?'ok':'bad'),
    V.invalida?'La medición no es válida'
      :(V.aprueba?'APRUEBA la verificación':'RECHAZA: '+cs.join(', ')),
    V.invalida
      ? 'La suma CO+CO₂ se ha salido de la ventana de la norma, así que esta lectura no dice nada del motor: dice que la muestra no es buena. Antes de diagnosticar nada hay que arreglar por dónde entra el gas y volver a medir.'
      : (V.aprueba
        ? 'Ninguno de los criterios se ha rebasado, así que el vehículo cumple la NOM-041 por este método. Cumplir no es lo mismo que estar bien: mira el censo.'
        : 'Se ha caído '+(cs.length>1?'más de un criterio':'un criterio')+' —'+cs.join(', ')+'—, y con uno basta. '+
          (LECT().discrepan?'Por el otro método este mismo vehículo, con estas mismas emisiones, '+(otro.aprueba?'APROBARÍA':'también rechazaría')+': los cortes de año de las dos tablas no coinciden.':'')));
}

// ------------------------------------------------------------- 7 · EL CENSO
function vistaCenso(){
  const e=MQ();
  cabecera('Qué atrapa cada criterio, y qué se le escapa',
    'La cuenta exacta: cuántas de las averías de este banco caza cada uno de los seis criterios, y cuántas aprueban la verificación con la avería puesta. '+
    'No es una opinión sobre si la norma es suficiente: es el censo.');
  const C=CENSO(), pasan=PASAN(), esc=escenariosDe(e).filter(k=>k!=='sano');
  // Este recuadro empieza más a la derecha que los demás: los rótulos de los
  // criterios van FUERA, a su izquierda, y «Factor Lambda» a 13 px mide casi
  // noventa píxeles. Con el margen de las otras vistas se salía del lienzo.
  const P={x:190,y:158,w:504,h:222};
  const M=ejes(P,0,Math.max(1,esc.length),-0.5,C.length-0.5,
    'averías que atrapa (de '+esc.length+')','',v=>num(v,0),null,Math.min(7,esc.length),C.length);
  const alto=P.h/C.length*0.56;
  enCaja(P,()=>{
    C.forEach((c,i)=>{
      const y=M.Y(i), x0=M.X(0), x1=M.X(c.n);
      bx.save(); bx.fillStyle=c.n?CIAN:'#2a3444';
      bx.fillRect(x0,y-alto/2,Math.max(2,x1-x0),alto); bx.restore();
      // El rótulo va FUERA de la barra si la barra es corta: dentro de una barra
      // de dos píxeles no cabe nada y el texto desaparece.
      const dentro=(x1-x0)>150;
      texto(num(c.n,0),dentro?x1-10:x1+10,y+5,
        {s:13,b:true,c:dentro?'#06120f':TINTA,al:dentro?'right':'left'});
    });
  });
  C.forEach((c,i)=>texto(CRIT_ROT[c.criterio],P.x-10,M.Y(i)+5,{s:13,c:TINTA,al:'right'}));

  tablaDer(158,['',MET_CORTO[G.metodo]],[
    {v:['averías del banco',num(esc.length,0)]},
    {v:['las atrapa alguna',num(esc.length-pasan.length,0)],c:OK_HEX},
    {v:['APRUEBAN con avería',num(pasan.length,0)],c:pasan.length?BAD_HEX:OK_HEX},
  ]);
  const otroM=G.metodo==='dinamico'?'estatico':'dinamico';
  tablaDer(268,['el otro método',MET_CORTO[otroM]],[
    {v:['aprueban con avería',num(PASAN(otroM).length,0)],
      c:PASAN(otroM).length>pasan.length?BAD_HEX:OK_HEX},
  ]);
  // La lista se corta a seis por sitio, pero el corte se DICE: una tabla que
  // enseña seis de nueve sin avisar se lee como si fueran nueve.
  if(pasan.length){
    const filas=pasan.slice(0,6).map(k=>({v:[corta(ESC_CORTO[k]||k,26),''],c:BAD_HEX}));
    if(pasan.length>6) filas.push({v:['y '+num(pasan.length-6,0)+' más',''],c:GRIS});
    tablaDer(348,['aprueban con la avería puesta',''],filas);
  }

  const dif=PASAN(otroM).length-pasan.length;
  banda(560, pasan.length?'warn':'ok',
    pasan.length?num(pasan.length,0)+' averías aprueban la verificación':'Este método atrapa todas las averías del banco',
    (pasan.length
      ? 'Con el '+MET_ROT[G.metodo]+', '+num(pasan.length,0)+' de las '+num(esc.length,0)+' averías de este banco pasan la prueba: '+
        pasan.map(k=>ESC_CORTO[k]||k).join(', ')+'. El vehículo sale con su comprobante y la avería sigue puesta. '
      : 'Los seis criterios juntos atrapan las '+num(esc.length,0)+' averías de este banco por este método. ')+
    (dif!==0
      ? 'Por el '+MET_ROT[otroM]+' el número es '+num(PASAN(otroM).length,0)+': '+
        (dif>0?'el otro método perdona MÁS.':'el otro método perdona MENOS, y no por ser mejor sino porque a este año-modelo le tocan otros límites.')
      : 'Por el otro método el número es el mismo.'));
}

// ================================ T3 · EL BANCO: DINAMÓMETRO, ESCAPE Y SONDA
// La escena no es decorado: es el argumento. Lo que este laboratorio discute es
// de dónde sale la muestra, y eso hay que VERLO — la sonda metida en el tubo, la
// manguera hasta el analizador, y el agujero por el que entra aire cuando lo hay.

const gSuelo=new THREE.Group(), gRod=new THREE.Group(), gVeh=new THREE.Group(),
      gEsc=new THREE.Group(), gAna=new THREE.Group();
scene.add(gSuelo,gRod,gVeh,gEsc,gAna);

// El aviso flotante. La clase es `show`, NO `on`: la única regla que la hoja de
// estilo del donante declara sobre el aviso es `.toast.show{opacity:1}`, y
// `.toast` nace con `opacity:0`. Con cualquier otra clase el texto se escribe,
// el elemento existe, no salta ningún error y NADIE LO VE NUNCA. Los dos
// laboratorios anteriores de este dominio salieron publicados así.
let TOAST=null;
function showToast(html,ms){
  const c=el('toast'); if(!c) return;
  c.innerHTML=html; c.classList.add('show');
  if(TOAST) clearTimeout(TOAST);
  TOAST=setTimeout(()=>c.classList.remove('show'),ms||2600);
}

const pon=(o,p)=>{ o.position.set(p[0],p[1],p[2]); return o; };
// Los rótulos vienen escalados para un banco mayor que éste, así que hay que
// encogerlos. Y cada uno deja su texto en ROTULOS: un sprite es una textura y de
// una textura no se lee texto, así que ésta es la única forma de comprobar desde
// fuera lo que las chapas del banco DICEN.
const ESC_ROT=0.60;
const ROTULOS=[];
const rot3=(t,c,p)=>{ ROTULOS.push(t); const s=pon(labelSprite(t,c),p);
  s.scale.multiplyScalar(ESC_ROT); return s; };

// Las cotas del banco salen de la máquina: un 1.4 no ocupa lo que un 2.0.
// El analizador va DETRÁS del vehículo y no más allá de la cola. Puesto en línea
// con el escape, el banco medía seis metros de punta a punta, y el encuadre —que
// tiene que meter el pizarrón Y el banco en la franja que los paneles no tapan—
// dejaba el pizarrón en 420 px de los 1 600 de la ventana: el texto no se leía.
// Esto NO se ve en ninguna prueba numérica; se vio comparando la captura con la
// del laboratorio anterior.
function dims(e){
  const largo=2.90+e.cilindrada*0.42;
  const xVeh=0;
  return {
    xVeh, largo,
    xIzq:xVeh-largo/2-0.22,           // el morro
    xRod:xVeh-largo*0.30,             // los rodillos, bajo las ruedas motrices
    xEsc:xVeh+largo/2+0.06,           // la boca del escape
    xSonda:xVeh+largo/2+0.30,
    xAna:xVeh+largo*0.26,             // el analizador, detrás del vehículo
    zAna:-1.86,
    xDer:xVeh+largo/2+0.46,
    centro:xVeh,
  };
}

// --------------------------------------------------------------- el suelo
function construyeSuelo(d){
  gSuelo.clear();
  // La losa tiene que llegar por detrás hasta debajo del analizador: si se
  // dimensiona sólo con el ancho del vehículo, el equipo queda flotando sobre el
  // vacío y eso sólo se ve mirando la pantalla.
  const losa=new THREE.Mesh(new THREE.BoxGeometry(d.xDer-d.xIzq+1.4,0.10,4.4),
    std({color:0x2a3038,roughness:0.92,metalness:0.05}));
  pon(losa,[(d.xIzq+d.xDer)/2,-0.05,-0.42]); losa.receiveShadow=true; gSuelo.add(losa);
  // La fosa del dinamómetro, que es lo que distingue un centro de verificación
  // con método dinámico de uno que sólo puede hacer el estático.
  const fosa=new THREE.Mesh(new THREE.BoxGeometry(1.50,0.12,1.90),
    std({color:0x14181e,roughness:0.95,metalness:0.02}));
  pon(fosa,[d.xRod,0.005,-0.10]); gSuelo.add(fosa);
}

// ------------------------------------------------- los rodillos del freno
let rodA=null, rodB=null;
function construyeRodillos(d){
  gRod.clear();
  const R=0.21;
  rodA=new THREE.Mesh(new THREE.CylinderGeometry(R,R,1.70,26),MAT.rodillo);
  rodA.rotation.x=Math.PI/2; pon(rodA,[d.xRod-0.27,R,-0.10]);
  rodA.castShadow=true; gRod.add(rodA);
  rodB=new THREE.Mesh(new THREE.CylinderGeometry(R,R,1.70,26),MAT.rodillo);
  rodB.rotation.x=Math.PI/2; pon(rodB,[d.xRod+0.27,R,-0.10]);
  rodB.castShadow=true; gRod.add(rodB);
  // El freno de corrientes de Foucault: la caja que pone la carga.
  const fre=roundedBox(0.42,0.34,0.42,MAT.caja,0.05);
  pon(fre,[d.xRod,0.20,-1.16]); gRod.add(fre);
  gRod.add(rot3('dinamómetro de rodillos',AZUL,[d.xRod,0.72,-1.16]));
}

// -------------------------------------------------------------- el vehículo
// Una silueta, no un modelo: lo que importa es dónde está el escape.
function construyeVehiculo(d,e){
  gVeh.clear();
  const L=d.largo, W=1.62, yR=0.30;
  /* EL COCHE, POR SU SILUETA. Dos cajas apiladas con una losa de cristal encima
     no son un coche: son un contenedor. Un coche se reconoce por su perfil
     —morro, parabrisas, techo, luneta, portón— y por los PASOS DE RUEDA, que
     además son lo que deja ver que las ruedas traseras están apoyadas sobre los
     rodillos del banco, que es de lo que va la práctica. Todo eso sale de UN
     contorno extruido a lo ancho del coche. */
  const rA=0.38, ySill=0.34, xd=L*0.30;
  const perfil=[
    [-L*0.50,ySill],[-xd-rA,ySill],
    ...P3.arco(-xd,ySill,rA,Math.PI,0,14),
    [xd-rA,ySill],
    ...P3.arco(xd,ySill,rA,Math.PI,0,14),
    [L*0.50,ySill],
    [L*0.50,0.60],[L*0.46,0.66],[L*0.30,0.64],
    [L*0.15,0.96],[-L*0.07,0.98],[-L*0.26,0.56],
    [-L*0.44,0.48],[-L*0.50,0.44],
  ];
  const cuerpo=new THREE.Mesh(P3.normalizaUV(P3.extruido(
    P3.contornoRedondeado(perfil,0.05,3),{espesor:W,bisel:0.05}),2),MAT.carro);
  cuerpo.castShadow=true;
  pon(cuerpo,[d.xVeh,yR,-0.10]); gVeh.add(cuerpo);
  // El cristal, un poco más ancho que la carrocería para asomar por los lados.
  const cris=new THREE.Mesh(P3.extruido([
    [-L*0.235,0.56],[-L*0.06,0.92],[L*0.14,0.90],[L*0.27,0.60]],
    {espesor:W*1.01,bisel:0.012}),MAT.vidrio);
  pon(cris,[d.xVeh,yR,-0.10]); gVeh.add(cris);
  // Cuatro ruedas de verdad, con su llanta y su hombro. Las traseras van sobre
  // los rodillos, y por eso el diámetro importa: es el que traduce vueltas a
  // kilómetros por hora en la lectura del banco.
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    const r=P3.neumatico({...MATP,goma:MAT.goma,cromo:MAT.crom,aluminio:MAT.crom},
      {dExt:yR*2,dLlanta:yR*1.06,ancho:0.20});
    r.rotation.x=Math.PI/2;
    pon(r,[d.xVeh+sx*xd,yR,-0.10+sz*(W/2-0.02)]);
    r.traverse(o=>{if(o.isMesh)o.castShadow=true;}); gVeh.add(r);
  }
  gVeh.add(rot3(e.corto+' · '+e.anio,TINTA,[d.xVeh,yR+1.24,-0.10]));
  gVeh.add(rot3(e.catalizador?(e.treVias?'catalizador de tres vías':'catalizador de dos vías')
    :'sin catalizador',e.catalizador?OK_HEX:WARN_HEX,[d.xVeh+0.30,yR+0.06,0.86]));
}

// -------------------------------------------- el escape, la sonda y la fuga
/* Los nombres con los que trabaja la biblioteca de piezas (`P3`, que el molde
   ya importa), traducidos una vez a los materiales de este laboratorio. */
const MATP={aluminio:MAT.carro, acero:MAT.acero, cobre:MAT.crom, cromo:MAT.crom,
  chapa:MAT.acero, hierro:MAT.acero, negro:MAT.goma, goma:MAT.goma,
  blanco:MAT.crom, ceramica:MAT.crom};
/* Una pieza EN CORTE deja ver el REVÉS de su pared del fondo: con una sola cara
   se vuelve transparente por el lado abierto y desaparece al mirarla de frente. */
const corte=(m)=>{ const c=m.clone(); c.side=THREE.DoubleSide; return c; };
let sondaM=null, fugaM=null, humoM=null, catM=null;
function construyeEscape(d,e,F){
  gEsc.clear();
  const yT=0.30, L=d.largo;
  // El tubo, de debajo del coche a la cola.
  const tubo=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,L*0.62,18),MAT.acero);
  tubo.rotation.z=Math.PI/2; pon(tubo,[d.xVeh+L*0.16,yT*0.52,-0.42]); gEsc.add(tubo);
  // El catalizador, si lo lleva: una lata más gorda a media longitud.
  if(e.catalizador){
    const ef=eficacias(e,LAM_AQUI(),F);
    /* EL CATALIZADOR, EN CORTE: lo que convierte es el MONOLITO de dentro, un
       panal de canales rectos. Cerrado, una lata más gorda no dice ni por qué
       convierte ni por qué, frío, no convierte nada. */
    const mp=std({color:0x8a6f3a,roughness:0.55,metalness:0.65});
    const lata=new THREE.Mesh(P3.revolucion(
      [[0.098,-0.22],[0.105,-0.22],[0.105,0.22],[0.098,0.22]],
      {seg:24,fase:Math.PI*0.29,arco:Math.PI*1.42}),corte(MAT.acero));
    lata.rotation.z=Math.PI/2; pon(lata,[d.xVeh-L*0.02,yT*0.52,-0.42]); gEsc.add(lata);
    const mono=P3.monolito({ceramica:mp,acero:MAT.acero},
      {r:0.096,largo:0.40,celdas:9,carcasa:false});
    mono.rotation.y=Math.PI/2; pon(mono,[d.xVeh-L*0.02,yT*0.52,-0.42]); gEsc.add(mono);
    catM=null; mono.traverse(o=>{ if(o.isMesh && !catM) catM=o; });
    gEsc.add(rot3(ef.encendido?'catalizador caliente':'catalizador FRÍO',
      ef.encendido?OK_HEX:WARN_HEX,[d.xVeh-L*0.02,yT*0.52+0.34,-0.42]));
  } else catM=null;
  // La cola.
  const cola=new THREE.Mesh(new THREE.CylinderGeometry(0.065,0.070,0.30,18),MAT.crom);
  cola.rotation.z=Math.PI/2; pon(cola,[d.xEsc-0.10,yT*0.52,-0.42]); gEsc.add(cola);

  // LA SONDA. Si la avería es de muestreo, se ve mal metida: fuera del tubo.
  const mal=ESCEN[G.esc].falla==='sondaMalMetida';
  const dentro=mal?0.06:0.26;
  sondaM=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.46,14),MAT.crom);
  sondaM.rotation.z=Math.PI/2.6;
  pon(sondaM,[d.xEsc+0.16-dentro*0.5,yT*0.52+0.16,-0.42]); gEsc.add(sondaM);
  gEsc.add(rot3(mal?'sonda MAL METIDA':'sonda del analizador',mal?BAD_HEX:CIAN,
    [d.xEsc+0.30,yT*0.52+0.52,-0.42]));

  // LA FUGA, si la hay: un agujero en el tubo antes del punto de muestreo.
  const hayFuga=ESCEN[G.esc].falla==='fugaEscape';
  fugaM=new THREE.Mesh(new THREE.SphereGeometry(0.045,14,10),
    std({color:0x0a0d12,roughness:0.98,metalness:0}));
  pon(fugaM,[d.xVeh+L*0.30,yT*0.52+0.05,-0.42]);
  fugaM.visible=hayFuga; gEsc.add(fugaM);
  humoM=new THREE.Mesh(new THREE.ConeGeometry(0.11,0.34,14,1,true),
    std({color:0x9fb4c6,transparent:true,opacity:0.30,roughness:1,metalness:0}));
  pon(humoM,[d.xVeh+L*0.30,yT*0.52+0.26,-0.42]);
  humoM.visible=hayFuga; gEsc.add(humoM);
  if(hayFuga) gEsc.add(rot3('fuga: entra aire',BAD_HEX,[d.xVeh+L*0.30,yT*0.52+0.60,-0.42]));

  // La manguera, de la sonda al analizador. Es la razón de que el gas TARDE en
  // llegar, y de que la norma promedie al final de la fase y no al principio.
  const a=new THREE.Vector3(d.xEsc+0.34,yT*0.52+0.30,-0.42);
  const b=new THREE.Vector3(d.xAna+0.22,0.62,d.zAna+0.26);
  const mid=a.clone().lerp(b,0.5); mid.y-=0.26;
  const cur=new THREE.CatmullRomCurve3([a,mid,b]);
  gEsc.add(new THREE.Mesh(new THREE.TubeGeometry(cur,26,0.017,8,false),MAT.manguera));
}

// --------------------------------------------------------- el analizador
let panTex=null, panCv=null, panCtx=null, ledAna=null;
function construyeAnalizador(d){
  gAna.clear();
  if(!panCv){
    panCv=document.createElement('canvas'); panCv.width=512; panCv.height=320;
    panCtx=panCv.getContext('2d');
    panTex=new THREE.CanvasTexture(panCv); panTex.colorSpace=THREE.SRGBColorSpace;
  }
  const x=d.xAna, z=d.zAna;
  const carro=roundedBox(0.68,1.16,0.52,MAT.caja,0.06);
  pon(carro,[x,0.58,z]); carro.castShadow=true; gAna.add(carro);
  const pan=new THREE.Mesh(new THREE.PlaneGeometry(0.56,0.36),
    new THREE.MeshBasicMaterial({map:panTex,toneMapped:false}));
  pon(pan,[x,0.96,z+0.262]); gAna.add(pan);
  for(let i=0;i<4;i++){
    const b=new THREE.Mesh(new THREE.CylinderGeometry(0.020,0.020,0.03,12),MAT.crom);
    b.rotation.x=Math.PI/2; pon(b,[x-0.21+i*0.14,0.66,z+0.262]); gAna.add(b);
  }
  ledAna=new THREE.Mesh(new THREE.SphereGeometry(0.030,14,10),MAT.ok);
  pon(ledAna,[x+0.24,1.10,z+0.24]); gAna.add(ledAna);
  // Cuatro ruedecillas: en un centro de verificación el equipo se mueve.
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    const r=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.03,12),MAT.goma);
    r.rotation.x=Math.PI/2; pon(r,[x+sx*0.26,0.035,z+sz*0.20]); gAna.add(r);
  }
  gAna.add(rot3('analizador de cinco gases',TINTA,[x,1.42,z]));
}

// La pantalla del analizador: los cinco gases y el Factor Lambda, como los
// publica un equipo de verdad. En la verificación a ciegas NO se enciende hasta
// que el alumno corre la prueba: un equipo apagado no regala nada.
// El contenido sólo cambia cuando cambia el estado, y esto se llama en cada
// fotograma: sin la firma, la escena repinta un lienzo de 512×320 y sube una
// textura a la tarjeta sesenta veces por segundo para no cambiar ni un píxel.
let panFirma=null;
function pintaPanel(){
  if(!panCtx) return;
  const W=512,H=320,c=panCtx;
  c.fillStyle='#060a0f'; c.fillRect(0,0,W,H);
  c.strokeStyle='#16202c'; c.lineWidth=1;
  const P=publicaPanel();
  const firma=JSON.stringify([P.enciende,P.rot,P.lam,P.mal,P.v]);
  if(firma===panFirma) return;
  panFirma=firma;
  c.fillStyle='#060a0f'; c.fillRect(0,0,W,H);
  c.strokeStyle='#16202c'; c.lineWidth=1;
  c.strokeRect(8,8,W-16,H-16);
  c.textAlign='left';
  if(!P.enciende){
    c.fillStyle='#9aa6b6'; c.font='600 19px Inter,system-ui,sans-serif';
    c.textAlign='center';
    c.fillText('equipo en espera',W/2,H/2-8);
    c.font='500 14px Inter,system-ui,sans-serif';
    c.fillText('corre la prueba para tomar la muestra',W/2,H/2+20);
    c.textAlign='left'; panTex.needsUpdate=true; return;
  }
  c.fillStyle='#7b8697'; c.font='600 13px Inter,system-ui,sans-serif';
  c.fillText(P.rot,20,32);
  let y=70;
  for(const g of ['CO','CO2','O2','HC','NOx']){
    c.fillStyle='#9aa6b6'; c.font='600 15px Inter,system-ui,sans-serif';
    c.fillText(GAS_ROT[g],22,y);
    c.fillStyle=P.mal.includes(g)?'#ff6b6b':'#e8eef6';
    c.font='700 20px ui-monospace,Menlo,Consolas,monospace';
    c.textAlign='right'; c.fillText(gasF(g,P.v[g]),W-90,y);
    c.textAlign='left';
    c.fillStyle='#5b6675'; c.font='500 13px Inter,system-ui,sans-serif';
    c.fillText(UNI[g],W-80,y);
    y+=42;
  }
  c.fillStyle='#9aa6b6'; c.font='600 14px Inter,system-ui,sans-serif';
  c.fillText('λ',22,y+4);
  c.fillStyle=P.mal.includes('lambda')?'#ff6b6b':'#5ad1e6';
  c.font='700 18px ui-monospace,Menlo,Consolas,monospace';
  c.textAlign='right'; c.fillText(lamF(P.lam),W-90,y+4); c.textAlign='left';
  panTex.needsUpdate=true;
}

function construyeBanco(){
  ROTULOS.length=0;
  const e=MQ(), d=dims(e), F=FA();
  construyeSuelo(d);
  construyeRodillos(d);
  construyeVehiculo(d,e);
  construyeEscape(d,e,F);
  construyeAnalizador(d);
  colocaTablero(d);
}

// ---------------------------------------------------------------- animación
// Los rodillos giran cuando la prueba pide velocidad, y se paran cuando no: en
// el método estático el coche no se mueve, y eso es la mitad de la diferencia
// entre las dos pruebas.
let RELOJ=0, PINTADAS=0;
function pinta3D(dt){
  RELOJ+=dt; PINTADAS++;
  const V=veredicto();
  const gira=(G.metodo==='dinamico'&&!G.libre)?1:0;
  if(rodA&&rodB){
    const w=gira*5.2;
    rodA.rotation.y+=w*dt; rodB.rotation.y+=w*dt;
  }
  if(ledAna) ledAna.material=!publicaPanel().enciende?MAT.apag
    :(V.invalida?MAT.avi:(V.aprueba?MAT.ok:MAT.bad));
  if(humoM&&humoM.visible){
    humoM.material.opacity=0.20+0.14*Math.sin(RELOJ*3.1);
    humoM.scale.y=1+0.12*Math.sin(RELOJ*2.3);
  }
  if(catM){
    // El material es propio de esta lata —se crea en cada construyeBanco()—, así
    // que se puede mutar sin tocar el de nadie más. Y se muta con setHex, no con
    // un THREE.Color nuevo: esto corre en cada fotograma.
    const ef=eficacias(MQ(),LAM_AQUI(),FA());
    catM.material.emissive.setHex(ef.encendido?0x3a2408:0x000000);
    catM.material.emissiveIntensity=ef.encendido?0.55:0;
  }
  pintaPanel();
}

// Reparto uniforme en filas de como mucho cuatro: trece opciones en filas de
// cuatro dejan 4/4/4/1 y la última fila estira un botón de punta a punta. Con el
// reparto uniforme salen 4/3/3/3 y todos miden lo mismo.
function fila(rot,attr,ops,cur){
  const filas=Math.max(1,Math.ceil(ops.length/4));
  let h='<div class="gl" style="margin:9px 0 4px"><span>'+rot+'</span></div>';
  let i=0;
  for(let f=0;f<filas;f++){
    const n=Math.ceil((ops.length-i)/(filas-f));
    h+='<div class="modebar">'+ops.slice(i,i+n).map(o=>
      '<button class="b'+(String(o[0])===String(cur)?' on':'')+'" '+attr+'="'+o[0]+'">'+o[1]+'</button>'
    ).join('')+'</div>';
    i+=n;
  }
  return h;
}
// Las vistas que barren λ. En las demás, un mando de mezcla no cambiaría nada de
// lo que se está mirando, y un mando que no hace nada visible se lee como roto.
const VISTAS_LAMBDA=['quimica','cadena','catalizador','nox'];
const LAM_OPS=[[0.85,'0,85'],[0.92,'0,92'],[0.98,'0,98'],[1.00,'1,00'],[1.05,'1,05'],[1.15,'1,15']];
const CARGA_OPS=[[0,'0 %'],[0.12,'12 %'],[0.35,'35 %'],[0.60,'60 %'],[1,'100 %']];
const GAS_OPS=[['CO','CO'],['CO2','CO₂'],['O2','O₂'],['HC','HC'],['NOx','NOx']];
function faseOps(){
  return PUNTOS_M().map((P,i)=>[i,'fase '+(i+1)]);
}
function syncCtrl(){

  h+=fila('Vehículo','data-maq',ARQ_KEYS.map(k=>[k,ARQ[k].corto]),G.maq);
  // En la verificación a ciegas NO se ofrece la avería: elegirla sería ver la

  if(!ciego) h+=fila('Avería','data-esc',
    ESCEN_KEYS.map(k=>[k,corta(ESC_CORTO[k]||ESCEN[k].rot,18)]),G.esc);

  if(!ciego) h+=fila('Método de prueba','data-met',

// -------------------------------------------- lo que el analizador PUBLICA
// Una sola función decide qué enseña la pantalla del equipo, y de ella cuelgan
// el panel 3D, el piloto del analizador y la prueba de fuga del reto. Si la
// regla viviera en dos sitios, uno de los dos acabaría enseñando de más.
function publicaPanel(){
  if(G.modo==='reto'&&!RETO.corrida)
    return {enciende:false, rot:'', v:{}, lam:null, mal:[], fuente:'apagado'};
  if(G.libre&&G.modo!=='reto'){
    const Q=PUNTO_LIBRE();
    return {enciende:true, rot:'punto libre · λ '+lamF(Q.lam),
      v:{CO:Q.medido.CO,CO2:Q.medido.CO2,O2:Q.medido.O2,HC:Q.medido.HC,NOx:Q.medido.NOx},
      lam:Q.lamCalc, mal:[], fuente:'libre'};
  }
  const V=VERIF(), p=V.pts[FASE()];
  // `mal` marca en rojo lo que rebasa el límite. No es un chivatazo: el límite
  // sale del año-modelo, que está a la vista, y la lectura también.
  return {enciende:true, rot:p.rot,
    v:{CO:p.CO,CO2:p.CO2,O2:p.O2,HC:p.HC,NOx:p.NOx},
    lam:p.lamCalc, mal:p.fallos, fuente:'prueba'};
}

// ----------------------------------------------------------------- telemetría
const gl=(l,v,c)=>'<div class="g"><div class="gl"><span>'+l+'</span><b'+(c?' class="'+c+'"':'')+'>'+v+'</b></div></div>';
function pintaTele(){
  const e=MQ(), L=LECT(), V=VERIF(), Q=PUNTO_LIBRE(), P=publicaPanel();
  const lim=limites(G.metodo,e.anio);
  let h='';
  if(G.modo==='reto'){
    // A ciegas sólo se enseña lo que un verificador ve: el vehículo, su año, el
    // método y lo que el equipo imprime. Ni el λ del motor, ni la temperatura de
    // pico, ni la eficacia del catalizador, ni el NOx de antes del catalizador.
    h+=gl('Vehículo',e.corto);
    h+=gl('Año-modelo',anio(e.anio));
    h+=gl('Método',MET_ROT[G.metodo]);
    h+=gl('Tabla que aplica',lim.tabla+' · '+lim.rot);
    h+=gl('Límites','HC '+num(lim.HC,0)+' · CO '+num(lim.CO,1)+' · O₂ '+num(lim.O2,1)+
      (lim.NOx===null?' · sin NOx':' · NOx '+num(lim.NOx,0)));
    h+=gl('Avería','oculta hasta entregar','warn');
    if(!RETO.corrida){
      h+=gl('Muestra','sin tomar','warn');
    }else{
      RETO.V.pts.forEach((p,i)=>{
        h+=gl('Fase '+(i+1),p.rot);
        for(const g of ['CO','CO2','O2','HC','NOx'])
          h+=gl(GAS_ROT[g],gasF(g,p[g]),p.fallos.includes(g)?'bad':'good');
        h+=gl('CO + CO₂',pcv(p.dilucion),p.dilBaja||p.dilAlta?'bad':'good');
        h+=gl('Factor Lambda',p.lamAplica?lamF(p.lamCalc):'no aplica aquí',
          p.lamFalla?'bad':(p.lamAplica?'good':'warn'));
      });
    }
    el('tele').innerHTML=h;
    return;
  }
  h+=gl('Vehículo',e.corto+' · '+anio(e.anio));
  h+=gl('Postratamiento',e.catalizador?(e.treVias?'tres vías':'dos vías'):'ninguno',
    e.catalizador?'good':'warn');
  if(!L.aplica) h+=gl('Esta avería','no aplica: '+L.porQueNo,'warn');
  h+=gl('Método',MET_ROT[G.metodo]);
  h+=gl('Tabla que aplica',lim.tabla+' · '+lim.rot);
  // El punto de trabajo de la GRÁFICA, que no es el de la prueba: la prueba
  // tiene sus dos fases y las pone la norma. Decir cuál es cuál evita leer dos
  // cifras del mismo motor como si fueran del mismo sitio.
  h+=gl('Punto de la gráfica',(G.libre?'mezcla elegida':'mezcla del motor')+
    ' · carga '+pcc(G.carga*100,0));
  h+=gl('λ ahí',lamF(Q.lam));
  h+=gl('λ que calcula el equipo ahí',lamF(Q.lamCalc),
    Q.lamCalc!==null&&Math.abs(Q.lamCalc-Q.lam)>0.02?'bad':'good');
  h+=gl('Temperatura de pico',kel(Q.tPico));
  h+=gl('Oxida el catalizador',pcc(Q.ef.ox*100,0),Q.ef.ox>0.8?'good':'warn');
  h+=gl('Reduce el catalizador',pcc(Q.ef.red*100,0),Q.ef.red>0.8?'good':'warn');
  h+=gl('NOx antes del catalizador',ppm(Q.nox0,0));
  h+=gl('NOx en la cola',ppm(Q.medido.NOx,0));
  h+=gl('Lo que el equipo publica',P.enciende?P.rot:'nada');
  for(const g of ['CO','CO2','O2','HC','NOx'])
    h+=gl(GAS_ROT[g]+' publicado',P.enciende?gasF(g,P.v[g]):'—',
      P.mal.includes(g)?'bad':'good');
  h+=gl('CO + CO₂',pcv(V.pts[FASE()].dilucion),
    V.pts[FASE()].dilBaja||V.pts[FASE()].dilAlta?'bad':'good');
  h+=gl('Veredicto · '+MET_CORTO[G.metodo],
    V.invalida?'medición inválida':(V.aprueba?'aprueba':'rechaza'),
    V.invalida?'warn':(V.aprueba?'good':'bad'));
  const otroM=G.metodo==='dinamico'?'estatico':'dinamico', otro=L[otroM==='dinamico'?'din':'est'];
  h+=gl('Veredicto · '+MET_CORTO[otroM],
    otro.invalida?'medición inválida':(otro.aprueba?'aprueba':'rechaza'),
    otro.invalida?'warn':(otro.aprueba?'good':'bad'));
  const cs=(G.metodo==='dinamico'?L.criteriosDin:L.criteriosEst);
  h+=gl('Criterios caídos',cs.length?cs.map(c=>CRIT_ROT[c]||c).join(' · '):'ninguno',
    cs.length?'bad':'good');
  el('tele').innerHTML=h;
}

// ------------------------------------------------------------------- informe
function pintaInforme(){
  if(G.modo==='reto'){ pintaReto(); return; }
  const e=MQ(), L=LECT(), V=veredicto(), lim=limites(G.metodo,e.anio);
  let h='<b>'+ESCEN[G.esc].rot.replace(/^./,c=>c.toUpperCase())+'</b> en '+
    e.nombre.toLowerCase()+', por el '+MET_ROT[G.metodo]+'. ';
  if(!L.aplica){
    h+='<b class="warn">Esta avería no aplica aquí</b>: '+L.porQueNo+
      ', así que lo que ves son exactamente las cifras del sistema sano. No es que la avería no haga nada: es que no puede existir en este vehículo. ';
  }
  if(V.invalida){
    h+='La medición <b class="warn">no es válida</b>: la suma CO+CO₂ se sale de la ventana de '+
      num(DIL_MIN,0)+' a '+num(DIL_MAX,1)+' %. '+
      (V.esMuestreo?'Está entrando aire en la muestra antes de la celda, así que estas cifras no dicen nada del motor. '
        :'Con la muestra así, ninguna de las otras cinco lecturas significa lo que parece. ');
  }else if(V.aprueba){
    h+='<b class="good">Aprueba</b> los seis criterios de la '+lim.tabla+' «'+lim.rot+'». ';
  }else{
    h+='<b class="bad">Rechaza</b> por '+V.cs.map(c=>CRIT_ROT[c]||c).join(', ')+
      ', y con uno basta (num. 5.1.5). ';
  }
  // Qué se ha movido respecto del MISMO vehículo sano en la MISMA prueba.
  const mov=[];
  const p=V.V.pts[0], s=V.SV.pts[0];
  if(V.subeCO) mov.push('el CO sube de '+gasF('CO',s.CO)+' a '+gasF('CO',p.CO));
  if(V.subeHC) mov.push('el HC sube de '+gasF('HC',s.HC)+' a '+gasF('HC',p.HC));
  if(V.subeNOx) mov.push('el NOx sube de '+gasF('NOx',s.NOx)+' a '+gasF('NOx',p.NOx));
  if(V.subeO2) mov.push('el O₂ sube de '+gasF('O2',s.O2)+' a '+gasF('O2',p.O2));
  if(V.dilBaja) mov.push('la suma CO+CO₂ cae de '+pcv(s.dilucion)+' a '+pcv(p.dilucion));
  h+=mov.length?'Contra este mismo vehículo sano en la misma fase: '+mov.join(', ')+'. '
    :'Contra este mismo vehículo sano en la misma fase no se mueve ninguna lectura de forma apreciable. ';
  // Y la pregunta incómoda: ¿los dos métodos dicen lo mismo?
  if(V.discrepan){
    h+='<b class="warn">Los dos métodos no coinciden</b>: por el '+MET_ROT[G.metodo]+' '+
      (V.V.aprueba?'aprueba':'rechaza')+' y por el otro '+(V.otro.aprueba?'aprueba':'rechaza')+'. '+
      (L.soloPorTabla
        ? 'Y no es por las emisiones, que son las mismas: es porque a un '+anio(e.anio)+
          ' le toca «'+limites('dinamico',e.anio).rot+'» en la TABLA 1 y «'+
          limites('estatico',e.anio).rot+'» en la TABLA 2. Los cortes de año de las dos tablas no coinciden.'
        : 'La diferencia está en lo que cada método mide: el estático no tiene límite de NOx ninguno, y sus dos fases no piden trabajo al motor.');
  }else{
    h+='Los dos métodos coinciden en el veredicto';
    h+=PASAN().includes(G.esc)
      ? ', y los dos la dejan pasar: esta avería sale del centro con su comprobante.'
      : '.';
  }
  el('report').innerHTML=h;
}

// --------------------------------------------------------------- orquestación
function afterEdit(){
  invalida(); construyeBanco(); pintaTablero(); pintaTele(); pintaInforme();
  syncCtrl(); pintaPregunta();
}
function cambiaMaquina(k){
  if(!ARQ[k]) return;
  G.maq=k;
  // La avería puede no existir en el vehículo nuevo. NO se cambia sola: el
  // modelo sabe decir por qué no aplica y la interfaz lo dice en pantalla, que
  // enseña más que saltar a «sano» sin avisar.
  if(G.modo==='reto') armaReto();
  G.resuelto=false;
  afterEdit(); refrescaPregunta();
  const t=camConjunto(MARGEN[G.modo]||1.00); S.moveTo(t[0],t[1],0.9);
}
// El encuadre es lo único que cambia de un modo a otro, y sólo para acercarse un
// poco cuando la vista lleva mucho texto.
const MARGEN={quimica:1.00, cadena:0.98, catalizador:0.98, nox:0.98,
  traza:0.97, veredicto:0.96, censo:0.95, reto:0.96};
function setMode(m){
  // Al salir del reto sin haber entregado, el vehículo vuelve a estar sano: si
  // no, la avería del caso se queda puesta y la siguiente vista la enseña con
  // nombre y apellidos.
  const salgoDelReto=(G.modo==='reto'&&m!=='reto'&&!RETO.veredicto);
  G.modo=m;
  if(salgoDelReto){ G.esc='sano'; RETO.caso=null; RETO.corrida=false; invalida(); }
  if(m==='reto') armaReto();
  pintaHUD(); afterEdit(); refrescaPregunta();
  const t=camConjunto(MARGEN[m]||1.00); S.moveTo(t[0],t[1],1.1);
}

// ============================== T4b · RETO, CUESTIONARIO, RECORRIDO Y ARRANQUE
const RETO={caso:null, corrida:false, V:null, sel:[], veredicto:null, pistas:0};

function barajaEn(a){                       // Fisher-Yates, para que la posición
  for(let i=a.length-1;i>0;i--){            // de la respuesta no sea la pista
    const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
// Los casos del reto: las averías que PUEDEN darse en este vehículo, más el
// sistema sano. Que «sano» sea un caso posible es deliberado: un verificador que
// siempre encuentra algo no está verificando.
function RETO_CASOS(){ return escenariosDe(MQ()); }
function armaReto(){
  const casos=RETO_CASOS();
  RETO.caso=casos[Math.floor(Math.random()*casos.length)];
  G.esc=RETO.caso;
  // El método lo pone el centro, no el alumno: es la mitad del veredicto, y
  // poder cambiarlo mientras se dictamina convertiría el reto en un tanteo.
  G.metodo=METODOS[Math.floor(Math.random()*METODOS.length)];
  RETO.corrida=false; RETO.V=null; RETO.sel=[]; RETO.veredicto=null; RETO.pistas=0;
  G.resuelto=false;
  invalida(); pintaDxReto();
}
// Correr la prueba: el equipo toma la muestra y publica. Hasta que esto pasa, la
// pantalla del analizador está apagada y la telemetría no enseña ninguna cifra.
function correPrueba(){
  if(G.modo!=='reto'||RETO.corrida) return;
  RETO.corrida=true; RETO.V=VERIF();
  synth.beep(560,0.10,0.05);
  construyeBanco(); pintaTablero(); pintaTele(); pintaReto();
}
const DX_OPS=[
  ['aprueba','APRUEBA'],
  ['invalida','la medición no vale'],
  ['HC','rechaza · HC'],
  ['CO','rechaza · CO'],
  ['O2','rechaza · O₂'],
  ['NOx','rechaza · NOx'],
  ['lambda','rechaza · λ'],
];
function pintaDxReto(){
  el('dxreto').innerHTML=DX_OPS.map(o=>
    '<button class="b'+(RETO.sel.includes(o[0])?' on':'')+'" data-dx="'+o[0]+'">'+o[1]+'</button>').join('');
}
function eligeDx(k){
  if(G.modo!=='reto'||RETO.veredicto) return;
  // «Aprueba» y «no vale» son exclusivos de todo lo demás: un veredicto no puede
  // ser a la vez una aprobación y un rechazo por CO.
  if(k==='aprueba'||k==='invalida') RETO.sel=RETO.sel.includes(k)?[]:[k];
  else{
    RETO.sel=RETO.sel.filter(x=>x!=='aprueba'&&x!=='invalida');
    RETO.sel=RETO.sel.includes(k)?RETO.sel.filter(x=>x!==k):RETO.sel.concat([k]);
  }
  pintaDxReto(); pintaTablero(); pintaReto();
}
// Lo que había que contestar. Sale del motor, no de una lista escrita a mano.
function esperadoReto(){
  const V=RETO.V||VERIF();
  if(V.invalida) return ['invalida'];
  if(V.aprueba) return ['aprueba'];
  return V.motivos.slice().sort();
}
function pintaReto(){
  let h='<b>Vehículo bajo verificación:</b> '+MQ().nombre+'. ';
  h+=RETO.corrida?'Muestra tomada por el '+MET_ROT[G.metodo]+'. ':'Muestra sin tomar. ';
  if(RETO.veredicto)
    h+=(RETO.veredicto.ok?'<b class="good">Acertaste.</b> ':'<b class="bad">Fallaste.</b> ')+RETO.veredicto.texto;
  else if(!RETO.corrida) h+='Pulsa «Correr la prueba»: hasta que el equipo no chupe muestra, no hay nada que leer.';
  else h+='Lee los seis criterios y entrega tu dictamen. Recuerda que hay TRES desenlaces: aprueba, rechaza por lo que sea, o la medición no vale.';
  el('report').innerHTML=h;
}
function pistaReto(){
  if(G.modo!=='reto'||RETO.veredicto) return;
  RETO.pistas++;
  const p=[
    'Antes que nada, la suma CO+CO₂. Si se ha caído por debajo de '+num(DIL_MIN,0)+' %, la muestra viene con aire y ninguna de las otras cinco lecturas significa lo que parece.',
    'El límite no lo pone el motor: lo pone el AÑO-MODELO, y no es el mismo en las dos tablas. Mira contra qué casilla estás juzgando.',
    'El Factor Lambda no aplica en marcha mínima (num. 4.2.2.1). Si la fase de ralentí sale con λ raro, no es un criterio: es una casilla que ahí no se rellena.',
    'Con el método estático no hay límite de NOx ninguno. Una avería de NOx puede pasar la prueba entera sin que salte nada.',
    'Basta que se caiga UNO (num. 5.1.5). Pero el dictamen tiene que decir cuáles se cayeron, no sólo que rechaza.',
  ][Math.min(RETO.pistas-1,4)];
  showToast('<b>Pista '+RETO.pistas+'</b><br>'+p,5200);
}
function entregaReto(){
  if(G.modo!=='reto'||!RETO.sel.length) return;
  if(!RETO.corrida){ showToast('<b>Todavía no hay muestra</b><br>Corre la prueba antes de dictaminar.',3200); return; }
  const esp=esperadoReto(), dado=RETO.sel.slice().sort();
  const ok=esp.join('|')===dado.join('|');
  const V=RETO.V, p0=V.pts[0], e=MQ(), lim=V.L;
  const rotDx=k=>(DX_OPS.find(o=>o[0]===k)||[k,k])[1];
  let t='Era <b>'+ESCEN[RETO.caso].rot+'</b>. ';
  t+='Por el '+MET_ROT[G.metodo]+', a un '+anio(e.anio)+' le toca la '+lim.tabla+
     ' «'+lim.rot+'»: HC ≤ '+num(lim.HC,0)+', CO ≤ '+num(lim.CO,1)+', O₂ ≤ '+num(lim.O2,1)+
     (lim.NOx===null?' y sin límite de NOx. ':' y NOx ≤ '+num(lim.NOx,0)+'. ');
  t+='En la fase 1 el equipo publicó CO '+gasF('CO',p0.CO)+', CO₂ '+gasF('CO2',p0.CO2)+
     ', O₂ '+gasF('O2',p0.O2)+', HC '+gasF('HC',p0.HC)+', NOx '+gasF('NOx',p0.NOx)+
     ', con CO+CO₂ = '+pcv(p0.dilucion)+'. ';
  t+='El dictamen correcto era «'+esp.map(rotDx).join(' + ')+'». ';
  if(V.invalida)
    t+='La suma CO+CO₂ está fuera de la ventana de la norma, así que esto no es un rechazo por emisiones: es una medición que no vale. ';
  else if(V.aprueba)
    t+='Ninguno de los criterios se rebasó. '+
      (RETO.caso!=='sano'
        ? 'Y sin embargo la avería estaba puesta: por este método, esta avería sale del centro con su comprobante.'
        : 'El vehículo estaba sano de verdad.');
  else
    t+='Se cayó '+(esp.length>1?'más de un criterio':'un criterio')+', y con uno basta (num. 5.1.5). ';
  const L=LECT_DE(RETO.caso);
  if(L.discrepan)
    t+=' Y ojo: por el otro método este mismo vehículo '+
      ((G.metodo==='dinamico'?L.est:L.din).aprueba?'APROBARÍA':'también rechazaría')+'.';
  if(!ok) t+=' Habías dicho «'+dado.map(rotDx).join(' + ')+'».';
  if(RETO.pistas) t+=' Con '+num(RETO.pistas,0)+' pista'+(RETO.pistas>1?'s':'')+'.';
  RETO.veredicto={ok,texto:t};
  G.resuelto=ok;
  synth.beep(ok?720:220,0.14,0.08);
  pintaReto(); pintaTablero(); pintaTele();
}

// ---------------------------------------------------------------- cuestionario
// Las preguntas se DERIVAN del estado: cambiar de vehículo, de avería o de método
// cambia las respuestas, así que no se pueden memorizar.
function preguntas(){
  const e=MQ(), L=LECT(), V=VERIF(), Q=PUNTO_LIBRE(), B=barrido();
  const lim=limites(G.metodo,e.anio), otroM=G.metodo==='dinamico'?'estatico':'dinamico';
  const limO=limites(otroM,e.anio);
  const iT=B.reduce((a,p,i)=>p.T>B[a].T?i:a,0);
  const iN=B.reduce((a,p,i)=>p.nox0>B[a].nox0?i:a,0);
  const T0=TRAZA(PUNTOS_M()[0]), ven=T0.ventana;
  const P=[];
  P.push({t:'A un '+anio(e.anio)+' verificado por el '+MET_ROT[G.metodo]+', ¿qué límite de HC le toca?',
    ops:[[lim.tabla+' «'+lim.rot+'» · '+ppm(lim.HC,0),true],
      [limO.tabla+' «'+limO.rot+'» · '+ppm(limO.HC,0),false],
      ['el que corresponda a su cilindrada, '+num(e.cilindrada,1)+' L',false],
      ['el mismo para todos los vehículos de gasolina',false]]});
  P.push({t:'El catalizador convierte CO en CO₂. ¿Qué le hace eso a la SUMA CO+CO₂?',
    ops:[['nada: el carbono ni se crea ni se destruye, y por eso esa suma mide la MUESTRA y no el motor',true],
      ['la sube, porque el CO₂ pesa más que el CO',false],
      ['la baja, porque parte del carbono se queda en el catalizador',false],
      ['la deja en el 20,9 %, que es el valor del aire',false]]});
  P.push({t:'El equipo imprime un Factor Lambda de '+lamF(Q.lamCalc)+'. ¿De dónde lo ha sacado?',
    ops:[['lo CALCULA con Brettschneider a partir del CO, el CO₂, el O₂ y el HC que ha medido',true],
      ['lo lee de la sonda de oxígeno del propio vehículo por el conector de diagnóstico',false],
      ['lo mide con una celda de circonio propia, independiente de los cinco gases',false],
      ['lo estima a partir del régimen y de la cilindrada',false]]});
  P.push({t:'En este motor la temperatura de pico es máxima en λ = '+lamF(B[iT].lam)+
      ' y el NOx en λ = '+lamF(B[iN].lam)+'. ¿Por qué no coinciden?',
    ops:[['porque el NOx va con la temperatura Y con el oxígeno disponible, y el oxígeno sólo crece hacia el lado pobre',true],
      ['porque el catalizador desplaza el máximo hacia el lado pobre',false],
      ['porque la medición del NOx llega con retraso por la manguera',false],
      ['porque a esa temperatura el NO ya se ha descompuesto en N₂ y O₂',false]]});
  P.push({t:'La NOM-047 promedia los segundos '+num(ven[0],0)+' a '+num(ven[ven.length-1],0)+
      ' de la fase. ¿Por qué al final y no al principio?',
    ops:[['porque entre la sonda y la celda hay manguera: al principio de la fase la lectura todavía viene subiendo y saldría baja',true],
      ['porque el motor tarda ese tiempo en calentarse y antes contamina más',false],
      ['porque es el tiempo que el operador necesita para escribir la placa',false],
      ['porque el rizo del instrumento es mayor al principio de la fase',false]]});
  P.push({t:'NOM-041 num. 5.1.5: ¿cuándo cumple un vehículo?',
    ops:[['cuando no rebasa NINGUNO de los límites que le aplican',true],
      ['cuando la media de sus emisiones queda por debajo de la media de los límites',false],
      ['cuando rebasa como mucho uno de los límites',false],
      ['cuando el Factor Lambda está entre 0,95 y 1,05, sea cual sea el resto',false]]});
  // --- preguntas que sólo existen si el estado las hace existir ---------------
  if(V.invalida)
    P.push({t:'Aquí la suma CO+CO₂ vale '+pcv(V.pts.find(p=>!p.valida).dilucion)+
        ', fuera de la ventana de '+num(DIL_MIN,0)+' a '+num(DIL_MAX,1)+' %. ¿Qué procede?',
      ops:[['la medición NO vale: se busca por dónde entra aire, se arregla y se vuelve a medir',true],
        ['se rechaza el vehículo por exceso de emisiones',false],
        ['se aprueba, porque una muestra diluida siempre da valores más bajos',false],
        ['se repite la prueba por el otro método, que no tiene ese criterio',false]]});
  if(PASAN().includes(G.esc)&&G.esc!=='sano')
    P.push({t:'Este vehículo APRUEBA por el '+MET_ROT[G.metodo]+' con «'+ESCEN[G.esc].rot+'» puesta. ¿Qué demuestra eso?',
      ops:[['que aprobar la verificación y tener el motor bien no son lo mismo: la norma mide lo que sale por la cola, no el estado del motor',true],
        ['que la avería no existe: si no se ve en los gases, no está',false],
        ['que el equipo de medición está descalibrado',false],
        ['que hay que repetir la prueba hasta que la avería aparezca',false]]});
  if(lim.NOx===null)
    P.push({t:'La TABLA 2 no tiene columna de NOx. ¿Qué consecuencia tiene?',
      ops:[['que por el método estático una avería de NOx —una recirculación pegada, un avance excesivo— pasa la prueba sin que salte nada',true],
        ['que el método estático mide el NOx pero no lo imprime',false],
        ['que los vehículos verificados en estático no producen NOx',false],
        ['que el NOx se juzga con el límite de la TABLA 1 aunque la prueba sea estática',false]]});
  if(L.discrepan&&L.soloPorTabla)
    P.push({t:'Este mismo vehículo, con estas mismas emisiones, aprueba por un método y rechaza por el otro. ¿Por qué?',
      ops:[['porque los cortes de año-modelo de las dos tablas no coinciden: 1990/1991 en la TABLA 1 y 1993/1994 en la TABLA 2',true],
        ['porque el método dinámico mide con más exactitud',false],
        ['porque en el dinámico el motor está caliente y en el estático no',false],
        ['porque uno de los dos resultados es un error del equipo',false]]});
  if(Q.ef.red>0.5&&Q.nox0>1000)
    P.push({t:'El motor echa '+ppm(Q.nox0,0)+' de NOx y por la cola salen '+ppm(Q.medido.NOx,0)+
        '. ¿Qué está midiendo la verificación?',
      ops:[['lo que sale a la atmósfera, que es lo correcto para una norma ambiental, pero NO el estado del motor',true],
        ['el estado del motor, porque el catalizador no altera el NOx',false],
        ['un valor sin sentido: el NOx no se puede medir después del catalizador',false],
        ['el promedio de los dos, que es lo que la norma define',false]]});
  return P;
}
let QI=0, QSEL=null, QCACHE=null;
function bancoQ(){
  if(!QCACHE){ QCACHE=preguntas();
    QCACHE.forEach(q=>{ q.baraja=barajaEn(q.ops.map(o=>({o}))); }); }
  return QCACHE;
}
function refrescaPregunta(){ QCACHE=null; QI=0; QSEL=null; pintaPregunta(); }
function pintaPregunta(){
  const B=bancoQ(); if(!B.length){ el('quiz').innerHTML=''; return; }
  const q=B[QI%B.length];
  let h='<div class="lt">Pregunta '+((QI%B.length)+1)+' de '+B.length+'</div>';
  h+='<div class="console">'+q.t+'</div>';
  h+='<div class="btns">'+q.baraja.map((b,i)=>{
    const bien=b.o[1];
    // Antes de contestar, ninguna opción va marcada: marcar la correcta de
    // salida sería regalar la respuesta. Después, la correcta se pinta verde
    // —esté o no elegida— y la elegida por error, roja.
    const cls=QSEL===null?'':(bien?' right':(i===QSEL?' wrong':''));
    return '<button class="b dx'+cls+'" data-q="'+i+'">'+b.o[0]+'</button>';
  }).join('')+'</div>';
  h+='<div class="modebar" style="margin-top:8px"><button class="b" data-qnext="1">Siguiente pregunta</button></div>';
  el('quiz').innerHTML=h;
}
function pregunta(i){
  const B=bancoQ(), q=B[QI%B.length];
  if(QSEL!==null) return;
  QSEL=i;
  synth.beep(q.baraja[i].o[1]?700:210,0.10,0.06);
  pintaPregunta();
}

// ------------------------------------------------------------------- sucesos
// Un ÚNICO despachador delegado. Nada de onclick en el HTML generado: el cuerpo
// del laboratorio va dentro de un <script type="module"> y sus funciones no
// existen en el ámbito global, así que un onclick inline no encuentra nada.
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  const id=b.id;
  if(id==='btnAuto'){ runAuto(); return; }
  if(id==='btnCorre'){ correPrueba(); return; }
  if(id==='btnPista'){ pistaReto(); return; }
  if(id==='btnEntrega'){ entregaReto(); return; }
  if(id==='btnOtro'){ paraAuto(); armaReto(); afterEdit(); refrescaPregunta(); return; }
  if(b.dataset.mode){ paraAuto(); setMode(b.dataset.mode); return; }
  if(b.dataset.maq){ paraAuto(); cambiaMaquina(b.dataset.maq); return; }
  if(b.dataset.esc){ paraAuto(); G.esc=b.dataset.esc; G.resuelto=false; afterEdit(); refrescaPregunta(); return; }
  if(b.dataset.met){ paraAuto(); G.metodo=b.dataset.met; afterEdit(); refrescaPregunta(); return; }
  if(b.dataset.fase!==undefined){ G.fase=Number(b.dataset.fase); afterEdit(); return; }
  if(b.dataset.carga!==undefined){ paraAuto(); G.carga=Number(b.dataset.carga); afterEdit(); refrescaPregunta(); return; }
  if(b.dataset.libre!==undefined){ paraAuto(); G.libre=b.dataset.libre==='1'; afterEdit(); refrescaPregunta(); return; }
  if(b.dataset.lam!==undefined){ paraAuto(); G.lam=Number(b.dataset.lam); afterEdit(); refrescaPregunta(); return; }
  if(b.dataset.gas){ G.gasTraza=b.dataset.gas; afterEdit(); return; }
  if(b.dataset.dx){ eligeDx(b.dataset.dx); return; }
  if(b.dataset.q!==undefined){ pregunta(Number(b.dataset.q)); return; }
  if(b.dataset.qnext){ QI++; QSEL=null; pintaPregunta(); return; }
});
document.addEventListener('keydown',ev=>{
  if(ev.target&&/^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
  const i=Number(ev.key);
  if(i>=1&&i<=MODES.length){ paraAuto(); setMode(MODES[i-1]); }
});

    lamRalenti:e.lamRalenti, lamCrucero:e.lamCrucero, lamCarga:e.lamCarga,
    escenarios:escenariosDe(e)}; },
  // El punto de la GRÁFICA: la mezcla que se está mirando, que no es ninguna de
  // las fases del protocolo.
  get punto(){ const Q=PUNTO_LIBRE(); return {lam:Q.lam, carga:G.carga, libre:G.libre,
    crudo:{CO:Q.crudo.CO,CO2:Q.crudo.CO2,O2:Q.crudo.O2,HC:Q.crudo.HC,H2:Q.crudo.H2},
    cat:{CO:Q.cat.CO,CO2:Q.cat.CO2,O2:Q.cat.O2,HC:Q.cat.HC,NOx:Q.cat.NOx},
    medido:{CO:Q.medido.CO,CO2:Q.medido.CO2,O2:Q.medido.O2,HC:Q.medido.HC,NOx:Q.medido.NOx},
    nox0:Q.nox0, lamCalc:Q.lamCalc, tPico:Q.tPico, dilucion:Q.dilucion,
    ef:{ox:Q.ef.ox, red:Q.ef.red, salud:Q.ef.salud, tCat:Q.ef.tCat,
      encendido:Q.ef.encendido, hay:Q.ef.hay, treVias:Q.ef.treVias},
    fFallo:Q.crudo.fFallo}; },
  get lect(){ const L=LECT(); const emp=V=>({aprueba:V.aprueba, invalida:V.invalida,
    motivos:V.motivos.slice(), tabla:V.L.tabla, rot:V.L.rot,
    lim:{HC:V.L.HC,CO:V.L.CO,O2:V.L.O2,NOx:V.L.NOx},
    pts:V.pts.map(p=>({k:p.k, rot:p.rot, rpm:p.rpm, carga:p.carga, ralenti:p.ralenti,
      lamMotor:p.lamMotor, lamCalc:p.lamCalc,
      CO:p.CO, CO2:p.CO2, O2:p.O2, HC:p.HC, NOx:p.NOx,
      dilucion:p.dilucion, dil:p.dil, fallos:p.fallos.slice(),
      dilBaja:p.dilBaja, dilAlta:p.dilAlta, lamAplica:p.lamAplica, lamFalla:p.lamFalla,
      valida:p.valida, aprueba:p.aprueba, tPico:p.tPico, fFallo:p.fFallo,
      crudo:{CO:p.crudo.CO,CO2:p.crudo.CO2,O2:p.crudo.O2,HC:p.crudo.HC,NOx:p.crudo.NOx}}))});
    return {esc:L.esc, rot:L.rot, clave:L.clave, falla:L.falla,
      aplica:L.aplica, porQueNo:L.porQueNo, discrepan:L.discrepan, soloPorTabla:L.soloPorTabla,
      lamMotor:L.lamMotor, lamCalc:L.lamCalc, sesgoLambda:L.sesgoLambda,
      criteriosEst:L.criteriosEst.slice(), criteriosDin:L.criteriosDin.slice(),
      est:emp(L.est), din:emp(L.din)}; },
  // Lo que la pantalla del analizador PUBLICA de verdad. Es la superficie por la
  // que un reto a ciegas se escapa, así que se comprueba desde fuera.
  get panel(){ const P=publicaPanel(); return {enciende:P.enciende, rot:P.rot,
    fuente:P.fuente, lam:P.lam, mal:P.mal.slice(),
    v:P.enciende?{CO:P.v.CO,CO2:P.v.CO2,O2:P.v.O2,HC:P.v.HC,NOx:P.v.NOx}:null}; },
  // Lo que las chapas del banco DICEN: de una textura no se lee texto, y el 3D
  // también puede regalar la respuesta.
  get rotulos(){ return ROTULOS.slice(); },
  get censo(){ return {criterios:CENSO().map(c=>({criterio:c.criterio, n:c.n,
    atrapa:c.atrapa.slice()})), pasan:PASAN().slice(),
    pasanOtro:PASAN(G.metodo==='dinamico'?'estatico':'dinamico').slice(),
    escenarios:escenariosDe(MQ()).filter(k=>k!=='sano')}; },
  get barrido(){ const B=barrido();
    const iT=B.reduce((a,p,i)=>p.T>B[a].T?i:a,0);
    const iN=B.reduce((a,p,i)=>p.nox0>B[a].nox0?i:a,0);
    const iC=B.reduce((a,p,i)=>p.crudo.CO2>B[a].crudo.CO2?i:a,0);
    const ven=B.filter(p=>p.ef.ox>0.80&&p.ef.red>0.80);
    return {n:B.length, lamTMax:B[iT].lam, lamNoxMax:B[iN].lam, lamCO2Max:B[iC].lam,
      tMax:B[iT].T, noxMax:B[iN].nox0,
      ventana:ven.length?[ven[0].lam,ven[ven.length-1].lam]:null}; },
  traza(){ const T=TRAZA(PUNTOS_M()[0]);
    const g=G.gasTraza, pr=(a,b)=>{ let s=0,n=0; for(let t=a;t<=b;t++){ s+=T.pts[t][g]; n++; } return s/n; };
    const Lb=lectura(MQ(),PUNTOS_M()[0],FA());
    return {gas:g, n:T.pts.length, dur:T.dur, ventana:T.ventana.slice(),
      estacionario:T.est[g], publicado:Lb[g], primeros:pr(1,5), medios:pr(11,15),
      tau:RESP_TAU}; },
  get reto(){ return {caso:RETO.caso, metodo:G.metodo, corrida:RETO.corrida,
    sel:RETO.sel.slice(), esperado:RETO.corrida?esperadoReto():null,
    veredicto:RETO.veredicto?RETO.veredicto.ok:null, pistas:RETO.pistas,
    casos:RETO_CASOS().slice()}; },
  get preguntas(){ return preguntas().map(q=>({t:q.t, n:q.ops.length,
    correctas:q.ops.filter(o=>o[1]).length})); },
  get texto(){ return el('report').textContent+' || '+el('tele').textContent; },
  get autoRunning(){ return AUTO!==null; },
  setMaquina(k){ cambiaMaquina(k); },
  setEsc(k){ G.esc=k; G.resuelto=false; afterEdit(); refrescaPregunta(); },
  setMetodo(m){ G.metodo=m; afterEdit(); refrescaPregunta(); },
  setFase(i){ G.fase=i; afterEdit(); },
  setCarga(c){ G.carga=c; afterEdit(); refrescaPregunta(); },
  setLibre(v){ G.libre=!!v; afterEdit(); refrescaPregunta(); },
  setLam(l){ G.lam=l; afterEdit(); refrescaPregunta(); },
  setGas(g){ G.gasTraza=g; afterEdit(); },
  setMode(m){ setMode(m); },
  corre(){ correPrueba(); },
  elige(k){ eligeDx(k); },
  entrega(){ entregaReto(); },
  pista(){ pistaReto(); },
  arma(){ armaReto(); afterEdit(); refrescaPregunta(); },
  // Para poder poner un caso concreto del reto sin depender del azar.
  armaCaso(k,met){ armaReto(); RETO.caso=k; G.esc=k; if(met) G.metodo=met;
    RETO.corrida=false; RETO.V=null; RETO.sel=[]; RETO.veredicto=null;
    invalida(); afterEdit(); refrescaPregunta(); },
};

{ const t=camConjunto(MARGEN.quimica); S.moveTo(t[0],t[1],0.01); }
