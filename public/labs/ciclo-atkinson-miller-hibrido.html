<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Ciclo Atkinson del motor híbrido — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#0E1419;--panel:rgba(10,16,22,.88);--line:#2C4150;--ink:#EEF3F6;
    --dim:#A2B5C1;--accent:#FFA94D;--accent2:#FFD7A3;--hv:#5BC8FF;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cA:#FFA94D;--cO:#8FB8D6;--cM:#3DDC97;--cK:#FF5A6A;--cI:#5BC8FF;--cX:#FF7A45;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#16222c;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#203240}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#1d1000;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#1d1000;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#ffc27d}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#1d1000}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#FFA94D;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f87a0;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f90a8;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#1d1000}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .escs{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
  .esc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px;font-size:11.5px;line-height:1.35;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);color:#c4d3e6}
  .esc .rs{font-weight:700;font-size:11px}.esc .rs.ok{color:var(--good)}.esc .rs.mal{color:#ff9a9a}
  .esc .pista{font-size:10.5px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#09121c;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .clases{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
  .clases .b{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;padding:4px 8px;font-size:12px;line-height:1.2}
  .clases .b small{font-size:9.5px;color:var(--dim);font-weight:400}
  .clases .b.on small{color:#5a3a00}
  .clases .b .pr{color:var(--hv);letter-spacing:.06em;font-size:10.5px}
  .clases .b.on .pr{color:#5a3a00}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(30,53,80,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,53,80,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f87a0}
  .dk-tit{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#a3bcd6;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c6da;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#16222c;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfdcec;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cA);flex:none}
  /* ---- el recorrido paso a paso y el aro que señala la pieza ---- */
  .tour{border:1px solid rgba(255,169,77,.40);background:rgba(255,169,77,.06);border-radius:12px;padding:10px 11px;display:flex;flex-direction:column;gap:7px}
  .tour .tn{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .tour .pts{display:flex;gap:5px}.tour .pts i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}.tour .pts i.on{background:var(--accent)}.tour .pts i.ok{background:var(--good)}
  .tour h3{font-size:16px;line-height:1.2}
  .tour .tx{font-size:13px;line-height:1.5;color:#d3e3ea}.tour .tx b{color:#fff}
  .tour .tb{display:flex;gap:6px}.tour .tb .b{flex:1}
  .tour .salta{align-self:flex-end;font-size:11px;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:0;font-family:inherit}
  .foco{position:fixed;z-index:14;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 3px rgba(255,169,77,.60),0 0 24px 6px rgba(255,169,77,.45);pointer-events:none;display:none;animation:pulso 1.5s ease-in-out infinite}
  @keyframes pulso{0%,100%{transform:scale(.88);opacity:.95}50%{transform:scale(1.12);opacity:.55}}
  @media (prefers-reduced-motion:reduce){.foco{animation:none}}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,18,30,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,18,30,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d3e6}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,18,30,.92);border:1px solid rgba(255,200,140,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,18,30,.84);border:1px solid rgba(255,200,140,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .chips{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .chip{font-size:11.5px;line-height:1.35;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--dim)}
  .chip b{color:var(--ink)} .chip small{font-size:10.5px;color:var(--dim)}
  .chip.ok{border-color:rgba(52,211,153,.5)} .chip.ok b{color:var(--good)} .chip.mal{border-color:rgba(244,71,94,.5)} .chip.mal b{color:#ff9aa8}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   LAB — CICLO ATKINSON/MILLER DEL MOTOR HÍBRIDO: COMPRIMIR MENOS, EXPANDIR MÁS
   (Autotrónica · mecanica-159)

   Un cilindro de gasolina cortado por la mitad, con su pistón, sus dos válvulas y su cigüeñal. El alumno cambia CUÁNDO CIERRA la
   válvula de admisión: si cierra tarde, el pistón ya sube y devuelve parte del aire al colector, así que el motor comprime menos de
   lo que expande (ciclo Atkinson/Miller). Gasta menos gasolina por kilómetro, pero atrapa menos aire y empuja menos: el par que falta
   lo pone el motor eléctrico del híbrido. Todo —el pistón, las válvulas, el color del gas, el diagrama P–V, las cifras— sale de un único
   modelo en un bloque puro que un script de Node extrae TAL CUAL y verifica.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO=' ';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }



/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos marcas— y lo prueba:
   lo que se prueba es lo que corre. */
/* FISICA:INICIO */
/* ---- Ciclo Atkinson/Miller de un motor híbrido: un cilindro de aire estándar con cierre tardío de la válvula de admisión. Física pura (sin three). SI salvo donde se diga. ----
   Cadena: la geometría biela-manivela da V(θ) → la admisión entra a la presión del colector p_m y, mientras la válvula sigue abierta en la
   carrera de compresión, el pistón EMPUJA parte de la carga de vuelta al colector: la masa atrapada es m = p_m·V_cierre/(R·T) →
   compresión isentrópica desde V_cierre (relación de compresión EFECTIVA r_c = V_cierre/V_c) → combustión con ley de Wiebe resuelta con
   la primera ley (dp/dθ = [−γ·p·V′ + (γ−1)·dQ/dθ]/V) → expansión isentrópica hasta el PMI (relación de expansión r_e = la geométrica) →
   escape y bombeo. Par, consumo, detonación (Livengood–Wu con el retardo de Douaud–Eyzat) y reparto con el motor eléctrico. */
const DOSPI=Math.PI*2, RAD=Math.PI/180;
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const suave=t=>{ t=clamp(t,0,1); return t*t*(3-2*t); };

/* ---- El motor: 4 cilindros de 449 cm³ (1,8 L), carrera larga, biela de 140 mm ---- */
const MOT={B:0.0805,S:0.0883,L:0.140,NC:4};
const A_P=Math.PI*MOT.B*MOT.B/4, A_M=MOT.S/2, VD=A_P*MOT.S, VD_TOT=VD*MOT.NC;
const X_PMS=A_M+MOT.L;                                          // posición del bulón (desde el eje del cigüeñal) en el PMS
/* ---- El gas y el combustible (valores DIDÁCTICOS; la ficha los declara) ---- */
const R_GAS=287, GAMMA=1.32, CV=R_GAS/(GAMMA-1);
const T_ADM=320;                                                // temperatura de la carga al cerrar la admisión (K)
const AFR=14.7, LHV=43e6, XI=0.65;                              // mezcla estequiométrica; poder calorífico (J/kg); fracción del calor del combustible que llega al gas
/* Pérdida de calor a las paredes: la relación superficie/volumen de la cámara en el PMS crece cuando la cámara se aplana (r grande).
   ξ(r) = XI·(1 − HL·(SV(r)/SV(r_ref) − 1)), con SV = 2/h + 4/B y h = S/(r − 1) la altura de la cámara. Correlación DIDÁCTICA. */
const HL=0.10, SV=r=>2*(r-1)/MOT.S+4/MOT.B;
const xiDe=r=>XI*(1-HL*(SV(r)/SV(10.5)-1));
const qAire=r=>xiDe(r)*LHV/AFR;                                 // calor al gas por kg de aire (J/kg)
const P_ESC=1.05e5, P_PLENA=0.95e5;                             // presión de escape y del colector con la mariposa abierta (Pa)
/* ---- Combustión: ley de Wiebe ---- */
const ENC=-12, DUR=40, W_A=5, W_M=2;                            // salto de chispa (° respecto al PMS), duración (°), parámetros de Wiebe
/* ---- Cierre de la admisión y rangos de los mandos ---- */
const IVO=350;                                                  // apertura (° desde el PMS de encendido, en 720°): fija, 10° antes del PMS de admisión
const EVO=180, EVC=370;                                         // el escape abre en el PMI y cierra 10° después del PMS
const L_VALV=9;                                                 // alzada máxima de las válvulas (mm)
const IVC_REF=45, R_REF=10.5;                                   // el motor de referencia: Otto convencional
const IVC_MIN=30, IVC_MAX=110, R_MIN=9, R_MAX=17;
const LIM={tmg:45,pmg:32e3};                                    // límites del motor eléctrico: par máximo (N·m) y potencia (W)
const S_EQ=3.0;                                                 // kWh de combustible que cuesta cada kWh eléctrico de la batería (se repone luego con el motor térmico)
const ETA_MG=0.92;                                              // rendimiento del motor eléctrico + inversor
const fmep=n=>(0.45+0.15*n/1000)*1e5;                           // presión media de fricción (Pa)
const C_K=1.4;                                                  // calibración del retardo de autoencendido: con ella el motor de referencia a plena carga con 91 octanos queda cerca del límite
/* ---- El reto ---- */
const RETO={kMax:0.80,mgMax:15};
const ESCENARIOS=[
  {id:'carretera',nombre:'Carretera',n:2400,par:100,ron:91,meta:0.050},
  {id:'cuesta',nombre:'Cuesta suave',n:2000,par:100,ron:87,meta:0.040},
  {id:'ciudad',nombre:'Ciudad',n:1600,par:85,ron:87,meta:0.055},
];
const escPorId=id=>ESCENARIOS.find(e=>e.id===id)||ESCENARIOS[0];

/* ---- Geometría biela-manivela. θ en grados desde el PMS de encendido ---- */
const posBulon=th=>{ const t=th*RAD, s=A_M*Math.sin(t); return A_M*Math.cos(t)+Math.sqrt(MOT.L*MOT.L-s*s); };
const vc=r=>VD/(r-1);
const volumen=(r,th)=>vc(r)+A_P*(X_PMS-posBulon(th));
const dVdth=th=>{ const t=th*RAD, s=Math.sin(t), c=Math.cos(t); return A_P*A_M*(s+A_M*s*c/Math.sqrt(MOT.L*MOT.L-A_M*A_M*s*s))*RAD; };   // m³ por grado
/** Volumen atrapado al cerrar la admisión (φ° después del PMI de compresión, que está en 540°) */
const vIVC=(r,phi)=>volumen(r,180-phi);
/** Relación de compresión EFECTIVA */
const rEfec=(r,phi)=>vIVC(r,phi)/vc(r);

/* ---- Wiebe normalizada: fracción quemada x(θ) y su derivada por grado ---- */
const wiebeN=1-Math.exp(-W_A);
function xQuem(th,enc,dur){ const u=(th-enc)/dur; if(u<=0) return 0; if(u>=1) return 1; return (1-Math.exp(-W_A*Math.pow(u,W_M+1)))/wiebeN; }
function dxQuem(th,enc,dur){ const u=(th-enc)/dur; if(u<=0||u>=1) return 0; return W_A*(W_M+1)*Math.pow(u,W_M)*Math.exp(-W_A*Math.pow(u,W_M+1))/wiebeN/dur; }

/* ---- El núcleo: el ciclo cerrado, por unidad de presión del colector (p_m = 1 Pa); todo lo de presión escala con p_m ---- */
const _cacheNu=new Map();
function nucleo(r,phi,opt){
  const o=Object.assign({enc:ENC,dur:DUR},opt||{}), usaCache=!opt, clave=r.toFixed(4)+'|'+phi.toFixed(4);
  if(usaCache&&_cacheNu.has(clave)) return _cacheNu.get(clave);
  const Vc=vc(r), V1=vIVC(r,phi), Vbdc=Vc+VD, m1=V1/(R_GAS*T_ADM), Qt=m1*qAire(r);
  const thS=o.enc, thE=o.enc+o.dur, Vs=volumen(r,thS);
  let p=Math.pow(V1/Vs,GAMMA);                                       // compresión isentrópica hasta la chispa (p_m = 1)
  const ps=p, n=Math.max(1,Math.ceil(o.dur/(o.paso||0.25))), hh=o.dur/n;
  const f=(th,pp)=>(-GAMMA*pp*dVdth(th)+(GAMMA-1)*Qt*dxQuem(Math.min(th,thE-1e-9),o.enc,o.dur))/volumen(r,th);   // (en el último paso, el valor del lado de dentro)
  const tab=new Float64Array(n+1); tab[0]=p;
  for(let i=0;i<n;i++){ const th=thS+i*hh, k1=f(th,p), k2=f(th+hh/2,p+hh/2*k1), k3=f(th+hh/2,p+hh/2*k2), k4=f(th+hh,p+hh*k3); p+=hh/6*(k1+2*k2+2*k3+k4); tab[i+1]=p; }
  const pe=p, Ve=volumen(r,thE), p4=pe*Math.pow(Ve/Vbdc,GAMMA);
  const Wcerr=Qt-(p4*Vbdc-V1)/(GAMMA-1);                              // trabajo del ciclo cerrado (J por Pa): primera ley de IVC a EVO
  let pmax=0,imax=0; for(let i=0;i<=n;i++) if(tab[i]>pmax){ pmax=tab[i]; imax=i; }
  const thPm=thS+imax*hh, Tmax=pmax*volumen(r,thPm)/(m1*R_GAS), T4=p4*Vbdc/(m1*R_GAS);
  const nu={r,phi,Vc,V1,Vbdc,m1,Qt,thS,thE,Vs,ps,hh,n,tab,pe,Ve,p4,Wcerr,pmax,thPmax:thPm,rc:V1/Vc,eta_cerr:Wcerr/Qt,T2:T_ADM*Math.pow(V1/Vc,GAMMA-1),T4,Tmax};
  if(usaCache){ if(_cacheNu.size>200) _cacheNu.clear(); _cacheNu.set(clave,nu); }
  return nu;
}
/** Rendimiento ideal del ciclo cerrado (combustión instantánea en el PMS), en forma cerrada: 1 − (T4 − T1)/(T3 − T2). */
function etaIdeal(r,phi){
  const rc=rEfec(r,phi), T2=T_ADM*Math.pow(rc,GAMMA-1), T3=T2+qAire(r)/CV, T4=T3*Math.pow(r,1-GAMMA);
  return 1-(T4-T_ADM)/(T3-T2);
}
/** Retardo de autoencendido (ms): Douaud–Eyzat (1978), p en Pa, T en K. Fórmula A VERIFICAR con la fuente; aquí escalada por C_K. */
const tauMs=(p,T,ron)=>C_K*17.68*Math.pow(ron/100,3.402)*Math.pow(p/101325,-1.7)*Math.exp(3800/T);
/** Integral de Livengood–Wu del gas sin quemar (K ≥ 1: detona), mientras dura la combustión. pm: Pa; n: rpm. */
function detona(nu,pm,n,ron){
  const dtGrado=1/(6*n)*1000, T_s=T_ADM*Math.pow(nu.V1/nu.Vs,GAMMA-1);
  let K=0; const tab=nu.tab, N=nu.n;
  const g=i=>1/tauMs(pm*tab[i],T_s*Math.pow(tab[i]/nu.ps,(GAMMA-1)/GAMMA),ron);
  for(let i=0;i<N;i++) K+=0.5*(g(i)+g(i+1))*nu.hh*dtGrado;
  return K;
}

/* ---- El punto de funcionamiento del motor térmico ---- */
const ciclosPorSeg=n=>MOT.NC*n/120;                                  // ciclos por segundo de los 4 cilindros (4 tiempos: una vez cada 2 vueltas)
function motor(r,phi,n,pm,ron,sinK){
  const nu=nucleo(r,phi), Vc=nu.Vc, V1=nu.V1, Vb=nu.Vbdc;
  const Wc=nu.Wcerr*pm;                                              // J por cilindro y ciclo (cerrado)
  const Wbomba=-P_ESC*(Vb-Vc)+pm*(V1-Vc);                            // escape (−) + admisión neta (+): el bombeo
  const Wnet=Wc+Wbomba, imep=Wnet/VD, pmep=-Wbomba/VD, fm=fmep(n);
  const bmep=imep-fm, par=bmep*VD_TOT/(4*Math.PI), w=n*DOSPI/60, pot=par*w;
  const m=nu.m1*pm, mf=m/AFR, Ef=mf*LHV, mdotF=mf*ciclosPorSeg(n);
  return {nu,pm,m,mf,Ef,Wc,Wbomba,Wnet,imep,pmep,fmep:fm,bmep,par,pot,mdotF,etaInd:Wnet/Ef,etaFreno:pot>0?pot/(mdotF*LHV):0,
    bsfc:pot>0?mdotF/pot*3.6e9:Infinity,K:sinK?0:detona(nu,pm,n,ron),pmax:nu.pmax*pm,Tmax:nu.Tmax,rc:nu.rc,etaId:etaIdeal(r,phi)};
}
/** Par de freno a plena carga (mariposa abierta) */
const parPleno=(r,phi,n)=>motor(r,phi,n,P_PLENA,91,true).par;
/** Presión de colector que da el par pedido (el motor es LINEAL en p_m); alcanza=false si ni abierta del todo llega. */
function pmPara(r,phi,n,par){
  const a=motor(r,phi,n,P_PLENA,91,true), b=motor(r,phi,n,0.5*P_PLENA,91,true);
  const dpar=(a.par-b.par)/(0.5*P_PLENA), pm=P_PLENA+(par-a.par)/dpar;
  return {pm,alcanza:pm<=P_PLENA+1e-6};
}
/* ---- El híbrido: el motor térmico pone lo que puede y el eléctrico completa; el consumo se mide en «combustible equivalente» ---- */
function hibrido(esc,r,phi){
  const w=esc.n*DOSPI/60, parMgMax=Math.min(LIM.tmg,LIM.pmg/w);
  const pl=parPleno(r,phi,esc.n), uso=pmPara(r,phi,esc.n,esc.par);

function cerrado(nu,r,th){

  for(let i=0;i<=NTR;i++){

    else if(th<360){ p[i]=P_ESC; T[i]=Texh; x[i]=1; }

  GAS.llama=new THREE.Mesh(fl,GAS.matF); GAS.llama.renderOrder=4; GAS.llama.visible=false; GAS.grupo.add(GAS.llama);
  const fl2=new THREE.PlaneGeometry(2,1); fl2.translate(0,0.5,0);
  GAS.llamaL=new THREE.Mesh(fl2,GAS.matF); GAS.llamaL.position.z=-0.1; GAS.llamaL.renderOrder=5; GAS.llamaL.visible=false; GAS.grupo.add(GAS.llamaL);
  GAS.chispa=new THREE.Mesh(new THREE.SphereGeometry(5,16,12),new THREE.MeshBasicMaterial({color:'#ffffff',toneMapped:false,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}));
  GAS.chispa.renderOrder=6; GAS.grupo.add(GAS.chispa);
  // el golpeteo: un anillo rojo en la pared que parpadea cuando el gas sin quemar se enciende solo
  const an=new THREE.TorusGeometry(RB-1.5,1.4,8,SEG3()+16); an.rotateX(Math.PI/2);
  GAS.golpe=new THREE.Mesh(an,new THREE.MeshBasicMaterial({color:'#ff4558',toneMapped:false,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}));
  GAS.golpe.renderOrder=6; GAS.grupo.add(GAS.golpe);
}

/* ---------- las partículas del aire que entra / sale y del humo ---------- */
const NPART=34;
const rutaFlujo=pts=>{ const c=new THREE.CatmullRomCurve3(pts.map(p=>V3(p[0],p[1],0)),false,'centripetal'); const n=160, t=[]; for(let i=0;i<=n;i++){ const q=c.getPointAt(i/n); t.push(q.x,q.y); } return {n,t,largo:c.getLength()}; };
const FLUJO_A=rutaFlujo([[-252,47],...TUBO_A.linea.slice().reverse(),[-50,45],[-34,35],[-X_V,22],[-X_V,3]]);          // del filtro de aire a la válvula de admisión
const FLUJO_E=rutaFlujo([[X_V,3],[X_V,22],[34,33],[48,41],...TUBO_E.linea.slice(1)]);                                    // de la válvula de escape a la salida
const PARTICULAS=[];
for(const [fl,col,nombre] of [[FLUJO_A,'#8fd3ff','adm'],[FLUJO_E,'#ffb36b','esc']]){
  const im=new THREE.InstancedMesh(new THREE.SphereGeometry(2.6,10,8),new THREE.MeshBasicMaterial({color:'#ffffff',toneMapped:false,transparent:true,opacity:0.95}),NPART);
  im.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(NPART*3).fill(1),3); im.frustumCulled=false; CULATA.add(im);
  const u=new Float32Array(NPART), dz=new Float32Array(NPART); for(let i=0;i<NPART;i++){ u[i]=i/NPART; dz[i]=-2.5-((i*7)%5)*1.1; }
  PARTICULAS.push({im,fl,col:new THREE.Color(col),u,dz,nombre});
}
function posFlujo(fl,u,out){ const f=clamp(u,0,1)*fl.n, i=Math.min(fl.n-1,Math.floor(f)), k=f-i; out.x=fl.t[i*2]*(1-k)+fl.t[(i+1)*2]*k; out.y=fl.t[i*2+1]*(1-k)+fl.t[(i+1)*2+1]*k; return out; }

/* ===================== 9. EL ESTADO Y EL RELOJ =====================
   Un solo cálculo (CALC) alimenta la escena, el dock y las cifras: se recalcula cuando cambia un mando. El reloj SIM.th es el ÁNGULO DEL
   CIGÜEÑAL (° en el ciclo de 720°) y avanza a REV_S vueltas por segundo —cámara lenta rotulada, el motor real gira de 1 600 a 2 400 rpm—;
   con ESE ángulo se mueven el pistón, las válvulas, las levas, el color del gas, la llama, las partículas, el motor eléctrico y el cursor
   de todas las gráficas. Los modos: «Recorrido» (paso a paso), «Probar» (mandos libres) y «Reto». */
const REV_S=0.8;                                                 // vueltas del cigüeñal por segundo en pantalla a velocidad ×1
const EST={modo:'tour',esc:'carretera',r:R_REF,phi:IVC_REF,vel:1,pausa:REDUCIDO,autoRunning:false,vista:'todo',rot:false};
const SIM={th:300,calc:null,ver:0,e:null};
let CALC=null;
const _cacheCalc=new Map();
function calcula(p){
  const esc=escPorId(p.esc), clave=p.esc+'|'+p.r.toFixed(3)+'|'+p.phi.toFixed(3);
  if(_cacheCalc.has(clave)) return _cacheCalc.get(clave);
  const crit=criterios(esc,p.r,p.phi), h=crit.h, tr=traza(p.r,p.phi,h.pm);
  const C={p,esc,crit,h,ref:crit.ref,tr,nu:tr.nu,rc:h.M.rc,golpea:h.K>1.0};
  if(_cacheCalc.size>40) _cacheCalc.clear();
  _cacheCalc.set(clave,C); return C;
}
/** Lo que corre ahora: en «Probar», lo que digan los mandos; en el recorrido y el reto, lo que pida el paso. */
function paramsActuales(){
  if(EST.modo==='tour'){ const p=tourParams(); if(p) return p; }
  if(EST.modo==='reto'){ const p=guiaParams(); if(p) return p; }
  return {esc:EST.esc,r:EST.r,phi:EST.phi};
}
let _rPrev=-1, _phiPrev=-1;
function reiniciaCalculo(){
  CALC=calcula(paramsActuales()); SIM.calc=CALC; SIM.ver++;
  const r=CALC.p.r, phi=CALC.p.phi;
  if(Math.abs(r-_rPrev)>1e-9){ _rPrev=r; const deck=deckDe(r); CULATA.position.y=deck; PARED.scale.y=(deck-PARED_Y0)/PARED_H; }
  if(Math.abs(phi-_phiPrev)>0.05){ _phiPrev=phi; ponLeva(V_ADM,540+phi-IVO); }
  if(typeof pintaDockFijo==='function') pintaDockFijo();
}
const lerpA=(a,k,f)=>a[k]+(a[Math.min(k+1,a.length-1)]-a[k])*f;
/* ---- el estado del cilindro en el ángulo th: V, p, T, fracción quemada, de la traza del modelo, interpolados ---- */
function estadoEn(th){
  const C=CALC; if(!C) return null; const T=C.tr, t=((th%720)+720)%720, kf=t/PASO_TR, k=Math.min(NTR-1,Math.floor(kf)), f=kf-k;
  const ev=elevacion(t,C.p.phi);
  return {th:t,k,carrera:carrera(t),V:lerpA(T.V,k,f),p:lerpA(T.p,k,f),T:lerpA(T.T,k,f),x:lerpA(T.x,k,f),adm:ev.adm,esc:ev.esc,dV:dVdth(t),ypin:posBulon(t)*1000};
}

/* ===================== 10. LO QUE SE VE ===================== */
const _m4=new THREE.Matrix4(), _q0=new THREE.Quaternion(), _col=new THREE.Color(), _p=new THREE.Vector3(), _s=new THREE.Vector3(), _pp={x:0,y:0};
const ocultaRespuesta=()=>EST.modo==='reto'&&GUIA.paso==='ajusta'&&!(GUIA.r2&&GUIA.r2.validado);   // el veredicto y el barrido, mientras se ajusta
/* ESCALA TÉRMICA ÚNICA: la misma tabla pinta el gas, el escape y la leyenda. Un color quiere decir una temperatura. */
const ESCALA_T=[[250,'#1c3f94'],[400,'#2f6fd0'],[650,'#5a8fd8'],[900,'#a05aa0'],[1200,'#c2412f'],[1600,'#f0642c'],[2000,'#f98a1c'],[2500,'#ffb627'],[3000,'#ffd84a'],[3500,'#fff1a6']];
const ESCALA_C=ESCALA_T.map(([t,h])=>[t,new THREE.Color(h)]);
function colorT(T,out){
  const o=out||new THREE.Color(), E=ESCALA_C;
  if(!(T>E[0][0])) return o.copy(E[0][1]);
  for(let i=1;i<E.length;i++) if(T<=E[i][0]){ const f=(T-E[i-1][0])/(E[i][0]-E[i-1][0]); return o.copy(E[i-1][1]).lerp(E[i][1],f); }
  return o.copy(E[E.length-1][1]);
}
const REL_ADM=R_POL1/R_POL2;                                     // la polea del motor eléctrico gira más rápido que la del cigüeñal
let faseCorrea=0, golpeFase=0;
const C_BOB_ON=new THREE.Color('#3DDC97'), C_BOB_OFF=new THREE.Color('#0d1512');
const Q_VERDE=new THREE.Color('#3DDC97'), Q_RET=new THREE.Color('#8fd3ff').lerp(Q_VERDE,0.85);
function aplicaEscena(dtS,dtSim,dtR){
  if(dtR===undefined) dtR=dtS;                                  // dtR: tiempo real del cuadro; suaviza lo visual aunque el reloj esté en pausa
  const C=CALC; if(!C) return;
  const dth=dtSim*REV_S*360;
  SIM.th=((SIM.th+dth)%720+720)%720;
  const e=estadoEn(SIM.th); if(!e) return; SIM.e=e;
  const deck=deckDe(C.p.r), thR=e.th*RAD, ypin=e.ypin, h=C.h, phi=C.p.phi;
  // ---- el pistón, la biela y el cigüeñal: la geometría biela-manivela del modelo ----
  PISTON.position.y=ypin;
  const xc=A_MM*Math.sin(thR), yc=A_MM*Math.cos(thR);
  BIELA.position.set(0,ypin,0); BIELA.rotation.z=Math.atan2(xc,-(yc-ypin));
  CIGUE.rotation.z=-thR;
  // ---- las válvulas, los muelles y las levas ----
  V_ADM.grp.position.y=-e.adm; V_ESC.grp.position.y=-e.esc;
  for(const [v,L] of [[V_ADM,e.adm],[V_ESC,e.esc]]){ if(Math.abs(L-v.lift)>0.01){ v.lift=L; v.muelle.ajusta(28-L); } }
  const dd=(a,b)=>((a-b+360)%720)-360;
  const thPicoA=(IVO+540+phi)/2, thPicoE=(EVO+EVC)/2;
  V_ADM.cam.rotation.z=(-90-dd(e.th,thPicoA)/2)*RAD; V_ESC.cam.rotation.z=(-90-dd(e.th,thPicoE)/2)*RAD;
  // ---- el gas: una lámina entre la corona y la culata, coloreada por la T del modelo; la llama crece con la fracción quemada ----
  const corona=ypin+CH, alto=Math.max(0.05,deck-corona), colG=colorT(e.T,_col);
  GAS.lamina.position.y=corona; GAS.lamina.scale.y=alto; GAS.cuerpo.position.y=corona; GAS.cuerpo.scale.y=alto;
  GAS.matG.color.copy(colG);
  const rho=(e.p/e.T)/(1e5/320);
  GAS.matG.opacity=clamp(0.20+0.075*rho,0.2,0.62);
  const tb=((e.th+360)%720)-360;                                   // −360..360 alrededor del PMS de encendido
  const enLlama=tb>=ENC&&tb<=EVO&&e.x>0.004;
  GAS.llama.visible=GAS.llamaL.visible=enLlama;
  if(enLlama){
    const rf=Math.min(RB-0.4,Math.sqrt(e.x*(e.V*1e9)/(Math.PI*alto))), fade=e.x>=0.999?clamp(1-(tb-C.nu.thE)/70,0.28,1):1;
    GAS.llama.scale.set(rf,alto,rf); GAS.llama.position.y=corona; GAS.llamaL.scale.set(rf,alto,1); GAS.llamaL.position.y=corona;
    GAS.matF.opacity=0.55*fade; GAS.matF.color.copy(colorT(Math.min(3300,e.T*1.05),_col));
  }
  const chispa=tb>=ENC-2&&tb<=ENC+3.5; GAS.chispa.position.set(0,deck-2.5,0); GAS.chispa.material.opacity=chispa?0.95:0; GAS.chispa.scale.setScalar(chispa?1.0+0.4*Math.sin(tb*2):0.1);
  golpeFase+=dtR*38;
  const golpe=C.golpea&&tb>=8&&tb<=44;
  GAS.golpe.position.y=corona+alto*0.5; GAS.golpe.material.opacity=golpe?0.35+0.55*Math.abs(Math.sin(golpeFase))*clamp((C.h.K-1)*2+0.3,0,1):0;
  // ---- el escape se calienta con el gas que pasa ----
  const calor=clamp((C.tr.T[Math.round(200/PASO_TR)]-500)/1100,0,1)*(e.esc>0.2?1:0.75);
  M_ESC_PARED.emissive.setRGB(0.6*calor,0.13*calor,0.02*calor); M_ESC_PARED.emissiveIntensity=1;
  // ---- la mariposa: se cierra para que el motor de referencia dé sólo el par pedido ----
  const ap=clamp(h.apertura,0.1,1);
  MARIPOSA.rotation.z=(Math.PI/2)*Math.pow(ap,2.3);
  // ---- el aire que entra, el que se devuelve y el humo ----
  flujoParticulas(e,dtR,dth);
  // ---- el motor eléctrico y la correa ----
  const tf=clamp(h.parMg/Math.max(1e-9,h.parMgMax),0,1);
  MG_ROTOR.rotation.z=-thR*REL_ADM;
  const thE=thR*REL_ADM*4;
  for(let i=0;i<N_BOB;i++){ const a=i/N_BOB*DOSPI, k=0.5+0.5*Math.sin(4*a+thE+Math.PI/2+(i%3)*0.0), v=clamp(0.05+tf*1.05*k,0.04,1.4);
    _col.copy(C_BOB_OFF).lerp(C_BOB_ON,Math.min(1,v)).multiplyScalar(v>1?v:1); IM_BOB.setColorAt(i,_col); }
  IM_BOB.instanceColor.needsUpdate=true; MG_ARO.material.opacity=0.12+0.78*tf;
  faseCorrea=((-thR*R_POL1/CORREA.largo)%1+1)%1;
  for(let i=0;i<24;i++){ const t=(faseCorrea+i/24)%1; CORREA.curva.getPointAt(t,_p); _m4.makeTranslation(_p.x,_p.y,_p.z); CORREA.dots.setMatrixAt(i,_m4); }
  CORREA.dots.instanceMatrix.needsUpdate=true;
}
const DV_MAX=(()=>{ let m=0; for(let t=0;t<=180;t+=1) m=Math.max(m,Math.abs(dVdth(t))); return m; })();
function flujoParticulas(e,dtR,dth){
  const C=CALC, ivc=540+C.p.phi;
  for(const P of PARTICULAS){
    const adm=P.nombre==='adm', abierta=adm?e.adm>0.15:e.esc>0.15;
    let dir=0; if(abierta){ dir=adm?Math.sign(e.dV):-Math.sign(e.dV); }
    const vel=abierta?Math.abs(e.dV)/DV_MAX:0;
    const du=dir*vel*0.0034*Math.abs(dth)*(dth<0?-1:1);
    for(let i=0;i<NPART;i++){
      P.u[i]=((P.u[i]+du)%1+1)%1;
      posFlujo(P.fl,P.u[i],_pp);
      const brillo=abierta?1:0.30, retorno=adm&&dir<0;
      _s.setScalar(abierta?1:0.8); _m4.compose(_p.set(_pp.x,_pp.y,P.dz[i]),_q0,_s); P.im.setMatrixAt(i,_m4);
      if(P.nombre==='esc') _col.copy(colorT(clamp(CALC.tr.T[Math.round(200/PASO_TR)]*1.12,900,1700),_col)); else _col.copy(retorno?Q_RET:P.col);
      _col.multiplyScalar(brillo); P.im.setColorAt(i,_col);
    }
    P.im.instanceMatrix.needsUpdate=true; P.im.instanceColor.needsUpdate=true;
  }
}

/* ===================== 13. EL HUD (izquierda) ===================== */
const enDiagnostico=()=>EST.modo==='reto'&&GUIA.paso==='diag'&&!GUIA.dxOk;
const enCalcula=()=>EST.modo==='reto'&&GUIA.paso==='calcula';
const NOMBRE_ESC={carretera:'Carretera',cuesta:'Cuesta',ciudad:'Ciudad'};
const FRASE='Cambias cuándo cierra una válvula del motor para que gaste menos gasolina, y ves cuánto par pierdes.';
const txtPhi=p=>fN(p,0)+'° tras el fondo', txtR=r=>fN(r,1)+' veces';
const NOMBRE_CARRERA=['Expansión','Escape','Admisión','Compresión'];
const infoEsc=e=>fN(e.n,0)+' rpm · pide '+fN(e.par,0)+' N·m · gasolina de '+fN(e.ron,0)+' octanos';
function slidersHTML(p,ids){

    <div class="formula">η = 1 − (T₄ − T₁) / (T₃ − T₂)</div>
    <div class="fl">Es el rendimiento del ciclo. T₁ es la temperatura al cerrar la válvula; T₂ = T₁·r<sub>c</sub><sup>γ−1</sup> al terminar de comprimir; T₃ tras quemar; T₄ = T₃·r<sub>e</sub><sup>1−γ</sup> al terminar de expandir. Si la válvula cierra en el fondo (r<sub>c</sub> = r<sub>e</sub> = r) sale la fórmula del Otto: η = 1 − r<sup>1−γ</sup>. ${M?`Aquí: ${fN(M.nu.rc,1)} de compresión, ${fN(C.p.r,1)} de expansión.`:''}</div>
    <div class="formula">r<sub>c</sub> = V<sub>cierre</sub> / V<sub>c</sub> · m = p<sub>m</sub>·V<sub>cierre</sub> / (R·T)</div>
    <div class="fl">Al cerrar tarde, V<sub>cierre</sub> es menor que el volumen del cilindro: el aire atrapado (m) y la compresión real (r<sub>c</sub>) bajan; la expansión sigue siendo la geométrica, r<sub>e</sub> = (V<sub>d</sub> + V<sub>c</sub>)/V<sub>c</sub>.</div>
    <div class="formula">dp/dθ = [−γ·p·dV/dθ + (γ−1)·dQ/dθ] / V · W<sub>neto</sub> = ∮ p dV</div>
    <div class="fl">La combustión (ley de Wiebe, 40°) se resuelve con la primera ley. El trabajo neto incluye el bombeo: el pistón empuja al escape y devuelve aire al colector.</div>
    <div class="formula">K = ∫ dt / τ(p, T) ≥ 1 → detona</div>
    <div class="fl">Livengood–Wu: el gas sin quemar se enciende solo cuando su retardo de autoencendido τ, que baja con la presión y la temperatura, se agota. ${M?`Aquí K = ${fN(M.K,2)} (el límite es 1).`:''}</div>
  </div></details>
  <details id="dSim"><summary>Simplificaciones</summary><div class="cuerpo"><ul class="no">
    <li>Es <b>aire estándar</b> con γ = ${fN(GAMMA,2)} y una fracción del calor del combustible (${fN(XI*100,0)} %, menos si la cámara es muy plana) que llega al gas; el resto se pierde por las paredes y la disociación. No es CFD ni un mapa medido de un fabricante.</li>
    <li>La admisión entra sin pérdidas a la presión del colector, y el aire que el pistón devuelve no se pierde por fricción en la válvula. La apertura de la admisión (350°) se supone fija.</li>
    <li>Sólo se mueve el <b>cierre</b> de la admisión; el resto de la distribución es fija. El golpeteo es el modelo de Livengood–Wu con el retardo de Douaud–Eyzat, escalado para que el motor normal quede cerca del límite.</li>
    <li>La <b>cámara lenta</b> es ×1/${fN((escPorId(C?C.p.esc:EST.esc).n/60)/REV_S,0)}; la correa y el disco del motor eléctrico son un esquema.</li>
  </ul><div class="src">Heywood, <i>Internal Combustion Engine Fundamentals</i> · Miller (1947) · Atkinson (1882) · Douaud y Eyzat (1978), a verificar con la fuente.</div></div></details></div>`;
  H.innerHTML=h; H.classList.toggle('guia',EST.modo!=='probar'); enlazaHUD(); ajustaHoja();

/* ===================== 14. EL DOCK (derecha): cifras y gráficas DOM ===================== */
const FUENTE="'Outfit',system-ui,sans-serif";
function lienzo(id){ const box=el(id), c=box.querySelector('canvas'); return {box,c,ctx:c.getContext('2d'),w:0,h:0,dpr:1}; }
function abre(L){ const r=L.box.getBoundingClientRect(), dpr=Math.min(3,window.devicePixelRatio||1);
  const w=Math.max(20,Math.round(r.width)), h=Math.max(20,Math.round(r.height));
  if(L.w!==w||L.h!==h||L.dpr!==dpr){ L.c.width=Math.round(w*dpr); L.c.height=Math.round(h*dpr); L.w=w; L.h=h; L.dpr=dpr; }
  const x=L.ctx; x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h); return x; }
function txt(x,t,px,py,col,size,align,peso){ x.fillStyle=col; x.font=(peso||'600')+' '+(size||11)+'px '+FUENTE; x.textAlign=align||'left'; x.textBaseline='alphabetic'; x.fillText(t,px,py); }
function raya(x,x1,y1,x2,y2,col,w,dash){ x.strokeStyle=col; x.lineWidth=w||1; x.setLineDash(dash||[]); x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke(); x.setLineDash([]); }
const LFU=lienzo('gFu'), LTR=lienzo('gTr'), LFR=lienzo('gFr'), LSP=lienzo('gSp');
const COL={act:'#FFA94D',ref:'#8FB8D6',mg:'#3DDC97',knock:'#FF5A6A',adm:'#5BC8FF',esc:'#FF7A45',fill:'rgba(255,169,77,0.17)'};
const GRID='rgba(160,200,220,0.10)', EJE='#46647a', TXT='#8eb3c5';
const sinDatos=(x,Wd,Hd,t)=>{ txt(x,t||'—',Wd/2,Hd/2+4,'#7f9aa8',t?11:14,'center','500'); };
/** La traza del motor de referencia (Otto normal) en el escenario actual. */
const _trRef=new Map();
function trazaRef(esc){ const R=referencia(esc), k=esc.id; if(!_trRef.has(k)) _trRef.set(k,traza(R_REF,IVC_REF,R.pm)); return _trRef.get(k); }
const PMAX_BAR=66;

/* ---- el diagrama P–V: el ciclo de ESTE motor (relleno) contra el motor normal (línea punteada) y el punto que se mueve con el reloj ---- */
function trazaPV(x,T,X,Y,col,w,dash,paso){ x.setLineDash(dash||[]); x.strokeStyle=col; x.lineWidth=w; x.beginPath(); for(let i=0;i<=NTR;i+=paso){ const px=X(T.V[i]*1e6), py=Y(T.p[i]/1e5); i?x.lineTo(px,py):x.moveTo(px,py); } x.closePath(); x.stroke(); x.setLineDash([]); }
function pintaPV(){
  const x=abre(LFU), Wd=LFU.w, Hd=LFU.h, C=CALC; if(!C) return;
  const X0=34, X1=Wd-10, Y0=10, Y1=Hd-22, vmax=520;
  const X=v=>X0+v/vmax*(X1-X0), Y=p=>Y1-p/PMAX_BAR*(Y1-Y0);
  for(const p of [0,20,40,60]){ raya(x,X0,Y(p),X1,Y(p),GRID); txt(x,String(p),X0-4,Y(p)+3,TXT,8.5,'right','500'); }
  for(const v of [0,100,200,300,400,500]){ raya(x,X(v),Y1,X(v),Y1+3,EJE); txt(x,String(v),X(v),Hd-9,TXT,8.5,'center','500'); }
  txt(x,'bar',X0+2,Y0+8,TXT,8.5,'left','600'); txt(x,'cm³ del cilindro',X1,Hd-1,TXT,8.5,'right','600');
  const T=C.tr, R=trazaRef(C.esc);
  trazaPV(x,R,X,Y,COL.ref,1.3,[4,3],4);
  x.fillStyle=COL.fill; x.beginPath(); for(let i=0;i<=NTR;i+=2){ const px=X(T.V[i]*1e6), py=Y(T.p[i]/1e5); i?x.lineTo(px,py):x.moveTo(px,py); } x.closePath(); x.fill();
  trazaPV(x,T,X,Y,COL.act,2,[],2);
  // el cierre de la admisión: donde empieza a comprimir de verdad
  const pc=X(C.nu.V1*1e6), py=Y(C.h.pm/1e5);
  x.fillStyle='#fff'; x.beginPath(); x.arc(pc,py,3.2,0,DOSPI); x.fill(); x.strokeStyle=COL.act; x.lineWidth=1.4; x.stroke();
  txt(x,'cierra',pc,py-6,'#ffd7a3',9,'center','600');
  const e=SIM.e; if(e){ const px=X(e.V*1e6), qy=Y(e.p/1e5); x.fillStyle='#fff'; x.beginPath(); x.arc(px,qy,4.2,0,DOSPI); x.fill(); x.strokeStyle='rgba(255,169,77,.9)'; x.lineWidth=2; x.stroke(); }
  el('t_fu').textContent=e?NOMBRE_CARRERA[e.carrera]+' · '+fN(e.th,0)+'°':'';
}
function pintaLeyFu(){
  el('leyFu').innerHTML=`<span class="lg"><i class="bl" style="--c:${COL.act}"></i>este motor</span><span class="lg"><i class="dash" style="--c:${COL.ref}"></i>motor normal (Otto)</span><span class="lg"><i class="bl" style="--c:rgba(255,169,77,.35)"></i>trabajo que entrega</span>`;
}
/* ---- la presión según el giro del cigüeñal, con las ventanas en que está abierta cada válvula ---- */
function pintaPTheta(){
  const x=abre(LTR), Wd=LTR.w, Hd=LTR.h, C=CALC; if(!C) return;
  const X0=24, X1=Wd-5, Y0=6, Y1=Hd-14, X=th=>X0+th/720*(X1-X0), Y=p=>Y1-p/PMAX_BAR*(Y1-Y0), ivc=540+C.p.phi;
  x.fillStyle='rgba(91,200,255,0.20)'; x.fillRect(X(IVO),Y1-7,X(ivc)-X(IVO),7);
  x.fillStyle='rgba(255,122,69,0.26)'; x.fillRect(X(EVO),Y1-7,X(EVC)-X(EVO),7);
  for(const p of [0,30,60]){ raya(x,X0,Y(p),X1,Y(p),GRID); txt(x,String(p),X0-3,Y(p)+3,TXT,8.5,'right','500'); }
  for(const th of [0,180,360,540,720]){ raya(x,X(th),Y1,X(th),Y1+3,EJE); txt(x,String(th),X(th),Hd-3,TXT,8,'center','500'); }
  const T=C.tr, R=trazaRef(C.esc);
  x.setLineDash([3,3]); x.strokeStyle=COL.ref; x.lineWidth=1.1; x.beginPath(); for(let i=0;i<=NTR;i+=2){ const px=X(i*PASO_TR), py=Y(R.p[i]/1e5); i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke(); x.setLineDash([]);
  x.strokeStyle=COL.act; x.lineWidth=1.8; x.beginPath(); for(let i=0;i<=NTR;i+=2){ const px=X(i*PASO_TR), py=Y(T.p[i]/1e5); i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke();
  const e=SIM.e; if(e){ raya(x,X(e.th),Y0,X(e.th),Y1,'rgba(255,255,255,0.85)',1.2); x.fillStyle='#fff'; x.beginPath(); x.arc(X(e.th),Y(e.p/1e5),3,0,DOSPI); x.fill(); }
  el('t_pw').textContent='colector '+fN(C.h.pm/1e5,2)+' bar';
}
/* ---- el mapa de consumo del motor de gasolina: qué tan eficiente es en cada régimen y par; el punto es el de ahora ---- */
const _mapa=new Map();
function mapaDe(C){ const k=C.p.r.toFixed(2)+'|'+C.p.phi.toFixed(1)+'|'+C.esc.ron; if(!_mapa.has(k)){ if(_mapa.size>12) _mapa.clear(); _mapa.set(k,mapaMotor(C.p.r,C.p.phi,C.esc.ron,18,17)); } return _mapa.get(k); }
const _mapaRef=new Map();
function mapaRefDe(C){ const k=C.esc.id; if(!_mapaRef.has(k)){ const o=[]; for(let i=0;i<18;i++){ const n=MAPA_N[0]+(MAPA_N[1]-MAPA_N[0])*(i+0.5)/18; o.push(parPleno(R_REF,IVC_REF,n)); } _mapaRef.set(k,o); } return _mapaRef.get(k); }
function colorBsfc(b){ // verde = come poco, ámbar, rojo = come mucho
  const t=clamp((b-245)/(360-245),0,1), a=[40,170,140], m=[236,190,70], z=[192,64,48];
  const u=t<0.5?t*2:(t-0.5)*2, p=t<0.5?a:m, q=t<0.5?m:z; return `rgb(${Math.round(p[0]+(q[0]-p[0])*u)},${Math.round(p[1]+(q[1]-p[1])*u)},${Math.round(p[2]+(q[2]-p[2])*u)})`; }
function pintaMapa(){
  const x=abre(LFR), Wd=LFR.w, Hd=LFR.h, C=CALC; if(!C) return;
  const X0=24, X1=Wd-5, Y0=6, Y1=Hd-14, mp=mapaDe(C), nx=mp.nx, ny=mp.ny;
  const X=n=>X0+(n-MAPA_N[0])/(MAPA_N[1]-MAPA_N[0])*(X1-X0), Y=t=>Y1-(t-MAPA_T[0])/(MAPA_T[1]-MAPA_T[0])*(Y1-Y0);
  const cw=(X1-X0)/nx+0.6, ch=(Y1-Y0)/ny+0.6;
  for(let i=0;i<nx;i++) for(let j=0;j<ny;j++){ const b=mp.cel[i*ny+j]; if(!isFinite(b)) continue; x.fillStyle=colorBsfc(b); x.fillRect(X0+i/nx*(X1-X0),Y1-(j+1)/ny*(Y1-Y0),cw,ch); }
  for(const t of [0,50,100,150]){ txt(x,String(t),X0-3,Y(t)+3,TXT,8.5,'right','500'); }
  for(const n of [1000,3000,5000]){ txt(x,fN(n/1000,0)+'k',X(n),Hd-3,TXT,8,'center','500'); }
  // la curva de par máximo del motor normal (punteada) y la de este motor, roja donde detonaría
  const ref=mapaRefDe(C);
  x.setLineDash([3,3]); x.strokeStyle='rgba(255,255,255,0.65)'; x.lineWidth=1.1; x.beginPath(); for(let i=0;i<18;i++){ const n=MAPA_N[0]+(MAPA_N[1]-MAPA_N[0])*(i+0.5)/18; const px=X(n), py=Y(ref[i]); i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke(); x.setLineDash([]);
  x.lineWidth=2.2; for(let i=1;i<nx;i++){ const n0=MAPA_N[0]+(MAPA_N[1]-MAPA_N[0])*(i-0.5)/nx, n1=MAPA_N[0]+(MAPA_N[1]-MAPA_N[0])*(i+0.5)/nx; x.strokeStyle=(mp.Kpl[i]>RETO.kMax||mp.Kpl[i-1]>RETO.kMax)?COL.knock:'#ffffff'; x.beginPath(); x.moveTo(X(n0),Y(mp.Tpl[i-1])); x.lineTo(X(n1),Y(mp.Tpl[i])); x.stroke(); }
  const h=C.h, px=X(C.esc.n), py=Y(h.M.par);
  x.fillStyle='#0b1218'; x.beginPath(); x.arc(px,py,5,0,DOSPI); x.fill(); x.fillStyle='#fff'; x.beginPath(); x.arc(px,py,3.2,0,DOSPI); x.fill();
  if(h.parMg>0.5){ const py2=Y(C.esc.par); x.strokeStyle=COL.mg; x.lineWidth=2; x.setLineDash([2,2]); x.beginPath(); x.moveTo(px,py); x.lineTo(px,py2); x.stroke(); x.setLineDash([]); x.fillStyle=COL.mg; x.beginPath(); x.arc(px,py2,3,0,DOSPI); x.fill(); }
  let mn=1e9; for(const b of mp.cel) if(isFinite(b)&&b<mn) mn=b;
  el('t_fr').textContent='mejor '+fN(mn,0)+' g/kWh';
}
/* ---- si sólo mueves el cierre: el par del motor de gasolina y el consumo, con el par pedido (se oculta mientras se ajusta) ---- */
function barridoDe(C){ if(!C.barrido) C.barrido=barridoPhi(C.esc,C.p.r,2); return C.barrido; }
function pintaBarrido(){
  const x=abre(LSP), Wd=LSP.w, Hd=LSP.h, C=CALC; if(!C) return;
  if(ocultaRespuesta()){ sinDatos(x,Wd,Hd,'esta curva se muestra al validar'); el('t_sp').textContent=''; return; }
  const B=barridoDe(C), X0=26, X1=Wd-30, Y0=6, Y1=Hd-13, X=p=>X0+(p-IVC_MIN)/(IVC_MAX-IVC_MIN)*(X1-X0);
  const YT=t=>Y1-t/140*(Y1-Y0); let bmn=1e9,bmx=0; for(const b of B){ bmn=Math.min(bmn,b.bsfcEq); bmx=Math.max(bmx,b.bsfcEq); } bmn=Math.floor(bmn/10)*10-5; bmx=Math.ceil(bmx/10)*10+5; const YB=b=>Y1-(b-bmn)/(bmx-bmn)*(Y1-Y0);
  for(const t of [0,50,100]){ raya(x,X0,YT(t),X1,YT(t),GRID); txt(x,String(t),X0-3,YT(t)+3,TXT,8.5,'right','500'); }
  for(const p of [30,50,70,90,110]){ raya(x,X(p),Y1,X(p),Y1+3,EJE); txt(x,String(p),X(p),Hd-2,TXT,8,'center','500'); }
  raya(x,X0,YT(C.esc.par),X1,YT(C.esc.par),'rgba(61,220,151,0.75)',1.2,[4,3]);
  x.strokeStyle=COL.act; x.lineWidth=1.9; x.beginPath(); B.forEach((b,i)=>{ const px=X(b.phi), py=YT(b.parIce); i?x.lineTo(px,py):x.moveTo(px,py); }); x.stroke();
  x.strokeStyle='#e9f3ff'; x.lineWidth=1.5; x.setLineDash([3,2]); x.beginPath(); B.forEach((b,i)=>{ const px=X(b.phi), py=YB(b.bsfcEq); i?x.lineTo(px,py):x.moveTo(px,py); }); x.stroke(); x.setLineDash([]);
  for(const b of [bmn+5,Math.round((bmn+bmx)/2/5)*5,bmx-5]) txt(x,fN(b,0),X1+3,YB(b)+3,'#bcd0dc',8.5,'left','500');
  raya(x,X(C.p.phi),Y0,X(C.p.phi),Y1,'rgba(255,255,255,0.85)',1.2);
  el('t_sp').textContent='par (ámbar) · consumo (blanco)';
}
function pintaGraficas(){ pintaPV(); pintaPTheta(); pintaMapa(); pintaBarrido(); }
function pintaDockFijo(){
  el('p_mode').textContent=EST.modo==='tour'?'Recorrido':(EST.modo==='probar'?(CALC?NOMBRE_ESC[CALC.esc.id]:''):(enCalcula()?'Un cálculo':(enDiagnostico()?'Averigua la falla':(CALC?NOMBRE_ESC[CALC.esc.id]:''))));

const _cl=(id,c)=>{ const e=el(id); if(e.className!==c) e.className=c; };
function pintaDock(){
  const C=CALC, e=SIM.e; if(!C||!e) return; const set=(id,h)=>{ const q=el(id); if(q.innerHTML!==h) q.innerHTML=h; };
  const h=C.h, M=h.M, sm=(v,u,d)=>fN(v,d===undefined?1:d)+'<small> '+u+'</small>';
  const Av=el('aviso'); let cl='',t='';
  el('p_sub').textContent=NOMBRE_CARRERA[e.carrera]+' · '+fN(e.th,0)+'°';
  const oc=ocultaRespuesta();   // al ajustar, el rendimiento y el consumo se descubren al validar
  set('f_1',oc?'<small>¿? al validar</small>':sm(M.etaFreno*100,'%')); _cl('f_1','');
  set('f_2',sm(M.par,'N·m',0)); _cl('f_2','');
  set('f_3',h.parMg>0.5?sm(h.parMg,'N·m',0):'<small>ninguno</small>'); _cl('f_3',h.faltaPar||h.parMg>RETO.mgMax?'warn':'');
  set('f_4',fN(M.rc,1)+'<small> : 1</small>'); _cl('f_4','');
  set('f_5',oc?'<small>¿? al validar</small>':sm(h.bsfcEq,'g/kWh',0)); _cl('f_5','');
  const kp=h.K*100; set('f_6',kp>999?'<small>detona</small>':sm(kp,'%',0)); _cl('f_6',h.K>1?'bad':(h.K>RETO.kMax?'warn':''));
  el('l_f4').textContent='Compresión real'; el('l_f5').textContent=oc?'Consumo':'Consumo (Otto '+fN(C.ref.bsfcEq,0)+')'; el('l_f6').textContent='Golpeteo';
  if(enDiagnostico()||enCalcula()){ cl=''; t=''; }
  else if(h.K>1){ cl='mal'; t='¡Detona! El gas sin quemar se enciende solo y golpea el pistón: se comprime demasiado.'; }
  else if(h.faltaPar){ cl='mal'; t='Falta par: ni con el motor eléctrico al máximo se llega a lo que pide el coche.'; }
  else if(e.carrera===3&&e.adm>0.1){ cl='ojo'; t='La válvula sigue abierta con el pistón subiendo: devuelve aire al colector, por eso comprime menos.'; }
  else if(h.apertura<0.8&&!h.abierta){ cl='ojo'; t='La mariposa está cerrada al '+fN((1-h.apertura)*100,0)+' %: sobra aire y el motor lo estrangula; se pierde energía en el bombeo.'; }
  Av.className='dk-aviso'+(t?' on '+cl:''); if(Av.textContent!==t) Av.textContent=t;
}

/* ===================== 16. RÓTULOS, ARO DE FOCO Y TOOLTIP ===================== */
const mm=(x,y)=>V3(x*ESC,(CULATA.position.y+y)*ESC,0);

  ['Pistón',()=>V3(0,(SIM.e?SIM.e.ypin+CH:Y_PMS+CH)*ESC,0.1)],
  ['Válvula de admisión',()=>mm(-X_V,30)],
  ['Válvula de escape',()=>mm(X_V,30)],
  ['Bujía (la chispa)',()=>mm(0,60)],
  ['Leva: abre la válvula',()=>mm(-X_V,YC_CAM)],
  ['Mariposa (estrangula el aire)',()=>mm(X_MARIPOSA,Y_MARIPOSA+14)],
  ['Cigüeñal',()=>V3(0,0,0.1)],

];
(function(){
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('class','rot3svg'); svg.id='rotSvg'; document.body.appendChild(svg);
  for(let i=0;i<ANCLAS.length;i++){ const d=document.createElement('div'); d.className='rot3'; d.style.display='none'; document.body.appendChild(d);
    const ln=document.createElementNS('http://www.w3.org/2000/svg','path'); ln.setAttribute('stroke','rgba(255,215,163,.65)'); ln.setAttribute('fill','none'); ln.setAttribute('stroke-width','1.2'); ln.style.display='none'; svg.appendChild(ln);
    ROT.els.push({d,ln}); }
})();
function pintaRotulos(){ ROT.els.forEach(e=>{ e.d.style.display=ROT.on?'block':'none'; e.ln.style.display=ROT.on?'':'none'; }); }
function colocaRotulos(){
  if(!ROT.on||esEstrecho()) return;
  const H=huecoLibre(), q=new THREE.Vector3(), cx=(H.x0+H.x1)/2, izq=[], der=[];

/* ===================== 17. DISPOSICIÓN: ANCHO, ESTRECHO, MÓVIL =====================
   Si no caben guía, escena y dock lado a lado (el marco de la plataforma, una tableta), la escena va arriba
   y guía e instrumentos comparten una hoja con pestañas abajo. */
function disposicion(){
  const W=innerWidth, b=document.body;
  const estrecho=W<1080, movil=W<640;
  b.classList.toggle('estrecho',estrecho); b.classList.toggle('movil',movil); b.classList.toggle('ancho',estrecho&&!movil);
  if(estrecho){ if(!b.classList.contains('t-hud')&&!b.classList.contains('t-panel')) b.classList.add('t-hud'); ajustaHoja(); }
  el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('on',b.classList.contains('t-'+t.dataset.tab)));
}
function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.40:0.43),240,450));
  let hh=base; const hud=el('hud');
  if(movil&&b.classList.contains('t-panel')) hh=Math.round(clamp(H*0.55,240,540));
  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;
    hh=Math.round(clamp(pide,240,Math.max(base,H*(movil?0.45:0.56)))); }
  const ant=parseFloat(b.style.getPropertyValue('--hojaH'))||0;
  if(Math.abs(ant-hh)>1){ b.style.setProperty('--hojaH',hh+'px'); colocaBarras(); centraEnHueco(); }
}

/* ===================== 18. EL RECORRIDO PASO A PASO =====================
   Al abrir el lab arranca solo un recorrido de siete pasos que explica, sin siglas sin definir, qué se ve: el cilindro, la válvula

/* ===================== 19. EL RETO: CALCULA, AJUSTA, DIAGNOSTICA =====================
   Tres fases: 1 · Calcula (cuántas veces aprieta el aire de verdad un motor que cierra tarde la válvula), 2 · Ajusta (cuándo cierra la
   válvula y cuánto se expande el gas, para tres cosas a la vez: gastar menos que un motor normal, no detonar y no pedirle al motor
   eléctrico más de lo que da; el veredicto y la curva que delata la ventana sólo aparecen al validar, y la ventana es INTERIOR en el
   cierre) y 3 · Diagnostica (¿qué le pasa a este motor?, sólo con lo que se ve en el dock). Cierra con un quiz de tres preguntas. */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETOS={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'calcula',iniciado:false,dxOk:false,r1:null,r2:null,dx:null,orden:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0};

/* ---------- Fase 1 · Calcula: cuántas veces aprieta el aire ---------- */
const CASOS_1=[{r:12,f:0.20},{r:13,f:0.25},{r:14,f:0.30},{r:15,f:0.20},{r:10.5,f:0.10},{r:16,f:0.35},{r:13,f:0.15}];
const rcSimple=(r,f)=>1+(1-f)*(r-1);
function sorteaCaso1(){ const p=GUIA.r1&&GUIA.r1.r+'|'+GUIA.r1.f; let c; do{ c=pickOne(CASOS_1); }while(c.r+'|'+c.f===p); GUIA.r1=Object.assign({},c,{rc:rcSimple(c.r,c.f)}); }
function numeroDe(txt){ const raw=String(txt||'').trim().replace(/\s/g,'').replace(/ /g,'').replace(',','.'); return parseFloat(raw); }
function checkCalcula(){
  const v=numeroDe((el('ansV')||{}).value), r=GUIA.r1;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe cuántas veces aprieta el aire (con coma o punto decimal).'); return; }
  RETOS.intentos++;
  if(Math.abs(v-r.rc)<=0.12){
    RETOS.fallos1=0; sonido.bien();
    feedback('good','¡Correcto! ✓',`Lo que sobra arriba es 1 parte; el pistón barre ${fN(r.r-1,1)}. Como la válvula cierra cuando ya subió el ${fN(r.f*100,0)} %, quedan atrapadas 1 + ${fN(1-r.f,2)}·${fN(r.r-1,1)} = <b>${fN(r.rc,2)}</b> partes, y se aprietan hasta 1: comprime <b>${fN(r.rc,1)} veces</b> aunque el cilindro tenga relación de ${fN(r.r,1)}. (Con la biela real, en el motor de la pantalla, el número sale un poco distinto.)`,true);
    paso('ajusta'); prepararAjusta();
  } else {
    RETOS.fallos1++; sonido.mal();
    if(RETOS.fallos1>=3){ RETOS.fallos1=0; RETOS.resiembras++; sorteaCaso1(); feedback('bad','Tres intentos fallidos','Cambia el caso. Recuerda: el aire atrapado es lo que queda por encima de donde estaba el pistón al cerrar, más el espacio sobrante.'); reiniciaCalculo(); pintaHUD(); }
    else { feedback('bad','Revisa el cálculo',(v>r.r?'No puede apretar más veces que la relación del cilindro. ':(v<2?'Aprieta más que eso. ':''))+`Cuenta las partes: 1 de espacio sobrante más lo que el pistón barre desde que cierra la válvula. (intentos fallidos: ${RETOS.fallos1}/3)`); const t=el('d_try'); if(t) t.textContent=RETOS.fallos1; }
  }
}

/* ---------- Fase 2 · Ajusta el cierre y la expansión ---------- */
function prepararAjusta(){
  let e; do{ e=pickOne(ESCENARIOS); }while(GUIA.r2&&ESCENARIOS.length>1&&e.id===GUIA.r2.esc.id&&RETOS.resiembras>0);
  GUIA.r2={esc:e,r:R_REF,phi:IVC_REF,validado:false,res:null,intentos:0};
  reiniciaCalculo(); pintaHUD();
}
function validarAjusta(){
  const r=GUIA.r2; if(!r) return;
  const E=r.esc, cr=criterios(E,r.r,r.phi), h=cr.h; r.res=cr; r.validado=true; r.intentos++; RETOS.intentos++;
  reiniciaCalculo();
  const cifras=`Ahorro <b>${fN(cr.ahorro*100,1)} %</b> frente al motor normal (meta ${fN(E.meta*100,1)} %), golpeteo al <b>${fN(h.K*100,0)} %</b> del límite (máx. ${fN(RETO.kMax*100,0)} %), el motor eléctrico pone <b>${fN(h.parMg,0)} N·m</b> (máx. ${fN(RETO.mgMax,0)}).`;
  if(cr.todo){
    RETOS.fallos2=0; sonido.bien(); const rg=rangoPhi(E,r.r);
    feedback('good','¡Lo conseguiste! ✓',`${cifras} ${rg?`Con esa relación de expansión, cualquier cierre entre <b>${fN(rg[0],0)}° y ${fN(rg[1],0)}°</b> tras el fondo habría servido: antes golpetea o gasta lo mismo que un motor normal, y después el motor eléctrico no alcanza. La respuesta está en el interior del mando, no en los extremos.`:''}`,true);
    pintaHUD(); paso('diag'); iniciaDiag();
  } else {
    RETOS.fallos2++; sonido.mal();
    let msg=cifras+' ';
    if(!cr.c.golpeteo) msg+=h.K>1?'<b>Detona</b>: comprime demasiado. Cierra la válvula más tarde o baja la expansión. ':'Estás muy cerca de detonar: no dejes margen tan justo. ';
    if(!cr.c.par) msg+=h.faltaPar?'<b>Falta par</b>: cierras tan tarde que atrapa muy poco aire y ni el eléctrico alcanza. Cierra antes. ':'El motor eléctrico pone más de lo permitido: cierra un poco antes. ';
    if(!cr.c.consumo) msg+=h.apertura<0.95&&!h.abierta?'La mariposa estrangula el aire sobrante y se pierde energía: cierra más tarde para no desperdiciarlo. ':'Todavía ahorras poco: el gas puede expandirse más. ';
    if(RETOS.fallos2>=4){ RETOS.fallos2=0; RETOS.resiembras++; feedback('bad','Cuatro validaciones sin lograrlo',msg+'Cambia la situación.',true); prepararAjusta(); }
    else { feedback('bad','Todavía no',msg+`(validaciones fallidas: ${RETOS.fallos2}/4)`,true); pintaHUD(); }
  }
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const NOMBRE_DX={golpeteo:'Comprime demasiado: el gas se enciende solo',sinaire:'Cierra tan tarde que le falta aire',ahogo:'Cierra pronto y la mariposa lo estrangula',cortoexp:'Expande poco: casi no mejora al motor normal'};
function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.k; let c; do{ c=pickOne(CASOS_DX); }while(c.k===p);
  GUIA.dx=c; GUIA.dxOk=false; GUIA.orden=barajar(CASOS_DX.map(x=>x.k));
  reiniciaCalculo(); pintaHUD(); pintaDockFijo();
}
function diagnostica(k){
  if(!GUIA.dx||GUIA.dxOk) return; RETOS.intentos++;
  if(k===GUIA.dx.k){
    GUIA.dxOk=true; RETOS.fallos3=0; sonido.bien();
    feedback('good','Diagnóstico correcto ✓',explicaDx(GUIA.dx.k),true);
    reiniciaCalculo(); pintaDockFijo(); paso('quiz'); iniciaQuiz();
  } else {
    RETOS.fallos3++; sonido.mal();
    if(RETOS.fallos3>=3){ RETOS.fallos3=0; RETOS.resiembras++; feedback('bad','Tres intentos fallidos','Es otro caso: mira el golpeteo, el par del motor eléctrico, la mariposa del tubo de admisión y el consumo contra el del motor normal.',true); iniciaDiag(); }
    else { feedback('bad','No es ese',noEs(k)+` (intentos fallidos: ${RETOS.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(k){
  if(k==='golpeteo') return 'El golpeteo pasa del 100 % del límite: con la válvula cerrando pronto, el aire se comprime tanto (y se calienta tanto) que el gas sin quemar se enciende solo. Cerrarla más tarde baja la compresión real sin tocar la expansión.';
  if(k==='sinaire') return 'La válvula cierra tan tarde que el pistón devuelve casi todo el aire: el motor de gasolina da muy poco par y el eléctrico pasa de su límite. Es el precio de este ciclo si te pasas.';
  if(k==='ahogo') return 'La válvula cierra pronto, así que entra más aire del que hace falta, y la mariposa lo estrangula: el motor gasta energía empujando contra una compuerta casi cerrada (el bombeo) y consume como uno normal.';
  return 'No golpetea, no estrangula y el eléctrico casi no trabaja, pero la relación de expansión es baja: el gas sale caliente, con trabajo sin aprovechar. Expandir más es lo que da el ahorro.';
}
function noEs(k){
  if(k==='golpeteo') return 'Mira el golpeteo: aquí no llega al límite.';
  if(k==='sinaire') return 'Mira el par del motor eléctrico: aquí no pasa de lo permitido.';
  if(k==='ahogo') return 'Mira la mariposa del tubo de admisión: aquí está abierta del todo.';
  return 'Compara la relación de expansión: aquí no es el cierre lo que falla.';

/* ===================== 20. CÁMARAS =====================
   La escena se encuadra con el hueco que dejan la guía y el dock: la cámara se aleja lo justo para que la caja del «objeto»
   (ancho × alto en unidades) quepa entera en ese hueco, y la proyección se desplaza para centrarla en él. */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); const hud=r('hud'); const top=hud?hud.top:(tabs?tabs.top:H); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:Math.min(tb?tb.top:H,top)-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}
const VISTAS={
  todo:{dir:V3(0.0,0.10,1.0),anc:()=>V3(-0.1,1.3,-0.3),toff:V3(0,0,0),obj:()=>({w:6.0,h:4.7}),fov:30,tope:0.80},
  cilindro:{dir:V3(0.30,0.12,1.0),anc:()=>V3(0,1.55,0),toff:V3(0,0,0),obj:()=>({w:2.8,h:5.1}),fov:30,tope:0.80},
  valvulas:{dir:V3(0.25,0.12,1.0),anc:()=>V3(0,2.9,0),toff:V3(0,0,0),obj:()=>({w:1.9,h:1.6}),fov:30,tope:0.80},
  electrico:{dir:V3(0.0,0.10,1.0),anc:()=>V3(1.1,0,0),toff:V3(0,0,0),obj:()=>({w:3.9,h:2.1}),fov:30,tope:0.80},

const CAM={off:V3(0,1,10),toff:V3(0,0,0),auto:true,previo:null,dur:1};
function fovVista(v){ return innerWidth<innerHeight*0.9?40:VISTAS[v].fov; }
function distanciaFit(w,h,fov,tope){
  const Hu=huecoLibre(), W=innerWidth, Hh=innerHeight, tv=Math.tan(fov*Math.PI/360), th=tv*(W/Hh);
  const wF=Math.max(80,Hu.x1-Hu.x0)/W, hF=Math.max(80,Hu.y1-Hu.y0)/Hh;
  const D=1.06*Math.max(w/(2*th*wF),h/(2*tv*hF));
  return Math.max(D,h/(2*tv*(tope||0.8)));
}
function ofsDeseado(v){ const V=VISTAS[v], o=V.obj(), fov=fovVista(v), D=distanciaFit(o.w,o.h,fov,V.tope); return {off:V.dir.clone().normalize().multiplyScalar(D),toff:V.toff.clone(),fov}; }
function ponVista(v,dur){
  EST.vista=v; CAM.auto=true; CAM.dur=dur===undefined?1.0:dur;
  if(typeof pintaBarras==='function') pintaBarras();
  if(CAM.dur<=0.01){ const A=VISTAS[v].anc(), d=ofsDeseado(v); CAM.off.copy(d.off); CAM.toff.copy(d.toff); camera.fov=d.fov; camera.updateProjectionMatrix();
    camera.position.copy(A).add(CAM.off); controls.target.copy(A).add(CAM.toff); CAM.previo=A.clone(); }
}
function pasaCam(dt){
  const V=VISTAS[EST.vista], P=V.anc();
  if(CAM.auto){
    const d=ofsDeseado(EST.vista), k=1-Math.exp(-dt/Math.max(0.05,(CAM.dur||1)*0.30));
    CAM.off.lerp(d.off,k); CAM.toff.lerp(d.toff,k);
    if(Math.abs(camera.fov-d.fov)>0.05){ camera.fov+=(d.fov-camera.fov)*k; camera.updateProjectionMatrix(); }
    camera.position.copy(P).add(CAM.off); controls.target.copy(P).add(CAM.toff);
  }
  CAM.previo=P.clone();
}

/* ===================== 21. SONIDO (sintetizado) =====================
   Un ronroneo grave cuyo tono sigue al régimen del motor (muy atenuado) y los avisos de acierto y fallo. */
const sonido=(function(){
  let ctx=null,on=true,master=null,ult=0,zum=null,zg=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      zum=ctx.createOscillator(); zg=ctx.createGain(); zum.type='sawtooth'; zum.frequency.value=50; zg.gain.value=0; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=180; zum.connect(lp); lp.connect(zg); zg.connect(master); zum.start();
    }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); ult=f; }
  return {init,
    ronroneo:(q)=>{ if(!ctx||!zum) return; const t=ctx.currentTime; zum.frequency.setTargetAtTime(34+q*40,t,0.15); zg.gain.setTargetAtTime(on&&q>0?0.008:0,t,0.15); },
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }, get freq(){ return ult; }};
})();

function aplicaCalidad(){

  const ms=alta?2048:1024; if(LUZ.sol.shadow.mapSize.x!==ms){ LUZ.sol.shadow.mapSize.set(ms,ms); if(LUZ.sol.shadow.map){ LUZ.sol.shadow.map.dispose(); LUZ.sol.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}

/* ===================== 23. EL LAZO: UN SOLO RELOJ =====================
   El ángulo del cigüeñal avanza dt·velocidad·REV_S en cada cuadro, y con ESE ángulo se mueven el pistón, las válvulas, el gas, la
   llama, las partículas, el motor eléctrico y el cursor de las gráficas del dock. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0, tSon=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  const dtS=EST.pausa?0:dt, dtSim=dtS*EST.vel;
  aplicaEscena(dtS,dtSim,dt);
  pasaCam(dt);
  if(t-tSon>0.4){ tSon=t; sonido.ronroneo(CALC&&!EST.pausa?clamp(CALC.esc.n/2400,0,1):0); }
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaGraficas(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos(); colocaFoco();
}

/** Mide el objeto en lo VISIBLE: se pinta sin plataforma ni fondo sobre magenta puro y se toma la caja de los píxeles que no son magenta. */
function mideObjeto(){
  const ocultos=[]; const oc=o=>{ if(o&&o.visible){ o.visible=false; ocultos.push(o); } };
  oc(PLATAFORMA); scene.traverse(o=>{ if(o.userData&&o.userData.fondo) oc(o); });
  const bg=scene.background, fog=scene.fog; scene.background=null; scene.fog=null; renderer.setClearColor(0xff00ff,1);
  renderer.render(scene,camera);
  const c=renderer.domElement, W=c.width, H=c.height, t=document.createElement('canvas'); t.width=W; t.height=H; const g=t.getContext('2d',{willReadFrequently:true}); g.drawImage(c,0,0);
  const d=g.getImageData(0,0,W,H).data; let x0=1e9,x1=-1,y0=1e9,y1=-1;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=(y*W+x)*4; if(!(d[i]>235&&d[i+1]<30&&d[i+2]>235)){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  for(const o of ocultos) o.visible=true; scene.background=bg; scene.fog=fog; renderer.setClearColor(0x000000,1);
  const k=W/innerWidth; return {x0:x0/k,x1:x1/k,y0:y0/k,y1:y1/k,altoPx:(y1-y0)/k,anchoPx:(x1-x0)/k,fracAlto:(y1-y0)/H,fracAncho:(x1-x0)/W,hueco:huecoLibre(),W:innerWidth,H:innerHeight};
}
