<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Sistema de Frenos ABS — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#08201C;--panel:rgba(9,24,23,.86);--line:#1E3A34;--ink:#EAF4F1;
    --dim:#8FB3AC;--accent:#2A9D8F;--accent2:#4FD1C5;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cV:#EAF4F1;--cW:#4FD1C5;--cL:#FF7A59;--cMu:#A78BFA;--cP:#FFB703;--cX:#8FB3AC;
    --sube:#34d399;--mant:#FFB703;--baja:#f4475e;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:372px}}
  @media (max-width:1439px){:root{--hudW:292px;--dockW:336px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#14201f;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#182a28}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#33b3a3}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 3px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#06120f}
  .seg .b i{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:2px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg input[type=range]{width:100%;accent-color:#4FD1C5;height:18px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f948f;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  .plg{display:flex;flex-direction:column;gap:6px}
  /* el reto */
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span{white-space:nowrap} .retoBox .rt span:first-child{overflow:hidden;text-overflow:ellipsis}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .retoBox .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .retoBox .tries{font-size:11px;color:var(--dim)}
  table.ens{width:100%;border-collapse:collapse;font-size:11.8px;font-variant-numeric:tabular-nums}
  table.ens th{font-size:9.5px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;text-align:right;padding:2px 5px}
  table.ens th:first-child,table.ens td:first-child{text-align:left}
  table.ens td{padding:2px 5px;text-align:right;color:#cfe0dc;border-top:1px solid rgba(30,58,52,.6)}
  table.ens tr.mejor td{color:#a7f3d0}
  table.ens tr.ult td{background:rgba(79,209,197,.08)}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:13px 14px 12px;display:flex;flex-direction:column;gap:7px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,58,52,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg .fl i{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
  .fg b{display:block;font-size:16.5px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}
  .dk-tit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:2px 2px -2px;display:flex;justify-content:space-between;gap:8px}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#9fbab4}
  /* las letras griegas no se pasan a mayúscula: μ–λ sería «Μ–Λ» */
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-g{position:relative;flex:1.6 1 0;min-height:120px;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,58,52,.7)}
  .dk-g.b{flex:1.15 1 0;min-height:92px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:3px 11px;font-size:10.5px;color:#b4c9c4;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:16px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.pt{width:9px;height:9px;border:0;border-radius:50%;background:var(--c)}
  .dk-ley i.bl{width:12px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .barras{display:flex;flex-direction:column;gap:4px;background:rgba(0,0,0,.2);border:1px solid rgba(30,58,52,.8);border-radius:10px;padding:7px 9px}
  .br{display:grid;grid-template-columns:112px 1fr 62px;align-items:center;gap:7px;font-size:11.5px;color:#cfe0dc;font-variant-numeric:tabular-nums}
  .br .bt{height:9px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden}
  .br .bt i{display:block;height:100%;border-radius:5px;width:0}   /* sin transición: se repinta a 15 Hz */
  .br b{text-align:right;font-weight:600}
  .br span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .eps{font-size:11.2px;color:var(--dim);display:flex;justify-content:space-between;gap:8px;margin-top:2px}
  .eps b{color:var(--ink);font-weight:600}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}
  body.guiado .panel .dk-g.ml{box-shadow:0 0 0 2px rgba(255,183,3,.55)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#14201f;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:64px}
  .tbar .fase{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfe0dc;min-width:150px}
  .tbar .fase i{width:9px;height:9px;border-radius:50%;background:var(--sube);flex:none}
  .tbar .pleg{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim)}
  .tbar .pleg i{display:inline-block;width:64px;height:8px;border-radius:4px;background:linear-gradient(90deg,#1d5f86,#2f8f8a 22%,#e9b23a 45%,#e0622c 72%,#c42a24)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(12,22,22,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,22,21,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d6d2}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,22,24,.92);border:1px solid rgba(79,209,197,.4);padding:4px 9px;border-radius:7px;white-space:nowrap;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,22,24,.84);border:1px solid rgba(79,209,197,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:15px} .cg input[type=range]{height:15px} }
  @media (max-width:1439px){ .fg b{font-size:14.5px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .br{grid-template-columns:104px 1fr 58px;font-size:11px} .tbar .fase{min-width:128px} }
  @media(max-width:820px){
    .hud,.panel{top:auto;bottom:8px;left:8px;right:8px;width:auto;max-height:44vh;overflow-y:auto}
    .hud{bottom:calc(8px + 44vh + 8px);max-height:30vh}
    .vbar{top:58px;max-width:calc(100vw - 16px);overflow-x:auto}.tbar{top:96px;bottom:auto;max-width:calc(100vw - 16px);overflow-x:auto}
    .tbar .pleg{display:none}
    .dk-g{min-height:150px}.rot3svg,.rot3{display:none}
  }
  @media (prefers-reduced-motion:reduce){ .toast,.feedback{transition:none} }
</style>
</head>
<body class="m-ciclo">
<div id="stage"></div>
<button class="soundBtn on" id="soundBtn" title="Sonido">🔊</button>
<div class="topbar">
  <div class="brand">CEN<span> Labs</span></div>
  <div class="lt">Sistema de frenos ABS · el ciclo de regulación</div>
</div>
<div class="hud" id="hud"></div>
<div class="panel" id="panel">
  <div class="dk-t"><span id="p_mode">Ciclo ABS</span><span class="sub" id="p_sub"></span></div>
  <div class="dk-fig">
    <div class="fg"><div class="fl"><i style="background:var(--cV)"></i>Coche</div><b id="f_v">—</b></div>
    <div class="fg"><div class="fl"><i style="background:var(--cW)"></i>Rueda ωR</div><b id="f_w">—</b></div>
    <div class="fg"><div class="fl"><i style="background:var(--cL)"></i>Deslizamiento λ</div><b id="f_l">—</b></div>
    <div class="fg"><div class="fl"><i style="background:var(--cMu)"></i>Adherencia μ</div><b id="f_mu">—</b></div>
    <div class="fg"><div class="fl"><i style="background:var(--cP)"></i>Presión rueda</div><b id="f_p">—</b></div>
    <div class="fg"><div class="fl"><i style="background:var(--cX)"></i>Recorrido</div><b id="f_x">—</b></div>
  </div>
  <div class="dk-tit"><div>Curva <em class="gr">μ–λ</em></div><span id="t_ml"></span></div>
  <div class="dk-g ml" id="gML"><canvas></canvas></div>
  <div class="dk-ley" id="leyML"></div>
  <div class="dk-tit">Velocidades y presión <span>mismo reloj que la escena</span></div>
  <div class="dk-g b" id="gT"><canvas></canvas></div>
  <div class="dk-ley">
    <span class="lg"><i style="--c:var(--cV)"></i>coche</span>
    <span class="lg"><i style="--c:var(--cW)"></i>rueda ωR</span>
    <span class="lg"><i style="--c:var(--cP)"></i>presión rueda</span>
    <span class="lg"><i class="dash" style="--c:#c99a3a"></i>pedal</span>
    <span class="lg"><i class="bl" style="--c:var(--sube)"></i>sube</span>
    <span class="lg"><i class="bl" style="--c:var(--mant)"></i>mantiene</span>
    <span class="lg"><i class="bl" style="--c:var(--baja)"></i>baja</span>
  </div>
  <div class="dk-tit">Distancia de frenado <span id="t_d"></span></div>
  <div class="barras" id="barras"></div>
  <div class="dk-aviso" id="aviso"></div>
</div>
<div class="vbar" id="vbar"></div>
<div class="tbar" id="tbar"></div>
<div class="toast" id="toast"></div>
<div class="feedback" id="feedback">
  <button class="fx" id="fbX" aria-label="Cerrar">✕</button>
  <div class="fh"><div class="fi" id="fbIcon">!</div><div class="ft" id="fbTitle"></div></div>
  <p id="fbText"></p>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   LAB — SISTEMA DE FRENOS ABS · EL CICLO DE REGULACIÓN
   (Autotrónica · mecanica-7)

   VERSIÓN DE ESCAPARATE. Una rueda delantera real cortada por su eje
   —neumático 205/55 R16 con sus cinturones, llanta 16 × 6,5J, disco
   ventilado de Ø300, pinza flotante con su pistón de Ø57 y sus pastillas,
   rueda fónica de 48 dientes y su captador— rueda sobre la pista mientras
   frena. A su lado, el grupo hidráulico, también cortado, abre y cierra sus
   dos electroválvulas y el líquido toma el color de su presión.

   Abre con el ciclo ya en marcha: frenada de pánico a 100 km/h en asfalto
   seco, a cámara lenta ×1/10. La ECU sostiene la rueda alrededor del pico de
   la curva μ–λ; el dock enseña ese punto sobre la curva, las velocidades y
   la presión con el MISMO reloj que la escena, y la distancia contra la de
   la rueda bloqueada.

   La física (cuarto de coche, curva de Pacejka ajustada a Burckhardt,
   válvulas como orificios, ECU con histéresis y anticipación) está en un
   bloque puro que un script de Node extrae TAL CUAL y verifica.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos
   marcas— y lo prueba: lo que se prueba es lo que corre. */

/* FISICA:INICIO */
/* ---------- 1.1 La rueda, el freno y el coche ----------
   Un cuarto de coche: la rueda delantera de un sedán de 1 400 kg, con un
   cuarto de la masa encima. Todo en SI salvo la presión (bar) y los volúmenes
   de líquido (cm³), que es como se leen en un taller. */
const G0=9.81;
const VEH={ m:350, R:0.31, J:1.2 };                 // kg por rueda · radio dinámico 205/55 R16 (m) · rueda + disco + buje (kg·m²)
VEH.N=VEH.m*G0;                                       // carga normal (N), sin transferencia de carga
const FRENO={ dPiston:0.057, muPast:0.40, rIn:0.105, rOut:0.150 };   // mordaza flotante de un pistón, disco ventilado Ø300
FRENO.A=Math.PI/4*FRENO.dPiston*FRENO.dPiston;                       // m²
// Radio eficaz con presión uniforme en la pastilla: r = ⅔·(Ro³ − Ri³)/(Ro² − Ri²)
FRENO.rEf=2/3*(Math.pow(FRENO.rOut,3)-Math.pow(FRENO.rIn,3))/(FRENO.rOut*FRENO.rOut-FRENO.rIn*FRENO.rIn);
// Par de frenado por bar: dos caras de fricción, T = 2·μp·(p·A)·r_ef
FRENO.KT=2*FRENO.muPast*FRENO.A*FRENO.rEf*1e5;                       // N·m/bar
/* ---------- 1.2 La hidráulica de un canal ----------
   El pedal de pánico sube la presión de la bomba de freno (cilindro maestro)
   a pdPedal bar/s hasta pMax. Cada válvula es un orificio: el caudal va con la
   raíz de la diferencia de presión, y el caudal es Ch·dp/dt en la mordaza, así
   que dp/dt = K·√Δp. La válvula de admisión (EV) está ABIERTA en reposo; la
   de escape (AV), CERRADA. */
const HID={ pMax:120, pdPedal:1000, Kin:220, Kout:380, pAcu:2, tValv:0.003,
  Ch:0.008, Qbomba:5, Vcap:2.5 };                      // bar · bar/s · bar^½/s · bar^½/s · bar · s · cm³/bar · cm³/s · cm³
/* ---------- 1.3 La ECU ----------
   Mira la rueda cada 5 ms. Con su medida del deslizamiento decide entre tres
   órdenes; la banda ±h alrededor del objetivo es la HISTÉRESIS: dentro de ella
   la presión se mantiene. Tras la primera descarga, la presión se re-aplica a
   escalones (un ciclo abierta, dos cerrada), como en un ABS de serie. Por
   debajo de vOff deja de regular. */
const ECU={ T:0.005, lamObj:0.11, h:0.03, vOff:2.8, pulsos:3, dientes:48, vMin:1.0, tau:0.010 };
const DT_SIM=1e-4;                                      // s, paso del integrador (RK4)
/* ---------- 1.4 Las superficies ----------
   Fórmula mágica simplificada (Pacejka): μ(λ) = D·sen(C·atan(B·λ − E·(B·λ − atan(B·λ)))).
   Coeficientes ajustados por mínimos cuadrados a las curvas medidas de
   Burckhardt μ = c1·(1 − e^(−c2·λ)) − c3·λ (Kiencke y Nielsen, 2005). */
const PISTAS={
  seco:  {nom:'Asfalto seco',   B:10.37, C:1.857, D:1.179, E:0.782, burck:[1.2801,23.99,0.52]},
  mojado:{nom:'Asfalto mojado', B:14.33, C:1.845, D:0.809, E:0.833, burck:[0.857,33.822,0.347]},
  nieve: {nom:'Nieve',          B:40.92, C:1.761, D:0.1916,E:0.9345,burck:[0.1946,94.129,0.0646]},
  hielo: {nom:'Hielo',          B:238.2, C:1.062, D:0.0502,E:0.083, burck:[0.05,306.39,0]},
};
function muDe(l,s){ const x=s.B*l; return s.D*Math.sin(s.C*Math.atan(x-s.E*(x-Math.atan(x)))); }
function muBurckhardt(l,c){ return c[0]*(1-Math.exp(-c[1]*l))-c[2]*l; }
/** El pico de la curva: barrido fino y sección áurea. */
function picoDe(s){
  let bl=0.001, bm=-1; for(let i=1;i<=1000;i++){ const l=i/1000, m=muDe(l,s); if(m>bm){ bm=m; bl=l; } }
  let a=Math.max(1e-4,bl-0.0015), b=Math.min(1,bl+0.0015); const g=(Math.sqrt(5)-1)/2;
  for(let i=0;i<70;i++){ const c=b-g*(b-a), d=a+g*(b-a); if(muDe(c,s)>muDe(d,s)) b=d; else a=c; }
  const l=(a+b)/2; return {lam:l, mu:muDe(l,s)};
}
/** Deslizamiento de frenado λ = (v − ωR)/v. Con v casi nula se regulariza con vε = 0,5 m/s. */
function deslizamiento(v,w){ return (v-w*VEH.R)/Math.max(v,0.5); }
function pPedal(t){ return Math.min(HID.pMax,HID.pdPedal*t); }
/** Derivadas del estado [v, ω, p, x, θ] con las válvulas en un estado fijo. */
function deriv(t,y,valv,out,s,suelto){
  const v=y[0], w=Math.max(0,y[1]), p=y[2];
  const lam=Math.min(1,Math.max(-1,deslizamiento(v,w)));
  const Fx=v>0?muDe(lam,s)*VEH.N:0;                     // fuerza de frenado del suelo sobre el coche (N)
  const Tb=FRENO.KT*Math.max(0,p);                      // par de la pinza (N·m)
  out[0]=v>0?-Fx/VEH.m:0;
  let Tn=Fx*VEH.R-Tb;
  // Rueda bloqueada: la pinza la sujeta mientras su par alcance para ello.
  if(w<=0&&Tn<=0) Tn=0;
  out[1]=Tn/VEH.J;
  let dp=0; const pm=suelto?0:pPedal(t);
  if(valv==='sube'){ const d=pm-p; dp=HID.Kin*Math.sign(d)*Math.sqrt(Math.abs(d)); }
  else if(valv==='baja'){ dp=-HID.Kout*Math.sqrt(Math.max(0,p-HID.pAcu)); }
  out[2]=dp; out[3]=v; out[4]=w;
  return out;
}
/** Una frenada nueva: el coche a v0 (m/s), la rueda rodando, la línea sin presión. */
function nuevaFrenada(cfg){
  const v0=cfg.v0;
  return { cfg, t:0, y:[v0,v0/VEH.R,0,0,0], suelto:false, cmd:'sube', valv:'sube', cola:[], tEcu:0, activo:false, pulso:0,
    nDiente:0, tDientes:[], wMed:v0/VEH.R, lamMed:0, Vacu:0, bomba:false, ciclos:0,
    Edesl:0, Efreno:0, fin:false, tFin:null, xFin:null, tReg:null, sumMu:0, sumT:0, xReg0:null, vReg0:null, tReg0:null };
}
/** La ECU: una decisión cada ECU.T, con su propia medida de ω (la de la rueda fónica). */
function decideECU(S){
  const c=S.cfg, v=S.y[0];
  const lam=(v-S.wMed*VEH.R)/Math.max(v,ECU.vMin);
  // aceleración de la rueda medida (derivada de su propia ω entre dos decisiones, filtrada)
  const ac=S.wPrev===undefined?0:(S.wMed-S.wPrev)/ECU.T; S.wPrev=S.wMed;
  S.acW=S.acW===undefined?ac:S.acW+0.5*(ac-S.acW);
  // anticipación: el deslizamiento que habrá dentro de τ si la rueda sigue acelerando así
  const lamP=lam-ECU.tau*S.acW*VEH.R/Math.max(v,ECU.vMin);
  S.lamMed=lam; S.lamPred=lamP;
  let cmd;
  if(!c.abs||v<ECU.vOff||S.suelto){ cmd='sube'; S.pulso=0; }
  else if(lamP>c.lamObj+c.h){ cmd='baja'; S.pulso=0; if(!S.activo){ S.activo=true; } S.bomba=true; }
  else if(!S.activo){ cmd='sube'; }
  else if(lamP>=c.lamObj-c.h){ cmd='mantiene'; S.pulso=0; }
  else { cmd=(S.pulso%ECU.pulsos===0)?'sube':'mantiene'; S.pulso++; }
  if(cmd!==S.cmd){ if(cmd==='baja') S.ciclos++; S.cmd=cmd; S.cola.push({t:S.t+HID.tValv,e:cmd}); }
}
const _k1=new Float64Array(5),_k2=new Float64Array(5),_k3=new Float64Array(5),_k4=new Float64Array(5),_yt=new Float64Array(5);
/** Un paso de integración de dt (RK4). Devuelve la energía deslizada en el paso (J). */
function paso(S,dt){
  if(S.fin) return 0;
  const s=S.cfg.pista;
  while(S.t>=S.tEcu-1e-12){ decideECU(S); S.tEcu+=ECU.T; }
  while(S.cola.length&&S.cola[0].t<=S.t+1e-12){ S.valv=S.cola.shift().e; }
  const y=S.y, t=S.t, valv=S.valv;
  // la válvula de escape no descarga si el acumulador de baja está lleno
  const vv=(valv==='baja'&&S.Vacu>=HID.Vcap)?'mantiene':valv;
  const su=S.suelto;
  deriv(t,y,vv,_k1,s,su);
  for(let i=0;i<5;i++) _yt[i]=y[i]+_k1[i]*dt/2; deriv(t+dt/2,_yt,vv,_k2,s,su);
  for(let i=0;i<5;i++) _yt[i]=y[i]+_k2[i]*dt/2; deriv(t+dt/2,_yt,vv,_k3,s,su);
  for(let i=0;i<5;i++) _yt[i]=y[i]+_k3[i]*dt;   deriv(t+dt,_yt,vv,_k4,s,su);
  const p0=y[2], th0=y[4], v0=y[0], w0=Math.max(0,y[1]);
  for(let i=0;i<5;i++) y[i]+=dt*(_k1[i]+2*_k2[i]+2*_k3[i]+_k4[i])/6;
  if(y[1]<0) y[1]=0; if(y[0]<0) y[0]=0;
  S.t+=dt;
  // energía: la pinza convierte T·ω en calor; la goma, F·(v − ωR)
  const vm=(v0+y[0])/2, wm=(w0+y[1])/2, lam=Math.min(1,Math.max(-1,deslizamiento(vm,wm)));
  const Fx=vm>0?muDe(lam,s)*VEH.N:0;
  const eD=Math.max(0,Fx*(vm-wm*VEH.R))*dt;
  S.Edesl+=eD; S.Efreno+=FRENO.KT*Math.max(0,(p0+y[2])/2)*wm*dt;
  // el acumulador recoge lo que descarga la válvula de escape; la bomba lo devuelve
  if(vv==='baja'&&y[2]<p0) S.Vacu+=HID.Ch*(p0-y[2]);
  if(S.bomba) S.Vacu=Math.max(0,S.Vacu-HID.Qbomba*dt);
  // la rueda fónica: un diente cada 2π/48; la ECU mide el periodo entre dientes
  const paso=2*Math.PI/ECU.dientes, n=Math.floor(y[4]/paso);
  if(n>S.nDiente){ const f=(n*paso-th0)/Math.max(1e-12,y[4]-th0), tc=t+dt*Math.min(1,Math.max(0,f));
    S.tDientes.push(tc); if(S.tDientes.length>2) S.tDientes.shift(); S.nDiente=n;
    if(S.tDientes.length===2) S.wMed=paso/Math.max(1e-6,S.tDientes[1]-S.tDientes[0]); }
  if(S.tDientes.length){ const tu=S.tDientes[S.tDientes.length-1], per=S.tDientes.length===2?S.tDientes[1]-S.tDientes[0]:paso/Math.max(1e-6,S.wMed);
    if(S.t-tu>per) S.wMed=Math.min(S.wMed,paso/(S.t-tu)); }
  // aprovechamiento de la adherencia mientras el ABS regula (de vOff hacia arriba)
  if(S.activo&&y[0]>=ECU.vOff){ if(S.tReg0===null){ S.tReg0=S.t; S.vReg0=y[0]; S.xReg0=y[3]; } S.tReg=S.t; S.vReg=y[0]; S.xReg=y[3]; }
  if(y[0]<=0.02&&!S.suelto){ S.fin=true; S.tFin=S.t; S.xFin=y[3]; }
  return eD;
}
/** La frenada entera, de v0 a cero. `cada` decima la serie que se guarda. */
function frenaTodo(cfg,opts){
  const o=opts||{}, cada=o.cada||0, S=nuevaFrenada(cfg), serie=[];
  let n=0;
  while(!S.fin&&S.t<120){
    if(cada&&n%cada===0) serie.push(instante(S));
    paso(S,DT_SIM); n++;
  }
  if(cada) serie.push(instante(S));
  return { d:S.xFin, t:S.tFin, S, serie, eps:aprovechamiento(S) };
}
/** Lo que se registra y se dibuja de un instante. */
function instante(S){
  const v=S.y[0], w=Math.max(0,S.y[1]), lam=Math.min(1,Math.max(-1,deslizamiento(v,w)));
  return { t:S.t, v, wR:w*VEH.R, lam, mu:v>0?muDe(lam,S.cfg.pista):0, p:S.y[2], pm:S.suelto?0:pPedal(S.t), x:S.y[3], th:S.y[4],
    valv:S.valv, cmd:S.cmd, lamMed:S.lamMed, lamPred:S.lamPred, Vacu:S.Vacu, bomba:S.bomba };
}
/** ε = desaceleración media mientras el ABS regula / (μmáx·g). ECE R13-H (anexo 6) pide ε ≥ 0,75. */
function aprovechamiento(S){
  if(S.tReg0===null||S.tReg-S.tReg0<0.05) return null;
  const a=(S.vReg0-S.vReg)/(S.tReg-S.tReg0);
  return a/(picoDe(S.cfg.pista).mu*G0);
}
/** Límite físico: frenar todo el rato en el pico de la curva, sin rampa de pedal. */
function distanciaIdeal(v0,s){ return v0*v0/(2*picoDe(s).mu*G0); }
/* ---------- 1.5 El reto: calibrar la ECU en una pista de pruebas ----------
   La pista sale de una familia medida (asfalto mojado u hormigón de
   Burckhardt) con el pico desplazado: B se multiplica por k, así que el
   λ del pico va como 1/k. La ECU llega con la calibración de fábrica
   (λ objetivo 0,11) y el alumno la ajusta. Se acepta la calibración cuya
   frenada desde 80 km/h no pase de la mejor posible más un 3 %; la mejor
   se busca barriendo λ objetivo de 0,04 a 0,50 en pasos de 0,01 con la
   misma histéresis, y `dmin` es ese mínimo (lo recalcula la verificación). */
const RETO={ v0:80/3.6, h:0.03, tol:0.03, ini:0.11 };
const RETO_FAM={
  mojado:  {nom:'asfalto mojado de otra mezcla', B:14.33,  C:1.845,  D:0.809,  E:0.833},
  hormigon:{nom:'hormigón',                       B:10.467, C:1.9015, D:1.1032, E:0.7876},
};
const RETO_PISTAS=[
  {fam:'mojado', k:0.9, dmin:33.6535},
  {fam:'mojado', k:1, dmin:33.2747},
  {fam:'mojado', k:1.12, dmin:33.3003},
  {fam:'mojado', k:1.25, dmin:33.4214},
  {fam:'mojado', k:1.4, dmin:33.5783},
  {fam:'hormigon', k:1.12, dmin:25.0184},
  {fam:'hormigon', k:1.25, dmin:24.9317},
  {fam:'hormigon', k:1.4, dmin:25.0295}
];
function pistaReto(v){ const f=RETO_FAM[v.fam]; return {nom:f.nom, B:f.B*v.k, C:f.C, D:f.D, E:f.E}; }
function distanciaReto(v,lamObj){ return frenaTodo({pista:pistaReto(v), v0:RETO.v0, abs:true, lamObj, h:RETO.h}).d; }

/* ===================== 4. TEXTURAS Y MATERIALES =====================
   PBR con entorno. Nada de poro ni grano fino —se lee como lija sobre caras
   grandes—: variaciones lentas de rugosidad, los anillos de torno del disco y
   el dibujo del neumático. Todo periódico, sin costuras. */
function normalDeAltura(W,H,h,fuerza){
  const c=cv(W,H),x=c.getContext('2d'),im=x.createImageData(W,H);
  const A=(i,j)=>h((i+W)%W,(j+H)%H);
  for(let j=0;j<H;j++) for(let i=0;i<W;i++){
    const dx=(A(i+1,j)-A(i-1,j))*fuerza, dy=(A(i,j+1)-A(i,j-1))*fuerza, L=Math.hypot(dx,dy,1), o=(j*W+i)*4;
    im.data[o]=(-dx/L*0.5+0.5)*255; im.data[o+1]=(-dy/L*0.5+0.5)*255; im.data[o+2]=(1/L*0.5+0.5)*255; im.data[o+3]=255; }
  x.putImageData(im,0,0); return c;
}
function ruidoPeriodico(semilla,periodo){
  const g=(x,y)=>{ x=((x%periodo)+periodo)%periodo; y=((y%periodo)+periodo)%periodo;
    const s=Math.sin(x*127.1+y*311.7+semilla*13.13)*43758.5453; return s-Math.floor(s); };
  return (x,y)=>{ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    return g(xi,yi)*(1-u)*(1-v)+g(xi+1,yi)*u*(1-v)+g(xi,yi+1)*(1-u)*v+g(xi+1,yi+1)*u*v; };
}
function fbmP(semilla,periodo,oct){ const ns=[]; for(let o=0;o<oct;o++) ns.push(ruidoPeriodico(semilla+o*7,periodo*(1<<o)));
  return (x,y)=>{ let v=0,a=0.5; for(let o=0;o<oct;o++){ v+=ns[o](x*(1<<o),y*(1<<o))*a; a*=0.5; } return v; }; }
function pielLenta(semilla,{px=256,celdas=4,oct=3,rug0=0.45,rugA=0.08,relieve=0.5}={}){
  const f=fbmP(semilla,celdas,oct), k=celdas/px;
  const c=cv(px), x=c.getContext('2d'), im=x.createImageData(px,px);
  for(let j=0;j<px;j++) for(let i=0;i<px;i++){ const v=clamp(rug0+(f(i*k,j*k)-0.5)*2*rugA,0,1)*255, o=(j*px+i)*4;
    im.data[o]=im.data[o+1]=im.data[o+2]=v; im.data[o+3]=255; }
  x.putImageData(im,0,0);
  return {r:tex(c),n:tex(normalDeAltura(px,px,(i,j)=>f(i*k,j*k),relieve))};
}
/* Anillos de torno del disco: rayas a lo largo de la v del perfil = circunferencias. */
function texTorno(){
  const W=8,H=256,c=cv(W,H),x=c.getContext('2d'),im=x.createImageData(W,H);
  for(let j=0;j<H;j++){ const v=clamp(0.40+0.045*Math.sin(j/H*DOSPI*36)+0.03*Math.sin(j/H*DOSPI*7+1.3),0,1)*255;
    for(let i=0;i<W;i++){ const o=(j*W+i)*4; im.data[o]=im.data[o+1]=im.data[o+2]=v; im.data[o+3]=255; } }
  x.putImageData(im,0,0); return tex(c);
}

/* EL CORTE. Toda la exposición se secciona por el plano z = 0 y se conserva la
   mitad de atrás. Las caras de sección no son geometría: cada pieza es un
   sólido cerrado y, donde el plano la abre, lo que se ve por el hueco son sus
   caras de ATRÁS. Ésas se pintan como la cara de corte de un plano de taller:
   el punto se lleva por el rayo de la cámara hasta el plano, se raya a ±45° en
   coordenadas de mundo y se ilumina como una cara plana que mira a +Z. Así el
   corte sale bien aunque la pieza gire (los álabes del disco, los radios de la
   llanta, los dientes de la rueda fónica pasan por el plano y se ven cortados)
   y una pieza metida dentro de otra —el pistón en la pinza, el líquido en sus
   conductos— asoma en la sección como lo que es. */
const PLANO=new THREE.Plane(new THREE.Vector3(0,0,-1),0);
/* El paso del rayado sigue a la distancia de la cámara (≈ 6 px en pantalla): de
   cerca no se vuelve una reja gruesa y de lejos se funde en el tono medio. */
const PASO_G={value:0.0052};
const LUCES_CORTE=THREE.ShaderChunk.lights_fragment_begin.replaceAll('receiveShadow','(receiveShadow&&gl_FrontFacing)');
function corte(m,o={}){
  m.side=THREE.DoubleSide; m.clippingPlanes=[PLANO]; m.clipShadows=true;
  const U={cFondo:{value:new THREE.Color(o.fondo||'#8a9096')},cLinea:{value:new THREE.Color(o.linea||'#5d636a')},
    cSent:{value:o.sentido||1},cPaso:{value:o.paso||1},cPasoG:PASO_G,cRay:{value:o.rayado===false?0:1},cRug:{value:o.rug??0.64}};
  m.userData.cap=U;
  m.onBeforeCompile=(sh)=>{
    Object.assign(sh.uniforms,U);
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vMundoC;')
      .replace('#include <fog_vertex>','#include <fog_vertex>\n{ vec4 wc=vec4(transformed,1.0);\n#ifdef USE_INSTANCING\n wc=instanceMatrix*wc;\n#endif\n vMundoC=(modelMatrix*wc).xyz; }');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vMundoC;\nuniform vec3 cFondo; uniform vec3 cLinea; uniform float cSent; uniform float cPaso; uniform float cPasoG; uniform float cRay; uniform float cRug;')
      .replace('#include <normal_fragment_maps>',`#include <normal_fragment_maps>
      if(!gl_FrontFacing){
        vec3 dC=vMundoC-cameraPosition;
        float tC=clamp(-cameraPosition.z/(dC.z<-1e-5?dC.z:-1e-5),0.0,1.0);
        vec3 pC=cameraPosition+dC*tC;
        if(cRay>0.5){
          float uu=(pC.x*cSent+pC.y)*0.70710678/(cPaso*cPasoG);
          float fw=clamp(fwidth(uu),0.0,0.5);
          float dl=0.5-abs(fract(uu)-0.5);
          float ln=1.0-smoothstep(0.12-fw,0.12+fw,dl);
          ln*=1.0-smoothstep(0.25,0.5,fw);
          diffuseColor.rgb=mix(cFondo,cLinea,ln*0.8);
          metalnessFactor=0.12;
        }
        roughnessFactor=cRug;
        normal=normalize((viewMatrix*vec4(0.0,0.0,1.0,0.0)).xyz);
      }`)
      .replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\nif(!gl_FrontFacing) totalEmissiveRadiance*=0.0;')
      .replace('#include <lights_physical_fragment>','#include <lights_physical_fragment>\n#ifdef USE_CLEARCOAT\nif(!gl_FrontFacing) material.clearcoat=0.0;\n#endif\n#ifdef USE_SHEEN\nif(!gl_FrontFacing) material.sheenColor=vec3(0.0);\n#endif')
      .replace('#include <lights_fragment_begin>',LUCES_CORTE);
  };
  return m;
}

/* ===================== 5. GEOMETRÍA =====================
   `torno` revoluciona un perfil cerrado (a, r) alrededor del eje X —el de la
   rueda— con normales ANALÍTICAS (las del perfil, giradas): ninguna sale nula
   y las aristas vivas (más de `canto` grados) no se redondean. La v de las uv
   es la longitud de arco del perfil, que es lo que hace falta para pintar el
   dibujo del neumático o los anillos de torno. φ = 0 arriba (+Y) y φ > 0 hacia
   −Z: la mitad que se conserva. */
function preparaPerfil(perfil){
  let P=[];
  for(const p of perfil){ const q=[p[0],Math.max(0,p[1])], u=P[P.length-1]; if(!u||Math.hypot(u[0]-q[0],u[1]-q[1])>1e-9) P.push(q); }
  while(P.length>2&&Math.hypot(P[0][0]-P[P.length-1][0],P[0][1]-P[P.length-1][1])<1e-9) P.pop();
  let A=0; for(let i=0;i<P.length;i++){ const p=P[i],q=P[(i+1)%P.length]; A+=p[0]*q[1]-q[0]*p[1]; }
  if(A<0) P.reverse();
  return P;
}
function orienta(pos,nor,idx,i0){
  let S=0;
  for(let k=i0;k<idx.length;k+=3){ const a=idx[k]*3,b=idx[k+1]*3,c=idx[k+2]*3;
    const ux=pos[b]-pos[a],uy=pos[b+1]-pos[a+1],uz=pos[b+2]-pos[a+2], vx=pos[c]-pos[a],vy=pos[c+1]-pos[a+1],vz=pos[c+2]-pos[a+2];
    S+=(uy*vz-uz*vy)*(nor[a]+nor[b]+nor[c])+(uz*vx-ux*vz)*(nor[a+1]+nor[b+1]+nor[c+1])+(ux*vy-uy*vx)*(nor[a+2]+nor[b+2]+nor[c+2]); }
  if(S<0) for(let k=i0;k<idx.length;k+=3){ const t=idx[k+1]; idx[k+1]=idx[k+2]; idx[k+2]=t; }
}
function geoDe(pos,nor,uv,idx){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeBoundingSphere(); return g;
}
function torno(perfil,o={}){
  const {seg=96,phi0=0,phi1=DOSPI,canto=30,uRep=1,vEsc=1,tapas=true}=o;
  const P=preparaPerfil(perfil), n=P.length, EN=[], L=[];
  for(let i=0;i<n;i++){ const p=P[i],q=P[(i+1)%n], da=q[0]-p[0], dr=q[1]-p[1], l=Math.hypot(da,dr)||1e-12; EN.push([dr/l,-da/l]); L.push(l); }
  const cc=Math.cos(canto*Math.PI/180), med=(u,w)=>{ const x=u[0]+w[0], y=u[1]+w[1], l=Math.hypot(x,y)||1; return [x/l,y/l]; };
  const pos=[],nor=[],uv=[],idx=[]; let s=0;
  for(let i=0;i<n;i++){
    const p=P[i],q=P[(i+1)%n],e=EN[i],ea=EN[(i-1+n)%n],ed=EN[(i+1)%n];
    if(p[1]<1e-9&&q[1]<1e-9){ s+=L[i]; continue; }
    const n0=(ea[0]*e[0]+ea[1]*e[1])>cc?med(ea,e):e, n1=(e[0]*ed[0]+e[1]*ed[1])>cc?med(e,ed):e;
    const o0=pos.length/3;
    for(let j=0;j<=seg;j++){
      const f=phi0+(phi1-phi0)*j/seg, c=Math.cos(f), sn=Math.sin(f), u=(f-phi0)/DOSPI*uRep;
      pos.push(p[0],p[1]*c,-p[1]*sn, q[0],q[1]*c,-q[1]*sn);
      nor.push(n0[0],n0[1]*c,-n0[1]*sn, n1[0],n1[1]*c,-n1[1]*sn);
      uv.push(u,s*vEsc, u,(s+L[i])*vEsc);
    }
    for(let j=0;j<seg;j++){ const a=o0+2*j; idx.push(a,a+1,a+3, a,a+3,a+2); }
    s+=L[i];
  }
  orienta(pos,nor,idx,0);
  if(Math.abs(phi1-phi0)<DOSPI-1e-6&&tapas){
    const tri=THREE.ShapeUtils.triangulateShape(P.map(([a,r])=>new THREE.Vector2(a,r)),[]);
    for(const [f,sg] of [[phi0,-1],[phi1,1]]){
      const c=Math.cos(f), sn=Math.sin(f), o0=pos.length/3, i0=idx.length;
      for(const [a,r] of P){ pos.push(a,r*c,-r*sn); nor.push(0,-sn*sg,-c*sg); uv.push(a*8,r*8); }
      for(const t of tri) idx.push(o0+t[0],o0+t[1],o0+t[2]);
      orienta(pos,nor,idx,i0);
    }
  }
  return geoDe(pos,nor,uv,idx);
}
const tornoY=(perfil,o)=>torno(perfil,o).rotateZ(Math.PI/2);   // eje +Y (a → y)
function perimetro(P){ let s=0; for(let i=0;i<P.length;i++){ const p=P[i],q=P[(i+1)%P.length]; s+=Math.hypot(q[0]-p[0],q[1]-p[1]); } return s; }
/* Un sólido «hueco»: la misma malla con las normales y el sentido al revés.
   Metido dentro de otro sólido es un TALADRO: por el corte se ve su pared. */
function invierte(g){
  const n=g.attributes.normal; for(let i=0;i<n.count;i++) n.setXYZ(i,-n.getX(i),-n.getY(i),-n.getZ(i));
  if(g.index){ const ix=g.index; for(let i=0;i<ix.count;i+=3){ const t=ix.getX(i+1); ix.setX(i+1,ix.getX(i+2)); ix.setX(i+2,t); } }
  else { for(const k of Object.keys(g.attributes)){ const a=g.attributes[k], s=a.itemSize;
    for(let i=0;i<a.count;i+=3) for(let c=0;c<s;c++){ const t=a.array[(i+1)*s+c]; a.array[(i+1)*s+c]=a.array[(i+2)*s+c]; a.array[(i+2)*s+c]=t; } } }
  return g;
}

const en=(g,x,y,z)=>{ g.translate(x,y,z); return g; };

const I_TALON_INT=19;   // desde aquí, la superficie exterior
/* El dibujo: 72 pasos en la vuelta. Surcos transversales en los hombros, laminillas
   oblicuas en los nervios de dentro; la v recorre el perfil (forro, talón, flanco,
   banda), así que cada fila de la textura sabe en qué punto del perfil está. */
function texNeumatico(P){
  const W=1024,H=512,S=perimetro(P), cum=[0];
  for(let i=0;i<P.length;i++){ const p=P[i],q=P[(i+1)%P.length]; cum.push(cum[i]+Math.hypot(q[0]-p[0],q[1]-p[1])); }
  const fila=[];   // por fila: {a, r, zona}
  for(let j=0;j<H;j++){ const s=(j+0.5)/H*S; let i=0; while(i<P.length-1&&cum[i+1]<s) i++;
    const p=P[i],q=P[(i+1)%P.length], t=clamp((s-cum[i])/Math.max(1e-9,cum[i+1]-cum[i]),0,1);
    const a=p[0]+(q[0]-p[0])*t, r=p[1]+(q[1]-p[1])*t;
    const zona=(i===0||i===I_TALON_INT-1)?'talon':(i<I_TALON_INT?'forro':(r>0.3148?'banda':(r>0.3070&&Math.abs(a)<0.0705?'surco':(r>0.296?'hombro':'flanco'))));
    fila.push({a,r,zona}); }
  const alt=new Float32Array(W*H), c=cv(W,H), x=c.getContext('2d'), im=x.createImageData(W,H), lento=fbmP(5,6,3);
  for(let j=0;j<H;j++){ const F=fila[j], aa=Math.abs(F.a);
    for(let i=0;i<W;i++){
      const u=i/W, p=u*72; let h=1, col=[30,32,35];
      if(F.zona==='forro'){ col=[50,47,45]; h=0.5; }
      else if(F.zona==='talon'){ col=[22,23,25]; h=0.5; }
      else if(F.zona==='surco'){ col=[15,16,17]; h=0; }
      else if(F.zona==='flanco'){ col=[28,29,32]; h=0.6+0.4*clamp((F.r-0.2525)*600,0,1)*clamp((0.2555-F.r)*600,0,1); }
      else {
        const lado=F.a>0?0.5:0;
        if(aa>0.0670){ const f=(p+lado)%1; if(f<0.27){ h=0.05; col=[16,17,18]; } }
        else if(aa>0.0270){ const f=(p+lado+0.35+(aa-0.0275)/0.03*0.35)%1; if(f<0.06){ h=0.35; col=[20,21,23]; } }
        else { const f=(p+0.25+F.a*9)%1; if(f<0.05){ h=0.4; col=[21,22,24]; } }
        if(F.zona==='hombro'&&h===1) col=[29,31,34];
      }
      const k=0.94+0.12*lento(u*6,j/H*6), o=(j*W+i)*4;
      im.data[o]=col[0]*k; im.data[o+1]=col[1]*k; im.data[o+2]=col[2]*k; im.data[o+3]=255; alt[j*W+i]=h; } }
  x.putImageData(im,0,0);
  const map=tex(c,{srgb:true,flip:false}), nrm=tex(normalDeAltura(W,H,(i,j)=>alt[j*W+i],2.2),{flip:false});
  return {map,nrm,S};
}

/* ===================== 9. EL ESTADO: UN SOLO RELOJ =====================
   El modelo avanza en pasos de DT_SIM; el reloj de la pantalla lo multiplica
   por la escala (cámara lenta ×1/10 por defecto). De ese estado salen la
   rueda que gira, la pista que corre, las válvulas, el color del líquido, las
   huellas, las cifras y las gráficas del dock: nada lleva un reloj propio. */
const EST={modo:'ciclo',pista:'seco',abs:true,v0kmh:100,lamObj:ECU.lamObj,h:ECU.h,esc:0.1,pausa:REDUCIDO,corte:true,despiece:false,
  rotulos:false,autoRunning:false,escMano:false};
const SIM={S:null,cfg:null,buf:[],tMuestra:-1,resto:0,espera:0,valvPrev:'sube',alfa:0,clearHasta:0,filasSucias:new Set(),look:'seco',fin:false};
const RET={v:null,idx:-1,intentos:[],fallos:0,resuelto:false,pistas:0,resiembras:0,lam:RETO.ini,puntos:[],enCurso:false};
const PICOS=new Map();
const picoCache=s=>{ const k=s.nom+'|'+s.B; if(!PICOS.has(k)) PICOS.set(k,picoDe(s)); return PICOS.get(k); };

function cfgActual(){
  if(EST.modo==='reto') return {pista:pistaReto(RET.v),v0:RETO.v0,abs:EST.abs,lamObj:RET.lam,h:RETO.h};
  return {pista:PISTAS[EST.pista],v0:EST.v0kmh/3.6,abs:EST.abs,lamObj:EST.lamObj,h:EST.h};
}
function lookActual(){ return EST.modo==='reto'?(RET.v.fam==='hormigon'?'hormigon':'mojado2'):EST.pista; }

/* ===================== 10. LA PISTA: BASE, MARCAS DE DISTANCIA Y HUELLAS ===================== */
const LIMPIO=PX.createImageData(PISTA.nx,PISTA.ny), IMG=PX.createImageData(PISTA.nx,PISTA.ny);
const ROW_E=new Float64Array(PISTA.ny), SUCIAS=new Set();
const RIBS=[[-0.080,-0.0675],[-0.0575,-0.0275],[-0.0175,0.0175],[0.0275,0.0575],[0.0675,0.080]];
const colDe=x=>Math.round((x-PISTA.x0)/PISTA.W*PISTA.nx);
const filaDe=s=>{ const m=((s%PISTA.L)+PISTA.L)%PISTA.L; return Math.min(PISTA.ny-1,Math.floor(m/PISTA.fila)); };
function hash2(i,j){ const s=Math.sin(i*127.1+j*311.7)*43758.5453; return s-Math.floor(s); }
const LENTO_P=ruidoPeriodico(17,1e6);
function filaLimpia(sg){
  const look=SUP[SIM.look], row=filaDe(sg), abs=Math.round(sg/PISTA.fila), d=LIMPIO.data;
  for(let c=0;c<PISTA.nx;c++){
    const n=(hash2(c,abs)-0.5)*look.var+(LENTO_P(c/9,abs/9)-0.5)*look.var*1.6;
    let r=look.base[0]+n, g=look.base[1]+n, b=look.base[2]+n;
    if(look.surcado){ const m=((abs%5)+5)%5, s=m===0?0.93:(m===1||m===4)?0.975:1; r*=s; g*=s; b*=s; }   // surcos suaves: sin rayado de alta frecuencia
    const o=(row*PISTA.nx+c)*4; d[o]=r; d[o+1]=g; d[o+2]=b; d[o+3]=255; }
  // la línea de salida y una marca por metro (más larga cada 5 m)
  const f=sg-Math.floor(sg), k=Math.floor(sg);
  if(sg>=0&&f<0.012){
    const ini=k===0, c0=colDe(ini?PISTA.x0+0.01:-0.31), c1=colDe(ini?PISTA.x0+PISTA.W-0.01:(k%5===0?-0.20:-0.255));
    for(let c=Math.max(0,c0);c<Math.min(PISTA.nx,c1);c++){ const o=(row*PISTA.nx+c)*4; d[o]=ini?232:214; d[o+1]=ini?205:216; d[o+2]=ini?120:210; }
  }
  ROW_E[row]=0;
  const o=row*PISTA.nx*4; IMG.data.set(d.subarray(o,o+PISTA.nx*4),o); SUCIAS.add(row);
}
/* Vuelca al lienzo sólo las filas tocadas, en tramos contiguos: a ×5 sobre hielo
   pasan cientos de filas por cuadro y una llamada por fila se notaría. */
function vuelca(){
  if(!SUCIAS.size) return;
  const r=[...SUCIAS].sort((a,b)=>a-b); let i=0;
  while(i<r.length){ let j=i; while(j+1<r.length&&r[j+1]===r[j]+1) j++; PX.putImageData(IMG,0,0,0,r[i],PISTA.nx,r[j]-r[i]+1); i=j+1; }
  SUCIAS.clear(); T_PISTA.needsUpdate=true;
}
function pintaRugosidad(){
  const look=SUP[SIM.look], f=fbmP(29,4,3), im=RX.createImageData(64,256);
  for(let j=0;j<256;j++) for(let i=0;i<64;i++){ const n=f(i/64*4,j/256*4);
    let v=look.rug+(n-0.5)*(look.cc>0?0.5:0.12); if(SIM.look==='mojado'||SIM.look==='mojado2') v=n>0.56?0.12:look.rug+0.1*(n-0.5);
    v=clamp(v,0.03,1)*255; const o=(j*64+i)*4; im.data[o]=im.data[o+1]=im.data[o+2]=v; im.data[o+3]=255; }
  RX.putImageData(im,0,0); T_PISTA_R.needsUpdate=true;
  M_PISTA.clearcoat=look.cc; M_PISTA.clearcoatRoughness=SIM.look==='hielo'?0.06:0.14; M_PISTA.envMapIntensity=look.env??1;
}
function reseteaPista(){
  ROW_E.fill(0);
  for(let sg=-PISTA.zB-0.02;sg<=-PISTA.zA+0.03;sg+=PISTA.fila) filaLimpia(sg);
  SIM.clearHasta=-PISTA.zA+0.03; SIM.filasSucias.clear(); vuelca();
}
function limpiaAdelante(s){
  let n=0; while(SIM.clearHasta<s-PISTA.zA+0.03&&n<3000){ SIM.clearHasta+=PISTA.fila; filaLimpia(SIM.clearHasta); n++; }
}
function huella(s0,s1,eD){
  if(eD<=0&&SUP[SIM.look].rodada===undefined) return;
  const row=filaDe((s0+s1)/2); ROW_E[row]+=eD; SIM.filasSucias.add(row);
}
const RIB_COLS=RIBS.map(([x0,x1])=>[colDe(x0),Math.max(colDe(x0)+1,colDe(x1))]);
function pintaHuellas(){
  if(SIM.filasSucias.size){
    const look=SUP[SIM.look], [cr,cg,cb]=look.huella, L=LIMPIO.data, D=IMG.data;
    for(const row of SIM.filasSucias){
      const a=Math.min(0.95,clamp(1-Math.exp(-(ROW_E[row]/PISTA.fila)/look.e0),0,0.92)+(look.rodada||0)), o=row*PISTA.nx*4;
      D.set(L.subarray(o,o+PISTA.nx*4),o);
      if(a>0.01) for(const [c0,c1] of RIB_COLS) for(let c=c0;c<c1;c++){ const k=o+c*4, ae=(c===c0||c===c1-1)?a*0.6:a;
        D[k]+=(cr-D[k])*ae; D[k+1]+=(cg-D[k+1])*ae; D[k+2]+=(cb-D[k+2])*ae; }
      SUCIAS.add(row);
    }
    SIM.filasSucias.clear();
  }
  vuelca();
}
SUP.nieve.rodada=0.22;

/* ===================== 11. LA CORRIDA ===================== */
function nuevaCorrida(t0=0,{suelto=false}={}){
  SIM.cfg=cfgActual(); SIM.S=nuevaFrenada(SIM.cfg); SIM.S.suelto=suelto;
  SIM.buf.length=0; SIM.tMuestra=-1; SIM.resto=0; SIM.espera=0; SIM.valvPrev='sube'; SIM.fin=false;
  const look=lookActual(); if(look!==SIM.look){ SIM.look=look; pintaRugosidad(); } reseteaPista();
  if(t0>0) avanzaSim(t0,true);
  pideComparacion(); pintaDockFijo();
}
function avanzaSim(dt,sinTope){
  const S=SIM.S; if(!S||S.fin) return 0;
  const tot=dt+SIM.resto; let n=Math.floor(tot/DT_SIM); SIM.resto=tot-n*DT_SIM; if(!sinTope&&n>6000){ n=6000; SIM.resto=0; }
  for(let i=0;i<n&&!S.fin;i++){
    const s0=S.y[3], eD=paso(S,DT_SIM); huella(s0,S.y[3],eD);
    // la pista de delante se limpia según avanza, no al final: una pre-corrida de 15 m daría la vuelta a la textura y borraría su propia huella
    if(S.y[3]-PISTA.zA+0.03>SIM.clearHasta+PISTA.fila) limpiaAdelante(S.y[3]);
    if(S.t-SIM.tMuestra>=0.001-1e-9){ SIM.tMuestra=S.t; SIM.buf.push(instante(S)); if(SIM.buf.length>9000) SIM.buf.splice(0,2000); }
    if(S.valv!==SIM.valvPrev){ SIM.valvPrev=S.valv; if(EST.esc<=1) sonido.clic(S.valv); }
  }
  limpiaAdelante(S.y[3]); pintaHuellas();
  if(S.fin&&!SIM.fin){ SIM.fin=true; alTerminar(); }
  return n*DT_SIM;
}
function alTerminar(){
  if(EST.modo==='reto'&&RET.enCurso){
    RET.enCurso=false;
    RET.intentos.push({lam:SIM.cfg.lamObj,abs:SIM.cfg.abs,d:SIM.S.xFin});
    for(let i=0;i<SIM.buf.length;i+=6){ const q=SIM.buf[i]; if(q.v>1) RET.puntos.push([q.lam,q.mu]); }
    if(RET.puntos.length>1600) RET.puntos.splice(0,RET.puntos.length-1600);
    pintaHUD();
  }
}

/* -- las distancias de comparación, calculadas por lotes sin parar la escena -- */
const LOTE={cola:[],cache:new Map()};
const claveCfg=c=>[c.pista.nom,c.pista.B,c.v0.toFixed(4),c.abs,c.lamObj.toFixed(3),c.h.toFixed(3)].join('|');
function pideDistancia(cfg,cb){ const k=claveCfg(cfg); if(LOTE.cache.has(k)){ cb(LOTE.cache.get(k)); return; }
  const ya=LOTE.cola.find(L=>L.k===k); if(ya){ ya.cbs.push(cb); return; } LOTE.cola.push({k,S:nuevaFrenada(cfg),cbs:[cb]}); }
function pasaLotes(ms){
  const t0=performance.now();
  while(LOTE.cola.length&&performance.now()-t0<ms){ const L=LOTE.cola[0];
    for(let i=0;i<1500&&!L.S.fin&&L.S.t<200;i++) paso(L.S,DT_SIM);
    if(L.S.fin||L.S.t>=200){ const r={d:L.S.xFin,t:L.S.tFin,eps:aprovechamiento(L.S)}; LOTE.cache.set(L.k,r); LOTE.cola.shift(); L.cbs.forEach(f=>f(r)); } }
}
const CMP={con:null,sin:null,ideal:null};
function pideComparacion(){
  const c=SIM.cfg; CMP.con=CMP.sin=null; CMP.ideal=distanciaIdeal(c.v0,c.pista);
  if(EST.modo==='reto') return;
  const kc={...c,abs:true}, ks={...c,abs:false};
  pideDistancia(kc,r=>{ if(SIM.cfg&&claveCfg({...SIM.cfg,abs:true})===claveCfg(kc)) CMP.con=r; });
  pideDistancia(ks,r=>{ if(SIM.cfg&&claveCfg({...SIM.cfg,abs:false})===claveCfg(ks)) CMP.sin=r; });
}

/* ===================== 12. LA ESCENA SIGUE AL MODELO ===================== */
const C_P=[[0,'#1d5f86'],[26.4,'#2f8f8a'],[54,'#e9b23a'],[86.4,'#e0622c'],[120,'#c42a24']].map(([p,c])=>[p,new THREE.Color(c)]);
function colorP(p,dst){ p=clamp(p,0,120); for(let i=1;i<C_P.length;i++) if(p<=C_P[i][0]){ const [p0,c0]=C_P[i-1],[p1,c1]=C_P[i]; return dst.lerpColors(c0,c1,(p-p0)/(p1-p0)); } return dst.copy(C_P[C_P.length-1][1]); }
const _ca=new THREE.Color(), _cb=new THREE.Color();
function aplicaEscena(dtSim,dtReal){
  const S=SIM.S; if(!S) return;
  const v=S.y[0], w=Math.max(0,S.y[1]), p=S.y[2], pm=S.suelto?0:pPedal(S.t);
  GIRA.rotation.x=-S.y[4]; BOLAS.rotation.x=-S.y[4]*0.42;
  const s=S.y[3]; T_PISTA.offset.y=((s/PISTA.L)%1+1)%1; T_PISTA_R.offset.y=((s/PISTA.L*2)%1+1)%1;
  // las válvulas: la EV abre en reposo y cierra al excitarse; la AV al revés
  const vv=S.valv, evAbierta=vv==='sube', avAbierta=vv==='baja';
  EMP_EV.position.y+=((evAbierta?7.5:5.5)-EMP_EV.position.y)*Math.min(1,dtReal*30);
  EMP_AV.position.y+=((avAbierta?-5.0:-7.5)-EMP_AV.position.y)*Math.min(1,dtReal*30);
  // el acumulador de baja: el émbolo baja lo que entra de líquido (Ø16 del esquema)
  const viaje=Math.min(12.5,S.Vacu/(Math.PI*0.8*0.8)*10), xp=-36-viaje;
  ACU_EMB.position.set(xp-3,-28,0); ACU_LIQ.visible=viaje>0.05; ACU_LIQ.scale.set(Math.max(0.01,viaje),1,1); ACU_LIQ.position.set(-36-viaje/2,-28,0);
  ACU_MUE.position.set(-55,-28,0); ACU_MUE.scale.set(Math.max(1,xp-6+55),1,1);
  // la bomba: 45 vueltas por segundo de excéntrica mientras el ABS regula
  if(S.bomba&&v>0.3) SIM.alfa+=DOSPI*45*dtSim;
  const e=2.5, xc=44+e*Math.cos(SIM.alfa)-6; EXC.position.set(44+e*Math.cos(SIM.alfa),-28+e*Math.sin(SIM.alfa),0);
  BOM_EMB.position.set(xc-6,-28,0); const Lc=Math.max(0.2,xc-12-14); BOM_LIQ.scale.set(Lc,1,1); BOM_LIQ.position.set(14+Lc/2,-28,0);
  // el color del líquido es su presión
  colorP(p,M.fluW.color); colorP(pm,M.fluMC.color); colorP(S.Vacu>0||S.bomba?HID.pAcu:0,M.fluR.color);
  colorP(evAbierta?(p+pm)/2:pm,M.oriEV.color); colorP(avAbierta?(p+HID.pAcu)/2:HID.pAcu,M.oriAV.color);

/* ===================== 13. CÁMARAS ENCAJADAS EN EL HUECO LIBRE ===================== */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const hud=r('hud'), pan=r('panel'), tb=r('tbar'), vb=r('vbar');
  let x0=8, x1=W-8, y0=60, y1=H-12;
  if(W>820){ if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8); }
  else y1=H*0.52;
  return {x0,x1,y0,y1};
}
function encaja(t,dir,pts,caja,margen=0){
  if(margen){ const mx=(caja.x1-caja.x0)*margen, my=(caja.y1-caja.y0)*margen; caja={x0:caja.x0+mx,x1:caja.x1-mx,y0:caja.y0+my,y1:caja.y1-my}; }
  const cam=camera.clone(), W=innerWidth, H=innerHeight, tan=Math.tan(cam.fov*Math.PI/360);
  cam.aspect=W/H; cam.updateProjectionMatrix();
  const cw=caja.x1-caja.x0, ch=caja.y1-caja.y0, cx=(caja.x0+caja.x1)/2, cy=(caja.y0+caja.y1)/2;
  let dist=3; const q=new THREE.Vector3(), der=new THREE.Vector3(), arr=new THREE.Vector3(); t=t.clone(); dir=dir.clone().normalize();
  for(let it=0;it<9;it++){
    cam.position.copy(t).addScaledVector(dir,dist); cam.lookAt(t); cam.updateMatrixWorld();
    let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9;
    for(const p of pts){ q.copy(p).project(cam); const sx=(q.x+1)/2*W, sy=(1-q.y)/2*H;
      a0=Math.min(a0,sx); a1=Math.max(a1,sx); b0=Math.min(b0,sy); b1=Math.max(b1,sy); }
    const k=Math.max((a1-a0)/cw,(b1-b0)/ch), wpp=2*tan*dist/H;
    der.setFromMatrixColumn(cam.matrixWorld,0); arr.setFromMatrixColumn(cam.matrixWorld,1);
    t.addScaledVector(der,((a0+a1)/2-cx)*wpp).addScaledVector(arr,-((b0+b1)/2-cy)*wpp);
    dist*=k;
  }
  return [t.clone().addScaledVector(dir,dist),t];
}
function puntosDe(objs,porMalla){ const pts=[], v=new THREE.Vector3();
  for(const o of objs){ o.updateMatrixWorld(true); o.traverse(m=>{ if(!m.isMesh||!m.visible) return;
    const p=m.geometry.attributes.position, st=Math.max(1,Math.floor(p.count/(porMalla||80)));
    for(let i=0;i<p.count;i+=st){ v.fromBufferAttribute(p,i).applyMatrix4(m.matrixWorld); if(v.z<=0.002) pts.push(v.clone()); } }); }
  return pts; }
const caja3=(x0,y0,z0,x1,y1,z1)=>{ const r=[]; for(const x of [x0,x1]) for(const y of [y0,y1]) for(const z of [z0,z1]) r.push(V3(x,y,z)); return r; };
const VISTA={actual:'tres4'};
function vistaCam(v){
  // se encuadra la posición FINAL del despiece, no la de este instante de la animación
  const ex=EXT.position.x, ty=TAPA.position.y; EXT.position.x=EST.despiece?-0.24:0; TAPA.position.y=EST.despiece?46:0;
  try{ return vistaCam0(v); } finally { EXT.position.x=ex; TAPA.position.y=ty; RUEDA.updateMatrixWorld(true); HCU.updateMatrixWorld(true); }
}
function vistaCam0(v){
  const H=huecoLibre(), cen=pts=>new THREE.Box3().setFromPoints(pts).getCenter(new THREE.Vector3());
  if(v==='rueda'){ const pts=puntosDe([RUEDA],90); return encaja(cen(pts),V3(0.16,0.13,1),pts,H,0.05); }
  if(v==='pinza'){ const pts=caja3(-0.03,YC+0.085,-0.02,0.135,YC+0.195,0); return encaja(cen(pts),V3(0.22,0.16,1),pts,H,0.07); }
  if(v==='hidraulica'){ const pts=puntosDe([HCU],60); return encaja(cen(pts),V3(0.10,0.12,1),pts,H,0.06); }
  if(v==='huella'){ const pts=caja3(-0.14,0,-0.15,0.14,0.05,2.1).concat(caja3(-0.1,0.0,-0.1,0.1,0.35,0)); return encaja(V3(0,0,0.9),V3(0.30,0.92,0.62),pts,H,0.03); }
  const pts=puntosDe([RUEDA,HCU],70).concat(puntosDe([BANCO],30)).filter(p=>p.y>0.02);
  return encaja(cen(pts),V3(0.36,0.28,0.89),pts,H,0.075);
}
const CAMT={on:false};
function ponVista(v,dur){
  VISTA.actual=v; const [p,t]=vistaCam(v);
  Object.assign(CAMT,{on:true,u:0,dur:dur===undefined?(REDUCIDO?0.001:1.2):dur,p0:camera.position.clone(),t0:controls.target.clone(),p1:p,t1:t});
  pintaBarras();
}
function pasaCam(dt){
  if(!CAMT.on) return;
  CAMT.u=Math.min(1,CAMT.u+dt/Math.max(CAMT.dur,1e-3)); const e=ease(CAMT.u);
  camera.position.lerpVectors(CAMT.p0,CAMT.p1,e); controls.target.lerpVectors(CAMT.t0,CAMT.t1,e);
  if(CAMT.u>=1) CAMT.on=false;
}
controls.addEventListener('start',()=>{ CAMT.on=false; });

const FUENTE="'Outfit',system-ui,sans-serif";
function lienzo(id){ const box=el(id), c=box.querySelector('canvas'); return {box,c,ctx:c.getContext('2d'),w:0,h:0,dpr:1}; }
function abre(L){ const r=L.box.getBoundingClientRect(), dpr=Math.min(3,window.devicePixelRatio||1);

let fbTimer=null;

function siembraReto(){
  let i; do{ i=Math.floor(Math.random()*RETO_PISTAS.length); }while(i===RET.idx&&RETO_PISTAS.length>1);
  Object.assign(RET,{idx:i,v:RETO_PISTAS[i],intentos:[],fallos:0,resuelto:false,pistas:0,pistaTxt:'',puntos:[],lam:RETO.ini,enCurso:false,porque:''});

function entraReto(){ EST.abs=true; if(!EST.escMano) EST.esc=1; nuevaCorrida(0,{suelto:true}); pintaHUD(); pintaBarras(); }
function entregaReto(){
  if(RET.resuelto) return;
  const v=RET.v, lam=RET.lam, d=distanciaReto(v,lam), lim=v.dmin*(1+RETO.tol), exceso=(d/v.dmin-1)*100;
  if(d<=lim){
    RET.resuelto=true; RET.porque=`Con λ objetivo ${pct(lam)} la frenada mide <b>${fN(d,2)} m</b>; la mejor posible, ${fN(v.dmin,2)} m${exceso<0.05?'':' (+'+fN(exceso,1)+' %)'}. El pico está en λ* = ${fN(picoCache(pistaReto(v)).lam*100,0)} %: apuntar justo ahí deja la parte alta de cada oscilación en la rama que cae, y la ECU suelta presión una y otra vez. Un poco por debajo, la rueda se queda en la rama estable.`;
    sonido.bien(); feedback('good','Calibración aceptada',RET.porque);
  } else {
    RET.fallos++;
    const msg=`Con λ objetivo ${pct(lam)} la frenada mide ${fN(d,2)} m: un ${fN(exceso,1)} % más que la mejor calibración posible (se acepta hasta un 3 %).`;
    if(RET.fallos>=3){ RET.resiembras++; feedback('bad','Tres intentos fallidos',msg+' Te damos otra pista de pruebas: vuelve a medir.'); sonido.mal(); setTimeout(()=>{ siembraReto(); entraReto(); },1600); }
    else { feedback('bad','Todavía no',msg); sonido.mal(); }
  }
  pintaHUD(); pintaDockFijo();
}

async function runAuto(){
  if(EST.autoRunning||EST.modo!=='ciclo') return; EST.autoRunning=true; sonido.init();
  const b=el('btnAuto'); if(b){ b.disabled=true; b.textContent='Recorrido en curso…'; }
  const hud=el('hud'); hud.style.pointerEvents='none';
  const prev={pista:EST.pista,abs:EST.abs,v0kmh:EST.v0kmh,lamObj:EST.lamObj,h:EST.h,esc:EST.esc,pausa:EST.pausa,vista:VISTA.actual,escMano:EST.escMano};
  try{
    Object.assign(EST,{pista:'seco',abs:false,v0kmh:100,lamObj:ECU.lamObj,h:ECU.h,esc:0.1,pausa:false}); pintaHUD(); hud.style.pointerEvents='none';
    nuevaCorrida(0); ponVista('tres4'); pintaBarras();
    showToast('Paso 1 · <b>Sin ABS</b>. La presión sube hasta 120 bar y en décimas de segundo la rueda se <b>bloquea</b>: mira la franja negra en la pista y el punto saltar a λ = 100 % en la curva.',7000);
    await espera(7600);
    EST.abs=true; pintaHUD(); hud.style.pointerEvents='none'; nuevaCorrida(0); ponVista('hidraulica');
    showToast('Paso 2 · <b>Con ABS</b>. Cuando la rueda se frena de más, la ECU cierra la <b>EV</b> y abre la <b>AV</b>: la presión de la rueda cae (el líquido vira hacia el azul) y la rueda vuelve a girar.',8000);
    await espera(8600);
    ponVista('tres4'); document.body.classList.add('guiado');
    showToast('Paso 3 · En la curva μ–λ del panel, el punto oscila <b>cerca del pico</b>, donde el neumático da casi la máxima fuerza. Por eso frena antes que la rueda bloqueada.',7000);
    await espera(7400); document.body.classList.remove('guiado');
    EST.pista='mojado'; pintaHUD(); hud.style.pointerEvents='none'; nuevaCorrida(0.3);
    showToast('Paso 4 · En <b>mojado</b> el pico es más bajo y está antes: la ECU regula a menos presión y la frenada se alarga.',6000);
    await espera(6400);
  } finally {
    document.body.classList.remove('guiado');
    Object.assign(EST,{pista:prev.pista,abs:prev.abs,v0kmh:prev.v0kmh,lamObj:prev.lamObj,h:prev.h,esc:prev.esc,pausa:prev.pausa,escMano:prev.escMano});
    EST.autoRunning=false; hud.style.pointerEvents='';
    nuevaCorrida(0.3); pintaHUD(); ponVista(prev.vista); pintaBarras();
  }
}

/* ===================== 20. SONIDO (sintetizado) =====================
   Un clic seco cada vez que conmutan las válvulas, el zumbido de la bomba
   mientras regula y el chirrido de la goma sólo cuando desliza de verdad:
   el ABS casi no chirría; la rueda bloqueada, sí. */
const sonido=(function(){
  let ctx=null,on=true,master=null,buf=null,chir=null,rod=null,bom=null;
  function ruidoEn(f,tipo,q){ const s=ctx.createBufferSource(); s.buffer=buf; s.loop=true; const b=ctx.createBiquadFilter(); b.type=tipo; b.frequency.value=f; b.Q.value=q;
    const g=ctx.createGain(); g.gain.value=0; s.connect(b); b.connect(g); g.connect(master); s.start(); return {g,b}; }
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.85; master.connect(ctx.destination);
      buf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      chir=ruidoEn(1250,'bandpass',7); rod=ruidoEn(240,'lowpass',0.7);
      const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=68; const b=ctx.createBiquadFilter(); b.type='lowpass'; b.frequency.value=420; const g=ctx.createGain(); g.gain.value=0;
      o.connect(b); b.connect(g); g.connect(master); o.start(); bom={g};
    }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); }
  function golpe(f,dur,vol){ if(!ctx||!on) return; const s=ctx.createBufferSource(), b=ctx.createBiquadFilter(), g=ctx.createGain(), t=ctx.currentTime; s.buffer=buf;
    b.type='bandpass'; b.frequency.value=f; b.Q.value=1.6; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); s.connect(b); b.connect(g); g.connect(master); s.start(t,Math.random()*0.5); s.stop(t+dur); }
  function actualiza(I,activo){ if(!ctx) return; const t=ctx.currentTime;
    const desl=I&&I.v>0.5?clamp((I.lam-0.18)/0.5,0,1)*clamp(I.v/12,0,1):0, rueda=I?clamp(I.wR/30,0,1):0;
    chir.g.gain.setTargetAtTime(on&&activo?0.05*desl:0,t,0.04); chir.b.frequency.setTargetAtTime(1100+400*desl,t,0.05);
    rod.g.gain.setTargetAtTime(on&&activo?0.03*rueda:0,t,0.08);
    bom.g.gain.setTargetAtTime(on&&activo&&I&&I.bomba&&I.v>0.5?0.022:0,t,0.06); }
  return {init,actualiza,
    clic:(v)=>golpe(v==='baja'?2600:1900,0.035,0.05),
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});

/* ===================== 21. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.min(devicePixelRatio,alta?2:1.5));
  const ms=alta?2048:1024; if(LUZ.clave.shadow.mapSize.x!==ms){ LUZ.clave.shadow.mapSize.set(ms,ms); if(LUZ.clave.shadow.map){ LUZ.clave.shadow.map.dispose(); LUZ.clave.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); colocaBarras();
  clearTimeout(window.__rzABS); window.__rzABS=setTimeout(()=>ponVista(VISTA.actual,0.01),140);
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 22. EL LAZO: UN SOLO RELOJ ===================== */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  let dSim=0;
  if(!EST.pausa&&SIM.S){
    if(!SIM.S.fin) dSim=avanzaSim(dt*EST.esc);
    else if(EST.modo==='ciclo'&&!EST.autoRunning){ SIM.espera+=dt; if(SIM.espera>2.6) nuevaCorrida(0); }
  }
  pasaLotes(SIM.S&&SIM.S.fin?8:3);
  aplicaEscena(dSim,dt);
  pasaCam(dt);
  sonido.actualiza(SIM.buf[SIM.buf.length-1],!EST.pausa&&SIM.S&&!SIM.S.fin);
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033){ tLienzo=t; pintaML(); pintaT(); }
  controls.update();
  PASO_G.value=clamp(0.0032*camera.position.distanceTo(controls.target),0.0009,0.009);
  renderer.info.reset(); composer.render();
  colocaRotulos();
}

/* ===================== 23. ARRANQUE =====================
   La demo abre con el ciclo ya en marcha: 0,55 s después de pisar, el ABS
   ya ha cortado varias veces y la huella de los primeros metros está en la
   pista. */
EST.esc=0.1;
