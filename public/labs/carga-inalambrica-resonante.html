<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Carga Inalámbrica Resonante (SAE J2954) — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#0A1628;--panel:rgba(8,16,30,.86);--line:#1F3556;--ink:#EAF1FA;
    --dim:#8FA9C8;--accent:#3D8BF2;--accent2:#7DB8FF;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --c1:#FFA24A;--c2:#4DE3FF;--cV:#EAF1FA;--cB:#B38CFF;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#121D30;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#18263D}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#05101F;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#05101F;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#5FA2F5}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#05101F}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#7DB8FF;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6C86A6;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7E93AD;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#04132A}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#08111f;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(31,53,86,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(31,53,86,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6C86A6}
  .dk-tit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#9DB6D4;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(31,53,86,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#B2C6DE;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#121D30;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#CFE0F2;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cT);flex:none}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,18,32,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(8,16,30,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d6d2}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(8,16,30,.92);border:1px solid rgba(125,184,255,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(8,16,30,.84);border:1px solid rgba(125,184,255,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}
  body.estrecho.ancho.t-panel .panel>.dk-top{grid-column:1;grid-row:2}
  body.estrecho.ancho.t-panel .panel>.dk-row{grid-column:1;grid-row:3/6;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-fu{grid-column:2;grid-row:2;align-self:start}
  body.estrecho.ancho.t-panel .panel>.dk-g.fu{grid-column:2;grid-row:2/4;min-height:0;margin-top:18px}
  body.estrecho.ancho.t-panel .panel>.dk-ley{display:none}
  body.estrecho.ancho.t-panel .panel>.t-sp{grid-column:2;grid-row:4}
  body.estrecho.ancho.t-panel .panel>.dk-g.sp{grid-column:2;grid-row:5;min-height:0}
  body.estrecho.ancho.t-panel .panel>.dk-aviso{display:none}
  body.estrecho .hud details>.cuerpo{max-height:24vh}
  body.estrecho.ancho.t-hud .hud{display:grid;grid-template-columns:1fr 1.05fr;column-gap:14px;row-gap:7px;align-content:start;grid-auto-flow:row dense}
  body.estrecho.ancho .hud>.hcab,body.estrecho.ancho .hud>.modebar,body.estrecho.ancho .hud>.hdet,body.estrecho.ancho .hud>.pasos{grid-column:1}
  body.estrecho.ancho .hud>.hmandos,body.estrecho.ancho .hud>.retoBox{grid-column:2;grid-row:1/span 4}
  body.estrecho .hdet{flex-direction:row}body.estrecho .hdet>details{flex:1;min-width:0}
  body.estrecho .hdet details[open]{position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 54px);z-index:25;background:rgba(8,16,30,.97)}
  body.movil .lt{display:none} body.movil .tbar .modo,body.movil .tbar .reloj{display:none}
  body.movil .tbar{gap:6px;padding:5px 8px} body.movil .tbar .est{min-width:0}
  body.movil .dk-ley{display:none} body.movil .fg b{font-size:13.5px} body.movil .fg .fl{font-size:9.5px}
  body.movil .dk-g.fu{min-height:70px} body.movil .dk-g.sp{min-height:52px} body.movil .dk-row{min-height:150px}
  body.movil .hud h2{font-size:15.5px} body.movil .hud .intro{font-size:11.8px;line-height:1.42}
  body.estrecho .hud{overflow-y:auto}
  body.estrecho .vbar [data-t="rot"],body.estrecho .vbar .sep.s1{display:none}
  body.estrecho.ancho .vbar{top:60px}
  body.movil .vbar{flex-wrap:nowrap;gap:3px;padding:3px 4px;top:54px} body.movil .vbar .sep{display:none} body.movil .vbar .b.sm{padding:5px 7px;font-size:11px}
  body.movil .vbar .lg{display:none}
  body.movil .tbar .lento{display:none}
  body.movil .hud{gap:6px;padding:10px 12px 9px} body.movil .hud .eyebrow{display:none}
  body.movil .modebar .b{padding:6px 4px 5px}
  body.movil .hmandos{display:grid;grid-template-columns:1.3fr 1fr;gap:6px 8px}
  body.movil .hmandos>:nth-child(1),body.movil .hmandos>:nth-child(2),body.movil .hmandos>.fila{grid-column:1/-1}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   LAB — CARGA INALÁMBRICA RESONANTE · SAE J2954 · 85 kHz
   (Autotrónica · mecanica-135)

   Dos almohadillas (pads) de espiral plana, cortadas por la mitad: la del
   suelo (GA) y la del coche (VA), con su ferrita, su blindaje y su cubierta.
   Abre funcionando, a cámara lenta ×1/100 000: los símbolos ⊙ y ⊗ de cada
   espira son la corriente (cambia de sentido a 85 kHz), las líneas son el
   campo magnético —integradas con RK4 sobre el campo REAL de las 36 espiras,
   Biot–Savart con integrales elípticas— y el coche está desviado a propósito:
   moverlo cambia k, y con él todo lo demás.

   La física (inductancia mutua por integral de Neumann y AGM, circuito
   serie–serie con compensación, rendimiento, división de frecuencia) está en
   un bloque puro que un script de Node extrae TAL CUAL y verifica.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO=' ';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }


/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos
   marcas— y lo prueba: lo que se prueba es lo que corre. */

/* FISICA:INICIO */
const MU0=4e-7*Math.PI, DOSPI=2*Math.PI, RAIZ2=Math.SQRT2;

/* ---------- 1.1 El banco ----------
   Dos almohadillas (pads) idénticas de espiral plana: 16 espiras de hilo Litz
   entre r = 80 y 250 mm. Se modelan EN AIRE y como filamentos circulares:
   cada espira es un lazo de corriente y todo (L, M, campo) sale de las
   integrales de Neumann y de Biot–Savart con integrales elípticas. La ferrita
   y el blindaje de aluminio no cambian L ni M (declarado en la ficha); sólo
   ponen pérdidas (Q_ap). El enlace es serie–serie a 85 kHz (SAE J2954). */
const BANDA={f0:85000,fMin:81380,fMax:90000};
const PAD={N:18,rIn:0.08,rOut:0.25,aHilo:0.0028,Acu:5e-6,rhoCu:1.99e-8,Fac:1.40,Qap:160};
const OPER={P:11000,I1max:50,I2max:50,Vdc:650,etaMin:0.90,pfMin:0.97,Rac:8/(Math.PI*Math.PI)};
OPER.V1max=4*OPER.Vdc/(Math.PI*RAIZ2);           // fundamental eficaz de un puente completo: 0,9·Vdc
const ZPAD=0.028;                                  // del plano de la bobina de una pad a la cara exterior de la otra: z = holgura + 0,028 m

/* ---------- 1.2 Integrales elípticas por la media aritmético-geométrica ----------
   K(m) = π / (2·AGM(1, √(1−m))),  E(m) = K·(1 − Σ 2^(n−1)·c_n²),  m = k².  */
function elipticas(m){
  let a=1,b=Math.sqrt(1-m),n=0,s=0.5*m;
  while(Math.abs(a-b)>1e-16*a&&n<40){ const an=(a+b)/2,bn=Math.sqrt(a*b),cn=(a-b)/2; a=an; b=bn; n++; s+=Math.pow(2,n-1)*cn*cn; }
  const K=Math.PI/(2*a); return {K,E:K*(1-s)};
}
/** Inductancia mutua de dos lazos circulares COAXIALES de radios a y b a distancia z (Maxwell). */
function mutuaCoaxial(a,b,z){
  const k2=4*a*b/((a+b)*(a+b)+z*z), k=Math.sqrt(k2), {K,E}=elipticas(k2);
  return MU0*Math.sqrt(a*b)*((2/k-k)*K-2/k*E);
}
/** Autoinductancia de un lazo de radio R y hilo de radio w (corriente uniforme en el hilo). */
function autoLazo(R,w){ return MU0*R*(Math.log(8*R/w)-1.75); }

/** Los radios de las N espiras de una pad (espiral plana, paso uniforme). */
function radiosPad(N=PAD.N,r0=PAD.rIn,r1=PAD.rOut){ const r=[]; for(let i=0;i<N;i++) r.push(r0+(r1-r0)*i/(N-1)); return r; }
const RAD=radiosPad();
/** L de una pad: Σ autoinductancias + Σ mutuas entre espiras (misma altura). */
function inductanciaPad(rad=RAD,w=PAD.aHilo){
  let L=0; for(let i=0;i<rad.length;i++){ L+=autoLazo(rad[i],w); for(let j=0;j<rad.length;j++) if(i!==j) L+=mutuaCoaxial(rad[i],rad[j],0); }
  return L;
}
/** M entre dos pads coaxiales a distancia z entre planos de bobina: Σ_ij M(a_i, b_j, z). */
function mutuaPadCoaxial(z,rad=RAD){ let M=0; for(const a of rad) for(const b of rad) M+=mutuaCoaxial(a,b,z); return M; }

/* ---------- 1.3 Desalineación: integral de Neumann ----------
   M = μ0/4π ∮∮ dl1·dl2 / |r1 − r2| con los ejes separados d. Con los lazos
   a, b en planos paralelos a distancia z:
     |r1 − r2|² = a² + b² + d² + z² − 2ab·cos(θ−φ) − 2d(a·cosθ − b·cosφ)
   y dl1·dl2 = ab·cos(θ−φ) dθ dφ. El integrando es periódico y liso (la
   distancia mínima es z > 0): la regla del trapecio converge de forma
   exponencial con pocos nodos. */
const N_NEU=36;
const _cs=(()=>{ const c=new Float64Array(N_NEU), s=new Float64Array(N_NEU); for(let i=0;i<N_NEU;i++){ c[i]=Math.cos(DOSPI*i/N_NEU); s[i]=Math.sin(DOSPI*i/N_NEU); } return {c,s}; })();
function mutuaNeumann(a,b,z,d,n=N_NEU){
  let C,S; if(n===N_NEU){ C=_cs.c; S=_cs.s; } else { C=new Float64Array(n); S=new Float64Array(n); for(let i=0;i<n;i++){ C[i]=Math.cos(DOSPI*i/n); S[i]=Math.sin(DOSPI*i/n); } }
  const base=a*a+b*b+d*d+z*z; let suma=0;
  for(let i=0;i<n;i++){ const ci=C[i], si=S[i];
    for(let j=0;j<n;j++){ const cj=C[j], sj=S[j], cd=ci*cj+si*sj;
      suma+=a*b*cd/Math.sqrt(base-2*a*b*cd-2*d*(a*ci-b*cj)); } }
  return MU0/(4*Math.PI)*suma*(DOSPI/n)*(DOSPI/n);
}
/** M entre las dos pads con desalineación lateral d y distancia z entre planos de bobina. */
function mutuaPad(z,d,rad=RAD,n=N_NEU){
  if(Math.abs(d)<1e-12) return mutuaPadCoaxial(z,rad);
  let M=0; for(const a of rad) for(const b of rad) M+=mutuaNeumann(a,b,z,d,n); return M;
}
const L_PAD=inductanciaPad();                       // la misma para las dos pads
const kAcople=(M,L1,L2)=>M/Math.sqrt(L1*L2);

/* ---------- 1.4 Resistencia y Q de una pad ----------
   R = R_Litz(longitud, sección, ρ(60 °C), F_ac) + R_ferrita/blindaje, esta
   última como ωL/Q_ap (hipótesis declarada: Q_ap = 400). */
const LONG_PAD=DOSPI*RAD.reduce((s,r)=>s+r,0);
function resistenciaPad(f=BANDA.f0,L=L_PAD){
  const Rcu=PAD.rhoCu*LONG_PAD/PAD.Acu*PAD.Fac, Rap=DOSPI*f*L/PAD.Qap; return {Rcu,Rap,R:Rcu+Rap};
}

/* ---------- 1.5 El circuito serie–serie ----------
   Lazo primario  : V1 = Z1·I1 + jωM·I2        Z1 = R1 + j(ωL1 − 1/ωC1)
   Lazo secundario: 0  = Z2·I2 + jωM·I1        Z2 = R2 + R_L + j(ωL2 − 1/ωC2)
   ⇒ I2 = −jωM·I1/Z2 y Z_in = Z1 + ω²M²/Z2. Números complejos como [re, im]. */
const cx={ mul:(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]], div:(a,b)=>{ const d=b[0]*b[0]+b[1]*b[1]; return [(a[0]*b[0]+a[1]*b[1])/d,(a[1]*b[0]-a[0]*b[1])/d]; },
  abs:a=>Math.hypot(a[0],a[1]), arg:a=>Math.atan2(a[1],a[0]), cj:a=>[a[0],-a[1]] };

/** El estado de la práctica y todo lo que se deriva de él (sin tocar el DOM).
 *  s = { z (m, entre planos de bobina), d (m), trim (fracción de C2), eps (desviación oculta de L2),
 *        RL (Ω), f (Hz), falla: null | 'fod' | 'c1' | 'freq' }                                                  */
const FALLAS={ fod:{R:0.55}, c1:{k:0.82}, freq:{f:96000} };
function banco(s){
  const falla=s.falla||null;
  const f=falla==='freq'?FALLAS.freq.f:(s.f||BANDA.f0), w=DOSPI*f, w0=DOSPI*BANDA.f0;
  const L1=L_PAD, L2=L_PAD*(1+(s.eps||0));
  // la compensación se calcula para las bobinas NOMINALES a 85 kHz; C2 lleva el ajuste fino del alumno
  const C1=1/(w0*w0*L_PAD)*(falla==='c1'?FALLAS.c1.k:1), C2=1/(w0*w0*L_PAD)*(1+(s.trim||0));
  const r=resistenciaPad(BANDA.f0,L_PAD), Rf=falla==='fod'?FALLAS.fod.R:0;
  const R1=r.R+Rf, R2=r.R+Rf*0.6, M=s.M!==undefined?s.M:mutuaPad(s.z,s.d||0);
  return {s,f,w,L1,L2,C1,C2,R1,R2,Rcu:r.Rcu,Rap:r.Rap,Rf,M,k:kAcople(M,L1,L2),RL:s.RL};
}
/** Respuesta con V1 = 1 V (eficaz, fase 0) a la frecuencia f del banco. */
function respuesta(B,f=B.f){
  const w=DOSPI*f, X1=w*B.L1-1/(w*B.C1), X2=w*B.L2-1/(w*B.C2), wM=w*B.M;
  const Z1=[B.R1,X1], Z2=[B.R2+B.RL,X2];
  const Zr=cx.div([wM*wM,0],Z2), Zin=[Z1[0]+Zr[0],Z1[1]+Zr[1]];
  const I1=cx.div([1,0],Zin), I2=cx.div(cx.mul([0,-wM],I1),Z2);
  const PL=cx.abs(I2)**2*B.RL, Pin=I1[0], P1=cx.abs(I1)**2*B.R1, P2=cx.abs(I2)**2*B.R2;
  return {w,wM,Z1,Z2,Zin,I1,I2,PL,Pin,P1,P2,eta:Pin>0?PL/Pin:0,pf:Pin/Math.hypot(1,0)/cx.abs(I1)};
}
/** Punto de trabajo: la potencia de la práctica (11 kW) si los límites de corriente y de tensión lo permiten;
 *  si no, la máxima que dejan pasar. Devuelve las fasores ESCALADAS a esa potencia (eficaces). */
function operacion(B,Pobj=OPER.P){
  const r=respuesta(B), s11=Math.sqrt(Pobj/r.PL);           // escala de V1 para llegar a Pobj
  const sI1=OPER.I1max/cx.abs(r.I1), sI2=OPER.I2max/cx.abs(r.I2), sV=OPER.V1max;
  const sMax=Math.min(sI1,sI2,sV), limita=sMax===sV?'V1':(sMax===sI1?'I1':'I2');
  const Pmax=sMax*sMax*r.PL, s=Math.min(s11,sMax);
  const I1=[r.I1[0]*s,r.I1[1]*s], I2=[r.I2[0]*s,r.I2[1]*s];
  const P=s*s*r.PL, Pin=s*s*r.Pin;
  return {r,s,V1:s,I1,I2,aI1:cx.abs(I1),aI2:cx.abs(I2),P,Pin,Pmax,limita,llega:Pmax>=Pobj*(1-1e-9),
    eta:r.eta,pf:r.pf,S:s*cx.abs(I1),Qr:-s*s*r.I1[1],
    P1:s*s*r.P1,P2:s*s*r.P2,Pf:B.Rf>0?s*s*(cx.abs(r.I1)**2*B.Rf+cx.abs(r.I2)**2*B.Rf*0.6):0,
    fi1:cx.arg(I1),fi2:cx.arg(I2)};
}
/** Los criterios del pliego del reto, medidos en el punto de trabajo. */
function pliego(B,op=operacion(B)){
  return [
    {id:'eta',ok:op.eta>=OPER.etaMin,v:op.eta},
    {id:'P',ok:op.llega,v:op.Pmax},
    {id:'I',ok:op.aI1<=OPER.I1max*(1+1e-9)&&op.aI2<=OPER.I2max*(1+1e-9),v:Math.max(op.aI1,op.aI2)},
    {id:'V',ok:op.V1<=OPER.V1max*(1+1e-9),v:op.V1},
    {id:'pf',ok:op.pf>=OPER.pfMin,v:op.pf},
  ];
}
const cumple=(B)=>{ const op=operacion(B); return pliego(B,op).every(c=>c.ok); };

/* ---------- 1.5b Los escenarios del reto ----------
   Cada intento sortea una holgura (clase Z1–Z2 de J2954), la tensión del pack
   (que fija la carga que ve la bobina: R_L = (8/π²)·V²/P) y una desviación
   OCULTA de la inductancia de la bobina del vehículo (el piso metálico y la
   ferrita la mueven): el alumno la descubre midiendo, no leyéndola. */
const ESCENARIOS=[];
for(const g of [0.12,0.14,0.16]) for(const Vpack of [350,400,450])
  ESCENARIOS.push({g,Vpack,epsOpciones:[-0.12,-0.09,-0.06,0.06,0.09,0.12],d0Opciones:[0.18,0.21,0.24]});
const cargaDePack=(Vpack,P=OPER.P)=>OPER.Rac*Vpack*Vpack/P;

/** Tabla de M(d) a una holgura dada (para las curvas del dock sin integrar de nuevo en cada cuadro). */
function tablaM(z,dMax=0.25,paso=0.005){
  const n=Math.round(dMax/paso)+1, d=new Float64Array(n), M=new Float64Array(n);
  for(let i=0;i<n;i++){ d[i]=i*paso; M[i]=mutuaPad(z,d[i]); } return {z,d,M,paso};
}
/** El enlace a lo largo de la tabla: η, potencia máxima que dejan pasar los límites y si cumple el pliego. */
function curvaDesalineacion(s,T){
  const out=[]; for(let i=0;i<T.d.length;i++){ const B=banco(Object.assign({},s,{d:T.d[i],M:T.M[i]})), op=operacion(B);
    out.push({d:T.d[i],M:T.M[i],k:B.k,eta:op.eta,Pmax:op.Pmax,llega:op.llega,pf:op.pf,ok:pliego(B,op).every(c=>c.ok)}); }
  return out;
}

/* ---------- 1.6 Formas cerradas de referencia ---------- */
/** Rendimiento máximo (carga óptima) de un enlace serie–serie: η = k²Q1Q2 / (1 + √(1 + k²Q1Q2))². */
const etaOptima=(k,Q1,Q2)=>{ const x=k*k*Q1*Q2; return x/((1+Math.sqrt(1+x))**2); };
/** La carga que lo consigue: R_L,opt = R2·√(1 + k²Q1Q2). */
const RLoptima=(k,Q1,Q2,R2)=>R2*Math.sqrt(1+k*k*Q1*Q2);
/** Rendimiento de un enlace serie–serie sintonizado (resonancia exacta en los dos lazos) con carga RL. */
const etaSintonizada=(wM,R1,R2,RL)=>wM*wM*RL/((R2+RL)*(R1*(R2+RL)+wM*wM));
/** Acoplamiento crítico (el que da la máxima potencia exactamente a f0): k_c = 1/√(Q1·Q2c), con Q2c = ωL2/(R2+R_L). */
const kCritico=(Q1,Q2c)=>1/Math.sqrt(Q1*Q2c);
/** Acoplamiento a partir del cual la potencia a tensión constante se DIVIDE en dos picos: ωM > √((R1² + R2c²)/2),
 *  con R2c = R2 + R_L (con R1 = R2c coincide con k_c). Aproximación de banda estrecha (Q ≫ 1). */
const kDivision=(B)=>Math.sqrt((B.R1*B.R1+(B.R2+B.RL)*(B.R2+B.RL))/2)/(B.w*Math.sqrt(B.L1*B.L2));
/** El mismo umbral, sin la aproximación de banda estrecha: bisección sobre el NÚMERO de picos de la potencia a V1 constante
 *  al variar k (con las demás cosas del banco fijas). Devuelve Infinity si ni con k = 0,4 se divide. */
function kDivisionExacta(B){
  const dos=(k)=>picosFrecuencia(Object.assign({},B,{M:k*Math.sqrt(B.L1*B.L2)}),55000,125000,700).length>=2;
  let lo=0.01, hi=0.4; if(!dos(hi)) return Infinity; if(dos(lo)) return lo;
  for(let i=0;i<22;i++){ const m=(lo+hi)/2; if(dos(m)) hi=m; else lo=m; }
  return (lo+hi)/2;
}
/** Barrido en frecuencia a V1 constante (1 V): potencia en la carga y rendimiento. */
function barridoFrecuencia(B,f0,f1,n){
  const out=[]; for(let i=0;i<n;i++){ const f=f0+(f1-f0)*i/(n-1), r=respuesta(B,f); out.push({f,PL:r.PL,eta:r.eta,pf:r.pf}); } return out;
}
/** Picos de la potencia en la carga (V1 constante): su posición se refina con la razón áurea. */
function picosFrecuencia(B,f0=60000,f1=120000,n=1200){
  const v=barridoFrecuencia(B,f0,f1,n), pk=[];
  for(let i=1;i<n-1;i++) if(v[i].PL>v[i-1].PL&&v[i].PL>=v[i+1].PL){
    let a=v[i-1].f,b=v[i+1].f; const g=(Math.sqrt(5)-1)/2;
    for(let it=0;it<60;it++){ const c=b-g*(b-a), d=a+g*(b-a); if(respuesta(B,c).PL>respuesta(B,d).PL) b=d; else a=c; }
    const fm=(a+b)/2; pk.push({f:fm,PL:respuesta(B,fm).PL}); }
  return pk;
}

/* ---------- 1.7 El campo magnético de un lazo (Biot–Savart, integrales elípticas) ----------
   En coordenadas cilíndricas (ρ, z) respecto del plano del lazo (radio a, corriente I):
     Bz = μ0·I/(2π) · 1/√((a+ρ)²+z²) · [ K + (a²−ρ²−z²)/((a−ρ)²+z²) · E ]
     Bρ = μ0·I/(2π) · z/(ρ·√((a+ρ)²+z²)) · [ −K + (a²+ρ²+z²)/((a−ρ)²+z²) · E ]
   con m = 4aρ/((a+ρ)²+z²). Un radio de núcleo `rc` evita la singularidad sobre el hilo. */
function campoLazo(a,rho,z,rc=0.0025){
  const ar=Math.abs(rho), s2=(a+ar)*(a+ar)+z*z, d2=(a-ar)*(a-ar)+z*z+rc*rc, m=Math.min(4*a*ar/(s2+1e-30),1-1e-12);
  const {K,E}=elipticas(m), c=MU0/(DOSPI), sq=Math.sqrt(s2);
  const Bz=c/sq*(K+(a*a-ar*ar-z*z)/d2*E);
  let Br; if(ar<1e-7*a) Br=0; else Br=c*z/(ar*sq)*(-K+(a*a+ar*ar+z*z)/d2*E);
  return [rho<0?-Br:Br,Bz];                    // [B_ρ con el signo de ρ, B_z] por amperio·vuelta
}
/** El campo de TODA una pad (Σ espiras, 1 A) en el punto (x, y) del plano del corte, con la pad en (x0, y0). */
function campoPad(x,y,x0,y0,rad=RAD){
  let bx=0,by=0; for(const a of rad){ const b=campoLazo(a,x-x0,y-y0); bx+=b[0]; by+=b[1]; } return [bx,by];
}

/* ===================== 4. TEXTURAS Y MATERIALES =====================
   PBR con entorno. Nada de poro ni grano fino —se lee como lija sobre caras
   grandes—: variaciones lentas de rugosidad (la piel de fundición de §21) y,
   donde la pieza lo pide, su dibujo: la serigrafía de la placa. */
const DOSPI_=Math.PI*2;
function normalDeAltura(W,H,h,fuerza){
  const c=cv(W,H),x=c.getContext('2d'),im=x.createImageData(W,H);
  const A=(i,j)=>h((i+W)%W,(j+H)%H);
  for(let j=0;j<H;j++) for(let i=0;i<W;i++){
    const dx=(A(i+1,j)-A(i-1,j))*fuerza, dy=(A(i,j+1)-A(i,j-1))*fuerza, L=Math.hypot(dx,dy,1), o=(j*W+i)*4;
    im.data[o]=(-dx/L*0.5+0.5)*255; im.data[o+1]=(-dy/L*0.5+0.5)*255; im.data[o+2]=(1/L*0.5+0.5)*255; im.data[o+3]=255; }
  x.putImageData(im,0,0); return c;
}
function ruidoPeriodico(semilla,periodo){
  const g=(x,y)=>{ x=((x%periodo)+periodo)%periodo; y=((y%periodo)+periodo)%periodo;
    const s=Math.sin(x*127.1+y*311.7+semilla*13.13)*43758.5453; return s-Math.floor(s); };
  return (x,y)=>{ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    return g(xi,yi)*(1-u)*(1-v)+g(xi+1,yi)*u*(1-v)+g(xi,yi+1)*(1-u)*v+g(xi+1,yi+1)*u*v; };
}
function fbmP(semilla,periodo,oct){ const ns=[]; for(let o=0;o<oct;o++) ns.push(ruidoPeriodico(semilla+o*7,periodo*(1<<o)));
  return (x,y)=>{ let v=0,a=0.5; for(let o=0;o<oct;o++){ v+=ns[o](x*(1<<o),y*(1<<o))*a; a*=0.5; } return v; }; }
function pielLenta(semilla,{px=256,celdas=4,oct=3,rug0=0.45,rugA=0.08,relieve=0.5}={}){
  const f=fbmP(semilla,celdas,oct), k=celdas/px;
  const c=cv(px), x=c.getContext('2d'), im=x.createImageData(px,px);
  for(let j=0;j<px;j++) for(let i=0;i<px;i++){ const v=clamp(rug0+(f(i*k,j*k)-0.5)*2*rugA,0,1)*255, o=(j*px+i)*4;
    im.data[o]=im.data[o+1]=im.data[o+2]=v; im.data[o+3]=255; }
  x.putImageData(im,0,0);
  return {r:tex(c),n:tex(normalDeAltura(px,px,(i,j)=>f(i*k,j*k),relieve))};
}

/* EL CORTE. Toda la exposición se secciona por el plano z = 0 y se conserva la
   mitad de atrás. Las caras de sección no son geometría: cada pieza es un
   sólido cerrado y, donde el plano la abre, lo que se ve por el hueco son sus
   caras de ATRÁS. Ésas se pintan como la cara de corte de un plano de taller:
   el punto se lleva por el rayo de la cámara hasta el plano y allí se dibuja
   el patrón de la pieza —rayado a ±45° en lo macizo, anillos en las bobinas de
   película del condensador, hilos en el cobre de las ranuras— iluminado como
   una cara plana que mira a +Z. El cobre de las ranuras conserva su brillo en
   la sección: es la corriente que lo recorre. */
const PLANO=new THREE.Plane(new THREE.Vector3(0,0,-1),0);
const PASO_G={value:0.0028};
const LUCES_CORTE=THREE.ShaderChunk.lights_fragment_begin.replaceAll('receiveShadow','(receiveShadow&&gl_FrontFacing)');
function corte(m,o={}){
  m.side=THREE.DoubleSide; m.clippingPlanes=[PLANO]; m.clipShadows=true;
  const pat=o.patron==='anillos'?1:(o.patron==='hilos'?2:0);
  const U={cFondo:{value:new THREE.Color(o.fondo||'#8a9096')},cLinea:{value:new THREE.Color(o.linea||'#5d636a')},
    cSent:{value:o.sentido||1},cPaso:{value:o.paso||1},cPasoG:PASO_G,cRay:{value:o.rayado===false?0:1},cRug:{value:o.rug??0.64},
    cPat:{value:pat},cCentro:{value:new THREE.Vector2(...(o.centro||[0,0]))},cBrillo:{value:o.brillo?1:0}};
  m.userData.cap=U;
  m.onBeforeCompile=(sh)=>{
    Object.assign(sh.uniforms,U);
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vMundoC;')
      .replace('#include <fog_vertex>','#include <fog_vertex>\n{ vec4 wc=vec4(transformed,1.0);\n#ifdef USE_INSTANCING\n wc=instanceMatrix*wc;\n#endif\n vMundoC=(modelMatrix*wc).xyz; }');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vMundoC;\nfloat cLnG=0.0;\nuniform vec3 cFondo; uniform vec3 cLinea; uniform float cSent; uniform float cPaso; uniform float cPasoG; uniform float cRay; uniform float cRug; uniform float cPat; uniform vec2 cCentro; uniform float cBrillo;')
      .replace('#include <normal_fragment_maps>',`#include <normal_fragment_maps>
      if(!gl_FrontFacing){
        vec3 dC=vMundoC-cameraPosition;
        float tC=clamp(-cameraPosition.z/(dC.z<-1e-5?dC.z:-1e-5),0.0,1.0);
        vec3 pC=cameraPosition+dC*tC;
        if(cRay>0.5){
          float ln=0.0;
          if(cPat<0.5){
            float uu=(pC.x*cSent+pC.y)*0.70710678/(cPaso*cPasoG);
            float fw=clamp(fwidth(uu),0.0,0.5);
            float dl=0.5-abs(fract(uu)-0.5);
            ln=(1.0-smoothstep(0.12-fw,0.12+fw,dl))*(1.0-smoothstep(0.25,0.5,fw));
          } else if(cPat<1.5){
            float uu=length(pC.xy-cCentro)/(cPaso*0.0011);
            float fw=clamp(fwidth(uu),0.0,0.5);
            float dl=0.5-abs(fract(uu)-0.5);
            ln=(1.0-smoothstep(0.16-fw,0.16+fw,dl))*(1.0-smoothstep(0.25,0.5,fw));
          } else {
            vec2 q=pC.xy/(cPaso*0.0016); q.y*=1.1547; q.x+=0.5*mod(floor(q.y),2.0);
            vec2 f=fract(q)-0.5; f.y/=1.1547; float r=length(f);
            float fw=clamp(fwidth(r)*1.5,0.0,0.5);
            ln=smoothstep(0.38-fw,0.38+fw,r)*(1.0-smoothstep(0.18,0.35,fw));
          }
          diffuseColor.rgb=mix(cFondo,cLinea,ln*0.9);
          metalnessFactor=0.12; cLnG=ln;
        }
        roughnessFactor=cRug;
        normal=normalize((viewMatrix*vec4(0.0,0.0,1.0,0.0)).xyz);
      }`)
      .replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\nif(!gl_FrontFacing) totalEmissiveRadiance*=cBrillo*(1.0-0.8*cLnG);')
      .replace('#include <lights_physical_fragment>','#include <lights_physical_fragment>\n#ifdef USE_CLEARCOAT\nif(!gl_FrontFacing) material.clearcoat=0.0;\n#endif\n#ifdef USE_SHEEN\nif(!gl_FrontFacing) material.sheenColor=vec3(0.0);\n#endif')
      .replace('#include <lights_fragment_begin>',LUCES_CORTE);
  };
  m.customProgramCacheKey=()=>'corte'+pat+(o.brillo?'b':'');
  return m;
}

/* ===================== 5. GEOMETRÍA =====================
   `torno` revoluciona un perfil cerrado (a, r) alrededor del eje X con
   normales ANALÍTICAS: ninguna sale nula y las aristas vivas no se
   redondean. `prisma` extruye a lo largo de Z un contorno con sus huecos, con
   normales suaves en las curvas y vivas en las esquinas: así se hacen las
   chapas del estátor y del rotor, que el corte enseña de frente. */
const DOSPI3=Math.PI*2;
function preparaPerfil(perfil){
  let P=[];
  for(const p of perfil){ const q=[p[0],Math.max(0,p[1])], u=P[P.length-1]; if(!u||Math.hypot(u[0]-q[0],u[1]-q[1])>1e-9) P.push(q); }
  while(P.length>2&&Math.hypot(P[0][0]-P[P.length-1][0],P[0][1]-P[P.length-1][1])<1e-9) P.pop();

function torno(perfil,o={}){

    const tri=THREE.ShapeUtils.triangulateShape(P.map(([a,r])=>new THREE.Vector2(a,r)),[]);

const tornoY=(perfil,o)=>torno(perfil,o).rotateZ(Math.PI/2);     // eje +Y (a → y)
const tornoZ=(perfil,o)=>torno(perfil,o).rotateY(-Math.PI/2);    // eje +Z (a → z)
function areaDe(P){ let a=0; for(let i=0;i<P.length;i++){ const p=P[i],q=P[(i+1)%P.length]; a+=p[0]*q[1]-q[0]*p[1]; } return a/2; }

 *  huecos. Paredes con normales hacia fuera del sólido, suaves si el giro
 *  entre dos lados es menor que `canto`, y las dos tapas. */
function prisma(lazos,z0,z1,o={}){
  const {canto=28,uEsc=1}=o, cc=Math.cos(canto*Math.PI/180);
  const L=lazos.map((l,i)=>{ const p=l.slice(); const a=areaDe(p); if((i===0&&a<0)||(i>0&&a>0)) p.reverse(); return p; });
  const pos=[],nor=[],uv=[],idx=[];
  for(const P of L){
    const n=P.length, EN=[];
    for(let i=0;i<n;i++){ const a=P[i],b=P[(i+1)%n], tx=b[0]-a[0], ty=b[1]-a[1], l=Math.hypot(tx,ty)||1e-12; EN.push([ty/l,-tx/l,l]); }
    const med=(u,w)=>{ const x=u[0]+w[0], y=u[1]+w[1], l=Math.hypot(x,y)||1; return [x/l,y/l]; };
    let s=0;
    for(let i=0;i<n;i++){
      const a=P[i],b=P[(i+1)%n],e=EN[i],ea=EN[(i-1+n)%n],ed=EN[(i+1)%n];
      if(e[2]<1e-10) continue;
      const na=(ea[0]*e[0]+ea[1]*e[1])>cc?med(ea,e):e, nb=(e[0]*ed[0]+e[1]*ed[1])>cc?med(e,ed):e;
      const o0=pos.length/3;

      nor.push(na[0],na[1],0, nb[0],nb[1],0, nb[0],nb[1],0, na[0],na[1],0);
      uv.push(s*uEsc,z1*uEsc, (s+e[2])*uEsc,z1*uEsc, (s+e[2])*uEsc,z0*uEsc, s*uEsc,z0*uEsc); s+=e[2];
      idx.push(o0,o0+2,o0+1, o0,o0+3,o0+2);

  const tri=THREE.ShapeUtils.triangulateShape(c,H), todos=c.concat(...H);

    const o0=pos.length/3, i0=idx.length;
    for(const p of todos){ pos.push(p.x,p.y,z); nor.push(0,0,nz); uv.push(p.x*uEsc,p.y*uEsc); }
    for(const t of tri) idx.push(o0+t[0],o0+t[1],o0+t[2]);

/** Un rectángulo de esquinas redondeadas como contorno [x,y]. */

/** Un sólido «hueco»: la misma malla con las normales y el sentido al revés.
 *  Metido dentro de otro sólido es una CAVIDAD: por el corte se ve su pared. */
function invierte(g){
  const n=g.attributes.normal; for(let i=0;i<n.count;i++) n.setXYZ(i,-n.getX(i),-n.getY(i),-n.getZ(i));
  if(g.index){ const ix=g.index; for(let i=0;i<ix.count;i+=3){ const t=ix.getX(i+1); ix.setX(i+1,ix.getX(i+2)); ix.setX(i+2,t); } }
  else { for(const k of Object.keys(g.attributes)){ const a=g.attributes[k], s=a.itemSize;
    for(let i=0;i<a.count;i+=3) for(let c=0;c<s;c++){ const t=a.array[(i+1)*s+c]; a.array[(i+1)*s+c]=a.array[(i+2)*s+c]; a.array[(i+2)*s+c]=t; } } }

/* ---------- 6.1 Una pad ----------

function creaPad(matLitz,nombre){
  const G=new THREE.Group(); G.name=nombre;

/* ---------- 6.5 Símbolos ⊙ / ⊗ de la corriente en cada espira ----------
   Un plano diminuto sobre la cara de corte de cada espira (x = ±r). Corriente
   positiva = sentido antihorario visto desde arriba: sale hacia el lector por
   la izquierda (⊙) y entra por la derecha (⊗). El color dice el sentido y el
   brillo, cuánta corriente lleva AHORA (el mismo reloj que el dock). */
const MARCAS=[];
function creaMarcas(padre,yLocal,flip){
  const n=RAD.length*2, geo=new THREE.PlaneGeometry(1,1), side=new Float32Array(n), esc=new Float32Array(n);
  const inst=new THREE.InstancedMesh(geo,null,n); inst.frustumCulled=false;
  const m4=new THREE.Matrix4();
  for(let i=0;i<RAD.length;i++) for(let s=0;s<2;s++){ const k=i*2+s, sg=s?1:-1; side[k]=sg; esc[k]=0.0082;
    m4.compose(V3(sg*RAD[i],yLocal,0.0016),new THREE.Quaternion(),V3(0.0082,0.0082,1)); inst.setMatrixAt(k,m4); }
  geo.setAttribute('aSide',new THREE.InstancedBufferAttribute(side,1));
  const mat=new THREE.ShaderMaterial({
    uniforms:{uI:{value:0},uMax:{value:1}},
    vertexShader:`attribute float aSide; varying vec2 vUv; varying float vSide; void main(){ vUv=uv; vSide=aSide; gl_Position=projectionMatrix*modelViewMatrix*instanceMatrix*vec4(position,1.0); }`,
    fragmentShader:`uniform float uI; uniform float uMax; varying vec2 vUv; varying float vSide;
      void main(){ vec2 p=(vUv-0.5)*2.0; float r=length(p);
        float out_=-uI*vSide;                       // >0: sale hacia el lector (⊙)
        float a=abs(uI)/uMax;
        float anillo=smoothstep(1.0,0.86,r)*smoothstep(0.62,0.76,r);
        float punto=smoothstep(0.34,0.24,r);
        float cruz=smoothstep(0.17,0.09,min(abs(p.x-p.y),abs(p.x+p.y))*0.7071)*smoothstep(0.80,0.62,r);
        float f=anillo+(out_>0.0?punto:cruz);
        vec3 c=out_>0.0?vec3(1.0,0.55,0.18):vec3(0.25,0.85,1.0);
        float al=clamp(f,0.0,1.0)*clamp(0.12+1.6*a,0.0,1.0); if(al<0.01) discard;
        gl_FragColor=vec4(c*(1.0+1.6*a),al); }`,
    transparent:true,depthWrite:false,depthTest:true,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
  inst.material=mat; inst.renderOrder=5; inst.raycast=()=>{}; padre.add(inst); MARCAS.push(mat);

/* Zonas macizas, en el marco del mundo: sirven para cortar las líneas de campo donde entran en una pieza. */
const GEO={g:0.16,x:0.18};                                    // holgura y desalineación actuales (las mueve el modelo)
const yB=()=>H_PAD+GEO.g;                                     // cara inferior de la pad del vehículo
function enSolido(x,y){
  if(y<0) return true;
  if(Math.abs(x)<SEMI&&y<H_PAD) return true;
  const xv=x-GEO.x, yb=yB();
  if(Math.abs(xv)<SEMI&&y>yb&&y<yb+H_PAD) return true;
  if(y>yb+H_PAD&&Math.abs(xv)<1.12) return true;
  return false;
}


/* ===================== 7. EL ESTADO Y EL MODELO =====================
   Un solo estado (EST): lo que el alumno mueve. De él sale, una vez por
   cambio, el modelo completo (inductancia mutua, circuito, pliego, curvas).
   Y de ese modelo salen —en cada cuadro, con el MISMO reloj— las corrientes
   instantáneas que encienden las espiras, los símbolos ⊙/⊗, el campo y las
   gráficas del dock. */
const RL_400=cargaDePack(400);
const EST={modo:'marcha',x:0.12,g:0.14,trim:0,RL:RL_400,f:BANDA.f0,eps:0,falla:null,esc:1e-5,escMano:false,pausa:REDUCIDO,autoRunning:false,corte:true};
const SIMU={t:0.00031,B:null,op:null,pl:null,s:null,curvaD:null,fr:null,picos:null,clave:'',tablas:new Map(),tCalc:0,tPesado:0,pendiente:false,Tobj:25,fase:0,i1:0,i2:0,v1:0,Q1:0,Q2:0,kd:1};

function claveEst(){ return [EST.x.toFixed(5),EST.g.toFixed(5),EST.trim.toFixed(4),EST.RL.toFixed(3),EST.f,EST.eps,EST.falla].join('|'); }
/** Recalcula el modelo si algo cambió. Lo barato (M, circuito, pliego) siempre; lo caro (la tabla de M(d) a la holgura

function recalcula(forzar){
  const k=claveEst(); const cambio=k!==SIMU.clave;
  if(cambio){
    SIMU.clave=k; const t0=performance.now();
    const z=EST.g+ZPAD, d=Math.abs(EST.x);
    SIMU.s={z,d,trim:EST.trim,eps:EST.eps,RL:EST.RL,f:EST.f,falla:EST.falla};
    const B=banco(SIMU.s), op=operacion(B);
    SIMU.B=B; SIMU.op=op; SIMU.pl=pliego(B,op); SIMU.Q1=B.w*B.L1/B.R1; SIMU.Q2=B.w*B.L2/B.R2;
    SIMU.pendiente=true; SIMU.tCalc=performance.now()-t0;
  }
  if(SIMU.pendiente&&(forzar||!SIMU.curvaD||performance.now()-SIMU.tPesado>140)){
    const t0=performance.now(); SIMU.pendiente=false; SIMU.tPesado=performance.now();
    const s=SIMU.s, B=SIMU.B, op=SIMU.op, kz=s.z.toFixed(4); let T=SIMU.tablas.get(kz);
    if(!T){ T=tablaM(s.z); SIMU.tablas.set(kz,T); if(SIMU.tablas.size>10) SIMU.tablas.delete(SIMU.tablas.keys().next().value); }
    SIMU.curvaD=curvaDesalineacion(s,T);
    // respuesta en frecuencia a V1 constante (la del punto de trabajo): potencia en la carga y rendimiento
    const barrido=barridoFrecuencia(B,66000,106000,161), V2=op.V1*op.V1;
    SIMU.fr=barrido.map(p=>({f:p.f,P:p.PL*V2,eta:p.eta,pf:p.pf}));
    SIMU.picos=picosFrecuencia(B).map(p=>({f:p.f,P:p.PL*V2})); SIMU.kd=kDivisionExacta(B);
    SIMU.tCalc+=performance.now()-t0;

}

/* Las corrientes de ESTE instante: la tensión del inversor es la referencia (fase 0). */
function instante(){
  const op=SIMU.op; if(!op){ SIMU.i1=SIMU.i2=SIMU.v1=0; return; }
  const th=DOSPI*SIMU.B.f*SIMU.t; SIMU.fase=th;
  SIMU.i1=RAIZ2*op.aI1*Math.cos(th+op.fi1); SIMU.i2=RAIZ2*op.aI2*Math.cos(th+op.fi2); SIMU.v1=RAIZ2*op.V1*Math.cos(th);

/* ===================== 8. EL CAMPO MAGNÉTICO =====================
   Cada pad es una suma de 18 lazos: su campo (Bx, By por amperio) se calcula
   UNA vez con las integrales elípticas del bloque de física en una malla local
   (la pad es simétrica de revolución: basta el semiplano x ≥ 0). El campo del
   instante es B = i1(t)·B_pad(r − r_GA) + i2(t)·B_pad(r − r_VA): la
   superposición de las dos pads con sus corrientes de ESTE instante. */
const BG={dx:0.01,nx:151,y0:-0.30,dy:0.005,ny:171,BX:null,BY:null};
(function(){
  const {nx,ny,dx,dy,y0}=BG, BX=new Float32Array(nx*ny), BY=new Float32Array(nx*ny);
  for(let i=0;i<nx;i++) for(let j=0;j<ny;j++){ const b=campoPad(i*dx,y0+j*dy,0,0); BX[i*ny+j]=b[0]; BY[i*ny+j]=b[1]; }
  BG.BX=BX; BG.BY=BY;
})();
/** Campo de UNA pad (por amperio) en el punto local (xl, yl) respecto de su eje y del plano de su bobina. */
function campoBase(xl,yl,out){
  let sx=1; if(xl<0){ xl=-xl; sx=-1; }
  const fx=xl/BG.dx, fy=(yl-BG.y0)/BG.dy;
  if(fx>=BG.nx-1||fy<0||fy>=BG.ny-1){ out[0]=0; out[1]=0; return; }
  const i=fx|0, j=fy|0, u=fx-i, v=fy-j, n=BG.ny, a=i*n+j, b=a+n, BX=BG.BX, BY=BG.BY;
  const w00=(1-u)*(1-v), w10=u*(1-v), w01=(1-u)*v, w11=u*v;
  out[0]=sx*(BX[a]*w00+BX[b]*w10+BX[a+1]*w01+BX[b+1]*w11);
  out[1]=BY[a]*w00+BY[b]*w10+BY[a+1]*w01+BY[b+1]*w11;
}
const _t1=[0,0], _t2=[0,0];
const CAMPO={a1:0,a2:0,xv:0,yc2:0,ref:1};
function Bmundo(x,y,out){
  campoBase(x,y-YC,_t1); campoBase(x-CAMPO.xv,y-CAMPO.yc2,_t2);
  out[0]=CAMPO.a1*_t1[0]+CAMPO.a2*_t2[0]; out[1]=CAMPO.a1*_t1[1]+CAMPO.a2*_t2[1];
}
const _b=[0,0];
/** Un paso RK4 sobre la dirección del campo (normalizada), sentido ±1. Devuelve false si el campo es nulo. */
function pasoRK4(p,h,sg){
  const dir=(x,y,o)=>{ Bmundo(x,y,_b); const m=Math.hypot(_b[0],_b[1]); if(m<1e-14){ o[0]=o[1]=0; return false; } o[0]=sg*_b[0]/m; o[1]=sg*_b[1]/m; return true; };
  const k1=[0,0],k2=[0,0],k3=[0,0],k4=[0,0];
  if(!dir(p[0],p[1],k1)) return false;
  dir(p[0]+h/2*k1[0],p[1]+h/2*k1[1],k2); dir(p[0]+h/2*k2[0],p[1]+h/2*k2[1],k3); dir(p[0]+h*k3[0],p[1]+h*k3[1],k4);
  p[0]+=h/6*(k1[0]+2*k2[0]+2*k3[0]+k4[0]); p[1]+=h/6*(k1[1]+2*k2[1]+2*k3[1]+k4[1]);
  return true;
}
/* Las líneas: semillas en el plano medio de la holgura, repartidas más densas junto al eje. Cada línea se traza
   en los dos sentidos hasta que entra en una pieza maciza o sale del cuadro. */
const SEMILLAS_X=(()=>{ const a=[0]; for(let k=0;k<9;k++){ const x=0.030+0.034*k; a.push(x,-x); } for(const x of [0.34,0.40,0.47,0.55,0.64]) a.push(x,-x); return a; })();
const N_LIN=SEMILLAS_X.length, MAX_PT=330, PASO=0.0055;
const LIN=SEMILLAS_X.map(()=>({n:0,x:new Float32Array(MAX_PT),y:new Float32Array(MAX_PT),s:new Float32Array(MAX_PT),len:0,bs:0,u:new Float32Array(7)}));
LIN.forEach(l=>{ for(let i=0;i<7;i++) l.u[i]=(i+Math.random()*0.8)/7; });
const _p=[0,0], _tmp=[];
function trazaLinea(L,x0,y0){
  Bmundo(x0,y0,_b); const m0=Math.hypot(_b[0],_b[1]);
  L.n=0; L.bs=m0; if(m0<CAMPO.ref*0.015){ return; }
  const up=_b[1]>=0?1:-1;                                  // «hacia arriba» en la semilla: así todas las líneas tienen el mismo sentido de recorrido
  const mitad=(sg)=>{ const q=[]; _p[0]=x0; _p[1]=y0;
    for(let i=0;i<(MAX_PT>>1)-2;i++){ if(!pasoRK4(_p,PASO,sg)) break; if(enSolido(_p[0],_p[1])||Math.abs(_p[0])>1.28||_p[1]>0.66) break; q.push(_p[0],_p[1]); }
    return q; };
  const f=mitad(up), a=mitad(-up);                         // adelante (hacia arriba en la semilla) y atrás
  let n=0;
  for(let i=a.length/2-1;i>=0;i--){ L.x[n]=a[2*i]; L.y[n]=a[2*i+1]; n++; }
  L.x[n]=x0; L.y[n]=y0; n++;
  for(let i=0;i<f.length/2;i++){ L.x[n]=f[2*i]; L.y[n]=f[2*i+1]; n++; }
  L.n=n; let s=0; L.s[0]=0;
  for(let i=1;i<n;i++){ s+=Math.hypot(L.x[i]-L.x[i-1],L.y[i]-L.y[i-1]); L.s[i]=s; }
  L.len=s; L.sg=up;
}

/* Las líneas se dibujan como cintas planas sobre la cara de corte (z = 0,0025): ancho 2,4 mm, color por el
   sentido vertical del campo (cálido arriba, frío abajo) y opacidad por su intensidad. Los puntos que las recorren
   van y vienen con B(t): la integral del campo en el tiempo. */
const MAX_V=N_LIN*MAX_PT*2;
const gLin=new THREE.BufferGeometry();
const lPos=new Float32Array(MAX_V*3), lCol=new Float32Array(MAX_V*4), lIdx=new Uint32Array(N_LIN*MAX_PT*6);
gLin.setAttribute('position',new THREE.BufferAttribute(lPos,3).setUsage(THREE.DynamicDrawUsage));
gLin.setAttribute('aCol',new THREE.BufferAttribute(lCol,4).setUsage(THREE.DynamicDrawUsage));
gLin.setIndex(new THREE.BufferAttribute(lIdx,1).setUsage(THREE.DynamicDrawUsage));
const M_LIN=new THREE.ShaderMaterial({
  vertexShader:'attribute vec4 aCol; varying vec4 vC; void main(){ vC=aCol; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:'varying vec4 vC; void main(){ if(vC.a<0.01) discard; gl_FragColor=vec4(vC.rgb,vC.a); }',
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});

const C_ARR=new THREE.Color('#ff9a3c'), C_ABA=new THREE.Color('#4fd8ff');
function dibujaLineas(){
  let v=0, ix=0; const W=0.0012, Z=0.0026;
  for(let l=0;l<N_LIN;l++){ const L=LIN[l]; if(L.n<3) continue;
    for(let i=0;i<L.n;i++){
      const i0=Math.max(0,i-1), i1=Math.min(L.n-1,i+1), tx=L.x[i1]-L.x[i0], ty=L.y[i1]-L.y[i0], tl=Math.hypot(tx,ty)||1, nx=-ty/tl*W, ny=tx/tl*W;
      Bmundo(L.x[i],L.y[i],_b); const m=Math.hypot(_b[0],_b[1]), inten=clamp(m/CAMPO.ref,0,1.6);
      const u=L.s[i]/Math.max(L.len,1e-6), fade=Math.min(1,u/0.07,(1-u)/0.07);
      const a=clamp(Math.pow(inten,0.55)*0.8,0,0.9)*clamp(fade,0,1);
      const c=_b[1]>=0?C_ARR:C_ABA, g=0.9+0.9*Math.min(inten,1);
      for(let sd=-1;sd<=1;sd+=2){ const o=v*3, q=v*4;
        lPos[o]=L.x[i]+sd*nx; lPos[o+1]=L.y[i]+sd*ny; lPos[o+2]=Z;
        lCol[q]=c.r*g; lCol[q+1]=c.g*g; lCol[q+2]=c.b*g; lCol[q+3]=a; v++; }
      if(i<L.n-1){ const b=v-2; lIdx[ix++]=b; lIdx[ix++]=b+1; lIdx[ix++]=b+2; lIdx[ix++]=b+1; lIdx[ix++]=b+3; lIdx[ix++]=b+2; }
    }
  }
  gLin.attributes.position.needsUpdate=true; gLin.attributes.aCol.needsUpdate=true; gLin.index.needsUpdate=true;
  gLin.setDrawRange(0,ix);
}
/* Los puntos: siete por línea, con velocidad ∝ B·t (la componente del campo a lo largo de la línea). */
const N_DOT=N_LIN*7, gDot=new THREE.BufferGeometry();
const dPos=new Float32Array(N_DOT*3), dAl=new Float32Array(N_DOT), dCol=new Float32Array(N_DOT*3);
gDot.setAttribute('position',new THREE.BufferAttribute(dPos,3).setUsage(THREE.DynamicDrawUsage));
gDot.setAttribute('aColor',new THREE.BufferAttribute(dCol,3).setUsage(THREE.DynamicDrawUsage));
gDot.setAttribute('aAlpha',new THREE.BufferAttribute(dAl,1).setUsage(THREE.DynamicDrawUsage));
const M_PUNTOS=new THREE.ShaderMaterial({
  uniforms:{uPx:{value:600},uTam:{value:0.0042}},
  vertexShader:`attribute vec3 aColor; attribute float aAlpha; varying vec3 vC; varying float vA; uniform float uPx; uniform float uTam;
    void main(){ vC=aColor; vA=aAlpha; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_Position=projectionMatrix*mv; gl_PointSize=clamp(uTam*uPx/(-mv.z),2.0,24.0); }`,
  fragmentShader:`varying vec3 vC; varying float vA;
    void main(){ vec2 d=gl_PointCoord-0.5; float r=length(d); float a=smoothstep(0.5,0.14,r)*vA; if(a<0.01) discard;
      gl_FragColor=vec4(vC*(1.0+1.8*smoothstep(0.22,0.0,r)),a); }`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
const PUNTOS=new THREE.Points(gDot,M_PUNTOS); PUNTOS.frustumCulled=false; PUNTOS.renderOrder=4; PUNTOS.raycast=()=>{}; scene.add(PUNTOS);
function puntoDeLinea(L,s,out){ let lo=0,hi=L.n-1; while(hi-lo>1){ const m=(lo+hi)>>1; if(L.s[m]<s) lo=m; else hi=m; }
  const a=L.s[lo], b=L.s[hi], f=b>a?(s-a)/(b-a):0; out[0]=L.x[lo]+(L.x[hi]-L.x[lo])*f; out[1]=L.y[lo]+(L.y[hi]-L.y[lo])*f; return lo; }
const _q=[0,0];
function mueveDots(dtR){
  let o=0;
  for(let l=0;l<N_LIN;l++){ const L=LIN[l];
    for(let i=0;i<7;i++,o++){
      if(L.n<3||L.len<0.02){ dAl[o]=0; continue; }
      let s=L.u[i]*L.len; const lo0=puntoDeLinea(L,s,_q);
      Bmundo(_q[0],_q[1],_b);
      const tx=L.x[Math.min(lo0+1,L.n-1)]-L.x[lo0], ty=L.y[Math.min(lo0+1,L.n-1)]-L.y[lo0], tl=Math.hypot(tx,ty)||1;
      const bt=(_b[0]*tx+_b[1]*ty)/tl, m=Math.hypot(_b[0],_b[1]);             // componente del campo a lo largo de la línea (signada)
      if(!EST.pausa){ L.u[i]+=bt/CAMPO.ref*0.9*dtR/Math.max(L.len,0.1); L.u[i]-=Math.floor(L.u[i]); }
      s=L.u[i]*L.len; puntoDeLinea(L,s,_q);
      dPos[o*3]=_q[0]; dPos[o*3+1]=_q[1]; dPos[o*3+2]=0.0032;
      const c=_b[1]>=0?C_ARR:C_ABA, uu=L.u[i], borde=Math.min(uu,1-uu)/0.06;
      dCol[o*3]=c.r; dCol[o*3+1]=c.g; dCol[o*3+2]=c.b;
      dAl[o]=clamp(Math.pow(clamp(m/CAMPO.ref,0,1.5),0.5)*0.95,0,1)*clamp(borde,0,1);
    } }

}

/* ===================== 9. LO QUE SE VE: ESPIRAS, SÍMBOLOS, BATERÍA, OBJETO =====================
   Brillo de cada pad ∝ |i(t)| y símbolos ⊙/⊗ por su signo, siempre con la corriente de este instante. */
const C_EMI=new THREE.Color('#ff7a22'), C_BAT=new THREE.Color('#3dff9f'), C_FOD=new THREE.Color('#ff5a1f');
const I_REF=RAIZ2*OPER.I1max;
function pintaBrillos(dtR){
  const e1=clamp(Math.abs(SIMU.i1)/I_REF,0,1.3), e2=clamp(Math.abs(SIMU.i2)/I_REF,0,1.3);
  M.litzA.emissive.copy(C_EMI).multiplyScalar(0.12+0.9*e1); M.litzB.emissive.copy(C_EMI).multiplyScalar(0.12+0.9*e2);
  MARC_GA.uniforms.uI.value=SIMU.i1; MARC_VA.uniforms.uI.value=SIMU.i2; MARC_GA.uniforms.uMax.value=MARC_VA.uniforms.uMax.value=I_REF;
  const op=SIMU.op, f=op?clamp(op.P/OPER.P,0,1):0;
  M.modulos.emissive.copy(C_BAT).multiplyScalar(0.03+0.16*f*(0.8+0.2*Math.sin(performance.now()/700)));
  // el objeto extraño: se calienta con la potencia que absorbe (térmica de un nodo, constante de tiempo de 5 s)
  OBJETO.visible=EST.falla==='fod';
  if(OBJETO.visible&&op){ const Tss=25+op.Pf*0.55; SIMU.Tobj+=(Tss-SIMU.Tobj)*(1-Math.exp(-dtR/5)); } else SIMU.Tobj=25;
  M.moneda.emissive.copy(C_FOD).multiplyScalar(clamp((SIMU.Tobj-120)/240,0,1)*1.4);
}

/* Un cuadro de la escena. dtS: tiempo SIMULADO (s); dtR: tiempo de pantalla. */
let tLin=0;
function aplicaEscena(dtS,dtR,t){
  recalcula();
  SIMU.t+=dtS; instante();
  VEH.position.set(EST.x,H_PAD+EST.g,0); GEO.x=EST.x; GEO.g=EST.g;
  const op=SIMU.op;
  CAMPO.a1=SIMU.i1; CAMPO.a2=SIMU.i2; CAMPO.xv=EST.x; CAMPO.yc2=H_PAD+EST.g+0.014;
  if(op){ const amp=RAIZ2; campoBase(0,(H_PAD+EST.g/2)-YC,_t1); const b1=Math.abs(_t1[1])*amp*op.aI1, b2=Math.abs(_t1[1])*amp*op.aI2; CAMPO.ref=Math.max(1e-6,b1+b2)*0.9; }
  if(t-tLin>=0.028){ tLin=t;
    const yS=H_PAD+EST.g/2, xc=EST.x/2;
    for(let l=0;l<N_LIN;l++) trazaLinea(LIN[l],xc+SEMILLAS_X[l]*(EST.g>0.2?1.1:1),yS);
    dibujaLineas(); }
  mueveDots(dtR);

/* ===================== 10. CÁMARAS ENCAJADAS EN EL HUECO LIBRE ===================== */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function encaja(t,dir,pts,caja,margen=0){
  if(margen){ const mx=(caja.x1-caja.x0)*margen, my=(caja.y1-caja.y0)*margen; caja={x0:caja.x0+mx,x1:caja.x1-mx,y0:caja.y0+my,y1:caja.y1-my}; }
  const cam=camera.clone(), W=innerWidth, H=innerHeight, tan=Math.tan(cam.fov*Math.PI/360);
  cam.aspect=W/H; cam.updateProjectionMatrix();
  const cw=caja.x1-caja.x0, ch=caja.y1-caja.y0, cx_=(caja.x0+caja.x1)/2, cy_=(caja.y0+caja.y1)/2;
  let dist=3; const q=new THREE.Vector3(), der=new THREE.Vector3(), arr=new THREE.Vector3(); t=t.clone(); dir=dir.clone().normalize();
  for(let it=0;it<10;it++){
    cam.position.copy(t).addScaledVector(dir,dist); cam.lookAt(t); cam.updateMatrixWorld();
    let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9;
    for(const p of pts){ q.copy(p).project(cam); const sx=(q.x+1)/2*W, sy=(1-q.y)/2*H;
      a0=Math.min(a0,sx); a1=Math.max(a1,sx); b0=Math.min(b0,sy); b1=Math.max(b1,sy); }
    const k=Math.max((a1-a0)/cw,(b1-b0)/ch), wpp=2*tan*dist/H;
    der.setFromMatrixColumn(cam.matrixWorld,0); arr.setFromMatrixColumn(cam.matrixWorld,1);
    t.addScaledVector(der,((a0+a1)/2-cx_)*wpp).addScaledVector(arr,-((b0+b1)/2-cy_)*wpp);
    dist*=k;
  }
  return [t.clone().addScaledVector(dir,dist),t];
}
const caja3=(x0,y0,z0,x1,y1,z1)=>{ const r=[]; for(const x of [x0,x1]) for(const y of [y0,y1]) for(const z of [z0,z1]) r.push(V3(x,y,z)); return r; };
const VISTA={actual:'conjunto'};
function vistaCam(v){
  const H=huecoLibre(), cen=pts=>new THREE.Box3().setFromPoints(pts).getCenter(new THREE.Vector3()), yb=H_PAD+EST.g;
  if(v==='bobinas'){ const p=caja3(0.04,0.004,-0.12,0.32+Math.max(0,EST.x),yb+0.044,0.01); return encaja(cen(p),V3(0.10,0.22,1),p,H,0.02); }
  if(v==='pads'){ const p=caja3(-0.34,0,-0.34,0.34+Math.max(0,EST.x),yb+0.044,0.02); return encaja(cen(p),V3(0.16,0.26,1),p,H,0.03); }
  if(v==='coche'){ const p=caja3(-1.1,-0.02,-0.4,1.1+EST.x,yb+0.30,0.02); return encaja(cen(p),V3(0.14,0.20,1),p,H,0.02); }
  const x0=-0.38+Math.min(0,EST.x*0.5), x1=0.38+Math.max(0,EST.x)*0.9;
  const p=caja3(x0,-0.01,-0.31,x1,yb+0.045+0.03,0.02);
  return encaja(cen(p),V3(0.20,0.62,1),p,H,0.01);
}
const CAMT={on:false};
function ponVista(v,dur){
  VISTA.actual=v; const [p,t]=vistaCam(v);
  Object.assign(CAMT,{on:true,u:0,dur:dur===undefined?(REDUCIDO?0.001:1.2):dur,p0:camera.position.clone(),t0:controls.target.clone(),p1:p,t1:t});
  pintaBarras();
}
function pasaCam(dt){
  if(!CAMT.on) return;
  CAMT.u=Math.min(1,CAMT.u+dt/Math.max(CAMT.dur,1e-3)); const e=ease(CAMT.u);
  camera.position.lerpVectors(CAMT.p0,CAMT.p1,e); controls.target.lerpVectors(CAMT.t0,CAMT.t1,e);

/* ===================== 11. EL HUD (izquierda) ===================== */
const kHz=f=>fN(f/1000,2)+' kHz';
const mm=x=>fN(x*1000,0)+' mm';
const fmtD=x=>(x<0?'−':(x>0?'+':''))+fN(Math.abs(x)*1000,0)+' mm';
const claseZ=g=>g<0.14?'Z1':(g<0.21?'Z2':'Z3');
function slider(id,etq,val,min,max,step,mostrado,marcas,desact){
  return `<div class="cg"><div class="cl ${desact?'dis':''}"><div>${etq}</div><b id="v_${id}">${mostrado}</b></div><input type="range" id="r_${id}" min="${min}" max="${max}" step="${step}" value="${val}" aria-label="${etq.replace(/<[^>]+>/g,'')}" ${desact?'disabled':''}>${marcas||''}</div>`;
}
function pintaHUD(){

  } else h+=`<h2>Alinéalo, sintonízalo y diagnostícalo</h2></div>`;
  h+=`<div class="modebar"><button class="b ${EST.modo==='marcha'?'on':''}" data-mode="marcha"><i>◎</i>En marcha</button><button class="b ${EST.modo==='guia'?'on':''}" data-mode="guia"><i>✎</i>Laboratorio guiado</button></div>`;
  if(EST.modo==='marcha'){
    const mk=(txt)=>`<div class="marcas">${txt.map(t=>`<span>${t}</span>`).join('')}</div>`;
    h+=`<div class="hmandos">
    ${slider('x','Desalineación lateral <em class="gr">d</em>',EST.x*1000,-250,250,1,fmtD(EST.x),mk(['−250','0','+250']))}
    ${slider('g','Holgura vertical <em class="gr">g</em>',EST.g*1000,100,240,1,mm(EST.g)+' · '+claseZ(EST.g),mk(['100','Z1','Z2','Z3','240']))}
    ${slider('t','Compensación <em class="gr">C₂</em> (ajuste)',EST.trim*100,-15,15,0.1,(EST.trim>=0?'+':'−')+fN(Math.abs(EST.trim)*100,1)+' %',mk(['−15','0','+15']))}
    ${slider('l','Carga <em class="gr">R<sub>L</sub></em>',EST.RL,6,24,0.1,fN(EST.RL,1)+' Ω',mk(['6','12','24']))}
    ${slider('f','Frecuencia <em class="gr">f</em>',EST.f/1000,75,100,0.05,kHz(EST.f),mk(['75','81,4–90 kHz (J2954)','100']))}
    <div class="btnrow"><button class="b auto" id="btnAuto">Recorrido guiado</button></div></div>`;
  } else h+=htmlGuia();
  h+=`<div class="hdet"><details id="dEc"><summary>Ecuaciones</summary><div class="cuerpo">
    <div class="fl">Cada espira es un lazo de corriente. La inductancia mutua de dos lazos coaxiales sale de las <b>integrales elípticas</b> (AGM); con los ejes desplazados, de la <b>integral de Neumann</b>.</div>
    <div class="formula">M = Σᵢⱼ μ₀/4π ∮∮ dlᵢ·dlⱼ / r<br>k = M / √(L₁L₂)</div>
    <div class="fl">Compensación serie–serie: C = 1/(ω₀²L), a 85 kHz. Con la tensión V₁ del inversor:</div>
    <div class="formula">V₁ = Z₁I₁ + jωM·I₂<br>0 = Z₂I₂ + jωM·I₁<br>Z₂ = R₂ + R<sub>L</sub> + j(ωL₂ − 1/ωC₂)</div>
    <div class="fl">Con la carga óptima el rendimiento máximo es <b>η = k²Q₁Q₂ / (1 + √(1 + k²Q₁Q₂))²</b>. Si k supera el crítico 1/√(Q₁Q₂c), la potencia a tensión constante se <b>divide</b> en dos picos, hacia f₀/√(1+k) y f₀/√(1−k).</div>
    <div class="fl">La carga que ve la bobina tras el rectificador es R<sub>L</sub> = (8/π²)·V²/P.</div>
  </div></details>
  <details id="dSim"><summary>Simplificaciones</summary><div class="cuerpo"><ul class="no">
    <li>Las pads son 18 lazos circulares en aire: la ferrita y el blindaje ponen pérdidas (Q de ferrita y aluminio = 160), pero no cambian L, M ni el campo dibujado.</li>
    <li>Coil circular: sólo importa la distancia entre ejes, no su dirección. Las pads reales (DD) tienen otra sensibilidad.</li>
    <li>Resistencia de Litz a 60 °C con F<sub>ac</sub> = 1,4; el rectificador y la batería son una resistencia equivalente. Sin armónicos, sin EMI, sin detección de objetos real.</li>
    <li>Las líneas de campo se cortan al entrar en una pieza. Los puntos y los símbolos van a cámara lenta: 85 kHz se ve a 0,85 Hz.</li>
  </ul><div class="src">SAE J2954 (2020) · Kurs et al., <i>Science</i> 317 (2007) · Zhang y Mi, <i>Wireless Power Transfer for Electric Vehicles</i> · Grover, <i>Inductance Calculations</i>.</div></div></details></div>`;
  H.innerHTML=h; H.classList.toggle('guia',EST.modo!=='marcha'); enlazaHUD(); ajustaHoja();
}
function enlazaHUD(){
  const H=el('hud');
  H.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  const lig=(id,fn,lbl)=>{ const r=el('r_'+id); if(!r) return; r.oninput=()=>{ if(EST.autoRunning) return; fn(+r.value); el('v_'+id).innerHTML=lbl(); }; };
  lig('x',v=>{ EST.x=v/1000; },()=>fmtD(EST.x));
  lig('g',v=>{ EST.g=v/1000; },()=>mm(EST.g)+' · '+claseZ(EST.g));
  lig('t',v=>{ EST.trim=v/100; },()=>(EST.trim>=0?'+':'−')+fN(Math.abs(EST.trim)*100,1)+' %');
  lig('l',v=>{ EST.RL=v; },()=>fN(EST.RL,1)+' Ω');
  lig('f',v=>{ EST.f=v*1000; },()=>kHz(EST.f));
  if(el('btnAuto')) el('btnAuto').onclick=runAuto;
  H.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>handleAction(b.dataset.act,b));
  const hint=el('btnHint'); if(hint) hint.onclick=()=>handleAction('hint',null);
  H.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>responde(+b.dataset.quiz));
}

/* ===================== 12. EL DOCK (derecha): cifras y gráficas DOM ===================== */
const FUENTE="'Outfit',system-ui,sans-serif";
function lienzo(id){ const box=el(id), c=box.querySelector('canvas'); return {box,c,ctx:c.getContext('2d'),w:0,h:0,dpr:1}; }
function abre(L){ const r=L.box.getBoundingClientRect(), dpr=Math.min(3,window.devicePixelRatio||1);
  const w=Math.max(20,Math.round(r.width)), h=Math.max(20,Math.round(r.height));
  if(L.w!==w||L.h!==h||L.dpr!==dpr){ L.c.width=Math.round(w*dpr); L.c.height=Math.round(h*dpr); L.w=w; L.h=h; L.dpr=dpr; }
  const x=L.ctx; x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h); return x; }
function txt(x,t,px,py,col,size,align,peso){ x.fillStyle=col; x.font=(peso||'600')+' '+(size||11)+'px '+FUENTE; x.textAlign=align||'left'; x.textBaseline='alphabetic'; x.fillText(t,px,py); }
function raya(x,x1,y1,x2,y2,col,w,dash){ x.strokeStyle=col; x.lineWidth=w||1; x.setLineDash(dash||[]); x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke(); x.setLineDash([]); }
function punto(x,px,py,r,col){ x.fillStyle=col; x.beginPath(); x.arc(px,py,r,0,DOSPI); x.fill(); }
const LETA=lienzo('gEta'), LWF=lienzo('gWf'), LFR=lienzo('gFr'), LBA=lienzo('gBa');
const COL1='#FFA24A', COL2='#4DE3FF', COLV='#EAF1FA', COLP='#34d399';
/** Lo que el dock NO debe enseñar mientras el Reto no esté validado: la teoría de la sintonía óptima. */
const ocultaTeoria=()=>EST.modo==='guia'&&GUIA.fase===0&&!GUIA.retoOk;
const enDiagnostico=()=>EST.modo==='guia'&&GUIA.fase===1&&!GUIA.dxOk;
const fueraDeBanda=f=>!enDiagnostico()&&(f<BANDA.fMin-1||f>BANDA.fMax+1);

/* η frente a la desalineación: la curva de la tabla de M(d) con la sintonía y la carga actuales. */
function pintaEta(){
  const L=LETA, x=abre(L), W=L.w, Hh=L.h, C=SIMU.curvaD; if(!C) return;
  const X0=30, X1=W-8, Y0=8, Y1=Hh-16, dMax=0.25;
  let mn=1; for(const p of C) mn=Math.min(mn,p.eta); const ylo=Math.max(0,Math.floor((mn*100-2)/10)*10)/100, yhi=1;
  const X=d=>X0+d/dMax*(X1-X0), Y=e=>Y1-(e-ylo)/(yhi-ylo)*(Y1-Y0);
  // donde no llegan los 11 kW
  x.fillStyle='rgba(244,71,94,0.13)'; for(let i=0;i<C.length-1;i++) if(!C[i].llega) x.fillRect(X(C[i].d),Y0,X(C[i+1].d)-X(C[i].d)+0.6,Y1-Y0);
  for(let q=0;q<=3;q++){ const e=ylo+(yhi-ylo)*q/3; raya(x,X0,Y(e),X1,Y(e),'rgba(143,169,200,0.10)'); txt(x,fN(e*100,0)+' %',X0-3,Y(e)+3,'#6C86A6',8.5,'right','500'); }
  raya(x,X0,Y(OPER.etaMin),X1,Y(OPER.etaMin),'rgba(52,211,153,0.65)',1,[3,3]); txt(x,'90 %',X1-2,Y(OPER.etaMin)-3,'#7be0b3',8.5,'right','600');
  for(const dd of [0,0.05,0.10,0.15,0.20,0.25]){ raya(x,X(dd),Y1,X(dd),Y1+3,'#3d5576'); if(dd*1000%100===0||dd===0.25||dd===0) txt(x,fN(dd*1000,0),X(dd),Hh-3,'#6C86A6',8.5,'center','500'); }
  x.strokeStyle='#7DB8FF'; x.lineWidth=1.9; x.beginPath(); C.forEach((p,i)=>{ const px=X(p.d), py=Y(Math.max(p.eta,ylo)); i?x.lineTo(px,py):x.moveTo(px,py); }); x.stroke();
  const d=Math.abs(EST.x), op=SIMU.op; raya(x,X(d),Y0,X(d),Y1,'rgba(255,255,255,0.35)',1,[2,2]);
  punto(x,X(d),Y(clamp(op.eta,ylo,1)),3.6,'#ffffff');
  txt(x,'mm',X1,Hh-3,'#6C86A6',8.5,'right','500');
  el('t_eta').textContent='d = '+fN(d*1000,0)+' mm';
}
/* Una corriente i₁ e i₂ a lo largo de DOS ciclos de 85 kHz con el cursor del reloj común. */
function pintaWf(){
  const L=LWF, x=abre(L), W=L.w, Hh=L.h, op=SIMU.op, B=SIMU.B; if(!op) return;
  const X0=8, X1=W-8, Yc=Hh/2-3, esc=(Hh/2-12)/I_REF, N=2;
  raya(x,X0,Yc,X1,Yc,'rgba(143,169,200,0.22)');
  for(let q=0;q<=N;q++){ const xx=X0+(X1-X0)*q/N; raya(x,xx,6,xx,Hh-12,'rgba(143,169,200,0.10)'); txt(x,fN(q*360,0)+'°',xx,Hh-2,'#6C86A6',8.5,q===0?'left':(q===N?'right':'center'),'500'); }
  const traza=(col,amp,fi,sc,w,dash)=>{ x.strokeStyle=col; x.lineWidth=w; x.setLineDash(dash||[]); x.beginPath();
    for(let p=0;p<=160;p++){ const th=DOSPI*N*p/160, y=Yc-RAIZ2*amp*Math.cos(th+fi)*esc*sc, px=X0+(X1-X0)*p/160; p?x.lineTo(px,y):x.moveTo(px,y); } x.stroke(); x.setLineDash([]); };
  traza('rgba(234,241,250,0.55)',op.V1,0,0.8*I_REF/(RAIZ2*op.V1),1.1,[3,2]);
  traza(COL1,op.aI1,op.fi1,1,1.8); traza(COL2,op.aI2,op.fi2,1,1.8);
  const ph=((SIMU.fase%(DOSPI*N))+DOSPI*N)%(DOSPI*N), xc=X0+(X1-X0)*ph/(DOSPI*N);
  raya(x,xc,6,xc,Hh-12,'rgba(255,255,255,0.7)',1.1);
  punto(x,xc,Yc-SIMU.i1*esc,3.2,COL1); punto(x,xc,Yc-SIMU.i2*esc,3.2,COL2);
  el('t_wf').innerHTML='<span style="color:'+COL1+'">I₁ '+fN(op.aI1,1)+' A</span> · <span style="color:'+COL2+'">I₂ '+fN(op.aI2,1)+' A</span>';
}
/* La respuesta en frecuencia a V₁ constante: potencia en la carga (azul) y rendimiento (verde). */
function pintaFr(){
  const L=LFR, x=abre(L), W=L.w, Hh=L.h, F=SIMU.fr, B=SIMU.B, op=SIMU.op; if(!F) return;
  const X0=34, X1=W-30, Y0=8, Y1=Hh-15, fA=66000, fB=106000, X=f=>X0+(f-fA)/(fB-fA)*(X1-X0);
  let pm=0; for(const p of F) pm=Math.max(pm,p.P); const pTop=Math.max(op.P*1.4,Math.min(pm*1.08,op.P*10)), YP=p=>Y1-clamp(p/pTop,0,1)*(Y1-Y0), YE=e=>Y1-clamp(e,0,1)*(Y1-Y0);
  // la banda de J2954
  x.fillStyle='rgba(61,139,242,0.13)'; x.fillRect(X(BANDA.fMin),Y0,X(BANDA.fMax)-X(BANDA.fMin),Y1-Y0);
  txt(x,'banda J2954',(X(BANDA.fMin)+X(BANDA.fMax))/2,Y0+9,'#7DB8FF',8.5,'center','600');
  for(const q of [0.5,1]){ raya(x,X0,YP(pTop*q),X1,YP(pTop*q),'rgba(143,169,200,0.09)'); txt(x,fN(pTop*q/1000,pTop>20000?0:1),X0-3,YP(pTop*q)+3,'#8fb2e6',8.5,'right','500'); }
  for(const e of [0.5,1]) txt(x,fN(e*100,0)+' %',X1+3,YE(e)+3,'#6fcf9f',8.5,'left','500');
  raya(x,X0,Y1+0.5,X1,Y1+0.5,'#3d5576');
  for(const f of [70000,80000,85000,90000,100000]){ raya(x,X(f),Y1,X(f),Y1+3,'#3d5576'); txt(x,fN(f/1000,0),X(f),Hh-3,'#6C86A6',8.5,'center','500'); }
  raya(x,X(BANDA.f0),Y0,X(BANDA.f0),Y1,'rgba(255,255,255,0.18)',1,[2,3]);
  // η(f)
  x.strokeStyle='#34d399'; x.lineWidth=1.3; x.setLineDash([4,3]); x.beginPath(); F.forEach((p,i)=>{ const px=X(p.f), py=YE(p.eta); i?x.lineTo(px,py):x.moveTo(px,py); }); x.stroke(); x.setLineDash([]);
  // P(f)
  x.strokeStyle='#7DB8FF'; x.lineWidth=1.9; x.beginPath(); F.forEach((p,i)=>{ const px=X(p.f), py=YP(p.P); i?x.lineTo(px,py):x.moveTo(px,py); }); x.stroke();
  // el punto de trabajo
  const fo=B.f, fuera=fueraDeBanda(fo);
  raya(x,X(fo),Y0,X(fo),Y1,fuera?'rgba(244,71,94,0.8)':'rgba(255,255,255,0.55)',1.1);
  punto(x,X(fo),YP(op.P),3.8,fuera?'#ff6b7e':'#ffffff');
  const k=B.k, kd=SIMU.kd, np=SIMU.picos.length;
  el('t_fr').textContent=np>=2?'k > k_d · dos picos':'un solo pico';
  if(!ocultaTeoria()){ txt(x,'k = '+fN(k,3)+' · k_d = '+(isFinite(kd)?fN(kd,3):'—'),X1-1,Y1-4,'#9DB6D4',8.5,'right','600'); }
}
function pintaLeyFr(){
  el('leyFr').innerHTML=`<span class="lg"><i style="--c:#7DB8FF"></i>potencia en la carga (V₁ constante)</span><span class="lg"><i class="dash" style="--c:#34d399"></i>η</span>`;
}
/* El balance de potencia en un solo vistazo: la potencia de entrada repartida. */
function pintaBa(){
  const L=LBA, x=abre(L), W=L.w, Hh=L.h, op=SIMU.op; if(!op) return;
  const X0=6, X1=W-6, Pin=op.Pin, ancho=X1-X0, y=10, hb=Math.max(14,Math.min(22,Hh-34));
  const partes=[['P₂ carga',op.P,'#34d399'],['pérd. primario',op.P1,COL1],['pérd. secundario',op.P2,COL2]];
  if(op.Pf>1) partes.push(['objeto',op.Pf,'#ff5a4a']);
  let xx=X0; for(const [n,v,c] of partes){ const w=v/Pin*ancho; x.fillStyle=c; x.globalAlpha=0.9; x.fillRect(xx,y,Math.max(0.8,w-0.6),hb); x.globalAlpha=1; xx+=w; }
  let lx=X0, ly=y+hb+11; x.textBaseline='alphabetic';
  for(const [n,v,c] of partes){ x.fillStyle=c; x.fillRect(lx,ly-7,7,7); const t=n+' '+(v>=1000?fN(v/1000,2)+' kW':fN(v,0)+' W'); txt(x,t,lx+10,ly,'#c4d6ee',9.5,'left','500'); lx+=10+x.measureText(t).width+10; }
  el('t_ba').textContent='entra '+fN(Pin/1000,2)+' kW';
}
function pintaCifras(){
  const B=SIMU.B, op=SIMU.op, set=(id,h)=>{ const e=el(id); if(e.innerHTML!==h) e.innerHTML=h; };
  set('f_k',fN(B.k,3)); set('f_m',fN(B.M*1e6,1)+'<small> µH</small>'); set('f_q',fN(SIMU.Q1,0));
  set('f_c2',fN(B.C2*1e9,1)+'<small> nF</small>'); set('f_rl',fN(B.RL,1)+'<small> Ω</small>');
  const fo=B.f, fuera=fueraDeBanda(fo); set('f_f',fN(fo/1000,2)+'<small> kHz</small>'); el('f_f').className=fuera?'bad':'';
}
const CRIT=[
  {id:'eta',lab:'η ≥ 90 %',val:op=>fN(op.eta*100,1)+'<small> %</small>'},
  {id:'P',lab:'11 kW',val:op=>fN(op.P/1000,1)+'<small> kW</small>'},

];

function pintaDockFijo(){
  const B=SIMU.B; if(!B) return;
  el('p_mode').textContent=EST.modo==='marcha'?'Enlace serie–serie':'Laboratorio guiado';

const _cl=(id,c)=>{ const e=el(id); if(e.className!==c) e.className=c; };
function pintaDock(){
  const op=SIMU.op, B=SIMU.B; if(!op) return;
  pintaCifras(); pintaPliego(); pintaDockFijo();
  const A=el('aviso'); let cl='', t='';
  if(EST.falla!==null&&EST.modo==='guia'&&GUIA.fase===1&&!GUIA.dxOk){ /* en el diagnóstico el aviso no da el síntoma: lo lee el alumno */ }
  else if(!op.llega){ cl='mal'; t='No llegan los 11 kW: el límite de '+(op.limita==='V1'?'tensión del inversor':(op.limita==='I1'?'corriente de la pad del suelo':'corriente de la pad del coche'))+' los frena en '+fN(op.Pmax/1000,1)+' kW.'; }
  else if(EST.modo==='marcha'&&fueraDeBanda(B.f)&&B.f>BANDA.fMax+1){ cl='ojo'; t='Fuera de la banda de J2954 (81,38–90 kHz): el cargador no puede operar aquí.'; }
  else if(EST.modo==='marcha'&&op.eta<OPER.etaMin){ cl='ojo'; t='El rendimiento cae por debajo del 90 %: menos acoplamiento, o una carga lejos de la óptima.'; }
  A.className='dk-aviso'+(t?' on '+cl:''); if(A.textContent!==t) A.textContent=t;
}

function hitBajo(cx_,cy_){
