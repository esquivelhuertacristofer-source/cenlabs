/* ===================== 15. DISPOSICIÓN: ANCHO, ESTRECHO, MÓVIL =====================
   Si no caben guía, escena y dock lado a lado (el marco de la plataforma, una
   tableta), la escena va arriba y guía e instrumentos comparten una hoja con
   pestañas abajo. */
function disposicion(){
  const W=innerWidth, b=document.body;
  const estrecho=W<1080, movil=W<640;
  b.classList.toggle('estrecho',estrecho); b.classList.toggle('movil',movil); b.classList.toggle('ancho',estrecho&&!movil);
  if(estrecho){ if(!b.classList.contains('t-hud')&&!b.classList.contains('t-panel')) b.classList.add('t-hud'); ajustaHoja(); }
  el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('on',b.classList.contains('t-'+t.dataset.tab)));
}
/** La hoja mide lo que pide su contenido (entre 240 px y el 62 % del alto en el móvil), para que la guía nunca
    tenga que desplazarse por dentro; la cámara se vuelve a encajar en el hueco que queda. */
function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.47:0.43),240,450));
  let hh=base; const hud=el('hud');
  if(movil&&b.classList.contains('t-panel')) hh=Math.round(clamp(H*0.6,240,560));
  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;
    hh=Math.round(clamp(pide,240,Math.max(base,H*(movil?0.62:0.56)))); }
  const ant=parseFloat(b.style.getPropertyValue('--hojaH'))||0;
  if(Math.abs(ant-hh)>1){ b.style.setProperty('--hojaH',hh+'px'); colocaBarras();
    if(ant){ clearTimeout(window.__hjWPT); window.__hjWPT=setTimeout(()=>ponVista(VISTA.actual,REDUCIDO?0.001:0.4),40); } }
}
el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.onclick=()=>{ const b=document.body; b.classList.remove('t-hud','t-panel'); b.classList.add('t-'+t.dataset.tab); disposicion(); });


/* ===================== 16. EL LABORATORIO GUIADO =====================
   Tres fases: 0 · Reto (alinear y sintonizar para cumplir el pliego de los
   11 kW), 1 · Diagnóstico (una de tres fallas al azar, y repararla) y 2 ·
   Cierre (una pregunta con las opciones barajadas). Cada intento sortea un
   coche distinto —holgura, tensión del pack, desviación inicial y una
   desviación OCULTA de la inductancia de su bobina—; tres fallos en un reto
   cambian el dato (no se aprueba por eliminación). Ni el HUD, ni el dock, ni
   los mensajes muestran la sintonía que resuelve el reto antes de validar. */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajaFY=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const GUIA={fase:0,iniciado:false,retoOk:false,dxOk:false,hecho:false,scen:null,intentos:0,fallos:0,fallosDx:0,resiembras:0,pistas:0,falla:null,sintoma:'',
  quiz:null,quizResp:-1,quizOk:false,ultimaCorrecta:-1};
const NOM_CRIT={eta:'el rendimiento (η ≥ 90 %)',P:'la potencia (11 kW)',I:'la corriente de las pads (≤ 50 A)',V:'la tensión del inversor',pf:'el factor de potencia (cos φ ≥ 0,97)'};

/* Interpolación de los mandos (para que el coche ruede en vez de saltar). */
const TW={items:[],u:1,dur:1};
function muevea(o,dur=0.8){
  if(REDUCIDO||dur<=0){ Object.assign(EST,o); sincronizaMandos(); return; }
  TW.items=Object.keys(o).map(k=>({k,a:EST[k],b:o[k]})); TW.u=0; TW.dur=dur;
}
function pasaTween(dt){
  if(TW.u>=1) return;
  TW.u=Math.min(1,TW.u+dt/TW.dur); const e=ease(TW.u);
  for(const it of TW.items) EST[it.k]=it.a+(it.b-it.a)*e;
  sincronizaMandos();
}
function sincronizaMandos(){
  const set=(id,v,t)=>{ const r=el('r_'+id), l=el('v_'+id); if(r&&document.activeElement!==r) r.value=v; if(l) l.innerHTML=t; };
  set('x',EST.x*1000,fmtD(EST.x)); set('g',EST.g*1000,mm(EST.g)+' · '+claseZ(EST.g));
  set('t',EST.trim*100,(EST.trim>=0?'+':'−')+fN(Math.abs(EST.trim)*100,1)+' %'); set('l',EST.RL,fN(EST.RL,1)+' Ω'); set('f',EST.f/1000,kHz(EST.f));
}

/* ---------- Fase 0: el reto ---------- */
function sorteaEscenario(){
  const prev=GUIA.scen; let e,s;
  do{ e=pickOne(ESCENARIOS); s={g:e.g,Vpack:e.Vpack,eps:pickOne(e.epsOpciones),d0:pickOne(e.d0Opciones)*(Math.random()<0.5?-1:1)}; }
  while(prev&&prev.g===s.g&&prev.Vpack===s.Vpack);
  GUIA.scen=s; return s;
}
function aplicaEscenario(s){
  EST.g=s.g; EST.RL=cargaDePack(s.Vpack); EST.eps=s.eps; EST.f=BANDA.f0; EST.falla=null; EST.trim=0; EST.autoRunning=false;
  muevea({x:s.d0},0.9);
}
function startReto(){
  GUIA.fase=0; GUIA.iniciado=true; GUIA.retoOk=false; GUIA.dxOk=false; GUIA.fallos=0; GUIA.pistas=0; GUIA.falla=null;
  aplicaEscenario(sorteaEscenario()); ponVista('pads');
}
function criteriosFallan(){ return SIMU.pl.map((c,i)=>c.ok?null:CRIT[i].id).filter(Boolean); }
function validar(){
  recalcula();
  const fallan=criteriosFallan(); GUIA.intentos++;
  if(!fallan.length){
    GUIA.retoOk=true; GUIA.fallos=0; sonido.bien();
    const B=SIMU.B, op=SIMU.op, Q1=SIMU.Q1, Q2=SIMU.Q2, sc=GUIA.scen, e0=etaOptima(B.k,Q1,Q2), rlo=RLoptima(B.k,Q1,Q2,B.R2);
    feedback('good','¡Cumple el pliego! ✓',
      `η = ${fN(op.eta*100,1)} % a ${fN(op.P/1000,1)} kW, con I₁ = ${fN(op.aI1,0)} A, I₂ = ${fN(op.aI2,0)} A y cos φ = ${fN(op.pf,2)}. `+
      `La bobina del coche traía ${(sc.eps>0?'+':'−')}${fN(Math.abs(sc.eps)*100,0)} % de inductancia; tu ajuste de C₂ (${EST.trim>=0?'+':'−'}${fN(Math.abs(EST.trim)*100,1)} %) la dejó en resonancia. `+
      `Con k = ${fN(B.k,3)} el enlace podría dar como máximo η = ${fN(e0*100,1)} %, con una carga de ${fN(rlo,1)} Ω; la tuya es de ${fN(B.RL,1)} Ω.`,true);
    pasoGuia();
  } else {
    GUIA.fallos++; sonido.mal();
    if(GUIA.fallos>=3){
      GUIA.fallos=0; GUIA.resiembras++; aplicaEscenario(sorteaEscenario());
      feedback('bad','Tres intentos fallidos','Llega otro coche, con otra holgura, otra batería y otra bobina. Lee el pliego del dock y busca qué criterio falla.');
    } else {
      feedback('bad','Todavía no cumple',`Falla ${fallan.map(i=>NOM_CRIT[i]).join(', ')}. Mira el pliego del dock. (intentos fallidos: ${GUIA.fallos}/3)`);
    }
    pasoGuia();
  }
}
function pista(){
  if(GUIA.pistas===0){ GUIA.pistas=1; feedback('good','Pista 1 de 2','Acercar el coche sube k, y con él la tensión que la bobina del coche recibe por amperio. Pero no todo se arregla acercando: un criterio del pliego depende de la sintonía.'); }
  else if(GUIA.pistas===1){ GUIA.pistas=2; feedback('good','Pista 2 de 2','La bobina del coche no tiene la inductancia nominal. Mueve C₂ y observa cos φ y la corriente del primario: la sintonía está donde el factor de potencia es máximo.'); }
  else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que mide el dock.');
}

/* ---------- Fase 1: el diagnóstico ---------- */
const FALLAS_DX=['fod','c1','freq'];
const NOM_FALLA={fod:'objeto metálico entre las pads',c1:'condensador del primario degradado',freq:'frecuencia del inversor fuera de banda'};

  return 'SÍNTOMA: cos φ baja y ya no llegan los 11 kW, aunque la alineación y la sintonía son las de antes. El punto blanco de la gráfica de frecuencia está en otro sitio. ¿Qué lo causa?';
}
function startDx(){

    GUIA.dxOk=true; sonido.bien(); const op=SIMU.op;
    const expl={fod:`Una lámina de aluminio sobre la pad: el campo le induce corrientes de Foucault y se calienta (${fN(op.Pf,0)} W en este momento). Es la pérdida que antes no estaba y por eso baja η sin tocar el factor de potencia.`,
      c1:`El condensador del primario perdió capacidad (−18 %): la rama deja de estar en resonancia y aparece reactancia en la entrada. η casi no cambia, pero el inversor tiene que dar tensión para una corriente que no hace trabajo (cos φ = ${fN(op.pf,2)}).`,
      freq:`El oscilador del inversor se fue a ${fN(SIMU.B.f/1000,0)} kHz, fuera de la banda de J2954: las dos pads quedan fuera de resonancia y el cos φ cae a ${fN(op.pf,2)}. Además esa frecuencia está prohibida para esta aplicación.`}[f];

      feedback('bad','No es esa la falla',`Eso (${NOM_FALLA[f]}) daría otro síntoma: ${no}. Observa otra vez. (intentos fallidos: ${GUIA.fallosDx}/3)`,true);

  pasoGuia();
}

  {q:'Un objeto metálico olvidado sobre la pad suelta calor aunque el coche esté perfectamente alineado. ¿Qué lo calienta?',
   ok:'Las corrientes de Foucault que el campo alterno induce en él',
   mal:['La corriente continua de la batería','El rozamiento con el coche','La ferrita, que lo imanta y lo frota']},
];
function preparaQuiz(){
  const it=pickOne(BANCO_Q); const opciones=[it.ok,...it.mal];
  let ord, idx; let guard=0;
  do{ ord=barajaFY(opciones.map((t,i)=>i)); idx=ord.indexOf(0); guard++; }while(idx===GUIA.ultimaCorrecta&&guard<20);
  GUIA.ultimaCorrecta=idx; GUIA.quiz={q:it.q,opc:ord.map(i=>opciones[i]),ok:idx,expl:it.ok}; GUIA.quizResp=-1; GUIA.quizOk=false;
}
function startCierre(){ GUIA.fase=2; preparaQuiz(); pasoGuia(); ponVista('conjunto'); }
function responde(i){
  if(GUIA.fase!==2||GUIA.quizResp>=0) return; GUIA.quizResp=i; GUIA.quizOk=(i===GUIA.quiz.ok);
  if(GUIA.quizOk){ sonido.bien(); feedback('good','Correcto ✓','Respuesta: '+GUIA.quiz.opc[GUIA.quiz.ok]+'.',true); }
  else { sonido.mal(); feedback('bad','No es esa','La correcta era: '+GUIA.quiz.opc[GUIA.quiz.ok]+'.',true); }
  pasoGuia();
}

/* ---------- el enrutador de acciones (la API de siempre) ---------- */
function handleAction(act){
  switch(act){
    case 'validar': if(GUIA.fase===0&&!GUIA.retoOk) validar(); break;
    case 'hint': if(GUIA.fase===0&&!GUIA.retoOk) pista(); break;
    case 'to-dx': if(GUIA.retoOk&&GUIA.fase===0) startDx(); break;
    case 'dx-fod': diagnostica('fod'); break;
    case 'dx-c1': diagnostica('c1'); break;
    case 'dx-freq': diagnostica('freq'); break;
    case 'reparar': reparar(); break;
    case 'to-cierre': if(GUIA.hecho&&GUIA.fase===1) startCierre(); break;
    case 'restart': location.reload(); break;
  }
}
const tries=(n,t)=>`<span class="tries">intentos fallidos: <b>${n}</b>/${t}</span>`;
function contenidoGuia(){
  const sc=GUIA.scen;
  if(GUIA.fase===0){
    const done=GUIA.retoOk;
    return {no:'Reto',head:'Pliego del dock',title:'Entrega 11 kW con η ≥ 90 %',
      teach:`Hoy el coche es de clase <b>${claseZ(sc.g)}</b> (holgura ${mm(sc.g)}) y su pack es de <b>${fN(sc.Vpack,0)} V</b>: tras el rectificador, la bobina ve <b>R<sub>L</sub> = ${fN(EST.RL,1)} Ω</b>. Está desviado y su bobina trae una tolerancia que no conoces.
      <div class="task">Alinea el coche y ajusta la compensación C₂ hasta que los cinco criterios del dock estén en ✓. ${tries(GUIA.fallos,3)}</div>`,
      mandos:slider('x','Desalineación <em class="gr">d</em>',EST.x*1000,-250,250,1,fmtD(EST.x),'')+slider('t','Compensación <em class="gr">C₂</em>',EST.trim*100,-15,15,0.1,(EST.trim>=0?'+':'−')+fN(Math.abs(EST.trim)*100,1)+' %',''),
      acts:done?`<button class="b primary good" data-act="to-dx">Continuar al diagnóstico →</button>`:`<button class="b primary" data-act="validar">✓ Validar</button><button class="pista" id="btnHint">¿Necesitas una pista? (máx. 2)</button>`};
  }
  if(GUIA.fase===1){
    if(!GUIA.dxOk) return {no:'Diagnóstico',head:'¿Cuál es la falla?',title:'El cargador falla en operación',
      teach:`El enlace estaba cumpliendo el pliego y algo cambió. Observa la escena y el dock e <b>identifica la causa</b>.<div class="task" id="symptomTask">${GUIA.sintoma||'Observa el síntoma y elige el diagnóstico.'}</div>${tries(GUIA.fallosDx,3)}`,
      mandos:'',acts:`<button class="b" data-act="dx-fod"><span class="ic">▦</span> Objeto metálico entre las pads</button><button class="b" data-act="dx-c1"><span class="ic">⏚</span> Condensador del primario degradado</button><button class="b" data-act="dx-freq"><span class="ic">∿</span> Frecuencia del inversor fuera de banda</button>`};
    if(!GUIA.hecho) return {no:'Diagnóstico',head:'Reparación',title:'Corrige la falla',
      teach:`Diagnóstico correcto: <b>${NOM_FALLA[GUIA.falla]}</b>. Corrígela y mira volver el pliego a ✓.`,mandos:'',acts:`<button class="b primary good" data-act="reparar">🔧 Corregir la falla</button>`};
    return {no:'Diagnóstico',head:'✓',title:'Falla corregida',teach:`El enlace vuelve a cumplir el pliego. Falta una pregunta para cerrar.`,mandos:'',acts:`<button class="b primary" data-act="to-cierre">Pregunta de cierre →</button>`};
  }
  const Q=GUIA.quiz, resp=GUIA.quizResp>=0;
  return {no:'Cierre',head:resp?(GUIA.quizOk?'Correcto':'Revisa'):'Una pregunta',title:'Para cerrar',
    teach:`${Q.q}`,mandos:'',
    acts:Q.opc.map((t,i)=>`<button class="b ${resp?(i===Q.ok?'good':(i===GUIA.quizResp?'bad':'')):''}" data-quiz="${i}" ${resp?'disabled':''}>${t}</button>`).join('')+(resp?`<button class="b primary" data-act="restart">↺ Reiniciar laboratorio</button>`:'')};
}
function htmlGuia(){
  if(!GUIA.iniciado){ return `<div class="retoBox"><h3>Preparando el coche…</h3></div>`; }
  const ps=['Reto','Diagnóstico','Cierre'], C=contenidoGuia();
  const ok=i=>(i===0&&GUIA.retoOk)||(i===1&&GUIA.hecho)||(i===2&&GUIA.quizResp>=0&&GUIA.quizOk);
  return `<div class="pasos">${ps.map((t,i)=>`<span class="ps ${ok(i)?'ok':(i===GUIA.fase?'on':'')}"><i>${ok(i)?'✓':i+1}</i>${t}</span>`).join('')}</div>
  <div class="retoBox"><div class="rt"><span>${C.no}</span><span>${C.head}</span></div><h3>${C.title}</h3><div class="rq">${C.teach}</div>${C.mandos}<div class="opt" id="actOpt">${C.acts}</div></div>`;
}
/** Repinta la guía tras un cambio de paso, sin perder el foco de nada importante. */
function pasoGuia(){ if(EST.modo==='guia') pintaHUD(); }

/* ---------- los modos ---------- */
function setMode(m,forzar){
  if(!forzar&&(m===EST.modo||EST.autoRunning)) return;
  if(m==='guia'){
    EST.modo='guia'; if(!EST.escMano) EST.esc=1e-5;
    if(!GUIA.iniciado) startReto(); else ponVista(VISTA.actual);
  } else {
    EST.modo='marcha'; EST.falla=null; EST.eps=0; if(!EST.escMano) EST.esc=1e-5; ponVista('conjunto');
    EST.RL=EST.RL; sincronizaMandos();
  }
  document.body.classList.toggle('m-marcha',EST.modo==='marcha'); document.body.classList.toggle('m-guia',EST.modo==='guia');
  pintaHUD(); pintaDockFijo(); pintaBarras();
}
let fbTimer=null;
function feedback(type,title,text,sticky=false){ const f=el('feedback'); f.className='feedback show '+type; el('fbIcon').textContent=type==='good'?'✓':'✕'; el('fbTitle').textContent=title; el('fbText').innerHTML=text; clearTimeout(fbTimer); if(!sticky) fbTimer=setTimeout(()=>f.classList.remove('show'),7000); }
el('fbX').onclick=()=>el('feedback').classList.remove('show');

/* ---------- el recorrido guiado de «En marcha» ---------- */
const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function runAuto(){
  if(EST.autoRunning||EST.modo!=='marcha') return; EST.autoRunning=true; sonido.init();
  const hud=el('hud'), b=el('btnAuto');
  const prev={x:EST.x,g:EST.g,trim:EST.trim,RL:EST.RL,f:EST.f,pausa:EST.pausa,vista:VISTA.actual};
  const lock=()=>{ hud.style.pointerEvents='none'; if(b){ b.disabled=true; b.textContent='Recorrido en curso…'; } };
  try{
    lock(); EST.pausa=false; Object.assign(EST,{g:0.16,trim:0,RL:RL_400,f:BANDA.f0}); muevea({x:0.14},0.6); ponVista('conjunto');
    showToast('Paso 1 · El inversor excita la <b>pad del suelo</b> a 85 kHz. Su campo (las líneas) cruza el aire y llega a la <b>pad del coche</b>. Los símbolos ⊙ y ⊗ cambian de sentido 85 000 veces por segundo; aquí, a cámara lenta.',8200);
    await espera(8600);
    muevea({x:0},1.6); ponVista('bobinas');
    showToast('Paso 2 · Con los ejes alineados <b>k</b> es máximo: más flujo de una pad llega a la otra y hace falta menos corriente para los mismos 11 kW.',7600);
    await espera(8000);
    muevea({x:0.22},2.4);
    showToast('Paso 3 · Al desalinear el coche, <b>k</b> y <b>M</b> bajan: la corriente del primario sube y el rendimiento cae. Mira la curva de η frente a d.',7600);
    await espera(8000);
    muevea({x:0,trim:0.12},1.6); ponVista('pads');
    showToast('Paso 4 · Una bobina <b>desintonizada</b> (C₂ +12 %) devuelve reactiva: cos φ cae y el inversor tiene que dar más tensión para la misma potencia.',7600);
    await espera(8000);
    muevea({trim:0,g:0.10},1.8); ponVista('conjunto');
    showToast('Paso 5 · Con las pads muy cerca (k alto) la potencia a tensión constante se <b>divide</b> en dos picos, a ambos lados de 85 kHz. Mira la respuesta en frecuencia.',8200);
    await espera(8600);
  } finally {
    EST.autoRunning=false; hud.style.pointerEvents=''; muevea({x:prev.x,g:prev.g,trim:prev.trim,RL:prev.RL,f:prev.f},0.8);
    EST.pausa=prev.pausa; pintaHUD(); ponVista(prev.vista); pintaBarras();
  }
}


/* ===================== 17. SONIDO (sintetizado) =====================
   Un zumbido suave que sube con la potencia transferida: un cargador real
   casi no suena (85 kHz está muy por encima del oído); esto es sólo un
   apoyo para seguir el reloj. */
const sonido=(function(){
  let ctx=null,on=true,master=null,osc=null,gain=null,filt=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      osc=ctx.createOscillator(); osc.type='sine'; filt=ctx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=900;
      gain=ctx.createGain(); gain.gain.value=0; osc.connect(filt); filt.connect(gain); gain.connect(master); osc.start();
    }catch(e){ ctx=null; } }
  function actualiza(activo,P){ if(!ctx) return; const t=ctx.currentTime;
    osc.frequency.setTargetAtTime(110+P/110,t,0.08);
    gain.gain.setTargetAtTime(on&&activo?0.018+0.012*Math.min(1,P/11000):0,t,0.12); }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); }
  return {init,actualiza,
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    clac:()=>tono(320,0.06,0.04,'triangle'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; },
    get vol(){ return gain?gain.gain.value:0; }, get freq(){ return osc?osc.frequency.value:0; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});

/* ===================== 18. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.min(devicePixelRatio,alta?2:1.5));
  const ms=alta?2048:1024; if(LUZ.clave.shadow.mapSize.x!==ms){ LUZ.clave.shadow.mapSize.set(ms,ms); if(LUZ.clave.shadow.map){ LUZ.clave.shadow.map.dispose(); LUZ.clave.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  M_PUNTOS.uniforms.uPx.value=innerHeight*renderer.getPixelRatio()/(2*Math.tan(camera.fov*Math.PI/360));
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  M_PUNTOS.uniforms.uPx.value=innerHeight*renderer.getPixelRatio()/(2*Math.tan(camera.fov*Math.PI/360));
  colocaBarras();
  clearTimeout(window.__rzWPT); window.__rzWPT=setTimeout(()=>ponVista(VISTA.actual,0.01),140);
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 19. EL LAZO: UN SOLO RELOJ =====================
   El tiempo simulado avanza dt·escala en cada cuadro, y con ESE tiempo se
   pintan la escena (espiras, símbolos, campo, puntos) y el dock (cursor de
   las corrientes, cifras). */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  pasaTween(dt);
  aplicaEscena(EST.pausa?0:dt*EST.esc,dt,t);
  pasaCam(dt);
  sonido.actualiza(!EST.pausa&&!!SIMU.op,SIMU.op?SIMU.op.P:0);
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaEta(); pintaWf(); pintaFr(); pintaBa(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos();
}

/* ===================== 20. ARRANQUE =====================
   Abre funcionando: el coche desviado 140 mm, la holgura en la clase Z2
   (160 mm), la bobina sin ajustar, 85 kHz, a cámara lenta ×1/100 000. */
disposicion();
aplicaCalidad();
recalcula(true);
pintaHUD();
SIMU.t=0.00031;
pintaDockFijo();
pintaBarras();
ponVista('conjunto',0.001);
cuadro();

      pliego:SIMU.pl.map(c=>c.ok),picos:SIMU.picos.map(p=>p.f),i1:SIMU.i1,i2:SIMU.i2,fase:SIMU.fase,Tobj:SIMU.Tobj,tCalc:SIMU.tCalc}; },

    litzA:+M.litzA.emissive.r.toFixed(3),litzB:+M.litzB.emissive.r.toFixed(3),vehiculo:[+VEH.position.x.toFixed(3),+VEH.position.y.toFixed(3)],objeto:OBJETO.visible}; },
  cam(){ const r=v=>[+v.x.toFixed(3),+v.y.toFixed(3),+v.z.toFixed(3)]; return {pos:r(camera.position),target:r(controls.target),hueco:huecoLibre(),fps:FPS.v}; },
};
window.__test=Object.assign(window.__test||{},{
  start:()=>{ setMode('guia',true); },
