<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.26, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;
    }
    if(hook)hook(dt,t); controls.update();
    if(bokeh) bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);
    composer.render(); }
  function start(){ if(!raf)loop(); }
  function stop(){ cancelAnimationFrame(raf); raf=null; window.removeEventListener('resize',resize); }

  /* Sonda de escena para las auditorías del 3D. No cambia nada de lo que se ve
     y cuelga de `window.__diag3d`, que ningún laboratorio pisa: así CUALQUIER
     laboratorio construido con este molde se puede auditar —salud(), mira(),
     piezas()— sin tocarle una línea. */
  try { instalaDiag(document.title || location.pathname,
    { escena:scene, camara:camera, controles:controls, renderizador:renderer }); } catch(_){}

  return { THREE, renderer, scene, camera, controls, composer, bloom,
    setAnimate:fn=>hook=fn, start, stop, resize, clock,
    flyTo:(v)=>{ controls.target.copy(v); }, moveTo, setCinematicIdle };
}

function pickerFor(scene,camera,dom,onHit){
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(); let down=null;
  dom.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
  dom.addEventListener('pointerup',e=>{
    if(!down)return; const moved=Math.abs(e.clientX-down[0])+Math.abs(e.clientY-down[1])>6; down=null;
    if(moved)return;
    const r=dom.getBoundingClientRect();
    mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(mouse,camera);
    const hits=ray.intersectObjects(scene.children,true);
    onHit(hits[0]||null);
  });
}

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

   cuentavueltas es el instrumento por el que un conductor NOTA un fallo de
   encendido —el ralentí se vuelve irregular y la aguja tiembla—, así que su
   aguja va enganchada al mismo régimen que publica la telemetría, sin inventar
   una lectura aparte. El velocímetro marca cero y así se queda: el motor está
   en marcha, pero el vehículo está parado en el taller. */
function reloj(x,max,paso,etiqueta,rojoDesde){
  const g=new THREE.Group(); g.position.set(x,0.06,0.255); dash.add(g);
  const aro=new THREE.Mesh(new THREE.TorusGeometry(0.32,0.02,10,32), MAT.crank);
  aro.position.z=0.005; g.add(aro);
  const cv=document.createElement('canvas'); cv.width=cv.height=320;
  const tx=new THREE.CanvasTexture(cv); tx.colorSpace=THREE.SRGBColorSpace;
  tx.minFilter=THREE.LinearFilter; tx.generateMipmaps=false;
  const c=cv.getContext('2d'), R=124, cx=160, cy=160, A0=-Math.PI*2/3, A1=Math.PI*2/3;
  c.fillStyle='#0a1210'; c.beginPath(); c.arc(cx,cy,152,0,Math.PI*2); c.fill();
  const n=Math.round(max/paso);
  for(let i=0;i<=n;i++){
    const v=i*paso, t=v/max, a=A0+t*(A1-A0);
    const rojo=rojoDesde!==null&&v>=rojoDesde;
    c.strokeStyle=rojo?'#f4475e':'#cfe6de'; c.lineWidth=i%2===0?6:3;
    const r0=i%2===0?R-22:R-14;
    c.beginPath();
    c.moveTo(cx+Math.sin(a)*r0, cy-Math.cos(a)*r0);
    c.lineTo(cx+Math.sin(a)*R,  cy-Math.cos(a)*R);
    c.stroke();
    if(i%2===0){
      c.fillStyle=rojo?'#f4475e':'#cfe6de'; c.font='bold 30px system-ui';
      c.textAlign='center'; c.textBaseline='middle';
      c.fillText(String(v/(paso>=100?1000:1)), cx+Math.sin(a)*(R-48), cy-Math.cos(a)*(R-48));
    }
  }
  c.fillStyle='#7f9a92'; c.font='600 24px system-ui'; c.textAlign='center';
  c.fillText(etiqueta, cx, cy+86);
  tx.needsUpdate=true;
  const cara=new THREE.Mesh(new THREE.PlaneGeometry(0.62,0.62),
    new THREE.MeshBasicMaterial({map:tx,toneMapped:false}));
  cara.position.z=-0.004; g.add(cara);
  const piv=new THREE.Group(); piv.position.z=0.012; g.add(piv);
  const ag=new THREE.Mesh(new THREE.BoxGeometry(0.016,0.26,0.008),
    std({color:0xf4475e, emissive:0xf4475e, emissiveIntensity:0.6, roughness:0.5}));
  ag.position.y=0.10; piv.add(ag);
  const eje=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,0.02,14), MAT.crank);
  eje.rotation.x=Math.PI/2; eje.position.z=0.016; g.add(eje);
  const fija=v=>{ piv.rotation.z=-(A0+Math.min(1,Math.max(0,v/max))*(A1-A0)); };
  fija(0);
  return {grupo:g, aro, fija};
}

   culata, que no son ninguna pieza del motor. */
const cylMarks=[], cylAros=[];
for(let i=0;i<CYL_N;i++){
  const x=-0.78+i*0.52;
  const pozo=new THREE.Mesh(new THREE.CylinderGeometry(0.105,0.115,0.05,20), MAT.cover);
  pozo.position.set(x,2.005,0); eng.add(pozo);
  const c=P3.bobinaEncendido(MATP,{alto:0.50,d:0.105});
  c.position.set(x,2.03,0); c.rotation.y=Math.PI/2; eng.add(c);
  cylMarks.push(c);
  /* EL ARO DE ESTADO es una ANOTACIÓN del laboratorio, no una pieza: en un
     motor real no hay ningún aro que se encienda al pie de la bobina. Marca en
     qué cilindro está el evento que la telemetría acaba de contar. */
  const aro=new THREE.Mesh(new THREE.TorusGeometry(0.125,0.018,8,26),
    std({color:0x0c1a16, emissive:0x123028, emissiveIntensity:0.25, roughness:0.5, metalness:0.1}));
  aro.rotation.x=Math.PI/2; aro.position.set(x,2.045,0); aro.raycast=()=>{}; eng.add(aro);
  cylAros.push(aro);
  const lb=labelSprite('Bobina cil. '+(i+1),'#8FB3AC'); lb.position.set(x,2.72,0); lb.scale.multiplyScalar(0.6);
  lb.visible=false; lb.raycast=()=>{}; eng.add(lb); HOVER_LABELS.set(c,lb);
}

/* LA RUEDA FÓNICA DEL CIGÜEÑAL, 60−2, y el captador que la lee. Un disco liso
   con una muesca pintada no explicaba nada: lo que el sensor cuenta son los
   DIENTES, y el hueco de dos dientes que falta es la única marca angular del
   eje —la referencia por la que la centralita sabe en qué grado está—. Es
   además el instrumento del que sale todo este laboratorio: el fallo de
   encendido se detecta midiendo cuánto se frena el cigüeñal entre diente y
   diente. Gira sobre su eje, +X, que es el del cigüeñal. */
const crankGroup=new THREE.Group(); crankGroup.position.set(-1.24,0.70,0); eng.add(crankGroup);
const crankDisc=P3.ruedaFonica(MATP,{d:0.62,dientes:60,falta:2,alto:0.045,ancho:0.09});
crankGroup.add(crankDisc);
const cubo=new THREE.Mesh(new THREE.CylinderGeometry(0.10,0.10,0.13,20), MAT.crank);
cubo.rotation.z=Math.PI/2; crankGroup.add(cubo);
/* El hueco de referencia, resaltado por el laboratorio para poder seguirlo con
   la vista: en la rueda real no está iluminado, sencillamente no hay diente. */
const crankNotch=new THREE.Mesh(new THREE.BoxGeometry(0.10,0.055,0.055),
  std({color:0xffd166,emissive:0xffd166,emissiveIntensity:0.5,roughness:0.5}));
const A_HUECO=Math.PI/30;                 // el centro del hueco de dos dientes
crankNotch.position.set(0, 0.288*Math.sin(A_HUECO), -0.288*Math.cos(A_HUECO));
crankGroup.add(crankNotch);
/* EL CAPTADOR, apuntando al borde de la rueda con su entrehierro. */
const ckp=P3.captador(MATP,{d:0.10,largo:0.32});
ckp.position.set(-1.24,1.20,0); eng.add(ckp);
const crankLabel=labelSprite('Rueda fónica 60−2 · sensor CKP','#8FB3AC');
crankLabel.position.set(-1.24,1.55,0); crankLabel.scale.multiplyScalar(0.72);
crankLabel.visible=false; crankLabel.raycast=()=>{}; eng.add(crankLabel);
HOVER_LABELS.set(crankDisc,crankLabel); HOVER_LABELS.set(ckp,crankLabel);

(function(){
  const dom=S.renderer.domElement, ray=new THREE.Raycaster(), m=new THREE.Vector2();
  let shown=null;
  const setShown=lb=>{ if(shown===lb)return; if(shown)shown.visible=false; shown=lb; if(lb)lb.visible=true; };
  dom.addEventListener('pointermove',e=>{
    const r=dom.getBoundingClientRect();
    m.x=((e.clientX-r.left)/r.width)*2-1; m.y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(m,S.camera);
    const hits=ray.intersectObjects(scene.children,true);
    let lb=null;
    if(hits[0]){ let o=hits[0].object; while(o){ if(HOVER_LABELS.has(o)){ lb=HOVER_LABELS.get(o); break; } o=o.parent; } }
    setShown(lb); dom.style.cursor = lb ? 'pointer' : '';
  });
  dom.addEventListener('pointerleave',()=>setShown(null));
})();

let connected=false, mode='01', scenarioKey=SCEN_ORDER[0], cargaAlta=false;
let rpmLive=0, stumbleFactor=1;
let dxSolved={pendiente:false,confirmadoB:false,confirmadoA:false,sintesis:false};

function currentMisfireRate(){
  const cs=CASES[scenarioKey];
  if(scenarioKey==='sintesis') return cargaAlta?cs.misfireRateAlta:cs.misfireRateLigera;
  return cs.misfireRate;
}
function currentLoad(){
  if(scenarioKey==='sintesis') return cargaAlta?85:20;
  return CASES[scenarioKey].loadLive;
}
function currentRpmTarget(){
  if(!connected) return 0;
  if(scenarioKey==='sintesis') return cargaAlta?3400:900;
  return CASES[scenarioKey].rpmBase;
}
function milEffectiveState(){
  if(!connected) return 'off';
  const cs=CASES[scenarioKey];
  if(cs.milState==='dynamic') return cargaAlta?'blink':'solid';
  return cs.milState;
}
function cylinderMisses(i,rate,time){
  if(rate<=0) return false;
  const freq=3+rate*0.15;
  const thresh=1-Math.min(0.9,rate/12);
  return Math.sin(time*freq+i*1.7)>thresh;
}

/* ---------- síntesis: zumbido del motor ---------- */
const synth=makeSynth({type:'sine',type2:'sine',filterFreq:800,Q:1});

/* ============================================================
   ANIMACIÓN
   ============================================================ */
S.setAnimate((dt,time)=>{
  const cs=CASES[scenarioKey];
  const rate=connected?currentMisfireRate():0;
  rpmLive += (currentRpmTarget()-rpmLive)*Math.min(1,dt*3);
  const jit=connected?(Math.sin(time*13.3)+Math.sin(time*7.7))*0.5*(rate*3+4):0;

  const clock=(time*6)%CYL_N|0;
  let anyMiss=false;
  cylMarks.forEach((cyl,i)=>{
    let fire=(i===clock)&&connected;
    let miss=false;
    if(connected&&rate>0){
      const targetIdx=cs.cylAffected;
      if(targetIdx===null||targetIdx===undefined||targetIdx===i) miss=cylinderMisses(i,rate,time);
    }
    if(miss&&i===clock){ fire=false; anyMiss=true; }
    const am=cylAros[i].material;
    am.emissive.setHex(miss?0xf4475e:(fire?0x2A9D8F:0x102a24));
    am.emissiveIntensity=miss?0.95:(fire?0.9:0.25);
  });
  stumbleFactor += ((anyMiss?0.3:1)-stumbleFactor)*Math.min(1,dt*10);
  const angSpeed=connected?(rpmLive/60)*2*Math.PI*0.35:0;
  crankGroup.rotation.x += dt*angSpeed*stumbleFactor;   // el cigüeñal gira sobre +X
  crankNotch.material.emissiveIntensity=0.35+(anyMiss?0.5:0);

  const st=milEffectiveState();
  let milI=0;
  if(st==='solid') milI=0.85;
  else if(st==='blink') milI=(Math.sin(time*2*Math.PI*2)>0)?1.0:0.08;
  milMat.emissiveIntensity += (milI-milMat.emissiveIntensity)*Math.min(1,dt*20);
  milGlyphMat.opacity = 0.09+0.91*Math.min(1,milMat.emissiveIntensity/0.85);
  tacometro.fija(connected?rpmLive+jit:0);

  if(connected) updateTele(rpmLive+jit);
  if(time-(drawToolScreen._t||0)>0.22){ drawToolScreen(rpmLive+jit); drawToolScreen._t=time; }

  if(connected){
    const hum=46+rpmLive/60;
    synth.update(hum,hum*1.5,0.006+(anyMiss?0.01:0),650+rpmLive*0.06);
  } else synth.update(0,0,0);
});
S.start();

  }else if(mode==='03'){
    if(cs.confirmedDTC){
      const st=milEffectiveState();
      const reveal=dxSolved[scenarioKey];
      const milTxt = st==='blink' ? (reveal?'<span style="color:var(--bad)">PARPADEANDO (Tipo A · riesgo para el catalizador)</span>':'<span style="color:var(--bad)">PARPADEANDO</span>')
                   : st==='solid' ? (reveal?'<span style="color:var(--hv)">FIJA / continua (Tipo B · umbral de emisiones)</span>':'<span style="color:var(--hv)">FIJA / continua</span>')
                   : 'apagada';
      consoleEl.innerHTML=`<b>Modo $03 · Códigos confirmados</b><br><span class="dtc">${cs.confirmedDTC[0]}</span> <span class="mono">${cs.confirmedDTC[1]}</span><br><span class="mono">MIL: </span>${milTxt}`;
    }else{
      consoleEl.innerHTML=`<b>Modo $03 · Códigos confirmados</b><br><span class="ok mono">Sin códigos confirmados todavía.</span>`;
    }
  }else if(mode==='02'){
    if(!cs.freeze){
      consoleEl.innerHTML=`<b>Modo $02 · Cuadro congelado</b><br><span class="mono">Sin cuadro: aún no hay un código confirmado que lo dispare.</span>`;
    }else{
      const f=cs.freeze;
      consoleEl.innerHTML=`<b>Modo $02 · Cuadro congelado</b> <span class="mono">(al momento del evento que confirmó el código)</span><br>`+
        `<span class="mono">RPM ${f.rpm} · Carga ${f.carga}% · Vel ${f.vel} km/h · ECT ${f.ect}°C</span>`;
    }
  }
}

function updateTele(rpmShown){
  const cs=CASES[scenarioKey];
  const rate=currentMisfireRate();
  el('t_rpm').textContent=Math.round(rpmShown)+' rpm';
  el('t_load').textContent=tf(currentLoad())+' %';
  const rB=el('t_rate'); rB.textContent=rate.toFixed(1)+' %'; rB.className=rate>5?'bad':rate>1?'warn':'good';
  el('t_cyl').textContent=(cs.cylAffected===null||cs.cylAffected===undefined)?'aleatorio / múltiple':('cilindro '+(cs.cylAffected+1)+' (marcado)');
  const mB=el('t_mon'); mB.textContent=cs.monitorComplete?'completo':'incompleto'; mB.className=cs.monitorComplete?'good':'warn';
  const st=milEffectiveState();
  const milB=el('t_mil'); milB.textContent=st==='blink'?'parpadeando':st==='solid'?'fija (continua)':'apagada';
  milB.className=st==='blink'?'bad':st==='solid'?'warn':'good';
}

function wrapText(ctx,text,x,y,maxW,lh){
  const words=text.split(' '); let line='',yy=y;
  for(const w of words){
    const test=line+w+' ';
    if(ctx.measureText(test).width>maxW&&line){ ctx.fillText(line,x,yy); line=w+' '; yy+=lh; }
    else line=test;
  }
  ctx.fillText(line,x,yy);
}

function drawToolScreen(rpmShown){
  const c=scrCanvas.getContext('2d');
  c.fillStyle='#04120e'; c.fillRect(0,0,320,384);
  c.strokeStyle='rgba(79,209,197,.4)'; c.lineWidth=2; c.strokeRect(6,6,308,372);
  c.fillStyle='#4FD1C5'; c.font='bold 22px Outfit, sans-serif'; c.textAlign='left';
  c.fillText('CEN · Fallo de encendido',18,36);
  c.font='14px Outfit, sans-serif'; c.fillStyle='#8FB3AC';
  if(!connected){ c.fillText('DESCONECTADO',18,84); c.fillText('Energiza el sistema',18,110); scrTex.needsUpdate=true; return; }
  const cs=CASES[scenarioKey];
  c.fillText('Modo $'+mode+'  ·  '+SCEN_LABEL[scenarioKey],18,64);
  if(mode==='01'){
    c.fillStyle='#EAF4F1'; c.font='bold 30px Outfit, sans-serif';
    c.fillText(Math.round(rpmShown)+' rpm',18,126);
    const rate=currentMisfireRate();
    c.font='15px Outfit, sans-serif'; c.fillStyle=rate>5?'#f4475e':rate>1?'#FFB703':'#34d399';
    c.fillText('Tasa de fallos ≈ '+rate.toFixed(1)+' %',18,158);
    c.fillStyle='#8FB3AC'; c.fillText('Monitor: '+(cs.monitorComplete?'completo':'incompleto'),18,184);
  }else if(mode==='07'){
    c.fillStyle=cs.pendingDTC?'#FFB703':'#34d399'; c.font='bold 20px Outfit, sans-serif';
    c.fillText(cs.pendingDTC?cs.pendingDTC[0]:'Sin pendientes',18,122);
    c.font='13px Outfit, sans-serif'; c.fillStyle='#8FB3AC';
    if(cs.pendingDTC) wrapText(c,cs.pendingDTC[1],18,150,282,17);
  }else if(mode==='03'){
    c.fillStyle=cs.confirmedDTC?'#f4475e':'#34d399'; c.font='bold 20px Outfit, sans-serif';
    c.fillText(cs.confirmedDTC?cs.confirmedDTC[0]:'Sin confirmados',18,122);
    c.font='13px Outfit, sans-serif'; c.fillStyle='#8FB3AC';
    if(cs.confirmedDTC) wrapText(c,cs.confirmedDTC[1],18,150,282,17);
    const st=milEffectiveState();
    c.fillStyle=st==='blink'?'#f4475e':st==='solid'?'#FFB703':'#5b6f6a';
    c.font='bold 15px Outfit, sans-serif';
    c.fillText('MIL: '+(st==='blink'?'PARPADEANDO':st==='solid'?'FIJA':'apagada'),18,204);
  }else if(mode==='02'){
    if(!cs.freeze){ c.fillStyle='#8FB3AC'; c.fillText('Sin cuadro disponible',18,122); }
    else{
      const f=cs.freeze;
      c.fillStyle='#EAF4F1'; c.font='15px Outfit, sans-serif';
      c.fillText('RPM '+f.rpm,18,112); c.fillText('Carga '+f.carga+' %',18,138);
      c.fillText('Vel '+f.vel+' km/h',18,164); c.fillText('ECT '+f.ect+' °C',18,190);
    }
  }
  scrTex.needsUpdate=true;
}

/* ---------- pregunta diagnóstica ---------- */
function shuffled(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function renderQuestion(){
  const q=QUESTIONS[scenarioKey];
  el('q_prompt').textContent=q.prompt;
  const wrap=el('dxWrap'); wrap.innerHTML='';
  const opts=shuffled(q.opts);
  opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='b dx'; b.dataset.i=String(i); b.dataset.ok=o.ok?'1':'0';
    b.textContent=String.fromCharCode(65+i)+' · '+o.t;
    wrap.appendChild(b);
  });
  wireDx();
}
function wireDx(){
  document.querySelectorAll('#dxWrap .b.dx').forEach(btn=>{
    btn.onclick=()=>{
      if(!connected){ showToast('Primero energiza el sistema.'); return; }
      clearDx();
      if(btn.dataset.ok==='1'){
        btn.classList.add('right'); synth.beep(1046,0.12,0.06);
        dxSolved[scenarioKey]=true; setConsole();
        showToast(`<span style="color:var(--good)">✔ Correcto.</span><br><span style="color:var(--dim);font-size:11px">${DX_HINT[scenarioKey]}</span>`);
      }else{
        btn.classList.add('wrong'); synth.beep(220,0.15,0.06);
        showToast(`<span style="color:var(--bad)">✗ Revisa la evidencia en el escáner.</span>`);
      }
    };
  });
}
function clearDx(){ document.querySelectorAll('#dxWrap .b.dx').forEach(b=>b.classList.remove('right','wrong')); }

/* ---------- interacción ---------- */
function setScenario(key){
  scenarioKey=key;
  mode='01';
  ['01','07','03','02'].forEach(id=>el('m'+id).classList.toggle('on',id==='01'));
  SCEN_ORDER.forEach(k=>el('s_'+k).classList.toggle('on',k===key));
  el('ctrlSintesis').style.display=(key==='sintesis')?'':'none';
  if(key==='sintesis'){ cargaAlta=false; el('c_ligera').classList.add('on'); el('c_alta').classList.remove('on'); }
  el('p_case').textContent='Caso '+(SCEN_ORDER.indexOf(key)+1)+'/4 · '+SCEN_LABEL[key];
  renderQuestion(); clearDx(); setConsole();
}
function setMode(m){
  mode=m;
  ['01','07','03','02'].forEach(id=>el('m'+id).classList.toggle('on',id===m));
  setConsole();
}
SCEN_ORDER.forEach(k=>{ el('s_'+k).onclick=()=>setScenario(k); });
el('m01').onclick=()=>setMode('01');
el('m07').onclick=()=>setMode('07');
el('m03').onclick=()=>setMode('03');
el('m02').onclick=()=>setMode('02');

el('c_ligera').onclick=()=>{ cargaAlta=false; el('c_ligera').classList.add('on'); el('c_alta').classList.remove('on'); setConsole(); };
el('c_alta').onclick=()=>{ cargaAlta=true; el('c_alta').classList.add('on'); el('c_ligera').classList.remove('on'); setConsole(); };

el('btnEnergize').onclick=(e)=>{
  connected=!connected;
  synth.init(); synth.resume();
  e.target.classList.toggle('on',connected);
  e.target.textContent=connected?'🔌 Desconectar':'🔌 Conectar escáner';
  if(connected){ S.moveTo([3.6,2.4,5.4],[-0.5,1.25,0.3],1.3); S.setCinematicIdle(true); synth.beep(880,0.1,0.06); }
  else{ S.setCinematicIdle(false); ['t_rpm','t_load','t_rate','t_cyl','t_mon','t_mil'].forEach(id=>{el(id).textContent='—';el(id).className='';}); }
  setConsole();
};

el('btnNext').onclick=()=>{
  const i=(SCEN_ORDER.indexOf(scenarioKey)+1)%SCEN_ORDER.length;
  setScenario(SCEN_ORDER[i]);
  showToast('🔀 Nuevo caso cargado.');
};

const soundBtn=document.getElementById('soundBtn');
soundBtn.onclick=()=>{const on=synth.toggle();soundBtn.textContent=on?'🔊':'🔇';soundBtn.classList.toggle('on',on);};

/* ---------- Modo automático (guiado) ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let autoRunning=false;
async function runAuto(){
  if(autoRunning) return;
  autoRunning=true;
  const btn=el('btnAuto'); const label=btn.textContent;
  btn.disabled=true; btn.classList.add('on'); btn.textContent='⏳ Demostración en curso…';
  try{
    if(!connected){ showToast('Paso 1 · Energizamos el sistema.'); el('btnEnergize').click(); await sleep(1500); }

    setScenario('pendiente'); setMode('07');
    showToast('Paso 2 · Caso 1: un código PENDIENTE nace de una sola detección — el MIL sigue apagado.'); await sleep(2600);
    document.querySelector('#dxWrap .b.dx[data-ok="1"]').click(); await sleep(2200);

    setScenario('confirmadoB'); setMode('03');
    showToast('Paso 3 · Caso 2: se repitió el fallo ⇒ código CONFIRMADO. Cruza el umbral de emisiones pero no el de catalizador: MIL fija.'); await sleep(2800);
    document.querySelector('#dxWrap .b.dx[data-ok="1"]').click(); await sleep(2200);

    setScenario('confirmadoA'); setMode('03');
    showToast('Paso 4 · Caso 3: la mayoría de los eventos vienen del cilindro 2 ⇒ P0302. Tasa alta ⇒ MIL PARPADEANTE.'); await sleep(2800);
    document.querySelector('#dxWrap .b.dx[data-ok="1"]').click(); await sleep(2200);

    setScenario('sintesis'); setMode('03'); el('c_ligera').click();
    showToast('Paso 5 · Caso 4: en carga ligera el código ya confirmado mantiene el MIL fija.'); await sleep(2400);
    el('c_alta').click();
    showToast('Paso 6 · Al acelerar fuerte, la tasa de fallos actual cruza el umbral del catalizador: el MIL empieza a PARPADEAR en tiempo real.'); await sleep(2800);
    document.querySelector('#dxWrap .b.dx[data-ok="1"]').click(); await sleep(2000);

    showToast('✔ Demostración completa. Recorre los 4 casos libremente con los modos $01/$07/$03/$02.');
  }finally{
    btn.disabled=false; btn.classList.remove('on'); btn.textContent=label;
    autoRunning=false;
  }
}
el('btnAuto').onclick=runAuto;

setScenario(SCEN_ORDER[0]);
