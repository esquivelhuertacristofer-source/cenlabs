<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Diferencial y Reparto de Par — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#0A100F;--panel:rgba(9,17,18,.88);--line:#1D3436;--ink:#EEF4F2;
    --dim:#92B3AE;--accent:#2DD4BF;--accent2:#7BEBDB;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cF:#4CC9F0;--cR:#FFB347;--cE:#FF6B3D;--cG:#C8D6E2;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#13211f;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#183029}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#04130f;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#04130f;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#5eead4}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#04130f}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#5eead4;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f8a85;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f948f;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#04211c}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#09130f;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(27,51,71,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(27,51,71,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg .fl i{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}.cl-L{background:var(--cF)}.cl-R{background:var(--cR)}
  .hgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px 11px}
  .hgrid .cl{font-size:9.5px}.hgrid .cl b{font-size:12px}
  .cg.off{opacity:.4;pointer-events:none}
  .cg .cl em{color:#7d9792}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f8a85}
  .dk-tit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{flex-shrink:0;letter-spacing:0;text-transform:none;font-size:11px;color:#9fbab4;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(27,51,71,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c9c4;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#13211f;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfe0dc;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,20,30,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,17,18,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d6d2}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,22,24,.92);border:1px solid rgba(94,234,212,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,22,24,.84);border:1px solid rgba(94,234,212,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:11px 14px 9px}.hud h2{font-size:16.5px}.hud .intro{font-size:12px;line-height:1.4} .fg b{font-size:14px} .fg{padding:2px 7px} .cg input[type=range]{height:14px} .dk-row{min-height:96px} .dk-g.sp{min-height:84px} .modebar .b{padding:5px 4px} .seg .b{padding:5px 2px} .b.auto{padding:7px 8px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}
  body.estrecho.ancho.t-panel .panel>.dk-fig{grid-column:1;grid-row:2}
  body.estrecho.ancho.t-panel .panel>.dk-row{grid-column:1;grid-row:3/6;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-fu{grid-column:2;grid-row:2;align-self:start}
  body.estrecho.ancho.t-panel .panel>.dk-g.fu{grid-column:2;grid-row:2/4;min-height:0;margin-top:18px}
  body.estrecho.ancho.t-panel .panel>.dk-ley{display:none}
  body.estrecho.ancho.t-panel .panel>.t-sp{grid-column:2;grid-row:4}
  body.estrecho.ancho.t-panel .panel>.dk-g.sp{grid-column:2;grid-row:5;min-height:0}
  body.estrecho.ancho.t-panel .panel>.dk-aviso{display:none}
  body.estrecho .hud details>.cuerpo{max-height:24vh}
  body.estrecho.ancho.t-hud .hud{display:grid;grid-template-columns:1fr 1.05fr;column-gap:14px;row-gap:7px;align-content:start;grid-auto-flow:row dense}
  body.estrecho.ancho .hud>.hcab,body.estrecho.ancho .hud>.modebar,body.estrecho.ancho .hud>.hdet,body.estrecho.ancho .hud>.pasos{grid-column:1}
  body.estrecho.ancho .hud>.hmandos,body.estrecho.ancho .hud>.retoBox{grid-column:2;grid-row:1/span 4}
  body.estrecho .hdet{flex-direction:row}body.estrecho .hdet>details{flex:1;min-width:0}
  body.estrecho .hdet details[open]{position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 54px);z-index:25;background:rgba(9,17,18,.97)}
  body.movil .lt{display:none} body.movil .tbar .modo,body.movil .tbar .reloj{display:none}
  body.movil .tbar{gap:6px;padding:5px 8px} body.movil .tbar .est{min-width:0}
  body.movil .dk-ley{display:none} body.movil .fg b{font-size:13.5px} body.movil .fg .fl{font-size:9.5px}
  body.movil .dk-g.fu{min-height:80px} body.movil .dk-g.sp{min-height:84px} body.movil .dk-row{min-height:112px} body.movil .dk-aviso{display:none}
  body.movil .hud h2{font-size:15.5px} body.movil .hud .intro{font-size:11.8px;line-height:1.42}
  body.estrecho .hud{overflow-y:auto}
  body.estrecho .vbar [data-t="rot"],body.estrecho .vbar .sep.s1{display:none}
  body.estrecho.ancho .vbar{top:60px}
  body.movil .vbar{flex-wrap:nowrap;gap:3px;padding:3px 4px;top:54px} body.movil .vbar .sep{display:none} body.movil .vbar .b.sm{padding:5px 7px;font-size:11px}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   LAB — DIFERENCIAL Y REPARTO DE PAR EN CURVA
   (Dinámica del vehículo · mecanica-138)

   El eje trasero de un coche en una curva a la izquierda, con el diferencial en
   corte: corona de 39 dientes, piñón de 10, caja con sus dos satélites y los dos
   planetarios, todos cónicos con los dientes que dicen los números. Las dos
   ruedas están sobre un suelo dividido (hielo en un lado). El bloque de física
   —que un script de Node extrae TAL CUAL y verifica— da la cinemática
   (ω_L + ω_R = 2·ω_caja), el reparto de par de un abierto, un autoblocante
   (TBR) y una vectorización, el círculo de fricción de cada neumático, el momento
   de guiñada ΔM = (T_R − T_L)·t/(2r) y el balance de potencia.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO=' ';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }



/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos
   marcas— y lo prueba: lo que se prueba es lo que corre.

   Eje trasero de un coche de tracción trasera que toma una curva a la IZQUIERDA.
   El diferencial es el de engranajes cónicos: la caja (portasatélites) lleva a los
   satélites y éstos engranan con los dos planetarios, uno por semieje. Cinemática
   (Willis con la caja como brazo): ω_L + ω_R = 2·ω_caja. Estática: el par de
   entrada en la caja es T_L + T_R. Con la caja libre, T_L = T_R (abierto); con
   rozamiento interno o embragues, el par se desplaza hacia una rueda (autoblocante
   con relación de par TBR, vectorización electrónica con un embrague de capacidad
   ΔT_max). Cada rueda sólo transmite lo que le deja su círculo de fricción μ·N, y la
   fuerza lateral de la curva se come parte de él. Régimen casi estacionario: V y R
   los fija el alumno; la aceleración que resulta se informa y mueve la carga entre ejes. */

/* FISICA:INICIO */
const DOSPI=2*Math.PI, G=9.80665, RAD=Math.PI/180;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const suave=t=>{ t=clamp(t,0,1); return t*t*(3-2*t); };

/* ---------- 1.1 El coche ----------
   aF: distancia del centro de masa al eje delantero; el eje trasero soporta m·g·aF/L.
   h: altura del centro de masa. t: vía. rw: radio bajo carga del neumático.
   Tmax: par máximo que llega a la caja del diferencial (motor × caja de cambios × grupo). */
const VEH={ m:1450, L:2.60, aF:1.30, h:0.52, t:1.55, rw:0.31, Iz:2100, ifin:3.9,
  Crr:0.012, Cd:0.30, A:2.0, rho:1.225, Tmax:2200, muHi:0.90 };
/* Neumático: curva fuerza–patinamiento con pico en sp (F = Fmáx·2x/(1+x²), x = s/sp). */
const TIRE={ sp:0.12, kPico:2.5 };
const OMEGA0=0.5;                                   // rad/s: la diferencia de velocidad a la que el rozamiento interno ya está «agarrado»
const MODOS=['abierto','tbr','vector'];
const NOMBRE_MODO={ abierto:'Abierto', tbr:'Autoblocante (TBR)', vector:'Vectorización' };

/* ---------- 1.2 Cinemática del diferencial en la curva ----------
   R: radio de la trayectoria del punto medio del eje (Infinity: recta).
   L = rueda izquierda (interior), R = derecha (exterior). */
function cinematica(V,R,t=VEH.t,rw=VEH.rw){
  const k=isFinite(R)?t/(2*R):0;
  const wL=V*(1-k)/rw, wR=V*(1+k)/rw, wc=V/rw;
  return { V, R, wL, wR, wc, dw:wR-wL, yaw:isFinite(R)?V/R:0, ay:isFinite(R)?V*V/R:0, vL:V*(1-k), vR:V*(1+k) };
}
const rpm=w=>w*60/DOSPI;

/* ---------- 1.3 Cargas verticales y círculos de fricción ----------
   ax: aceleración longitudinal. La carga se transfiere hacia atrás al acelerar
   (m·ax·h/L) y, en la curva, hacia la rueda exterior (F_y,eje·h/t). */
function cargas(V,R,ax,muL,muR){
  const ay=isFinite(R)?V*V/R:0, phiR=VEH.aF/VEH.L;
  const Nr=Math.max(0,VEH.m*G*phiR+VEH.m*ax*VEH.h/VEH.L);
  const Fy=VEH.m*ay*phiR, dN=Fy*VEH.h/VEH.t;
  const NL=Math.max(0,Nr/2-dN), NR=Math.max(0,Nr/2+dN);
  const capL=muL*NL, capR=muR*NR, capSum=capL+capR;
  const desliza=Fy>capSum;
  const f=capSum>0?Math.min(1,Fy/capSum):1;                    // la fuerza lateral se reparte en proporción a lo que cada rueda puede dar
  const FyL=capL*f, FyR=capR*f;
  const xL=Math.sqrt(Math.max(0,capL*capL-FyL*FyL)), xR=Math.sqrt(Math.max(0,capR*capR-FyR*FyR));
  return { ay, Nr, Fy, dN, NL, NR, capL, capR, FyL, FyR, xL, xR, desliza };
}

/* ---------- 1.4 El reparto de par ----------
   Tc: par pedido en la caja [N·m]. capL, capR: par máximo que cada rueda puede transmitir
   (fuerza longitudinal disponible × rw). Devuelve el par que SÍ pasa a cada rueda.
   - abierto: T_L = T_R; manda la rueda que menos agarra.
   - tbr: el rozamiento interno empuja el par hacia la rueda LENTA hasta T_lenta/T_rápida = TBR;
     en la curva la lenta es la interior; si una rueda patina pasa a ser la rápida y la otra recibe
     hasta TBR veces su par.
   - vector: el embrague mueve hasta ΔT_max de una rueda a la otra: ayuda de guiñada hacia la exterior
     (proporcional a la aceleración lateral, saturada a 0,6 g) y, si una rueda llega a su límite,
     prioridad a la tracción: el par que ella no puede dar pasa a la otra. */
function reparto(modo,Tc,capL,capR,cin,P){
  const kap=Math.max(1,P.kappa||1), dT=Math.max(0,P.dTmax||0);
  Tc=Math.max(0,Tc);
  let TL=Tc/2, TR=Tc/2;
  if(modo==='tbr'){
    const lam=(kap-1)/(kap+1)*Math.tanh(cin.dw/OMEGA0);
    TL=Tc/2*(1+lam); TR=Tc/2*(1-lam);
  } else if(modo==='vector'){
    const d=Math.min(Tc,dT*Math.min(1,cin.ay/(0.6*G)));
    TL=Tc/2-d/2; TR=Tc/2+d/2;
  }
  const sobreL=TL>capL, sobreR=TR>capR;
  if(sobreL||sobreR){
    if(modo==='vector'){
      if(sobreL&&sobreR){
        if(capL<=capR){ TL=Math.min(capL,Tc); TR=Math.min(capR,Math.max(0,Tc-TL),TL+dT); }
        else { TR=Math.min(capR,Tc); TL=Math.min(capL,Math.max(0,Tc-TR),TR+dT); }
      }
      else if(sobreR){ TR=capR; TL=Math.min(capL,Math.max(0,Tc-TR),TR+dT); }
      else { TL=capL; TR=Math.min(capR,Math.max(0,Tc-TL),TL+dT); }
    } else {
      const k=modo==='tbr'?kap:1;
      if(capL<=capR){ TL=Math.min(capL,Tc); TR=Math.min(k*TL,capR,Math.max(0,Tc-TL)); }
      else { TR=Math.min(capR,Tc); TL=Math.min(k*TR,capL,Math.max(0,Tc-TR)); }
    }
  }
  return { TL, TR };
}
/** Patinamiento de una rueda: del cociente par/capacidad por la inversa de la curva F(s); si el par pedido no cabe, patina más allá del pico. */
function patinamiento(rho,exceso){
  const sp=TIRE.sp;
  if(exceso>0.002) return sp*(1+TIRE.kPico*clamp(exceso,0,1));
  const r=clamp(rho,0,1); if(r<1e-9) return 0;
  return sp*(1-Math.sqrt(1-r*r))/r;
}

/* ---------- 1.5 Todo junto: un punto de operación ----------
   p: {modo,kappa,dTmax,V,R,hielo:'L'|'R',mulo,muhi,acel}. Itera la carga porque la aceleración depende de
   la tracción y la tracción de la carga. */
function evalua(p){
  const V=p.V, R=p.R===undefined?Infinity:p.R, muhi=p.muhi===undefined?VEH.muHi:p.muhi;
  const muL=p.hielo==='L'?p.mulo:muhi, muR=p.hielo==='R'?p.mulo:muhi;
  const cin=cinematica(V,R), Tdem=clamp(p.acel,0,1)*VEH.Tmax;
  const res=VEH.Crr*VEH.m*G+0.5*VEH.rho*VEH.Cd*VEH.A*V*V;
  let ax=0, c=null, rp=null, it=0;
  for(;it<60;it++){
    c=cargas(V,R,ax,muL,muR);
    rp=reparto(p.modo,Tdem,c.xL*VEH.rw,c.xR*VEH.rw,cin,p);
    const Fx=(rp.TL+rp.TR)/VEH.rw, axN=(Fx-res)/VEH.m;
    if(Math.abs(axN-ax)<1e-10){ ax=axN; break; }
    ax=0.5*ax+0.5*axN;
  }
  c=cargas(V,R,ax,muL,muR);
  rp=reparto(p.modo,Tdem,c.xL*VEH.rw,c.xR*VEH.rw,cin,p);
  const { TL, TR }=rp, Tc=TL+TR, exceso=Tdem>0?(Tdem-Tc)/Tdem:0;
  const FL=TL/VEH.rw, FR=TR/VEH.rw, Fx=FL+FR, axF=(Fx-res)/VEH.m;
  const rhoL=c.xL>0?clamp(FL/c.xL,0,1):1, rhoR=c.xR>0?clamp(FR/c.xR,0,1):1;
  const lim=(T,cap)=>cap>0?T>=cap*(1-1e-9):Tdem>0;
  const satL=lim(TL,c.xL*VEH.rw)&&exceso>0.002, satR=lim(TR,c.xR*VEH.rw)&&exceso>0.002;
  let sL=patinamiento(rhoL,satL?exceso:0), sR=patinamiento(rhoR,satR?exceso:0);
  /* En un diferencial pasivo el par sólo puede ir hacia la rueda LENTA: la que recibe menos par es la más rápida
     (la que patina). Si el patinamiento calculado no lo cumple, esa rueda gira un 2 % más rápido que la otra. */
  if(p.modo!=='vector'){
    if(TL<TR-1e-6) sL=Math.max(sL,cin.wR*(1+sR)*1.02/cin.wL-1);
    else if(TR<TL-1e-6) sR=Math.max(sR,cin.wL*(1+sL)*1.02/cin.wR-1);
  }
  const wL=cin.wL*(1+sL), wR=cin.wR*(1+sR), wc=(wL+wR)/2;
  const dM=(FR-FL)*VEH.t/2;                                    // momento de guiñada de la tracción; + = hacia dentro de la curva
  const Pc=Tc*wc, Prueda=TL*wL+TR*wR, Pdif=Pc-Prueda;
  const util=(F,Fy,cap)=>cap>0?Math.hypot(F,Fy)/cap:(F>0?9:0);
  return { p, cin, Tdem, TL, TR, Tc, exceso, FL, FR, Fx, res, ax:axF, axIter:ax, it, c, dM, alfa:dM/VEH.Iz,
    sL, sR, wL, wR, wc, wpinon:wc*VEH.ifin, satL, satR, rhoL, rhoR,
    uL:util(FL,c.FyL,c.capL), uR:util(FR,c.FyR,c.capR), Pc, Prueda, Pdif, Fmax:c.xL+c.xR,
    muL, muR };
}
/* Tracción total frente al μ del lado bajo, para el modo dado (curvas del dock). */
function barridoMu(p,n=36){
  const r=[]; for(let i=0;i<=n;i++){ const mu=0.05+0.90*i/n; const e=evalua(Object.assign({},p,{mulo:mu})); r.push([mu,e.Fx,e.dM]); } return r;
}

/* ---------- 1.6 El reto: tracción sin sacudir la guiñada ----------
   Hielo en un lado, una curva, el acelerador a fondo de la salida. Hay que cumplir A LA VEZ:
   la tracción mínima y un momento de guiñada máximo. La solución es una VENTANA interior del mando
   (ni el abierto, que no tracciona, ni el bloqueo más agresivo, que tira del coche). */
const K_MIN=1.0, K_MAX=6.0, DT_MAX=1500;
function ventana(sc,modo){
  const par=modo==='tbr'?'kappa':'dTmax', a=modo==='tbr'?K_MIN:0, b=modo==='tbr'?K_MAX:DT_MAX, n=modo==='tbr'?250:300;
  const ok=[]; for(let i=0;i<=n;i++){ const v=a+(b-a)*i/n; const e=evalua(Object.assign({},sc.base,{modo,[par]:v}));
    if(e.Fx>=sc.Freq&&Math.abs(e.dM)<=sc.Mmax) ok.push(v); }
  return ok.length?[ok[0],ok[ok.length-1]]:null;
}
function evaluaReto(sc,modo,v){
  const par=modo==='tbr'?{kappa:v}:modo==='vector'?{dTmax:v}:{};
  const e=evalua(Object.assign({},sc.base,{modo},par));
  return { e, Fx:e.Fx, dM:e.dM, okF:e.Fx>=sc.Freq, okM:Math.abs(e.dM)<=sc.Mmax };
}
function generaReto(rnd){
  const pick=a=>a[Math.floor(rnd()*a.length)];
  for(let intento=0;intento<400;intento++){
    const R=pick([18,22,26,30,36]), ay=pick([2.4,3.0,3.6,4.2]), V=Math.sqrt(ay*R);
    const hielo=pick(['L','R']), mulo=pick([0.12,0.16,0.20,0.25]), acel=pick([0.7,0.8,0.9,1.0]);
    const base={ V, R, hielo, mulo, muhi:VEH.muHi, acel };
    const kStar=2.2+rnd()*2.2;
    const e0=evalua(Object.assign({},base,{modo:'abierto'}));
    const eA=evalua(Object.assign({},base,{modo:'tbr',kappa:kStar-0.5})), eB=evalua(Object.assign({},base,{modo:'tbr',kappa:kStar+0.6}));
    const eT=evalua(Object.assign({},base,{modo:'tbr',kappa:K_MAX})), eC=evalua(Object.assign({},base,{modo:'tbr',kappa:kStar}));
    const Freq=Math.round(eA.Fx/10)*10+10, Mmax=Math.ceil(Math.abs(eB.dM)/10)*10;
    if(!(eA.Fx>e0.Fx*1.12&&eT.Fx>eB.Fx*1.04&&Math.abs(eT.dM)>Mmax*1.10&&Math.abs(e0.dM)<Mmax&&e0.Fx<Freq*0.9)) continue;
    const sc={ base, Freq, Mmax, kStar, V:V*3.6, R, hielo, mulo, acel };
    const w=ventana(sc,'tbr'); if(!w||w[1]-w[0]<0.5||w[0]<K_MIN+0.25||w[1]>K_MAX-0.6) continue;
    sc.wTbr=w; sc.wVec=ventana(sc,'vector'); sc.e0=e0;
    return sc;
  }
  return null;
}

const DOSPI_=Math.PI*2;
function ruidoPeriodico(semilla,periodo){
  const g=(x,y)=>{ x=((x%periodo)+periodo)%periodo; y=((y%periodo)+periodo)%periodo;
    const s=Math.sin(x*127.1+y*311.7+semilla*13.13)*43758.5453; return s-Math.floor(s); };
  return (x,y)=>{ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    return g(xi,yi)*(1-u)*(1-v)+g(xi+1,yi)*u*(1-v)+g(xi,yi+1)*(1-u)*v+g(xi+1,yi+1)*u*v; };
}
function fbmP(semilla,periodo,oct){ const ns=[]; for(let o=0;o<oct;o++) ns.push(ruidoPeriodico(semilla+o*7,periodo*(1<<o)));
  return (x,y)=>{ let v=0,a=0.5; for(let o=0;o<oct;o++){ v+=ns[o](x*(1<<o),y*(1<<o))*a; a*=0.5; } return v; }; }

/** Dibuja un trazo que sale por un borde y vuelve a entrar por el otro: la textura repite sin costura. */
function trazoP(x,W,H,pts,estilo,ancho){
  x.strokeStyle=estilo; x.lineWidth=ancho; x.lineCap='round'; x.lineJoin='round';
  for(const dx of [-W,0,W]) for(const dy of [-H,0,H]){ x.beginPath(); pts.forEach((p,i)=>i?x.lineTo(p[0]+dx,p[1]+dy):x.moveTo(p[0]+dx,p[1]+dy)); x.stroke(); }
}
function andar(x0,y0,n,paso,giro){ const p=[[x0,y0]]; let a=alea()*DOSPI_; for(let i=0;i<n;i++){ a+=(alea()-0.5)*giro; p.push([p[i][0]+Math.cos(a)*paso,p[i][1]+Math.sin(a)*paso]); } return p; }

function texAsfalto(){
  const W=512,c=cv(W),x=c.getContext('2d'),im=x.createImageData(W,W),f=fbmP(5,3,3),f2=fbmP(17,2,2);
  for(let j=0;j<W;j++) for(let i=0;i<W;i++){ const n=f(i/W*3,j/W*3), m=f2(i/W*2,j/W*2), o=(j*W+i)*4, v=(0.70+(n-0.5)*0.34)*255, ac=(m-0.5)*26;
    im.data[o]=v*0.60+ac*0.4; im.data[o+1]=v*0.66; im.data[o+2]=v*0.76-ac*0.3; im.data[o+3]=255; }
  x.putImageData(im,0,0);

  for(let k=0;k<5;k++){ const px=alea()*W, py=alea()*W, w=70+alea()*110, h=50+alea()*90, claro=k%2===0;
    x.save(); x.filter='blur(3px)'; x.fillStyle=claro?'rgba(150,165,180,0.13)':'rgba(8,12,18,0.30)';
    for(const dx of [-W,0,W]) for(const dy of [-W,0,W]) x.fillRect(px+dx,py+dy,w,h); x.restore(); }
  // manchas de aceite (iridiscentes, apenas) y juntas de alquitrán
  for(let k=0;k<4;k++){ const px=alea()*W, py=alea()*W, r=20+alea()*34; for(const dx of [-W,0,W]) for(const dy of [-W,0,W]){ const g=x.createRadialGradient(px+dx,py+dy,0,px+dx,py+dy,r); g.addColorStop(0,'rgba(4,8,14,0.32)'); g.addColorStop(0.7,'rgba(30,40,70,0.12)'); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=g; x.fillRect(px+dx-r,py+dy-r,2*r,2*r); } }

    im.data[o]=(92+70*t)*(1-a*0.2); im.data[o+1]=(148+58*t); im.data[o+2]=196+34*t; im.data[o+3]=255; }
  x.putImageData(im,0,0);
  for(let k=0;k<7;k++){ const px=alea()*W, py=alea()*W, r=40+alea()*80; for(const dx of [-W,0,W]) for(const dy of [-W,0,W]){ const g=x.createRadialGradient(px+dx,py+dy,0,px+dx,py+dy,r); g.addColorStop(0,'rgba(255,255,255,0.30)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.fillRect(px+dx-r,py+dy-r,2*r,2*r); } }

const V3=(x,y,z)=>new THREE.Vector3(x,y,z), V2=(x,y)=>new THREE.Vector2(x,y);
/** Junta una pieza hecha de muchas mallas en una malla por material: así una rueda con 40 tacos cuesta 3 llamadas. */
function fusiona(grupo){
  grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map();
  grupo.traverse(o=>{ if(!o.isMesh) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(), m=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);
    g.applyMatrix4(m);
    if(!g.attributes.uv){ g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2)); }
    const k=o.material; if(!por.has(k)) por.set(k,[]); por.get(k).push(g); });
  const out=new THREE.Group();
  for(const [mat,gs] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count;
      pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry();
    G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const me=new THREE.Mesh(G,mat); me.castShadow=true; me.receiveShadow=true; out.add(me);
  }
  return out;
}

      uv.push(uNorm?j/n:ph*Rg/uTile,(r-r0)/(uNorm?(r1-r0):uTile)+(uNorm?0:r0/uTile)); }
  }
  for(let j=0;j<n;j++){ const a=2*j,b=2*j+1,c=2*j+2,d=2*j+3; idx.push(a,b,c, c,b,d); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3)); g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);

  const nrm=new THREE.Vector3(), a=new THREE.Vector3().fromArray(pos,0), b=new THREE.Vector3().fromArray(pos,3), c2=new THREE.Vector3().fromArray(pos,6);
  nrm.crossVectors(b.sub(a),c2.sub(a)); if(nrm.y<0){ for(let i=0;i<idx.length;i+=3){ const t=idx[i+1]; idx[i+1]=idx[i+2]; idx[i+2]=t; } g.setIndex(idx); }
  return g;
}

/* ===================== 7. ENGRANAJES CÓNICOS =====================
   Un engrane cónico de eje local +Y con el vértice del cono en el origen, que se ensancha hacia +Y. El diente es una onda
   trapezoidal alrededor del cono primitivo (cabeza 1·m y pie 1,2·m, que crecen con la distancia al vértice). z dientes,
   semiángulo del cono primitivo delta, radio primitivo rp en el extremo grande. */
function bevel({z,rp,delta,cara,mat,cuerpo=0.03,fase=0}){
  const A=rp/Math.sin(delta), s0=A-cara, mod=2*rp/z, cd=Math.cos(delta), sd=Math.sin(delta);
  const perfil=[-0.5,-0.36,-0.23,-0.12,0,0.12,0.23,0.36];                      // posiciones dentro de un paso (centro del diente en 0)
  const nC=z*perfil.length, pos=[], idx=[];
  const dienteAt=(p)=>{ const a=Math.abs(p); return clamp((0.36-a)/0.13,0,1); };    // 1 en el diente, 0 en el hueco
  for(const s of [s0,A]){
    const k=s/A, add=1.0*mod*k, ded=1.2*mod*k;
    for(let j=0;j<nC;j++){
      const d=Math.floor(j/perfil.length), p=perfil[j%perfil.length], th=fase+(d+p)/z*DOSPI;
      const t=suave(dienteAt(p)), off=-ded+(add+ded)*t;
      const ax=s*cd-off*sd, ra=s*sd+off*cd;
      pos.push(ra*Math.cos(th),ax,ra*Math.sin(th));
    }
  }
  for(let j=0;j<nC;j++){ const j2=(j+1)%nC; idx.push(j,nC+j,j2, j2,nC+j,nC+j2); }
  // tapas: cara grande (+Y) y cara pequeña (−Y)
  const cA=pos.length/3; pos.push(0,A*cd,0); const cB=cA+1; pos.push(0,s0*cd,0);
  for(let j=0;j<nC;j++){ const j2=(j+1)%nC; idx.push(cA,nC+j2,nC+j); idx.push(cB,j,j2); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx);
  const gn=g.toNonIndexed(); gn.computeVertexNormals(); P3.sanaNormales(gn);
  const m=new THREE.Mesh(gn,mat); m.castShadow=true; m.receiveShadow=true;
  const gr=new THREE.Group(); gr.add(m);

}

/* ===================== 11. SONIDO (sintetizado) =====================
   El ronroneo del grupo cónico y de la transmisión: un tono que sube con la velocidad de la caja, un siseo del
   neumático y, si una rueda patina, un chillido agudo. */
const sonido=(function(){
  let ctx=null,on=true,master=null,osc=null,og=null,osc2=null,og2=null,ruido=null,fl=null,ng=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      osc=ctx.createOscillator(); osc.type='sawtooth'; osc.frequency.value=80; og=ctx.createGain(); og.gain.value=0; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700; osc.connect(lp); lp.connect(og); og.connect(master); osc.start();
      osc2=ctx.createOscillator(); osc2.type='triangle'; osc2.frequency.value=900; og2=ctx.createGain(); og2.gain.value=0; osc2.connect(og2); og2.connect(master); osc2.start();
      const buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate), d=buf.getChannelData(0); let ult=0; for(let i=0;i<d.length;i++){ ult=(ult+0.02*(Math.random()*2-1))/1.02; d[i]=ult*3.5; }
      ruido=ctx.createBufferSource(); ruido.buffer=buf; ruido.loop=true; fl=ctx.createBiquadFilter(); fl.type='bandpass'; fl.frequency.value=900; fl.Q.value=0.8; ng=ctx.createGain(); ng.gain.value=0; ruido.connect(fl); fl.connect(ng); ng.connect(master); ruido.start();
    }catch(e){ ctx=null; } }
  function actualiza(v,pat){ if(!ctx) return; const t=ctx.currentTime, u=clamp(v,0,1), s=clamp(pat,0,1);
    osc.frequency.setTargetAtTime(60+260*u,t,0.1); og.gain.setTargetAtTime(on?0.012+0.05*u:0,t,0.12);
    osc2.frequency.setTargetAtTime(700+500*s,t,0.05); og2.gain.setTargetAtTime(on?0.05*s*s:0,t,0.08);
    fl.frequency.setTargetAtTime(500+900*u,t,0.1); ng.gain.setTargetAtTime(on?0.01+0.05*u*u+0.05*s:0,t,0.1); }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); }
  return {init,actualiza,
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    clac:()=>tono(320,0.06,0.04,'triangle'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; },
    get vol(){ return og?og.gain.value:0; }, get freq(){ return osc?osc.frequency.value:0; }};
})();

/* ===================== 12. EL ESTADO Y EL RELOJ =====================
   EST son los mandos (lo que pide el alumno); VIS, lo que se ve ahora: la curva, la velocidad, el acelerador y el agarre
   se acercan con suavidad a lo pedido. TODO —escena, flechas, círculos, cifras y gráficas del dock— sale de ST, que se
   calcula UNA vez por cuadro con los valores visibles: mover un mando cambia las tres cosas a la vez. */
const R_RECTA=130;                                                          // el extremo del deslizador del radio es «recta»
const EST={modo:'marcha',dif:'abierto',kappa:3.0,dTmax:800,V:36,R:25,acel:55,mulo:0.25,hielo:'L',vel:0.1,pausa:REDUCIDO,autoRunning:false,vista:'planta',rot:false,barrido:false};
const VIS={V:36,invR:1/25,acel:55,mulo:0.25,kappa:3.0,dTmax:800};
const SIM={t:0,thL:0,thR:0,reinicios:0,tBarrido:0};
const Rde=v=>v>=R_RECTA?Infinity:v;
let ST=null, STclave='';
/** Lo que se mide ahora: en «En marcha», lo que digan los mandos; en el laboratorio guiado, lo que pida el paso. */
function paramsActuales(){
  if(EST.modo==='guia'){ const p=guiaParams(); if(p) return p; }
  return { modo:EST.dif, kappa:EST.kappa, dTmax:EST.dTmax, V:EST.V, R:Rde(EST.R), hielo:EST.hielo, mulo:EST.mulo, acel:EST.acel };
}
function calcula(){
  const q=paramsActuales();
  const key=[q.modo,VIS.kappa.toFixed(3),VIS.dTmax.toFixed(1),VIS.V.toFixed(2),VIS.invR.toFixed(5),q.hielo,VIS.mulo.toFixed(4),VIS.acel.toFixed(2)].join('|');
  if(key===STclave&&ST) return ST;
  STclave=key;
  const p={ modo:q.modo, kappa:VIS.kappa, dTmax:VIS.dTmax, V:VIS.V/3.6, R:VIS.invR>1e-4?1/VIS.invR:Infinity, hielo:q.hielo, mulo:VIS.mulo, muhi:VEH.muHi, acel:VIS.acel/100 };
  ST={q,p,e:evalua(p)};
  return ST;
}
function pasaVis(dt){
  const q=paramsActuales(), k=REDUCIDO?1:1-Math.exp(-dt/0.16);
  const to={V:q.V,invR:isFinite(q.R)?1/q.R:0,acel:q.acel,mulo:q.mulo,kappa:q.kappa||1,dTmax:q.dTmax||0};
  for(const c of Object.keys(to)){ VIS[c]+=(to[c]-VIS[c])*k; const tol=c==='invR'?1e-6:1e-4; if(Math.abs(to[c]-VIS[c])<tol) VIS[c]=to[c]; }
}
const clamp01=x=>Math.max(0,Math.min(1,x));
const COL_L=new THREE.Color('#4cc9f0'), COL_R=new THREE.Color('#ffb347'), COL_MAL=new THREE.Color('#ff4d5a');

/** Pone el modelo en la escena: pista, ruedas, caja y satélites, flechas, círculos, guiñada y chispas. */

  pasaVis(dtR);
  if(EST.barrido&&!EST.autoRunning&&!EST.pausa){ SIM.tBarrido+=dtR; const f=(SIM.tBarrido%16)/16; EST.mulo=Math.round((0.12+0.76*(f<0.5?f*2:2-f*2))*100)/100; if(typeof sincronizaMu==='function') sincronizaMu(); }
  const S=calcula(), e=S.e, c=e.c;
  SIM.t+=dtS;
  // ángulos: cada rueda con SU velocidad (con patinamiento); la caja es la media (ω_L + ω_R = 2·ω_caja); el piñón gira ifin veces la caja
  SIM.thL+=e.wL*dtS; SIM.thR+=e.wR*dtS;
  const thC=(SIM.thL+SIM.thR)/2, thP=thC*VEH.ifin, thS=(SIM.thR-SIM.thL)/2;
  PIEZAS.lado[0].rotation.z=-SIM.thL; PIEZAS.lado[1].rotation.z=-SIM.thR;
  PIEZAS.carrier.rotation.z=-thC;
  for(const sp of PIEZAS.sat) sp.rotation.y=thS;
  PIEZAS.pinon.rotation.x=thP; PIEZAS.arbol.rotation.x=thP;
  // pista: radio, hielo y avance del suelo (la cinta va a la velocidad del coche)

  // flechas de fuerza y círculos de fricción, por rueda
  for(const [k,F,Fy,cap,u,sat] of [['L',e.FL,c.FyL,c.capL,e.uL,e.satL],['R',e.FR,c.FyR,c.capR,e.uR,e.satR]]){
    const o=RUEDAS_F[k], zc=o.sg*TVIA/2, rC=Math.max(0.015,cap*KF);
    o.disco.scale.set(rC,rC,1); o.aro.scale.set(rC,rC,1); o.disco.visible=o.aro.visible=cap>0.5;
    const base=k==='L'?COL_L:COL_R, mezcla=clamp01((u-0.72)/0.28), col=base.clone().lerp(COL_MAL,mezcla);
    o.aro.material.color.copy(col); o.disco.material.color.copy(col); o.disco.material.opacity=0.12+0.2*mezcla;

    <div class="formula">ω<sub>L</sub> + ω<sub>R</sub> = 2·ω<sub>caja</sub><br>ω<sub>L,R</sub> = V·(1 ∓ t/2R)/r<sub>w</sub><br>ω<sub>satélite</sub> = (ω<sub>R</sub> − ω<sub>L</sub>)/2</div>
    <div class="fl"><b>Estática</b>: la caja entrega T<sub>caja</sub> = T<sub>L</sub> + T<sub>R</sub>. El abierto exige T<sub>L</sub> = T<sub>R</sub>, y manda la rueda que menos agarra: F<sub>x</sub> = 2·μ<sub>bajo</sub>·N. El autoblocante deja que el par de la rueda lenta llegue a TBR veces el de la rápida; la vectorización mueve hasta ΔT<sub>max</sub> con un embrague.</div>

    <li>Neumático como círculo de fricción μ·N con la fuerza lateral repartida en proporción a lo que cada rueda puede dar; el patinamiento sale de una curva F(s) simple (pico en 12 %), sin temperatura ni desgaste.</li>

/* ===================== 19. EL LABORATORIO GUIADO =====================
   Tres fases: 1 · Predice (a cuántas rpm gira la rueda interior en una curva: cinemática del diferencial), 2 · Decide
   (hielo en un lado y una curva: elegir el diferencial y su ajuste para tener la tracción pedida SIN pasarse de momento de
   guiñada; la solución es una ventana interior, ni el abierto ni el bloqueo máximo) y 3 · Diagnostica (¿qué diferencial
   es?, sólo con lo que miden las ruedas) y cierra con un quiz de tres preguntas. Varios intentos fallidos cambian el
   escenario (no se aprueba por eliminación). */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETO={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'predice',iniciado:false,dxOk:false,r1:null,r2:null,preparando:false,dx:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0,orden:null,huella:[],dmu:0.9,dR:30};
const NOM_DIF={abierto:'Abierto',tbr:'Autoblocante',vector:'Vectorizado'};

/* ---------- Fase 1 · Predice ---------- */
function sorteaCaso1(){
  let c; do{ c={V:pickOne([20,25,30,35,40]),R:pickOne([8,10,12,15,20])}; }while((c.V/3.6)**2/c.R>6.5||(GUIA.r1&&GUIA.r1.V===c.V&&GUIA.r1.R===c.R));
  const k=cinematica(c.V/3.6,c.R); c.ans=rpm(k.wL); c.rpmR=rpm(k.wR); c.rpmC=rpm(k.wc); c.k=k;
  GUIA.r1=c;
}
function checkPredice(){
  const raw=String((el('ansV')||{}).value||'').trim().replace(/\s| /g,'').replace(',','.'), v=parseFloat(raw), r=GUIA.r1, ok=r.ans;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe las rpm de la rueda interior (con coma o punto decimal).'); return; }
  RETO.intentos++;
  const tol=Math.max(3,0.02*ok);
  if(Math.abs(v-ok)<=tol){
    RETO.fallos1=0; sonido.bien();
    feedback('good','¡Correcto! ✓',`La rueda interior recorre un arco más corto: v<sub>L</sub> = V·(1 − t/2R) = ${fN(r.k.vL,2)} m/s, así que ω<sub>L</sub> = v<sub>L</sub>/r<sub>w</sub> = ${fN(r.k.wL,2)} rad/s = <b>${fN(ok,0)} rpm</b>. La exterior gira a ${fN(r.rpmR,0)} rpm y la caja a la media, ${fN(r.rpmC,0)} rpm: ω<sub>L</sub> + ω<sub>R</sub> = 2·ω<sub>caja</sub>.`,true);
    paso('decide'); prepararDecide();
  } else {
    RETO.fallos1++; sonido.mal();
    const esExt=Math.abs(v-r.rpmR)<=Math.max(3,0.02*r.rpmR), esCaja=Math.abs(v-r.rpmC)<=Math.max(3,0.02*r.rpmC);
    if(RETO.fallos1>=3){ RETO.fallos1=0; RETO.resiembras++; sorteaCaso1(); GUIA.r1.nuevo=true;
      feedback('bad','Tres intentos fallidos','Cambia la curva: piensa en el radio al que gira cada rueda. La interior describe una circunferencia más pequeña que el centro del eje.'); pintaHUD(); pintaDockFijo();
    } else {
      feedback('bad','Revisa el cálculo',(esExt?'Eso es la rueda <b>exterior</b>: la interior va más despacio.':(esCaja?'Eso es la <b>caja</b> (la velocidad del centro del eje): la interior es más lenta.':`Tu resultado (${fN(v,v%1?1:0)}) está ${v>ok?'alto':'bajo'}.`))+` Recuerda que cada rueda recorre su propio arco, de radio R ∓ t/2. (intentos fallidos: ${RETO.fallos1}/3)`);
      const t=el('d_try'); if(t) t.textContent=RETO.fallos1;
    }
  }
}

/* ---------- Fase 2 · Decide ---------- */
function prepararDecide(){
  GUIA.preparando=true; GUIA.r2=null;
  setTimeout(()=>{
    let sc=null; for(let i=0;i<8&&!sc;i++) sc=generaReto(Math.random);
    if(!sc){ let x=7; sc=generaReto(()=>(x=x*48271%2147483647)/2147483647); }
    GUIA.r2={sc,modo:'abierto',kappa:2,dT:300,intentos:0,res:null};
    GUIA.preparando=false; pintaHUD(); pintaDockFijo();
  },20);
}
function valorR2(){ const r=GUIA.r2; return r.modo==='tbr'?r.kappa:(r.modo==='vector'?r.dT:0); }
function validaDecide(){
  const r=GUIA.r2; if(!r||GUIA.preparando) return;
  const e=evaluaReto(r.sc,r.modo,valorR2()); r.res=e; RETO.intentos++; r.intentos++;
  const pasa=e.okF&&e.okM;
  if(pasa){
    RETO.fallos2=0; sonido.bien();
    feedback('good','¡Cumple las dos! ✓',`${NOM_DIF[r.modo]}${r.modo==='tbr'?' con TBR '+fN(r.kappa,1):(r.modo==='vector'?' con '+fN(r.dT,0)+' N·m de capacidad':'')}: ${fN(e.Fx,0)} N de tracción (pedías ${fN(r.sc.Freq,0)}) y ΔM = ${fN(e.dM,0)} N·m (tope ${fN(r.sc.Mmax,0)}). Más bloqueo da más tracción, pero el par se reparte desigual y esa diferencia, multiplicada por la mitad de la vía, es un momento que tuerce el coche: la solución está entre el abierto y el bloqueo máximo.`,true);
    paso('diag'); iniciaDiag();
  } else {
    RETO.fallos2++; sonido.mal();
    let msg;
    if(!e.okF&&e.okM) msg=r.modo==='abierto'?'Con el abierto la rueda del hielo manda: sólo pasa el doble de lo que ella aguanta. Falta tracción.':'Falta tracción: el par que se manda a la rueda buena todavía no llega.';
    else if(e.okF&&!e.okM) msg='Hay tracción de sobra, pero el momento de guiñada se pasa: el eje empuja de un lado y tuerce el coche.';
    else msg='Ni la tracción llega ni la guiñada se mantiene: este ajuste no funciona para esta curva.';
    if(RETO.fallos2>=4){ RETO.fallos2=0; RETO.resiembras++; feedback('bad','Cuatro intentos sin lograrlo',msg+' Cambia el escenario: la curva y el hielo son otros.',true); prepararDecide(); }
    else { feedback('bad','Todavía no',msg+` (intentos: ${RETO.fallos2}/4)`,true); pintaHUD(); }
  }
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.modo; let d; do{ d=generaDx(Math.random); }while(d.modo===p);
  GUIA.dx=d; GUIA.dxOk=false; GUIA.dmu=0.9; GUIA.dR=30; GUIA.huella=[]; GUIA.orden=barajar(['abierto','tbr','vector']);
  pintaHUD(); pintaDockFijo();
}
function huella(){ if(!ST||!enDiagnostico()) return; const u=GUIA.huella, ult=u[u.length-1], m=ST.p.mulo, F=ST.e.Fx; if(!ult||Math.hypot((ult[0]-m)*3000,ult[1]-F)>60){ u.push([m,F]); if(u.length>40) u.shift(); } }
function diagnostica(k){
  if(!GUIA.dx||GUIA.dxOk) return; RETO.intentos++;
  if(k===GUIA.dx.modo){
    GUIA.dxOk=true; RETO.fallos3=0; sonido.bien();
    feedback('good','Diagnóstico correcto ✓',explicaDx(GUIA.dx.modo),true);
    paso('quiz'); iniciaQuiz();
  } else {
    RETO.fallos3++; sonido.mal();
    if(RETO.fallos3>=3){ RETO.fallos3=0; RETO.resiembras++; feedback('bad','Tres intentos fallidos','Es otro eje: mide la tracción en el hielo y el signo del momento de guiñada en una curva con el mismo agarre en las dos ruedas.',true); iniciaDiag(); }
    else { feedback('bad','No es ese',noEs(k)+` (intentos fallidos: ${RETO.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(k){
  if(k==='abierto') return 'Diferencial abierto: reparte el par 50/50 pase lo que pase. Con buen agarre el momento de guiñada es cero; con hielo sólo pasa el doble de lo que aguanta la rueda peor.';
  if(k==='tbr') return 'Autoblocante: el rozamiento interno manda más par a la rueda LENTA. En una curva con buen agarre eso es la interior, así que ΔM sale negativo (subvira); en el hielo ayuda hasta TBR veces el par de la rueda que patina.';
  return 'Vectorizado: un embrague controlado mueve par hacia la rueda exterior en la curva (ΔM positivo, ayuda a girar) y, si una rueda llega a su límite, se lo pasa a la que agarra.';
}
function noEs(k){
  if(k==='abierto') return 'Un abierto daría ΔM = 0 en una curva con el mismo agarre en las dos ruedas, y en el hielo la tracción se quedaría en el doble de lo que aguanta la peor rueda.';
  if(k==='tbr') return 'Un autoblocante mandaría más par a la rueda interior (la lenta) en la curva con buen agarre: el momento de guiñada saldría negativo.';
  return 'Un vectorizado empujaría par a la rueda exterior en la curva con buen agarre: el momento de guiñada saldría positivo.';
}
const QUIZ=[
  {q:'En una curva a la izquierda, ¿qué rueda trasera gira más rápido y qué lo permite?',ok:'La derecha, porque recorre un arco mayor; los satélites giran en la caja y absorben la diferencia',mal:['La izquierda, porque su arco es más corto y la caja la acelera','Las dos igual, porque van unidas por el mismo eje rígido','La que más agarre tiene, gracias al rozamiento de la corona']},
  {q:'Un diferencial abierto con una rueda en hielo y la otra en asfalto, ¿cuánta fuerza de tracción puede dar como máximo?',ok:'El doble de lo que aguanta la rueda del hielo',mal:['El doble de lo que aguanta la rueda del asfalto','La suma de lo que aguanta cada una','Nada: el coche no se mueve']},
  {q:'Con buen agarre en las dos ruedas, un autoblocante acelerando en curva manda más par a la rueda interior. ¿Qué hace con la guiñada?',ok:'Un momento hacia fuera de la curva: el coche tiende a subvirar',mal:['Un momento hacia dentro de la curva: el coche tiende a sobrevirar','Ninguno: sólo actúa cuando hay hielo','Frena el coche pero no cambia su trayectoria']},
];
function iniciaQuiz(){ GUIA.quizN=0; cargaPregunta(); }
function cargaPregunta(){ const Q=QUIZ[GUIA.quizN], opts=barajar([Q.ok,...Q.mal]); GUIA.quiz={q:Q.q,opts,ok:opts.indexOf(Q.ok)}; GUIA.quizResp=-1; GUIA.quizCorrecta=GUIA.quiz.ok; pintaHUD(); }
function respondeQuiz(i){
  if(GUIA.quizResp>=0) return; GUIA.quizResp=i; const ac=i===GUIA.quiz.ok; if(ac) RETO.quizAcierto++;
  if(ac) sonido.bien(); else sonido.mal();
  const ult=GUIA.quizN>=QUIZ.length-1;
  feedback(ac?'good':'bad',ac?'Correcto ✓':'No es esa',(ac?'':'La respuesta era: <b>'+GUIA.quiz.opts[GUIA.quiz.ok]+'</b>. ')+(ult?'Terminaste el laboratorio.':'Sigue con la siguiente.'),true);
  pintaHUD();
  if(ult){ RETO.hecho=true; paso('completo'); }
}
function siguientePregunta(){ if(GUIA.quizN<QUIZ.length-1){ GUIA.quizN++; cargaPregunta(); } }

/* ---------- el enrutador de acciones ---------- */
function paso(p){ GUIA.paso=p; GUIA.phase=({predice:0,decide:1,diag:2,quiz:2,completo:2})[p]; if(EST.modo==='guia') pintaHUD(); }
function handleAction(act,btn){
  switch(act){
    case 'check-v': checkPredice(); break;
    case 'hint-v':
      if(RETO.pistas===0){ RETO.pistas=1; feedback('good','Pista 1 de 2','Las dos ruedas giran sobre circunferencias concéntricas: la interior de radio R − t/2 y la exterior de R + t/2. La velocidad del centro del eje es V.'); }
      else if(RETO.pistas===1){ RETO.pistas=2; feedback('good','Pista 2 de 2','Cada rueda lleva la velocidad de su arco: v = ω<sub>guiñada</sub>·(radio) = V·(1 − t/2R) para la interior. Divide entre el radio de la rueda y pasa de rad/s a rpm (× 60/2π).'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break;
    case 'validar': validaDecide(); break;
    case 'm2-abierto': if(GUIA.r2){ GUIA.r2.modo='abierto'; GUIA.r2.res=null; pintaHUD(); } break;
    case 'm2-tbr': if(GUIA.r2){ GUIA.r2.modo='tbr'; GUIA.r2.res=null; pintaHUD(); } break;
    case 'm2-vector': if(GUIA.r2){ GUIA.r2.modo='vector'; GUIA.r2.res=null; pintaHUD(); } break;
    case 'dx-abierto': diagnostica('abierto'); break;
    case 'dx-tbr': diagnostica('tbr'); break;
    case 'dx-vector': diagnostica('vector'); break;
    case 'quiz-0': respondeQuiz(0); break; case 'quiz-1': respondeQuiz(1); break; case 'quiz-2': respondeQuiz(2); break; case 'quiz-3': respondeQuiz(3); break;
    case 'quiz-sig': siguientePregunta(); break;
    case 'restart': location.reload(); break;
  }
}

/* ---------- lo que la guía enseña en cada paso ---------- */
function contenidoGuia(){
  const tri=(n,v,m)=>`<span class="tries">intentos fallidos: <b id="${n}">${v}</b>/${m}</span>`;
  switch(GUIA.paso){
    case 'predice': { const r=GUIA.r1; return {no:'Fase 1 · Reto 1',head:'Tu cálculo',title:'¿A cuántas rpm gira la rueda interior?',
      teach:`Curva a la izquierda de <b>R = ${fN(r.R,0)} m</b> a <b>${fN(r.V,0)} km/h</b> (la del centro del eje). Vía t = ${fN(VEH.t,2)} m, rueda r<sub>w</sub> = ${fN(VEH.rw,2)} m. Mira cómo giran: no sale ninguna cifra.<div class="task">¿A cuántas rpm gira la rueda trasera <b>izquierda</b>? ${tri('d_try',RETO.fallos1,3)}</div>`,
      acts:`<div class="calcrow"><input id="ansV" type="text" inputmode="decimal" autocomplete="off" placeholder="¿? rpm" aria-label="Revoluciones por minuto de la rueda interior"><button class="b primary" data-act="check-v">✓ Comprobar</button></div><button class="pista" id="btnHint">¿Necesitas una pista? (máx. 2)</button>`}; }
    case 'decide': { const r=GUIA.r2;
      if(GUIA.preparando||!r) return {no:'Fase 2 · Reto 2',head:'Tu diseño',title:'Preparando la pista…',teach:'Calculando el escenario.',acts:''};
      const sc=r.sc, e=r.res, chip=(ok,t,v)=>`<div class="chip ${e?(ok?'ok':'no'):''}"><span>${t}</span><b>${v}</b></div>`;
      const par=r.modo==='tbr'?`<div class="cg"><div class="cl"><div>Relación de par TBR</div><b id="v2P">${fN(r.kappa,1)} : 1</b></div><input type="range" id="r2P" min="${K_MIN}" max="${K_MAX}" step="0.1" value="${r.kappa}" aria-label="Relación de par TBR"></div>`:
        (r.modo==='vector'?`<div class="cg"><div class="cl"><div>Capacidad del embrague</div><b id="v2P">${fN(r.dT,0)} N·m</b></div><input type="range" id="r2P" min="0" max="${DT_MAX}" step="50" value="${r.dT}" aria-label="Capacidad de transferencia en newton metro"></div>`:
        `<div class="cg off"><div class="cl"><div>Sin ajuste</div><b>50 : 50</b></div><input type="range" disabled min="0" max="1" value="0" aria-label="Sin ajuste"></div>`);
      return {no:'Fase 2 · Reto 2',head:'Tu diseño',title:'Salir de la curva con hielo',
      teach:`Curva de <b>R = ${fN(sc.R,0)} m</b> a <b>${fN(sc.V,0)} km/h</b>, hielo (μ = ${fN(sc.mulo,2)}) bajo la rueda <b>${sc.hielo==='L'?'izquierda (interior)':'derecha (exterior)'}</b>, acelerador al ${fN(sc.acel*100,0)} %. Cumple las <b>dos a la vez</b>. ${tri('d_try2',RETO.fallos2,4)}<div class="chips">
        ${chip(e&&e.okF,'Tracción','≥ '+fN(sc.Freq,0)+' N'+(e?' · '+fN(e.Fx,0):''))}
        ${chip(e&&e.okM,'Guiñada |ΔM|','≤ '+fN(sc.Mmax,0)+' N·m'+(e?' · '+fN(Math.abs(e.dM),0):''))}</div>`,
      acts:`<div class="seg" role="group" aria-label="Tipo de diferencial">${MODOS.map(m=>`<button class="b ${r.modo===m?'on':''}" data-act="m2-${m}">${NOM_DIF[m]}</button>`).join('')}</div>${par}
        <button class="b primary" data-act="validar">▶ Validar el diseño</button>`}; }
    case 'diag': { const ord=GUIA.orden||['abierto','tbr','vector'];
      return {no:'Fase 3 · Diagnóstico',head:'¿Cuál es?',title:'Averigua qué diferencial lleva',
      teach:`No sabes cuál es. Cambia el agarre del lado bajo y la curva, mira los pares y el momento de guiñada de <b>ΔM</b>.<div class="task">¿Qué diferencial es? ${tri('d_try3',RETO.fallos3,3)}</div>`,
      acts:`<div class="cg"><div class="cl"><div>Agarre bajo μ</div><b id="vdM">${fN(GUIA.dmu,2)}</b></div><input type="range" id="rdM" min="0.1" max="0.9" step="0.01" value="${GUIA.dmu}" aria-label="Agarre del lado resbaladizo"></div>
        <div class="cg"><div class="cl"><div>Curva</div><b id="vdR">${fR(GUIA.dR)}</b></div><input type="range" id="rdR" min="14" max="${R_RECTA}" step="1" value="${GUIA.dR}" aria-label="Radio de la curva (el extremo es recta)"></div>`
        +ord.map(k=>`<button class="b" data-act="dx-${k}">${NOM_DIF[k]}</button>`).join('')}; }
    case 'quiz': { const Q=GUIA.quiz; if(!Q) return {no:'',head:'',title:'',teach:'',acts:''}; const ya=GUIA.quizResp>=0;
      return {no:'Cierre · Pregunta '+(GUIA.quizN+1)+' de '+QUIZ.length,head:'Quiz',title:Q.q,teach:'',
      acts:Q.opts.map((o,i)=>`<button class="b ${ya?(i===Q.ok?'good':(i===GUIA.quizResp?'bad':'')):''}" data-act="quiz-${i}" ${ya?'disabled':''}>${o}</button>`).join('')+(ya&&GUIA.quizN<QUIZ.length-1?'<button class="b primary" data-act="quiz-sig">Siguiente →</button>':'')}; }
    case 'completo': return {no:'Laboratorio completado',head:'✓',title:'Predijiste, diseñaste y diagnosticaste',
      teach:`Acertaste ${RETO.quizAcierto} de ${QUIZ.length} en el quiz. Vuelve a <b>En marcha</b> y prueba los tres diferenciales con hielo a cada lado: cada vez que el par va a una rueda, el coche recibe un momento de guiñada.`,
      acts:`<button class="b primary" data-act="restart">↺ Reiniciar laboratorio</button>`};
  }
  return {no:'',head:'',title:'',teach:'',acts:''};
}
function htmlGuia(){
  const ps=['Predice','Diseña','Diagnostica'], C=contenidoGuia();
  const ok=i=>i<GUIA.phase||(i===2&&RETO.hecho);
  return `<div class="pasos">${ps.map((t,i)=>`<span class="ps ${ok(i)?'ok':(i===GUIA.phase?'on':'')}"><i>${ok(i)?'✓':i+1}</i>${t}</span>`).join('')}</div>
  <div class="retoBox"><div class="rt"><span>${C.no}</span><span>${C.head}</span></div><h3>${C.title}</h3><div class="rq">${C.teach}</div><div class="opt" id="actOpt">${C.acts}</div></div>`;
}
/** Lo que corre en la escena en cada paso del laboratorio guiado (null: lo que digan los mandos). */
function guiaParams(){
  if(GUIA.paso==='predice'&&GUIA.r1){ const r=GUIA.r1; return {modo:'abierto',kappa:1,dTmax:0,V:r.V,R:r.R,hielo:'L',mulo:0.9,acel:0}; }
  if(GUIA.paso==='decide'&&GUIA.r2&&!GUIA.preparando){ const r=GUIA.r2, sc=r.sc; return {modo:r.modo,kappa:r.kappa,dTmax:r.dT,V:sc.V,R:sc.R,hielo:sc.hielo,mulo:sc.mulo,acel:sc.acel*100}; }
  if((GUIA.paso==='diag'||GUIA.paso==='quiz'||GUIA.paso==='completo')&&GUIA.dx){ const d=GUIA.dx; return {modo:d.modo,kappa:d.kappa,dTmax:d.dTmax,V:30,R:Rde(GUIA.dR),hielo:d.hielo,mulo:GUIA.dmu,acel:50}; }
  return null;
}
/* ---------- los modos ---------- */
function setMode(m,forzar){
  if(!forzar&&(m===EST.modo||EST.autoRunning)) return;
  if(m==='guia'){
    EST.modo='guia'; if(!GUIA.iniciado){ GUIA.iniciado=true; sorteaCaso1(); paso('predice'); }
  } else EST.modo='marcha';
  document.body.classList.toggle('m-marcha',EST.modo==='marcha'); document.body.classList.toggle('m-guia',EST.modo==='guia');
  STclave=''; pintaHUD(); pintaDockFijo(); pintaBarras(); ponVista(EST.vista,0.6);
}
let fbTimer=null;
function feedback(type,title,text,sticky=false){ const f=el('feedback'); f.className='feedback show '+type; el('fbIcon').textContent=type==='good'?'✓':'✕'; el('fbTitle').textContent=title; el('fbText').innerHTML=text; clearTimeout(fbTimer); if(!sticky) fbTimer=setTimeout(()=>f.classList.remove('show'),7000); }
el('fbX').onclick=()=>el('feedback').classList.remove('show');
document.addEventListener('input',e=>{ const t=e.target; if(!t) return;
  if(t.id==='r2P'&&GUIA.r2){ const r=GUIA.r2; if(r.modo==='tbr'){ r.kappa=+t.value; el('v2P').textContent=fN(r.kappa,1)+' : 1'; } else { r.dT=+t.value; el('v2P').textContent=fN(r.dT,0)+' N·m'; } r.res=null; }
  if(t.id==='rdM'){ GUIA.dmu=+t.value; el('vdM').textContent=fN(GUIA.dmu,2); }
  if(t.id==='rdR'){ GUIA.dR=+t.value; el('vdR').textContent=fR(GUIA.dR); }
});

/* ---------- el recorrido guiado de «En marcha» ---------- */
const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function runAuto(){
  if(EST.autoRunning||EST.modo!=='marcha') return; EST.autoRunning=true; EST.barrido=false; sonido.init();
  const hud=el('hud'), prev={dif:EST.dif,kappa:EST.kappa,dTmax:EST.dTmax,V:EST.V,R:EST.R,acel:EST.acel,mulo:EST.mulo,hielo:EST.hielo,vista:EST.vista,vel:EST.vel};
  const fija=o=>{ Object.assign(EST,o); pintaHUD(); hud.style.pointerEvents='none'; const b=el('btnAuto'); if(b){ b.disabled=true; b.textContent='Recorrido en curso…'; } pintaDockFijo(); pintaBarras(); };
  try{
    fija({dif:'abierto',mulo:0.9,acel:20,V:36,R:25}); ponVista('corte');
    showToast('Paso 1 · Mismo agarre en las dos ruedas. La interior va más despacio y los <b>satélites</b> giran en la caja: ω<sub>L</sub> + ω<sub>R</sub> = 2·ω<sub>caja</sub>.',7600);
    await espera(8000);
    fija({mulo:0.2,acel:70,hielo:'L'}); ponVista('contacto');
    showToast('Paso 2 · Hielo bajo la rueda interior y diferencial <b>abierto</b>: patina la que no agarra y la otra recibe el mismo par. La tracción se queda en el doble del hielo.',8200);
    await espera(8600);
    fija({dif:'tbr',kappa:3}); ponVista('planta');
    showToast('Paso 3 · <b>Autoblocante</b>: el rozamiento interno manda más par a la rueda que agarra. Sube la tracción y aparece un momento de guiñada.',8200);
    await espera(8600);
    fija({dif:'vector',dTmax:800});
    showToast('Paso 4 · <b>Vectorización</b>: un embrague mueve el par adonde hay agarre, hasta su capacidad. Mira cómo cambia la flecha curva de guiñada.',8200);
    await espera(8600);
    fija({hielo:'R'});
    showToast('Paso 5 · Con el hielo en la rueda exterior el par se va a la interior: el momento de guiñada cambia de sentido.',7000);
    await espera(7400);
  } finally {
    Object.assign(EST,prev); EST.autoRunning=false; hud.style.pointerEvents='';
    pintaHUD(); pintaDockFijo(); ponVista(prev.vista); pintaBarras();
  }
}


/* ===================== 20. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.min(devicePixelRatio,alta?2:1.5));
  const ms=alta?2048:1024; if(LUZ.sol.shadow.mapSize.x!==ms){ LUZ.sol.shadow.mapSize.set(ms,ms); if(LUZ.sol.shadow.map){ LUZ.sol.shadow.map.dispose(); LUZ.sol.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); ponVista(EST.vista,0.001); centraEnHueco();
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 21. EL LAZO: UN SOLO RELOJ =====================
   El tiempo de la escena avanza dt·(cámara lenta) en cada cuadro, y con ESE tiempo se mueven las ruedas, la caja, los
   satélites, el suelo y las chispas. Las cifras y las gráficas del dock salen del mismo estado ST que las flechas y los
   círculos de fricción. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  aplicaEscena(EST.pausa?0:dt*EST.vel,dt);
  huella();
  pasaCam(dt);
  sonido.actualiza(EST.pausa||!ST?0:ST.e.wc/60,EST.pausa||!ST?0:clamp((Math.max(ST.e.sL,ST.e.sR)-0.1)/0.3,0,1));
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.05&&seVe(el('panel'))){ tLienzo=t; pintaVel(); pintaPares(); pintaTraccion(); pintaCirculos(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos();
}

/* ===================== 22. ARRANQUE =====================
   Abre en marcha: el eje toma una curva a la izquierda con hielo bajo la rueda interior y el diferencial ABIERTO: la rueda
   del hielo patina y levanta polvo de hielo mientras la otra casi no tira. Es el gancho: el alumno ve el problema antes de
