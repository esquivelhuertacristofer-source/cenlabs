<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Control de crucero adaptativo (ACC): mantener la distancia con el coche de adelante — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#08161F;--panel:rgba(7,20,28,.88);--line:#21495C;--ink:#EAF4F8;
    --dim:#9BB8C4;--accent:#5BC8FF;--accent2:#A8E2FF;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cF:#5BC8FF;--cR:#FFA445;--cE:#3DDC97;--cG:#C8D6D2;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#0f2733;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#173748}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#031a20;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#031a20;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#8ad8ff}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#031a20}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#5BC8FF;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f87a0;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f90a8;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#031a20}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .escs{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
  .esc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px;font-size:11.5px;line-height:1.35;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);color:#c4d3e6}
  .esc .rs{font-weight:700;font-size:11px}.esc .rs.ok{color:var(--good)}.esc .rs.mal{color:#ff9a9a}
  .esc .pista{font-size:10.5px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#09121c;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(30,53,80,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-top{display:flex;gap:6px;align-items:stretch}
  .vol{flex:0 0 76px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid rgba(30,53,80,.9);position:relative;min-height:76px}
  .vol canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-fig{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,53,80,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f87a0}
  .dk-tit{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#a3bcd6;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c6da;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#0f2733;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfdcec;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  /* ---- el recorrido paso a paso y el aro que señala la pieza ---- */
  .tour{border:1px solid rgba(91,200,255,.38);background:rgba(91,200,255,.06);border-radius:12px;padding:10px 11px;display:flex;flex-direction:column;gap:7px}
  .tour .tn{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .tour .pts{display:flex;gap:5px}.tour .pts i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}.tour .pts i.on{background:var(--accent)}.tour .pts i.ok{background:var(--good)}
  .tour h3{font-size:16px;line-height:1.2}
  .tour .tx{font-size:13px;line-height:1.5;color:#d3e3ea}.tour .tx b{color:#fff}
  .tour .tb{display:flex;gap:6px}.tour .tb .b{flex:1}
  .tour .salta{align-self:flex-end;font-size:11px;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:0;font-family:inherit}
  .foco{position:fixed;z-index:14;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 3px rgba(91,200,255,.55),0 0 24px 6px rgba(91,200,255,.45);pointer-events:none;display:none;animation:pulso 1.5s ease-in-out infinite}
  @keyframes pulso{0%,100%{transform:scale(.88);opacity:.95}50%{transform:scale(1.12);opacity:.55}}
  @media (prefers-reduced-motion:reduce){.foco{animation:none}}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,18,30,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,18,30,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d3e6}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,18,30,.92);border:1px solid rgba(124,196,255,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,18,30,.84);border:1px solid rgba(124,196,255,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .chips{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .chip{font-size:11.5px;line-height:1.35;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--dim)}
  .chip b{color:var(--ink)} .chip small{font-size:10.5px;color:var(--dim)}
  .chip.ok{border-color:rgba(52,211,153,.5)} .chip.ok b{color:var(--good)} .chip.mal{border-color:rgba(244,71,94,.5)} .chip.mal b{color:#ff9aa8}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}
  body.estrecho.ancho.t-panel .panel>.dk-top{grid-column:1;grid-row:2}
  body.estrecho.ancho.t-panel .panel>.dk-row{grid-column:1;grid-row:3/6;min-height:0}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   LAB — CONTROL DE CRUCERO ADAPTATIVO (ACC): MANTENER LA DISTANCIA CON EL COCHE DE ADELANTE
   (Autotrónica · mecanica-154)

   Un radar mide la distancia y la velocidad relativa con el coche de adelante; un controlador PD pide aceleración para mantener la distancia
   d* = d0 + h·v (política de tiempo de brecha constante), con topes de confort y un actuador con retardo. El líder frena y arranca con un perfil
   exacto; dos coches más con el mismo controlador muestran la estabilidad de cadena. Todo es un único modelo, en un bloque puro que un script de Node
   extrae TAL CUAL y verifica.
   ============================================================ */


/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO='\u202F';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }



/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos marcas— y lo prueba:
   lo que se prueba es lo que corre. */
/* FISICA:INICIO */
/* ---- Control de crucero adaptativo (ACC): física pura (sin three). SI salvo donde se diga. ----
   Lazo LONGITUDINAL de seguimiento. El coche propio (1) sigue a un líder (0) que frena y arranca; detrás de él se simulan otros dos
   coches idénticos (2 y 3) para ver la ESTABILIDAD DE CADENA. Para cada coche i:
     x_i posición del centro (m) · v_i velocidad · a_i aceleración REAL (m/s²)
     ẋ = v · v̇ = a · τ·ȧ = a_orden(t − θ) − a        (actuador: retardo puro θ y retardo de primer orden τ)
   Distancia entre parachoques d_i = x_{i−1} − x_i − L_coche. Política de TIEMPO DE BRECHA CONSTANTE: d* = d0 + h·v  (d0 distancia de parada).
   Error de distancia e = d − d*; velocidad relativa Δv = v_{i−1} − v_i; ley PD sobre la aceleración:
     a_seguir = P·e + D·Δv  ·  a_crucero = k_c·(v_fijada − v)  ·  a_orden = sat( mín(a_seguir, a_crucero) ) con tope de confort [−3,5 ; +2,0] m/s².
   El radar entrega d y Δv cada 50 ms con ruido gaussiano de semilla fija. Todo con paso fijo de 10 ms y RK4. */
const G=9.80665, DOSPI=Math.PI*2;
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const suave=t=>t*t*(3-2*t);

/* ---- Constantes del coche y del sistema ---- */
const LCOCHE=4.4;                                   // largo del coche (m): del CG a la nariz 2,05 m y a la cola 2,35 m
const D0=5.0;                                       // distancia de parada d0 (m)
const LIM={amin:-3.5, amax:2.0};                    // topes de confort de la aceleración (m/s²)
const K_CRUCERO=0.40;                               // 1/s: ganancia del control de crucero (sin coche delante)
const RADAR={dt:0.05, sigD:0.10, sigV:0.12};        // radar: periodo (s) y ruido (1σ) de la distancia (m) y de la velocidad relativa (m/s)
const DTS=0.01, TFIN=40, NPAS=Math.round(TFIN/DTS); // paso de integración 10 ms · 40 s por escenario
const NCOCHES=3;                                    // coches seguidores simulados (el 1 es el del alumno)

/* ---- Generador pseudoaleatorio (mulberry32) y normal de Box–Muller: el ruido es reproducible ---- */
function prng(semilla){ let a=semilla>>>0; return ()=>{ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function normal(rnd){ let u=rnd(); if(u<1e-12) u=1e-12; const v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(DOSPI*v); }

/* ---- Escenarios: el líder cambia de velocidad en TRAMOS. Cada tramo {t, v, a}: desde t pasa a v con una rampa suave (S(u) = 3u² − 2u³)
   cuya aceleración máxima es a, así que dura T = 1,5·|Δv|/a. La posición del líder tiene forma cerrada (∫S = u³ − u⁴/2). ---- */
const ESCENARIOS=[
  {id:'autopista',nombre:'Autopista · el de adelante frena fuerte',desc:'100 km/h; el de adelante frena a 3,3 m/s² hasta 30 km/h y luego acelera',
   v0:100/3.6,vset:120/3.6,tramos:[{t:5,v:30/3.6,a:3.3},{t:18,v:70/3.6,a:1.2}],act:{tau:0.30,theta:0.15},
   lim:{dmin:6.0,emax:1.80,jerk:0.80,dfin:46}},
  {id:'atasco',nombre:'Atasco · se detiene del todo',desc:'50 km/h; el de adelante se detiene y luego arranca',
   v0:50/3.6,vset:60/3.6,tramos:[{t:4,v:0,a:3.0},{t:18,v:30/3.6,a:1.2}],act:{tau:0.30,theta:0.15},
   lim:{dmin:2.0,emax:1.80,jerk:1.40,dfin:19}},
  {id:'camion',nombre:'Camión · el freno tarda más',desc:'90 km/h; el de adelante frena a 3,2 m/s² hasta 30 km/h y el freno del camión responde con más retardo (0,55 s)',
   v0:90/3.6,vset:110/3.6,tramos:[{t:5,v:30/3.6,a:3.2},{t:18,v:65/3.6,a:1.2}],act:{tau:0.35,theta:0.20},
   lim:{dmin:6.0,emax:2.20,jerk:0.80,dfin:44}},
];
const escPorId=id=>ESCENARIOS.find(e=>e.id===id)||ESCENARIOS[0];

/** Duración de un tramo del líder (s). */
const durTramo=(v0,tr)=>1.5*Math.abs(tr.v-v0)/tr.a;
/** Velocidad del líder en el tiempo t. */
function velLider(esc,t){
  let v=esc.v0;
  for(const tr of esc.tramos){ const T=durTramo(v,tr); if(t<=tr.t) return v; if(t<tr.t+T) return v+(tr.v-v)*suave((t-tr.t)/T); v=tr.v; }
  return v;
}
/** Aceleración del líder (derivada exacta de la rampa suave). */
function acelLider(esc,t){
  let v=esc.v0;
  for(const tr of esc.tramos){ const T=durTramo(v,tr); if(t<=tr.t) return 0; if(t<tr.t+T){ const u=(t-tr.t)/T; return (tr.v-v)*6*u*(1-u)/T; } v=tr.v; }
  return 0;
}
/** Posición del líder (m) respecto a su posición en t = 0: forma cerrada (polinomios por tramo). */
function posLider(esc,t){
  let v=esc.v0, x=0, tp=0;
  for(const tr of esc.tramos){ const T=durTramo(v,tr);
    if(t<=tr.t) return x+v*(t-tp);
    x+=v*(tr.t-tp); tp=tr.t;
    if(t<tr.t+T){ const u=(t-tr.t)/T; return x+v*(t-tp)+(tr.v-v)*T*(u*u*u-u*u*u*u/2); }
    x+=v*T+(tr.v-v)*T/2; tp=tr.t+T; v=tr.v; }
  return x+v*(t-tp);
}
/** Distancia deseada d* = d0 + h·v. */
const distDeseada=(h,v)=>D0+h*v;

/* ---- Derivadas del coche seguidor: estado [x, v, a], con la orden ya saturada y retardada ---- */
function deriv(s,ordenRet,tau){ return [s[1],s[2],(ordenRet-s[2])/tau]; }
function rk4(s,ordenRet,tau,h){
  const f=y=>deriv(y,ordenRet,tau), sum=(y,d,c)=>y.map((q,i)=>q+c*d[i]);
  const a1=f(s), a2=f(sum(s,a1,h/2)), a3=f(sum(s,a2,h/2)), a4=f(sum(s,a3,h));
  return s.map((q,i)=>q+h/6*(a1[i]+2*a2[i]+2*a3[i]+a4[i]));
}

/* ---- Ley de control: aceleración pedida con la distancia y la velocidad relativa MEDIDAS ---- */
function ordenAcc(prm,dm,dvm,v,libre){
  const aCru=K_CRUCERO*(prm.vset-v);
  const aSeg=libre?Infinity:prm.kp*(dm-distDeseada(prm.h,v))+prm.kd*dvm;
  const cruda=Math.min(aSeg,aCru);
  return {cruda, orden:clamp(cruda,LIM.amin,LIM.amax)};
}

/* ---- La simulación: líder con perfil exacto y NCOCHES seguidores con el mismo controlador.
   prm: {h (s), kp (m/s² por m), kd (m/s² por m/s), tau, theta (opc.), vset (opc.), semilla, libre (opc.: sin líder)} ---- */
function simula(esc,prm){
  const h=prm.h, tau=prm.tau===undefined?esc.act.tau:prm.tau, theta=prm.theta===undefined?esc.act.theta:prm.theta;
  const P={h,kp:prm.kp,kd:prm.kd,vset:prm.vset===undefined?esc.vset:prm.vset}, N=NPAS+1, nR=Math.round(RADAR.dt/DTS), nRet=Math.round(theta/DTS);
  const rnd=prng(prm.semilla||1234567);
  const mk=()=>({x:new Float64Array(N),v:new Float64Array(N),a:new Float64Array(N),ac:new Float64Array(N),d:new Float64Array(N),dm:new Float64Array(N),sat:new Uint8Array(N)});
  const A={t:new Float64Array(N),xl:new Float64Array(N),vl:new Float64Array(N),al:new Float64Array(N),c:[]};
  for(let i=0;i<NCOCHES;i++) A.c.push(mk());
  const v0=esc.v0, gap0=distDeseada(h,v0), est=[], med=[], cola=[];
  for(let i=0;i<NCOCHES;i++){ est.push([-(i+1)*(gap0+LCOCHE),v0,0]); med.push({d:gap0,dv:0}); cola.push(new Float64Array(N)); }
  const xl0=0;                                                   // el líder parte de x = 0; el coche 1 queda detrás
  for(let k=0;k<N;k++){
    const t=k*DTS, xl=xl0+posLider(esc,t), vl=velLider(esc,t);
    A.t[k]=t; A.xl[k]=xl; A.vl[k]=vl; A.al[k]=acelLider(esc,t);
    const ps=est.map(q=>q.slice());                              // estado de todos en el instante t (antes de avanzar a ninguno)
    for(let i=0;i<NCOCHES;i++){
      const s=ps[i], xd=i===0?xl:ps[i-1][0], vd=i===0?vl:ps[i-1][1];
      const dReal=xd-s[0]-LCOCHE;
      if(k%nR===0){ med[i]={d:dReal+RADAR.sigD*normal(rnd),dv:(vd-s[1])+RADAR.sigV*normal(rnd)}; }
      const o=ordenAcc(P,med[i].d,med[i].dv,s[1],!!prm.libre);
      cola[i][k]=o.orden;
      const ret=k-nRet>=0?cola[i][k-nRet]:0;
      const C=A.c[i]; C.x[k]=s[0]; C.v[k]=s[1]; C.a[k]=s[2]; C.ac[k]=o.orden; C.d[k]=dReal; C.dm[k]=med[i].d; C.sat[k]=(o.cruda<=LIM.amin||o.cruda>=LIM.amax)?1:0;
      if(k<N-1){ let n=rk4(s,ret,tau,DTS); if(n[1]<0){ n[1]=0; if(n[2]<0) n[2]=0; } est[i]=n; }
    }
  }
  return A;
}

/* ---- Métricas del reto (para el coche 1) ---- */
function metricas(esc,A,h){
  const N=NPAS+1, C=A.c[0], tf=TFIN-6, kf=Math.round(tf/DTS);
  let dmin=Infinity, tDmin=0, amin=0, amax=0, sat=0, sj=0, nj=0, osc=0, emax=0, aminC3=0;
  for(let k=0;k<N;k++){ if(C.d[k]<dmin){ dmin=C.d[k]; tDmin=A.t[k]; } if(C.a[k]<amin) amin=C.a[k]; if(C.a[k]>amax) amax=C.a[k]; sat+=C.sat[k];
    if(A.c[NCOCHES-1].a[k]<aminC3) aminC3=A.c[NCOCHES-1].a[k]; }
  for(let k=1;k<N;k++){ const j=(C.a[k]-C.a[k-1])/DTS; sj+=j*j; nj++; }
  for(let k=0;k<N;k++){ const e=Math.abs(C.d[k]-distDeseada(h,C.v[k])); emax=Math.max(emax,e); if(k>=kf) osc=Math.max(osc,e); }
  // acordeón: cruces del error de distancia con histéresis de ±0,8 m, a partir de que el líder termina su primera maniobra
  let cruces=0, lado=0; for(let k=0;k<N;k++){ const e=C.d[k]-distDeseada(h,C.v[k]), s=e>0.8?1:(e<-0.8?-1:0); if(s!==0){ if(lado!==0&&s!==lado) cruces++; lado=s; } }
  return {dmin,tDmin,choca:dmin<=0,frenaMax:-amin,aceleraMax:amax,sat:sat*DTS,jerk:Math.sqrt(sj/Math.max(nj,1)),osc,emax,dfin:C.d[N-1],vfin:C.v[N-1],cruces,
    amplif:amin<-0.05?aminC3/amin:1};
}

/* ---- Respuesta en frecuencia de la CADENA (modelo lineal sin saturar): Γ(s) = a_i/a_{i−1} ----
   Con A(s) = e^{−θs}/(τs+1) (actuador): Γ = A·(P + D·s) / (s² + A·(P + (D + P·h)·s)). Γ(0) = 1.
   La cadena es ESTABLE (la frenada no se amplifica hacia atrás) si |Γ(jω)| ≤ 1 para toda ω. */
function gananciaGamma(w,h,kp,kd,tau,theta){

function ruidoPeriodico(semilla,periodo){
  const g=(x,y)=>{ x=((x%periodo)+periodo)%periodo; y=((y%periodo)+periodo)%periodo;
    const s=Math.sin(x*127.1+y*311.7+semilla*13.13)*43758.5453; return s-Math.floor(s); };
  return (x,y)=>{ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    return g(xi,yi)*(1-u)*(1-v)+g(xi+1,yi)*u*(1-v)+g(xi,yi+1)*(1-u)*v+g(xi+1,yi+1)*u*v; };

function fusiona(grupo){
  grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map();
  grupo.traverse(o=>{ if(!o.isMesh) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(), m=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);
    g.applyMatrix4(m);
    if(!g.attributes.uv){ g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2)); }
    const k=o.material; if(!por.has(k)) por.set(k,[]); por.get(k).push(g); });
  const out=new THREE.Group();
  for(const [mat,gs] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count;
      pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry();
    G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const me=new THREE.Mesh(G,mat); me.castShadow=!mat.transparent; me.receiveShadow=true; out.add(me);

/** Una carrocería «lofteada»: anillos de superelipse que se estrechan hacia los extremos.
 *  secs: [{x, w (semianchura), y0, y1, n (exponente), tum (estrechamiento arriba, 0..1)}]. */
function lofteo(secs,seg=28){
  const pos=[],idx=[],nR=secs.length;
  for(const s of secs){
    const yc=(s.y0+s.y1)/2, hh=Math.max(1e-3,(s.y1-s.y0)/2), ex=2/(s.n||3);
    for(let k=0;k<seg;k++){
      const th=k/seg*DOSPI, c=Math.cos(th), sn=Math.sin(th);
      const yy=yc+hh*Math.sign(sn)*Math.pow(Math.abs(sn),ex), f=(yy-s.y0)/(2*hh);
      const zz=Math.max(1e-3,s.w)*(1-(s.tum||0)*f*f)*Math.sign(c)*Math.pow(Math.abs(c),ex);
      pos.push(s.x,yy,zz);
    }
  }
  const cI=pos.length/3; pos.push(secs[0].x,(secs[0].y0+secs[0].y1)/2,0); pos.push(secs[nR-1].x,(secs[nR-1].y0+secs[nR-1].y1)/2,0);
  for(let i=0;i<nR-1;i++) for(let k=0;k<seg;k++){
    const a=i*seg+k, b=i*seg+(k+1)%seg, c2=(i+1)*seg+k, d=(i+1)*seg+(k+1)%seg;
    idx.push(a,c2,b, b,c2,d);
  }
  for(let k=0;k<seg;k++){ idx.push(cI,k,(k+1)%seg); idx.push(cI+1,(nR-1)*seg+(k+1)%seg,(nR-1)*seg+k); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx);
  // el sentido de las caras: si el volumen con signo sale negativo, se invierten
  let vol=0; for(let i=0;i<idx.length;i+=3){ const a=idx[i]*3,b=idx[i+1]*3,c3=idx[i+2]*3;
    vol+=pos[a]*(pos[b+1]*pos[c3+2]-pos[b+2]*pos[c3+1])-pos[a+1]*(pos[b]*pos[c3+2]-pos[b+2]*pos[c3])+pos[a+2]*(pos[b]*pos[c3+1]-pos[b+1]*pos[c3]); }
  if(vol<0) for(let i=0;i<idx.length;i+=3){ const t=idx[i+1]; idx[i+1]=idx[i+2]; idx[i+2]=t; }
  g.setIndex(idx); g.computeVertexNormals(); g.computeBoundingSphere();
  return g;
}

function construyeCoche(pint,matPil){

/* ===================== 8. LO QUE VE EL RADAR Y LA DISTANCIA EN EL PISO =====================
   Un abanico translúcido (el haz del radar, ±3,2°) que sale del paragolpes y llega hasta el coche de adelante: su largo ES la distancia medida.
   Y sobre el asfalto, la cinta de la distancia: cian = la que hay (hasta la distancia ideal), roja = lo que le FALTA si el de adelante está más
   cerca de lo ideal, ámbar = lo que le SOBRA si está más lejos; la barra blanca marca la distancia ideal d* = d0 + h·v. */
const RAD=Math.PI/180;
function creaAbanico(semiGrados,R,col,aOpac,h0){
  const semi=semiGrados*RAD, N=28, pos=[],colr=[],idx=[];
  const P=(a,r)=>[Math.sin(a)*r,0.04,-Math.cos(a)*r];
  pos.push(0,h0,0); colr.push(1,1,1,aOpac);
  for(let i=0;i<=N;i++){ const a=-semi+2*semi*i/N, p=P(a,R); pos.push(...p); colr.push(1,1,1,aOpac*0.55); }
  for(let i=0;i<N;i++) idx.push(0,i+1,i+2);
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('color',new THREE.Float32BufferAttribute(colr,4)); g.setIndex(idx);
  const m=new THREE.MeshBasicMaterial({color:col,vertexColors:true,transparent:true,depthWrite:false,side:THREE.DoubleSide,toneMapped:false});
  const sector=new THREE.Mesh(g,m); sector.renderOrder=7; sector.raycast=()=>{};
  const lp=[]; for(const s of [-1,1]){ const p=P(s*semi,R); lp.push(0,h0,0,p[0],0.04,p[2]); }
  const lg=new THREE.BufferGeometry(); lg.setAttribute('position',new THREE.Float32BufferAttribute(lp,3));
  const lineas=new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0.55,toneMapped:false,depthWrite:false})); lineas.renderOrder=8; lineas.raycast=()=>{};
  const grupo=new THREE.Group(); grupo.add(sector,lineas); sector.userData.clave='abanico';

/* ===================== 11. EL ESTADO Y EL RELOJ =====================
   Un solo cálculo (CALC) alimenta la escena, el dock y las cifras: se recalcula cuando cambia un mando. El reloj SIM.t es el
   tiempo del escenario (s) y avanza dt·velocidad; mueve los dos coches, las ruedas, las luces de freno, la cinta del piso, el pedal y el
   cursor de todas las gráficas. Los modos: «Recorrido» (paso a paso), «Probar» (mandos libres) y «Reto». */
const EST={modo:'tour',esc:'autopista',h:1.3,p:0.3,d:0.8,vel:1,pausa:REDUCIDO,autoRunning:false,vista:'todo',rot:false};
const SIM={t:0,calc:null,ver:0,e:null,salto:true};
let CALC=null;
/** Lo que corre ahora: en «Probar», lo que digan los mandos; en el recorrido y el reto, lo que pida el paso. */
function paramsActuales(){
  if(EST.modo==='tour'){ const p=tourParams(); if(p) return p; }
  if(EST.modo==='reto'){ const p=guiaParams(); if(p) return p; }
  return {esc:EST.esc,h:EST.h,p:EST.p,d:EST.d};
}
let _ult=null;
function calcula(pr){
  const esc=escPorId(pr.esc);
  const clave=[esc.id,pr.h,pr.p,pr.d].join('|');
  if(_ult&&_ult.clave===clave) return _ult;
  const r=corre(esc,{h:pr.h,p:pr.p,d:pr.d}), A=r.A, C=A.c[0], N=C.d.length;
  // lo que se dibuja se calcula una vez: la distancia ideal d* = d0 + h·v y el error de distancia, con el mismo reloj que el resto
  const dStar=new Float64Array(N), err=new Float64Array(N); let dMax=0;
  for(let k=0;k<N;k++){ dStar[k]=distDeseada(pr.h,C.v[k]); err[k]=C.d[k]-dStar[k]; dMax=Math.max(dMax,C.d[k],dStar[k]); }
  const tramosFreno=[]; { let ini=-1; for(let k=0;k<N;k++){ const fr=A.al[k]<-0.2; if(fr&&ini<0) ini=k; if((!fr||k===N-1)&&ini>=0){ tramosFreno.push([ini*DTS,k*DTS]); ini=-1; } } }     // dónde frena el de adelante
  let vMax=0; for(let k=0;k<N;k++) vMax=Math.max(vMax,A.vl[k],C.v[k]);
  _ult={clave,pr,esc,A,m:r.m,cad:r.cad,c:cumple(r.m,esc,r.cad),dStar,err,dMax,tramosFreno,vMaxKmh:vMax*3.6};

}
function reiniciaCalculo(){

}
const lerpA=(a,k,f)=>{ const k1=Math.min(k+1,a.length-1); return a[k]+(a[k1]-a[k])*f; };
/* ---- el estado del sistema en el instante t: interpolado entre los pasos de 10 ms de la simulación ---- */
function estadoEn(t){
  const C=CALC; if(!C) return null; const A=C.A, E=A.c[0], k=clamp(Math.floor(t/DTS),0,NPAS), f=clamp(t/DTS-k,0,1);
  const d=lerpA(E.d,k,f), v=lerpA(E.v,k,f);
  return {k,t,x:lerpA(E.x,k,f),v,a:lerpA(E.a,k,f),ac:lerpA(E.ac,k,f),d,dStar:lerpA(C.dStar,k,f),err:lerpA(C.err,k,f),dm:E.dm[k],
    xl:lerpA(A.xl,k,f),vl:lerpA(A.vl,k,f),al:lerpA(A.al,k,f),dv:lerpA(A.vl,k,f)-v,sat:E.sat[k]===1,choca:d<=0,

/* ===================== 12. LO QUE SE VE ===================== */
let ultAviso=false;
const LUZ_FRENO=2.8, LUZ_NORMAL=0.55;
function aplicaEscena(dtS,dtSim,dtR){

  const e=estadoEn(SIM.t); if(!e) return; SIM.e=e;

  COCHE.position.set(0,0,-e.x); LIDER.position.set(0,0,-e.xl);

  for(let i=0;i<4;i++){ ASAS.spins[i].rotation.z=-e.x/LRUEDA; ASAS_L.spins[i].rotation.z=-e.xl/LRUEDA; }
  // ---- luces de freno: se encienden de verdad cuando el coche desacelera ----
  const kE=e.a<-0.35?LUZ_FRENO:LUZ_NORMAL, kL=e.al<-0.35?LUZ_FRENO:LUZ_NORMAL;

  // ---- el haz del radar y la cinta de la distancia en el piso ----
  const dd=Math.max(e.d,0.3); ABANICO.grupo.scale.set(dd,1,dd);
  pintaCinta(-(e.x+NARIZ),Math.max(e.d,0),e.dStar);
  // ---- el aviso: sonido al topar el freno de confort o al acercarse demasiado ----
  const aviso=e.sat||e.choca;
  if(aviso&&!ultAviso&&!EST.pausa&&typeof sonido!=='undefined') sonido.aviso();
  ultAviso=aviso;
  // ---- la luz del sol acompaña al coche ----
  { const zm=(COCHE.position.z+LIDER.position.z)/2, ext=Math.max(8,Math.abs(LIDER.position.z-COCHE.position.z)/2+7);
    LUZ.sol.position.set(-5,12,zm+3); LUZ.sol.target.position.set(0,0,zm);
    if(Math.abs(LUZ.sol.shadow.camera.top-ext)>0.5){ LUZ.sol.shadow.camera.top=ext; LUZ.sol.shadow.camera.bottom=-ext; LUZ.sol.shadow.camera.updateProjectionMatrix(); } }
  SUELO.position.x=Math.round(COCHE.position.x/15)*15; SUELO.position.z=Math.round(COCHE.position.z/15)*15;

const enDiagnostico=()=>EST.modo==='reto'&&GUIA.paso==='diag'&&!GUIA.dxOk;
const enCalcula=()=>EST.modo==='reto'&&GUIA.paso==='calcula';
const NOMBRE_ESC={autopista:'Autopista',atasco:'Atasco',camion:'Camión'};
const FRASE='Ajustas cómo el coche acelera y frena solo para mantener una distancia segura con el de adelante.';
/* mandos: h de 0,6 a 2,4 s (lineal); P de 0,01 a 0,8 y D de 0,2 a 2,0 (escala logarítmica) */
const RANGO_P=[0.01,0.8], RANGO_D=[0.2,2.0];
const gDeU=(u,r)=>r[0]*Math.pow(r[1]/r[0],u/100), uDeG=(g,r)=>100*Math.log(g/r[0])/Math.log(r[1]/r[0]);
const pDeU=u=>gDeU(u,RANGO_P), uDeP=p=>uDeG(p,RANGO_P), dDeU=u=>gDeU(u,RANGO_D), uDeD=d=>uDeG(d,RANGO_D);
const txtH=h=>fN(h,2)+' s', txtP=p=>fN(p,2)+' m/s² por m', txtD=d=>fN(d,2)+' m/s² por m/s';
function slidersHTML(p,ids){
  const [ih,ip,id]=ids;

    <div class="marcas"><span>pegado</span><span>lejos</span></div></div>
  <div class="cg"><div class="cl"><div>Fuerza con que corrige la distancia <em class="gr">(P)</em></div><b id="v${ip}">${txtP(p.p)}</b></div><input type="range" id="${ip}" min="0" max="100" step="1" value="${Math.round(uDeP(p.p))}" aria-label="Fuerza con que corrige cada metro de distancia que sobra o falta, en metros por segundo cuadrado por metro">
    <div class="marcas"><span>suave</span><span>fuerte</span></div></div>
  <div class="cg"><div class="cl"><div>Freno según con qué rapidez se acerca <em class="gr">(D)</em></div><b id="v${id}">${txtD(p.d)}</b></div><input type="range" id="${id}" min="0" max="100" step="1" value="${Math.round(uDeD(p.d))}" aria-label="Respuesta a la velocidad con que se cierra la distancia, en metros por segundo cuadrado por metro por segundo">
    <div class="marcas"><span>poco</span><span>mucho</span></div></div>`;
}

  h+=`<div class="modebar"><button class="b ${EST.modo==='tour'?'on':''}" data-mode="tour"><i>①</i>Recorrido</button><button class="b ${EST.modo==='probar'?'on':''}" data-mode="probar"><i>◎</i>Probar</button><button class="b ${EST.modo==='reto'?'on':''}" data-mode="reto"><i>✎</i>Reto</button></div>`;
  if(EST.modo==='tour') h+=htmlTour();
  else if(EST.modo==='probar'){

    <div class="cg"><div class="cl">Situación</div><div class="seg" id="segEsc">${Object.keys(NOMBRE_ESC).map(k=>`<button class="b ${EST.esc===k?'on':''}" data-esc="${k}">${NOMBRE_ESC[k]}</button>`).join('')}</div></div>

    <div class="formula">d* = d₀ + h·v  (d₀ = ${fN(D0,0)} m)</div>
    <div class="fl">La <b>distancia ideal</b> d* crece con la velocidad: h son los segundos que tardarías en llegar al lugar donde está el de adelante.</div>
    <div class="formula">a = P·(d − d*) + D·(v_líder − v)</div>
    <div class="fl">Si <b>sobra</b> distancia acelera, si <b>falta</b> frena (P); si el de adelante se aleja o se acerca, ajusta con la velocidad relativa (D). Tope de confort: de ${fN(LIM.amin,1)} a +${fN(LIM.amax,1)} m/s².</div>
    <div class="formula">τ·ȧ = a_orden(t − θ) − a  ·  Γ = a₂/a₁</div>
    <div class="fl">El motor y los frenos tardan: retardo θ y lag τ (${CALC?fN(CALC.esc.act.tau*1000,0):'300'} ms y ${CALC?fN(CALC.esc.act.theta*1000,0):'150'} ms aquí). La cadena es <b>estable</b> si |Γ(jω)| ≤ 1 para toda frecuencia.${m?` Aquí: distancia mínima ${fN(m.dmin,1)} m, frenada máxima ${fN(m.frenaMax,1)} m/s², ganancia de cadena ${fN(CALC.cad.pico,2)}.`:''}</div>
  </div></details>
  <details id="dSim"><summary>Simplificaciones</summary><div class="cuerpo"><ul class="no">
    <li>Modelo <b>longitudinal</b> en recta, sin pendiente ni viento; el coche es una masa puntual con actuador de primer orden y retardo.</li>
    <li>El radar entrega distancia y velocidad relativa cada 50 ms con ruido gaussiano (${fN(RADAR.sigD*100,0)} cm y ${fN(RADAR.sigV,2)} m/s); no se pierde el objetivo.</li>
    <li>Los tres escenarios son <b>sintéticos</b>. El cabeceo y las luces son ilustrativos. No es el sistema de un fabricante ni una homologación (ISO 15622).</li>

  </ul><div class="src">Rajamani, <i>Vehicle Dynamics and Control</i> · ISO 15622 (crucero adaptativo) · Swaroop y Hedrick (estabilidad de cadena).</div></div></details></div>`;
  H.innerHTML=h; H.classList.toggle('guia',EST.modo!=='probar'); enlazaHUD(); ajustaHoja();
}
function enlazaHUD(){
  const H=el('hud'), re=()=>{ reiniciaCalculo(); };
  H.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  H.querySelectorAll('[data-esc]').forEach(b=>b.onclick=()=>{ if(EST.autoRunning) return; EST.esc=b.dataset.esc; SIM.t=0; pintaHUD(); re(); });
  const lig=(id,campo,f,fmt)=>{ const e=el(id); if(e) e.oninput=()=>{ if(EST.autoRunning) return; EST[campo]=f(+e.value); el('v'+id).textContent=fmt(EST[campo]); re(); }; };
  lig('rH','h',x=>x/100,txtH); lig('rP','p',pDeU,txtP); lig('rD','d',dDeU,txtD);
  if(el('btnAuto')) el('btnAuto').onclick=runAuto;
  H.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>handleAction(b.dataset.act,b));
  const hint=el('btnHint'); if(hint) hint.onclick=()=>handleAction('hint-v',null);
}

/* ===================== 14. EL DOCK (derecha): cifras y gráficas DOM ===================== */
const FUENTE="'Outfit',system-ui,sans-serif";
function lienzo(id){ const box=el(id), c=box.querySelector('canvas'); return {box,c,ctx:c.getContext('2d'),w:0,h:0,dpr:1}; }
function abre(L){ const r=L.box.getBoundingClientRect(), dpr=Math.min(3,window.devicePixelRatio||1);
  const w=Math.max(20,Math.round(r.width)), h=Math.max(20,Math.round(r.height));
  if(L.w!==w||L.h!==h||L.dpr!==dpr){ L.c.width=Math.round(w*dpr); L.c.height=Math.round(h*dpr); L.w=w; L.h=h; L.dpr=dpr; }
  const x=L.ctx; x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h); return x; }
function txt(x,t,px,py,col,size,align,peso){ x.fillStyle=col; x.font=(peso||'600')+' '+(size||11)+'px '+FUENTE; x.textAlign=align||'left'; x.textBaseline='alphabetic'; x.fillText(t,px,py); }
function raya(x,x1,y1,x2,y2,col,w,dash){ x.strokeStyle=col; x.lineWidth=w||1; x.setLineDash(dash||[]); x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke(); x.setLineDash([]); }
const LFU=lienzo('gFu'), LSO=lienzo('gTr'), LCO=lienzo('gFr'), LVE=lienzo('gSp'), LVO=lienzo('gVol');
const COL={e:'#58d6ff',lid:'#FFA445',ac:'#3DDC97',ord:'rgba(200,215,225,0.55)',peligro:'rgba(244,71,94,0.20)',pelLin:'#ff6b7c',freno:'rgba(255,164,69,0.13)',ideal:'#ffd166',c2:'#9ad8c4',c3:'#c2a8ff'};
const GRID='rgba(160,200,220,0.10)', EJE='#3f6a80', TXT='#8eb3c5';
const ejeT=(X0,X1)=>t=>X0+t/TFIN*(X1-X0);
function cursor(x,X,Y0,Y1){ const px=X(SIM.t); raya(x,px,Y0,px,Y1,'rgba(255,255,255,0.85)',1.2); }
/** Sombrea los tramos en que el de adelante frena (calculados una vez con el modelo). */
function bandaFreno(x,X,Y0,Y1){ const C=CALC; if(!C) return; x.fillStyle=COL.freno; for(const [a,b] of C.tramosFreno) x.fillRect(X(a),Y0,X(b)-X(a),Y1-Y0); }
function ejeY(x,X0,X1,Y,vals,fmt){ x.__uy=undefined; for(const v of vals){ raya(x,X0,Y(v),X1,Y(v),GRID); if(Math.abs(Y(v)-(x.__uy===undefined?-99:x.__uy))>=11){ x.__uy=Y(v); txt(x,fmt?fmt(v):String(v),X0-4,Y(v)+3,TXT,8.5,'right','500'); } } }
function ejeX(x,X,Hd,paso){ for(let t=0;t<=TFIN;t+=paso){ raya(x,X(t),Hd-14,X(t),Hd-11,EJE); txt(x,String(t),X(t),Hd-3,TXT,8.5,'center','500'); } }
const NSUB=2;       // un punto de cada 2 (20 ms) es de sobra para el ancho del dock
function serie(x,X,Y,arr,col,w,dash){ x.setLineDash(dash||[]); x.strokeStyle=col; x.lineWidth=w; x.lineJoin='round'; x.beginPath(); for(let k=0;k<=NPAS;k+=NSUB){ const px=X(k*DTS), py=Y(arr[k]); k?x.lineTo(px,py):x.moveTo(px,py); } x.stroke(); x.setLineDash([]); }
const paso10=m=>m<=30?5:(m<=60?10:(m<=120?20:50));

/* ---- la distancia con el de adelante: la que hay, la ideal d* = d0 + h·v y la zona de peligro ---- */
function pintaDistancia(){
  const x=abre(LFU), Wd=LFU.w, Hd=LFU.h, C=CALC; if(!C) return;
  const X0=30, X1=Wd-8, Y0=8, Y1=Hd-16, X=ejeT(X0,X1), E=C.A.c[0], pa=paso10(C.dMax*1.1), YM=Math.max(20,Math.ceil(C.dMax*1.1/pa)*pa), Y=v=>Y1-v/YM*(Y1-Y0);
  x.save(); x.beginPath(); x.rect(X0,Y0,X1-X0,Y1-Y0); x.clip();
  bandaFreno(x,X,Y0,Y1);
  const lim=C.esc.lim.dmin; x.fillStyle=COL.peligro; x.fillRect(X0,Y(lim),X1-X0,Y1-Y(lim));
  serie(x,X,Y,C.dStar,COL.ideal,1.3,[5,3]);
  serie(x,X,Y,E.d,COL.e,2);
  x.restore();
  const vals=[]; for(let v=0;v<=YM;v+=pa) vals.push(v);
  ejeY(x,X0,X1,Y,vals,v=>fN(v,0)); ejeX(x,X,Hd,4);
  raya(x,X0,Y(lim),X1,Y(lim),COL.pelLin,1,[4,3]);
  txt(x,'m',X0+4,Y0+8,TXT,8.5,'left','600'); txt(x,'s',X1,Hd-3,TXT,8.5,'right','600'); txt(x,'muy cerca',X1-3,Y(lim)-3,COL.pelLin,8.5,'right','600');
  cursor(x,X,Y0,Y1); el('t_fu').textContent='t = '+fN(SIM.t,0)+' s';
}
function pintaLeyDistancia(){
  el('leyFu').innerHTML=`<span class="lg"><i style="--c:${COL.e}"></i>la que hay</span><span class="lg"><i class="dash" style="--c:${COL.ideal}"></i>la ideal (d*)</span><span class="lg"><i class="bl" style="--c:${COL.peligro}"></i>muy cerca</span><span class="lg"><i class="bl" style="--c:${COL.freno}"></i>el de adelante frena</span>`;
}
/* ---- acelerar y frenar: lo que ordena el sistema y lo que hace el coche; los topes de confort a −3,5 y +2 m/s² ---- */
function pintaAcel(){
  const x=abre(LSO), Wd=LSO.w, Hd=LSO.h, C=CALC; if(!C) return;
  const X0=28, X1=Wd-6, Y0=6, Y1=Hd-14, X=ejeT(X0,X1), E=C.A.c[0], AM=2.8, Am=-4.0, Y=v=>Y0+(AM-v)/(AM-Am)*(Y1-Y0);
  x.save(); x.beginPath(); x.rect(X0,Y0,X1-X0,Y1-Y0); x.clip();
  bandaFreno(x,X,Y0,Y1);
  serie(x,X,Y,E.ac,COL.ord,1);
  serie(x,X,Y,E.a,COL.ac,1.9);
  x.restore();
  ejeY(x,X0,X1,Y,[LIM.amin,0,LIM.amax],v=>fN(v,v===0?0:1)); raya(x,X0,Y(0),X1,Y(0),'rgba(160,200,220,0.28)',1);
  raya(x,X0,Y(LIM.amin),X1,Y(LIM.amin),COL.pelLin,1,[4,3]); raya(x,X0,Y(LIM.amax),X1,Y(LIM.amax),COL.pelLin,1,[4,3]);
  cursor(x,X,Y0,Y1); txt(x,'m/s²',X0+3,Y0+8,TXT,8.5,'left','600');
  el('t_pw').textContent=SIM.e?fN(SIM.e.a,1):'';
}
/* ---- las velocidades de los dos coches ---- */
function pintaVel(){
  const x=abre(LCO), Wd=LCO.w, Hd=LCO.h, C=CALC, e=SIM.e; if(!C||!e) return;
  const X0=26, X1=Wd-6, Y0=6, Y1=Hd-14, X=ejeT(X0,X1), E=C.A.c[0], VM=Math.max(40,Math.ceil(C.vMaxKmh*1.08/20)*20), Y=v=>Y1-v/VM*(Y1-Y0);
  x.save(); x.beginPath(); x.rect(X0,Y0,X1-X0,Y1-Y0); x.clip();
  bandaFreno(x,X,Y0,Y1);
  x.setLineDash([]); x.lineWidth=1.6; x.lineJoin='round';
  for(const [arr,col] of [[C.A.vl,COL.lid],[E.v,COL.e]]){ x.strokeStyle=col; x.beginPath(); for(let k=0;k<=NPAS;k+=NSUB){ const px=X(k*DTS), py=Y(arr[k]*3.6); k?x.lineTo(px,py):x.moveTo(px,py); } x.stroke(); }
  x.restore();
  const vals=[]; for(let v=0;v<=VM;v+=VM>100?40:20) vals.push(v);
  ejeY(x,X0,X1,Y,vals,v=>fN(v,0));
  cursor(x,X,Y0,Y1); txt(x,'km/h',X0+3,Y0+8,TXT,8.5,'left','600');
  txt(x,'tú',X1-4,Y0+9,COL.e,9,'right','700'); txt(x,'el de adelante',X1-22,Y0+9,COL.lid,9,'right','700');
  el('t_fr').textContent=fN(e.v*3.6,0)+' km/h';
}
/* ---- la cadena: la aceleración de tres coches idénticos en fila; si el tiempo de brecha es corto, cada uno frena MÁS que el anterior ---- */
function pintaCadena(){
  const x=abre(LVE), Wd=LVE.w, Hd=LVE.h, C=CALC; if(!C) return;
  const X0=30, X1=Wd-6, Y0=4, Y1=Hd-14, X=ejeT(X0,X1), AM=2.8, Am=-4.0, Y=v=>Y0+(AM-v)/(AM-Am)*(Y1-Y0);
  x.save(); x.beginPath(); x.rect(X0,Y0,X1-X0,Y1-Y0); x.clip();
  bandaFreno(x,X,Y0,Y1);
  serie(x,X,Y,C.A.c[2].a,COL.c3,1.3); serie(x,X,Y,C.A.c[1].a,COL.c2,1.3); serie(x,X,Y,C.A.c[0].a,COL.e,1.9);
  x.restore();
  ejeY(x,X0,X1,Y,[LIM.amin,0,LIM.amax],v=>fN(v,v===0?0:1)); ejeX(x,X,Hd+2,4);
  raya(x,X0,Y(LIM.amin),X1,Y(LIM.amin),'rgba(255,209,102,0.55)',1,[4,3]); raya(x,X0,Y(0),X1,Y(0),'rgba(160,200,220,0.28)',1);
  cursor(x,X,Y0,Y1); txt(x,'m/s²',X0+3,Y0+8,TXT,8.5,'left','600');
  const g=C.cad.pico, mal=!C.cad.estable;
  el('t_sp').innerHTML=`<span style="color:${COL.e}">● tú</span> <span style="color:${COL.c2}">● 2.º</span> <span style="color:${COL.c3}">● 3.º</span> · cadena <b style="color:${mal?'#ff9aa8':'#9be8c4'}">×${fN(g,2)}</b>`;
}
/* ---- el pedal: un instrumento nítido, arriba acelera y abajo frena; marcas rojas en los topes de confort ---- */
function pintaPedal(){
  const x=abre(LVO), Wd=LVO.w, Hd=LVO.h, e=SIM.e; if(!e) return;
  const AM=2.8, Am=-4.0, Y0=13, Y1=Hd-13, Y=v=>Y0+(AM-v)/(AM-Am)*(Y1-Y0), bx=Wd/2-7, bw=14;
  x.fillStyle='rgba(0,0,0,0.30)'; x.fillRect(bx,Y0,bw,Y1-Y0);
  const a=clamp(e.a,Am,AM); x.fillStyle=a>=0?'#3DDC97':'#ff7a5c'; x.fillRect(bx,Math.min(Y(0),Y(a)),bw,Math.abs(Y(a)-Y(0)));
  const o=clamp(e.ac,Am,AM); x.strokeStyle='rgba(235,245,250,0.85)'; x.lineWidth=1.5; x.beginPath(); x.moveTo(bx-4,Y(o)); x.lineTo(bx+bw+4,Y(o)); x.stroke();
  raya(x,bx-6,Y(0),bx+bw+6,Y(0),'rgba(200,220,230,0.6)',1);
  for(const v of [LIM.amin,LIM.amax]) raya(x,bx-8,Y(v),bx+bw+8,Y(v),'#ff6b7c',2);
  txt(x,'acelera',Wd/2,9,TXT,8.5,'center','600'); txt(x,'frena',Wd/2,Hd-3,TXT,8.5,'center','600');
}
function pintaDockFijo(){
  el('p_mode').textContent=EST.modo==='tour'?'Recorrido':(EST.modo==='probar'?(CALC?NOMBRE_ESC[CALC.esc.id]:''):(enCalcula()?'Un solo instante':(enDiagnostico()?'Averigua la falla':(CALC?CALC.esc.nombre:''))));

}
const _cl=(id,c)=>{ const e=el(id); if(e.className!==c) e.className=c; };
function pintaDock(){
  const C=CALC, e=SIM.e; if(!C||!e) return; const set=(id,h)=>{ const q=el(id); if(q.innerHTML!==h) q.innerHTML=h; };

  if(isFinite(e.brecha)&&e.brecha<9.9){ set('f_6',sm(e.brecha,'s',2)); _cl('f_6',''); } else { set('f_6','<small>—</small>'); _cl('f_6',''); }

function pintaGraficas(){ pintaDistancia(); pintaAcel(); pintaVel(); pintaCadena(); pintaPedal(); }

/* ===================== 17. DISPOSICIÓN: ANCHO, ESTRECHO, MÓVIL =====================
   Si no caben guía, escena y dock lado a lado (el marco de la plataforma, una tableta), la escena va arriba
   y guía e instrumentos comparten una hoja con pestañas abajo. */
function disposicion(){
  const W=innerWidth, b=document.body;
  const estrecho=W<1080, movil=W<640;
  b.classList.toggle('estrecho',estrecho); b.classList.toggle('movil',movil); b.classList.toggle('ancho',estrecho&&!movil);
  if(estrecho){ if(!b.classList.contains('t-hud')&&!b.classList.contains('t-panel')) b.classList.add('t-hud'); ajustaHoja(); }
  el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('on',b.classList.contains('t-'+t.dataset.tab)));
}
function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.40:0.43),240,450));
  let hh=base; const hud=el('hud');
  if(movil&&b.classList.contains('t-panel')) hh=Math.round(clamp(H*0.55,240,540));
  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;
    hh=Math.round(clamp(pide,240,Math.max(base,H*(movil?0.45:0.56)))); }
  const ant=parseFloat(b.style.getPropertyValue('--hojaH'))||0;
  if(Math.abs(ant-hh)>1){ b.style.setProperty('--hojaH',hh+'px'); colocaBarras(); centraEnHueco(); }
}

/* ===================== 19. EL RETO: CALCULA, AJUSTA, DIAGNOSTICA =====================
   Tres fases: 1 · Calcula (¿qué distancia ideal deja el coche? d* = d₀ + h·v), 2 · Ajusta (h, P y D para un escenario: sin acercarse de más,
   sin frenar a fondo ni a tirones, con la distancia siempre cerca de la ideal, sin amplificar la frenada hacia atrás y sin quedarse lejos; la
   ventana es INTERIOR en los tres mandos y los números del veredicto sólo aparecen al validar) y 3 · Diagnostica (¿por qué falla este sistema?, sólo con
   lo que se ve en el dock). Cierra con un quiz de tres preguntas. */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETOS={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'calcula',iniciado:false,dxOk:false,r1:null,r2:null,dx:null,orden:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0};

/* ---------- Fase 1 · Calcula: la distancia ideal ---------- */
const CASOS_1=[{kmh:90,h:1.5},{kmh:72,h:1.2},{kmh:108,h:1.8},{kmh:54,h:2.0},{kmh:126,h:1.1},{kmh:36,h:1.6},{kmh:120,h:1.4}];
function sorteaCaso1(){ const p=GUIA.r1&&GUIA.r1.kmh+'|'+GUIA.r1.h; let c; do{ c=pickOne(CASOS_1); }while(c.kmh+'|'+c.h===p); GUIA.r1=Object.assign({},c,{res:distMano(c.kmh,c.h)}); }
function numeroDe(txt){ const raw=String(txt||'').trim().replace(/\s/g,'').replace(/ /g,'').replace(',','.'); return parseFloat(raw); }
function checkCalcula(){
  const v=numeroDe((el('ansV')||{}).value), r=GUIA.r1, ok=r.res.d;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe la distancia en metros (con coma o punto decimal).'); return; }
  RETOS.intentos++;
  if(Math.abs(v-ok)<=0.5){
    RETOS.fallos1=0; sonido.bien();
    feedback('good','¡Correcto! ✓',`Velocidad: ${fN(r.kmh,0)} km/h ÷ 3,6 = ${fN(r.res.v,1)} m/s. Distancia ideal = ${fN(D0,0)} + ${fN(r.h,1)} × ${fN(r.res.v,1)} = <b>${fN(ok,1)} m</b>. Es lo que el sistema intenta mantener todo el tiempo.`,true);
    paso('ajusta'); prepararAjusta();
  } else {
    RETOS.fallos1++; sonido.mal();
    if(RETOS.fallos1>=3){ RETOS.fallos1=0; RETOS.resiembras++; sorteaCaso1(); feedback('bad','Tres intentos fallidos','Cambia el caso. Recuerda: distancia = 5 m + tiempo de brecha × velocidad, con la velocidad en m/s.'); reiniciaCalculo(); pintaHUD(); }
    else { feedback('bad','Revisa el cálculo',(Math.abs(v-(r.h*r.kmh))<1?'¿Pasaste los km/h a m/s (÷ 3,6)? ':(Math.abs(v-r.res.v*r.h)<0.6?'No olvides sumar los 5 m de parada. ':''))+`Primero saca la velocidad en m/s; luego multiplícala por el tiempo de brecha y suma los 5 m. (intentos fallidos: ${RETOS.fallos1}/3)`); const t=el('d_try'); if(t) t.textContent=RETOS.fallos1; }
  }
}

/* ---------- Fase 2 · Ajusta h, P y D ---------- */
function prepararAjusta(){
  let e; do{ e=pickOne(ESCENARIOS); }while(GUIA.r2&&ESCENARIOS.length>1&&e.id===GUIA.r2.esc.id);
  GUIA.r2={esc:e,h:0.8,p:0.1,d:0.4,validado:false,res:null,intentos:0};
  reiniciaCalculo(); pintaHUD();
}
/** Rangos que cumplen todo con los otros mandos como están: la ventana (se muestra sólo tras acertar). */
function rangoMando(r,cual){
  const esc=r.esc; let a=null,b=null;
  for(let i=0;i<=100;i++){ const x=cual==='h'?0.6+i*0.018:(cual==='p'?pDeU(i):dDeU(i)), res=corre(esc,{h:cual==='h'?x:r.h,p:cual==='p'?x:r.p,d:cual==='d'?x:r.d}); if(cumpleTodo(res.m,esc,res.cad)){ if(a===null) a=x; b=x; } }
  return a===null?null:[a,b];
}
function validarAjusta(){
  const r=GUIA.r2; if(!r) return;
  const E=r.esc, m=CALC.m, cad=CALC.cad; r.res=m; r.validado=true; r.intentos++; RETOS.intentos++;
  const c=cumple(m,E,cad), ok=cumpleTodo(m,E,cad);
  reiniciaCalculo();
  const cifras=`Distancia mínima <b>${fN(m.dmin,1)} m</b> (mínimo ${fN(E.lim.dmin,0)}), frenada máxima <b>${fN(m.frenaMax,1)} m/s²</b> y tirones de <b>${fN(m.jerk,2)} m/s³</b> (tope ${fN(-LIM.amin,1)} y ${fN(E.lim.jerk,2)}), error máximo de distancia <b>${fN(m.emax,1)} m</b> (máx. ${fN(E.lim.emax,1)}), ganancia de cadena <b>×${fN(cad.pico,2)}</b> (debe ser ≤ 1) y distancia final <b>${fN(m.dfin,0)} m</b> (máx. ${fN(E.lim.dfin,0)}).`;
  if(ok){
    RETOS.fallos2=0; sonido.bien(); const rh=rangoMando(r,'h'), rp=rangoMando(r,'p'), rd=rangoMando(r,'d');
    const f2=(q,d)=>q?fN(q[0],d)+' y '+fN(q[1],d):'—';
    feedback('good','¡Lo conseguiste! ✓',`${cifras} Con tus otros mandos, h entre <b>${f2(rh,2)} s</b> habría servido; con los tuyos, P entre <b>${f2(rp,2)}</b> y D entre <b>${f2(rd,2)}</b>. Muy pegado se amplifica la frenada y casi se choca; muy lejos se cuelan otros coches; y una D mal puesta hace frenar a tirones: la ventana está en el interior.`,true);
    pintaHUD(); paso('diag'); iniciaDiag();
  } else {
    RETOS.fallos2++; sonido.mal();
    let msg=cifras+' ';
    if(!c.d) msg+='Se acercó <b>demasiado</b> al de adelante: poco tiempo de brecha o reacciona tarde. ';
    if(!c.conf) msg+=(m.sat>0.3?'El freno llegó al <b>tope de confort</b>: reacciona tarde y luego frena a fondo. ':'Los <b>tirones</b> del pedal son muy fuertes: el ruido del radar se cuela por una D demasiado alta. ');
    if(!c.prec) msg+=(m.cruces>=2?'La distancia <b>oscila</b> alrededor de la ideal (efecto acordeón). ':'La distancia se <b>apartó mucho</b> de la ideal: corrige con poca fuerza. ');
    if(!c.cad) msg+='La frenada se <b>amplifica en cadena</b>: con tu ajuste, cada coche igual que viene detrás frena más que el anterior. ';
    if(!c.lejos) msg+='Quedó <b>demasiado lejos</b>: así otros coches se meten en medio. ';
    if(RETOS.fallos2>=4){ RETOS.fallos2=0; RETOS.resiembras++; feedback('bad','Cuatro validaciones sin lograrlo',msg+'Cambia el escenario.',true); prepararAjusta(); }
    else { feedback('bad','Todavía no',msg+`(validaciones fallidas: ${RETOS.fallos2}/4)`,true); pintaHUD(); }
  }
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const CASOS_DX=[
  {k:'corto',esc:'autopista',h:0.6,p:0.3,d:0.8},
  {k:'tarde',esc:'autopista',h:1.3,p:0.3,d:0.2},

function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.k; let c; do{ c=pickOne(CASOS_DX); }while(c.k===p);
  GUIA.dx=c; GUIA.dxOk=false; GUIA.orden=barajar(CASOS_DX.map(x=>x.k));

}
function diagnostica(k){

    else { feedback('bad','No es ese',noEs(k)+` (intentos fallidos: ${RETOS.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(k){
  if(k==='corto') return 'La distancia que deja es muy corta para su velocidad (h chico): frena más fuerte para no chocar y, abajo, cada coche de la fila frena más que el anterior. Es la estabilidad de cadena: hace falta más tiempo de brecha.';
  if(k==='tarde') return 'Casi no usa la velocidad relativa (D chica): no frena hasta que ya está muy cerca y entonces tiene que pisar el freno casi a fondo; la distancia sube y baja como un acordeón.';
  if(k==='nervioso') return 'Reacciona demasiado a la velocidad relativa (D grande): el ruido del radar se convierte en tirones del pedal y, con el retardo del motor y el freno, empieza a oscilar.';
  return 'Es seguro pero deja demasiada distancia para su velocidad (h grande): en la práctica otros coches se meten en el hueco y el sistema tiene que frenar para acomodarlos.';
}
function noEs(k){

}

/* ===================== 20. CÁMARAS =====================
   La escena se encuadra con el hueco que dejan la guía y el dock: la cámara se aleja lo justo para que la caja del
   «objeto» (ancho × alto en unidades) quepa entera en ese hueco, y la proyección se desplaza para centrarla en él.
   Además el objeto nunca pasa del 70 % del alto del lienzo. */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}
/* La cámara sigue al coche propio (o a los dos). Cada vista es un desplazamiento respecto del ancla (hacia atrás, hacia arriba y de lado); «La cámara» es la del
   propio coche, que mira lo que mira el radar. */
const zCoche=()=>COCHE.position.z, zLider=()=>LIDER.position.z;
const anclaCoche=(dz)=>()=>V3(0,0.5,zCoche()-dz);
const anclaPar=()=>V3(0,0.5,(zCoche()+zLider())/2);
const largoPar=()=>Math.abs(zLider()-zCoche())+LCOCHE;
const VISTAS={
  todo:{dir:[0.93,0.24,0.14],anc:anclaCoche(-0.5),toff:[0,0.3],obj:()=>({w:3.0,h:1.8}),fov:26,tope:0.80},
  cerca:{dir:[0.66,0.26,0.70],anc:anclaCoche(0.2),toff:[0,0.2],obj:()=>({w:3.8,h:2.0}),fov:30,tope:0.74},
  dos:{dir:[0.12,0.50,1.0],anc:anclaPar,toff:[0,0],obj:()=>({w:Math.max(11,largoPar()+5),h:6}),fov:34,tope:0.60},
  cenital:{dir:[0.02,1.0,0.0],anc:anclaPar,toff:[0,0],obj:()=>({w:7,h:Math.max(14,largoPar()+5)}),fov:34,tope:0.76},
  camara:{fijo:true,fov:62,tope:1,obj:()=>({w:1,h:1}),anc:anclaCoche(0),dir:[0.5,0.5,0],toff:[0,0]},
};
const CAM={off:V3(3,6,5),toff:V3(0,0,0),auto:true,previo:null,k:1,dur:1};
function fovVista(v){ return v==='camara'?62:(innerWidth<innerHeight*0.9?(VISTAS[v].fov+8):VISTAS[v].fov); }
function distanciaFit(w,h,fov,tope){
  const Hu=huecoLibre(), W=innerWidth, Hh=innerHeight, tv=Math.tan(fov*Math.PI/360), th=tv*(W/Hh);
  const wF=Math.max(80,Hu.x1-Hu.x0)/W, hF=Math.max(80,Hu.y1-Hu.y0)/Hh;
  const D=1.06*Math.max(w/(2*th*wF),h/(2*tv*hF));
  return Math.max(D,h/(2*tv*(tope||0.66)));
}
/** Desplazamiento deseado de la cámara respecto al ancla, en el mundo: atrás = +Z, izquierda = −X. */
function ofsDeseado(v){
  const V=VISTAS[v], o=V.obj(), fov=fovVista(v), D=distanciaFit(o.w,o.h,fov,V.tope);
  const d=V3(V.dir[2],V.dir[1],V.dir[0]).normalize().multiplyScalar(D);
  const to=V3(0,V.toff[1],-V.toff[0]);
  return {off:d,toff:to,fov};
}
function ponVista(v,dur){
  EST.vista=v; CAM.auto=true; CAM.dur=dur===undefined?1.0:dur; controls.enabled=v!=='camara';
  if(typeof pintaBarras==='function') pintaBarras();
  if(CAM.dur<=0.01){ SIM.salto=true; pasaCam(1); }
}
const _eye=new THREE.Vector3(), _tg=new THREE.Vector3();
function pasaCam(dt){
  const V=VISTAS[EST.vista];
  if(V.fijo){                                       // la cámara del parabrisas: mira donde mira el coche
    _eye.copy(POS_CAMARA).add(V3(0,0.05,0.1)); COCHE.localToWorld(_eye); _tg.set(0,0.9,-60); COCHE.localToWorld(_tg);
    camera.position.copy(_eye); controls.target.copy(_tg); if(Math.abs(camera.fov-V.fov)>0.05){ camera.fov=V.fov; camera.updateProjectionMatrix(); } CAM.previo=null; return; }
  const P=V.anc(), snap=SIM.salto;
  if(CAM.auto){
    const d=ofsDeseado(EST.vista), k=snap?1:1-Math.exp(-dt/Math.max(0.05,(CAM.dur||1)*0.30));
    CAM.off.lerp(d.off,k); CAM.toff.lerp(d.toff,k);
    if(Math.abs(camera.fov-d.fov)>0.05){ camera.fov+=(d.fov-camera.fov)*(snap?1:k); camera.updateProjectionMatrix(); }
    camera.position.copy(P).add(CAM.off); controls.target.copy(P).add(CAM.toff);
  } else if(CAM.previo){ const dP=P.clone().sub(CAM.previo); camera.position.add(dP); controls.target.add(dP); }
  CAM.previo=P.clone(); SIM.salto=false;
}
controls.addEventListener('start',()=>{ CAM.auto=false; });


/* ===================== 21. SONIDO (sintetizado) =====================
   Un zumbido grave de rodadura cuyo tono sigue a la velocidad del coche (muy atenuado), el aviso al tocar el tope de confort (dos pitidos) y los avisos de acierto y fallo. */
const sonido=(function(){
  let ctx=null,on=true,master=null,ult=0,zum=null,zg=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      zum=ctx.createOscillator(); zg=ctx.createGain(); zum.type='sawtooth'; zum.frequency.value=60; zg.gain.value=0; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=200; zum.connect(lp); lp.connect(zg); zg.connect(master); zum.start();
    }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); ult=f; }
  return {init,
    zumbido:(q)=>{ if(!ctx||!zum) return; const t=ctx.currentTime; zum.frequency.setTargetAtTime(38+q*50,t,0.15); zg.gain.setTargetAtTime(on&&q>0?0.008:0,t,0.15); },
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    aviso:()=>{ tono(880,0.09,0.06,'square'); setTimeout(()=>tono(880,0.09,0.06,'square'),130); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }, get freq(){ return ult; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };

/* ===================== 22. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.max(Math.min(devicePixelRatio,alta?2:1.5),Math.min(devicePixelRatio,1.5)>1?1.25:1));
  const ms=alta?2048:1024; if(LUZ.sol.shadow.mapSize.x!==ms){ LUZ.sol.shadow.mapSize.set(ms,ms); if(LUZ.sol.shadow.map){ LUZ.sol.shadow.map.dispose(); LUZ.sol.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); if(typeof ponVista==='function'&&CALC) ponVista(EST.vista,0.001); centraEnHueco();
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 23. EL LAZO: UN SOLO RELOJ =====================
   El tiempo del escenario avanza dt·velocidad en cada cuadro, y con ESE tiempo se mueven los coches, las lecturas, la estimación
   y la elipse, y se dibujan las gráficas del dock. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0, tSon=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  const dtS=EST.pausa?0:dt, dtSim=dtS*EST.vel;
  aplicaEscena(dtS,dtSim,dt);
  pasaCam(dt);
  if(t-tSon>0.4){ tSon=t; sonido.zumbido(SIM.e&&!EST.pausa?clamp(SIM.e.v/40,0,1):0); }
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaGraficas(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos(); colocaFoco();
}

   Abre funcionando y con el recorrido en el paso 1: el coche rueda, la cámara reconoce el carril y el volante ya se corrige solo,
   antes de que el alumno toque nada. */
disposicion();

SIM.t=TOUR_PASOS[0].t0; SIM.salto=true;

aplicaEscena(0.02,0.02);
pintaBarras();
ponVista('todo',0.001);
centraEnHueco();
pintaDockFijo();
cuadro();

/* ===================== 25. GANCHOS DE PRUEBA ===================== */
/** Mide el objeto en lo VISIBLE: se pinta sin suelo ni fondo sobre magenta puro y se toma la caja de los píxeles que no son magenta.
 *  solo: 'coche' pinta únicamente el coche propio (la medida honesta del protagonista); 'par' pinta los dos coches y la cinta; por defecto, coche + lo que lo rodea. */
function mideObjeto(solo){
  const ocultos=[]; scene.traverse(o=>{ if(o.userData&&o.userData.fondo&&o.visible){ o.visible=false; ocultos.push(o); } });
  if(solo==='coche'||solo==='par'){ for(const o of MUNDO.children){ const dejar=o===COCHE||(solo==='par'&&(o===LIDER||(o.userData&&['cinta','falta','sobra','marca'].includes(o.userData.clave)))); if(!dejar&&o.visible){ o.visible=false; ocultos.push(o); } } }
  else VIA.grupo.children.forEach(o=>{ const k=o.userData&&o.userData.clave; if((k==='arboles'||k==='barrera')&&o.visible){ o.visible=false; ocultos.push(o); } });       // el árbol y la barrera sólo dan contexto: no cuentan como objeto
  if(solo==='coche'&&ABANICO.grupo.visible){ ABANICO.grupo.visible=false; ocultos.push(ABANICO.grupo); }      // el haz del radar cuelga del coche pero no es el coche
  const bg=scene.background, fog=scene.fog; scene.background=null; scene.fog=null; renderer.setClearColor(0xff00ff,1);
  renderer.render(scene,camera);
  const c=renderer.domElement, W=c.width, H=c.height, t=document.createElement('canvas'); t.width=W; t.height=H; const g=t.getContext('2d',{willReadFrequently:true}); g.drawImage(c,0,0);
  const d=g.getImageData(0,0,W,H).data; let x0=1e9,x1=-1,y0=1e9,y1=-1;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=(y*W+x)*4; if(!(d[i]>235&&d[i+1]<30&&d[i+2]>235)){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  for(const o of ocultos) o.visible=true; scene.background=bg; scene.fog=fog; renderer.setClearColor(0x000000,1);
  const k=W/innerWidth; return {x0:x0/k,x1:x1/k,y0:y0/k,y1:y1/k,altoPx:(y1-y0)/k,anchoPx:(x1-x0)/k,fracAlto:(y1-y0)/H,fracAncho:(x1-x0)/W,hueco:huecoLibre(),W:innerWidth,H:innerHeight};
}

};
