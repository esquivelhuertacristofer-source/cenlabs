<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Control vectorial (FOC) del motor de tracción — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#08161F;--panel:rgba(7,20,28,.88);--line:#21495C;--ink:#EAF4F8;
    --dim:#9BB8C4;--accent:#5BC8FF;--accent2:#A8E2FF;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cA:#FF6B5B;--cB:#FFC53D;--cC:#4CC9F0;--cD:#9B8CFF;--cQ:#3DDC97;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#0f2733;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#173748}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#031a20;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#031a20;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#8ad8ff}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#031a20}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#5BC8FF;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f87a0;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f90a8;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#031a20}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .escs{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
  .esc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px;font-size:11.5px;line-height:1.35;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);color:#c4d3e6}
  .esc .rs{font-weight:700;font-size:11px}.esc .rs.ok{color:var(--good)}.esc .rs.mal{color:#ff9a9a}
  .esc .pista{font-size:10.5px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#09121c;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(30,53,80,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,53,80,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f87a0}
  .dk-tit{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#a3bcd6;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c6da;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#0f2733;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfdcec;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cQ);flex:none}
  /* ---- el recorrido paso a paso y el aro que señala la pieza ---- */
  .tour{border:1px solid rgba(91,200,255,.38);background:rgba(91,200,255,.06);border-radius:12px;padding:10px 11px;display:flex;flex-direction:column;gap:7px}
  .tour .tn{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .tour .pts{display:flex;gap:5px}.tour .pts i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}.tour .pts i.on{background:var(--accent)}.tour .pts i.ok{background:var(--good)}
  .tour h3{font-size:16px;line-height:1.2}
  .tour .tx{font-size:13px;line-height:1.5;color:#d3e3ea}.tour .tx b{color:#fff}
  .tour .tb{display:flex;gap:6px}.tour .tb .b{flex:1}
  .tour .salta{align-self:flex-end;font-size:11px;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:0;font-family:inherit}
  .foco{position:fixed;z-index:14;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 3px rgba(91,200,255,.55),0 0 24px 6px rgba(91,200,255,.45);pointer-events:none;display:none;animation:pulso 1.5s ease-in-out infinite}
  @keyframes pulso{0%,100%{transform:scale(.88);opacity:.95}50%{transform:scale(1.12);opacity:.55}}
  @media (prefers-reduced-motion:reduce){.foco{animation:none}}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,18,30,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,18,30,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d3e6}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,18,30,.92);border:1px solid rgba(124,196,255,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,18,30,.84);border:1px solid rgba(124,196,255,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .chips{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .chip{font-size:11.5px;line-height:1.35;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--dim)}
  .chip b{color:var(--ink)} .chip small{font-size:10.5px;color:var(--dim)}
  .chip.ok{border-color:rgba(52,211,153,.5)} .chip.ok b{color:var(--good)} .chip.mal{border-color:rgba(244,71,94,.5)} .chip.mal b{color:#ff9aa8}
  .dk-g{transition:opacity .2s}
body.en-calcula #gTr,body.en-calcula #gFr,body.en-calcula #gSp{opacity:.15}
.cg.oculto{display:none}
  /* el reto lleva más mandos: los desplegables van en una fila y el título baja de tamaño para que nada se corte a 768 px de alto */
  body.m-reto:not(.estrecho) .hdet{flex-direction:row}
  body.m-reto:not(.estrecho) .hdet>details{flex:1;min-width:0}
  body.m-reto:not(.estrecho) .hdet details[open]{position:fixed;left:calc(var(--hudW) + 36px);bottom:72px;width:min(440px,calc(100vw - var(--hudW) - var(--dockW) - 80px));z-index:25;background:rgba(9,19,32,.97)}
  body.m-reto:not(.estrecho) .hud h2{display:none}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';

/* ============================================================
   LAB — CONTROL VECTORIAL (FOC) DEL MOTOR DE TRACCIÓN: DE TRES CORRIENTES A DOS NÚMEROS
   (Autotrónica · mecanica-155)

   Un motor síncrono de imanes recibe tres corrientes que giran (abc). Con las transformadas de Clarke y Park se ven desde el
   rotor como dos números FIJOS: id (campo) e iq (fuerza). El par sale de ellos y un regulador PI de corriente, con la tensión
   limitada por el inversor, los lleva adonde se piden. A alta velocidad los imanes «comen» la tensión y hace falta una id
   negativa (debilitamiento de campo). La planta, el regulador, las estrategias y las métricas son un único modelo, en un bloque
   puro que un script de Node extrae TAL CUAL y verifica.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO='\u202F';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }



/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos marcas— y lo prueba:
   lo que se prueba es lo que corre. */
/* FISICA:INICIO */
/* ---- Control vectorial (FOC) de un motor de tracción síncrono de imanes interiores (IPM): física pura (sin three). SI. ----
   Cadena: tres corrientes de fase (abc) → Clarke (αβ, estacionario) → Park (dq, girando con el rotor) → dos números fijos (id, iq)
   → el par sale de ellos: T = 3/2·p·(ψm·iq + (Ld−Lq)·id·iq). La planta es el motor en ejes dq (con R, Ld, Lq y el flujo de los imanes);
   el controlador es un PI de corriente por eje, con desacople opcional, tensión limitada por el círculo del inversor (Vdc/√3) y
   anti-windup; la consigna de (id, iq) sale de la estrategia elegida (id=0, MTPA o debilitamiento de campo).
   Las transformadas son de AMPLITUD INVARIANTE (por eso el par y la potencia llevan el factor 3/2). */
const DOSPI=Math.PI*2, RAIZ3=Math.sqrt(3);
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const suave=t=>t*t*(3-2*t);

/* ---- El motor: valores de orden de magnitud de un motor de tracción de unos 80–100 kW; NO es un motor comercial concreto ---- */
const MOT={p:4,R:0.012,Ld:0.20e-3,Lq:0.55e-3,psi:0.085,Vdc:350,Imax:350};    // pares de polos · Ω de fase · H · H · Wb (pico, por fase) · V · A (pico)
const VMAX=MOT.Vdc/RAIZ3;                                                    // radio del círculo de tensión: modulación vectorial lineal
/* ---- Tiempo: el lazo corre a 10 kHz; el escalón de par llega a los 2 ms y la ventana dura 24 ms ---- */
const TS=100e-6, SUB=5, TFIN=0.024, TSTEP=0.002, NP=Math.round(TFIN/TS), KSTEP=Math.round(TSTEP/TS);
const FRAC_T0=0.25;                                                          // el par de partida del escalón: la cuarta parte del pedido

/* ---- Transformadas (amplitud invariante) ---- */
const clarke=(a,b,c)=>({al:(2/3)*(a-b/2-c/2),be:(b-c)/RAIZ3});
const iclarke=(al,be)=>({a:al,b:-al/2+RAIZ3/2*be,c:-al/2-RAIZ3/2*be});
const park=(al,be,th)=>{ const c=Math.cos(th),s=Math.sin(th); return {d:al*c+be*s,q:-al*s+be*c}; };
const ipark=(d,q,th)=>{ const c=Math.cos(th),s=Math.sin(th); return {al:d*c-q*s,be:d*s+q*c}; };
const abcDeDq=(d,q,th)=>{ const r=ipark(d,q,th); return iclarke(r.al,r.be); };
const dqDeAbc=(a,b,c,th)=>{ const r=clarke(a,b,c); return park(r.al,r.be,th); };

/* ---- Par, tensión en régimen y frecuencia eléctrica ---- */
const omegaE=(n,M)=>(M||MOT).p*n*DOSPI/60;                                   // rad/s eléctricos a n rpm mecánicas
const par=(id,iq,M)=>{ M=M||MOT; return 1.5*M.p*(M.psi*iq+(M.Ld-M.Lq)*id*iq); };
function vReg(id,iq,we,M){ M=M||MOT; const vd=M.R*id-we*M.Lq*iq, vq=M.R*iq+we*(M.Ld*id+M.psi); return {vd,vq,v:Math.hypot(vd,vq)}; }
/** Derivadas de la planta en ejes dq: Ld·did/dt = vd − R·id + ωe·Lq·iq ; Lq·diq/dt = vq − R·iq − ωe·(Ld·id + ψm). */
function derivs(s,v,we,M){ M=M||MOT; return [(v[0]-M.R*s[0]+we*M.Lq*s[1])/M.Ld,(v[1]-M.R*s[1]-we*(M.Ld*s[0]+M.psi))/M.Lq]; }
function rk4(s,v,we,dt,M){
  const f=x=>derivs(x,v,we,M), k1=f(s), k2=f([s[0]+dt/2*k1[0],s[1]+dt/2*k1[1]]), k3=f([s[0]+dt/2*k2[0],s[1]+dt/2*k2[1]]), k4=f([s[0]+dt*k3[0],s[1]+dt*k3[1]]);
  return [s[0]+dt/6*(k1[0]+2*k2[0]+2*k3[0]+k4[0]),s[1]+dt/6*(k1[1]+2*k2[1]+2*k3[1]+k4[1])];
}

/* ---- MTPA (máximo par por amperio): con corriente de módulo Is, id = ψm/(4(Lq−Ld)) − √(ψm²/(16(Lq−Ld)²) + Is²/2) ---- */
function mtpaId(Is,M){ M=M||MOT; const d=M.Lq-M.Ld; if(d<1e-12) return 0; const a=M.psi/(4*d); return a-Math.sqrt(a*a+Is*Is/2); }
function mtpaPunto(Is,M){ const id=mtpaId(Is,M), iq=Math.sqrt(Math.max(0,Is*Is-id*id)); return {id,iq}; }
/** El punto MTPA que da el par T (el par crece sin pausa con Is a lo largo de la curva: se bisecta). */
function mtpaParaPar(T,M){
  M=M||MOT; if(T<=0) return {id:0,iq:0,Is:0};
  let lo=0,hi=4*M.Imax; for(let i=0;i<80;i++){ const m=(lo+hi)/2, p=mtpaPunto(m,M); if(par(p.id,p.iq,M)<T) lo=m; else hi=m; }
  const Is=(lo+hi)/2, p=mtpaPunto(Is,M); return {id:p.id,iq:p.iq,Is};
}
/** La corriente característica ψm/Ld: si es menor que Imax, el motor puede debilitar el campo hasta cancelar los imanes (velocidad «infinita»). */
const corrienteCaracteristica=M=>{ M=M||MOT; return M.psi/M.Ld; };

/* ---- Consignas de corriente según la estrategia ----
   «cero»: id=0 (sólo par de imanes) · «mtpa»: la menor corriente que da el par · «fw»: MTPA y, si la tensión no cabe (reserva k del círculo),
   la id menos negativa que sí cabe, sobre la curva de par constante. Siempre se respeta Imax (se recorta iq y se conserva id). */
function consignas(est,T,n,k,M){
  M=M||MOT; const we=omegaE(n,M);
  if(T<=0) return {id:0,iq:0,I:0,limita:false,cabe:true};
  let id=0,iq=0;
  if(est==='cero'){ iq=T/(1.5*M.p*M.psi); }
  else{
    const pt=mtpaParaPar(T,M); id=pt.id; iq=pt.iq;
    if(est==='fw'&&vReg(id,iq,we,M).v>k*VMAX){
      let mejor=null,mv=1e18,hallo=false;
      for(let d=id;d>=-M.Imax;d-=0.25){
        const den=1.5*M.p*(M.psi+(M.Ld-M.Lq)*d); if(den<=1e-9) break;
        const q=T/den; if(Math.hypot(d,q)>M.Imax) continue;
        const v=vReg(d,q,we,M).v; if(v<mv){ mv=v; mejor={d,q}; }
        if(v<=k*VMAX){ id=d; iq=q; hallo=true; break; }
      }
      if(!hallo&&mejor){ id=mejor.d; iq=mejor.q; }
    }
  }
  let limita=false;
  if(Math.hypot(id,iq)>M.Imax){ limita=true; id=clamp(id,-M.Imax,0); iq=Math.sqrt(Math.max(0,M.Imax*M.Imax-id*id)); }
  return {id,iq,I:Math.hypot(id,iq),limita,cabe:vReg(id,iq,we,M).v<=VMAX+1e-9};
}

/* ---- El lazo de corriente: PI por eje (kp = α·L, ki = α·R·zr), desacople opcional, retardo de un periodo y círculo de tensión ----
   α = 2π·f es el ancho de banda pedido (rad/s). Con zr=1 el cero del PI cancela el polo de la planta y la respuesta ideal es de primer orden.
   El cálculo del paso k se aplica en el paso k+1 (retardo de cómputo) y la tensión se mantiene constante durante cada periodo (PWM promediado). */
function simula(prm,M){
  M=M||MOT;
  const n=prm.n, T1=prm.T1, T0=prm.T0===undefined?FRAC_T0*T1:prm.T0, f=prm.f, zr=prm.zr===undefined?1:prm.zr, est=prm.est||'mtpa', kk=prm.k===undefined?0.9:prm.k, desac=prm.desac!==false;
  const we=omegaE(n,M), al=DOSPI*f, kpd=al*M.Ld, kpq=al*M.Lq, kid=al*M.R*zr, kiq=al*M.R*zr;
  const r0=consignas(est,T0,n,kk,M), r1=consignas(est,T1,n,kk,M);
  const N=NP+1, A=()=>new Float64Array(N);
  const S={t:A(),id:A(),iq:A(),vd:A(),vq:A(),T:A(),idr:A(),iqr:A(),sat:new Uint8Array(N),vm:A(),r0,r1,we,T0,T1,prm:{n,T1,T0,f,zr,est,k:kk,desac}};
  // estado inicial: en régimen con la consigna de antes del escalón (el integrador ya lleva la tensión que hace falta)
  let id=r0.id, iq=r0.iq;
  const v0=vReg(id,iq,we,M); let Id=desac?M.R*id:v0.vd, Iq=desac?M.R*iq:v0.vq;
  let vA=[v0.vd,v0.vq]; { const m=Math.hypot(vA[0],vA[1]); if(m>VMAX){ vA=[vA[0]*VMAX/m,vA[1]*VMAX/m]; } }
  const dtp=TS/SUB;
  for(let k=0;k<=NP;k++){
    const ref=k>=KSTEP?r1:r0;
    S.t[k]=k*TS; S.id[k]=id; S.iq[k]=iq; S.vd[k]=vA[0]; S.vq[k]=vA[1]; S.T[k]=par(id,iq,M); S.idr[k]=ref.id; S.iqr[k]=ref.iq;
    // controlador (se calcula con lo medido en k y se aplicará en k+1)
    const ed=ref.id-id, eq=ref.iq-iq;
    const Id0=Id, Iq0=Iq; Id+=kid*TS*ed; Iq+=kiq*TS*eq;
    let ud=kpd*ed+Id+(desac?-we*M.Lq*iq:0), uq=kpq*eq+Iq+(desac?we*(M.Ld*id+M.psi):0);
    const m=Math.hypot(ud,uq); let sat=0;
    // anti-windup por integración condicionada: si la tensión se satura, el integrador no avanza ese paso
    if(m>VMAX){ const s=VMAX/m; ud*=s; uq*=s; Id=Id0; Iq=Iq0; sat=1; }
    S.sat[k]=sat; S.vm[k]=Math.hypot(ud,uq);
    if(k===NP) break;
    // planta: un periodo con la tensión aplicada, en SUB pasos de RK4
    let s=[id,iq]; for(let j=0;j<SUB;j++) s=rk4(s,vA,we,dtp,M);
    id=s[0]; iq=s[1]; vA=[ud,uq];
  }
  S.met=metricas(S,M);
  return S;
}

/* ---- Métricas del escalón ---- */
function metricas(S,M){
  M=M||MOT; const N=NP+1, T=S.T, T1=S.T1, T0=S.T0, dT=T1-T0, ult=Math.round(0.003/TS);
  let Tss=0,Pcu=0,vu=0; for(let k=N-ult;k<N;k++){ Tss+=T[k]; Pcu+=1.5*M.R*(S.id[k]*S.id[k]+S.iq[k]*S.iq[k]); vu+=S.vm[k]; } Tss/=ult; Pcu/=ult; vu/=ult;
  let Tmax=-1e18; for(let k=KSTEP;k<N;k++) Tmax=Math.max(Tmax,T[k]);
  const os=dT>1e-9?Math.max(0,(Tmax-T1)/dT):0;
  // asentamiento a ±5 % del par pedido: el último instante fuera de la banda
  let kUlt=-1; for(let k=KSTEP;k<N;k++) if(Math.abs(T[k]-T1)>0.05*T1) kUlt=k;
  const asenta=kUlt<0?0:(Math.abs(T[N-1]-T1)>0.05*T1?Infinity:(kUlt+1-KSTEP)*TS);
  let nSat=0; for(let k=KSTEP;k<N;k++) nSat+=S.sat[k];
  // interferencia entre ejes: cuánto se aparta id de su respuesta ideal de primer orden (la que daría el lazo sin acople ni retardo)
  const al=DOSPI*S.prm.f; let interf=0;
  for(let k=KSTEP;k<N;k++){ const t=(k-KSTEP)*TS, ideal=S.r0.id+(S.r1.id-S.r0.id)*(1-Math.exp(-al*t)); interf=Math.max(interf,Math.abs(S.id[k]-ideal)); }
  const dIq=Math.abs(S.r1.iq-S.r0.iq);
  return {Tss,errPar:Math.abs(Tss-T1)/Math.max(T1,1e-9),os,asenta,tSat:nSat*TS,Pcu,vUso:vu/VMAX,interf,interfRel:interf/Math.max(dIq,1),Tmax};
}

/* ---- Curvas del plano id–iq (id en el eje horizontal, negativa a la izquierda) ---- */
/** El punto central de la elipse de tensión (donde la tensión en régimen es mínima) para la velocidad eléctrica we. */
function centroTension(we,M){
  M=M||MOT; const a=we*M.Lq, b=we*M.Ld, c=we*M.psi, R=M.R;
  // f = (R·id − a·iq)² + (R·iq + b·id + c)²  →  ∇f = 0
  const A11=R*R+b*b, A12=-R*a+R*b, A22=a*a+R*R, B1=-b*c, B2=-R*c;
  const det=A11*A22-A12*A12; return {id:(B1*A22-A12*B2)/det,iq:(A11*B2-A12*B1)/det};
}
/** Puntos de la elipse |v| = V en el plano (id, iq): por cada ángulo desde el centro se bisecta el radio. */
function elipseTension(we,V,nPts,M){
  M=M||MOT; const c=centroTension(we,M), pts=[];
  for(let i=0;i<=nPts;i++){
    const ph=DOSPI*i/nPts, dx=Math.cos(ph), dy=Math.sin(ph); let lo=0,hi=5000;
    for(let j=0;j<60;j++){ const r=(lo+hi)/2; if(vReg(c.id+r*dx,c.iq+r*dy,we,M).v<V) lo=r; else hi=r; }
    pts.push([c.id+lo*dx,c.iq+lo*dy]);
  }
  return pts;
}
/** La curva de par constante: iq = T / (3/2·p·(ψm + (Ld−Lq)·id)). */
function isoPar(T,idMin,idMax,nPts,M){
  M=M||MOT; const pts=[]; for(let i=0;i<=nPts;i++){ const d=idMin+(idMax-idMin)*i/nPts, den=1.5*M.p*(M.psi+(M.Ld-M.Lq)*d); if(den>1e-9) pts.push([d,T/den]); } return pts;
}
/** El par máximo que cabe a la velocidad n con corriente ≤ Imax y tensión ≤ k·VMAX (barrido de id sobre iq máxima). */
function parMaximo(n,k,M){
  M=M||MOT; const we=omegaE(n,M); let mejor=0;
  for(let d=0;d>=-M.Imax;d-=0.5){
    let lo=0,hi=Math.sqrt(Math.max(0,M.Imax*M.Imax-d*d)); if(vReg(d,0,we,M).v>k*VMAX) continue;
    if(vReg(d,hi,we,M).v<=k*VMAX) lo=hi; else{ for(let j=0;j<50;j++){ const m=(lo+hi)/2; if(vReg(d,m,we,M).v<=k*VMAX) lo=m; else hi=m; } }
    mejor=Math.max(mejor,par(d,lo,M));
  }
  return mejor;
}
/** Velocidad base del punto (id, iq): la mayor n a la que |v| ≤ VMAX (|v|² es cuadrática en ωe: se resuelve cerrada). */
function velocidadBase(id,iq,M){
  M=M||MOT; // vd = R·id − ωe·Lq·iq ; vq = R·iq + ωe·(Ld·id + ψm)
  const a=-M.Lq*iq, b=M.Ld*id+M.psi, A=a*a+b*b, B=2*(M.R*id*a+M.R*iq*b), C=M.R*M.R*(id*id+iq*iq)-VMAX*VMAX;
  const disc=B*B-4*A*C; if(disc<0||A<=0) return NaN; const we=(-B+Math.sqrt(disc))/(2*A);
  return we*60/(DOSPI*M.p);
}

/** Junta una pieza hecha de muchas mallas en una malla por material: así una rueda con 40 piezas cuesta pocas llamadas. */
function fusiona(grupo){
  grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map();
  grupo.traverse(o=>{ if(!o.isMesh) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(), m=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);
    g.applyMatrix4(m);
    if(!g.attributes.uv){ g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2)); }
    const k=o.material; if(!por.has(k)) por.set(k,[]); por.get(k).push(g); });
  const out=new THREE.Group();
  for(const [mat,gs] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count;
      pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry();
    G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const me=new THREE.Mesh(G,mat); me.castShadow=!mat.transparent; me.receiveShadow=true; out.add(me);
  }
  return out;
}

/** Flecha de eje +x que se orienta con rotation.z; su largo y su sentido se ponen en ponFlecha. */
function flecha(col,{w=0.030,cab=0.15,opac=1,k=1.5,clv=null}={}){
  const g=new THREE.Group(), mat=basico(col,{opac,k});
  const eje=new THREE.Mesh(GEO.cil,mat); eje.scale.set(1,w,w); const punta=new THREE.Mesh(GEO.cono,mat); punta.scale.set(cab,w*3.0,w*3.0);
  g.add(eje,punta); g.userData={eje,punta,cab,w,mat}; if(clv) clave(g,clv); return g;
}
function ponFlecha(f,x0,y0,ang,L){
  const U=f.userData, neg=L<0, A=Math.abs(L), cab=Math.min(U.cab,A*0.6), sh=Math.max(0.001,A-cab*0.8);
  f.position.set(x0,y0,0); f.rotation.z=ang+(neg?Math.PI:0); f.visible=A>0.012;
  U.eje.scale.x=sh; U.eje.position.x=sh/2; U.punta.scale.x=cab; U.punta.position.x=A-cab/2; U.punta.scale.y=U.punta.scale.z=U.w*3.0*(cab/U.cab>0.4?1:0.6);
}

function ponSeg(s,x0,y0,x1,y1){ const dx=x1-x0, dy=y1-y0, L=Math.hypot(dx,dy); s.position.set((x0+x1)/2,(y0+y1)/2,0); s.rotation.z=Math.atan2(dy,dx); s.scale.x=Math.max(L,1e-4); s.visible=L>0.004; }

/* ===================== 11. EL ESTADO Y EL RELOJ =====================
   Un solo cálculo (CALC) alimenta la escena, el dock y las cifras: se recalcula cuando cambia un mando. El reloj SIM.t es el tiempo
   FÍSICO del lazo (0 a 24 ms) y avanza a 1/LENTO del tiempo real: con él giran el rotor y el visor, se encienden las bobinas, se
   mueven las flechas y los cursores de todas las gráficas. Los modos: «Recorrido» (paso a paso), «Probar» (mandos libres) y «Reto». */
const LENTO=300;                                    // cámara lenta: 1 s real = 3,3 ms del motor
const EST={modo:'tour',n:4000,T:150,f:130,zr:1,est:'fw',k:0.9,desac:true,vel:1,pausa:REDUCIDO,autoRunning:false,vista:'todo',rot:false};
const SIM={t:0,calc:null,ver:0,e:null};
let CALC=null;
const IREF=MOT.Imax;
/** Lo que corre ahora: en «Probar», lo que digan los mandos; en el recorrido y el reto, lo que pida el paso. */
function paramsActuales(){
  if(EST.modo==='tour'){ const p=tourParams(); if(p) return p; }
  if(EST.modo==='reto'){ const p=guiaParams(); if(p) return p; }
  return {n:EST.n,T1:EST.T,f:EST.f,zr:EST.zr,est:EST.est,k:EST.k,desac:EST.desac};
}
function calcula(p){ const S=simula(p); return {p,S,m:S.met}; }
function reiniciaCalculo(){
  CALC=calcula(paramsActuales()); SIM.calc=CALC; SIM.ver++;
  SIM.t=Math.min(SIM.t,TFIN-TS*2-1e-6); if(SIM.t<0) SIM.t=0;
  if(typeof pintaDockFijo==='function') pintaDockFijo();
}
/* ---- el estado del motor en el instante t: sale de las matrices de la simulación (interpoladas) y de las transformadas inversas ---- */
function estadoEn(t){
  const C=CALC; if(!C) return null; const S=C.S, k=clamp(Math.floor(t/TS),0,NP-1), f=clamp(t/TS-k,0,1), L=a=>a[k]+(a[k+1]-a[k])*f;
  const id=L(S.id), iq=L(S.iq), th=S.we*t, ab=abcDeDq(id,iq,th);
  return {k,t,id,iq,T:L(S.T),vd:L(S.vd),vq:L(S.vq),vm:L(S.vm),sat:S.sat[k]>0,idr:S.idr[k],iqr:S.iqr[k],th,thm:th/MOT.p,a:ab.a,b:ab.b,c:ab.c,
    I:Math.hypot(id,iq),delta:Math.atan2(iq,id),Pcu:1.5*MOT.R*(id*id+iq*iq)};
}

/* ===================== 12. LO QUE SE VE ===================== */
const _col=new THREE.Color(), _blanco=new THREE.Color('#ffffff'), _base=new THREE.Color('#2a1812'), _fase=FASECOL.map(c=>new THREE.Color(c));
const ocultaVerdad=()=>EST.modo==='reto'&&GUIA.paso==='ajusta'&&!(GUIA.r2&&GUIA.r2.validado);   // la zona factible y las curvas, mientras se ajusta
function aplicaEscena(dtS,dtSim,dtR){
  if(dtR===undefined) dtR=dtS;
  const C=CALC; if(!C) return;
  const Tc=TFIN-TS*2; SIM.t+=dtSim; if(SIM.t>=Tc) SIM.t=SIM.t-Tc;
  const e=estadoEn(SIM.t); if(!e) return; SIM.e=e;
  // ---- el rotor gira con el ángulo mecánico = eléctrico / pares de polos ----
  ROTOR.rotation.z=e.thm;
  // ---- los 48 conductores: corriente de su fase por su signo; las cabezas de bobina, la corriente de su fase ----
  const ph=[e.a,e.b,e.c];
  for(let i=0;i<NRAN;i++){ const [p,sg]=SLOT[i], cur=ph[p]*sg, f=Math.min(1,Math.abs(cur)/IREF);
    _col.copy(_fase[p]); if(cur<0) _col.lerp(_blanco,0.55); _col.multiplyScalar(f*1.25); _col.r+=_base.r; _col.g+=_base.g; _col.b+=_base.b; COND.setColorAt(i,_col); }
  COND.instanceColor.needsUpdate=true;
  for(let p=0;p<3;p++) CABEZA_MAT[p].emissiveIntensity=0.05+0.55*Math.min(1,Math.abs(ph[p])/IREF);
  // ---- el visor eléctrico: ejes d y q, imán, flecha de la corriente y sus componentes y sombras ----
  const th=e.th, cd=Math.cos(th), sd=Math.sin(th), LV=1.15/IREF, Lv=e.I*LV, a=th+e.delta, tx=Math.cos(a)*Lv, ty=Math.sin(a)*Lv;
  ponFlecha(VIS.fi,0,0,a,Lv);
  ponSeg(VIS.ejeD,0,0,cd*1.22,sd*1.22); ponSeg(VIS.ejeQ,0,0,-sd*1.22,cd*1.22);
  VIS.cabD.position.set(cd*1.22,sd*1.22,0); VIS.cabQ.position.set(-sd*1.22,cd*1.22,0);
  VIS.imanN.position.set(cd*0.12,sd*0.12,0.012); VIS.imanN.rotation.z=th; VIS.imanS.position.set(-cd*0.12,-sd*0.12,0.012); VIS.imanS.rotation.z=th;
  const Ld=e.id*LV, Lq=e.iq*LV;
  ponFlecha(VIS.fid,0,0,th,Ld); ponFlecha(VIS.fiq,0,0,th+Math.PI/2,Lq);
  ponSeg(VIS.r1,cd*Ld,sd*Ld,tx,ty); ponSeg(VIS.r2,-sd*Lq,cd*Lq,tx,ty);
  for(let i=0;i<3;i++){ const ai=i*DOSPI/3, pr=Lv*Math.cos(a-ai), px=Math.cos(ai)*pr, py=Math.sin(ai)*pr;
    VIS.punto[i].position.set(px,py,0.01); ponSeg(VIS.caida[i],tx,ty,px,py); }
}

    <div class="fl">ωe·ψm es la tensión que inducen los imanes al girar: crece con la velocidad y se come la tensión del inversor. El inversor da como máximo √(vd² + vq²) ≤ Vdc/√3 = <b>${fN(VMAX,0)} V</b>.</div>
    <div class="formula">kp = α·L · ki = α·R · α = 2π·f</div>
    <div class="fl">El PI de cada eje fija la rapidez del lazo f. Con la parte integral en ×1 su cero cancela el polo del motor y la respuesta ideal es de primer orden, sin sobreimpulso. El desacople suma −ωe·Lq·iq y ωe·(Ld·id + ψm) para que un eje no moleste al otro.</div>
  </div></details>
  <details id="dSim"><summary>Simplificaciones</summary><div class="cuerpo"><ul class="no">
    <li>Motor <b>síncrono de imanes interiores</b> con parámetros de orden de magnitud de uno de tracción (${fN(MOT.Vdc,0)} V de bus, ${fN(MOT.Imax,0)} A de pico), <b>no el de un fabricante</b>. Inductancias constantes: no hay saturación del hierro ni acople cruzado.</li>
    <li>Corrientes senoidales, <b>sin armónicos</b>, sin pérdidas en el hierro ni mecánicas. La velocidad se mantiene fija durante los ${fN(TFIN*1000,0)} ms del escalón.</li>
    <li>El lazo corre a ${fN(1/TS/1000,0)} kHz con un periodo de retardo de cómputo; el inversor se trata como un círculo de tensión ideal (modulación vectorial) sin tiempos muertos ni caídas en los transistores.</li>
    <li>El <b>visor</b> es el dibujo eléctrico equivalente de un par de polos: una vuelta suya son ${fN(360/MOT.p,0)}° del rotor real. Las ranuras y el entrehierro no están a escala. Cámara lenta ×1/${fN(LENTO,0)}.</li>
  </ul><div class="src">Park (1929) · Krause, <i>Analysis of Electric Machinery</i> · Morimoto et al. (MTPA y debilitamiento de campo, <i>IEEE Trans. IA</i>): referencias a verificar.</div></div></details></div>`;
  H.innerHTML=h; for(const id of abiertos){ const d=H.querySelector('#'+id); if(d) d.open=true; }
  H.classList.toggle('guia',EST.modo!=='probar'); enlazaHUD(); ajustaHoja();
}

function abre(L){ const r=L.box.getBoundingClientRect(), dpr=Math.min(3,window.devicePixelRatio||1);

function lineaArr(x,X,Y,arr,col,w,dash){ x.setLineDash(dash||[]); x.strokeStyle=col; x.lineWidth=w; x.beginPath(); for(let k=0;k<=NP;k++){ const px=X(k*TS), py=Y(arr[k]); k?x.lineTo(px,py):x.moveTo(px,py); } x.stroke(); x.setLineDash([]); }
/** Las corrientes de fase de la simulación (a, b, c): salen de id, iq y el ángulo eléctrico con las transformadas inversas. Se guardan en CALC. */
function serieAbc(C){ if(C.abc) return C.abc; const S=C.S, a=new Float64Array(NP+1), b=new Float64Array(NP+1), c=new Float64Array(NP+1);
  for(let k=0;k<=NP;k++){ const r=abcDeDq(S.id[k],S.iq[k],S.we*k*TS); a[k]=r.a; b[k]=r.b; c[k]=r.c; } C.abc={a,b,c}; return C.abc; }

function pintaAbc(){

function pintaDQ(){

  const X0=30, X1=Wd-6, Y0=6, Y1=Hd-14, X=ejeT(X0,X1);
  let mn=0,mx=0; for(let k=0;k<=NP;k+=2){ mn=Math.min(mn,S.id[k],S.idr[k]); mx=Math.max(mx,S.iq[k],S.iqr[k]); }
  mn=Math.floor((mn-10)/100)*100; mx=Math.ceil((mx+10)/100)*100; const Y=v=>Y1-(v-mn)/(mx-mn)*(Y1-Y0);
  bandaSat(x,X,Y0,Y1); marcaEscalon(x,X,Y0,Y1);
  const vals=[]; for(let v=mn;v<=mx+1e-9;v+=100) vals.push(v); ejeY(x,X0,X1,Y,vals,v=>String(v)); ejeX(x,X,Hd+2);

}
/* ---- el mapa de corrientes (id horizontal, iq vertical): el círculo de la corriente máxima SIEMPRE; la elipse de tensión y las curvas de par, sólo cuando no regalan el reto ---- */
function pintaPlano(){
  const x=abre(LPL), Wd=LPL.w, Hd=LPL.h, C=CALC, e=SIM.e; if(!C||!e) return; const S=C.S;
  const dmin=-400, dmax=60, qmin=-25, qmax=400, Xl=22, Xr=Wd-5, Yt=5, Yb=Hd-12;
  const s=Math.min((Xr-Xl)/(dmax-dmin),(Yb-Yt)/(qmax-qmin)), ox=Xl+((Xr-Xl)-s*(dmax-dmin))/2, PX=d=>ox+(d-dmin)*s, PY=q=>Yb-(q-qmin)*s;
  x.save(); x.beginPath(); x.rect(Xl-2,Yt,Xr-Xl+4,Yb-Yt+2); x.clip();
  raya(x,PX(0),Yt,PX(0),Yb,'rgba(160,200,220,0.35)',1); raya(x,Xl,PY(0),Xr,PY(0),'rgba(160,200,220,0.35)',1);
  const oc=ocultaVerdad();
  if(!oc){
    if(!C.elip) C.elip=elipseTension(S.we,VMAX,90);
    x.strokeStyle=COL.elip; x.lineWidth=1.4; x.beginPath(); C.elip.forEach(([d,q],i)=>{ i?x.lineTo(PX(d),PY(q)):x.moveTo(PX(d),PY(q)); }); x.stroke();
    x.strokeStyle=COL.mtpa; x.lineWidth=1.1; x.setLineDash([3,3]); x.beginPath(); for(let i=0;i<=40;i++){ const p=mtpaPunto(MOT.Imax*i/40); i?x.lineTo(PX(p.id),PY(p.iq)):x.moveTo(PX(p.id),PY(p.iq)); } x.stroke(); x.setLineDash([]);
    const iso=isoPar(S.T1,-MOT.Imax*1.2,60,70); x.strokeStyle='rgba(61,220,151,0.55)'; x.lineWidth=1; x.beginPath(); let prim=true; for(const [d,q] of iso){ if(q>qmax) continue; prim?x.moveTo(PX(d),PY(q)):x.lineTo(PX(d),PY(q)); prim=false; } x.stroke();
  }
  x.beginPath(); x.arc(PX(0),PY(0),MOT.Imax*s,0,DOSPI); x.strokeStyle=COL.lim; x.lineWidth=1.3; x.stroke();
  // el camino del punto de operación hasta ahora y la consigna
  const kt=Math.min(NP,e.k);
  x.strokeStyle='rgba(244,249,255,0.55)'; x.lineWidth=1.2; x.beginPath(); for(let k=0;k<=kt;k++){ const px=PX(S.id[k]), py=PY(S.iq[k]); k?x.lineTo(px,py):x.moveTo(px,py); } x.stroke();
  x.strokeStyle='#FFD166'; x.lineWidth=1.4; x.beginPath(); x.arc(PX(S.r1.id),PY(S.r1.iq),4,0,DOSPI); x.stroke();
  x.fillStyle='#fff'; x.beginPath(); x.arc(PX(e.id),PY(e.iq),3.2,0,DOSPI); x.fill();
  x.restore();
  txt(x,'id',Xr-1,PY(0)-3,TXT,8.5,'right','600'); txt(x,'iq',PX(0)+3,Yt+8,TXT,8.5,'left','600');

}

/* ===================== 17. DISPOSICIÓN: ANCHO, ESTRECHO, MÓVIL =====================
   Si no caben guía, escena y dock lado a lado (el marco de la plataforma, una tableta), la escena va arriba
   y guía e instrumentos comparten una hoja con pestañas abajo. */
function disposicion(){
  const W=innerWidth, b=document.body;
  const estrecho=W<1080, movil=W<640;
  b.classList.toggle('estrecho',estrecho); b.classList.toggle('movil',movil); b.classList.toggle('ancho',estrecho&&!movil);
  if(estrecho){ if(!b.classList.contains('t-hud')&&!b.classList.contains('t-panel')) b.classList.add('t-hud'); ajustaHoja(); }
  el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('on',b.classList.contains('t-'+t.dataset.tab)));
}
function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.40:0.43),240,450));
  let hh=base; const hud=el('hud');
  if(movil&&b.classList.contains('t-panel')) hh=Math.round(clamp(H*0.55,240,540));
  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;
    hh=Math.round(clamp(pide,240,Math.max(base,H*(movil?0.45:0.56)))); }
  const ant=parseFloat(b.style.getPropertyValue('--hojaH'))||0;
  if(Math.abs(ant-hh)>1){ b.style.setProperty('--hojaH',hh+'px'); colocaBarras(); centraEnHueco(); }
}

/* ===================== 19. EL RETO: CALCULA, AJUSTA, DIAGNOSTICA =====================
   Tres fases: 1 · Calcula (el par a partir de id e iq: la fórmula con su parte de imanes y su parte de reluctancia), 2 · Ajusta (la
   rapidez del lazo, la parte integral y el reparto de la corriente —con su reserva de tensión— para seguir un escalón de par en una
   situación con velocidad propia: par logrado, sin pasarse, rápido, sin gastar toda la tensión en el escalón y sin calentar de más;
   la zona factible y las curvas de par sólo aparecen al validar, y la ventana es INTERIOR) y 3 · Diagnostica (¿por qué falla este
   control?, sólo con lo que se ve en el dock). Cierra con un quiz de tres preguntas. */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETOS={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'calcula',iniciado:false,dxOk:false,r1:null,r2:null,dx:null,orden:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0};

/* ---------- Fase 1 · Calcula: el par a partir de id e iq ---------- */
const CASOS_1=[{id:-80,iq:200},{id:-40,iq:150},{id:0,iq:250},{id:-120,iq:260},{id:-60,iq:180},{id:-100,iq:220},{id:-30,iq:300}];
const partesPar=(id,iq)=>({imanes:1.5*MOT.p*MOT.psi*iq,reluc:1.5*MOT.p*(MOT.Ld-MOT.Lq)*id*iq,total:par1(id,iq)});
function sorteaCaso1(){ const p=GUIA.r1&&GUIA.r1.id; let c; do{ c=pickOne(CASOS_1); }while(c.id===p); GUIA.r1=Object.assign({},c,{res:partesPar(c.id,c.iq)}); }
function numeroDe(txt){ const raw=String(txt||'').trim().replace(/\s/g,'').replace(/ /g,'').replace(',','.'); return parseFloat(raw); }
function checkCalcula(){
  const v=numeroDe((el('ansV')||{}).value), r=GUIA.r1, ok=r.res.total;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe el par en newton metro (con coma o punto decimal).'); return; }
  RETOS.intentos++;
  if(Math.abs(v-ok)<=0.8){
    RETOS.fallos1=0; sonido.bien();
    feedback('good','¡Correcto! ✓',`Los imanes dan 3/2·${MOT.p}·${fN(MOT.psi,3)}·${fN(r.iq,0)} = <b>${fN(r.res.imanes,1)} N·m</b> y la reluctancia (por id negativa) suma 3/2·${MOT.p}·(Ld − Lq)·id·iq = <b>${fN(r.res.reluc,1)} N·m</b>. Total: <b>${fN(ok,1)} N·m</b>. Con id = 0 sólo quedaría la parte de los imanes.`,true);
    paso('ajusta'); prepararAjusta();
  } else {
    RETOS.fallos1++; sonido.mal();
    if(RETOS.fallos1>=3){ RETOS.fallos1=0; RETOS.resiembras++; sorteaCaso1(); feedback('bad','Tres intentos fallidos','Cambia el caso. Recuerda: el par tiene una parte de los imanes (ψm·iq) y otra de reluctancia ((Ld − Lq)·id·iq), y todo va multiplicado por 3/2·p.'); reiniciaCalculo(); pintaHUD(); }
    else { feedback('bad','Revisa el cálculo',(v>ok?'Te pasaste. ':'Te quedaste corto. ')+`Suma las dos partes del par y multiplica por 3/2·p. (intentos fallidos: ${RETOS.fallos1}/3)`); const t=el('d_try'); if(t) t.textContent=RETOS.fallos1; }
  }
}

/* ---------- Fase 2 · Ajusta la rapidez, la parte integral y el reparto ---------- */
function prepararAjusta(){
  let e; do{ e=pickOne(ESCENARIOS); }while(GUIA.r2&&ESCENARIOS.length>1&&e.id===GUIA.r2.esc.id&&RETOS.resiembras>0);
  GUIA.r2={esc:e,f:40,zr:1,est:'cero',k:0.9,validado:false,res:null,intentos:0};
  reiniciaCalculo(); pintaHUD();
}
/** El intervalo de rapidez (Hz) que cumple todo con los otros mandos como están: la ventana. */
function rangoF(r){
  let a=null,b=null;
  for(let i=0;i<=120;i++){ const f=fDeU(i*100/120); if(corre(r.esc,{f,zr:r.zr,est:r.est,k:r.k}).ok){ if(a===null) a=f; b=f; } }
  return a===null?null:[a,b];
}
function validarAjusta(){
  const r=GUIA.r2; if(!r) return;
  const E=r.esc, m=CALC.m; r.res=m; r.validado=true; r.intentos++; RETOS.intentos++;
  const c=cumple(m,E), ok=cumpleTodo(m,E), ref=referenciaCobre(E), cons=consignas(r.est,E.T1,E.n,r.k);
  reiniciaCalculo();
  const cifras=`Par logrado <b>${fN(m.Tss,0)} N·m</b> de ${fN(E.T1,0)} (error ${fN(m.errPar*100,1)} %, máx. ${fN(RETO.par*100,0)}), sobreimpulso <b>${fN(m.os*100,1)} %</b> (máx. ${fN(RETO.os*100,0)}), ${isFinite(m.asenta)?`llega en <b>${fN(m.asenta*1000,1)} ms</b>`:'<b>no llega</b>'} (máx. ${fN(RETO.asenta*1000,1)}), tensión al tope <b>${fN(m.tSat*1000,1)} ms</b> (máx. ${fN(RETO.tSat*1000,1)}) y calor en el cobre <b>${fN(m.Pcu/1000,2)} kW</b> (máx. ${fN(RETO.cu*ref/1000,2)}).`;
  if(ok){
    RETOS.fallos2=0; sonido.bien(); const rg=rangoF(r);
    feedback('good','¡Lo conseguiste! ✓',`${cifras} ${rg?`Con ese reparto y esa parte integral, cualquier rapidez entre <b>${fN(rg[0],0)} y ${fN(rg[1],0)} Hz</b> habría servido: más lento tarda en llegar; más rápido pide más tensión de la que hay y el escalón se queda en el tope. La ventana está en el interior, no en los extremos.`:''}`,true);
    pintaHUD(); paso('diag'); iniciaDiag();
  } else {
    RETOS.fallos2++; sonido.mal();
    let msg=cifras+' ';
    if(!c.par){
      if(m.vUso>0.97||m.tSat>0.01) msg+='A esta velocidad la tensión del inversor <b>se acaba</b> (zona gris todo el tiempo): los imanes ya la gastan y el regulador no puede empujar más. Hace falta restar campo con una id más negativa. ';
      else if(cons.limita) msg+='Con ese reparto hace falta tanta corriente que choca con el <b>máximo del motor</b>: sin id negativa los imanes solos no dan ese par. ';
      else msg+='El par <b>no llega</b> a tiempo: el lazo es lento para esta ventana de 24 ms. ';
    }
    if(c.par&&!c.asenta) msg+='Tarda en llegar: el lazo es <b>lento</b> o la parte integral lo frena al final. ';
    if(!c.os) msg+='Se <b>pasa</b> del par pedido: una parte integral muy grande (o un lazo tan rápido que el retardo del regulador lo desborda). ';
    if(!c.tSat) msg+='El escalón gasta <b>más tensión de la que hay</b>: baja la rapidez o deja más reserva. ';
    if(!c.cu) msg+='Gastas <b>más cobre del necesario</b>: tu reparto de la corriente no es el de mínimo calor para este par y esta velocidad. ';
    if(RETOS.fallos2>=4){ RETOS.fallos2=0; RETOS.resiembras++; feedback('bad','Cuatro validaciones sin lograrlo',msg+'Cambia la situación.',true); prepararAjusta(); }
    else { feedback('bad','Todavía no',msg+`(validaciones fallidas: ${RETOS.fallos2}/4)`,true); pintaHUD(); }
  }
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const CASOS_DX=[
  {id:'lento',n:2600,T1:190,f:40,zr:1,est:'mtpa',k:0.9,desac:true},
  {id:'integral',n:2600,T1:190,f:150,zr:8,est:'mtpa',k:0.9,desac:true},
  {id:'tension',n:4000,T1:150,f:130,zr:1,est:'mtpa',k:0.9,desac:true},

  const p=GUIA.dx&&GUIA.dx.id; let c; do{ c=pickOne(CASOS_DX); }while(c.id===p);

  reiniciaCalculo(); pintaHUD(); pintaDockFijo();
}
function diagnostica(k){
  if(!GUIA.dx||GUIA.dxOk) return; RETOS.intentos++;

function explicaDx(k){

  if(k==='integral') return 'El par llega rápido, se pasa y vuelve despacio: con una parte integral muy grande el integrador acumula de más y devuelve el exceso con lentitud. Con la parte integral en ×1, el PI cancela el polo del motor.';
  if(k==='tension') return 'Hay zona gris casi todo el tiempo y el par se queda corto: a esta velocidad los imanes inducen casi toda la tensión del inversor. No es un problema de ganancias: hace falta una id negativa (debilitar el campo).';
  return 'El par se queda corto y id (violeta) se aparta de su consigna cuando sólo se pidió más iq: sin desacople, el término ωe·Lq·iq actúa como una perturbación que un integrador lento no corrige.';

/* ===================== 20. CÁMARAS =====================
   La escena se encuadra con el hueco que dejan la guía y el dock: la cámara se aleja lo justo para que la caja del
   «objeto» (ancho × alto en unidades) quepa entera en ese hueco, y la proyección se desplaza para centrarla en él.
   Además el objeto nunca pasa del 70 % del alto del lienzo. */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}
const VISTAS={
  todo:{dir:V3(0.42,0.22,1.0),anc:()=>V3(0,1.40,0.10),toff:V3(0,0,0),obj:()=>({w:3.0,h:3.0}),fov:34,tope:0.74},
  rotor:{dir:V3(0.30,0.16,1.0),anc:()=>V3(0,1.45,0.45),toff:V3(0,0,0),obj:()=>({w:2.5,h:2.5}),fov:34,tope:0.80},
  frente:{dir:V3(0.04,0.03,1.0),anc:()=>V3(0,1.45,0.30),toff:V3(0,0,0),obj:()=>({w:2.85,h:2.95}),fov:34,tope:0.74},
  lado:{dir:V3(1.0,0.20,0.40),anc:()=>V3(0,1.40,0.0),toff:V3(0,0,0),obj:()=>({w:3.3,h:3.0}),fov:34,tope:0.74},
};
const CAM={off:V3(3,2,6),toff:V3(0,0,0),auto:true,previo:null,k:1,dur:1};
function fovVista(v){ return innerWidth<innerHeight*0.9?46:VISTAS[v].fov; }
function distanciaFit(w,h,fov,tope){
  const Hu=huecoLibre(), W=innerWidth, Hh=innerHeight, tv=Math.tan(fov*Math.PI/360), th=tv*(W/Hh);
  const wF=Math.max(80,Hu.x1-Hu.x0)/W, hF=Math.max(80,Hu.y1-Hu.y0)/Hh;
  const D=1.06*Math.max(w/(2*th*wF),h/(2*tv*hF));
  return Math.max(D,h/(2*tv*(tope||0.66)));
}
function ofsDeseado(v){
  const V=VISTAS[v], o=V.obj(), fov=fovVista(v), D=distanciaFit(o.w,o.h,fov,V.tope);
  return {off:V.dir.clone().normalize().multiplyScalar(D),toff:V.toff.clone(),fov};
}
function ponVista(v,dur){
  EST.vista=v; CAM.auto=true; CAM.dur=dur===undefined?1.0:dur;
  if(typeof pintaBarras==='function') pintaBarras();
  if(CAM.dur<=0.01){ const A=VISTAS[v].anc(), d=ofsDeseado(v); CAM.off.copy(d.off); CAM.toff.copy(d.toff); camera.fov=d.fov; camera.updateProjectionMatrix();
    camera.position.copy(A).add(CAM.off); controls.target.copy(A).add(CAM.toff); CAM.previo=A.clone(); }
}
function pasaCam(dt){
  const V=VISTAS[EST.vista], P=V.anc();
  if(CAM.auto){
    const d=ofsDeseado(EST.vista), k=1-Math.exp(-dt/Math.max(0.05,(CAM.dur||1)*0.30));
    CAM.off.lerp(d.off,k); CAM.toff.lerp(d.toff,k);
    if(Math.abs(camera.fov-d.fov)>0.05){ camera.fov+=(d.fov-camera.fov)*k; camera.updateProjectionMatrix(); }
    camera.position.copy(P).add(CAM.off); controls.target.copy(P).add(CAM.toff);
  } else if(CAM.previo){ const dP=P.clone().sub(CAM.previo); camera.position.add(dP); controls.target.add(dP); }
  CAM.previo=P.clone();
}

/* ===================== 21. SONIDO (sintetizado) =====================
   Un zumbido grave cuyo tono sigue a la velocidad del motor (muy atenuado) y los avisos de acierto y fallo. */
const sonido=(function(){
  let ctx=null,on=true,master=null,ult=0,zum=null,zg=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      zum=ctx.createOscillator(); zg=ctx.createGain(); zum.type='sawtooth'; zum.frequency.value=60; zg.gain.value=0; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=200; zum.connect(lp); lp.connect(zg); zg.connect(master); zum.start();
    }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); ult=f; }
  return {init,
    zumbido:(q)=>{ if(!ctx||!zum) return; const t=ctx.currentTime; zum.frequency.setTargetAtTime(38+q*50,t,0.15); zg.gain.setTargetAtTime(on&&q>0?0.008:0,t,0.15); },
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }, get freq(){ return ult; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };

/* ===================== 23. EL LAZO: UN SOLO RELOJ =====================
   El tiempo del escenario avanza dt·velocidad en cada cuadro, y con ESE tiempo se mueven los coches, las lecturas, la estimación
   y la elipse, y se dibujan las gráficas del dock. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0, tSon=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  const dtS=EST.pausa?0:dt, dtSim=dtS*EST.vel/LENTO;
  aplicaEscena(dtS,dtSim,dt);
  pasaCam(dt);
  if(t-tSon>0.4){ tSon=t; sonido.zumbido(SIM.e&&CALC&&!EST.pausa?clamp(CALC.S.prm.n/5000,0,1):0); }
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaGraficas(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos(); colocaFoco();
}

/** Mide el objeto en lo VISIBLE: se pinta sin plataforma, suelo ni fondo sobre magenta puro y se toma la caja de los píxeles que no son magenta. */
function mideObjeto(){
  const ocultos=[]; PLATAFORMA.visible=false; scene.traverse(o=>{ if(o.userData&&o.userData.fondo&&o.visible){ o.visible=false; ocultos.push(o); } });
  const bg=scene.background, fog=scene.fog; scene.background=null; scene.fog=null; renderer.setClearColor(0xff00ff,1);
  renderer.render(scene,camera);
  const c=renderer.domElement, W=c.width, H=c.height, t=document.createElement('canvas'); t.width=W; t.height=H; const g=t.getContext('2d',{willReadFrequently:true}); g.drawImage(c,0,0);
  const d=g.getImageData(0,0,W,H).data; let x0=1e9,x1=-1,y0=1e9,y1=-1;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=(y*W+x)*4; if(!(d[i]>235&&d[i+1]<30&&d[i+2]>235)){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  PLATAFORMA.visible=true; for(const o of ocultos) o.visible=true; scene.background=bg; scene.fog=fog; renderer.setClearColor(0x000000,1);
  const k=W/innerWidth; return {x0:x0/k,x1:x1/k,y0:y0/k,y1:y1/k,altoPx:(y1-y0)/k,anchoPx:(x1-x0)/k,fracAlto:(y1-y0)/H,fracAncho:(x1-x0)/W,hueco:huecoLibre(),W:innerWidth,H:innerHeight};
}
