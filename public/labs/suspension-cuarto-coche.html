<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Suspensión: cuarto de coche — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#08201C;--panel:rgba(9,24,23,.86);--line:#1E3A34;--ink:#EAF4F1;
    --dim:#8FB3AC;--accent:#2A9D8F;--accent2:#4FD1C5;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cF:#4FD1C5;--cR:#FFB347;--cE:#FF4D5A;--cG:#C8D6D2;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#14201f;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#182a28}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#33b3a3}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#06120f}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#4FD1C5;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f8a85;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f948f;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#04211c}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#0a1219;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(30,58,52,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,58,52,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f8a85}
  .dk-tit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#9fbab4;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,58,52,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c9c4;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#14201f;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfe0dc;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(12,22,22,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,22,21,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d6d2}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,22,24,.92);border:1px solid rgba(79,209,197,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,22,24,.84);border:1px solid rgba(79,209,197,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .toast{top:auto;bottom:calc(var(--hojaH) * .45);z-index:40;width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}
  body.estrecho.ancho.t-panel .panel>.dk-fig{grid-column:1;grid-row:2}
  body.estrecho.ancho.t-panel .panel>.dk-row{grid-column:1;grid-row:3/6;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-fu{grid-column:2;grid-row:2;align-self:start}
  body.estrecho.ancho.t-panel .panel>.dk-g.fu{grid-column:2;grid-row:2/4;min-height:0;margin-top:18px}
  body.estrecho.ancho.t-panel .panel>.dk-ley{display:none}
  body.estrecho.ancho.t-panel .panel>.t-sp{grid-column:2;grid-row:4}
  body.estrecho.ancho.t-panel .panel>.dk-g.sp{grid-column:2;grid-row:5;min-height:0}
  body.estrecho.ancho.t-panel .panel>.dk-aviso{display:none}
  body.estrecho .hud details>.cuerpo{max-height:24vh}
  body.estrecho.ancho.t-hud .hud{display:grid;grid-template-columns:1fr 1.05fr;column-gap:14px;row-gap:7px;align-content:start;grid-auto-flow:row dense}
  body.estrecho.ancho .hud>.hcab,body.estrecho.ancho .hud>.modebar,body.estrecho.ancho .hud>.hdet,body.estrecho.ancho .hud>.pasos{grid-column:1}
  body.estrecho.ancho .hud>.hmandos,body.estrecho.ancho .hud>.retoBox{grid-column:2;grid-row:1/span 4}
  body.estrecho .hdet{flex-direction:row}body.estrecho .hdet>details{flex:1;min-width:0}
  body.estrecho .hdet details[open]{position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 54px);z-index:25;background:rgba(9,24,23,.97)}
  body.movil .lt{display:none} body.movil .tbar .modo,body.movil .tbar .reloj{display:none}
  body.movil .tbar{gap:6px;padding:5px 8px} body.movil .tbar .est{min-width:0}
  body.movil .dk-ley{display:none} body.movil .fg b{font-size:13.5px} body.movil .fg .fl{font-size:9.5px}
  body.movil .dk-g.fu{min-height:70px} body.movil .dk-g.sp{min-height:52px} body.movil .dk-row{min-height:150px}
  body.movil .hud h2{font-size:15.5px} body.movil .hud .intro{font-size:11.8px;line-height:1.42}
  body.estrecho .hud{overflow-y:auto}
  body.estrecho .vbar [data-t="rot"],body.estrecho .vbar .sep.s1{display:none}
  body.estrecho.ancho .vbar{top:60px}
  body.movil .vbar{flex-wrap:nowrap;gap:3px;padding:3px 4px;top:54px} body.movil .vbar .sep{display:none} body.movil .vbar .b.sm{padding:5px 7px;font-size:11px}
  body.movil .vbar .lg{display:none}
  body.movil .tbar .lento{display:none}
  body.movil .hud{gap:6px;padding:10px 12px 9px} body.movil .hud .eyebrow{display:none}
  body.movil .modebar .b{padding:6px 4px 5px}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   LAB — SUSPENSIÓN: CUARTO DE COCHE, CONFORT Y AGARRE
   (Dinámica del vehículo · mecanica-129)

   Una rueda y su cuarto de carrocería ruedan sobre un camino aleatorio ISO 8608
   que pasa por debajo. A la vista, en corte: el resorte que se comprime, el
   amortiguador con su pistón, sus válvulas y el aceite que las atraviesa, y el
   neumático, que es otro resorte. Dos acelerómetros miden lo que siente la
   carrocería y la rueda.

   Todo sale de un cuarto de coche de 2 grados de libertad. Sus frecuencias
   propias, la transmisibilidad y los RMS de confort (aceleración ponderada Wk de
   la ISO 2631-1), de agarre (carga dinámica del neumático) y de recorrido se
   calculan por integral EXACTA en frecuencia contra la densidad espectral del
   camino; la escena corre el mismo modelo en el tiempo con Runge–Kutta 4 sobre
   un camino sintetizado con esa misma densidad. Esa física está en un bloque
   puro que un script de Node extrae TAL CUAL y verifica.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO=' ';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }


/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos
   marcas— y lo prueba: lo que se prueba es lo que corre.

   Cuarto de coche de 2 grados de libertad: la masa suspendida m_s (la
   carrocería que le toca a esta rueda) sobre el resorte k_s y el amortiguador
   c; la masa no suspendida m_u (rueda, mangueta, freno) sobre el neumático, un
   resorte k_t. El camino entra por z_r. Se resuelve de dos maneras que se
   comprueban entre sí: en el DOMINIO DE LA FRECUENCIA (funciones de
   transferencia e integral exacta contra la densidad espectral ISO 8608) y en
   el TIEMPO (Runge–Kutta de 4.º orden sobre un camino sintetizado con esa
   misma densidad). El amortiguador semiactivo skyhook sólo existe en el tiempo:
   es no lineal, y por eso se mide por simulación. */

/* FISICA:INICIO */
const DOSPI=2*Math.PI, G=9.81;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ---------- 1.1 El cuarto de coche ----------
   Valores de libro de un turismo medio: 320 kg por rueda de carrocería, 40 kg
   de masa no suspendida, resorte de 22 kN/m (frecuencia de carrocería ≈ 1,3 Hz)
   y neumático de 200 kN/m (salto de rueda ≈ 12 Hz). c es el amortiguador pasivo;
   el semiactivo varía entre CMIN y CMAX. */
const NOMINAL={ ms:320, mu:40, ks:22000, kt:200000, c:1500 };
const CSA={ cmin:900, cmax:3500, csky:2400 };       // amortiguador semiactivo: rango y ganancia skyhook
/** Camino ISO 8608: G_d(n0) en m³ (n0 = 0,1 ciclos/m), la media geométrica de cada clase. */
const CAMINOS={ A:16e-6, B:64e-6, C:256e-6, D:1024e-6, E:4096e-6 };
const N0=0.1;

/* ---------- 1.2 Aritmética compleja mínima ---------- */
const cMul=(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]];
const cDiv=(a,b)=>{ const d=b[0]*b[0]+b[1]*b[1]; return [(a[0]*b[0]+a[1]*b[1])/d,(a[1]*b[0]-a[0]*b[1])/d]; };
const cAbs=a=>Math.hypot(a[0],a[1]);

/* ---------- 1.3 Funciones de transferencia (entrada: el desplazamiento del camino Z_r) ----------
   Con s = jω, a = c·s + k_s, A = m_s·s² + a, B = m_u·s² + a + k_t y D = A·B − a²:
      Z_s/Z_r = k_t·a / D            (carrocería)
      Z_u/Z_r = k_t·A / D            (rueda)
      (Z_s − Z_u)/Z_r = −k_t·m_s·s² / D     (recorrido de la suspensión)
      F_din/Z_r = k_t·(1 − Z_u/Z_r)         (variación de la carga del neumático)
   La aceleración de la carrocería es s²·Z_s. */
function transf(P,f){
  const w=DOSPI*f, w2=w*w, c=P.c;
  const a=[P.ks,c*w], A=[P.ks-P.ms*w2,c*w], B=[P.ks+P.kt-P.mu*w2,c*w];
  const AB=cMul(A,B), a2=cMul(a,a), D=[AB[0]-a2[0],AB[1]-a2[1]];
  const zs=cDiv([P.kt*a[0],P.kt*a[1]],D), zu=cDiv([P.kt*A[0],P.kt*A[1]],D);
  const def=cDiv([P.kt*P.ms*w2,0],D), tire=[P.kt*(1-zu[0]),P.kt*(-zu[1])];
  return { zs, zu, acc:[-w2*zs[0],-w2*zs[1]], def, tire };
}

/* ---------- 1.4 Ponderación Wk de la ISO 2631-1 (vibración vertical, confort) ----------
   Producto de cuatro filtros: paso alto 0,4 Hz y paso bajo 100 Hz (Butterworth de 2.º orden), la transición
   aceleración–velocidad (f3 = f4 = 12,5 Hz, Q4 = 0,63) y el escalón hacia arriba (ceros en f5 = 2,37 Hz, Q5 = 0,91; polos en f6 = 3,35 Hz, Q6 = 0,91: ganancia 0,5 abajo y 1 arriba).
   Cada sección se guarda como (b2 s² + b1 s + b0)/(a2 s² + a1 s + a0) para evaluarla en frecuencia y para discretizarla. */
const WK_SEC=(()=>{ const w=f=>DOSPI*f, w1=w(0.4), w2=w(100), w3=w(12.5), w4=w(12.5), w5=w(2.37), w6=w(3.35), Q4=0.63, Q5=0.91, Q6=0.91, r2=Math.SQRT2;
  return [
    {b:[1,0,0],a:[1,r2*w1,w1*w1]},
    {b:[0,0,w2*w2],a:[1,r2*w2,w2*w2]},
    {b:[0,w4*w4/w3,w4*w4],a:[1,w4/Q4,w4*w4]},
    {b:[1,w5/Q5,w5*w5],a:[1,w6/Q6,w6*w6]},
  ]; })();
function pesoWk(f){
  const w=DOSPI*f; let h=[1,0];
  for(const S of WK_SEC){
    const n=[S.b[2]-S.b[0]*w*w,S.b[1]*w], d=[S.a[2]-S.a[0]*w*w,S.a[1]*w]; h=cMul(h,cDiv(n,d));
  }
  return cAbs(h);
}
/** El mismo filtro en el tiempo (transformación bilineal a fs Hz), para pesar la aceleración simulada. */
function filtroWk(fs){
  const K=2*fs, sec=WK_SEC.map(S=>{
    const [b2,b1,b0]=S.b, [a2,a1,a0]=S.a;
    const nb0=b2*K*K+b1*K+b0, nb1=2*b0-2*b2*K*K, nb2=b2*K*K-b1*K+b0, na0=a2*K*K+a1*K+a0, na1=2*a0-2*a2*K*K, na2=a2*K*K-a1*K+a0;
    return { b0:nb0/na0,b1:nb1/na0,b2:nb2/na0,a1:na1/na0,a2:na2/na0,x1:0,x2:0,y1:0,y2:0 }; });
  return x=>{ let v=x; for(const q of sec){ const y=q.b0*v+q.b1*q.x1+q.b2*q.x2-q.a1*q.y1-q.a2*q.y2; q.x2=q.x1; q.x1=v; q.y2=q.y1; q.y1=y; v=y; } return v; };
}

/* ---------- 1.5 Camino aleatorio ISO 8608 y sus métricas EXACTAS en frecuencia ----------
   G_d(n) = G_d(n0)·(n0/n)² (una cara, en ciclos/m). A la velocidad V, f = n·V y la densidad de la
   VELOCIDAD del camino es blanca: S_w = 4π²·G_d(n0)·n0²·V  [(m/s)²/Hz].
   Con la entrada en velocidad, todas las salidas tienen integral finita: RMS² = ∫ |H(f)|²/(2πf)² · S_w df. */
const sw=(Gd,V)=>DOSPI*DOSPI*Gd*N0*N0*V;
/** Integral sobre una malla logarítmica de f (trapecio en ln f), con cola analítica para la carga del neumático. */
function metricas(P,Gd,V,opt){
  const o=opt||{}, f1=o.f1||0.02, f2=o.f2||3000, N=o.N||1600, S=sw(Gd,V), dl=Math.log(f2/f1)/N;
  let ia=0, iw=0, it=0, id=0, iz=0; const tab=o.tabla?[]:null;
  for(let i=0;i<=N;i++){
    const f=f1*Math.exp(i*dl), wgt=(i===0||i===N?0.5:1)*dl*f, h=transf(P,f), w2=Math.pow(DOSPI*f,2);
    const g=S/w2, a2=(h.acc[0]**2+h.acc[1]**2)*g, wk=pesoWk(f);
    ia+=a2*wgt; iw+=a2*wk*wk*wgt; it+=(h.tire[0]**2+h.tire[1]**2)*g*wgt; id+=(h.def[0]**2+h.def[1]**2)*g*wgt; iz+=(h.zs[0]**2+h.zs[1]**2)*g*wgt;
    if(tab) tab.push({f,gaw:a2*wk*wk});
  }
  // cola de la carga del neumático: para f ≫ f2, F_din → k_t·Z_r, o sea k_t²·S/(2πf)²; ∫ desde f2 = k_t²·S/(4π²·f2)
  it+=P.kt*P.kt*S/(DOSPI*DOSPI*f2);
  const Fst=(P.ms+P.mu)*G;
  return { arms:Math.sqrt(ia), aw:Math.sqrt(iw), ftrms:Math.sqrt(it), grip:Math.sqrt(it)/Fst, def:Math.sqrt(id), zs:Math.sqrt(iz), tabla:tab };
}
/** Malla para los barridos de c: 0,1–1000 Hz con 500 puntos; igual que la fina a 1e-4 para c ≥ 200 N·s/m (se verifica). */
const MALLA_RAPIDA={ f1:0.1, f2:1000, N:500 };
/** Barrido del amortiguador pasivo: la frontera confort–agarre. */
function frontera(P,Gd,V,cs){
  return cs.map(c=>{ const m=metricas(Object.assign({},P,{c}),Gd,V,MALLA_RAPIDA); return { c, aw:m.aw, grip:m.grip, def:m.def }; });
}

/* ---------- 1.6 Polos: frecuencias propias y amortiguamiento ----------
   ms·mu·s⁴ + (ms+mu)·c·s³ + [ms(ks+kt)+mu·ks]·s² + kt·c·s + ks·kt = 0   (Durand–Kerner). */
function polos(P){
  const co=[P.ms*P.mu,(P.ms+P.mu)*P.c,P.ms*(P.ks+P.kt)+P.mu*P.ks,P.kt*P.c,P.ks*P.kt], n=4;
  const mono=co.map(x=>x/co[0]);
  const ev=z=>{ let r=[1,0]; for(let i=1;i<=n;i++){ r=cMul(r,z); r[0]+=mono[i]; } return r; };
  let z=[[0.4,0.9],[-0.9,0.4],[-0.4,-0.9],[0.9,-0.4]].map(([x,y])=>{ const R=Math.pow(Math.abs(mono[4]),1/4); return [x*R,y*R]; });
  for(let it=0;it<400;it++){
    let dmax=0;
    for(let i=0;i<n;i++){
      let den=[1,0]; for(let j=0;j<n;j++) if(j!==i) den=cMul(den,[z[i][0]-z[j][0],z[i][1]-z[j][1]]);
      const d=cDiv(ev(z[i]),den); z[i]=[z[i][0]-d[0],z[i][1]-d[1]]; dmax=Math.max(dmax,cAbs(d));
    }
    if(dmax<1e-13) break;
  }
  return z;
}
/** Frecuencias propias (Hz) y razones de amortiguamiento de los dos modos. */
function modos(P){
  const z=polos(P).filter(p=>p[1]>=0).sort((a,b)=>cAbs(a)-cAbs(b)), r=[];
  const vistos=[]; for(const p of z){ if(p[1]<1e-9&&vistos.some(q=>Math.abs(q[0]-p[0])<1e-6)) continue; vistos.push(p); r.push(p); }
  const pack=p=>({ fn:cAbs(p)/DOSPI, zeta:-p[0]/cAbs(p), fd:Math.abs(p[1])/DOSPI });
  return { carroceria:pack(r[0]), rueda:pack(r[r.length-1]) };
}
/** Frecuencias propias SIN amortiguador, de forma cerrada: ms·mu·λ² − [ms(ks+kt)+mu·ks]·λ + ks·kt = 0, λ = ω². */
function autovalores(P){
  const A=P.ms*P.mu, B=-(P.ms*(P.ks+P.kt)+P.mu*P.ks), C=P.ks*P.kt, d=Math.sqrt(B*B-4*A*C);
  return { f1:Math.sqrt((-B-d)/(2*A))/DOSPI, f2:Math.sqrt((-B+d)/(2*A))/DOSPI };
}

/* ---------- 1.7 Camino sintetizado en el espacio ----------
   Suma de senos de frecuencia espacial n_k (malla logarítmica) con amplitud a_k = √(2·G_d(n_k)·Δn_k) y fase al azar fija:
   su varianza Σ a_k²/2 reproduce la integral de G_d. Así el camino es una función de la POSICIÓN s, y cambiar la
   velocidad no cambia la carretera. */
function semilla(n){ let s=n>>>0; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function compsCamino(Gd,o){
  const op=o||{}, n=op.n||96, n1=op.n1||0.03, n2=op.n2||8, rnd=semilla(op.semilla||7), r=Math.pow(n2/n1,1/n);
  const nk=new Float64Array(n), ak=new Float64Array(n), fk=new Float64Array(n);
  for(let k=0;k<n;k++){ const lo=n1*Math.pow(r,k), hi=lo*r, dn=hi-lo; nk[k]=Math.sqrt(lo*hi); ak[k]=Math.sqrt(2*Gd*Math.pow(N0/nk[k],2)*dn); fk[k]=rnd()*DOSPI; }
  return { n:nk, a:ak, ph:fk, Gd };
}
const zCamino=(C,s)=>{ let z=0; for(let k=0;k<C.n.length;k++) z+=C.a[k]*Math.sin(DOSPI*C.n[k]*s+C.ph[k]); return z; };
/** Un bache aislado: coseno elevado de altura h y longitud l que empieza en s0. */
const zBache=(b,s)=>{ const u=(s-b.s0)/b.l; return (u<=0||u>=1)?0:b.h*0.5*(1-Math.cos(DOSPI*u)); };
/** Generador secuencial por rotación de fasores: z(s0 + k·ds) sin llamar a sin() en cada muestra. */
function generaCamino(C,ds,s0){
  const m=C.n.length, sn=new Float64Array(m), cs=new Float64Array(m), cr=new Float64Array(m), sr=new Float64Array(m);
  for(let k=0;k<m;k++){ const ph=DOSPI*C.n[k]*(s0||0)+C.ph[k]; sn[k]=Math.sin(ph); cs[k]=Math.cos(ph); cr[k]=Math.cos(DOSPI*C.n[k]*ds); sr[k]=Math.sin(DOSPI*C.n[k]*ds); }
  return ()=>{ let z=0; for(let k=0;k<m;k++){ z+=C.a[k]*sn[k]; const s2=sn[k]*cr[k]+cs[k]*sr[k]; cs[k]=cs[k]*cr[k]-sn[k]*sr[k]; sn[k]=s2; } return z; };
}
/** RMS exacto del cuarto de coche pasivo ante ESTE camino de líneas espectrales (lo que debe dar la simulación larga). */
function metricasLineas(P,C,V){
  let ia=0,iw=0,it=0,id=0;
  for(let k=0;k<C.n.length;k++){ const f=C.n[k]*V, h=transf(P,f), v=C.a[k]*C.a[k]/2, wk=pesoWk(f);
    const a2=(h.acc[0]**2+h.acc[1]**2)*v; ia+=a2; iw+=a2*wk*wk; it+=(h.tire[0]**2+h.tire[1]**2)*v; id+=(h.def[0]**2+h.def[1]**2)*v; }
  return { arms:Math.sqrt(ia), aw:Math.sqrt(iw), ftrms:Math.sqrt(it), grip:Math.sqrt(it)/((P.ms+P.mu)*G), def:Math.sqrt(id) };
}

/* ---------- 1.8 El cuarto de coche en el tiempo ----------
   estado [z_s, z_u, v_s, v_u] medido desde el equilibrio estático (el peso ya está compensado).
      m_s·z̈_s = −F,   m_u·z̈_u = F − k_t·(z_u − z_r),   F = k_s·(z_s − z_u) + c·(ż_s − ż_u). */
function cEfectiva(modo,P,st){
  if(modo!=='sky') return P.c;
  const vs=st[2], vr=st[2]-st[3];
  if(vs*vr<=0) return CSA.cmin;
  return clamp(CSA.csky*vs/vr,CSA.cmin,CSA.cmax);
}
function derivCuarto(st,zr,c,P){
  const F=P.ks*(st[0]-st[1])+c*(st[2]-st[3]);
  return [st[2],st[3],-F/P.ms,(F-P.kt*(st[1]-zr))/P.mu];
}
/** Un paso RK4 con el camino en t, t+h/2 y t+h; c se mantiene durante el paso. Devuelve el estado nuevo y la c usada. */
function rk4Cuarto(st,zr0,zrm,zr1,h,P,modo){
  const c=cEfectiva(modo,P,st), add=(a,b,k)=>a.map((v,i)=>v+b[i]*k);

/* ===================== 9. EL ESTADO Y EL RELOJ =====================
   UN SOLO RELOJ: la simulación en el tiempo (RK4 a 1 ms) avanza dt·velocidad en cada cuadro, y con ESE estado se pintan
   la escena (carrocería, rueda, resorte, pistón, gotas, huella) y las señales del dock. Los RMS y las curvas de frecuencia
   son el modelo EXACTO del mismo cuarto de coche. */
const CAM_NOM={B:'B · buena',C:'C · regular',D:'D · mala'};
const GV_CAM={B:8,C:5,D:3};
const CARGAS=[['vacio','Vacío',270],['normal','Normal',320],['lleno','Lleno',400]];
const EST={modo:'marcha',cam:'B',carga:'normal',c:1500,V:80,estrategia:'pasivo',vel:0.25,gv:8,pausa:REDUCIDO,autoRunning:false,vista:'cuarto',rot:false};
const NH=1000, DT_H=0.005;                                   // historial: 1 000 muestras cada 5 ms = 5 s
const SIM={P:null,cam:'B',Gd:0,V:0,modo:'pasivo',C:null,st:[0,0,0,0],t:0,s:0,h:0.001,zr:0,cEf:1500,a:0,au:0,ft:0,baches:[],acc:0,proxBache:0,lazoBache:false,reinicios:0,
  hist:{i:0,len:0,t:new Float32Array(NH),zr:new Float32Array(NH),zs:new Float32Array(NH),zu:new Float32Array(NH),a:new Float32Array(NH),ft:new Float32Array(NH),c:new Float32Array(NH)}};
const COMPS={};
const compsDe=k=>COMPS[k]||(COMPS[k]=compsCamino(CAMINOS[k],{n:96,semilla:7}));
const zRoad=s=>{ let z=zCamino(SIM.C,s); for(const b of SIM.baches) z+=zBache(b,s); return z; };
const F0=P=>(P.ms+P.mu)*G;

/** Lo que corre ahora: en «En marcha», lo que digan los mandos; en el laboratorio guiado, lo que pida el paso. */
function paramsActuales(){
  if(EST.modo==='guia'){ const p=guiaParams(); if(p) return p; }
  const ms=CARGAS.find(c=>c[0]===EST.carga)[2];
  return { P:Object.assign({},NOMINAL,{ms,c:EST.c}), cam:EST.cam, V:EST.V/3.6, modo:EST.estrategia, lazoBache:false, gv:null };
}
/** Cambia los parámetros SIN reiniciar el estado (los mandos de masa, amortiguador y velocidad se sienten al instante). */
function aplicaParams(p){
  SIM.P=p.P; SIM.V=p.V; SIM.modo=p.modo; SIM.lazoBache=!!p.lazoBache; if(p.gv) EST.gv=p.gv;
  if(p.cam!==SIM.cam||!SIM.C){ SIM.cam=p.cam; SIM.Gd=CAMINOS[p.cam]; SIM.C=compsDe(p.cam); }
  SIM.cEf=p.P.c; DOCK.sucio=true; FRONT.sucio=true;
}
function reiniciaSim(){
  const p=paramsActuales(); SIM.cam=''; aplicaParams(p);
  SIM.st=[0,0,0,0]; SIM.t=0; SIM.s=0; SIM.baches=[]; SIM.acc=0; SIM.hist.i=0; SIM.hist.len=0; SIM.proxBache=1e9; SIM.reinicios++;
  SIM.zr=zRoad(0);
  avanzaSim(4.0);                                              // arranca ya en marcha: cuatro segundos de camino previos (el historial ya está lleno)
  SIM.proxBache=SIM.t+(p.lazoBache?3.0:1e9);
  if(typeof pintaDockFijo==='function') pintaDockFijo();
}
function lanzaBache(){ SIM.baches.push({s0:SIM.s+4.0,h:0.05,l:clamp(SIM.V*0.28,1.0,9)}); }   // un lomo de 50 mm cuya longitud dura ≈ 0,28 s a cualquier velocidad (excita la carrocería)
function guardaHist(){
  const H=SIM.hist, i=H.i%NH; H.t[i]=SIM.t; H.zr[i]=SIM.zr; H.zs[i]=SIM.st[0]; H.zu[i]=SIM.st[1]; H.a[i]=SIM.a; H.ft[i]=SIM.ft/F0(SIM.P); H.c[i]=SIM.cEf; H.i++; H.len=Math.min(NH,H.len+1);
}
/** Avanza el modelo dt segundos de reloj de simulación. */
function avanzaSim(dt){
  if(!SIM.P) return;
  let resto=dt, n=0; const P=SIM.P;
  while(resto>1e-9&&n<6000){
    const h=Math.min(SIM.h,resto), s0=SIM.s, s1=s0+SIM.V*h, z0=SIM.zr, zm=zRoad((s0+s1)/2), z1=zRoad(s1);
    const r=rk4Cuarto(SIM.st,z0,zm,z1,h,P,SIM.modo); SIM.st=r.st; SIM.cEf=r.c; SIM.s=s1; SIM.zr=z1; SIM.t+=h; resto-=h; n++;
    SIM.a=accCuerpo(SIM.st,r.c,P); SIM.ft=cargaDin(SIM.st,z1,P);
    const F=P.ks*(SIM.st[0]-SIM.st[1])+r.c*(SIM.st[2]-SIM.st[3]); SIM.au=(F-P.kt*(SIM.st[1]-z1))/P.mu;
    SIM.acc+=h; if(SIM.acc>=DT_H-1e-9){ SIM.acc-=DT_H; guardaHist(); }
  }

  SIM.baches=SIM.baches.filter(b=>b.s0+b.l>SIM.s-12);
}

/* ---------- Lo que se calcula en frecuencia (exacto) y por simulación (semiactivo) ---------- */
const DOCK={sucio:true,mp:null,met:null,mod:null,tx:null,key:'',sky:{}};
const FRONT={sucio:true,key:'',cs:[],datos:[],semi:null};
const FRECS=(()=>{ const a=[]; for(let i=0;i<=150;i++) a.push(0.3*Math.pow(40/0.3,i/150)); return a; })();
function skyDe(P,cam,V){
  const k=[P.ms,P.ks,P.kt,P.mu,cam,V.toFixed(2)].join('|');
  return DOCK.sky[k]||(DOCK.sky[k]=simulaMetricas(Object.assign({},P),compsDe(cam),V,{T:30,modo:'sky'}));
}
function calculaDock(){
  const P=SIM.P; if(!P) return;
  DOCK.mp=metricas(P,SIM.Gd,SIM.V); DOCK.mod=modos(P);
  DOCK.met=SIM.modo==='sky'?Object.assign({sim:true},skyDe(P,SIM.cam,SIM.V)):Object.assign({sim:false},DOCK.mp);
  const curva=Pc=>FRECS.map(f=>{ const h=transf(Pc,f); return [cAbs(h.zs),cAbs(h.zu)]; });
  DOCK.tx={ actual:curva(P), bajo:curva(Object.assign({},P,{c:CSA.cmin})), alto:curva(Object.assign({},P,{c:CSA.cmax})), nominal:curva(Object.assign({},NOMINAL,{c:P.c})) };
  DOCK.f0=autovalores(NOMINAL); DOCK.sucio=false;
}
/** La frontera confort–agarre del amortiguador pasivo en este escenario (se recalcula sólo si cambia el escenario). */
function calculaFrontera(){
  const P=SIM.P; if(!P) return; const k=[P.ms,P.ks,P.kt,P.mu,SIM.cam,SIM.V.toFixed(2)].join('|');
  if(k===FRONT.key&&FRONT.datos.length){ FRONT.sucio=false; return; }
  const cs=[]; for(let i=0;i<=56;i++) cs.push(Math.round(150*Math.pow(6500/150,i/56)));
  FRONT.datos=frontera(P,SIM.Gd,SIM.V,cs); FRONT.cs=cs; FRONT.key=k; FRONT.sucio=false;
  FRONT.semi=null;
}

/* ===================== 10. LO QUE SE VE ===================== */
const clamp01=x=>Math.max(0,Math.min(1,x));
const _tmpM=new THREE.Matrix4(), _tmpQ=new THREE.Quaternion(), _tmpV=new THREE.Vector3(), _tmpS=new THREE.Vector3(1,1,1);
function aplicaEscena(){
  const S=SIM; if(!S.P) return; const gv=EST.gv, zs=S.st[0], zu=S.st[1], P=S.P;
  const dV=0.12*Math.tanh(gv*(zs-zu)/0.12);                         // recorrido de la suspensión dibujado (con tope suave para que nada se atraviese)
  G_RUEDA.position.y=gv*zu; G_CUERPO.position.y=gv*zu+dV;
  SPIN.rotation.z=-S.s/RW;
  RESORTE.ajusta(clamp(L_RESORTE0+dV,0.32,0.74));
  // camino
  actualizaCamino(S.s,gv,zRoad);
  // válvulas: el color dice cuán duro está el amortiguador
  const t=clamp01((S.cEf-CSA.cmin)/(CSA.cmax-CSA.cmin)), tt=SIM.modo==='sky'?t:clamp01((P.c-200)/(6000-200));
  _col.copy(C_OK).lerp(C_RJ,tt); MV_VAL.emissive.copy(_col); MV_VAL.emissiveIntensity=0.55+1.1*tt; MV_VAL.color.copy(_col).multiplyScalar(0.25);
  // gotas: cruzan el pistón con el sentido y la rapidez de la velocidad relativa
  const vrel=S.st[2]-S.st[3], sg=vrel>0?-1:1, v=Math.min(1,Math.abs(vrel)*gv*0.9);
  const yp=G_CUERPO.position.y+Y_TOPE-L_VASTAGO;
  for(let i=0;i<NGOTA;i++){
    gotaFase[i]=(gotaFase[i]+ (0.08+4.2*v)*(EST.pausa?0:Math.min(0.05,S.lastDt||0.016)))%1;
    const u=gotaFase[i], y=yp+sg*(u-0.5)*0.15, r=gotaR[i]*(1-0.35*Math.exp(-Math.pow((u-0.5)/0.12,2)));
    _tmpV.set(XS+r*Math.sin(gotaAng[i]),y,ZS+r*Math.cos(gotaAng[i])); _tmpS.setScalar(0.55+0.9*Math.exp(-Math.pow((u-0.5)/0.14,2))); _tmpM.compose(_tmpV,_tmpQ,_tmpS); GOTAS.setMatrixAt(i,_tmpM);
  }

  const carga=1+S.ft/F0(P), yR=gv*S.zr+0.004;

  const ia=Math.round((0.44-RUTA.x0)/(RUTA.x1-RUTA.x0)*(RUTA.N-1)); FLECHA.position.set(0.44,gv*S.zr*0+_hCam[ia]+0.004,0.16); const Lf=Math.max(0.02,0.42*carga); FL_ASTA.scale.y=Math.max(0.01,Lf-0.07); FL_PUNTA.position.y=Math.max(0.02,Lf-0.035); MV_FLECHA.color.copy(_col);
  // el sol sigue a la escena
}

/* ===================== 11. CÁMARAS ===================== */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
/** Desplaza el centro de la proyección al centro del hueco libre: el objeto queda en medio de lo que se ve, sin mover la cámara. */
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}
/** Cada vista tiene un centro, un tamaño y la fracción del alto del lienzo que debe ocupar (0,62: entre el 55 y el 70 %). */
const VISTAS={
  cuarto:{c:V3(-0.09,0.72,0),w:1.86,h:1.46,fr:0.62,az:20,el:13},
  amort: {c:V3(XS,0.74,ZS),w:0.62,h:0.74,fr:0.74,az:14,el:6},
  rueda: {c:V3(0.02,0.30,0),w:1.5,h:0.86,fr:0.62,az:24,el:12},
};
function encuadre(v){
  const V=VISTAS[v]||VISTAS.cuarto, H=huecoLibre(), Hc=innerHeight, th=Math.tan(camera.fov*Math.PI/360), hw=Math.max(80,H.x1-H.x0), hh=Math.max(80,H.y1-H.y0);
  const hpx=Math.min(V.fr*Hc,0.9*hh), dH=V.h/(2*th)*Hc/hpx, dW=V.w/(2*th)*Hc/(0.96*hw), d=Math.max(dH,dW);
  const az=V.az*Math.PI/180, el_=V.el*Math.PI/180, dir=V3(Math.sin(az)*Math.cos(el_),Math.sin(el_),Math.cos(az)*Math.cos(el_));
  return { pos:V.c.clone().add(dir.multiplyScalar(d)), tgt:V.c.clone() };
}

const FUENTE="'Outfit',system-ui,sans-serif";
function lienzo(id){ const box=el(id), c=box.querySelector('canvas'); return {box,c,ctx:c.getContext('2d'),w:0,h:0,dpr:1}; }
function abre(L){ const r=L.box.getBoundingClientRect(), dpr=Math.min(3,window.devicePixelRatio||1);

/* ---- Transmisibilidad ---- */

  for(const f of [0.5,1,2,5,10,20,40]){ raya(x,X(f),Y1,X(f),Y1+3,'#3d5550'); raya(x,X(f),Y0,X(f),Y1,'rgba(143,179,172,0.07)'); txt(x,fN(f,f<1?1:0),X(f),Hd-2,'#6f8a85',8.5,'center','500'); }

  if(enDiag()){
    serie(T.nominal,0,'rgba(255,255,255,0.55)',1.2,[4,3]); serie(T.nominal,1,'rgba(255,179,71,0.55)',1.2,[4,3]);

/* ---- Confort frente a agarre: la frontera del amortiguador pasivo ---- */
function pintaPa(){
  const x=abre(LPA), Wd=LPA.w, Hd=LPA.h; if(!FRONT.datos.length||!DOCK.met) return;
  if(enDiag()){ txt(x,'Diagnóstico: mira la',Wd/2,Hd/2-4,'#6f8a85',10.5,'center','600'); txt(x,'transmisibilidad y las señales',Wd/2,Hd/2+10,'#6f8a85',10.5,'center','600'); el('t_pa').textContent=''; return; }
  const D=FRONT.datos; let aMin=1e9, gMin=1e9, iA=0, iG=0; D.forEach((d,i)=>{ if(d.aw<aMin){ aMin=d.aw; iA=i; } if(d.grip<gMin){ gMin=d.grip; iG=i; } });
  const r=enDecide()&&GUIA.r2.umbral?GUIA.r2.umbral:null;
  let gx0=gMin*0.88, gx1=gMin*2.0, ay0=aMin*0.9, ay1=aMin*2.1;
  if(r){ gx0=Math.min(gx0,r.Y*0.75); gx1=Math.max(r.Y*1.7,gx0*1.6); ay0=Math.min(ay0,r.X*0.75); ay1=Math.max(r.X*1.7,ay0*1.6); }
  { const mm=DOCK.met; gx1=Math.max(gx1,mm.grip*1.06); ay1=Math.max(ay1,mm.aw*1.06); gx0=Math.min(gx0,mm.grip*0.94); ay0=Math.min(ay0,mm.aw*0.94); }
  const X0=30, X1=Wd-8, Y0=8, Y1=Hd-18, X=g=>X0+(g-gx0)/(gx1-gx0)*(X1-X0), Y=a=>Y1-(a-ay0)/(ay1-ay0)*(Y1-Y0);
  x.save(); x.beginPath(); x.rect(X0,Y0,X1-X0,Y1-Y0); x.clip();
  if(r){ x.fillStyle='rgba(52,211,153,0.10)'; x.fillRect(X0,Y(r.X),X(r.Y)-X0,Y1-Y(r.X)); }
  if(!ocultaFrontera()){
    // tramo ineficiente (c por debajo del óptimo de confort o por encima del de agarre): gris y a trazos
    const trazo=(i0,i1,col,w,dash)=>{ x.strokeStyle=col; x.lineWidth=w; x.setLineDash(dash||[]); x.beginPath(); for(let i=i0;i<=i1;i++){ const px=X(D[i].grip*100/100),py=Y(D[i].aw); i===i0?x.moveTo(px,py):x.lineTo(px,py); } x.stroke(); x.setLineDash([]); };
    trazo(0,D.length-1,'rgba(143,179,172,0.5)',1.2,[3,3]); trazo(Math.min(iA,iG),Math.max(iA,iG),'#4FD1C5',2.4);
  }
  if(r){ raya(x,X(r.Y),Y0,X(r.Y),Y1,COL_R,1.2,[4,3]); raya(x,X0,Y(r.X),X1,Y(r.X),COL_R,1.2,[4,3]); }
  if(enDecide()&&GUIA.r2.pruebas) for(const p of GUIA.r2.pruebas){ x.strokeStyle='rgba(255,255,255,0.7)'; x.lineWidth=1.2; x.beginPath(); x.arc(X(p.grip),Y(p.aw),3.4,0,DOSPI); x.stroke(); }
  // el punto actual
  const m=DOCK.met; x.fillStyle=m.sim?COL_R:'#fff'; x.beginPath(); x.arc(X(m.grip),Y(m.aw),4.4,0,DOSPI); x.fill(); x.strokeStyle='#08201C'; x.lineWidth=1.2; x.stroke();
  x.restore();
  for(let i=0;i<=2;i++){ const g=gx0+(gx1-gx0)*i/2, a=ay0+(ay1-ay0)*i/2; txt(x,fN(g*100,0),X(g),Hd-8,'#6f8a85',8.5,i===0?'left':(i===2?'right':'center'),'500'); txt(x,fN(a,2),X0-3,Y(a)+3,'#6f8a85',8.5,'right','500'); }
  txt(x,'σFz/F₀ (%) →',X1,Hd-1,'#8aa39e',8.5,'right','500'); txt(x,'↑ a_w',X0+3,Y0+9,'#8aa39e',8.5,'left','500'); txt(x,'↙ mejor',X1-3,Y0+9,'#6f8a85',8.5,'right','600');
  el('t_pa').textContent=SIM.modo==='sky'?'semiactivo ●':(ocultaFrontera()?'tu objetivo':'c óptimo '+fN(D[iA].c,0)+'–'+fN(D[iG].c,0));
}

    raya(x,X0,Yc,X1,Yc,'rgba(143,179,172,0.22)'); raya(x,X0,Y(ym),X1,Y(ym),'rgba(143,179,172,0.07)'); raya(x,X0,Y(-ym),X1,Y(-ym),'rgba(143,179,172,0.07)');
    txt(x,'±'+fN(ym,ym<1?1:0),X0-3,Y(ym)+7,'#6f8a85',8.5,'right','500'); txt(x,L.et,X0+3,L.y0+8,'#8aa39e',8.5,'left','500');

  }

function calculaPsd(){
  const P=SIM.P, Pe=Object.assign({},P,{c:SIM.modo==='sky'&&DOCK.met.cMedia?DOCK.met.cMedia:P.c}), S=sw(SIM.Gd,SIM.V);
  const g=FRECS.map(f=>{ const h=transf(Pe,f), w=DOSPI*f, wk=pesoWk(f); return (h.acc[0]**2+h.acc[1]**2)*wk*wk*S/(w*w); });
  let tot=0, baj=0; for(let i=1;i<FRECS.length;i++){ const d=(FRECS[i]-FRECS[i-1])*(g[i]+g[i-1])/2; tot+=d; if(FRECS[i]<3) baj+=d; }
  DOCK.psd={g,max:Math.max(...g)*1.08,bajo:baj/tot};
}

function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.47:0.43),240,450));
  let hh=base; const hud=el('hud');

/* ===================== 17. EL LABORATORIO GUIADO =====================
   Tres fases: 1 · Predice (la frecuencia propia de la carrocería con √(k/m)), 2 · Decide (un reto de compromiso:
   elegir el amortiguador, o la estrategia, que cumple a la vez un umbral de confort Y uno de agarre en un escenario
   que sale del sorteo) y 3 · Diagnostica (¿amortiguador gastado, resorte vencido o neumático bajo de presión?, sólo
   con la transmisibilidad y las señales) y cierra con un quiz de tres preguntas.
   Tres o cinco intentos fallidos cambian el escenario (no se aprueba por eliminación). */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETO={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'predice',iniciado:false,dxOk:false,r1:null,r2:null,dx:null,orden:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0};

/* ---------- Fase 1 · Predice ---------- */
const MS1=[240,280,320,360,400], KS1=[16000,20000,24000,28000,32000];
const fSimple=(ks,ms)=>Math.sqrt(ks/ms)/DOSPI;                    // la carrocería sola sobre su resorte
function sorteaCaso1(){ const p=GUIA.r1; let ms,ks; do{ ms=pickOne(MS1); ks=pickOne(KS1); }while(p&&p.ms===ms&&p.ks===ks);
  GUIA.r1={ms,ks,ans:fSimple(ks,ms)}; }
function checkPredice(){
  const raw=String((el('ansF')||{}).value||'').trim().replace(/\s| /g,'').replace(',','.'), v=parseFloat(raw), r=GUIA.r1, ok=r.ans;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe la frecuencia en hercios (con coma o punto decimal).'); return; }
  RETO.intentos++;
  if(Math.abs(v-ok)<=0.03*ok){
    RETO.fallos1=0; sonido.bien();
    const f2=autovalores(Object.assign({},NOMINAL,{ms:r.ms,ks:r.ks})).f1;
    feedback('good','¡Correcto! ✓',`La carrocería es una masa sobre un resorte: ω = √(k<sub>s</sub>/m<sub>s</sub>) = √(${fN(r.ks)} / ${fN(r.ms)}) = ${fN(Math.sqrt(r.ks/r.ms),2)} rad/s, o sea <b>${fN(ok,2)} Hz</b>. El modelo completo, con el neumático cediendo también, da ${fN(f2,2)} Hz: un poco menos, porque el neumático añade flexibilidad en serie.`,true);
    paso('decide'); prepararDecide();
  } else {
    RETO.fallos1++; sonido.mal();
    const d=v>ok?'alto':'bajo', rad=Math.abs(v-ok*DOSPI)<0.05*ok*DOSPI;
    if(RETO.fallos1>=3){ RETO.fallos1=0; RETO.resiembras++; sorteaCaso1();
      feedback('bad','Tres intentos fallidos','Cambia la carrocería y el resorte: vuelve a plantear la frecuencia de una masa sobre un resorte.'); reiniciaSim(); pintaHUD(); pintaDockFijo();
    } else {
      feedback('bad','Revisa el cálculo',`Tu resultado (${fN(v,v%1?2:0)}) está ${d}.`+(rad?' Eso es la frecuencia angular en rad/s: aquí se pide en hercios (ciclos por segundo).':' Piensa en una masa m colgada de un resorte k: ¿cuál es su frecuencia natural?')+` (intentos fallidos: ${RETO.fallos1}/3)`);
      const t=el('d_try'); if(t) t.textContent=RETO.fallos1;
    }
  }
}

/* ---------- Fase 2 · Decide ---------- */
const CS_BARRIDO=(()=>{ const a=[]; for(let c=150;c<=6000;c+=50) a.push(c); return a; })();
function sorteaEscenario(){
  const prev=GUIA.r2;
  for(let n=0;n<60;n++){
    const cam=pickOne(['B','C']), V=pickOne([50,70,90,110]), ms=pickOne([270,320,400]), cStar=100*Math.round((900+Math.random()*1700)/100);
    if(prev&&prev.cam===cam&&prev.V===V&&prev.ms===ms) continue;
    const P=Object.assign({},NOMINAL,{ms,c:cStar}), m=metricas(P,CAMINOS[cam],V/3.6,MALLA_RAPIDA), X=m.aw*1.03, Y=m.grip*1.03;
    const w=ventanaC(Object.assign({},NOMINAL,{ms}),CAMINOS[cam],V/3.6,X,Y,CS_BARRIDO);
    if(!w||w.hi-w.lo<150||w.hi-w.lo>650) continue;
    const c0=(w.lo<=4000&&w.hi>=4000)?5200:4000;
    return { cam, V, ms, c:c0, est:'pasivo', umbral:{X,Y}, ventana:w, pruebas:[], hecho:false, intentos:0 };
  }
  return { cam:'B', V:80, ms:320, c:4000, est:'pasivo', umbral:{X:0.65,Y:0.126}, ventana:{lo:1300,hi:1650,n:8}, pruebas:[], hecho:false, intentos:0 };
}
function prepararDecide(){ GUIA.r2=sorteaEscenario(); EST.gv=GV_CAM[GUIA.r2.cam]; reiniciaSim(); pintaHUD(); pintaDockFijo(); pintaBarras(); }
function probarDecide(){
  const r=GUIA.r2; if(!r) return; r.intentos++; RETO.intentos++;
  const P=Object.assign({},NOMINAL,{ms:r.ms,c:r.c}), m=r.est==='sky'?skyDe(P,r.cam,r.V/3.6):metricas(P,CAMINOS[r.cam],r.V/3.6);
  r.pruebas.push({aw:m.aw,grip:m.grip}); if(r.pruebas.length>8) r.pruebas.shift();
  const okA=m.aw<=r.umbral.X, okG=m.grip<=r.umbral.Y;
  if(okA&&okG){
    RETO.fallos2=0; r.hecho=true; sonido.bien(); FRONT.sucio=true;
    const w=r.ventana;
    feedback('good','¡Cumples las dos a la vez! ✓',`Con ${r.est==='sky'?'el semiactivo':'c = '+fN(r.c)+' N·s/m'}: a<sub>w</sub> = ${fN(m.aw,2)} m/s² y σF<sub>z</sub>/F₀ = ${fN(m.grip*100,1)} %. Con amortiguador pasivo había una ventana de c entre ≈ ${fN(w.lo)} y ${fN(w.hi)} N·s/m: por debajo, el aceite pasa fácil, la rueda rebota y se pierde agarre; por encima, la rueda sigue el camino pero la carrocería lo siente. Ahora ves la frontera completa.`,true);
    paso('diag'); iniciaDiag();
  } else {
    RETO.fallos2++; sonido.mal();
    const partes=[]; if(!okA) partes.push(`el <b>confort</b> no llega: a<sub>w</sub> = ${fN(m.aw,2)} m/s² y se pedía ≤ ${fN(r.umbral.X,2)}`); if(!okG) partes.push(`el <b>agarre</b> no llega: σF<sub>z</sub>/F₀ = ${fN(m.grip*100,1)} % y se pedía ≤ ${fN(r.umbral.Y*100,1)} %`);
    if(RETO.fallos2>=5){ RETO.fallos2=0; RETO.resiembras++; feedback('bad','Cinco intentos sin lograrlo','Cambia el escenario: otro camino, otra velocidad y otra carga.',true); prepararDecide(); }
    else { feedback('bad','Todavía no',partes.join(' · ')+`. (intentos fallidos: ${RETO.fallos2}/5)`,true); pintaHUD(); }
  }
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const TIPOS_DX=[{k:'amort',t:'Amortiguador gastado',P:{c:260}},{k:'resorte',t:'Resorte vencido',P:{ks:12000}},{k:'neumatico',t:'Neumático desinflado',P:{kt:105000}}];
function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.k; let t; do{ t=pickOne(TIPOS_DX); }while(t.k===p);
  GUIA.dx=t; GUIA.dxOk=false; GUIA.orden=barajar(TIPOS_DX.map(x=>x.k)); EST.gv=8; reiniciaSim(); pintaHUD(); pintaDockFijo();
}
function diagnostica(k){
  if(!GUIA.dx||GUIA.dxOk) return; RETO.intentos++;

    GUIA.dxOk=true; RETO.fallos3=0; sonido.bien(); DOCK.sucio=true;

    paso('quiz'); iniciaQuiz();
  } else {
    RETO.fallos3++; sonido.mal();
    if(RETO.fallos3>=3){ RETO.fallos3=0; RETO.resiembras++; feedback('bad','Tres intentos fallidos','Es otro coche: compara de nuevo dónde están los picos de la transmisibilidad con las líneas de la suspensión sana.',true); iniciaDiag(); }
    else { feedback('bad','No es esa',noEs(k)+` (intentos fallidos: ${RETO.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(k){
  if(k==='amort') return 'Amortiguador gastado: las dos frecuencias propias no se mueven, pero los picos de la transmisibilidad se disparan y la carrocería sigue rebotando tras cada bache, porque falta amortiguamiento.';
  if(k==='resorte') return 'Resorte vencido: la rigidez k<sub>s</sub> baja y con ella la frecuencia de la carrocería, f ∝ √(k<sub>s</sub>/m<sub>s</sub>); el pico de la carrocería se corre a la izquierda y el de la rueda casi no se mueve.';
  return 'Neumático desinflado: baja k<sub>t</sub> y con ella la frecuencia de la rueda (el salto de rueda baja de ≈ 12 Hz); la carrocería casi no se entera.';
}
function noEs(k){
  if(k==='amort') return 'Con un amortiguador gastado las frecuencias de los picos seguirían donde las de la suspensión sana; lo que cambia es su altura y cuánto tarda en apagarse el rebote.';

}

/* ---------- el enrutador de acciones ---------- */
function paso(p){ GUIA.paso=p; GUIA.phase=({predice:0,decide:1,diag:2,quiz:2,completo:2})[p]; if(EST.modo==='guia') pintaHUD(); }
function handleAction(act,btn){
  switch(act){

    case 'hint-f':

/* ===================== 18. SONIDO (sintetizado) ===================== */
const sonido=(function(){
  let ctx=null,on=true,master=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination); }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); }
  return {init,
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }, get vol(){ return 0; }, get freq(){ return 0; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});

function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.min(devicePixelRatio,alta?2:1.5));
  const ms=alta?2048:1024; if(LUZ.sol.shadow.mapSize.x!==ms){ LUZ.sol.shadow.mapSize.set(ms,ms); if(LUZ.sol.shadow.map){ LUZ.sol.shadow.map.dispose(); LUZ.sol.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); centraEnHueco(); ponVista(EST.vista,0.2);
}

/* ===================== 20. EL LAZO: UN SOLO RELOJ ===================== */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0, tFront=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime; SIM.lastDt=dt;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  if(!EST.pausa) avanzaSim(dt*EST.vel);
  aplicaEscena();
  pasaCam(dt);
  if(DOCK.sucio){ calculaDock(); calculaPsd(); }
  if(FRONT.sucio&&t-tFront>0.2){ tFront=t; calculaFrontera(); }
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaTx(); pintaPa(); pintaFu(); pintaSp(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos();
}
