<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Autonomía de un VE: ecuación de carga de ruta — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#07151A;--panel:rgba(7,19,24,.88);--line:#1A3640;--ink:#EAF4F2;
    --dim:#8FB3B0;--accent:#2DD4BF;--accent2:#7DE9D9;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cF:#7DE9D9;--cR:#FFB347;--cE:#FF6B3D;--cG:#C8D6E2;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#12262c;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#183339}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#5eead4}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#06120f}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#2DD4BF;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f8a85;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f948f;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#04211c}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#081a1f;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(26,54,64,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(26,54,64,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f8a85}
  .dk-tit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#9fbab4;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(26,54,64,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c9c4;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#12262c;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfe0dc;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(8,20,26,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(7,19,24,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d6d2}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,22,24,.92);border:1px solid rgba(125,211,252,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,22,24,.84);border:1px solid rgba(125,211,252,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}
  body.estrecho.ancho.t-panel .panel>.dk-fig{grid-column:1;grid-row:2}
  body.estrecho.ancho.t-panel .panel>.dk-row{grid-column:1;grid-row:3/6;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-fu{grid-column:2;grid-row:2;align-self:start}
  body.estrecho.ancho.t-panel .panel>.dk-g.fu{grid-column:2;grid-row:2/4;min-height:0;margin-top:18px}
  body.estrecho.ancho.t-panel .panel>.dk-ley{display:none}
  body.estrecho.ancho.t-panel .panel>.t-sp{grid-column:2;grid-row:4}
  body.estrecho.ancho.t-panel .panel>.dk-g.sp{grid-column:2;grid-row:5;min-height:0}
  body.estrecho.ancho.t-panel .panel>.dk-aviso{display:none}
  body.estrecho .hud details>.cuerpo{max-height:24vh}
  body.estrecho.ancho.t-hud .hud{display:grid;grid-template-columns:1fr 1.05fr;column-gap:14px;row-gap:7px;align-content:start;grid-auto-flow:row dense}
  body.estrecho.ancho .hud>.hcab,body.estrecho.ancho .hud>.modebar,body.estrecho.ancho .hud>.hdet,body.estrecho.ancho .hud>.pasos{grid-column:1}
  body.estrecho.ancho .hud>.hmandos,body.estrecho.ancho .hud>.retoBox{grid-column:2;grid-row:1/span 4}
  body.estrecho .hdet{flex-direction:row}body.estrecho .hdet>details{flex:1;min-width:0}
  body.estrecho .hdet details[open]{position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 54px);z-index:25;background:rgba(7,19,24,.97)}
  body.movil .lt{display:none} body.movil .tbar .modo,body.movil .tbar .reloj{display:none}
  body.movil .tbar{gap:6px;padding:5px 8px} body.movil .tbar .est{min-width:0}
  body.movil .dk-ley{display:none} body.movil .fg b{font-size:13.5px} body.movil .fg .fl{font-size:9.5px}
  body.movil .dk-g.fu{min-height:70px} body.movil .dk-g.sp{min-height:52px} body.movil .dk-row{min-height:150px}
  body.movil .hud h2{font-size:15.5px} body.movil .hud .intro{font-size:11.8px;line-height:1.42}
  body.estrecho .hud{overflow-y:auto}
  body.estrecho .vbar [data-t="rot"],body.estrecho .vbar .sep.s1{display:none}
  body.estrecho.ancho .vbar{top:60px}
  body.movil .vbar{flex-wrap:nowrap;gap:3px;padding:3px 4px;top:54px} body.movil .vbar .sep{display:none} body.movil .vbar .b.sm{padding:5px 7px;font-size:11px}
  body.movil .vbar .lg{display:none}
  body.movil .tbar .lento{display:none}
  body.movil .hud{gap:6px;padding:10px 12px 9px} body.movil .hud .eyebrow{display:none}
  body.movil .modebar .b{padding:6px 4px 5px}
  body.movil .hmandos{display:grid;grid-template-columns:1.3fr 1fr;gap:6px 8px}
  body.movil .hmandos>:nth-child(1),body.movil .hmandos>:nth-child(2),body.movil .hmandos>.fila{grid-column:1/-1}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   LAB — AUTONOMÍA DE UN VE: ECUACIÓN DE CARGA DE RUTA
   (Autotrónica · mecanica-134)

   Un crossover eléctrico en media sección (batería de 96 módulos, inversor, motor trasero) recorre
   una ruta SINTÉTICA de 240 km con un puerto de 2 350 m (no es un ciclo normalizado). La cuña de
   carretera bajo el coche es un diorama de corte geológico; la pendiente se dibuja EXAGERADA ×4.
   Cada tramo de 100 m plantea F = m·g·C_rr·cosθ + ½ρ(z)·C_d·A·v² + m·g·sinθ + m·a y la potencia
   en la batería sale de ahí con un modelo de pérdidas del tren y de regeneración limitada. Un script
   de Node extrae TAL CUAL el bloque de física y verifica conservación, autonomía y velocidad óptima.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO=' ';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }


/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos
   marcas— y lo prueba: lo que se prueba es lo que corre.

   Un crossover eléctrico recorre una ruta SINTÉTICA de 240 km con un puerto de montaña
   (no es un ciclo normalizado). En cada tramo de 100 m se plantea la ecuación de carga:
     F = m·g·C_rr·cosθ + ½ρ(z)·C_d·A·v² + m·g·sinθ + m·a
   La potencia en la batería sale de la fuerza en la rueda y de un modelo de pérdidas del tren
   (inversor + motor + reductor); en frenado hay regeneración LIMITADA (potencia y fuerza máximas,
   desvanece a baja velocidad) y lo que el motor no puede absorber lo disipa el freno de fricción.
   La energía se integra con diferencias finitas exactas: v² es lineal en la distancia dentro de
   cada tramo (aceleración constante), así que el trabajo de la inercia es ΔEc exacto, el de la
   pendiente es m·g·Δz exacto y el del aire usa la media de v² exacta. */

/* FISICA:INICIO */
const DOSPI=2*Math.PI, G=9.80665, RAD=Math.PI/180;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const suave=t=>{ t=clamp(t,0,1); return t*t*(3-2*t); };
/** Atmósfera estándar ISA (troposfera): ρ(z) = ρ0·(1 − L·z/T0)^(g/(R·L) − 1), con L = 6,5 K/km y T0 = 288,15 K: a 2 400 m el aire pesa ≈ 21 % menos. */
const AIRE={ rho0:1.225, beta:0.0065/288.15, k:4.25588 };
const rhoAlt=z=>AIRE.rho0*Math.pow(1-AIRE.beta*z,AIRE.k);
/** El coche: crossover eléctrico de 45 kWh útiles. P0: electrónica del inversor y bombas; kfe: pérdidas en el hierro y
 *  mecánicas ∝ v; ki: conducción del inversor ∝ |F| (corriente); kcu: cobre ∝ F² (corriente²). */
const VEH={ m0:1750, A:2.30, Cd:0.27, Crr:0.010, rw:0.34, Ebat:45*3.6e6, etaBat:0.97,
  P0:250, kfe:18, ki:0.9, kcu:7e-4, Pregmax:65e3, Fregmax:4200, vFade:2.5, Paux:800, aAcc:0.7, aDec:0.9 };
const KWH=3.6e6;
/** La ruta: puntos (km, m) unidos por coseno (pendiente nula en cada punto) más dos ondulaciones suaves. */
const RUTA={ L:240e3, ds:100, nombre:'Ruta sintética de 240 km con puerto',
  knots:[[0,600],[40,640],[100,2350],[140,1000],[190,800],[240,860]],
  zonas:[[0,40e3],[40e3,100e3],[100e3,140e3],[140e3,240e3]], zonaTipo:[0,1,2,0] };
function zRuta(s){
  const k=RUTA.knots, km=clamp(s,0,RUTA.L)/1000; let i=0; while(i<k.length-2&&km>k[i+1][0]) i++;
  const u=clamp((km-k[i][0])/(k[i+1][0]-k[i][0]),0,1), w=0.5-0.5*Math.cos(Math.PI*u);
  return k[i][1]+(k[i+1][1]-k[i][1])*w+3*Math.sin(DOSPI*s/1900)+8*Math.sin(DOSPI*s/6300+1);
}
/** Tramo 0 = llano, 1 = subida al puerto, 2 = bajada (las zonas de cada ruta). */
const rutaLlana=L=>({ L, ds:RUTA.ds, z0:700, zonas:[[0,L]], zonaTipo:[0], llana:true });
const zDe=(ruta,s)=>ruta.zf?ruta.zf(s):(ruta.llana?ruta.z0:zRuta(s));

/** Fuerzas de la ecuación de carga en un punto: z altura [m], sn = sinθ, v [m/s], a [m/s²]. */
function fuerzas(v,a,sn,z,par){
  const p=par||VEH, m=p.m0+(p.carga||0), cs=Math.sqrt(1-sn*sn);
  const Fa=0.5*rhoAlt(z)*p.Cd*p.A*v*v, Fr=m*G*p.Crr*cs, Fg=m*G*sn, Fi=m*a;
  return { Fa, Fr, Fg, Fi, F:Fa+Fr+Fg+Fi, m };
}
/** Potencia eléctrica en bornes de la batería para la fuerza F en la rueda a la velocidad v (F<0: frena y regenera). */
function potenciaElec(F,v,p,Paux){
  const perd=(f)=>p.P0+p.kfe*v+p.ki*Math.abs(f)+p.kcu*f*f;
  if(F>=0){ const Pl=perd(F); return { Pel:F*v+Pl+Paux, Pl, Freg:0, Ffric:0 }; }
  let Freg=Math.min(-F,p.Fregmax,p.Pregmax/Math.max(v,1e-9))*suave(v/p.vFade);
  if(Freg*v-perd(Freg)<0) Freg=0;                                      // no se regenera si lo recuperado no paga las pérdidas
  const Pl=perd(Freg);
  return { Pel:-Freg*v+Pl+Paux, Pl, Freg, Ffric:-F-Freg };
}
/** En la batería: la química gasta 1/η al descargar y guarda η al cargar. */
const aQuimica=(Pel,p)=>Pel>0?Pel/p.etaBat:Pel*p.etaBat;

function tramoDeRuta(ruta,s){ const z=ruta.zonas; for(let i=0;i<z.length;i++) if(s<z[i][1]) return ruta.zonaTipo[i]; return ruta.zonaTipo[z.length-1]; }
/** Plan = [v_llano, v_subida, v_bajada] en km/h (o un solo número: velocidad constante). */
function simulaRuta(plan,esc,par,ruta){
  const p=Object.assign({},VEH,par||{}), R=ruta||RUTA, e=esc||{}, Paux=e.Paux!=null?e.Paux:p.Paux, soc0=e.soc0!=null?e.soc0:1;
  p.carga=e.carga||0;
  const pl=Array.isArray(plan)?plan:[plan,plan,plan], ds=R.ds, N=Math.round(R.L/ds);
  const tg=new Float64Array(N+1), v=new Float64Array(N+1);
  for(let i=0;i<=N;i++) tg[i]=pl[tramoDeRuta(R,Math.min(i*ds,R.L-1e-6))]/3.6;
  const vb=new Float64Array(N+1); vb[N]=tg[N];
  for(let i=N-1;i>=0;i--) vb[i]=Math.min(tg[i],Math.sqrt(vb[i+1]*vb[i+1]+2*p.aDec*ds));
  v[0]=e.vIni!=null?e.vIni/3.6:0;
  for(let i=0;i<N;i++) v[i+1]=Math.min(vb[i+1],Math.sqrt(v[i]*v[i]+2*p.aAcc*ds));
  const A=n=>new Float64Array(n), s=A(N+1), z=A(N+1), t=A(N+1), soc=A(N+1), Ech=A(N+1);
  const pel=A(N), Fa=A(N), Fr=A(N), Fg=A(N), Fi=A(N), Fre=A(N), Ffr=A(N), sn=A(N), vm=A(N);
  const cum={ Ea:A(N+1), Er:A(N+1), Eg:A(N+1), Ei:A(N+1), Eloss:A(N+1), Eaux:A(N+1), Efric:A(N+1), Eel:A(N+1), Egen:A(N+1), Ereg:A(N+1), Ebat:A(N+1) };
  for(let i=0;i<=N;i++){ s[i]=i*ds; z[i]=zDe(R,s[i]); }
  soc[0]=soc0;
  for(let i=0;i<N;i++){
    const v1=v[i], v2=v[i+1], a=(v2*v2-v1*v1)/(2*ds), dt=2*ds/(v1+v2), vmed=ds/dt;
    const dz=z[i+1]-z[i], sin_=dz/ds, zm=0.5*(z[i]+z[i+1]);
    const m=p.m0+p.carga, cs=Math.sqrt(1-sin_*sin_);
    const fa=0.5*rhoAlt(zm)*p.Cd*p.A*0.5*(v1*v1+v2*v2), fr=m*G*p.Crr*cs, fg=m*G*sin_, fi=m*a, F=fa+fr+fg+fi;
    const q=potenciaElec(F,vmed,p,Paux), Pc=aQuimica(q.Pel,p);
    t[i+1]=t[i]+dt; Ech[i+1]=Ech[i]+Pc*dt; soc[i+1]=soc0-Ech[i+1]/p.Ebat;
    pel[i]=q.Pel; Fa[i]=fa; Fr[i]=fr; Fg[i]=fg; Fi[i]=fi; Fre[i]=q.Freg; Ffr[i]=q.Ffric; sn[i]=sin_; vm[i]=vmed;
    cum.Ea[i+1]=cum.Ea[i]+fa*ds; cum.Er[i+1]=cum.Er[i]+fr*ds; cum.Eg[i+1]=cum.Eg[i]+fg*ds; cum.Ei[i+1]=cum.Ei[i]+fi*ds;
    cum.Eloss[i+1]=cum.Eloss[i]+q.Pl*dt; cum.Eaux[i+1]=cum.Eaux[i]+Paux*dt; cum.Efric[i+1]=cum.Efric[i]+q.Ffric*ds;
    cum.Eel[i+1]=cum.Eel[i]+q.Pel*dt; cum.Egen[i+1]=cum.Egen[i]+Math.max(0,-q.Pel)*dt; cum.Ereg[i+1]=cum.Ereg[i]+q.Freg*ds; cum.Ebat[i+1]=cum.Ebat[i]+(Pc-q.Pel)*dt;
  }
  let socMin=1e9; for(let i=0;i<=N;i++) socMin=Math.min(socMin,soc[i]);
  return { p,R,N,ds,esc:{Paux,soc0,carga:p.carga},plan:pl,s,z,t,v,soc,Ech,pel,Fa,Fr,Fg,Fi,Fre,Ffr,sn,vm,cum,
    T:t[N],socFin:soc[N],socMin,Echem:Ech[N] };
}
/** Estado en la distancia s: lo que se ve en la escena, en las cifras y en las curvas sale de aquí. */
function muestraRuta(S,s){
  const N=S.N, ds=S.ds, x=clamp(s,0,S.R.L), i=Math.min(N-1,Math.floor(x/ds)), u=(x-S.s[i])/ds;
  const L=(a)=>a[i]+(a[i+1]-a[i])*u;
  const v=L(S.v), z=L(S.z), cs=Math.sqrt(1-S.sn[i]*S.sn[i]), pel=S.pel[i];
  return { s:x,i,u,v,z,t:L(S.t),soc:L(S.soc),sn:S.sn[i],grade:S.sn[i]/cs,pel,Fa:S.Fa[i],Fr:S.Fr[i],Fg:S.Fg[i],Fi:S.Fi[i],Freg:S.Fre[i],Ffric:S.Ffr[i],
    F:S.Fa[i]+S.Fr[i]+S.Fg[i]+S.Fi[i],Pw:(S.Fa[i]+S.Fr[i]+S.Fg[i]+S.Fi[i])*v,
    whkm:v>0.5?aQuimica(pel,S.p)/v/3.6:0, zona:tramoDeRuta(S.R,x) };
}
/** Acumulados hasta s (para el desglose de energía que crece con el viaje). */
function acumulaRuta(S,s){
  const N=S.N, ds=S.ds, x=clamp(s,0,S.R.L), i=Math.min(N-1,Math.floor(x/ds)), u=(x-S.s[i])/ds, o={};
  for(const k in S.cum){ const a=S.cum[k]; o[k]=a[i]+(a[i+1]-a[i])*u; } return o;
}

/* ---------- 1.2 Régimen estacionario: consumo, autonomía y velocidad óptima ---------- */
/** Consumo a velocidad constante v [m/s] en una carretera de pendiente sn a la altura z: Wh/km EN LA BATERÍA. */
function consumoCte(v,par,z,sn,Paux){
  const p=Object.assign({},VEH,par||{}), f=fuerzas(v,0,sn||0,z||0,p), q=potenciaElec(f.F,v,p,Paux!=null?Paux:p.Paux);
  return { v,F:f.F,Fa:f.Fa,Fr:f.Fr,Fg:f.Fg,Pel:q.Pel,Pl:q.Pl,Pc:aQuimica(q.Pel,p),whkm:aQuimica(q.Pel,p)/v/3.6,
    partes:{ aire:f.Fa/3.6/p.etaBat, rod:f.Fr/3.6/p.etaBat, pend:f.Fg/3.6/p.etaBat, tren:q.Pl/v/3.6/p.etaBat, aux:(Paux!=null?Paux:p.Paux)/v/3.6/p.etaBat } };
}
/** Autonomía [km] entre dos SOC a velocidad constante. */
function autonomiaCte(v,par,socIni,socFin,z,Paux){
  const p=Object.assign({},VEH,par||{}), c=consumoCte(v,p,z||0,0,Paux);
  return (socIni-socFin)*p.Ebat/KWH*1000/c.whkm;
}
/** Velocidad [m/s] de mínimo consumo por km (sección áurea; la curva Wh/km(v) es convexa para v > 0). */
function vOptima(par,z,Paux,vlo,vhi){
  let a=vlo||4, b=vhi||45; const r=(Math.sqrt(5)-1)/2, f=v=>consumoCte(v,par,z||0,0,Paux).whkm;
  let c=b-r*(b-a), d=a+r*(b-a), fc=f(c), fd=f(d);
  for(let i=0;i<90;i++){ if(fc<fd){ b=d; d=c; fd=fc; c=b-r*(b-a); fc=f(c); } else { a=c; c=d; fc=fd; d=a+r*(b-a); fd=f(d); } }
  return 0.5*(a+b);
}
/** Versión didáctica del cálculo de la fase 1: η global, sin auxiliares, sobre llano a nivel del mar, entre SOC 100 % y 10 %. */
function autonomiaDidactica(c){
  const F=0.5*AIRE.rho0*c.Cd*c.A*Math.pow(c.v/3.6,2)+c.m*G*c.Crr;
  return 0.90*c.E*1000*c.eta*3.6/F;
}

/* ---------- 1.3 El reto de planeación ----------
   Tres velocidades (llano, subida, bajada) → SOC de llegada ≥ 10 % sin vaciar la batería en el puerto y tiempo ≤ T_lim.
   Se comprueba por barrido que el conjunto factible es pequeño y que NI el plan más rápido NI el más lento lo cumplen. */
const PLAN={ vmin:50, vmax:130, paso:10 };
const SOC_MIN=0.10, SOC_PISO=0.02;
const RUTA_G=Object.assign({},RUTA,{ds:250});                   // rejilla gruesa sólo para sortear el escenario
function evaluaPlan(sc,plan,ruta){
  const S=simulaRuta(plan,{carga:sc.carga,Paux:sc.Paux,soc0:sc.soc0},null,ruta);
  return { S,socFin:S.socFin,socMin:S.socMin,T:S.T,okSoc:S.socFin>=SOC_MIN,okPiso:S.socMin>=SOC_PISO,okT:S.T<=sc.Tlim };
}
function barridoPlan(sc,paso,ruta){
  const out=[], P=paso||PLAN.paso; const vs=[]; for(let v=PLAN.vmin;v<=PLAN.vmax+1e-9;v+=P) vs.push(v);
  for(const a of vs) for(const b of vs) for(const c of vs){ const e=evaluaPlan(sc,[a,b,c],ruta); out.push({plan:[a,b,c],socFin:e.socFin,socMin:e.socMin,T:e.T,ok:e.okSoc&&e.okPiso&&e.okT}); }
  return out;
}
const elige=(rnd,a)=>a[Math.floor(rnd()*a.length)];
function generaReto(rnd){
  for(let it=0;it<30;it++){
    const sc={ carga:elige(rnd,[0,150,300]), Paux:elige(rnd,[500,1200,2200]), soc0:elige(rnd,[0.90,0.95,1.0]) };
    const g=barridoPlan(Object.assign({Tlim:1e9},sc),20,RUTA_G);       // rejilla gruesa para acotar
    // T_lim: de las horas candidatas, la primera que deja entre 4 % y 22 % de los planes (con SOC bueno) cumpliendo ambas
    const bueno=g.filter(x=>x.socFin>=SOC_MIN&&x.socMin>=SOC_PISO); if(bueno.length<4) continue;
    for(let h=2.4;h<=4.6;h+=0.05){

function fusiona(grupo){
  grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map();
  grupo.traverse(o=>{ if(!o.isMesh) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(), m=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);
    g.applyMatrix4(m);
    if(!g.attributes.uv){ g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2)); }
    const k=o.material; if(!por.has(k)) por.set(k,[]); por.get(k).push(g); });
  const out=new THREE.Group();
  for(const [mat,gs] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count;
      pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry();
    G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const me=new THREE.Mesh(G,mat); me.castShadow=true; me.receiveShadow=true; out.add(me);
  }

}
/** Una carrocería «lofteada»: anillos de superelipse que se estrechan hacia los extremos.
 *  secs: [{x, w (semianchura), y0, y1, n (exponente), tum (estrechamiento arriba, 0..1)}]. */
function lofteo(secs,seg=28){
  const pos=[],idx=[],nR=secs.length;
  for(const s of secs){
    const yc=(s.y0+s.y1)/2, hh=Math.max(1e-3,(s.y1-s.y0)/2), ex=2/(s.n||3);
    for(let k=0;k<seg;k++){
      const th=k/seg*DOSPI_, c=Math.cos(th), sn=Math.sin(th);
      const yy=yc+hh*Math.sign(sn)*Math.pow(Math.abs(sn),ex), f=(yy-s.y0)/(2*hh);
      const zz=Math.max(1e-3,s.w)*(1-(s.tum||0)*f*f)*Math.sign(c)*Math.pow(Math.abs(c),ex);
      pos.push(s.x,yy,zz);
    }
  }
  const cI=pos.length/3; pos.push(secs[0].x,(secs[0].y0+secs[0].y1)/2,0); pos.push(secs[nR-1].x,(secs[nR-1].y0+secs[nR-1].y1)/2,0);
  for(let i=0;i<nR-1;i++) for(let k=0;k<seg;k++){
    const a=i*seg+k, b=i*seg+(k+1)%seg, c2=(i+1)*seg+k, d=(i+1)*seg+(k+1)%seg;
    idx.push(a,c2,b, b,c2,d);
  }
  for(let k=0;k<seg;k++){ idx.push(cI,k,(k+1)%seg); idx.push(cI+1,(nR-1)*seg+(k+1)%seg,(nR-1)*seg+k); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx);
  // el sentido de las caras: si el volumen con signo sale negativo, se invierten
  let vol=0; for(let i=0;i<idx.length;i+=3){ const a=idx[i]*3,b=idx[i+1]*3,c3=idx[i+2]*3;
    vol+=pos[a]*(pos[b+1]*pos[c3+2]-pos[b+2]*pos[c3+1])-pos[a+1]*(pos[b]*pos[c3+2]-pos[b+2]*pos[c3])+pos[a+2]*(pos[b]*pos[c3+1]-pos[b+1]*pos[c3]); }
  if(vol<0) for(let i=0;i<idx.length;i+=3){ const t=idx[i+1]; idx[i+1]=idx[i+2]; idx[i+2]=t; }
  g.setIndex(idx); g.computeVertexNormals(); g.computeBoundingSphere();
  return g;

/* ===================== 9. EL ESTADO Y EL RELOJ =====================
   EST son los mandos (lo que pide el alumno). El viaje es una simulación completa de la ruta (SIMULA) y el reloj de todo es la
   DISTANCIA recorrida VJ.s: la escena, las flechas, el flujo de energía, las cifras y las curvas del dock se leen del mismo
   punto s de la misma simulación, así que mover un mando cambia las tres cosas a la vez. El viaje de 240 km se comprime en
   EST.dur segundos (tiempo comprimido ×C, rotulado); el paisaje corre a ¼ de la velocidad real. */
const EST={modo:'marcha',plan:[90,80,100],Paux:800,carga:0,dur:60,pausa:REDUCIDO,autoRunning:false,vista:'coche',rot:false,vTest:80};
const VIS={tilt:0};
const SIM={spin:0,scroll:0,postes:0};
const VJ={S:null,clave:'',p:null,s:0,hold:0,corriendo:false,terminado:false};
const RUTA_LL=rutaLlana(240e3), PREVIA=8000, PASO_V=0.25, EXAGERA=4;
let ST=null;
const kmh=v=>v*3.6;
const clamp01=x=>Math.max(0,Math.min(1,x));
/** Lo que se simula ahora: «En marcha»: los mandos; en el laboratorio guiado, lo que pida el paso. */
function paramsViaje(){
  if(EST.modo==='guia'){ const p=guiaViaje(); if(p) return p; }
  return { plan:EST.plan.slice(), esc:{ Paux:EST.Paux, carga:EST.carga, soc0:1 }, par:null, ruta:RUTA, tag:'marcha' };
}
function simulaViaje(){
  const p=paramsViaje(), clave=JSON.stringify([p.plan,p.esc,p.par,p.ruta===RUTA?'r':'l',p.tag]);
  if(clave===VJ.clave&&VJ.S) return;
  const cambioTag=!VJ.p||VJ.p.tag!==p.tag;
  VJ.clave=clave; VJ.p=p; VJ.S=simulaRuta(p.plan,p.esc,p.par,p.ruta);
  if(cambioTag){ VJ.s=0; VJ.hold=0; VJ.terminado=false; }
}
/** Avanza la posición. El tiempo de la simulación corre ×C más deprisa que el del reloj de pared (C = T_total / duración del viaje). */
function pasaViaje(dt){
  const S=VJ.S; if(!S||EST.pausa) return;
  const C=S.T/Math.max(5,EST.dur), m=muestraRuta(S,VJ.s), v=Math.max(m.v,3), L=S.R.L;
  const previa=EST.modo==='guia'&&GUIA.paso==='decide'&&GUIA.viaje==='listo';
  if(EST.modo==='guia'&&GUIA.paso==='decide'&&GUIA.viaje==='fin') return;
  VJ.s+=v*C*dt;
  if(previa){ if(VJ.s>=PREVIA) VJ.s-=PREVIA; return; }
  if(VJ.s>=L){
    VJ.s=L;
    if(EST.modo==='guia'&&GUIA.paso==='decide'&&GUIA.viaje==='corre'){ finViaje(); return; }
    VJ.hold+=dt; if(VJ.hold>2.4){ VJ.s=0; VJ.hold=0; }
  }
}
/** El estado leído del viaje en la distancia actual. */
function calcula(){
  simulaViaje(); const S=VJ.S, m=muestraRuta(S,VJ.s), ac=acumulaRuta(S,VJ.s), par=Object.assign({},VEH,S.p);
  const cte=m.v>0.5?consumoCte(m.v,S.p,m.z,0,S.esc.Paux):null;
  const aut=cte?Math.max(0,(m.soc-SOC_MIN)*S.p.Ebat/KWH*1000/cte.whkm):0;
  ST={S,m,ac,par,p:VJ.p,cte,aut,C:S.T/Math.max(5,EST.dur)};
  return ST;
}
const SOC_VERDE=0.40;
/** Pone el modelo en la escena: inclinación del bloque, corte del terreno, ruedas, batería, flechas, flujo de energía y fondo. */
function aplicaEscena(dtR){
  const S=calcula(), m=S.m, k=REDUCIDO?1:1-Math.exp(-dtR/0.30);
  // la pendiente se dibuja EXAGERADA ×4 y llega suavizada
  const alvo=Math.atan(EXAGERA*m.grade); VIS.tilt+=(alvo-VIS.tilt)*k; MUNDO.rotation.z=VIS.tilt;
  // el paisaje corre a ¼ de la velocidad real; las ruedas giran con él
  const dx=EST.pausa?0:m.v*PASO_V*dtR;
  SIM.scroll+=dx; SIM.spin+=dx/LRUEDA; SIM.postes+=dx;
  T_ASF.offset.x=(SIM.scroll/6)%1; T_EST.offset.x=(SIM.scroll/6)%1;
  colocaPostes(SIM.postes);
  for(const sp of ASAS.spins) sp.rotation.z=-SIM.spin;
  for(const c of CRESTAS){ c.mat.map.offset.x=(c.mat.map.offset.x+dx*c.par/(c.w/2))%1; c.mesh.position.y=c.y0+c.h/2-1.2-(m.z-1500)*c.k; }
  // la batería y el flujo de energía
  pintaModulos(m.soc);
  const P=m.pel, dens=m.v>0.5?clamp01(Math.abs(P)/70e3)*0.92+0.08:0.0, reg=P<0;
  pintaFlujo(dens,reg?-1:1,EST.pausa?0:dtR,reg?'#34d399':'#ffb703');
  // las fuerzas de la ecuación de carga (1 m = 500 N): aire, rodadura, pendiente y la tracción que las equilibra
  FLECHAS.fa.set(Math.min(3.3,m.Fa*KF),-1); FLECHAS.fr.set(Math.min(3.3,m.Fr*KF),-1); FLECHAS.fg.set(Math.min(3.3,Math.abs(m.Fg)*KF),m.Fg>=0?-1:1);
  const Ft=m.F; FLECHAS.ft.mat.color.set(Ft>=0?'#FFB703':'#34D399'); FLECHAS.ft.set(Math.min(3.3,Math.abs(Ft)*KF),Ft>=0?1:-1);
  // el disco de freno se pone al rojo cuando frena la fricción (lo que el motor no puede regenerar)
  M.discoCal.emissiveIntensity=2.4*clamp01(m.Ffric*m.v/40e3);
}

/** Cada vista: dirección desde el objetivo, objetivo, campo de visión y la caja que debe verse entera. */
const VISTAS={
  coche:  {dir:V3(0.42,0.17,1.0), t:V3(0,0.50,0),fov:30,c:V3(0,0.48,0),m:V3(3.0,2.05,1.9)},

  tren:   {dir:V3(-0.75,0.34,1.0),t:V3(-1.2,0.45,0),fov:30,c:V3(-1.2,0.45,0),m:V3(0.85,0.55,0.8)},
  ruta:   {dir:V3(0.30,0.08,1.0), t:V3(0,2.6,0),fov:38,c:V3(0,2.6,-6),m:V3(7.5,3.8,8)},
};
const _cam=new THREE.PerspectiveCamera(34,1,0.1,400);
/** Distancia a la que la caja de la vista llena el 64 % del alto (o el 90 % del ancho) del hueco libre. */
function encuadre(v){
  const V=VISTAS[v]||VISTAS.coche, H=huecoLibre(), hh=Math.max(120,H.y1-H.y0), ww=Math.max(160,H.x1-H.x0), dir=V.dir.clone().normalize();
  _cam.fov=V.fov; _cam.aspect=innerWidth/innerHeight; _cam.updateProjectionMatrix();
  const esq=[]; for(const sx of [-1,1]) for(const sy of [-1,1]) for(const sz of [-1,1]) esq.push(V3(V.c.x+sx*V.m.x,V.c.y+sy*V.m.y,V.c.z+sz*V.m.z));
  let lo=1.2, hi=90;
  for(let it=0;it<24;it++){
    const d=(lo+hi)/2; _cam.position.copy(V.t).addScaledVector(dir,d); _cam.lookAt(V.t); _cam.updateMatrixWorld(true); _cam.matrixWorldInverse.copy(_cam.matrixWorld).invert();
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; for(const e of esq){ const p=e.clone().project(_cam); x0=Math.min(x0,p.x); x1=Math.max(x1,p.x); y0=Math.min(y0,p.y); y1=Math.max(y1,p.y); }
    const pw=(x1-x0)/2*innerWidth, ph=(y1-y0)/2*innerHeight, f=Math.max(ph/hh/0.66,pw/ww/0.94);
    if(f>1) lo=d; else hi=d;
  }
  const d=(lo+hi)/2; return {pos:V.t.clone().addScaledVector(dir,d),target:V.t.clone(),fov:V.fov};
}
const CAMT={on:false,u:0,dur:1,o0:V3(),o1:V3(),t0:V3(),t1:V3(),f0:34,f1:34};
function ponVista(v,dur){

  Object.assign(CAMT,{on:true,u:0,dur:d,o0:camera.position.clone(),o1:e.pos,t0:controls.target.clone(),t1:e.target,f0:camera.fov,f1:e.fov});

function pasaCam(dt){
  if(CAMT.on){

    camera.position.lerpVectors(CAMT.o0,CAMT.o1,e); controls.target.lerpVectors(CAMT.t0,CAMT.t1,e);
    camera.fov=CAMT.f0+(CAMT.f1-CAMT.f0)*e; camera.updateProjectionMatrix();
    if(CAMT.u>=1) CAMT.on=false;

}

let CURV=null, CURVk='';
function curvas(){
  const S=ST, p=S.S.p, Paux=S.S.esc.Paux, zb=Math.round(S.m.z/50)*50, k=[p.Cd,p.A,p.Crr,p.m0,p.carga,Paux,zb].join('|');

  const kk=clamp(S.m.v*3.6,20,140), cc=S.cte; if(cc){ punto(x,X(kk),Y(cc.whkm),3.8,C_TOT); }
  const wi=S.m.whkm, py=Y(wi); x.strokeStyle=wi>ym?'#ff9a9a':(wi<0?C_REG:'#fff'); x.lineWidth=1.6; x.beginPath(); x.arc(X(kk),py,5.4,0,DOSPI); x.stroke();

/* ===================== 16. DISPOSICIÓN: ANCHO, ESTRECHO, MÓVIL =====================
   Si no caben guía, escena y dock lado a lado (el marco de la plataforma, una tableta), la escena va arriba
   y guía e instrumentos comparten una hoja con pestañas abajo. */
function disposicion(){
  const W=innerWidth, b=document.body;
  const estrecho=W<1080, movil=W<640;
  b.classList.toggle('estrecho',estrecho); b.classList.toggle('movil',movil); b.classList.toggle('ancho',estrecho&&!movil);
  if(estrecho){ if(!b.classList.contains('t-hud')&&!b.classList.contains('t-panel')) b.classList.add('t-hud'); ajustaHoja(); }
  el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('on',b.classList.contains('t-'+t.dataset.tab)));
}
function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.47:0.43),240,450));
  let hh=base; const hud=el('hud');
  if(movil&&b.classList.contains('t-panel')) hh=Math.round(clamp(H*0.6,240,560));
  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;
    hh=Math.round(clamp(pide,240,Math.max(base,H*(movil?0.62:0.56)))); }
  const ant=parseFloat(b.style.getPropertyValue('--hojaH'))||0;
  if(Math.abs(ant-hh)>1){ b.style.setProperty('--hojaH',hh+'px'); colocaBarras(); ponVista(EST.vista,0.001); centraEnHueco(); }
}
el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.onclick=()=>{ const b=document.body; b.classList.remove('t-hud','t-panel'); b.classList.add('t-'+t.dataset.tab); disposicion(); ponVista(EST.vista,0.001); centraEnHueco(); });

/* ===================== 17. EL LABORATORIO GUIADO =====================
   Tres fases: 1 · Calcula (la autonomía a velocidad constante por la ecuación de carga), 2 · Planea (tres velocidades —llano,
   subida y bajada— para llegar con SOC ≥ 10 % sin pasarse del tiempo: ni el plan más lento ni el más rápido lo cumplen) y
   3 · Diagnostica (¿neumáticos blandos, baca con carga o un auxiliar atascado?, sólo con la huella en la curva Wh/km), y cierra
   con un quiz de tres preguntas. El resultado del plan sólo aparece al terminar el viaje; cuatro intentos fallidos cambian el escenario. */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETO={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'predice',iniciado:false,dxOk:false,r1:null,r2:null,preparando:false,dx:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0,orden:null,pts:[],vTest:80,viaje:'listo',idN:0};

/* ---------- Fase 1 · Calcula ---------- */
const E1=[40,50,60,75,90], V1=[70,90,110,130], CD1=[0.23,0.27,0.31], A1=[2.2,2.4,2.6], M1=[1500,1800,2100], CR1=[0.008,0.010,0.012], ETA1=[0.88,0.90,0.92];
function sorteaCaso1(){
  let c; do{ c={E:pickOne(E1),v:pickOne(V1),Cd:pickOne(CD1),A:pickOne(A1),m:pickOne(M1),Crr:pickOne(CR1),eta:pickOne(ETA1),id:++GUIA.idN}; c.ans=autonomiaDidactica(c); c.F=0.5*AIRE.rho0*c.Cd*c.A*Math.pow(c.v/3.6,2)+c.m*G*c.Crr; }
  while(c.ans<140||c.ans>520||(GUIA.r1&&GUIA.r1.E===c.E&&GUIA.r1.v===c.v&&GUIA.r1.Cd===c.Cd&&GUIA.r1.m===c.m));
  GUIA.r1=c;
}
function checkPredice(){
  const raw=String((el('ansV')||{}).value||'').trim().replace(/\s| /g,'').replace(',','.'), v=parseFloat(raw), r=GUIA.r1, ok=r.ans;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe la autonomía en km (con coma o punto decimal).'); return; }
  RETO.intentos++;
  if(Math.abs(v-ok)<=Math.max(5,0.03*ok)){
    RETO.fallos1=0; sonido.bien();
    feedback('good','¡Correcto! ✓',`A ${fN(r.v)} km/h la fuerza en la rueda es F = ½ρC<sub>d</sub>Av² + m·g·C<sub>rr</sub> = ${fN(r.F,0)} N, o sea ${fN(r.F/3.6,1)} Wh por km en la rueda. Con η = ${fN(r.eta,2)} la batería da 0,9 × ${fN(r.E)} kWh × η, así que <b>autonomía = 0,9·E·η / (F/3,6) = ${fN(ok,0)} km</b>. Duplicar la velocidad no duplica el consumo: el aire cobra v².`,true);
    paso('decide'); prepararDecide();
  } else {
    RETO.fallos1++; sonido.mal();
    const d=v>ok?'alto':'bajo', alt=Math.abs(v-ok/0.9)<Math.max(5,0.03*ok/0.9);
    if(RETO.fallos1>=3){ RETO.fallos1=0; RETO.resiembras++; sorteaCaso1(); feedback('bad','Tres intentos fallidos','Cambia el coche: suma la fuerza del aire (½ρC_dAv²) y la de rodadura (m·g·C_rr) y pásala a energía por kilómetro.'); pintaHUD(); pintaDockFijo(); }
    else {
      feedback('bad','Revisa el cálculo',`Tu resultado (${fN(v,v%1?1:0)}) está ${d}.`+(alt?' ¿Usaste el 100 % de la batería? Aquí sólo se gasta del 100 % al 10 %.':' Recuerda: F en newtons, v en m/s dentro del v², y energía por km = F·1 000 m / 3 600 s·W.')+` (intentos fallidos: ${RETO.fallos1}/3)`);
      const t=el('d_try'); if(t) t.textContent=RETO.fallos1;
    }

}

/* ---------- Fase 2 · Planea ---------- */
function prepararDecide(){
  GUIA.preparando=true; GUIA.r2=null; GUIA.viaje='listo'; pintaHUD();
  setTimeout(()=>{
    let sc=null; for(let i=0;i<6&&!sc;i++) sc=generaReto(Math.random);
    if(!sc){ let x=7; sc=generaReto(()=>(x=x*48271%2147483647)/2147483647); }
    GUIA.r2={sc,plan:[80,80,80],planProbado:null,intentos:0,res:null,id:++GUIA.idN};

}

}
function finViaje(){

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const RANGO_AV={ rod:[1.7,2.2], baca:[1.35,1.6], aux:[1.8,2.6] };
function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.k; let k; do{ k=pickOne(['rod','baca','aux']); }while(k===p);
  const [a,b]=RANGO_AV[k], mag=Math.round((a+Math.random()*(b-a))*20)/20;
  GUIA.dx={k,mag,id:++GUIA.idN}; GUIA.dxOk=false; GUIA.vTest=80; GUIA.pts=[]; GUIA.orden=barajar(['rod','baca','aux']);

}
function registraPunto(){
  if(!GUIA.dx) return; const av=parAveria(GUIA.dx.k,GUIA.dx.mag), v=GUIA.vTest, c=consumoCte(v/3.6,av.par,RUTA_LL.z0,0,av.Paux);

    GUIA.dxOk=true; RETO.fallos3=0; sonido.bien();

    if(RETO.fallos3>=3){ RETO.fallos3=0; RETO.resiembras++; feedback('bad','Tres intentos fallidos','Es otro coche: mide su consumo a velocidades muy distintas y mira cómo se separa de la curva del coche sano.',true); iniciaDiag(); }
    else { feedback('bad','No es esa',noEs(k)+` (intentos fallidos: ${RETO.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(d){
  const av=parAveria(d.k,d.mag);
  if(d.k==='rod') return `Neumáticos blandos: el exceso es casi el mismo a cualquier velocidad, porque la rodadura m·g·C_rr no depende de v. Aquí C_rr valía ${fN(VEH.Crr*d.mag,4)} en vez de ${fN(VEH.Crr,3)}: inflar los neumáticos a su presión devuelve la autonomía.`;
  if(d.k==='baca') return `Baca con carga: el exceso crece con la velocidad al cuadrado, porque lo que cambia es C_d·A (×${fN(d.mag,2)}). A 50 km/h casi no se nota; a 120 km/h pesa. Quitar la baca es gratis.`;
  return `Auxiliar atascado: el exceso es mayor a baja velocidad, porque son ${fN(av.Paux/1000,1)} kW constantes en lugar de ${fN(VEH.Paux/1000,1)} kW y cada kilómetro tarda más cuanto más despacio vas. Se apaga el auxiliar y listo.`;

function noEs(k){

const QUIZ=[
  {q:'Bajas de 120 a 90 km/h por llano. ¿En qué fracción queda la POTENCIA que gasta el aire?',ok:()=>`En el ${fN(Math.pow(0.75,3)*100,0)} % (crece como v³)`,mal:()=>[`En el ${fN(75,0)} % (como v)`,`En el ${fN(Math.pow(0.75,2)*100,0)} % (como v²)`,`En el ${fN(Math.pow(0.75,4)*100,0)} % (como v⁴)`]},
  {q:'Bajando el puerto el coche no recupera toda la energía que gastó al subir. ¿Por qué?',ok:()=>'Porque el aire, la rodadura y el tren se llevan parte, y la regeneración tiene un tope de potencia',mal:()=>['Porque la batería no se carga con el coche en movimiento','Porque la gravedad pesa menos al bajar que al subir','Porque el freno regenerativo sólo funciona en llano']},
  {q:'A velocidades muy bajas el consumo por kilómetro vuelve a SUBIR. ¿Por qué?',ok:()=>'Porque auxiliares y pérdidas fijas gastan potencia constante y cada kilómetro tarda más',mal:()=>['Porque el aire frena más cuanto más despacio vas','Porque el motor no puede girar despacio','Porque la rodadura crece al bajar la velocidad']},
];
function iniciaQuiz(){ GUIA.quizN=0; cargaPregunta(); }
function cargaPregunta(){ const Q=QUIZ[GUIA.quizN], ok=Q.ok(), opts=barajar([ok,...Q.mal()]); GUIA.quiz={q:Q.q,opts,ok:opts.indexOf(ok)}; GUIA.quizResp=-1; GUIA.quizCorrecta=GUIA.quiz.ok; pintaHUD(); }

/* ---------- el enrutador de acciones ---------- */
function paso(p){ GUIA.paso=p; GUIA.phase=({predice:0,decide:1,diag:2,quiz:2,completo:2})[p]; VJ.clave=''; if(EST.modo==='guia') pintaHUD(); }
function handleAction(act,btn){
  switch(act){
    case 'check-v': checkPredice(); break;
    case 'hint-v':
      if(RETO.pistas===0){ RETO.pistas=1; feedback('good','Pista 1 de 2','A velocidad constante en llano la fuerza en la rueda es F = ½·ρ·C<sub>d</sub>·A·v² + m·g·C<sub>rr</sub> (v en m/s). Cada newton, durante un kilómetro, son F/3,6 Wh.'); }
      else if(RETO.pistas===1){ RETO.pistas=2; feedback('good','Pista 2 de 2','La energía útil es el 90 % de la batería (del 100 % al 10 %). Dividida entre la energía por kilómetro que sale de la rueda, y multiplicada por η, da los km.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break;
    case 'probar': pruebaViaje(); break;
    case 'reintenta': { const r=GUIA.r2; if(r&&GUIA.viaje==='fin'){ GUIA.viaje='listo'; VJ.clave=''; VJ.s=0; r.res=null; el('feedback').classList.remove('show'); pintaHUD(); } break; }

    case 'dx-rod': diagnostica('rod'); break; case 'dx-baca': diagnostica('baca'); break; case 'dx-aux': diagnostica('aux'); break;
    case 'quiz-0': respondeQuiz(0); break; case 'quiz-1': respondeQuiz(1); break; case 'quiz-2': respondeQuiz(2); break; case 'quiz-3': respondeQuiz(3); break;
    case 'quiz-sig': siguientePregunta(); break;

/* ---------- lo que la guía enseña en cada paso ---------- */
function contenidoGuia(){
  const tri=(n,v,m)=>`<span class="tries">intentos fallidos: <b id="${n}">${v}</b>/${m}</span>`;
  switch(GUIA.paso){
    case 'predice': { const r=GUIA.r1; return {no:'Fase 1 · Reto 1',head:'Tu cálculo',title:'¿Hasta dónde llega?',
      teach:`Un VE con <b>${fN(r.E)} kWh</b> útiles, η = ${fN(r.eta,2)} hasta la rueda, <b>${fN(r.m)} kg</b>, C<sub>d</sub> = ${fN(r.Cd,2)}, A = ${fN(r.A,1)} m², C<sub>rr</sub> = ${fN(r.Crr,3)}, a <b>${fN(r.v)} km/h</b> por llano (ρ = 1,225 kg/m³, sin auxiliares). Gasta del 100 % al 10 %.<div class="task">¿Qué autonomía tiene, en km? ${tri('d_try',RETO.fallos1,3)}</div>`,
      acts:`<div class="calcrow"><input id="ansV" type="text" inputmode="decimal" autocomplete="off" placeholder="¿? km" aria-label="Autonomía en kilómetros"><button class="b primary" data-act="check-v">✓ Comprobar</button></div><button class="pista" id="btnHint">¿Necesitas una pista? (máx. 2)</button>`}; }

      if(GUIA.preparando||!r) return {no:'Fase 2 · Reto 2',head:'Tu plan',title:'Preparando la ruta…',teach:'Calculando el escenario.',acts:''};
      const sc=r.sc, e=r.res, chip=(ok,t,v)=>`<div class="chip ${e?(ok?'ok':'no'):''}"><span>${t}</span><b>${v}</b></div>`, corre=GUIA.viaje==='corre', fin=GUIA.viaje==='fin', bloquea=corre||fin;
      const sl=(id,idv,t,val)=>`<div class="cg"><div class="cl"><div>${t}</div><b id="${idv}">${fN(val)} km/h</b></div><input type="range" id="${id}" min="${PLAN.vmin}" max="${PLAN.vmax}" step="${PLAN.paso/2}" value="${val}" ${bloquea?'disabled':''} aria-label="${t}"></div>`;
      const pl=(fin||corre)?r.planProbado:r.plan;
      return {no:'Fase 2 · Reto 2',head:'Tu plan',title:'Llega con carga y a tiempo',
      teach:`Sales con <b>${fN(sc.soc0*100,0)} %</b>, ${fN(sc.carga)} kg de equipaje y auxiliares de ${fN(sc.Paux/1000,1)} kW. Llega con <b>≥ 10 %</b> en menos de <b>${hm(sc.Tlim)}</b>. ${tri('d_try2',RETO.fallos2,4)}<div class="chips">
        ${chip(e&&e.okSoc&&e.okPiso,'Carga al llegar','≥ 10 %'+(e?' · '+fN(e.socFin*100,1)+' %':''))}
        ${chip(e&&e.okT,'Tiempo de viaje','≤ '+hm(sc.Tlim)+(e?' · '+hm(e.T):''))}</div>`,
      acts:sl('r2L','v2L','Llano',pl[0])+sl('r2S','v2S','Subida al puerto',pl[1])+sl('r2B','v2B','Bajada',pl[2])
        +(fin?(e&&e.okSoc&&e.okPiso&&e.okT?'<button class="b primary" data-act="ir-diag">Siguiente: diagnóstico →</button>':'<button class="b primary" data-act="reintenta">↺ Cambiar el plan</button>'):`<button class="b primary" data-act="probar" ${corre?'disabled':''}>${corre?'Viajando…':'▶ Probar el viaje'}</button>`)}; }
    case 'diag': { const ord=GUIA.orden||['rod','baca','aux'], N={rod:'Neumáticos blandos',baca:'Baca con carga',aux:'Auxiliar atascado'};
      return {no:'Fase 3 · Diagnóstico',head:'¿Qué le pasa?',title:'Gasta de más… ¿por qué?',
      teach:`Este coche consume más que el sano (línea de trazos). Mídelo a velocidades muy distintas y mira <b>cómo</b> se separa.<div class="task">¿Cuál es la causa? ${tri('d_try3',RETO.fallos3,3)}</div>`,
      acts:`<div class="cg"><div class="cl"><div>Velocidad de prueba</div><b id="vdV">${fN(GUIA.vTest)} km/h</b></div><input type="range" id="rdV" min="40" max="130" step="5" value="${GUIA.vTest}" aria-label="Velocidad de prueba en kilómetros por hora"></div>`
        +ord.map(k=>`<button class="b" data-act="dx-${k}">${N[k]}</button>`).join('')}; }
    case 'quiz': { const Q=GUIA.quiz; if(!Q) return {no:'',head:'',title:'',teach:'',acts:''}; const ya=GUIA.quizResp>=0;
      return {no:'Cierre · Pregunta '+(GUIA.quizN+1)+' de '+QUIZ.length,head:'Quiz',title:Q.q,teach:'',
      acts:Q.opts.map((o,i)=>`<button class="b ${ya?(i===Q.ok?'good':(i===GUIA.quizResp?'bad':'')):''}" data-act="quiz-${i}" ${ya?'disabled':''}>${o}</button>`).join('')+(ya&&GUIA.quizN<QUIZ.length-1?'<button class="b primary" data-act="quiz-sig">Siguiente →</button>':'')}; }
    case 'completo': return {no:'Laboratorio completado',head:'✓',title:'Calculaste, planeaste y diagnosticaste',
      teach:`Acertaste ${RETO.quizAcierto} de ${QUIZ.length} en el quiz. Vuelve a <b>En marcha</b> y compara: bajar de velocidad en la subida y subirla en la bajada cambia el tiempo mucho más de lo que cambia la energía.`,
      acts:`<button class="b primary" data-act="restart">↺ Reiniciar laboratorio</button>`};
  }
  return {no:'',head:'',title:'',teach:'',acts:''};
}
function htmlGuia(){
  const ps=['Calcula','Planea','Diagnostica'], C=contenidoGuia();
  const ok=i=>i<GUIA.phase||(i===2&&RETO.hecho);
  return `<div class="pasos">${ps.map((t,i)=>`<span class="ps ${ok(i)?'ok':(i===GUIA.phase?'on':'')}"><i>${ok(i)?'✓':i+1}</i>${t}</span>`).join('')}</div>
  <div class="retoBox"><div class="rt"><span>${C.no}</span><span>${C.head}</span></div><h3>${C.title}</h3><div class="rq">${C.teach}</div><div class="opt" id="actOpt">${C.acts}</div></div>`;
}
/** Lo que se simula en cada paso del laboratorio guiado (null: lo que digan los mandos). */
function guiaViaje(){
  const p=GUIA.paso;
  if(p==='predice'&&GUIA.r1){ const r=GUIA.r1; return { plan:r.v, esc:{ Paux:0, soc0:1, vIni:r.v }, par:{ Cd:r.Cd, A:r.A, Crr:r.Crr, m0:r.m }, ruta:RUTA_LL, tag:'p'+r.id }; }
  if(p==='decide'){ const r=GUIA.r2;
    if(!r) return { plan:[80,80,80], esc:{ Paux:800, soc0:1 }, par:null, ruta:RUTA, tag:'d0' };
    const pl=(GUIA.viaje==='listo'?r.plan:r.planProbado)||r.plan;
    return { plan:pl.slice(), esc:{ Paux:r.sc.Paux, carga:r.sc.carga, soc0:r.sc.soc0 }, par:null, ruta:RUTA, tag:'d'+r.id }; }
  if((p==='diag'||p==='quiz'||p==='completo')&&GUIA.dx){ const av=parAveria(GUIA.dx.k,GUIA.dx.mag);
    return { plan:GUIA.vTest, esc:{ Paux:av.Paux, soc0:1, vIni:GUIA.vTest }, par:av.par, ruta:RUTA_LL, tag:'x'+GUIA.dx.id }; }
  return null;
}
/* ---------- los modos ---------- */
function setMode(m,forzar){
  if(!forzar&&(m===EST.modo||EST.autoRunning)) return;
  if(m==='guia'){
    EST.modo='guia'; if(!GUIA.iniciado){ GUIA.iniciado=true; sorteaCaso1(); paso('predice'); }
  } else EST.modo='marcha';
  document.body.classList.toggle('m-marcha',EST.modo==='marcha'); document.body.classList.toggle('m-guia',EST.modo==='guia');
  VJ.clave=''; pintaHUD(); pintaDockFijo(); pintaBarras(); ponVista(EST.vista,0.6);
}
let fbTimer=null;
function feedback(type,title,text,sticky=false){ const f=el('feedback'); f.className='feedback show '+type; el('fbIcon').textContent=type==='good'?'✓':'✕'; el('fbTitle').textContent=title; el('fbText').innerHTML=text; clearTimeout(fbTimer); if(!sticky) fbTimer=setTimeout(()=>f.classList.remove('show'),7000); }
el('fbX').onclick=()=>el('feedback').classList.remove('show');
document.addEventListener('input',e=>{ const t=e.target; if(!t) return;
  const pl=(i,idv,val)=>{ if(GUIA.r2&&GUIA.viaje==='listo'){ GUIA.r2.plan[i]=val; el(idv).textContent=fN(val)+' km/h'; } };
  if(t.id==='r2L') pl(0,'v2L',+t.value); if(t.id==='r2S') pl(1,'v2S',+t.value); if(t.id==='r2B') pl(2,'v2B',+t.value);
  if(t.id==='rdV'){ GUIA.vTest=+t.value; el('vdV').textContent=fN(GUIA.vTest)+' km/h'; }
});
document.addEventListener('change',e=>{ const t=e.target; if(t&&t.id==='rdV'){ registraPunto(); } });

/* ---------- el recorrido guiado de «En marcha» ---------- */
const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function runAuto(){
  if(EST.autoRunning||EST.modo!=='marcha') return; EST.autoRunning=true; sonido.init();
  const hud=el('hud'), prev={plan:EST.plan.slice(),Paux:EST.Paux,vista:EST.vista,dur:EST.dur,pausa:EST.pausa};
  const fija=o=>{ Object.assign(EST,o); pintaHUD(); hud.style.pointerEvents='none'; const b=el('btnAuto'); if(b){ b.disabled=true; b.textContent='Recorrido en curso…'; } pintaDockFijo(); pintaBarras(); };
  const en=km=>{ VJ.s=km*1000; VJ.hold=0; };
  try{
    fija({plan:[100,90,100],Paux:800,dur:120,pausa:false}); simulaViaje(); en(8); ponVista('coche');
    showToast('Paso 1 · En el llano mandan el <b>aire</b> (azul) y la <b>rodadura</b> (naranja). La tracción (ámbar) las iguala; las esferas llevan la energía al motor.',8200);
    await espera(8600);
    en(62); showToast('Paso 2 · En la subida entra la <b>pendiente</b> (violeta) y la tracción se dispara: la potencia y los Wh/km del dock suben, y los módulos de la batería se apagan.',8200);
    await espera(8600);
    ponVista('bateria'); showToast('Paso 3 · Cada módulo apagado es carga gastada. El borde del módulo encendido marca el SOC.',6200);
    await espera(6600);
    en(128); ponVista('coche'); showToast('Paso 4 · En la bajada la pendiente empuja: el motor <b>regenera</b> (esferas verdes) hasta su tope y el freno de fricción disipa el resto.',8200);
    await espera(8600);
    ponVista('ruta'); showToast('Paso 5 · Vista de la ruta: las crestas suben y bajan con la altura. En el dock, la curva de Wh/km frente a v tiene un <b>mínimo</b>.',7600);
    await espera(8000);
  } finally {
    Object.assign(EST,{plan:prev.plan,Paux:prev.Paux,dur:prev.dur,pausa:prev.pausa}); EST.autoRunning=false; hud.style.pointerEvents='';
    pintaHUD(); pintaDockFijo(); ponVista(prev.vista); pintaBarras();
  }
}


/* ===================== 19. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.min(devicePixelRatio,alta?2:1.5));
  const ms=alta?2048:1024; if(LUZ.sol.shadow.mapSize.x!==ms){ LUZ.sol.shadow.mapSize.set(ms,ms); if(LUZ.sol.shadow.map){ LUZ.sol.shadow.map.dispose(); LUZ.sol.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); ponVista(EST.vista,0.001); centraEnHueco();
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 20. EL LAZO: UN SOLO RELOJ =====================
   La posición del viaje VJ.s avanza con el tiempo de pared (comprimido ×C) y con ESA posición se leen la escena, las flechas,
   el flujo de energía, las cifras y las curvas del dock: todo sale del mismo punto de la misma simulación. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0, CONGELA=false;          // CONGELA: sólo para pruebas (capturas en equipos sin GPU): no dibuja hasta que se pida una imagen
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  simulaViaje(); pasaViaje(dt);
  aplicaEscena(dt);
  pasaCam(dt);
  sonido.actualiza(EST.pausa||!ST?0:ST.m.v/38,ST?clamp01(Math.abs(ST.m.pel)/70e3):0);
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.05&&seVe(el('panel'))){ tLienzo=t; pintaPerfil(); pintaCons(); pintaDesglose(); pintaPotencia(); }
  controls.update();
  if(!CONGELA){ renderer.info.reset(); composer.render(); colocaRotulos(); }
}

/* ===================== 21. ARRANQUE =====================
   Abre rodando: el crossover va a 90 km/h por el llano de salida, con la batería llena, el flujo de energía en marcha y la
   cámara en el coche. Sin tocar nada ya se ve qué gasta cada kilómetro. */
disposicion();
aplicaCalidad();
pintaHUD();
simulaViaje(); VJ.s=3000; calcula();
{ const a=Math.atan(EXAGERA*ST.m.grade); VIS.tilt=a; }
aplicaEscena(0);
pintaBarras();
ponVista('coche',0.001);
centraEnHueco();
pintaDockFijo();
cuadro();
setTimeout(()=>showToast('Un crossover eléctrico por una ruta de montaña. Las esferas son energía; las flechas, las fuerzas de la ecuación de carga.',5600),700);

window.__labDebug={
  get mode(){ return EST.modo==='marcha'?'marcha':GUIA.paso; },
  get solved(){ return RETO.hecho; },
  get intentos(){ return RETO.intentos; },
  quizAnswer:()=>GUIA.quizResp,

    r1:GUIA.r1?{E:GUIA.r1.E,v:GUIA.r1.v,m:GUIA.r1.m}:null,r2:GUIA.r2?{plan:GUIA.r2.plan,sc:GUIA.r2.sc}:null,dx:GUIA.dx?GUIA.dx.k:null,quizN:GUIA.quizN,quizAcierto:RETO.quizAcierto,resuelto:RETO.hecho}; },

  modelo(){ const S=ST; if(!S) return {activo:false}; const m=S.m;
    return {s:m.s,v:m.v,z:m.z,grade:m.grade,soc:m.soc,pel:m.pel,whkm:m.whkm,Fa:m.Fa,Fr:m.Fr,Fg:m.Fg,Fi:m.Fi,F:m.F,Freg:m.Freg,Ffric:m.Ffric,t:m.t,zona:m.zona,T:S.S.T,socFin:S.S.socFin,aut:S.aut,vOpt:S.cte?vOptima(S.S.p,m.z,S.S.esc.Paux)*3.6:null}; },
  escena(){ return {vista:EST.vista,calidad:CAL.nivel,pixel:renderer.getPixelRatio(),rotulos:ROT.on,pausa:EST.pausa,dur:EST.dur,modo:EST.modo,
    tri:renderer.info.render.triangles,llamadas:renderer.info.render.calls,fps:FPS.v,inclinacionGrados:+(VIS.tilt/RAD).toFixed(2),
    flechas:{fa:FLECHAS.fa.gr.visible,fr:FLECHAS.fr.gr.visible,fg:FLECHAS.fg.gr.visible,ft:FLECHAS.ft.gr.visible}}; },
  cam(){ const r=v=>[+v.x.toFixed(3),+v.y.toFixed(3),+v.z.toFixed(3)]; return {pos:r(camera.position),target:r(controls.target),hueco:huecoLibre(),fps:FPS.v}; },
  /** Fracción del alto del lienzo (y del hueco libre) que ocupa el objeto principal: coche + bloque de carretera + flechas. */
  ocupacion(){ MUNDO.updateMatrixWorld(true); const b=new THREE.Box3().setFromObject(COCHE), b2=new THREE.Box3().setFromObject(DIO); b.union(b2);
    let y0=1e9,y1=-1e9,x0=1e9,x1=-1e9; for(const sx of [b.min.x,b.max.x]) for(const sy of [b.min.y,b.max.y]) for(const sz of [b.min.z,b.max.z]){ const p=V3(sx,sy,sz).project(camera); y0=Math.min(y0,p.y); y1=Math.max(y1,p.y); x0=Math.min(x0,p.x); x1=Math.max(x1,p.x); }
    const H=huecoLibre(); return {altoLienzo:+((y1-y0)/2).toFixed(3),altoHueco:+(((y1-y0)/2*innerHeight)/(H.y1-H.y0)).toFixed(3),anchoHueco:+(((x1-x0)/2*innerWidth)/(H.x1-H.x0)).toFixed(3)}; },
};
window.__test=Object.assign(window.__test||{},{

});
