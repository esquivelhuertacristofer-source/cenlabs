  .hud h2{font-size:19px;line-height:1.15;margin-bottom:9px}
  .hud p{font-size:13px;line-height:1.55;color:var(--dim);margin-bottom:10px}

  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.26, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;
    }
    if(hook)hook(dt,t); controls.update();
    if(bokeh) bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);
    composer.render(); }
  function start(){ if(!raf)loop(); }
  function stop(){ cancelAnimationFrame(raf); raf=null; window.removeEventListener('resize',resize); }

  return { THREE, renderer, scene, camera, controls, composer, bloom,
    setAnimate:fn=>hook=fn, start, stop, resize, clock,
    flyTo:(v)=>{ controls.target.copy(v); }, moveTo, setCinematicIdle };
}

function roundedBox(w,h,d,mat,rf=0.08){
  const r=Math.min(w,h,d)*rf;

}
function pickerFor(scene,camera,dom,onHit){
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(); let down=null;
  dom.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
  dom.addEventListener('pointerup',e=>{
    if(!down)return; const moved=Math.abs(e.clientX-down[0])+Math.abs(e.clientY-down[1])>6; down=null;
    if(moved)return;
    const r=dom.getBoundingClientRect();
    mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(mouse,camera);
    const hits=ray.intersectObjects(scene.children,true);
    onHit(hits[0]||null);
  });
}
function labelSprite(text,color='#ffd166'){
  const w = Math.max(150, Math.min(520, text.length*26+60));
  const cvE=document.createElement('canvas');cvE.width=w;cvE.height=96;
  const c=cvE.getContext('2d');c.fillStyle='rgba(8,11,16,.95)';
  const rr=(x,y,ww,hh,r)=>{c.beginPath();c.moveTo(x+r,y);c.arcTo(x+ww,y,x+ww,y+hh,r);c.arcTo(x+ww,y+hh,x,y+hh,r);c.arcTo(x,y+hh,x,y,r);c.arcTo(x,y,x+ww,y,r);c.closePath();};
  rr(3,3,w-6,90,18);c.fill();
  c.strokeStyle=color;c.lineWidth=3;c.stroke();
  c.font='bold 36px Outfit, system-ui, sans-serif';c.fillStyle=color;c.textAlign='center';c.textBaseline='middle';c.fillText(text,w/2,48);
  const tx=new THREE.CanvasTexture(cvE);tx.colorSpace=THREE.SRGBColorSpace;
    // El rotulo se lee de lejos y en escorzo: sin mipmaps el texto centellea igual que el metal.
    tx.generateMipmaps=true;tx.minFilter=THREE.LinearMipmapLinearFilter;tx.magFilter=THREE.LinearFilter;tx.anisotropy=8;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,depthTest:false,transparent:true}));

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

function rLoopOf(m){ return m.rLoop!==undefined ? m.rLoop : (m.vSrc*m.vSrc/m.potenciaNominal); }
function rShuntOf(m){ return (m.shuntMv/1000)/m.shuntRated; }
function iTrueOf(m){ return m.vSrc/rLoopOf(m); }
function iLoadedOf(m){ return m.vSrc/(rLoopOf(m)+rShuntOf(m)); }

function clampRangeFor(reading){
  const a=Math.abs(reading);
  for(const r of CLAMP_RANGES) if(a<=r) return r;
  return CLAMP_RANGES[CLAMP_RANGES.length-1];
}
function clampUncertainty(reading){
  const range=clampRangeFor(reading);
  const resolution=range/CLAMP_COUNTS;
  const U=Math.abs(reading)*CLAMP_SPEC.pct/100 + CLAMP_SPEC.dig*resolution;
  return {range,resolution,U};
}
function shuntUncertainty(reading,ratedCurrent){
  const resolution=ratedCurrent/SHUNT_SPEC.counts;
  const U=Math.abs(reading)*SHUNT_SPEC.pct/100 + SHUNT_SPEC.dig*resolution;
  return {resolution,U};
}
function clampReadingFor(scenKey,iActualNow){
  const m=SCEN_META[scenKey];
  let trueSeen=iActualNow;
  if(scenKey==='calefactor' && clampPos==='ambos') trueSeen=0;
  if(clampMode==='ct' && m.tipo==='dc'){ return {fault:true, text:'— (TC no mide CD)'}; }
  let reading=trueSeen;
  if(clampMode==='hall' && m.tipo==='dc' && !zeroed) reading+=OFFSET_HALL_CD;
  const u=clampUncertainty(reading);
  return {fault:false, reading, range:u.range, resolution:u.resolution, U:u.U};
}
function shuntReadingFor(scenKey,iActualNow){
  if(!shuntIn) return {inserted:false};
  const m=SCEN_META[scenKey];
  const u=shuntUncertainty(iActualNow,m.shuntRated);
  return {inserted:true, reading:iActualNow, resolution:u.resolution, U:u.U};
}

function computeTargets(){
  const m=SCEN_META[scenarioKey];
  const iReal=energized ? (shuntIn ? iLoadedOf(m) : iTrueOf(m)) : 0;

}

S.setAnimate((dt,time)=>{
  targets=computeTargets();
  iLive+=(targets.iReal-iLive)*Math.min(1,dt*3.0);

  let jawZTarget=-0.55, jawScaleTarget=1.0;
  if(scenarioKey==='calefactor' && clampPos==='ambos'){ jawZTarget=-0.48; jawScaleTarget=1.55; }
  clampGroup.position.z+=(jawZTarget-clampGroup.position.z)*Math.min(1,dt*4.0);
  const newScale=jawRing.scale.x+(jawScaleTarget-jawRing.scale.x)*Math.min(1,dt*4.0);
  jawRing.scale.setScalar(newScale);

  const pulse=energized?(0.55+0.45*Math.sin(time*3.4)):0;
  jawRingMat.emissiveIntensity=energized?(0.25+0.35*pulse):0.05;
  statusLed.material.emissiveIntensity=energized?(0.5+0.4*pulse):0.15;
  pilotLamp.material.emissiveIntensity=(scenarioKey==='testigo'&&energized)?(0.7+0.5*pulse):0.0;
  finMat.emissiveIntensity=(scenarioKey==='calefactor'&&energized)?(0.35+0.25*pulse):0.0;
  if(scenarioKey==='arranque'&&energized) motorShaft.rotation.y+=dt*22;

  updateTele(iLive);
  if(time-(updateScreen._t||0)>0.22){ updateScreen(); updateScreen._t=time; }

  const acLike=SCEN_META[scenarioKey].tipo==='ac';
  const freqBase=90+Math.min(1, iLive/(acLike?15:220))*300;
  synth.update(freqBase, freqBase*(acLike?2.0:1.5), energized?0.045:0, energized?1200:500);
});

    <div class="fl"><b>Sí modela:</b> el efecto de carga real de un shunt en serie (R_shunt cambia la corriente real), auto-rango y resolución típicos de una pinza CD/CA de gama media, la diferencia entre pinza Hall (mide CD y CA) y de transformador de corriente (solo CA, por ley de Faraday), la cancelación por ley de Ampère al abrazar vivo+neutro juntos, y el offset de cero típico de un sensor Hall de CD.</div>
    <div class="fl no"><b>NO modela:</b> la respuesta en frecuencia real de cada pinza, el tendido físico completo de un cordón dúplex (aquí se separan vivo/neutro para claridad, salvo en el punto de medición), la conexión Kelvin de 4 hilos de un shunt de precisión real, ni defectos o desgaste del instrumento.</div>
  </div>
  <div class="src">Ref: IEC 61010-2-032 (seguridad de pinzas de gancho) — sin norma de exactitud única para pinza/shunt de banco; consulta el manual del fabricante para las especificaciones exactas.</div>`;

/* ---------- 13) helpers de UI ---------- */
function tf(v,dp=0){return (v===undefined||v===null)?'—':(+v).toFixed(dp);}
const el=id=>document.getElementById(id);
const consoleEl=el('console');

function setConsole(){
  const m=SCEN_META[scenarioKey];
  if(!energized){
    consoleEl.innerHTML=`Circuito inactivo. Pulsa <span class="ok">"⚡ Energizar circuito"</span> para alimentar ${m.fuente} → ${m.carga}.`;
    return;
  }
  const t=computeTargets();
  let html=`<b>${m.fuente}</b> → <b>${m.carga}</b><br>`;
  html+=`<span class="mono">Shunt: ${shuntIn?'EN SERIE':'fuera (puente)'} · Pinza: ${clampMode==='hall'?'Hall':'TC'}</span>`;
  if(clampMode==='hall' && m.tipo==='dc'){ html+=`<span class="mono"> · ${zeroed?'tarada':'sin tarar'}</span>`; }
  html+='<br>';
  if(scenarioKey==='calefactor'){
    html+=`<span class="mono">Mordaza sobre: ${clampPos==='ambos'?'vivo + neutro':'solo el vivo'}</span><br>`;
  }
  const cr=clampReadingFor(scenarioKey,t.iReal);
  if(cr.fault){
    html+=`<span class="dtc">Pinza: ${cr.text}</span>`;
  } else {
    html+=`<span class="mono">Pinza lee ${cr.reading.toFixed(3)} A (rango ${cr.range} A).</span>`;
  }
  consoleEl.innerHTML=html;
}

function updateTele(iRealNow){
  if(!energized){
    ['t_ireal','t_pinza','t_shunt','t_delta','t_error'].forEach(id=>{el(id).textContent='—'; el(id).className='';});
    el('t_upinza').textContent='—'; el('t_ushunt').textContent='—';
    return;
  }
  const m=SCEN_META[scenarioKey];
  el('t_ireal').textContent=iRealNow.toFixed(3)+' A';

  const cr=clampReadingFor(scenarioKey,iRealNow);
  if(cr.fault){
    el('t_pinza').textContent=cr.text; el('t_pinza').className='bad';
    el('t_upinza').textContent='—';
  } else {
    el('t_pinza').textContent=cr.reading.toFixed(3)+' A';
    el('t_pinza').className=(iRealNow>0.001 && Math.abs(cr.reading-iRealNow)>iRealNow*0.03)?'warn':'';
    el('t_upinza').textContent='± '+cr.U.toFixed(3)+' A ('+cr.range+' A rango)';
  }

  const sr=shuntReadingFor(scenarioKey,iRealNow);
  if(sr.inserted){
    el('t_shunt').textContent=sr.reading.toFixed(4)+' A'; el('t_shunt').className='good';
    el('t_ushunt').textContent='± '+sr.U.toFixed(4)+' A';
  } else {
    el('t_shunt').textContent='— (fuera de servicio)'; el('t_shunt').className='';
    el('t_ushunt').textContent='—';
  }

  if(insertedOnce){
    const iSin=iTrueOf(m), iCon=iLoadedOf(m);
    const d=iSin-iCon, pct=d/iSin*100;
    el('t_delta').textContent=d.toFixed(4)+' A'; el('t_delta').className=pct>1?'warn':'';
    el('t_error').textContent=pct.toFixed(3)+' %'; el('t_error').className=pct>1?'bad':(pct>0.15?'warn':'good');
  } else {
    el('t_delta').textContent='—'; el('t_delta').className='';
    el('t_error').textContent='— (inserta el shunt)'; el('t_error').className='';
  }
}

function updateScreen(){
  const ctx=scrCanvas.getContext('2d');
  ctx.clearRect(0,0,scrCanvas.width,scrCanvas.height);
  ctx.fillStyle='#06120f'; ctx.fillRect(0,0,scrCanvas.width,scrCanvas.height);
  ctx.textAlign='center';
  if(!energized){
    ctx.font='bold 26px monospace'; ctx.fillStyle='#3a5a54'; ctx.fillText('— — —',scrCanvas.width/2,140);
  } else {
    const cr=clampReadingFor(scenarioKey,targets.iReal);
    if(cr.fault){
      ctx.font='bold 18px monospace'; ctx.fillStyle='#5eead4'; ctx.fillText('— A',scrCanvas.width/2,120);
      ctx.font='12px monospace'; ctx.fillStyle='#f4475e'; ctx.fillText('TC no mide CD',scrCanvas.width/2,150);
    } else {
      ctx.font='bold 38px monospace'; ctx.fillStyle='#5eead4'; ctx.fillText(cr.reading.toFixed(2),scrCanvas.width/2,130);
      ctx.font='16px monospace'; ctx.fillStyle='#8fb3ac'; ctx.fillText('A',scrCanvas.width/2,160);
    }
  }
  ctx.font='11px monospace'; ctx.fillStyle='#4fd1c5';
  ctx.fillText(clampMode==='hall'?'HALL · CD/CA':'TC · SOLO CA',scrCanvas.width/2,205);
  if(clampMode==='hall'){ ctx.fillStyle='#8fb3ac'; ctx.fillText(zeroed?'TARADA':'SIN TARAR',scrCanvas.width/2,225); }
  scrTex.needsUpdate=true;
}

function refreshCaseLabel(){ el('p_case').textContent='Caso '+(SCEN_ORDER.indexOf(scenarioKey)+1)+'/3'; }
function clearDx(){ document.querySelectorAll('.b.dx').forEach(b=>b.classList.remove('right','wrong')); }

/* ---------- 14) interacción ---------- */
function setScenario(key){
  scenarioKey=key;
  insertedOnce=false;
  clearDx();
  if(scenarioKey!=='calefactor') clampPos='vivo';
  ['s_arranque','s_calefactor','s_testigo'].forEach(id=>el(id).classList.toggle('on', id==='s_'+scenarioKey));
  el('cp_vivo').classList.toggle('on',clampPos==='vivo');
  el('cp_ambos').classList.toggle('on',clampPos==='ambos');
  el('posWrap').style.display=scenarioKey==='calefactor'?'':'none';
  motorShaft.visible=(scenarioKey==='arranque');
  finMeshes.forEach(f=>f.visible=(scenarioKey==='calefactor'));
  pilotLamp.visible=(scenarioKey==='testigo');
  cableNeutralReturn.visible=(scenarioKey==='calefactor');
  refreshCaseLabel();
  setConsole();
}
el('s_arranque').onclick=()=>setScenario('arranque');
el('s_calefactor').onclick=()=>setScenario('calefactor');
el('s_testigo').onclick=()=>setScenario('testigo');

function setShunt(v){
  shuntIn=v;
  if(v) insertedOnce=true;
  jumperWire.visible=!v;
  shuntModule.visible=v;
  el('sh_out').classList.toggle('on',!v);
  el('sh_in').classList.toggle('on',v);
  setConsole();
}
el('sh_out').onclick=()=>setShunt(false);
el('sh_in').onclick=()=>setShunt(true);

function setClampMode(v){
  clampMode=v;
  el('cm_hall').classList.toggle('on',v==='hall');
  el('cm_ct').classList.toggle('on',v==='ct');
  setConsole();
}
el('cm_hall').onclick=()=>setClampMode('hall');
el('cm_ct').onclick=()=>setClampMode('ct');

function setClampPos(v){
  clampPos=v;
  el('cp_vivo').classList.toggle('on',v==='vivo');
  el('cp_ambos').classList.toggle('on',v==='ambos');
  setConsole();
}
el('cp_vivo').onclick=()=>setClampPos('vivo');
el('cp_ambos').onclick=()=>setClampPos('ambos');

el('btnZero').onclick=()=>{
  zeroed=!zeroed;
  el('btnZero').classList.toggle('on',zeroed);
  el('btnZero').textContent=zeroed?'🎯 Tarada (CD)':'🎯 Cero (tara CD)';
  synth.beep(zeroed?988:440,0.08,0.05);
  setConsole();
};

el('btnEnergize').onclick=(e)=>{
  energized=!energized;
  synth.init(); synth.resume();
  e.target.classList.toggle('on',energized);
  e.target.textContent=energized?'⚡ Desenergizar circuito':'⚡ Energizar circuito';
  if(energized){ S.moveTo([2.6,2.1,3.6],[0.2,0.9,-0.1],1.3); S.setCinematicIdle(true); synth.beep(660,0.1,0.06); }
  else{ S.setCinematicIdle(false); }
  setConsole();
};

el('btnNew').onclick=()=>{
  const i=SCEN_ORDER.indexOf(scenarioKey);
  setScenario(SCEN_ORDER[(i+1)%SCEN_ORDER.length]);
};

document.querySelectorAll('.b.dx').forEach(btn=>{
  btn.onclick=()=>{
    if(!energized){ showToast('Primero energiza el circuito.'); return; }
    const pick=btn.dataset.dx; clearDx();
    const m=SCEN_META[scenarioKey];
    if(pick===m.respuesta){
      btn.classList.add('right'); synth.beep(1046,0.12,0.06);
      showToast(`<span style="color:var(--good)">✔ Correcto</span><br><span style="color:var(--dim);font-size:11px">${DX_HINT[pick]}</span>`);
    } else {
      btn.classList.add('wrong'); synth.beep(220,0.15,0.06);
      showToast(`<span style="color:var(--bad)">✗ No es la explicación principal aquí.</span><br><span style="color:var(--dim);font-size:11px">Pista: compara qué cambia al mover los controles de "Instrumento".</span>`);
    }
  };
});

const soundBtn=document.getElementById('soundBtn');
soundBtn.onclick=()=>{const on=synth.toggle();soundBtn.textContent=on?'🔊':'🔇';soundBtn.classList.toggle('on',on);};

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let autoRunning=false;
async function runAuto(){
  if(autoRunning) return;
  autoRunning=true;
  const btn=el('btnAuto'); const label=btn.textContent;
  btn.disabled=true; btn.classList.add('on'); btn.textContent='⏳ Demostración en curso…';
  try{
    setScenario('arranque'); setShunt(false); setClampMode('hall');
    zeroed=true; el('btnZero').classList.add('on'); el('btnZero').textContent='🎯 Tarada (CD)';
    clearDx();
    if(!energized){ showToast('Paso 1 · Energizando el circuito de arranque…'); el('btnEnergize').click(); await sleep(1600); }
    showToast('Paso 2 · La pinza mide ≈200.00 A sin tocar el circuito.'); await sleep(2200);
    showToast('Paso 3 · Insertamos el shunt EN SERIE…'); setShunt(true); await sleep(2200);
    showToast('Paso 4 · La corriente REAL bajó a ≈189.83 A: el shunt cargó el circuito.'); await sleep(2600);
    document.querySelector('.b.dx[data-dx="carga"]').click(); await sleep(2600);

    setScenario('calefactor'); setShunt(false); clearDx();
    showToast('Paso 5 · Calefactor de 1200 W en 127 V CA. Pinza sobre el vivo: ≈9.45 A.'); await sleep(2600);
    showToast('Paso 6 · Ahora abrazamos vivo + neutro juntos…'); setClampPos('ambos'); await sleep(2400);
    showToast('Paso 7 · La lectura cae a ≈0 A aunque el calefactor sigue encendido.'); await sleep(2600);
    document.querySelector('.b.dx[data-dx="ampere"]').click(); await sleep(2600);
    setClampPos('vivo');

    setScenario('testigo'); setShunt(false); clearDx();
    zeroed=false; el('btnZero').classList.remove('on'); el('btnZero').textContent='🎯 Cero (tara CD)'; setConsole();
    showToast('Paso 8 · Bobina de relevador: solo 0.20 A reales.'); await sleep(2400);
    showToast('Paso 9 · Sin tarar, el offset del sensor Hall (~1.2 A) domina la lectura: marca ≈1.40 A.'); await sleep(2800);
    document.querySelector('.b.dx[data-dx="offset"]').click(); await sleep(2200);
    showToast('Paso 10 · Al presionar "Cero" antes de medir, la lectura vuelve a ser fiel a la realidad.');
    zeroed=true; el('btnZero').classList.add('on'); el('btnZero').textContent='🎯 Tarada (CD)'; setConsole(); await sleep(2400);

    showToast('<span style="color:var(--good)">✔ Fin de la demostración: carga, cancelación y offset — tres formas en que un instrumento puede "mentir" si no entiendes cómo mide.</span>');
  } finally {
    btn.disabled=false; btn.classList.remove('on'); btn.textContent=label;
    autoRunning=false;
  }
}
el('btnAuto').onclick=runAuto;

setScenario('arranque');
S.start();
