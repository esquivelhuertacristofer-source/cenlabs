<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#08201C;--panel:rgba(9,26,23,.86);--line:#1E3A34;--ink:#EAF4F1;

  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(10,13,18,.92),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

  .badge{position:fixed;top:16px;right:20px;z-index:20;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,209,102,.12);color:var(--hv);border:1px solid rgba(255,209,102,.35);padding:6px 12px;border-radius:20px}

  .hud{position:fixed;top:70px;left:18px;z-index:15;max-width:330px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-height:calc(100vh - 150px);overflow-y:auto}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .hud h2{font-size:19px;line-height:1.15;margin-bottom:9px}
  .hud p{font-size:13px;line-height:1.55;color:var(--dim);margin-bottom:10px}
  .hud .formula{font-family:var(--mono);color:var(--accent2);text-align:center;font-size:12.5px;margin:8px 0;padding:8px;background:rgba(0,0,0,.25);border-radius:8px;line-height:1.5}
  .hud .src{font-size:10.5px;color:#7a8894;font-style:italic;margin-top:4px;line-height:1.5}
  .legend{display:flex;flex-direction:column;gap:6px;margin:12px 0;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:10px}

  .legend .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .fid{margin:10px 0 2px;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:10px;border:1px solid rgba(79,209,197,.18)}
  .fid .ft{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);margin-bottom:6px}
  .fid .fl{font-size:11px;color:#c4d0da;line-height:1.5;margin-bottom:5px}
  .fid .fl b{color:var(--ink)}
  .fid .fl.no b{color:var(--hv)}

  .panel{position:fixed;top:70px;right:18px;z-index:15;width:262px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:16px;max-height:calc(100vh - 150px);overflow-y:auto}

  .panel h4.sec{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .g{margin-bottom:6px}
  .gl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .gl b{color:var(--accent2)}

  .modebar{display:flex;gap:5px;margin-bottom:8px}
  .modebar .b{flex:1;padding:8px 4px;font-size:11px}
  .btns{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .b{font-family:system-ui;font-size:12.5px;padding:10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#1b242f;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#202c38}
  .b.on{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:bold}
  .b.primary{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:bold}
  .b.auto{border-color:var(--hv);color:var(--hv);background:rgba(255,183,3,.10);font-weight:bold}
  .b.auto:hover{background:rgba(255,183,3,.18);border-color:var(--hv)}

  .b.dx{text-align:left;font-size:12px}
  .b.dx.right{background:rgba(52,211,153,.18);border-color:var(--good);color:var(--good);font-weight:bold}
  .b.dx.wrong{background:rgba(244,71,94,.15);border-color:var(--bad);color:var(--bad)}
  .console{font-family:var(--mono);font-size:11px;line-height:1.55;color:#c4d0da;background:rgba(0,0,0,.28);border-radius:9px;padding:10px 12px;margin-bottom:8px;min-height:56px}

  .hint{position:fixed;bottom:18px;left:18px;z-index:14;font-family:var(--mono);font-size:10px;color:var(--dim);background:var(--panel);padding:7px 12px;border-radius:9px;border:1px solid var(--line)}
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(18,24,32,.95);border:1px solid var(--accent);padding:10px 20px;border-radius:40px;font-family:var(--mono);font-size:12px;opacity:0;transition:.3s;pointer-events:none;max-width:80vw;text-align:center}
  .toast.show{opacity:1}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}
  .soundBtn:hover{transform:scale(1.08)}
  .inspectHint{position:fixed;bottom:18px;right:18px;z-index:14;font-family:var(--mono);font-size:10px;color:var(--accent2);background:var(--panel);padding:7px 12px;border-radius:9px;border:1px solid var(--line)}

  @media(max-width:820px){
    .hud,.panel{position:fixed;left:8px;right:8px;top:auto;bottom:8px;max-width:none;width:auto;max-height:42vh;overflow-y:auto}
    .hud{bottom:calc(8px + 42vh + 8px)}
    .hint,.inspectHint{display:none}
  }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.26, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;
    }
    if(hook)hook(dt,t); controls.update();
    if(bokeh) bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);
    composer.render(); }
  function start(){ if(!raf)loop(); }
  function stop(){ cancelAnimationFrame(raf); raf=null; window.removeEventListener('resize',resize); }

  return { THREE, renderer, scene, camera, controls, composer, bloom,
    setAnimate:fn=>hook=fn, start, stop, resize, clock,
    flyTo:(v)=>{ controls.target.copy(v); }, moveTo, setCinematicIdle };
}

function pickerFor(scene,camera,dom,onHit){
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(); let down=null;
  dom.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
  dom.addEventListener('pointerup',e=>{
    if(!down)return; const moved=Math.abs(e.clientX-down[0])+Math.abs(e.clientY-down[1])>6; down=null;
    if(moved)return;
    const r=dom.getBoundingClientRect();
    mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(mouse,camera);
    const hits=ray.intersectObjects(scene.children,true);
    onHit(hits[0]||null);
  });
}

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

/* =============================================================================
   MEC-95 · d4-03 — Válvulas direccionales: vías, posiciones y mandos básicos
   -----------------------------------------------------------------------------
   MOTOR SELLADO: el bloque entre "===== MOTOR =====" y "===== FIN MOTOR ====="
   está pegado VERBATIM desde el verificador numérico (verif_valvulas.mjs,
   132/132). Ninguna cifra ni ningún veredicto del pizarrón, del panel, de la
   ficha ni del briefing está escrito a mano: todos salen de estas funciones.

   Modelo:
   · Vías y posiciones — una válvula se nombra por el número de orificios de
     trabajo (vías) y por el número de estados del carrete (posiciones). Cada
     posición es una LISTA de pares de puertos comunicados; lo que no aparece
     en la lista queda bloqueado. De ahí sale todo el resto del simulador.
   · Puertos (ISO 11727) — 1 alimentación, 2 y 4 salidas de trabajo, 3 y 5
     escapes, 12 y 14 pilotajes. El pilotaje 12 conecta 1 con 2 y el 14
     conecta 1 con 4: el número del pilotaje dice a qué salida da paso.
   · Mandos — el accionamiento no cambia lo que la válvula hace, cambia CUÁNTAS
     órdenes independientes entrega y si la orden se sostiene. Una monoestable
     necesita una orden y un muelle; una biestable y una de tres posiciones
     necesitan dos.
   · Cámaras y vástago — el estado de cada cámara del cilindro (presión,
     escape, bloqueada o atmósfera) se deduce de la posición del carrete y del
     conexionado, y de las dos cámaras sale el veredicto del vástago.
   · Fuerzas — F_teo = p · A (1 bar sobre 1 cm² = 10 N) y F_útil = η · p · A con
     η = 0,85. El muelle de un simple efecto se declara como RANGO de catálogo
     (10 %–20 % de la teórica a 6 bar), no como una cifra inventada. Con las dos
     cámaras a presión queda la fuerza diferencial, que es exactamente la del
     área del vástago.

   Ref: ISO 1219-1 (símbolos de los mandos y de las válvulas) ·
        ISO 11727 (identificación de los puertos) ·
        ISO 15552 (cilindros normalizados, parejas émbolo-vástago) ·
        ISO 4414 (seguridad: el aire atrapado no es un medio de retención).
   ============================================================================= */

// --- estado de las salidas de trabajo en una posicion dada
function salidas(vk, pos, conexK) {
  const V = VALVULAS[vk], cn = V.conex[pos] || [];
  const st = {};
  (V.vias === 3 ? ['2'] : ['2', '4']).forEach(s => st[s] = 'bloqueada');
  for (const par of cn) {
    for (const s of Object.keys(st)) {
      if (par[0] === s || par[1] === s) {
        const otro = par[0] === s ? par[1] : par[0];
        if (otro === '1') st[s] = 'presion';
        else if (otro === '3' || otro === '5') st[s] = (conexK === 'tapado') ? 'bloqueada' : 'escape';
      }
    }
  }
  return st;
}

// --- que camara alimenta cada salida
function tubos(sc, vk, conexK) {
  const V = VALVULAS[vk], C = CILS[sc.cil];
  if (V.vias === 3) {
    const puerto = C.puertos[0];
    const otro = puerto === 'tras' ? 'anu' : 'tras';
    return conexK === 'cruzado' ? { '2': otro } : { '2': puerto };
  }
  return conexK === 'cruzado' ? { '2': 'tras', '4': 'anu' } : { '2': 'anu', '4': 'tras' };
}

// --- estado de las dos camaras. Un extremo sin tubo queda a la atmosfera (respiradero o boca libre).
function camaras(sc, cfg, pos, sinAire) {
  const st = salidas(cfg.valv, pos, cfg.conex);
  const tb = tubos(sc, cfg.valv, cfg.conex);
  const out = { tras: 'atmosfera', anu: 'atmosfera' };
  for (const s of Object.keys(tb)) {
    let e = st[s];
    if (sinAire && e === 'presion') e = 'atmosfera';   // la red despresurizada no empuja
    out[tb[s]] = e;
  }
  return out;
}

function veredicto(sc, cams) {
  const C = CILS[sc.cil];
  const pres = k => cams[k] === 'presion';
  const libre = k => cams[k] === 'escape' || cams[k] === 'atmosfera';
  const blo = k => cams[k] === 'bloqueada';
  if (pres('tras') && pres('anu')) return 'diferencial';
  if (blo('tras') || blo('anu')) return 'bloqueado';
  if (pres('tras') && libre('anu')) return 'avanza';
  if (pres('anu') && libre('tras')) return 'retrocede';
  if (C.muelle === 'retrae') return 'dentro-muelle';
  if (C.muelle === 'avanza') return 'fuera-muelle';
  return 'libre';
}

const VER_TXT = {
  avanza: 'el vástago SALE', retrocede: 'el vástago ENTRA', bloqueado: 'no se mueve (aire atrapado)',
  diferencial: 'sale con la fuerza diferencial (las dos cámaras a presión)',
  'dentro-muelle': 'el muelle lo mete', 'fuera-muelle': 'el muelle lo saca', libre: 'queda libre (sin fuerza)',
};

// --- posicion de la valvula en cada fase de la orden
function posicion(vk, ak, fase) {
  const V = VALVULAS[vk], A = ACC[ak];
  const iOrden = V.np === 3 ? 2 : 1;
  if (V.est === 'mono') return fase === 'orden' ? iOrden : V.rep;
  if (V.est === 'bi') {
    if (fase === 'reposo') return 0;
    return iOrden;                       // memoria: se queda donde la dejo el pulso
  }
  return fase === 'orden' ? iOrden : V.rep;   // 3 posiciones: al soltar vuelve al centro
}

function claseEfectiva(vk, ak) {
  const V = VALVULAS[vk], A = ACC[ak];
  if (V.est === 'bi') return 'memoria';
  if (V.est === 'centro') return 'centro';
  return A.sostiene ? 'mantenida' : 'momentanea';
}

// --- los cuatro criterios
function okFunc(sc, vk) {
  const V = VALVULAS[vk];
  if (sc.paradaInt && !(V.np === 3 && V.centro === 'cerrado')) return false;
  if (sc.libreMan && !(V.np === 3 && V.centro === 'escape')) return false;
  if (CILS[sc.cil].puertos.length === 2 && V.vias < 5) return false;
  return true;
}
function okMando(sc, vk, ak) {
  const V = VALVULAS[vk], A = ACC[ak];
  if (A.origen !== sc.origen) return false;
  if (V.est === 'mono' && A.mandos !== 1) return false;
  if (V.est !== 'mono' && A.mandos !== 2) return false;
  if (claseEfectiva(vk, ak) !== sc.clase) return false;
  return true;
}
function okTubos(sc, cfg) {
  const cams = camaras(sc, cfg, posicion(cfg.valv, cfg.acc, 'orden'), false);
  return veredicto(sc, cams) === sc.movOrden;
}
function okReposo(sc, cfg) {
  const camsS = camaras(sc, cfg, posicion(cfg.valv, cfg.acc, 'soltada'), false);
  const vS = veredicto(sc, camsS);
  if (sc.trasSoltar === 'dentro' && !(vS === 'retrocede' || vS === 'dentro-muelle')) return false;
  if (sc.trasSoltar === 'fuera' && !(vS === 'avanza' || vS === 'fuera-muelle' || vS === 'diferencial')) return false;
  if (sc.trasSoltar === 'bloqueado' && vS !== 'bloqueado') return false;
  if (sc.trasSoltar === 'apretando' && camsS[sc.camMotriz] !== 'presion') return false;
  if (sc.alFaltarAire) {
    const camsA = camaras(sc, cfg, posicion(cfg.valv, cfg.acc, 'soltada'), true);
    const vA = veredicto(sc, camsA);
    if (sc.alFaltarAire === 'dentro' && !(vA === 'retrocede' || vA === 'dentro-muelle')) return false;
    if (sc.alFaltarAire === 'fuera' && !(vA === 'avanza' || vA === 'fuera-muelle')) return false;
  }
  return true;
}

const VALK = Object.keys(VALVULAS), ACCK = Object.keys(ACC), CONK = Object.keys(CONEXIONES);

function evalua(sc, cfg) {
  const oF = okFunc(sc, cfg.valv), oM = okMando(sc, cfg.valv, cfg.acc);
  const oT = okTubos(sc, cfg), oR = okReposo(sc, cfg);
  return { oF, oM, oT, oR, ok: oF && oM && oT && oR, costo: VALVULAS[cfg.valv].costo };
}

// terna ganadora: valida Y con la valvula mas simple de las validas
function GOOD(sc) {
  let best = null;
  for (const v of VALK) for (const a of ACCK) for (const c of CONK) {
    const cfg = { valv: v, acc: a, conex: c };
    if (!evalua(sc, cfg).ok) continue;
    if (!best || VALVULAS[v].costo < VALVULAS[best.valv].costo) best = cfg;
  }
  return best;
}
const cfgWith = (sc, o) => Object.assign({}, GOOD(sc), o);
function costoMin(sc) {
  let m = Infinity;
  for (const v of VALK) {
    const cfg = cfgWith(sc, { valv: v });
    if (evalua(sc, cfg).ok) m = Math.min(m, VALVULAS[v].costo);
  }
  return m;
}
const okValvEje = (sc, v) => { const cfg = cfgWith(sc, { valv: v }); return evalua(sc, cfg).ok && VALVULAS[v].costo === costoMin(sc); };
const okAccEje = (sc, a) => evalua(sc, cfgWith(sc, { acc: a })).ok;
const okConEje = (sc, c) => evalua(sc, cfgWith(sc, { conex: c })).ok;
const validaTerna = (sc, cfg) => evalua(sc, cfg).ok && VALVULAS[cfg.valv].costo === costoMin(sc);

// --- diagnosticos
function whyValv(sc, v) {
  const V = VALVULAS[v], cfg = cfgWith(sc, { valv: v }), e = evalua(sc, cfg);
  if (e.ok && V.costo === costoMin(sc)) return '';
  if (sc.paradaInt && !(V.np === 3 && V.centro === 'cerrado')) return 'Sin centro cerrado no hay parada a media carrera: al soltar la orden el vástago sigue o se queda sin fuerza.';
  if (sc.libreMan && !(V.np === 3 && V.centro === 'escape')) return 'Para dejar el vástago libre hay que vaciar las dos cámaras: eso solo lo hace un centro a escape.';
  if (CILS[sc.cil].puertos.length === 2 && V.vias < 5) return 'Una válvula de 3 vías solo manda una cámara: el doble efecto sale y se queda fuera porque no hay quien lo devuelva.';
  if (!e.oM) return 'La estabilidad de esta válvula no encaja con el mando que pide la estación: ' + (V.est === 'bi' ? 'una biestable exige dos órdenes y recuerda la última.' : V.est === 'centro' ? 'una válvula de tres posiciones exige dos órdenes.' : 'una monoestable vuelve por muelle en cuanto la orden desaparece.');
  if (!e.oT) return 'Con esta válvula la orden no produce el movimiento que la estación pide.';
  if (!e.oR) return 'Al retirar la orden el vástago no queda donde la estación exige.';
  return 'Cumple, pero hay una válvula más simple que hace el mismo trabajo: no se compra una ' + V.sig + ' cuando basta menos.';
}
function whyAcc(sc, a) {
  const A = ACC[a], cfg = cfgWith(sc, { acc: a }), V = VALVULAS[cfg.valv];
  if (evalua(sc, cfg).ok) return '';
  if (A.origen !== sc.origen) return 'La orden de esta estación no llega por ese camino: hace falta un mando ' + ORIGEN_TXT[sc.origen] + ', no ' + ORIGEN_TXT[A.origen] + '.';
  if (V.est === 'mono' && A.mandos !== 1) return 'La válvula tiene un solo pilotaje y un muelle: el segundo mando no va a ninguna parte.';
  if (V.est !== 'mono' && A.mandos !== 2) return 'Esta válvula pide DOS órdenes independientes y este mando solo entrega una: la otra posición de trabajo no se puede ordenar nunca.';
  const ce = claseEfectiva(cfg.valv, a);
  return 'La clase de orden no es la que pide la estación: este mando da una orden ' + CLASE_TXT[ce] + ' y hace falta ' + CLASE_TXT[sc.clase] + '.';
}
function whyCon(sc, c) {
  const cfg = cfgWith(sc, { conex: c });
  const e = evalua(sc, cfg);
  if (e.ok) return '';
  if (c === 'tapado') return CILS[sc.cil].puertos.length === 2
    ? 'Con los escapes obturados la cámara opuesta no puede vaciarse: el vástago no se mueve aunque la válvula conmute.'
    : 'Con los escapes obturados el aire entra igual y la orden se cumple, pero el muelle no puede expulsar el aire: el vástago se queda sin volver.';
  if (!e.oT) return 'Con este conexionado la orden mueve el vástago al contrario de lo que la estación pide.';
  return 'Con este conexionado la posición de reposo del vástago queda invertida.';
}

// arranque deliberadamente equivocado en los tres ejes
function startCfg(sc) {
  const v = VALK.find(k => !okValvEje(sc, k)) || VALK[0];
  const a = ACCK.find(k => !okAccEje(sc, k)) || ACCK[0];
  const c = CONK.find(k => !okConEje(sc, k)) || CONK[0];
  return { valv: v, acc: a, conex: c };
}

const PORT_POS={

  3:{top:{'2':0.50},bot:{'1':0.32,'3':0.72}},

function puntoP(cx,cw,y,h,PP,p){
  if(PP.top[p]!==undefined)return {x:cx+cw*PP.top[p],y:y,arriba:true};
  return {x:cx+cw*PP.bot[p],y:y+h,arriba:false};
}
// sentido del aire dentro de la casilla: de la alimentación a la salida, o de la salida al escape
function dirPar(par){
  const [a,b]=par;

function flecha(c,px,py,qx,qy,col){
  const ang=Math.atan2(qy-py,qx-px),mx=px+(qx-px)*0.62,my=py+(qy-py)*0.62,L=9;
  c.fillStyle=col;c.beginPath();

  c.lineTo(mx-L*Math.cos(ang-0.5),my-L*Math.sin(ang-0.5));
  c.lineTo(mx-L*Math.cos(ang+0.5),my-L*Math.sin(ang+0.5));

}
function simbAcc(c,x,y,w,h,tipo,col){
  c.strokeStyle=col;c.lineWidth=2;c.fillStyle=hexA(col,0.10);
  if(tipo==='nada'){
    c.setLineDash([4,4]);c.strokeStyle=BAD_HEX;c.strokeRect(x,y,w,h);c.setLineDash([]);
    c.fillStyle=BAD_HEX;c.font='bold 22px Outfit, sans-serif';c.textAlign='center';c.fillText('?',x+w/2,y+h/2+8);
    return;
  }
  if(tipo==='muelle'){
    c.beginPath();c.moveTo(x,y+h/2);
    for(let i=0;i<6;i++){const xx=x+w*(i+0.5)/6;c.lineTo(xx,y+h/2+(i%2?h*0.30:-h*0.30));}
    c.lineTo(x+w,y+h/2);c.stroke();return;
  }
  c.fillRect(x,y,w,h);c.strokeRect(x,y,w,h);
  if(tipo==='puls'){c.beginPath();c.moveTo(x+w/2,y);c.lineTo(x+w/2,y-10);c.moveTo(x+w/2-9,y-10);c.lineTo(x+w/2+9,y-10);c.stroke();}
  else if(tipo==='palanca'){c.beginPath();c.moveTo(x+w*0.25,y+h);c.lineTo(x+w*0.75,y-8);c.stroke();
    c.fillStyle=col;c.beginPath();c.arc(x+w*0.25,y+h,3.5,0,7);c.fill();}

  Object.keys(PP.bot).forEach(p=>{
    const pt=puntoP(cxA,cw,y,h,PP,p);

function updateHW(){
  const sc=curSc(),cfg=curCfg(),V=VALVULAS[cfg.valv],e=evalua(sc,cfg);
  const pos=curPos(),cams=curCams();
  const r=0.055+sc.D/100*0.115;
  barrel.scale.set(r,0.86,r);
  const rr=0.018+CIL_ISO[sc.D]/100*0.060;
  rod.scale.set(rr,0.62,rr);
  const p=animP;
  rod.position.x=2.92+0.30*p;
  tip.position.x=3.22+0.30*p;
  carga.position.x=3.48+0.30*p;
  // carrete: tantos topes como posiciones
  const off=V.np===3?(pos-1)*0.11:(pos-0.5)*0.16;
  spool.position.x=2.30+off;
  // tubos
  MAT_TUBO.tras.color.setHex(EST_COL[cams.tras]);MAT_TUBO.tras.emissive.setHex(EST_COL[cams.tras]);MAT_TUBO.tras.emissiveIntensity=EST_EMI[cams.tras];
  MAT_TUBO.anu.color.setHex(EST_COL[cams.anu]);MAT_TUBO.anu.emissive.setHex(EST_COL[cams.anu]);MAT_TUBO.anu.emissiveIntensity=EST_EMI[cams.anu];
  // el tubo de una cámara sin conducto (simple efecto) se oculta
  const tb=tubos(sc,cfg.valv,cfg.conex),conectadas=Object.keys(tb).map(k=>tb[k]);
  tuboTras.visible=conectadas.includes('tras');
  tuboAnu.visible=conectadas.includes('anu');
  // alimentación
  linea1.material.emissive=new THREE.Color(curSin()?0x2c333d:0x8AB4F8);
  linea1.material.emissiveIntensity=curSin()?0.05:0.9;
  // accionamiento y retorno
  const iOrden=V.np===3?2:1;
  accBox.material.emissive=new THREE.Color(pos===iOrden?0x7CD992:0x1b2028);
  accBox.material.emissiveIntensity=pos===iOrden?0.9:0.05;
  const der=ladoDer(cfg.valv,cfg.acc);
  retBox.material.emissive=new THREE.Color(der==='nada'?0xff6b6b:pos===(V.rep||0)?0x7CD992:0x1b2028);
  retBox.material.emissiveIntensity=der==='nada'?0.8:(pos===(V.rep||0)?0.9:0.05);
  // carga proporcional al diámetro
  const cs=0.20+sc.D/100*0.22;
  carga.scale.set(cs/0.32,cs/0.32,cs/0.32);
  ledF.material.emissiveIntensity=e.oF?1.4:0.10;
  ledM.material.emissiveIntensity=e.oM?1.4:0.10;
  ledT.material.emissiveIntensity=e.oT?1.4:0.10;
  ledR.material.emissiveIntensity=e.oR?1.4:0.10;
  drawPlaca(cfg.valv,pos,cams);
}

      {t:'Vuelve a la posición de reposo de la válvula',ok:false,why:'La válvula conmuta, pero sin presión de red ninguna posición mueve nada.'},
      {t:'Se bloquea donde esté, porque el aire queda atrapado',ok:false,why:'Con escapes libres el aire se va. Y aunque quedara atrapado, la ISO 4414 no lo admite como medio de retención.'},

pickerFor(scene,S.camera,S.renderer.domElement,hit=>{

(function hoverLoop(){
  const ray=new THREE.Raycaster();const m=new THREE.Vector2(-2,-2);
  S.renderer.domElement.addEventListener('pointermove',ev=>{
    const r=S.renderer.domElement.getBoundingClientRect();
    m.x=((ev.clientX-r.left)/r.width)*2-1;m.y=-((ev.clientY-r.top)/r.height)*2+1;
  });
  function tick(){
    ray.setFromCamera(m,S.camera);
    const objs=[...HOVER_LABELS.keys()];
    const hits=ray.intersectObjects(objs,true);
    const hitSet=new Set();
    hits.forEach(h=>{let o=h.object;while(o){if(HOVER_LABELS.has(o)){hitSet.add(o);break;}o=o.parent;}});
    HOVER_LABELS.forEach((spr,obj)=>{spr.visible=hitSet.has(obj);});
    requestAnimationFrame(tick);
  }
  tick();
})();

    await sleep(5200);
    mdIdx=1;mdVal='v32nc';mdAcc='rodillo';mdFase='soltada';afterEdit();
    showToast('🎛️ La MISMA 3/2 NC, y el tope queda FUERA al soltar en vez de dentro: lo que cambió es el muelle del cilindro, que aquí avanza. La válvula no decide la posición de reposo por sí sola.');
    await sleep(5000);
    mdIdx=3;mdVal='v52b';mdAcc='pilotoDoble';mdFase='soltada';afterEdit();
    const camsM=camaras(POOL[3],{valv:'v52b',acc:'pilotoDoble',conex:'ok'},1,false);
    showToast('🎛️ Mordaza: la 5/2 biestable recuerda el pulso y deja la cámara motriz '+EST_ABR[camsM.tras]+'. Sigue apretando con '+f1(fUtil(areaEmb(POOL[3].D),POOL[3].p),1)+' N. Memoria, no fuerza extra.');
    await sleep(5000);
    mdIdx=4;mdVal='v53c';mdAcc='solenoideMuelle';mdFase='soltada';afterEdit();
    showToast('🎛️ Elevador con un solo solenoide sobre la 5/3: '+whyAcc(POOL[4],'solenoideMuelle')+' Contar órdenes es parte de elegir la válvula.');
    await sleep(4800);

    // ---------- SIN AIRE ----------
    setMode('aire');
    arIdx=2;arCon='ok';arSin=true;afterEdit();
    const cams2=camaras(POOL[2],GOOD(POOL[2]),posicion(GOOD(POOL[2]).valv,GOOD(POOL[2]).acc,'soltada'),true);
    showToast('💨 Barrera de doble efecto y red despresurizada: las dos cámaras quedan '+EST_ABR[cams2.tras]+' y '+EST_ABR[cams2.anu]+'. '+VER_TXT[veredicto(POOL[2],cams2)]+': la barrera cae por su propio peso. Sólo un muelle sostiene una posición.');
    await sleep(5200);
    arIdx=4;arSin=true;afterEdit();
    const cams4=camaras(POOL[4],GOOD(POOL[4]),posicion(GOOD(POOL[4]).valv,GOOD(POOL[4]).acc,'soltada'),true);
    showToast('💨 El elevador con centro cerrado guarda la POSICIÓN, no la presión: sus cámaras quedan '+EST_ABR[cams4.tras]+' y '+EST_ABR[cams4.anu]+'. ISO 4414: el aire atrapado no es un medio de retención para una carga suspendida.');
    await sleep(5200);
    arIdx=2;arSin=false;arCon='cruzado';afterEdit();
    const conOk2=CONK.filter(k=>okConEje(POOL[2],k));
    showToast('💨 Y aquí cruzar las salidas NO es una avería: de los '+CONK.length+' conexionados del banco la barrera sólo funciona con '+conOk2.length+', el cruzado. Es la única forma de que una 5/2 monoestable deje el vástago '+POOL[2].trasSoltar+' —la barrera BAJADA— al retirar la orden.');
    await sleep(4600);
    arIdx=0;arCon='tapado';afterEdit();
    showToast('💨 '+whyCon(POOL[0],'tapado')+' En un doble efecto, en cambio, no se movería ni al dar la orden: son dos averías distintas.');
    await sleep(5000);
    arIdx=4;arCon='ok';arSin=false;afterEdit();
    const sc4=POOL[4],Fd=fDifer(sc4.D,sc4.p),Fa=fUtil(areaEmb(sc4.D),sc4.p);
    showToast('💨 Y si las dos cámaras se presurizan a la vez, el cilindro no se bloquea: sale con la fuerza del ÁREA DEL VÁSTAGO, '+f1(Fd,1)+' N frente a '+f1(Fa,1)+' N, '+f1(Fa/Fd,2)+' veces menos.');
    await sleep(5000);

    // ---------- RETO ----------
    setMode('reto');
    seedReto(0);afterEdit();
    showToast('🎯 Reto: '+retoSc().nom+'. Los tres ejes arrancan mal a propósito: '+VALVULAS[retoCh.valv].sig+', '+ACC[retoCh.acc].nom.split(' ')[0]+', '+CONEXIONES[retoCh.conex].nom.toLowerCase()+'.');
    await sleep(4600);
    checkReto();
    showToast('🎯 Comprobado en rojo: '+retoExplain());
    await sleep(5000);
    retoSolveBuild();afterEdit();
    const g=GOOD(retoSc());
    showToast('🎯 Terna válida y mínima: '+VALVULAS[g.valv].sig+' con '+ACC[g.acc].simb+' y conexionado '+CONEXIONES[g.conex].nom.toLowerCase()+'. De las '+(VALK.length*ACCK.length*CONK.length)+' ternas del catálogo, sólo una lo consigue en esta estación.');
    await sleep(4800);
    checkReto();
    await sleep(600);
    answer(QUIZ[mode].opciones.findIndex(o=>o.ok));
  }finally{
    btn.disabled=false;btn.classList.remove('on');btn.textContent=label;autoRunning=false;
  }
}

// ===================== 16. ANIMACIÓN, EVENTOS E INICIO =====================
S.setAnimate((dt)=>{
  animT+=dt;
  const ver=curVer();
  let tgt=animP;
  if(ver==='avanza'||ver==='fuera-muelle'||ver==='diferencial')tgt=1;
  else if(ver==='retrocede'||ver==='dentro-muelle')tgt=0;
  else if(ver==='libre')tgt=Math.min(1,Math.max(0,animP+0.02*Math.sin(animT*1.6)));
  const k=Math.min(1,dt*(ver==='diferencial'?1.0:2.4));
  animP+=(tgt-animP)*k;
  updateHW();
});
['vias','mando','aire','reto'].forEach(m=>{el('m_'+m).onclick=()=>{if(!autoRunning)setMode(m);};});
el('btnAuto').onclick=()=>{if(!autoRunning)runAuto();};
el('btnNew').onclick=()=>{if(autoRunning)return;newSignal();};
el('btnCheck').onclick=()=>{if(autoRunning)return;checkReto();};
const soundBtn=el('soundBtn');if(soundBtn){soundBtn.onclick=()=>{synth.toggle();soundBtn.textContent=synth.isOn()?'🔊':'🔇';};}
document.addEventListener('pointerdown',()=>{synth.init();synth.resume();},{once:true});
buildQuiz();
S.start();
setMode('vias');

  PUERTOS:()=>PUERTOS,VALVULAS:()=>VALVULAS,ACC:()=>ACC,CILS:()=>CILS,CONEXIONES:()=>CONEXIONES,POOL:()=>POOL,
  VALK:()=>VALK,ACCK:()=>ACCK,CONK:()=>CONK,
  areaEmb,areaAnu,fTeorica,fUtil,fMuelle,fDifer,
  salidas,tubos,camaras,veredicto,posicion,claseEfectiva,
  okFunc,okMando,okTubos,okReposo,evalua,GOOD,cfgWith,costoMin,

  curSc,curCfg,curPos,curSin,curCams,curVer,
  viGet:()=>({valv:viVal,pos:viPos,idx:viIdx}),
  viSet:(v,p,i)=>{if(v)viVal=v;if(p!=null)viPos=p;if(i!=null)viIdx=i;afterEdit();},
  mdGet:()=>({idx:mdIdx,valv:mdVal,acc:mdAcc,fase:mdFase}),
  mdSet:(o)=>{if(o.idx!=null)mdIdx=o.idx;if(o.valv)mdVal=o.valv;if(o.acc)mdAcc=o.acc;if(o.fase)mdFase=o.fase;afterEdit();},
  arGet:()=>({idx:arIdx,conex:arCon,sin:arSin}),
  arSet:(o)=>{if(o.idx!=null)arIdx=o.idx;if(o.conex)arCon=o.conex;if(o.sin!=null)arSin=!!o.sin;afterEdit();},
  retoK:()=>retoK,seedReto,retoName:()=>retoSc().nom,
  retoGet:()=>retoCfg(),retoSet,retoSolveBuild,checkReto,
  retoChecked:()=>retoChecked,retoOkVal:()=>retoOkVal,retoOkAcc:()=>retoOkAcc,retoOkCon:()=>retoOkCon,
  retoSolved:()=>retoSolved,retoGood:()=>GOOD(retoSc()),retoExplain,
  quizCorrectIndex:()=>QUIZ[mode].opciones.findIndex(o=>o.ok),
  quizAnswer:answer,newSignal,
  solved:()=>solved,
};
