<style>
  :root{
    --bg:#08201C;--panel:rgba(9,26,23,.86);--line:#1E3A34;--ink:#EAF4F1;
    --dim:#8FB3AC;--accent:#2A9D8F;--accent2:#4FD1C5;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(10,13,18,.92),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

  .badge{position:fixed;top:16px;right:20px;z-index:20;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,209,102,.12);color:var(--hv);border:1px solid rgba(255,209,102,.35);padding:6px 12px;border-radius:20px}

  .hud{position:fixed;top:70px;left:18px;z-index:15;max-width:330px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-height:calc(100vh - 150px);overflow-y:auto}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .hud h2{font-size:19px;line-height:1.15;margin-bottom:9px}
  .hud p{font-size:13px;line-height:1.55;color:var(--dim);margin-bottom:10px}
  .hud .formula{font-family:var(--mono);color:var(--accent2);text-align:center;font-size:12.5px;margin:8px 0;padding:8px;background:rgba(0,0,0,.25);border-radius:8px;line-height:1.5}
  .hud .src{font-size:10.5px;color:#7a8894;font-style:italic;margin-top:4px;line-height:1.5}
  .legend{display:flex;flex-direction:column;gap:6px;margin:12px 0;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:10px}
  .legend .li{display:flex;align-items:center;gap:8px;font-size:11px;color:#c4d0da}
  .legend .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .fid{margin:10px 0 2px;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:10px;border:1px solid rgba(79,209,197,.18)}
  .fid .ft{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);margin-bottom:6px}
  .fid .fl{font-size:11px;color:#c4d0da;line-height:1.5;margin-bottom:5px}
  .fid .fl b{color:var(--ink)}
  .fid .fl.no b{color:var(--hv)}

  .panel{position:fixed;top:70px;right:18px;z-index:15;width:262px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:16px;max-height:calc(100vh - 150px);overflow-y:auto}
  .panel h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:2px 0 10px}
  .panel h4.sec{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .g{margin-bottom:6px}
  .gl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .gl b{color:var(--accent2)}
  .gl b.good{color:var(--good)}.gl b.warn{color:var(--hv)}.gl b.bad{color:var(--bad)}
  .modebar{display:flex;gap:5px;margin-bottom:8px}
  .modebar .b{flex:1;padding:8px 4px;font-size:11px}
  .btns{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .b{font-family:system-ui;font-size:12.5px;padding:10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#1b242f;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#202c38}
  .b.on{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:bold}
  .b.primary{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:bold}
  .b.auto{border-color:var(--hv);color:var(--hv);background:rgba(255,183,3,.10);font-weight:bold}
  .b.auto:hover{background:rgba(255,183,3,.18);border-color:var(--hv)}
  .b.auto:disabled{opacity:.6;cursor:default}
  .b.dx{text-align:left;font-size:12px}
  .b.dx.right{background:rgba(52,211,153,.18);border-color:var(--good);color:var(--good);font-weight:bold}
  .b.dx.wrong{background:rgba(244,71,94,.15);border-color:var(--bad);color:var(--bad)}
  .console{font-family:var(--mono);font-size:11px;line-height:1.55;color:#c4d0da;background:rgba(0,0,0,.28);border-radius:9px;padding:10px 12px;margin-bottom:8px;min-height:56px}
  .console .dtc{color:var(--bad);font-weight:bold}
  .console .ok{color:var(--good)}
  .console .mono{color:var(--dim)}

  .hint{position:fixed;bottom:18px;left:18px;z-index:14;font-family:var(--mono);font-size:10px;color:var(--dim);background:var(--panel);padding:7px 12px;border-radius:9px;border:1px solid var(--line)}
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(18,24,32,.95);border:1px solid var(--accent);padding:10px 20px;border-radius:40px;font-family:var(--mono);font-size:12px;opacity:0;transition:.3s;pointer-events:none;max-width:80vw;text-align:center}
  .toast.show{opacity:1}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}
  .soundBtn:hover{transform:scale(1.08)}
  .inspectHint{position:fixed;bottom:18px;right:18px;z-index:14;font-family:var(--mono);font-size:10px;color:var(--accent2);background:var(--panel);padding:7px 12px;border-radius:9px;border:1px solid var(--line)}

  @media(max-width:820px){
    .hud,.panel{position:fixed;left:8px;right:8px;top:auto;bottom:8px;max-width:none;width:auto;max-height:42vh;overflow-y:auto}
    .hud{bottom:calc(8px + 42vh + 8px)}
    .hint,.inspectHint{display:none}
  }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.26, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;
    }
    if(hook)hook(dt,t); controls.update();
    if(bokeh) bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);
    composer.render(); }
  function start(){ if(!raf)loop(); }
  function stop(){ cancelAnimationFrame(raf); raf=null; window.removeEventListener('resize',resize); }

  return { THREE, renderer, scene, camera, controls, composer, bloom,
    setAnimate:fn=>hook=fn, start, stop, resize, clock,
    flyTo:(v)=>{ controls.target.copy(v); }, moveTo, setCinematicIdle };
}

function pickerFor(scene,camera,dom,onHit){

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

// Arranque estrella-delta TEMPORIZADO visto desde el LADO DE CONTROL (D3 · digital). Motor verificado
// numéricamente (verify_stardelta.mjs, 38/38) y pegado aquí VERBATIM: simulación y verificación
// comparten implementación.
//   BASE DE TIEMPO: DT = 5 ms por ciclo de scan (idealizado, sin jitter).
//   CONTACTOR REAL: la BOBINA recibe la orden pero los CONTACTOS tardan t_cierre en cerrar y
//     t_apertura en abrir (incluye la extinción del arco). Esa diferencia es la que crea el SOLAPE.
//   SECUENCIA: KM1 = (Marcha ∨ KM1) ∧ /Paro (sello, MEC-83) · TON_Y(IN=KM1,PT=tY) → Qy ·
//     KMY = KM1 ∧ /Qy ∧ enclavamiento(KMΔ) · TON_W(IN=Qy,PT=tW) → Qw · KMΔ = KM1 ∧ Qw ∧ enclav.(KMY)
//   SOLAPE FÍSICO = max(0, t_apertura − t_cierre − tiempo muerto): si KMY sigue cerrado cuando KMΔ
//     cierra, se cortocircuitan dos fases. El enclavamiento por SOFTWARE no lo evita (sólo impide el
//     error de PROGRAMACIÓN); lo evita el tiempo muerto, y ante un contactor SOLDADO sólo lo evitan
//     los CONTACTOS ESPEJO (IEC 60947-4-1 Anexo F), que abren obligatoriamente si el principal no abre.
//   PICO DE RECONEXIÓN (transición abierta): durante el tiempo muerto el motor queda desenergizado; su
//     fem residual decae con T0 mientras su fase se desliza ⇒ el pico CRECE con el tiempo muerto. Por eso
//     el tiempo muerto óptimo es el MÁS CORTO que evita el solape, no "cuanto más, mejor".
//   Ref: IEC 61131-3 (temporizadores TON) · IEC 60947-4-1 (contactores; Anexo F, contactos espejo) ·
//        NMX-J-515-ANCE · Petruzella · Chapman, "Máquinas eléctricas" · verificación numérica propia.

// ===================== 1. ESCENA =====================
const mount=document.getElementById('stage');
const S=createStage(mount,{cam:[4.8,2.9,7.0],target:[0.4,1.05,0.3],bgTop:'#0d1017',bgBot:'#05060a',bloom:0.44,minD:3.2,maxD:16});

// ===================== 2. MOTOR (VERIFICADO 38/38 — VERBATIM) =====================
const DT=5; // ms por ciclo de scan
function newT(){return {et:0,q:false,prev:false};}
function stepTON(s,IN,pt,dt){
  if(!IN)s.et=0;
  else if(!s.prev)s.et=0;
  else if(s.et<pt)s.et=Math.min(pt,s.et+dt);
  s.q=IN&&s.et>=pt;
  s.prev=IN;return s.q;
}
// Contactor real: la BOBINA recibe la orden, los CONTACTOS tardan tOn en cerrar y tOff en abrir
// (tOff incluye la extinción del arco). 'stuck' = contacto principal soldado: cierra y ya no abre.
function newCtor(tOn,tOff){return {tOn,tOff,cmd:false,prev:false,closed:false,t:0,stuck:false};}
function stepCtor(c,cmd,dt){
  cmd=!!cmd;
  if(c.stuck&&c.closed){c.cmd=cmd;c.prev=cmd;c.t=0;return true;}
  if(cmd!==c.prev)c.t=0;                       // flanco: la cuenta arranca en 0
  else if(cmd&&!c.closed){c.t=Math.min(c.tOn,c.t+dt);if(c.t>=c.tOn)c.closed=true;}
  else if(!cmd&&c.closed){c.t=Math.min(c.tOff,c.t+dt);if(c.t>=c.tOff)c.closed=false;}
  else c.t=0;
  c.cmd=cmd;c.prev=cmd;return c.closed;
}
//  R1: KM1 = (Marcha v KM1) ^ /Paro                (sello, MEC-83)
//  R2: TON_Y (IN=KM1, PT=tY)  -> Qy
//  R3: KMY = KM1 ^ /Qy ^ enclavamiento(KMD)
//  R4: TON_W (IN=Qy, PT=tW)   -> Qw                (tiempo muerto de transición)
//  R5: KMD = KM1 ^ Qw ^ enclavamiento(KMY)
// enclavamiento: 'none' | 'soft' (lee la ORDEN de bobina) | 'aux' (lee el CONTACTO ESPEJO real)
function newStar(sc,fault){
  const s={M:false,ty:newT(),tw:newT(),
    km1:newCtor(sc.tOn,sc.tOff),kmy:newCtor(sc.tOn,sc.tOff),kmd:newCtor(sc.tOn,sc.tOff)};
  if(fault==='kmy')s.kmy.stuck=true;
  return s;
}
function starScan(s,Start,Stop,tY,tW,lock,dt){
  s.M=(!!Start||s.M)&&!Stop;
  const qy=stepTON(s.ty,s.M,tY,dt);
  const qw=stepTON(s.tw,qy,tW,dt);
  const lockY=lock==='aux'?!s.kmd.closed:lock==='soft'?!s.kmd.cmd:true;
  const lockD=lock==='aux'?!s.kmy.closed:lock==='soft'?!s.kmy.cmd:true;
  const cy=s.M&&!qy&&lockY;
  const cd=s.M&&qw&&lockD;
  stepCtor(s.km1,s.M,dt);stepCtor(s.kmy,cy,dt);stepCtor(s.kmd,cd,dt);
  return {M:s.M,qy,qw,cy,cd,k1:s.km1.closed,ky:s.kmy.closed,kd:s.kmd.closed};
}
// corre el arranque completo y MIDE los instantes (no los supone)
function runStar(sc,tY,tW,lock,fault,extraMs){
  const s=newStar(sc,fault);
  const total=tY+tW+(extraMs==null?600:extraMs);
  const n=Math.round(total/DT);
  const r={tCmdY0:-1,tOpenY:-1,tCmdD1:-1,tCloseD:-1,tCloseY:-1,overlapMs:0,tDelta:-1,stages:{}};
  let prev=null;
  for(let k=0;k<=n;k++){
    const v=starScan(s,k===0,false,tY,tW,lock,DT);
    const t=k*DT;
    if(prev){
      if(prev.cy&&!v.cy&&r.tCmdY0<0)r.tCmdY0=t;
      if(prev.ky&&!v.ky&&r.tOpenY<0)r.tOpenY=t;
      if(!prev.ky&&v.ky&&r.tCloseY<0)r.tCloseY=t;
      if(!prev.cd&&v.cd&&r.tCmdD1<0)r.tCmdD1=t;
      if(!prev.kd&&v.kd&&r.tCloseD<0)r.tCloseD=t;
    }
    if(v.ky&&v.kd)r.overlapMs+=DT;
    const st=!v.k1?'PARO':(v.ky&&v.kd)?'SOLAPE':v.ky?'ESTRELLA':v.kd?'DELTA':'TRANSICION';
    r.stages[st]=(r.stages[st]||0)+DT;
    if(st==='DELTA'&&r.tDelta<0)r.tDelta=t;
    prev=v;
  }
  return r;
}
// traza para la VISTA: la misma máquina de scan, devolviendo las muestras de la ventana [t0,t1]
function zoomStar(sc,tY,tW,lock,fault,t0,t1){
  const s=newStar(sc,fault);const out=[];const n=Math.round(t1/DT);
  for(let k=0;k<=n;k++){
    const v=starScan(s,k===0,false,tY,tW,lock,DT);const t=k*DT;
    if(t>=t0)out.push({t,M:v.M,cy:v.cy,cd:v.cd,k1:v.k1,ky:v.ky,kd:v.kd});
  }
  return out;
}
// deslizamiento durante el arranque en estrella (datos medidos del escenario: tau, sInf)
function slipAt(tYms,sc){return sc.sInf+(1-sc.sInf)*Math.exp(-(tYms/1000)/sc.tau);}
// pico de corriente al reconectar en delta tras una transición ABIERTA de tW ms
function peakIdx(tWms,sY,sc){
  const e=(1-sY)*Math.exp(-(tWms/1000)/sc.T0);
  const d=sY*2*Math.PI*sc.f*(tWms/1000);
  return sc.ILR*Math.sqrt(1+e*e-2*e*Math.cos(d));
}

  if(dash)c.setLineDash([5,4]);
  c.strokeStyle=col;c.lineWidth=2;c.beginPath();
  let py=z[0][key]?y-h:y;c.moveTo(sx(z[0].t),py);
  for(let i=1;i<z.length;i++){
    const yy=z[i][key]?y-h:y,xx=sx(z[i].t);
    if(yy!==py){c.lineTo(xx,py);c.lineTo(xx,yy);py=yy;}
  }
  c.lineTo(x+w,py);c.stroke();c.setLineDash([]);
}
// ---- eje de tiempo relativo (en ms) ----
function drawMsAxis(c,x,y,w,t0,t1,ref,step){
  c.strokeStyle='rgba(255,255,255,0.10)';c.lineWidth=1;
  c.fillStyle='#6b7280';c.font='10px Outfit, sans-serif';c.textAlign='center';
  for(let t=Math.ceil(t0/step)*step;t<=t1;t+=step){
    const xx=x+((t-t0)/(t1-t0))*w;
    c.beginPath();c.moveTo(xx,y);c.lineTo(xx,y+6);c.stroke();
    const d=t-ref;c.fillText((d>0?'+':'')+d,xx,y+18);
  }
}
// ---- barra horizontal ----
function drawBar(c,x,y,w,h,frac,label,col,right){
  c.fillStyle='#9fb0cf';c.font='12px Outfit, sans-serif';c.textAlign='left';c.fillText(label,x,y-8);
  c.fillStyle='rgba(255,255,255,0.06)';c.fillRect(x,y,w,h);
  c.fillStyle=hexA(col,0.75);c.fillRect(x,y,Math.max(0,Math.min(1,frac))*w,h);
  c.strokeStyle=hexA(ACC,0.3);c.lineWidth=1;c.strokeRect(x,y,w,h);
  c.fillStyle=col;c.font='bold 13px Outfit, sans-serif';c.textAlign='right';c.fillText(right,x+w,y-8);
}
// ---- curva XY genérica ----
function drawXY(c,x,y,w,h,pts,xMax,yMax,col,fill){
  c.strokeStyle=col;c.lineWidth=2;c.beginPath();
  pts.forEach((p,i)=>{const xx=x+(p[0]/xMax)*w,yy=y+h-(Math.min(p[1],yMax)/yMax)*h;if(i)c.lineTo(xx,yy);else c.moveTo(xx,yy);});
  c.stroke();
  if(fill){
    c.lineTo(x+w,y+h);c.lineTo(x,y+h);c.closePath();c.fillStyle=hexA(col,0.14);c.fill();
  }
}
function axes(c,x,y,w,h,xl,yl){
  c.strokeStyle='rgba(255,255,255,0.16)';c.lineWidth=1;
  c.beginPath();c.moveTo(x,y);c.lineTo(x,y+h);c.lineTo(x+w,y+h);c.stroke();
  c.fillStyle='#7a8494';c.font='11px Outfit, sans-serif';
  c.textAlign='right';c.fillText(xl,x+w,y+h+18);
  c.textAlign='left';c.fillText(yl,x,y-8);
}

  c.fillStyle=expCmd?OK_HEX:'#9fb0cf';c.font='bold 13px Outfit, sans-serif';c.textAlign='left';

  const lag=expLag();

  c.fillStyle='#6b7280';c.font='11px Outfit, sans-serif';

}

function drawAplica(c){
  const sc=POOL[apIdx];
  if(apTopic==='transicion')return drawTransicion(c,sc);

  wrapText(c,'Ventana de '+fmtMs(t1-t0)+' alrededor del instante en que el temporizador de estrella cumple su preselección. Línea PUNTEADA = orden que escribe el PLC; línea CONTINUA = estado real del contacto.',30,80,640,20);

  const wx=30,ww=640;

  rpanel(c,PX.x,PX.y,PX.w,290,'INSTANTES MEDIDOS');

}

function drawSolape(c,sc){
  const sY=sYref(sc);
  c.fillStyle='#F4EFEA';c.font='bold 26px Outfit, sans-serif';c.textAlign='left';
  c.fillText('Tiempo muerto: dos males opuestos',30,54);
  c.fillStyle='#8f97a5';c.font='14px Outfit, sans-serif';
  wrapText(c,'Si el tiempo muerto es corto, los contactores se solapan y cortocircuitan dos fases. Si es largo, el motor se queda desenergizado, su fem residual se desfasa y al reconectar aparece un pico de corriente MAYOR. No hay un "cuanto más, mejor".',30,80,640,20);

  const gx=70,gy=180,gw=560,gh=150;
  const umbral=sc.tOff-sc.tOn;
  // solape vs tiempo muerto
  const ptsO=[];for(let w=0;w<=100;w+=5)ptsO.push([w,runStar(sc,3000,w,'none',null).overlapMs]);
  const yMaxO=Math.max(20,umbral+10);
  axes(c,gx,gy,gw,gh,'tiempo muerto (ms)','solape (ms)');
  drawXY(c,gx,gy,gw,gh,ptsO,100,yMaxO,BAD_HEX,true);
  // marca del umbral
  const ux=gx+(umbral/100)*gw;
  c.strokeStyle=hexA(WARN_HEX,0.8);c.lineWidth=1;c.setLineDash([4,4]);
  c.beginPath();c.moveTo(ux,gy);c.lineTo(ux,gy+gh);c.stroke();c.setLineDash([]);
  c.fillStyle=WARN_HEX;c.font='bold 12px Outfit, sans-serif';c.textAlign='left';
  c.fillText('umbral = t_ap − t_ci = '+fmtMs(umbral),ux+6,gy+16);
  c.fillStyle='#6b7280';c.font='10px Outfit, sans-serif';c.textAlign='center';
  for(let w=0;w<=100;w+=20)c.fillText(String(w),gx+(w/100)*gw,gy+gh+16);

  // pico vs tiempo muerto
  const gy2=420;
  const ptsP=[];for(let w=0;w<=100;w+=5)ptsP.push([w,peakIdx(w,sY,sc)]);
  const tPi=tOpos(sY,sc), pMax=tPeakMax(sY,sc);
  const yMaxP=Math.max(Math.ceil(sc.ILR),Math.ceil(Math.max.apply(null,ptsP.map(p=>p[1]))+0.5));
  axes(c,gx,gy2,gw,gh,'tiempo muerto (ms)','pico de reconexión (× I nominal)');
  drawXY(c,gx,gy2,gw,gh,ptsP,100,yMaxP,VIO,true);
  // referencia: corriente de arranque en estrella = ILR/3
  const yr=gy2+gh-((sc.ILR/3)/yMaxP)*gh;
  c.strokeStyle=hexA(OK_HEX,0.7);c.lineWidth=1;c.setLineDash([4,4]);
  c.beginPath();c.moveTo(gx,yr);c.lineTo(gx+gw,yr);c.stroke();c.setLineDash([]);
  c.fillStyle=OK_HEX;c.font='bold 12px Outfit, sans-serif';c.textAlign='left';
  c.fillText('corriente de arranque en estrella ≈ I_rb/3 = '+(sc.ILR/3).toFixed(1)+'×',gx+8,yr-6);
  c.fillStyle='#6b7280';c.font='10px Outfit, sans-serif';c.textAlign='center';
  for(let w=0;w<=100;w+=20)c.fillText(String(w),gx+(w/100)*gw,gy2+gh+16);
  c.beginPath();c.moveTo(ux,gy2);c.lineTo(ux,gy2+gh);c.strokeStyle=hexA(WARN_HEX,0.5);c.setLineDash([4,4]);c.stroke();c.setLineDash([]);
  if(pMax.t<=100){
    const px2=gx+(pMax.t/100)*gw;
    c.strokeStyle=hexA(VIO,0.8);c.lineWidth=1;c.setLineDash([3,3]);
    c.beginPath();c.moveTo(px2,gy2);c.lineTo(px2,gy2+gh);c.stroke();c.setLineDash([]);
    c.fillStyle=VIO;c.font='bold 11px Outfit, sans-serif';c.textAlign='right';
    c.fillText('máximo ('+pMax.p.toFixed(1)+'×)',px2-6,gy2+16);
  }
  // zona de ajuste real del arrancador (0-60 ms): ahi la curva sube siempre
  c.fillStyle=hexA(VIO,0.07);c.fillRect(gx,gy2,(60/100)*gw,gh);
  c.fillStyle='#7a8494';c.font='10px Outfit, sans-serif';c.textAlign='left';
  c.fillText('rango de ajuste (0–60 ms)',gx+6,gy2+gh-6);

  const minW=OPT_TW.filter(w=>runStar(sc,3000,w,'none',null).overlapMs===0);
  const best=minW.length?Math.min.apply(null,minW):null;
  rpanel(c,PX.x,PX.y,PX.w,210,'COMPROMISO');
  prow(c,PX.x,PX.y+52,PX.w,'t_cierre',fmtMs(sc.tOn),ACC);
  prow(c,PX.x,PX.y+84,PX.w,'t_apertura',fmtMs(sc.tOff),VIO);
  prow(c,PX.x,PX.y+116,PX.w,'Umbral de solape',fmtMs(umbral),WARN_HEX);
  prow(c,PX.x,PX.y+148,PX.w,'Mínimo válido',best==null?'—':fmtMs(best),OK_HEX);
  prow(c,PX.x,PX.y+180,PX.w,'Pico a ese t. muerto',best==null?'—':peakIdx(best,sY,sc).toFixed(2)+'×',VIO);
  const by=PX.y+230;
  c.fillStyle='rgba(0,0,0,0.22)';c.fillRect(PX.x,by,PX.w,320);
  c.strokeStyle=hexA(ACC,0.35);c.lineWidth=1;c.strokeRect(PX.x,by,PX.w,320);
  c.fillStyle=ACC;c.font='bold 15px Outfit, sans-serif';c.textAlign='left';
  c.fillText('Regla de diseño',PX.x+14,by+26);
  c.fillStyle='#C9D3E2';c.font='12px Outfit, sans-serif';
  wrapText(c,'El tiempo muerto correcto es el MÁS CORTO que anula el solape. El de arriba baja hasta cero en '+fmtMs(umbral)+'; el de abajo no deja de crecer en todo el rango de ajuste (0–60 ms). Cualquier milisegundo de más sólo empeora el pico.',PX.x+14,by+52,PX.w-28,18);
  c.fillStyle='#C9D3E2';
  wrapText(c,'El pico llega a su MÁXIMO a los '+fmtMs(Math.round(pMax.t))+' —justo antes de la oposición de fase, δ = 180° a los '+fmtMs(Math.round(tPi))+', porque la fem residual sigue decayendo mientras gira—: ahí vale '+pMax.p.toFixed(2)+'×, más que un arranque directo. Pasado ese punto baja, pero ningún arrancador trabaja tan lejos.',PX.x+14,by+106,PX.w-28,17);
  c.fillStyle='#7a8494';
  wrapText(c,'Esto es propio de la transición ABIERTA (la clásica de tres contactores). La transición CERRADA, con resistencias de transición y un cuarto contactor, evita desenergizar el motor —y este pico— a cambio de más equipo.',PX.x+14,by+160,PX.w-28,17);
  c.fillStyle='#6b7280';c.font='11px Outfit, sans-serif';
  wrapText(c,'Pico calculado con la fem residual decayendo con T0 = '+sc.T0.toFixed(2)+' s y desfase a s·2πf con s = '+pct(sY)+'.',PX.x+14,by+270,PX.w-28,16);
}

function drawFalla(c,sc){
  c.fillStyle='#F4EFEA';c.font='bold 26px Outfit, sans-serif';c.textAlign='left';

function retoExplain(){
  const sc=POOL[retoIdx];
  if(retoSolved){
    const best=OPT_TW.filter(w=>okW(w,sc))[0];
    return 'Ajuste correcto: '+fmtS(retoCh.ty)+' en estrella dejan el deslizamiento en '+pct(slipAt(retoCh.ty,sc))+' (≤ '+pct(sc.sMax)+') sin alargar de más; '+fmtMs(best)+' de tiempo muerto cubren la ventana de '+fmtMs(sc.tOff-sc.tOn)+' con el menor pico de reconexión; y los contactos espejo son el único enclavamiento que sigue impidiendo el cortocircuito cuando KMY se suelda (IEC 60947-4-1, Anexo F).';
  }
  let s='';
  if(!retoOkY){
    const s1=slipAt(retoCh.ty,sc);
    if(s1>sc.sMax)s+='Tiempo en estrella: a los '+fmtS(retoCh.ty)+' el deslizamiento aún es '+pct(s1)+', por encima del máximo de '+pct(sc.sMax)+'; el motor no ha acelerado lo suficiente y conmutar ahí da un tirón de corriente. ';
    else{const mn=OPT_TY.filter(v=>okY(v,sc))[0];s+='Tiempo en estrella: a los '+fmtS(retoCh.ty)+' el deslizamiento ya es '+pct(s1)+', pero con '+fmtS(mn)+' ya estaba por debajo de '+pct(sc.sMax)+'; alargar la estrella no da más par y sí calienta el bobinado. ';}
  }
  if(!retoOkW){
    const ov=runStar(sc,3000,retoCh.tw,'none',null).overlapMs;
    if(ov>0)s+='Tiempo muerto: con '+fmtMs(retoCh.tw)+' quedan '+fmtMs(ov)+' en los que KMY y KMΔ están cerrados a la vez (cortocircuito entre fases); hace falta cubrir '+fmtMs(sc.tOff-sc.tOn)+'. ';
    else{const mn=OPT_TW.filter(w=>okW(w,sc))[0];s+='Tiempo muerto: '+fmtMs(retoCh.tw)+' evita el solape, pero '+fmtMs(mn)+' ya bastaba; cada milisegundo de más aumenta el pico de reconexión (el pico pasa de '+peakIdx(mn,sYref(sc),sc).toFixed(2)+'× a '+peakIdx(retoCh.tw,sYref(sc),sc).toFixed(2)+'×). ';}
  }
  if(!retoOkL){
    const r=runStar(sc,3000,retoCh.tw,retoCh.lock,'kmy');
    s+='Enclavamiento: en el ensayo con KMY soldado, "'+LOCK_NAME[retoCh.lock]+'" deja '+fmtMs(r.overlapMs)+' de solape, porque '+(retoCh.lock==='soft'?'sólo lee una variable interna del PLC, no el contacto real':'nada impide que la orden de KMΔ salga')+'. ';
  }
  return s||'Revisa el ajuste.';
}

// fotogramas derivados de la corrida MEDIDA (no escritos a mano)
function seqFrames(sc,tY,tW,lock,fault){
  const r=runStar(sc,tY,tW,lock,fault);
  const fr=[{label:'PARO',acts:[0,0,0,0],accept:false,spin:0},
            {label:'ARRANQUE',acts:[1,0,0,0],accept:false,spin:0}];
  fr.push({label:'ESTRELLA',acts:[1,1,0,0],accept:true,spin:1.4});
  fr.push({label:'ESTRELLA',acts:[1,1,0,0],accept:true,spin:2.2});
  if(r.overlapMs>0)fr.push({label:'SOLAPE',acts:[1,1,1,1],accept:false,bad:true,spin:0.6});
  else fr.push({label:'TRANSICION',acts:[1,0,0,0],accept:false,spin:2.4});
  if(r.tCloseD>=0)fr.push({label:'DELTA',acts:[1,0,1,0],accept:true,spin:4.2});
  else fr.push({label:'BLOQUEADO',acts:[1,1,0,1],accept:false,bad:true,spin:1.0});
  return fr;
}
function hwFrames(){
  if(mode==='reto')return seqFrames(POOL[retoIdx],retoCh.ty,retoCh.tw,retoCh.lock,null);
  if(mode==='aplica')return seqFrames(POOL[apIdx],apTopic==='transicion'?apTY:3000,apTW,apLock,apTopic==='falla'?'kmy':null);
  if(!expHist.length)return [{label:'EN REPOSO',acts:[0,0,0,0],accept:false,spin:0}];
  return expHist.map(h=>({label:h.closed?'CERRADO':(h.cmd?'CERRANDO':'ABIERTO'),acts:[h.cmd?1:0,h.closed?1:0,0,(h.cmd!==h.closed)?1:0],accept:h.closed,spin:0}));
}
function hwCount(){return Math.max(1,hwFrames().length);}
function updateHW(){
  const frames=hwFrames(),step=hwStep%Math.max(1,frames.length),fr=frames[step]||{label:'—',acts:[0,0,0,0]};
  actLEDs.forEach((l,i)=>{const on=fr.acts&&fr.acts[i];l.material.emissiveIntensity=on?1.4:0.12;});
  clkLED.material.emissiveIntensity=(step%2)?1.3:0.2;
  motorSpin=fr.spin||0;
  drawChip3D(fr.label,!!fr.accept,!!fr.bad);
}

  que escribe el PLC y el <b>estado real del contacto</b> no son lo mismo: la bobina obedece en un scan pero
  el metal tarda <b>t_cierre</b> en cerrar y <b>t_apertura</b> en abrir. Si KMΔ cierra antes de que KMY
  termine de abrir, dos fases quedan cortocircuitadas. Verás por qué el enclavamiento por software
  <b>no</b> evita eso, por qué el tiempo muerto correcto es el <b>más corto</b> que lo evita, y por qué sólo
  los <b>contactos espejo</b> siguen protegiendo cuando un contactor se suelda.</p>
  <div class="formula">solape = máx(0, t_apertura − t_cierre − t_muerto) · KMY = KM1 ∧ /Q_Y ∧ /KMΔ · KMΔ = KM1 ∧ Q_W ∧ /KMY · scan = ${DT} ms</div>
  <div class="legend">
    <div class="li"><span class="dot" style="background:#8AB4F8"></span>Orden de bobina (PLC)</div>
    <div class="li"><span class="dot" style="background:#7CD992"></span>Contacto KMY cerrado</div>
    <div class="li"><span class="dot" style="background:#C08CF8"></span>Contacto KMΔ cerrado</div>
    <div class="li"><span class="dot" style="background:#ff6b6b"></span>Solape = cortocircuito</div>
  </div>
  <div class="fid">
    <div class="ft">🔒 Contrato de fidelidad</div>
    <div class="fl"><b>Sí modela:</b> la lógica de maniobra completa sobre una base de scan idealizada de ${DT} ms — sello de marcha/paro de KM1, TON de tiempo de estrella, TON de tiempo muerto, enclavamiento en sus tres variantes (ninguno, por software leyendo la orden de bobina, y por contactos espejo leyendo el contacto real) — y un modelo de contactor con <b>tiempos de operación</b> de catálogo: la orden cambia en un scan pero los contactos cierran en t_cierre y abren en t_apertura, con la posibilidad de <b>soldadura</b> del contacto principal. De ahí se MIDE (no se supone) el instante de cada maniobra y el solape físico, que resulta ser máx(0, t_apertura − t_cierre − t_muerto). Además, la evolución del deslizamiento durante la estrella con constante de tiempo mecánica, y el pico de reconexión de una transición ABIERTA como fasor entre la red y la fem residual que decae con T0 mientras se desfasa a s·2πf. Verificado numéricamente (38/38), incluida la unicidad de la solución del Reto en sus cuatro escenarios.</div>
    <div class="fl no"><b>NO modela:</b> las corrientes y pares reales del motor en estrella y en delta ni sus curvas par-velocidad (eso es MEC-50); el transitorio electromagnético del bobinado ni la saturación; el arco eléctrico, su energía ni el desgaste de los contactos; el rebote de los contactos al cerrar; la dispersión real de los tiempos de operación con la tensión de bobina y la temperatura; la transición CERRADA con resistencias ni el arrancador de tres bobinas con transición Wauchope; el relé térmico, su curva y su ubicación en el circuito; la caída de tensión de la red durante el arranque; el jitter del ciclo de scan; y el cableado real de potencia con sus secciones y protecciones (eso es MEC-74).</div>
  </div>
  <div class="src">Ref: IEC 61131-3 (temporizadores TON) · IEC 60947-4-1 y su Anexo F (contactores; contactos espejo) · NMX-J-515-ANCE · Chapman, Máquinas eléctricas · Petruzella, Programmable Logic Controllers · Verificación numérica propia (38/38)</div>`;

function buildQuiz(){
  QUIZ={
    explora:{
      pregunta:'¿Por qué hay que programar un tiempo muerto entre quitar la orden a KMY y darle la orden a KMΔ?',
      opciones:[
        {t:'Porque el contacto de KMY sigue cerrado t_apertura después de que la bobina se desenergiza, y si KMΔ cierra antes (en t_cierre) los dos coinciden y cortocircuitan dos fases.',ok:true,why:'Correcto. La ventana de peligro dura exactamente t_apertura − t_cierre, y el tiempo muerto es lo que la cubre.'},
        {t:'Para que el motor tenga tiempo de acelerar antes de pasar a delta.',ok:false,why:'De eso se encarga el TIEMPO EN ESTRELLA, que dura segundos. El tiempo muerto son decenas de milisegundos: en ese lapso el motor apenas cambia de velocidad, sólo se desenergiza.'},
        {t:'Porque el PLC necesita varios ciclos de scan para escribir dos salidas distintas.',ok:false,why:'No: el PLC escribe todas las salidas en el mismo scan sin problema. El retraso no está en el programa, está en la mecánica del contactor.'},
        {t:'Para que el relé térmico tenga tiempo de reponerse entre las dos conexiones.',ok:false,why:'El relé térmico no interviene en la conmutación; su constante de tiempo es de segundos o minutos y vigila la sobrecarga sostenida, no la maniobra.'},
      ],
    },
    aplica:{
      pregunta:'Si el tiempo muerto evita el solape, ¿por qué no se pone directamente muy largo (por ejemplo 200 ms) y así se está sobrado?',
      opciones:[
        {t:'Porque durante el tiempo muerto el motor queda desenergizado: su fem residual decae y se desfasa respecto de la red, de modo que el pico de corriente al reconectar en delta CRECE con el tiempo muerto.',ok:true,why:'Correcto. Es el defecto de la transición abierta. Por eso el tiempo muerto de diseño es el más corto que ya evita el solape.'},
        {t:'Porque los temporizadores TON de un PLC no admiten preselecciones tan pequeñas como 200 ms.',ok:false,why:'Sí las admiten: la resolución práctica es el tiempo de scan, de unos pocos milisegundos. La limitación no es el temporizador.'},
        {t:'Porque un tiempo muerto largo dispara el enclavamiento por software.',ok:false,why:'El enclavamiento no es un temporizador ni "se dispara" por el tiempo: sólo condiciona una bobina al estado de la otra.'},
        {t:'Porque el motor se pararía por completo en esos 200 ms.',ok:false,why:'No se para: la inercia es mucho mayor que eso. Lo que sí ocurre es que su fem residual se desfasa de la red, y ése es el problema real.'},
      ],
    },
    reto:{
      pregunta:'Ensayo de aceptación: se suelda el contacto principal de KMY. ¿Qué protección impide el cortocircuito entre fases?',
      opciones:[
        {t:'Los contactos espejo (IEC 60947-4-1, Anexo F): un auxiliar NC que por construcción no puede estar cerrado a la vez que el principal NA, así que la bobina de KMΔ nunca se energiza.',ok:true,why:'Correcto. Es la única de las tres que se entera de lo que hace el metal, porque la garantía está en el aparato y no en el programa.'},
        {t:'El enclavamiento por software, que impide que el programa mande las dos bobinas a la vez.',ok:false,why:'Ese enclavamiento sólo lee variables internas del PLC. Con KMY soldado, la orden de KMY ya está en 0 y el software da permiso a KMΔ… mientras el contacto sigue cerrado.'},
        {t:'Un tiempo muerto suficientemente largo.',ok:false,why:'El tiempo muerto cubre el tiempo de apertura NORMAL. Un contacto soldado no abre nunca, así que ningún tiempo lo arregla.'},
        {t:'El relé térmico, que detecta la sobrecorriente del cortocircuito y desconecta.',ok:false,why:'El térmico actúa DESPUÉS y con retardo; no impide el cortocircuito, y para un corto franco la protección adecuada es el fusible o el magnético. Aquí buscamos evitar que ocurra, no despejarlo.'},
      ],
    },
  };
  Object.values(QUIZ).forEach(q=>{for(let i=q.opciones.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const tmp=q.opciones[i];q.opciones[i]=q.opciones[j];q.opciones[j]=tmp;}});
}
function clearDx(){const box=el('dxbtns');if(box)box.innerHTML='';}
function refreshQuestion(){
  const q=QUIZ[mode];if(!q)return;
  el('q_text').textContent=q.pregunta;
  const box=el('dxbtns');
  box.innerHTML=q.opciones.map((o,i)=>`<button class="b sm" data-i="${i}">${String.fromCharCode(65+i)}) ${o.t}</button>`).join('');
  box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(parseInt(b.dataset.i,10)));
}
function answer(i){
  const q=QUIZ[mode];if(!q)return;
  const box=el('dxbtns'),btns=box.querySelectorAll('[data-i]');
  if(!btns.length||btns[0].disabled)return;
  const o=q.opciones[i];btns.forEach(b=>b.disabled=true);btns[i].classList.add(o.ok?'right':'wrong');
  if(o.ok){synth.beep(1046,0.12,0.06);}else{synth.beep(220,0.15,0.06);}
  showToast((o.ok?'✔ ':'✗ ')+o.why);
}

// ===================== 14. PICKING Y HOVER =====================
pickerFor(scene,S.camera,S.renderer.domElement,hit=>{
  if(!hit)return;
  if(hit.object===board){boardClick();return;}
  let o=hit.object;while(o){if(o.userData&&o.userData.title){showToast('<b>'+o.userData.title+'</b><br>'+(o.userData.info||''));return;}o=o.parent;}
});
(function hoverLoop(){
  const ray=new THREE.Raycaster(),dom=S.renderer.domElement;let mx=0,my=0;
  dom.addEventListener('pointermove',e=>{const r=dom.getBoundingClientRect();mx=((e.clientX-r.left)/r.width)*2-1;my=-((e.clientY-r.top)/r.height)*2+1;});
  function tick(){
    ray.setFromCamera({x:mx,y:my},S.camera);let hovered=false;
    for(const [obj,spr] of HOVER_LABELS){if(!obj.visible){spr.visible=false;continue;}const on=ray.intersectObject(obj,true).length>0;spr.visible=on;if(on)hovered=true;}
    dom.style.cursor=hovered?'pointer':'default';requestAnimationFrame(tick);
  }
  tick();
})();

// ===================== 15. RECORRIDO AUTOMÁTICO =====================
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function runAuto(){
  if(autoRunning)return;autoRunning=true;
  const btn=el('btnAuto'),label=btn.textContent;btn.disabled=true;btn.classList.add('on');btn.textContent='⏳ Recorriendo…';
  try{
    synth.init();synth.resume();clearDx();
    setMode('explora');
    expIdx=1;expReset();afterEdit();
    showToast('🔧 Contactor del compresor: t_cierre = 20 ms (4 scans de movimiento), t_apertura = 55 ms (11 scans).');
    await sleep(3400);
    for(let k=0;k<5;k++){expScan(true);afterEdit();await sleep(320);}
    showToast('▶ Los contactos cerraron en la quinta pulsación, no en la primera: la bobina obedece antes que el metal.');
    await sleep(3400);
    for(let k=0;k<12;k++){expScan(false);afterEdit();await sleep(260);}
    showToast('⏹ Al quitar la orden tardaron 11 scans (55 ms) en abrir. La diferencia —35 ms— es la ventana de cortocircuito.');
    await sleep(3600);
    answer(QUIZ[mode].opciones.findIndex(o=>o.ok));await sleep(2600);

    setMode('aplica');
    apIdx=1;apTopic='transicion';apTY=3000;apTW=0;apLock='none';afterEdit();
    showToast('🧩 Conmutación sin tiempo muerto: KMΔ cierra mientras KMY sigue cerrado. Solape = cortocircuito.');
    await sleep(4600);
    apLock='soft';afterEdit();
    showToast('🔁 Con enclavamiento por software el solape casi no baja: el PLC sólo lee sus propias variables.');
    await sleep(4400);
    apTW=40;apLock='none';afterEdit();
    showToast('✔ Con 40 ms de tiempo muerto la transición queda limpia, sin ayuda de ningún enclavamiento.');
    await sleep(4200);
    apTopic='solape';afterEdit();
    showToast('⚖ Pero el pico de reconexión crece con el tiempo muerto: el óptimo es el MÁS CORTO que evita el solape.');
    await sleep(4800);
    apTopic='falla';apTW=60;afterEdit();
    showToast('⚠ Ahora KMY soldado. Ni el tiempo muerto ni el software salvan la instalación: sólo el contacto espejo.');
    await sleep(4800);
    answer(QUIZ[mode].opciones.findIndex(o=>o.ok));await sleep(2600);

    setMode('reto');
    seedReto(0);updateRetoSpec();afterEdit();
    showToast('🎯 Reto: la bomba centrífuga. Comprobamos primero el ajuste de partida, que está mal a propósito…');
    await sleep(3400);
    checkReto();
    showToast('…estrella demasiado larga, sin tiempo muerto y sin enclavamiento. Lo corregimos.');
    await sleep(4000);
    const sc=POOL[retoIdx];
    retoCh={ty:OPT_TY.filter(v=>okY(v,sc))[0],tw:OPT_TW.filter(w=>okW(w,sc))[0],lock:'aux'};
    retoChecked=false;retoSolved=false;afterEdit();
    showToast('✔ El tiempo de estrella más corto que ya cumple el deslizamiento, el tiempo muerto mínimo y contactos espejo.');
    await sleep(3000);
    checkReto();await sleep(2400);
    answer(QUIZ[mode].opciones.findIndex(o=>o.ok));
  }finally{
    btn.disabled=false;btn.classList.remove('on');btn.textContent=label;autoRunning=false;
  }
}

// ===================== 16. ANIMACIÓN, EVENTOS E INICIO =====================
S.setAnimate((dt,time)=>{
  hwT+=dt;
  if(hwT>0.7){hwT=0;hwStep=(hwStep+1)%hwCount();updateHW();}
  rotAng+=dt*motorSpin;
  shaft.rotation.x=rotAng;fan.rotation.x=rotAng;
});
['explora','aplica','reto'].forEach(m=>{el('m_'+m).onclick=()=>{if(!autoRunning)setMode(m);};});
el('btnAuto').onclick=()=>{if(!autoRunning)runAuto();};
el('btnNew').onclick=()=>{if(autoRunning)return;newSignal();};
el('btnCheck').onclick=()=>{if(autoRunning)return;checkReto();};
const soundBtn=el('soundBtn');if(soundBtn){soundBtn.onclick=()=>{synth.toggle();soundBtn.textContent=synth.isOn()?'🔊':'🔇';};}
document.addEventListener('pointerdown',()=>{synth.init();synth.resume();},{once:true});

buildQuiz();
S.start();
setMode('explora');

// ===================== DEBUG HOOK =====================
window.__labDebug={
  mode:()=>mode, setMode:k=>setMode(k),
  DT, OPT_TY, OPT_TW, OPT_LOCK, POOL,
  // motor
  newT,stepTON,newCtor,stepCtor,newStar,starScan,runStar,zoomStar,slipAt,peakIdx,okY,okW,okLock,tYref,sYref,tOpos,tPeakMax,
  // explora
  expIdx:()=>expIdx, setExpIdx:i=>{expIdx=i;expReset();afterEdit();},
  expScan:v=>{expScan(!!v);afterEdit();},
  expReset:()=>{expReset();afterEdit();},
  expInfo:()=>({idx:expIdx,cmd:expCmd,closed:expC.closed,t:expC.t,scans:expHist.length,lag:expLag()}),
  expTrace:()=>expHist.map(h=>({t:h.t,cmd:h.cmd,closed:h.closed})),
  // aplica
  apTopic:()=>apTopic, setApTopic:k=>{apTopic=k;afterEdit();},
  apIdx:()=>apIdx, setApIdx:i=>{apIdx=i;afterEdit();},
  apTY:()=>apTY, setApTY:v=>{apTY=v;afterEdit();},
  apTW:()=>apTW, setApTW:v=>{apTW=v;afterEdit();},
  apLock:()=>apLock, setApLock:v=>{apLock=v;afterEdit();},
  apRun:()=>runStar(POOL[apIdx],apTY,apTW,apLock,null),
  apFault:lock=>runStar(POOL[apIdx],3000,apTW,lock,'kmy'),
  // reto
  retoIdx:()=>retoIdx, seedReto:i=>{seedReto(i);updateRetoSpec();afterEdit();},
  retoName:()=>POOL[retoIdx].name,
  retoSpec:()=>{const p=POOL[retoIdx];return {name:p.name,tOn:p.tOn,tOff:p.tOff,sMax:p.sMax,umbral:p.tOff-p.tOn};},
  retoGet:()=>({...retoCh}),
  retoSet:(f,v)=>{retoSet(f,v);afterEdit();},
  retoSolveBuild:()=>{const sc=POOL[retoIdx];retoCh={ty:OPT_TY.filter(v=>okY(v,sc))[0],tw:OPT_TW.filter(w=>okW(w,sc))[0],lock:'aux'};retoChecked=false;retoSolved=false;afterEdit();},
  checkReto:()=>checkReto(),
  retoChecked:()=>retoChecked, retoOkY:()=>retoOkY, retoOkW:()=>retoOkW, retoOkL:()=>retoOkL, retoSolved:()=>retoSolved,
  // quiz / general
  quizCorrectIndex:()=>{const q=QUIZ[mode];return q?q.opciones.findIndex(o=>o.ok):-1;},
  quizAnswer:i=>answer(i),
  newSignal:()=>newSignal(),
  solved:()=>solved,
};
