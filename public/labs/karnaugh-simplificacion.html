<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.26, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;
    }
    if(hook)hook(dt,t); controls.update();
    if(bokeh) bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);
    composer.render(); }
  function start(){ if(!raf)loop(); }
  function stop(){ cancelAnimationFrame(raf); raf=null; window.removeEventListener('resize',resize); }

  return { THREE, renderer, scene, camera, controls, composer, bloom,
    setAnimate:fn=>hook=fn, start, stop, resize, clock,
    flyTo:(v)=>{ controls.target.copy(v); }, moveTo, setCinematicIdle };
}

function pickerFor(scene,camera,dom,onHit){

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

// Síntesis de funciones lógicas y simplificación con mapas de Karnaugh (D3 · digital).
// Física (verificada node -e, 1200/1200 vs fuerza bruta):
//   Una función lógica de n variables queda definida por su TABLA DE VERDAD (para cada una de las 2^n
//   combinaciones de entrada, la salida F vale 0 o 1). Los "1" de la tabla son los MINTÉRMINOS.
//   · FORMA CANÓNICA (suma de mintérminos, SOP): un producto por cada 1, con las n variables → mucha lógica.
//   · MAPA DE KARNAOUGH: reacomoda la tabla en una rejilla con código Gray (celdas vecinas difieren en UN
//     solo bit). Agrupar 2^k unos adyacentes elimina k variables (las que cambian dentro del grupo).
//   · SIMPLIFICACIÓN MÍNIMA: el mínimo coste (literales) se obtiene con implicantes primos (Quine-McCluskey)
//     y una cobertura exacta de coste mínimo. Coste de un término = n − (variables eliminadas).
//   COSTE en compuertas (realización AND-OR de 2 niveles): un AND por cada producto de ≥2 literales,
//     un OR si hay ≥2 términos; los inversores cuentan por variable complementada distinta.
//   HONESTIDAD: no toda función simplifica. La paridad impar (XOR de 3+ variables) no tiene celdas
//     adyacentes agrupables → su forma mínima es la canónica (ningún ahorro). El simulador lo muestra.
//   Ref: IEEE Std 91-1984 (símbolos lógicos) · Mano & Ciletti, "Diseño Digital" · Wakerly, "Digital Design"
//        · Quine (1952) / McCluskey (1956), minimización de funciones booleanas · verificación numérica propia.

// ===================== 2. FÍSICA (motor de minimización — VERIFICADO) =====================
const VN=['A','B','C','D'];
function popcount(x){let c=0;while(x){c+=x&1;x>>=1;}return c;}
function combine(a,b){if(a.mask!==b.mask)return null;const d=a.bits^b.bits;if(d&&(d&(d-1))===0)return{bits:a.bits&~d,mask:a.mask|d};return null;}
function covers(imp,m){return (m&~imp.mask)===imp.bits;}
function primeImplicants(minterms,dc){
  const all=[...new Set([...minterms,...(dc||[])])];
  let groups=all.map(m=>({bits:m,mask:0}));
  const primes=[],seen=new Set();const key=i=>i.bits+'/'+i.mask;
  while(groups.length){
    const used=new Array(groups.length).fill(false);const next=[],nseen=new Set();
    for(let i=0;i<groups.length;i++)for(let j=i+1;j<groups.length;j++){
      const c=combine(groups[i],groups[j]);
      if(c){used[i]=used[j]=true;const k=key(c);if(!nseen.has(k)){nseen.add(k);next.push(c);}}}
    for(let i=0;i<groups.length;i++)if(!used[i]){const k=key(groups[i]);if(!seen.has(k)){seen.add(k);primes.push(groups[i]);}}
    groups=next;
  }
  return primes;
}
function litCost(imp,n){return n-popcount(imp.mask);}
function minimize(minterms,n,dc){
  const MT=[...new Set(minterms)].sort((a,b)=>a-b);
  if(MT.length===0)return{terms:[],cost:0,nterms:0,special:'0'};
  const full=1<<n;
  if(MT.length===full)return{terms:[{bits:0,mask:full-1}],cost:0,nterms:1,special:'1'};
  const primes=primeImplicants(MT,dc);
  const P=primes.length, need=(1<<MT.length)-1;
  const pcov=primes.map(pi=>{let cm=0;MT.forEach((m,i)=>{if(covers(pi,m))cm|=1<<i;});return cm;});
  let best=null;
  for(let sub=0;sub<(1<<P);sub++){
    let cov=0,cost=0,cnt=0;
    for(let k=0;k<P;k++)if(sub&(1<<k)){cov|=pcov[k];cost+=litCost(primes[k],n);cnt++;}
    if(cov===need){if(!best||cost<best.cost||(cost===best.cost&&cnt<best.nterms))best={sub,cost,nterms:cnt};}
  }
  const chosen=[];for(let k=0;k<P;k++)if(best.sub&(1<<k))chosen.push(primes[k]);
  return{terms:chosen,cost:best.cost,nterms:chosen.length};
}
function termStr(imp,n){let s='';for(let v=0;v<n;v++){const p=1<<(n-1-v);if(imp.mask&p)continue;s+=VN[v]+((imp.bits&p)?'':'′');}return s||'1';}
function sopStr(terms,n){if(!terms.length)return '0';return terms.map(t=>termStr(t,n)).join(' + ');}
function evalTerms(terms,m){for(const t of terms)if(covers(t,m))return 1;return 0;}
function canonList(mts){return mts.map(m=>({bits:m,mask:0}));}
function gateCost(terms,n){
  if(terms.length===1&&terms[0].mask===(1<<n)-1)return{and:0,or:0,inv:0,tot:0};   // constante 1
  if(terms.length===0)return{and:0,or:0,inv:0,tot:0};                              // constante 0
  let and=0;const invSet=new Set();
  for(const t of terms){const l=litCost(t,n);if(l>=2)and++;
    for(let v=0;v<n;v++){const p=1<<(n-1-v);if(t.mask&p)continue;if(!(t.bits&p))invSet.add(v);}}
  const or=terms.length>=2?1:0;
  return{and,or,inv:invSet.size,tot:and+or};
}

// ===================== 3. GEOMETRÍA DEL MAPA (código Gray) =====================
function grayList(bits){return bits===1?[0,1]:[0,1,3,2];}          // 1 o 2 bits
function kmapDims(n){return n===2?{rb:1,cb:1}:(n===3?{rb:1,cb:2}:{rb:2,cb:2});}
function mtOf(n,r,c){const d=kmapDims(n);const rg=grayList(d.rb),cg=grayList(d.cb);return rg[r]*(1<<d.cb)+cg[c];}
function nRows(n){return 1<<kmapDims(n).rb;}
function nCols(n){return 1<<kmapDims(n).cb;}
function grayBits(v,bits){return bits===1?String(v):(v.toString(2).padStart(2,'0'));}

function kmGeom(fn,x0,y0,cell){

}
function drawKmap(c,fn,G,groups,spot){
  const {n,mts}=fn, set=new Set(mts), d=kmapDims(n);

  const cg=grayList(d.cb), rg=grayList(d.rb);

    const [x,y]=G.cellXY(r,cc), m=mtOf(n,r,cc), F=set.has(m);
    c.fillStyle=F?'rgba(124,217,146,0.10)':'rgba(255,255,255,0.02)';
    c.fillRect(x,y,G.cell,G.cell);

    c.fillText(F?'1':'0',x+G.cell/2,y+G.cell*0.42);

}
// dibuja cada implicante como uno o más rectángulos redondeados (componentes planos = tramos sin wrap)
function drawGroups(c,fn,G,groups,spot){
  groups.forEach((imp,gi)=>{
    if(spot!=null && spot>=0 && spot!==gi) return;
    const col=GRP[gi%GRP.length];
    const cells=[];
    for(let r=0;r<G.R;r++)for(let cc=0;cc<G.C;cc++)if(covers(imp,mtOf(fn.n,r,cc)))cells.push([r,cc]);
    const seen=new Set(),key=(r,cc)=>r+'_'+cc;
    for(const [r0,c0] of cells){
      if(seen.has(key(r0,c0)))continue;
      // flood-fill planar (4-vecinos, sin wrap)
      const stack=[[r0,c0]],comp=[];seen.add(key(r0,c0));
      while(stack.length){const [r,cc]=stack.pop();comp.push([r,cc]);
        [[r-1,cc],[r+1,cc],[r,cc-1],[r,cc+1]].forEach(([nr,nc])=>{
          if(nr<0||nc<0||nr>=G.R||nc>=G.C)return;
          if(seen.has(key(nr,nc)))return;
          if(cells.some(e=>e[0]===nr&&e[1]===nc)){seen.add(key(nr,nc));stack.push([nr,nc]);}});}
      let rmin=99,rmax=-1,cmin=99,cmax=-1;
      comp.forEach(([r,cc])=>{rmin=Math.min(rmin,r);rmax=Math.max(rmax,r);cmin=Math.min(cmin,cc);cmax=Math.max(cmax,cc);});
      const pad=6+gi*4;
      const x=G.x0+cmin*G.cell+pad, y=G.y0+rmin*G.cell+pad;
      const w=(cmax-cmin+1)*G.cell-2*pad, h=(rmax-rmin+1)*G.cell-2*pad, rad=14;
      c.strokeStyle=col;c.lineWidth=(spot===gi)?4:2.6;c.globalAlpha=(spot!=null&&spot>=0&&spot!==gi)?0.25:1;
      c.beginPath();
      c.moveTo(x+rad,y);c.arcTo(x+w,y,x+w,y+h,rad);c.arcTo(x+w,y+h,x,y+h,rad);
      c.arcTo(x,y+h,x,y,rad);c.arcTo(x,y,x+w,y,rad);c.closePath();c.stroke();
      c.globalAlpha=1;
    }
  });
}

  const rowY=ty+58;
  const rowsC=[
    ['Literales', cLit, res.cost],
    ['Términos', mts.length, res.nterms],
    ['Compuertas AND-OR', gc.tot, gm.tot],
    ['Inversores', gc.inv, gm.inv],
  ];
  c.font='13px Outfit, sans-serif';
  c.fillStyle='#8f97a5';c.textAlign='right';c.fillText('canónica',PX.x+PX.w-96,rowY-24);

  rowsC.forEach((rw,i)=>{

    c.fillStyle='#8f97a5';c.textAlign='right';c.fillText(rw[1],PX.x+PX.w-96,yy);
    const better=rw[2]<rw[1];
    c.fillStyle=better?OK_HEX:(rw[2]===rw[1]?'#C9D3E2':WARN_HEX);c.font='bold 14px Outfit, sans-serif';
    c.fillText(rw[2],PX.x+PX.w-16,yy);
  });
  const saved=cLit-res.cost, pct=cLit? Math.round(100*saved/cLit):0;

}

function applyPreset(p){
  const N=1<<expN;
  if(p==='clear')expSet=new Set();
  else if(p==='full')expSet=new Set(Array.from({length:N},(_,i)=>i));
  else if(p==='xor'){expSet=new Set();for(let m=0;m<N;m++)if(popcount(m)&1)expSet.add(m);}   // paridad impar
  else if(p==='maj'){expSet=new Set();const half=expN/2;for(let m=0;m<N;m++)if(popcount(m)>expN/2)expSet.add(m);}
  hwInput=0;
}

function teleRow(l,v,cls){return `<div class="trow"><span class="tl">${l}</span><span class="tv ${cls||''}">${v}</span></div>`;}
function updateTele(){
  const t=el('tele'),fn=curFn(),res=minimize(fn.mts,fn.n,[]),cLit=fn.mts.length*fn.n;
  if(mode==='reto'){
    const selTerms=[...retoSel].map(i=>retoPIs[i]);
    const covered=new Set();selTerms.forEach(x=>fn.mts.forEach(m=>{if(covers(x,m))covered.add(m);}));
    const selCost=selTerms.reduce((a,x)=>a+litCost(x,fn.n),0);
    t.innerHTML=teleRow('Función','Σm('+fn.mts.join(',')+')')+
      teleRow('Implicantes elegidos',String(retoSel.size))+
      teleRow('Unos cubiertos',covered.size+'/'+fn.mts.length,covered.size===fn.mts.length?'good':'warn')+
      teleRow('Coste (tú→mín)',selCost+' → '+res.cost,(covered.size===fn.mts.length&&selCost===res.cost)?'good':'warn')+
      teleRow('Estado',retoChecked?(retoSolved?'✔ correcto':'✗ revisa'):'elige y comprueba',(retoChecked&&retoSolved)?'good':'warn');
    return;
  }
  const gm=gateCost(res.terms,fn.n),gc=gateCost(canonList(fn.mts),fn.n);
  t.innerHTML=teleRow('Variables',String(fn.n))+
    teleRow('Mintérminos (unos)',String(fn.mts.length))+
    teleRow('Forma mínima',res.special||sopStr(res.terms,fn.n),'good')+
    teleRow('Literales (canón→mín)',cLit+' → '+res.cost,res.cost<cLit?'good':'warn')+
    teleRow('Compuertas (canón→mín)',gc.tot+' → '+gm.tot,gm.tot<gc.tot?'good':'warn');
}
function updateReport(){
  let html=`<b>${MODE_META[mode].mision}</b><br>`;
  const fn=curFn(),res=minimize(fn.mts,fn.n,[]),cLit=fn.mts.length*fn.n;
  if(mode==='reto'){
    html+=retoMsg||`<span class="mono">F = Σm(${fn.mts.join(',')}). Elige implicantes primos que cubran los ${fn.mts.length} unos con el mínimo (${res.cost} literales). Ajusta y comprueba.</span>`;
  }else if(mode==='agrupa'){
    html+=`<span class="mono">${AGRUPA_POOL[agIdx].nm}: F = ${res.special||sopStr(res.terms,fn.n)}. ${res.special?'Función constante.':(res.nterms+' grupo(s), '+res.cost+' literales frente a '+cLit+' de la canónica.')}</span>`;
  }else{
    html+=`<span class="mono">${fn.n} variables, ${fn.mts.length} unos. Mínima: F = ${res.special||sopStr(res.terms,fn.n)} (${res.cost} literales; canónica ${cLit}).</span>`;
  }
  el('report').innerHTML=html;
}

// ===================== 12. RETO =====================
function updateRetoSpec(){
  const f=RETO_POOL[retoIdx],res=minimize(f.mts,f.n,[]);
  el('retoSpec').innerHTML=`F(${VN.slice(0,f.n).join(',')}) = Σm(${f.mts.join(',')}). Hay <b>${retoPIs.length}</b> implicantes primos; la solución mínima usa <b>${res.cost}</b> literales en <b>${res.nterms}</b> término(s). Elige los que cubran todo al mínimo. Pulsa "Comprobar".`;
}
function checkReto(){
  const f=RETO_POOL[retoIdx],res=minimize(f.mts,f.n,[]);
  const selTerms=[...retoSel].map(i=>retoPIs[i]);
  const covered=new Set();selTerms.forEach(t=>f.mts.forEach(m=>{if(covers(t,m))covered.add(m);}));
  retoOkCover=f.mts.every(m=>covered.has(m)) && retoSel.size>0;
  const selCost=selTerms.reduce((a,t)=>a+litCost(t,f.n),0);
  retoOkMin=retoOkCover && (selCost===res.cost);
  retoSolved=retoOkCover&&retoOkMin;retoChecked=true;solved=retoSolved;
  synth.beep(retoSolved?1046:220,retoSolved?0.14:0.15,0.06);
  retoMsg=`<span class="mono"><span class="${retoSolved?'ok':'dtc'}">${retoSolved?'✔ Correcto':'✗ Revisa'}</span> — ${retoExplain(f,res,selTerms,retoOkCover,selCost)}</span>`;
  refreshAll();
}

// ===================== 13. QUIZ =====================
function buildQuiz(){
  QUIZ={
    explora:{
      pregunta:'En un mapa de Karnaugh, ¿por qué agrupar 2 celdas adyacentes (que difieren en un solo bit) elimina una variable del término?',
      opciones:[
        {t:'Porque en esas dos celdas la salida es 1 tanto si esa variable vale 0 como si vale 1: la salida no depende de ella, así que la variable desaparece del producto.',ok:true,why:'Correcto: si F=1 con la variable en 0 y también en 1 (y el resto igual), esa variable es irrelevante en ese grupo y se elimina. Por eso el código Gray coloca vecinos que difieren en un solo bit.'},
        {t:'Porque el mapa siempre tiene una variable de más que se descarta por convención.',ok:false,why:'No hay variables "de más": todas importan. Lo que ocurre es que dentro del grupo una variable toma ambos valores sin cambiar la salida, y solo por eso se elimina.'},
        {t:'Porque al agrupar se suman las dos celdas y la suma anula una variable.',ok:false,why:'No se "suman" celdas. La eliminación viene del álgebra de Boole: XY + XY′ = X, es decir, la variable que cambia (Y) se cancela.'},
        {t:'Porque las celdas adyacentes representan la misma combinación de entrada.',ok:false,why:'Son combinaciones DISTINTAS (difieren en un bit). Precisamente por diferir en una sola variable, esa variable puede eliminarse al agruparlas.'},
      ],
    },
    agrupa:{
      pregunta:'Para minimizar coste, ¿conviene usar los grupos más grandes posibles al cubrir los unos?',
      opciones:[
        {t:'Sí: un grupo de 2^k celdas elimina k variables, así que a mayor grupo, menos literales por término. Se buscan los implicantes primos (grupos máximos) y se cubren todos los unos con los menos posibles.',ok:true,why:'Correcto: doblar el tamaño del grupo elimina una variable más. Por eso se maximizan los grupos (implicantes primos) y se elige una cobertura mínima.'},
        {t:'No: conviene usar muchos grupos pequeños para mayor precisión.',ok:false,why:'Al revés: los grupos pequeños dejan más literales por término y encarecen el circuito. Se buscan los grupos más grandes que sean válidos.'},
        {t:'Da igual el tamaño; solo importa que cada uno quede cubierto una vez.',ok:false,why:'El tamaño es clave: define cuántas variables se eliminan. Cubrir con grupos grandes reduce el coste; con grupos pequeños lo aumenta.'},
        {t:'Conviene que los grupos no se solapen nunca.',ok:false,why:'El solape está permitido y a menudo ayuda: una celda puede pertenecer a varios grupos si eso hace grupos mayores. Lo que se minimiza es el coste total, no el solape.'},
      ],
    },
    reto:{
      pregunta:'¿Qué es un "implicante primo esencial" y por qué siempre debe estar en la solución?',
      opciones:[
        {t:'Es un implicante primo que es el ÚNICO que cubre a cierto mintérmino: como ningún otro grupo tapa ese 1, la solución mínima obligatoriamente lo incluye.',ok:true,why:'Correcto: si un 1 solo puede cubrirse con un implicante primo, ese implicante es esencial y no puede faltar. Los esenciales se eligen primero; el resto se completa al mínimo coste.'},
        {t:'Es el implicante más grande del mapa, que por ser el mayor siempre se usa.',ok:false,why:'Ser el mayor no lo hace esencial: puede que sus unos estén cubiertos por otros. Esencial = único que cubre a algún mintérmino.'},
        {t:'Es cualquier grupo de 4 o más celdas.',ok:false,why:'El tamaño no define lo esencial. Un grupo grande puede ser prescindible si sus unos se cubren de otro modo; uno pequeño puede ser esencial.'},
        {t:'Es el primer implicante que se encuentra al leer el mapa de izquierda a derecha.',ok:false,why:'El orden de lectura es irrelevante. Lo esencial se define por la cobertura: un mintérmino que solo un implicante puede tapar.'},
      ],
    },
  };
  Object.values(QUIZ).forEach(q=>{for(let i=q.opciones.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const tmp=q.opciones[i];q.opciones[i]=q.opciones[j];q.opciones[j]=tmp;}});
}
function clearDx(){const box=el('dxbtns');if(box)box.innerHTML='';}
function refreshQuestion(){
  const q=QUIZ[mode];if(!q)return;
  el('q_text').textContent=q.pregunta;
  const box=el('dxbtns');
  box.innerHTML=q.opciones.map((o,i)=>`<button class="b sm" data-i="${i}">${String.fromCharCode(65+i)}) ${o.t}</button>`).join('');
  box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(parseInt(b.dataset.i,10)));
}
function answer(i){
  const q=QUIZ[mode];if(!q)return;
  const box=el('dxbtns'),btns=box.querySelectorAll('[data-i]');
  if(!btns.length||btns[0].disabled)return;
  const o=q.opciones[i];btns.forEach(b=>b.disabled=true);btns[i].classList.add(o.ok?'right':'wrong');
  if(o.ok){synth.beep(1046,0.12,0.06);}else{synth.beep(220,0.15,0.06);}
  showToast((o.ok?'✔ ':'✗ ')+o.why);
}

pickerFor(scene,S.camera,S.renderer.domElement,hit=>{

(function hoverLoop(){
  const ray=new THREE.Raycaster(),dom=S.renderer.domElement;let mx=0,my=0;
  dom.addEventListener('pointermove',e=>{const r=dom.getBoundingClientRect();mx=((e.clientX-r.left)/r.width)*2-1;my=-((e.clientY-r.top)/r.height)*2+1;});
  function tick(){
    ray.setFromCamera({x:mx,y:my},S.camera);let hovered=false;
    for(const [obj,spr] of HOVER_LABELS){if(!obj.visible){spr.visible=false;continue;}const on=ray.intersectObject(obj,true).length>0;spr.visible=on;if(on)hovered=true;}
    dom.style.cursor=hovered?'pointer':'default';requestAnimationFrame(tick);
  }
  tick();
})();

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function runAuto(){
  if(autoRunning)return;autoRunning=true;
  const btn=el('btnAuto'),label=btn.textContent;btn.disabled=true;btn.classList.add('on');btn.textContent='⏳ Recorriendo…';
  try{
    synth.init();synth.resume();clearDx();
    setMode('explora');
    expN=4;expSet=new Set([0,2,5,7,8,10,13,15]);afterEdit();
    showToast('🧭 Función de 4 variables con 8 unos: la canónica gastaría 32 literales y 9 compuertas.');
    await sleep(4200);
    showToast('✨ Pero su forma mínima es F = B′D′ + BD: solo 4 literales y 3 compuertas. Dos grupos de 4 celdas eliminan 2 variables cada uno.');
    await sleep(4400);
    answer(QUIZ[mode].opciones.findIndex(o=>o.ok));await sleep(2800);

    setMode('agrupa');
    agIdx=AGRUPA_POOL.findIndex(f=>f.nm.indexOf('Mayoría')>=0);agSpot=-1;afterEdit();
    showToast('🔗 Mayoría 2-de-3: F = BC + AC + AB. Tres lazos de 2 celdas; cada uno elimina una variable.');
    await sleep(4200);
    agSpot=0;afterEdit();
    showToast('🔍 Enfocamos el primer grupo: dentro de él dos variables se mantienen constantes y son las que quedan en el término.');
    await sleep(4000);
    agSpot=-1;
    agIdx=AGRUPA_POOL.findIndex(f=>f.nm.indexOf('Paridad')>=0);afterEdit();
    showToast('⚠️ Honestidad: la paridad impar (XOR) no tiene celdas adyacentes agrupables → su mínima es la canónica. No todo simplifica.');
    await sleep(4400);
    answer(QUIZ[mode].opciones.findIndex(o=>o.ok));await sleep(2800);

    setMode('reto');
    seedReto(0);updateRetoSpec();afterEdit();
    showToast('🎯 Reto: '+RETO_POOL[retoIdx].ctx+'. Elegimos primero implicantes redundantes…');
    await sleep(3600);
    // solución mínima: marca los implicantes primos que forman una cobertura mínima
    (function solveReto(){
      const f=RETO_POOL[retoIdx],res=minimize(f.mts,f.n,[]);
      retoSel=new Set();
      res.terms.forEach(t=>{const idx=retoPIs.findIndex(p=>p.bits===t.bits&&p.mask===t.mask);if(idx>=0)retoSel.add(idx);});
    })();
    afterEdit();
    showToast('✔ …y nos quedamos con la cobertura mínima: '+sopStr(minimize(RETO_POOL[retoIdx].mts,RETO_POOL[retoIdx].n,[]).terms,RETO_POOL[retoIdx].n)+'. Comprobamos.');
    await sleep(3000);
    checkReto();await sleep(2600);
    answer(QUIZ[mode].opciones.findIndex(o=>o.ok));
  }finally{
    btn.disabled=false;btn.classList.remove('on');btn.textContent=label;autoRunning=false;
  }
}

  retoIdx:()=>retoIdx, retoFn:()=>({...RETO_POOL[retoIdx]}),
  retoPIs:()=>retoPIs.map(p=>termStr(p,RETO_POOL[retoIdx].n)),
  retoMinCost:()=>minimize(RETO_POOL[retoIdx].mts,RETO_POOL[retoIdx].n,[]).cost,
  retoSel:()=>[...retoSel], retoSetSel:arr=>{if(mode==='reto'){retoSel=new Set(arr);retoChecked=false;afterEdit();}},
  retoToggle:i=>{if(mode==='reto'){if(retoSel.has(i))retoSel.delete(i);else retoSel.add(i);retoChecked=false;afterEdit();}},
  retoSolveMin:()=>{if(mode==='reto'){const r=minimize(RETO_POOL[retoIdx].mts,RETO_POOL[retoIdx].n,[]);retoSel=new Set();r.terms.forEach(t=>{const i=retoPIs.findIndex(p=>p.bits===t.bits&&p.mask===t.mask);if(i>=0)retoSel.add(i);});afterEdit();}},
  checkReto:()=>checkReto(),
  retoChecked:()=>retoChecked, retoOkCover:()=>retoOkCover, retoOkMin:()=>retoOkMin, retoSolved:()=>retoSolved,
  seedReto:idx=>{seedReto(idx);updateRetoSpec();afterEdit();},
  newSignal:()=>newSignal(),
  hwInput:()=>hwInput, hwF:()=>{const fn=curFn();return new Set(fn.mts).has(hwInput)?1:0;},
  reportText:()=>el('report').innerText,
  quizAnswer:i=>answer(i), quizCorrectIndex:()=>QUIZ[mode].opciones.findIndex(o=>o.ok),
  solved:()=>solved,
};
