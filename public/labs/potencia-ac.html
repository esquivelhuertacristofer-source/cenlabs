<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
    // Mipmaps SI. Son mapas de ruido de 512 px sobre piezas que en pantalla ocupan
  // decenas de pixeles: sin cadena de mipmaps cada pixel muestrea un texel suelto
  // y, en el normalMap, la normal salta de pixel a pixel. El especular estalla en
  // puntos blancos que ademas nadan al orbitar la camara. three recorta la
  // anisotropia contra el maximo del dispositivo, asi que 8 es seguro en cualquier GPU.
  t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter; t.anisotropy=8; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.26, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;
    }

   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

// de θ_total≈0°), S 100.0%, FP 95.2%. Tolerancias de calificación (±5° en θ_total; ±25% relativo en

function vOf(vm,phiDeg,freq,t){
  return vm*Math.sin(2*Math.PI*freq*t+phiDeg*Math.PI/180);
}
function windowSFor(freq){
  return PERIODS_SHOWN/freq;
}
function divForTime(t,windowS){
  return (t/windowS)*DIVX;
}
function crossingsFor(phiDeg,freq,windowS){
  const T=1/freq;
  const phiRad=phiDeg*Math.PI/180;
  const t0=(-phiRad/(2*Math.PI))*T;
  const out=[];
  let k=Math.floor((0-t0)/(T/2))-2;
  while(true){
    const t=t0+k*(T/2);
    if(t>windowS+T)break;
    if(t>=-T){
      out.push({t,type:(k%2+2)%2===0?'asc':'desc'});
    }
    k++;
  }
  return out.filter(c=>c.t>=0-1e-9&&c.t<=windowS+1e-9);
}
function nearestCrossTo(rawT,crossings){
  let best=crossings[0],bestD=Infinity;
  for(const c of crossings){
    const d=Math.abs(c.t-rawT);
    if(d<bestD){bestD=d;best=c;}
  }
  return best;
}
function phiFromCrossings(t1,t2,freq){
  const T=1/freq;
  let dt=t2-t1;
  dt=dt-T*Math.round(dt/T);
  return -dt*360/T;
}
function angDiff(a,b){
  let d=(a-b)%360;
  if(d>180)d-=360;
  if(d<-180)d+=360;
  return Math.abs(d);
}
function pickAmpsPerDiv(imag){
  const target=imag/(DIVY/2-0.4);
  let best=AMPSDIV_CANDIDATES[0],bestD=Infinity;
  for(const a of AMPSDIV_CANDIDATES){
    const d=Math.abs(a-target);
    if(d<bestD){bestD=d;best=a;}
  }
  return best;
}

function loadRX(type,R,Xmag){
  if(type==='resistiva')return{R,X:0};
  if(type==='inductiva')return{R,X:Xmag};
  return{R,X:-Xmag};
}
function powerOfLoad(R,X){
  const Zmag=Math.hypot(R,X);
  const Imag=V/Zmag;
  const thetaDeg=Math.atan2(X,R)*180/Math.PI;
  const S=V*Imag;
  const P=S*Math.cos(thetaDeg*Math.PI/180);
  const Q=S*Math.sin(thetaDeg*Math.PI/180);
  const FP=S>1e-9?P/S:1;
  return{R,X,Zmag,Imag,thetaDeg,S,P,Q,FP};
}
function combineTotal(load1,load2){
  const p1=powerOfLoad(load1.R,load1.X);
  const p2=powerOfLoad(load2.R,load2.X);
  const P=p1.P+p2.P, Q=p1.Q+p2.Q;
  const Smag=Math.hypot(P,Q);
  const FP=Smag>1e-9?P/Smag:1;
  const thetaDeg=Math.atan2(Q,P)*180/Math.PI;
  return{p1,p2,P,Q,S:Smag,FP,thetaDeg};
}
function computeKind(Vv,Iv,thetaDeg,kind){
  const thetaRad=thetaDeg*Math.PI/180;
  const Smag=Vv*Iv, P=Smag*Math.cos(thetaRad), Q=Smag*Math.sin(thetaRad);
  if(kind==='P')return P;
  if(kind==='Q')return Q;
  if(kind==='S')return Smag;
  return P/Smag;
}
function worstCaseError(Itrue,thetaTrueDeg,kind){
  const trueVal=computeKind(V,Itrue,thetaTrueDeg,kind);
  let worst=0;
  for(const dPhiDeg of[-5,0,5])for(const dAmpFrac of[-0.08,0,0.08]){
    const val=computeKind(V,Itrue*(1+dAmpFrac),thetaTrueDeg+dPhiDeg,kind);
    const err=Math.abs(val-trueVal)/Math.max(Math.abs(trueVal),1e-9);
    if(err>worst)worst=err;
  }
  return worst;
}

  c.fillText('OSCILOSCOPIO · 2 CANALES',x0+6,40);
  c.fillStyle='#07120e';c.fillRect(gx0,gy0,gw,gh);
  c.strokeStyle='rgba(79,209,197,0.22)';c.lineWidth=1;
  for(let i=0;i<=DIVX;i++){const x=gx0+(i/DIVX)*gw;line(c,x,gy0,x,gy0+gh);}
  for(let i=0;i<=DIVY;i++){const y=gy0+(i/DIVY)*gh;line(c,gx0,y,gx0+gw,y);}
  const midY=gy0+gh/2;
  c.strokeStyle='rgba(79,209,197,0.55)';c.lineWidth=1.5;line(c,gx0,midY,gx0+gw,midY);

  const windowS=windowSFor(FREQ);
  const xToPx=t=>gx0+(t/windowS)*gw;
  const yToPx1=v=>midY-(v/VOLTS_PER_DIV_CH1)*(gh/DIVY);
  const yToPx2=v=>midY-(v/ampsPerDiv2)*(gh/DIVY);

  drawTrace(c,xToPx,yToPx1,windowS,V,PHI1,FREQ,'#4FD1C5');
  drawTrace(c,xToPx,yToPx2,windowS,Itotal.mag,Itotal.phiI,FREQ,'#FF8A5B');

  drawCursor(c,xToPx,yToPx1,gy0,gh,snap1(cursor1Div),'#4FD1C5',true);
  drawCursor(c,xToPx,yToPx2,gy0,gh,snap2(cursor2Div),'#FF8A5B',false);

  c.fillStyle='#5a6b66';c.font='11px Outfit, sans-serif';c.textAlign='center';
  c.fillText(fmtTimeS(windowS/DIVX)+'/div',x0+w/2,gy0+gh+34);
  c.textAlign='left';
  c.fillText('CH1: '+VOLTS_PER_DIV_CH1.toFixed(1)+' V/div · CH2: '+fmtAmpsPerDiv(ampsPerDiv2)+'/div',gx0,gy0+gh+22);
  c.textAlign='right';
  if(measured){
    c.fillStyle=cross1Type===cross2Type?'#8FB3AC':'#f0a5a5';
    c.fillText('θ_total medido ≈ '+fmtDeg(-phiMeasured)+(cross1Type===cross2Type?'':' ⚠ tipos de cruce distintos'),gx0+gw,gy0+gh+22);
  }
}

      teleRow('θ_total',revealPhi?fmtDeg(total.thetaDeg)+' ✔':'🔒 sellado')+
      teleRow('θ_total medido (cursores)',measured?fmtDeg(-phiMeasured):'sin medir',measured?tolCls:'warn')+

// ===================== 11. MEDICIÓN Y RETO =====================
function medirPhi(){
  const Itotal=currentITotal();
  const c1=snap1(cursor1Div),c2=snap2(cursor2Div);
  const phi=phiFromCrossings(c1.t,c2.t,FREQ);
  measured=true;phiMeasured=phi;cross1Type=c1.type;cross2Type=c2.type;
  const matched=c1.type===c2.type;
  synth.beep(matched?1046:660,matched?0.12:0.15,0.06);
  if(mode==='explora'){
    showToast(matched
      ?`Medición: θ_total ≈ ${fmtDeg(-phi)}. Coincide con el θ_total real (${fmtDeg(-Itotal.phiI)}) porque ambos cursores usan el MISMO tipo de cruce (${cross1Type==='asc'?'ascendente':'descendente'}).`
      :`⚠️ Medición: θ_total ≈ ${fmtDeg(-phi)} — pero el θ_total real es ${fmtDeg(-Itotal.phiI)}. Mezclaste un cruce ${cross1Type==='asc'?'ascendente':'descendente'} (canal 1) con uno ${cross2Type==='asc'?'ascendente':'descendente'} (canal 2): error clásico de 180°.`);
  }else if(mode==='medicion'){
    const ok=Math.abs(angDiff(phi,Itotal.phiI))<=TOL_PHI_DEG;
    showToast(matched
      ?(ok?`<span style="color:var(--good)">✔ θ_total medido ≈ ${fmtDeg(-phi)}, dentro de ±${TOL_PHI_DEG}° del valor real.</span>`
           :`θ_total medido ≈ ${fmtDeg(-phi)} — fuera de tolerancia, ajusta el cursor justo sobre el cruce.`)
      :`⚠️ θ_total medido ≈ ${fmtDeg(-phi)} — mezclaste tipos de cruce distintos (canal 1: ${cross1Type==='asc'?'ascendente':'descendente'}, canal 2: ${cross2Type==='asc'?'ascendente':'descendente'}). Error clásico de 180°: alinea ambos cursores al MISMO tipo de cruce.`);
  }else{
    showToast(matched
      ?`Medición registrada: θ_total ≈ ${fmtDeg(-phi)} (cruces del mismo tipo). Ahora calcula ${kindLongLabel(retoAskKind)} a partir de I_total y θ_total, y comprueba.`
      :`⚠️ Medición registrada: θ_total ≈ ${fmtDeg(-phi)} — cuidado, mezclaste tipos de cruce distintos. Puede estar desfasada 180° de la real.`);
  }
  refreshAll();
}
function checkReto(){
  if(!measured){showToast('⚠️ Primero mide θ_total con los cursores ("Medir θ_total").');return;}
  const guess=numOr('inSealed');
  if(!isFinite(guess)){showToast('⚠️ Ingresa tu valor calculado para la cantidad pedida.');return;}
  const total=currentTotal();
  const trueVal=({P:total.P,Q:total.Q,S:total.S,FP:total.FP})[retoAskKind];
  retoOk=retoAskKind==='FP'
    ?(Math.abs(guess-trueVal)<=TOL_FP_ABS)
    :(Math.abs(guess-trueVal)<=Math.abs(trueVal)*TOL_FRAC);
  retoChecked=true; solved=retoOk;
  synth.beep(retoOk?1046:220,retoOk?0.14:0.15,0.06);
  const guessFmt=fmtKind(retoAskKind,guess);
  retoMsg=retoOk
    ?`<span class="mono"><span class="ok">✔ ${retoAskKind} correcto</span> (tu respuesta ${guessFmt}, dentro de tolerancia del valor real)</span>`
    :`<span class="mono"><span class="dtc">✗ ${retoAskKind} fuera de tolerancia</span> (tu respuesta ${guessFmt}). Revisa tu lectura de la traza/cursores y el cálculo de ${kindLongLabel(retoAskKind)} a partir de I_total y θ_total.</span>`;
  refreshAll();
}
function updateSealedInputLabel(){
  el('inSealedLabel').textContent=retoAskKind+' =';
  el('inSealedUnit').textContent=unitOfKind(retoAskKind);
}
function updateRetoSpec(){
  el('retoSpec').innerHTML=`Carga 1: ${TYPE_LABELS[retoType1]} R=${fmtOhm(retoR1)}${retoType1==='resistiva'?'':' |X|='+fmtOhm(retoX1)}. Carga 2: ${TYPE_LABELS[retoType2]} R=${fmtOhm(retoR2)}${retoType2==='resistiva'?'':' |X|='+fmtOhm(retoX2)}. La corriente total I_total (magnitud y fase) está sellada. Mide θ_total con los cursores ("Medir θ_total") y lee/calcula I_total desde la traza y el osciloscopio para obtener <b>${kindLongLabel(retoAskKind)}</b>.<br><span style="color:var(--dim)">Tolerancias (±${TOL_PHI_DEG}° en θ_total; ±${Math.round(TOL_FRAC*100)}% relativo para P/Q/S, ±${TOL_FP_ABS} absoluto para FP) son un margen pedagógico de este ejercicio.</span>`;
}
function pickFrom(arr,exclude){
  if(arr.length<=1)return arr[0];
  let v=arr[Math.floor(Math.random()*arr.length)];
  while(v===exclude)v=arr[Math.floor(Math.random()*arr.length)];
  return v;
}
function randLoad(prevType,prevR,prevX){
  const type=pickFrom(TYPES,prevType);
  const R=pickFrom(R_CANDIDATES,prevR);
  const Xmag=pickFrom(X_CANDIDATES,prevX);
  return{type,R,Xmag};
}
function pickMedicionRound(pt1,pr1,px1,pt2,pr2,px2){
  for(let tries=0;tries<500;tries++){
    const l1=randLoad(pt1,pr1,px1);
    const l2=randLoad(pt2,pr2,px2);
    if(l1.type==='resistiva'&&l2.type==='resistiva')continue;
    return{type1:l1.type,R1:l1.R,X1:l1.Xmag,type2:l2.type,R2:l2.R,X2:l2.Xmag};
  }
  return{type1:'inductiva',R1:22,X1:47,type2:'capacitiva',R2:47,X2:22};
}
function pickRetoRound(pt1,pr1,px1,pt2,pr2,px2,prevKind){
  for(let tries=0;tries<500;tries++){
    const l1=randLoad(pt1,pr1,px1);
    const l2=randLoad(pt2,pr2,px2);
    if(l1.type==='resistiva'&&l2.type==='resistiva')continue;
    const kind=pickFrom(ASK_KINDS,prevKind);
    const eff1=loadRX(l1.type,l1.R,l1.Xmag),eff2=loadRX(l2.type,l2.R,l2.Xmag);
    const total=combineTotal(eff1,eff2);
    const Itot=total.S/V;
    if(worstCaseError(Itot,total.thetaDeg,kind)<=FILTER_THRESHOLD){
      return{type1:l1.type,R1:l1.R,X1:l1.Xmag,type2:l2.type,R2:l2.R,X2:l2.Xmag,kind};
    }
  }
  return{type1:'inductiva',R1:22,X1:47,type2:'capacitiva',R2:47,X2:22,kind:'S'};
}
function newMedicionRound(){
  const r=pickMedicionRound(medType1,medR1,medX1,medType2,medR2,medX2);
  medType1=r.type1;medR1=r.R1;medX1=r.X1;medType2=r.type2;medR2=r.R2;medX2=r.X2;
}
function newRetoRound(){
  const r=pickRetoRound(retoType1,retoR1,retoX1,retoType2,retoR2,retoX2,retoAskKind);
  retoType1=r.type1;retoR1=r.R1;retoX1=r.X1;retoType2=r.type2;retoR2=r.R2;retoX2=r.X2;retoAskKind=r.kind;
}
function newSignal(){
  if(mode==='medicion'){
    newMedicionRound();
    measured=false;phiMeasured=null;cross1Type=null;cross2Type=null;
    cursor1Div=2.5;cursor2Div=2.5;el('cursor1').value='2.5';el('cursor2').value='2.5';
    solved=false;clearDx();buildQuiz();refreshQuestion();buildSelBar();refreshAll();
    showToast('🔀 Nuevas cargas selladas. Vuelve a medir θ_total.');synth.beep(520,0.08,0.05);

    retoChecked=false;retoOk=false;retoMsg='';

    cursor1Div=2.5;cursor2Div=2.5;el('cursor1').value='2.5';el('cursor2').value='2.5';
    updateRetoSpec();updateSealedInputLabel();solved=false;clearDx();buildQuiz();refreshQuestion();refreshAll();
    showToast('🔀 Nuevas cargas selladas. La cantidad pedida puede haber cambiado.');synth.beep(520,0.08,0.05);
  }else{
    expType1=pickFrom(TYPES,expType1);expR1=pickFrom(R_CANDIDATES,expR1);expX1=pickFrom(X_CANDIDATES,expX1);
    expType2=pickFrom(TYPES,expType2);expR2=pickFrom(R_CANDIDATES,expR2);expX2=pickFrom(X_CANDIDATES,expX2);
    afterEdit();

}

// ===================== 12. QUIZ =====================
function buildQuiz(){
  QUIZ={
    explora:{
      pregunta:'Con dos cargas en paralelo sobre el mismo bus, P_total=P1+P2 y Q_total=Q1+Q2 se suman de forma directa. ¿Por qué S_total NO es simplemente S1+S2?',
      opciones:[
        {t:'Porque S1 y S2 son las hipotenusas de dos triángulos rectángulos distintos (cada uno con su propio ángulo θ); sumar hipotenusas de triángulos con ángulos distintos no da la hipotenusa del triángulo suma — hay que sumar primero los catetos (P1+P2 y Q1+Q2) y recién entonces recalcular la hipotenusa con S_total=√(P_total²+Q_total²)',ok:true,why:'Correcto: P y Q son los catetos (componentes en fase y en cuadratura) y SÍ se suman directamente entre cargas, porque son proyecciones sobre los mismos dos ejes. S es la magnitud (hipotenusa) de cada vector individual — sumar magnitudes de vectores con direcciones distintas sobredimensiona el resultado, por la desigualdad del triángulo: S1+S2≥S_total, con igualdad solo si ambos vectores tienen el mismo ángulo θ.'},
        {t:'Porque el simulador redondea los valores de S1 y S2 antes de sumarlos, introduciendo un pequeño error de redondeo',ok:false,why:'No es un error de redondeo: la diferencia entre S1+S2 y S_total puede ser de varios VA y es una consecuencia EXACTA de la aritmética vectorial, no de precisión numérica.'},
        {t:'Porque la potencia aparente de dos cargas en paralelo siempre es menor que la de cada carga individual',ok:false,why:'Falso en general: S_total puede ser mayor, menor o igual que cada S individual por separado, dependiendo de los ángulos — lo único garantizado es S_total≤S1+S2 (desigualdad del triángulo).'},
        {t:'Porque P y Q no se pueden sumar directamente entre cargas; solo S se puede sumar directamente',ok:false,why:'Es exactamente al revés: P_total=P1+P2 y Q_total=Q1+Q2 SÍ son sumas directas (verificado numéricamente con discrepancia máxima de 3.553×10⁻¹⁵ sobre 1280 combinaciones); es S la que NO se suma directamente.'},
      ],
    },
    medicion:{
      pregunta:'Alineas el cursor del canal 1 (voltaje) en un cruce ascendente (▲) y el del canal 2 (corriente total) en un cruce descendente (▼). ¿Qué error introduce esto en tu medición de θ_total?',
      opciones:[
        {t:'Un error sistemático de exactamente 180° (mod 360°) respecto al θ_total real — el resultado es matemáticamente consistente pero no representa el desfase físico real entre el voltaje del bus y la corriente total',ok:true,why:'Correcto: mezclar tipos de cruce equivale a medir la diferencia de tiempo hasta un punto de la corriente total desplazado media vuelta (T/2) del que corresponde — eso se traduce en exactamente 180° de error, siempre, sin importar el θ_total real.'},
        {t:'Ningún error, porque un cruce por cero es un cruce por cero sin importar el sentido',ok:false,why:'El sentido del cruce SÍ importa: un cruce ascendente y uno descendente de la misma señal están separados por medio periodo (T/2) en el tiempo — mezclarlos introduce ese medio periodo como error.'},
        {t:'Un error aleatorio impredecible, distinto cada vez que se repite la medición',ok:false,why:'El error no es aleatorio: es sistemático y exacto (siempre ±180°, mod 360°) porque proviene de una relación geométrica fija entre cruces ascendentes y descendentes.'},
        {t:'Un error del 50% en la magnitud de I_total medida',ok:false,why:'Mezclar tipos de cruce afecta la medición de FASE (θ_total), no la de magnitud — la magnitud de I_total no se ve alterada por este error.'},
      ],
    },
    reto:{
      pregunta:'El simulador descarta automáticamente ciertas combinaciones de cargas antes de sellar I_total en el modo Reto — y entre las 4 cantidades posibles (P, Q, S, FP), Q es la que tiene la tasa de aceptación MÁS BAJA (≈40.9%). ¿Por qué Q es la más restrictiva?',
      opciones:[
        {t:'Porque Q=S·sin θ, y cerca de θ_total≈0° (cargas casi puramente resistivas en conjunto) la función seno cambia muy poco por unidad de ángulo, así que un pequeño error de medición en θ_total (±5°) se traduce en un error GRANDE, proporcionalmente, sobre el valor de Q recuperado — mientras que P=S·cos θ es mucho menos sensible cerca de θ_total≈0°',ok:true,why:'Correcto: verificado numéricamente — la derivada de sin θ es cos θ, que vale 1 cerca de θ=0°, pero el valor absoluto de Q=S·sin θ es pequeño ahí, así que el error RELATIVO se dispara. cos θ, en cambio, cambia poco cerca de θ=0° y P es grande ahí, así que P es mucho más estable (83.1% de aceptación vs 40.9% de Q).'},
        {t:'Porque el simulador no puede calcular Q para todas las combinaciones de cargas',ok:false,why:'Falso: combineTotal() calcula Q_total=Q1+Q2 exactamente para cualquier combinación de cargas — el filtro no es una limitación de cálculo, es una garantía de que el problema sea resoluble dentro de tolerancia.'},
        {t:'Porque Q solo existe en cargas inductivas, nunca en capacitivas',ok:false,why:'Falso: Q existe (con signo opuesto) tanto en cargas inductivas (Q>0) como capacitivas (Q<0) — ambas contribuyen a la potencia reactiva total, solo que con signos distintos.'},
        {t:'Porque S es más difícil de medir que Q con un osciloscopio',ok:false,why:'Es al revés: S tiene la tasa de aceptación MÁS ALTA (100.0%) de las cuatro cantidades — es la menos sensible al error de instrumento, precisamente porque S=√(P²+Q²) combina ambas componentes y no depende de un solo ángulo cerca de un punto sensible.'},
      ],
    },
  };
}
function clearDx(){

(function(){
  const ray=new THREE.Raycaster();
  const mouse=new THREE.Vector2();
  const dom=S.renderer.domElement;
  dom.addEventListener('pointermove',e=>{
    const rect=dom.getBoundingClientRect();
    mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
    mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
    ray.setFromCamera(mouse,S.camera);
    let hovered=null;
    for(const[obj,spr]of HOVER_LABELS){
      const hits=ray.intersectObject(obj,true);
      if(hits.length>0){hovered=obj;break;}
    }
    for(const[obj,spr]of HOVER_LABELS){spr.visible=(obj===hovered);}
    dom.style.cursor=hovered?'pointer':'default';
  });
})();

    {

    }
    refreshAll();
    medirPhi();await sleep(2800);
    showToast('Corrigiendo: alineamos el cursor del canal 2 a un cruce ASCENDENTE, igual que el canal 1.');
    await sleep(2000);
    {
      const windowS=windowSFor(FREQ);
      const Itotal=currentITotal();
      const cr2=crossingsFor(Itotal.phiI,FREQ,windowS).find(c=>c.type==='asc');
      if(cr2){cursor2Div=divForTime(cr2.t,windowS);el('cursor2').value=String(cursor2Div);}

    medirPhi();await sleep(2600);

    setMode('reto');
    showToast('Paso 3 · I_total (magnitud y fase) está sellada. Mide θ_total y calcula la cantidad pedida.');
    await sleep(2200);
    {
      const windowS=windowSFor(FREQ);
      const Itotal=currentITotal();
      const cr1=crossingsFor(PHI1,FREQ,windowS).find(c=>c.type==='asc');
      const cr2=crossingsFor(Itotal.phiI,FREQ,windowS).find(c=>c.type==='asc');
      if(cr1){cursor1Div=divForTime(cr1.t,windowS);el('cursor1').value=String(cursor1Div);}
      if(cr2){cursor2Div=divForTime(cr2.t,windowS);el('cursor2').value=String(cursor2Div);}
    }
    refreshAll();
    medirPhi();await sleep(1800);
    {
      const total=currentTotal();
      const trueVal=({P:total.P,Q:total.Q,S:total.S,FP:total.FP})[retoAskKind];
      el('inSealed').value=String(trueVal);
    }
    checkReto();await sleep(2600);
    const q=QUIZ.reto,i=q.opciones.findIndex(o=>o.ok);

el('cursor2').oninput=()=>{cursor2Div=parseFloat(el('cursor2').value);refreshAll();};
el('inSealed').addEventListener('input',onRetoInput);
el('inSealed').addEventListener('keydown',e=>{if(e.key==='Enter')checkReto();});
const soundBtn=el('soundBtn');
if(soundBtn){
  soundBtn.onclick=()=>{const on=synth.toggle();soundBtn.textContent=on?'🔊 Sonido':'🔇 Sonido';};
}
document.addEventListener('pointerdown',()=>{synth.init();synth.resume();},{once:true});

newRetoRound();
buildQuiz();
refreshNet3D();
S.start();
setMode('explora');

window.__labDebug={
  mode:()=>mode,
  load1:()=>({type:currentType1(),R:currentR1(),X:currentEff1().X}),
  load2:()=>({type:currentType2(),R:currentR2(),X:currentEff2().X}),
  total:()=>currentTotal(),
  Itotal:()=>currentITotal(),
  V:()=>V,
  freq:()=>FREQ,
  windowS:()=>windowSFor(FREQ),
  ampsPerDiv2:()=>pickAmpsPerDiv(currentITotal().mag),
  cursor1Div:()=>cursor1Div,
  cursor2Div:()=>cursor2Div,
  setCursor1Div:d=>{cursor1Div=Math.max(0,Math.min(10,d));el('cursor1').value=String(cursor1Div);refreshAll();},
  setCursor2Div:d=>{cursor2Div=Math.max(0,Math.min(10,d));el('cursor2').value=String(cursor2Div);refreshAll();},
  snap1:()=>snap1(cursor1Div),
  snap2:()=>snap2(cursor2Div),
  measured:()=>measured,
  phiMeasured:()=>phiMeasured,
  thetaTotalMeasured:()=>phiMeasured===null?null:-phiMeasured,
  cross1Type:()=>cross1Type,
  cross2Type:()=>cross2Type,
  medirPhi:()=>medirPhi(),
  checkReto:()=>checkReto(),
  setInSealed:v=>{el('inSealed').value=String(v);},
  retoChecked:()=>retoChecked,
  retoOk:()=>retoOk,
  retoMsg:()=>retoMsg,
  retoAskKind:()=>retoAskKind,
  retoLoad1:()=>({type:retoType1,R:retoR1,X:loadRX(retoType1,retoR1,retoX1).X}),
  retoLoad2:()=>({type:retoType2,R:retoR2,X:loadRX(retoType2,retoR2,retoX2).X}),
  retoTotalTrue:()=>currentTotal(),
  medLoad1:()=>({type:medType1,R:medR1,X:loadRX(medType1,medR1,medX1).X}),
  medLoad2:()=>({type:medType2,R:medR2,X:loadRX(medType2,medR2,medX2).X}),
  setExpType1:t=>{expType1=t;afterEdit();},
  setExpR1:v=>{expR1=v;afterEdit();},
  setExpXmag1:v=>{expX1=v;afterEdit();},
  setExpType2:t=>{expType2=t;afterEdit();},
  setExpR2:v=>{expR2=v;afterEdit();},
  setExpXmag2:v=>{expX2=v;afterEdit();},
  computeKind:(Vv,Iv,thetaDeg,kind)=>computeKind(Vv,Iv,thetaDeg,kind),
  worstCaseError:(Itrue,thetaTrueDeg,kind)=>worstCaseError(Itrue,thetaTrueDeg,kind),
  newSignal:()=>newSignal(),
  setMode:k=>setMode(k),
  reportText:()=>el('report').innerText,
  quizAnswer:i=>answer(i),
  quizCorrectIndex:()=>QUIZ[mode].opciones.findIndex(o=>o.ok),
  solved:()=>solved,
};
