<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Caja de Doble Embrague (DCT) — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#0a1c20;--panel:rgba(9,24,26,.86);--line:#1E3A3A;--ink:#EAF4F1;
    --dim:#8FB3AC;--accent:#2A9D8F;--accent2:#4FD1C5;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cA:#FF8A3D;--cB:#37E0C7;--cC:#6FB6FF;--cT:#9FF3FF;--cD:#FFB347;--cDC:#FFD166;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#14201f;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#182a28}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#33b3a3}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#06120f}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#4FD1C5;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f8a85;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f948f;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#04211c}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#0a1219;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(30,58,52,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,58,52,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f8a85}
  .dk-tit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#9fbab4;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,58,52,.7);min-height:0}
  .dk-g.lev{flex:0.9 1 0;min-height:96px}
  .dk-g.map{flex:1.7 1 0;min-height:140px}
  .dk-g.st{flex:1.0 1 0;min-height:84px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c9c4;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#14201f;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfe0dc;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cT);flex:none}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(12,22,22,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,22,21,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d6d2}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,22,24,.92);border:1px solid rgba(79,209,197,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,22,24,.84);border:1px solid rgba(79,209,197,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-g.map{min-height:120px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho .hud details>.cuerpo{max-height:24vh}
  body.estrecho.ancho.t-hud .hud{display:grid;grid-template-columns:1fr 1.05fr;column-gap:14px;row-gap:7px;align-content:start;grid-auto-flow:row dense}
  body.estrecho.ancho .hud>.hcab,body.estrecho.ancho .hud>.modebar,body.estrecho.ancho .hud>.hdet,body.estrecho.ancho .hud>.pasos{grid-column:1}
  body.estrecho.ancho .hud>.hmandos,body.estrecho.ancho .hud>.retoBox{grid-column:2;grid-row:1/span 4}
  body.estrecho .hdet{flex-direction:row}body.estrecho .hdet>details{flex:1;min-width:0}
  body.estrecho .hdet details[open]{position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 54px);z-index:25;background:rgba(9,24,23,.97)}
  body.movil .lt{display:none} body.movil .tbar .modo,body.movil .tbar .reloj{display:none}
  body.movil .tbar{gap:6px;padding:5px 8px} body.movil .tbar .est{min-width:0}
  body.movil .dk-ley{display:none} body.movil .fg b{font-size:13.5px} body.movil .fg .fl{font-size:9.5px}
  body.movil .dk-g.lev{min-height:84px} body.movil .dk-g.map{min-height:150px} body.movil .dk-g.st{min-height:70px}
  body.movil .hud h2{font-size:15.5px} body.movil .hud .intro{font-size:11.8px;line-height:1.42}
  body.estrecho .hud{overflow-y:auto}
  body.estrecho .vbar [data-t="rot"],body.estrecho .vbar .sep.s1{display:none}
  body.estrecho.ancho .vbar{top:60px}
  body.movil .vbar{flex-wrap:nowrap;gap:3px;padding:3px 4px;top:54px} body.movil .vbar .sep{display:none} body.movil .vbar .b.sm{padding:5px 7px;font-size:11px}
  body.movil .vbar .lg{display:none}
  body.movil .tbar .lento{display:none}
  body.movil .hud{gap:6px;padding:10px 12px 9px} body.movil .hud .eyebrow{display:none}
  body.movil .modebar .b{padding:6px 4px 5px}
  body.movil .hmandos{display:grid;grid-template-columns:1.3fr 1fr;gap:6px 8px}
  body.movil .hmandos>:nth-child(1),body.movil .hmandos>:nth-child(2),body.movil .hmandos>.fila{grid-column:1/-1}
  body.movil .seg .b{padding:5px 2px} body.movil .hud .fila .b{padding:7px 6px;font-size:12px}
  body.movil .hud details>summary{padding:6px 10px}
  body.movil .retoBox{padding:8px 10px;gap:6px} body.movil .retoBox h3{font-size:14px} body.movil .retoBox .rq{font-size:12px;line-height:1.42}
  body.movil .retoBox .why{font-size:11.5px;line-height:1.42} body.movil .task{font-size:11.8px;padding:6px 8px} body.movil .calcrow input{padding:6px 9px}
  body.movil .pasos .ps{padding:4px 3px} body.movil .opt{gap:5px} body.movil .opt .b{padding:7px 9px}
  body.movil .feedback{z-index:50} body.movil .hud.guia h2{display:none}
  body.movil .tabs{right:156px}
  body.movil #fichaFab{top:auto;left:auto;right:8px;bottom:calc(var(--hojaH) + 12px);padding:7px 11px;transform:none}
  @media (prefers-reduced-motion:reduce){ .toast,.feedback{transition:none} }

  /* ---- dock de la caja: cuatro gráficas con el mismo cursor ---- */
  .dk-gr{display:flex;flex-direction:column;gap:5px;flex:1 1 0;min-height:0}

/* ============================================================
   LAB — CAJA DE DOBLE EMBRAGUE (DCT) · CAMBIO SIN INTERRUPCIÓN DE PAR
   (Dinámica del Vehículo · mecanica-130)

   Una caja de doble embrague de 6 marchas cortada por el plano de sus
   árboles: dos embragues concéntricos (C1 interior, naranja, para las marchas
   impares; C2 exterior, verde azulado, para las pares), el árbol de entrada
   macizo dentro del hueco, los engranes de entrada y de salida, los
   sincronizadores y la corona del grupo final. Abre repitiendo en bucle, a
   cámara lenta, el cambio 1→2: la 2.ª ya está engranada y el par pasa de C1
   a C2 sin interrumpirse (fase de par); después el motor baja a su nuevo
   régimen patinando C2 (fase de inercia).

   El dock enseña, con el MISMO estado que mueve la escena, los pares de los
   embragues, el régimen del motor y de los árboles, la aceleración con su
   tirón y la energía disipada en cada embrague.

   La física (relaciones, dos inercias acopladas por embragues de Coulomb
   regularizado, calor E = ∫T·s dt, tirón) está en un bloque puro que un script
   de Node extrae TAL CUAL y verifica.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO=' ';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }

/* FISICA:INICIO */
/* ---------- 1.1 La caja, el coche y el motor ----------
   Caja de doble embrague de 6 marchas, dentado de módulo 2,5 mm con distancia
   entre ejes fija (Z_entrada + Z_salida = 80). Las marchas impares (1, 3, 5) cuelgan
   del eje de entrada INTERIOR (embrague C1) y las pares (2, 4, 6) del eje HUECO
   (embrague C2). La relación de la marcha n es i_n = Z_salida/Z_entrada = ω_entrada/ω_salida.
   Los dos piñones de salida (16 dientes) engranan con la corona del grupo final
   (64 dientes): i_fd = 4. Las cifras del coche y del motor son REPRESENTATIVAS
   (turbo de 2,0 L y 1 520 kg), no de un fabricante. */
const DOSPI=2*Math.PI, RPM=Math.PI/30, G0=9.80665;
const CAJA={ mod:2.5e-3, Zsum:80, Zi:[0,18,26,34,39,44,48], Zo:[0,62,54,46,41,36,32], Zpin:16, Zfin:64 };
const relacion=n=>CAJA.Zo[n]/CAJA.Zi[n];
const IFD=CAJA.Zfin/CAJA.Zpin;
const VEH={ m:1520, Rw:0.317, Iw:4.2, Crr:0.011, CdA:0.64, rho:1.2, Je:0.12 };
VEH.Jv=(VEH.m*VEH.Rw*VEH.Rw+VEH.Iw)/(IFD*IFD);          // inercia del coche reducida al eje de salida de la caja (kg·m²)
VEH.kv=VEH.Rw/IFD;                                       // v = ω_salida·kv  y  a = ω̇_salida·kv
/* Motor: par de plena carga parabólico (330 N·m hacia 3 400 rpm). */
const MOT={ Tpico:330, nTpico:3400, ancho:4300, nCorte:6500 };      // el corte de inyección cierra entre 6 500 y 6 800 rpm
const parMax=w=>{ const n=w/RPM; return Math.max(0,MOT.Tpico*(1-Math.pow((n-MOT.nTpico)/MOT.ancho,2))); };
/* Resistencia al avance reducida al eje de salida (rodadura + aire, en llano). */
const cargaVia=w=>{ const v=w*VEH.kv; return (VEH.m*G0*VEH.Crr+0.5*VEH.rho*VEH.CdA*v*v)*VEH.kv; };

/* ---------- 1.2 Los embragues y el cambio ----------
   Cada embrague transmite T = C(t)·tanh(s/ε), con s = deslizamiento (rad/s) y C(t)
   su capacidad de par: es el rozamiento de Coulomb REGULARIZADO (ε = 0,1 rad/s), que
   evita saltos entre «pegado» y «patinando» y deja un solo sistema de ecuaciones:
     Je·dω_e/dt = T_e − T_c1 − T_c2
     Jv·dω_s/dt = i₁·T_c1 + i₂·T_c2 − T_carga          (marchas i₁ saliente, i₂ entrante)
     s₁ = ω_e − i₁ω_s ,  s₂ = ω_e − i₂ω_s
   Las órdenes del cambio (subida de la marcha g a la g+1):
     fase de PAR (0 ≤ τ < t_r): C2 sube lineal de 0 a T_e0 y C1 baja a T_e0 − C2 (+δ);
     fase de INERCIA (τ ≥ t_r): C1 se abre; el motor baja su par un 'red' (rampa t_red) y C2
       frena al motor con T_e0 hasta llegar a s₂ ≈ S_SOFT, donde su capacidad cae
       suavemente a la del motor (aterrizaje suave: C = T_e + (T_e0 − T_e)·min(1, s₂/S_SOFT));
     sincronismo (s₂ < 1 rad/s): el par del motor vuelve a su valor en t_rec.
   Se integra con RK4 (dt = 0,1 ms) también la energía disipada en cada embrague. */
const EMB={ eps:0.2, sSoft:50, tRed:0.08, tRec:0.30, tRel:0.03, delta:15, capBloq:1.4, margen:0.30, sSinc:1.0 };
const rampa=x=>x<=0?0:(x>=1?1:x);
/** Simula una subida de la marcha g a la g+1.
    par: { g, pedal, nCambio (rpm), tr (s), red (0–0,6) };
    opc: { dt, Tcarga (constante), TeFija (par constante), emb (anula EMB), Je, Jv, arranque }.
    Devuelve las series cada 1 ms (t = 0 es el inicio de la rampa del embrague entrante) y las cifras. */
function cambio(par,opc={}){
  const E=Object.assign({},EMB,opc.emb||{}), Je=opc.Je??VEH.Je, Jv=opc.Jv??VEH.Jv;
  const i1=relacion(par.g), i2=relacion(par.g+1), tr=par.tr, red=par.red, dt=opc.dt??1e-4, nsub=Math.max(1,Math.round(1e-3/dt));
  const fallo=opc.fallo||null, wShift=par.nCambio*RPM, TL=w=>opc.Tcarga!==undefined?opc.Tcarga:cargaVia(w);
  const Tdem=w=>opc.TeFija!==undefined?opc.TeFija:par.pedal*parMax(w)*(1-rampa((w/RPM-MOT.nCorte)/300));
  const Te0=Tdem(wShift), J1=Jv+Je*i1*i1, TL0=TL(wShift/i1);
  /* Par de EMPALME: el que debe tener C2 al final de la fase de par para que C1 quede sin carga justo entonces
     (C1 soltaría un par negativo para acelerar al motor: es la compensación de la inercia del motor). */
  const kk=Je*i1*(i1-i2)/J1, T2f=(Te0-Je*i1*(i1*Te0-TL0)/J1)/(1-kk);
  let trig=null, tSinc=null, aS=0;                              // instante del disparo y del sincronismo; ω̇_s del paso anterior
  /** Órdenes en el instante absoluto t con el estado (we, ws). */
  const ctl=(t,we_,ws_)=>{
    const tau=trig===null?-1:t-trig, s2=we_-i2*ws_;
    let fr=1;
    if(trig!==null&&tau>=tr) fr=1-red*rampa((tau-tr)/E.tRed);
    if(tSinc!==null) fr=1-red*(1-rampa((t-tSinc)/E.tRec));
    const Te=Tdem(we_)*fr;
    let C1,C2;
    if(trig===null){ C1=E.capBloq*Te0; C2=0; }
    else if(tau<tr){ const u=tau/tr, wd=(i1*Te0-(i1-i2)*T2f*u-TL0)/J1; C2=T2f*u; C1=Math.max(0,Te0-C2-Je*i1*wd)+E.delta; const b=rampa(tau/0.03); C1=E.capBloq*Te0*(1-b)+C1*b; }
    else {
      C1=E.delta*(1-rampa((tau-tr)/E.tRel));
      const bloq=Te-Je*i2*aS;                                  // par que pasa por C2 cuando va pegado
      C2=bloq+(T2f-bloq)*rampa(s2/E.sSoft);
      if(tSinc!==null) C2+=E.margen*Te0*rampa((t-tSinc)/0.1);
    }
    // fallas: 'sinc' = la marcha entrante no está engranada (C2 no transmite); 'c1pega' = C1 no abre; 'c2debil' = C2 gastado (55 % de su capacidad)
    if(fallo==='sinc') C2=0;
    else if(fallo==='c2debil') C2*=0.55;
    if(fallo==='c1pega'&&trig!==null) C1=E.capBloq*Te0;
    return {Te,C1,C2};
  };
  /** Derivadas de y = [ωe, ωs, E1, E2, Eent, Ecarga]. */
  const d=(t,y)=>{
    const c=ctl(t,y[0],y[1]), s1=y[0]-i1*y[1], s2=y[0]-i2*y[1];
    const T1=c.C1*Math.tanh(s1/E.eps), T2=c.C2*Math.tanh(s2/E.eps), tl=TL(y[1]);
    return {dy:[(c.Te-T1-T2)/Je,(i1*T1+i2*T2-tl)/Jv,T1*s1,T2*s2,c.Te*y[0],tl*y[1]],T1,T2,s1,s2,Te:c.Te,C1:c.C1,C2:c.C2,tl,dws:(i1*T1+i2*T2-tl)/Jv};
  };
  const wdot0=i1*(i1*Te0-TL0)/J1;                              // aceleración del motor justo antes del cambio (C1 pegado)
  let y=[opc.arranque!==undefined?wShift*opc.arranque:Math.max(0.4*wShift,wShift-0.5*wdot0),0,0,0,0,0]; y[1]=y[0]/i1;
  const w0=y[0], ws0=y[1];
  const S={t:[],we:[],ws:[],Tc1:[],Tc2:[],Te:[],a:[],E1:[],E2:[],s1:[],s2:[],C1:[],C2:[],TL:[]};
  let t=0, tFin=null;
  const tMax=opc.tMax??(fallo?1.0:1.8), yy=[0,0,0,0,0,0];
  const sum=(a,b,h)=>{ for(let i=0;i<6;i++) yy[i]=a[i]+h*b[i]; return yy; };
  for(let k=0;k<400000;k++){
    if(trig===null&&y[0]>=wShift) trig=t;
    const k1=d(t,y); aS=k1.dws;
    if(k%nsub===0){
      S.t.push(t); S.we.push(y[0]); S.ws.push(y[1]); S.Tc1.push(k1.T1); S.Tc2.push(k1.T2); S.Te.push(k1.Te);
      S.a.push(k1.dws*VEH.kv); S.E1.push(y[2]); S.E2.push(y[3]); S.s1.push(k1.s1); S.s2.push(k1.s2); S.C1.push(k1.C1); S.C2.push(k1.C2); S.TL.push(k1.tl);
    }
    const k2=d(t+dt/2,sum(y,k1.dy,dt/2).slice()), k3=d(t+dt/2,sum(y,k2.dy,dt/2).slice()), k4=d(t+dt,sum(y,k3.dy,dt).slice());
    for(let i=0;i<6;i++) y[i]+=dt/6*(k1.dy[i]+2*k2.dy[i]+2*k3.dy[i]+k4.dy[i]);
    t+=dt;
    if(trig!==null&&tSinc===null&&t-trig>=tr&&(y[0]-i2*y[1])<E.sSinc) tSinc=t;
    if(tSinc!==null&&t-tSinc>=E.tRec+0.45){ tFin=t; break; }
    if(trig!==null&&t-trig>tMax){ tFin=t; break; }
  }
  if(trig===null) trig=0;
  for(let i=0;i<S.t.length;i++) S.t[i]-=trig;
  const tS=tSinc===null?null:tSinc-trig, N=S.t.length;
  // jerk: derivada de la aceleración filtrada con una ventana de 30 ms
  const W=Math.max(1,Math.round(0.030/1e-3)), af=new Float64Array(N);
  for(let i=0;i<N;i++){ let s=0,c=0; for(let j=Math.max(0,i-(W>>1));j<=Math.min(N-1,i+(W>>1));j++){ s+=S.a[j]; c++; } af[i]=s/c; }
  const jerk=new Float64Array(N); for(let i=1;i<N-1;i++) jerk[i]=(af[i+1]-af[i-1])/2e-3; jerk[0]=jerk[1]; jerk[N-1]=jerk[N-2];
  S.af=Array.from(af); S.jerk=Array.from(jerk);
  const idx=x=>{ const i=S.t.findIndex(q=>q>=x-1e-12); return i<0?N-1:i; };
  let jMax=0, iJ=0; for(let i=idx(-0.02);i<N;i++){ if(tS!==null&&S.t[i]>tS+E.tRec+0.2) break; if(Math.abs(jerk[i])>jMax){ jMax=Math.abs(jerk[i]); iJ=i; } }
  const iTr=idx(tr), i0=idx(0);
  S.res={ i1,i2,Te0,T2f, tr, tSinc:tS, tInercia:tS===null?null:tS-tr, jMax, tJ:S.t[iJ],
    E1:S.E1[N-1], E2:S.E2[N-1], E:S.E1[N-1]+S.E2[N-1], E2par:S.E2[iTr], E2ine:S.E2[N-1]-S.E2[iTr], E1par:S.E1[iTr],
    sincroniza:tS!==null, weTrig:S.we[i0], wsTrig:S.ws[i0], aAntes:S.af[idx(-0.02)],
    aMin:Math.min(...S.af.slice(i0,(tS===null?N-1:idx(tS))+1)), aDespues:S.af[N-1] };
  S.fin={ we:y[0], ws:y[1], E1:y[2], E2:y[3], Eent:y[4], Ecar:y[5], w0, ws0 };
  S.par=par; S.wsDisparo=S.ws[i0];
  return S;
}
/** Forma cerrada de la fase de par con C1 pegado, T_e = T_e0 y T_carga constantes:
    (Jv + Je·i₁²)·dω_s/dτ = i₁·T_e0 − (i₁ − i₂)·T_e0·τ/t_r − T_L.  Devuelve ω_s(τ). */
function wsPar(par,ws0,Te0,TL,tau,Je=VEH.Je,Jv=VEH.Jv){
  const i1=relacion(par.g), i2=relacion(par.g+1), J1=Jv+Je*i1*i1;
  return ws0+((i1*Te0-TL)*tau-(i1-i2)*Te0*tau*tau/(2*par.tr))/J1;
}
/** Energía disipada en C2 en la fase de par (integral exacta del polinomio): ∫ T_c2·s₂ dτ con s₂ = (i₁ − i₂)·ω_s. */
function energiaPar(par,ws0,Te0,TL,Je=VEH.Je,Jv=VEH.Jv){
  const i1=relacion(par.g), i2=relacion(par.g+1), J1=Jv+Je*i1*i1, tr=par.tr, k=Te0/tr;
  const b=(i1*Te0-TL)/J1, c=-(i1-i2)*Te0/(2*tr*J1);       // ω_s(τ) = ws0 + b·τ + c·τ²
  return k*(i1-i2)*(ws0*tr*tr/2+b*tr*tr*tr/3+c*tr*tr*tr*tr/4);
}
/** Fase de inercia con pares constantes (C2 sostiene T2f, el motor entrega T_e0·(1 − red) y la carga es constante):
    ṡ₂ = −[(T2f − T_e)/Je + i₂·(i₂·T2f − T_L)/Jv]; el tiempo hasta s₂ = s_fin es (s₂(t_r) − s_fin)/|ṡ₂| y la energía en C2 T2f·(s₂(t_r) + s_fin)/2·t. */
function inerciaCerrada(par,s2tr,T2f,Te,TL,sFin=0,Je=VEH.Je,Jv=VEH.Jv){
  const i2=relacion(par.g+1), tasa=(T2f-Te)/Je+i2*(i2*T2f-TL)/Jv, t=(s2tr-sFin)/tasa;
  return { t, E:T2f*(s2tr+sFin)/2*t, tasa };
}
/** Régimen síncrono del embrague entrante: n_e·i₂/i₁ (rpm) cuando el motor gira a n_e. */
const nSincrono=(g,n)=>n*relacion(g+1)/relacion(g);

/* ---------- 1.3 Geometría del dentado (evolvente de 20°) ----------
   Un engrane de Z dientes y módulo m. El semiángulo del diente en el radio ρ es
   θ(ρ) = π/(2Z) − (inv α_ρ − inv α), con cos α_ρ = r_b/ρ. `fase` es el ángulo del centro del diente 0.
   Devuelve el contorno [x, y] recorrido en sentido antihorario. */
const invEv=a=>Math.tan(a)-a;
function contornoEngrane(Z,m,o={}){
  const { interno=false, fase=0, nFlanco=7, juego=0.03 }=o;
  const r=m*Z/2, al=20*Math.PI/180, rb=r*Math.cos(al), jt=juego*m;
  const ra=interno?r-m:r+m, rf=interno?r+1.25*m:r-1.25*m;
  const med=rho=>{ const a=Math.acos(Math.min(1,rb/rho)); const h=Math.PI/(2*Z)-(invEv(a)-invEv(al));
    return interno?h+jt/(4*r):h-jt/(4*r); };

  const P=[], paso=DOSPI/Z;
  const pol=(rho,ang)=>[rho*Math.cos(ang),rho*Math.sin(ang)];
  for(let k=0;k<Z;k++){
    const c=fase+k*paso;
    if(!interno){
      // raíz → punta por el flanco izquierdo, punta → raíz por el derecho, y el arco de raíz hasta el siguiente diente
      const h0=med(rIni);
      if(rf<rb-1e-12) P.push(pol(rf,c-h0));
      for(let i=0;i<=nFlanco;i++){ const rho=rIni+(rFin-rIni)*i/nFlanco; P.push(pol(rho,c-med(rho))); }
      for(let i=nFlanco;i>=0;i--){ const rho=rIni+(rFin-rIni)*i/nFlanco; P.push(pol(rho,c+med(rho))); }
      if(rf<rb-1e-12) P.push(pol(rf,c+h0));

      const hT=med(ra), hR=med(rf);

      for(let i=1;i<=2;i++) P.push(pol(rf,c-hR+(2*hR)*i/3));
      for(let i=nFlanco;i>=0;i--){ const rho=ra+(rf-ra)*i/nFlanco; P.push(pol(rho,c+med(rho))); }

}

const DOSPI_=Math.PI*2;
function normalDeAltura(W,H,h,fuerza){
  const c=cv(W,H),x=c.getContext('2d'),im=x.createImageData(W,H);
  const A=(i,j)=>h((i+W)%W,(j+H)%H);
  for(let j=0;j<H;j++) for(let i=0;i<W;i++){
    const dx=(A(i+1,j)-A(i-1,j))*fuerza, dy=(A(i,j+1)-A(i,j-1))*fuerza, L=Math.hypot(dx,dy,1), o=(j*W+i)*4;
    im.data[o]=(-dx/L*0.5+0.5)*255; im.data[o+1]=(-dy/L*0.5+0.5)*255; im.data[o+2]=(1/L*0.5+0.5)*255; im.data[o+3]=255; }
  x.putImageData(im,0,0); return c;
}
function ruidoPeriodico(semilla,periodo){
  const g=(x,y)=>{ x=((x%periodo)+periodo)%periodo; y=((y%periodo)+periodo)%periodo;
    const s=Math.sin(x*127.1+y*311.7+semilla*13.13)*43758.5453; return s-Math.floor(s); };
  return (x,y)=>{ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    return g(xi,yi)*(1-u)*(1-v)+g(xi+1,yi)*u*(1-v)+g(xi,yi+1)*(1-u)*v+g(xi+1,yi+1)*u*v; };
}
function fbmP(semilla,periodo,oct){ const ns=[]; for(let o=0;o<oct;o++) ns.push(ruidoPeriodico(semilla+o*7,periodo*(1<<o)));

/* ===================== 5. GEOMETRÍA =====================
   `torno` revoluciona un perfil cerrado (a, r) alrededor del eje X con
   normales ANALÍTICAS: ninguna sale nula y las aristas vivas no se
   redondean. `prisma` extruye a lo largo de Z un contorno con sus huecos, con

   chapas del estátor y del rotor, que el corte enseña de frente. */
const DOSPI3=Math.PI*2;
function preparaPerfil(perfil){
  let P=[];
  for(const p of perfil){ const q=[p[0],Math.max(0,p[1])], u=P[P.length-1]; if(!u||Math.hypot(u[0]-q[0],u[1]-q[1])>1e-9) P.push(q); }
  while(P.length>2&&Math.hypot(P[0][0]-P[P.length-1][0],P[0][1]-P[P.length-1][1])<1e-9) P.pop();
  let A=0; for(let i=0;i<P.length;i++){ const p=P[i],q=P[(i+1)%P.length]; A+=p[0]*q[1]-q[0]*p[1]; }
  if(A<0) P.reverse();

}
function orienta(pos,nor,idx,i0){

/* ===================== 7. EL ESTADO Y EL CAMBIO =====================
   Un solo estado: lo que piden los mandos (marcha, pedal, régimen de cambio, rampa
   del embrague, reducción de par) se convierte en UNA serie con `cambio()` (el bloque
   verificado). La serie se recalcula al mover un mando (≈ 20 ms) y de ella salen la
   escena, las cifras y las cuatro gráficas del dock, con el mismo cursor de tiempo. */
const EST={modo:'marcha',g:1,pedal:85,nCambio:3500,trMs:260,redPct:22,esc:1/4,pausa:REDUCIDO,autoRunning:false,fallo:null,
  iJ:0,eLim:null,jLim:null};
const VISTA_ROT=1/40;                       // los árboles giran a 1/40 de su velocidad real
const SIM={S:null,tau:0,tIni:0,tFin:1,espera:0,reloj:0,ang:{ent:0,in1:0,in2:0,o:0},clave:'',w:{ent:0,in1:0,in2:0,o:0},calor1:0,calor2:0,flujo:{p1:0,p2:0}};
const parCambio=()=>({g:EST.g,pedal:EST.pedal/100,nCambio:EST.nCambio,tr:EST.trMs/1000,red:EST.redPct/100});
/** Recalcula la serie si cambió algún dato. */
function calcula(forzar){
  const p=parCambio(), clave=JSON.stringify([p,EST.fallo]);
  if(!forzar&&clave===SIM.clave) return SIM.S;
  SIM.clave=clave;
  const S=cambio(p,{fallo:EST.fallo});
  SIM.S=S; SIM.tIni=S.t[40];          // se salta el transitorio de arranque de la integración (40 ms)
  SIM.tFin=Math.min(S.t[S.t.length-1],(S.res.tSinc!==null?S.res.tSinc+0.95:1.4));
  if(SIM.tau<SIM.tIni||SIM.tau>SIM.tFin) SIM.tau=SIM.tIni;
  return S;
}
function reinicia(){ SIM.tau=SIM.tIni; SIM.espera=0; }
const idxT=(S,t)=>clamp(Math.round((t-S.t[0])/1e-3),0,S.t.length-1);
/** Estado instantáneo (todo lo que usan la escena y el dock) en el instante τ. */
function enTau(tau){
  const S=SIM.S, i=idxT(S,tau), r=S.res, g=S.par.g;
  return { i, tau, we:S.we[i], ws:S.ws[i], Tc1:S.Tc1[i], Tc2:S.Tc2[i], Te:S.Te[i], a:S.af[i], j:S.jerk[i], s1:S.s1[i], s2:S.s2[i], C1:S.C1[i], C2:S.C2[i],
    E1:S.E1[i], E2:S.E2[i], v:S.ws[i]*VEH.kv, Pd1:Math.abs(S.Tc1[i]*S.s1[i]), Pd2:Math.abs(S.Tc2[i]*S.s2[i]), g, r };
}
const smooth01=x=>{ x=clamp(x,0,1); return x*x*(3-2*x); };
/** Velocidades de los cuatro cuerpos que giran, con la lógica de los sincronizadores:
    el árbol de la marcha entrante se iguala al de salida mientras el manguito engrana, y el de la
    marcha saliente, al soltarse, se lleva a la velocidad de su marcha siguiente. */
function velocidades(p){
  const g=p.g, gI=g+1, gN=g+2, tS=p.r.tSinc===null?9:p.r.tSinc, w=p.ws, ve={};
  const tDis=tS+0.10;
  const wO=(1-smooth01((p.tau-tDis)/0.15))*relacion(g)*w+smooth01((p.tau-tDis)/0.15)*(gN<=6?relacion(gN):relacion(g))*w;
  const prev=gI-2>=1?relacion(gI-2):relacion(gI);
  const wI=(1-smooth01((p.tau+0.34)/0.18))*prev*w+smooth01((p.tau+0.34)/0.18)*relacion(gI)*w;
  ve.ent=p.we; ve.o=w;
  if(g%2===1){ ve.in1=wO; ve.in2=wI; } else { ve.in2=wO; ve.in1=wI; }
  return ve;
}
/** Qué tan engranada está cada marcha (0–1) para animar los manguitos. */
function engrane(p){
  const g=p.g, gI=g+1, gN=g+2, tS=p.r.tSinc===null?9:p.r.tSinc, e={};
  e[g]=1-smooth01((p.tau-(tS+0.10))/0.12);
  e[gI]=smooth01((p.tau+0.34)/0.18);
  if(gN<=6) e[gN]=smooth01((p.tau-(tS+0.30))/0.16);
  return e;
}

/* ===================== 8. LA ESCENA SIGUE AL MODELO =====================
   Los ángulos se integran de las velocidades del modelo a 1/40 de su valor real y los
   engranes de salida sueltos salen de su árbol de entrada (θ_salida = −θ_entrada·Z_e/Z_s):
   los dientes engranan SIEMPRE. El cambio corre a cámara lenta rotulada (EST.esc). */
function aplicaGiros(dtR,p){
  const ve=velocidades(p), A=SIM.ang, k=dtR*VISTA_ROT;
  A.ent+=ve.ent*k; A.in1+=ve.in1*k; A.in2+=ve.in2*k; A.o+=ve.o*k;
  SIM.w=ve;
  GR.ent.rotation.x=A.ent; GR.f1.rotation.x=A.in1; GR.f2.rotation.x=A.in2; GR.in1.rotation.x=A.in1; GR.in2.rotation.x=A.in2;
  GR.A.rotation.x=-A.o; GR.B.rotation.x=-A.o; GR.fd.rotation.x=A.o*CAJA.Zpin/CAJA.Zfin;
  for(let n=1;n<=6;n++) GO[n].rotation.x=-(n%2===1?A.in1:A.in2)*CAJA.Zi[n]/CAJA.Zo[n];
  // manguitos: se desplazan hacia la marcha que engranan
  const e=engrane(p), off={S13:0,S24:0,S5:0,S6:0};
  for(const [n,[k2,dir]] of Object.entries(SLEEVE_DE)) off[k2]+=dir*(e[n]||0)*0.0065;
  for(const k2 of Object.keys(MANG)) MANG[k2].position.x=XS[k2]+off[k2];
  // pistones: se cierran con la capacidad del embrague
  const c1=clamp(p.C1/Math.max(1,p.r.Te0*1.05),0,1), c2=clamp(p.C2/Math.max(1,p.r.Te0*1.05),0,1);
  PIS1.position.x=-0.0058*c1; PIS2.position.x=-0.0058*c2;
}
const _c=new THREE.Color(), C_HOT=new THREE.Color('#ff7a1c');
function pintaBrillos(p,dtR){
  const k=1-Math.exp(-dtR/0.10);
  SIM.calor1+=(clamp(p.Pd1/30000,0,1.3)-SIM.calor1)*k; SIM.calor2+=(clamp(p.Pd2/30000,0,1.3)-SIM.calor2)*k;
  M.pl1.emissive.copy(C_HOT).multiplyScalar(SIM.calor1*1.0); M.pl2.emissive.copy(C_HOT).multiplyScalar(SIM.calor2*1.0);
}

/* ---------- los flujos de potencia: puntos que recorren el camino ----------
   Naranja, la que pasa por C1 (marchas impares); verde azulado, la de C2 (pares).
   La velocidad de los puntos es proporcional a la potencia que transmite cada
   embrague y se ve cómo el relevo pasa de un color al otro. */
const PREF=90000, zt=-0.0035;
const CAMINOS=[];
const C_C1=new THREE.Color('#FFA24A'), C_C2=new THREE.Color('#4DF0D3');
function camino(pts,color,flujo,dens=0.0085){
  const P=pts.map(p=>V3(...p)), L=[0];
  for(let i=1;i<P.length;i++) L.push(L[i-1]+P[i].distanceTo(P[i-1]));
  const n=Math.max(3,Math.round(L[L.length-1]/dens)), u=new Float32Array(n); for(let i=0;i<n;i++) u[i]=(i+Math.random()*0.5)/n;
  const c={P,L,len:L[L.length-1],n,u,color,flujo,a:0};
  CAMINOS.push(c); return c;
}
/** Camino del embrague C1 (marchas impares) o C2 por la marcha n de su árbol. */
function rutaMarcha(n){
  const imp=n%2===1, sg=imp?1:-1, yEje=imp?0:-0.0207, yC=imp?0.057:-0.108, xh=imp?0.048:0.056, xp=XG[n];
  return [[0.016,yC,zt],[xh,yC,zt],[xh,yEje,zt],[xp,yEje,zt],[xp,sg*C_EJES,zt],[X_PIN-0.002,sg*C_EJES,zt],[X_PIN-0.002,0,zt],[0.486,0,zt]];
}
const CAM_IMP=[1,3,5].map(n=>camino(rutaMarcha(n),C_C1,()=>0)), CAM_PAR=[2,4,6].map(n=>camino(rutaMarcha(n),C_C2,()=>0));
const N_PUNTOS=CAMINOS.reduce((s,c)=>s+c.n,0);
const gPuntos=new THREE.BufferGeometry();
const aPos=new Float32Array(N_PUNTOS*3), aCol=new Float32Array(N_PUNTOS*3), aAlf=new Float32Array(N_PUNTOS);
gPuntos.setAttribute('position',new THREE.BufferAttribute(aPos,3).setUsage(THREE.DynamicDrawUsage));
gPuntos.setAttribute('aColor',new THREE.BufferAttribute(aCol,3));
gPuntos.setAttribute('aAlpha',new THREE.BufferAttribute(aAlf,1).setUsage(THREE.DynamicDrawUsage));
{ let o=0; for(const c of CAMINOS) for(let i=0;i<c.n;i++,o++){ aCol[o*3]=c.color.r; aCol[o*3+1]=c.color.g; aCol[o*3+2]=c.color.b; } }
const M_PUNTOS=new THREE.ShaderMaterial({
  uniforms:{uPx:{value:600},uTam:{value:0.0042}},
  vertexShader:`attribute vec3 aColor; attribute float aAlpha; varying vec3 vC; varying float vA; uniform float uPx; uniform float uTam;
    #include <clipping_planes_pars_vertex>
    void main(){ vC=aColor; vA=aAlpha; vec4 mvPosition=modelViewMatrix*vec4(position,1.0); gl_Position=projectionMatrix*mvPosition; gl_PointSize=clamp(uTam*uPx/(-mvPosition.z),2.0,24.0);
      #include <clipping_planes_vertex>
    }`,
  fragmentShader:`varying vec3 vC; varying float vA;
    #include <clipping_planes_pars_fragment>
    void main(){
      #include <clipping_planes_fragment>
      vec2 d=gl_PointCoord-0.5; float r=length(d); float a=smoothstep(0.5,0.16,r)*vA; if(a<0.01) discard;
      gl_FragColor=vec4(vC*(0.75+0.8*smoothstep(0.22,0.0,r)),a*0.9); }`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,clipping:true,clippingPlanes:[PLANO],
});
const PUNTOS=new THREE.Points(gPuntos,M_PUNTOS); PUNTOS.frustumCulled=false; PUNTOS.renderOrder=4; PUNTOS.raycast=()=>{}; EXPO.add(PUNTOS);
const _pv=new THREE.Vector3();
function puntoEn(c,u,out){ const s=u*c.len; let i=1; while(i<c.L.length-1&&c.L[i]<s) i++;
  const a=c.L[i-1], b=c.L[i], f=b>a?(s-a)/(b-a):0; return out.lerpVectors(c.P[i-1],c.P[i],f); }
function mueveFlujos(dtR,p){
  const g=p.g, gI=g+1;
  const nImp=g%2===1?g:gI, nPar=g%2===0?g:gI;                     // la marcha de cada árbol que transmite en este cambio
  const P1=Math.max(0,p.Tc1*SIM.w.in1), P2=Math.max(0,p.Tc2*SIM.w.in2);
  let o=0; const kA=1-Math.exp(-dtR/0.10);
  for(const c of CAMINOS){
    const imp=CAM_IMP.includes(c), n=imp?[1,3,5][CAM_IMP.indexOf(c)]:[2,4,6][CAM_PAR.indexOf(c)];
    const W=n===(imp?nImp:nPar)?(imp?P1:P2):0, act=W>400;
    const obj=act?Math.pow(clamp(W/PREF,0,1),0.5)*0.95+0.05:0;
    c.a+=(obj-c.a)*kA;
    const du=(0.05+0.30*Math.min(1,W/PREF))*dtR/Math.max(c.len,0.03)*(act?1:0);
    for(let i=0;i<c.n;i++,o++){
      if(!EST.pausa&&act){ c.u[i]=(c.u[i]+du)%1; }
      puntoEn(c,c.u[i],_pv); aPos[o*3]=_pv.x; aPos[o*3+1]=_pv.y; aPos[o*3+2]=_pv.z;
      const borde=Math.min(c.u[i],1-c.u[i])*c.len/0.006;

/** Un cuadro de la escena. dtR: tiempo de pantalla; el cambio avanza dtR·EST.esc. */
let PLAY=null;
function aplicaEscena(dtR){
  calcula();
  if(!EST.pausa){
    SIM.reloj+=dtR;
    if(SIM.espera>0){ SIM.espera-=dtR; if(SIM.espera<=0) SIM.tau=SIM.tIni; }
    else { SIM.tau+=dtR*EST.esc; if(SIM.tau>=SIM.tFin){ SIM.tau=SIM.tFin; SIM.espera=0.9; } }
  }
  PLAY=enTau(SIM.tau);
  aplicaGiros(EST.pausa?0:dtR,PLAY); pintaBrillos(PLAY,dtR); mueveFlujos(dtR,PLAY);
}

/* ===================== 9. CÁMARAS ENCAJADAS EN EL HUECO LIBRE ===================== */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
const esVertical=()=>innerWidth/innerHeight<0.82;
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function encaja(t,dir,pts,caja,margen=0){
  if(margen){ const mx=(caja.x1-caja.x0)*margen, my=(caja.y1-caja.y0)*margen; caja={x0:caja.x0+mx,x1:caja.x1-mx,y0:caja.y0+my,y1:caja.y1-my}; }
  const cam=camera.clone(), W=innerWidth, H=innerHeight, tan=Math.tan(cam.fov*Math.PI/360);
  cam.aspect=W/H; cam.updateProjectionMatrix();
  const cw=caja.x1-caja.x0, ch=caja.y1-caja.y0, cx=(caja.x0+caja.x1)/2, cy=(caja.y0+caja.y1)/2;
  let dist=1; const q=new THREE.Vector3(), der=new THREE.Vector3(), arr=new THREE.Vector3(); t=t.clone(); dir=dir.clone().normalize();
  for(let it=0;it<10;it++){
    cam.position.copy(t).addScaledVector(dir,dist); cam.lookAt(t); cam.updateMatrixWorld();
    let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9;
    for(const p of pts){ q.copy(p).project(cam); const sx=(q.x+1)/2*W, sy=(1-q.y)/2*H;
      a0=Math.min(a0,sx); a1=Math.max(a1,sx); b0=Math.min(b0,sy); b1=Math.max(b1,sy); }
    const k=Math.max((a1-a0)/cw,(b1-b0)/ch), wpp=2*tan*dist/H;
    der.setFromMatrixColumn(cam.matrixWorld,0); arr.setFromMatrixColumn(cam.matrixWorld,1);
    t.addScaledVector(der,((a0+a1)/2-cx)*wpp).addScaledVector(arr,-((b0+b1)/2-cy)*wpp);
    dist*=k;
  }
  return [t.clone().addScaledVector(dir,dist),t];
}
const caja3=(x0,y0,z0,x1,y1,z1)=>{ const r=[]; for(const x of [x0,x1]) for(const y of [y0,y1]) for(const z of [z0,z1]) r.push(V3(x,y,z)); return r; };
/* Tres vistas del mismo corte (z = 0): la caja entera, los dos embragues y los engranes con sus sincronizadores. */
const VISTAS={
  caja:{dir:[0.30,0.20,1],pts:()=>caja3(-0.158,-0.205,-0.135,0.495,0.205,0)},
  embragues:{dir:[0.22,0.16,1],pts:()=>caja3(-0.165,-0.150,-0.135,0.100,0.150,0)},
  engranes:{dir:[0.34,0.22,1],pts:()=>caja3(0.060,-0.185,-0.135,0.430,0.190,0)},
};
const VISTA={actual:'caja'};
function vistaCam(v){
  const V=VISTAS[v]||VISTAS.caja, H=huecoLibre();
  EXPO.rotation.z=esVertical()?-Math.PI/2:0; EXPO.updateMatrixWorld(true);
  const pts=V.pts().map(p=>p.applyMatrix4(EXPO.matrixWorld)), c=new THREE.Box3().setFromPoints(pts).getCenter(new THREE.Vector3());
  const d=V3(...V.dir); if(esVertical()) d.set(V.dir[1]*0.9,-V.dir[0]*0.9,V.dir[2]);
  return encaja(c,d,pts,H,v==='caja'?0.012:0.04);
}
const CAMT={on:false};
function ponVista(v,dur){

}
function pasaCam(dt){
  if(!CAMT.on) return;
  CAMT.u=Math.min(1,CAMT.u+dt/Math.max(CAMT.dur,1e-3)); const e=ease(CAMT.u);

const FUENTE="'Outfit',system-ui,sans-serif";
function lienzo(id){ const box=el(id), c=box.querySelector('canvas'); return {box,c,ctx:c.getContext('2d'),w:0,h:0,dpr:1}; }
function abre(L){ const r=L.box.getBoundingClientRect(), dpr=Math.min(3,window.devicePixelRatio||1);
  const w=Math.max(20,Math.round(r.width)), h=Math.max(20,Math.round(r.height));
  if(L.w!==w||L.h!==h||L.dpr!==dpr){ L.c.width=Math.round(w*dpr); L.c.height=Math.round(h*dpr); L.w=w; L.h=h; L.dpr=dpr; }
  const x=L.ctx; x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h); return x; }
function txt(x,t,px,py,col,size,align,peso){ x.fillStyle=col; x.font=(peso||'600')+' '+(size||11)+'px '+FUENTE; x.textAlign=align||'left'; x.textBaseline='alphabetic'; x.fillText(t,px,py); }
function raya(x,x1,y1,x2,y2,col,w,dash){ x.strokeStyle=col; x.lineWidth=w||1; x.setLineDash(dash||[]); x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke(); x.setLineDash([]); }
const L_PAR=lienzo('gPar'), L_REG=lienzo('gReg'), L_ACE=lienzo('gAce'), L_CAL=lienzo('gCal');
const COL_1='#FF9B45', COL_2='#37E0C7', COL_E='#EAF4F1', COL_J='#FFD166';
/** Tiene el alumno derecho a ver ya el resultado del cambio? En el reto sí (es lo que ajusta); sólo se oculta el sorteo. */
const enReto=()=>EST.modo==='guia'&&GUIA.paso==='reto';
/** Marco común de una gráfica temporal: ejes, fases (par / inercia), cursor. Devuelve las transformadas. */
function marco(L,ymin,ymax,fmtY,tics,reg){
  const x=(!reg||reg.limpia!==false)?abre(L):L.ctx, W=L.w, Hh=L.h, S=SIM.S, r=S.res, f0=reg?reg.f0:0, f1=reg?reg.f1:1;
  const m={l:34,r:6,t:Math.round(f0*Hh)+6,b:Hh-Math.round(f1*Hh)+(f1>=1?15:3)};
  const t0=Math.max(SIM.tIni,-0.35), t1=SIM.tFin;
  const X=t=>m.l+(t-t0)/(t1-t0)*(W-m.l-m.r), Y=v=>m.t+(1-(v-ymin)/(ymax-ymin))*(Hh-m.t-m.b);
  // fases: par (naranja suave) e inercia (verde azulado suave)
  x.fillStyle='rgba(255,155,69,0.09)'; x.fillRect(X(0),m.t,X(r.tr)-X(0),Hh-m.t-m.b);
  if(r.tSinc!==null){ x.fillStyle='rgba(55,224,199,0.09)'; x.fillRect(X(r.tr),m.t,X(r.tSinc)-X(r.tr),Hh-m.t-m.b); }
  x.strokeStyle='rgba(143,179,172,0.30)'; x.lineWidth=1; x.strokeRect(m.l+0.5,m.t+0.5,W-m.l-m.r,Hh-m.t-m.b);
  for(const v of tics){ raya(x,m.l,Y(v),W-m.r,Y(v),'rgba(143,179,172,0.11)',1,[2,3]); txt(x,fmtY(v),m.l-4,Y(v)+3,'#8fb3ac',9,'right','500'); }
  if(f1>=1) for(const t of [0,0.5,1,1.5]) if(t>=t0&&t<=t1){ txt(x,fN(t,1)+' s',X(t),Hh-3,'#8fb3ac',9,'center','500'); raya(x,X(t),Hh-m.b,X(t),Hh-m.b+3,'#3d5550'); }
  return {x,X,Y,m,W,H:Hh,t0,t1};
}
function traza(G,arr,col,w,dash,desde,hasta){
  const {x,X,Y,m,W}=G, S=SIM.S, n=S.t.length; let ini=true; const paso=Math.max(1,Math.floor(n/Math.max(1,W)));
  x.strokeStyle=col; x.lineWidth=w||1.6; x.setLineDash(dash||[]); x.beginPath();
  for(let i=0;i<n;i+=paso){ const t=S.t[i]; if(t<G.t0||t>G.t1) continue; const px=X(t), py=clamp(Y(arr[i]),m.t-2,G.H-m.b+2); ini?x.moveTo(px,py):x.lineTo(px,py); ini=false; }
  x.stroke(); x.setLineDash([]);
}
function cursor(G,val,col){ const {x,X,Y,m}=G, t=PLAY.tau; if(t<G.t0||t>G.t1) return; raya(x,X(t),m.t,X(t),G.H-m.b,'rgba(255,255,255,0.75)',1.2);
  if(val!==undefined){ x.fillStyle=col; x.beginPath(); x.arc(X(t),clamp(Y(val),m.t,G.H-m.b),3.2,0,DOSPI); x.fill(); } }
function ticksDe(a,b,n){ const p=(b-a)/n, mag=Math.pow(10,Math.floor(Math.log10(p))), f=p/mag, s=(f<1.5?1:f<3.5?2:f<7.5?5:10)*mag, r=[]; for(let v=Math.ceil(a/s)*s;v<=b+1e-9;v+=s) r.push(+v.toFixed(8)); return r; }

/** Lo que se ve de una serie: el tramo entre el inicio dibujado y el fin. */
const vent=a=>{ const S=SIM.S, i0=idxT(S,Math.max(SIM.tIni,-0.35)), i1=idxT(S,SIM.tFin); return a.slice(i0,i1+1); };
function pintaPar(){
  const S=SIM.S, ymax=Math.ceil(Math.max(...vent(S.Te),...vent(S.Tc1),...vent(S.Tc2))*1.1/50)*50, G=marco(L_PAR,0,ymax,v=>fN(v,0),ticksDe(0,ymax,3));
  traza(G,S.Te,'rgba(234,244,241,0.75)',1.3,[4,3]); traza(G,S.Tc1,COL_1,2); traza(G,S.Tc2,COL_2,2);
  cursor(G,PLAY.Tc2,COL_2); cursor(G,PLAY.Tc1,COL_1);
  txt(G.x,'N·m',G.m.l+4,G.m.t+10,'#6f8a85',8.5,'left','500');
}
function pintaReg(){
  const S=SIM.S, g=S.par.g, i1=relacion(g), i2=relacion(g+1), n=S.t.length;
  const aE=S.we.map(w=>w/RPM), aO=S.ws.map(w=>i1*w/RPM), aI=S.ws.map(w=>i2*w/RPM);
  const lo=Math.floor(Math.min(...vent(aE),...vent(aI))*0.9/500)*500, hi=Math.ceil(Math.max(...vent(aE),...vent(aO))*1.05/500)*500, G=marco(L_REG,lo,hi,v=>fN(v/1000,1)+'k',ticksDe(lo,hi,3));
  const c1=g%2===1?COL_1:COL_2, c2=g%2===1?COL_2:COL_1;
  traza(G,aO,c1,1.5,[5,3]); traza(G,aI,c2,1.5,[5,3]); traza(G,aE,COL_E,2.1);
  cursor(G,PLAY.we/RPM,COL_E);
  txt(G.x,'rpm',G.m.l+4,G.m.t+10,'#6f8a85',8.5,'left','500');
  void n;
}
function pintaAce(){
  const S=SIM.S, lim=EST.jLim, amax=Math.max(...vent(S.af)), amin=Math.min(...vent(S.af));
  const aTop=Math.ceil(amax*1.15), aBot=Math.max(0,Math.floor(amin*0.9));
  const Ga=marco(L_ACE,aBot,aTop,v=>fN(v,0),ticksDe(aBot,aTop,2),{f0:0,f1:0.52,limpia:true});
  traza(Ga,S.af,COL_E,2.1); cursor(Ga,PLAY.a,COL_E);
  txt(Ga.x,'a · m/s²',Ga.m.l+4,Ga.m.t+10,'#8fb3ac',8.5,'left','500');
  const jm=Math.max(Math.ceil(Math.max(...vent(S.jerk).map(Math.abs),lim||0)*1.15/5)*5,5);
  const Gj=marco(L_ACE,-jm,jm,v=>fN(v,0),ticksDe(-jm,jm,2),{f0:0.56,f1:1,limpia:false});
  raya(Gj.x,Gj.m.l,Gj.Y(0),Gj.W-Gj.m.r,Gj.Y(0),'rgba(143,179,172,0.40)',1);
  if(lim){ for(const s2 of [1,-1]) raya(Gj.x,Gj.m.l,Gj.Y(s2*lim),Gj.W-Gj.m.r,Gj.Y(s2*lim),'rgba(244,71,94,0.85)',1.2,[4,3]); txt(Gj.x,'límite '+fN(lim,1),Gj.W-Gj.m.r-2,Gj.Y(lim)-3,'#ff9aa8',8.5,'right','600'); }
  traza(Gj,S.jerk,COL_J,1.7); cursor(Gj,PLAY.j,COL_J);
  txt(Gj.x,'tirón · m/s³',Gj.m.l+4,Gj.m.t+10,'rgba(255,209,102,0.85)',8.5,'left','500');
}
function pintaCal(){
  const S=SIM.S, tot=S.E1.map((v,i)=>v+S.E2[i]), top=Math.max(...vent(tot),EST.eLim?EST.eLim*1000:0)/1000, ymax=Math.max(2,Math.ceil(top*1.15/2)*2);
  const G=marco(L_CAL,0,ymax,v=>fN(v,0),ticksDe(0,ymax,3)), {x,X,Y,m}=G;
  if(EST.eLim){ raya(x,m.l,Y(EST.eLim),G.W-m.r,Y(EST.eLim),'rgba(244,71,94,0.85)',1.2,[4,3]); txt(x,'límite',G.W-m.r-2,Y(EST.eLim)-3,'#ff9aa8',8.5,'right','600'); }
  traza(G,S.E1.map(v=>v/1000),COL_1,2); traza(G,S.E2.map(v=>v/1000),COL_2,2); traza(G,tot.map(v=>v/1000),'rgba(234,244,241,0.8)',1.3,[4,3]);

const _cl=(id,c)=>{ const e=el(id); if(e.className!==c) e.className=c; };

function faseDe(p){

/* ===================== 15. EL LABORATORIO GUIADO =====================
   Tres fases y un cierre:
   1 · Sincronismo (calcular a qué régimen debe quedar el motor), 2 · El ajuste
   (rampa y reducción de par que cumplen un límite de tirón Y de calor),
   3 · Diagnóstico (una de tres fallas al azar) y el quiz. Tres fallos en un reto
   cambian el dato. Nada de lo que se pide se enseña antes de validar. */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const shuffled=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const SINC_POOL=[{g:1,n:3000},{g:1,n:4000},{g:2,n:3500},{g:2,n:4500},{g:3,n:4000},{g:4,n:5000},{g:3,n:3000},{g:5,n:5500},{g:1,n:2600},{g:2,n:5200}];
/* Los escenarios del ajuste: (marcha, pedal, régimen) y un «punto de diseño» OCULTO (t_r, red) del que sale
   el margen: los límites son el tirón y el calor de ese punto más un 10 %. El alumno nunca lo ve. */
const RETO_POOL=[{g:1,ped:85,n:3500,tr:0.28,red:0.20},{g:1,ped:70,n:4200,tr:0.30,red:0.18},{g:2,ped:90,n:4000,tr:0.26,red:0.22},{g:2,ped:75,n:3200,tr:0.32,red:0.20},{g:3,ped:100,n:4000,tr:0.30,red:0.20},{g:4,ped:100,n:4000,tr:0.30,red:0.20},{g:5,ped:100,n:4200,tr:0.30,red:0.20}];
const DX_POOL=[{g:1,ped:80,n:3500},{g:2,ped:75,n:4000},{g:3,ped:85,n:4500}];
const FALLAS=['sinc','c1pega','c2debil'];
const NOMFALLA={sinc:'marcha entrante sin engranar',c1pega:'C1 pegado (no abre)',c2debil:'C2 gastado (poca capacidad)'};
let SINC=pickOne(SINC_POOL), RE=null, DX=pickOne(DX_POOL);
const RETO={intentos:0,resiembras:0,fallosS:0,fallosR:0,fallosDx:0,pistasS:0,pistasR:0,hecho:false};
const GUIA={phase:0,paso:'sinc',iniciado:false,sOk:false,rOk:false,falla:null,reparado:false,sintoma:''};
const r05=(x,p)=>Math.ceil(x/p-1e-9)*p;
function nuevoReto(){
  const prev=RE; let c; do{ c=pickOne(RETO_POOL); }while(prev&&c===prev.c);
  const S=cambio({g:c.g,pedal:c.ped/100,nCambio:c.n,tr:c.tr,red:c.red}), r=S.res;
  RE={c,g:c.g,ped:c.ped,n:c.n,jLim:r05(r.jMax*1.10,0.5),eLim:r05(r.E/1000*1.10,0.5)};
}
nuevoReto();
function aplicaReto(){
  EST.g=RE.g; EST.pedal=RE.ped; EST.nCambio=RE.n; EST.jLim=RE.jLim; EST.eLim=RE.eLim; EST.trMs=200; EST.redPct=5; EST.fallo=null; reinicia();
}
const nSinDe=(c)=>nSincrono(c.g,c.n);

/* ---------- Fase 1: el sincronismo ---------- */
function checkSinc(){
  const raw=String((el('ansS')||{}).value||'').trim().replace(/\s| /g,'').replace(',','.');
  const v=parseFloat(raw), correcto=nSinDe(SINC);
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe el régimen en rpm (coma o punto decimal).'); return; }
  RETO.intentos++;
  const tol=Math.max(40,0.012*correcto);
  if(Math.abs(v-correcto)<tol){
    RETO.fallosS=0; GUIA.sOk=true;
    feedback('good','¡Correcto! ✓',`n<sub>sinc</sub> = n<sub>e</sub>·i<sub>${SINC.g+1}</sub>/i<sub>${SINC.g}</sub> = ${fN(SINC.n,0)}·${fN(relacion(SINC.g+1),3)}/${fN(relacion(SINC.g),3)} = ${fN(correcto,0)} rpm. Es lo que debe bajar el motor durante la fase de inercia: el coche no cambia de velocidad, sólo la relación.`,true);
    sonido.bien(); setTimeout(()=>{ GUIA.phase=1; aplicaReto(); pasoA('reto'); },2000);
  } else {
    RETO.fallosS++; sonido.mal();
    const ingenuo=Math.abs(v-SINC.n)<60, inv=Math.abs(v-SINC.n*relacion(SINC.g)/relacion(SINC.g+1))<tol*2;
    if(RETO.fallosS>=3){ RETO.fallosS=0; RETO.resiembras++; const p=SINC; do{ SINC=pickOne(SINC_POOL); }while(SINC===p); feedback('bad','Tres intentos fallidos','Cambia el caso: vuelve a plantear el cálculo con los nuevos datos.'); setTimeout(()=>pasoA('sinc'),1400); }
    else { feedback('bad','Revisa el cálculo',`Tu resultado (${fN(v,0)} rpm) no coincide.`+(ingenuo?' ¿El motor no cambia de régimen al cambiar de marcha?':(inv?' Mira qué marcha es la que tiene la relación mayor: al subir, el motor baja.':' La velocidad del coche no cambia durante el cambio; sólo cambia la relación entre motor y salida.'))+` (intentos fallidos: ${RETO.fallosS}/3)`);
      const t=el('d_try'); if(t) t.textContent=RETO.fallosS; }
  }
}

/* ---------- Fase 2: el ajuste ---------- */
function checkReto(){
  const S=calcula(), r=S.res; RETO.intentos++;
  const jOk=r.jMax<=RE.jLim, eOk=r.E/1000<=RE.eLim, sOk=r.sincroniza;
  if(sOk&&jOk&&eOk){
    RETO.fallosR=0; GUIA.rOk=true; sonido.bien();
    feedback('good','¡Cambio ajustado! ✓',`Con una rampa de ${fN(EST.trMs,0)} ms y una reducción de par del ${fN(EST.redPct,0)} %: tirón ${fN(r.jMax,1)} m/s³ (límite ${fN(RE.jLim,1)}) y ${fN(r.E/1000,1)} kJ en los embragues (límite ${fN(RE.eLim,1)}). Cambio completo en ${fN(r.tSinc*1000,0)} ms. Fíjate: ni la rampa más larga ni la reducción más fuerte lo resuelven por sí solas; cada una arregla un problema y empeora el otro.`,true);
    pasoA('reto'); setTimeout(()=>{ GUIA.phase=2; startDx(); },4200);
  } else {
    RETO.fallosR++; sonido.mal();
    let tit, msg;
    if(!sOk){ tit='El motor no sincroniza'; msg='Sin bajar el par del motor, C2 no logra frenarlo: sube hasta el corte de inyección. Revisa la reducción de par.'; }
    else if(!jOk&&!eOk){ tit='Demasiado tirón y demasiado calor'; msg=`Tirón ${fN(r.jMax,1)} m/s³ (límite ${fN(RE.jLim,1)}) y ${fN(r.E/1000,1)} kJ (límite ${fN(RE.eLim,1)}). Las dos cosas fallan: cada mando tira de ellas en sentidos distintos.`; }
    else if(!jOk){ tit='Tirón por encima del límite'; msg=`Tirón ${fN(r.jMax,1)} m/s³ (límite ${fN(RE.jLim,1)}). El tirón nace en dos momentos: cuando el par pasa de C1 a C2 y cuando el motor aterriza en el sincronismo.`; }
    else { tit='Calor por encima del límite'; msg=`${fN(r.E/1000,1)} kJ (límite ${fN(RE.eLim,1)}). El calor es el trabajo de C2 patinando: cuenta cuánto dura cada fase.`; }
    if(RETO.fallosR>=3){ RETO.fallosR=0; RETO.resiembras++; nuevoReto(); aplicaReto(); feedback('bad','Tres intentos fallidos','Cambia el caso: otro coche en otra marcha, con otros límites.'); setTimeout(()=>pasoA('reto'),1400); }
    else { feedback('bad',tit,msg+` (intentos fallidos: ${RETO.fallosR}/3)`); const t=el('d_tryr'); if(t) t.textContent=RETO.fallosR; }
  }
}

/* ---------- Fase 3: el diagnóstico ---------- */
function startDx(){
  GUIA.phase=2; GUIA.paso='dx'; GUIA.reparado=false; GUIA.falla=pickOne(FALLAS); DX=pickOne(DX_POOL);
  EST.g=DX.g; EST.pedal=DX.ped; EST.nCambio=DX.n; EST.trMs=280; EST.redPct=22; EST.jLim=null; EST.eLim=null; EST.fallo=GUIA.falla; reinicia();
  GUIA.sintoma=''; pintaHUD(); ponVista('caja');
  setTimeout(()=>{ GUIA.sintoma=sintomaDe(GUIA.falla); const s=el('symptomTask'); if(s){ s.innerHTML=GUIA.sintoma; ajustaHoja(); } },900);
}
function sintomaDe(f){
  const S=calcula(), r=S.res, g=EST.g, nMax=Math.max(...S.we)/RPM;
  if(f==='sinc') return `SÍNTOMA: al pasar de ${g}.ª a ${g+1}.ª el coche <b>deja de acelerar</b> (la aceleración cae a ${fN(r.aMin,1)} m/s²) mientras el motor <b>se embala</b> hasta ${fN(nMax,0)} rpm. ¿Qué lo causa?`;
  if(f==='c1pega') return `SÍNTOMA: en el cambio de ${g}.ª a ${g+1}.ª el motor <b>no baja de régimen</b> (${fN(S.we[S.we.length-1]/RPM,0)} rpm al final) y C2 acumula ${fN(r.E2/1000,1)} kJ patinando sin parar. ¿Qué lo causa?`;
  return `SÍNTOMA: en el cambio de ${g}.ª a ${g+1}.ª el motor sube hasta ${fN(nMax,0)} rpm y el coche acelera, pero <b>menos de lo debido</b> (cae a ${fN(r.aMin,1)} m/s² en el cambio). ¿Qué lo causa?`;
}
function diagnostica(choice){
  if(!GUIA.falla||GUIA.paso!=='dx') return;
  RETO.intentos++;
  if(choice===GUIA.falla){ RETO.fallosDx=0; sonido.bien(); feedback('good','Diagnóstico correcto ✓',explica(GUIA.falla)+' <b>Ahora corrígelo.</b>',true); pasoA('reparar'); }
  else {
    RETO.fallosDx++; sonido.mal();
    if(RETO.fallosDx>=3){
      RETO.fallosDx=0; RETO.resiembras++; const p=GUIA.falla; GUIA.falla=pickOne(FALLAS.filter(f=>f!==p)); EST.fallo=GUIA.falla; reinicia();
      feedback('bad','Tres intentos fallidos','La caja presenta ahora OTRA falla: observa de nuevo la escena y las gráficas.',true);
      GUIA.sintoma=sintomaDe(GUIA.falla); pintaHUD();
    } else { feedback('bad','No es esa la falla','Eso ('+NOMFALLA[choice]+') daría otro síntoma: '+contraria(choice)+' Observa otra vez. (intentos fallidos: '+RETO.fallosDx+'/3)',true); pintaHUD(); }
  }
}
function explica(f){
  if(f==='sinc') return 'Si el sincronizador no engrana la marcha entrante, C2 no tiene a qué agarrarse: C1 se abre y el par de salida cae a cero. El coche sólo frena por la resistencia y el motor, sin carga, se embala (el «agujero de par» de una caja robotizada normal, aquí por avería).';
  if(f==='c1pega') return 'Con C1 pegado, el motor sigue unido a la marcha vieja mientras C2 intenta llevarlo a la nueva: son dos relaciones a la vez. El motor no baja de régimen, C2 patina todo el cambio y se quema.';
  return 'Un C2 gastado sólo transmite una parte del par: al abrir C1 el motor se acelera por encima de la marcha entrante, el par de salida cae y C2 patina más tiempo de lo debido.';
}
function contraria(f){
  if(f==='sinc') return 'sin marcha engranada el par de salida desaparece del todo y el coche frena; no seguiría acelerando.';
  if(f==='c1pega') return 'con C1 pegado el motor ni se embala ni el coche deja de acelerar: el régimen queda atado a la marcha saliente.';
  return 'un C2 gastado sigue transmitiendo algo: el coche no frena, sólo acelera menos y el motor se pasa de vueltas.';
}
function repara(){
  GUIA.reparado=true; GUIA.falla=null; EST.fallo=null; reinicia(); RETO.hecho=true; sonido.bien();
  feedback('good','¡Reparado! 🎉','La caja vuelve a cambiar sin interrupción. Has calculado el sincronismo, ajustado un cambio con dos límites a la vez y diagnosticado una falla real. Falta el cierre.',true);
  setTimeout(()=>{ startQuiz(); },2200);
}

/* ---------- el cierre: un quiz con las opciones barajadas ----------
   Cada caso pone en la escena y en el dock EXACTAMENTE lo que se pregunta: el dock no se queda con otro estado. */

/* ---------- el enrutador de acciones (la API de siempre) ---------- */
function pasoA(p){ GUIA.paso=p; if(EST.modo==='guia') pintaHUD(); }
function handleAction(act,btn){
  switch(act){
    case 'check-s': checkSinc(); break;
    case 'hint-s':
      if(RETO.pistasS===0){ RETO.pistasS=1; feedback('good','Pista 1 de 2','La velocidad del coche no cambia durante el cambio: ω<sub>s</sub> es la misma. Cada embrague lleva al motor a i·ω<sub>s</sub>.'); }
      else if(RETO.pistasS===1){ RETO.pistasS=2; feedback('good','Pista 2 de 2','Al terminar, el motor gira a i<sub>entrante</sub>·ω<sub>s</sub>. Con i = Z<sub>salida</sub>/Z<sub>entrada</sub> de la tabla, queda n<sub>e</sub>·i<sub>entrante</sub>/i<sub>saliente</sub>.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break;
    case 'check-r': checkReto(); break;
    case 'hint-r':
      if(RETO.pistasR===0){ RETO.pistasR=1; feedback('good','Pista 1 de 2','Dos mandos, dos trabajos: la <b>rampa</b> decide cuánto dura el relevo de par; la <b>reducción</b> decide cuánto tarda el motor en bajar. Cada uno arregla un límite y empeora el otro.'); }
      else if(RETO.pistasR===1){ RETO.pistasR=2; feedback('good','Pista 2 de 2','Mira las dos zonas sombreadas de las gráficas: naranja es la fase de par; verde azulado, la de inercia. El tirón se lee en la gráfica de aceleración; el calor, en la de energía.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto.');
      break;
    case 'dx-sinc': diagnostica('sinc'); break;
    case 'dx-c1pega': diagnostica('c1pega'); break;
    case 'dx-c2debil': diagnostica('c2debil'); break;
    case 'repair': if(GUIA.paso==='reparar') repara(); break;
    case 'restart': location.reload(); break;
    default: if(/^quiz-\d$/.test(act)) responde(+act.slice(5));
  }
}

/* ---------- los modos ---------- */
function setMode(m,forzar){
  if(!forzar&&(m===EST.modo||EST.autoRunning)) return;
  if(m==='guia'){
    EST.modo='guia';
    if(!GUIA.iniciado){ GUIA.iniciado=true; GUIA.phase=0; GUIA.paso='sinc'; }
    // el caso del paso en curso: la escena y el dock enseñan lo mismo que el texto
    if(GUIA.paso==='sinc'){ EST.g=SINC.g; EST.nCambio=SINC.n; EST.pedal=85; EST.trMs=260; EST.redPct=22; EST.jLim=null; EST.eLim=null; EST.fallo=null; }
    ponVista('caja');
  } else { EST.modo='marcha'; EST.jLim=null; EST.eLim=null; EST.fallo=null; ponVista('caja'); }
  reinicia();
  document.body.classList.toggle('m-marcha',EST.modo==='marcha'); document.body.classList.toggle('m-guia',EST.modo==='guia');

/* ---------- el recorrido guiado de «En marcha» ---------- */
const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function runAuto(){
  if(EST.autoRunning||EST.modo!=='marcha') return; EST.autoRunning=true; sonido.init();
  const hud=el('hud');
  const prev={g:EST.g,pedal:EST.pedal,nCambio:EST.nCambio,trMs:EST.trMs,redPct:EST.redPct,esc:EST.esc,pausa:EST.pausa,vista:VISTA.actual};
  const fija=o=>{ Object.assign(EST,o); reinicia(); pintaHUD(); hud.style.pointerEvents='none'; const b=el('btnAuto'); if(b){ b.disabled=true; b.textContent='Recorrido en curso…'; } pintaDockFijo(); pintaBarras(); };
  try{
    fija({g:1,pedal:85,nCambio:3500,trMs:280,redPct:22,pausa:false}); ponVista('caja');
    showToast('Paso 1 · <b>Cambio 1→2</b> bien ajustado. Antes de empezar, la 2.ª ya está engranada en el árbol hueco: mira el manguito deslizarse. Las flechas de color son la potencia de cada embrague.',9000);
    await espera(9400);
    ponVista('embragues');
    showToast('Paso 2 · <b>El relevo de par.</b> C1 (naranja) suelta mientras C2 (verde azulado) aprieta; el par de salida no se interrumpe. Después, C1 se abre y C2 patina mientras el motor baja: el brillo naranja es su calor.',10500);
    await espera(10900);
    ponVista('caja'); fija({trMs:90});
    showToast('Paso 3 · <b>Rampa de 90 ms:</b> el relevo es casi instantáneo. La aceleración cae de golpe y el tirón (área amarilla) se dispara.',8000);
    await espera(8400);
    fija({trMs:560});
    showToast('Paso 4 · <b>Rampa de 560 ms:</b> el tirón baja, pero C2 patina durante toda la fase de par y el calor sube.',8000);
    await espera(8400);
    fija({trMs:280,redPct:0});
    showToast('Paso 5 · <b>Sin reducir el par del motor</b> el motor casi no pierde régimen: la fase de inercia se alarga y el calor se dispara.',8500);
    await espera(8900);
    fija({redPct:22}); ponVista('engranes');
    showToast('Paso 6 · Con la reducción, el cambio termina en una fracción del tiempo. Después, el sincronizador suelta la 1.ª y <b>preselecciona la 3.ª</b> en el árbol de C1, sin carga.',9500);
    await espera(9900);
  } finally {
    Object.assign(EST,prev); reinicia(); EST.autoRunning=false; hud.style.pointerEvents='';
    pintaHUD(); pintaDockFijo(); ponVista(prev.vista); pintaBarras();
  }
}


/* ===================== 16. SONIDO (sintetizado) =====================
   El zumbido del motor sigue a su régimen: más agudo cuanto más deprisa. */
const sonido=(function(){
  let ctx=null,on=true,master=null,oscM=null,gM=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      oscM=ctx.createOscillator(); oscM.type='sawtooth'; const fM=ctx.createBiquadFilter(); fM.type='lowpass'; fM.frequency.value=420; gM=ctx.createGain(); gM.gain.value=0; oscM.connect(fM); fM.connect(gM); gM.connect(master); oscM.start();
    }catch(e){ ctx=null; } }
  function actualiza(p,activo){ if(!ctx||!p) return; const t=ctx.currentTime;
    oscM.frequency.setTargetAtTime(30+p.we/RPM/60*2,t,0.05);                     // 4 cilindros: 2 explosiones por vuelta
    gM.gain.setTargetAtTime(on&&activo?0.022*(0.35+0.65*Math.min(1,p.Te/300)):0,t,0.08); }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); }
  return {init,actualiza,
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; },
    get vol(){ return gM?gM.gain.value:0; }, get freq(){ return oscM?oscM.frequency.value:0; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});

/* ===================== 17. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.min(devicePixelRatio,alta?2:1.5));
  const ms=alta?2048:1024; if(LUZ.clave.shadow.mapSize.x!==ms){ LUZ.clave.shadow.mapSize.set(ms,ms); if(LUZ.clave.shadow.map){ LUZ.clave.shadow.map.dispose(); LUZ.clave.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  M_PUNTOS.uniforms.uPx.value=innerHeight*renderer.getPixelRatio()/(2*Math.tan(camera.fov*Math.PI/360));
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  M_PUNTOS.uniforms.uPx.value=innerHeight*renderer.getPixelRatio()/(2*Math.tan(camera.fov*Math.PI/360));
  colocaBarras();
  clearTimeout(window.__rzTH); window.__rzTH=setTimeout(()=>ponVista(VISTA.actual,0.01),140);
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 18. EL LAZO: UN SOLO RELOJ =====================
   La serie del cambio (SIM.S) se calcula una vez por cambio de mando y con SU
   cursor τ se pintan la escena (giros, manguitos, pistones, brillos y flujos)
   y las cuatro gráficas del dock. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  aplicaEscena(dt);
  pasaCam(dt);
  sonido.actualiza(PLAY,!EST.pausa);
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaPar(); pintaReg(); pintaAce(); pintaCal(); }
  controls.update();
  PASO_G.value=clamp(0.0030*camera.position.distanceTo(controls.target),0.0007,0.008);
  renderer.info.reset(); composer.render();
  colocaRotulos();
}
