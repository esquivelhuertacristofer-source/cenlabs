<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Filtro de partículas: hollín y regeneración — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#120d0a;--panel:rgba(20,14,10,.88);--line:#5a3d27;--ink:#F6EEE8;
    --dim:#BCA896;--accent:#FF9A3C;--accent2:#FFC58A;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cF:#FF9A3C;--cR:#FF6A55;--cE:#FF4D5A;--cG:#C8D6D2;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(10,6,4,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#2a1d14;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#3a2819}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#2a1100;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#2a1100;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#ffb878}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#2a1100}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#FF9A3C;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#9a8573;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#e0cfc1;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#a8927f;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#2a1100}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#d9b070;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .escs{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
  .esc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px;font-size:11.5px;line-height:1.35;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.20);border:1px solid rgba(90,61,39,.7);color:#e0cfc1}
  .esc .rs{font-weight:700;font-size:11px}.esc .rs.ok{color:var(--good)}.esc .rs.mal{color:#ff9a9a}
  .esc .pista{font-size:10.5px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#150f0a;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(90,61,39,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(90,61,39,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#9a8573}
  .dk-tit{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#d0b9a6;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(90,61,39,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#d3beac;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#2a1d14;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#ecdccd;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  /* ---- el recorrido paso a paso y el aro que señala la pieza ---- */
  .tour{border:1px solid rgba(255,154,60,.38);background:rgba(255,154,60,.06);border-radius:12px;padding:10px 11px;display:flex;flex-direction:column;gap:7px}
  .tour .tn{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .tour .pts{display:flex;gap:5px}.tour .pts i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}.tour .pts i.on{background:var(--accent)}.tour .pts i.ok{background:var(--good)}
  .tour h3{font-size:16px;line-height:1.2}
  .tour .tx{font-size:13px;line-height:1.5;color:#f0e2d6}.tour .tx b{color:#fff}
  .tour .tb{display:flex;gap:6px}.tour .tb .b{flex:1}
  .tour .salta{align-self:flex-end;font-size:11px;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:0;font-family:inherit}
  .foco{position:fixed;z-index:14;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 3px rgba(255,154,60,.55),0 0 24px 6px rgba(255,154,60,.45);pointer-events:none;display:none;animation:pulso 1.5s ease-in-out infinite}
  @keyframes pulso{0%,100%{transform:scale(.88);opacity:.95}50%{transform:scale(1.12);opacity:.55}}
  @media (prefers-reduced-motion:reduce){.foco{animation:none}}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(22,15,10,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(22,15,10,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#e0cfc1}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(22,15,10,.92);border:1px solid rgba(255,170,90,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(22,15,10,.84);border:1px solid rgba(255,170,90,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .chips{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .chip{font-size:11.5px;line-height:1.35;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--dim)}
  .chip b{color:var(--ink)} .chip small{font-size:10.5px;color:var(--dim)}
  .chip.ok{border-color:rgba(52,211,153,.5)} .chip.ok b{color:var(--good)} .chip.mal{border-color:rgba(244,71,94,.5)} .chip.mal b{color:#ff9aa8}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}
  body.estrecho.ancho.t-panel .panel>.dk-fig{grid-column:1;grid-row:2}
  body.estrecho.ancho.t-panel .panel>.dk-row{grid-column:1;grid-row:3/6;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-fu{grid-column:2;grid-row:2;align-self:start}
  body.estrecho.ancho.t-panel .panel>.dk-g.fu{grid-column:2;grid-row:2/4;min-height:0;margin-top:18px}
  body.estrecho.ancho.t-panel .panel>.dk-ley{display:none}
  body.estrecho.ancho.t-panel .panel>.t-sp{grid-column:2;grid-row:4}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   LAB — FILTRO DE PARTÍCULAS (DPF/GPF): HOLLÍN, CONTRAPRESIÓN Y REGENERACIÓN
   (Autotrónica · mecanica-149)

   El escape de un diésel en media sección: el motor suelta hollín, el oxidante prepara el gas y el filtro de pared porosa lo
   atrapa. El hollín crece como una torta en las paredes y sube la contrapresión (Darcy); se quema sin ayuda con NO2 (pasiva,
   250–450 °C) o a la fuerza con post-inyección (activa, ~600 °C), y una parada a media quema puede desbocarla. El motor, el filtro
   por celdas, la cinética de Arrhenius, el balance de energía y el mando de la regeneración son un único modelo, en un bloque
   puro que un script de Node extrae TAL CUAL y verifica.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO='\u202F';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }



/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos marcas— y lo prueba:
   lo que se prueba es lo que corre. */
/* FISICA:INICIO */
/* ---- Filtro de partículas (DPF/GPF): física pura (sin three). Unidades SI salvo donde se diga. ----
   Cadena: motor diésel (hollín crudo, caudal y temperatura del gas) → filtro de pared porosa dividido en N celdas axiales
   con hollín por celda y temperatura del sustrato por celda → caída de presión (canales + pared de Darcy + torta de hollín
   + ceniza) → oxidación del hollín (O2 térmica de Arrhenius y NO2 pasiva) con su calor → regeneración activa por
   post-inyección. Todo cierra su balance de masa de carbono y su balance de energía. */
const DOSPI=Math.PI*2, R_GAS=8.314462618;
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const MC=12.011;                                    // g/mol de carbono
const DHC_O2=393.5e3/MC;                            // J por g de C que arde con O2: C + O2 → CO2 (ΔH = −393,5 kJ/mol)
const DHC_NO2=279.3e3/MC;                           // J por g de C que arde con NO2: C + 2 NO2 → CO2 + 2 NO (ΔH = −279,3 kJ/mol)
const T_AMB=298.15, M_AIRE=0.02897, M_NO2=46.0055;

/* ---- Motor diésel de 120 kW (mapa didáctico en la carga L de 0 a 1) ---- */
const MOT={Pmax:120e3,etaE:0.40,LHVd:35.9e6,cpG:1100,etaDOC:0.85,Pamb:1.05e5,Rair:287};
const motor=L=>{
  L=clamp(L,0,1); const P=L*MOT.Pmax, eNOx=3.0+4.5*L, eS=0.12+0.9*Math.exp(-L/0.18);      // g/kWh de NOx (como NO2) y de hollín crudos
  return {L,P,eNOx,mNOx:eNOx*P/1000,eS,mS:eS*P/1000,mGas:0.025+0.135*L,Tg:120+360*Math.pow(L,0.8),Pcomb:P/MOT.etaE,yO2:0.185-0.115*L};   // g/h · kg/s · °C · W · fracción molar
};
const noxPPM=m=>m.mNOx/M_NO2/3600/(m.mGas/M_AIRE)*1e6;                                   // ppm de NOx en el gas
const muGas=T=>1.458e-6*Math.pow(T,1.5)/(T+110.4);                                          // Pa·s (Sutherland, aire)
const rhoGas=T=>MOT.Pamb/(MOT.Rair*T);                                                      // kg/m³

/* ---- El filtro: cordierita de 200 cpsi y pared de 12 mil, 6,5 L, canales cuadrados tapados en extremos alternos ---- */
const DPF=(function(){
  const D=0.1905, Lf=0.2286, cpsi=200, w=3.05e-4, Af=Math.PI/4*D*D, Vf=Af*Lf, Ncel=cpsi/6.4516e-4, paso=1/Math.sqrt(Ncel), a=paso-w, Nin=0.5*Ncel*Af;
  return {D,Lf,cpsi,w,Af,Vf,VL:Vf*1000,Ncel,paso,a,Nin,Afilt:4*a*Lf*Nin,Vcan:Nin*a*a*Lf,
    kw:2.0e-13,ks:4.0e-14,rs:100,ra:300,zeta:1.0,md:1.0,dw:0.5,kapA:3,eta:0.99,          // permeabilidades (m²), densidades de torta (kg/m³), pérdida de entrada y salida
    N:8,Cs:2500,UA:3,rhoSub:380,csSub:1000};                                                 // celdas axiales · capacidad térmica del sustrato (J/K) · pérdida a la carcasa (W/K)
})();
const F_POISEUILLE=28.454;                                  // ΔP/L = 28,454·μ·u/a² en un canal cuadrado laminar (f·Re = 14,227)

/** Caída de presión del filtro. mS: hollín medio (g en todo el filtro); cen: ceniza (g/L); mdot: kg/s; T: K.
 *  ΔP = canales (Poiseuille, estrechados por la torta) + entrada/salida + pared (Darcy, con la obstrucción en profundidad) + torta (Darcy). */
function dpFiltro(mS,cen,mdot,T,crack){
  const rho=rhoGas(T), mu=muGas(T), Q=mdot/rho, V=DPF.VL, carga=mS/V;
  const fraccCen=(cen*V/1000/DPF.ra)/DPF.Vcan, Aef=DPF.Afilt*(1-DPF.kapA*fraccCen);        // la ceniza se apila al fondo y quita pared útil
  const ws=(mS/1000)/(DPF.rs*Aef), aEf=Math.max(DPF.a*0.15,DPF.a-2*ws);                      // espesor de la torta y canal de entrada estrechado
  const u0=Q/(DPF.Nin*aEf*aEf);
  const dch=F_POISEUILLE*mu*DPF.Lf*Q/(DPF.Nin*Math.pow(aEf,4));
  const dce=DPF.zeta*rho*u0*u0/2;
  const Rw=(DPF.w/DPF.kw)*(1+DPF.dw*(1-Math.exp(-carga/DPF.md)));
  const dw=mu*Q/Aef*Rw, ds=mu*Q/Aef*ws/DPF.ks;
  const fc=1-0.8*(crack||0);                                                              // una grieta abre un paso en paralelo y baja la contrapresión
  return {tot:(dch+dce+dw+ds)*fc,dch,dce,dw,ds,Q,u0,ws,Aef,aEf,carga};
}
const REF={mdot:0.16,T:480+273.15};                         // caudal de referencia: motor a plena carga
const dpRef=(mS,cen)=>dpFiltro(mS,cen,REF.mdot,REF.T).tot;

/* ---- Cinética de oxidación del hollín (primer orden en el hollín, Arrhenius) ---- */
const KIN={Ref:873.15,kO2:1.5e-3,EO2:150e3,yRef:0.10,kN:3.5e-7,ENO2:55e3,TrefN:623.15};
const kO2=(T,y)=>KIN.kO2*Math.exp(-KIN.EO2/R_GAS*(1/T-1/KIN.Ref))*(y/KIN.yRef);               // 1/s con O2 a la fracción y
const kNO2=T=>KIN.kN*Math.exp(-KIN.ENO2/R_GAS*(1/T-1/KIN.TrefN));                               // 1/s por ppm de NO2
const fNO2=Tc=>0.55*Math.exp(-Math.pow((Tc-330)/110,2))/(1+Math.exp(-(Tc-210)/12));              // fracción de NO2 en el NOx tras el oxidante (DOC)

/** Un paso del filtro. st: {m:Float64Array(N) g de hollín por celda, T:Float64Array(N) K}. e: {Tin K, mdot kg/s, yO2, FNO2 mol/s, nGas mol/s}.
 *  Devuelve el hollín quemado (O2 y NO2, g) y el calor; deja el estado actualizado. Balance de energía por celda, implícito aguas abajo:
 *  C·dT/dt = G·(T_{i−1} − T_i) + Q_i − UA/N·(T_i − T_amb), con intercambio gas–sólido perfecto. */
function pasoFiltro(st,e,dt){
  const N=DPF.N, Cc=DPF.Cs/N, G=e.mdot*MOT.cpG, hl=DPF.UA/N;
  let Tprev=e.Tin, FN=e.FNO2, bO=0, bN=0, Q=0, Tmax=0;
  for(let i=0;i<N;i++){
    const T=st.T[i], m0=st.m[i], yN=FN/e.nGas*1e6;
    let gN=m0*(1-Math.exp(-kNO2(T)*yN*dt)); const cap=FN*dt*0.5*MC*0.9; if(gN>cap) gN=cap;       // el NO2 que llega limita la quema pasiva
    const gO=(m0-gN)*(1-Math.exp(-kO2(T,e.yO2)*dt));
    const q=(gO*DHC_O2+gN*DHC_NO2)/dt;
    st.m[i]=m0-gN-gO; FN-=gN/MC*2/dt; bO+=gO; bN+=gN; Q+=q;
    const Tn=(Cc*T/dt+G*Tprev+q+hl*T_AMB)/(Cc/dt+G+hl); st.T[i]=Tn; Tprev=Tn; if(Tn>Tmax) Tmax=Tn;
  }
  return {bO,bN,Q,Tmax,Tout:st.T[N-1],FNr:FN};
}
const sumaM=st=>{ let s=0; for(let i=0;i<st.m.length;i++) s+=st.m[i]; return s; };

/* ---- Perfiles de uso (carga L del motor en el tiempo; segmentos [minutos, L] que se repiten) ---- */
const PERFILES={
  ciudad:{nombre:'Ciudad con paradas',T:360,seg:[[10,0.22],[8,0.32],[6,0.25],[3,0.05],[3,0.28]],ash:0,m0:0.4,Tb0:140},
  mixto:{nombre:'Mixto, filtro con 100 000 km',T:360,seg:[[20,0.26],[3,0.05],[17,0.62]],ash:4,m0:0.4,Tb0:200},
  carretera:{nombre:'Carretera',T:360,seg:[[60,0.62]],ash:0,m0:0.4,Tb0:300},
};
const cargaPerfil=(pf,tMin)=>{ const per=pf.seg.reduce((a,s)=>a+s[0],0); let u=tMin%per; for(const s of pf.seg){ if(u<s[0]) return s[1]; u-=s[0]; } return pf.seg[pf.seg.length-1][1]; };
const TAU_DOC=30, MFIN=0.30, T_REG_MAX=2700, L_MIN_REG=0.15;                     // s de inercia del oxidante · g/L donde acaba la quema · s máximos · carga mínima para post-inyectar
const KM_POR_GL=25000;                                                           // km de uso por cada g/L de ceniza

/** Simula un uso completo. par: {perfil, thr (g/L que dispara la quema), Tobj (°C de la quema activa), ash (g/L), m0 (g/L), crack (0..1 fracción que se fuga), kPas (multiplicador de NO2), dt}.
 *  Devuelve las trazas y los balances de carbono, energía y combustible. */
function simula(par){
  const pf=par.pfObj||PERFILES[par.perfil||'ciudad'], N=DPF.N, V=DPF.VL;
  const thr=par.thr!==undefined?par.thr:4, Tobj=(par.Tobj!==undefined?par.Tobj:600)+273.15, ash=par.ash!==undefined?par.ash:pf.ash, m0=par.m0!==undefined?par.m0:pf.m0;
  const crack=par.crack||0, regOn=par.regen!==false, Tsolo=pf.T*60;
  const nRec=par.nRec||720, dRec=Tsolo/nRec, st={m:new Float64Array(N).fill(m0*V/N),T:new Float64Array(N)};
  const mt0=motor(cargaPerfil(pf,0)); st.T.fill(par.Tini!==undefined?par.Tini+273.15:(pf.Tb0!==undefined?pf.Tb0:mt0.Tg)+273.15);
  let Tin=st.T[0], reg=0, tReg=0, nReg=0, t=0;
  const A={sIn:0,sLeak:0,bO:0,bN:0,Efuel:0,Ecomb:0,Eheat:0,tReg:0,Tpk:0,loadMax:m0,Egas:0,Eloss:0,Q:0,tregTot:0};
  const tr={t:new Float32Array(nRec+1),L:new Float32Array(nRec+1),carga:new Float32Array(nRec+1),dp:new Float32Array(nRec+1),dpR:new Float32Array(nRec+1),Tpk:new Float32Array(nRec+1),Tin:new Float32Array(nRec+1),Tg:new Float32Array(nRec+1),
    reg:new Uint8Array(nRec+1),fuel:new Float32Array(nRec+1),mC:new Float32Array((nRec+1)*N),TC:new Float32Array((nRec+1)*N),kP:new Float32Array(nRec+1),kA:new Float32Array(nRec+1),leak:new Float32Array(nRec+1)};
  const rec=(k,m,tot,mdot,Tg,kp,ka)=>{ tr.t[k]=t; tr.L[k]=m.L; tr.carga[k]=tot/V; tr.dpR[k]=dpFiltro(tot,ash,REF.mdot,REF.T,crack).tot; tr.dp[k]=dpFiltro(tot,ash,m.mGas,Math.max(Tin,Tg),crack).tot; let pk=0; for(let i=0;i<N;i++){ tr.mC[k*N+i]=st.m[i]; tr.TC[k*N+i]=st.T[i]; if(st.T[i]>pk) pk=st.T[i]; }
    tr.Tpk[k]=pk-273.15; tr.Tin[k]=Tin-273.15; tr.Tg[k]=Tg-273.15; tr.reg[k]=reg; tr.fuel[k]=A.Efuel; tr.kP[k]=kp; tr.kA[k]=ka; tr.leak[k]=A.sLeak; };
  let kRec=0, kp=0, ka=0;
  rec(0,mt0,m0*V,mt0.mGas,mt0.Tg+273.15,0,0);
  while(t<Tsolo-1e-9){
    const mt=motor(cargaPerfil(pf,t/60)), Tg=mt.Tg+273.15, tot=sumaM(st);
    // el mando de la regeneración
    if(regOn&&!reg&&tot/V>=thr-1e-9&&mt.L>=L_MIN_REG){ reg=1; tReg=0; nReg++; }
    if(reg&&(tot/V<=MFIN||tReg>T_REG_MAX)){ reg=0; }
    const inyecta=reg&&mt.L>=L_MIN_REG;
    // paso de tiempo: fino mientras quema o está caliente
    let Tpk0=0; for(let i=0;i<N;i++) if(st.T[i]>Tpk0) Tpk0=st.T[i];
    let dt=(reg||Tpk0>820||Math.abs(Tin-Tg)>30)?0.5:5;
    const aRec=(kRec+1)*dRec-t; if(dt>aRec&&aRec>1e-9) dt=aRec; if(dt>Tsolo-t&&Tsolo-t>1e-9) dt=Tsolo-t;
    // inercia del oxidante: la temperatura que llega al filtro sigue a la que pide el mando
    const Ttar=inyecta?Math.max(Tg,Tobj):Tg; Tin+=(Ttar-Tin)*(1-Math.exp(-dt/TAU_DOC));

/** Junta una pieza hecha de muchas mallas en una malla por material: así una bobina con 40 piezas cuesta pocas llamadas. */
function fusiona(grupo){
  grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map();
  grupo.traverse(o=>{ if(!o.isMesh) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(), m=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);
    g.applyMatrix4(m);
    if(!g.attributes.uv){ g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2)); }
    const k=o.material; if(!por.has(k)) por.set(k,[]); por.get(k).push(g); });
  const out=new THREE.Group();
  for(const [mat,gs] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count;
      pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry();
    G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const me=new THREE.Mesh(G,mat); me.castShadow=!mat.transparent; me.receiveShadow=true; out.add(me);
  }
  return out;
}

/** Funde las mallas ESTÁTICAS de un grupo en una malla por material (y por «clave» de pieza, para que el rótulo y el
 *  tooltip sigan sabiendo de qué pieza son). Las que se mueven, las instanciadas, las de material múltiple y el fondo se
 *  quedan como están. */
function fusionaPartes(grupo,excluir){
  excluir=excluir||[]; grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map(), viejas=[];
  const fuera=o=>{ for(let p=o;p&&p!==grupo;p=p.parent) if(excluir.includes(p)||(p.userData&&p.userData.fondo===true)) return true; return false; };
  grupo.traverse(o=>{ if(!o.isMesh||o.isInstancedMesh||fuera(o)||o.userData.noFusion) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(); g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld));
    if(!g.attributes.uv) g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
    const clave=o.userData.clave||'', ro=o.renderOrder||0;
    const mete=(mat,geo)=>{ const k=mat.uuid+'|'+clave; if(!por.has(k)) por.set(k,{mat,clave,gs:[],ro}); por.get(k).gs.push(geo); };
    if(Array.isArray(o.material)){
      const grupos=g.groups&&g.groups.length?g.groups:[{start:0,count:g.attributes.position.count,materialIndex:0}];
      for(const gr of grupos){ const mat=o.material[gr.materialIndex]; if(!mat) continue; const sub=new THREE.BufferGeometry();
        for(const nom of ['position','normal','uv']){ const at=g.attributes[nom]; sub.setAttribute(nom,new THREE.BufferAttribute(at.array.slice(gr.start*at.itemSize,(gr.start+gr.count)*at.itemSize),at.itemSize)); }
        mete(mat,sub); }
      g.dispose();
    } else mete(o.material,g);
    viejas.push(o); });
  for(const o of viejas){ o.parent.remove(o); }
  for(const [,{mat,clave,gs,ro}] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count; pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry(); G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const me=new THREE.Mesh(G,mat); me.castShadow=!mat.transparent&&!(mat.blending===THREE.AdditiveBlending); me.receiveShadow=true; me.renderOrder=ro; if(clave) me.userData.clave=clave; grupo.add(me);
  }
}

/* ---- la placa del corte: el panal dibujado en un sombreador. Franjas alternas: canales de entrada (abiertos a la izquierda,
   tapados a la derecha) y de salida (al revés). El hollín es la torta oscura de las paredes del canal de entrada; la ceniza
   se apila al fondo; el calor de cada celda tiñe la cerámica (cuerpo negro: rojo → naranja → amarillo → blanco). ---- */
const GLSL_SECCION={
  v:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  f:`precision highp float;
  varying vec2 vUv;
  uniform float uSoot[8]; uniform float uTemp[8]; uniform float uAsh; uniform float uTime; uniform float uNS; uniform float uCat; uniform float uAsp; uniform float uDim;
  float lerpArr(float arr[8], float u){ float x=clamp(u*8.0-0.5,0.0,7.0); float f=fract(x); float i0=floor(x); float a=0.0,b=0.0;
    for(int i=0;i<8;i++){ float fi=float(i); if(fi==i0) a=arr[i]; if(fi==min(i0+1.0,7.0)) b=arr[i]; } return mix(a,b,f); }
  vec3 cuerpoNegro(float T){ float g=smoothstep(480.0,1180.0,T);
    vec3 c=mix(vec3(0.0),vec3(0.62,0.06,0.02),smoothstep(0.0,0.30,g));
    c=mix(c,vec3(1.0,0.42,0.05),smoothstep(0.25,0.60,g)); c=mix(c,vec3(1.0,0.82,0.32),smoothstep(0.55,0.85,g)); c=mix(c,vec3(1.0,0.96,0.84),smoothstep(0.80,1.0,g));
    return c*(0.35+1.5*g*g+1.0*g); }
  float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
  float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y); }
  void main(){
    float u=vUv.x, v=vUv.y, ns=uNS, sy=v*ns, s=floor(sy), ly=fract(sy);
    bool entrada=mod(s,2.0)<0.5;
    float aa=fwidth(sy)*0.9+1e-4, aax=fwidth(u)*0.9+1e-4;
    float pared=0.085, dW=min(ly,1.0-ly), canal=smoothstep(pared-aa,pared+aa,dW);
    float pl=0.045; float tapon=entrada?smoothstep(1.0-pl-aax,1.0-pl+aax,u):1.0-smoothstep(pl-aax,pl+aax,u);
    float T=lerpArr(uTemp,u);
    // cerámica de la pared: tono arena con variación lenta y un hilo claro al centro
    vec3 cer=vec3(0.80,0.72,0.60)*(0.86+0.10*vn(vec2(u*5.0,s*0.7)));
    cer=mix(cer,vec3(0.90,0.84,0.72),smoothstep(0.02,0.0,abs(dW-0.0)))*1.0;
    vec3 inte=uCat>0.5?vec3(0.84,0.62,0.22):(entrada?vec3(0.36,0.39,0.43):vec3(0.52,0.62,0.72));
    if(uCat>0.5) inte*=0.86+0.14*sin((u*uAsp*30.0)+s);
    // torta de hollín: capa en ambas paredes del canal de entrada, más gruesa donde hay más
    float sootK=lerpArr(uSoot,u); float semi=0.5-pared; float cake=pared+sootK*semi*0.92;
    float enCake=entrada&&uCat<0.5?1.0-smoothstep(cake-aa,cake+aa,dW):0.0; enCake*=canal; enCake*=1.0-tapon;
    vec3 hol=vec3(0.050,0.042,0.038)+vec3(0.10,0.09,0.08)*smoothstep(0.25,0.0,abs(dW-cake))*0.9;
    // ceniza al fondo del canal de entrada
    float ceniza=entrada&&uCat<0.5?smoothstep(1.0-pl-uAsh-aax,1.0-pl-uAsh+aax,u)*(1.0-tapon):0.0; ceniza*=canal;
    vec3 col=cer;
    col=mix(col,inte,canal*(1.0-tapon));
    col=mix(col,vec3(0.60,0.57,0.52)*(0.9+0.1*vn(vec2(u*40.0,s))),ceniza);
    col=mix(col,hol,enCake);
    // tapones: cerámica más oscura
    col=mix(col,cer*0.78,tapon*canal);
    // luz: leve degradado vertical (cámara frontal) y viñeta del borde
    float shade=0.92+0.08*cos((v-0.5)*3.14159); col*=shade;
    col=pow(col,vec3(2.2));                                    // lo de arriba está pintado en sRGB: pasa a lineal
    // el calor
    float cal=smoothstep(430.0,520.0,T);
    float chisp=0.75+0.25*vn(vec2(u*60.0+uTime*1.3,sy*3.0-uTime*0.7));
    vec3 em=cuerpoNegro(T);
    float peso=mix(0.60,1.0,enCake)*(uCat>0.5?0.75:1.0);
    col=mix(col,col*0.35+em*chisp*peso,cal*0.88)+em*0.30*cal*(canal);
    col*=uDim;
    gl_FragColor=vec4(col,1.0);
  }`
};

function calcula(p){

  else if(p.perfil==='parada'){ peor=peorParada({thr:p.thr,Tobj:p.Tobj,ash:p.ash||0}); run=peor.run; }

/* ===================== 14. CÁMARAS =====================
   La escena se encuadra con el hueco que dejan la guía y el dock: la cámara se aleja lo justo para que la caja del
   «objeto» (ancho × alto en metros) quepa entera en ese hueco, y la proyección se desplaza para centrarla en él.
   Además el objeto nunca pasa del 70 % del alto del lienzo. */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}

const CAM={off:V3(-1.5,1.2,6),toff:V3(0,0,0),auto:true,previo:null,k:1,dur:1};
function fovVista(v){ return innerWidth<innerHeight*0.9?46:VISTAS[v].fov; }
function distanciaFit(w,h,fov,tope){
  const Hu=huecoLibre(), W=innerWidth, Hh=innerHeight, tv=Math.tan(fov*Math.PI/360), th=tv*(W/Hh);
  const wF=Math.max(80,Hu.x1-Hu.x0)/W, hF=Math.max(80,Hu.y1-Hu.y0)/Hh;
  const D=1.06*Math.max(w/(2*th*wF),h/(2*tv*hF));
  return Math.max(D,h/(2*tv*(tope||0.66)));
}
function ofsDeseado(v){
  const V=VISTAS[v], o=V.obj(), fov=fovVista(v), D=distanciaFit(o.w,o.h,fov,V.tope);
  return {off:V.dir.clone().normalize().multiplyScalar(D),toff:V.toff.clone(),fov};
}
function ponVista(v,dur){
  EST.vista=v; CAM.auto=true; CAM.dur=dur===undefined?1.0:dur;
  if(typeof pintaBarras==='function') pintaBarras();
  if(CAM.dur<=0.01){ const A=VISTAS[v].anc(), d=ofsDeseado(v); CAM.off.copy(d.off); CAM.toff.copy(d.toff); camera.fov=d.fov; camera.updateProjectionMatrix();
    camera.position.copy(A).add(CAM.off); controls.target.copy(A).add(CAM.toff); CAM.previo=A.clone(); }
}
function pasaCam(dt){
  const V=VISTAS[EST.vista], P=V.anc();
  if(CAM.auto){
    const d=ofsDeseado(EST.vista), k=1-Math.exp(-dt/Math.max(0.05,(CAM.dur||1)*0.30));

}

  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.40:0.43),240,450));

   Tres fases: 1 · Calcula (cuántas horas tarda en llenarse el filtro con el hollín que suelta el motor), 2 · Ajusta (a cuánto
   hollín se quema y a qué temperatura, para que la contrapresión no pase de su límite, el filtro no pase de su temperatura y el
   diésel extra sea poco: el resultado sólo aparece al validar, y la ventana es INTERIOR en las dos perillas) y 3 · Diagnostica
   (¿por qué falla el filtro?, sólo con lo que se ve en el dock). Cierra con un quiz de tres preguntas. */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETOS={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'calcula',iniciado:false,dxOk:false,r1:null,r2:null,dx:null,orden:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0};
const fijoPf=(L,ash,m0)=>({nombre:'Punto fijo',T:30,seg:[[30,L]],ash,m0,Tb0:motor(L).Tg});

/* ---------- Fase 1 · Calcula las horas hasta llenar el filtro ---------- */
const CASOS_CALC=[{L:0.25,y:3},{L:0.35,y:4},{L:0.5,y:5},{L:0.7,y:4}];            // carga del motor y g/L objetivo
function sorteaCaso1(){ const p=GUIA.r1&&GUIA.r1.L; let c; do{ c=pickOne(CASOS_CALC); }while(c.L===p);
  const g=Math.round(motor(c.L).mS*10)/10; GUIA.r1={L:c.L,y:c.y,g,ans:c.y*DPF.VL/(DPF.eta*g)}; }
function numeroDe(txt){ const raw=String(txt||'').trim().replace(/\s/g,'').replace(/ /g,'').replace(',','.'); return parseFloat(raw); }
function checkCalcula(){
  const v=numeroDe((el('ansV')||{}).value), r=GUIA.r1, ok=r.ans;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe las horas (con coma o punto decimal).'); return; }
  RETOS.intentos++;
  if(Math.abs(v-ok)<=Math.max(0.05,0.06*ok)){
    RETOS.fallos1=0; sonido.bien();
    feedback('good','¡Correcto! ✓',`El filtro retiene el ${fN(DPF.eta*100)} % de ${fN(r.g,1)} g/h: se quedan <b>${fN(DPF.eta*r.g,2)} g/h</b>. Para ${fN(r.y)} g/L en ${fN(DPF.VL,1)} L hacen falta ${fN(r.y*DPF.VL,1)} g. <b>${fN(r.y*DPF.VL,1)} ÷ ${fN(DPF.eta*r.g,2)} = ${fN(ok,1)} h</b>. Sin quemar nada, ése es el tiempo que tarda en llenarse.`,true);
    paso('ajusta'); prepararAjusta();
  } else {
    RETOS.fallos1++; sonido.mal(); const d=v>ok?'alto':'bajo';
    if(RETOS.fallos1>=3){ RETOS.fallos1=0; RETOS.resiembras++; sorteaCaso1(); feedback('bad','Tres intentos fallidos','Cambia el caso. Recuerda: el filtro se queda con el 99 % del hollín, y los g/L se pasan a gramos multiplicando por los litros del filtro.'); reiniciaCalculo(); pintaHUD(); }
    else { feedback('bad','Revisa el cálculo',`Tu resultado (${fN(v,2)} h) está ${d}. Calcula los gramos que hacen falta (g/L × litros) y divídelos entre los gramos que se quedan cada hora. (intentos fallidos: ${RETOS.fallos1}/3)`); const t=el('d_try'); if(t) t.textContent=RETOS.fallos1; }
  }
}

/* ---------- Fase 2 · A cuánto hollín quemar y a qué temperatura ---------- */
function prepararAjusta(){
  GUIA.r2={thr:3,Tobj:600,validado:false,res:null,ver:'ciudad',intentos:0};
  reiniciaCalculo(); pintaHUD(); pintaChips();
}
/** Evalúa un ajuste en los dos usos y en la parada en plena quema (la prueba térmica no depende de la ceniza: se hace una vez).
 *  con `rapido`, si la contrapresión o el diésel ya fallan, se salta la prueba de peor caso (que es la más cara). */
function evalua(thr,Tobj,rapido){
  const Rs=ESCENARIOS.map(esc=>simula({perfil:esc.perfil,thr,Tobj}));
  const dp=Math.max(...Rs.map(R=>R.dpMaxRef)), fuel=Math.max(...Rs.map(R=>R.extraComb));
  if(rapido&&(dp>RETO.dp||fuel>RETO.fuel)) return {ok:false,dp,fuel,T:Math.max(...Rs.map(R=>R.Tpk))};
  const P=peorParada({thr,Tobj,ash:0}), out=ESCENARIOS.map((esc,i)=>({perfil:esc.perfil,R:Rs[i],P,c:cumple(Rs[i],P)}));
  const ok=out.every(o=>o.c.dp&&o.c.T&&o.c.fuel); return {out,ok,dp,T:Math.max(P.Tpk,...Rs.map(R=>R.Tpk)),fuel};
}
function pintaChips(){
  const c=el('chipEx'); if(!c||!GUIA.r2) return; const r=GUIA.r2, V=r.res;
  const f=(ok,t)=>`<span class="chip ${V?(ok?'ok':'mal'):''}">${t}</span>`;
  c.innerHTML=f(V&&V.dp<=RETO.dp,`Contrapresión máxima <b>${V?fN(V.dp/1e3,1)+' kPa':'—'}</b> <small>(hasta ${fN(RETO.dp/1e3,1)})</small>`)
    +f(V&&V.T<=RETO.T,`Temperatura máxima del filtro <b>${V?fN(V.T)+' °C':'—'}</b> <small>(hasta ${fN(RETO.T)})</small>`)
    +f(V&&V.fuel<=RETO.fuel,`Diésel extra <b>${V?fN(V.fuel,1)+' %':'—'}</b> <small>(hasta ${fN(RETO.fuel,1)})</small>`);
}
/** Qué valores de umbral (a la temperatura elegida) y de temperatura (al umbral elegido) habrían cumplido todo: la ventana. */
function ventanaReto(r,fin){
  // rangos contiguos alrededor de lo elegido, calculados por tandas para no congelar la pantalla
  const ts=[],Ts=[]; for(let t=1;t<=8.001;t+=0.25) ts.push(+t.toFixed(2)); for(let T=560;T<=680;T+=5) Ts.push(T);
  const tareas=[...ts.map(t=>[0,t]),...Ts.map(T=>[1,T])], res={0:{},1:{}}; let i=0;
  const tanda=()=>{ const lim=performance.now()+30; while(i<tareas.length&&performance.now()<lim){ const [k,v]=tareas[i++]; res[k][v]=k===0?evalua(v,r.Tobj,true).ok:evalua(r.thr,v,true).ok; }
    if(i<tareas.length){ setTimeout(tanda,0); return; }
    const rango=(lista,mapa,x)=>{ let a=lista.indexOf(x); if(a<0||!mapa[x]) return null; let lo=a,hi=a; while(lo>0&&mapa[lista[lo-1]]) lo--; while(hi<lista.length-1&&mapa[lista[hi+1]]) hi++; return [lista[lo],lista[hi]]; };
    fin({thr:rango(ts,res[0],r.thr),T:rango(Ts,res[1],r.Tobj)}); };
  setTimeout(tanda,0);
}
function validarAjusta(){
  const r=GUIA.r2; if(!r) return;
  const V=evalua(r.thr,r.Tobj); r.res=V; r.validado=true; r.intentos++; RETOS.intentos++;
  const peor=V.out.find(o=>!(o.c.dp&&o.c.T&&o.c.fuel)); r.ver=peor?peor.perfil:'ciudad';
  reiniciaCalculo(); SIM.t=0; pintaChips();
  const cifras=`Contrapresión máxima <b>${fN(V.dp/1e3,1)} kPa</b> (hasta ${fN(RETO.dp/1e3,1)}), temperatura máxima del filtro <b>${fN(V.T)} °C</b> (hasta ${fN(RETO.T)}), diésel extra <b>${fN(V.fuel,1)} %</b> (hasta ${fN(RETO.fuel,1)}).`;
  if(V.ok){
    RETOS.fallos2=0; sonido.bien();
    const base=`${cifras} Probado en ciudad y en un recorrido mixto con un filtro de 100 000 km, y con la parada en plena quema.`;
    feedback('good','¡Lo conseguiste! ✓',base+' Calculando qué otros ajustes habrían servido…',true);
    ventanaReto(r,w=>{ if(!el('feedback').classList.contains('show')||GUIA.paso==='quiz') return; el('fbText').innerHTML=base+` ${w.thr?`Con esa temperatura, cualquier umbral entre <b>${fN(w.thr[0],2)} y ${fN(w.thr[1],2)} g/L</b> habría servido`:''}${w.T?`${w.thr?' y con':'Con'} ese umbral, una quema entre <b>${fN(w.T[0])} y ${fN(w.T[1])} °C</b>`:''}: la ventana está en el interior, no en los extremos.`; });
    pintaHUD(); paso('diag'); iniciaDiag();
  } else {
    RETOS.fallos2++; sonido.mal();
    let msg=cifras+' ';
    if(V.dp>RETO.dp) msg+='Dejaste que el filtro se <b>llenara demasiado</b>: la contrapresión pasó su límite. ';
    if(V.T>RETO.T) msg+='En la parada en plena quema el filtro pasó de su <b>temperatura máxima</b>: había mucho hollín y una quema muy caliente. ';
    if(V.fuel>RETO.fuel) msg+='Gastaste <b>demasiado diésel</b>: quemas muy seguido o la quema es tan fría que dura mucho tiempo inyectando. ';
    if(RETOS.fallos2>=4){ RETOS.fallos2=0; feedback('bad','Cuatro validaciones sin lograrlo',msg+'Pista: ni la quema más fría (dura demasiado) ni la más caliente (peligrosa), ni dejar que se llene del todo ni quemar a cada rato: la ventana está en el interior.',true); pintaHUD(); }
    else { feedback('bad','Todavía no',msg+`(validaciones fallidas: ${RETOS.fallos2}/4)`,true); pintaHUD(); pintaChips(); }
  }
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const CASOS_DX=[
  {k:'ceniza',L:0.6,m0:0.9,ash:10,crack:0,km:140},
  {k:'corto',L:0.2,m0:6.8,ash:1,crack:0,km:1400},
  {k:'grieta',L:0.6,m0:0.4,ash:2,crack:0.7,km:320},
  {k:'sensor',L:0.6,m0:2.6,ash:2,crack:0,km:350},
];
const NOMBRE_DX={ceniza:'El filtro está lleno de ceniza',corto:'Sólo hace trayectos cortos',grieta:'El filtro está agrietado',sensor:'El sensor de presión falla'};
function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.k; let c; do{ c=pickOne(CASOS_DX); }while(c.k===p);
  GUIA.dx=c; GUIA.dxOk=false; GUIA.orden=barajar(CASOS_DX.map(x=>x.k));
  reiniciaCalculo(); pintaHUD(); pintaDockFijo();
}
function diagnostica(k){
  if(!GUIA.dx||GUIA.dxOk) return; RETOS.intentos++;
  if(k===GUIA.dx.k){
    GUIA.dxOk=true; RETOS.fallos3=0; sonido.bien();
    feedback('good','Diagnóstico correcto ✓',explicaDx(GUIA.dx.k),true);
    reiniciaCalculo(); pintaDockFijo(); paso('quiz'); iniciaQuiz();
  } else {
    RETOS.fallos3++; sonido.mal();
    if(RETOS.fallos3>=3){ RETOS.fallos3=0; RETOS.resiembras++; feedback('bad','Tres intentos fallidos','Es otro caso: compara la contrapresión medida con la esperada, las partículas que salen y la temperatura del gas.',true); iniciaDiag(); }
    else { feedback('bad','No es ese',noEs(k)+` (intentos fallidos: ${RETOS.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(k){
  if(k==='ceniza') return `Con poco hollín la contrapresión medida es mucho mayor que la esperada: lo que estorba es la <b>ceniza</b> de los aditivos del aceite, que no se quema nunca. La quema no la arregla: hay que limpiar o cambiar el filtro.`;
  if(k==='corto') return `El hollín contado es altísimo y la contrapresión medida coincide con la esperada: el filtro está realmente lleno. El gas llega frío porque el motor casi no trabaja: <b>nunca alcanza la temperatura para quemar</b>. Hay que hacer un recorrido largo o una quema forzada.`;
  if(k==='grieta') return `La contrapresión medida es mucho menor que la esperada y salen muchas partículas: el gas se escapa por una <b>grieta</b> sin cruzar la pared. Suele venir de una quema que se desbocó.`;
  return `Salen pocas partículas y el filtro tiene hollín, pero la contrapresión medida es casi cero y no cambia: falla el <b>sensor de presión</b> o sus tubitos, no el filtro.`;
}
function noEs(k){
  if(k==='ceniza') return 'Aquí el hollín contado es alto y la contrapresión medida coincide con la esperada: la ceniza no explica la diferencia.';
  if(k==='corto') return 'La temperatura del gas que llega es normal: mira si el filtro está realmente lleno de hollín.';
  if(k==='grieta') return 'Las partículas que salen son pocas: con una grieta saldrían muchas.';
  return 'La contrapresión medida sí cambia y concuerda con la esperada: el sensor funciona.';
}
const QUIZ=[
  {q:'¿Por qué el hollín no se quema solo cuando manejas despacio en la ciudad?',ok:'El escape está frío y a esa temperatura el hollín casi no arde',mal:['Porque en la ciudad el motor no suelta hollín','Porque el filtro no deja pasar el gas','Porque la ceniza lo protege']},
  {q:'Estás quemando el hollín y el conductor se detiene con el motor al ralentí. ¿Por qué es peligroso?',ok:'Casi no pasa gas que se lleve el calor y el oxígeno sigue entrando: la quema se desboca',mal:['Porque se acaba el diésel','Porque el hollín se apaga y tapa el filtro','Porque la ceniza se convierte en hollín']},
  {q:'¿Qué le pasa a la ceniza durante la quema?',ok:'No se quema: se queda y poco a poco llena el filtro',mal:['Se quema igual que el hollín','Se convierte en gas','Sale por el escape como humo negro']},
];
function iniciaQuiz(){ el("feedback").classList.remove("show"); GUIA.quizN=0; cargaPregunta(); }
function cargaPregunta(){ const Q=QUIZ[GUIA.quizN], opts=barajar([Q.ok,...Q.mal]); GUIA.quiz={q:Q.q,opts,ok:opts.indexOf(Q.ok)}; GUIA.quizResp=-1; GUIA.quizCorrecta=GUIA.quiz.ok; pintaHUD(); }
function respondeQuiz(i){
  if(GUIA.quizResp>=0) return; GUIA.quizResp=i; const ac=i===GUIA.quiz.ok; if(ac) RETOS.quizAcierto++;
  if(ac) sonido.bien(); else sonido.mal();
  const ult=GUIA.quizN>=QUIZ.length-1;
  feedback(ac?'good':'bad',ac?'Correcto ✓':'No es esa',(ac?'':'La respuesta era: <b>'+GUIA.quiz.opts[GUIA.quiz.ok]+'</b>. ')+(ult?'Terminaste el laboratorio.':'Sigue con la siguiente.'),true);
  pintaHUD();
  if(ult){ RETOS.hecho=true; paso('completo'); }
}
function siguientePregunta(){ if(GUIA.quizN<QUIZ.length-1){ GUIA.quizN++; cargaPregunta(); } }

/* ---------- el enrutador de acciones ---------- */
function paso(p){ GUIA.paso=p; GUIA.phase=({calcula:0,ajusta:1,diag:2,quiz:2,completo:2})[p]; if(EST.modo==='reto'){ reiniciaCalculo(); pintaHUD(); } }
function handleAction(act,btn){
  switch(act){
    case 't-sig': tourParaAuto(); tourVa(TOUR.paso+1); break;
    case 't-atras': tourParaAuto(); tourVa(TOUR.paso-1); break;
    case 't-fin': tourParaAuto(); setMode('probar'); break;
    case 'check-v': checkCalcula(); break;
    case 'hint-v':
      if(RETOS.pistas===0){ RETOS.pistas=1; feedback('good','Pista 1 de 2',`El filtro se queda con el ${fN(DPF.eta*100)} % del hollín que entra. Multiplica los g/h que suelta el motor por 0,99.`); }
      else if(RETOS.pistas===1){ RETOS.pistas=2; feedback('good','Pista 2 de 2',`Pasa los g/L a gramos: g/L × ${fN(DPF.VL,1)} L. Luego divide esos gramos entre los que se quedan por hora.`); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break;
    case 'validar': validarAjusta(); break;
    case 'ver-ciudad': if(GUIA.r2){ GUIA.r2.ver='ciudad'; reiniciaCalculo(); SIM.t=0; pintaHUD(); pintaChips(); } break;
    case 'ver-mixto': if(GUIA.r2){ GUIA.r2.ver='mixto'; reiniciaCalculo(); SIM.t=0; pintaHUD(); pintaChips(); } break;
    case 'dx-ceniza': diagnostica('ceniza'); break; case 'dx-corto': diagnostica('corto'); break; case 'dx-grieta': diagnostica('grieta'); break; case 'dx-sensor': diagnostica('sensor'); break;
    case 'quiz-0': respondeQuiz(0); break; case 'quiz-1': respondeQuiz(1); break; case 'quiz-2': respondeQuiz(2); break; case 'quiz-3': respondeQuiz(3); break;
    case 'quiz-sig': siguientePregunta(); break;
    case 'restart': location.reload(); break;
  }
}

/* ---------- lo que la guía enseña en cada paso ---------- */
function contenidoGuia(){
  const tri=(n,v,m)=>`<span class="tries">intentos fallidos: <b id="${n}">${v}</b>/${m}</span>`;
  switch(GUIA.paso){
    case 'calcula': { const r=GUIA.r1;
      return {no:'Fase 1 · Reto 1',head:'Tu cálculo',title:'¿En cuántas horas se llena el filtro?',
      teach:`Este motor suelta <b>${fN(r.g,1)} g/h</b> de hollín y el filtro (${fN(DPF.VL,1)} L) retiene el <b>99 %</b>. Parte de un filtro limpio y no quemes nada.<div class="task">¿Cuántas horas tarda en llegar a <b>${fN(r.y)} g de hollín por litro</b>? ${tri('d_try',RETOS.fallos1,3)}</div>`,
      acts:`<div class="calcrow"><input id="ansV" type="text" inputmode="decimal" autocomplete="off" placeholder="¿? horas" aria-label="Horas hasta llenar el filtro"><button class="b primary" data-act="check-v">✓ Comprobar</button></div><button class="pista" id="btnHint">¿Necesitas una pista? (máx. 2)</button>`}; }
    case 'ajusta': { const r=GUIA.r2; if(!r) return {no:'Fase 2 · Reto 2',head:'Tu ajuste',title:'Preparando el escenario…',teach:'',acts:''};
      return {no:'Fase 2 · Reto 2',head:'Tu ajuste',title:'Ni se ahoga ni se desboca',
      teach:`Dos recorridos: ciudad, y ciudad con carretera con el filtro más viejo. Además se prueba una <b>parada en plena quema</b>. Elige a cuánto hollín quemar y a qué temperatura; el resultado se ve al validar.<div class="why"><b>Ojo:</b> quemar a cada rato gasta diésel; esperar demasiado ahoga al motor y, si se detiene, se desboca. ${tri('d_try2',RETOS.fallos2,4)}</div><div class="chips" id="chipEx"></div>${r.validado?`<div class="seg" id="segVer"><button class="b ${r.ver==='ciudad'?'on':''}" data-act="ver-ciudad">Ver ciudad</button><button class="b ${r.ver==='mixto'?'on':''}" data-act="ver-mixto">Ver mixto</button></div>`:''}`,
      acts:`<div class="cg"><div class="cl"><div>Quemar cuando el filtro tenga</div><b id="v2D">${fN(r.thr,2)} g/L</b></div><input type="range" id="r2D" min="1" max="8" step="0.25" value="${r.thr}" aria-label="Gramos de hollín por litro a los que se quema"></div>
        <div class="cg"><div class="cl"><div>Temperatura de la quema</div><b id="v2T">${fT(r.Tobj)}</b></div><input type="range" id="r2T" min="560" max="680" step="5" value="${r.Tobj}" aria-label="Temperatura de la quema"></div>
        <button class="b primary" data-act="validar">▶ Validar</button>`}; }
    case 'diag': { const ord=GUIA.orden||CASOS_DX.map(x=>x.k);
      return {no:'Fase 3 · Diagnóstico',head:'¿Qué le pasa?',title:'Averigua por qué falla este filtro',
      teach:`Este camión tiene problemas con su filtro. Lee el dock: compara la contrapresión medida con la esperada, mira las partículas que salen y la temperatura.<div class="task">¿Cuál es la causa? ${tri('d_try3',RETOS.fallos3,3)}</div>`,
      acts:ord.map(k=>`<button class="b" data-act="dx-${k}">${NOMBRE_DX[k]}</button>`).join('')}; }
    case 'quiz': { const Q=GUIA.quiz; if(!Q) return {no:'',head:'',title:'',teach:'',acts:''}; const ya=GUIA.quizResp>=0;
      return {no:'Cierre · Pregunta '+(GUIA.quizN+1)+' de '+QUIZ.length,head:'Quiz',title:Q.q,teach:'',
      acts:Q.opts.map((o,i)=>`<button class="b ${ya?(i===Q.ok?'good':(i===GUIA.quizResp?'bad':'')):''}" data-act="quiz-${i}" ${ya?'disabled':''}>${o}</button>`).join('')+(ya&&GUIA.quizN<QUIZ.length-1?'<button class="b primary" data-act="quiz-sig">Siguiente →</button>':'')}; }
    case 'completo': return {no:'Laboratorio completado',head:'✓',title:'Calculaste, ajustaste y diagnosticaste',
      teach:`Acertaste ${RETOS.quizAcierto} de ${QUIZ.length} en el quiz. Vuelve a <b>Probar</b>, elige «Parada» y sube el umbral para ver cómo se desboca la quema.`,
      acts:`<button class="b primary" data-act="restart">↺ Reiniciar laboratorio</button>`};
  }
  return {no:'',head:'',title:'',teach:'',acts:''};
}
function htmlGuia(){
  const ps=['Calcula','Ajusta','Diagnostica'], C=contenidoGuia();
  const ok=i=>i<GUIA.phase||(i===2&&RETOS.hecho);
  return `<div class="pasos">${ps.map((t,i)=>`<span class="ps ${ok(i)?'ok':(i===GUIA.phase?'on':'')}"><i>${ok(i)?'✓':i+1}</i>${t}</span>`).join('')}</div>
  <div class="retoBox"><div class="rt"><span>${C.no}</span><span>${C.head}</span></div><h3>${C.title}</h3><div class="rq">${C.teach}</div><div class="opt" id="actOpt">${C.acts}</div></div>`;
}
/** Lo que corre en el banco en cada paso del reto (null: lo que digan los mandos). */
function guiaParams(){
  if(GUIA.paso==='calcula'&&GUIA.r1) return {pfObj:fijoPf(GUIA.r1.L,0,0),thr:99,Tobj:600,ash:0,m0:0,regen:false,kPas:0};
  if(GUIA.paso==='ajusta'&&GUIA.r2){ const r=GUIA.r2; return {perfil:r.ver,thr:r.thr,Tobj:r.Tobj,ash:PERFILES[r.ver].ash}; }
  if((GUIA.paso==='diag'||GUIA.paso==='quiz'||GUIA.paso==='completo')&&GUIA.dx){ const c=GUIA.dx; return {pfObj:fijoPf(c.L,c.ash,c.m0),thr:99,Tobj:600,ash:c.ash,m0:c.m0,crack:c.crack,regen:false}; }
  return null;
}
/* ---------- los modos ---------- */
function setMode(m,forzar){
  if(!forzar&&(m===EST.modo||EST.autoRunning)) return;
  tourParaAuto();
  if(m==='reto'){ EST.modo='reto'; if(!GUIA.iniciado){ GUIA.iniciado=true; sorteaCaso1(); paso('calcula'); } }
  else if(m==='probar') EST.modo='probar';
  else { EST.modo='tour'; TOUR.paso=0; }
  document.body.classList.toggle('m-tour',EST.modo==='tour'); document.body.classList.toggle('m-probar',EST.modo==='probar'); document.body.classList.toggle('m-reto',EST.modo==='reto');
  el('feedback').classList.remove('show');
  if(EST.modo==='tour'){ tourVa(0,0.6); pintaBarras(); return; }
  SIM.t=0; reiniciaCalculo(); ponVista(EST.modo==='reto'?'filtro':'todo',0.6); pintaHUD(); pintaDockFijo(); pintaBarras();
}

async function runAuto(){

/* ===================== 21. SONIDO (sintetizado) =====================
   Un soplido grave del escape cuyo tono sigue al caudal de gas (muy atenuado) y los avisos de acierto y fallo. */
const sonido=(function(){
  let ctx=null,on=true,master=null,ult=0,zum=null,zg=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      zum=ctx.createOscillator(); zg=ctx.createGain(); zum.type='sawtooth'; zum.frequency.value=60; zg.gain.value=0; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=220; zum.connect(lp); lp.connect(zg); zg.connect(master); zum.start();
    }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); ult=f; }
  return {init,
    zumbido:(q)=>{ if(!ctx||!zum) return; const t=ctx.currentTime; zum.frequency.setTargetAtTime(34+q*60,t,0.15); zg.gain.setTargetAtTime(on&&q>0?0.010:0,t,0.15); },
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }, get freq(){ return ult; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };

/* ===================== 22. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.max(Math.min(devicePixelRatio,alta?2:1.5),Math.min(devicePixelRatio,1.5)>1?1.25:1));
  const ms=alta?2048:1024; if(LUZ.sol.shadow.mapSize.x!==ms){ LUZ.sol.shadow.mapSize.set(ms,ms); if(LUZ.sol.shadow.map){ LUZ.sol.shadow.map.dispose(); LUZ.sol.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); if(typeof ponVista==='function'&&CALC) ponVista(EST.vista,0.001); centraEnHueco();
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 23. EL LAZO: UN SOLO RELOJ =====================
   El tiempo de uso avanza dt·velocidad en cada cuadro (más lento mientras quema y cuando se desboca, con su factor rotulado), y con ESE
   tiempo se mueven las partículas, se pintan el hollín y el calor de las celdas del filtro y las chispas, y se dibujan las gráficas del dock. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0, tSon=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  const dtS=EST.pausa?0:dt, dtSim=dtS*velEfectiva(SIM.e);
  aplicaEscena(dtS,dtSim);
  pasaCam(dt);
  if(t-tSon>0.4){ tSon=t; sonido.zumbido(SIM.e&&!EST.pausa?clamp(SIM.e.mGas/0.16,0,1):0); }
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaGraficas(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos(); colocaFoco();
}

/* ===================== 24. ARRANQUE =====================
   Abre funcionando y con el recorrido en el paso 1: el motor suelta hollín (puntos negros) y el filtro ya lo está atrapando en sus
   paredes, antes de que el alumno toque nada. */
disposicion();

SIM.t=TOUR_PASOS[0].t0(CALC);
aplicaCalidad();

aplicaEscena(0.02,0.02);
pintaBarras();
ponVista('todo',0.001);
centraEnHueco();
pintaDockFijo();
cuadro();

/** Mide el objeto en lo VISIBLE: se pinta sin plataforma, suelo ni fondo sobre magenta puro y se toma la caja de los píxeles que no son magenta. */
function mideObjeto(){
  const ocultos=[]; PLATAFORMA.visible=false; scene.traverse(o=>{ if(o.userData&&o.userData.fondo&&o.visible){ o.visible=false; ocultos.push(o); } });
  const bg=scene.background, fog=scene.fog; scene.background=null; scene.fog=null; renderer.setClearColor(0xff00ff,1);
  renderer.render(scene,camera);
  const c=renderer.domElement, W=c.width, H=c.height, t=document.createElement('canvas'); t.width=W; t.height=H; const g=t.getContext('2d',{willReadFrequently:true}); g.drawImage(c,0,0);
  const d=g.getImageData(0,0,W,H).data; let x0=1e9,x1=-1,y0=1e9,y1=-1;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=(y*W+x)*4; if(!(d[i]>235&&d[i+1]<30&&d[i+2]>235)){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  PLATAFORMA.visible=true; for(const o of ocultos) o.visible=true; scene.background=bg; scene.fog=fog; renderer.setClearColor(0x000000,1);
  const k=W/innerWidth; return {x0:x0/k,x1:x1/k,y0:y0/k,y1:y1/k,altoPx:(y1-y0)/k,anchoPx:(x1-x0)/k,fracAlto:(y1-y0)/H,fracAncho:(x1-x0)/W,hueco:huecoLibre(),W:innerWidth,H:innerHeight};
}
