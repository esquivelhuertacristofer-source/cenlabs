const RAY=new THREE.Raycaster(), PUN=new THREE.Vector2();
function hitBajo(cx_,cy_){
  const r=renderer.domElement.getBoundingClientRect(); PUN.set((cx_-r.left)/r.width*2-1,-(cy_-r.top)/r.height*2+1); RAY.setFromCamera(PUN,camera);
  const hits=RAY.intersectObjects([EXPO,BANCO],true);
  for(const h of hits){
    const m=Array.isArray(h.object.material)?h.object.material[0]:h.object.material;
    if(h.point.z>0.0015&&m&&m.clippingPlanes&&renderer.localClippingEnabled) continue;      // del lado cortado: no se ve
    let vis=true; for(let p=h.object;p;p=p.parent) if(!p.visible) vis=false; if(!vis) continue;
    return h; }
  return null;
}
function piezaDe(h){ if(!h) return null; let o=h.object; while(o&&!(o.userData&&o.userData.pieza)) o=o.parent; return o?o:null; }
let hovT=0;
renderer.domElement.addEventListener('pointermove',e=>{
  if(e.buttons){ TIP.style.display='none'; return; } const now=performance.now(); if(now-hovT<70) return; hovT=now;
  const o=piezaDe(hitBajo(e.clientX,e.clientY)), k=o&&o.userData.pieza, t=k&&INFO[k];
  if(t){ TIP.textContent=t; TIP.style.display='block'; TIP.style.left=Math.min(innerWidth-TIP.offsetWidth-8,e.clientX+14)+'px'; TIP.style.top=(e.clientY+14)+'px'; }
  else TIP.style.display='none';
});
renderer.domElement.addEventListener('pointerleave',()=>{ TIP.style.display='none'; });
let toqueP=null, tipT=0;
renderer.domElement.addEventListener('pointerdown',e=>{ toqueP=e.pointerType==='mouse'?null:[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup',e=>{
  if(!toqueP||Math.hypot(e.clientX-toqueP[0],e.clientY-toqueP[1])>8) return;
  const o=piezaDe(hitBajo(e.clientX,e.clientY)), k=o&&o.userData.pieza, t=k&&INFO[k]; if(!t) return;
  TIP.textContent=t; TIP.style.display='block';
  TIP.style.left=Math.max(8,Math.min(innerWidth-TIP.offsetWidth-8,e.clientX-TIP.offsetWidth/2))+'px'; TIP.style.top=Math.max(8,e.clientY-TIP.offsetHeight-18)+'px';
  clearTimeout(tipT); tipT=setTimeout(()=>{ TIP.style.display='none'; },2600);
});


/* ===================== 15. DISPOSICIÓN: ANCHO, ESTRECHO, MÓVIL =====================
   Si no caben guía, escena y dock lado a lado (el marco de la plataforma, una
   tableta), la escena va arriba y guía e instrumentos comparten una hoja con
   pestañas abajo. */
function disposicion(){
  const W=innerWidth, b=document.body;
  const estrecho=W<1080, movil=W<640;
  b.classList.toggle('estrecho',estrecho); b.classList.toggle('movil',movil); b.classList.toggle('ancho',estrecho&&!movil);
  if(estrecho){ if(!b.classList.contains('t-hud')&&!b.classList.contains('t-panel')) b.classList.add('t-hud'); ajustaHoja(); }
  el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('on',b.classList.contains('t-'+t.dataset.tab)));
}
/** La hoja mide lo que pide su contenido (entre 240 px y el 62 % del alto en el móvil), para que la guía nunca
    tenga que desplazarse por dentro; la cámara se vuelve a encajar en el hueco que queda. */
function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.47:0.43),240,450));
  let hh=base; const hud=el('hud');
  if(movil&&b.classList.contains('t-panel')) hh=Math.round(clamp(H*0.6,240,560));
  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;
    hh=Math.round(clamp(pide,240,Math.max(base,H*(movil?0.62:0.56)))); }
  const ant=parseFloat(b.style.getPropertyValue('--hojaH'))||0;
  if(Math.abs(ant-hh)>1){ b.style.setProperty('--hojaH',hh+'px'); colocaBarras();
    if(ant){ clearTimeout(window.__hjWPT); window.__hjWPT=setTimeout(()=>ponVista(VISTA.actual,REDUCIDO?0.001:0.4),40); } }
}
el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.onclick=()=>{ const b=document.body; b.classList.remove('t-hud','t-panel'); b.classList.add('t-'+t.dataset.tab); disposicion(); });



/* ===================== 16. EL LABORATORIO GUIADO =====================
   Tres fases: 0 · Reto (100 kW netos con η_neto mínimo, en la ventana de la CC–CC, dentro de lo que evacua el radiador y con
   LAS MENOS celdas), 1 · Diagnóstico (una de cuatro fallas al azar y su reparación) y 2 · Cierre (una pregunta con las
   opciones barajadas). Cada intento sortea una pila distinta —área de celda, temperatura, humedad, rendimiento exigido y
   radiador—; tres fallos en el reto cambian el dato. Ni el HUD, ni el dock, ni los mensajes muestran cuántas son «las menos
   celdas» antes de validar. */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajaFY=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const GUIA={fase:0,iniciado:false,retoOk:false,dxOk:false,hecho:false,scen:null,intentos:0,fallos:0,fallosDx:0,resiembras:0,pistas:0,falla:null,sintoma:'',
  quiz:null,quizResp:-1,quizOk:false,ultimaCorrecta:-1};

/* Interpolación de los mandos (para que las cifras rueden en vez de saltar). */
const TW={items:[],u:1,dur:1};
function muevea(o,dur=0.8){
  if(REDUCIDO||dur<=0){ Object.assign(EST,o); sincronizaMandos(); return; }
  TW.items=Object.keys(o).map(k=>({k,a:EST[k],b:o[k]})); TW.u=0; TW.dur=dur;
}
function pasaTween(dt){
  if(TW.u>=1) return;
  TW.u=Math.min(1,TW.u+dt/TW.dur); const e=ease(TW.u);
  for(const it of TW.items) EST[it.k]=it.a+(it.b-it.a)*e;
  sincronizaMandos();
}

/* ---------- Fase 0: el reto ---------- */
function sorteaEscenario(){
  const prev=GUIA.scen; let e;
  do{ e=pickOne(ESCENARIOS); } while(prev&&prev.A===e.A&&prev.T===e.T&&ESCENARIOS.length>1);
  GUIA.scen=e; return e;
}
function aplicaEscenario(sc){
  SIMU.sc=sc; EST.A=sc.A; EST.T=sc.T; EST.RH=sc.RH; EST.falla=null; EST.autoRunning=false;
  const o=celdasMinimas(sc); SIMU.optimo=o; SIMU.Nopt=o?o.N:null;
  // el punto de salida: más celdas de las necesarias, poca presión y la mitad de la corriente para los 100 kW
  const N0=clamp(Math.round((o?o.N:400)*1.30),150,600), P0=1.4e5, c0=condiciones(sc.T,P0,sc.RH,null);
  const I100=IparaPneta(N0,sc.A,c0,OPER.Pobj)||300;
  muevea({N:N0,P:P0,I:Math.round(I100*0.55)},0.9);
}
function startReto(){
  GUIA.fase=0; GUIA.iniciado=true; GUIA.retoOk=false; GUIA.dxOk=false; GUIA.fallos=0; GUIA.pistas=0; GUIA.falla=null;
  aplicaEscenario(sorteaEscenario()); ponVista('conjunto');
}
function criteriosFallan(){ return SIMU.pliego.slice(0,4).map((c,i)=>c.ok?null:c.id).filter(Boolean); }
function validar(){
  recalcula(); SIMU.pliego=pliego(SIMU.pl,SIMU.sc,SIMU.Nopt);
  const fallan=criteriosFallan(); GUIA.intentos++;
  const pl=SIMU.pl, sc=SIMU.sc, o=SIMU.optimo;
  if(!fallan.length&&SIMU.pliego[4].ok){
    GUIA.retoOk=true; GUIA.fallos=0; sonido.bien();
    feedback('good','¡Cumple el pliego! ✓',
      `${fN(pl.Pnet/1000,1)} kW netos con ${fN(pl.N,0)} celdas a ${fN(pl.I,0)} A (${fN(pl.J,2)} A/cm²) y ${bar(EST.P)}: η neto ${fN(pl.etaNeto*100,1)} %, ${fN(pl.Vs,0)} V y ${fN(pl.Q/1000,0)} kW de calor. `+
      `Con estas condiciones la pila más pequeña posible llevaría <b>${fN(o.N,0)} celdas</b> (a ${bar(o.P)} y ${fN(o.I,0)} A). `+
      `Subir la presión mejora la tensión pero el compresor se lleva ${fN(pl.Pcomp/1000,1)} kW: lo que cuenta es la potencia NETA.`,true);
    pasoGuia();
  } else if(!fallan.length){
    GUIA.fallos++; sonido.mal();
    feedback('bad','Cumple, pero te sobran celdas','Los cuatro criterios físicos están en ✓, pero existe una pila con bastantes menos celdas que también los cumple. Cada celda de más es membrana, platino y peso. Quita celdas y ajusta la corriente y la presión.');
    pasoGuia();
  } else {
    GUIA.fallos++; sonido.mal();
    if(GUIA.fallos>=3){
      GUIA.fallos=0; GUIA.resiembras++; aplicaEscenario(sorteaEscenario());
      feedback('bad','Tres intentos fallidos','Llega otra pila: otra celda, otra temperatura y otro radiador. Lee el pliego del dock y busca qué criterio falla.');
    } else {
      feedback('bad','Todavía no cumple',`Falla ${fallan.map(i=>NOM_CRIT[i]).join(', ')}. Mira el pliego del dock. (intentos fallidos: ${GUIA.fallos}/3)`);
    }
    pasoGuia();
  }
}
function pista(){
  if(GUIA.pistas===0){ GUIA.pistas=1; feedback('good','Pista 1 de 2','Para la misma potencia, menos celdas exigen más corriente en cada una: baja la tensión de celda, baja el rendimiento y sube el calor. Busca el punto donde el rendimiento o el radiador te frenan.'); }
  else if(GUIA.pistas===1){ GUIA.pistas=2; feedback('good','Pista 2 de 2','La presión sube la tensión (Nernst y cinética) pero el compresor consume más. Mira la potencia neta y el η neto, no la bruta: la presión que más ayuda queda en el interior del rango.'); }
  else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que mide el dock.');
}

/* ---------- Fase 1: el diagnóstico ---------- */
const NOM_FALLA={seca:'membrana seca (humidificación fallida)',inunda:'cátodo inundado',cruce:'cruce de hidrógeno (membrana picada)',cata:'catalizador degradado'};
function sintomaDe(f){
  const c0=SIMU.c0||condiciones(EST.T,EST.P,EST.RH,null), cf=condiciones(EST.T,EST.P,EST.RH,f), J=EST.I/EST.A;
  const dVop=(celda(J,c0).V-celda(J,cf).V)*1000, dOCV=(celda(0,c0).V-celda(0,cf).V)*1000;
  if(f==='seca') return `SÍNTOMA: a la corriente de trabajo la tensión de celda es ${fN(dVop,0)} mV menor que la de la pila sana, y la caída crece en línea recta con la corriente. La tensión en circuito abierto es la de siempre y la resistencia de alta frecuencia (HFR) subió de ${fN(c0.R*1000,0)} a ${fN(cf.R*1000,0)} mΩ·cm². ¿Qué lo causa?`;
  if(f==='inunda') return `SÍNTOMA: hasta media curva la pila rinde igual que la sana, pero la rodilla llega mucho antes: a la corriente de trabajo faltan ${fN(dVop,0)} mV y la tensión se desploma al subir un poco más. El OCV y la HFR no cambiaron. ¿Qué lo causa?`;
  if(f==='cruce') return `SÍNTOMA: en circuito abierto la tensión es ${fN(dOCV,0)} mV menor que la de la pila sana, pero a la corriente de trabajo la diferencia es de sólo ${fN(dVop,0)} mV. La HFR no cambió. ¿Qué lo causa?`;
  return `SÍNTOMA: toda la curva baja casi en paralelo: ${fN(dOCV,0)} mV en circuito abierto y ${fN(dVop,0)} mV todavía a la corriente de trabajo. La HFR y la rodilla de corriente límite no cambiaron. ¿Qué lo causa?`;
}
function startDx(){
  GUIA.fase=1; GUIA.dxOk=false; GUIA.fallosDx=0; GUIA.sintoma='';
  GUIA.falla=pickOne(FALLAS); EST.falla=GUIA.falla; SIMU.clave='';
  recalcula(); GUIA.sintoma=sintomaDe(GUIA.falla);
  pasoGuia(); ponVista('conjunto');
}
function diagnostica(f){
  if(!GUIA.falla||GUIA.dxOk) return; GUIA.intentos++;
  if(f===GUIA.falla){
    GUIA.dxOk=true; sonido.bien(); const c=SIMU.c;
    const expl={seca:`Sin agua, la membrana pasa a λ = ${fN(c.lam,1)} y su conductividad se desploma: aparece una resistencia óhmica de ${fN(c.R*1000,0)} mΩ·cm² (la HFR lo delata). El OCV no cambia porque sin corriente no hay caída óhmica.`,
      inunda:`El agua líquida tapa los poros de la GDL y el O₂ llega con dificultad al catalizador: la corriente límite cae a ${fN(c.JL,2)} A/cm² y la rodilla de concentración aparece antes. La HFR y el OCV no cambian.`,
      cruce:`Una membrana picada deja pasar H₂ al cátodo: la pérdida interna J<sub>n</sub> sube y el potencial mixto baja el OCV a ${fN(SIMU.OCV,3)} V. A corriente alta esa fuga pesa poco frente a J y las curvas se juntan.`,
      cata:`Con el área activa de platino reducida, J₀ cae y la sobretensión de activación sube en TODA la curva; la HFR y la corriente límite siguen igual.`}[f];
    feedback('good','Diagnóstico correcto ✓',expl+' <b>Ahora corrígelo.</b>',true); pasoGuia();
  } else {
    GUIA.fallosDx++; sonido.mal();
    if(GUIA.fallosDx>=3){
      GUIA.fallosDx=0; GUIA.resiembras++; GUIA.falla=pickOne(FALLAS.filter(x=>x!==GUIA.falla)); EST.falla=GUIA.falla; SIMU.clave=''; recalcula();
      GUIA.sintoma=sintomaDe(GUIA.falla);
      feedback('bad','Tres intentos fallidos','Ahora la pila presenta OTRA falla: observa de nuevo el dock.',true);
    } else {
      const no={seca:'una membrana seca subiría la HFR y dejaría el OCV igual',inunda:'un cátodo inundado hundiría la tensión sólo cerca de la corriente límite',cruce:'un cruce de H₂ baja el OCV y casi nada la tensión a corriente alta',cata:'un catalizador degradado desplaza toda la curva sin tocar la HFR'}[f];
      feedback('bad','No es esa la falla',`Eso (${NOM_FALLA[f]}) daría otro síntoma: ${no}. Observa otra vez. (intentos fallidos: ${GUIA.fallosDx}/3)`,true);
    }
    pasoGuia();
  }
}
function reparar(){
  if(!GUIA.dxOk||GUIA.hecho) return;
  EST.falla=null; SIMU.clave=''; GUIA.hecho=true; sonido.bien();
  feedback('good','¡Reparado! ✓','La curva vuelve a la de la pila sana. Completaste el dimensionado y diagnosticaste una falla real de una pila PEM. Falta la pregunta de cierre.',true);
  pasoGuia();
}

/* ---------- Fase 2: el cierre ---------- */
const BANCO_Q=[
  {q:'Subes la corriente de la pila con las mismas condiciones. ¿Qué le pasa a la tensión de cada celda?',
   ok:'Baja: crecen las pérdidas de activación, óhmicas y de concentración',
   mal:['Sube: pasa más carga por el mismo catalizador','No cambia: la fija la reacción H₂ + ½O₂ → H₂O','Sube hasta alcanzar el potencial de Nernst']},
  {q:'En circuito abierto la celda real da unos 0,95–1,0 V y no los 1,18 V de Nernst. ¿Por qué?',
   ok:'El cruce de H₂ y las corrientes internas fijan un potencial mixto en el cátodo',
   mal:['Porque el agua formada baja la tensión','Porque el catalizador no se ha activado','Porque Nernst sólo vale para el agua líquida']},
  {q:'¿Por qué la membrana del Nafion tiene que estar húmeda?',
   ok:'Los protones se mueven por los grupos sulfónicos hidratados: sin agua la resistencia óhmica se dispara',
   mal:['Porque el agua es el combustible','Porque así los electrones atraviesan la membrana','Para enfriar el catalizador de platino']},
  {q:'Duplicas la presión de operación del aire. ¿Qué compromiso aparece?',
   ok:'Sube la tensión de la celda, pero el compresor consume más y el rendimiento NETO puede bajar',
   mal:['Sólo mejora: más presión siempre da más potencia neta','Sólo empeora: la tensión de celda baja con la presión','No cambia nada: la tensión depende sólo de la corriente']},
  {q:'La energía química del H₂ (PCI) que no sale como electricidad en la pila, ¿a dónde va?',
   ok:'Sale como calor que el refrigerante debe evacuar al radiador',
   mal:['Se acumula en la membrana como carga','Sale como más H₂ en el agua producida','Desaparece: la celda es 100 % eficiente']},
];
function preparaQuiz(){
  const it=pickOne(BANCO_Q); const opciones=[it.ok,...it.mal];
  let ord, idx; let guard=0;
  do{ ord=barajaFY(opciones.map((t,i)=>i)); idx=ord.indexOf(0); guard++; }while(idx===GUIA.ultimaCorrecta&&guard<20);
  GUIA.ultimaCorrecta=idx; GUIA.quiz={q:it.q,opc:ord.map(i=>opciones[i]),ok:idx,expl:it.ok}; GUIA.quizResp=-1; GUIA.quizOk=false;
}
function startCierre(){ GUIA.fase=2; preparaQuiz(); pasoGuia(); ponVista('conjunto'); }
function responde(i){
  if(GUIA.fase!==2||GUIA.quizResp>=0) return; GUIA.quizResp=i; GUIA.quizOk=(i===GUIA.quiz.ok);
  if(GUIA.quizOk){ sonido.bien(); feedback('good','Correcto ✓','Respuesta: '+GUIA.quiz.opc[GUIA.quiz.ok]+'.',true); }
  else { sonido.mal(); feedback('bad','No es esa','La correcta era: '+GUIA.quiz.opc[GUIA.quiz.ok]+'.',true); }
  pasoGuia();
}

/* ---------- el enrutador de acciones ---------- */
function handleAction(act){
  switch(act){
    case 'validar': if(GUIA.fase===0&&!GUIA.retoOk) validar(); break;
    case 'hint': if(GUIA.fase===0&&!GUIA.retoOk) pista(); break;
    case 'to-dx': if(GUIA.retoOk&&GUIA.fase===0) startDx(); break;
    case 'dx-seca': diagnostica('seca'); break;
    case 'dx-inunda': diagnostica('inunda'); break;
    case 'dx-cruce': diagnostica('cruce'); break;
    case 'dx-cata': diagnostica('cata'); break;
    case 'reparar': reparar(); break;
    case 'to-cierre': if(GUIA.hecho&&GUIA.fase===1) startCierre(); break;
    case 'restart': location.reload(); break;
  }
}
const tries=(n,t)=>`<span class="tries">intentos fallidos: <b>${n}</b>/${t}</span>`;
function contenidoGuia(){
  const sc=GUIA.scen;
  if(GUIA.fase===0){
    const done=GUIA.retoOk, Qmax=sc.UA*(sc.T-OPER.Tamb);
    return {no:'Reto',head:'Pliego del dock',title:'Entrega 100 kW netos con las menos celdas',
      teach:`Celdas de <b>${fN(sc.A,0)} cm²</b> a <b>${gradosC(sc.T)}</b>, gases al <b>${fN(sc.RH*100,0)} %</b>. Se exige <b>η neto ≥ ${fN(sc.etaMin*100,0)} %</b>, la CC–CC admite ${OPER.Vmin}–${OPER.Vmax} V y el radiador evacua como mucho <b>${fN(Qmax/1000,0)} kW</b>.
      <div class="task">Ajusta N, I y p hasta que los cuatro criterios estén en ✓ y la pila no lleve más celdas de las necesarias. ${tries(GUIA.fallos,3)}</div>`,
      mandos:mN()+mI()+mP(),
      acts:done?`<button class="b primary good" data-act="to-dx">Continuar al diagnóstico →</button>`:`<button class="b primary" data-act="validar">✓ Validar</button><button class="pista" id="btnHint">¿Necesitas una pista? (máx. 2)</button>`};
  }
  if(GUIA.fase===1){
    if(!GUIA.dxOk) return {no:'Diagnóstico',head:'¿Cuál es la falla?',title:'La pila rinde menos de lo debido',
      teach:`La pila de antes cumplía el pliego y algo cambió. Lee la curva de polarización contra la de la pila sana (trazo punteado) e <b>identifica la causa</b>.<div class="task" id="symptomTask">${GUIA.sintoma}</div>${tries(GUIA.fallosDx,3)}`,
      mandos:'',acts:`<button class="b" data-act="dx-seca"><span class="ic">≈</span> Membrana seca</button><button class="b" data-act="dx-inunda"><span class="ic">◍</span> Cátodo inundado</button><button class="b" data-act="dx-cruce"><span class="ic">⇢</span> Cruce de hidrógeno</button><button class="b" data-act="dx-cata"><span class="ic">◌</span> Catalizador degradado</button>`};
    if(!GUIA.hecho) return {no:'Diagnóstico',head:'Reparación',title:'Corrige la falla',
      teach:`Diagnóstico correcto: <b>${NOM_FALLA[GUIA.falla]}</b>. Corrígela y mira la curva volver a la de la pila sana.`,mandos:'',acts:`<button class="b primary good" data-act="reparar">🔧 Corregir la falla</button>`};
    return {no:'Diagnóstico',head:'✓',title:'Falla corregida',teach:`La curva vuelve a la de la pila sana. Falta una pregunta para cerrar.`,mandos:'',acts:`<button class="b primary" data-act="to-cierre">Pregunta de cierre →</button>`};
  }
  const Q=GUIA.quiz, resp=GUIA.quizResp>=0;
  return {no:'Cierre',head:resp?(GUIA.quizOk?'Correcto':'Revisa'):'Una pregunta',title:'Para cerrar',
    teach:`${Q.q}`,mandos:'',
    acts:Q.opc.map((t,i)=>`<button class="b ${resp?(i===Q.ok?'good':(i===GUIA.quizResp?'bad':'')):''}" data-quiz="${i}" ${resp?'disabled':''}>${t}</button>`).join('')+(resp?`<button class="b primary" data-act="restart">↺ Reiniciar laboratorio</button>`:'')};
}
function htmlGuia(){
  if(!GUIA.iniciado){ return `<div class="retoBox"><h3>Preparando la pila…</h3></div>`; }
  const ps=['Reto','Diagnóstico','Cierre'], C=contenidoGuia();
  const ok=i=>(i===0&&GUIA.retoOk)||(i===1&&GUIA.hecho)||(i===2&&GUIA.quizResp>=0&&GUIA.quizOk);
  return `<div class="pasos">${ps.map((t,i)=>`<span class="ps ${ok(i)?'ok':(i===GUIA.fase?'on':'')}"><i>${ok(i)?'✓':i+1}</i>${t}</span>`).join('')}</div>
  <div class="retoBox"><div class="rt"><span>${C.no}</span><span>${C.head}</span></div><h3>${C.title}</h3><div class="rq">${C.teach}</div>${C.mandos}<div class="opt" id="actOpt">${C.acts}</div></div>`;
}

/* ---------- los modos ---------- */
function setMode(m,forzar){
  if(!forzar&&(m===EST.modo||EST.autoRunning)) return;

    EST.modo='guia';
    if(!GUIA.iniciado) startReto(); else ponVista(VISTA.actual);
  } else {
    EST.modo='marcha'; EST.falla=null; SIMU.sc=null; SIMU.pliego=null; SIMU.clave='';
    Object.assign(EST,{A:300,N:400,P:2.0e5,T:353.15,RH:0.90}); EST.I=380; sincronizaMandos(); ponVista('conjunto');
  }
  document.body.classList.toggle('m-marcha',EST.modo==='marcha'); document.body.classList.toggle('m-guia',EST.modo==='guia');

/* ---------- el recorrido guiado de «En marcha» ---------- */
const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function runAuto(){
  if(EST.autoRunning||EST.modo!=='marcha') return; EST.autoRunning=true; sonido.init();
  const hud=el('hud'), b=el('btnAuto');
  const prev={I:EST.I,N:EST.N,P:EST.P,T:EST.T,RH:EST.RH,pausa:EST.pausa,vista:VISTA.actual};
  const lock=()=>{ hud.style.pointerEvents='none'; if(b){ b.disabled=true; b.textContent='Recorrido en curso…'; } };
  try{
    lock(); EST.pausa=false; Object.assign(EST,{N:400,P:2.0e5,T:353.15,RH:0.9}); muevea({I:380},0.6); ponVista('conjunto');
    showToast('Paso 1 · El <b>H₂</b> entra por arriba y el <b>aire</b> por abajo, a contracorriente. En cada celda el H₂ cede electrones: los <b>protones</b> cruzan la membrana y los <b>electrones</b> dan la vuelta por el motor.',8200);
    await espera(8600);
    ponVista('membrana');
    showToast('Paso 2 · Mira la membrana: sólo deja pasar protones (dorado). Los electrones (cian) van por las placas, de una celda a la anterior, y salen por el borne negativo.',7600);
    await espera(8000);
    ponVista('conjunto'); muevea({I:520},2.4);
    showToast('Paso 3 · Más corriente: Faraday dice que el H₂, el aire y el agua suben en proporción; también el calor. Pero la <b>tensión de celda baja</b>: mira la curva de polarización.',8200);
    await espera(8600);
    muevea({I:380,P:1.3e5},1.6);
    showToast('Paso 4 · Con poca presión la celda rinde menos. Sube la presión: mejora la tensión, pero el compresor cobra. Lo que cuenta es el <b>η neto</b>, que tiene su óptimo en medio.',8200);
    await espera(8600);
    muevea({P:2.6e5},2.6); await espera(3000);
    muevea({P:2.0e5,RH:0.35},1.8); ponVista('membrana');
    showToast('Paso 5 · Con los gases muy secos la membrana se vuelve blanquecina y su resistencia sube. Con los gases saturados, el agua tapa los poros y baja la corriente límite: la humedad también tiene su punto.',8200);
    await espera(8600);
  } finally {
    EST.autoRunning=false; hud.style.pointerEvents=''; muevea({I:prev.I,N:prev.N,P:prev.P,T:prev.T,RH:prev.RH},0.8);
    EST.pausa=prev.pausa; pintaHUD(); ponVista(prev.vista); pintaBarras();
  }
}



/* ===================== 17. SONIDO (sintetizado) =====================
   Un zumbido suave que sube con la potencia neta: una pila no suena (suena su compresor);
   esto es sólo un apoyo para seguir el reloj. */
const sonido=(function(){
  let ctx=null,on=true,master=null,osc=null,gain=null,filt=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      osc=ctx.createOscillator(); osc.type='sine'; filt=ctx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=900;
      gain=ctx.createGain(); gain.gain.value=0; osc.connect(filt); filt.connect(gain); gain.connect(master); osc.start();
    }catch(e){ ctx=null; } }
  function actualiza(activo,P){ if(!ctx) return; const t=ctx.currentTime;
    osc.frequency.setTargetAtTime(110+P/450,t,0.08);
    gain.gain.setTargetAtTime(on&&activo?0.018+0.012*Math.min(1,P/100000):0,t,0.12); }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); }
  return {init,actualiza,
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    clac:()=>tono(320,0.06,0.04,'triangle'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; },
    get vol(){ return gain?gain.gain.value:0; }, get freq(){ return osc?osc.frequency.value:0; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});


/* ===================== 18. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.min(devicePixelRatio,alta?2:1.5));
  const ms=alta?2048:1024; if(LUZ.clave.shadow.mapSize.x!==ms){ LUZ.clave.shadow.mapSize.set(ms,ms); if(LUZ.clave.shadow.map){ LUZ.clave.shadow.map.dispose(); LUZ.clave.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  M_PUNTOS.uniforms.uPx.value=innerHeight*renderer.getPixelRatio()/(2*Math.tan(camera.fov*Math.PI/360));
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  M_PUNTOS.uniforms.uPx.value=innerHeight*renderer.getPixelRatio()/(2*Math.tan(camera.fov*Math.PI/360));
  colocaBarras();
  clearTimeout(window.__rzWPT); window.__rzWPT=setTimeout(()=>ponVista(VISTA.actual,0.01),140);
}
window.addEventListener('resize',alCambiarTamano);


/* ===================== 19. EL LAZO: UN SOLO RELOJ =====================
   El tiempo avanza dt en cada cuadro, y con ESE tiempo se pintan la escena (partículas, calor, carga) y el dock (cifras,
   cursores, acumulados de H₂ y de agua). */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  pasaTween(dt);
  aplicaEscena(dt,t);
  pasaCam(dt);
  sonido.actualiza(!EST.pausa&&!!SIMU.pl,SIMU.pl?SIMU.pl.Pnet:0);
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); if(!EST.autoRunning&&document.activeElement&&document.activeElement.type!=='range') sincronizaMandos(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaBud(); pintaEta(); pintaPol(); pintaBa(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos();
}

/* ===================== 20. ARRANQUE =====================
   Abre funcionando: 400 celdas a 425 A (1,42 A/cm²), 2 bar, 80 °C y gases al 90 %. */

recalcula();
pintaHUD();
pintaDockFijo();

cuadro();
