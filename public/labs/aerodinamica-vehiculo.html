<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Aerodinámica del Vehículo — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#07121C;--panel:rgba(8,18,28,.88);--line:#1B3347;--ink:#EAF2F8;
    --dim:#8FAEC4;--accent:#38BDF8;--accent2:#7DD3FC;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cF:#7DD3FC;--cR:#FFB347;--cE:#FF6B3D;--cG:#C8D6E2;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#13202c;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#182b3a}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#5cc8fb}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#06120f}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#7DD3FC;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f8a85;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f948f;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#04211c}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#08121b;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(27,51,71,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(27,51,71,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f8a85}
  .dk-tit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#9fbab4;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(27,51,71,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c9c4;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#13202c;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfe0dc;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,20,30,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(8,18,28,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d6d2}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,22,24,.92);border:1px solid rgba(125,211,252,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,22,24,.84);border:1px solid rgba(125,211,252,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}
  body.estrecho.ancho.t-panel .panel>.dk-fig{grid-column:1;grid-row:2}
  body.estrecho.ancho.t-panel .panel>.dk-row{grid-column:1;grid-row:3/6;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-fu{grid-column:2;grid-row:2;align-self:start}
  body.estrecho.ancho.t-panel .panel>.dk-g.fu{grid-column:2;grid-row:2/4;min-height:0;margin-top:18px}
  body.estrecho.ancho.t-panel .panel>.dk-ley{display:none}
  body.estrecho.ancho.t-panel .panel>.t-sp{grid-column:2;grid-row:4}
  body.estrecho.ancho.t-panel .panel>.dk-g.sp{grid-column:2;grid-row:5;min-height:0}
  body.estrecho.ancho.t-panel .panel>.dk-aviso{display:none}
  body.estrecho .hud details>.cuerpo{max-height:24vh}
  body.estrecho.ancho.t-hud .hud{display:grid;grid-template-columns:1fr 1.05fr;column-gap:14px;row-gap:7px;align-content:start;grid-auto-flow:row dense}
  body.estrecho.ancho .hud>.hcab,body.estrecho.ancho .hud>.modebar,body.estrecho.ancho .hud>.hdet,body.estrecho.ancho .hud>.pasos{grid-column:1}
  body.estrecho.ancho .hud>.hmandos,body.estrecho.ancho .hud>.retoBox{grid-column:2;grid-row:1/span 4}
  body.estrecho .hdet{flex-direction:row}body.estrecho .hdet>details{flex:1;min-width:0}
  body.estrecho .hdet details[open]{position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 54px);z-index:25;background:rgba(8,18,28,.97)}
  body.movil .lt{display:none} body.movil .tbar .modo,body.movil .tbar .reloj{display:none}
  body.movil .tbar{gap:6px;padding:5px 8px} body.movil .tbar .est{min-width:0}
  body.movil .dk-ley{display:none} body.movil .fg b{font-size:13.5px} body.movil .fg .fl{font-size:9.5px}
  body.movil .dk-g.fu{min-height:70px} body.movil .dk-g.sp{min-height:52px} body.movil .dk-row{min-height:150px}
  body.movil .hud h2{font-size:15.5px} body.movil .hud .intro{font-size:11.8px;line-height:1.42}
  body.estrecho .hud{overflow-y:auto}
  body.estrecho .vbar [data-t="rot"],body.estrecho .vbar .sep.s1{display:none}
  body.estrecho.ancho .vbar{top:60px}
  body.movil .vbar{flex-wrap:nowrap;gap:3px;padding:3px 4px;top:54px} body.movil .vbar .sep{display:none} body.movil .vbar .b.sm{padding:5px 7px;font-size:11px}
  body.movil .vbar .lg{display:none}
  body.movil .tbar .lento{display:none}
  body.movil .hud{gap:6px;padding:10px 12px 9px} body.movil .hud .eyebrow{display:none}
  body.movil .modebar .b{padding:6px 4px 5px}
  body.movil .hmandos{display:grid;grid-template-columns:1.3fr 1fr;gap:6px 8px}
  body.movil .hmandos>:nth-child(1),body.movil .hmandos>:nth-child(2),body.movil .hmandos>.fila{grid-column:1/-1}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as P3 from '/labs/_piezas3d.js';
import { instalaDiag } from '/labs/_diag3d.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   LAB — AERODINÁMICA: ARRASTRE, SUSTENTACIÓN Y CONSUMO
   (Dinámica del vehículo · mecanica-133)

   Un coche deportivo en un túnel de viento con cinta rodante, ya soplando al
   abrir. El humo sale de un rastrillo de tubitos y sigue un campo de flujo
   DIDÁCTICO (no es CFD): el cuerpo desvía el aire, el alerón trasero es un
   vórtice de herradura de circulación Γ = ½·c·C_L·U, el suelo acelera el aire
   por Bernoulli y la estela deja el déficit de cantidad de movimiento que
   equivale al arrastre. La balanza mide F_d = ½ρC_dA·v² y F_z = ½ρC_zA·v²
   con coeficientes del bloque de física, que un script de Node extrae TAL CUAL
   y verifica (potencia, velocidad máxima, consumo y agarre en curva incluidos).
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO=' ';
function fN(x,d=0){
  if(!isFinite(x)) return '—';
  const s=Math.abs(x).toFixed(d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');
}
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const REDUCIDO=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let toastT=null;
function showToast(html,ms=3600){ const t=el('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }


/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos
   marcas— y lo prueba: lo que se prueba es lo que corre.

   Un coche de calle deportivo en un túnel de viento con cinta rodante.
   Fuerzas aerodinámicas por coeficientes: F_d = ½ρC_dA·v², F_z = ½ρC_zA·v².
   El C_z suma tres términos: el alerón trasero (ala finita con pérdida), el
   suelo (efecto suelo que sube al bajar la altura hasta que el flujo se
   «estrangula») y la sustentación propia de la carrocería. El C_d suma el de la
   carrocería, el perfil y el INDUCIDO del alerón (k·C_L²) y el del suelo.
   Todo lo demás —potencia, velocidad máxima, consumo, agarre en curva— sale de
   esas dos fuerzas y del equilibrio de potencia. */

/* FISICA:INICIO */
const DOSPI=2*Math.PI, G=9.80665, RAD=Math.PI/180;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const suave=t=>{ t=clamp(t,0,1); return t*t*(3-2*t); };
const AIRE={ rho:1.225 };                                       // ISA, nivel del mar, 15 °C

/* ---------- 1.1 El coche ----------
   Las x se miden desde el centro de masa, positivas hacia delante. a y b: a los
   ejes delantero y trasero. hCP: altura del centro de presiones del arrastre
   (la carga que el arrastre pasa del eje delantero al trasero es Fd·hCP/L). */
const VEH={ m:1450, A:2.05, L:2.60, a:1.10, b:1.50, Cd0:0.30, hRef:0.080, kAlt:0.25,
  Crr:0.011, etaDT:0.90, etaTh:0.30, LHV:32e6, Pmax:200e3, hCP:0.45,
  mu0:1.10, nSens:0.15, Cz0:-0.05, xCuerpo:0.30, xSuelo:0.90, xAla:-2.25 };
/** Alerón: ala finita de envergadura 1,50 m y cuerda 0,40 m (S = 0,60 m², AR = 3,75).
 *  Pendiente de ala finita a = a0/(1 + a0/(π·AR·e)) por radián; la curvatura da carga a 0°
 *  (th0); a partir de thS la capa límite se despega: C_L cae y el perfil se arrastra. */
const ALA={ S:0.60, AR:3.75, e:0.85, a0:DOSPI, th0:3*RAD, thS:14*RAD, caida:0.30, anchoCL:6*RAD,
  cdp:0.012, cdStall:0.25, anchoCd:5*RAD, cuerda:0.40, envergadura:1.50, thMax:22*RAD };
/** Suelo plano con difusor: sube como (h0/h)^p al bajar hasta hc; por debajo se estrangula. */
const SUELO={ Cz0:0.35, h0:0.080, p:0.8, hc:0.050, hmin:0.040, hmax:0.120, caida:0.40, kf:0.08, A:6.0 };

const pendienteAla=()=>ALA.a0/(1+ALA.a0/(Math.PI*ALA.AR*ALA.e));
/** C_L del alerón (referido a su área) para el ángulo th [rad] respecto a la corriente. */
function clAla(th){
  const a=pendienteAla();
  if(th<=ALA.thS) return a*(th+ALA.th0);
  return a*(ALA.thS+ALA.th0)*(1-ALA.caida*suave((th-ALA.thS)/ALA.anchoCL));
}
/** Coeficiente de arrastre de PERFIL del alerón (referido a su área): sube con la pérdida. */
const cdPerfilAla=th=>ALA.cdp+ALA.cdStall*suave((th-ALA.thS)/ALA.anchoCd);
/** C_z del suelo para la altura h [m] (positivo = carga hacia abajo). */
function czSuelo(h){
  const g=x=>SUELO.Cz0*Math.pow(SUELO.h0/x,SUELO.p);
  if(h>=SUELO.hc) return g(h);
  const x=Math.max(h,SUELO.hmin);
  return g(SUELO.hc)*(1-SUELO.caida*(1-suave((x-SUELO.hmin)/(SUELO.hc-SUELO.hmin))));
}
/** Parámetros del coche. `liso`: sin alerón ni suelo (el coche del reto de predicción: sólo C_d·A). */
const parBase=()=>({ A:VEH.A, Cd0:VEH.Cd0, m:VEH.m, Pmax:VEH.Pmax, liso:false });
/** Polar aerodinámica en (th, h): C_z, C_d y sus partes. */
function aero(th,h,par){
  const p=par||parBase(), A=p.A, Cd0=p.Cd0;
  if(p.liso) return { Cz:0, Cd:Cd0, Czw:0, Czf:0, Czb:0, Cdb:Cd0, Cdi:0, Cdp:0, Cdf:0, CL:0, fracDel:VEH.b/VEH.L, kEq:0, sA:0 };
  const sA=ALA.S/A, CL=clAla(th), Czw=sA*CL, Czf=czSuelo(h), Czb=VEH.Cz0;
  const Cdb=Cd0+VEH.kAlt*(h-VEH.hRef), Cdi=sA*CL*CL/(Math.PI*ALA.AR*ALA.e), Cdp=sA*cdPerfilAla(th), Cdf=SUELO.kf*Czf*Czf;
  const Cz=Czw+Czf+Czb, Cd=Cdb+Cdi+Cdp+Cdf;
  const L=VEH.L, b=VEH.b, fracDel=Cz!==0?(Czw*(VEH.xAla+b)+Czf*(VEH.xSuelo+b)+Czb*(VEH.xCuerpo+b))/L/Cz:0.5;
  return { Cz, Cd, Czw, Czf, Czb, Cdb, Cdi, Cdp, Cdf, CL, fracDel, kEq:(Cdi+Cdf)/Math.max(1e-9,(Czw*Czw+Czf*Czf)), sA };
}
const presion=V=>0.5*AIRE.rho*V*V;                              // presión dinámica q = ½ρv² [Pa]

/* ---------- 1.2 Fuerzas, potencia, consumo ----------
   V en m/s. La carga aerodinámica también aumenta la rodadura: F_rr = C_rr·(m·g + F_z). */
function marcha(V,th,h,par){
  const p=par||parBase(), a=aero(th,h,p), q=presion(V), A=p.A;
  const Fd=q*A*a.Cd, Fz=q*A*a.Cz, Frr=VEH.Crr*(p.m*G+Fz);
  const Pair=Fd*V, Proda=Frr*V, Pw=Pair+Proda, Pcig=Pw/VEH.etaDT;
  const consumo=V>0?Pcig/VEH.etaTh/V*1e5/VEH.LHV:0;             // L/100 km a velocidad constante
  return { V,q,a,Fd,Fz,Frr,Pair,Proda,Pw,Pcig,consumo };
}
/** Velocidad máxima por equilibrio de potencia: P_max = (F_d + F_rr)·v/η (única raíz: el lado derecho crece con v). */
function vmax(th,h,par){
  const p=par||parBase(); let lo=1,hi=200;
  for(let i=0;i<80;i++){ const m=0.5*(lo+hi), r=marcha(m,th,h,p); if(r.Pcig<p.Pmax) lo=m; else hi=m; }
  return 0.5*(lo+hi);
}
/** Sólo aire: v = ∛(2·η·P/(ρ·C_d·A)). */
const vmaxAire=(P,eta,Cd,A)=>Math.cbrt(2*eta*P/(AIRE.rho*Cd*A));
/** Aire + rodadura constante (sin carga aerodinámica): v³ + p·v = q, por Cardano. */
function vmaxCardano(P,eta,Cd,A,m,Crr){
  const k=0.5*AIRE.rho*Cd*A, p=m*G*Crr/k, q=eta*P/k, D=(q/2)*(q/2)+Math.pow(p/3,3), s=Math.sqrt(D);
  return Math.cbrt(q/2+s)+Math.cbrt(q/2-s);
}

/* ---------- 1.3 Cargas por eje y agarre en curva ----------
   Cada punto de aplicación x (el suelo actúa 0,90 m por delante del centro de masa, el alerón 2,25 m por detrás) reparte su fuerza vertical entre los ejes por
   estática ((x+b)/L al delantero, (a−x)/L al trasero). El arrastre, aplicado a la
   altura hCP, traslada Fd·hCP/L del eje delantero al trasero. La fricción cae con la
   carga (sensibilidad: F_y ∝ F_z^(1−n)), de modo que la carga aerodinámica da menos
   agarre del que su valor sugiere. */
function cargasEje(V,th,h,par){
  const p=par||parBase(), r=marcha(V,th,h,p), a=r.a, q=r.q, A=p.A, L=VEH.L, aa=VEH.a, b=VEH.b;
  const dFront=q*A*(a.Czw*(VEH.xAla+b)+a.Czf*(VEH.xSuelo+b)+a.Czb*(VEH.xCuerpo+b))/L;
  const dRear =q*A*(a.Czw*(aa-VEH.xAla)+a.Czf*(aa-VEH.xSuelo)+a.Czb*(aa-VEH.xCuerpo))/L;
  const tr=r.Fd*VEH.hCP/L;
  return { Fzf:p.m*G*b/L+dFront-tr, Fzr:p.m*G*aa/L+dRear+tr, F0f:p.m*G*b/L, F0r:p.m*G*aa/L, aeroF:dFront, aeroR:dRear, tr, r };
}
/** Aceleración lateral máxima [m/s²] a velocidad V: la del eje que se satura primero. */
function agarre(V,th,h,par){
  const p=par||parBase(), c=cargasEje(V,th,h,p), n=VEH.nSens, L=VEH.L;
  const Fyf=VEH.mu0*Math.pow(c.F0f,n)*Math.pow(Math.max(c.Fzf,0),1-n), Fyr=VEH.mu0*Math.pow(c.F0r,n)*Math.pow(Math.max(c.Fzr,0),1-n);
  const ayf=Fyf/(p.m*VEH.b/L), ayr=Fyr/(p.m*VEH.a/L);
  return { ay:Math.min(ayf,ayr), ayf, ayr, limita:ayf<ayr?'delantero':'trasero', c };
}
/** Velocidad máxima en una curva de radio R: v²/R = a_y,máx(v). */
function vCurva(R,th,h,par){
  let lo=1,hi=150;
  for(let i=0;i<80;i++){ const m=0.5*(lo+hi); if(m*m/R<agarre(m,th,h,par).ay) lo=m; else hi=m; }
  return 0.5*(lo+hi);
}

/* ---------- 1.4 Visualización del flujo (didáctica, no CFD) ----------
   El campo de velocidades normalizado (u/U) del túnel se arma con piezas que SÍ
   son ecuaciones: el alerón es un vórtice de herradura de circulación Γ = ½·c·C_L·U
   (Kutta–Joukowski: la carga que mide la balanza), el suelo acelera el aire por
   Bernoulli y la estela deja un déficit de cantidad de movimiento igual al arrastre. */
/** Velocidad inducida por un segmento recto de vórtice A→B de circulación gam en el punto P (Biot–Savart, núcleo rc). */
function vorticeSegmento(P,A,B,gam,rc,out){
  const r1x=P[0]-A[0], r1y=P[1]-A[1], r1z=P[2]-A[2], r2x=P[0]-B[0], r2y=P[1]-B[1], r2z=P[2]-B[2];
  const r0x=B[0]-A[0], r0y=B[1]-A[1], r0z=B[2]-A[2];
  const cx=r1y*r2z-r1z*r2y, cy=r1z*r2x-r1x*r2z, cz=r1x*r2y-r1y*r2x;
  const n1=Math.hypot(r1x,r1y,r1z)+1e-12, n2=Math.hypot(r2x,r2y,r2z)+1e-12;
  const l0=r0x*r0x+r0y*r0y+r0z*r0z, c2=cx*cx+cy*cy+cz*cz+rc*rc*l0;
  const k=gam/(4*Math.PI)*((r0x*(r1x/n1-r2x/n2)+r0y*(r1y/n1-r2y/n2)+r0z*(r1z/n1-r2z/n2))/c2);
  out[0]+=k*cx; out[1]+=k*cy; out[2]+=k*cz; return out;
}
/** Vórtice de herradura del alerón centrado en (xw,yw,0), envergadura 2s; el tramo ligado va a lo largo de +z. */
function herradura(P,xw,yw,s,gam,rc,out,largo){
  const L=largo||40;
  vorticeSegmento(P,[xw,yw,-s],[xw,yw,s],gam,rc,out);
  vorticeSegmento(P,[xw+L,yw,-s],[xw,yw,-s],gam,rc,out);
  vorticeSegmento(P,[xw,yw,s],[xw+L,yw,s],gam,rc,out);
  return out;
}
const circulacionAla=(CL,U)=>0.5*ALA.cuerda*CL*U;                // Kutta–Joukowski: L' = ρ·U·Γ = ½ρU²·c·C_L
/** Cociente u/U bajo el suelo: Bernoulli con la succión que da la carga del suelo (C_p = −C_z,f·A/A_suelo). */
const velSuelo=Czf=>Math.sqrt(1+Czf*VEH.A/SUELO.A);
/** Déficit en el eje de la estela a radio gaussiano w: δ − δ²/2 = C_d·A/(2π·w²) (cantidad de movimiento = arrastre). */
function deficitEstela(Cd,A,w){ const k=Cd*A/(2*Math.PI*w*w); return k>=0.5?1:1-Math.sqrt(1-2*k); }

/* ---------- 1.5 El reto de diseño ----------
   Se parte de una configuración «inventora» (θ*, h*) y se piden sus cifras con un 3 % de
   margen: carga a v_ref, consumo a 120 km/h y velocidad máxima. El conjunto factible es
   pequeño; se comprueba por barrido antes de ofrecerlo. */
const BARRIDO={ th:Array.from({length:23},(_,i)=>i*RAD), h:Array.from({length:17},(_,i)=>0.040+0.005*i) };
function evaluaReto(sc,th,h){
  const r=marcha(sc.vref,th,h), c=marcha(120/3.6,th,h), vm=vmax(th,h);
  return { Fz:r.Fz, cons:c.consumo, vmax:vm, okFz:r.Fz>=sc.Fz, okCons:c.consumo<=sc.cons, okVmax:vm>=sc.vmax };
}
function elige(rnd,a){ return a[Math.floor(rnd()*a.length)]; }
function generaReto(rnd,vref){
  const v=vref||elige(rnd,[180,200,220,240])/3.6;
  for(let it=0;it<60;it++){
    const th=Math.round(7+rnd()*7)*RAD, h=Math.round((50+rnd()*30)/5)*5/1000, r=marcha(v,th,h), c=marcha(120/3.6,th,h), vm=vmax(th,h);
    const sc={ vref:v, Fz:Math.round(r.Fz*0.97/10)*10, cons:Math.round(c.consumo*1.03*100)/100, vmax:Math.round(vm*3.6*0.97)/3.6, thRef:th, hRef:h };
    let n=0; for(const t of BARRIDO.th) for(const hh of BARRIDO.h){ const e=evaluaReto(sc,t,hh); if(e.okFz&&e.okCons&&e.okVmax) n++; }
    if(n>=4&&n<=45) return Object.assign(sc,{ nFactibles:n });
  }
  return null;
}
/* FISICA:FIN */


/* ===================== 2. ESCENA, CÁMARA, LUZ ===================== */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=0.95;
renderer.outputColorSpace=THREE.SRGBColorSpace;
el('stage').appendChild(renderer.domElement); renderer.domElement.style.touchAction='none';

function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h||w;return c;}
function tex(canvas,{srgb=false,flip=true}={}){
  const t=new THREE.CanvasTexture(canvas);

function ruidoPeriodico(semilla,periodo){

/** Junta una pieza hecha de muchas mallas en una malla por material: así una rueda con 40 tacos cuesta 3 llamadas. */
function fusiona(grupo){
  grupo.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(grupo.matrixWorld).invert(), por=new Map();
  grupo.traverse(o=>{ if(!o.isMesh) return;
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone(), m=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);
    g.applyMatrix4(m);

    const k=o.material; if(!por.has(k)) por.set(k,[]); por.get(k).push(g); });

  for(const [mat,gs] of por){
    let n=0; for(const g of gs) n+=g.attributes.position.count;
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let o=0;
    for(const g of gs){ const c=g.attributes.position.count;
      pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry();

/** Una carrocería «lofteada»: anillos de superelipse que se estrechan hacia los extremos.
 *  secs: [{x, w (semianchura), y0, y1, n (exponente), tum (estrechamiento arriba, 0..1)}]. */
function lofteo(secs,seg=28){
  const pos=[],idx=[],nR=secs.length;
  for(const s of secs){
    const yc=(s.y0+s.y1)/2, hh=Math.max(1e-3,(s.y1-s.y0)/2), ex=2/(s.n||3);
    for(let k=0;k<seg;k++){
      const th=k/seg*DOSPI_, c=Math.cos(th), sn=Math.sin(th);
      const yy=yc+hh*Math.sign(sn)*Math.pow(Math.abs(sn),ex), f=(yy-s.y0)/(2*hh);
      const zz=Math.max(1e-3,s.w)*(1-(s.tum||0)*f*f)*Math.sign(c)*Math.pow(Math.abs(c),ex);
      pos.push(s.x,yy,zz);
    }
  }
  const cI=pos.length/3; pos.push(secs[0].x,(secs[0].y0+secs[0].y1)/2,0); pos.push(secs[nR-1].x,(secs[nR-1].y0+secs[nR-1].y1)/2,0);
  for(let i=0;i<nR-1;i++) for(let k=0;k<seg;k++){
    const a=i*seg+k, b=i*seg+(k+1)%seg, c2=(i+1)*seg+k, d=(i+1)*seg+(k+1)%seg;
    idx.push(a,c2,b, b,c2,d);
  }
  for(let k=0;k<seg;k++){ idx.push(cI,k,(k+1)%seg); idx.push(cI+1,(nR-1)*seg+(k+1)%seg,(nR-1)*seg+k); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx);
  // el sentido de las caras: si el volumen con signo sale negativo, se invierten
  let vol=0; for(let i=0;i<idx.length;i+=3){ const a=idx[i]*3,b=idx[i+1]*3,c3=idx[i+2]*3;
    vol+=pos[a]*(pos[b+1]*pos[c3+2]-pos[b+2]*pos[c3+1])-pos[a+1]*(pos[b]*pos[c3+2]-pos[b+2]*pos[c3])+pos[a+2]*(pos[b]*pos[c3+1]-pos[b+1]*pos[c3]); }
  if(vol<0) for(let i=0;i<idx.length;i+=3){ const t=idx[i+1]; idx[i+1]=idx[i+2]; idx[i+2]=t; }
  g.setIndex(idx); g.computeVertexNormals(); g.computeBoundingSphere();
  return g;
}

      if(!FL.liso&&x>FL.xw-1&&x<FL.xw+1&&y>FL.yw-0.8&&y<FL.yw+0.8){ const da=sdfAla(x,y,z); if(da<0.01){ gradSdf(sdfAla,x,y,z,da,_n); x+=_n[0]*(0.012-da); y+=_n[1]*(0.012-da); z+=_n[2]*(0.012-da); } }
      if(y<0.012) y=0.012;
      if(x>X_SALIDA||s<0.04||!isFinite(x+y+z)){ reaparece(i,false); continue; }
      FLUJO.px[i*3]=x; FLUJO.px[i*3+1]=y; FLUJO.px[i*3+2]=z;
      // la traza: cada 5,5 cm de recorrido se corre la cola
      const ddx=x-FLUJO.lp[i*3], ddy=y-FLUJO.lp[i*3+1], ddz=z-FLUJO.lp[i*3+2];
      if(ddx*ddx+ddy*ddy+ddz*ddz>0.0030){
        const b=i*K*3;
        FLUJO.pos.copyWithin(b+3,b,b+(K-1)*3); FLUJO.raw.copyWithin(b+3,b,b+(K-1)*3);
        FLUJO.lp[i*3]=x; FLUJO.lp[i*3+1]=y; FLUJO.lp[i*3+2]=z;
      }
      const b=i*K*3; FLUJO.pos[b]=x; FLUJO.pos[b+1]=y; FLUJO.pos[b+2]=z;
      colVel(s,_c3,FLUJO.pc[i*3]); FLUJO.raw[b]=_c3[0]; FLUJO.raw[b+1]=_c3[1]; FLUJO.raw[b+2]=_c3[2];
    }
  }
  const N2=N;
  // la cola se desvanece: el punto k de cada traza lleva (1 − k/K)^1,7 de su color de origen
  const c=FLUJO.col, r=FLUJO.raw;
  for(let i=0;i<N2;i++){ const b=i*K*3; for(let k=0;k<K;k++){ const o=b+k*3, f=FADE[k]; c[o]=r[o]*f; c[o+1]=r[o+1]*f; c[o+2]=r[o+2]*f; } }
  GEO_FLUJO.attributes.position.needsUpdate=true; GEO_FLUJO.attributes.color.needsUpdate=true;
}
const FADE=new Float32Array(K); for(let k=0;k<K;k++) FADE[k]=Math.pow(1-k/K,1.5);

/* ===================== 18. SONIDO (sintetizado) =====================
   El rumor del viento: ruido filtrado cuyo volumen y tono suben con la velocidad del túnel. */
const sonido=(function(){
  let ctx=null,on=true,master=null,gain=null,filt=null,src=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      const buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate), d=buf.getChannelData(0); let ult=0; for(let i=0;i<d.length;i++){ ult=(ult+0.02*(Math.random()*2-1))/1.02; d[i]=ult*3.5; }
      src=ctx.createBufferSource(); src.buffer=buf; src.loop=true; filt=ctx.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=500; filt.Q.value=0.7;
      gain=ctx.createGain(); gain.gain.value=0; src.connect(filt); filt.connect(gain); gain.connect(master); src.start();
    }catch(e){ ctx=null; } }
  function actualiza(v){ if(!ctx) return; const t=ctx.currentTime, u=Math.max(0,Math.min(1,v)); filt.frequency.setTargetAtTime(300+900*u,t,0.1); gain.gain.setTargetAtTime(on?0.02+0.10*u*u:0,t,0.1); }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); }
  return {init,actualiza,
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    clac:()=>tono(320,0.06,0.04,'triangle'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; },
    get vol(){ return gain?gain.gain.value:0; }, get freq(){ return filt?filt.frequency.value:0; }};
})();
const soundBtn=el('soundBtn');
soundBtn.onclick=()=>{ sonido.init(); const on=sonido.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };
window.addEventListener('keydown',()=>sonido.init(),{once:true});


/* ===================== 9. EL ESTADO Y EL RELOJ =====================
   EST son los mandos (lo que pide el alumno); VIS, lo que se ve ahora: el alerón gira y el coche sube o baja con
   suavidad hacia lo pedido. TODO —escena, flechas, flujo, cifras y gráficas del dock— sale de ST, que se calcula
   UNA vez por cuadro con los valores visibles: mover un mando cambia las tres cosas a la vez. */
const EST={modo:'marcha',V:160,th:10,h:70,vel:0.1,pausa:REDUCIDO,autoRunning:false,vista:'tunel',rot:false,barrido:false};
const VIS={V:160,th:10*RAD,h:0.070};
const SIM={t:0,tBarrido:0,spin:0,reinicios:0};
const kmh=v=>v*3.6, RCURVA=250;
let ST=null, STclave='';
/** Lo que se mide ahora: en «En marcha», lo que digan los mandos; en el laboratorio guiado, lo que pida el paso. */
function paramsActuales(){
  if(EST.modo==='guia'){ const p=guiaParams(); if(p) return p; }
  return { par:parBase(), V:EST.V, th:EST.th, h:EST.h, liso:false, bloquea:false };
}
function calcula(){
  const p=paramsActuales(), par=p.par;
  const key=[p.V.toFixed(2),VIS.th.toFixed(5),VIS.h.toFixed(5),par.A,par.Cd0,par.Pmax,par.liso?1:0].join('|');
  if(key===STclave&&ST) return ST;
  STclave=key; const V=p.V/3.6, th=VIS.th, h=VIS.h;
  const r=marcha(V,th,h,par), c=cargasEje(V,th,h,par), ag=agarre(V,th,h,par), vm=vmax(th,h,par), vc=vCurva(RCURVA,th,h,par);
  ST={p,par,V,th,h,r,c,ag,vm,vc,liso:!!par.liso};
  return ST;
}
function pasaVis(dt){
  const p=paramsActuales(), k=REDUCIDO?1:1-Math.exp(-dt/0.14);
  const thT=p.th*RAD, hT=clamp(p.h/1000,SUELO.hmin,SUELO.hmax);
  VIS.th+=(thT-VIS.th)*k; VIS.h+=(hT-VIS.h)*k;
  if(Math.abs(thT-VIS.th)<1e-5) VIS.th=thT; if(Math.abs(hT-VIS.h)<1e-6) VIS.h=hT;
}
const clamp01=x=>Math.max(0,Math.min(1,x));
const KF=0.0009;                                                          // 1 m de flecha = 1 111 N
/** Pone el modelo en la escena: alerón, altura, flechas, mancha de succión, flujo, cinta y ruedas. */
function aplicaEscena(dtS,dtR){
  pasaVis(dtR);
  if(EST.barrido&&!EST.autoRunning&&!EST.pausa){ SIM.tBarrido+=dtR; const f=(SIM.tBarrido%20)/20; EST.V=Math.round(40+240*(f<0.5?f*2:2-f*2)); if(typeof sincronizaV==='function') sincronizaV(); }
  const S=calcula(), a=S.r.a;
  SIM.t+=dtS;
  // coche: altura al suelo y ángulo del alerón
  ASAS.caja.position.y=S.h-0.27; ASAS.giro.rotation.z=-S.th; ASAS.montaje.visible=!S.liso;
  SIM.spin+=S.V*dtS/LRUEDA; for(const sp of ASAS.spins) sp.rotation.z=-SIM.spin;
  // la cinta avanza con el viento (1 m de cinta = 1 baldosa)
  T_BANDA.offset.x=((T_BANDA.offset.x-S.V*dtS)%1+1)%1;
  // campo de flujo
  FL.h=S.h; FL.th=S.th; FL.Czf=a.Czf; FL.Cd=a.Cd; FL.CL=a.CL; FL.gam=S.liso?0:circulacionAla(a.CL,1); FL.xw=2.0; FL.yw=S.h+0.92; FL.liso=S.liso;
  FL.stall=S.liso||enDiagnostico()?0:suave((S.th-ALA.thS)/(4*RAD)); FL.choke=S.liso||enDiagnostico()?0:suave((SUELO.hc-S.h)/(SUELO.hc-SUELO.hmin));
  if(dtS>0) avanzaFlujo(Math.min(dtS,0.08),S.V,true);
  // la balanza: arrastre hacia atrás del coche (viento a +X) y carga repartida en los dos ejes
  const Lfd=Math.min(3.2,S.r.Fd*KF), LfF=Math.min(3.2,Math.max(0,S.c.aeroF)*KF), LfR=Math.min(3.2,Math.max(0,S.c.aeroR)*KF);
  FLECHAS.fd.gr.position.set(2.34,0.62,0); FLECHAS.fd.set(Lfd);
  const xF=-(VEH.a)-0.25, xR=-(-VEH.b)-0.25;                              // ejes en el mundo
  FLECHAS.fzF.gr.position.set(xF,0.64+LfF,0); FLECHAS.fzF.set(LfF);
  FLECHAS.fzR.gr.position.set(xR,0.70+LfR,0); FLECHAS.fzR.set(LfR);
  // succión bajo el coche
  const m=SUCCION.material; m.opacity=S.liso?0:clamp01(a.Czf/0.55)*0.5*(1-0.55*FL.choke);
  m.color.setRGB(0.22+0.78*FL.choke,0.84-0.28*FL.choke,1.0-0.82*FL.choke);
}

/* ===================== 11. CÁMARAS ===================== */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
/** Desplaza el centro de la proyección al centro del hueco libre: el coche queda en medio de lo que se ve, sin mover la cámara. */
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}
/** Cada vista: dirección desde el objetivo, objetivo, campo de visión y la caja que debe verse entera. */
const VISTAS={
  tunel:  {dir:V3(-0.72,0.40,0.80),t:V3(0.1,0.62,0),fov:34,c:V3(0.0,0.72,0),m:V3(2.45,0.75,0.95)},
  lateral:{dir:V3(0.10,0.07,1.0),  t:V3(0.1,0.62,0),fov:24,c:V3(0.0,0.72,0),m:V3(2.45,0.75,0.95)},
  aleron: {dir:V3(0.95,0.36,0.62), t:V3(1.9,0.86,0),fov:34,c:V3(1.95,0.92,0),m:V3(0.95,0.55,1.0)},
  suelo:  {dir:V3(-0.55,0.10,0.82),t:V3(0.0,0.30,0),fov:34,c:V3(0.0,0.35,0),m:V3(2.45,0.42,1.0)},
};
const _cam=new THREE.PerspectiveCamera(34,1,0.1,400);
/** Distancia a la que la caja de la vista llena el 64 % del alto (o el 90 % del ancho) del hueco libre. */
function encuadre(v){
  const V=VISTAS[v]||VISTAS.tunel, H=huecoLibre(), hh=Math.max(120,H.y1-H.y0), ww=Math.max(160,H.x1-H.x0), dir=V.dir.clone().normalize();
  _cam.fov=V.fov; _cam.aspect=innerWidth/innerHeight; _cam.updateProjectionMatrix();
  const esq=[]; for(const sx of [-1,1]) for(const sy of [-1,1]) for(const sz of [-1,1]) esq.push(V3(V.c.x+sx*V.m.x,V.c.y+sy*V.m.y,V.c.z+sz*V.m.z));
  let lo=1.2, hi=70;
  for(let it=0;it<24;it++){
    const d=(lo+hi)/2; _cam.position.copy(V.t).addScaledVector(dir,d); _cam.lookAt(V.t); _cam.updateMatrixWorld(true); _cam.matrixWorldInverse.copy(_cam.matrixWorld).invert();
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; for(const e of esq){ const p=e.clone().project(_cam); x0=Math.min(x0,p.x); x1=Math.max(x1,p.x); y0=Math.min(y0,p.y); y1=Math.max(y1,p.y); }
    const pw=(x1-x0)/2*innerWidth, ph=(y1-y0)/2*innerHeight, f=Math.max(ph/hh/0.60,pw/ww/0.84);
    if(f>1) lo=d; else hi=d;
  }
  const d=(lo+hi)/2; return {pos:V.t.clone().addScaledVector(dir,d),target:V.t.clone(),fov:V.fov};
}
const CAMT={on:false,u:0,dur:1,o0:V3(),o1:V3(),t0:V3(),t1:V3(),f0:34,f1:34};
function ponVista(v,dur){
  EST.vista=v; const d=dur===undefined?(REDUCIDO?0.001:1.1):dur, e=encuadre(v);
  Object.assign(CAMT,{on:true,u:0,dur:d,o0:camera.position.clone(),o1:e.pos,t0:controls.target.clone(),t1:e.target,f0:camera.fov,f1:e.fov});
  if(typeof pintaBarras==='function') pintaBarras();
}
function pasaCam(dt){
  if(CAMT.on){
    CAMT.u=Math.min(1,CAMT.u+dt/Math.max(CAMT.dur,1e-3)); const e=ease(CAMT.u);
    camera.position.lerpVectors(CAMT.o0,CAMT.o1,e); controls.target.lerpVectors(CAMT.t0,CAMT.t1,e);
    camera.fov=CAMT.f0+(CAMT.f1-CAMT.f0)*e; camera.updateProjectionMatrix();
    if(CAMT.u>=1) CAMT.on=false;
  }
}
controls.addEventListener('start',()=>{ CAMT.on=false; });

/* ===================== 12. EL HUD (izquierda) ===================== */

    <div class="cg"><div class="cl"><div>Ángulo del alerón</div><b id="vT">${fN(EST.th,0)}°</b></div><input type="range" id="rT" min="0" max="22" step="0.5" value="${EST.th}" aria-label="Ángulo del alerón en grados">
      <div class="marcas abs"><span style="left:0;transform:none">0°</span><span style="left:100%;transform:translateX(-100%)">22°</span></div></div>
    <div class="cg"><div class="cl"><div>Altura al suelo</div><b id="vH">${fN(EST.h)} mm</b></div><input type="range" id="rH" min="40" max="120" step="1" value="${EST.h}" aria-label="Altura de la carrocería al suelo en milímetros">
      <div class="marcas abs"><span style="left:0;transform:none">40</span><span style="left:100%;transform:translateX(-100%)">120</span></div></div>

  } else h+=htmlGuia();
  h+=`<div class="hdet"><details id="dEc"><summary>Ecuaciones</summary><div class="cuerpo">
    <div class="fl">Fuerzas por coeficientes (presión dinámica q = ½ρv²) y la potencia que gasta el aire:</div>
    <div class="formula">F<sub>d</sub> = ½ρ·C<sub>d</sub>·A·v²<br>F<sub>z</sub> = ½ρ·C<sub>z</sub>·A·v²<br>P = F<sub>d</sub>·v  (∝ v³)</div>
    <div class="fl"><b>Alerón</b> (ala finita): C<sub>L</sub> = a·(θ + θ<sub>0</sub>), con a = a<sub>0</sub>/(1 + a<sub>0</sub>/(π·AR·e)); pasada la pérdida, C<sub>L</sub> cae y el perfil se arrastra. Su arrastre inducido es C<sub>d,i</sub> = (S/A)·C<sub>L</sub>²/(π·AR·e) = k·C<sub>z</sub>². <b>Suelo</b>: C<sub>z,f</sub> ∝ (h<sub>0</sub>/h)<sup>p</sup> hasta que el flujo se estrangula.</div>
    <div class="formula">C<sub>d</sub> = C<sub>d0</sub> + k·C<sub>z</sub>²  (polar)</div>
    <div class="fl"><b>Velocidad máxima</b>: η·P<sub>max</sub> = (F<sub>d</sub> + C<sub>rr</sub>(m·g + F<sub>z</sub>))·v. Sin rodadura ni carga: v = ∛(2ηP/(ρ·C<sub>d</sub>·A)). <b>Consumo</b> a v constante: L/100 km = (F<sub>d</sub> + F<sub>rr</sub>)·10⁵/(η<sub>dt</sub>·η<sub>th</sub>·PCI). <b>Agarre</b>: F<sub>y</sub> ∝ F<sub>z</sub><sup>1−n</sup>, así que la carga da menos agarre del que parece.</div>

  </div></details>
  <details id="dSim"><summary>Simplificaciones</summary><div class="cuerpo"><ul class="no">
    <li>El flujo del 3D es una <b>visualización didáctica, no CFD</b>: el aire se desliza por el cuerpo y el alerón es un vórtice de herradura. Los coeficientes salen de correlaciones simples (ala finita, ley de potencia del suelo), no de un túnel real.</li>

  H.innerHTML=h; H.classList.toggle('guia',EST.modo!=='marcha'); enlazaHUD(); ajustaHoja();

const FUENTE="'Outfit',system-ui,sans-serif";

function abre(L){ const r=L.box.getBoundingClientRect(), dpr=Math.min(3,window.devicePixelRatio||1);
  const w=Math.max(20,Math.round(r.width)), h=Math.max(20,Math.round(r.height));

function txt(x,t,px,py,col,size,align,peso){ x.fillStyle=col; x.font=(peso||'600')+' '+(size||11)+'px '+FUENTE; x.textAlign=align||'left'; x.textBaseline='alphabetic'; x.fillText(t,px,py); }
function raya(x,x1,y1,x2,y2,col,w,dash){ x.strokeStyle=col; x.lineWidth=w||1; x.setLineDash(dash||[]); x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke(); x.setLineDash([]); }

const LTR=lienzo('gTr'), LFR=lienzo('gFr'), LFU=lienzo('gFu'), LSP=lienzo('gSp');
const C_AIRE='#37D6FF', C_ROD='#FFB347', C_TOT='#FFFFFF', C_FD='#FF7A2E', C_FZ='#37D6FF', C_PER='#FF4D5A', C_GRIS='#8FAEC4';

/** Curvas que dependen de (θ, h, coche) pero no de la velocidad: se recalculan sólo si cambian. */
let CURV=null, CURVk='';
function curvas(){
  const S=ST, par=S.par, k=[VIS.th.toFixed(4),VIS.h.toFixed(4),par.A,par.Cd0,par.Pmax,par.liso?1:0].join('|');
  if(CURV&&k===CURVk) return CURV; CURVk=k;
  const VM=300/3.6, n=48, pot=[], fu=[], ag=[], sin=Object.assign({},par,{liso:true});
  for(let i=0;i<=n;i++){ const v=VM*i/n, r=marcha(v,S.th,S.h,par); pot.push([v,r.Pair,r.Proda,r.Pw]); fu.push([v,r.Fd,r.Fz]);
    const a=agarre(Math.max(v,0.1),S.th,S.h,par), b=agarre(Math.max(v,0.1),0,S.h,sin); ag.push([v,a.ay/G,b.ay/G,v*v/RCURVA/G]); }
  const pol=[]; for(let t=0;t<=22.001;t+=1){ const a=aero(t*RAD,S.h,par); pol.push([a.Cd,a.Cz,t]); }
  const polh=[]; for(let hh=0.12;hh>=0.0399;hh-=0.005){ const a=aero(S.th,hh,par); polh.push([a.Cd,a.Cz,hh]); }
  CURV={pot,fu,ag,pol,polh}; return CURV;
}
/* Rangos fijos de la polar: se barre toda la rejilla una vez. */
const RANGO_POLAR=(function(){ let c0=9,c1=-9,z0=9,z1=-9; for(const t of BARRIDO.th) for(const hh of BARRIDO.h){ const a=aero(t,hh); c0=Math.min(c0,a.Cd); c1=Math.max(c1,a.Cd); z0=Math.min(z0,a.Cz); z1=Math.max(z1,a.Cz); }
  return {c0:Math.floor(c0*50)/50,c1:Math.ceil(c1*50)/50,z0:Math.floor(z0*10)/10-0.05,z1:Math.ceil(z1*10)/10}; })();

const RAY=new THREE.Raycaster(), PUN=new THREE.Vector2();
function hitBajo(cx,cy){
  const r=renderer.domElement.getBoundingClientRect(); PUN.set((cx-r.left)/r.width*2-1,-(cy-r.top)/r.height*2+1); RAY.setFromCamera(PUN,camera);
  const lista=[COCHE,TUNEL,...Object.values(FLECHAS).map(f=>f.gr)].filter(Boolean);
  const hits=RAY.intersectObjects(lista,true);

  return null;
}
function claveDe(h){ if(!h) return null; for(let o=h.object;o;o=o.parent){ if(o.userData&&o.userData.pieza) return o.userData.pieza; } return null; }

/* ===================== 16. DISPOSICIÓN: ANCHO, ESTRECHO, MÓVIL =====================
   Si no caben guía, escena y dock lado a lado (el marco de la plataforma, una tableta), la escena va arriba
   y guía e instrumentos comparten una hoja con pestañas abajo. */
function disposicion(){
  const W=innerWidth, b=document.body;
  const estrecho=W<1080, movil=W<640;
  b.classList.toggle('estrecho',estrecho); b.classList.toggle('movil',movil); b.classList.toggle('ancho',estrecho&&!movil);
  if(estrecho){ if(!b.classList.contains('t-hud')&&!b.classList.contains('t-panel')) b.classList.add('t-hud'); ajustaHoja(); }
  el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('on',b.classList.contains('t-'+t.dataset.tab)));
}
function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.47:0.43),240,450));
  let hh=base; const hud=el('hud');
  if(movil&&b.classList.contains('t-panel')) hh=Math.round(clamp(H*0.6,240,560));
  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;
    hh=Math.round(clamp(pide,240,Math.max(base,H*(movil?0.62:0.56)))); }
  const ant=parseFloat(b.style.getPropertyValue('--hojaH'))||0;
  if(Math.abs(ant-hh)>1){ b.style.setProperty('--hojaH',hh+'px'); colocaBarras(); ponVista(EST.vista,0.001); centraEnHueco(); }
}
el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.onclick=()=>{ const b=document.body; b.classList.remove('t-hud','t-panel'); b.classList.add('t-'+t.dataset.tab); disposicion(); ponVista(EST.vista,0.001); centraEnHueco(); });

/* ===================== 17. EL LABORATORIO GUIADO =====================
   Tres fases: 1 · Predice (la velocidad máxima por equilibrio de potencia, con la raíz cúbica), 2 · Decide
   (ángulo de alerón y altura al suelo para cumplir carga, consumo y velocidad máxima A LA VEZ) y 3 · Diagnostica
   (¿configuración sana, alerón en pérdida o suelo estrangulado?, sólo con cómo responde la carga) y cierra con un
   quiz de tres preguntas. Tres o cuatro intentos fallidos cambian el escenario (no se aprueba por eliminación). */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETO={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'predice',iniciado:false,dxOk:false,r1:null,r2:null,preparando:false,dx:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0,orden:null,huella:[],dth:0,dh:0};

/* ---------- Fase 1 · Predice ---------- */
const POT1=[90,110,130,150,180,220], CD1=[0.26,0.30,0.34,0.38,0.42,0.50], A1=[1.9,2.1,2.3,2.6,3.0];
const ETA1=VEH.etaDT;
function sorteaCaso1(){
  let c; do{ c={P:pickOne(POT1),Cd:pickOne(CD1),A:pickOne(A1)}; c.ans=3.6*vmaxAire(c.P*1000,ETA1,c.Cd,c.A); }while(c.ans<110||c.ans>330||(GUIA.r1&&GUIA.r1.P===c.P&&GUIA.r1.Cd===c.Cd&&GUIA.r1.A===c.A));
  GUIA.r1=c;
}
function checkPredice(){
  const raw=String((el('ansV')||{}).value||'').trim().replace(/\s| /g,'').replace(',','.'), v=parseFloat(raw), r=GUIA.r1, ok=r.ans;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe la velocidad máxima en km/h (con coma o punto decimal).'); return; }
  RETO.intentos++;
  if(Math.abs(v-ok)<=Math.max(3,0.03*ok)){
    RETO.fallos1=0; sonido.bien();
    feedback('good','¡Correcto! ✓',`En el máximo, la potencia que llega a la rueda es la que gasta el aire: η·P = ½·ρ·C<sub>d</sub>·A·v³, así que v = ∛(2ηP/(ρ·C<sub>d</sub>·A)) = ∛(2 × ${fN(ETA1,2)} × ${fN(r.P*1000)} / (${fN(AIRE.rho,3)} × ${fN(r.Cd,2)} × ${fN(r.A,1)})) = ${fN(ok/3.6,1)} m/s = <b>${fN(ok,0)} km/h</b>. Duplicar la potencia sólo sube la velocidad un 26 %: manda la raíz cúbica.`,true);
    paso('decide'); prepararDecide();
  } else {
    RETO.fallos1++; sonido.mal();
    const d=v>ok?'alto':'bajo', ms=Math.abs(v-ok/3.6)<Math.max(3,0.03*ok/3.6);
    if(RETO.fallos1>=3){ RETO.fallos1=0; RETO.resiembras++; sorteaCaso1(); GUIA.r1.nuevo=true;
      feedback('bad','Tres intentos fallidos','Cambia el coche: vuelve a plantear el equilibrio entre la potencia de la rueda y la del aire (F·v).'); pintaHUD(); pintaDockFijo();
    } else {
      feedback('bad','Revisa el cálculo',`Tu resultado (${fN(v,v%1?1:0)}) está ${d}.`+(ms?' ¿Lo diste en m/s? Aquí se pide en km/h.':' Recuerda que la fuerza del aire crece como v², así que su potencia crece como v³; la potencia de la rueda es η·P.')+` (intentos fallidos: ${RETO.fallos1}/3)`);
      const t=el('d_try'); if(t) t.textContent=RETO.fallos1;
    }
  }
}

/* ---------- Fase 2 · Decide ---------- */
function prepararDecide(){
  GUIA.preparando=true; GUIA.r2=null;
  setTimeout(()=>{
    let sc=null; for(let i=0;i<8&&!sc;i++) sc=generaReto(Math.random);
    if(!sc){ let x=7; sc=generaReto(()=>(x=x*48271%2147483647)/2147483647); }
    GUIA.r2={sc,th:8,h:100,intentos:0,res:null};
    GUIA.preparando=false; pintaHUD(); pintaDockFijo();
  },20);
}
function validaDecide(){
  const r=GUIA.r2; if(!r||GUIA.preparando) return;
  const e=evaluaReto(r.sc,r.th*RAD,r.h/1000); r.res=e; RETO.intentos++; r.intentos++;
  const pasa=e.okFz&&e.okCons&&e.okVmax;
  if(pasa){
    RETO.fallos2=0; sonido.bien();
    feedback('good','¡Cumple las tres! ✓',`Alerón a <b>${fN(r.th,1)}°</b> y <b>${fN(r.h)} mm</b> al suelo: ${fN(e.Fz,0)} N de carga a ${fN(r.sc.vref*3.6,0)} km/h, ${fN(e.cons,2)} L/100 km a 120 km/h y ${fN(e.vmax*3.6,0)} km/h de máxima. Más ángulo da más carga sólo hasta la pérdida; bajar el coche ayuda hasta que el flujo se estrangula; y cada newton de carga se paga con arrastre, rodadura y velocidad máxima.`,true);
    paso('diag'); iniciaDiag();
  } else {
    RETO.fallos2++; sonido.mal();
    const f=[]; if(!e.okFz) f.push('falta carga aerodinámica'); if(!e.okCons) f.push('el consumo a 120 km/h se pasa'); if(!e.okVmax) f.push('la velocidad máxima se queda corta');
    let msg='Todavía no: '+f.join(', ')+'.';
    if(!e.okFz&&e.okCons&&e.okVmax) msg+=' Hay margen de consumo y de velocidad: busca más carga sin pasarte.';
    else if(e.okFz&&(!e.okCons||!e.okVmax)) msg+=' La carga sobra: cuesta arrastre. Prueba a conseguirla con otra combinación de ángulo y altura.';
    if(RETO.fallos2>=4){ RETO.fallos2=0; RETO.resiembras++; feedback('bad','Cuatro intentos sin lograrlo',msg+' Cambia el escenario: los objetivos son otros.',true); prepararDecide(); }
    else { feedback('bad','Todavía no',msg+` (intentos: ${RETO.fallos2}/4)`,true); pintaHUD(); }
  }
}
function guiaTick(){}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const TIPOS_DX=[
  {k:'sano', t:'Configuración sana', th:[8,9,10], h:[68,72,76]},
  {k:'stall',t:'Alerón en pérdida',   th:[16,17,18], h:[66,72,78]},
  {k:'choke',t:'Suelo estrangulado',  th:[8,9,10], h:[43,44,45]},
];
function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.k; let t; do{ t=pickOne(TIPOS_DX); }while(t.k===p);
  GUIA.dx={k:t.k,th0:pickOne(t.th),h0:pickOne(t.h)}; GUIA.dxOk=false; GUIA.dth=0; GUIA.dh=0; GUIA.huella=[]; GUIA.orden=barajar(['sano','stall','choke']);
  pintaHUD(); pintaDockFijo();
}
function huella(){ if(!ST||!enDiagnostico()) return; const a=ST.r.a, u=GUIA.huella, ult=u[u.length-1]; if(!ult||Math.hypot(ult[0]-a.Cd,ult[1]-a.Cz)>0.004){ u.push([a.Cd,a.Cz]); if(u.length>40) u.shift(); } }
function diagnostica(k){
  if(!GUIA.dx||GUIA.dxOk) return; RETO.intentos++;
  if(k===GUIA.dx.k){
    GUIA.dxOk=true; RETO.fallos3=0; sonido.bien();
    feedback('good','Diagnóstico correcto ✓',explicaDx(GUIA.dx.k)+` Era alerón a ${fN(GUIA.dx.th0,0)}° y ${fN(GUIA.dx.h0)} mm al suelo.`,true);
    paso('quiz'); iniciaQuiz();
  } else {
    RETO.fallos3++; sonido.mal();
    if(RETO.fallos3>=3){ RETO.fallos3=0; RETO.resiembras++; feedback('bad','Tres intentos fallidos','Es otro coche: mueve los dos deslizadores y mira cómo responde la carga de cada uno.',true); iniciaDiag(); }
    else { feedback('bad','No es ese',noEs(k)+` (intentos fallidos: ${RETO.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(k){
  if(k==='stall') return 'Alerón en pérdida: pasado el ángulo crítico la capa límite se despega, así que MÁS ángulo da MENOS carga y más arrastre. Bajar el ángulo devuelve la carga.';
  if(k==='choke') return 'Suelo estrangulado: muy cerca del suelo el flujo se bloquea bajo el fondo y la carga cae. SUBIR el coche devuelve la carga; bajarlo la pierde.';
  return 'Configuración sana: más ángulo (sin llegar a la pérdida) y menos altura (sin estrangular) suman carga; ningún mando está al otro lado de su máximo.';
}
function noEs(k){
  if(k==='stall') return 'Si el alerón estuviera en pérdida, SUBIRLE el ángulo bajaría la carga. Pruébalo en el deslizador.';
  if(k==='choke') return 'Si el suelo estuviera estrangulado, BAJAR el coche reduciría la carga. Pruébalo en el deslizador.';
  return 'En una configuración sana, subir el ángulo y bajar el coche aumentan la carga. Si alguno la baja, ese mando está pasado de su máximo.';
}
const QUIZ=[
  {q:'La velocidad del túnel se duplica. ¿Cuánto crece la potencia que el coche gasta sólo en vencer el aire?',ok:'Se multiplica por 8',mal:['Se duplica','Se multiplica por 4','Se multiplica por 16']},
  {q:'Subes el alerón de 12° a 20° y la carga BAJA mientras el arrastre SUBE. ¿Qué ha pasado?',ok:'El alerón ha entrado en pérdida: el flujo se despega',mal:['El suelo se ha estrangulado','El aire es más denso que antes','La cinta rodante frena el coche']},
  {q:'Con el doble de carga aerodinámica, ¿por qué el coche NO dobla su agarre en curva?',ok:'Porque el neumático pierde coeficiente de fricción al cargarse más',mal:['Porque el aire frena la rueda','Porque la carga sólo actúa en el eje delantero','Porque la carga desaparece al girar']},
];
function iniciaQuiz(){ GUIA.quizN=0; cargaPregunta(); }
function cargaPregunta(){ const Q=QUIZ[GUIA.quizN], opts=barajar([Q.ok,...Q.mal]); GUIA.quiz={q:Q.q,opts,ok:opts.indexOf(Q.ok)}; GUIA.quizResp=-1; GUIA.quizCorrecta=GUIA.quiz.ok; pintaHUD(); }
function respondeQuiz(i){
  if(GUIA.quizResp>=0) return; GUIA.quizResp=i; const ac=i===GUIA.quiz.ok; if(ac) RETO.quizAcierto++;
  if(ac) sonido.bien(); else sonido.mal();
  const ult=GUIA.quizN>=QUIZ.length-1;
  feedback(ac?'good':'bad',ac?'Correcto ✓':'No es esa',(ac?'':'La respuesta era: <b>'+GUIA.quiz.opts[GUIA.quiz.ok]+'</b>. ')+(ult?'Terminaste el laboratorio.':'Sigue con la siguiente.'),true);
  pintaHUD();
  if(ult){ RETO.hecho=true; paso('completo'); }
}
function siguientePregunta(){ if(GUIA.quizN<QUIZ.length-1){ GUIA.quizN++; cargaPregunta(); } }

/* ---------- el enrutador de acciones ---------- */
function paso(p){ GUIA.paso=p; GUIA.phase=({predice:0,decide:1,diag:2,quiz:2,completo:2})[p]; if(EST.modo==='guia') pintaHUD(); }
function handleAction(act,btn){
  switch(act){
    case 'check-v': checkPredice(); break;
    case 'hint-v':
      if(RETO.pistas===0){ RETO.pistas=1; feedback('good','Pista 1 de 2','En la velocidad máxima, toda la potencia que llega a la rueda (η·P) se gasta en empujar el aire: P = F<sub>d</sub>·v.'); }
      else if(RETO.pistas===1){ RETO.pistas=2; feedback('good','Pista 2 de 2','Con F<sub>d</sub> = ½·ρ·C<sub>d</sub>·A·v², queda η·P = ½·ρ·C<sub>d</sub>·A·v³: despeja v con una raíz cúbica.'); }
      else feedback('good','Sin más pistas','Ya usaste las 2 pistas de este reto: razona con lo que tienes.');
      break;
    case 'validar': validaDecide(); break;
    case 'dx-sano': diagnostica('sano'); break;
    case 'dx-stall': diagnostica('stall'); break;
    case 'dx-choke': diagnostica('choke'); break;
    case 'quiz-0': respondeQuiz(0); break; case 'quiz-1': respondeQuiz(1); break; case 'quiz-2': respondeQuiz(2); break; case 'quiz-3': respondeQuiz(3); break;
    case 'quiz-sig': siguientePregunta(); break;
    case 'restart': location.reload(); break;
  }
}

      return {no:'Fase 3 · Diagnóstico',head:'¿Qué le pasa?',title:'Averigua qué mando está pasado',
      teach:`No conoces el ángulo ni la altura de este coche. Muévelos un poco y mira cómo responde la <b>carga F<sub>z</sub></b>.<div class="task">¿Cuál es su estado? ${tri('d_try3',RETO.fallos3,3)}</div>`,
      acts:`<div class="cg"><div class="cl"><div>Ángulo (cambio)</div><b id="vdT">${GUIA.dth>0?'+':''}${fN(GUIA.dth,1)}°</b></div><input type="range" id="rdT" min="-3" max="3" step="0.5" value="${GUIA.dth}" aria-label="Cambio del ángulo del alerón"></div>
        <div class="cg"><div class="cl"><div>Altura (cambio)</div><b id="vdH">${GUIA.dh>0?'+':''}${fN(GUIA.dh)} mm</b></div><input type="range" id="rdH" min="-15" max="15" step="1" value="${GUIA.dh}" aria-label="Cambio de la altura al suelo"></div>`
        +ord.map(k=>`<button class="b" data-act="dx-${k}">${N[k]}</button>`).join('')}; }
    case 'quiz': { const Q=GUIA.quiz; if(!Q) return {no:'',head:'',title:'',teach:'',acts:''}; const ya=GUIA.quizResp>=0;
      return {no:'Cierre · Pregunta '+(GUIA.quizN+1)+' de '+QUIZ.length,head:'Quiz',title:Q.q,teach:'',
      acts:Q.opts.map((o,i)=>`<button class="b ${ya?(i===Q.ok?'good':(i===GUIA.quizResp?'bad':'')):''}" data-act="quiz-${i}" ${ya?'disabled':''}>${o}</button>`).join('')+(ya&&GUIA.quizN<QUIZ.length-1?'<button class="b primary" data-act="quiz-sig">Siguiente →</button>':'')}; }
    case 'completo': return {no:'Laboratorio completado',head:'✓',title:'Predijiste, diseñaste y diagnosticaste',
      teach:`Acertaste ${RETO.quizAcierto} de ${QUIZ.length} en el quiz. Vuelve a <b>En marcha</b> y haz un barrido de velocidad: el aire cobra v² en fuerza y v³ en potencia, y la carga cuesta arrastre.`,
      acts:`<button class="b primary" data-act="restart">↺ Reiniciar laboratorio</button>`};
  }
  return {no:'',head:'',title:'',teach:'',acts:''};
}
function htmlGuia(){
  const ps=['Predice','Diseña','Diagnostica'], C=contenidoGuia();
  const ok=i=>i<GUIA.phase||(i===2&&RETO.hecho);

  <div class="retoBox"><div class="rt"><span>${C.no}</span><span>${C.head}</span></div><h3>${C.title}</h3><div class="rq">${C.teach}</div><div class="opt" id="actOpt">${C.acts}</div></div>`;
}
/** Lo que corre en el túnel en cada paso del laboratorio guiado (null: lo que digan los mandos). */
function guiaParams(){
  if(GUIA.paso==='predice'&&GUIA.r1){ const r=GUIA.r1;
    return {par:{A:r.A,Cd0:r.Cd,m:VEH.m,Pmax:r.P*1000,liso:true},V:r.ans*0.55,th:0,h:80}; }
  if(GUIA.paso==='decide'&&GUIA.r2&&!GUIA.preparando){ const r=GUIA.r2; return {par:parBase(),V:r.sc.vref*3.6,th:r.th,h:r.h}; }
  if((GUIA.paso==='diag'||GUIA.paso==='quiz'||GUIA.paso==='completo')&&GUIA.dx){ const d=GUIA.dx;
    return {par:parBase(),V:150,th:clamp(d.th0+GUIA.dth,0,22),h:clamp(d.h0+GUIA.dh,40,120)}; }
  return null;
}
/* ---------- los modos ---------- */
function setMode(m,forzar){
  if(!forzar&&(m===EST.modo||EST.autoRunning)) return;
  if(m==='guia'){
    EST.modo='guia'; if(!GUIA.iniciado){ GUIA.iniciado=true; sorteaCaso1(); paso('predice'); }
  } else EST.modo='marcha';
  document.body.classList.toggle('m-marcha',EST.modo==='marcha'); document.body.classList.toggle('m-guia',EST.modo==='guia');
  STclave=''; pintaHUD(); pintaDockFijo(); pintaBarras(); ponVista(EST.vista,0.6);
}
let fbTimer=null;
function feedback(type,title,text,sticky=false){ const f=el('feedback'); f.className='feedback show '+type; el('fbIcon').textContent=type==='good'?'✓':'✕'; el('fbTitle').textContent=title; el('fbText').innerHTML=text; clearTimeout(fbTimer); if(!sticky) fbTimer=setTimeout(()=>f.classList.remove('show'),7000); }
el('fbX').onclick=()=>el('feedback').classList.remove('show');
document.addEventListener('input',e=>{ const t=e.target; if(!t) return;

});

/* ---------- el recorrido guiado de «En marcha» ---------- */
const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function runAuto(){
  if(EST.autoRunning||EST.modo!=='marcha') return; EST.autoRunning=true; EST.barrido=false; sonido.init();
  const hud=el('hud'), prev={V:EST.V,th:EST.th,h:EST.h,vista:EST.vista,vel:EST.vel};
  const fija=o=>{ Object.assign(EST,o); pintaHUD(); hud.style.pointerEvents='none'; const b=el('btnAuto'); if(b){ b.disabled=true; b.textContent='Recorrido en curso…'; } pintaDockFijo(); pintaBarras(); };
  try{
    fija({V:130,th:0,h:100}); ponVista('lateral');
    showToast('Paso 1 · Coche sin alerón a 130 km/h. El humo se desliza y deja una <b>estela</b>; la flecha naranja es el <b>arrastre</b>.',7600);
    await espera(8000);
    showToast('Paso 2 · Barrido de velocidad: el arrastre crece con <b>v²</b> y la potencia con <b>v³</b>. Mira las dos curvas del dock.',7600);
    for(let i=0;i<=60;i++){ EST.V=Math.round(60+220*i/60); sincronizaV(); await espera(120); }
    await espera(600);
    fija({V:200,th:12,h:70}); ponVista('aleron');
    showToast('Paso 3 · Alerón a 12°: da <b>carga</b> (flechas cian hacia abajo) y también arrastre inducido. Cada newton de carga se paga.',8200);
    await espera(8600);
    fija({th:20});
    showToast('Paso 4 · A 20° el alerón entra en <b>pérdida</b>: el flujo se despega, la carga cae y el arrastre sube.',8200);
    await espera(8600);
    fija({th:10,h:48}); ponVista('suelo');
    showToast('Paso 5 · Bajar el coche acelera el aire bajo el suelo y da carga (mancha cian). Más abajo de 50 mm el flujo se <b>estrangula</b>.',8200);
    await espera(8600);
    fija({h:40});
    await espera(4200);
  } finally {
    Object.assign(EST,prev); EST.autoRunning=false; hud.style.pointerEvents='';
    pintaHUD(); pintaDockFijo(); ponVista(prev.vista); pintaBarras();
  }
}


/* ===================== 19. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.min(devicePixelRatio,alta?2:1.5));
  const ms=alta?2048:1024; if(LUZ.sol.shadow.mapSize.x!==ms){ LUZ.sol.shadow.mapSize.set(ms,ms); if(LUZ.sol.shadow.map){ LUZ.sol.shadow.map.dispose(); LUZ.sol.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  FLUJO.vivo=alta?NP:1000; GEO_FLUJO.setDrawRange(0,FLUJO.vivo*K);
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); ponVista(EST.vista,0.001); centraEnHueco();
}
window.addEventListener('resize',alCambiarTamano);

/* ===================== 20. EL LAZO: UN SOLO RELOJ =====================
   El tiempo de la escena avanza dt·(cámara lenta) en cada cuadro, y con ESE tiempo se mueven el humo, la cinta y
   las ruedas. Las cifras y las gráficas del dock salen del mismo estado ST que las flechas y el alerón. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  aplicaEscena(EST.pausa?0:dt*EST.vel,dt);
  huella();
  pasaCam(dt);
  sonido.actualiza(EST.pausa||!ST?0:ST.V/(300/3.6));
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.05&&seVe(el('panel'))){ tLienzo=t; pintaPot(); pintaPolar(); pintaFuerzas(); pintaAgarre(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos();
}

/* ===================== 21. ARRANQUE =====================
   Abre soplando: un coche deportivo a 160 km/h con el alerón a 10° y el coche a 70 mm del suelo, con el humo ya
   repartido por la sección de pruebas. Se adelanta el flujo para que el primer cuadro ya muestre las trazas curvadas. */

STclave=''; aplicaEscena(0,0);
{ const dtv=0.07/ST.V; for(let i=0;i<70;i++) avanzaFlujo(dtv,ST.V); }
aplicaEscena(0,0);
pintaBarras();
ponVista('tunel',0.001);
centraEnHueco();
pintaDockFijo();
cuadro();
setTimeout(()=>showToast('Túnel de viento a 160 km/h: el humo cambia de color con la velocidad del aire. Las flechas son lo que mide la balanza.',5600),700);
