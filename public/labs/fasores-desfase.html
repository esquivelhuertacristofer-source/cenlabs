<style>
  :root{
    --bg:#08201C;--panel:rgba(9,26,23,.86);--line:#1E3A34;--ink:#EAF4F1;
    --dim:#8FB3AC;--accent:#2A9D8F;--accent2:#4FD1C5;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(10,13,18,.92),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

  .badge{position:fixed;top:16px;right:20px;z-index:20;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,209,102,.12);color:var(--hv);border:1px solid rgba(255,209,102,.35);padding:6px 12px;border-radius:20px}

  .hud{position:fixed;top:70px;left:18px;z-index:15;max-width:330px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-height:calc(100vh - 150px);overflow-y:auto}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .hud h2{font-size:19px;line-height:1.15;margin-bottom:9px}
  .hud p{font-size:13px;line-height:1.55;color:var(--dim);margin-bottom:10px}
  .hud .formula{font-family:var(--mono);color:var(--accent2);text-align:center;font-size:12.5px;margin:8px 0;padding:8px;background:rgba(0,0,0,.25);border-radius:8px;line-height:1.5}
  .hud .src{font-size:10.5px;color:#7a8894;font-style:italic;margin-top:4px;line-height:1.5}
  .legend{display:flex;flex-direction:column;gap:6px;margin:12px 0;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:10px}
  .legend .li{display:flex;align-items:center;gap:8px;font-size:11px;color:#c4d0da}
  .legend .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .fid{margin:10px 0 2px;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:10px;border:1px solid rgba(79,209,197,.18)}
  .fid .ft{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);margin-bottom:6px}
  .fid .fl{font-size:11px;color:#c4d0da;line-height:1.5;margin-bottom:5px}
  .fid .fl b{color:var(--ink)}
  .fid .fl.no b{color:var(--hv)}

  .panel{position:fixed;top:70px;right:18px;z-index:15;width:262px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:16px;max-height:calc(100vh - 150px);overflow-y:auto}
  .panel h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:2px 0 10px}
  .panel h4.sec{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .g{margin-bottom:6px}
  .gl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .gl b{color:var(--accent2)}
  .gl b.good{color:var(--good)}.gl b.warn{color:var(--hv)}.gl b.bad{color:var(--bad)}
  .modebar{display:flex;gap:5px;margin-bottom:8px}
  .modebar .b{flex:1;padding:8px 4px;font-size:11px}
  .btns{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .b{font-family:system-ui;font-size:12.5px;padding:10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#1b242f;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#202c38}
  .b.on{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:bold}
  .b.primary{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:bold}
  .b.auto{border-color:var(--hv);color:var(--hv);background:rgba(255,183,3,.10);font-weight:bold}
  .b.auto:hover{background:rgba(255,183,3,.18);border-color:var(--hv)}
  .b.auto:disabled{opacity:.6;cursor:default}
  .b.dx{text-align:left;font-size:12px}
  .b.dx.right{background:rgba(52,211,153,.18);border-color:var(--good);color:var(--good);font-weight:bold}
  .b.dx.wrong{background:rgba(244,71,94,.15);border-color:var(--bad);color:var(--bad)}
  .console{font-family:var(--mono);font-size:11px;line-height:1.55;color:#c4d0da;background:rgba(0,0,0,.28);border-radius:9px;padding:10px 12px;margin-bottom:8px;min-height:56px}
  .console .dtc{color:var(--bad);font-weight:bold}
  .console .ok{color:var(--good)}
  .console .mono{color:var(--dim)}

  .hint{position:fixed;bottom:18px;left:18px;z-index:14;font-family:var(--mono);font-size:10px;color:var(--dim);background:var(--panel);padding:7px 12px;border-radius:9px;border:1px solid var(--line)}
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(18,24,32,.95);border:1px solid var(--accent);padding:10px 20px;border-radius:40px;font-family:var(--mono);font-size:12px;opacity:0;transition:.3s;pointer-events:none;max-width:80vw;text-align:center}
  .toast.show{opacity:1}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}
  .soundBtn:hover{transform:scale(1.08)}
  .inspectHint{position:fixed;bottom:18px;right:18px;z-index:14;font-family:var(--mono);font-size:10px;color:var(--accent2);background:var(--panel);padding:7px 12px;border-radius:9px;border:1px solid var(--line)}

  @media(max-width:820px){
    .hud,.panel{position:fixed;left:8px;right:8px;top:auto;bottom:8px;max-width:none;width:auto;max-height:42vh;overflow-y:auto}
    .hud{bottom:calc(8px + 42vh + 8px)}
    .hint,.inspectHint{display:none}
  }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
  t.generateMipmaps=false; t.minFilter=THREE.LinearFilter; t.anisotropy=1; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.14, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;
    }
    if(hook)hook(dt,t); controls.update();
    if(bokeh) bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);
    composer.render(); }
  function start(){ if(!raf)loop(); }
  function stop(){ cancelAnimationFrame(raf); raf=null; window.removeEventListener('resize',resize); }

  return { THREE, renderer, scene, camera, controls, composer, bloom,
    setAnimate:fn=>hook=fn, start, stop, resize, clock,
    flyTo:(v)=>{ controls.target.copy(v); }, moveTo, setCinematicIdle };
}

function roundedBox(w,h,d,mat,rf=0.08){

function pickerFor(scene,camera,dom,onHit){
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(); let down=null;
  dom.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
  dom.addEventListener('pointerup',e=>{
    if(!down)return; const moved=Math.abs(e.clientX-down[0])+Math.abs(e.clientY-down[1])>6; down=null;
    if(moved)return;
    const r=dom.getBoundingClientRect();
    mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(mouse,camera);
    const hits=ray.intersectObjects(scene.children,true);
    onHit(hits[0]||null);
  });
}
function labelSprite(text,color='#ffd166'){

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

/*
 * Fasores de Señales Senoidales — representa v(t)=Vm·sen(2π f t+φ) como un fasor V=Vm∠φ
 * y mide el desfase φ entre dos señales de la MISMA frecuencia con un osciloscopio de
 * dos canales, usando la técnica de instrumentación real: localizar el instante en que
 * cada señal cruza cero, en el MISMO sentido (ambas ascendentes o ambas descendentes),
 * y convertir la diferencia de tiempo a grados: φ = −Δt·360°/T.
 * Convención: fasor referido a SENO (no coseno) — v(t)=Vm·sen(ωt+φ) ↔ V=Vm∠φ, ángulo
 * medido en sentido antihorario desde el eje 0°. Canal 1 es la referencia fija (10 V, 0°).
 * Mezclar un cruce ascendente de un canal con uno descendente del otro produce un error
 * sistemático de exactamente 180° (mod 360°) — verificado numéricamente (21,600
 * combinaciones de frecuencia/φ/posición de cursor, 0 fallos): con el MISMO tipo de cruce
 * en ambos canales el φ medido es exacto; con tipos distintos, el error es exactamente
 * ±180°. Las señales renderizadas son siempre exactas (sin ruido) — lo que el modo
 * Medición/Reto "sella" es únicamente el TEXTO mostrado (y el vector del fasor 2 en el
 * diagrama), nunca la traza física, que siempre es la señal real.
 * Símbolos y notación fasorial: IEC 60027-1 · IEEE Std 280.
 * Las tolerancias (±5° en φ, ±8 % en Vm2) son un margen PEDAGÓGICO de este ejercicio,
 * no una especificación de instrumento real.
 */

const VOLTS_PER_DIV=VM_MAX/(DIVY/2);
const PERIODS_SHOWN=3.3;
const TOL_PHI_DEG=5;
const TOL_VM_FRAC=0.08;

const vOf=(vm,phiDeg,freq,t)=>vm*Math.sin(2*Math.PI*freq*t+phiDeg*Math.PI/180);
function windowSFor(freq){return PERIODS_SHOWN/freq;}
function divForTime(t,windowS){return(t/windowS)*DIVX;}

function crossingsFor(phiDeg,freq,windowS){
  const T=1/freq;
  const phiRad=phiDeg*Math.PI/180;
  let t0=(-phiRad/(2*Math.PI))*T;
  t0=((t0%T)+T)%T;
  const out=[];
  const kMax=Math.ceil(windowS/(T/2))+2;
  for(let k=-1;k<=kMax;k++){
    const t=t0+k*(T/2);
    if(t<-1e-9)continue;
    if(t>windowS+1e-9)break;
    const type=(((k%2)+2)%2===0)?'asc':'desc';
    out.push({t:Math.max(0,t),type});
  }
  return out;
}
function nearestCrossTo(rawT,crossings){
  let best=crossings[0],bd=Infinity;
  crossings.forEach(c=>{const d=Math.abs(c.t-rawT);if(d<bd){bd=d;best=c;}});
  return best;
}
function phiFromCrossings(t1,t2,freq){
  const T=1/freq;
  let dt=t2-t1;
  dt=dt-T*Math.round(dt/T);
  return -dt*360/T;
}
function angDiff(a,b){
  let d=(a-b)%360;if(d>180)d-=360;if(d<=-180)d+=360;return d;
}

function fmtV(v){
  const r=Math.round(v*100)/100;
  return(Number.isInteger(r)?String(r):r.toFixed(2))+' V';
}
function fmtHz(f){return f+' Hz';}
function fmtDeg(d){
  const r=Math.round(d*10)/10;
  return(Number.isInteger(r)?String(r):r.toFixed(1))+'°';
}
function fmtTimeS(s){
  const us=s*1e6;
  if(us<1000)return us.toFixed(us<10?2:1)+' µs';
  const ms=us/1000;
  return ms.toFixed(ms<10?3:(ms<100?2:1))+' ms';
}

function drawArrowhead(c,fromX,fromY,toX,toY,size,color){
  const angle=Math.atan2(toY-fromY,toX-fromX);
  c.beginPath();c.moveTo(toX,toY);
  c.lineTo(toX-size*Math.cos(angle-Math.PI/6),toY-size*Math.sin(angle-Math.PI/6));
  c.lineTo(toX-size*Math.cos(angle+Math.PI/6),toY-size*Math.sin(angle+Math.PI/6));
  c.closePath();c.fillStyle=color;c.fill();
}
function drawPhasorVector(c,cx,cy,R,vm,phiDeg,color,label){
  const frac=Math.min(1,vm/VM_MAX);

  const ex=cx+R*frac*Math.cos(rad),ey=cy-R*frac*Math.sin(rad);
  c.strokeStyle=color;c.lineWidth=3;
  c.beginPath();c.moveTo(cx,cy);c.lineTo(ex,ey);c.stroke();
  drawArrowhead(c,cx,cy,ex,ey,12,color);
  c.fillStyle=color;c.font='bold 13px Outfit, sans-serif';c.textAlign=ex>=cx?'left':'right';
  c.fillText(label,ex+(ex>=cx?8:-8),ey-6);
}

function drawTrace(c,xToPx,yToPx,windowS,vm,phiDeg,freq,color){
  c.strokeStyle=color;c.lineWidth=2.5;c.beginPath();

    const t=(i/N)*windowS;
    const v=vOf(vm,phiDeg,freq,t);
    const px=xToPx(t),py=yToPx(v);
    if(i===0)c.moveTo(px,py);else c.lineTo(px,py);
  }
  c.stroke();
}

  line(c,px,gy0,px,gy0+gh);
  c.setLineDash([]);

  c.fillStyle=color;c.font='bold 13px Outfit, sans-serif';c.textAlign='center';

function cable(ax,ay,az,bx,by,bz,mat){
  const a=new THREE.Vector3(ax,ay,az),b=new THREE.Vector3(bx,by,bz);

}

function medirPhi(){
  const freq=currentFreqVal();
  const c1=snap1(cursor1Div),c2=snap2(cursor2Div);
  const phi=phiFromCrossings(c1.t,c2.t,freq);
  measured=true;phiMeasured=phi;cross1Type=c1.type;cross2Type=c2.type;
  const matched=c1.type===c2.type;
  synth.beep(matched?1046:660,matched?0.12:0.15,0.06);
  if(mode==='explora'){
    showToast(matched
      ?`Medición: φ ≈ ${fmtDeg(phi)}. Coincide con el φ real (${fmtDeg(expPhi2)}) porque ambos cursores usan el MISMO tipo de cruce (${cross1Type==='asc'?'ascendente':'descendente'}).`
      :`⚠️ Medición: φ ≈ ${fmtDeg(phi)} — pero el φ real es ${fmtDeg(expPhi2)}. Mezclaste un cruce ${cross1Type==='asc'?'ascendente':'descendente'} (canal 1) con uno ${cross2Type==='asc'?'ascendente':'descendente'} (canal 2): error clásico de 180°.`);
  }else if(mode==='medicion'){
    const ok=Math.abs(angDiff(phi,medPhi2Seal))<=TOL_PHI_DEG;
    showToast(matched
      ?(ok?`<span style="color:var(--good)">✔ φ medido ≈ ${fmtDeg(phi)}, dentro de ±${TOL_PHI_DEG}° del valor sellado.</span>`
           :`φ medido ≈ ${fmtDeg(phi)} — fuera de tolerancia, ajusta el cursor justo sobre el cruce.`)
      :`⚠️ φ medido ≈ ${fmtDeg(phi)} — mezclaste tipos de cruce distintos (canal 1: ${cross1Type==='asc'?'ascendente':'descendente'}, canal 2: ${cross2Type==='asc'?'ascendente':'descendente'}). Error clásico de 180°: alinea ambos cursores al MISMO tipo de cruce.`);
  }else{
    showToast(matched
      ?`Medición registrada: φ ≈ ${fmtDeg(phi)} (cruces del mismo tipo). Ahora estima la amplitud leyendo la rejilla y comprueba.`
      :`⚠️ Medición registrada: φ ≈ ${fmtDeg(phi)} — cuidado, mezclaste tipos de cruce distintos. Puede estar desfasada 180° de la real.`);
  }
  refreshAll();
}
function checkReto(){
  if(!measured){showToast('⚠️ Primero mide el desfase con los cursores ("Medir desfase").');return;}
  const vmGuess=numOr('inVm2');
  if(!isFinite(vmGuess)){showToast('⚠️ Ingresa tu lectura de amplitud (Vm2) en volts.');return;}
  const tolVm=Math.max(retoVm2Seal*TOL_VM_FRAC,0.3);
  retoOkVm=Math.abs(vmGuess-retoVm2Seal)<=tolVm;
  retoOkPhi=Math.abs(angDiff(phiMeasured,retoPhi2Seal))<=TOL_PHI_DEG;
  retoChecked=true;
  const allOk=retoOkVm&&retoOkPhi;
  solved=allOk;
  synth.beep(allOk?1046:(retoOkVm||retoOkPhi?660:220),allOk?0.14:0.15,0.06);
  const parts=[];
  parts.push(retoOkVm?`<span class="ok">✔ Vm2 correcta</span> (tu lectura ${fmtV(vmGuess)})`:`<span class="dtc">✗ Vm2 fuera de tolerancia</span> (leíste ${fmtV(vmGuess)})`);
  parts.push(retoOkPhi?`<span class="ok">✔ φ correcto</span> (medido ${fmtDeg(phiMeasured)})`:`<span class="dtc">✗ φ fuera de tolerancia</span> (medido ${fmtDeg(phiMeasured)}${cross1Type!==cross2Type?' — cruces de tipo distinto, revisa el error de 180°':''})`);
  retoMsg=`<span class="mono">${parts.join('<br>')}</span>`;
  refreshAll();
}

}

function buildQuiz(){
  QUIZ={
    explora:{
      pregunta:'¿Por qué el diagrama fasorial solo permite comparar dos señales que tienen la MISMA frecuencia?',
      opciones:[
        {t:'Porque un fasor representa una señal "congelada" en una referencia relativa — si las frecuencias fueran distintas, el ángulo entre las dos señales cambiaría constantemente en el tiempo y el "desfase" dejaría de ser un número fijo',ok:true,why:'Correcto: el fasor solo tiene sentido como representación de ω constante compartida. Con frecuencias distintas, la diferencia de fase crece o decrece sin parar — no hay un desfase único que medir.'},
        {t:'Porque el osciloscopio solo puede medir una frecuencia a la vez',ok:false,why:'Un osciloscopio de dos canales sí puede mostrar simultáneamente dos señales de frecuencias distintas — el problema no es del instrumento, es que el concepto de "desfase" pierde sentido entre frecuencias distintas.'},
        {t:'Porque Vm tiene que ser igual en ambas señales para poder compararlas',ok:false,why:'La amplitud (Vm) puede ser distinta entre las dos señales sin ningún problema — lo que debe coincidir es la frecuencia, no la amplitud.'},
        {t:'Porque la frecuencia determina el color de la traza en el osciloscopio',ok:false,why:'El color de la traza es una convención de visualización de este simulador (canal 1 teal, canal 2 ámbar) — no tiene relación con la frecuencia de la señal.'},
      ],
    },
    medicion:{
      pregunta:'Alineas el cursor del canal 1 en un cruce ascendente (▲) y el del canal 2 en un cruce descendente (▼). ¿Qué error introduce esto en tu medición de φ?',
      opciones:[
        {t:'Un error sistemático de exactamente 180° (mod 360°) respecto al desfase real — el resultado es matemáticamente consistente pero no representa el desfase físico real entre las señales',ok:true,why:'Correcto: mezclar tipos de cruce equivale a medir la diferencia de tiempo hasta un punto de la señal 2 desplazado media vuelta (T/2) del que corresponde — eso se traduce en exactamente 180° de error, siempre, sin importar el φ real.'},
        {t:'Ningún error, porque un cruce por cero es un cruce por cero sin importar el sentido',ok:false,why:'El sentido del cruce SÍ importa: un cruce ascendente y uno descendente de la MISMA señal están separados por medio periodo (T/2) en el tiempo — mezclarlos introduce ese medio periodo como error.'},
        {t:'Un error aleatorio impredecible, distinto cada vez que se repite la medición',ok:false,why:'El error no es aleatorio: es sistemático y exacto (siempre ±180°, mod 360°) porque proviene de una relación geométrica fija entre cruces ascendentes y descendentes, verificada numéricamente.'},
        {t:'Un error del 50% en la amplitud medida',ok:false,why:'Mezclar tipos de cruce afecta la medición de FASE (ángulo), no la de amplitud — la amplitud no se ve alterada por este error.'},
      ],
    },
    reto:{
      pregunta:'En el Reto, Vm2 se lee de la rejilla y φ2 se mide con los cursores, y cada campo se califica de forma INDEPENDIENTE. ¿Por qué tiene sentido calificarlos por separado?',
      opciones:[
        {t:'Porque son dos mediciones con técnicas y fuentes de error distintas —leer una rejilla (visual) y localizar un cruce por cero (cursor)— así el estudiante sabe exactamente cuál de las dos técnicas necesita repasar, no solo que "algo" salió mal',ok:true,why:'Correcto: retroalimentación específica por campo es más útil pedagógicamente que un solo "correcto/incorrecto" global, porque señala con precisión qué habilidad de medición falló.'},
        {t:'Porque Vm2 y φ2 son en realidad el mismo número expresado en unidades distintas',ok:false,why:'Vm2 (amplitud, en volts) y φ2 (ángulo, en grados) son magnitudes físicas completamente independientes — conocer una no permite calcular la otra.'},
        {t:'Porque calificar ambos juntos sería técnicamente imposible en un programa de computadora',ok:false,why:'No hay ninguna limitación técnica para calificar dos campos juntos — la razón de separarlos es puramente pedagógica, para dar retroalimentación específica.'},
        {t:'Porque el osciloscopio no puede mostrar amplitud y fase al mismo tiempo',ok:false,why:'El osciloscopio de este banco muestra la traza completa (que contiene tanto amplitud como fase) en todo momento — ambas son visibles simultáneamente en la misma pantalla.'},
      ],
    },
  };
}
function clearDx(){el('dxbtns').querySelectorAll('.b.dx').forEach(b=>b.classList.remove('right','wrong'));}
function refreshQuestion(){
  const q=QUIZ[mode];
  el('q_text').innerHTML=q.pregunta;
  el('dxbtns').innerHTML=q.opciones.map((o,i)=>`<button class="b dx" data-i="${i}">${'ABCD'[i]} · ${o.t}</button>`).join('');
  el('dxbtns').querySelectorAll('.b.dx').forEach(btn=>{btn.onclick=()=>answer(+btn.dataset.i);});
}
function answer(i){
  const o=QUIZ[mode].opciones[i];clearDx();
  const btn=el('dxbtns').children[i];
  if(o.ok){
    btn.classList.add('right');solved=true;synth.beep(1046,0.12,0.06);
    showToast(`<span style="color:var(--good)">✔ Correcto.</span><br><span style="color:var(--dim);font-size:11px">${o.why}</span>`);
  }else{
    btn.classList.add('wrong');synth.beep(220,0.15,0.06);
    showToast(`<span style="color:var(--bad)">✗ Revisa el modelo.</span><br><span style="color:var(--dim);font-size:11px">${o.why}</span>`);
  }
}

// ============================== 13) PICKING Y HOVER ==============================
pickerFor(scene,S.camera,S.renderer.domElement,hit=>{
  if(!hit)return;
  if(hit.object===board&&hit.uv){boardClick(hit.uv.x,hit.uv.y);return;}
  let o=hit.object;
  while(o){
    const u=o.userData||{};
    if(u.el){toastPart(u.el);return;}
    if(u.title){showToast(`<b style="color:var(--accent2)">${u.title}</b><br><span style="color:var(--dim);font-size:11px">${u.info}</span>`);return;}
    o=o.parent;
  }
});

(()=>{
  const ray=new THREE.Raycaster(),v2=new THREE.Vector2();
  S.renderer.domElement.addEventListener('pointermove',ev=>{
    const r=S.renderer.domElement.getBoundingClientRect();
    v2.x=((ev.clientX-r.left)/r.width)*2-1;v2.y=-((ev.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(v2,S.camera);
    const hits=ray.intersectObjects(scene.children,true);
    HOVER_LABELS.forEach(lb=>lb.visible=false);
    let cursor='default';
    if(hits.length){
      let o=hits[0].object;
      while(o){
        if(HOVER_LABELS.has(o)){HOVER_LABELS.get(o).visible=true;cursor='pointer';break;}
        if(o.userData&&(o.userData.el||o.userData.title||o===board))cursor='pointer';
        o=o.parent;
      }
      if(hits[0].object===board)cursor='pointer';
    }
    S.renderer.domElement.style.cursor=cursor;
  });
})();

// ============================== 14) RECORRIDO AUTOMÁTICO ==============================
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function runAuto(){
  if(autoRunning)return;autoRunning=true;
  const btn=el('btnAuto'),label=btn.textContent;
  btn.disabled=true;btn.classList.add('on');btn.textContent='⏳ Recorrido guiado en curso…';
  try{
    synth.init();synth.resume();
    clearDx();
    setMode('explora');
    expVm2=12;expPhi2=45;expFreq=60;afterEdit();
    showToast('Paso 1 · V1 es la referencia fija (10 V, 0°). V2 tiene Vm2=12 V y φ2=45° — obsérvalo adelantado en el diagrama fasorial y en el osciloscopio.');
    await sleep(2600);
    expPhi2=-90;afterEdit();
    showToast('Ahora φ2=−90°: el fasor V2 gira al cuarto cuadrante inferior y su cruce ascendente se adelanta en el tiempo.');
    await sleep(2600);

    setMode('medicion');
    showToast('Paso 2 · El desfase de V2 está sellado. Primero, un error clásico: mezclar tipos de cruce distintos.');
    await sleep(2000);
    {
      const freq=currentFreqVal(),windowS=windowSFor(freq);
      const cr1=crossingsFor(PHI1,freq,windowS).find(c=>c.type==='asc');
      const cr2=crossingsFor(medPhi2Seal,freq,windowS).find(c=>c.type==='desc');
      cursor1Div=divForTime(cr1.t,windowS);el('cursor1').value=String(cursor1Div);
      cursor2Div=divForTime(cr2.t,windowS);el('cursor2').value=String(cursor2Div);
    }
    refreshAll();
    medirPhi();await sleep(2800);
    showToast('Corrigiendo: alineamos el cursor del canal 2 a un cruce ASCENDENTE, igual que el canal 1.');
    await sleep(2000);
    {
      const freq=currentFreqVal(),windowS=windowSFor(freq);
      const cr2=crossingsFor(medPhi2Seal,freq,windowS).find(c=>c.type==='asc');
      cursor2Div=divForTime(cr2.t,windowS);el('cursor2').value=String(cursor2Div);
    }
    refreshAll();
    medirPhi();await sleep(2600);
    answer(QUIZ.medicion.opciones.findIndex(o=>o.ok));await sleep(1800);

    setMode('reto');
    showToast('Paso 3 · Amplitud y desfase sellados. Lee Vm2 en la rejilla y mide φ con los cursores.');
    await sleep(2200);
    {
      const freq=currentFreqVal(),windowS=windowSFor(freq);
      const cr1=crossingsFor(PHI1,freq,windowS).find(c=>c.type==='asc');
      const cr2=crossingsFor(retoPhi2Seal,freq,windowS).find(c=>c.type==='asc');
      cursor1Div=divForTime(cr1.t,windowS);el('cursor1').value=String(cursor1Div);
      cursor2Div=divForTime(cr2.t,windowS);el('cursor2').value=String(cursor2Div);
    }
    refreshAll();
    medirPhi();await sleep(1800);
    el('inVm2').value=String(retoVm2Seal);
    checkReto();await sleep(2600);
    const q=QUIZ.reto,i=q.opciones.findIndex(o=>o.ok);
    clearDx();
    const dxBtn=el('dxbtns').children[i];
    if(dxBtn){dxBtn.classList.add('right');solved=true;synth.beep(1046,0.12,0.06);}
    showToast(`<span style="color:var(--good)">✔ ${q.opciones[i].t}</span><br><span style="color:var(--dim);font-size:11px">${q.opciones[i].why}</span>`);
  }finally{
    btn.disabled=false;btn.classList.remove('on');btn.textContent=label;autoRunning=false;
  }
}
