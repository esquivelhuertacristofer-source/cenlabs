<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEN Labs · Climatización y Bomba de Calor del Vehículo Eléctrico — Laboratorio 3D</title>
<link href="/labs/vendor/outfit/outfit.css" rel="stylesheet">
<style>
  :root{
    --bg:#08202A;--panel:rgba(7,22,30,.86);--line:#1D4250;--ink:#EAF4F1;
    --dim:#93AFC9;--accent:#2FC4D4;--accent2:#8FE3EE;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
    --hudW:318px;--dockW:404px;
    --cF:#8FE3EE;--cR:#FFB347;--cE:#FF4D5A;--cG:#C8D6D2;
  }
  @media (max-width:1699px){:root{--hudW:300px;--dockW:376px}}
  @media (max-width:1439px){:root{--hudW:288px;--dockW:340px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080a;color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(6,10,12,.9),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}

  .b{font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#10252e;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#16323d}
  .b:disabled{opacity:.42;cursor:not-allowed}
  .b.on{background:var(--accent);color:#031a20;border-color:var(--accent);font-weight:700}
  .b.primary{background:var(--accent);color:#031a20;border-color:var(--accent);font-weight:700}
  .b.primary:hover{background:#58d6e3}
  .b.auto{border-color:rgba(255,183,3,.6);color:var(--hv);background:rgba(255,183,3,.08);font-weight:600}
  .b.auto:hover{background:rgba(255,183,3,.16)}
  .b.good{border-color:var(--good);color:var(--good)} .b.bad{border-color:var(--bad);color:var(--bad)}
  .b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
  .b .ic{font-size:13px;margin-right:4px}

  /* ---- guía (izquierda) ---- */
  .hud{position:fixed;top:66px;left:18px;z-index:15;width:var(--hudW);max-height:calc(100vh - 80px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hud h2{font-size:19px;line-height:1.18}
  .hud .intro{font-size:12.8px;line-height:1.5;color:var(--dim)}
  .hud .intro b{color:var(--ink);font-weight:600}
  .modebar{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .modebar .b{padding:7px 4px 6px;font-size:11.5px;border-radius:8px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .modebar .b i{font-style:normal;font-size:13px;font-weight:700}
  .fila{display:flex;gap:6px}.fila>*{flex:1}
  .seg{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:10px;padding:3px}
  .seg .b{flex:1;border:0;background:transparent;padding:6px 2px;font-size:11.8px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .seg .b.on{background:var(--accent);color:#031a20}
  .cg .cl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cg .cl b{letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  .cg .cl em{font-style:normal;text-transform:none;letter-spacing:.02em}
  .cg input[type=range]{width:100%;accent-color:#7CC4FF;height:18px}
  .marcas{display:flex;justify-content:space-between;font-size:9.5px;color:#6f87a0;margin-top:-2px;font-variant-numeric:tabular-nums}
  .marcas span.lim{color:#d8b36a}
  .marcas.abs{position:relative;display:block;height:12px}
  .marcas.abs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .hcab,.hmandos,.hdet{display:flex;flex-direction:column;gap:8px}
  .hcab{gap:6px}
  .hud details{border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18)}
  .hud details>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
  .hud details>summary::-webkit-details-marker{display:none}
  .hud details>summary:before{content:'▸';color:var(--accent2);font-size:11px;transition:transform .15s}
  .hud details[open]>summary:before{transform:rotate(90deg)}
  .hud details>.cuerpo{padding:2px 10px 10px;font-size:11.5px;line-height:1.5;color:#c4d0da;max-height:38vh;overflow:auto}
  .hud .formula{font-family:var(--mono);color:var(--accent2);font-size:11.3px;line-height:1.62;margin:4px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px}
  .hud .fl{margin:5px 0}.hud .fl b{color:var(--ink)}
  .hud .src{font-size:10.5px;color:#7f90a8;font-style:italic;margin-top:6px}
  .hud ul.no{padding-left:16px}.hud ul.no li{margin:3px 0}
  /* el laboratorio guiado: tres fases */
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pasos .ps{font-size:11px;letter-spacing:0;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .pasos .ps i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .pasos .ps.on{border-color:var(--accent);color:var(--ink)} .pasos .ps.on i{background:var(--accent);color:#031a20}
  .pasos .ps.ok{color:var(--good);border-color:rgba(52,211,153,.4)} .pasos .ps.ok i{background:var(--good);color:#06201c}
  .retoBox{border:1px solid rgba(255,183,3,.35);background:rgba(255,183,3,.05);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  .retoBox .rt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);display:flex;justify-content:space-between;gap:10px}
  .retoBox .rt span:last-child{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:#c9a75a;text-align:right}
  .retoBox h3{font-size:15px;line-height:1.25;color:var(--ink)}
  .retoBox .rq{font-size:12.8px;line-height:1.5;color:var(--ink)}
  .retoBox .rq b{color:#ffd88a}
  .retoBox .why{font-size:12px;line-height:1.5;color:var(--dim);border-left:2px solid var(--accent2);padding-left:9px}
  .retoBox .why b{color:var(--accent2)}
  .task{font-size:12.3px;line-height:1.45;color:#ffd88a;background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.35);border-radius:8px;padding:7px 9px}
  .escs{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
  .esc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px;font-size:11.5px;line-height:1.35;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);color:#c4d3e6}
  .esc .rs{font-weight:700;font-size:11px}.esc .rs.ok{color:var(--good)}.esc .rs.mal{color:#ff9a9a}
  .esc .pista{font-size:10.5px}
  .tries{font-size:11px;color:var(--dim)}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt .b{text-align:left;display:flex;align-items:center;gap:6px}
  .pista{font-size:11px;color:var(--accent2);text-decoration:underline;cursor:pointer;align-self:flex-start;background:none;border:0;font-family:inherit}
  .calcrow{display:flex;gap:6px}
  .calcrow input{flex:1;min-width:0;background:#09121c;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .calcrow input:focus{outline:none;border-color:var(--accent)}
  .calcrow .b{flex:0 0 auto}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:3px 0;border-top:1px solid rgba(30,53,80,.7);font-variant-numeric:tabular-nums}
  .mini b{color:var(--accent2);font-weight:600}

  /* ---- dock de instrumentos (derecha) ---- */
  .panel{position:fixed;top:66px;right:18px;bottom:14px;z-index:15;width:var(--dockW);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .dk-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .dk-t #p_mode{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .dk-t .sub{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dk-fig{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fg{background:rgba(0,0,0,.22);border:1px solid rgba(30,53,80,.9);border-radius:9px;padding:4px 7px;min-width:0}
  .fg .fl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .fg b{display:block;font-size:16px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .fg b small{font-size:10.5px;color:var(--dim);font-weight:500}
  .fg b.bad{color:#ff9a9a}.fg b.warn{color:#ffd88a}.fg b.oculto{color:#6f87a0}
  .dk-tit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:1px 2px -2px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .dk-tit span{letter-spacing:0;text-transform:none;font-size:11px;color:#a3bcd6;overflow:hidden;text-overflow:ellipsis}
  .dk-tit sub{font-size:8px;text-transform:none;letter-spacing:0}
  .dk-tit i{font-style:normal}
  em.gr{font-style:normal;text-transform:none;letter-spacing:.02em}
  .dk-row{display:grid;grid-template-columns:44% 1fr;gap:6px;flex:1.25 1 0;min-height:118px}
  .dk-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
  .dk-g{position:relative;border-radius:10px;background:rgba(0,0,0,.20);border:1px solid rgba(30,53,80,.7);min-height:0}
  .dk-col .dk-g{flex:1 1 0}
  .dk-g.fu{flex:1.35 1 0;min-height:96px}
  .dk-g.sp{flex:0.95 1 0;min-height:72px}
  .dk-g canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .dk-ley{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:#b4c6da;margin:-2px 2px 0}
  .dk-ley .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dk-ley i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c)}
  .dk-ley i.dash{border-top:2px dashed var(--c)}
  .dk-ley i.bl{width:11px;height:8px;border:0;border-radius:2px;background:var(--c)}
  .dk-aviso{display:none;font-size:11.5px;line-height:1.45;border-radius:9px;padding:6px 9px}
  .dk-aviso.on{display:block}.dk-aviso.mal{background:rgba(244,71,94,.12);color:#ffb3bd;border:1px solid rgba(244,71,94,.35)}
  .dk-aviso.ojo{background:rgba(255,183,3,.08);color:#ffd88a;border:1px solid rgba(255,183,3,.30)}
  .dk-aviso.bien{background:rgba(52,211,153,.08);color:#a7f3d0;border:1px solid rgba(52,211,153,.3)}

  /* ---- barras: vistas (arriba) y reproducción (abajo), centradas en el hueco ---- */
  .vbar,.tbar{position:fixed;z-index:16;display:flex;align-items:center;gap:5px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;color:var(--dim);transform:translateX(-50%);left:50%;white-space:nowrap}
  .vbar{top:62px;padding:4px 6px}
  .vbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  .tbar{bottom:14px;padding:6px 10px;gap:8px}
  .tbar select{background:#10252e;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:11.5px;font-family:inherit}
  .tbar .lento{color:var(--hv);font-size:11.5px}
  .tbar .reloj{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:76px}
  .tbar .est{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#cfdcec;min-width:132px;font-variant-numeric:tabular-nums}
  .tbar .est i{width:9px;height:9px;border-radius:50%;background:var(--cF);flex:none}
  .tbar .modo{font-size:10.5px;color:var(--dim)}
  .toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,18,30,.95);border:1px solid var(--accent);padding:10px 18px;border-radius:16px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 80px));text-align:center}
  .toast.show{opacity:1}
  .feedback{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:min(560px,calc(100vw - var(--hudW) - var(--dockW) - 70px));width:max-content;background:rgba(9,18,30,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s}
  .feedback.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
  .feedback .fh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .feedback .fi{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex:0 0 auto}
  .feedback.good .fi{background:var(--good);color:#06201c} .feedback.bad .fi{background:var(--bad);color:#2a0810}
  .feedback .ft{font-weight:700;font-size:13.5px} .feedback.good .ft{color:var(--good)} .feedback.bad .ft{color:var(--bad)}
  .feedback p{font-size:12.5px;line-height:1.55;color:#c4d3e6}
  .feedback .fx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
  .tip3{position:fixed;z-index:30;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#e6f0f2;background:rgba(9,18,30,.92);border:1px solid rgba(124,196,255,.4);padding:4px 9px;border-radius:7px;max-width:340px;white-space:normal;line-height:1.4;display:none}
  .rot3{position:fixed;z-index:13;pointer-events:none;font-family:var(--mono);font-size:11px;color:#e6f0f2;background:rgba(9,18,30,.84);border:1px solid rgba(124,196,255,.32);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .rot3svg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none;overflow:visible}
  .tabs{display:none}
  @media (max-height:820px){ .hud{gap:6px;padding:12px 14px 10px}.hud h2{font-size:17px}.hud .intro{font-size:12.2px;line-height:1.42} .fg b{font-size:14.5px} .cg input[type=range]{height:15px} .dk-row{min-height:104px} }
  @media (max-width:1439px){ .fg b{font-size:14px} .fg b small{font-size:9.5px} .fg{padding:3px 6px} .tbar .est{min-width:118px} }

  /* ---- estrecho (marco de la plataforma, tableta, móvil): el 3D arriba y una hoja con pestañas ---- */
  body.estrecho .hud,body.estrecho .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:var(--hojaH);max-height:none;display:none}
  body.estrecho.t-hud .hud{display:flex} body.estrecho.t-panel .panel{display:flex}
  body.estrecho .tabs{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 12px);z-index:17;gap:6px}
  body.estrecho .tabs .b{flex:1;padding:7px 6px;font-size:12px}
  body.estrecho .tbar{bottom:calc(var(--hojaH) + 52px);max-width:calc(100vw - 16px)}
  body.estrecho .vbar{top:52px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
  body.estrecho .toast,body.estrecho .feedback{max-width:calc(100vw - 24px)}
  body.estrecho .feedback{bottom:calc(var(--hojaH) + 12px)}
  body.estrecho .rot3svg,body.estrecho .rot3{display:none} body.estrecho .lt{display:none}
  body.estrecho.ancho .panel{display:none}
  body.estrecho.ancho.t-panel .panel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto 1fr;column-gap:10px;row-gap:5px}
  body.estrecho.ancho.t-panel .panel>.dk-t{grid-column:1/3}
  body.estrecho.ancho.t-panel .panel>.dk-fig{grid-column:1;grid-row:2}
  body.estrecho.ancho.t-panel .panel>.dk-row{grid-column:1;grid-row:3/6;min-height:0}
  body.estrecho.ancho.t-panel .panel>.t-fu{grid-column:2;grid-row:2;align-self:start}
  body.estrecho.ancho.t-panel .panel>.dk-g.fu{grid-column:2;grid-row:2/4;min-height:0;margin-top:18px}
  body.estrecho.ancho.t-panel .panel>.dk-ley{display:none}
  body.estrecho.ancho.t-panel .panel>.t-sp{grid-column:2;grid-row:4}
  body.estrecho.ancho.t-panel .panel>.dk-g.sp{grid-column:2;grid-row:5;min-height:0}
  body.estrecho.ancho.t-panel .panel>.dk-aviso{display:none}
  body.estrecho .hud details>.cuerpo{max-height:24vh}
  body.estrecho.ancho.t-hud .hud{display:grid;grid-template-columns:1fr 1.05fr;column-gap:14px;row-gap:7px;align-content:start;grid-auto-flow:row dense}
  body.estrecho.ancho .hud>.hcab,body.estrecho.ancho .hud>.modebar,body.estrecho.ancho .hud>.hdet,body.estrecho.ancho .hud>.pasos{grid-column:1}
  body.estrecho.ancho .hud>.hmandos,body.estrecho.ancho .hud>.retoBox{grid-column:2;grid-row:1/span 4}
  body.estrecho .hdet{flex-direction:row}body.estrecho .hdet>details{flex:1;min-width:0}
  body.estrecho .hdet details[open]{position:fixed;left:8px;right:8px;bottom:calc(var(--hojaH) + 54px);z-index:25;background:rgba(9,19,32,.97)}
  body.movil .lt{display:none} body.movil .tbar .modo,body.movil .tbar .reloj{display:none}
  body.movil .tbar{gap:6px;padding:5px 8px} body.movil .tbar .est{min-width:0}
  body.movil .dk-ley{display:none} body.movil .fg b{font-size:13.5px} body.movil .fg .fl{font-size:9.5px}
  body.movil .dk-g.fu{min-height:70px} body.movil .dk-g.sp{min-height:52px} body.movil .dk-row{min-height:150px}
  body.movil .hud h2{font-size:15.5px} body.movil .hud .intro{font-size:11.8px;line-height:1.42}
  body.estrecho .hud{overflow-y:auto}
  body.estrecho .vbar [data-t="rot"],body.estrecho .vbar .sep.s1{display:none}
  body.estrecho.ancho .vbar{top:60px}
  body.movil .vbar{flex-wrap:nowrap;gap:3px;padding:3px 4px;top:54px} body.movil .vbar .sep{display:none} body.movil .vbar .b.sm{padding:5px 7px;font-size:11px}

/* ============================================================
   LAB — CLIMATIZACIÓN Y BOMBA DE CALOR DEL VEHÍCULO ELÉCTRICO
   (Autotrónica · mecanica-132)

   Un circuito de R134a en corte: compresor eléctrico de espiral, intercambiador de la cabina, válvula de
   expansión e intercambiador exterior. El refrigerante recorre el circuito coloreado por fase y, con el mismo
   reloj, un punto recorre el diagrama p–h. Las propiedades salen de la ecuación de estado de Peng–Robinson
   (saturación por igualdad de fugacidad); el ciclo, el compresor, los ventiladores y la autonomía son un único
   modelo. Esa física está en un bloque puro que un script de Node extrae TAL CUAL y verifica contra NIST.
   ============================================================ */

/* ===================== 0. UTILIDADES ===================== */
const el=id=>document.getElementById(id);
/* Cifras en castellano: coma decimal y espacio FINO (U+202F) entre millares. */
const FINO=' ';
function fN(x,d=0){
  if(!isFinite(x)) return '—';

  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,FINO);
  return (x<0&&Number(s.join('.'))!==0?'−':'')+s.join(',');

const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;

/* ===================== 1. FÍSICA (pura, sin three) =====================
   El script de verificación extrae este bloque TAL CUAL —entre las dos marcas— y lo prueba:
   lo que se prueba es lo que corre. */
/* FISICA:INICIO */
/* ===================== FÍSICA: R134a con Peng–Robinson + ciclo + vehículo =====================
   Todo en SI (K, Pa, J, kg). Estado de referencia IIR: h = 200 kJ/kg y s = 1 kJ/(kg·K) para el líquido
   saturado a 0 °C (como las tablas de libro y NIST). */
const RG=8.314462618, MM=0.102032, RS=RG/MM;            // constante universal, masa molar (kg/mol) y R específica
const FL={Tc:374.21,Pc:4.059e6,w:0.3268};
const SQ2=Math.SQRT2;
FL.b=0.07780*RG*FL.Tc/FL.Pc; FL.ac=0.45724*RG*RG*FL.Tc*FL.Tc/FL.Pc;
FL.k=0.37464+1.54226*FL.w-0.26992*FL.w*FL.w;
/* cp ideal polinómico (J/mol/K): Reid–Prausnitz–Poling, cp = a + bT + cT² (T en K) */
const CP0={a:19.4006,b:0.258531,c:-1.29665e-4};
function aT(T){ const al=Math.pow(1+FL.k*(1-Math.sqrt(T/FL.Tc)),2); return {a:FL.ac*al, da:-FL.ac*FL.k*Math.sqrt(al)/Math.sqrt(T*FL.Tc)}; }
/** Raíces del cúbico de Z a (T,P): ZL (líquido) y ZV (vapor); n = número de raíces físicas. */
function raicesZ(T,P){
  const {a}=aT(T), A=a*P/((RG*T)*(RG*T)), B=FL.b*P/(RG*T);
  const c2=-(1-B), c1=A-3*B*B-2*B, c0=-(A*B-B*B-B*B*B);
  const p=c1-c2*c2/3, q=2*c2*c2*c2/27-c2*c1/3+c0, d=q*q/4+p*p*p/27, off=-c2/3;
  let rs;
  if(d>0){ const s=Math.sqrt(d), u=Math.cbrt(-q/2+s), v=Math.cbrt(-q/2-s); rs=[u+v+off]; }
  else { const r=Math.sqrt(-p*p*p/27), ph=Math.acos(Math.max(-1,Math.min(1,-q/(2*r)))), m=2*Math.cbrt(r);
    rs=[0,1,2].map(k=>m*Math.cos((ph+2*Math.PI*k)/3)+off); }
  rs=rs.filter(z=>z>B+1e-12).sort((x,y)=>x-y);

function lnFi(Z,A,B){ return Z-1-Math.log(Z-B)-A/(2*SQ2*B)*Math.log((Z+(1+SQ2)*B)/(Z+(1-SQ2)*B)); }
/** Presión de saturación por igualdad de fugacidad (lnφ_L = lnφ_V): Newton sobre ln P (d lnφ/d lnP = Z−1). */
function psat(T){

    if(r.n<2||Math.abs(r.ZV-r.ZL)<1e-9){ P*=(r.ZV>0.5? 1.15:0.87); continue; }
    const f=lnFi(r.ZL,r.A,r.B)-lnFi(r.ZV,r.A,r.B);

/** Desviación respecto al gas ideal a (T,P,Z): h−h_ig y s−s_ig(T,P), en J/mol y J/mol/K. */
function desv(T,P,Z){

  return {h:RG*T*(Z-1)+(T*da-a)/(2*SQ2*FL.b)*L, s:RG*Math.log(Z-B)+da/(2*SQ2*FL.b)*L};

const T0=273.15, P0=1e5;
const h0=T=>(CP0.a*(T-T0)+CP0.b/2*(T*T-T0*T0)+CP0.c/3*(T*T*T-T0*T0*T0))/MM;

function crudo(T,P,fase){ const r=raicesZ(T,P), Z=fase==='L'?r.ZL:r.ZV, d=desv(T,P,Z);

const _ps0=psat(T0), _r0=crudo(T0,_ps0,'L');
const H_REF=200e3-_r0.h, S_REF=1000-_r0.s;               // cero IIR
function estado(T,P,fase){ const e=crudo(T,P,fase); return {T,P,Z:e.Z,rho:e.rho,h:e.h+H_REF,s:e.s+S_REF}; }
const _cacheSat=new Map();
function sat(T){ const k=Math.round(T*1000); let r=_cacheSat.get(k); if(r) return r;
  const P=psat(T), L=estado(T,P,'L'), V=estado(T,P,'V'); r={T,P,L,V,hf:L.h,hg:V.h,sf:L.s,sg:V.s};
  if(_cacheSat.size>4000) _cacheSat.clear(); _cacheSat.set(k,r); return r; }
function tsat(P){ let lo=230,hi=370; for(let i=0;i<50;i++){ const m=(lo+hi)/2; if(psat(m)<P) lo=m; else hi=m; } return (lo+hi)/2; }
const vapor=(T,P)=>estado(T,P,'V'), liquido=(T,P)=>estado(T,P,'L');
function tDeSV(P,s){ let lo=tsat(P)-0.01,hi=lo+160; for(let i=0;i<34;i++){ const m=(lo+hi)/2; if(vapor(m,P).s<s) lo=m; else hi=m; } return (lo+hi)/2; }
function tDeHV(P,h){ let lo=tsat(P)-0.01,hi=lo+200; for(let i=0;i<34;i++){ const m=(lo+hi)/2; if(vapor(m,P).h<h) lo=m; else hi=m; } return (lo+hi)/2; }

/* ===================== EL CICLO =====================
   Tev, Tcd: temperaturas de saturación (K); sh, sc: sobrecalentamiento y subenfriamiento (K); eta: rendimiento isentrópico. */
function ciclo(Tev,Tcd,sh,sc,eta){
  const se=sat(Tev), sc_=sat(Tcd), Pe=se.P, Pc=sc_.P;
  const e1=vapor(Tev+sh,Pe);
  const T2s=tDeSV(Pc,e1.s), e2s=vapor(T2s,Pc);
  const h2=e1.h+(e2s.h-e1.h)/eta, T2=tDeHV(Pc,h2), e2=vapor(T2,Pc);
  const e3=liquido(Tcd-sc,Pc);
  const h4=e3.h, x4=(h4-se.hf)/(se.hg-se.hf);
  return {Tev,Tcd,Pe,Pc,e1,e2s,e2,e3,h4,x4,qEv:e1.h-h4,qCd:e2.h-e3.h,w:e2.h-e1.h,wis:e2s.h-e1.h,
          copC:(e1.h-h4)/(e2.h-e1.h),copH:(e2.h-e3.h)/(e2.h-e1.h),rp:Pc/Pe,se,sc:sc_};
}

/* ===================== COMPRESOR, VENTILADORES Y CABINA ===================== */
const COMP={Vd:34e-6,Nmax:9000/60,c:0.03,gam:1.12,etaMax:0.72,rpD:3.4,k:0.14,etaMotor:0.92,etaInv:0.96};
const etaVol=(rp)=>Math.max(0.2,1-COMP.c*(Math.pow(rp,1/COMP.gam)-1));
const etaIs=(rp)=>Math.max(0.35,COMP.etaMax-COMP.k*Math.pow(Math.log(rp/COMP.rpD),2));
const HX={UAcab0:240,UAext0:420,Cair0:140,Cext0:520,Pcab0:70,Pext0:130};
const PEN_SC=0.043;
const CAB={UA:100,Tset:295.15,Pocup:100};
const demanda=(Tamb)=>Math.max(400,CAB.UA*(CAB.Tset-Tamb)-CAB.Pocup);
const demandaFrio=(Tamb)=>Math.max(400,CAB.UA*(Tamb-CAB.Tset)+600+CAB.Pocup);   // 600 W de carga solar

/** Calefacción con bomba de calor para una demanda Q (W) a Tamb (K). fc, fe: caudales relativos de aire de la
 *  cabina y exterior; sc: subenfriamiento (K); sh: sobrecalentamiento (K). opt.uaE: fracción del UA exterior que queda
 *  (escarcha); opt.carga: fracción del caudal másico que pasa por la válvula (falta de refrigerante).
 *  Si el compresor no alcanza (régimen > Nmax) el caudal se limita y el calor entregado cae por debajo de Q. */
function calefaccion(Tamb,Q,fc,fe,sc,sh,opt){
  sh=sh===undefined?5:sh; opt=opt||{}; const uaE=opt.uaE===undefined?1:opt.uaE, carga=opt.carga===undefined?1:opt.carga;
  const Ca=HX.Cair0*fc, epsC=1-Math.exp(-HX.UAcab0*Math.pow(fc,0.6)/Ca);
  const TcdSat=CAB.Tset+Q/(epsC*Ca)+3+PEN_SC*sc*sc;   // la zona de subenfriamiento ocupa área del condensador
  const Ce=HX.Cext0*fe, epsE=1-Math.exp(-HX.UAext0*uaE*Math.pow(fe,0.6)/Ce);
  let Tev=Tamb-8, c;
  for(let it=0;it<80;it++){ c=ciclo(Tev,TcdSat,sh,sc,etaIs(sat(TcdSat).P/sat(Tev).P));
    const m=carga*Q/c.qCd, Qev=m*c.qEv, Tn=Tamb-Qev/(epsE*Ce); if(Math.abs(Tn-Tev)<1e-4) break; Tev=0.35*Tev+0.65*Tn; }
  const rp=c.rp, eta=etaIs(rp), ev=etaVol(rp);
  let m=carga*Q/c.qCd; const Nreq=m/c.e1.rho/(COMP.Vd*ev), cap=Nreq>COMP.Nmax; if(cap) m*=COMP.Nmax/Nreq;
  const N=Math.min(Nreq,COMP.Nmax), Qdel=m*c.qCd;
  const Wsh=m*c.w, Wel=Wsh/(COMP.etaMotor*COMP.etaInv);
  const Pfan=HX.Pcab0*Math.pow(fc,3)+HX.Pext0*Math.pow(fe,3);
  const Ptot=Wel+Pfan;
  return {Tamb,Q,Qdel,fc,fe,sc,sh,Tcd:TcdSat,Tev,c,rp,eta,etaVol:ev,m,N,Nrpm:N*60,Nreq:Nreq*60,sobre:cap,Qev:m*c.qEv,Wsh,Wel,Pfan,Ptot,COP:Qdel/Ptot,COPc:c.copH,T2:c.e2.T};
}
/** Refrigeración (A/C): el evaporador de cabina quita Q; el condensador exterior cede al ambiente. */
function refrigeracion(Tamb,Q,fc,fe,sc,sh){
  sh=sh===undefined?5:sh;
  const Ca=HX.Cair0*fc, epsC=1-Math.exp(-HX.UAcab0*Math.pow(fc,0.6)/Ca);
  const TevSat=CAB.Tset-Q/(epsC*Ca)-3;
  const Ce=HX.Cext0*fe, epsE=1-Math.exp(-HX.UAext0*Math.pow(fe,0.6)/Ce);
  let Tcd=Tamb+10, c; const penSC=PEN_SC*sc*sc;
  for(let it=0;it<80;it++){ c=ciclo(TevSat,Tcd,sh,sc,etaIs(sat(Tcd).P/sat(TevSat).P));
    const m=Q/c.qEv, Qcd=m*c.qCd, Tn=Tamb+Qcd/(epsE*Ce)+penSC; if(Math.abs(Tn-Tcd)<1e-4) break; Tcd=0.35*Tcd+0.65*Tn; }
  const rp=c.rp, eta=etaIs(rp), ev=etaVol(rp), m=Q/c.qEv, N=m/c.e1.rho/(COMP.Vd*ev);
  const Wsh=m*c.w, Wel=Wsh/(COMP.etaMotor*COMP.etaInv);
  const Pfan=HX.Pcab0*Math.pow(fc,3)+HX.Pext0*Math.pow(fe,3);
  const Ptot=Wel+Pfan;
  return {Tamb,Q,Qdel:Q,fc,fe,sc,sh,Tcd,Tev:TevSat,c,rp,eta,etaVol:ev,m,N,Nrpm:N*60,Nreq:N*60,sobre:N>COMP.Nmax,Qcd:m*c.qCd,Qev:Q,Wsh,Wel,Pfan,Ptot,COP:Q/Ptot,COPc:c.copC,T2:c.e2.T};
}
const LIM_T2=273.15+130;
/** Mejor combinación (fc,fe,sc) por búsqueda por coordenadas con paso decreciente, respetando régimen y temperatura
 *  de descarga. Devuelve el cálculo completo del mínimo de potencia eléctrica. */
function optimoCalef(Tamb,Q){
  const lim={fc:[0.4,1.8],fe:[0.4,1.8],sc:[0,14]};
  const ev=(x)=>{ const r=calefaccion(Tamb,Q,x.fc,x.fe,x.sc); return (r.sobre||r.T2>LIM_T2)?null:r; };
  let x={fc:1,fe:1,sc:5}, best=ev(x);
  if(!best){ for(const f of [1.3,0.8,1.6]){ x={fc:f,fe:f,sc:5}; best=ev(x); if(best) break; } if(!best) return null; }
  let paso={fc:0.3,fe:0.3,sc:3};
  for(let ronda=0;ronda<5;ronda++){
    let mejoro=true, guard=0;
    while(mejoro&&guard++<12){ mejoro=false;
      for(const k of ['fc','fe','sc']) for(const sg of [1,-1]){ const y=Object.assign({},x); y[k]=clamp(x[k]+sg*paso[k],lim[k][0],lim[k][1]); if(y[k]===x[k]) continue;
        const r=ev(y); if(r&&r.Ptot<best.Ptot-1e-9){ x=y; best=r; mejoro=true; } } }
    paso={fc:paso.fc/2,fe:paso.fe/2,sc:paso.sc/2};
  }
  return best;
}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ===================== VEHÍCULO Y AUTONOMÍA ===================== */
const VEH={m:1850,Crr:0.010,CdA:0.62,eta:0.88,Ebat:62e3*3600,uso:0.90,g:9.81};
const rhoAire=(T)=>101325/(287.05*T);
function potTraccion(vKmh,Tamb){ const v=vKmh/3.6, F=VEH.m*VEH.g*VEH.Crr+0.5*rhoAire(Tamb)*VEH.CdA*v*v; return F*v/VEH.eta; }

function autonomia(vKmh,Tamb,Pclima){ const P=potTraccion(vKmh,Tamb)+Pclima; return VEH.Ebat*VEH.uso/P*(vKmh/3.6)/1000; }

function fusiona(grupo){

    const k=o.material; if(!por.has(k)) por.set(k,[]); por.get(k).push(g); });

}

    for(const g of gs){ const c=g.attributes.position.count; pos.set(g.attributes.position.array,o*3); nor.set(g.attributes.normal.array,o*3); uv.set(g.attributes.uv.array,o*2); o+=c; g.dispose(); }
    const G=new THREE.BufferGeometry(); G.setAttribute('position',new THREE.BufferAttribute(pos,3)); G.setAttribute('normal',new THREE.BufferAttribute(nor,3)); G.setAttribute('uv',new THREE.BufferAttribute(uv,2));

   → válvula de expansión → bobina exterior (evaporador) → compresor. Las partículas, el color del tubo y el punto del

    const c=ciclo(p.fijo.Tev,p.fijo.Tcd,5,5,etaIs(sat(p.fijo.Tcd).P/sat(p.fijo.Tev).P)); Q=3000;
    const m=Q/c.qCd, ev=etaVol(c.rp), N=m/c.e1.rho/(COMP.Vd*ev), Wsh=m*c.w, Wel=Wsh/(COMP.etaMotor*COMP.etaInv);
    r={Tamb:T,Q,Qdel:Q,fc:1,fe:1,sc:5,sh:5,Tcd:p.fijo.Tcd,Tev:p.fijo.Tev,c,rp:c.rp,eta:etaIs(c.rp),etaVol:ev,m,N,Nrpm:N*60,Nreq:N*60,sobre:N>COMP.Nmax,Qev:m*c.qEv,Wsh,Wel,Pfan:200,Ptot:Wel+200,COP:Q/(Wel+200),COPc:c.copH,T2:c.e2.T};
    Pclima=r.Ptot; Pres=Q+70; return cierra({p,clima:'calor',T,Q,r,Pclima,Pres,fijo:true,vK});
  }
  if(clima==='frio'){ Q=demandaFrio(T); r=refrigeracion(T,Q,p.fc,p.fe,p.sc); Pclima=r.Ptot; }
  else { Q=demanda(T); if(clima==='calor'){ r=calefaccion(T,Q,p.fc,p.fe,p.sc,p.sh,p.falla); Pclima=r.Ptot; } else Pclima=Q+HX.Pcab0*Math.pow(p.fc,3); }
  Pres=Q+HX.Pcab0*Math.pow(p.fc,3);
  const o=cierra({p,clima,T,Q,r,Pclima,Pres,vK});

}
function cierra(o){
  const {T,vK}=o;
  o.aut={hp:autonomia(vK,T,o.Pclima),res:autonomia(vK,T,o.Pres),sin:autonomia(vK,T,0)};
  o.Ptr=potTraccion(vK,T);
  o.tabla=o.r?construyeTabla(o.r.c,o.clima==='frio'):null;
  if(o.tabla) pintaColores(o); else pintaTuboNeutro();

}

/* ---- tabla de estados a lo largo del trazado ---- */
const NLUT=500;
function estadoDe(c,n){ return n===1?{h:c.e1.h,p:c.Pe,T:c.e1.T}:n===2?{h:c.e2.h,p:c.Pc,T:c.e2.T}:n===3?{h:c.e3.h,p:c.Pc,T:c.e3.T}:{h:c.h4,p:c.Pe,T:c.Tev}; }
function construyeTabla(c,frio){
  const S=n=>estadoDe(c,n), u=U_;
  const calor=[[0,u.cOut,1,2,'comp'],[u.cOut,u.h0,2,2,'tub'],[u.h0,u.h1,2,3,'cond'],[u.h1,u.v0,3,3,'tub'],[u.v0,u.v1,3,4,'valv'],[u.v1,u.e0,4,4,'tub'],[u.e0,u.e1,4,1,'evap'],[u.e1,1,1,1,'tub']];
  const f=[[0,u.cOut,2,1,'comp'],[u.cOut,u.h0,1,1,'tub'],[u.h0,u.h1,1,4,'evap'],[u.h1,u.v0,4,4,'tub'],[u.v0,u.v1,4,3,'valv'],[u.v1,u.e0,3,3,'tub'],[u.e0,u.e1,3,2,'cond'],[u.e1,1,2,2,'tub']];
  return (frio?f:calor).map(([a,b,sa,sb,k])=>({ua:a,ub:b,A:S(sa),B:S(sb),k}));
}
const lg=Math.log;
/** Estado (h,p,T-aprox) en la abscisa u del trazado según la tabla. */
function estadoEn(tab,u,c){
  u=((u%1)+1)%1;
  for(const s of tab){ if(u>=s.ua&&u<=s.ub+1e-9){ const f=s.ub>s.ua?(u-s.ua)/(s.ub-s.ua):0;
    return {h:mezcla(s.A.h,s.B.h,f),p:Math.exp(mezcla(lg(s.A.p),lg(s.B.p),f)),k:s.k,f}; } }
  const s=tab[tab.length-1]; return {h:s.B.h,p:s.B.p,k:'tub',f:1};
}
/* Colores por fase: líquido azul, mezcla blanca-cian, vapor de frío celeste a rojo según T */
const C_LIQ=new THREE.Color('#2f7dff'), C_LIQ2=new THREE.Color('#62b4ff'), C_MEZ=new THREE.Color('#d9f3ff'), C_V0=new THREE.Color('#9fe3ff'), C_V1=new THREE.Color('#ffd27a'), C_V2=new THREE.Color('#ff8a3a'), C_V3=new THREE.Color('#ff3b22');
function colorVapor(T,out){ const t=aC(T); if(t<=0) return out.copy(C_V0); if(t<40) return out.copy(C_V0).lerp(C_V1,t/40); if(t<85) return out.copy(C_V1).lerp(C_V2,(t-40)/45); return out.copy(C_V2).lerp(C_V3,clamp((t-85)/40,0,1)); }
function propsEn(c,h,p){   // saturación a p por interpolación en ln p entre los dos niveles de presión del ciclo
  const f=c.Pc>c.Pe*1.0001?clamp((lg(p)-lg(c.Pe))/(lg(c.Pc)-lg(c.Pe)),0,1):0;
  return {hf:mezcla(c.se.hf,c.sc.hf,f),hg:mezcla(c.se.hg,c.sc.hg,f),Ts:mezcla(c.Tev,c.Tcd,f)};
}
const _c1=new THREE.Color();
function colorFase(c,h,p,out){
  const s=propsEn(c,h,p);
  if(h<=s.hf){ const sub=clamp((s.hf-h)/25e3,0,1); return out.copy(C_LIQ).lerp(C_LIQ2,1-sub*0.8); }
  if(h<s.hg){ const x=(h-s.hf)/(s.hg-s.hf); colorVapor(s.Ts,_c1); return out.copy(C_LIQ2).lerp(C_MEZ,clamp(x*2.2,0,1)).lerp(_c1,clamp((x-0.45)*1.8,0,1)); }
  const T=tDeHV(p,h); return colorVapor(T,out);
}
function pintaColores(o){
  const c=o.r.c, tab=o.tabla, lut=new Float32Array((NLUT+1)*3), col=new THREE.Color();
  for(let i=0;i<=NLUT;i++){ const e=estadoEn(tab,i/NLUT,c); colorFase(c,e.h,e.p,col); lut.set([col.r,col.g,col.b],i*3); }
  o.lut=lut;
  const ca=TUBO.geometry.attributes.color, nR=11, nRing=NTUB+1; let k=0;
  for(let i=0;i<nRing;i++){ const j=Math.round(i/NTUB*NLUT)*3; for(let r=0;r<nR;r++){ ca.setXYZ(k++,lut[j]*0.9,lut[j+1]*0.9,lut[j+2]*0.9); } }
  ca.needsUpdate=true;
}
function pintaTuboNeutro(){ const ca=TUBO.geometry.attributes.color; for(let i=0;i<ca.count;i++) ca.setXYZ(i,0.42,0.5,0.56); ca.needsUpdate=true; }
function reiniciaCalculo(){
  CALC=calcula(paramsActuales()); SIM.calc=CALC; SIM.ver++;
  aplicaAmbiente(CALC.T);
  if(typeof pintaDockFijo==='function') pintaDockFijo();
  dirty.cop=true;
}
const dirty={cop:true};

/* ===================== 11. LO QUE SE VE ===================== */
const _pos=V3(0,0,0), _sc=V3(1,1,1);
const lut3=(lut,u,out)=>{ const j=Math.round(((u%1)+1)%1*NLUT)*3; return out.setRGB(lut[j],lut[j+1],lut[j+2]); };
const TEMP_AIRE=[[250,'#a9d9ff'],[273.15,'#e4f4ff'],[291,'#ffe9cc'],[303,'#ffc58a'],[333,'#ff9a52']].map(([t,c])=>[t,new THREE.Color(c)]);
function colorAire(T,out){ const a=TEMP_AIRE; if(T<=a[0][0]) return out.copy(a[0][1]); for(let i=1;i<a.length;i++) if(T<=a[i][0]) return out.copy(a[i-1][1]).lerp(a[i][1],(T-a[i-1][0])/(a[i][0]-a[i-1][0])); return out.copy(a[a.length-1][1]); }

function aplicaEscena(dt){
  const C=CALC; if(!C) return;
  SIM.t+=dt;
  const r=C.r, activo=!!r, frio=C.clima==='frio';
  // régimen visual del compresor (a 1/40) y velocidades de los ventiladores
  const rpm=activo?r.Nrpm:0, wC=rpm/60*DOSPI/V_REF_ESCALA;
  SIM.rotor+=wC*dt; SIM.orb+=wC*dt;
  COMP_G.rotor.rotation.x=SIM.rotor;
  COMP_G.orb.position.set(0.27,0.022*Math.sin(SIM.orb),0.022*Math.cos(SIM.orb));
  const wE=(activo?EST_fe(C):0)*7.5, wS=EST_fc(C)*8.5;
  SIM.fanE+=wE*dt; SIM.sop+=wS*dt;
  VENT_E.userData.rotor.rotation.y=SIM.fanE; DUCTO.userData.soplador.rotation.z=-SIM.sop;
  // refrigerante
  const flujo=activo?clamp(r.m/0.016,0.25,2.4):0, dir=frio?-1:1;
  SIM.fase+=dir*0.040*flujo*dt;
  if(activo){
    const lut=C.lut, col=_col;
    for(let i=0;i<NREF;i++){ const u=((i/NREF+SIM.fase)%1+1)%1; puntoEn(u,_pos);
      const e=estadoEn(C.tabla,u,r.c); const vap=e.h>propsEn(r.c,e.h,e.p).hg, liq=e.h<propsEn(r.c,e.h,e.p).hf;
      const rad=liq?0.021:(vap?0.027:0.025);
      _m4.compose(_pos,_q0,_sc.set(rad,rad,rad)); PART_REF.setMatrixAt(i,_m4); lut3(lut,u,col); PART_REF.setColorAt(i,col); }
  } else { for(let i=0;i<NREF;i++){ _m4.compose(_pos,_q0,_sc.set(0,0,0)); PART_REF.setMatrixAt(i,_m4); } }
  PART_REF.instanceMatrix.needsUpdate=true; PART_REF.instanceColor.needsUpdate=true;
  // válvula: la apertura sigue al caudal
  VALVULA.userData.aguja.position.y=0.03+0.07*clamp(flujo-1,-0.6,1);
  // calentador resistivo
  const ptc=C.clima==='resist'; M.resist.emissiveIntensity+=((ptc?2.6:0)-M.resist.emissiveIntensity)*clamp(dt*4,0,1);
  // aire de la cabina: sale del soplador, atraviesa la bobina (o el PTC) y llega a la cabina
  const Ca=HX.Cair0*C.p.fc, Qc=C.clima==='frio'?-C.Q:C.Q, Taire=CAB.Tset+Qc/Ca;
  const qaire=colorAire(clamp(Taire,255,345),new THREE.Color()), cpre=colorAire(CAB.Tset,new THREE.Color());
  const vc=0.17*C.p.fc;
  for(let i=0;i<SEM_CAB.length;i++){ const s=SEM_CAB[i], f=(s.f+SIM.t*vc*s.v)%1, x=2.00-f*3.35;
    const fuera=x<0.72, y=2.36+s.y*(fuera?0.55:0.9)+(fuera?clamp((0.72-x)*0.42,0,0.7)*(0.5+s.f):0), z=s.z*(fuera?1.0:0.9);
    const g=Math.pow(Math.sin(Math.PI*f),0.6)*0.024*(1+0.4*s.v);
    _m4.compose(_pos.set(x,y,z),_q0,_sc.set(g,g,g)); PART_CAB.setMatrixAt(i,_m4);
    PART_CAB.setColorAt(i,x>1.85?cpre:qaire); }
  PART_CAB.instanceMatrix.needsUpdate=true; PART_CAB.instanceColor.needsUpdate=true;
  // aire exterior: sube por la bobina; sólo si el ventilador exterior trabaja
  const Ce=HX.Cext0*C.p.fe, dTe=activo?(frio?r.Qcd:-r.Qev)/Ce:0, Tsal=C.T+dTe;
  const cIn=colorAire(C.T,new THREE.Color()), cOut=colorAire(clamp(Tsal,235,345),new THREE.Color());
  const ve=0.20*C.p.fe;
  for(let i=0;i<SEM_EXT.length;i++){ const s=SEM_EXT[i], f=(s.f+SIM.t*ve*s.v)%1, y=0.04+f*2.35;
    const w=f<0.14?1+(0.14-f)/0.14*1.6:(f>0.62?1+(f-0.62)*1.6:1), rr=s.r*0.33*w;
    const g=activo?Math.pow(Math.sin(Math.PI*f),0.5)*0.02:0;
    _m4.compose(_pos.set(-1.06+Math.cos(s.a)*rr*1.05,y,Math.sin(s.a)*rr*0.9),_q0,_sc.set(g,g,g)); PART_EXT.setMatrixAt(i,_m4);
    PART_EXT.setColorAt(i,_col.copy(cIn).lerp(cOut,clamp((f-0.28)/0.2,0,1))); }
  PART_EXT.instanceMatrix.needsUpdate=true; PART_EXT.instanceColor.needsUpdate=true;
  // nieve: sólo con el ambiente cerca o por debajo de 2 °C
  const nieva=C.T<=275.5;
  for(let i=0;i<SEM_NIEVE.length;i++){ const s=SEM_NIEVE[i], f=(s.f+SIM.t*0.07*s.v)%1, y=4.4-f*4.5, g=nieva?0.011*(0.7+0.5*s.v):0;
    _m4.compose(_pos.set(s.x+Math.sin(SIM.t*0.6+s.s)*0.12,y,s.z+Math.cos(SIM.t*0.5+s.s)*0.12),_q0,_sc.set(g,g,g)); NIEVE.setMatrixAt(i,_m4); }
  NIEVE.instanceMatrix.needsUpdate=true;
  // cabina: color del volumen de aire según el modo
  const warm=!frio; CABINA.userData.glow.material.color.set(warm?'#ffb26b':'#8fe0ff');
  LUZ.cabina.color.set(warm?'#ffb070':'#9fe6ff'); LUZ.cabina.intensity=1.1;
  // el punto de referencia del diagrama p–h (una partícula marcada) usa la misma abscisa
  SIM.uRef=((SIM.fase%1)+1)%1;
}
const EST_fe=C=>C.clima==='resist'?0:C.p.fe, EST_fc=C=>C.p.fc;

/* ===================== 12. CÁMARAS =====================
   La escena se encuadra con el hueco que dejan la guía y el dock: la cámara se aleja lo justo para que la caja del
   «objeto» (ancho × alto en metros) quepa entera en ese hueco, y la proyección se desplaza para centrarla en él.
   Además el objeto nunca pasa del 66 % del alto del lienzo. */
function seVe(e){ if(!e) return false; const b=e.getBoundingClientRect(); return b.width>0&&b.height>0&&getComputedStyle(e).display!=='none'; }
const esEstrecho=()=>document.body.classList.contains('estrecho');
function huecoLibre(){
  const W=innerWidth, H=innerHeight, r=id=>{ const e=el(id); return seVe(e)?e.getBoundingClientRect():null; };
  const vb=r('vbar'), tb=r('tbar');
  if(esEstrecho()){ const tabs=r('tabs'); return {x0:8,x1:W-8,y0:(vb?vb.bottom:56)+6,y1:(tb?tb.top:(tabs?tabs.top:H))-6}; }
  const hud=r('hud'), pan=r('panel'); let x0=8,x1=W-8,y0=60,y1=H-12;
  if(hud) x0=hud.right+12; if(pan) x1=pan.left-12; if(vb) y0=Math.max(y0,vb.bottom+8); if(tb) y1=Math.min(y1,tb.top-8);
  return {x0,x1,y0,y1};
}
function centraEnHueco(){
  const H=huecoLibre(), W=innerWidth, Hh=innerHeight, dx=(H.x0+H.x1)/2-W/2, dy=(H.y0+H.y1)/2-Hh/2;
  camera.setViewOffset(W,Hh,-dx,-dy,W,Hh); camera.updateProjectionMatrix();
}
const VISTAS={
  banco:{dir:V3(-0.30,0.22,1),anc:()=>V3(0.28,1.55,0),toff:V3(0,0,0),obj:()=>({w:4.55,h:3.55}),fov:34,tope:0.64},
  compresor:{dir:V3(-0.25,0.20,1),anc:()=>V3(1.15,0.80,0.05),toff:V3(0,0,0),obj:()=>({w:1.8,h:1.3}),fov:34,tope:0.64},
  cabina:{dir:V3(-0.22,0.12,1),anc:()=>V3(0.48,2.30,0),toff:V3(0,0,0),obj:()=>({w:4.5,h:1.75}),fov:34,tope:0.64},
  exterior:{dir:V3(-0.40,0.55,1),anc:()=>V3(-1.05,0.95,0),toff:V3(0,0,0),obj:()=>({w:1.6,h:2.1}),fov:34,tope:0.66},
};
const CAM={off:V3(-1.5,1.2,6),toff:V3(0,0,0),auto:true,previo:null,k:1,dur:1};
function fovVista(v){ return innerWidth<innerHeight*0.9?46:VISTAS[v].fov; }
function distanciaFit(w,h,fov,tope){
  const Hu=huecoLibre(), W=innerWidth, Hh=innerHeight, tv=Math.tan(fov*Math.PI/360), th=tv*(W/Hh);
  const wF=Math.max(80,Hu.x1-Hu.x0)/W, hF=Math.max(80,Hu.y1-Hu.y0)/Hh;
  const D=1.06*Math.max(w/(2*th*wF),h/(2*tv*hF));
  return Math.max(D,h/(2*tv*(tope||0.66)));
}
function ofsDeseado(v){
  const V=VISTAS[v], o=V.obj(), fov=fovVista(v), D=distanciaFit(o.w,o.h,fov,V.tope);
  return {off:V.dir.clone().normalize().multiplyScalar(D),toff:V.toff.clone(),fov};
}
function ponVista(v,dur){
  EST.vista=v; CAM.auto=true; CAM.dur=dur===undefined?1.0:dur;
  if(typeof pintaBarras==='function') pintaBarras();
  if(CAM.dur<=0.01){ const A=VISTAS[v].anc(), d=ofsDeseado(v); CAM.off.copy(d.off); CAM.toff.copy(d.toff); camera.fov=d.fov; camera.updateProjectionMatrix();
    camera.position.copy(A).add(CAM.off); controls.target.copy(A).add(CAM.toff); CAM.previo=A.clone(); }
}
function pasaCam(dt){
  const V=VISTAS[EST.vista], P=V.anc();
  if(CAM.auto){
    const d=ofsDeseado(EST.vista), k=1-Math.exp(-dt/Math.max(0.05,(CAM.dur||1)*0.30));
    CAM.off.lerp(d.off,k); CAM.toff.lerp(d.toff,k);
    if(Math.abs(camera.fov-d.fov)>0.05){ camera.fov+=(d.fov-camera.fov)*k; camera.updateProjectionMatrix(); }
    camera.position.copy(P).add(CAM.off); controls.target.copy(P).add(CAM.toff);
  } else if(CAM.previo){ const dP=P.clone().sub(CAM.previo); camera.position.add(dP); controls.target.add(dP); }
  CAM.previo=P.clone();
}

  } else h+=htmlGuia();

    <div class="fl">P<sub>el</sub> = ṁ·(h₂−h₁)/(η<sub>mot</sub>·η<sub>inv</sub>) + P<sub>ventiladores</sub>, con P<sub>vent</sub> ∝ caudal³. La autonomía a velocidad constante es E<sub>útil</sub>/(P<sub>tracción</sub>+P<sub>clima</sub>)·v.</div>
  </div></details>
  <details id="dSim"><summary>Simplificaciones</summary><div class="cuerpo"><ul class="no">
    <li>Régimen permanente: el ciclo se resuelve para la demanda de la cabina, sin transitorio de calentamiento. La demanda es UA·(22 °C − T<sub>ext</sub>) − 100 W de ocupante, con UA = 100 W/K.</li>
    <li>Intercambiadores por efectividad-NTU con UA ∝ caudal<sup>0,6</sup>; caídas de presión nulas; la zona de subenfriamiento ocupa área del condensador (+0,043·sc² K).</li>
    <li>Compresor: ηis con un máximo en la relación de presiones de diseño del espiral (3,4), ηv por espacio muerto, máximo 9 000 rpm. No hay escarcha, deshielo ni válvula de 4 vías (se invierte el sentido).</li>
    <li>R134a con cp ideal polinómico de libro; las entalpías de vapor de Peng–Robinson quedan ≈ 1 % por encima de NIST. Los giros visuales van a 1/40 de la real. No es CFD ni una certificación.</li>
  </ul><div class="src">Peng y Robinson (1976) · Poling, Prausnitz y O'Connell, <i>The Properties of Gases and Liquids</i> · NIST WebBook, R134a (Tillner-Roth y Baehr).</div></div></details></div>`;
  H.innerHTML=h; H.classList.toggle('guia',EST.modo!=='marcha'); enlazaHUD(); ajustaHoja();

/* ===================== 17. DISPOSICIÓN: ANCHO, ESTRECHO, MÓVIL =====================

  b.classList.toggle('estrecho',estrecho); b.classList.toggle('movil',movil); b.classList.toggle('ancho',estrecho&&!movil);

  el('tabs').querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('on',b.classList.contains('t-'+t.dataset.tab)));
}
function ajustaHoja(){
  const b=document.body; if(!b.classList.contains('estrecho')) return;
  const H=innerHeight, movil=b.classList.contains('movil'), base=Math.round(clamp(H*(movil?0.40:0.43),240,450));
  let hh=base; const hud=el('hud');
  if(movil&&b.classList.contains('t-panel')) hh=Math.round(clamp(H*0.55,240,540));
  if(b.classList.contains('t-hud')&&seVe(hud)){
    const prev=hud.style.height; hud.style.height='auto'; const pide=Math.ceil(hud.scrollHeight)+2; hud.style.height=prev;
    hh=Math.round(clamp(pide,240,Math.max(base,H*(movil?0.45:0.56)))); }
  const ant=parseFloat(b.style.getPropertyValue('--hojaH'))||0;
  if(Math.abs(ant-hh)>1){ b.style.setProperty('--hojaH',hh+'px'); colocaBarras(); centraEnHueco(); }
}

/* ===================== 18. EL LABORATORIO GUIADO =====================
   Tres fases: 1 · Predice (el COP máximo de Carnot entre dos temperaturas), 2 · Ajusta (los caudales de aire de la
   cabina y del exterior y el subenfriamiento para calentar a bajo cero con la mínima energía: el consumo sólo aparece
   al validar, y el óptimo es INTERIOR: más aire baja la presión pero gasta en ventiladores) y 3 · Diagnostica (¿qué le
   pasa a esta bomba de calor?, sólo con lo que se ve en el dock) y cierra con un quiz de tres preguntas. Cuatro
   validaciones fallidas cambian el escenario (no se aprueba por eliminación). */
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const barajar=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const RETO={intentos:0,resiembras:0,fallos1:0,fallos2:0,fallos3:0,pistas:0,hecho:false,quizAcierto:0};
const GUIA={phase:0,paso:'predice',iniciado:false,dxOk:false,r1:null,r2:null,dx:null,dxRes:null,orden:null,quiz:null,quizResp:-1,quizCorrecta:-1,quizN:0};

/* ---------- Fase 1 · Predice ---------- */
const CASOS1=[[-20,50],[-10,45],[-15,55],[-5,40],[-25,45],[0,55],[-12,48],[-18,52]];
function sorteaCaso1(){ const p=GUIA.r1&&GUIA.r1.i; let i; do{ i=Math.floor(Math.random()*CASOS1.length); }while(i===p); const [te,tc]=CASOS1[i];
  GUIA.r1={i,te,tc,ans:(tc+273.15)/(tc-te)}; }
function checkPredice(){
  const raw=String((el('ansV')||{}).value||'').trim().replace(/\s| /g,'').replace(',','.'), v=parseFloat(raw), r=GUIA.r1, ok=r.ans;
  if(isNaN(v)){ feedback('bad','Escribe un número','Escribe el COP máximo (con coma o punto decimal).'); return; }
  RETO.intentos++;
  if(Math.abs(v-ok)<=Math.max(0.12,0.03*ok)){
    RETO.fallos1=0; sonido.bien();
    const c=ciclo(273.15+r.te,273.15+r.tc,5,5,etaIs(sat(273.15+r.tc).P/sat(273.15+r.te).P));
    feedback('good','¡Correcto! ✓',`COP<sub>Carnot</sub> = T<sub>c</sub> / (T<sub>c</sub> − T<sub>f</sub>) = ${fN(r.tc+273.15,2)} / ${fN(r.tc-r.te,0)} = <b>${fN(ok,2)}</b>. El ciclo real de R134a entre esas mismas temperaturas (compresión con η<sub>is</sub> = ${fN(etaIs(c.rp)*100,0)} % y 5 K de subenfriamiento) da <b>${fN(c.copH,2)}</b>: el ${fN(c.copH/ok*100,0)} % del máximo. Cuanto mayor es el salto de temperatura, menor es el COP.`,true);
    paso('decide'); prepararDecide();
  } else {
    RETO.fallos1++; sonido.mal(); const d=v>ok?'alto':'bajo';
    if(RETO.fallos1>=3){ RETO.fallos1=0; RETO.resiembras++; sorteaCaso1(); feedback('bad','Tres intentos fallidos','Cambia el caso. Recuerda: temperaturas absolutas, en kelvin, y el denominador es la diferencia entre la caliente y la fría.'); reiniciaCalculo(); pintaHUD(); }
    else { feedback('bad','Revisa el cálculo',`Tu resultado (${fN(v,v%1?2:0)}) está ${d}. Pasa las dos temperaturas a kelvin antes de operar. (intentos fallidos: ${RETO.fallos1}/3)`); const t=el('d_try'); if(t) t.textContent=RETO.fallos1; }
  }
}

/* ---------- Fase 2 · Ajusta los caudales ---------- */
const TAMBS=[-10,-14,-18];
function prepararDecide(){
  let T; do{ T=pickOne(TAMBS); }while(GUIA.r2&&TAMBS.length>1&&T===GUIA.r2.Tc&&RETO.resiembras>0&&Math.random()<0.9);
  const Tk=T+273.15, Q=demanda(Tk), opt=optimoCalef(Tk,Q);
  GUIA.r2={Tc:T,Tamb:Tk,Q,opt,th:opt.Ptot*1.03,fc:0.7,fe:1.5,sc:10,validado:false,res:null,intentos:0};
  reiniciaCalculo(); pintaHUD();
}
function validarDecide(){
  const r=GUIA.r2; if(!r) return;
  const R=calefaccion(r.Tamb,r.Q,r.fc,r.fe,r.sc); r.res=R; r.validado=true; r.intentos++; RETO.intentos++;
  const okCap=!R.sobre&&R.T2<=LIM_T2, ok=okCap&&R.Ptot<=r.th, resist=r.Q+HX.Pcab0*Math.pow(r.fc,3);
  reiniciaCalculo();
  const base=`Gastas <b>${fN(R.Ptot)} W</b> (compresor ${fN(R.Wel)} W y ventiladores ${fN(R.Pfan)} W) para dar ${fN(R.Qdel)} W a la cabina: COP ${fN(R.COP,2)}. El límite era <b>${fN(r.th)} W</b>; el calentador resistivo gastaría ${fN(resist)} W.`;
  if(ok){
    RETO.fallos2=0; sonido.bien();
    feedback('good','¡Lo conseguiste! ✓',`${base} La mejor combinación que encuentra el motor (aire de cabina ×${fN(r.opt.fc,2)}, exterior ×${fN(r.opt.fe,2)}, subenfriamiento ${fN(r.opt.sc,1)} K) gasta ${fN(r.opt.Ptot)} W. Más aire baja la presión de condensación y sube la de evaporación, pero los ventiladores gastan con el cubo del caudal: por eso el óptimo está en el interior, no en un extremo.`,true);
    pintaHUD(); paso('diag'); iniciaDiag();
  } else {
    RETO.fallos2++; sonido.mal();
    let msg=base+' '; if(R.sobre) msg+='El compresor llega a su régimen máximo y no entrega todo el calor. '; else if(R.T2>LIM_T2) msg+='La descarga pasa de 130 °C. '; else msg+='Todavía gastas demasiado. ';
    msg+=R.Pfan>0.22*R.Ptot?'Los ventiladores se llevan una parte grande: mira cuánto aire mueves.':'Mira la presión alta y la baja en el dock: el compresor trabaja más cuanto mayor es la diferencia.';
    if(RETO.fallos2>=4){ RETO.fallos2=0; RETO.resiembras++; feedback('bad','Cuatro validaciones sin lograrlo',msg+' Cambia el escenario: la temperatura exterior es otra.',true); prepararDecide(); }
    else { feedback('bad','Todavía no',msg+` (validaciones fallidas: ${RETO.fallos2}/4)`,true); pintaHUD(); }
  }
}

/* ---------- Fase 3 · Diagnóstico y quiz ---------- */
const CASOS_DX=[
  {k:'escarcha',t:'Escarcha en la bobina exterior',Tc:-6,fc:1,fe:1,sc:5,sh:5,falla:{uaE:0.22}},
  {k:'fuga',t:'Falta de refrigerante',Tc:-6,fc:1,fe:1,sc:0.3,sh:22,falla:{carga:0.62}},
  {k:'cabina',t:'Poco aire en la cabina',Tc:-6,fc:0.38,fe:1,sc:5,sh:5,falla:null},
];
function iniciaDiag(){
  const p=GUIA.dx&&GUIA.dx.k; let c; do{ c=pickOne(CASOS_DX); }while(c.k===p);
  GUIA.dx=c; GUIA.dxOk=false; GUIA.orden=barajar(CASOS_DX.map(x=>x.k));
  const T=c.Tc+273.15, r=calefaccion(T,demanda(T),c.fc,c.fe,c.sc,c.sh,c.falla||undefined);
  GUIA.dxRes={c:r.c,sh:c.sh,scm:c.sc,Qdel:r.Qdel};
  reiniciaCalculo(); pintaHUD(); pintaDockFijo();
}
function diagnostica(k){
  if(!GUIA.dx||GUIA.dxOk) return; RETO.intentos++;
  if(k===GUIA.dx.k){
    GUIA.dxOk=true; RETO.fallos3=0; sonido.bien();
    feedback('good','Diagnóstico correcto ✓',explicaDx(GUIA.dx.k),true);
    pintaDockFijo(); paso('quiz'); iniciaQuiz();
  } else {
    RETO.fallos3++; sonido.mal();
    if(RETO.fallos3>=3){ RETO.fallos3=0; RETO.resiembras++; feedback('bad','Tres intentos fallidos','Es otro caso: compara la presión baja, el sobrecalentamiento, el subenfriamiento y la temperatura de descarga con lo que daría una bomba sana.',true); iniciaDiag(); }
    else { feedback('bad','No es ese',noEs(k)+` (intentos fallidos: ${RETO.fallos3}/3)`,true); pintaHUD(); }
  }
}
function explicaDx(k){
  if(k==='escarcha') return 'Escarcha en la bobina exterior: el hielo estorba el paso del aire y del calor, la bobina ya no puede absorber lo que pide el ciclo y el refrigerante se evapora a una temperatura mucho más baja. Resultado: <b>presión baja muy baja</b> con sobrecalentamiento y subenfriamiento normales, y más régimen del compresor para dar menos calor. Se resuelve con un ciclo de deshielo.';
  if(k==='fuga') return 'Falta de refrigerante: la válvula deja pasar poco caudal, el evaporador se queda corto de líquido y el vapor sale muy sobrecalentado, y no queda líquido para subenfriar a la salida del condensador. Resultado: <b>sobrecalentamiento alto, subenfriamiento casi nulo</b>, presiones algo bajas y poco calor a la cabina.';
  return 'Poco aire en la cabina: la bobina condensadora no se enfría y su temperatura de saturación sube para poder ceder el calor. Resultado: <b>presión alta muy alta</b> y descarga muy caliente, con la presión baja casi normal. Más caudal de aire lo corrige, pero cada soplador gasta con el cubo del caudal.';
}
function noEs(k){
  if(k==='escarcha') return 'Con escarcha la presión baja se hunde mientras la alta no sube: mira si la presión alta es normal y si la baja está por los suelos.';
  if(k==='fuga') return 'Con falta de refrigerante el sobrecalentamiento se dispara y el subenfriamiento desaparece: comprueba esas dos cifras.';
  return 'Con poco aire en la cabina la que se dispara es la presión alta y la temperatura de descarga: comprueba si es el caso.';

const QUIZ=[

/* ===================== 19. SONIDO (sintetizado) =====================
   Un zumbido grave del compresor cuya altura sigue al régimen (muy atenuado) y los avisos de acierto y fallo. */
const sonido=(function(){
  let ctx=null,on=true,master=null,ult=0,zum=null,zg=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      zum=ctx.createOscillator(); zg=ctx.createGain(); zum.type='sawtooth'; zum.frequency.value=70; zg.gain.value=0; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=260; zum.connect(lp); lp.connect(zg); zg.connect(master); zum.start();
    }catch(e){ ctx=null; } }
  function tono(f,dur,vol,tipo){ if(!ctx||!on) return; const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); ult=f; }
  return {init,
    zumbido:(rpm)=>{ if(!ctx||!zum) return; const t=ctx.currentTime; zum.frequency.setTargetAtTime(40+rpm/60,t,0.2); zg.gain.setTargetAtTime(on&&rpm>0?0.012:0,t,0.2); },
    bien:()=>{ tono(660,0.1,0.05); setTimeout(()=>tono(990,0.14,0.05),110); },
    mal:()=>tono(190,0.18,0.05,'sawtooth'),
    toggle(){ on=!on; return on; }, get on(){ return on; }, get ctx(){ return ctx; }, get freq(){ return ult; }};
})();

/* ===================== 20. CALIDAD Y TAMAÑO ===================== */
function aplicaCalidad(){
  const alta=calAlta();
  renderer.setPixelRatio(Math.max(Math.min(devicePixelRatio,alta?2:1.5),Math.min(devicePixelRatio,1.5)>1?1.25:1));
  const ms=alta?2048:1024; if(LUZ.sol.shadow.mapSize.x!==ms){ LUZ.sol.shadow.mapSize.set(ms,ms); if(LUZ.sol.shadow.map){ LUZ.sol.shadow.map.dispose(); LUZ.sol.shadow.map=null; } }
  const sm=alta?4:0; for(const rt of [composer.renderTarget1,composer.renderTarget2]) if(rt.samples!==sm){ rt.samples=sm; rt.dispose(); }
  bloom.enabled=alta;
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth,innerHeight);
  pintaBarras();
}
function alCambiarTamano(){
  disposicion();
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  colocaBarras(); if(typeof ponVista==='function'&&CALC) ponVista(EST.vista,0.001); centraEnHueco();
}

/* ===================== 21. EL LAZO: UN SOLO RELOJ =====================
   El tiempo simulado avanza dt·velocidad en cada cuadro, y con ESE tiempo se mueven el refrigerante, el punto del
   diagrama p–h, el compresor y los ventiladores, y se pintan las gráficas del dock. */
const reloj=new THREE.Clock();
renderer.info.autoReset=false;
let tDock=0, tLienzo=0, tSon=0;
const FPS={n:0,t0:0,v:0};
function cuadro(){
  requestAnimationFrame(cuadro);
  const dt=Math.min(reloj.getDelta(),0.1), t=reloj.elapsedTime;
  FPS.n++; if(t-FPS.t0>=1){ FPS.v=Math.round(FPS.n/(t-FPS.t0)); FPS.n=0; FPS.t0=t; }
  aplicaEscena(EST.pausa?0:dt*EST.vel);
  pasaCam(dt);
  if(t-tSon>0.4){ tSon=t; sonido.zumbido(CALC&&CALC.r&&!EST.pausa?CALC.r.Nrpm:0); }
  if(t-tDock>0.066){ tDock=t; pintaDock(); pintaReloj(); }
  if(t-tLienzo>0.033&&seVe(el('panel'))){ tLienzo=t; pintaGraficas(); }
  controls.update();
  renderer.info.reset(); composer.render();
  colocaRotulos();
}

   Abre funcionando: la bomba de calor calienta la cabina a −10 °C, con la nieve cayendo y el refrigerante circulando.
   Se adelanta el reloj 1,5 s para que el primer cuadro ya muestre el flujo repartido por todo el circuito. */

centraEnHueco();

/** Mide el objeto en lo VISIBLE: se pinta sin plataforma, suelo ni fondo sobre magenta puro y se toma la caja de los píxeles que no son magenta. */
function mideObjeto(){
  const ocultos=[NIEVE,PART_EXT].filter(o=>o.visible); ocultos.forEach(o=>{ o.visible=false; }); PLATAFORMA.visible=false; scene.traverse(o=>{ if(o.userData&&o.userData.fondo&&o.visible){ o.visible=false; ocultos.push(o); } });
  const bg=scene.background, fog=scene.fog; scene.background=null; scene.fog=null; renderer.setClearColor(0xff00ff,1);
  renderer.render(scene,camera);
  const c=renderer.domElement, W=c.width, H=c.height, t=document.createElement('canvas'); t.width=W; t.height=H; const g=t.getContext('2d',{willReadFrequently:true}); g.drawImage(c,0,0);
  const d=g.getImageData(0,0,W,H).data; let x0=1e9,x1=-1,y0=1e9,y1=-1;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=(y*W+x)*4; if(!(d[i]>235&&d[i+1]<30&&d[i+2]>235)){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  PLATAFORMA.visible=true; for(const o of ocultos) o.visible=true; scene.background=bg; scene.fog=fog; renderer.setClearColor(0x000000,1);
  const k=W/innerWidth; return {x0:x0/k,x1:x1/k,y0:y0/k,y1:y1/k,altoPx:(y1-y0)/k,anchoPx:(x1-x0)/k,fracAlto:(y1-y0)/H,fracAncho:(x1-x0)/W,hueco:huecoLibre(),W:innerWidth,H:innerHeight};
}

  state:()=>({paso:GUIA.paso,phase:GUIA.phase,r1:GUIA.r1,r2:GUIA.r2&&{Tc:GUIA.r2.Tc,th:GUIA.r2.th,opt:GUIA.r2.opt&&{fc:GUIA.r2.opt.fc,fe:GUIA.r2.opt.fe,sc:GUIA.r2.opt.sc,P:GUIA.r2.opt.Ptot},res:GUIA.r2.res&&{P:GUIA.r2.res.Ptot}},dx:GUIA.dx&&GUIA.dx.k}),
  audioState:()=>({ctxState:sonido.ctx?sonido.ctx.state:'none',soundOn:sonido.on,freq:sonido.freq}),
  setMode:(m)=>setMode(m,true),
  pon:(o)=>{ Object.assign(EST,o); pintaHUD(); reiniciaCalculo(); pintaBarras(); },
  avanza:(s)=>{ aplicaEscena(s); },
  vista:(v)=>ponVista(v,0.001),
  pausa:(on)=>{ EST.pausa=!!on; pintaBarras(); },
  rotulos:(on)=>{ ROT.on=!!on; pintaRotulos(); pintaBarras(); },
  calidad:(n)=>{ CAL.nivel=n; aplicaCalidad(); },
  paso:(p)=>{ if(EST.modo!=='guia') setMode('guia',true); paso(p); if(p==='decide') prepararDecide(); if(p==='diag') iniciaDiag(); if(p==='quiz'){ iniciaDiag(); paso('quiz'); iniciaQuiz(); } },
  setDecide:(fc,fe,sc)=>{ const r=GUIA.r2; if(r){ r.fc=fc; r.fe=fe; r.sc=sc; reiniciaCalculo(); pintaHUD(); } },
  dx:(k)=>{ GUIA.dx=CASOS_DX.find(c=>c.k===k); iniciaDxFijo(); },
});
