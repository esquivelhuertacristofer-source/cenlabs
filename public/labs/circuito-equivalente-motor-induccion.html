<style>
  :root{
    --bg:#08201C;--panel:rgba(9,26,23,.86);--line:#1E3A34;--ink:#EAF4F1;
    --dim:#8FB3AC;--accent:#2A9D8F;--accent2:#4FD1C5;--hv:#FFB703;--good:#34d399;--bad:#f4475e;
    --mono:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;--disp:'Outfit','Arial Black',Impact,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,Segoe UI,Roboto,sans-serif}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20;background:linear-gradient(180deg,rgba(10,13,18,.92),transparent);pointer-events:none}
  .brand{font-family:var(--disp);font-weight:bold;font-size:16px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .lt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

  .badge{position:fixed;top:16px;right:20px;z-index:20;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,209,102,.12);color:var(--hv);border:1px solid rgba(255,209,102,.35);padding:6px 12px;border-radius:20px}

  .hud{position:fixed;top:70px;left:18px;z-index:15;max-width:330px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-height:calc(100vh - 150px);overflow-y:auto}
  .hud .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .hud h2{font-size:19px;line-height:1.15;margin-bottom:9px}
  .hud p{font-size:13px;line-height:1.55;color:var(--dim);margin-bottom:10px}
  .hud .formula{font-family:var(--mono);color:var(--accent2);text-align:center;font-size:12.5px;margin:8px 0;padding:8px;background:rgba(0,0,0,.25);border-radius:8px;line-height:1.5}
  .hud .src{font-size:10.5px;color:#7a8894;font-style:italic;margin-top:4px;line-height:1.5}
  .legend{display:flex;flex-direction:column;gap:6px;margin:12px 0;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:10px}
  .legend .li{display:flex;align-items:center;gap:8px;font-size:11px;color:#c4d0da}
  .legend .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .fid{margin:10px 0 2px;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:10px;border:1px solid rgba(79,209,197,.18)}
  .fid .ft{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);margin-bottom:6px}
  .fid .fl{font-size:11px;color:#c4d0da;line-height:1.5;margin-bottom:5px}
  .fid .fl b{color:var(--ink)}
  .fid .fl.no b{color:var(--hv)}

  .panel{position:fixed;top:70px;right:18px;z-index:15;width:262px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:16px;max-height:calc(100vh - 150px);overflow-y:auto}
  .panel h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:2px 0 10px}
  .panel h4.sec{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .g{margin-bottom:6px}
  .gl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .gl b{color:var(--accent2)}
  .gl b.good{color:var(--good)}.gl b.warn{color:var(--hv)}.gl b.bad{color:var(--bad)}
  .modebar{display:flex;gap:5px;margin-bottom:8px}
  .modebar .b{flex:1;padding:8px 4px;font-size:11px}
  .btns{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .b{font-family:system-ui;font-size:12.5px;padding:10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#1b242f;color:var(--ink);transition:.15s;text-align:center}
  .b:hover{border-color:var(--accent);background:#202c38}
  .b.on{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:bold}
  .b.primary{background:var(--accent);color:#06120f;border-color:var(--accent);font-weight:bold}
  .b.auto{border-color:var(--hv);color:var(--hv);background:rgba(255,183,3,.10);font-weight:bold}
  .b.auto:hover{background:rgba(255,183,3,.18);border-color:var(--hv)}
  .b.auto:disabled{opacity:.6;cursor:default}
  .b.dx{text-align:left;font-size:12px}
  .b.dx.right{background:rgba(52,211,153,.18);border-color:var(--good);color:var(--good);font-weight:bold}
  .b.dx.wrong{background:rgba(244,71,94,.15);border-color:var(--bad);color:var(--bad)}
  .console{font-family:var(--mono);font-size:11px;line-height:1.55;color:#c4d0da;background:rgba(0,0,0,.28);border-radius:9px;padding:10px 12px;margin-bottom:8px;min-height:56px}
  .console .dtc{color:var(--bad);font-weight:bold}
  .console .ok{color:var(--good)}
  .console .mono{color:var(--dim)}

  .hint{position:fixed;bottom:18px;left:18px;z-index:14;font-family:var(--mono);font-size:10px;color:var(--dim);background:var(--panel);padding:7px 12px;border-radius:9px;border:1px solid var(--line)}
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(18,24,32,.95);border:1px solid var(--accent);padding:10px 20px;border-radius:40px;font-family:var(--mono);font-size:12px;opacity:0;transition:.3s;pointer-events:none;max-width:80vw;text-align:center}
  .toast.show{opacity:1}
  .soundBtn{position:fixed;top:14px;right:18px;z-index:21;font-size:16px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--dim);transition:.15s}
  .soundBtn.on{color:var(--accent);border-color:var(--accent)}
  .soundBtn:hover{transform:scale(1.08)}
  .inspectHint{position:fixed;bottom:18px;right:18px;z-index:14;font-family:var(--mono);font-size:10px;color:var(--accent2);background:var(--panel);padding:7px 12px;border-radius:9px;border:1px solid var(--line)}

  @media(max-width:820px){
    .hud,.panel{position:fixed;left:8px;right:8px;top:auto;bottom:8px;max-width:none;width:auto;max-height:42vh;overflow-y:auto}
    .hud{bottom:calc(8px + 42vh + 8px)}
    .hint,.inspectHint{display:none}
  }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ============================================================
   Texturas PBR procedurales (sin archivos externos) — compartidas
   ============================================================ */
function cv(s=512){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(canvas,repeat=1,srgb=false){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);
  t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
  t.generateMipmaps=false; t.minFilter=THREE.LinearFilter; t.anisotropy=1; return t;
}
function normalFromHeight(size, hfn, strength=2.0){
  const c=cv(size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size);
  const H=(x,y)=>hfn((x+size)%size,(y+size)%size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(H(x+1,y)-H(x-1,y))*strength;
    const dy=(H(x,y+1)-H(x,y-1))*strength;
    const nz=1.0; const len=Math.hypot(dx,dy,nz);
    const i=(y*size+x)*4;
    img.data[i]  =((-dx/len)*0.5+0.5)*255;
    img.data[i+1]=((-dy/len)*0.5+0.5)*255;
    img.data[i+2]=((nz/len)*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);return c;
}
function valueNoise(seed=1){
  const g=(x,y)=>{const s=Math.sin((x*127.1+y*311.7)+seed*13.13)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function fbm(noise,x,y,oct=4){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=noise(x*f,y*f)*a;f*=2;a*=0.5;}return v;}

function castAluminum(){
  const S=512, n=valueNoise(7);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/22,y/22,5);
    const por=Math.pow(n(x/3.1,y/3.1),8);
    const base=150+v*38-por*70;
    const i=(y*S+x)*4; img.data[i]=base; img.data[i+1]=base+4; img.data[i+2]=base+10; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/18,y/18,4); const por=Math.pow(n(x/3.1,y/3.1),8);
    const rough=120+v*40+por*90; const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(255,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/16,y/16,5)+Math.pow(n(x/3.1,y/3.1),8)*0.6,3.0);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function brushedMetal(){
  const S=512, n=valueNoise(3);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=Math.sin(y*0.9)*2 + (n(x/120,y*0.5)-0.5)*40;
    const base=185+streak; const i=(y*S+x)*4;
    img.data[i]=base; img.data[i+1]=base+2; img.data[i+2]=base+6; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const r=cv(S),rx=r.getContext('2d'),rimg=rx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const streak=(n(x/120,y*0.5)-0.5)*60; const rough=40+Math.abs(streak); const i=(y*S+x)*4;
    rimg.data[i]=rimg.data[i+1]=rimg.data[i+2]=Math.min(160,rough); rimg.data[i+3]=255;
  }
  rx.putImageData(rimg,0,0);
  const nrm=normalFromHeight(S,(x,y)=>(n(x/120,y*0.5))*0.3+Math.sin(y*0.9)*0.02,1.2);
  return {map:tex(c,1,true),roughnessMap:tex(r),normalMap:tex(nrm)};
}
function rubber(){
  const S=256,n=valueNoise(5);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/8,y/8,4),1.4);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#e0e0e0';rc.fillRect(0,0,64,64);
  return {roughnessMap:tex(rough),normalMap:tex(nrm,2)};
}
function gradientBG(top='#11161d',bottom='#05070a'){
  const c=cv(512),ctx=c.getContext('2d');
  const grd=ctx.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,top);grd.addColorStop(1,bottom);
  ctx.fillStyle=grd;ctx.fillRect(0,0,512,512);
  const rg=ctx.createRadialGradient(256,200,30,256,256,360);
  rg.addColorStop(0,'rgba(42,157,143,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,512,512);
  return tex(c,1,true);
}
function techPlastic(r=0.10,g=0.11,b=0.13){
  const S=256,n=valueNoise(31);
  const c=cv(S),ctx=c.getContext('2d'),img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const v=fbm(n,x/30,y/30,3)*0.1+0.92; const i=(y*S+x)*4;
    img.data[i]=r*255*v;img.data[i+1]=g*255*v;img.data[i+2]=b*255*v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const nrm=normalFromHeight(S,(x,y)=>fbm(n,x/10,y/10,3),0.8);
  const rough=cv(64),rc=rough.getContext('2d');rc.fillStyle='#9a9a9a';rc.fillRect(0,0,64,64);
  return {map:tex(c,1,true),roughnessMap:tex(rough),normalMap:tex(nrm)};
}

/* ============================================================
   ENGINE — render premium compartido por todos los laboratorios
   ============================================================ */
function createStage(mount, opts={}){
  const bgTop = opts.bgTop||'#141b24', bgBot = opts.bgBot||'#05070a';
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(mount.clientWidth, mount.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opts.exposure ?? 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction='none';

  const scene = new THREE.Scene();
  scene.background = gradientBG(bgTop,bgBot);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = opts.envInt ?? 1.15;

  const camera = new THREE.PerspectiveCamera(45, mount.clientWidth/mount.clientHeight, 0.1, 200);
  const cam = opts.cam || [5.5,3.4,6.2];
  camera.position.set(...cam);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = opts.minD ?? 3; controls.maxDistance = opts.maxD ?? 18;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.target.set(...(opts.target||[0,1.4,0]));
  controls.autoRotate = opts.autoRotate ?? false;
  controls.autoRotateSpeed = opts.autoRotateSpeed ?? 0.6;

  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(5,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=40;
  const sd=8; Object.assign(key.shadow.camera,{left:-sd,right:sd,top:sd,bottom:-sd});
  key.shadow.bias=-0.0003; key.shadow.normalBias=0.02; scene.add(key);
  const rim = new THREE.SpotLight(0x2affce, 55, 30, Math.PI/5, 0.4, 1.5);
  rim.position.set(-7,6,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0x6fb6ff, 0.5); fill.position.set(-4,3,7); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x10151b, 0.35));

  if(opts.floor!==false){
    const f = new THREE.Mesh(new THREE.CircleGeometry(40,80),
      new THREE.MeshStandardMaterial({ color:0x0a0e13, roughness:0.14, metalness:0.62, envMapIntensity:1.15 }));
    f.rotation.x=-Math.PI/2; f.receiveShadow=true; scene.add(f);
    for(let r=2;r<=8;r+=2){
      const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.012,r+0.012,80),
        new THREE.MeshBasicMaterial({color:0x1a2632,transparent:true,opacity:0.4}));
      ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
    }
  }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth<820;
  // GTAO desactivado por defecto: el pase de oclusión ambiental en espacio de pantalla
  // producía un recuadro oscuro duro sobre el piso reflectante (artefacto dependiente de la
  // cámara y del renderer). La escena tiene AO suficiente con luces directas + sombras + env.
  // Se puede reactivar para pruebas con ?gtao.
  const useGtao = /[?&]gtao\b/.test(location.search);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  if(!isMobile && useGtao){
    try{
      const g=new GTAOPass(scene,camera,mount.clientWidth,mount.clientHeight);
      g.output=GTAOPass.OUTPUT.Default;
      if(g.updateGtaoMaterial)g.updateGtaoMaterial({radius:0.5,distanceExponent:1,thickness:1,scale:1.1,samples:16});
      composer.addPass(g);
    }catch(e){}
  }
  const bloom=new UnrealBloomPass(new THREE.Vector2(mount.clientWidth,mount.clientHeight),opts.bloom??0.42,0.5,0.9);
  composer.addPass(bloom);
  let bokeh=null;
  const flat=/[?&]flat/.test(location.search);
  if(!isMobile && !flat){
    bokeh=new BokehPass(scene,camera,{focus:8.5,aperture:opts.aperture??0.00018,maxblur:opts.maxblur??0.004,width:mount.clientWidth,height:mount.clientHeight});
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(mount.clientWidth*renderer.getPixelRatio(),mount.clientHeight*renderer.getPixelRatio()));

  function resize(){
    const w=mount.clientWidth,h=mount.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h); composer.setSize(w,h);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  let hook=null, raf=null;
  const camCine={active:false,t:0,dur:1.4,from:new THREE.Vector3(),to:new THREE.Vector3(),fromT:new THREE.Vector3(),toT:new THREE.Vector3()};
  let lastDrag=-99, cinematicIdle=false;
  controls.addEventListener('start',()=>{ lastDrag=clock.elapsedTime; camCine.active=false; });
  function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function moveTo(pos,target,dur=1.4){
    camCine.from.copy(camera.position); camCine.fromT.copy(controls.target);
    camCine.to.set(...pos); camCine.toT.set(...target);
    camCine.dur=dur; camCine.active=true; camCine.t=0;
  }
  function setCinematicIdle(v){ cinematicIdle=v; if(!v)controls.autoRotate=false; }
  function loop(){ raf=requestAnimationFrame(loop); const dt=clock.getDelta(),t=clock.elapsedTime;
    if(camCine.active){
      camCine.t=Math.min(1,camCine.t+dt/camCine.dur);
      const e=easeInOutCubic(camCine.t);
      camera.position.lerpVectors(camCine.from,camCine.to,e);
      controls.target.lerpVectors(camCine.fromT,camCine.toT,e);
      if(camCine.t>=1)camCine.active=false;
    } else if(cinematicIdle){
      controls.autoRotate=(t-lastDrag)>1.4; controls.autoRotateSpeed=0.45;
    }
    if(hook)hook(dt,t); controls.update();
    if(bokeh) bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);
    composer.render(); }
  function start(){ if(!raf)loop(); }
  function stop(){ cancelAnimationFrame(raf); raf=null; window.removeEventListener('resize',resize); }

  return { THREE, renderer, scene, camera, controls, composer, bloom,
    setAnimate:fn=>hook=fn, start, stop, resize, clock,
    flyTo:(v)=>{ controls.target.copy(v); }, moveTo, setCinematicIdle };
}

function pickerFor(scene,camera,dom,onHit){
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(); let down=null;
  dom.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
  dom.addEventListener('pointerup',e=>{
    if(!down)return; const moved=Math.abs(e.clientX-down[0])+Math.abs(e.clientY-down[1])>6; down=null;
    if(moved)return;
    const r=dom.getBoundingClientRect();
    mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(mouse,camera);
    const hits=ray.intersectObjects(scene.children,true);
    onHit(hits[0]||null);
  });
}

/* ============================================================
   SYNTH — sintetizador Web Audio reutilizable
   ============================================================ */
function makeSynth(opts={}){
  const type=opts.type||'sawtooth';
  let ctx=null,oscA=null,oscB=null,gain=null,filter=null,soundOn=true;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      oscA=ctx.createOscillator(); oscB=ctx.createOscillator();
      oscA.type=type; oscB.type=opts.type2||'square';
      filter=ctx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||500; filter.Q.value=opts.Q||3;
      gain=ctx.createGain(); gain.gain.value=0;
      oscA.connect(filter); oscB.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      oscA.start(); oscB.start();
    }catch(e){}
  }
  function update(freqA,freqB,vol,filterFreq){
    if(!ctx||!soundOn){ if(gain)gain.gain.setTargetAtTime(0,ctx?.currentTime||0,0.1); return; }
    oscA.frequency.setTargetAtTime(freqA,ctx.currentTime,0.04);
    if(freqB!==undefined)oscB.frequency.setTargetAtTime(freqB,ctx.currentTime,0.04);
    if(filterFreq!==undefined)filter.frequency.setTargetAtTime(filterFreq,ctx.currentTime,0.05);
    gain.gain.setTargetAtTime(Math.max(0,vol),ctx.currentTime,0.06);
  }
  function beep(freq=880,dur=0.09,vol=0.06){
    if(!ctx||!soundOn)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }
  function toggle(){ soundOn=!soundOn; return soundOn; }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  return { init, update, beep, toggle, resume, isOn:()=>soundOn, state:()=>ctx?.state||'none' };
}

/* ============================================================
   LAB — CIRCUITO EQUIVALENTE DEL MOTOR DE INDUCCIÓN POR ENSAYOS
   (Dominio D5 · máquinas eléctricas — motor asíncrono trifásico)
   MOLDE S+P: esquemático + motor de cálculo + instrumentos virtuales
   digitales, banco 3D modesto (motor + fuente de ensayo), sin objeto
   físico de inspección detallada ni fase de ensamble — mismo patrón
   que arranque-motor-induccion (d5-07).
   Norma ancla citada en la lista maestra (d5-08): IEEE Std 112-2004
   (Standard Test Procedure for Polyphase Induction Motors and
   Generators). Cláusulas usadas:
     · §5.4     ensayo de CD (resistencia de estátor en frío)
     · §5.7      ensayo de vacío (sin carga)
     · §5.9.1    ensayo de rotor bloqueado a frecuencia reducida (≤25% fn)
     · §5.9.2.2  reparto NEMA de reactancia de fuga X1/X2' por diseño
   Modelo de ingeniería (circuito equivalente en T, referido al estátor):
     Ensayo de CD:            R1 = R_línea-línea / 2   (estátor en Y)
     Ensayo de vacío:         Znl=Vf/Inl · Rnl_ef=(P3/3)/Inl² (núcleo+F&V+cobre)
                               Xnl=√(Znl²−Rnl_ef²) · Pscl=3·Inl²·R1 · Prot=Pnl3−Pscl
     Rotor bloqueado (f red.): Zbl=Vf/Ibl · Rbl=(P3/3)/Ibl² (NO se corrige por f)
                               Xbl(ftest)=√(Zbl²−Rbl²) · Xbl(fn)=(fn/ftest)·Xbl(ftest)
     Ensamble (Diseño NEMA B): X1=0.4·Xbl(fn) · X2'=0.6·Xbl(fn)
                               Xm=Xnl−X1 · R2'=Rbl−R1
   IMPORTANTE — topología: en el circuito en T, la rama de magnetización
   jXm cuelga DESPUÉS de la rama serie del estátor (R1+jX1), en paralelo
   con la rama del rotor (R2'/s + jX2'). Esto es distinto de la
   aproximación de transformador de d5-02 (Rc/Xm en la fuente, ANTES de
   la rama serie) — aquí no se aproxima así porque Xm es comparable en
   magnitud a X1, no despreciable frente a ella.
   Curva par-deslizamiento (Thévenin visto desde el entrehierro):
     Zth = jXm·(R1+jX1) / (R1+j(X1+Xm))     Vth = V1·jXm / (R1+j(X1+Xm))
     T(s) = 3·|Vth|²·(R2'/s) / (ws·[(Rth+R2'/s)²+(Xth+X2')²])
     s_Tmax = R2' / √(Rth²+(Xth+X2')²)       ws = ns(rad/s), ns=120·f/p
   Fuera de alcance (documentado en ficha.md, NO modelado aquí):
     corrección por temperatura (§5.2.1 IEEE 112), dependencia de R2'
     con la frecuencia de deslizamiento (efecto piel en barras del
     rotor — tema avanzado de doble jaula), saturación de Xm con la
     tensión aplicada.
   CERO Math.random() en la física del lab: los cuatro ensayos son
   datos fijos de un motor ilustrativo del simulador (NO un datasheet
   real — bandera ⚑, ver ficha.md); toda la física se deriva de ellos
   de forma determinista.
   ============================================================ */

function cmul(a,b){ return [a[0]*b[0]-a[1]*b[1], a[0]*b[1]+a[1]*b[0]]; }
function cdiv(a,b){ const d=b[0]*b[0]+b[1]*b[1]; return [(a[0]*b[0]+a[1]*b[1])/d, (a[1]*b[0]-a[0]*b[1])/d]; }
function cabs(a){ return Math.hypot(a[0],a[1]); }
function dcStats(){
  const {Rll}=MEAS.dc;
  const R1=Rll/2;
  return {Rll,R1};
}
function vacioStats(){
  const {Vline,I,P3}=MEAS.vacio;
  const Vf=Vline/Math.sqrt(3);
  const Znl=Vf/I;
  const Rnl=(P3/3)/(I*I);
  const Xnl=Math.sqrt(Znl*Znl-Rnl*Rnl);
  const {R1}=dcStats();
  const Pscl=3*I*I*R1;
  const Prot=P3-Pscl;
  return {Vline,Vf,I,P3,Znl,Rnl,Xnl,Pscl,Prot};
}
function rotorBloqueadoStats(){
  const {fTest,fRated,Vline,I,P3}=MEAS.bloqueado;
  const Vf=Vline/Math.sqrt(3);
  const Zbl=Vf/I;
  const Rbl=(P3/3)/(I*I);
  const XblTest=Math.sqrt(Zbl*Zbl-Rbl*Rbl);
  const XblRated=(fRated/fTest)*XblTest;
  return {fTest,fRated,Vline,Vf,I,P3,Zbl,Rbl,XblTest,XblRated};
}
function torqueAt(s,cs){
  if(s<=0) return 0;
  const denomR=cs.Zth[0]+cs.R2/s, denomX=cs.Zth[1]+cs.X2;
  const Zt2=denomR*denomR+denomX*denomX;
  const I2=cs.Vth/Math.sqrt(Zt2);
  const Pag=3*I2*I2*(cs.R2/s);
  return Pag/cs.ws;
}
function circuitoStats(){
  const {R1}=dcStats();
  const {Xnl}=vacioStats();
  const {Rbl,XblRated}=rotorBloqueadoStats();
  const X1=0.4*XblRated, X2=0.6*XblRated;
  const Xm=Xnl-X1, R2=Rbl-R1;
  const V1=MEAS.vacio.Vline/Math.sqrt(3);
  const jXm=[0,Xm], Z1=[R1,X1];
  const Zth=cdiv(cmul(jXm,Z1),[R1,X1+Xm]);
  const Vth=cabs(cdiv(cmul([V1,0],jXm),[R1,X1+Xm]));
  const {poles,freqRated}=MEAS.motor;
  const nsRpm=120*freqRated/poles;
  const ws=nsRpm*2*Math.PI/60;
  const cs={R1,Xnl,Rbl,XblRated,X1,X2,Xm,R2,Zth,Vth,nsRpm,ws};
  cs.Tstart=torqueAt(1,cs);
  cs.sMaxT=R2/Math.sqrt(Zth[0]*Zth[0]+(Zth[1]+X2)*(Zth[1]+X2));
  cs.Tmax=torqueAt(cs.sMaxT,cs);
  return cs;
}
function torqueCurvePoints(cs,n=140){
  const pts=[];

  return pts;
}

/* ---------- rotateArr (mezcla determinista, sin Math.random) ---------- */
function rotateArr(arr,seed){
  let h=0; for(let i=0;i<seed.length;i++) h=(h*31+seed.charCodeAt(i))>>>0;
  const r=h%arr.length; return arr.slice(r).concat(arr.slice(0,r));
}

function hResistorGlyph(ctx,x,y,w,col){ ctx.strokeStyle=col; ctx.lineWidth=3; ctx.strokeRect(x,y-14,w,28); }
function vResistorGlyph(ctx,x,y,h,col){ ctx.strokeStyle=col; ctx.lineWidth=3; ctx.strokeRect(x-14,y,28,h); }
function hCoilGlyph(ctx,x,y,w,col){ ctx.strokeStyle=col; ctx.lineWidth=3; const n=5, seg=w/n;
  ctx.beginPath(); ctx.moveTo(x,y);
  for(let i=0;i<n;i++){ const cx=x+seg*(i+0.5); ctx.arc(cx,y,seg/2,Math.PI,0,false); }
  ctx.stroke(); }
function vCoilGlyph(ctx,x,y,h,col){ ctx.strokeStyle=col; ctx.lineWidth=3; const n=5, seg=h/n;
  ctx.beginPath(); ctx.moveTo(x,y);
  for(let i=0;i<n;i++){ const cy=y+seg*(i+0.5); ctx.arc(x,cy,seg/2,-Math.PI/2,Math.PI/2,false); }
  ctx.stroke(); }
function circleMeter(ctx,x,y,r,letter,col){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.strokeStyle=col; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle=col; ctx.font=`bold ${Math.round(r*1.1)}px 'Segoe UI',sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(letter,x,y+1); ctx.textBaseline='alphabetic'; }
function acSourceGlyph(ctx,x,y,r,col){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.strokeStyle=col; ctx.lineWidth=3; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-r*0.55,y); ctx.bezierCurveTo(x-r*0.25,y-r*0.7,x+r*0.25,y+r*0.7,x+r*0.55,y); ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.stroke(); }
function dcSourceGlyph(ctx,x,y,r,col){ ctx.strokeStyle=col; ctx.lineWidth=3;
  line(ctx,x-r*0.7,y-r*0.5,x-r*0.7,y+r*0.5,4,col); line(ctx,x-r*0.28,y-r*0.25,x-r*0.28,y+r*0.25,2,col);
  line(ctx,x+r*0.28,y-r*0.5,x+r*0.28,y+r*0.5,4,col); line(ctx,x+r*0.7,y-r*0.25,x+r*0.7,y+r*0.25,2,col);
  labelAt(ctx,x,y-r*0.9,'CD','#8A94A0',14,'center'); }
function padlockGlyph(ctx,x,y,s,col){ ctx.strokeStyle=col; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(x,y-s*0.35,s*0.32,Math.PI,0,false); ctx.stroke();
  ctx.fillStyle=col; ctx.fillRect(x-s*0.4,y-s*0.1,s*0.8,s*0.55); }
function scheHeader(ctx,title){ ctx.clearRect(0,0,1024,768); ctx.fillStyle='#0b1116'; ctx.fillRect(0,0,1024,768);
  ctx.strokeStyle='#26313a'; ctx.lineWidth=2; ctx.strokeRect(6,6,1012,756);
  labelAt(ctx,40,50,title,'#8fd1ff',26); }

    line(ctx,476,300,560,300,3,'#dfe7ee');
    line(ctx,560,240,560,360,2,'#3d7fd6'); circleMeter(ctx,560,240,20,'V','#3d7fd6'); addHit('vm',534,214,52,52,'Voltímetro (tensión de línea)');
    line(ctx,560,300,660,300,3,'#dfe7ee');
    vCoilGlyph(ctx,660,240,120,'#d64545'); addHit('w',630,236,60,128,'Devanado del estátor (esquema unifilar, motor trifásico)');
    line(ctx,660,360,150,360,3,'#dfe7ee'); line(ctx,150,360,150,344,3,'#dfe7ee');

}

/* ---------- circuito equivalente en T + curva par-deslizamiento ---------- */
function drawEquivCircuit(ctx){
  HIT=[]; scheHeader(ctx,'Circuito equivalente en T (Diseño NEMA B)');
  const y=180, x0=90, x1=260, xNode=430, x2=620, xEnd=880;
  line(ctx,x0,y,x0,y-40,3,'#8fd1ff'); acSourceGlyph(ctx,x0,y-40,26,'#8fd1ff'); addHit('src',x0-26,y-92,52,52,'Fuente — tensión de fase nominal V1');
  line(ctx,x0,y,x1,y,3,'#dfe7ee');
  hResistorGlyph(ctx,x1,y,90,'#d64545'); addHit('r1',x1,y-14,90,28,`R1 (estátor) = ${CIR.R1.toFixed(3)} Ω`);
  labelAt(ctx,x1+45,y-24,'R1','#d64545',15,'center');
  line(ctx,x1+90,y,x1+150,y,3,'#dfe7ee');
  hCoilGlyph(ctx,x1+150,y,90,'#e0b23c'); addHit('x1',x1+150,y-14,90,28,`X1 (fuga estátor) = ${CIR.X1.toFixed(3)} Ω`);
  labelAt(ctx,x1+195,y-24,'X1','#e0b23c',15,'center');
  line(ctx,x1+240,y,xNode,y,3,'#dfe7ee');
  ctx.beginPath(); ctx.arc(xNode,y,5,0,Math.PI*2); ctx.fillStyle='#dfe7ee'; ctx.fill();
  line(ctx,xNode,y,xNode,y+120,3,'#3d7fd6');
  vCoilGlyph(ctx,xNode-14,y+120,90,'#3d7fd6'); addHit('xm',xNode-28,y+120,56,90,`Xm (magnetización) = ${CIR.Xm.toFixed(3)} Ω`);
  labelAt(ctx,xNode+34,y+165,'Xm','#3d7fd6',15,'left');
  line(ctx,xNode,y+210,xNode,y+236,3,'#3d7fd6'); line(ctx,xNode-30,y+236,xNode+30,y+236,3,'#3d7fd6');
  line(ctx,xNode,y,x2,y,3,'#dfe7ee');
  hResistorGlyph(ctx,x2,y,90,'#43D9AD'); addHit('r2s',x2,y-14,90,28,`R2'/s (rotor referido / deslizamiento) — a s=1: ${CIR.R2.toFixed(3)} Ω`);
  labelAt(ctx,x2+45,y-24,"R2'/s",'#43D9AD',15,'center');
  line(ctx,x2+90,y,x2+150,y,3,'#dfe7ee');
  hCoilGlyph(ctx,x2+150,y,90,'#f4c95d'); addHit('x2',x2+150,y-14,90,28,`X2' (fuga rotor referida) = ${CIR.X2.toFixed(3)} Ω`);
  labelAt(ctx,x2+195,y-24,"X2'",'#f4c95d',15,'center');
  line(ctx,x2+240,y,xEnd,y,3,'#dfe7ee');
  line(ctx,xEnd,y,xEnd,y+236,3,'#dfe7ee'); line(ctx,xEnd,y+236,xNode,y+236,0,'transparent');
  line(ctx,x0,y+236,xEnd,y+236,3,'#dfe7ee'); line(ctx,x0,y,x0,y+236,0,'transparent');
  labelAt(ctx,970,y+90,'entrehierro','#8A94A0',14,'right');

  /* curva par-deslizamiento */
  const ox=110, oyBase=730, w=850, h=210, NMAX=CIR.nsRpm+50, TGMAX=Math.ceil(CIR.Tmax/5)*5+5;
  labelAt(ctx,40,oyBase-h-26,'Curva par-deslizamiento T(s) — Thévenin visto desde el entrehierro','#8fd1ff',20);
  line(ctx,ox,oyBase,ox+w,oyBase,2,'#5b6672'); line(ctx,ox,oyBase,ox,oyBase-h,2,'#5b6672');
  labelAt(ctx,ox+w,oyBase+20,'n (rpm) →','#dfe7ee',14,'right');
  labelAt(ctx,ox,oyBase-h-8,'T (N·m)','#dfe7ee',14,'left');
  const px=n=>ox+Math.min(1,n/NMAX)*w, py=T=>oyBase-Math.min(1,T/TGMAX)*h;
  const pts=torqueCurvePoints(CIR);
  ctx.beginPath(); pts.forEach((p,i)=>{ const X=px(p.n),Y=py(p.T); if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y); });
  ctx.strokeStyle='#43D9AD'; ctx.lineWidth=3; ctx.stroke();
  const nStart=0, TStart=CIR.Tstart, xS=px(nStart), yS=py(TStart);
  ctx.beginPath(); ctx.arc(xS,yS,6,0,Math.PI*2); ctx.fillStyle='#f4c95d'; ctx.fill(); addHit('tstart',xS-14,yS-14,28,28,`Par de arranque Tarr = ${CIR.Tstart.toFixed(2)} N·m (s=1)`);
  labelAt(ctx,xS+12,yS-12,`Tarr=${CIR.Tstart.toFixed(2)}`,'#f4c95d',14);
  const nMax=CIR.nsRpm*(1-CIR.sMaxT), xM=px(nMax), yM=py(CIR.Tmax);
  ctx.beginPath(); ctx.arc(xM,yM,6,0,Math.PI*2); ctx.fillStyle='#ff9f5b'; ctx.fill(); addHit('tmax',xM-14,yM-14,28,28,`Par máximo (de vuelco) Tmáx = ${CIR.Tmax.toFixed(2)} N·m en s=${CIR.sMaxT.toFixed(3)}`);
  labelAt(ctx,xM+12,yM-12,`Tmáx=${CIR.Tmax.toFixed(2)}`,'#ff9f5b',14);
  line(ctx,px(CIR.nsRpm),oyBase,px(CIR.nsRpm),oyBase-h,1,'#3d7fd6'); labelAt(ctx,px(CIR.nsRpm),oyBase-h-8,`ns=${CIR.nsRpm.toFixed(0)}`,'#3d7fd6',13,'center');
}

  <h2>Circuito equivalente del motor de inducción por ensayos</h2>
  <p>Realiza los tres ensayos IEEE 112 (CD, vacío, rotor bloqueado a frecuencia reducida) sobre el mismo motor y ensambla el circuito equivalente en T para obtener la curva par-deslizamiento.</p>
  <div class="formula">R1=Rll/2 · Znl=Vf/Inl · Xnl=√(Znl²−Rnl_ef²) · Prot=Pnl3−3·Inl²·R1<br>Xbl(fn)=(fn/ftest)·Xbl(ftest) · X1=0.4·Xbl · X2'=0.6·Xbl (NEMA B) · Xm=Xnl−X1 · R2'=Rbl−R1</div>
  <div class="legend">
    <div class="li"><span class="dot" style="background:#d64545"></span>R1 — resistencia de estátor</div>
    <div class="li"><span class="dot" style="background:#e0b23c"></span>X1 — fuga de estátor</div>
    <div class="li"><span class="dot" style="background:#3d7fd6"></span>Xm — magnetización</div>
    <div class="li"><span class="dot" style="background:#43D9AD"></span>R2'/s — rama de rotor</div>
  </div>
  <div class="fid">
    <div class="ft">Contrato de fidelidad</div>
    <div class="fl">SÍ modela: <b>los tres ensayos IEEE 112 (§5.4 CD, §5.7 vacío, §5.9.1 rotor bloqueado a frecuencia reducida), la corrección de Xbl por frecuencia, el reparto NEMA Diseño B (§5.9.2.2, X1=0.4·Xbl, X2'=0.6·Xbl), y la curva par-deslizamiento exacta vía el equivalente de Thévenin del circuito en T (sin las simplificaciones de rotor-bloqueado-igual-a-Tmáx).</b></div>
    <div class="fl no">NO modela: <b>corrección por temperatura de los devanados (§5.2.1 IEEE 112), dependencia de R2' con la frecuencia de deslizamiento (efecto piel en barras del rotor — doble jaula), saturación de Xm con la tensión aplicada, ni transitorios de arranque.</b></div>
    <div class="fl no">Motor <b>ilustrativo</b> del simulador (no un datasheet real): los cuatro ensayos son datos fijos elegidos para dar un Diseño NEMA B razonable. ⚑ Ver ficha.md para el detalle de cada cifra.</div>
  </div>
  <div class="src">Norma ancla: IEEE Std 112-2004, Standard Test Procedure for Polyphase Induction Motors and Generators (§5.4, §5.7, §5.9.1, §5.9.2.2). Programa curricular: UAX Máquinas.</div>
  <div class="modebar">
    <button class="b on" id="c_ensayoDC">① CD</button>
    <button class="b" id="c_ensayoVacio">② Vacío</button>
    <button class="b" id="c_rotorBloqueado">③ Rotor bloqueado</button>
    <button class="b" id="c_circuitoEquivalente">④ Circuito equiv.</button>
  </div>`;

/* ---------- PANEL ---------- */
el('panel').innerHTML=`
  <div class="g"><div class="gl"><span>Ensayo actual</span><b id="p_case">Ensayo de CD</b></div></div>
  <div class="console" id="p_mision"></div>
  <div id="tele">
    <div class="g"><div class="l" id="l1">—</div><b id="t_1">—</b></div>
    <div class="g"><div class="l" id="l2">—</div><b id="t_2">—</b></div>
    <div class="g"><div class="l" id="l3">—</div><b id="t_3">—</b></div>
    <div class="g"><div class="l" id="l4">—</div><b id="t_4">—</b></div>
    <div class="g"><div class="l" id="l5">—</div><b id="t_5">—</b></div>
    <div class="g"><div class="l" id="l6">—</div><b id="t_6">—</b></div>
  </div>
  <div class="console" id="report"></div>
  <h4 class="sec">Pregunta de ingeniería</h4>
  <div id="q_text"></div>
  <div class="btns" id="dxbtns"></div>
  <div class="btns">
    <button class="b" id="btnPower">⚡ Energizar</button>
    <button class="b auto" id="btnAuto">✨ Demo guiada</button>
    <button class="b" id="btnNew">→ Siguiente ensayo</button>
  </div>`;

/* ---------- telemetría / reporte ---------- */
const TELE_LABELS={
  ensayoDC:['R línea-línea','R1 (por fase)','—','—','—','Estado'],
  ensayoVacio:['V (fase)','I (línea)','P₃φ','Znl','Xnl','Prot'],
  rotorBloqueado:['V (fase)','I (línea)','P₃φ','Zbl','Rbl','Xbl (fn)'],
  circuitoEquivalente:['X1 (estátor)',"X2' (rotor)",'Xm','R2\' (rotor)','Tarranque','Tmáx'],
};
function caseParams(key){
  if(key==='ensayoDC') return [fmtOhm(DC.Rll),fmtOhm(DC.R1),'—','—','—',active?'Energizado':'Desenergizado'];
  if(key==='ensayoVacio') return [fmtV(VAC.Vf),fmtA(VAC.I),fmtW(VAC.P3),fmtOhm(VAC.Znl),fmtOhm(VAC.Xnl),fmtW(VAC.Prot)];
  if(key==='rotorBloqueado') return [fmtV(RB.Vf),fmtA(RB.I),fmtW(RB.P3),fmtOhm(RB.Zbl),fmtOhm(RB.Rbl),fmtOhm(RB.XblRated)];
  return [fmtOhm(CIR.X1),fmtOhm(CIR.X2),fmtOhm(CIR.Xm),fmtOhm(CIR.R2),fmtNm(CIR.Tstart),fmtNm(CIR.Tmax)];
}
function updateTele(){
  const labels=TELE_LABELS[caseKey], vals=caseParams(caseKey);
  for(let i=0;i<6;i++){ el('l'+(i+1)).textContent=labels[i]; const v=el('t_'+(i+1)); v.textContent=vals[i]; v.className=(!active && caseKey!=='circuitoEquivalente')?'dim':''; }
}
function updateReport(){
  let html='';
  if(caseKey==='ensayoDC'){
    html=`R1 = Rll/2 = ${DC.Rll}/2 = <b>${DC.R1.toFixed(3)} Ω</b> (estátor conectado en estrella; entre dos terminales de línea hay dos fases en serie).`;
  } else if(caseKey==='ensayoVacio'){
    html=`Vf=${VAC.Vf.toFixed(2)}V, Znl=Vf/I=${VAC.Znl.toFixed(3)}Ω · Rnl_ef=(P₃φ/3)/I²=${VAC.Rnl.toFixed(3)}Ω · Xnl=√(Znl²−Rnl_ef²)=<b>${VAC.Xnl.toFixed(3)}Ω</b><br>Pscl=3·I²·R1=${VAC.Pscl.toFixed(2)}W · Prot=P₃φ−Pscl=<b>${VAC.Prot.toFixed(2)}W</b>`;
  } else if(caseKey==='rotorBloqueado'){
    html=`Vf=${RB.Vf.toFixed(2)}V, Zbl=Vf/I=${RB.Zbl.toFixed(3)}Ω · Rbl=(P₃φ/3)/I²=<b>${RB.Rbl.toFixed(3)}Ω</b> (no se corrige por f)<br>Xbl(${RB.fTest}Hz)=√(Zbl²−Rbl²)=${RB.XblTest.toFixed(3)}Ω · Xbl(${RB.fRated}Hz)=(fn/ftest)·Xbl(ftest)=<b>${RB.XblRated.toFixed(3)}Ω</b>`;
  } else {
    html=`X1=0.4·Xbl=<b>${CIR.X1.toFixed(3)}Ω</b> · X2'=0.6·Xbl=<b>${CIR.X2.toFixed(3)}Ω</b> · Xm=Xnl−X1=<b>${CIR.Xm.toFixed(3)}Ω</b> · R2'=Rbl−R1=<b>${CIR.R2.toFixed(3)}Ω</b><br>Zth=${CIR.Zth[0].toFixed(3)}+j${CIR.Zth[1].toFixed(3)}Ω, |Vth|=${CIR.Vth.toFixed(2)}V · Tarr=<b>${CIR.Tstart.toFixed(2)}N·m</b> · Tmáx=<b>${CIR.Tmax.toFixed(2)}N·m</b> en s=${CIR.sMaxT.toFixed(3)}`;
  }
  el('report').innerHTML=html;
}
function refreshBench(){ drawReadings(); drawParams();
  if(needle) needle.rotation.z=(active?(vVal/(caseTargets(caseKey).v||1)):0)*1.6-0.1;
}
function refreshAll(){ updateTele(); updateReport(); drawBoard(); refreshBench(); }

/* ---------- quiz UI ---------- */
let currentQ=null;
function clearDx(){ el('dxbtns').innerHTML=''; solved=false; }
function refreshQuestion(){
  currentQ=currentQuiz();
  el('q_text').innerHTML=currentQ.pregunta;
  clearDx();
  currentQ.opciones.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='b'; b.textContent=o.t;
    b.onclick=()=>answer(i,currentQ); el('dxbtns').appendChild(b);
  });
}
function answer(i,q){
  const btns=[...el('dxbtns').children]; btns.forEach(b=>b.disabled=true);
  const o=q.opciones[i];
  btns[i].classList.add(o.ok?'ok':'bad');
  if(!o.ok){ const okIdx=q.opciones.findIndex(x=>x.ok); btns[okIdx].classList.add('ok'); }
  solved=o.ok;
  synth.beep(o.ok?1046:220,o.ok?0.14:0.16,0.06);
  showToast(`<b style="color:${o.ok?'var(--good)':'var(--bad)'}">${o.ok?'✔ Correcto.':'✗ No es correcto.'}</b><br><span style="color:var(--dim);font-size:11px">${o.why}</span>`,4600);
}

/* ---------- máquina de casos ---------- */
function setCase(key){
  caseKey=key; active=false; solved=false;
  const tg=caseTargets(key); vTarget=tg.v; iTarget=tg.i; pTarget=tg.p;
  CASE_ORDER.forEach(k=>{ const b=el('c_'+k); if(b) b.classList.toggle('on',k===key); });
  el('p_case').textContent=CASES[key].nombre;
  el('p_mision').textContent=CASES[key].mision;
  el('btnPower').textContent='⚡ Energizar'; el('btnPower').classList.remove('on');
  lockClamp.visible=(key==='rotorBloqueado');
  const meta=CASE_CAM[key]; S.moveTo(meta[0],meta[1],1.3);
  clearDx(); refreshQuestion();
  refreshAll();
  showToast(`<b>${CASES[key].nombre}</b>`);
}

/* ---------- picker / interacción ---------- */
function tagged(obj){ let o=obj; while(o){ if(o.userData&&o.userData.act) return o; o=o.parent; } return null; }
pickerFor(scene,S.camera,mount,(hit)=>{
  if(!hit) return;
  if(hit.object===boardPlane){ boardClick(hit.uv.x,hit.uv.y); return; }
  const t=tagged(hit.object);
  if(!t) return;
  if(t.userData.act==='motor') showToast(`<b>Motor de inducción</b><br><span style="color:var(--dim);font-size:11px">${caseKey==='rotorBloqueado'?'Rotor trabado mecánicamente para este ensayo.':'Bajo prueba en el ensayo actual.'}</span>`);
  else if(t.userData.act==='fuente') showToast('<b>Fuente / banco de ensayo</b><br><span style="color:var(--dim);font-size:11px">Suministra CD (ensayo de CD) o CA trifásica a tensión/frecuencia según el ensayo.</span>');
  else if(t.userData.act==='readings') showToast('<b>Lecturas de instrumentos</b><br><span style="color:var(--dim);font-size:11px">V/I/P medidos en el ensayo activo.</span>');
  else if(t.userData.act==='params') showToast('<b>Parámetros calculados</b><br><span style="color:var(--dim);font-size:11px">Resultado del ensayo, derivado de las lecturas.</span>');
});

/* ---------- wiring de UI ---------- */
CASE_ORDER.forEach(k=>{ const b=el('c_'+k); if(b) b.onclick=()=>setCase(k); });
el('btnNew').onclick=()=>{ const i=CASE_ORDER.indexOf(caseKey); setCase(CASE_ORDER[(i+1)%CASE_ORDER.length]); };
el('btnPower').onclick=()=>{
  if(caseKey==='circuitoEquivalente'){ showToast('Este caso no requiere energizar: ya combina los tres ensayos.'); return; }
  active=!active; el('btnPower').classList.toggle('on',active); el('btnPower').textContent=active?'⏻ Desenergizar':'⚡ Energizar';
  const tg=caseTargets(caseKey); vTarget=active?tg.v:0; iTarget=active?tg.i:0; pTarget=active?tg.p:0;
  S.setCinematicIdle(active); refreshAll();
};
const sleep=ms=>new Promise(res=>setTimeout(res,ms));
let autoRunning=false;
async function runAuto(){
  if(autoRunning) return; autoRunning=true; const btn=el('btnAuto'); if(btn) btn.disabled=true;
  if(!active && caseKey!=='circuitoEquivalente'){ el('btnPower').click(); await sleep(1200); }
  if(caseKey==='ensayoDC') showToast('Con el motor desenergizado, mide Rll con el óhmetro y calcula R1.',2600);
  else if(caseKey==='rotorBloqueado') showToast('Rotor trabado: aplica tensión reducida a frecuencia reducida y lee V/I/P.',2600);
  else if(caseKey==='ensayoVacio') showToast('Motor girando libre: lee V/I/P sin carga en el eje.',2600);
  else showToast('Observa el circuito en T ensamblado y la curva par-deslizamiento resultante.',2600);
  await sleep(1600);
  refreshQuestion();
  const okIdx=currentQ.opciones.findIndex(o=>o.ok);
  await sleep(900);
  const btns=[...el('dxbtns').children]; if(btns[okIdx]) btns[okIdx].click();
  if(btn) btn.disabled=false; autoRunning=false;
}
el('btnAuto').onclick=()=>runAuto();
const soundBtn=document.getElementById('soundBtn');
soundBtn.onclick=()=>{ const on=synth.toggle(); soundBtn.textContent=on?'🔊':'🔇'; soundBtn.classList.toggle('on',on); };

/* ---------- animación ---------- */
S.setAnimate((dt,t)=>{
  simT=t;
  const rate=Math.min(1,dt*4);
  vVal+=(vTarget-vVal)*rate; iVal+=(iTarget-iVal)*rate; pVal+=(pTarget-pVal)*rate;
  if(active && caseKey==='ensayoVacio' && pulleyG){ pulleyG.rotation.x+=dt*10; shaft.rotation.x+=dt*10; }
  if((!active || caseKey==='rotorBloqueado' || caseKey==='ensayoDC') && pulleyG){ /* sin giro */ }
  if(t-((S.__lastDraw)||0)>0.09){ S.__lastDraw=t; drawBoard(); refreshBench(); }
});
S.start();

setCase('ensayoDC');

window.__labDebug={
  caseKey:()=>caseKey,
  setCase,
  active:()=>active,
  dcStats,
  vacioStats,
  rotorBloqueadoStats,
  circuitoStats,
  torqueAt:(s)=>torqueAt(s,CIR),
  torqueCurvePoints:()=>torqueCurvePoints(CIR),
  currentQuiz:()=>currentQ,
  answer,
  boardClick,
};
</script>
